<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 06: Security Monitoring & IR - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Security Monitoring & IR',
            description: 'CSE Module 06 - Security monitoring and incident response',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module06',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What are the three main types of cloud logs that should be collected for security monitoring?',
                    options: [
                        'Activity, Events, Metrics',
                        'Debug, Info, Error',
                        'System, Application, Security',
                        'Access, Audit, Performance'
                    ],explanation: 'The three main log types are: Activity (who did what), Events (what happened to resources), and Metrics (how resources are performing). Together they provide complete visibility.'
                },
                {
                    question: 'AWS CloudTrail captures which types of events?',
                    options: [
                        'Only successful API calls',
                        'Management events and Data events',
                        'Only failed login attempts',
                        'Network traffic flows only'
                    ],explanation: 'CloudTrail captures both Management Events (control plane actions like creating/deleting services) and Data Events (data plane actions like reading/writing S3 objects).'
                },
                {
                    question: 'What is the primary purpose of AWS CloudWatch compared to CloudTrail?',
                    options: [
                        'API call auditing vs performance monitoring',
                        'Performance monitoring vs API auditing',
                        'Both serve identical purposes',
                        'CloudWatch is for storage, CloudTrail for compute'
                    ],explanation: 'CloudWatch focuses on performance metrics, logs, and alarms for operational monitoring. CloudTrail focuses on auditing API calls for security investigation and compliance.'
                },
                {
                    question: 'Azure Monitor collects data from which sources?',
                    options: [
                        'Azure resources only',
                        'Cloud and hybrid environments via Azure Arc',
                        'On-premises only',
                        'Third-party clouds only'
                    ],explanation: 'Azure Monitor collects from Azure resources natively and can extend to hybrid and multi-cloud environments using Azure Arc for centralized management.'
                },
                {
                    question: 'Log Analytics in Azure uses which query language?',
                    options: [
                        'SQL',
                        'KQL (Kusto Query Language)',
                        'Python',
                        'PowerShell'
                    ],explanation: 'Azure Log Analytics uses KQL (Kusto Query Language), a powerful query language designed for analyzing large datasets in Azure Monitor Logs.'
                },
                {
                    question: 'Azure Arc provides what primary benefit?',
                    options: [
                        'Faster VM performance',
                        'Centralized management of multi-cloud and on-premises resources',
                        'Free storage for backups',
                        'Automatic code deployment'
                    ],explanation: 'Azure Arc enables centralized management and governance of resources across Azure, other clouds (AWS, GCP), and on-premises through Azure Resource Manager.'
                },
                {
                    question: 'What does SIEM stand for?',
                    options: [
                        'Security Information and Event Management',
                        'System Integration and Enterprise Monitoring',
                        'Secure Internet and Email Management',
                        'Service Integration and Event Messaging'
                    ],explanation: 'SIEM stands for Security Information and Event Management. It combines SIM (long-term storage) and SEM (real-time monitoring and correlation).'
                },
                {
                    question: 'What is the primary purpose of SOAR?',
                    options: [
                        'Store security logs long-term',
                        'Automate incident response using playbooks',
                        'Encrypt data at rest',
                        'Manage user identities'
                    ],explanation: 'SOAR (Security Orchestration, Automation and Response) automates incident response through playbooks, enabling faster remediation of common threats with minimal human interaction.'
                },
                {
                    question: 'Microsoft Sentinel is an example of which type of solution?',
                    options: [
                        'Firewall',
                        'Cloud SIEM with built-in SOAR',
                        'Container runtime',
                        'Load balancer'
                    ],explanation: 'Microsoft Sentinel is a cloud-native SIEM with built-in SOAR capabilities, providing threat detection, investigation, and automated response in a single platform.'
                },
                {
                    question: 'What does CSPM stand for?',
                    options: [
                        'Cloud Service Provider Management',
                        'Cloud Security Posture Management',
                        'Centralized Security Policy Manager',
                        'Customer Security Protection Module'
                    ],explanation: 'CSPM stands for Cloud Security Posture Management - automated tools that identify security risks, misconfigurations, and compliance violations in cloud infrastructure.'
                },
                {
                    question: 'CSPM tools can scan which types of cloud resources?',
                    options: [
                        'Only virtual machines',
                        'IaaS, PaaS, SaaS, containers, and serverless',
                        'Only storage services',
                        'Only network resources'
                    ],explanation: 'CSPM tools scan across all cloud service models (IaaS, PaaS, SaaS) as well as containers and serverless code, providing comprehensive security posture visibility.'
                },
                {
                    question: 'AWS Security Hub provides which key feature?',
                    options: [
                        'Virtual machine hosting',
                        'Security score and best practice checks',
                        'Database management',
                        'Code deployment'
                    ],explanation: 'AWS Security Hub provides automated security best practice checks, aggregates findings, and provides a 0-100 security score across multiple compliance standards.'
                },
                {
                    question: 'CNAPP combines which three capabilities?',
                    options: [
                        'CSPM + CWPP + CIEM',
                        'WAF + IDS + IPS',
                        'SIEM + SOAR + EDR',
                        'VPC + VPN + NAT'
                    ],explanation: 'CNAPP (Cloud-Native Application Protection Platform) combines CSPM (posture), CWPP (workload protection), and CIEM (entitlement management) into a unified platform.'
                },
                {
                    question: 'What does "shift-left" mean in the context of CNAPP?',
                    options: [
                        'Moving data to the left side of the data center',
                        'Identifying security risks earlier in the development lifecycle',
                        'Shifting responsibility to the left team',
                        'Left-aligning security reports'
                    ],explanation: 'Shift-left means integrating security earlier in the development lifecycle (to the "left" of a timeline diagram), detecting risks before deployment rather than after.'
                },
                {
                    question: 'In the incident timeline, what distinguishes an "incident" from an "event"?',
                    options: [
                        'Events are more serious than incidents',
                        'An incident is a verified malicious activity, an event is an anomaly needing evaluation',
                        'They are the same thing',
                        'Events only occur in production'
                    ],explanation: 'An event is an anomaly that needs evaluation (may be false positive). An incident is when malicious activity is verified, triggering investigation and response.'
                },
                {
                    question: 'What factors determine incident priority in the priority matrix?',
                    options: [
                        'File size and age',
                        'Impact and Urgency',
                        'Location and time zone',
                        'Cost and vendor'
                    ],explanation: 'Incident priority is determined by Impact (business effect) and Urgency (time sensitivity). High-High incidents receive immediate attention.'
                },
                {
                    question: 'An incident response plan should include which component?',
                    options: [
                        'Marketing strategies',
                        'Communication plan including legal and media coordination',
                        'Product pricing',
                        'Office layout'
                    ],explanation: 'IR plans must include communication plans for internal stakeholders, media (if breach is public), and legal/regulatory notification requirements.'
                },
                {
                    question: '[M03 Review] If SIEM detects data exfiltration, which M03 control would limit the damage?',
                    options: [
                        'Load balancing',
                        'Encryption at rest',
                        'Rate limiting',
                        'Auto-scaling'
                    ],explanation: 'If data is encrypted at rest (M03), exfiltrated data is protected even if stolen. The attacker gets encrypted data without the keys to decrypt it.'
                },
                {
                    question: '[M04 Review] SIEM alerts on suspicious network traffic. Which M04 control could contain the threat?',
                    options: [
                        'Enable encryption',
                        'Block egress via NACL or Security Group',
                        'Add more instances',
                        'Increase storage'
                    ],explanation: 'NACLs and Security Groups (M04) can be used to immediately block malicious egress traffic, containing the threat at the network layer.'
                },
                {
                    question: '[M05 Review] A CNAPP detects a vulnerable container image. Which M05 practice should have prevented this?',
                    options: [
                        'Load balancing',
                        'Container image scanning in CI/CD pipeline',
                        'Database encryption',
                        'Network segmentation'
                    ],explanation: 'Container image scanning during the CI/CD pipeline (M05) should catch vulnerable images before deployment, implementing shift-left security.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
