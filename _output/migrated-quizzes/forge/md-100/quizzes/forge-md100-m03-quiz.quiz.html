    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);

            color: #fb923c;

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-100 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 03 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 03',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m03',
            moduleId: 'md100-m03',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,
            nextModule: {
                title: 'Module 04: Configuring Networking',
                href: 'md-100/presentations/forge-md100-m04-networking.presentation.html'
            },
            returnLabel: 'Back to MD-100 Course',

            questions: [
                {
                    question: 'Which interface is Microsoft\'s primary configuration UI in Windows 10 and is designed to eventually replace Control Panel?',
                    options: [
                        'Microsoft Management Console (MMC)',
                        'The Settings app (ms-settings:)',
                        'Control Panel',
                        'Computer Management'
                    ],explanation: 'Microsoft is progressively migrating configuration options to the Settings app (Win+I) and intends for it to replace Control Panel over time. Many Settings app pages redirect to Control Panel for features not yet migrated, but Settings is the modern primary interface tested on MD-100.'
                },
                {
                    question: 'A user connects an external 4K monitor and notices Windows renders all text and icons at tiny scale. Which setting corrects this without changing resolution?',
                    options: [
                        'Screen resolution (lower it to 1920x1080)',
                        'Display scaling / DPI scaling (increase to 125% or 150%)',
                        'Refresh rate (change to 60 Hz)',
                        'Color calibration'
                    ],explanation: 'Display scaling (DPI scaling) adjusts the size of text, apps, and other items without changing the native resolution. Setting a higher percentage (125%, 150%, 200%) makes content larger while preserving the sharpness of the high-resolution display. Reducing resolution would make things larger but blurry.'
                },
                {
                    question: 'Which power plan is recommended for a desktop workstation that must deliver maximum performance at all times regardless of power consumption?',
                    options: [
                        'Balanced',
                        'Power saver',
                        'High performance',
                        'Ultimate performance'
                    ],explanation: 'Ultimate Performance (available on Pro/Enterprise) is designed for workstations and eliminates micro-latency from power saving features entirely. High Performance is also valid for performance, but Ultimate Performance goes further. Balanced is the default; Power Saver maximizes battery life at the cost of performance.'
                },
                {
                    question: 'Which registry hive contains hardware configuration data and is rebuilt each time Windows boots from data gathered during startup?',
                    options: [
                        'HKEY_LOCAL_MACHINE\\SOFTWARE',
                        'HKEY_CURRENT_USER',
                        'HKEY_LOCAL_MACHINE\\HARDWARE',
                        'HKEY_LOCAL_MACHINE\\SYSTEM'
                    ],explanation: 'HKLM\\HARDWARE is a volatile hive that is built in memory during each boot by the kernel and hardware detection process. It is not stored on disk as a file. HKLM\\SOFTWARE stores installed software configuration; HKLM\\SYSTEM stores driver and service configuration; HKCU stores the current user\'s settings.'
                },
                {
                    question: 'EXAM TIP: An administrator needs to apply a registry change that affects all users who log on to the machine, including new users not yet created. Which hive should be modified?',
                    options: [
                        'HKEY_CURRENT_USER (HKCU)',
                        'HKEY_USERS\\.DEFAULT',
                        'HKEY_LOCAL_MACHINE (HKLM)',
                        'HKEY_CLASSES_ROOT (HKCR)'
                    ],explanation: 'HKEY_USERS\\.DEFAULT serves as the template for new user profiles. Changes here are copied to HKCU for each new user when their profile is first created. HKLM applies machine-wide settings regardless of user; HKCU applies only to the currently logged-in user. HKCR maps file extension associations.'
                },
                {
                    question: 'Which command opens the Local Group Policy Editor, and on which Windows 10 editions is it available?',
                    options: [
                        'gpmc.msc - available on all editions',
                        'gpedit.msc - available on Pro, Enterprise, and Education (not Home)',
                        'gpedit.msc - available on all editions including Home',
                        'secpol.msc - this is the Group Policy Editor'
                    ],explanation: 'gpedit.msc opens the Local Group Policy Object Editor and is available on Windows 10 Pro, Enterprise, and Education. Windows 10 Home does not include gpedit.msc. gpmc.msc is the Group Policy Management Console for domain environments and requires Remote Server Administration Tools. secpol.msc is the Local Security Policy subset of Group Policy.'
                },
                {
                    question: 'Group Policy settings are applied in which order, from first applied to last applied (last write wins)?',
                    options: [
                        'Site, Domain, OU, Local',
                        'Local, Site, Domain, OU',
                        'OU, Domain, Site, Local',
                        'Domain, Local, OU, Site'
                    ],explanation: 'Group Policy is applied in LSDOU order: Local first, then Site, then Domain, then Organizational Unit (most specific OU last). Since later-applied settings overwrite earlier ones, OU settings have the highest precedence. This is a critical exam concept - remember the acronym LSDOU.'
                },
                {
                    question: 'An administrator wants to create a single management console with Device Manager, Disk Management, and Event Viewer combined. Which tool enables this?',
                    options: [
                        'Task Manager',
                        'Computer Management (compmgmt.msc) - it includes all three by default',
                        'Microsoft Management Console (mmc.exe) with custom snap-ins',
                        'Windows Admin Center'
                    ],explanation: 'mmc.exe is the empty MMC shell that allows administrators to add any available snap-ins and save the custom console as a .msc file. This creates a tailored management tool. Computer Management already includes those snap-ins but cannot be fully customized. Windows Admin Center is a separate web-based tool.'
                },
                {
                    question: 'A device in Device Manager shows a yellow exclamation mark (!). What does this indicate?',
                    options: [
                        'The device is disabled by the administrator',
                        'The device has a driver or configuration problem',
                        'The device is working normally but has a firmware update available',
                        'The device requires a reboot to complete installation'
                    ],explanation: 'A yellow exclamation mark indicates the device has a problem - typically a missing, corrupted, or incompatible driver. A downward arrow indicates a disabled device. A question mark indicates an unknown device with no driver. The Properties dialog and error code provide specific troubleshooting guidance.'
                },
                {
                    question: 'After updating a graphics driver, a user experiences display corruption and crashes. What is the FASTEST recovery method without reinstalling Windows?',
                    options: [
                        'Use System Restore to roll back to before the driver update',
                        'Use Driver Rollback in Device Manager Properties',
                        'Download and reinstall the previous driver version from the manufacturer',
                        'Boot into Safe Mode and delete the driver files manually'
                    ],explanation: 'Driver Rollback (Device Manager > Device Properties > Driver tab > Roll Back Driver) instantly reverts to the previously installed driver version. It is the fastest in-OS recovery. System Restore works but takes longer and reverts more than just the driver. Manual download is slower. Safe Mode deletion is a last resort.'
                },
                {
                    question: 'EXAM TIP: Windows 10 64-bit requires all kernel-mode drivers to be digitally signed. What happens when an unsigned driver is detected during installation?',
                    options: [
                        'Windows silently blocks the driver with no notification',
                        'Windows installs it with a security warning in the Event Log',
                        'Windows blocks installation; the driver cannot be loaded',
                        'Windows prompts the user to choose between installing or blocking'
                    ],explanation: 'Windows 10 64-bit enforces mandatory kernel-mode code signing (KMCS). Unsigned kernel-mode drivers will not load - the system blocks them. Administrators can temporarily disable this enforcement via boot options (disable driver signature enforcement) for testing, but it is off by default for security.'
                },
                {
                    question: 'Which environment variable contains the path to the current user\'s profile directory (e.g., C:\\Users\\jsmith)?',
                    options: [
                        '%SYSTEMROOT%',
                        '%USERPROFILE%',
                        '%APPDATA%',
                        '%HOMEPATH%'
                    ],explanation: '%USERPROFILE% points to the root of the current user\'s profile folder (e.g., C:\\Users\\jsmith). %APPDATA% points to the roaming AppData subfolder (C:\\Users\\jsmith\\AppData\\Roaming). %HOMEPATH% gives just the path portion without drive letter (\\Users\\jsmith). %SYSTEMROOT% is the Windows directory (C:\\Windows).'
                },
                {
                    question: 'A network printer is shared from a Windows 10 workstation. Users on other machines connect to it via \\\\WORKSTATION\\PrinterName. Which service must be running on the host machine for this to work?',
                    options: [
                        'Print Spooler',
                        'Server service',
                        'Both Print Spooler and Server service',
                        'TCP/IP Print Server'
                    ],explanation: 'Both services are required: the Print Spooler manages print jobs and the printer queue, while the Server service (lanmanserver) enables file and printer sharing over the network via SMB. If either is stopped, network printing fails. TCP/IP Print Server (lpr/lpd) is for Unix-style printing, not Windows shares.'
                },
                {
                    question: 'A user changes the Windows 10 Region settings to a different country but some applications still display the old date/time format. What is the likely cause?',
                    options: [
                        'The application has its own locale settings independent of Windows',
                        'The user must also change the System Locale setting and restart',
                        'Region changes require a full reinstallation to take effect',
                        'The user changed Date/Time but not Region in Settings'
                    ],explanation: 'Many applications cache locale data or have their own internationalization settings that do not automatically follow Windows region changes. The user must restart the application or adjust its internal locale settings. The System Locale (language for non-Unicode programs) is a separate setting in Region > Administrative that also requires a restart to take effect.'
                },
                {
                    question: 'After modifying a Local Group Policy setting, an administrator needs to force immediate application without waiting for the next refresh cycle. Which command should they run?',
                    options: [
                        'gpupdate',
                        'gpupdate /force',
                        'gpresult /force',
                        'secedit /refreshpolicy'
                    ],explanation: 'gpupdate /force reapplies all Group Policy settings regardless of whether they have changed, forcing an immediate refresh. Plain "gpupdate" only applies changed settings. gpresult is a reporting tool (not an update command). secedit /refreshpolicy was the older Windows XP equivalent, replaced by gpupdate in modern Windows.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
