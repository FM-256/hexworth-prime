<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>

    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-010 Quiz: I/O Redirection',
            description: 'Test your knowledge of stdout, stderr, pipes, tee, and /dev/null',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-010',
            moduleId: 'clh-010',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-011: Network Reconnaissance', href: 'clh/script-clh-011-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the difference between <code>></code> and <code>>></code>?',
                    options: [
                        '<code>></code> appends to a file, <code>>></code> overwrites it',
                        '<code>></code> overwrites a file, <code>>></code> appends to it',
                        '<code>></code> redirects stderr, <code>>></code> redirects stdout',
                        'They are identical -- both overwrite the file'
                    ],explanation: 'A single > overwrites the file (creating it if needed). Double >> appends to the end of the file, preserving existing content.'
                },
                {
                    question: 'Which operator redirects only stderr (error messages) to a file?',
                    options: [
                        '<code>command > errors.log</code>',
                        '<code>command 2> errors.log</code>',
                        '<code>command &> errors.log</code>',
                        '<code>command >> errors.log</code>'
                    ],explanation: '2> redirects file descriptor 2 (stderr) to a file. Plain > only redirects file descriptor 1 (stdout). &> redirects both.'
                },
                {
                    question: 'What does the pipe operator <code>|</code> do?',
                    options: [
                        'Writes the output of a command to a file',
                        'Runs two commands simultaneously in the background',
                        'Sends the stdout of one command into the stdin of the next command',
                        'Redirects stderr to stdout'
                    ],explanation: 'The pipe takes the standard output of the command on the left and feeds it as standard input to the command on the right, chaining commands together.'
                },
                {
                    question: 'What does <code>command | tee output.log</code> do?',
                    options: [
                        'Writes output to the file only, nothing on screen',
                        'Displays output on screen AND writes it to the file simultaneously',
                        'Reads from the file and passes it to the command',
                        'Splits stderr and stdout into separate files'
                    ],explanation: 'tee splits the stream -- it writes a copy to the specified file while also passing the data through to stdout (the screen), giving you both at once.'
                },
                {
                    question: 'What does <code>command > /dev/null 2>&1</code> accomplish?',
                    options: [
                        'Saves all output to a hidden file called null',
                        'Redirects stdout to /dev/null and leaves stderr on screen',
                        'Discards all output -- both stdout and stderr are silenced',
                        'Sends stderr to /dev/null but keeps stdout on screen'
                    ],explanation: '/dev/null is a special device that discards everything written to it. The > sends stdout there, and 2>&1 redirects stderr to the same place as stdout -- silencing everything.'
                },
                {
                    question: 'What does <code>2>&1</code> mean in a redirection?',
                    options: [
                        'Redirect file descriptor 2 to file descriptor 1 (merge stderr into stdout)',
                        'Redirect stdout to stderr',
                        'Create a backup copy of the output on descriptor 2',
                        'Run the command with priority level 2'
                    ],explanation: '2>&1 redirects file descriptor 2 (stderr) to wherever file descriptor 1 (stdout) is currently pointing. This merges error output into the normal output stream.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
