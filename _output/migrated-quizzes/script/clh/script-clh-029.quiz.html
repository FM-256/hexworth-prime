<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-029 Quiz: Vim Essentials - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-029 Quiz: Vim Essentials',
            description: 'Test your field editing skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-029',
            moduleId: 'clh-029',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-030: Final Operation', href: 'clh/script-clh-030-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'You\'re in vim and keys are inserting text instead of commands. How do you return to Normal mode?',
                    options: [
                        'Press <code>Enter</code>',
                        'Press <code>Esc</code>',
                        'Press <code>Ctrl+C</code>',
                        'Type <code>:normal</code>'
                    ],explanation: '<code>Esc</code> always returns you to Normal mode from Insert mode. This is the most important key in vim!'
                },
                {
                    question: 'What command saves and quits vim in one step?',
                    options: [
                        '<code>:sq</code>',
                        '<code>:wq</code>',
                        '<code>:exit</code>',
                        '<code>:save</code>'
                    ],explanation: '<code>:wq</code> = write (save) + quit. You can also use <code>:x</code> or <code>ZZ</code> in Normal mode.'
                },
                {
                    question: 'In Normal mode, what does <code>dd</code> do?',
                    options: [
                        'Duplicates the current line',
                        'Deletes the current line',
                        'Downloads a file',
                        'Debugs the document'
                    ],explanation: '<code>dd</code> deletes the entire current line. It\'s also stored in the buffer so you can paste it with <code>p</code>.'
                },
                {
                    question: 'How do you enter Insert mode at the current cursor position?',
                    options: [
                        'Press <code>a</code>',
                        'Press <code>i</code>',
                        'Press <code>Insert</code>',
                        'Type <code>:insert</code>'
                    ],explanation: '<code>i</code> = insert before cursor. <code>a</code> = append after cursor. Both enter Insert mode.'
                },
                {
                    question: 'You need to quit vim WITHOUT saving changes. What command?',
                    options: [
                        '<code>:q</code>',
                        '<code>:q!</code>',
                        '<code>:wq</code>',
                        '<code>:exit!</code>'
                    ],explanation: '<code>:q!</code> forces quit without saving. The <code>!</code> means "I know what I\'m doing, override the warning."'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
