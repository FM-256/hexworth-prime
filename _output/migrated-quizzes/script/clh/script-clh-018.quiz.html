<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-018 Quiz: Archive Operations',
            description: 'Test your archive handling skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-018',
            moduleId: 'clh-018',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-019: Disk Forensics', href: 'clh/script-clh-019-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command creates a compressed tarball from a directory?',
                    options: [
                        '<code>tar -cvf archive.tar.gz dir/</code>',
                        '<code>tar -czvf archive.tar.gz dir/</code>',
                        '<code>gzip -r dir/</code>',
                        '<code>zip dir/ archive.tar.gz</code>'
                    ],explanation: '<code>-czvf</code> means Create, gZip, Verbose, Filename. The z flag adds gzip compression.'
                },
                {
                    question: 'Before extracting an unknown archive, you should:',
                    options: [
                        'Extract it immediately to /tmp',
                        'Run it through antivirus',
                        'List its contents with <code>tar -tvf</code>',
                        'Delete it'
                    ],explanation: 'Always inspect archives before extraction. Use <code>tar -tvf</code> to see contents without extracting.'
                },
                {
                    question: 'What does the <code>-x</code> flag do in <code>tar -xzvf archive.tar.gz</code>?',
                    options: [
                        'Create archive',
                        'eXtract archive',
                        'eXamine archive',
                        'eXclude files'
                    ],explanation: '-x means eXtract. Common tar flags: c=create, x=extract, t=list, v=verbose, f=file, z=gzip.'
                },
                {
                    question: 'Create a password-protected zip archive:',
                    options: [
                        '<code>zip -p password archive.zip files/</code>',
                        '<code>zip -e archive.zip files/</code>',
                        '<code>zip --encrypt archive.zip files/</code>',
                        '<code>zip -r -e archive.zip files/</code>'
                    ],explanation: '<code>-e</code> enables encryption (prompts for password), <code>-r</code> is recursive for directories.'
                },
                {
                    question: 'What\'s the difference between <code>gzip file</code> and <code>zip archive.zip file</code>?',
                    options: [
                        'No difference',
                        'gzip replaces original, zip creates new file',
                        'zip is faster',
                        'gzip supports directories'
                    ],explanation: '<code>gzip file</code> compresses in-place (file becomes file.gz). <code>zip</code> creates a new archive file.'
                },
                {
                    question: 'Extract a tarball to a specific directory:',
                    options: [
                        '<code>tar -xzvf archive.tar.gz /target/</code>',
                        '<code>tar -xzvf archive.tar.gz -C /target/</code>',
                        '<code>tar -xzvf archive.tar.gz --dir /target/</code>',
                        '<code>mv archive.tar.gz /target/ && tar -xzvf</code>'
                    ],explanation: '<code>-C</code> (Change directory) specifies where to extract. Essential for controlled extraction.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
