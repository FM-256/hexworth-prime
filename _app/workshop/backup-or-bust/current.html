<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup or Bust - Forge House Survival Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 12px;
            border: 2px solid #f97316;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fb923c;
            transform: translateX(-5px);
        }

        h1 {
            color: #f97316;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .lives-display {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .life-icon {
            font-size: 2em;
            filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.7));
            transition: all 0.3s ease;
        }

        .life-icon.lost {
            opacity: 0.2;
            filter: grayscale(100%);
        }

        .score-display {
            font-size: 1.5em;
            color: #f97316;
            font-weight: bold;
        }

        .wave-display {
            font-size: 1.3em;
            color: #10b981;
            font-weight: bold;
        }

        .combo-display {
            font-size: 1.2em;
            color: #fbbf24;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .combo-fire {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }

        /* Timer */
        .timer-container {
            text-align: center;
            margin: 20px 0;
        }

        .timer-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            position: relative;
            border-radius: 50%;
            background: conic-gradient(#f97316 var(--progress), #1a1a1a var(--progress));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.5);
        }

        .timer-inner {
            width: 100px;
            height: 100px;
            background: #0a0a0a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            color: #f97316;
        }

        .timer-critical {
            animation: shake 0.5s infinite;
            --progress: 0%;
            background: conic-gradient(#ef4444 var(--progress), #1a1a1a var(--progress));
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Disaster Banner */
        .disaster-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(239, 68, 68, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: disasterFade 0.5s ease;
        }

        @keyframes disasterFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .disaster-title {
            font-size: 4em;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        .disaster-text {
            font-size: 1.8em;
            color: #fff;
            text-align: center;
            max-width: 80%;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        /* Question Card */
        .question-card {
            background: #1a1a1a;
            border: 2px solid #f97316;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            color: #f97316;
            font-size: 1.4em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .option {
            background: #0f0f0f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.2);
        }

        .option.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
        }

        .option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        /* Screen Shake on Wrong Answer */
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: wrongShake 0.5s;
        }

        /* Game Over Screen */
        .game-over-screen {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 3px solid #ef4444;
            border-radius: 12px;
            animation: slideIn 0.5s ease;
        }

        .game-over-title {
            font-size: 4em;
            color: #ef4444;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
        }

        /* Victory Screen */
        .victory-screen {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 3px solid #10b981;
            border-radius: 12px;
            animation: slideIn 0.5s ease;
        }

        .victory-title {
            font-size: 4em;
            color: #10b981;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }

        .high-score {
            font-size: 2.5em;
            color: #fbbf24;
            margin: 20px 0;
            font-weight: bold;
        }

        .btn {
            padding: 15px 40px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            background: #fb923c;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4);
        }

        .btn-secondary {
            background: #333;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .info-box {
            background: #0f0f0f;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 0.95em;
            color: #a0a0a0;
        }

        .explanation-box {
            background: #0f0f0f;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .explanation-title {
            color: #10b981;
            font-size: 1.3em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .hud { flex-direction: column; }
            .disaster-title { font-size: 2.5em; }
            .disaster-text { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../../houses/forge/index.html" class="back-link">← Back to House</a>
            <h1><img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> BACKUP OR BUST</h1>
            <p class="subtitle">Survival-Style Disaster Recovery Challenge</p>
        </header>

        <div class="hud">
            <div class="lives-display">
                <span style="color: #a0a0a0;">LIVES:</span>
                <span id="livesIcons"></span>
            </div>
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="wave-display">WAVE <span id="wave">1</span></div>
            <div class="combo-display" id="comboDisplay" style="display: none;">
                COMBO: <span id="combo">0</span>x
            </div>
        </div>

        <div class="timer-container" id="timerContainer">
            <div class="timer-circle" id="timerCircle">
                <div class="timer-inner" id="timerDisplay">30</div>
            </div>
        </div>

        <div id="gameContainer"></div>
    </div>

    <script src="../../components/AchievementManager.js"></script>
    <script src="../../components/FluxCapacitor.js"></script>
    <script>
        // Game State
        let lives = 3;
        let score = 0;
        let wave = 1;
        let combo = 0;
        let currentQuestionIndex = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let selectedAnswer = null;
        let questionStartTime = 0;
        let highScore = parseInt(localStorage.getItem('backup_or_bust_high_score') || '0');
        let highWave = parseInt(localStorage.getItem('backup_or_bust_high_wave') || '1');

        // Disaster Events
        const disasters = [
            { title: "RANSOMWARE ATTACK", text: "Cryptolocker variant detected! Files are being encrypted!" },
            { title: "HARDWARE FAILURE", text: "RAID controller failure! Multiple drives offline!" },
            { title: "DATA CORRUPTION", text: "File system corruption detected across primary storage!" },
            { title: "FLOOD DAMAGE", text: "Water damage in data center! Primary systems compromised!" },
            { title: "FIRE OUTBREAK", text: "Fire suppression activated! Evacuate server room!" },
            { title: "POWER SURGE", text: "Massive power surge! UPS failing! Systems shutting down!" },
            { title: "ACCIDENTAL DELETE", text: "Admin mistake! Production database dropped!" },
            { title: "MALWARE INFECTION", text: "Zero-day malware spreading through network!" },
            { title: "DISK CRASH", text: "Primary storage array catastrophic failure!" },
            { title: "SITE DISASTER", text: "Natural disaster! Complete data center evacuation!" }
        ];

        // Questions Bank (30 questions)
        const questions = [
            {
                question: "Full backup of 100GB at 50MB/s takes how long?",
                options: ["15 minutes", "33 minutes", "2 hours", "50 minutes"],
                correct: 1,
                explanation: "100GB = 102,400MB. At 50MB/s: 102,400/50 = 2,048 seconds ≈ 34 minutes."
            },
            {
                question: "Which backup type captures ALL data regardless of changes?",
                options: ["Incremental", "Differential", "Full", "Synthetic"],
                correct: 2,
                explanation: "Full backups capture every file, whether changed or not."
            },
            {
                question: "Incremental backups save changes since...",
                options: ["Last full backup", "Last incremental backup", "Last week", "Yesterday"],
                correct: 1,
                explanation: "Incrementals capture changes since the LAST incremental or full backup."
            },
            {
                question: "Differential backups save changes since...",
                options: ["Last differential", "Last incremental", "Last full backup", "Last restore"],
                correct: 2,
                explanation: "Differentials always reference the last FULL backup."
            },
            {
                question: "RPO stands for...",
                options: ["Recovery Plan Objective", "Recovery Point Objective", "Restore Process Order", "Rapid Protection Option"],
                correct: 1,
                explanation: "Recovery Point Objective = maximum acceptable data loss (time)."
            },
            {
                question: "RTO stands for...",
                options: ["Recovery Time Objective", "Restore Total Order", "Rapid Technology Option", "Recovery Test Operation"],
                correct: 0,
                explanation: "Recovery Time Objective = maximum acceptable downtime."
            },
            {
                question: "The 3-2-1 rule: 3 copies, 2 different...",
                options: ["Locations", "Media types", "Vendors", "Admins"],
                correct: 1,
                explanation: "3 copies, 2 different MEDIA types (disk/tape/cloud), 1 offsite."
            },
            {
                question: "RAID 0 provides...",
                options: ["Redundancy", "Mirroring", "No redundancy", "Triple parity"],
                correct: 2,
                explanation: "RAID 0 = striping only, NO redundancy. Fastest but no protection!"
            },
            {
                question: "RAID 1 provides...",
                options: ["Striping", "Mirroring", "Parity", "Concatenation"],
                correct: 1,
                explanation: "RAID 1 = disk mirroring (exact copies)."
            },
            {
                question: "RAID 5 requires minimum how many disks?",
                options: ["2", "3", "4", "5"],
                correct: 1,
                explanation: "RAID 5 needs at least 3 disks (data + distributed parity)."
            },
            {
                question: "RAID 6 can survive how many disk failures?",
                options: ["1", "2", "3", "4"],
                correct: 1,
                explanation: "RAID 6 = dual parity, survives 2 simultaneous disk failures."
            },
            {
                question: "RAID 10 combines...",
                options: ["0+1", "1+0 (mirroring+striping)", "5+1", "6+0"],
                correct: 1,
                explanation: "RAID 10 = RAID 1+0, mirrors first then stripes."
            },
            {
                question: "Grandfather-Father-Son rotation uses...",
                options: ["3 backup sets", "Daily-Weekly-Monthly cycles", "RAID levels", "Cloud tiers"],
                correct: 1,
                explanation: "GFS = daily (son), weekly (father), monthly (grandfather) rotation."
            },
            {
                question: "Hot site recovery location has...",
                options: ["No equipment", "Equipment, no data", "Equipment + current data", "Just documentation"],
                correct: 2,
                explanation: "Hot site = fully equipped + current data, ready for immediate failover."
            },
            {
                question: "Warm site recovery location has...",
                options: ["Nothing", "Equipment, no current data", "Full production copy", "Tape library only"],
                correct: 1,
                explanation: "Warm site = equipment installed, but data must be restored."
            },
            {
                question: "Cold site recovery location has...",
                options: ["Full equipment", "Power/network only", "Backup tapes", "Cloud access"],
                correct: 1,
                explanation: "Cold site = empty facility with power/network, no equipment pre-installed."
            },
            {
                question: "Which backup window is most common?",
                options: ["24/7 continuous", "Lunch hour", "Overnight/weekend", "Business hours"],
                correct: 2,
                explanation: "Overnight/weekend = minimal user impact, lowest system load."
            },
            {
                question: "Synthetic full backup...",
                options: ["Doesn't exist", "Combines incrementals into full", "Is fake data", "Needs no storage"],
                correct: 1,
                explanation: "Synthetic full = backup software combines last full + incrementals without re-reading production data."
            },
            {
                question: "VSS (Volume Shadow Copy) allows...",
                options: ["Open file backup", "Faster speeds", "Compression", "Encryption"],
                correct: 0,
                explanation: "VSS creates point-in-time snapshots for backing up open/locked files."
            },
            {
                question: "Backup verification should happen...",
                options: ["Never", "Yearly", "Every backup", "When disaster strikes"],
                correct: 2,
                explanation: "ALWAYS verify backups! Untested backups = no backups."
            },
            {
                question: "Restore testing frequency should be...",
                options: ["Never", "Annually", "Quarterly or more", "After disasters only"],
                correct: 2,
                explanation: "Regular restore tests (quarterly minimum) ensure backups actually work!"
            },
            {
                question: "Offsite backup protects against...",
                options: ["Viruses", "Site disasters", "User errors", "Software bugs"],
                correct: 1,
                explanation: "Offsite = protection from fire, flood, theft, natural disasters."
            },
            {
                question: "Backup retention policy defines...",
                options: ["Backup speed", "How long to keep backups", "Storage type", "Admin roles"],
                correct: 1,
                explanation: "Retention policy = how long backups are kept (days/weeks/months/years)."
            },
            {
                question: "Legal hold requires...",
                options: ["Delete old backups", "Keep specific backups indefinitely", "Encrypt everything", "Daily fulls"],
                correct: 1,
                explanation: "Legal hold = preserve specific backups for litigation/compliance."
            },
            {
                question: "Backup encryption protects...",
                options: ["Against corruption", "Data confidentiality", "Storage space", "Backup speed"],
                correct: 1,
                explanation: "Encryption = protects backup data confidentiality if media is stolen/lost."
            },
            {
                question: "Deduplication saves storage by...",
                options: ["Compression", "Removing duplicate blocks", "Deleting old data", "Using RAID"],
                correct: 1,
                explanation: "Dedup = stores each unique data block only once, references duplicates."
            },
            {
                question: "Cloud backup egress charges apply when...",
                options: ["Uploading", "Downloading/restoring", "Storing", "Encrypting"],
                correct: 1,
                explanation: "Egress = data OUT of cloud. Restore operations often incur charges!"
            },
            {
                question: "Immutable backups cannot be...",
                options: ["Read", "Modified or deleted", "Encrypted", "Compressed"],
                correct: 1,
                explanation: "Immutable = write-once-read-many (WORM), protects against ransomware/deletion."
            },
            {
                question: "Air-gapped backups are...",
                options: ["In the cloud", "Physically disconnected", "On RAID", "Encrypted only"],
                correct: 1,
                explanation: "Air-gap = physically disconnected from network (tape, removable drives)."
            },
            {
                question: "Disaster recovery plan priority #1:",
                options: ["Save data", "Ensure life safety", "Call vendors", "Restore email"],
                correct: 1,
                explanation: "Life safety ALWAYS comes first. Data can be recovered; lives cannot."
            }
        ];

        // Shuffle questions
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        let questionPool = shuffleArray(questions);

        // Initialize Game
        function initGame() {
            updateHUD();
            showNextQuestion();
        }

        // Show Disaster Event
        function showDisaster() {
            const disaster = disasters[Math.floor(Math.random() * disasters.length)];
            const disasterScreen = document.createElement('div');
            disasterScreen.className = 'disaster-screen';
            disasterScreen.innerHTML = `
                <div class="disaster-title"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${disaster.title} <img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                <div class="disaster-text">${disaster.text}</div>
            `;
            document.body.appendChild(disasterScreen);

            setTimeout(() => {
                disasterScreen.remove();
                wave++;
                updateHUD();
                showNextQuestion();
            }, 3000);
        }

        // Show Next Question
        function showNextQuestion() {
            if (lives <= 0) {
                gameOver();
                return;
            }

            // Check if we need to reshuffle
            if (currentQuestionIndex >= questionPool.length) {
                currentQuestionIndex = 0;
                questionPool = shuffleArray(questions);
            }

            const q = questionPool[currentQuestionIndex];
            selectedAnswer = null;
            questionStartTime = Date.now();

            // Calculate timer based on wave (gets shorter)
            timeLeft = Math.max(15, 30 - Math.floor(wave / 2));

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-text">${q.question}</div>
                    <div class="info-box">
                        Wave ${wave} | Speed bonus available for quick answers!
                    </div>
                    ${q.options.map((opt, idx) => `
                        <div class="option" onclick="selectAnswer(${idx})">${opt}</div>
                    `).join('')}
                    <div class="explanation-box" id="explanationBox">
                        <div class="explanation-title">Explanation</div>
                        <div id="explanationText"></div>
                    </div>
                </div>
            `;

            startTimer();
        }

        // Select Answer
        function selectAnswer(index) {
            if (selectedAnswer !== null) return; // Already answered

            clearInterval(timerInterval);
            selectedAnswer = index;
            const q = questionPool[currentQuestionIndex];
            const isCorrect = index === q.correct;
            const answerTime = ((Date.now() - questionStartTime) / 1000).toFixed(1);

            // Mark options
            const options = document.querySelectorAll('.option');
            options.forEach((opt, idx) => {
                if (idx === q.correct) {
                    opt.classList.add('correct');
                } else if (idx === index && !isCorrect) {
                    opt.classList.add('incorrect');
                }
                opt.style.pointerEvents = 'none';
            });

            // Show explanation
            document.getElementById('explanationText').textContent = q.explanation;
            document.getElementById('explanationBox').classList.add('show');

            if (isCorrect) {
                handleCorrectAnswer(answerTime);
            } else {
                handleWrongAnswer();
            }

            // Auto-advance after 3 seconds
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex % 5 === 0 && currentQuestionIndex > 0) {
                    showDisaster();
                } else {
                    showNextQuestion();
                }
            }, 3000);
        }

        // Handle Correct Answer
        function handleCorrectAnswer(answerTime) {
            combo++;
            let points = 100;

            // Speed bonus
            if (answerTime < 10) {
                points += 50;
            } else if (answerTime < 20) {
                points += 25;
            }

            // Combo multiplier
            const multiplier = Math.min(3, 1 + (combo - 1) * 0.5);
            points = Math.floor(points * multiplier);

            score += points;
            updateHUD();

            // Show combo display
            if (combo > 1) {
                document.getElementById('comboDisplay').style.display = 'block';
                if (combo >= 5) {
                    document.getElementById('comboDisplay').classList.add('combo-fire');
                }
            }
        }

        // Handle Wrong Answer
        function handleWrongAnswer() {
            lives--;
            combo = 0;
            document.getElementById('comboDisplay').style.display = 'none';
            document.getElementById('comboDisplay').classList.remove('combo-fire');
            updateHUD();

            // Screen shake
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }

        // Timer Functions
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 5) {
                    document.getElementById('timerCircle').classList.add('timer-critical');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeOut();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const maxTime = Math.max(15, 30 - Math.floor(wave / 2));
            const progress = (timeLeft / maxTime) * 100;
            document.getElementById('timerDisplay').textContent = timeLeft;
            document.getElementById('timerCircle').style.setProperty('--progress', `${progress}%`);
        }

        function timeOut() {
            lives--;
            combo = 0;
            document.getElementById('comboDisplay').style.display = 'none';
            updateHUD();

            // Show correct answer
            const q = questionPool[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            options.forEach((opt, idx) => {
                if (idx === q.correct) {
                    opt.classList.add('correct');
                }
                opt.style.pointerEvents = 'none';
            });

            document.getElementById('explanationText').textContent = q.explanation;
            document.getElementById('explanationBox').classList.add('show');

            // Screen shake
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);

            setTimeout(() => {
                currentQuestionIndex++;
                if (lives <= 0) {
                    gameOver();
                } else if (currentQuestionIndex % 5 === 0) {
                    showDisaster();
                } else {
                    showNextQuestion();
                }
            }, 3000);
        }

        // Update HUD
        function updateHUD() {
            const livesIcons = document.getElementById('livesIcons');
            livesIcons.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const icon = document.createElement('span');
                icon.className = 'life-icon';
                icon.innerHTML = '<img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                if (i >= lives) {
                    icon.classList.add('lost');
                }
                livesIcons.appendChild(icon);
            }

            document.getElementById('score').textContent = score;
            document.getElementById('wave').textContent = wave;
            document.getElementById('combo').textContent = combo;
        }

        // Game Over
        function gameOver() {
            clearInterval(timerInterval);

            // Update high scores
            let newHighScore = false;
            let newHighWave = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('backup_or_bust_high_score', highScore.toString());
                newHighScore = true;
            }

            if (wave > highWave) {
                highWave = wave;
                localStorage.setItem('backup_or_bust_high_wave', highWave.toString());
                newHighWave = true;
            }

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="game-over-screen">
                    <div class="game-over-title"><img src="/assets/images/icons/icon-skull-crossbones.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> GAME OVER <img src="/assets/images/icons/icon-skull-crossbones.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                    <div class="high-score">FINAL SCORE: ${score}</div>
                    <div style="color: #10b981; font-size: 1.5em; margin: 10px 0;">Reached Wave ${wave}</div>
                    ${newHighScore ? '<div style="color: #fbbf24; font-size: 1.3em; margin: 10px 0;"><img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> NEW HIGH SCORE!</div>' : `<div style="color: #a0a0a0; margin: 10px 0;">High Score: ${highScore}</div>`}
                    ${newHighWave ? '<div style="color: #fbbf24; font-size: 1.3em; margin: 10px 0;"><img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> NEW WAVE RECORD!</div>' : `<div style="color: #a0a0a0; margin: 10px 0;">Best Wave: ${highWave}</div>`}
                    <div style="margin: 30px 0;">
                        <button class="btn" onclick="restartGame()">TRY AGAIN</button>
                        <button class="btn btn-secondary" onclick="window.location.href='../../houses/forge/index.html'">BACK TO FORGE</button>
                    </div>
                </div>
            `;

            document.getElementById('timerContainer').style.display = 'none';
        }

        // Restart Game
        function restartGame() {
            lives = 3;
            score = 0;
            wave = 1;
            combo = 0;
            currentQuestionIndex = 0;
            questionPool = shuffleArray(questions);
            document.getElementById('timerContainer').style.display = 'block';
            initGame();
        }

        // Start Game
        initGame();
    </script>
</body>
</html>
