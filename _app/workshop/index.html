<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../components/AccessGuard.js"></script>
    <script>AccessGuard.require('admin');</script>
    <title>The Workshop | Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #08080c;
            font-family: 'Courier New', monospace;
            color: #a0a0b0;
            overflow-x: hidden;
        }

        /* Subtle workshop ambiance */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(180,140,60,0.04) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 80%, rgba(100,140,200,0.03) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Header */
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(180,140,60,0.12);
            background: rgba(8,8,12,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .header-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(180,140,60,0.08);
            border: 1px solid rgba(180,140,60,0.15);
            border-radius: 6px;
            font-size: 1.1rem;
        }

        .header h1 {
            font-size: 1rem;
            color: #d4a840;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .header-sub {
            font-size: 0.55rem;
            color: #5a5040;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .header-right { display: flex; gap: 10px; align-items: center; }

        .badge {
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .badge-admin {
            background: rgba(200,60,60,0.12);
            border: 1px solid rgba(200,60,60,0.25);
            color: #c06060;
        }

        .nav-btn {
            padding: 7px 18px;
            border: 1px solid rgba(180,140,60,0.15);
            border-radius: 4px;
            color: #7a6a50;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-decoration: none;
            font-family: inherit;
            transition: all 0.3s;
        }

        .nav-btn:hover { border-color: rgba(180,140,60,0.35); color: #d4a840; }

        /* Trophy Case */
        .case {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 25px 60px;
        }

        /* Shelf */
        .shelf {
            margin-bottom: 40px;
        }

        .shelf-label {
            font-size: 0.5rem;
            letter-spacing: 0.4em;
            color: #4a4a3a;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shelf-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(180,140,60,0.12), transparent);
        }

        .shelf-count {
            font-size: 0.5rem;
            color: #3a3a30;
            margin-left: 4px;
        }

        /* Glass display area */
        .display {
            background: rgba(12,12,18,0.5);
            border: 1px solid rgba(180,140,60,0.08);
            border-radius: 8px;
            padding: 6px;
            position: relative;
        }

        /* Glass reflection */
        .display::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.015) 0%, transparent 100%);
            border-radius: 8px 8px 0 0;
            pointer-events: none;
        }

        /* Shelf bottom edge */
        .display::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 10%; right: 10%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(180,140,60,0.08), transparent);
            border-radius: 0 0 2px 2px;
        }

        /* Project items on shelf */
        .items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 6px;
        }

        .item {
            background: rgba(18,18,24,0.6);
            border: 1px solid rgba(180,140,60,0.06);
            border-radius: 6px;
            padding: 20px 14px 16px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            position: relative;
        }

        .item:hover {
            border-color: rgba(180,140,60,0.2);
            background: rgba(22,22,28,0.8);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .item-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .item-name {
            font-size: 0.7rem;
            color: #c0b090;
            margin-bottom: 6px;
            letter-spacing: 0.03em;
            line-height: 1.3;
        }

        .item-desc {
            font-size: 0.55rem;
            color: #5a5a50;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .item-house {
            font-size: 0.45rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #4a4a40;
            margin-bottom: 8px;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 0.45rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .tag-concept {
            background: rgba(140,80,180,0.1);
            color: #9070a0;
            border: 1px solid rgba(140,80,180,0.2);
        }

        .tag-prototype {
            background: rgba(180,140,60,0.1);
            color: #b8a050;
            border: 1px solid rgba(180,140,60,0.2);
        }

        .tag-testing {
            background: rgba(60,140,200,0.1);
            color: #60a0c0;
            border: 1px solid rgba(60,140,200,0.2);
        }

        .tag-ready {
            background: rgba(60,160,80,0.1);
            color: #60a860;
            border: 1px solid rgba(60,160,80,0.2);
        }

        /* Empty shelf */
        .empty-shelf {
            padding: 50px 20px;
            text-align: center;
        }

        .empty-shelf-icon {
            font-size: 1.6rem;
            opacity: 0.2;
            margin-bottom: 12px;
        }

        .empty-shelf-text {
            font-size: 0.6rem;
            color: #3a3a30;
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.45rem;
            color: #2a2a20;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .header { padding: 15px; flex-wrap: wrap; gap: 10px; }
            .case { padding: 20px 12px; }
            .items { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">&#9878;</div>
            <div>
                <h1>The Workshop</h1>
                <div class="header-sub">Staging &amp; Prototypes</div>
            </div>
        </div>
        <div class="header-right">
            <span class="badge badge-admin">Admin</span>
            <a href="../dashboard.html" class="nav-btn">Dashboard</a>
        </div>
    </div>

    <div class="case">

        <!-- Workbench: active prototypes -->
        <div class="shelf">
            <div class="shelf-label">On the Bench <span class="shelf-count" id="benchCount"></span></div>
            <div class="display">
                <div class="items" id="benchItems">
                    <div class="empty-shelf">
                        <div class="empty-shelf-icon">&#9878;</div>
                        <div class="empty-shelf-text">Workbench is clear.<br>Projects land here during development.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Testing: ready for QA -->
        <div class="shelf">
            <div class="shelf-label">Under Glass <span class="shelf-count" id="glassCount"></span></div>
            <div class="display">
                <div class="items" id="glassItems">
                    <div class="empty-shelf">
                        <div class="empty-shelf-icon">&#128270;</div>
                        <div class="empty-shelf-text">Nothing under review.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ready to ship -->
        <div class="shelf">
            <div class="shelf-label">Ready to Ship <span class="shelf-count" id="shipCount"></span></div>
            <div class="display">
                <div class="items" id="shipItems">
                    <div class="empty-shelf">
                        <div class="empty-shelf-icon">&#10003;</div>
                        <div class="empty-shelf-text">Nothing queued for deployment.</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">Hexworth Prime // The Workshop</div>

    <script>
        // =============================================
        // WORKSHOP REGISTRY
        // Add projects here as they are staged
        // =============================================
        const PROJECTS = [
            {
                name: 'Backup or Bust v2',
                desc: 'Data recovery crane game — skill-based answer mechanic replaces quiz-in-disguise',
                icon: '&#128190;',
                href: 'backup-or-bust/current.html',
                status: 'concept',
                house: 'forge'
            }
        ];

        (function() {
            const bench = PROJECTS.filter(p => p.status === 'concept' || p.status === 'prototype');
            const glass = PROJECTS.filter(p => p.status === 'testing');
            const ship  = PROJECTS.filter(p => p.status === 'ready');

            render('benchItems', 'benchCount', bench);
            render('glassItems', 'glassCount', glass);
            render('shipItems',  'shipCount',  ship);

            function render(containerId, countId, list) {
                if (list.length === 0) return;
                const container = document.getElementById(containerId);
                const counter = document.getElementById(countId);
                counter.textContent = '(' + list.length + ')';
                container.innerHTML = list.map(item).join('');
            }

            function item(p) {
                const tag = p.href ? 'a' : 'div';
                const href = p.href ? ` href="${p.href}"` : '';
                const house = p.house ? `<div class="item-house">${p.house}</div>` : '';
                return `
                    <${tag} class="item"${href}>
                        <span class="item-icon">${p.icon}</span>
                        <div class="item-name">${p.name}</div>
                        ${house}
                        <div class="item-desc">${p.desc}</div>
                        <span class="tag tag-${p.status}">${p.status}</span>
                    </${tag}>
                `;
            }
        })();
    </script>
</body>
</html>
