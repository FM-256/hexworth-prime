<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    // Canonical-origin guard: hexworth.com is the single front door. The Firebase
    // default domains (hexworth-prime.web.app / .firebaseapp.com) are a separate
    // browser origin, so tenant + auth state don't carry across and the identical
    // files look like a "different site". Bounce ONLY those two exact hosts to
    // hexworth.com, preserving path/query/hash. Exact-match keeps preview channels
    // (hexworth-prime--*.web.app) and other sites (hexworth-arena.web.app) untouched.
    (function () {
        var h = location.hostname;
        if (h === 'hexworth-prime.web.app' || h === 'hexworth-prime.firebaseapp.com') {
            location.replace('https://hexworth.com' + location.pathname + location.search + location.hash);
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BUG-242: these two must load BEFORE this page's async join handler runs.
         TenantShell.js exports window.TenantShellMirror, which the handler calls after writing
         sessionStorage so a NEW TAB inherits tenant context. Without the tag the call silently
         no-ops (it is guarded) and this page -- the DEFAULT dashboard, used by every tenant whose
         branding.dashboardVariant is null -- keeps the exact bug BUG-242 describes, while the ten
         variant dashboards, which have carried these tags all along, look fixed.
         Caught by a QC probe driving the real page; the source-text gate could not see it, because
         the mirror CALL was present and only the function was unreachable.
         tenant-sw.js already injects both of these into subsequent navigations, so this makes the
         first parse consistent with every load after it rather than introducing anything new. -->
    <script src="/components/TenantRouter.js"></script>
    <script src="/components/TenantShell.js"></script>

    <style>
        /* ── CSS Variables — overridden by tenant branding ── */
        :root {
            --brand-primary: #06b6d4;
            --brand-secondary: #8b5cf6;
            --brand-bg: #0a0a0f;
            --brand-header: #0d1117;

            display: flex;

            font-weight: 700;

            letter-spacing: 0.08em;

        /* ── Mission Row ── */
        .mission-row {

            align-items: center;

        .mission-info { flex: 1; }

        .mission-due {

        .mission-status.active { background: rgba(245,158,11,0.15); color: #f59e0b; }

        /* ── Quick Access Grid ── */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;

        .quick-card {
            background: var(--brand-bg);
            border: 1px solid var(--brand-border);

        .quick-card-desc { font-size: 0.75rem; color: var(--brand-text-secondary); margin-top: 4px; }

        /* ── Shift Status Bar ── */
        .shift-bar {

</head>
<body>
    <!-- Loading screen — shown while tenant config loads -->
    <div id="tenant-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loader-text">Initializing secure connection...</div>
        <div class="loader-error" id="loader-error"></div>
    </div>

    <!-- Dashboard — hidden until tenant loads -->
    <div id="tenant-app" style="display:none; padding-bottom:40px;">
        <header class="tenant-header">
            <div class="header-brand">
                <img class="header-logo" id="header-logo" src="" alt="" style="display:none;">
                <span class="header-name" id="header-name"></span>

            <div class="header-user">
                <span class="header-user-name" id="header-user-name">Analyst</span>

            </div>

        <main class="soc-dashboard">

            <!-- Stats -->

            <span id="shift-tenant"></span>
        </div>
    </div>

    <script>
    /**
     * Tenant Loader — Branded SOC Dashboard
     *
     * 1. Extracts tenant slug from URL
     * 2. Fetches tenant config from API
     * 3. Applies branding (CSS variables, logo, name)
     * 4. Renders the SOC dashboard with licensed content
     *
     * URL patterns:
     *   /tenant/index.html?slug=hexworth-academy
     *   /t/hexworth-academy/
     *
     * @feature WL-2
     */
    (async function() {
        var loaderText = document.getElementById('loader-text');
        var loaderError = document.getElementById('loader-error');

        try {
            // ── Step 1: Extract tenant slug ──
            var slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) {
                // Try path: /t/{slug}/
                var pathMatch = window.location.pathname.match(/\/t\/([^\/]+)/);
                if (pathMatch) slug = pathMatch[1];
            }
            if (!slug) {
                throw new Error('No tenant specified. Add ?slug=your-tenant to the URL.');
            }

            loaderText.textContent = 'Loading ' + slug + '...';

            // ── Step 2: Fetch tenant config ──
            var apiUrl = 'https://us-central1-hexworth-prime.cloudfunctions.net/getTenantConfig?slug=' + encodeURIComponent(slug);
            var response = await fetch(apiUrl);
            if (!response.ok) {
                var errData = await response.json().catch(function() { return {}; });
                throw new Error(errData.error || 'Tenant not found (HTTP ' + response.status + ')');
            }
            var config = await response.json();

            if (config.status !== 'active') {
                throw new Error('This training environment is currently inactive.');
            }

            // Store tenant context for other pages
            sessionStorage.setItem('hexworth_tenant', JSON.stringify(config));
            /* Mirror to localStorage so a NEW TAB has tenant context too: sessionStorage
               does not cross tabs, and without this a student who joined here and opened a
               gated module in another tab lost their branding AND the waiver that skips
               sorting quizzes and Dark Arts gates. Called HERE rather than inside
               TenantShell.js because that file is a parser-blocking script near the top of
               this page: it runs, finds no tenant context, and exits BEFORE this async join
               handler writes it. Guarded because the mirror is a convenience, not a
               requirement -- if TenantShell failed to load, the join must still work.
               BUG-242. */
            if (window.TenantShellMirror) window.TenantShellMirror.mirror(config);

            // ── Step 2a: Register Tenant Service Worker ──
            // The SW intercepts all HTML page fetches and injects
            // TenantRouter.js + TenantShell.js into <head> automatically.
            // This seals every page in the app inside the tenant shell
            // without modifying any content files.
            if ('serviceWorker' in navigator) {
                try {
                    var reg = await navigator.serviceWorker.register('/tenant-sw.js', { scope: '/' });
                    // Wait for the SW to activate before proceeding
                    var sw = reg.installing || reg.waiting || reg.active;
                    if (sw) {
                        if (sw.state === 'activated') {
                            sw.postMessage({ type: 'TENANT_ACTIVATE' });
                        } else {
                            sw.addEventListener('statechange', function() {
                                if (sw.state === 'activated') {
                                    sw.postMessage({ type: 'TENANT_ACTIVATE' });
                                }
                            });
                        }
                    }
                    // Also message any already-active SW
                    if (reg.active) {
                        reg.active.postMessage({ type: 'TENANT_ACTIVATE' });
                    }
                } catch (swErr) {
                    console.warn('[Tenant] Service Worker registration failed:', swErr.message);
                    // Fallback: tenant shell will still work via auto-loaders in components
                }
            }

            // ── Step 2b: Check for dashboard variant redirect ──
            // If the tenant config specifies a dashboard variant, redirect to
            // the appropriate dashboard file. This makes index.html a router
            // that loads the correct variant transparently.
            var variant = config.branding && config.branding.dashboardVariant;
            var VARIANT_FILES = {
                'command-center': 'dashboard-command-center.html',
                'clean-ops':      'dashboard-clean-ops.html',
                'tactical-hud':   'dashboard-tactical-hud.html',
                'enterprise':     'dashboard-enterprise.html',
                'academy':        'dashboard-academy.html',
                'federal':        'dashboard-federal.html',
                'nightshift':     'dashboard-nightshift.html',
                'minimalist':     'dashboard-minimalist.html',
                'campus':         'dashboard-campus.html'
            };
            if (variant && VARIANT_FILES[variant]) {
                // Redirect to the variant dashboard — it reads tenant context
                // from sessionStorage (already set above), so no second API call
                window.location.replace('/tenant/' + VARIANT_FILES[variant] + '?slug=' + encodeURIComponent(slug));
                return;
            }

            // No variant specified — render the default dashboard below
            loaderText.textContent = 'Applying configuration...';

            // ── Step 3: Apply branding ──
            var b = config.branding;
            var root = document.documentElement;
            root.style.setProperty('--brand-primary', b.primaryColor || '#06b6d4');
            root.style.setProperty('--brand-secondary', b.secondaryColor || '#8b5cf6');
            root.style.setProperty('--brand-bg', b.backgroundColor || '#0a0a0f');
            root.style.setProperty('--brand-header', b.headerColor || '#0d1117');
            if (b.fontFamily) root.style.setProperty('--brand-font', b.fontFamily);
            if (b.customCSS) {
                var customStyle = document.createElement('style');
                customStyle.textContent = b.customCSS;
                document.head.appendChild(customStyle);
            }

            // Set page title
            document.title = b.platformName || config.name;

            // Set header
            var headerName = document.getElementById('header-name');
            headerName.textContent = b.platformName || config.name;

            if (b.logo) {
                var logo = document.getElementById('header-logo');
                logo.src = b.logo;
                logo.style.display = 'block';
                logo.alt = config.name;
            }

            // Set welcome
            document.getElementById('welcome-tagline').textContent = b.tagline || '';
            document.getElementById('shift-tenant').textContent = b.platformName || config.name;

            // ── Step 4: Render Quick Access ──
            var quickAccess = document.getElementById('quick-access');
            var features = config.licensing.contentAccess.features;
            var quickItems = [];

            if (features.trainingRange) {
                quickItems.push({
                    title: 'Training Range',
                    desc: 'CTF Arena — 120+ boxes',
                    icon: '/assets/images/icons/icon-target.webp',
                    href: '/arena/'
                });
            }

            if (features.vsMode) {
                quickItems.push({
                    title: 'VS Mode',
                    desc: 'Live Red vs Blue',
                    icon: '/assets/images/icons/icon-swords.webp',
                    href: '/arena/boxes/ops-01-operation-shadowgate/'
                });
            }

            if (features.wiresharkHub) {
                quickItems.push({
                    title: 'Wireshark Hub',
                    desc: 'Packet Analysis Training',
                    icon: '/assets/images/icons/icon-magnifier.webp',
                    href: '/wireshark/'
                });
            }

            if (features.forensicsHub) {
                quickItems.push({
                    title: 'Forensics Hub',
                    desc: 'Digital Forensics Training',
                    icon: '/assets/images/icons/icon-microscope.webp',
                    href: '/forensics/'
                });
            }

            if (features.bugHunting) {
                quickItems.push({
                    title: 'Bug Hunting Dojo',
                    desc: 'Vulnerability Training',
                    icon: '/assets/images/icons/icon-syringe.webp',
                    href: '/dark-arts/vault/dojo/'
                });
            }

            /* Licensed courses */
            var COURSE_MAP = {
                'network-plus': { title: 'CompTIA Network+', desc: 'N10-009', icon: '/assets/images/icons/icon-globe.webp', href: '/lobby.html' },
                'cyberops':     { title: 'CyberOps', desc: '200-201', icon: '/assets/images/icons/icon-shield.webp', href: '/houses/eye/cyberops/' },
                'aplus-core1':  { title: 'CompTIA A+ Core 1', desc: '220-1101', icon: '/assets/images/icons/icon-wrench.webp', href: '/houses/forge/' },
                'aplus-core2':  { title: 'CompTIA A+ Core 2', desc: '220-1102', icon: '/assets/images/icons/icon-wrench.webp', href: '/houses/forge/' },
                'md-100':       { title: 'MD-100', desc: 'Windows Client', icon: '/assets/images/icons/icon-terminal.webp', href: '/houses/forge/' },
                'md-101':       { title: 'MD-101', desc: 'Windows Devices', icon: '/assets/images/icons/icon-terminal.webp', href: '/houses/forge/' },
                'feh':          { title: 'FEH', desc: 'Foundations of Ethical Hacking', icon: '/assets/images/icons/icon-magnifier.webp', href: '/houses/dark-arts/feh/index.html' },
                'python-hub':   { title: 'Python Programming', desc: 'Python Hub', icon: '/assets/images/icons/icon-terminal.webp', href: '/lobby.html' }, /* Python Hub course */
                'python-for-it': { title: 'Python for IT', desc: 'COP1034C', icon: '/assets/images/icons/icon-terminal.webp', href: '/lobby.html' }, /* Python for IT course */
                'ethics-it':    { title: 'Ethics in IT', desc: 'CIS4253', icon: '/assets/images/icons/icon-scales.webp', href: '/lobby.html' },
                'domino-effect': { title: 'The Domino Effect', desc: 'CIS2208', icon: '/assets/images/icons/icon-chain.webp', href: '/lobby.html' },
                'infosec':      { title: 'Principles of Information Security', desc: 'CIS2350C', icon: '/assets/images/icons/icon-padlock.webp', href: '/lobby.html' },
                'security-plus': { title: 'CompTIA Security+', desc: 'SY0-701', icon: '/assets/images/icons/icon-shield.webp', href: '/lobby.html' },
                'isc2-cc':      { title: 'ISC2 Certified in Cybersecurity', desc: 'CC', icon: '/assets/images/icons/icon-key.webp', href: '/lobby.html' },
                'server-plus':  { title: 'CompTIA Server+', desc: 'SK0-005', icon: '/assets/images/icons/icon-keyboard.webp', href: '/lobby.html' },
                'wsa':          { title: 'Windows Server Administration', desc: 'CTS1328C', icon: '/assets/images/icons/icon-server.webp', href: '/lobby.html' },
                'adv-linux':    { title: 'Advanced Linux Administration', desc: 'CTS4321C', icon: '/assets/images/icons/icon-terminal.webp', href: '/lobby.html' }
            };
            var licensedCourses = (config.licensing && config.licensing.contentAccess && config.licensing.contentAccess.courses) || [];
            licensedCourses.forEach(function(courseId) {
                var c = COURSE_MAP[courseId];
                if (c) {
                    quickItems.push({
                        title: c.title,
                        desc: c.desc,
                        icon: c.icon,
                        href: c.href
                    });
                }
            });

            /* All Courses — conditional on feature flag */
            if (features.allCourses) {
                quickItems.push({
                    title: 'All Courses',
                    desc: 'Browse full curriculum',
                    icon: '/assets/images/icons/icon-books.webp',
                    href: '/dashboard.html'
                });
            }

            quickAccess.innerHTML = quickItems.map(function(item) {
                return '<a class="quick-card" href="' + item.href + '">' +
                    '<div class="quick-card-icon"><img src="' + item.icon + '" alt="" style="width:28px;height:28px;object-fit:contain;"></div>' +
                    '<div class="quick-card-title">' + item.title + '</div>' +
                    '<div class="quick-card-desc">' + item.desc + '</div>' +
                    '</a>';
            }).join('');

            // ── Step 5: Show dashboard ──
            var loader = document.getElementById('tenant-loader');
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 500);
            document.getElementById('tenant-app').style.display = 'block';

            // Start session timer
            var sessionStart = Date.now();
            setInterval(function() {
                var mins = Math.floor((Date.now() - sessionStart) / 60000);
                document.getElementById('shift-session').textContent = 'Session: ' + mins + ' min';
            }, 60000);

        } catch (err) {
            loaderText.textContent = 'Connection failed';
            loaderError.textContent = err.message;
            loaderError.style.display = 'block';
        }
    })();
    </script>
    <script src="tenant-data.js"></script>
    <script>
    (function() {
        var checkConfig = setInterval(function() {
            var raw = sessionStorage.getItem('hexworth_tenant');
            if (raw) {
                clearInterval(checkConfig);
                try {
                    var config = JSON.parse(raw);
                    TenantData.init(config);
                } catch (e) {
                    console.error('[TenantData] Config parse error:', e);
                }
            }
        }, 100);
        setTimeout(function() { clearInterval(checkConfig); }, 15000);
    })();
    </script>
</body>
</html>
