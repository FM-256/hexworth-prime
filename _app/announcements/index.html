<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../components/AccessGuard.js"></script>
    <script>AccessGuard.showContent();</script>
    <title>Announcements | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-megaphone.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #08080c;
            font-family: 'Courier New', monospace;
            color: #a0a0b0;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 25% 15%, rgba(60,140,220,0.04) 0%, transparent 40%),
                radial-gradient(ellipse at 75% 85%, rgba(200,100,60,0.03) 0%, transparent 40%);
            pointer-events: none;
        }

        /* ── Header ── */
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(60,140,220,0.12);
            background: rgba(8,8,12,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .header-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(60,140,220,0.08);
            border: 1px solid rgba(60,140,220,0.15);
            border-radius: 6px;
        }

        .header-icon img { width: 20px; height: 20px; }

        .header h1 {
            font-size: 1rem;
            color: #5cacee;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .header-sub {
            font-size: 0.55rem;
            color: #405a70;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .header-right { display: flex; gap: 10px; align-items: center; }

        .back-link {
            color: #5a5a6a;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            padding: 4px 10px;
            border: 1px solid rgba(90,90,106,0.2);
            border-radius: 3px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: #5cacee;
            border-color: rgba(92,172,238,0.3);
        }

        /* ── Filters ── */
        .filter-bar {
            padding: 14px 30px;
            border-bottom: 1px solid rgba(60,140,220,0.06);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 0.6rem;
            color: #505060;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-right: 6px;
        }

        .filter-btn {
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid rgba(90,90,106,0.15);
            background: transparent;
            color: #606070;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: rgba(92,172,238,0.3); color: #8080a0; }
        .filter-btn.active { border-color: rgba(92,172,238,0.5); color: #5cacee; background: rgba(92,172,238,0.06); }

        /* ── Main content ── */
        .content { padding: 24px 30px; max-width: 900px; margin: 0 auto; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #404050;
            font-size: 0.8rem;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #404050;
            font-size: 0.75rem;
        }

        /* ── Announcement card ── */
        .announcement {
            border: 1px solid rgba(90,90,106,0.1);
            border-radius: 6px;
            padding: 20px 24px;
            margin-bottom: 14px;
            background: rgba(12,12,18,0.6);
            transition: border-color 0.2s;
        }

        .announcement:hover { border-color: rgba(90,90,106,0.2); }

        .announcement.priority-urgent {
            border-left: 3px solid #e04040;
            background: rgba(224,64,64,0.03);
        }

        .announcement.priority-info {
            border-left: 3px solid #3c8cdc;
        }

        .announcement.priority-normal {
            border-left: 3px solid #4a5a6a;
        }

        .announcement-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .announcement-title {
            font-size: 0.9rem;
            color: #c0c0d0;
            font-weight: bold;
        }

        .priority-badge {
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 0.45rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        .priority-badge.urgent { background: rgba(224,64,64,0.15); color: #e08080; }
        .priority-badge.normal { background: rgba(90,90,106,0.15); color: #8080a0; }
        .priority-badge.info { background: rgba(60,140,220,0.12); color: #6cb0ee; }

        .house-tag {
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.45rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid rgba(90,90,106,0.12);
            color: #606070;
        }

        .announcement-body {
            font-size: 0.75rem;
            line-height: 1.6;
            color: #808090;
            margin-bottom: 10px;
        }

        .announcement-body p { margin-bottom: 8px; }
        .announcement-body strong { color: #a0a0b0; }
        .announcement-body code {
            background: rgba(92,172,238,0.08);
            padding: 1px 5px;
            border-radius: 2px;
            font-size: 0.7rem;
            color: #6cb0ee;
        }
        .announcement-body ul, .announcement-body ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .announcement-meta {
            display: flex;
            gap: 16px;
            font-size: 0.55rem;
            color: #404050;
            letter-spacing: 0.05em;
        }

        /* ── Admin create panel ── */
        .admin-panel {
            display: none;
            border: 1px solid rgba(180,140,60,0.15);
            border-radius: 6px;
            padding: 20px 24px;
            margin-bottom: 24px;
            background: rgba(180,140,60,0.03);
        }

        .admin-panel.visible { display: block; }

        .admin-panel h2 {
            font-size: 0.7rem;
            color: #d4a840;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .form-row { margin-bottom: 12px; }

        .form-row label {
            display: block;
            font-size: 0.55rem;
            color: #606070;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(8,8,12,0.8);
            border: 1px solid rgba(90,90,106,0.15);
            border-radius: 3px;
            color: #a0a0b0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
        }

        .form-row textarea { min-height: 100px; resize: vertical; }

        .form-row input:focus,
        .form-row textarea:focus,
        .form-row select:focus {
            outline: none;
            border-color: rgba(92,172,238,0.4);
        }

        .checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            color: #808090;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .btn-create {
            padding: 8px 20px;
            background: rgba(92,172,238,0.12);
            border: 1px solid rgba(92,172,238,0.3);
            border-radius: 3px;
            color: #5cacee;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-create:hover { background: rgba(92,172,238,0.18); }
        .btn-create:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-toggle-admin {
            padding: 3px 10px;
            border: 1px solid rgba(180,140,60,0.2);
            border-radius: 3px;
            background: transparent;
            color: #d4a840;
            font-size: 0.55rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle-admin:hover { background: rgba(180,140,60,0.06); }

        .form-status {
            margin-top: 10px;
            font-size: 0.65rem;
            min-height: 18px;
        }

        .form-status.success { color: #4ade80; }
        .form-status.error { color: #e08080; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .header { padding: 14px 16px; }
            .filter-bar { padding: 10px 16px; }
            .content { padding: 16px; }
            .announcement { padding: 14px 16px; }
            .admin-panel { padding: 14px 16px; }
            .announcement-header { gap: 6px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <img src="/assets/images/icons/icon-megaphone.webp" alt="">
            </div>
            <div>
                <h1>Announcements</h1>
                <div class="header-sub">Hexworth Prime Broadcast Channel</div>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-toggle-admin" id="adminToggle" style="display:none" onclick="AnnouncementPage.toggleAdmin()">+ New</button>
            <a href="/dashboard.html" class="back-link">Dashboard</a>
        </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
        <span class="filter-label">Filter</span>
        <button class="filter-btn active" data-house="all" onclick="AnnouncementPage.filter('all')">All</button>
        <button class="filter-btn" data-house="eye" onclick="AnnouncementPage.filter('eye')">Eye</button>
        <button class="filter-btn" data-house="code" onclick="AnnouncementPage.filter('code')">Code</button>
        <button class="filter-btn" data-house="key" onclick="AnnouncementPage.filter('key')">Key</button>
        <button class="filter-btn" data-house="shield" onclick="AnnouncementPage.filter('shield')">Shield</button>
        <button class="filter-btn" data-house="script" onclick="AnnouncementPage.filter('script')">Script</button>
        <button class="filter-btn" data-house="forge" onclick="AnnouncementPage.filter('forge')">Forge</button>
        <button class="filter-btn" data-house="cloud" onclick="AnnouncementPage.filter('cloud')">Cloud</button>
    </div>

    <!-- Admin create panel (hidden by default, shown for admins) -->
    <div class="content">
        <div class="admin-panel" id="adminPanel">
            <h2>Create Announcement</h2>
            <div class="form-row">
                <label>Title</label>
                <input type="text" id="annTitle" maxlength="120" placeholder="Announcement title">
            </div>
            <div class="form-row">
                <label>Body (supports **bold**, `code`, - lists)</label>
                <textarea id="annBody" maxlength="2000" placeholder="Announcement body text..."></textarea>
            </div>
            <div class="form-row">
                <label>Priority</label>
                <select id="annPriority">
                    <option value="normal">Normal</option>
                    <option value="urgent">Urgent</option>
                    <option value="info">Info</option>
                </select>
            </div>
            <div class="form-row">
                <label>Houses (leave unchecked for global)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="eye"> Eye</label>
                    <label><input type="checkbox" value="code"> Code</label>
                    <label><input type="checkbox" value="key"> Key</label>
                    <label><input type="checkbox" value="shield"> Shield</label>
                    <label><input type="checkbox" value="script"> Script</label>
                    <label><input type="checkbox" value="forge"> Forge</label>
                    <label><input type="checkbox" value="cloud"> Cloud</label>
                </div>
            </div>
            <div class="form-row">
                <label>Expires (optional)</label>
                <input type="datetime-local" id="annExpires">
            </div>
            <button class="btn-create" id="btnCreate" onclick="AnnouncementPage.create()">Publish</button>
            <div class="form-status" id="formStatus"></div>
        </div>

        <!-- Announcement list -->
        <div id="announcementList">
            <div class="loading-state">Loading announcements...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../components/FirebaseAuth.js"></script>
<script>
    /**
     * AnnouncementPage — Full announcement board with Firestore backend.
     * Reads from `announcements` collection, sorted by priority then date.
     * Admin users can create new announcements via inline form.
     */
    const AnnouncementPage = (function() {
        'use strict';

        let db = null;
        let firestoreModule = null;
        let announcements = [];
        let currentFilter = 'all';
        let isAdmin = false;

        const PRIORITY_ORDER = { urgent: 0, normal: 1, info: 2 };

        // ── Init ──

        async function init() {
            // Wait for auth
            await FirebaseAuth.waitForAuth();
            isAdmin = FirebaseAuth.isAdmin();

            if (isAdmin) {
                document.getElementById('adminToggle').style.display = '';
            }

            // Load Firestore
            try {
                firestoreModule = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js');
                window.firebaseFirestore = window.firebaseFirestore || firestoreModule;

                const { getFirestore } = firestoreModule;
                const { getApps } = window.firebaseApp;
                if (getApps().length === 0) throw new Error('Firebase app not initialized');
                db = getFirestore(getApps()[0]);
            } catch (e) {
                console.error('[Announcements] Firestore init failed:', e);
                document.getElementById('announcementList').innerHTML =
                    '<div class="empty-state">Unable to connect. Please try again later.</div>';
                return;
            }

            await loadAnnouncements();
        }

        // ── Load from Firestore ──

        async function loadAnnouncements() {
            try {
                const { collection, query, where, orderBy, getDocs, Timestamp } = firestoreModule;

                const now = Timestamp.now();
                const ref = collection(db, 'announcements');

                // Query all non-expired announcements
                const q = query(
                    ref,
                    where('active', '==', true),
                    orderBy('created', 'desc')
                );

                const snapshot = await getDocs(q);
                announcements = [];

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    // Client-side expiration check
                    if (data.expires && data.expires.toMillis() < Date.now()) return;
                    announcements.push({ id: docSnap.id, ...data });
                });

                // Sort: urgent first, then by created date (newest)
                announcements.sort((a, b) => {
                    const pa = PRIORITY_ORDER[a.priority] ?? 1;
                    const pb = PRIORITY_ORDER[b.priority] ?? 1;
                    if (pa !== pb) return pa - pb;
                    const ta = a.created?.toMillis?.() || 0;
                    const tb = b.created?.toMillis?.() || 0;
                    return tb - ta;
                });

                render();
            } catch (e) {
                console.error('[Announcements] Load failed:', e);
                document.getElementById('announcementList').innerHTML =
                    '<div class="empty-state">Failed to load announcements.</div>';
            }
        }

        // ── Render ──

        function render() {
            const container = document.getElementById('announcementList');
            const filtered = currentFilter === 'all'
                ? announcements
                : announcements.filter(a =>
                    !a.houses || a.houses.length === 0 || a.houses.includes(currentFilter)
                );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No announcements to display.</div>';
                return;
            }

            container.innerHTML = filtered.map(a => renderCard(a)).join('');
        }

        function renderCard(a) {
            const priorityClass = 'priority-' + (a.priority || 'normal');
            const houseTags = (a.houses && a.houses.length > 0)
                ? a.houses.map(h => `<span class="house-tag">${escapeHtml(h)}</span>`).join('')
                : '<span class="house-tag">global</span>';

            const timeStr = a.created?.toDate
                ? formatRelativeTime(a.created.toDate())
                : 'unknown';

            const authorStr = a.author ? escapeHtml(a.author) : 'System';

            return `
                <div class="announcement ${priorityClass}">
                    <div class="announcement-header">
                        <span class="announcement-title">${escapeHtml(a.title || 'Untitled')}</span>
                        <span class="priority-badge ${a.priority || 'normal'}">${escapeHtml(a.priority || 'normal')}</span>
                        ${houseTags}
                    </div>
                    <div class="announcement-body">${formatBody(a.body || '')}</div>
                    <div class="announcement-meta">
                        <span>By ${authorStr}</span>
                        <span>${timeStr}</span>
                        ${a.expires ? '<span>Expires: ' + escapeHtml(a.expires.toDate().toLocaleDateString()) + '</span>' : ''}
                    </div>
                </div>
            `;
        }

        // ── Markdown-lite formatting ──

        function formatBody(text) {
            let html = escapeHtml(text);
            // Bold: **text**
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Code: `text`
            html = html.replace(/`(.+?)`/g, '<code>$1</code>');
            // Unordered list lines: - item
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
            // Paragraphs
            html = html.replace(/\n{2,}/g, '</p><p>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p>\s*<\/p>/g, '');
            return html;
        }

        // ── Filter ──

        function filter(house) {
            currentFilter = house;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.house === house);
            });
            render();
        }

        // ── Admin: Toggle panel ──

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('visible');
        }

        // ── Admin: Create ──

        async function create() {
            if (!isAdmin) return;

            const title = document.getElementById('annTitle').value.trim();
            const body = document.getElementById('annBody').value.trim();
            const priority = document.getElementById('annPriority').value;
            const expiresInput = document.getElementById('annExpires').value;
            const statusEl = document.getElementById('formStatus');

            // Validation
            if (!title) {
                statusEl.textContent = 'Title is required.';
                statusEl.className = 'form-status error';
                return;
            }
            if (title.length > 120) {
                statusEl.textContent = 'Title must be 120 characters or fewer.';
                statusEl.className = 'form-status error';
                return;
            }
            if (!body) {
                statusEl.textContent = 'Body is required.';
                statusEl.className = 'form-status error';
                return;
            }
            if (body.length > 2000) {
                statusEl.textContent = 'Body must be 2000 characters or fewer.';
                statusEl.className = 'form-status error';
                return;
            }

            // Gather selected houses
            const houses = [];
            document.querySelectorAll('#adminPanel .checkbox-group input[type="checkbox"]:checked').forEach(cb => {
                houses.push(cb.value);
            });

            const user = FirebaseAuth.getUser();

            const { collection, addDoc, Timestamp, serverTimestamp } = firestoreModule;

            const docData = {
                title: title,
                body: body,
                priority: priority,
                author: user?.displayName || user?.email || 'Admin',
                authorUid: user?.uid || null,
                houses: houses,
                active: true,
                created: serverTimestamp()
            };

            if (expiresInput) {
                docData.expires = Timestamp.fromDate(new Date(expiresInput));
            }

            const btn = document.getElementById('btnCreate');
            btn.disabled = true;
            statusEl.textContent = 'Publishing...';
            statusEl.className = 'form-status';

            try {
                await addDoc(collection(db, 'announcements'), docData);
                statusEl.textContent = 'Published successfully.';
                statusEl.className = 'form-status success';

                // Reset form
                document.getElementById('annTitle').value = '';
                document.getElementById('annBody').value = '';
                document.getElementById('annPriority').value = 'normal';
                document.getElementById('annExpires').value = '';
                document.querySelectorAll('#adminPanel .checkbox-group input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });

                // Reload
                await loadAnnouncements();
            } catch (e) {
                console.error('[Announcements] Create failed:', e);
                statusEl.textContent = 'Failed to publish. Check console for details.';
                statusEl.className = 'form-status error';
            } finally {
                btn.disabled = false;
            }
        }

        // ── Helpers ──

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatRelativeTime(date) {
            const now = Date.now();
            const diff = now - date.getTime();
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'just now';
            if (minutes < 60) return minutes + 'm ago';
            if (hours < 24) return hours + 'h ago';
            if (days < 30) return days + 'd ago';
            return date.toLocaleDateString();
        }

        // Public API
        return { init, filter, toggleAdmin, create };
    })();

    // Auto-init
    document.addEventListener('DOMContentLoaded', function() {
        AnnouncementPage.init();
    });
    </script>
</body>
</html>
