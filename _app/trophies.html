<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophy Cabinet — Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-trophy.webp">

    <!-- Access control: sorted students only (standard gate, mirrors the other 33 pages). -->
    <script src="components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <link rel="stylesheet" href="css/trophy-cabinet.css">
    <style>
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(120% 90% at 50% -10%, rgba(103,232,249,0.06), transparent 45%),
                radial-gradient(90% 70% at 100% 0%, rgba(129,140,248,0.07), transparent 50%),
                #0a0e1f;
            color: #e6e9ff; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Static (not fixed/sticky) top bar — position:fixed is a known hazard when
           AccessGuard sets body.style.filter (EduScan HEUR-008), so keep it in flow. */
        .tcpage-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-bottom: 1px solid rgba(129,140,248,0.18);
            background: rgba(10,14,31,0.6);
        }
        .tcpage-back {
            display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
            color: #9aa6e0; font-size: 0.86rem; font-weight: 600;
            border: 1px solid rgba(129,140,248,0.28); border-radius: 8px; padding: 7px 14px;
        }
        .tcpage-back:hover { color: #e6e9ff; border-color: rgba(103,232,249,0.5); background: rgba(103,232,249,0.06); }
        .tcpage-brand { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7fd7e6; }
        .tcpage-main { padding: 26px 24px 60px; }

        /* Loading + empty states shown before/if no trophies render. */
        .tcpage-state { max-width: 620px; margin: 90px auto; text-align: center; color: #8891c9; }
        .tcpage-state__title { font-size: 1.1rem; font-weight: 700; color: #cfd6ff; margin-bottom: 8px; }
        .tcpage-loading .tcpage-state__title::after { content: ''; }
        .tcpage-state a { color: #67e8f9; }
        @keyframes tcPagePulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
        .tcpage-loading .tcpage-state { animation: tcPagePulse 1.4s ease-in-out infinite; }
    </style>
</head>
<body>
<h1 class="visually-hidden">Trophy Cabinet</h1>
    <header class="tcpage-top">
        <a href="dashboard.html" class="tcpage-back">&#8592; Dashboard</a>
        <span class="tcpage-brand">Hexworth Prime</span>
    </header>

    <main class="tcpage-main">
        <!-- Cabinet mounts here. Starts in the loading state; TrophyCabinet.mount()
             replaces this content once the systems are ready. -->
        <div id="trophy-root" class="tcpage-loading">
            <div class="tcpage-state"><div class="tcpage-state__title">Opening your trophy cabinet…</div>
                <div>Reading your badges and syncing progress.</div></div>
        </div>
    </main>

    <!-- Sync layer first (auth + Firestore restore + sandbox state), then the badge
         systems. AchievementManager + AchievementSystem define the ~336 curated
         trophies, AchievementRegistry merges them, ObservatoryBadges adds the sandbox
         set, TrophyCabinet reads them all.
         NOTE: ContentCatalog.js is deliberately NOT loaded. The cabinet is a curated
         trophy room and excludes AchievementRegistry's ~6,600 auto-generated per-content
         completion badges (TrophyCabinet filters def.autoGenerated), so there is no point
         building them here. This also makes the Registry/ContentCatalog init-order
         concern moot on this page. -->
    <script src="components/FirebaseAuth.js"></script>
    <script src="components/FirestoreManager.js"></script>
    <script src="components/LabStateSync.js"></script>
    <script src="components/AchievementManager.js"></script>
    <script src="components/AchievementSystem.js"></script>
    <script src="components/AchievementRegistry.js"></script>
    <script src="components/ObservatoryBadges.js"></script>
    <script src="components/TrophyCabinet.js"></script>

    <script>
    (function () {
        'use strict';
        var root = document.getElementById('trophy-root');
        var mounted = false;

        // Render the cabinet from whatever earned state is currently in localStorage.
        // Defensively re-run AchievementRegistry.init() first so the curated definition
        // set is built (idempotent — Map keyed by id, guarded migrate — so this cannot
        // double-count). ContentCatalog isn't loaded here, so init's auto-gen step
        // simply bails, which is exactly what we want (the cabinet excludes auto-gen).
        function paint() {
            try {
                if (window.AchievementRegistry && AchievementRegistry.init) AchievementRegistry.init();
                if (!window.TrophyCabinet) return;
                root.className = '';                       // drop the loading state
                TrophyCabinet.mount(root);
                mounted = true;
            } catch (e) {
                console.error('TrophyCabinet: mount failed', e);
                if (!mounted) root.innerHTML = '<div class="tcpage-state"><div class="tcpage-state__title">Could not load your trophies</div>' +
                    '<div>Try refreshing. If it persists, head back to the <a href="dashboard.html">dashboard</a>.</div></div>';
            }
        }

        // Instant first paint from local state.
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
        else paint();

        // Re-paint when cloud data lands (core achievements via cloudSyncComplete,
        // sandbox badges via progressRestored) or a badge unlocks live.
        ['hexworth:cloudSyncComplete', 'hexworth:progressRestored', 'hexworth:achievementUnlocked'].forEach(function (ev) {
            window.addEventListener(ev, function () { if (mounted) paint(); });
        });

        // Kick hydration so a fresh login / second device fills in from the cloud.
        // Best-effort: if offline or signed out, the local-state view already stands.
        (function hydrate() {
            (async function () {
                try {
                    if (typeof FirebaseAuth === 'undefined' || typeof FirestoreManager === 'undefined') return;
                    await FirebaseAuth.init();
                    var user = (typeof FirebaseAuth.waitForAuth === 'function')
                        ? await FirebaseAuth.waitForAuth()
                        : (FirebaseAuth.getUser ? FirebaseAuth.getUser() : null);
                    if (user && user.uid) await FirestoreManager.restoreFromCloud(user.uid);  // fires cloudSyncComplete
                } catch (e) { /* offline / signed out — local view stands */ }
                // Sandbox badges live in a separate synced doc; pull it (fires progressRestored).
                try {
                    if (window.LabStateSync && window.ObservatoryBadges) {
                        LabStateSync.register(ObservatoryBadges.PROG_LS);
                        LabStateSync.pull();
                    }
                } catch (e) { /* offline no-op */ }
            })();
        })();
    })();
    </script>
</body>
</html>
