<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arctic | Hexworth Prime</title>
    <!-- Global styles applied by ArcticEngine via JS injection -->
    <style>
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <h1 class="visually-hidden">The Arctic</h1>
    <!-- Sync stack — enables Firestore progress sync for Arctic modules -->
    <script src="../config/cipher.js"></script>
    <script src="../config/paths.js"></script>
    <script src="../components/FirebaseAuth.js"></script>
    <script src="../utils/SyncUtils.js"></script>
    <script src="../components/FirestoreManager.js"></script>
    <script src="../components/ClassManager.js"></script>
    <script src="../components/LearningPaths.js"></script>
    <script src="../components/AssignmentManager.js"></script>
    <script src="../components/ProgressSync.js"></script>

    <!-- ArcticData must load first — it provides all district/faction definitions -->
    <script src="ArcticData.js"></script>
    <script>if (typeof LearningPaths !== 'undefined') LearningPaths.registerArctic();</script>
    <!-- ArcticEngine renders the full hub UI into document.body -->
    <script src="ArcticEngine.js"></script>
    <script>ArcticEngine.renderHub();</script>
</body>
</html>
