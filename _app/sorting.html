<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexworth Prime - The Sorting</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☢️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .sorting-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        .sorting-header {
            text-align: center;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }

        .sorting-title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .sorting-subtitle {
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.2em;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Question Card */
        .question-card {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .question-number {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #ddd;
            font-weight: 300;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            background: rgba(40, 40, 50, 0.5);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0;
            animation: slideInUp 0.4s ease forwards;
        }

        .answer:nth-child(1) { animation-delay: 0.1s; }
        .answer:nth-child(2) { animation-delay: 0.15s; }
        .answer:nth-child(3) { animation-delay: 0.2s; }
        .answer:nth-child(4) { animation-delay: 0.25s; }

        .answer:hover {
            border-color: #9f7aea;
            background: rgba(159, 122, 234, 0.1);
            color: #fff;
            transform: translateX(5px);
        }

        .answer.selected {
            border-color: #9f7aea;
            background: rgba(159, 122, 234, 0.2);
            color: #fff;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .progress-bar {
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9f7aea, #38bdf8);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: right;
            font-size: 0.7rem;
            color: #555;
            margin-top: 8px;
            letter-spacing: 0.1em;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
            max-width: 700px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 1s ease forwards;
        }

        .result-announcement {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
        }

        .result-house {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--house-color, #9f7aea), #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-crest {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-domain {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 30px;
        }

        .result-description {
            font-size: 1rem;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .enter-button {
            background: linear-gradient(135deg, #9f7aea, #7c3aed);
            border: none;
            color: #fff;
            padding: 15px 50px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(159, 122, 234, 0.3);
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 15px 30px;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* House Colors */
        .house-web { --house-color: #60a5fa; }
        .house-shield { --house-color: #f87171; }
        .house-cloud { --house-color: #38bdf8; }
        .house-forge { --house-color: #fbbf24; }
        .house-script { --house-color: #a78bfa; }
        .house-code { --house-color: #4ade80; }
        .house-key { --house-color: #f472b6; }
        .house-eye { --house-color: #c084fc; }
        .house-dark-arts { --house-color: #9333ea; }
        .house-divergent { --house-color: #ff00ff; }

        /* Score breakdown modal */
        .score-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .score-modal.show {
            display: flex;
        }

        .score-modal-content {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .score-modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-modal-title {
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }

        .score-modal-subtitle {
            font-size: 0.85rem;
            color: #666;
        }

        .score-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .score-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(40, 40, 50, 0.5);
            border: 1px solid #333;
            border-radius: 8px;
        }

        .score-item.top {
            border-color: var(--house-color);
            background: rgba(159, 122, 234, 0.1);
        }

        .score-house-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-house-icon {
            font-size: 2rem;
        }

        .score-house-name {
            font-size: 1rem;
            color: #ddd;
        }

        .score-house-domain {
            font-size: 0.75rem;
            color: #666;
            margin-top: 3px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--house-color);
        }

        .score-bar-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 0 20px;
            overflow: hidden;
        }

        .score-bar {
            height: 100%;
            background: var(--house-color);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .close-modal-btn {
            display: block;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 40px;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Divergent - Glitch Theme */
        @keyframes glitchText {
            0%, 100% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
                transform: translate(0);
            }
            20% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
                transform: translate(-2px, 1px);
            }
            40% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
                transform: translate(2px, -1px);
            }
            60% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
                transform: translate(-1px, 2px);
            }
            80% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
                transform: translate(1px, -2px);
            }
        }

        @keyframes glitchPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 255, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 255, 0.6), 0 0 35px rgba(0, 255, 255, 0.3); }
        }

        .result-container.house-divergent .result-house {
            animation: glitchText 0.5s ease-in-out infinite;
            background: linear-gradient(135deg, #ff00ff, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
        }

        .result-container.house-divergent .result-crest {
            animation: float 3s ease-in-out infinite, glitchText 0.3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.5));
        }

        .divergent-warning {
            font-size: 0.8rem;
            color: #ff00ff;
            letter-spacing: 0.3em;
            margin-top: 20px;
            animation: glitchText 3s ease-in-out infinite;
            opacity: 0.8;
        }

        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 0.2em;
            z-index: 10;
        }

        /* Returning User Sign-in */
        .returning-user {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .returning-user p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .signin-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(57, 255, 20, 0.5);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }

        .signin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .signin-note {
            font-size: 0.7rem !important;
            color: #444 !important;
            margin-top: 8px !important;
        }

        .divider-text {
            text-align: center;
            margin: 20px 0;
            opacity: 0;
            animation: fadeIn 1s ease 0.6s forwards;
        }

        .divider-text span {
            display: inline-block;
            padding: 0 20px;
            color: #444;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            position: relative;
        }

        .divider-text span::before,
        .divider-text span::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #333);
        }

        .divider-text span::before {
            right: 100%;
            background: linear-gradient(90deg, transparent, #333);
        }

        .divider-text span::after {
            left: 100%;
            background: linear-gradient(90deg, #333, transparent);
        }

        .returning-user.hidden,
        .divider-text.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .question-card {
                padding: 25px 20px;
            }
            .question-text {
                font-size: 1rem;
            }
            .answer {
                font-size: 0.85rem;
                padding: 12px 15px;
            }
            .result-house {
                font-size: 1.8rem;
            }
            .result-crest {
                font-size: 3.5rem;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="sorting-container">
        <div class="sorting-header">
            <h1 class="sorting-title">The Sorting</h1>
            <p class="sorting-subtitle">Choose what resonates. There are no wrong answers.</p>
        </div>

        <!-- Returning user sign-in option -->
        <div class="returning-user" id="returningUser">
            <p>Already have an account?</p>
            <button class="signin-btn" id="signinBtn" onclick="signInReturningUser()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <p class="signin-note">Your house and progress will be restored</p>
        </div>

        <div class="divider-text" id="dividerText">
            <span>or take the sorting quiz</span>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text"><span id="currentQ">1</span> / <span id="totalQ">15</span></div>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-number" id="questionNumber">QUESTION I</div>
            <div class="question-text" id="questionText"></div>
            <div class="answers" id="answers"></div>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-announcement">YOU BELONG TO</div>
            <div class="result-crest" id="resultCrest"></div>
            <div class="result-house" id="resultHouse"></div>
            <div class="result-domain" id="resultDomain"></div>
            <div class="result-description" id="resultDescription"></div>
            <div class="button-group">
                <button class="enter-button" onclick="enterHouse()">ENTER YOUR HOUSE</button>
                <button class="secondary-button" onclick="showScoreBreakdown()">VIEW ALL SCORES</button>
            </div>
        </div>
    </div>

    <!-- Score breakdown modal -->
    <div class="score-modal" id="scoreModal">
        <div class="score-modal-content">
            <div class="score-modal-header">
                <div class="score-modal-title">YOUR AFFINITIES</div>
                <div class="score-modal-subtitle">How you scored across all houses</div>
            </div>
            <div class="score-list" id="scoreList"></div>
            <button class="close-modal-btn" onclick="closeScoreModal()">CLOSE</button>
        </div>
    </div>

    <div class="footer-note">HEXWORTH PRIME</div>

    <!-- Transitions -->
    <link rel="stylesheet" href="styles/transitions.css">

    <!-- Digital Life Scripts -->
    <script src="config/cipher.js"></script>
    <script src="config/paths.js"></script>
    <script src="digital-life/core/Firefly.js"></script>
    <script src="digital-life/core/Ecosystem.js"></script>

    <!-- Firebase Auth for returning users -->
    <script src="components/FirebaseAuth.js"></script>
    <script src="components/FirestoreManager.js"></script>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // RETURNING USER SIGN-IN
        // ═══════════════════════════════════════════════════════════════

        async function signInReturningUser() {
            const btn = document.getElementById('signinBtn');
            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            try {
                await FirebaseAuth.init();
                const user = await FirebaseAuth.signInWithGoogle();

                if (user) {
                    btn.innerHTML = 'Checking profile...';
                    await FirestoreManager.init();
                    const profile = await FirestoreManager.getUserProfile(user.uid);

                    const isRetake = localStorage.getItem('hexworth_retake_sorting') === 'true';
                    if (profile && profile.house && !isRetake) {
                        localStorage.setItem('hexworth_house', profile.house);
                        btn.innerHTML = 'Welcome back! Redirecting...';
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        btn.innerHTML = 'No house found - take the quiz below';
                        btn.disabled = false;
                        setTimeout(() => {
                            document.getElementById('returningUser').classList.add('hidden');
                            document.getElementById('dividerText').classList.add('hidden');
                        }, 2000);
                    }
                } else {
                    btn.innerHTML = 'Sign in with Google';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Sign-in error:', error);
                btn.innerHTML = 'Sign in with Google';
                btn.disabled = false;
            }
        }

        window.addEventListener('firebaseAuthStateChanged', async (e) => {
            const isRetake = localStorage.getItem('hexworth_retake_sorting') === 'true';
            if (e.detail.user && e.detail.firestoreProfile?.house && !isRetake) {
                localStorage.setItem('hexworth_house', e.detail.firestoreProfile.house);
                window.location.href = 'dashboard.html';
            }
        });

        // ═══════════════════════════════════════════════════════════════
        // SORTING QUIZ - PERSONALITY-BASED
        // ═══════════════════════════════════════════════════════════════

        const houses = {
            web: {
                name: 'House of the Web',
                crest: '🕸️',
                domain: 'Networking & Connections',
                description: 'You see the world as an interconnected tapestry. Where others see chaos, you see patterns of communication and flow. Networks speak to you—every connection tells a story, every pathway a bridge to understanding. You thrive on bringing people and systems together.'
            },
            shield: {
                name: 'House of the Shield',
                crest: '🛡️',
                domain: 'Security & Defense',
                description: 'Protection is your calling. You stand as the guardian between systems and those who would harm them. Your mind naturally fortifies, anticipates threats, and builds defenses that others cannot see until they prove unbreakable. Safety is not a feature—it is your foundation.'
            },
            forge: {
                name: 'House of the Forge',
                crest: '⚒️',
                domain: 'Hardware & Systems',
                description: 'The physical world calls to you. While others live in abstraction, you understand that all magic flows through silicon and copper. You build with your hands what others only imagine in code. Tangible, durable, and real—this is your domain.'
            },
            script: {
                name: 'House of Script',
                crest: '📜',
                domain: 'Automation & Efficiency',
                description: 'Why do something twice when a script can do it forever? You see repetition as a problem to be solved, manual work as an insult to intelligence. Your code works while you sleep. Efficiency is not just a goal—it is your nature.'
            },
            cloud: {
                name: 'House of the Cloud',
                crest: '☁️',
                domain: 'Infrastructure & Scale',
                description: 'You think in architectures and infinite scale. The cloud is not abstract to you—it is a realm of endless possibility where resources flex to your will. You build empires in the ether, systems that grow without breaking.'
            },
            code: {
                name: 'House of Code',
                crest: '💻',
                domain: 'Development & DevOps',
                description: 'You are a builder of digital worlds. Logic flows through you like poetry, and systems emerge from your fingertips fully formed. Where others see problems, you see architectures waiting to be born. Creation is your language.'
            },
            key: {
                name: 'House of the Key',
                crest: '🔑',
                domain: 'Cryptography & Identity',
                description: 'Secrets fascinate you. The dance of encryption and decryption, the mathematics of trust, the art of hiding in plain sight—these are your tools. You speak in ciphers and think in algorithms. What must be protected, you will keep safe.'
            },
            eye: {
                name: 'House of the Eye',
                crest: '👁️',
                domain: 'Monitoring & Analysis',
                description: 'Nothing escapes your notice. You watch the watchers, analyze the analysts, and find meaning in the noise. Patterns emerge from chaos under your gaze, and anomalies reveal themselves to you alone. You see what others miss.'
            },
            'dark-arts': {
                name: 'House of the Dark Arts',
                crest: '🌑',
                domain: 'Offensive Security & Research',
                description: 'You walk the shadow path. To defend, one must understand attack. You study what others fear to touch, master techniques that others pretend do not exist. Knowledge is your weapon, curiosity your guide into the darkness. You understand that true security comes from knowing what breaks.'
            },
            'divergent': {
                name: 'The Factionless',
                crest: '⚡',
                domain: 'All Domains',
                description: 'You cannot be contained. While others fit neatly into categories, you see value in every path. The sorting algorithm tried to place you, but your scores refused to separate. You are Divergent—dangerous to those who need control, invaluable to those who value versatility. The houses are all open to you.'
            }
        };

        // 15 Personality-Based Questions
        // Each answer awards points to 2-3 houses with weighted scoring
        const questions = [
            {
                text: "You discover a hidden door in a wall where no door should exist. What draws you to it first?",
                answers: [
                    { text: "I want to know what it connects to—where it leads and what network it's part of", houses: { web: 3, eye: 1 } },
                    { text: "I need to assess if it's safe—what threats might lie beyond it", houses: { shield: 3, eye: 1 } },
                    { text: "I'm curious about how it was built—the mechanisms, materials, and craftsmanship", houses: { forge: 3, code: 1 } },
                    { text: "I wonder what this reveals—is there a hidden pattern or secret to unlock", houses: { key: 3, eye: 1 } }
                ]
            },
            {
                text: "A friend asks you to help with a tedious task that must be done exactly the same way 50 times. What's your instinct?",
                answers: [
                    { text: "I'll do it carefully, making sure each iteration is correct and nothing breaks", houses: { shield: 3, forge: 1 } },
                    { text: "This is an insult to my time—I'll automate it so it never needs doing again", houses: { script: 3, code: 2 } },
                    { text: "I'll find a way to distribute the work across resources so it scales efficiently", houses: { cloud: 3, code: 1 } },
                    { text: "I'll look for the underlying pattern to understand why it must be this way", houses: { eye: 3, key: 1 } }
                ]
            },
            {
                text: "If you could live in any historical era (with your current knowledge), you would be...",
                answers: [
                    { text: "The messenger who carried vital intelligence across kingdoms", houses: { web: 3, eye: 1 } },
                    { text: "The castle guard who watched for threats before dawn", houses: { shield: 3 } },
                    { text: "The blacksmith forging tools and weapons that lasted generations", houses: { forge: 3 } },
                    { text: "The spymaster operating in shadows, gathering secrets", houses: { 'dark-arts': 3, key: 2 } }
                ]
            },
            {
                text: "When building something important, what matters most to you?",
                answers: [
                    { text: "That it's secure and can't be compromised", houses: { shield: 3, key: 1 } },
                    { text: "That it actually ships and exists in the world", houses: { code: 3, cloud: 1 } },
                    { text: "That it's efficient and doesn't waste resources", houses: { script: 3, cloud: 1 } },
                    { text: "That I truly understand how every piece works", houses: { eye: 3, forge: 1 } }
                ]
            },
            {
                text: "What thought keeps you awake at night?",
                answers: [
                    { text: "Threats that exist but nobody has noticed yet", houses: { shield: 3, eye: 2 } },
                    { text: "An elegant solution to a problem that's been bothering me", houses: { script: 3, code: 2 } },
                    { text: "How disconnected systems could work together better", houses: { web: 3, cloud: 1 } },
                    { text: "Secrets I'm protecting and whether they're truly safe", houses: { key: 3, shield: 1 } }
                ]
            },
            {
                text: "Someone hands you a mysterious locked device. What do you do first?",
                answers: [
                    { text: "Scan it for dangers—malware, physical threats, hidden risks", houses: { shield: 3, eye: 1 } },
                    { text: "Try to open it and see what's inside", houses: { forge: 3, 'dark-arts': 1 } },
                    { text: "Look for the lock mechanism and figure out the key", houses: { key: 3, code: 1 } },
                    { text: "Observe it carefully, study its behavior before touching anything", houses: { eye: 3, shield: 1 } }
                ]
            },
            {
                text: "In a team working on a hard problem, you naturally become...",
                answers: [
                    { text: "The one who connects everyone's ideas and keeps communication flowing", houses: { web: 3, code: 1 } },
                    { text: "The one who spots risks and prevents disasters before they happen", houses: { shield: 3, eye: 2 } },
                    { text: "The one who builds the actual working solution", houses: { code: 3, forge: 1 } },
                    { text: "The one who thinks like an adversary to find weaknesses", houses: { 'dark-arts': 3, shield: 1 } }
                ]
            },
            {
                text: "Something you built fails catastrophically. What's your first thought?",
                answers: [
                    { text: "What attack or threat vector did I fail to anticipate?", houses: { shield: 3 } },
                    { text: "Which connection or communication broke down?", houses: { web: 3, eye: 1 } },
                    { text: "Which component gave out? What physical part failed?", houses: { forge: 3 } },
                    { text: "Interesting—now I know exactly how to break it on purpose", houses: { 'dark-arts': 3, eye: 1 } }
                ]
            },
            {
                text: "How do you prefer to learn something completely new?",
                answers: [
                    { text: "By connecting it to things I already know, building a mental map", houses: { web: 3, eye: 1 } },
                    { text: "By getting my hands on it and taking it apart", houses: { forge: 3, 'dark-arts': 1 } },
                    { text: "By building something with it immediately—learning through creation", houses: { code: 3, cloud: 1 } },
                    { text: "By observing it carefully, finding the patterns before engaging", houses: { eye: 3, key: 1 } }
                ]
            },
            {
                text: "Which statement resonates most deeply with you?",
                answers: [
                    { text: "Everything is connected; understanding connections is understanding power", houses: { web: 3, cloud: 1 } },
                    { text: "The world is dangerous, and someone must stand watch", houses: { shield: 3 } },
                    { text: "Any task done more than twice should be automated forever", houses: { script: 3, code: 2 } },
                    { text: "To defend against something, you must first master it", houses: { 'dark-arts': 3, shield: 1 } }
                ]
            },
            {
                text: "You're alone in an unfamiliar place with limited resources. What do you prioritize?",
                answers: [
                    { text: "Securing shelter and identifying potential threats", houses: { shield: 3, forge: 1 } },
                    { text: "Finding ways to signal for help or establish communication", houses: { web: 3 } },
                    { text: "Building tools from available materials", houses: { forge: 3, code: 1 } },
                    { text: "Observing patterns—weather, wildlife, time cycles—to understand the system", houses: { eye: 3, script: 1 } }
                ]
            },
            {
                text: "If you could have one supernatural ability, which calls to you?",
                answers: [
                    { text: "The power to sense danger before it materializes", houses: { shield: 3, eye: 1 } },
                    { text: "The power to connect any two minds or systems instantly", houses: { web: 3, cloud: 1 } },
                    { text: "The power to make anything unbreakable or reveal any weakness", houses: { 'dark-arts': 3, shield: 1 } },
                    { text: "The power to see the truth behind any illusion or lie", houses: { eye: 3, key: 2 } }
                ]
            },
            {
                text: "What do you find most beautiful?",
                answers: [
                    { text: "A defense so perfect that attacks simply slide off harmlessly", houses: { shield: 3, key: 1 } },
                    { text: "A network where information flows perfectly to where it's needed", houses: { web: 3, cloud: 2 } },
                    { text: "An elegant piece of code that solves complexity with simplicity", houses: { code: 3, script: 2 } },
                    { text: "A flaw so subtle that only you can see it", houses: { 'dark-arts': 3, eye: 2 } }
                ]
            },
            {
                text: "What kind of problem catches your attention instantly?",
                answers: [
                    { text: "Something that could become a threat if left unchecked", houses: { shield: 3, eye: 1 } },
                    { text: "A breakdown in communication or connection", houses: { web: 3 } },
                    { text: "Inefficiency or wasted effort that could be eliminated", houses: { script: 3, cloud: 1 } },
                    { text: "An anomaly that doesn't fit the expected pattern", houses: { eye: 3, key: 1 } }
                ]
            },
            {
                text: "When you imagine your truest self at full potential, you are...",
                answers: [
                    { text: "The guardian standing between the innocent and danger", houses: { shield: 3 } },
                    { text: "The weaver of connections that make entire communities thrive", houses: { web: 3, cloud: 1 } },
                    { text: "The creator who brings new things into existence from pure thought", houses: { code: 3, forge: 1 } },
                    { text: "The shadow who knows what lurks in darkness and fears nothing", houses: { 'dark-arts': 3, key: 1 } }
                ]
            }
        ];

        // Quiz state
        let currentQuestion = 0;
        let scores = {};
        Object.keys(houses).forEach(h => scores[h] = 0);

        // Initialize Digital Life
        document.addEventListener('DOMContentLoaded', function() {
            const digitalLife = DigitalLife.createAmbient();
            digitalLife.init(document.body);

            const soundToggle = new SoundToggle(digitalLife, {
                position: 'bottom-right',
                margin: 25
            });
            soundToggle.init();

            document.getElementById('totalQ').textContent = questions.length;
            showQuestion();
        });

        function showQuestion() {
            const q = questions[currentQuestion];

            document.getElementById('questionNumber').textContent =
                'QUESTION ' + toRoman(currentQuestion + 1);
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('currentQ').textContent = currentQuestion + 1;

            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '';

            q.answers.forEach((answer, index) => {
                const btn = document.createElement('div');
                btn.className = 'answer';
                btn.textContent = answer.text;
                btn.onclick = () => selectAnswer(answer.houses, btn);
                answersDiv.appendChild(btn);
            });

            // Re-animate card
            const card = document.getElementById('questionCard');
            card.style.animation = 'none';
            card.offsetHeight; // Trigger reflow
            card.style.animation = 'fadeIn 0.5s ease forwards';
        }

        function selectAnswer(houseScores, btn) {
            // Add points to multiple houses based on weighted scoring
            Object.entries(houseScores).forEach(([house, points]) => {
                scores[house] += points;
            });

            btn.classList.add('selected');

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 400);
        }

        function showResult() {
            // Find highest scoring house
            let maxScore = 0;
            let resultHouse = 'web';
            let closeScores = []; // Track houses within 3 points of max

            Object.entries(scores).forEach(([house, score]) => {
                if (house !== 'divergent' && score > maxScore) {
                    maxScore = score;
                    resultHouse = house;
                }
            });

            // Check for Divergent (multiple houses within 3 points of max)
            Object.entries(scores).forEach(([house, score]) => {
                if (house !== 'divergent' && score >= maxScore - 3) {
                    closeScores.push(house);
                }
            });

            // If 4+ houses are within 3 points, user is Divergent
            const isDivergent = closeScores.length >= 4;

            if (isDivergent) {
                resultHouse = 'divergent';
                localStorage.setItem('hexworth_divergent', 'true');
                console.log('%c⚡ DIVERGENT DETECTED ⚡', 'color: #ff00ff; font-size: 16px; font-weight: bold;');
            } else {
                localStorage.removeItem('hexworth_divergent');
            }

            // Store result
            localStorage.setItem('hexworth_house', resultHouse);
            localStorage.removeItem('hexworth_retake_sorting');

            // Hide question, show result
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';

            const house = houses[resultHouse];

            document.getElementById('resultCrest').textContent = house.crest;
            document.getElementById('resultHouse').textContent = house.name.toUpperCase();
            document.getElementById('resultDomain').textContent = house.domain;
            document.getElementById('resultDescription').textContent = house.description;

            const resultContainer = document.getElementById('resultContainer');
            resultContainer.classList.add(`house-${resultHouse}`);
            resultContainer.classList.add('show');

            // Add special warning for Divergent
            if (isDivergent) {
                const warning = document.createElement('div');
                warning.className = 'divergent-warning';
                warning.textContent = 'ALL PATHS ARE OPEN TO YOU';
                resultContainer.insertBefore(warning, resultContainer.querySelector('.button-group'));
            }
        }

        function showScoreBreakdown() {
            const modal = document.getElementById('scoreModal');
            const scoreList = document.getElementById('scoreList');
            scoreList.innerHTML = '';

            // Sort scores
            const sortedScores = Object.entries(scores)
                .filter(([house]) => house !== 'divergent')
                .sort((a, b) => b[1] - a[1]);

            const maxScore = sortedScores[0][1];

            sortedScores.forEach(([houseId, score], index) => {
                const house = houses[houseId];
                const percentage = (score / maxScore) * 100;

                const item = document.createElement('div');
                item.className = 'score-item';
                if (index === 0) item.classList.add('top');
                item.style.setProperty('--house-color', getHouseColor(houseId));

                item.innerHTML = `
                    <div class="score-house-info">
                        <div class="score-house-icon">${house.crest}</div>
                        <div>
                            <div class="score-house-name">${house.name}</div>
                            <div class="score-house-domain">${house.domain}</div>
                        </div>
                    </div>
                    <div class="score-bar-container">
                        <div class="score-bar" style="width: ${percentage}%"></div>
                    </div>
                    <div class="score-value">${score}</div>
                `;

                scoreList.appendChild(item);
            });

            modal.classList.add('show');
        }

        function closeScoreModal() {
            document.getElementById('scoreModal').classList.remove('show');
        }

        function getHouseColor(houseId) {
            const colors = {
                web: '#60a5fa',
                shield: '#f87171',
                cloud: '#38bdf8',
                forge: '#fbbf24',
                script: '#a78bfa',
                code: '#4ade80',
                key: '#f472b6',
                eye: '#c084fc',
                'dark-arts': '#9333ea'
            };
            return colors[houseId] || '#9f7aea';
        }

        function enterHouse() {
            PageTransition.navigateTo('dashboard.html', 'magic');
        }

        function toRoman(num) {
            const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV'];
            return roman[num - 1] || num;
        }

        // Close modal on background click
        document.getElementById('scoreModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeScoreModal();
            }
        });
    </script>
</body>
</html>
