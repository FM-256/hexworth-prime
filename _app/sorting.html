<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexworth Prime - The Sorting</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☢️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .sorting-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        .sorting-header {
            text-align: center;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }

        .sorting-title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .sorting-subtitle {
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.2em;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Question Card */
        .question-card {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .question-number {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ddd;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer {
            background: rgba(40, 40, 50, 0.5);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .answer:hover {
            border-color: #9f7aea;
            background: rgba(159, 122, 234, 0.1);
            color: #fff;
            transform: translateX(5px);
        }

        .answer.selected {
            border-color: #9f7aea;
            background: rgba(159, 122, 234, 0.2);
            color: #fff;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .progress-bar {
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9f7aea, #38bdf8);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: right;
            font-size: 0.7rem;
            color: #555;
            margin-top: 8px;
            letter-spacing: 0.1em;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
            max-width: 600px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 1s ease forwards;
        }

        .result-announcement {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
        }

        .result-house {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--house-color, #9f7aea), #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-crest {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .result-domain {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 30px;
        }

        .result-description {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .enter-button {
            background: linear-gradient(135deg, #9f7aea, #7c3aed);
            border: none;
            color: #fff;
            padding: 15px 50px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(159, 122, 234, 0.3);
        }

        /* House Colors - Aligned with content-registry.js */
        .house-web { --house-color: #60a5fa; }
        .house-shield { --house-color: #f87171; }
        .house-cloud { --house-color: #38bdf8; }
        .house-forge { --house-color: #fbbf24; }
        .house-script { --house-color: #a78bfa; }
        .house-code { --house-color: #4ade80; }
        .house-key { --house-color: #f472b6; }
        .house-eye { --house-color: #c084fc; }
        .house-dark-arts { --house-color: #6b21a8; }
        .house-divergent { --house-color: #ff00ff; }
        .house-matrix { --house-color: #00ff41; }

        /* Multi-select mode indicator */
        .answer.multi-selected {
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.15);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .answer.multi-selected::before {
            content: '✓ ';
            color: #ff00ff;
        }

        .multi-select-hint {
            font-size: 0.7rem;
            color: #555;
            text-align: center;
            margin-top: 15px;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .multi-select-hint.show {
            opacity: 1;
            color: #ff00ff;
        }

        .confirm-multi {
            display: none;
            margin: 20px auto 0;
            background: linear-gradient(135deg, #ff00ff, #9400d3);
            border: none;
            color: #fff;
            padding: 12px 40px;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: glitchPulse 1.5s ease-in-out infinite;
        }

        .confirm-multi.show {
            display: block;
        }

        .confirm-multi:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(255, 0, 255, 0.4);
        }

        /* ═══════════════════════════════════════════════════════════════
           DIVERGENT / FACTIONLESS - GLITCH THEME
           ═══════════════════════════════════════════════════════════════ */

        /* Glitch text effect */
        @keyframes glitchText {
            0%, 100% {
                text-shadow:
                    -2px 0 #ff00ff,
                    2px 0 #00ffff;
                transform: translate(0);
            }
            20% {
                text-shadow:
                    2px 0 #ff00ff,
                    -2px 0 #00ffff;
                transform: translate(-2px, 1px);
            }
            40% {
                text-shadow:
                    -2px 0 #ff00ff,
                    2px 0 #00ffff;
                transform: translate(2px, -1px);
            }
            60% {
                text-shadow:
                    2px 0 #ff00ff,
                    -2px 0 #00ffff;
                transform: translate(-1px, 2px);
            }
            80% {
                text-shadow:
                    -2px 0 #ff00ff,
                    2px 0 #00ffff;
                transform: translate(1px, -2px);
            }
        }

        @keyframes glitchPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 255, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 255, 0.6), 0 0 35px rgba(0, 255, 255, 0.3); }
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }

        @keyframes colorShift {
            0%, 100% { filter: hue-rotate(0deg); }
            25% { filter: hue-rotate(30deg); }
            50% { filter: hue-rotate(-30deg); }
            75% { filter: hue-rotate(15deg); }
        }

        @keyframes staticNoise {
            0%, 100% { opacity: 0.03; }
            50% { opacity: 0.08; }
        }

        @keyframes rgbSplit {
            0%, 100% {
                text-shadow: -3px 0 #ff0000, 3px 0 #00ffff;
            }
            33% {
                text-shadow: 3px 0 #ff0000, -3px 0 #00ffff;
            }
            66% {
                text-shadow: -2px 2px #ff0000, 2px -2px #00ffff;
            }
        }

        /* Divergent result container */
        .result-container.house-divergent {
            position: relative;
        }

        .result-container.house-divergent::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 2px,
                    rgba(255, 0, 255, 0.03) 2px,
                    rgba(255, 0, 255, 0.03) 4px
                );
            pointer-events: none;
            z-index: -1;
            animation: scanlines 0.1s linear infinite;
        }

        .result-container.house-divergent .result-house {
            animation: glitchText 0.5s ease-in-out infinite, colorShift 3s ease-in-out infinite;
            background: linear-gradient(135deg, #ff00ff, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
        }

        .result-container.house-divergent .result-crest {
            animation: rgbSplit 0.3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.5));
        }

        .result-container.house-divergent .result-announcement {
            animation: glitchText 2s ease-in-out infinite;
            color: #ff00ff;
        }

        .result-container.house-divergent .result-domain {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .result-container.house-divergent .result-description {
            animation: colorShift 5s ease-in-out infinite;
        }

        .result-container.house-divergent .enter-button {
            background: linear-gradient(135deg, #ff00ff, #9400d3, #00ffff);
            background-size: 200% 200%;
            animation: glitchPulse 1.5s ease-in-out infinite;
        }

        .result-container.house-divergent .enter-button:hover {
            animation: glitchPulse 0.5s ease-in-out infinite;
            box-shadow:
                0 0 20px rgba(255, 0, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.3),
                0 10px 30px rgba(255, 0, 255, 0.3);
        }

        /* Divergent warning text */
        .divergent-warning {
            font-size: 0.7rem;
            color: #ff00ff;
            letter-spacing: 0.3em;
            margin-top: 15px;
            animation: glitchText 3s ease-in-out infinite;
            opacity: 0.8;
        }

        /* ═══════════════════════════════════════════════════════════════
           MATRIX - DIGITAL RAIN THEME
           ═══════════════════════════════════════════════════════════════ */

        @keyframes matrixRain {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        @keyframes matrixGlow {
            0%, 100% { text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 30px #00ff41; }
            50% { text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 60px #00ff41; }
        }

        @keyframes terminalBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .result-container.house-matrix {
            position: relative;
        }

        .result-container.house-matrix::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(180deg,
                    transparent 0%,
                    rgba(0, 255, 65, 0.03) 50%,
                    transparent 100%);
            background-size: 100% 8px;
            pointer-events: none;
            z-index: -1;
            animation: matrixRain 0.5s linear infinite;
        }

        .result-container.house-matrix .result-house {
            animation: matrixGlow 2s ease-in-out infinite;
            background: linear-gradient(135deg, #00ff41, #00aa2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.2em;
        }

        .result-container.house-matrix .result-crest {
            filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.8));
            animation: matrixGlow 1.5s ease-in-out infinite;
        }

        .result-container.house-matrix .result-announcement {
            color: #00ff41;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.4em;
        }

        .result-container.house-matrix .result-domain {
            color: #00aa2a;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            font-family: 'Courier New', monospace;
        }

        .result-container.house-matrix .result-description {
            color: #88ff88;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .result-container.house-matrix .enter-button {
            background: linear-gradient(135deg, #00ff41, #00aa2a);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.3em;
            animation: matrixGlow 2s ease-in-out infinite;
        }

        .result-container.house-matrix .enter-button:hover {
            box-shadow:
                0 0 20px rgba(0, 255, 65, 0.5),
                0 0 40px rgba(0, 255, 65, 0.3),
                0 10px 30px rgba(0, 255, 65, 0.3);
        }

        .matrix-welcome {
            font-size: 0.7rem;
            color: #00ff41;
            letter-spacing: 0.3em;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            opacity: 0.8;
        }

        .matrix-welcome::after {
            content: '_';
            animation: terminalBlink 1s infinite;
        }

        /* Static noise overlay for divergent */
        .static-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 1000;
            animation: staticNoise 0.2s linear infinite;
        }

        .static-overlay.active {
            display: block;
        }

        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 0.2em;
            z-index: 10;
        }

        /* Returning User Sign-in */
        .returning-user {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .returning-user p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .signin-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(57, 255, 20, 0.5);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }

        .signin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .signin-note {
            font-size: 0.7rem !important;
            color: #444 !important;
            margin-top: 8px !important;
        }

        .divider-text {
            text-align: center;
            margin: 20px 0;
            opacity: 0;
            animation: fadeIn 1s ease 0.6s forwards;
        }

        .divider-text span {
            display: inline-block;
            padding: 0 20px;
            color: #444;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            position: relative;
        }

        .divider-text span::before,
        .divider-text span::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #333);
        }

        .divider-text span::before {
            right: 100%;
            background: linear-gradient(90deg, transparent, #333);
        }

        .divider-text span::after {
            left: 100%;
            background: linear-gradient(90deg, #333, transparent);
        }

        .returning-user.hidden,
        .divider-text.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .question-card {
                padding: 25px 20px;
            }
            .question-text {
                font-size: 1rem;
            }
            .answer {
                font-size: 0.85rem;
                padding: 12px 15px;
            }
            .result-house {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="sorting-container">
        <div class="sorting-header">
            <h1 class="sorting-title">The Sorting</h1>
            <p class="sorting-subtitle">Answer truthfully. The algorithm knows.</p>
        </div>

        <!-- Returning user sign-in option -->
        <div class="returning-user" id="returningUser">
            <p>Already have an account?</p>
            <button class="signin-btn" id="signinBtn" onclick="signInReturningUser()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <p class="signin-note">Your house and progress will be restored</p>
        </div>

        <div class="divider-text" id="dividerText">
            <span>or take the sorting quiz</span>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text"><span id="currentQ">1</span> / <span id="totalQ">15</span></div>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-number" id="questionNumber">QUESTION I</div>
            <div class="question-text" id="questionText"></div>
            <div class="answers" id="answers"></div>
            <div class="multi-select-hint" id="multiHint">MULTI-SELECT ACTIVE</div>
            <button class="confirm-multi" id="confirmMulti">CONFIRM SELECTIONS</button>
        </div>

        <!-- Static noise overlay for Divergent reveal -->
        <div class="static-overlay" id="staticOverlay"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-announcement">YOU BELONG TO</div>
            <div class="result-crest" id="resultCrest"></div>
            <div class="result-house" id="resultHouse"></div>
            <div class="result-domain" id="resultDomain"></div>
            <div class="result-description" id="resultDescription"></div>
            <button class="enter-button" onclick="enterHouse()">ENTER</button>
        </div>
    </div>

    <div class="footer-note">HEXWORTH PRIME</div>

    <!-- Transitions -->
    <link rel="stylesheet" href="styles/transitions.css">

    <!-- Digital Life Scripts -->
    <script src="config/cipher.js"></script>

    <script src="digital-life/effects/Trails.js"></script>
    <script src="digital-life/entities/BlackHole.js"></script>
    <script src="digital-life/entities/Moon.js"></script>
    <script src="digital-life/entities/Planet.js"></script>
    <script src="digital-life/entities/EnergyWell.js"></script>
    <script src="digital-life/entities/PredatorStar.js"></script>

    <script src="digital-life/entities/VoidSerpent.js"></script>

    <script src="digital-life/entities/Portal.js"></script>

        async function signInReturningUser() {
            const btn = document.getElementById('signinBtn');
            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            try {
                // Wait for Firebase to initialize
                await FirebaseAuth.init();

                // Sign in with Google
                const user = await FirebaseAuth.signInWithGoogle();

                if (user) {
                    btn.innerHTML = 'Checking profile...';

                    // Initialize Firestore and check for existing profile
                    await FirestoreManager.init();
                    const profile = await FirestoreManager.getUserProfile(user.uid);

                    if (profile && profile.house) {
                        // User has existing house - restore to localStorage and redirect
                        localStorage.setItem('hexworth_house', profile.house);
                        btn.innerHTML = 'Welcome back! Redirecting...';

                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        // User signed in but no house - let them take the quiz
                        btn.innerHTML = 'No house found - take the quiz below';
                        btn.disabled = false;

                        // Hide sign-in section after a moment
                        setTimeout(() => {
                            document.getElementById('returningUser').classList.add('hidden');
                            document.getElementById('dividerText').classList.add('hidden');
                        }, 2000);
                    }
                } else {
                    btn.innerHTML = 'Sign in with Google';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Sign-in error:', error);
                btn.innerHTML = 'Sign in with Google';
                btn.disabled = false;
            }
        }

            // Re-animate card
            const card = document.getElementById('questionCard');
            card.style.animation = 'none';
            card.offsetHeight; // Trigger reflow
            card.style.animation = 'fadeIn 0.5s ease forwards';
        }

        function selectAnswer(house, btn, event) {
            // MULTI-SELECT MODE: If Shift is held, allow toggling multiple answers
            if (shiftHeld || currentSelections.length > 0) {
                // Toggle this selection
                const existingIndex = currentSelections.findIndex(s => s.house === house);

                if (existingIndex >= 0) {
                    // Remove selection
                    currentSelections.splice(existingIndex, 1);
                    btn.classList.remove('multi-selected');
                } else {
                    // Add selection
                    currentSelections.push({ house, btn });
                    btn.classList.add('multi-selected');
                }

                // Show/hide hint and confirm button
                if (currentSelections.length > 0) {
                    document.getElementById('multiHint').classList.add('show');
                }
                if (currentSelections.length >= 2) {
                    document.getElementById('confirmMulti').classList.add('show');
                } else {
                    document.getElementById('confirmMulti').classList.remove('show');
                }

                // If only 1 selection and shift released, treat as normal
                if (currentSelections.length === 1 && !shiftHeld) {
                    confirmMultiSelections();
                }

                return;  // Don't advance yet
            }

            // NORMAL MODE: Single selection, advance immediately
            scores[house]++;
            btn.classList.add('selected');

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 350);
        }

        // Confirm multi-selections and advance
        function confirmMultiSelections() {
            if (currentSelections.length === 0) return;

            // ═══════════════════════════════════════════════════════════════
            // SECRET SHORTCUT: Select ALL answers on Question 2 = Instant Factionless
            // ═══════════════════════════════════════════════════════════════
            const totalAnswers = questions[currentQuestion].answers.length;
            if (currentQuestion === 1 && currentSelections.length === totalAnswers) {
                console.log('%c⚡ ALL ANSWERS SELECTED ON Q2 - INSTANT FACTIONLESS! ⚡', 'color: #ff00ff; font-size: 14px; font-weight: bold;');

                // Mark all as selected visually
                currentSelections.forEach(selection => {
                    selection.btn.classList.add('selected');
                });

                // Force Divergent mode
                multiSelectQuestions = DIVERGENT_THRESHOLD + 10; // Way over threshold

                // Brief dramatic pause then show result
                setTimeout(() => {
                    showResult();
                }, 500);
                return;
            }

            // Count this as a multi-select question if 2+ were chosen
            if (currentSelections.length >= 2) {
                multiSelectQuestions++;
                console.log(`%c⚡ Divergent signal detected! (${multiSelectQuestions}/${DIVERGENT_THRESHOLD})`, 'color: #ff00ff; font-weight: bold;');
            }

            // Add points for all selected houses
            currentSelections.forEach(selection => {
                scores[selection.house]++;
                selection.btn.classList.add('selected');
            });

            // Brief delay then advance
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 350);
        }

        // Set up confirm button click handler
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('confirmMulti').onclick = confirmMultiSelections;
        });

        function showResult() {
            console.log('%c[SORTING] showResult() called', 'color: #00ff00');

            // CHECK FOR DIVERGENT FIRST
            // If user selected multiple answers on 3+ questions, they are Divergent
            const isDivergent = multiSelectQuestions >= DIVERGENT_THRESHOLD;
            console.log(`%c[SORTING] isDivergent: ${isDivergent} (multiSelectQuestions: ${multiSelectQuestions})`, 'color: #00ff00');

            let resultHouse;

            if (isDivergent) {
                // ═══════════════════════════════════════════════════════════════
                // DIVERGENT PATH - The Factionless
                // ═══════════════════════════════════════════════════════════════
                resultHouse = 'divergent';

                // Dramatic glitch reveal
                const staticOverlay = document.getElementById('staticOverlay');
                staticOverlay.classList.add('active');

                // Flash effect
                document.body.style.transition = 'filter 0.1s ease';
                let flashes = 0;
                const flashInterval = setInterval(() => {
                    document.body.style.filter = flashes % 2 === 0 ? 'invert(1) hue-rotate(180deg)' : 'none';
                    flashes++;
                    if (flashes > 6) {
                        clearInterval(flashInterval);
                        document.body.style.filter = 'none';
                    }
                }, 100);

                // Console message
                console.log('%c════════════════════════════════════════', 'color: #ff00ff;');
                console.log('%c⚡ D I V E R G E N T   D E T E C T E D ⚡', 'color: #ff00ff; font-size: 16px; font-weight: bold; text-shadow: 0 0 10px #00ffff;');
                console.log('%cYou cannot be contained.', 'color: #00ffff; font-style: italic;');
                console.log('%c════════════════════════════════════════', 'color: #ff00ff;');

                // Store special Divergent flags
                localStorage.setItem('hexworth_divergent', 'true');
                localStorage.setItem('hexworth_house_hopper', 'true');

                // Remove static after delay
                setTimeout(() => {
                    staticOverlay.classList.remove('active');
                }, 1500);

            } else {
                // ═══════════════════════════════════════════════════════════════
                // NORMAL PATH - Standard house sorting
                // ═══════════════════════════════════════════════════════════════
                let maxScore = 0;
                resultHouse = 'web';

                // Find highest scoring house (exclude divergent from normal sorting)
                Object.entries(scores).forEach(([house, score]) => {
                    if (house !== 'divergent' && score > maxScore) {
                        maxScore = score;
                        resultHouse = house;
                    }
                });

                // Clear any divergent flags if they somehow exist
                localStorage.removeItem('hexworth_divergent');
                localStorage.removeItem('hexworth_house_hopper');
            }

            // Store result
            console.log(`%c[SORTING] Storing house: ${resultHouse}`, 'color: #00ff00');
            localStorage.setItem('hexworth_house', resultHouse);

            try {
                // Hide question, show result
                console.log('%c[SORTING] Hiding question card...', 'color: #00ff00');
                document.getElementById('questionCard').style.display = 'none';
                document.querySelector('.progress-container').style.display = 'none';

                const house = houses[resultHouse];
                console.log('%c[SORTING] House data:', 'color: #00ff00', house);

                if (!house) {
                    console.error('[SORTING] ERROR: house not found for:', resultHouse);
                    return;
                }

                document.getElementById('resultCrest').textContent = house.crest;
                document.getElementById('resultHouse').textContent = house.name.toUpperCase();
                document.getElementById('resultDomain').textContent = house.domain;
                document.getElementById('resultDescription').textContent = house.description;

                // Apply house color class
                const resultContainer = document.getElementById('resultContainer');
                resultContainer.classList.add(`house-${resultHouse}`);
                resultContainer.classList.add('show');
                console.log('%c[SORTING] Result container shown!', 'color: #00ff00; font-weight: bold');

                // Add special warning for Divergent
                if (isDivergent) {
                    const warning = document.createElement('div');
                    warning.className = 'divergent-warning';
                    warning.textContent = 'YOU HAVE ACCESS TO ALL HOUSES';
                    resultContainer.insertBefore(warning, resultContainer.querySelector('.enter-button'));
                    console.log('%c[SORTING] Divergent warning added!', 'color: #ff00ff; font-weight: bold');
                }

                // Add special welcome for Matrix
                if (resultHouse === 'matrix') {
                    const welcome = document.createElement('div');
                    welcome.className = 'matrix-welcome';
                    welcome.textContent = 'WELCOME TO THE REAL WORLD';
                    resultContainer.insertBefore(welcome, resultContainer.querySelector('.enter-button'));
                    console.log('%c[SORTING] Matrix welcome added!', 'color: #00ff41; font-weight: bold');

                    // Console Easter egg for Matrix users
                    console.log('%c════════════════════════════════════════', 'color: #00ff41;');
                    console.log('%c💊 T H E   M A T R I X   A W A I T S 💊', 'color: #00ff41; font-size: 16px; font-weight: bold;');
                    console.log('%cYou refused to accept limitations.', 'color: #00aa2a; font-style: italic;');
                    console.log('%c════════════════════════════════════════', 'color: #00ff41;');

                    // Store Matrix flag
                    localStorage.setItem('hexworth_matrix', 'true');
                }
            } catch (err) {
                console.error('[SORTING] ERROR in showResult:', err);
            }
        }

        function enterHouse() {
            // Navigate to the house dashboard with transition
            PageTransition.navigateTo('dashboard.html', 'magic');
        }

        function toRoman(num) {
            const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX'];
            return roman[num - 1] || num;
        }
    </script>
</body>
</html>
