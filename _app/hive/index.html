<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hive — Basement Level 1</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: rgba(255,255,255,0.85);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Header */
        .hive-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #0e0e0e;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            height: 44px;
            flex-shrink: 0;
        }
        .hive-header-back {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .hive-header-back:hover {
            color: rgba(255,255,255,0.7);
        }
        .hive-header-title {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: #cc0000;
            text-transform: uppercase;
        }
        .hive-header-depth {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }

        /* Main layout */
        .hive-layout {
            display: flex;
            height: calc(100vh - 44px);
        }

        /* Map panel — left 60% */
        .hive-map-panel {
            flex: 0 0 60%;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(255,255,255,0.08);
        }
        #hive-map {
            width: 100%;
            height: 100%;
        }

        /* Room panel — right 40% */
        .hive-room-panel-container {
            flex: 0 0 40%;
            overflow: hidden;
            position: relative;
        }
        #hive-room {
            width: 100%;
            height: 100%;
        }

        /* Mobile: stack vertically */
        @media (max-width: 768px) {
            .hive-layout {
                flex-direction: column;
            }
            .hive-map-panel {
                flex: 0 0 45%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }
            .hive-room-panel-container {
                flex: 1;
            }
        }

        /* Very small screens */
        @media (max-width: 480px) {
            .hive-header {
                padding: 8px 12px;
                height: 38px;
            }
            .hive-header-title {
                font-size: 0.6rem;
            }
            .hive-layout {
                height: calc(100vh - 38px);
            }
            .hive-map-panel {
                flex: 0 0 40%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="hive-header">
        <a href="../dashboard.html" class="hive-header-back">&larr; DASHBOARD</a>
        <div class="hive-header-title">THE HIVE / BASEMENT LEVEL 1</div>
        <div class="hive-header-depth">DEPTH: PRISTINE</div>
    </div>

    <!-- Split-screen layout -->
    <div class="hive-layout">
        <!-- Left: SVG Map -->
        <div class="hive-map-panel">
            <div id="hive-map"></div>
        </div>

        <!-- Right: Room Panel -->
        <div class="hive-room-panel-container">
            <div id="hive-room"></div>
        </div>
    </div>

    <!-- Scripts: dependencies first, engine last -->
    <script src="engine/RedQueen.js"></script>
    <script src="engine/PuzzleRenderer.js"></script>
    <script src="engine/RoomRenderer.js"></script>
    <script src="engine/MapRenderer.js"></script>
    <script src="engine/HiveEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            HiveEngine.init();
        });
    </script>

</body>
</html>
