<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hexworth Arcade | Games, Reviews & Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 1px solid #333;
            padding: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #93c5fd;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header .subtitle {
            color: #9ca3af;
            font-size: 1.1rem;
        }

        /* Search and Filter Section */
        .controls {
            background: #1a1a1a;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #333;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 12px;
            color: #e5e5e5;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        .filter-section {
            margin-bottom: 1rem;
        }

        .filter-label {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
            font-weight: 600;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: #60a5fa;
            color: #60a5fa;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #60a5fa;
            border-color: #60a5fa;
            color: #0a0a0a;
            font-weight: 600;
        }

        /* House color variations for active house filters */
        .filter-btn.active[data-house="web"] { background: #3b82f6; border-color: #3b82f6; }
        .filter-btn.active[data-house="script"] { background: #7c3aed; border-color: #7c3aed; }
        .filter-btn.active[data-house="key"] { background: #eab308; border-color: #eab308; }
        .filter-btn.active[data-house="eye"] { background: #6366f1; border-color: #6366f1; }
        .filter-btn.active[data-house="code"] { background: #ec4899; border-color: #ec4899; }
        .filter-btn.active[data-house="forge"] { background: #f97316; border-color: #f97316; }
        .filter-btn.active[data-house="shield"] { background: #ef4444; border-color: #ef4444; }
        .filter-btn.active[data-house="cloud"] { background: #06b6d4; border-color: #06b6d4; }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-header {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-count {
            color: #9ca3af;
            font-size: 1.2rem;
            font-weight: 400;
        }

        /* Game Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        /* Game Card */
        .game-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--house-color);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--house-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--house-glow);
        }

        /* House colors */
        .game-card[data-house="web"] { --house-color: #3b82f6; --house-glow: rgba(59, 130, 246, 0.3); }
        .game-card[data-house="script"] { --house-color: #7c3aed; --house-glow: rgba(124, 58, 237, 0.3); }
        .game-card[data-house="key"] { --house-color: #eab308; --house-glow: rgba(234, 179, 8, 0.3); }
        .game-card[data-house="eye"] { --house-color: #6366f1; --house-glow: rgba(99, 102, 241, 0.3); }
        .game-card[data-house="code"] { --house-color: #ec4899; --house-glow: rgba(236, 72, 153, 0.3); }
        .game-card[data-house="forge"] { --house-color: #f97316; --house-glow: rgba(249, 115, 22, 0.3); }
        .game-card[data-house="shield"] { --house-color: #ef4444; --house-glow: rgba(239, 68, 68, 0.3); }
        .game-card[data-house="cloud"] { --house-color: #06b6d4; --house-glow: rgba(6, 182, 212, 0.3); }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e5e5e5;
        }

        .game-desc {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .game-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-type {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }

        /* Category badge colors: game=green, review=blue, lab=amber */
        .badge-category-game {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .badge-category-review {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        .badge-category-lab {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        /* Category filter button active states */
        .filter-btn.active[data-category="game"] { background: #22c55e; border-color: #22c55e; color: #0a0a0a; }
        .filter-btn.active[data-category="review"] { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .filter-btn.active[data-category="lab"] { background: #f59e0b; border-color: #f59e0b; color: #0a0a0a; }

        .badge-house {
            background: rgba(var(--house-rgb), 0.2);
            color: var(--house-color);
        }

        /* House badge colors */
        .game-card[data-house="web"] .badge-house { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .game-card[data-house="script"] .badge-house { background: rgba(124, 58, 237, 0.2); color: #7c3aed; }
        .game-card[data-house="key"] .badge-house { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .game-card[data-house="eye"] .badge-house { background: rgba(99, 102, 241, 0.2); color: #6366f1; }
        .game-card[data-house="code"] .badge-house { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .game-card[data-house="forge"] .badge-house { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .game-card[data-house="shield"] .badge-house { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .game-card[data-house="cloud"] .badge-house { background: rgba(6, 182, 212, 0.2); color: #06b6d4; }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #e5e5e5;
        }

        .no-results p {
            font-size: 1rem;
        }

        /* Hidden class for filtering */
        .hidden {
            display: none !important;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .filter-buttons {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 1rem;
            }

            .header {
                padding: 1rem;
            }

            .controls {
                padding: 1rem;
            }
        }

        /* Animation for filtered items */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .game-card {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>

            { title: "Don't Kill the Server", house: "script", type: "dont", category: "game", icon: "🎮", desc: "Keep the server running under attack", href: "houses/script/games/dont-kill-the-server.html" },
            { title: "Don't Leak the Key", house: "key", type: "dont", category: "game", icon: "🎮", desc: "Protect secrets under pressure", href: "houses/key/games/dont-leak-the-key.html" },
            { title: "Don't Feed the Troll", house: "eye", type: "dont", category: "game", icon: "🎮", desc: "Social media crisis management", href: "houses/eye/games/dont-feed-the-troll.html" },
            { title: "Don't Deploy on Friday", house: "code", type: "dont", category: "game", icon: "🎮", desc: "Survive the Friday deploy", href: "houses/code/games/dont-deploy-on-friday.html" },
            { title: "Don't Brick the PC", house: "forge", type: "dont", category: "game", icon: "🎮", desc: "Hardware survival challenge", href: "houses/forge/games/dont-brick-the-pc.html" },
            { title: "Don't Anger the Printer", house: "forge", type: "dont", category: "game", icon: "🎮", desc: "Printer troubleshooting nightmare", href: "houses/forge/games/dont-anger-the-printer.html" },
            { title: "Don't Get Phished", house: "shield", type: "dont", category: "game", icon: "🎮", desc: "Spear-phishing defense", href: "houses/shield/games/dont-get-phished.html" },
            { title: "Don't Check the Bill", house: "cloud", type: "dont", category: "game", icon: "🎮", desc: "AWS cost control crisis", href: "houses/cloud/games/dont-check-the-bill.html" },
            { title: "Don't Lose Your Domain", house: "cloud", type: "dont", category: "game", icon: "🎮", desc: "Domain registration disaster", href: "houses/cloud/games/dont-lose-your-domain.html" }
        ];

        // Type display names and icons (game sub-types: adventure, runner, challenge, dont)
        const TYPE_INFO = {
            adventure: { name: 'Text Adventures', icon: '📟' },
            runner: { name: 'Pixel Runners', icon: '🕹️' },
            challenge: { name: 'Challenges & Puzzles', icon: '🎮' },
            dont: { name: "Don't Series", icon: '💀' }
        };

        // Category display info (top-level classification from audit)
        const CATEGORY_INFO = {
            game: { name: 'GAME', badgeClass: 'badge-category-game' },
            review: { name: 'REVIEW', badgeClass: 'badge-category-review' },
            lab: { name: 'LAB', badgeClass: 'badge-category-lab' }
        };

        // House display names
        const HOUSE_NAMES = {
            web: 'Web',
            script: 'Script',
            key: 'Key',
            eye: 'Eye',
            code: 'Code',
            forge: 'Forge',
            shield: 'Shield',
            cloud: 'Cloud'
        };

        // State
        let currentTypeFilter = 'all';
        let currentHouseFilter = 'all';
        let currentCategoryFilter = 'all';
        let currentSearchTerm = '';

        // Create a game card element
        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.dataset.house = game.house;
            card.dataset.type = game.type;
            card.dataset.category = game.category;
            card.dataset.title = game.title.toLowerCase();
            card.dataset.desc = game.desc.toLowerCase();

            const catInfo = CATEGORY_INFO[game.category];

            card.innerHTML = `
                <span class="game-icon">${game.icon}</span>
                <div class="game-title">${game.title}</div>
                <div class="game-desc">${game.desc}</div>
                <div class="game-badges">
                    <span class="badge ${catInfo.badgeClass}">${catInfo.name}</span>
                    <span class="badge badge-type">${TYPE_INFO[game.type].icon} ${game.type}</span>
                    <span class="badge badge-house">${HOUSE_NAMES[game.house]}</span>
                </div>
            `;

            card.addEventListener('click', () => {
                window.location.href = game.href;
            });

            return card;
        }

        // Render games organized by type
        function renderGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            // Group games by type
            const gamesByType = {
                adventure: [],
                runner: [],
                challenge: [],
                dont: []
            };

            GAMES.forEach(game => {
                gamesByType[game.type].push(game);
            });

            // Render each category
            Object.entries(TYPE_INFO).forEach(([type, info]) => {
                if (gamesByType[type].length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.dataset.category = type;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    ${info.icon} ${info.name}
                    <span class="category-count">(${gamesByType[type].length})</span>
                `;

                const grid = document.createElement('div');
                grid.className = 'games-grid';
                grid.dataset.typeGrid = type;

                gamesByType[type].forEach(game => {
                    grid.appendChild(createGameCard(game));
                });

                section.appendChild(header);
                section.appendChild(grid);
                container.appendChild(section);
            });

            updateCategorySummary();
            applyFilters();
        }

        // Update the subtitle with category counts
        function updateCategorySummary() {
            const counts = { game: 0, review: 0, lab: 0 };
            GAMES.forEach(g => counts[g.category]++);
            const summary = document.getElementById('category-summary');
            summary.textContent = `${counts.game} Games, ${counts.review} Reviews, ${counts.lab} Labs`;
        }

        // Apply current filters
        function applyFilters() {
            const searchTerm = currentSearchTerm.toLowerCase();
            let visibleCount = 0;

            // Get all game cards
            const allCards = document.querySelectorAll('.game-card');

            allCards.forEach(card => {
                const matchesType = currentTypeFilter === 'all' || card.dataset.type === currentTypeFilter;
                const matchesHouse = currentHouseFilter === 'all' || card.dataset.house === currentHouseFilter;
                const matchesCategory = currentCategoryFilter === 'all' || card.dataset.category === currentCategoryFilter;

                // Search matches on title, description, house name, and category
                const houseName = HOUSE_NAMES[card.dataset.house] || '';
                const categoryName = card.dataset.category || '';
                const typeName = card.dataset.type || '';
                const matchesSearch = searchTerm === '' ||
                                     card.dataset.title.includes(searchTerm) ||
                                     card.dataset.desc.includes(searchTerm) ||
                                     houseName.toLowerCase().includes(searchTerm) ||
                                     categoryName.toLowerCase().includes(searchTerm) ||
                                     typeName.toLowerCase().includes(searchTerm);

                if (matchesType && matchesHouse && matchesCategory && matchesSearch) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            // Update category visibility and counts
            document.querySelectorAll('.category-section').forEach(section => {
                const grid = section.querySelector('.games-grid');
                const visibleInCategory = grid.querySelectorAll('.game-card:not(.hidden)').length;

                if (visibleInCategory === 0) {
                    section.classList.add('hidden');
                } else {
                    section.classList.remove('hidden');
                    const countSpan = section.querySelector('.category-count');
                    countSpan.textContent = `(${visibleInCategory})`;
                }
            });

            // Update total count
            document.getElementById('total-count').textContent = visibleCount;

            // Show/hide no results message
            const noResults = document.getElementById('no-results');
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
                document.getElementById('games-container').classList.add('hidden');
            } else {
                noResults.classList.add('hidden');
                document.getElementById('games-container').classList.remove('hidden');
            }
        }

        // Set up filter buttons
        function setupFilters() {
            // Category filters (game / review / lab)
            document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#category-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategoryFilter = btn.dataset.category;
                    applyFilters();
                });
            });

            // Type filters (adventure, runner, challenge, dont)
            document.querySelectorAll('#type-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#type-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTypeFilter = btn.dataset.type;
                    applyFilters();
                });
            });

            // House filters
            document.querySelectorAll('#house-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#house-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentHouseFilter = btn.dataset.house;
                    applyFilters();
                });
            });

            // Search input
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value;
                applyFilters();
            });
        }

        // Initialize the arcade
        function init() {
            renderGames();
            setupFilters();
            console.log(`Hexworth Arcade initialized with ${GAMES.length} activities (${GAMES.filter(g => g.category === 'game').length} games, ${GAMES.filter(g => g.category === 'review').length} reviews, ${GAMES.filter(g => g.category === 'lab').length} labs)`);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
