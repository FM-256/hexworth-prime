<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lockscreen Test</title>
    <style>
        body { background: #0f1117; color: #e2e8f0; font-family: sans-serif; padding: 40px; }
        h1 { margin-bottom: 12px; }
        p { color: #94a3b8; margin-bottom: 24px; }
        button {
            padding: 10px 24px; border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 8px;
        }
        .btn-lock { background: #ef4444; color: #fff; }
        .btn-clear { background: #22c55e; color: #0f1117; }
    </style>
</head>
<body>
    <h1>Roxy the T-Rex — Lockscreen Test</h1>
    <p>Click "Engage Lockscreen" to simulate a violated integrity flag. This sets localStorage and summons Roxy.</p>
    <button class="btn-lock" onclick="engage()">Engage Lockscreen</button>
    <button class="btn-clear" onclick="clearIt()">Clear Flag (Admin Reset)</button>

<script>
function engage() {
    // Set a fake integrity violation (backdated 5 days)
    var fiveDaysAgo = new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString();
    localStorage.setItem('hexworth_integrity', JSON.stringify({
        status: 'violated',
        detectedAt: fiveDaysAgo,
        garbageCount: 145,
        peakGarbage: 243
    }));
    // Load the lockscreen script
    var s = document.createElement('script');
    s.src = '/components/IntegrityLockscreen.js';
    document.head.appendChild(s);
}

function clearIt() {
    localStorage.removeItem('hexworth_integrity');
    location.reload();
}
</script>
</body>
</html>
