<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Surveys | Handler Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 24px;
        }

        /* ── Header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #06b6d4;
        }
        .page-header .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls select, .controls button {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .controls select:hover, .controls button:hover {
            border-color: #06b6d4;
        }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #8b949e;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #e6edf3; }
        .tab-btn.active {
            color: #06b6d4;
            border-bottom-color: #06b6d4;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Cards ── */
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 1rem;
            color: #06b6d4;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .card h3 {
            font-size: 0.9rem;
            color: #e6edf3;
            margin-bottom: 10px;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #06b6d4;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .btn {
            background: #06b6d4;
            color: #0d1117;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn.secondary {
            background: #30363d;
            color: #e6edf3;
        }
        .btn.danger {
            background: #f87171;
            color: #0d1117;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ── Question Builder ── */
        .question-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }
        .question-block .q-number {
            font-size: 0.75rem;
            color: #06b6d4;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .question-block .remove-q {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }
        .options-list {
            margin-top: 8px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .option-row input {
            flex: 1;
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .option-row button {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .add-option {
            background: none;
            border: 1px dashed #30363d;
            color: #8b949e;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* ── Template Buttons ── */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .template-btn {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            color: #e6edf3;
            font-size: 0.85rem;
        }
        .template-btn:hover {
            border-color: #06b6d4;
        }
        .template-btn .t-name {
            font-weight: 600;
            color: #06b6d4;
        }
        .template-btn .t-count {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 4px;
        }

        /* ── Survey List ── */
        .survey-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .survey-item .si-title {
            font-weight: 600;
            color: #e6edf3;
        }
        .survey-item .si-meta {
            font-size: 0.8rem;
            color: #8b949e;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active { background: #0e4429; color: #4ade80; }
        .badge-closed { background: #21262d; color: #8b949e; }

        /* ── Student Response Form ── */
        .response-form .question-text {
            font-size: 0.95rem;
            color: #e6edf3;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .response-form .scale-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .scale-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .scale-btn:hover { border-color: #06b6d4; }
        .scale-btn.selected {
            background: #06b6d4;
            color: #0d1117;
            border-color: #06b6d4;
        }
        .scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #8b949e;
            margin-top: 2px;
        }

        .mc-option {
            display: block;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: border-color 0.15s;
        }
        .mc-option:hover { border-color: #06b6d4; }
        .mc-option.selected {
            border-color: #06b6d4;
            background: #0c2d3f;
        }

        /* ── Results Charts ── */
        .result-block {
            margin-bottom: 24px;
        }
        .result-block .q-text {
            font-size: 0.9rem;
            color: #e6edf3;
            margin-bottom: 10px;
        }
        .bar-chart-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }
        .bar-label {
            min-width: 100px;
            text-align: right;
            color: #8b949e;
            flex-shrink: 0;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #06b6d4;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .bar-count {
            min-width: 30px;
            color: #8b949e;
        }
        .avg-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: #06b6d4;
            margin-bottom: 4px;
        }
        .avg-sub {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 40px 20px;
            font-size: 0.9rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #8b949e;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #30363d;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #161b22;
            border: 1px solid #06b6d4;
            border-radius: 8px;
            padding: 12px 20px;
            color: #e6edf3;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }
        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="page-header">
        <div>
            <h1>Pulse Surveys</h1>
            <div class="subtitle">Quick check-ins and feedback collection</div>
        </div>
        <div class="controls">
            <select id="classSelect">
                <option value="">-- Select Class --</option>
            </select>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="create">Create Survey</button>
        <button class="tab-btn" data-tab="respond">Respond</button>
        <button class="tab-btn" data-tab="results">Results</button>
    </div>

    <!-- CREATE TAB -->
    <div class="tab-content active" id="tab-create">
        <div class="card">
            <h2>Quick Templates</h2>
            <div class="template-grid" id="templateGrid"></div>
        </div>

        <div class="card">
            <h2>Build Survey</h2>
            <div class="form-group">
                <label>Survey Title</label>
                <input type="text" id="surveyTitle" placeholder="e.g. Week 5 Check-In" maxlength="100">
            </div>

            <div id="questionsContainer"></div>

            <div class="btn-row">
                <button class="btn secondary" id="addQuestionBtn">+ Add Question</button>
                <button class="btn" id="createSurveyBtn">Create Survey</button>
            </div>
            <div style="font-size:0.75rem;color:#8b949e;margin-top:8px">Maximum 5 questions per survey</div>
        </div>
    </div>

    <!-- RESPOND TAB -->
    <div class="tab-content" id="tab-respond">
        <div id="respondContainer">
            <div class="empty-state">Select a class to see active surveys</div>
        </div>
    </div>

    <!-- RESULTS TAB -->
    <div class="tab-content" id="tab-results">
        <div id="resultsContainer">
            <div class="empty-state">Select a class to see survey results</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Dependencies -->
    <script src="/components/FirebaseAuth.js"></script>
    <script src="/components/FirestoreManager.js"></script>
    <script src="/components/ClassManager.js"></script>
    <script src="/components/analytics/PulseSurvey.js"></script>

    <script>
    (function() {
        'use strict';

        let currentClassId = null;
        let questionCount = 0;
        let isHandler = false;

        // ── Init ──
        async function init() {
            try {
                await PulseSurvey.init();
                await loadClasses();
                setupTabs();
                renderTemplates();
                setupCreateForm();
                detectRole();

                document.getElementById('classSelect').addEventListener('change', onClassChange);
            } catch (e) {
                console.error('[PulseSurveyUI] Init failed:', e);
            }
        }

        async function loadClasses() {
            if (typeof ClassManager === 'undefined') return;
            await ClassManager.init();

            // Try handler's classes first, then student's
            let classes = [];
            try {
                classes = await ClassManager.listMyClasses();
                if (classes.length > 0) isHandler = true;
            } catch (e) { /* not a handler */ }

            if (classes.length === 0) {
                try {
                    classes = await ClassManager.listJoinedClasses();
                } catch (e) { /* no classes */ }
            }

            const sel = document.getElementById('classSelect');
            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name || c.code || c.id;
                sel.appendChild(opt);
            });

            // Auto-show correct tab based on role
            if (!isHandler) {
                document.querySelector('[data-tab="respond"]').click();
            }
        }

        function detectRole() {
            if (typeof FirebaseAuth !== 'undefined' && FirebaseAuth.getUser) {
                const user = FirebaseAuth.getUser();
                if (user && user.role === 'handler') {
                    isHandler = true;
                }
            }
        }

        function onClassChange(e) {
            currentClassId = e.target.value;
            if (currentClassId) {
                loadActiveSurveys();
                loadAllSurveys();
            }
        }

        // ── Tabs ──
        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                });
            });
        }

        // ── Templates ──
        function renderTemplates() {
            const grid = document.getElementById('templateGrid');
            grid.innerHTML = '';

            Object.entries(PulseSurvey.TEMPLATES).forEach(([key, tpl]) => {
                const div = document.createElement('div');
                div.className = 'template-btn';
                div.innerHTML = `<div class="t-name">${_esc(tpl.name)}</div><div class="t-count">${tpl.questions.length} questions</div>`;
                div.addEventListener('click', () => loadTemplate(key));
                grid.appendChild(div);
            });
        }

        function loadTemplate(key) {
            const tpl = PulseSurvey.TEMPLATES[key];
            if (!tpl) return;

            document.getElementById('surveyTitle').value = tpl.name;
            document.getElementById('questionsContainer').innerHTML = '';
            questionCount = 0;

            tpl.questions.forEach(q => {
                addQuestion(q);
            });
        }

        // ── Question Builder ──
        function setupCreateForm() {
            document.getElementById('addQuestionBtn').addEventListener('click', () => addQuestion());
            document.getElementById('createSurveyBtn').addEventListener('click', createSurvey);
        }

        function addQuestion(prefill) {
            if (questionCount >= PulseSurvey.MAX_QUESTIONS) {
                showToast('Maximum 5 questions reached');
                return;
            }

            questionCount++;
            const idx = questionCount;
            const container = document.getElementById('questionsContainer');

            const block = document.createElement('div');
            block.className = 'question-block';
            block.dataset.idx = idx;

            const type = prefill ? prefill.type : 'scale';
            const text = prefill ? prefill.text : '';
            const options = (prefill && prefill.options) ? prefill.options : ['Option 1', 'Option 2'];

            let optionsHTML = '';
            if (type === 'multiple_choice') {
                optionsHTML = '<div class="options-list">' +
                    options.map((o, i) => `<div class="option-row"><input type="text" value="${_esc(o)}" data-opt="${i}"><button type="button" class="remove-opt">x</button></div>`).join('') +
                    '<button type="button" class="add-option">+ Add Option</button></div>';
            }

            block.innerHTML = `
                <div class="q-number">QUESTION ${idx}</div>
                <button type="button" class="remove-q">x</button>
                <div class="form-group">
                    <label>Question Text</label>
                    <input type="text" class="q-text-input" value="${_esc(text)}" placeholder="Enter your question...">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select class="q-type-select">
                        <option value="scale" ${type === 'scale' ? 'selected' : ''}>1-5 Scale</option>
                        <option value="multiple_choice" ${type === 'multiple_choice' ? 'selected' : ''}>Multiple Choice</option>
                    </select>
                </div>
                <div class="q-options-wrap">${optionsHTML}</div>
            `;

            container.appendChild(block);

            // Event listeners
            block.querySelector('.remove-q').addEventListener('click', () => {
                block.remove();
                questionCount--;
                renumberQuestions();
            });

            const typeSelect = block.querySelector('.q-type-select');
            typeSelect.addEventListener('change', () => {
                const wrap = block.querySelector('.q-options-wrap');
                if (typeSelect.value === 'multiple_choice') {
                    wrap.innerHTML = '<div class="options-list">' +
                        '<div class="option-row"><input type="text" value="Option 1"><button type="button" class="remove-opt">x</button></div>' +
                        '<div class="option-row"><input type="text" value="Option 2"><button type="button" class="remove-opt">x</button></div>' +
                        '<button type="button" class="add-option">+ Add Option</button></div>';
                    setupOptionListeners(wrap);
                } else {
                    wrap.innerHTML = '';
                }
            });

            setupOptionListeners(block.querySelector('.q-options-wrap'));
        }

        function setupOptionListeners(wrap) {
            if (!wrap) return;

            wrap.querySelectorAll('.remove-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    const row = btn.closest('.option-row');
                    if (wrap.querySelectorAll('.option-row').length > 2) {
                        row.remove();
                    } else {
                        showToast('Minimum 2 options required');
                    }
                });
            });

            const addBtn = wrap.querySelector('.add-option');
            if (addBtn) {
                addBtn.addEventListener('click', () => {
                    const optList = wrap.querySelector('.options-list');
                    const count = optList.querySelectorAll('.option-row').length;
                    if (count >= 6) {
                        showToast('Maximum 6 options');
                        return;
                    }
                    const row = document.createElement('div');
                    row.className = 'option-row';
                    row.innerHTML = `<input type="text" value="Option ${count + 1}"><button type="button" class="remove-opt">x</button>`;
                    optList.insertBefore(row, addBtn);
                    row.querySelector('.remove-opt').addEventListener('click', () => {
                        if (optList.querySelectorAll('.option-row').length > 2) {
                            row.remove();
                        }
                    });
                });
            }
        }

        function renumberQuestions() {
            document.querySelectorAll('.question-block').forEach((block, i) => {
                block.querySelector('.q-number').textContent = 'QUESTION ' + (i + 1);
                block.dataset.idx = i + 1;
            });
        }

        // ── Create Survey ──
        async function createSurvey() {
            if (!currentClassId) {
                showToast('Select a class first');
                return;
            }

            const title = document.getElementById('surveyTitle').value.trim() || 'Pulse Survey';
            const blocks = document.querySelectorAll('.question-block');

            if (blocks.length === 0) {
                showToast('Add at least one question');
                return;
            }

            const questions = [];
            for (const block of blocks) {
                const text = block.querySelector('.q-text-input').value.trim();
                const type = block.querySelector('.q-type-select').value;

                if (!text) {
                    showToast('All questions need text');
                    return;
                }

                const q = { text, type };

                if (type === 'multiple_choice') {
                    const optInputs = block.querySelectorAll('.option-row input');
                    q.options = Array.from(optInputs).map(inp => inp.value.trim()).filter(Boolean);
                    if (q.options.length < 2) {
                        showToast('Each multiple choice needs at least 2 options');
                        return;
                    }
                }

                questions.push(q);
            }

            try {
                const surveyId = await PulseSurvey.createSurvey(currentClassId, questions, title);
                showToast('Survey created successfully');

                // Reset form
                document.getElementById('surveyTitle').value = '';
                document.getElementById('questionsContainer').innerHTML = '';
                questionCount = 0;

                // Refresh lists
                loadActiveSurveys();
                loadAllSurveys();
            } catch (e) {
                showToast('Error: ' + e.message);
            }
        }

        // ── Respond Tab ──
        async function loadActiveSurveys() {
            const container = document.getElementById('respondContainer');
            if (!currentClassId) {
                container.innerHTML = '<div class="empty-state">Select a class</div>';
                return;
            }

            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const surveys = await PulseSurvey.getActiveSurveys(currentClassId);

                if (surveys.length === 0) {
                    container.innerHTML = '<div class="empty-state">No active surveys for this class</div>';
                    return;
                }

                container.innerHTML = '';
                for (const survey of surveys) {
                    // Check if already responded
                    let responded = false;
                    try {
                        const user = FirebaseAuth.getUser();
                        if (user) {
                            responded = await PulseSurvey.hasResponded(survey.id, user.uid);
                        }
                    } catch (e) { /* ok */ }

                    const div = document.createElement('div');
                    div.className = 'card';

                    if (responded) {
                        div.innerHTML = `<h2>${_esc(survey.title)}</h2><div class="empty-state" style="padding:16px">You have already responded to this survey.</div>`;
                    } else {
                        div.innerHTML = `<h2>${_esc(survey.title)}</h2>` + renderResponseForm(survey);
                    }

                    container.appendChild(div);

                    if (!responded) {
                        setupResponseForm(div, survey);
                    }
                }
            } catch (e) {
                container.innerHTML = '<div class="empty-state">Failed to load surveys</div>';
            }
        }

        function renderResponseForm(survey) {
            let html = '<div class="response-form">';

            survey.questions.forEach((q, i) => {
                html += `<div class="form-group" data-qi="${i}">`;
                html += `<div class="question-text">${i + 1}. ${_esc(q.text)}</div>`;

                if (q.type === 'scale') {
                    html += '<div class="scale-row">';
                    for (let s = 1; s <= 5; s++) {
                        html += `<button type="button" class="scale-btn" data-val="${s}">${s}</button>`;
                    }
                    html += '</div>';
                    if (q.scaleLabels) {
                        html += `<div class="scale-labels"><span>${_esc(q.scaleLabels[1] || '')}</span><span>${_esc(q.scaleLabels[5] || '')}</span></div>`;
                    }
                }

                if (q.type === 'multiple_choice') {
                    q.options.forEach(opt => {
                        html += `<div class="mc-option" data-val="${_esc(opt)}">${_esc(opt)}</div>`;
                    });
                }

                html += '</div>';
            });

            html += '<div class="btn-row"><button type="button" class="btn submit-response-btn">Submit Response</button></div>';
            html += '</div>';
            return html;
        }

        function setupResponseForm(card, survey) {
            const answers = new Array(survey.questions.length).fill(null);

            // Scale buttons
            card.querySelectorAll('.scale-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const qi = parseInt(btn.closest('[data-qi]').dataset.qi);
                    const val = parseInt(btn.dataset.val);
                    answers[qi] = val;
                    btn.closest('.scale-row').querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });

            // MC options
            card.querySelectorAll('.mc-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const qi = parseInt(opt.closest('[data-qi]').dataset.qi);
                    answers[qi] = opt.dataset.val;
                    opt.closest('[data-qi]').querySelectorAll('.mc-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                });
            });

            // Submit
            card.querySelector('.submit-response-btn').addEventListener('click', async () => {
                if (answers.some(a => a === null)) {
                    showToast('Please answer all questions');
                    return;
                }

                try {
                    await PulseSurvey.submitResponse(survey.id, answers);
                    showToast('Response submitted -- thank you');
                    loadActiveSurveys();
                } catch (e) {
                    showToast('Error: ' + e.message);
                }
            });
        }

        // ── Results Tab ──
        async function loadAllSurveys() {
            const container = document.getElementById('resultsContainer');
            if (!currentClassId) {
                container.innerHTML = '<div class="empty-state">Select a class</div>';
                return;
            }

            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const surveys = await PulseSurvey.getAllSurveys(currentClassId);

                if (surveys.length === 0) {
                    container.innerHTML = '<div class="empty-state">No surveys yet</div>';
                    return;
                }

                let html = '';
                surveys.forEach(s => {
                    const badge = s.status === 'active' ? '<span class="badge badge-active">ACTIVE</span>' : '<span class="badge badge-closed">CLOSED</span>';
                    const date = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate().toLocaleDateString() : '';
                    html += `
                        <div class="survey-item">
                            <div>
                                <div class="si-title">${_esc(s.title)} ${badge}</div>
                                <div class="si-meta">${date} | ${s.responseCount || 0} responses | ${s.questions.length} questions</div>
                            </div>
                            <div>
                                <button class="btn secondary view-results-btn" data-sid="${s.id}">View Results</button>
                                ${s.status === 'active' ? `<button class="btn danger close-survey-btn" data-sid="${s.id}" style="margin-left:6px">Close</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                html += '<div id="resultDetail"></div>';
                container.innerHTML = html;

                // Event listeners
                container.querySelectorAll('.view-results-btn').forEach(btn => {
                    btn.addEventListener('click', () => viewResults(btn.dataset.sid));
                });
                container.querySelectorAll('.close-survey-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await PulseSurvey.closeSurvey(btn.dataset.sid);
                        showToast('Survey closed');
                        loadAllSurveys();
                    });
                });
            } catch (e) {
                container.innerHTML = '<div class="empty-state">Failed to load surveys</div>';
            }
        }

        async function viewResults(surveyId) {
            const detail = document.getElementById('resultDetail');
            detail.innerHTML = '<div class="loading"><div class="spinner"></div>Loading results...</div>';

            try {
                const data = await PulseSurvey.getResults(surveyId);

                let html = `<div class="card" style="margin-top:16px"><h2>${_esc(data.survey.title)} -- Results (${data.totalResponses} responses)</h2>`;

                data.results.forEach((r, i) => {
                    html += `<div class="result-block">`;
                    html += `<div class="q-text">${i + 1}. ${_esc(r.text)}</div>`;

                    if (r.type === 'scale') {
                        html += `<div class="avg-display">${r.average} / 5</div>`;
                        if (r.scaleLabels) {
                            html += `<div class="avg-sub">${_esc(r.scaleLabels[1] || '')} to ${_esc(r.scaleLabels[5] || '')}</div>`;
                        }
                        // Distribution bars
                        const maxDist = Math.max(...r.distribution, 1);
                        for (let s = 0; s < 5; s++) {
                            const pct = (r.distribution[s] / maxDist) * 100;
                            html += `<div class="bar-chart-row">
                                <div class="bar-label">${s + 1}</div>
                                <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                                <div class="bar-count">${r.distribution[s]}</div>
                            </div>`;
                        }
                    }

                    if (r.type === 'multiple_choice') {
                        const maxDist = Math.max(...Object.values(r.distribution), 1);
                        r.options.forEach(opt => {
                            const count = r.distribution[opt] || 0;
                            const pct = (count / maxDist) * 100;
                            html += `<div class="bar-chart-row">
                                <div class="bar-label">${_esc(opt)}</div>
                                <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                                <div class="bar-count">${count}</div>
                            </div>`;
                        });
                    }

                    html += '</div>';
                });

                html += '</div>';
                detail.innerHTML = html;
            } catch (e) {
                detail.innerHTML = '<div class="empty-state">Failed to load results</div>';
            }
        }

        // ── Toast ──
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        function _esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Boot ──
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
