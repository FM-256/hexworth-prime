<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <title>Hive Co-op | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-beehive.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0d1117;
            font-family: 'Courier New', monospace;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(6,182,212,0.15);
            background: rgba(13,17,23,0.97);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-icon { width: 28px; height: 28px; }
        .header-icon img { width: 100%; height: 100%; }
        .header h1 { font-size: 1.1rem; color: #06b6d4; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        .invite-code {
            font-size: 0.85rem;
            color: #8b949e;
            background: rgba(6,182,212,0.06);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(6,182,212,0.12);
            cursor: pointer;
        }
        .invite-code:hover { color: #06b6d4; }
        .btn-sm {
            padding: 6px 14px;
            border: 1px solid rgba(248,113,113,0.3);
            background: rgba(248,113,113,0.08);
            color: #f87171;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover { background: rgba(248,113,113,0.15); }

        /* ── Main Layout ── */
        .main-layout {
            display: grid;
            grid-template-columns: 220px 1fr 280px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Sidebar: Participants ── */
        .sidebar {
            border-right: 1px solid rgba(6,182,212,0.1);
            background: #0d1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-title {
            padding: 14px 16px;
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(6,182,212,0.08);
        }
        .participant-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .participant {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }
        .participant:hover { background: rgba(6,182,212,0.04); }
        .participant-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #161b22;
            border: 2px solid rgba(6,182,212,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #06b6d4;
            overflow: hidden;
        }
        .participant-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .participant-info { flex: 1; min-width: 0; }
        .participant-name {
            font-size: 0.8rem;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .participant-role {
            font-size: 0.65rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .online-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .online-dot.online { background: #4ade80; }
        .online-dot.offline { background: #6e7681; }

        /* Role selector (for leader) */
        .role-select {
            font-size: 0.65rem;
            background: #0d1117;
            color: #8b949e;
            border: 1px solid rgba(6,182,212,0.1);
            border-radius: 3px;
            padding: 1px 4px;
            font-family: inherit;
            cursor: pointer;
        }

        /* ── Center: Workspace ── */
        .workspace {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d1117;
        }

        /* Progress Tracker */
        .progress-bar {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(6,182,212,0.08);
            background: #161b22;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .progress-title {
            font-size: 0.8rem;
            color: #06b6d4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-score {
            font-size: 0.85rem;
            color: #4ade80;
            font-weight: 700;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(6,182,212,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #4ade80);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Objectives */
        .objectives {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(6,182,212,0.08);
            max-height: 140px;
            overflow-y: auto;
        }
        .objective {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 0.8rem;
        }
        .objective-check {
            width: 16px; height: 16px;
            border: 1px solid rgba(6,182,212,0.3);
            border-radius: 3px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .objective-check.done {
            background: rgba(74,222,128,0.2);
            border-color: #4ade80;
            color: #4ade80;
            font-size: 0.6rem;
        }
        .objective-text { color: #c9d1d9; }
        .objective-text.done { color: #8b949e; text-decoration: line-through; }

        /* Terminal Output */
        .terminal-area {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .terminal-label {
            padding: 8px 20px;
            font-size: 0.7rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(6,182,212,0.06);
            background: rgba(22,27,34,0.5);
        }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            font-size: 0.8rem;
            line-height: 1.5;
            background: #010409;
            color: #4ade80;
        }
        .terminal-output .line { margin-bottom: 2px; }
        .terminal-output .line-user { color: #06b6d4; }
        .terminal-output .line-system { color: #8b949e; font-style: italic; }
        .terminal-output .line-action { color: #fbbf24; }

        .terminal-input-row {
            display: flex;
            border-top: 1px solid rgba(6,182,212,0.1);
            background: #010409;
        }
        .terminal-prompt {
            padding: 10px 8px 10px 20px;
            color: #06b6d4;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .terminal-input {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            color: #4ade80;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }

        /* ── Right Panel: Chat + Notes ── */
        .right-panel {
            border-left: 1px solid rgba(6,182,212,0.1);
            background: #0d1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid rgba(6,182,212,0.1);
        }
        .panel-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .panel-tab:hover { color: #c9d1d9; }
        .panel-tab.active { color: #06b6d4; border-bottom-color: #06b6d4; }

        .panel-body {
            flex: 1;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }
        .panel-body.active { display: flex; }

        /* Chat */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
        }
        .chat-msg {
            margin-bottom: 10px;
        }
        .chat-msg-header {
            font-size: 0.7rem;
            margin-bottom: 2px;
        }
        .chat-msg-name { color: #06b6d4; font-weight: 700; }
        .chat-msg-time { color: #6e7681; margin-left: 6px; }
        .chat-msg-text { font-size: 0.8rem; color: #c9d1d9; line-height: 1.4; }

        .chat-input-row {
            display: flex;
            border-top: 1px solid rgba(6,182,212,0.1);
        }
        .chat-input {
            flex: 1;
            padding: 10px 12px;
            background: #161b22;
            border: none;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }
        .chat-send {
            padding: 10px 14px;
            background: rgba(6,182,212,0.1);
            border: none;
            color: #06b6d4;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .chat-send:hover { background: rgba(6,182,212,0.2); }

        /* Notes / Findings */
        .notes-area {
            flex: 1;
            padding: 10px 12px;
            overflow-y: auto;
        }
        .note-item {
            padding: 8px 10px;
            background: #161b22;
            border: 1px solid rgba(6,182,212,0.08);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }
        .note-item .note-author {
            font-size: 0.65rem;
            color: #06b6d4;
            margin-bottom: 3px;
        }
        .share-note-row {
            display: flex;
            border-top: 1px solid rgba(6,182,212,0.1);
        }
        .share-note-input {
            flex: 1;
            padding: 10px 12px;
            background: #161b22;
            border: none;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }
        .share-note-btn {
            padding: 10px 14px;
            background: rgba(6,182,212,0.1);
            border: none;
            color: #06b6d4;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid rgba(6,182,212,0.1);
                max-height: 120px;
            }
            .participant-list { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; }
            .participant { flex-shrink: 0; }
            .right-panel {
                border-left: none;
                border-top: 1px solid rgba(6,182,212,0.1);
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <img src="/assets/images/icons/icon-beehive.webp" alt="">
            </div>
            <h1>HIVE // CO-OP</h1>
        </div>
        <div class="header-right">
            <span id="invite-code" class="invite-code" title="Click to copy">---</span>
            <button id="btn-leave" class="btn-sm">Leave</button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left: Participants -->
        <div class="sidebar">
            <div class="sidebar-title">Team (<span id="player-count">0</span>)</div>
            <div id="participant-list" class="participant-list"></div>
        </div>

        <!-- Center: Workspace -->
        <div class="workspace">
            <!-- Progress -->
            <div class="progress-bar">
                <div class="progress-header">
                    <span class="progress-title">Team Progress</span>
                    <span id="team-score" class="progress-score">0 pts</span>
                </div>
                <div class="progress-track">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <!-- Objectives -->
            <div id="objectives" class="objectives">
                <div class="objective">
                    <div class="objective-check"></div>
                    <span class="objective-text">Waiting for session to start...</span>
                </div>
            </div>

            <!-- Terminal -->
            <div class="terminal-area">
                <div class="terminal-label">Shared Terminal Output</div>
                <div id="terminal-output" class="terminal-output">
                    <div class="line line-system">Hive session initializing...</div>
                </div>
                <div class="terminal-input-row">
                    <span class="terminal-prompt">hive&gt;</span>
                    <input type="text" id="terminal-input" class="terminal-input"
                           placeholder="Type command (leader only)..." autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Right: Chat & Notes -->
        <div class="right-panel">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel="chat">Chat</button>
                <button class="panel-tab" data-panel="notes">Findings</button>
            </div>

            <!-- Chat Panel -->
            <div id="panel-chat" class="panel-body active">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" class="chat-input"
                           placeholder="Message team..." autocomplete="off">
                    <button id="btn-chat-send" class="chat-send">Send</button>
                </div>
            </div>

            <!-- Notes Panel -->
            <div id="panel-notes" class="panel-body">
                <div id="notes-area" class="notes-area"></div>
                <div class="share-note-row">
                    <input type="text" id="note-input" class="share-note-input"
                           placeholder="Share a finding..." autocomplete="off">
                    <button id="btn-share-note" class="share-note-btn">Share</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../FirebaseAuth.js"></script>
    <script src="HiveManager.js"></script>
    <script>
    (async function() {
        'use strict';

        const hiveId = new URLSearchParams(window.location.search).get('hive');
        if (!hiveId) { window.location.href = 'hive-lobby.html'; return; }

        await FirebaseAuth.init();
        await FirebaseAuth.waitForAuth();
        if (!FirebaseAuth.isSignedIn()) { window.location.href = 'hive-lobby.html'; return; }

        await HiveManager.init();

        // Rejoin if needed
        if (!HiveManager.isInHive()) {
            try { await HiveManager.joinHive(hiveId); }
            catch (e) { alert('Could not join Hive: ' + e.message); window.location.href = 'hive-lobby.html'; return; }
        }

        const myUid = FirebaseAuth.getUser().uid;
        let myRole = 'scout';
        let isCreator = false;

        // Load hive data
        const hiveData = await HiveManager.getHiveData();
        if (hiveData) {
            const codeEl = document.getElementById('invite-code');
            codeEl.textContent = 'CODE: ' + hiveData.inviteCode;
            codeEl.addEventListener('click', () => {
                navigator.clipboard.writeText(hiveData.inviteCode).catch(() => {});
                codeEl.textContent = 'Copied!';
                setTimeout(() => codeEl.textContent = 'CODE: ' + hiveData.inviteCode, 1500);
            });
            isCreator = hiveData.creatorUid === myUid;
        }

        // ── Participants ──
        function renderParticipants(participants) {
            const listEl = document.getElementById('participant-list');
            document.getElementById('player-count').textContent = participants.length;

            let totalScore = 0;
            listEl.innerHTML = participants.map(p => {
                totalScore += p.score || 0;
                const onlineClass = p.online ? 'online' : 'offline';
                const avatarContent = p.photoURL
                    ? '<img src="' + p.photoURL + '" alt="">'
                    : (p.displayName || 'A')[0].toUpperCase();
                const isSelf = p.uid === myUid;
                if (isSelf) myRole = p.role;

                let roleHtml = '<span class="participant-role">' + (p.role || 'scout') + '</span>';
                if (isCreator && !isSelf) {
                    roleHtml = '<select class="role-select" data-uid="' + p.uid + '">' +
                        ['scout','analyst','operator','leader'].map(r =>
                            '<option value="' + r + '"' + (p.role === r ? ' selected' : '') + '>' + r + '</option>'
                        ).join('') + '</select>';
                }

                return '<div class="participant">' +
                    '<div class="participant-avatar">' + avatarContent + '</div>' +
                    '<div class="participant-info">' +
                        '<div class="participant-name">' + escapeHtml(p.displayName) + (isSelf ? ' (you)' : '') + '</div>' +
                        roleHtml +
                    '</div>' +
                    '<div class="online-dot ' + onlineClass + '"></div>' +
                '</div>';
            }).join('');

            document.getElementById('team-score').textContent = totalScore + ' pts';

            // Role select handlers
            if (isCreator) {
                listEl.querySelectorAll('.role-select').forEach(sel => {
                    sel.addEventListener('change', () => {
                        HiveManager.assignRole(sel.dataset.uid, sel.value);
                    });
                });
            }

            // Terminal input access based on role
            const termInput = document.getElementById('terminal-input');
            if (myRole === 'leader' || isCreator) {
                termInput.disabled = false;
                termInput.placeholder = 'Type command...';
            } else {
                termInput.disabled = true;
                termInput.placeholder = 'Read-only (leaders can type)';
            }
        }

        HiveManager.onParticipantsChange(renderParticipants);

        // Initial load
        const initialParticipants = await HiveManager.getParticipants();
        renderParticipants(initialParticipants);

        // ── Actions ──
        const termOutput = document.getElementById('terminal-output');
        function addTermLine(text, cls) {
            const div = document.createElement('div');
            div.className = 'line ' + (cls || '');
            div.textContent = text;
            termOutput.appendChild(div);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        HiveManager.onAction(action => {
            if (action.type === 'terminal') {
                addTermLine('[' + action.displayName + '] ' + action.data.command, 'line-user');
                if (action.data.output) addTermLine(action.data.output, '');
            } else if (action.type === 'objective_complete') {
                addTermLine('[OBJECTIVE] ' + action.data.text + ' completed by ' + action.displayName, 'line-action');
            } else if (action.type === 'finding') {
                addTermLine('[FINDING] ' + action.displayName + ': ' + action.data.text, 'line-action');
            } else {
                addTermLine('[' + action.type + '] ' + action.displayName + ': ' + JSON.stringify(action.data), 'line-system');
            }
        });

        // Terminal input
        document.getElementById('terminal-input').addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;
            const input = e.target;
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';

            addTermLine('> ' + cmd, 'line-user');
            await HiveManager.broadcastAction({
                type: 'terminal',
                data: { command: cmd }
            });
        });

        // ── Chat ──
        const chatMessages = document.getElementById('chat-messages');
        const unsubChat = HiveManager.onChat(messages => {
            chatMessages.innerHTML = messages.map(m => {
                const time = m.timestamp?.toDate ? m.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
                return '<div class="chat-msg">' +
                    '<div class="chat-msg-header">' +
                        '<span class="chat-msg-name">' + escapeHtml(m.displayName) + '</span>' +
                        '<span class="chat-msg-time">' + time + '</span>' +
                    '</div>' +
                    '<div class="chat-msg-text">' + escapeHtml(m.message) + '</div>' +
                '</div>';
            }).join('');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            HiveManager.sendChat(msg);
        }
        document.getElementById('btn-chat-send').addEventListener('click', sendChat);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // ── Notes / Findings ──
        const notesArea = document.getElementById('notes-area');
        HiveManager.onAction(action => {
            if (action.type === 'finding') {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = '<div class="note-author">' + escapeHtml(action.displayName) + '</div>' +
                                escapeHtml(action.data.text);
                notesArea.appendChild(div);
                notesArea.scrollTop = notesArea.scrollHeight;
            }
        });

        function shareNote() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            HiveManager.broadcastAction({ type: 'finding', data: { text } });
            // Also add locally
            const div = document.createElement('div');
            div.className = 'note-item';
            div.innerHTML = '<div class="note-author">You</div>' + escapeHtml(text);
            notesArea.appendChild(div);
        }
        document.getElementById('btn-share-note').addEventListener('click', shareNote);
        document.getElementById('note-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') shareNote();
        });

        // ── Panel Tabs ──
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel-body').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
            });
        });

        // ── Leave ──
        document.getElementById('btn-leave').addEventListener('click', async () => {
            await HiveManager.leaveHive();
            window.location.href = 'hive-lobby.html';
        });

        addTermLine('Connected to Hive session.', 'line-system');
        addTermLine('Mode: Co-op | Your role: ' + myRole, 'line-system');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    })();
    </script>
</body>
</html>
