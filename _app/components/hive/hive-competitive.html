<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <title>Hive Competitive | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-beehive.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0d1117;
            font-family: 'Courier New', monospace;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(251,191,36,0.15);
            background: rgba(13,17,23,0.97);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-icon { width: 28px; height: 28px; }
        .header-icon img { width: 100%; height: 100%; }
        .header h1 { font-size: 1.1rem; color: #fbbf24; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        .timer {
            font-size: 1.1rem;
            color: #fbbf24;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .btn-sm {
            padding: 6px 14px;
            border: 1px solid rgba(248,113,113,0.3);
            background: rgba(248,113,113,0.08);
            color: #f87171;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-sm:hover { background: rgba(248,113,113,0.15); }

        /* ── Main Layout ── */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Leaderboard ── */
        .leaderboard {
            border-right: 1px solid rgba(251,191,36,0.1);
            background: #0d1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .lb-title {
            padding: 14px 16px;
            font-size: 0.75rem;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(251,191,36,0.08);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lb-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .lb-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #161b22;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .lb-entry.self {
            border-color: rgba(251,191,36,0.2);
            background: rgba(251,191,36,0.04);
        }
        .lb-entry.first {
            border-color: rgba(251,191,36,0.3);
            background: rgba(251,191,36,0.06);
        }
        .lb-rank {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: rgba(251,191,36,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
            color: #fbbf24;
            font-weight: 700;
            flex-shrink: 0;
        }
        .lb-rank.gold { background: rgba(251,191,36,0.25); color: #fbbf24; }
        .lb-rank.silver { background: rgba(192,192,192,0.2); color: #c0c0c0; }
        .lb-rank.bronze { background: rgba(205,127,50,0.2); color: #cd7f32; }
        .lb-info { flex: 1; min-width: 0; }
        .lb-name {
            font-size: 0.8rem;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lb-progress-track {
            width: 100%;
            height: 4px;
            background: rgba(251,191,36,0.08);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .lb-progress-fill {
            height: 100%;
            background: #fbbf24;
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        .lb-score {
            font-size: 0.85rem;
            color: #fbbf24;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* First-to-solve badge */
        .first-solve-badge {
            display: inline-block;
            font-size: 0.55rem;
            padding: 1px 5px;
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 6px;
        }

        /* ── Workspace ── */
        .workspace {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d1117;
        }

        /* Your stats bar */
        .my-stats {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(251,191,36,0.08);
            background: #161b22;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.2rem;
            color: #fbbf24;
            font-weight: 700;
        }
        .stat-label {
            font-size: 0.65rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Terminal */
        .terminal-area {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .terminal-label {
            padding: 8px 20px;
            font-size: 0.7rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(251,191,36,0.06);
            background: rgba(22,27,34,0.5);
        }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            font-size: 0.8rem;
            line-height: 1.5;
            background: #010409;
            color: #4ade80;
        }
        .terminal-output .line { margin-bottom: 2px; }
        .terminal-output .line-system { color: #8b949e; font-style: italic; }
        .terminal-output .line-solve { color: #fbbf24; font-weight: 700; }
        .terminal-output .line-first { color: #f87171; font-weight: 700; }

        .terminal-input-row {
            display: flex;
            border-top: 1px solid rgba(251,191,36,0.1);
            background: #010409;
        }
        .terminal-prompt {
            padding: 10px 8px 10px 20px;
            color: #fbbf24;
            font-size: 0.8rem;
        }
        .terminal-input {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            color: #4ade80;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .leaderboard {
                border-right: none;
                border-bottom: 1px solid rgba(251,191,36,0.1);
                max-height: 200px;
            }
            .my-stats { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <img src="/assets/images/icons/icon-trophy.webp" alt="">
            </div>
            <h1>HIVE // COMPETITIVE</h1>
        </div>
        <div class="header-right">
            <span id="timer" class="timer">--:--</span>
            <button id="btn-leave" class="btn-sm">Leave</button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Leaderboard -->
        <div class="leaderboard">
            <div class="lb-title">
                <img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:16px;height:16px">
                Leaderboard
            </div>
            <div id="lb-list" class="lb-list"></div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <!-- Stats -->
            <div class="my-stats">
                <div class="stat-item">
                    <div id="my-rank" class="stat-value">-</div>
                    <div class="stat-label">Rank</div>
                </div>
                <div class="stat-item">
                    <div id="my-score" class="stat-value">0</div>
                    <div class="stat-label">Score</div>
                </div>
                <div class="stat-item">
                    <div id="my-solves" class="stat-value">0</div>
                    <div class="stat-label">Solves</div>
                </div>
                <div class="stat-item">
                    <div id="my-firsts" class="stat-value">0</div>
                    <div class="stat-label">First Bloods</div>
                </div>
            </div>

            <!-- Terminal -->
            <div class="terminal-area">
                <div class="terminal-label">Your Workspace (private)</div>
                <div id="terminal-output" class="terminal-output">
                    <div class="line line-system">Competitive session initializing...</div>
                </div>
                <div class="terminal-input-row">
                    <span class="terminal-prompt">$</span>
                    <input type="text" id="terminal-input" class="terminal-input"
                           placeholder="Your commands are private..." autocomplete="off">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../FirebaseAuth.js"></script>
    <script src="HiveManager.js"></script>
    <script>
    (async function() {
        'use strict';

        const hiveId = new URLSearchParams(window.location.search).get('hive');
        if (!hiveId) { window.location.href = 'hive-lobby.html'; return; }

        await FirebaseAuth.init();
        await FirebaseAuth.waitForAuth();
        if (!FirebaseAuth.isSignedIn()) { window.location.href = 'hive-lobby.html'; return; }

        await HiveManager.init();
        if (!HiveManager.isInHive()) {
            try { await HiveManager.joinHive(hiveId); }
            catch (e) { alert('Could not join: ' + e.message); window.location.href = 'hive-lobby.html'; return; }
        }

        const myUid = FirebaseAuth.getUser().uid;
        let solveCount = 0;
        let firstBloods = 0;
        const solvedChallenges = new Set();   // track first-to-solve
        const globalFirstSolves = {};         // challengeId -> uid who solved first

        // ── Timer ──
        const hiveData = await HiveManager.getHiveData();
        let timerInterval = null;
        let timeLimit = (hiveData && hiveData.timeLimit) ? hiveData.timeLimit * 60 : 0;
        let startTime = hiveData && hiveData.startedAt ? hiveData.startedAt.toMillis() : Date.now();

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            if (timeLimit > 0) {
                const remaining = Math.max(0, timeLimit - elapsed);
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                document.getElementById('timer').textContent =
                    String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    addTermLine('TIME IS UP!', 'line-first');
                }
            } else {
                const m = Math.floor(elapsed / 60);
                const s = elapsed % 60;
                document.getElementById('timer').textContent =
                    String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
        }
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // ── Leaderboard ──
        function renderLeaderboard(participants) {
            const sorted = [...participants].sort((a, b) => (b.score || 0) - (a.score || 0));
            const lbList = document.getElementById('lb-list');

            lbList.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                const isSelf = p.uid === myUid;
                const maxScore = sorted[0]?.score || 1;
                const pct = Math.min(100, ((p.score || 0) / maxScore) * 100);

                if (isSelf) {
                    document.getElementById('my-rank').textContent = '#' + rank;
                    document.getElementById('my-score').textContent = p.score || 0;
                }

                return '<div class="lb-entry' + (isSelf ? ' self' : '') + (rank === 1 ? ' first' : '') + '">' +
                    '<div class="lb-rank ' + rankClass + '">' + rank + '</div>' +
                    '<div class="lb-info">' +
                        '<div class="lb-name">' + escapeHtml(p.displayName || 'Agent') +
                            (isSelf ? ' (you)' : '') +
                            (p.firstBloods ? '<span class="first-solve-badge">FB x' + p.firstBloods + '</span>' : '') +
                        '</div>' +
                        '<div class="lb-progress-track"><div class="lb-progress-fill" style="width:' + pct + '%"></div></div>' +
                    '</div>' +
                    '<div class="lb-score">' + (p.score || 0) + '</div>' +
                '</div>';
            }).join('');
        }

        HiveManager.onParticipantsChange(renderLeaderboard);
        const initialP = await HiveManager.getParticipants();
        renderLeaderboard(initialP);

        // ── Actions (announcements only — no peeking) ──
        const termOutput = document.getElementById('terminal-output');
        function addTermLine(text, cls) {
            const div = document.createElement('div');
            div.className = 'line ' + (cls || '');
            div.textContent = text;
            termOutput.appendChild(div);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        HiveManager.onAction(action => {
            if (action.type === 'solve') {
                const isFirst = !globalFirstSolves[action.data.challengeId];
                if (isFirst) globalFirstSolves[action.data.challengeId] = action.uid;

                if (isFirst) {
                    addTermLine('FIRST BLOOD: ' + action.displayName + ' solved ' + (action.data.challengeName || 'a challenge') + '!', 'line-first');
                } else {
                    addTermLine(action.displayName + ' solved ' + (action.data.challengeName || 'a challenge'), 'line-solve');
                }
            }
        });

        // Terminal (private workspace)
        document.getElementById('terminal-input').addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const cmd = e.target.value.trim();
            if (!cmd) return;
            e.target.value = '';
            addTermLine('$ ' + cmd, '');
            // Commands stay local in competitive mode — no broadcast
        });

        addTermLine('Competitive session active. Your workspace is private.', 'line-system');
        addTermLine('Other players can only see your score and progress percentage.', 'line-system');

        // ── Leave ──
        document.getElementById('btn-leave').addEventListener('click', async () => {
            clearInterval(timerInterval);
            await HiveManager.leaveHive();
            window.location.href = 'hive-lobby.html';
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    })();
    </script>
</body>
</html>
