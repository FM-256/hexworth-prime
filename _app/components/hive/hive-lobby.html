<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <title>Hive Lobby | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-beehive.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0d1117;
            font-family: 'Courier New', monospace;
            color: #c9d1d9;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(6,182,212,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(6,182,212,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(6,182,212,0.15);
            background: rgba(13,17,23,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .header-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(6,182,212,0.1);
            border: 1px solid rgba(6,182,212,0.2);
            border-radius: 8px;
        }
        .header-icon img { width: 22px; height: 22px; }

        .header h1 {
            font-size: 1.3rem;
            color: #06b6d4;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .back-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #06b6d4; }

        /* ── Container ── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(6,182,212,0.1);
            padding-bottom: 0;
        }
        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #c9d1d9; }
        .tab-btn.active {
            color: #06b6d4;
            border-bottom-color: #06b6d4;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Create Form ── */
        .create-form {
            background: #161b22;
            border: 1px solid rgba(6,182,212,0.12);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid rgba(6,182,212,0.15);
            border-radius: 6px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #06b6d4;
        }
        select.form-input {
            cursor: pointer;
        }
        select.form-input option {
            background: #161b22;
            color: #c9d1d9;
        }

        /* ── Mode Selector ── */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .mode-card {
            padding: 18px 14px;
            background: #0d1117;
            border: 2px solid rgba(6,182,212,0.1);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .mode-card:hover {
            border-color: rgba(6,182,212,0.3);
            background: rgba(6,182,212,0.04);
        }
        .mode-card.selected {
            border-color: #06b6d4;
            background: rgba(6,182,212,0.08);
        }
        .mode-card .mode-icon {
            width: 32px; height: 32px;
            margin: 0 auto 8px;
        }
        .mode-card .mode-icon img { width: 100%; height: 100%; }
        .mode-card .mode-name {
            font-size: 0.85rem;
            color: #06b6d4;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .mode-card .mode-desc {
            font-size: 0.7rem;
            color: #8b949e;
            line-height: 1.3;
        }

        /* ── Buttons ── */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: #06b6d4;
            color: #0d1117;
        }
        .btn-primary:hover {
            background: #22d3ee;
            box-shadow: 0 0 20px rgba(6,182,212,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(6,182,212,0.1);
            color: #06b6d4;
            border: 1px solid rgba(6,182,212,0.2);
        }
        .btn-secondary:hover {
            background: rgba(6,182,212,0.2);
        }

        /* ── Join Section ── */
        .join-section {
            max-width: 500px;
        }
        .join-row {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .join-row .form-input { flex: 1; }

        /* ── Hive Cards (Browse) ── */
        .hive-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .hive-card {
            background: #161b22;
            border: 1px solid rgba(6,182,212,0.1);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .hive-card:hover {
            border-color: rgba(6,182,212,0.3);
            transform: translateY(-2px);
        }
        .hive-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .hive-card-title {
            font-size: 1rem;
            color: #e6edf3;
            font-weight: 700;
        }
        .hive-card-mode {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .mode-coop { background: rgba(74,222,128,0.15); color: #4ade80; }
        .mode-competitive { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .mode-redqueen { background: rgba(248,113,113,0.15); color: #f87171; }

        .hive-card-meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: #8b949e;
        }
        .hive-card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ── Status Indicators ── */
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-lobby { background: #fbbf24; }
        .status-active { background: #4ade80; }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }
        .empty-state .empty-icon {
            width: 48px; height: 48px;
            margin: 0 auto 16px;
            opacity: 0.4;
        }
        .empty-state p {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        /* ── Toast ── */
        .toast {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 200;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast-error {
            background: rgba(248,113,113,0.15);
            border: 1px solid rgba(248,113,113,0.3);
            color: #f87171;
        }
        .toast-success {
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .mode-grid { grid-template-columns: 1fr; }
            .header { padding: 14px 16px; }
            .header h1 { font-size: 1.1rem; }
            .container { padding: 20px 14px; }
            .hive-list { grid-template-columns: 1fr; }
            .join-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <img src="/assets/images/icons/icon-beehive.webp" alt="">
            </div>
            <h1>HIVE LOBBY</h1>
        </div>
        <a href="/dashboard.html" class="back-link">[ Dashboard ]</a>
    </div>

    <div class="container">
        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="browse">Browse Hives</button>
            <button class="tab-btn" data-tab="create">Create Hive</button>
            <button class="tab-btn" data-tab="join">Join by Code</button>
        </div>

        <!-- Browse Tab -->
        <div id="tab-browse" class="tab-content active">
            <div id="hive-list" class="hive-list">
                <div class="empty-state">
                    <div class="empty-icon">
                        <img src="/assets/images/icons/icon-radar.webp" alt="" style="width:48px;height:48px;opacity:0.4">
                    </div>
                    <p>Scanning for active Hives...</p>
                </div>
            </div>
        </div>

        <!-- Create Tab -->
        <div id="tab-create" class="tab-content">
            <div class="create-form">
                <div class="form-group">
                    <label>Session Title</label>
                    <input type="text" id="hive-title" class="form-input" placeholder="e.g., Friday CTF Practice" maxlength="60">
                </div>

                <div class="form-group">
                    <label>Mode</label>
                    <div class="mode-grid">
                        <div class="mode-card selected" data-mode="co-op">
                            <div class="mode-icon">
                                <img src="/assets/images/icons/icon-handshake.webp" alt="">
                            </div>
                            <div class="mode-name">Co-op</div>
                            <div class="mode-desc">Work together, share progress</div>
                        </div>
                        <div class="mode-card" data-mode="competitive">
                            <div class="mode-icon">
                                <img src="/assets/images/icons/icon-trophy.webp" alt="">
                            </div>
                            <div class="mode-name">Competitive</div>
                            <div class="mode-desc">Race to solve first</div>
                        </div>
                        <div class="mode-card" data-mode="redqueen">
                            <div class="mode-icon">
                                <img src="/assets/images/icons/icon-crown.webp" alt="">
                            </div>
                            <div class="mode-name">Red Queen</div>
                            <div class="mode-desc">Attacker vs challengers</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Max Players</label>
                    <select id="hive-max-players" class="form-input">
                        <option value="2">2 Players</option>
                        <option value="4" selected>4 Players</option>
                        <option value="6">6 Players</option>
                        <option value="8">8 Players</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Time Limit</label>
                    <select id="hive-time-limit" class="form-input">
                        <option value="0">No Limit</option>
                        <option value="15">15 Minutes</option>
                        <option value="30" selected>30 Minutes</option>
                        <option value="60">60 Minutes</option>
                        <option value="120">2 Hours</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Difficulty</label>
                    <select id="hive-difficulty" class="form-input">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                        <option value="insane">Insane</option>
                    </select>
                </div>

                <button id="btn-create" class="btn btn-primary">Create Hive</button>
            </div>
        </div>

        <!-- Join Tab -->
        <div id="tab-join" class="tab-content">
            <div class="join-section">
                <p style="color:#8b949e;font-size:0.85rem;margin-bottom:16px;">
                    Enter the 6-character invite code shared by the Hive creator.
                </p>
                <div class="join-row">
                    <input type="text" id="join-code" class="form-input"
                           placeholder="e.g., XK7M2P" maxlength="6"
                           style="text-transform:uppercase;letter-spacing:4px;font-size:1.2rem;text-align:center">
                    <button id="btn-join" class="btn btn-primary">Join</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="../FirebaseAuth.js"></script>
    <script src="HiveManager.js"></script>
    <script>
    (async function() {
        'use strict';

        // ── Init ──
        await FirebaseAuth.init();
        await FirebaseAuth.waitForAuth();

        if (!FirebaseAuth.isSignedIn()) {
            showToast('Sign in required to use Hive', 'error');
            return;
        }

        await HiveManager.init();

        // ── Tabs ──
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ── Mode Selection ──
        let selectedMode = 'co-op';
        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMode = card.dataset.mode;
            });
        });

        // ── Browse Hives ──
        async function loadHives() {
            const listEl = document.getElementById('hive-list');
            try {
                const hives = await HiveManager.listActiveHives(20);
                if (!hives.length) {
                    listEl.innerHTML = '<div class="empty-state">' +
                        '<div class="empty-icon"><img src="/assets/images/icons/icon-radar.webp" alt="" style="width:48px;height:48px;opacity:0.4"></div>' +
                        '<p>No active Hives found</p>' +
                        '<p style="font-size:0.8rem">Create one or check back later</p></div>';
                    return;
                }
                listEl.innerHTML = hives.map(h => renderHiveCard(h)).join('');
                listEl.querySelectorAll('.hive-card').forEach(card => {
                    card.addEventListener('click', () => joinAndRedirect(card.dataset.id, card.dataset.mode));
                });
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state"><p>Failed to load Hives</p></div>';
            }
        }

        function renderHiveCard(h) {
            const modeClass = h.mode === 'co-op' ? 'mode-coop' :
                              h.mode === 'competitive' ? 'mode-competitive' : 'mode-redqueen';
            const modeLabel = h.mode === 'co-op' ? 'Co-op' :
                              h.mode === 'competitive' ? 'Competitive' : 'Red Queen';
            const statusClass = h.status === 'lobby' ? 'status-lobby' : 'status-active';
            const statusLabel = h.status === 'lobby' ? 'In Lobby' : 'Active';
            const title = h.title || ('Hive by ' + (h.creatorName || 'Agent'));

            return '<div class="hive-card" data-id="' + h.id + '" data-mode="' + h.mode + '">' +
                '<div class="hive-card-header">' +
                    '<span class="hive-card-title">' + escapeHtml(title) + '</span>' +
                    '<span class="hive-card-mode ' + modeClass + '">' + modeLabel + '</span>' +
                '</div>' +
                '<div class="hive-card-meta">' +
                    '<span><span class="status-dot ' + statusClass + '"></span> ' + statusLabel + '</span>' +
                    '<span>' + (h.participantCount || 1) + '/' + h.maxPlayers + ' players</span>' +
                    '<span>' + (h.difficulty || 'normal') + '</span>' +
                '</div>' +
            '</div>';
        }

        loadHives();

        // ── Create Hive ──
        document.getElementById('btn-create').addEventListener('click', async () => {
            const btn = document.getElementById('btn-create');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const result = await HiveManager.createHive({
                    mode: selectedMode,
                    title: document.getElementById('hive-title').value.trim(),
                    maxPlayers: parseInt(document.getElementById('hive-max-players').value),
                    timeLimit: parseInt(document.getElementById('hive-time-limit').value),
                    difficulty: document.getElementById('hive-difficulty').value
                });

                showToast('Hive created! Code: ' + result.inviteCode, 'success');
                setTimeout(() => redirectToMode(selectedMode, result.id), 1000);
            } catch (e) {
                showToast(e.message || 'Failed to create Hive', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Hive';
            }
        });

        // ── Join by Code ──
        document.getElementById('btn-join').addEventListener('click', async () => {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (code.length < 4) {
                showToast('Enter a valid invite code', 'error');
                return;
            }
            try {
                const result = await HiveManager.joinHive(code);
                showToast('Joined Hive!', 'success');
                setTimeout(() => redirectToMode(result.mode, result.id), 800);
            } catch (e) {
                showToast(e.message || 'Failed to join', 'error');
            }
        });

        async function joinAndRedirect(hiveId, mode) {
            try {
                await HiveManager.joinHive(hiveId);
                redirectToMode(mode, hiveId);
            } catch (e) {
                showToast(e.message || 'Failed to join', 'error');
            }
        }

        function redirectToMode(mode, hiveId) {
            const pages = {
                'co-op': 'hive-coop.html',
                'competitive': 'hive-competitive.html',
                'redqueen': 'hive-redqueen.html'
            };
            window.location.href = (pages[mode] || 'hive-coop.html') + '?hive=' + hiveId;
        }

        // ── Utilities ──
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.className = 'toast toast-' + type + ' show';
            toast.textContent = msg;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    })();
    </script>
</body>
</html>
