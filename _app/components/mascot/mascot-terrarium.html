<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascot Terrarium | Hexworth Prime</title>
    <!-- global.css and nav.css not needed; terrarium is self-contained -->
    <link rel="stylesheet" href="mascot-animations.css">
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .terrarium-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .terrarium-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .terrarium-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #e6edf3;
            margin: 0 0 8px 0;
        }

        .terrarium-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        /* ---- Terrarium Arena ---- */

        .terrarium-arena {
            position: relative;
            width: 100%;
            height: 600px;
            background: rgba(13, 17, 23, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .terrarium-arena::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(168, 85, 247, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(6, 182, 212, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.03) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Ground plane */
        .terrarium-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        /* Grid lines */
        .terrarium-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Mascot slots */
        .terrarium-mascot {
            position: absolute;
            cursor: pointer;
            transition: filter 0.2s ease;
            z-index: 2;
        }

        .terrarium-mascot:hover {
            filter: brightness(1.3);
            z-index: 5;
        }

        /* ---- Info Panel ---- */

        .mascot-info-overlay {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            width: 260px;
            background: rgba(13, 17, 23, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 20px;
            z-index: 20;
            font-family: 'Courier New', monospace;
            animation: speech-appear 0.2s ease-out;
        }

        .mascot-info-overlay.active {
            display: block;
        }

        .mascot-info-overlay .info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mascot-info-overlay .info-mascot-preview {
            flex-shrink: 0;
        }

        .mascot-info-overlay .info-title h3 {
            margin: 0;
            font-size: 16px;
            color: #fff;
        }

        .mascot-info-overlay .info-title .info-house {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        .mascot-info-overlay .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
        }

        .mascot-info-overlay .info-label {
            color: rgba(255, 255, 255, 0.45);
        }

        .mascot-info-overlay .info-value {
            color: rgba(255, 255, 255, 0.85);
        }

        .mascot-info-overlay .info-personality {
            margin-top: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
            font-style: italic;
            line-height: 1.5;
        }

        .mascot-info-overlay .info-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            padding: 4px 8px;
        }

        .mascot-info-overlay .info-close:hover {
            color: #fff;
        }

        /* ---- Controls ---- */

        .terrarium-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .terrarium-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .terrarium-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .terrarium-btn.active {
            background: rgba(96, 165, 250, 0.15);
            border-color: rgba(96, 165, 250, 0.4);
            color: #60a5fa;
        }

        /* ---- Encounter Log ---- */

        .encounter-log {
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .encounter-log h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Courier New', monospace;
        }

        .encounter-log-entry {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .encounter-log-entry:last-child {
            border-bottom: none;
        }

        .encounter-log-entry .encounter-names {
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
        }

        .encounter-log-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 20px;
        }

        /* Season indicator */
        .season-badge {
            display: inline-block;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            padding: 4px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .terrarium-arena {
                height: 450px;
            }

            .mascot-info-overlay {
                width: 200px;
                padding: 14px;
                top: 8px;
                right: 8px;
            }

            .terrarium-mascot .mascot-entity {
                transform: scale(0.75);
            }
        }
    </style>
</head>
<body>

<div class="terrarium-page">
    <div class="terrarium-header">
        <h1>Mascot Terrarium</h1>
        <p>All house mascots in their shared digital habitat</p>
        <div class="season-badge" id="season-badge">Loading season...</div>
    </div>

    <div class="terrarium-controls">
        <button class="terrarium-btn active" id="btn-auto" onclick="toggleAuto()">Auto Encounters: ON</button>
        <button class="terrarium-btn" onclick="forceEncounter()">Trigger Encounter</button>
        <button class="terrarium-btn" onclick="resetPositions()">Reset Positions</button>
    </div>

    <div class="terrarium-arena" id="terrarium-arena">
        <div class="terrarium-grid"></div>
        <div class="terrarium-ground"></div>
        <!-- Mascots injected by JS -->
        <div class="mascot-info-overlay" id="mascot-info">
            <button class="info-close" onclick="closeInfo()">[x]</button>
            <div class="info-header">
                <div class="info-mascot-preview" id="info-preview"></div>
                <div class="info-title">
                    <h3 id="info-name">--</h3>
                    <div class="info-house" id="info-house">--</div>
                </div>
            </div>
            <div class="info-row"><span class="info-label">Domain</span><span class="info-value" id="info-domain">--</span></div>
            <div class="info-row"><span class="info-label">Color</span><span class="info-value" id="info-color">--</span></div>
            <div class="info-row"><span class="info-label">Idle Style</span><span class="info-value" id="info-idle">--</span></div>
            <div class="info-row"><span class="info-label">Season</span><span class="info-value" id="info-season">--</span></div>
            <div class="info-personality" id="info-personality">--</div>
        </div>
    </div>

    <div class="encounter-log" id="encounter-log">
        <h3>// Encounter Log</h3>
        <div class="encounter-log-empty" id="log-empty">No encounters yet. Waiting...</div>
        <div id="log-entries"></div>
    </div>
</div>

<script src="mascot-seasonal.js"></script>
<script src="MascotManager.js"></script>
<script src="mascot-encounters.js"></script>
<script>
(function () {
    'use strict';

    var mgr = MascotManager.getInstance();
    var arena = document.getElementById('terrarium-arena');
    var keys = mgr.getMascotKeys();
    var autoEnabled = true;

    // ---- Placement grid (spread mascots across the arena) ----

    var positions = [
        { x: 8, y: 12 },   { x: 30, y: 8 },   { x: 55, y: 15 },
        { x: 78, y: 10 },  { x: 15, y: 40 },   { x: 42, y: 35 },
        { x: 68, y: 38 },  { x: 88, y: 42 },   { x: 22, y: 65 },
        { x: 52, y: 60 },  { x: 75, y: 68 }
    ];

    // ---- Spawn mascots ----

    keys.forEach(function (houseKey, i) {
        var pos = positions[i] || { x: Math.random() * 80 + 5, y: Math.random() * 70 + 5 };

        var wrapper = document.createElement('div');
        wrapper.className = 'terrarium-mascot';
        wrapper.setAttribute('data-mascot', houseKey);
        wrapper.style.left = pos.x + '%';
        wrapper.style.top = pos.y + '%';

        // Wander animation with unique offsets
        var wx1 = (Math.random() * 40 - 20).toFixed(0) + 'px';
        var wy1 = (Math.random() * 30 - 15).toFixed(0) + 'px';
        var wx2 = (Math.random() * 40 - 20).toFixed(0) + 'px';
        var wy2 = (Math.random() * 30 - 15).toFixed(0) + 'px';
        var wx3 = (Math.random() * 40 - 20).toFixed(0) + 'px';
        var wy3 = (Math.random() * 30 - 15).toFixed(0) + 'px';
        var dur = (10 + Math.random() * 8).toFixed(1) + 's';

        wrapper.style.setProperty('--wander-x1', wx1);
        wrapper.style.setProperty('--wander-y1', wy1);
        wrapper.style.setProperty('--wander-x2', wx2);
        wrapper.style.setProperty('--wander-y2', wy2);
        wrapper.style.setProperty('--wander-x3', wx3);
        wrapper.style.setProperty('--wander-y3', wy3);
        wrapper.style.setProperty('--wander-duration', dur);
        wrapper.classList.add('mascot-terrarium-wander');

        // Render mascot entity
        var entity = mgr.renderMascot(houseKey, { showName: true, size: 'md' });
        wrapper.appendChild(entity);

        // Click to show info
        wrapper.addEventListener('click', function () {
            showInfo(houseKey);
        });

        arena.appendChild(wrapper);
    });

    // ---- Season badge ----

    var season = MascotSeasonal.getCurrentSeason();
    document.getElementById('season-badge').textContent = 'Season: ' + season.label;
    document.getElementById('season-badge').style.borderColor = season.palette.accent;
    document.getElementById('season-badge').style.color = season.palette.accent;

    // ---- Info panel ----

    window.showInfo = function (houseKey) {
        var m = mgr.getMascot(houseKey);
        if (!m) return;

        document.getElementById('info-name').textContent = m.name;
        document.getElementById('info-house').textContent = 'House ' + m.house;
        document.getElementById('info-domain').textContent = m.domain;
        document.getElementById('info-color').textContent = m.color;
        document.getElementById('info-color').style.color = m.color;
        document.getElementById('info-idle').textContent = m.idleAnimation.replace('mascot-idle-', '');
        document.getElementById('info-season').textContent = season.label;
        document.getElementById('info-personality').textContent = '"' + m.personality + '"';

        // Mini mascot preview
        var preview = document.getElementById('info-preview');
        preview.innerHTML = '';
        var miniEntity = mgr.renderMascot(houseKey, { showName: false, size: 'sm' });
        preview.appendChild(miniEntity);

        document.getElementById('mascot-info').classList.add('active');
    };

    window.closeInfo = function () {
        document.getElementById('mascot-info').classList.remove('active');
    };

    // ---- Encounters ----

    MascotEncounters.init({
        container: arena,
        autoInterval: autoEnabled ? 15000 : 0
    });

    // Log encounters
    document.addEventListener('mascot-encounter', function (e) {
        var enc = e.detail;
        var mA = mgr.getMascot(enc.houseA);
        var mB = mgr.getMascot(enc.houseB);
        if (!mA || !mB) return;

        var logEmpty = document.getElementById('log-empty');
        if (logEmpty) logEmpty.style.display = 'none';

        var entry = document.createElement('div');
        entry.className = 'encounter-log-entry';

        var time = new Date(enc.timestamp);
        var timeStr = time.toLocaleTimeString();

        entry.innerHTML =
            '<span class="encounter-names" style="color:' + mA.color + '">' + mA.name + '</span>' +
            ' <span style="color:rgba(255,255,255,0.3)">x</span> ' +
            '<span class="encounter-names" style="color:' + mB.color + '">' + mB.name + '</span>' +
            ' <span style="color:rgba(255,255,255,0.25)">@ ' + timeStr + '</span>';

        var logEntries = document.getElementById('log-entries');
        logEntries.insertBefore(entry, logEntries.firstChild);

        // Keep log trimmed
        while (logEntries.children.length > 20) {
            logEntries.removeChild(logEntries.lastChild);
        }
    });

    // ---- Controls ----

    window.toggleAuto = function () {
        autoEnabled = !autoEnabled;
        var btn = document.getElementById('btn-auto');
        if (autoEnabled) {
            MascotEncounters.startAuto(15000);
            btn.textContent = 'Auto Encounters: ON';
            btn.classList.add('active');
        } else {
            MascotEncounters.stopAuto();
            btn.textContent = 'Auto Encounters: OFF';
            btn.classList.remove('active');
        }
    };

    window.forceEncounter = function () {
        MascotEncounters.triggerRandom();
    };

    window.resetPositions = function () {
        var wrappers = arena.querySelectorAll('.terrarium-mascot');
        wrappers.forEach(function (w, i) {
            var pos = positions[i] || { x: 50, y: 50 };
            w.style.left = pos.x + '%';
            w.style.top = pos.y + '%';
        });
    };

    // Close info when clicking arena background
    arena.addEventListener('click', function (e) {
        if (e.target === arena || e.target.classList.contains('terrarium-grid') || e.target.classList.contains('terrarium-ground')) {
            closeInfo();
        }
    });
})();
</script>

</body>
</html>
