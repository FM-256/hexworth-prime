<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascot Widget | Hexworth Prime</title>
    <link rel="stylesheet" href="mascot-animations.css">
    <style>
        /* Demo page styling — widget itself is self-contained */
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        h1 {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
        }

        .demo-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .demo-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* ========================================
           MASCOT WIDGET (embeddable component)
           ======================================== */

        .mascot-widget {
            width: 200px;
            height: 200px;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .mascot-widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--widget-color, #60a5fa), transparent);
        }

        .mascot-widget .widget-mascot-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .mascot-widget .widget-info {
            text-align: center;
            padding: 0 12px 12px;
        }

        .mascot-widget .widget-name {
            font-size: 13px;
            font-weight: 600;
            color: #e6edf3;
            margin: 0 0 2px 0;
        }

        .mascot-widget .widget-house {
            font-size: 10px;
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mascot-widget .widget-status {
            font-size: 10px;
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
        }

        .mascot-widget .widget-season-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            font-family: 'Courier New', monospace;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        /* Reaction flash overlay */
        .mascot-widget .widget-flash {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mascot-widget .widget-flash.flash-success {
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
            opacity: 1;
        }

        .mascot-widget .widget-flash.flash-failure {
            background: radial-gradient(circle at center, rgba(239, 68, 68, 0.15) 0%, transparent 70%);
            opacity: 1;
        }

        .mascot-widget .widget-flash.flash-achievement {
            background: radial-gradient(circle at center, rgba(250, 204, 21, 0.15) 0%, transparent 70%);
            opacity: 1;
        }
    </style>
</head>
<body>

<h1>Mascot Widget Demo</h1>

<div class="demo-controls">
    <select id="house-select" class="demo-btn" onchange="switchHouse(this.value)">
        <option value="shield">Shield</option>
        <option value="dark_arts">Dark Arts</option>
        <option value="eye">Eye</option>
        <option value="cloud">Cloud</option>
        <option value="forge">Forge</option>
        <option value="web" selected>Web</option>
        <option value="code">Code</option>
        <option value="key">Key</option>
        <option value="script">Script</option>
        <option value="ai">AI</option>
        <option value="matrix">Matrix</option>
    </select>
    <button class="demo-btn" onclick="reactWidget('achievement')">Achievement</button>
    <button class="demo-btn" onclick="reactWidget('happy')">Happy</button>
    <button class="demo-btn" onclick="reactWidget('failure')">Failure</button>
    <button class="demo-btn" onclick="reactWidget('sad')">Sad</button>
    <button class="demo-btn" onclick="reactWidget('levelup')">Level Up</button>
    <button class="demo-btn" onclick="reactWidget('greeting')">Greeting</button>
</div>

<div class="mascot-widget" id="mascot-widget">
    <div class="widget-season-tag" id="widget-season"></div>
    <div class="widget-mascot-area" id="widget-mascot-area"></div>
    <div class="widget-info">
        <div class="widget-name" id="widget-name">--</div>
        <div class="widget-house" id="widget-house">--</div>
        <div class="widget-status" id="widget-status">idle</div>
    </div>
    <div class="widget-flash" id="widget-flash"></div>
</div>

<script src="mascot-seasonal.js"></script>
<script src="MascotManager.js"></script>
<script>
/**
 * MascotWidget — embeddable mascot widget component
 *
 * Standalone usage:
 *   MascotWidget.init({ container: el, house: 'shield' });
 *   MascotWidget.react('achievement');
 */
var MascotWidget = (function () {
    'use strict';

    var mgr = MascotManager.getInstance();
    var _container = null;
    var _mascotArea = null;
    var _nameEl = null;
    var _houseEl = null;
    var _statusEl = null;
    var _seasonEl = null;
    var _flashEl = null;
    var _currentHouse = null;
    var _entity = null;
    var _flashTimer = null;

    /**
     * Initialize widget
     * @param {object} opts — { container, house, mascotArea, nameEl, houseEl, statusEl, seasonEl, flashEl }
     */
    function init(opts) {
        opts = opts || {};
        _container = opts.container || document.getElementById('mascot-widget');
        _mascotArea = opts.mascotArea || document.getElementById('widget-mascot-area');
        _nameEl = opts.nameEl || document.getElementById('widget-name');
        _houseEl = opts.houseEl || document.getElementById('widget-house');
        _statusEl = opts.statusEl || document.getElementById('widget-status');
        _seasonEl = opts.seasonEl || document.getElementById('widget-season');
        _flashEl = opts.flashEl || document.getElementById('widget-flash');

        // Season tag
        var season = MascotSeasonal.getCurrentSeason();
        if (_seasonEl) {
            _seasonEl.textContent = season.label;
            _seasonEl.style.color = season.palette.accent;
        }

        setHouse(opts.house || 'web');
    }

    /**
     * Set the displayed house mascot
     * @param {string} house
     */
    function setHouse(house) {
        _currentHouse = house.replace(/-/g, '_');
        mgr.bind(_currentHouse);

        var m = mgr.getMascot(_currentHouse);
        if (!m) return;

        // Update info
        if (_nameEl) _nameEl.textContent = m.name;
        if (_houseEl) _houseEl.textContent = 'House ' + m.house;
        if (_statusEl) _statusEl.textContent = 'idle';

        // Set accent color
        if (_container) {
            _container.style.setProperty('--widget-color', m.color);
        }

        // Render mascot
        if (_mascotArea) {
            _mascotArea.innerHTML = '';
            _entity = mgr.renderMascot(_currentHouse, { showName: false, size: 'md' });
            _mascotArea.appendChild(_entity);
            mgr.bindElement(_entity);
        }
    }

    /**
     * Trigger a reaction on the widget mascot
     * @param {string} event — achievement, levelup, failure, happy, sad, greeting
     */
    function react(event) {
        if (!_entity || !_currentHouse) return;

        mgr.triggerReaction(event, _entity);

        // Update status
        if (_statusEl) _statusEl.textContent = event;

        // Flash effect
        _showFlash(event);

        // Reset status after animation
        setTimeout(function () {
            if (_statusEl) _statusEl.textContent = 'idle';
        }, 1500);
    }

    /**
     * Show flash overlay for reaction type
     */
    function _showFlash(event) {
        if (!_flashEl) return;

        clearTimeout(_flashTimer);
        _flashEl.className = 'widget-flash';

        var flashClass = 'flash-success';
        if (event === 'failure' || event === 'sad') flashClass = 'flash-failure';
        if (event === 'achievement' || event === 'levelup') flashClass = 'flash-achievement';

        // Force reflow
        void _flashEl.offsetWidth;
        _flashEl.classList.add(flashClass);

        _flashTimer = setTimeout(function () {
            _flashEl.className = 'widget-flash';
        }, 1000);
    }

    /**
     * Get current mascot info
     * @returns {object|null}
     */
    function getCurrentMascot() {
        return mgr.getMascot(_currentHouse);
    }

    return {
        init: init,
        setHouse: setHouse,
        react: react,
        getCurrentMascot: getCurrentMascot
    };
})();

// ---- Demo page wiring ----

MascotWidget.init({ house: 'web' });

function switchHouse(house) {
    MascotWidget.setHouse(house);
}

function reactWidget(event) {
    MascotWidget.react(event);
}
</script>

</body>
</html>
