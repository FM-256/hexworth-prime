        // ─────────────────────────────────────────────────────────────────────
        // STEP 1.4: CONTENT REGISTRY LOADER (IMPLEMENTED)
        // Uses dynamic script tag to load ContentRegistry global
        // ─────────────────────────────────────────────────────────────────────

        async function loadContentRegistry() {
            setStatus('running', 'Loading ContentRegistry...');

            return new Promise((resolve, reject) => {
                // Check if already loaded
                if (window.ContentRegistry && window.ContentRegistry.content) {
                    resolve(window.ContentRegistry.content);
                    return;
                }

                // Create script tag to load ContentRegistry
                const script = document.createElement('script');
                script.src = CONFIG.contentRegistryPath;
                script.onload = () => {
                    // ContentRegistry.js now explicitly sets window.ContentRegistry
                    if (window.ContentRegistry && window.ContentRegistry.content) {
                        resolve(window.ContentRegistry.content);
                    } else {
                        console.error('ContentRegistry check failed:', {
                            windowHasIt: !!window.ContentRegistry,
                            hasContent: window.ContentRegistry ? !!window.ContentRegistry.content : false
                        });
                        reject(new Error('ContentRegistry loaded but content object not found'));
                    }
                };
                script.onerror = (e) => {
                    console.error('Script load error:', e);
                    reject(new Error('Failed to load ContentRegistry.js'));
                };
                document.head.appendChild(script);
            });
        }

        // ─────────────────────────────────────────────────────────────────────
        // STEP 1.5: SAMPLE_MODULES EXTRACTOR (IMPLEMENTED)
        // Parses SAMPLE_MODULES from house index.html using regex
        // Adapted from migrate-to-content-registry.js patterns
        // ─────────────────────────────────────────────────────────────────────

        async function loadSampleModules(house) {
            setStatus('running', `Loading SAMPLE_MODULES for ${house}...`);

            try {
                const response = await fetch(CONFIG.houseIndexPath(house));
                if (!response.ok) {
                    console.warn(`<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Could not fetch ${house}/index.html: ${response.status}`);
                    return [];
                }

                const html = await response.text();

                // Find SAMPLE_MODULES array using regex
                const modulesMatch = html.match(/const\s+SAMPLE_MODULES\s*=\s*\[([\s\S]*?)\];/);
                if (!modulesMatch) {
                    console.warn(`<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> No SAMPLE_MODULES found in ${house}/index.html`);
                    return [];
                }

                const modulesString = modulesMatch[1];
                const modules = [];

                // Parse individual module objects using regex
                // Match objects like {id: '...', title: '...', ...}
                const objectRegex = /\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g;
                let match;

                while ((match = objectRegex.exec(modulesString)) !== null) {
                    const objString = match[1];
                    const module = {};

                    // Extract id
                    const idMatch = objString.match(/id:\s*['"]([^'"]+)['"]/);
                    if (idMatch) module.id = idMatch[1];

                    // Extract title
                    const titleMatch = objString.match(/title:\s*['"]([^'"]+)['"]/);
                    if (titleMatch) module.title = titleMatch[1];

                    // Extract href (the URL we need to compare)
                    const hrefMatch = objString.match(/href:\s*['"]([^'"]+)['"]/);
                    if (hrefMatch) module.href = hrefMatch[1];

                    // Extract status
                    const statusMatch = objString.match(/status:\s*['"]([^'"]+)['"]/);
                    if (statusMatch) module.status = statusMatch[1];

                    // Extract category
                    const categoryMatch = objString.match(/category:\s*['"]([^'"]+)['"]/);
                    if (categoryMatch) module.category = categoryMatch[1];

                    if (module.id) {
                        module.house = house;
                        modules.push(module);
                    }
                }

                return modules;

            } catch (error) {
                console.error(`Error loading ${house}:`, error);
                return [];
            }
        }

        // ─────────────────────────────────────────────────────────────────────
        // URL NORMALIZATION HELPERS
        // Handles AD-005 (CloudFront) and AD-006 (Dual System) patterns
        // ─────────────────────────────────────────────────────────────────────

        function isExternalUrl(url) {
            return url && (url.startsWith('http://') || url.startsWith('https://'));
        }

        function normalizeUrl(url, house) {
            if (!url) return null;

            // External URLs: return as-is
            if (isExternalUrl(url)) {
                return url;
            }

            // Local path from SAMPLE_MODULES: relative to house directory
            // Normalize to: houses/{house}/{path}
            return `houses/${house}/${url}`;
        }

        function extractPrimaryUrl(components) {
            /*
             * ContentRegistry uses components object with keys like:
             * - applet, presentation, quiz, lab, tool
             *
             * Priority order for comparison:
             * 1. applet (most common)
             * 2. presentation
             * 3. quiz
             * 4. lab
             * 5. tool
             * 6. any other key
             */
            if (!components || typeof components !== 'object') return null;

            const priority = ['applet', 'presentation', 'quiz', 'lab', 'tool'];

            for (const key of priority) {
                if (components[key]) return components[key];
            }

            // Return first available if none of priority keys found
            const keys = Object.keys(components);
            return keys.length > 0 ? components[keys[0]] : null;
        }

        // ISSUE-013 Fix (Dec 30, 2025): Extract ALL component URLs for comparison
        // This fixes false positives when SAMPLE_MODULES.href points to presentation
        // but ContentRegistry has both applet AND presentation components
        function extractAllUrls(components) {
            if (!components || typeof components !== 'object') return [];
            return Object.values(components).filter(url => url && typeof url === 'string');
        }

        // ─────────────────────────────────────────────────────────────────────
        // COMING SOON DETECTION HELPERS
        // Full-text search approach - replaces broken regex extraction
        // Added: 2025-12-28 (fixes template literal parsing bug)
        // ─────────────────────────────────────────────────────────────────────

        function categorizeComingSoon(line, context) {
            const fullContext = context.join('\n').toLowerCase();
            const lineLower = line.toLowerCase();

            // Learning paths - openPath function or learning path cards
            if (fullContext.includes('openpath') || fullContext.includes('learning path') || fullContext.includes('path-card')) {
                return 'Learning Path';
            }

            // Quiz features
            if (fullContext.includes('quiz') || lineLower.includes('quiz')) {
                return 'Quiz Feature';
            }

            // Animation/interactive features
            if (fullContext.includes('animation') || fullContext.includes('step-through')) {
                return 'Interactive Feature';
            }

            // Module handlers
            if (fullContext.includes('module') && fullContext.includes('onclick')) {
                return 'Module Handler';
            }

            // Static HTML banners
            if (lineLower.includes('<h') || lineLower.includes('<p>') || lineLower.includes('<div')) {
                return 'Static Banner';
            }

            return 'Other';
        }

        function extractComingSoonIdentifier(context, category) {
            const fullContext = context.join('\n');

            // For learning paths, find the path ID and name
            if (category === 'Learning Path') {
                const pathIdMatch = fullContext.match(/openPath\(['"]([^'"]+)['"]\)/);
                const pathNameMatch = fullContext.match(/class="path-name">([^<]+)</);

                if (pathIdMatch || pathNameMatch) {
                    return {
                        id: pathIdMatch ? pathIdMatch[1] : null,
                        name: pathNameMatch ? pathNameMatch[1] : (pathIdMatch ? pathIdMatch[1] : 'Unknown Path')
                    };
                }
            }

            // For quizzes, try to find quiz name
            if (category === 'Quiz Feature') {
                const quizMatch = fullContext.match(/([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)\s*Quiz/);
                if (quizMatch) {
                    return { id: null, name: quizMatch[0] };
                }
            }

            // For modules, find module title
            const titleMatch = fullContext.match(/title:\s*['"]([^'"]+)['"]/);
            if (titleMatch) {
                return { id: null, name: titleMatch[1] };
            }

            // Try to find any button text
            const buttonMatch = fullContext.match(/<button[^>]*>([^<]+)</);
            if (buttonMatch) {
                return { id: null, name: buttonMatch[1].trim() };
            }

            return { id: null, name: null };
        }

        /**
         * Detect if a "coming soon" match is inside a function definition
         * Returns the function name if found, null otherwise
         */
        function detectFunctionDefinition(context) {
            const fullContext = context.join('\n');

            // Look for function definition pattern in context
            const funcMatch = fullContext.match(/function\s+(\w+)\s*\([^)]*\)\s*\{/);
            if (funcMatch) {
                return funcMatch[1]; // Return function name
            }

            // Also check for arrow functions assigned to variables
            const arrowMatch = fullContext.match(/(?:const|let|var)\s+(\w+)\s*=\s*(?:\([^)]*\)|[^=])\s*=>/);
            if (arrowMatch) {
                return arrowMatch[1];
            }

            return null;
        }

        /**
         * Find all callers of a function in the HTML file
         * Returns array of { id, name, line } for each call
         */
        function findFunctionCallers(html, funcName, lines) {
            const callers = [];

            // Pattern to find function calls with string argument: funcName('arg') or funcName("arg")
            const callPattern = new RegExp(`${funcName}\\s*\\(\\s*['"]([^'"]+)['"]\\s*\\)`, 'g');

            let match;
            while ((match = callPattern.exec(html)) !== null) {
                const argValue = match[1];

                // Calculate line number for this call
                const beforeMatch = html.substring(0, match.index);
                const lineNumber = (beforeMatch.match(/\n/g) || []).length + 1;

                // Get context around the call to find display name
                const contextStart = Math.max(0, lineNumber - 5);
                const contextEnd = Math.min(lines.length, lineNumber + 3);
                const callContext = lines.slice(contextStart, contextEnd);
                const fullCallContext = callContext.join('\n');

                // Try to find a human-readable name near the call
                let displayName = argValue; // Default to the argument value

                // Look for path-name, module title, or other display text
                const namePatterns = [
                    /class="path-name">([^<]+)</,
                    /class="module-title">([^<]+)</,
                    /title:\s*['"]([^'"]+)['"]/,
                    />([A-Z][^<]{2,30})</  // Any capitalized text in a tag
                ];

                for (const pattern of namePatterns) {
                    const nameMatch = fullCallContext.match(pattern);
                    if (nameMatch && nameMatch[1].trim().length > 2) {
                        displayName = nameMatch[1].trim();
                        break;
                    }
                }

                callers.push({
                    id: argValue,
                    name: displayName,
                    line: lineNumber
                });
            }

            return callers;
        }

        // ─────────────────────────────────────────────────────────────────────
        // STEP 1.6: COMPARISON ENGINE (IMPLEMENTED)
        // Compares SAMPLE_MODULES with ContentRegistry entries
        // ─────────────────────────────────────────────────────────────────────

        function compareContent(contentRegistry, sampleModules) {
            const results = {
                summary: { synced: 0, mismatch: 0, sampleOnly: 0, registryOnly: 0, total: 0 },
                houses: {},
                timestamp: new Date().toISOString()
            };

            // Build lookup of ContentRegistry by ID and house
            const registryByHouse = {};
            for (const [id, entry] of Object.entries(contentRegistry)) {
                const house = entry.house;
                if (!registryByHouse[house]) registryByHouse[house] = {};
                registryByHouse[house][id] = entry;
            }

            // Process each house
            for (const house of CONFIG.houses) {
                const houseResults = {
                    synced: [],
                    mismatch: [],
                    sampleOnly: [],
                    registryOnly: []
                };

                const sampleEntries = sampleModules[house] || [];
                const registryEntries = registryByHouse[house] || {};

                // Track which registry entries we've seen
                const seenRegistryIds = new Set();

                // Compare each SAMPLE_MODULES entry
                for (const sample of sampleEntries) {
                    const registryEntry = registryEntries[sample.id];
                    results.summary.total++;

                    if (!registryEntry) {
                        // In SAMPLE_MODULES but not in ContentRegistry
                        houseResults.sampleOnly.push({
                            id: sample.id,
                            title: sample.title,
                            sampleUrl: sample.href,
                            registryUrl: null,
                            status: 'sampleOnly',
                            // Fix location diagnostics
                            diagnosis: 'Entry exists in SAMPLE_MODULES but not in ContentRegistry',
                            fixLocation: '_app/config/content-registry.js',
                            fixAction: `Add new entry with id: '${sample.id}' and house: '${house}'`
                        });
                        results.summary.sampleOnly++;
                    } else {
                        seenRegistryIds.add(sample.id);

                        // Normalize URLs for comparison
                        const sampleUrl = normalizeUrl(sample.href, house);
                        const registryUrl = extractPrimaryUrl(registryEntry.components);

                        // ISSUE-013 Fix (Dec 30, 2025): Compare against ALL component URLs
                        // This fixes false positives when entry has both applet and presentation
                        // but SAMPLE_MODULES.href points to the non-primary component
                        const allRegistryUrls = extractAllUrls(registryEntry.components);
                        const urlsMatch = allRegistryUrls.some(url => sampleUrl === url);

                        if (urlsMatch) {
                            houseResults.synced.push({
                                id: sample.id,
                                title: sample.title,
                                sampleUrl: sample.href,
                                registryUrl: registryUrl,
                                normalizedSample: sampleUrl,
                                status: 'synced'
                            });
                            results.summary.synced++;
                        } else {
                            // Diagnose WHY it's a mismatch
                            let diagnosis, fixAction;
                            const hasEmptyComponents = !registryUrl && registryEntry.components &&
                                Object.keys(registryEntry.components).length === 0;

                            if (hasEmptyComponents) {
                                diagnosis = 'ContentRegistry entry exists but components object is empty';
                                fixAction = 'Add component URLs to the components: {} object';
                            } else if (!registryUrl) {
                                diagnosis = 'ContentRegistry entry has no valid component URLs';
                                fixAction = 'Add presentation/lab/quiz/applet URLs to components';
                            } else {
                                diagnosis = 'URLs differ between SAMPLE_MODULES and ContentRegistry';
                                fixAction = 'Update the outdated URL to match the correct source';
                            }

                            houseResults.mismatch.push({
                                id: sample.id,
                                title: sample.title || registryEntry.title,
                                sampleUrl: sample.href,
                                registryUrl: registryUrl,
                                normalizedSample: sampleUrl,
                                status: 'mismatch',
                                // Fix location diagnostics
                                diagnosis: diagnosis,
                                fixLocation: '_app/config/content-registry.js',
                                fixAction: fixAction
                            });
                            results.summary.mismatch++;
                        }
                    }
                }

                // Find registry entries not in SAMPLE_MODULES
                for (const [id, entry] of Object.entries(registryEntries)) {
                    if (!seenRegistryIds.has(id)) {
                        houseResults.registryOnly.push({
                            id: id,
                            title: entry.title,
                            sampleUrl: null,
                            registryUrl: extractPrimaryUrl(entry.components),
                            status: 'registryOnly',
                            // Fix location diagnostics
                            diagnosis: 'Entry exists in ContentRegistry but not in SAMPLE_MODULES',
                            fixLocation: `_app/houses/${house}/index.html`,
                            fixAction: `Add entry to SAMPLE_MODULES array with id: '${id}'`
                        });
                        results.summary.registryOnly++;
                        results.summary.total++;
                    }
                }

                results.houses[house] = houseResults;
            }

            return results;
        }

        // ─────────────────────────────────────────────────────────────────────
        // STEP 1.7: RESULTS RENDERER (IMPLEMENTED)
        // Renders collapsible house sections with status indicators
        // ─────────────────────────────────────────────────────────────────────

        function renderResults(results) {
            // Update summary
            const summaryHtml = `
                <span class="summary-stat synced"><img src="/assets/images/icons/icon-checkbox.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${results.summary.synced} Synced</span>
                <span class="summary-stat mismatch"><img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${results.summary.mismatch} Mismatches</span>
                <span class="summary-stat warning"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${results.summary.sampleOnly} Sample Only</span>
                <span class="summary-stat info"><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${results.summary.registryOnly} Registry Only</span>
            `;
            document.getElementById('resultsSummary').innerHTML = summaryHtml;

            // Render house sections
            let housesHtml = '';

            for (const house of CONFIG.houses) {
                const houseData = results.houses[house];
                if (!houseData) continue;

                const totalItems = houseData.synced.length + houseData.mismatch.length +
                                   houseData.sampleOnly.length + houseData.registryOnly.length;

                const hasMismatches = houseData.mismatch.length > 0 || houseData.sampleOnly.length > 0;
                const statusClass = hasMismatches ? 'has-issues' : 'all-good';

                housesHtml += `
                    <div class="house-section" data-house="${house}">
                        <div class="house-header" onclick="toggleHouse('${house}')">
                            <div class="house-title">
                                <span class="icon">${CONFIG.houseIcons[house]}</span>
                                <span>${CONFIG.houseNames[house]}</span>
                            </div>
                            <div class="house-stats">
                                <span style="color: var(--accent-green);"><img src="/assets/images/icons/icon-checkbox.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${houseData.synced.length}</span>
                                <span style="color: var(--accent-red);"><img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${houseData.mismatch.length}</span>
                                <span style="color: var(--accent-yellow);"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${houseData.sampleOnly.length}</span>
                                <span style="color: var(--accent-cyan);"><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${houseData.registryOnly.length}</span>
                                <span class="chevron">▼</span>
                            </div>
                        </div>
                        <div class="house-content">
                            ${renderHouseContent(houseData, house)}
                        </div>
                    </div>
                `;
            }

            // Add export button
            housesHtml += `
                <div class="export-section">
                    <button class="btn btn-secondary" onclick="exportResults()">
                        <span><img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Export JSON
                    </button>
                </div>
            `;

            document.getElementById('resultsBody').innerHTML = housesHtml;
        }

        function renderHouseContent(houseData, house) {
            let html = '';

            // Mismatches first (most important)
            if (houseData.mismatch.length > 0) {
                html += `<h4 style="color: var(--accent-red); margin-bottom: 0.5rem;"><img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> URL Mismatches (${houseData.mismatch.length})</h4>`;
                html += houseData.mismatch.map(item => renderContentItem(item, 'mismatch')).join('');
            }

            // Sample Only
            if (houseData.sampleOnly.length > 0) {
                html += `<h4 style="color: var(--accent-yellow); margin: 1rem 0 0.5rem;"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> In SAMPLE_MODULES Only (${houseData.sampleOnly.length})</h4>`;
                html += `<p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                    These entries exist in house index.html but not in ContentRegistry. Dashboard search won't find them.
                </p>`;
                html += houseData.sampleOnly.map(item => renderContentItem(item, 'warning')).join('');
            }

            // Registry Only
            if (houseData.registryOnly.length > 0) {
                html += `<h4 style="color: var(--accent-cyan); margin: 1rem 0 0.5rem;"><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> In ContentRegistry Only (${houseData.registryOnly.length})</h4>`;
                html += `<p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                    These entries exist in ContentRegistry but not in SAMPLE_MODULES. House page won't show them.
                </p>`;
                html += houseData.registryOnly.map(item => renderContentItem(item, 'info')).join('');
            }

            // Synced (collapsed by default, expandable)
            if (houseData.synced.length > 0) {
                html += `

        async function runSyncAudit() {
            if (auditState.isRunning) return;

            auditState.isRunning = true;
            setButtonState('runSyncAudit', false);
            setStatus('running', 'Starting sync audit...');

            try {
                // Step 1: Load ContentRegistry
                auditState.contentRegistry = await loadContentRegistry();

                // Step 2: Load SAMPLE_MODULES for each house
                for (const house of CONFIG.houses) {
                    auditState.sampleModules[house] = await loadSampleModules(house);
                }

                // Step 3: Compare
                setStatus('running', 'Comparing content...');
                auditState.results = compareContent(
                    auditState.contentRegistry,
                    auditState.sampleModules
                );

                // Step 4: Render
                renderResults(auditState.results);

                const statusMsg = auditState.results.summary.mismatch > 0
                    ? `Audit complete - ${auditState.results.summary.mismatch} issues found!`
                    : 'Audit complete - All synced!';

                setStatus(auditState.results.summary.mismatch > 0 ? 'error' : 'success', statusMsg);

            } catch (error) {
                console.error('Audit failed:', error);
                setStatus('error', `Audit failed: ${error.message}`);
            } finally {
                auditState.isRunning = false;
                setButtonState('runSyncAudit', true);
            }
        }

        // PHASE 2: STRUCTURAL AUDIT (IMPLEMENTED)
        // Detects: Missing category paths, placeholder functions, coming-soon status
        // Discovered via Eye House investigation - Dec 27, 2025
        // ─────────────────────────────────────────────────────────────────────

        async function runStructuralAudit() {
            if (auditState.isRunning) return;

            auditState.isRunning = true;
            setButtonState('runStructuralAudit', false);
            setStatus('running', 'Running structural audit...');

            const results = {
                summary: { issues: 0, warnings: 0, passed: 0 },
                houses: {},
                timestamp: new Date().toISOString()
            };

            try {
                for (const house of CONFIG.houses) {
                    setStatus('running', `Analyzing ${house} house structure...`);

                    const houseResults = await analyzeHouseStructure(house);
                    results.houses[house] = houseResults;

                    results.summary.issues += houseResults.issues.length;
                    results.summary.warnings += houseResults.warnings.length;
                    results.summary.passed += houseResults.passed.length;
                }

                renderStructuralResults(results);

                const statusMsg = results.summary.issues > 0
                    ? `Structural audit complete - ${results.summary.issues} issues found!`
                    : 'Structural audit complete - No critical issues!';

                setStatus(results.summary.issues > 0 ? 'error' : 'success', statusMsg);
                auditState.structuralResults = results;

            } catch (error) {
                console.error('Structural audit failed:', error);
                setStatus('error', `Audit failed: ${error.message}`);
            } finally {
                auditState.isRunning = false;
                setButtonState('runStructuralAudit', true);
            }
        }

        async function analyzeHouseStructure(house) {
            const results = {
                issues: [],      // Critical - breaks functionality
                warnings: [],    // Non-critical - should fix
                passed: [],      // All good
                recommendations: []
            };

            try {
                const response = await fetch(CONFIG.houseIndexPath(house));
                if (!response.ok) {
                    results.issues.push({
                        type: 'missing-index',
                        title: 'House index.html not found',
                        description: `Cannot fetch ${house}/index.html`,
                        fix: `Create index.html for ${house} house`
                    });
                    return results;
                }

                const html = await response.text();

                // ─────────────────────────────────────────────────────────────
                // CHECK 1: CATEGORIES missing `path` property
                // Updated ISSUE-013 (Dec 30, 2025): Skip if house uses category-based filtering
                // ─────────────────────────────────────────────────────────────
                const categoriesMatch = html.match(/const\s+CATEGORIES\s*=\s*\[([\s\S]*?)\];/);
                if (categoriesMatch) {
                    const categoriesStr = categoriesMatch[1];

                    // Check if any category uses .path
                    const hasPathUsage = html.includes('category.path') || html.includes('categoryPath');
                    const hasPathProperty = categoriesStr.includes("path:");

                    // ISSUE-013 Fix: Check if house migrated to category-based filtering
                    // Modern pattern uses module.category instead of category.path
                    const hasCategoryFiltering = html.includes('m.category ===') ||
                                                  html.includes('module.category ===') ||
                                                  html.includes('.category === categoryId') ||
                                                  html.includes("m.category === category");

                    if (hasCategoryFiltering) {
                        // House uses modern category-based filtering - no path property needed
                        results.passed.push({
                            type: 'category-filtering',
                            title: 'Uses category-based filtering (modern pattern)'
                        });
                    } else if (hasPathUsage && !hasPathProperty) {
                        // Still uses old path-based filtering without path property
                        results.issues.push({
                            type: 'missing-category-path',
                            title: 'CATEGORIES missing path property',
                            description: 'Code uses category.path but CATEGORIES objects don\'t have path property. Category filtering will always return 0 results.',
                            fix: `Add path property to each category:\n{ id: 'log-analysis', path: 'presentations/', ... }`,
                            codeLocation: 'CATEGORIES array'
                        });
                    } else if (hasPathProperty) {
                        results.passed.push({
                            type: 'category-path',
                            title: 'CATEGORIES have path property'
                        });
                    }

                    // Count categories
                    const categoryCount = (categoriesStr.match(/id:\s*['"]/g) || []).length;
                    if (categoryCount > 0) {
                        results.passed.push({
                            type: 'categories-defined',
                            title: `${categoryCount} categories defined`
                        });
                    }
                }

                // ─────────────────────────────────────────────────────────────
                // CHECK 2: Placeholder openPath function
                // ─────────────────────────────────────────────────────────────
                const openPathMatch = html.match(/function\s+openPath\s*\([^)]*\)\s*\{([\s\S]*?)\}/);
                if (openPathMatch) {
                    const functionBody = openPathMatch[1];
                    const isPlaceholder = functionBody.includes('alert(') &&
                                          (functionBody.includes('coming soon') ||
                                           functionBody.includes('Coming Soon') ||
                                           !functionBody.includes('window.location') &&
                                           !functionBody.includes('href'));

                    if (isPlaceholder) {
                        results.issues.push({
                            type: 'placeholder-openpath',
                            title: 'openPath() is a placeholder',
                            description: 'Learning path cards will show "coming soon" alert instead of navigating.',
                            fix: 'Implement actual navigation:\nwindow.location.href = `path-view.html?path=${pathId}`;',
                            codeLocation: 'openPath function'
                        });
                    } else {
                        results.passed.push({
                            type: 'openpath-implemented',
                            title: 'openPath() is implemented'
                        });
                    }
                }

                // ─────────────────────────────────────────────────────────────
                // CHECK 3: Modules with 'coming-soon' status
                // ─────────────────────────────────────────────────────────────
                const modulesMatch = html.match(/const\s+SAMPLE_MODULES\s*=\s*\[([\s\S]*?)\];/);
                if (modulesMatch) {
                    const modulesStr = modulesMatch[1];
                    const comingSoonMatches = modulesStr.match(/status:\s*['"]coming-soon['"]/g) || [];

                    if (comingSoonMatches.length > 0) {
                        results.warnings.push({
                            type: 'coming-soon-modules',
                            title: `${comingSoonMatches.length} modules marked as coming-soon`,
                            description: 'These modules show "Coming Soon" when clicked.',
                            fix: 'Update status to "available" when content is ready'
                        });
                    }

                    // Count total modules
                    const moduleCount = (modulesStr.match(/id:\s*['"]/g) || []).length;
                    const availableCount = (modulesStr.match(/status:\s*['"]available['"]/g) || []).length;

                    results.passed.push({
                        type: 'modules-count',
                        title: `${availableCount}/${moduleCount} modules available`
                    });
                }

                // ─────────────────────────────────────────────────────────────
                // CHECK 4: openCategory uses undefined path
                // ─────────────────────────────────────────────────────────────
                if (html.includes('openCategory') && html.includes('categoryPath')) {
                    const openCatMatch = html.match(/function\s+openCategory[\s\S]*?startsWith\s*\(\s*categoryPath\s*\)/);
                    if (openCatMatch && categoriesMatch) {
                        const categoriesStr = categoriesMatch[1];
                        if (!categoriesStr.includes("path:")) {
                            results.issues.push({
                                type: 'category-filter-broken',
                                title: 'Category filter will always fail',
                                description: 'openCategory() filters by categoryPath, but CATEGORIES lack path property. Result: clicking categories shows empty content area.',
                                fix: 'Add path property to CATEGORIES that matches module href prefixes:\npath: "presentations/" or path: "tools/"'
                            });
                        }
                    }
                }

                // ─────────────────────────────────────────────────────────────
                // CHECK 5: Learning paths defined but not implemented
                // ─────────────────────────────────────────────────────────────
                const hasPathCards = html.includes('path-card') && html.includes('openPath');
                if (hasPathCards) {
                    // Check if there's actual path navigation logic
                    const hasPathNavigation = html.includes('path-view') ||
                                              html.includes('pathContent') ||
                                              (html.includes('LearningPaths') && html.includes('getPath'));

                    if (!hasPathNavigation) {
                        results.warnings.push({
                            type: 'paths-not-implemented',
                            title: 'Learning paths UI exists but navigation not implemented',
                            description: 'Path cards are displayed but clicking them only shows alerts.',
                            fix: 'Implement path view page or integrate with LearningPaths.js'
                        });
                    }
                }

            } catch (error) {
                results.issues.push({
                    type: 'parse-error',
                    title: 'Failed to parse house index',
                    description: error.message
                });
            }

            return results;
        }

        function exportStructuralResults() {
            if (!auditState.structuralResults) {
                alert('No structural results to export. Run the structural audit first.');
                return;
            }

            // Only export issues and warnings, not passed items (saves tokens)
            const results = auditState.structuralResults;
            const problemsOnly = {
                summary: {
                    issues: results.summary.issues,
                    warnings: results.summary.warnings
                },
                houses: {}
            };

            for (const [house, data] of Object.entries(results.houses)) {
                const problems = {};
                if (data.issues && data.issues.length > 0) {
                    problems.issues = data.issues;
                }
                if (data.warnings && data.warnings.length > 0) {
                    problems.warnings = data.warnings;
                }
                // Only include house if it has problems
                if (Object.keys(problems).length > 0) {
                    problemsOnly.houses[house] = problems;
                }
            }

            const exportData = {
                _readme: 'Issues and warnings only - passed items excluded to save tokens',
                ...problemsOnly,
                exportedAt: new Date().toISOString()
            };

            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `structural-audit-${new Date().toISOString().slice(0,10)}.json`;
            a.click();

            URL.revokeObjectURL(url);
        }

        async function runFixForge() {
            if (auditState.isRunning) return;

            auditState.isRunning = true;
            setButtonState('runFixForge', false);
            setStatus('running', 'Fix Forge analyzing houses...');

            const fixes = [];

                        });

                auditState.isRunning = false;
                setButtonState('runFixForge', true);

        async function analyzeHouseForFixes(house) {
            const fixes = [];

            try {
                const response = await fetch(CONFIG.houseIndexPath(house));
                if (!response.ok) return fixes;

                const html = await response.text();

                // ─────────────────────────────────────────────────────────────
                // FIX 1: Category-based filtering (RECOMMENDED APPROACH)
                // Better than path-based: modules declare their category,
                // not limited by folder structure
                // ─────────────────────────────────────────────────────────────
                const categoriesMatch = html.match(/const\s+CATEGORIES\s*=\s*\[([\s\S]*?)\];/);
                const modulesMatch = html.match(/const\s+SAMPLE_MODULES\s*=\s*\[([\s\S]*?)\];/);

                if (categoriesMatch && modulesMatch) {
                    const categoriesStr = categoriesMatch[1];
                    const modulesStr = modulesMatch[1];

                    // Check if using old path-based filtering
                    const hasPathUsage = html.includes('category.path') || html.includes('categoryPath');
                    const hasPathProperty = categoriesStr.includes("path:");

                    // Check if already using category-based filtering
                    const hasCategoryOnModules = modulesStr.includes("category:");
                    const hasCategoryFiltering = html.includes('m.category ===') || html.includes('module.category');

                    // Needs fix if: using path-based filtering without path property
                    // AND not already converted to category-based
                    if (hasPathUsage && !hasPathProperty && !hasCategoryFiltering) {
                        // Parse categories to get their IDs
                        const categoryIds = [];
                        const catIdRegex = /id:\s*['"]([^'"]+)['"]/g;
                        let catMatch;
                        while ((catMatch = catIdRegex.exec(categoriesStr)) !== null) {
                            categoryIds.push(catMatch[1]);
                        }

                        // Parse modules to get their IDs and titles
                        const modules = parseModulesBasic(modulesStr);

                        // Find modules missing category field
                        const missingCategory = modules.filter(m => !m.hasCategory);
                        const hasAllCategories = missingCategory.length === 0;

                        // Only report fix if modules are actually missing category
                        if (!hasAllCategories) {
                            // Generate category-based fix code
                            const fixCode = generateCategoryBasedFix(categoryIds, modules, house);

                            // Build list of missing modules for description
                            const missingList = missingCategory.slice(0, 10).map(m => `• ${m.id} (${m.title})`).join('\n');
                            const moreCount = missingCategory.length > 10 ? `\n... and ${missingCategory.length - 10} more` : '';

                            fixes.push({
                                type: 'category-based-fix',
                                title: `Missing category field on ${missingCategory.length} modules`,
                                description: `${missingCategory.length} of ${modules.length} modules missing 'category:' field.\n\nModules needing fix:\n${missingList}${moreCount}`,
                                file: `houses/${house}/index.html`,
                                location: 'SAMPLE_MODULES array',
                                code: fixCode,
                                instruction: 'Add category: field to each module listed above.'
                            });
                        }
                    }
                }

                // ─────────────────────────────────────────────────────────────
                // FIX 2: openPath placeholder replacement
                // ─────────────────────────────────────────────────────────────
                const openPathMatch = html.match(/function\s+openPath\s*\([^)]*\)\s*\{([\s\S]*?)\}/);
                if (openPathMatch) {
                    const functionBody = openPathMatch[1];
                    const isPlaceholder = functionBody.includes('alert(') &&
                                          (functionBody.includes('coming soon') ||
                                           functionBody.includes('Coming Soon'));

                    if (isPlaceholder) {
                        fixes.push({
                            type: 'placeholder-openpath',
                            title: 'Replace placeholder openPath function',
                            description: 'The openPath() function only shows an alert. Replace it with actual navigation logic.',
                            file: `houses/${house}/index.html`,
                            location: 'function openPath() (search for "function openPath")',
                            code: generateOpenPathFix(house),
                            instruction: 'Replace the entire openPath function with this implementation. Customize CERTIFICATION_PATHS for your house\'s learning paths.'
                        });
                    }
                }

            } catch (error) {
                console.error(`Error analyzing ${house}:`, error);
            }

            return fixes;
        }

        function parseModulesBasic(modulesStr) {
            // Extract module id, title, href, and whether it has category
            const modules = [];

            // Split by module objects - find each { ... } block with id:
            const moduleBlocks = modulesStr.split(/\},\s*\{/).map((block, i, arr) => {
                if (i === 0) block = block.replace(/^\s*\{/, '');
                if (i === arr.length - 1) block = block.replace(/\}\s*$/, '');
                return '{' + block + '}';
            });

            moduleBlocks.forEach((block, index) => {
                const idMatch = block.match(/id:\s*['"]([^'"]+)['"]/);
                const titleMatch = block.match(/title:\s*['"]([^'"]+)['"]/);
                const hrefMatch = block.match(/href:\s*['"]([^'"]+)['"]/);
                const hasCategory = block.includes('category:');

                if (idMatch) {
                    modules.push({
                        id: idMatch[1],
                        title: titleMatch ? titleMatch[1] : 'Unknown',
                        href: hrefMatch ? hrefMatch[1] : '',
                        hasCategory: hasCategory
                    });
                }
            });

            return modules;
        }

                console.error('Failed to copy:', err);
                // Fallback for older browsers
                const textarea = document.createElement('textarea');

                textarea.select();

        async function runIncompleteAudit() {
            debug('runIncompleteAudit() called');

            if (auditState.isRunning) return;

            auditState.isRunning = true;
            setButtonState('runIncompleteAudit', false);
            setStatus('running', 'Scanning for incomplete content...');
            debug('Starting incomplete content scan...');

            const results = {
                summary: {
                    comingSoon: 0,
                    placeholderPaths: 0,
                    missingFiles: 0
                },
                houses: {}
            };

            try {
                for (const house of CONFIG.houses) {
                    debug(`Scanning house: ${house}`);
                    setStatus('running', `Scanning ${house} house...`);

                    const houseResult = {
                        comingSoon: [],
                        placeholderPaths: [],
                        missingFiles: []
                    };

                    try {
                        const response = await fetch(CONFIG.houseIndexPath(house));
                        debug(`${house} fetch response:`, response.ok, response.status);
                        if (!response.ok) continue;

                        const html = await response.text();
                        debug(`${house} HTML length:`, html.length);

                        // 1. Find coming-soon modules
                        const modulesMatch = html.match(/const\s+SAMPLE_MODULES\s*=\s*\[([\s\S]*?)\];/);
                        if (modulesMatch) {
                            const modulesStr = modulesMatch[1];
                            // Split into module blocks
                            const moduleBlocks = modulesStr.split(/\},\s*\{/);

                            moduleBlocks.forEach(block => {
                                const idMatch = block.match(/id:\s*['"]([^'"]+)['"]/);
                                const titleMatch = block.match(/title:\s*['"]([^'"]+)['"]/);
                                const statusMatch = block.match(/status:\s*['"]([^'"]+)['"]/);
                                const hrefMatch = block.match(/href:\s*['"]([^'"]+)['"]/);

                                if (statusMatch && statusMatch[1] === 'coming-soon') {
                                    houseResult.comingSoon.push({
                                        id: idMatch ? idMatch[1] : 'unknown',
                                        title: titleMatch ? titleMatch[1] : 'Unknown Module',
                                        href: hrefMatch ? hrefMatch[1] : null
                                    });
                                }
                            });
                        }

                        // 2. Full-text search for "coming soon" patterns
                        // This replaces the broken regex extraction that failed on template literals
                        const lines = html.split('\n');
                        const comingSoonMatches = [...html.matchAll(/coming\s*soon/gi)];

                        debug(`${house}: Found ${comingSoonMatches.length} "coming soon" matches`);

                        // Track which functions we've already traced callers for (avoid duplicates)
                        const tracedFunctions = new Set();

                        for (const match of comingSoonMatches) {
                            // Calculate line number
                            const beforeMatch = html.substring(0, match.index);
                            const lineNumber = (beforeMatch.match(/\n/g) || []).length + 1;
                            const contextLine = lines[lineNumber - 1] || '';

                            // Get surrounding context for categorization
                            const contextStart = Math.max(0, lineNumber - 4);
                            const contextEnd = Math.min(lines.length, lineNumber + 3);
                            const context = lines.slice(contextStart, contextEnd);

                            // Check if this match is inside a function definition
                            const funcName = detectFunctionDefinition(context);

                            // DEBUG: Log what we're finding
                            debug(`Line ${lineNumber}: funcName=${funcName}, context:`, context.slice(0, 3));

                            if (funcName && !tracedFunctions.has(funcName)) {
                                // This "coming soon" is in a function - find all callers
                                tracedFunctions.add(funcName);

                                const callers = findFunctionCallers(html, funcName, lines);

                                // DEBUG: Log callers found
                                debug(`Function ${funcName}: found ${callers.length} callers:`, callers);

                                if (callers.length > 0) {
                                    // Add an entry for EACH caller
                                    for (const caller of callers) {
                                        const category = categorizeComingSoon(
                                            lines[caller.line - 1] || '',
                                            lines.slice(Math.max(0, caller.line - 4), Math.min(lines.length, caller.line + 3))
                                        );

                                        houseResult.placeholderPaths.push({
                                            pathId: caller.id,
                                            name: caller.name,
                                            certification: category,
                                            line: caller.line,
                                            definedAt: lineNumber,
                                            viaFunction: funcName,
                                            text: `Calls ${funcName}('${caller.id}')`
                                        });
                                    }
                                } else {
                                    // Function exists but no callers found - still report it
                                    houseResult.placeholderPaths.push({
                                        pathId: `${funcName}-function`,
                                        name: `${funcName}() function`,
                                        certification: 'Function Definition',
                                        line: lineNumber,
                                        text: `Function "${funcName}" has coming soon but no callers found`
                                    });
                                }
                            } else if (!funcName) {
                                // Not in a function - use original logic
                                const category = categorizeComingSoon(contextLine, context);
                                const identifier = extractComingSoonIdentifier(context, category);

                                houseResult.placeholderPaths.push({
                                    pathId: identifier.id || `line-${lineNumber}`,
                                    name: identifier.name || 'Unknown',
                                    certification: category,
                                    line: lineNumber,
                                    text: contextLine.trim().substring(0, 100)
                                });
                            }
                            // If funcName exists but already traced, skip (avoid duplicate entries)
                        }

                        // 3. Check for missing files (modules with href that don't exist)
                        // This requires checking if files exist - we'll do a HEAD request
                        if (modulesMatch) {
                            const modulesStr = modulesMatch[1];
                            const hrefMatches = [...modulesStr.matchAll(/id:\s*['"]([^'"]+)['"][\s\S]*?title:\s*['"]([^'"]+)['"][\s\S]*?href:\s*['"]([^'"]+)['"]/g)];

                            for (const match of hrefMatches) {
                                const [, id, title, href] = match;
                                // Skip external URLs
                                if (href.startsWith('http')) continue;

                                // Check if file exists
                                try {
                                    const filePath = `../houses/${house}/${href}`;
                                    const fileCheck = await fetch(filePath, { method: 'HEAD' });
                                    if (!fileCheck.ok) {
                                        houseResult.missingFiles.push({
                                            id: id,
                                            title: title,
                                            href: href,
                                            status: fileCheck.status
                                        });
                                    }
                                } catch (e) {
                                    houseResult.missingFiles.push({
                                        id: id,
                                        title: title,
                                        href: href,
                                        status: 'FETCH_ERROR'
                                    });
                                }
                            }
                        }

                    } catch (error) {
                        console.error(`Error scanning ${house}:`, error);
                    }

                    // Only add house if it has incomplete content
                    if (houseResult.comingSoon.length > 0 ||
                        houseResult.placeholderPaths.length > 0 ||
                        houseResult.missingFiles.length > 0) {
                        results.houses[house] = houseResult;
                        results.summary.comingSoon += houseResult.comingSoon.length;
                        results.summary.placeholderPaths += houseResult.placeholderPaths.length;
                        results.summary.missingFiles += houseResult.missingFiles.length;
                    }
                }

                auditState.incompleteResults = results;
                renderIncompleteResults(results);
                setStatus('complete', `Found ${results.summary.comingSoon} coming-soon, ${results.summary.placeholderPaths} placeholder paths, ${results.summary.missingFiles} missing files`);

            } catch (error) {
                console.error('Incomplete audit failed:', error);
                setStatus('error', 'Incomplete audit failed: ' + error.message);
            }

            auditState.isRunning = false;
            setButtonState('runIncompleteAudit', true);
        }

        function renderIncompleteResults(results) {
            const resultsBody = document.getElementById('resultsBody');

            const totalIssues = results.summary.comingSoon + results.summary.placeholderPaths + results.summary.missingFiles;

            let html = `
                <div class="incomplete-audit-section">
