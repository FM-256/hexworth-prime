<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Hex Quality Observations — Admin</title>
    <link rel="icon" type="image/png" href="/assets/images/icons/hex-icon.webp">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d12;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #2a2a3a;
            background: #15151c;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
        .nav-back { color: #8a8a9a; text-decoration: none; font-size: 0.9rem; }
        .nav-back:hover { color: #c0c0d0; }
        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        section {
            background: #15151c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }
        section h2 {
            margin: 0 0 1rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #b0b0c0;
        }
        .auth-banner {
            background: #2a2a3a;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        button {
            background: #2a2a3a;
            color: #e0e0e0;
            border: 1px solid #3a3a4a;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:hover { background: #3a3a4a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.primary { background: #4a4ad4; border-color: #5a5ae4; }
        button.primary:hover { background: #5a5ae4; }
        button.danger { background: #4a2a2a; border-color: #6a3a3a; }
        button.danger:hover { background: #5a3a3a; }
        select, input[type="text"] {
            background: #0d0d12;
            color: #e0e0e0;
            border: 1px solid #3a3a4a;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .filter-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .summary-strip {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2a2a3a;
            flex-wrap: wrap;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .stat .n { font-size: 1.5rem; font-weight: 600; font-family: ui-monospace, monospace; }
        .stat .label { font-size: 0.75rem; color: #8a8a9a; text-transform: uppercase; letter-spacing: 0.05em; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        th, td {
            text-align: left;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid #2a2a3a;
        }
        th {
            font-size: 0.72rem;
            color: #8a8a9a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        tbody tr { cursor: pointer; transition: background 0.1s; }
        tbody tr:hover { background: #1a1a24; }
        td.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.82rem; }
        td.snippet { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .pill-status-open       { background: #4a3a1a; color: #fbbf24; }
        .pill-status-triaged    { background: #2a2a4a; color: #818cf8; }
        .pill-status-fixing     { background: #1a3a4a; color: #38bdf8; }
        .pill-status-fixed      { background: #1a4a2a; color: #4ade80; }
        .pill-status-wontfix    { background: #3a3a3a; color: #a0a0a0; }
        .pill-status-duplicate  { background: #3a2a3a; color: #c084fc; }
        .pill-cat {
            background: #1a1a24;
            color: #b0b0c0;
            font-family: ui-monospace, monospace;
            text-transform: none;
            letter-spacing: 0;
        }
        .pill-priority-P0 { background: #4a1a1a; color: #f87171; }
        .pill-priority-P1 { background: #4a2a1a; color: #fb923c; }
        .pill-priority-P2 { background: #3a3a1a; color: #facc15; }
        .pill-priority-P3 { background: #1a3a1a; color: #4ade80; }
        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: #8a8a9a;
        }
        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: flex-start;
            justify-content: center;
            padding: 3rem 1rem;
            overflow-y: auto;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: #15151c;
            border: 1px solid #3a3a4a;
            border-radius: 10px;
            max-width: 780px;
            width: 100%;
            padding: 1.5rem;
        }
        .modal h2 {
            margin: 0 0 1rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #b0b0c0;
        }
        .modal-section {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2a2a3a;
        }
        .modal-section:last-of-type { border-bottom: none; }
        .modal-section .label {
            font-size: 0.7rem;
            color: #8a8a9a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }
        .modal-section .v {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .modal-section .v.mono {
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: #c0c0d0;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }
        .status-form {
            background: #0d0d12;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.6rem 0.9rem;
            align-items: center;
        }
        .status-form .row-full { grid-column: 1 / -1; }
        .status-form label {
            font-size: 0.78rem;
            color: #8a8a9a;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #15151c;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 200;
            display: none;
        }
        .toast.show { display: block; }
        .toast.error { border-color: #f87171; color: #f87171; }
    </style>
</head>
<body>
    <header>
        <h1>Dr. Hex Quality Observations</h1>
        <a href="/admin/" class="nav-back">← admin</a>
    </header>

    <main>
        <div id="auth-banner" class="auth-banner">
            <span id="auth-status-text">Checking authentication&hellip;</span>
            <span>
                <button id="sign-out-btn" style="display:none;margin-right:0.5rem">Sign out</button>
                <button id="sign-in-btn" class="primary">Sign in with Google</button>
            </span>
        </div>

        <section id="controls-section" style="display:none">
            <h2>Filters</h2>
            <div class="filter-row">
                <select id="filter-status">
                    <option value="">All statuses</option>
                    <option value="open">open</option>
                    <option value="triaged">triaged</option>
                    <option value="fixing">fixing</option>
                    <option value="fixed">fixed</option>
                    <option value="wontfix">wontfix</option>
                    <option value="duplicate">duplicate</option>
                </select>
                <select id="filter-category">
                    <option value="">All categories</option>
                    <option value="drhex-q-rag-relevance">drhex-q-rag-relevance</option>
                    <option value="drhex-q-rag-coverage">drhex-q-rag-coverage</option>
                    <option value="drhex-q-help-ceiling">drhex-q-help-ceiling</option>
                    <option value="drhex-q-help-floor">drhex-q-help-floor</option>
                    <option value="drhex-q-persona-drift">drhex-q-persona-drift</option>
                    <option value="drhex-q-hallucination">drhex-q-hallucination</option>
                    <option value="drhex-q-leak">drhex-q-leak</option>
                    <option value="drhex-q-tool">drhex-q-tool</option>
                    <option value="drhex-q-policy">drhex-q-policy</option>
                </select>
                <button id="refresh-btn">Refresh</button>
                <span style="color:#8a8a9a;font-size:0.85rem" id="result-meta"></span>
            </div>
            <div class="summary-strip" id="summary-strip">
                <div class="stat"><div class="n" id="stat-open">—</div><div class="label">Open</div></div>
                <div class="stat"><div class="n" id="stat-triaged">—</div><div class="label">Triaged</div></div>
                <div class="stat"><div class="n" id="stat-fixing">—</div><div class="label">Fixing</div></div>
                <div class="stat"><div class="n" id="stat-fixed">—</div><div class="label">Fixed</div></div>
                <div class="stat"><div class="n" id="stat-other">—</div><div class="label">Wontfix / dup</div></div>
                <div class="stat"><div class="n" id="stat-total">—</div><div class="label">Total (this view)</div></div>
            </div>
        </section>

        <section id="table-section" style="display:none">
            <h2>Observations</h2>
            <div id="table-wrap">
                <table id="obs-table">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Category</th>
                            <th>Dedup key (student query)</th>
                            <th>Persona / level</th>
                            <th>Flagged</th>
                        </tr>
                    </thead>
                    <tbody id="obs-tbody"></tbody>
                </table>
                <div id="empty-state" class="empty-state" style="display:none">
                    No observations match the current filters.
                </div>
            </div>
        </section>
    </main>

    <!-- Detail modal -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <h2 id="modal-title">Observation</h2>
            <div id="modal-body"></div>
            <form id="status-form" class="status-form">
                <label for="status-select">New status</label>
                <select id="status-select" name="status">
                    <option value="open">open</option>
                    <option value="triaged">triaged</option>
                    <option value="fixing">fixing</option>
                    <option value="fixed">fixed</option>
                    <option value="wontfix">wontfix</option>
                    <option value="duplicate">duplicate</option>
                </select>
                <label for="fix-commit">Fix commit (optional)</label>
                <input type="text" id="fix-commit" placeholder="e.g. 8d06a94f">
                <label for="original-id">Original ID (if duplicate)</label>
                <input type="text" id="original-id" placeholder="document ID of the original">
                <div class="row-full modal-actions">
                    <button type="button" id="modal-close">Close</button>
                    <button type="submit" class="primary">Save status</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
            from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
        import { getFirestore, collection, query, where, orderBy, limit, getDocs, doc, updateDoc, serverTimestamp }
            from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';

        const app = initializeApp({
            apiKey: "AIzaSyC3tWNETi36DA8Q1I60n7t09YfU9HapA4M",
            authDomain: "hexworth-prime.firebaseapp.com",
            projectId: "hexworth-prime",
            storageBucket: "hexworth-prime.firebasestorage.app",
            messagingSenderId: "11726236962",
            appId: "1:11726236962:web:1829ea0839f2587121497b"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);
        const COL = collection(db, 'dr_hex_quality_observations');
        const PAGE_LIMIT = 100;

        const $ = id => document.getElementById(id);

        // ─── escapeHtml utility (defense-in-depth XSS guard) ─────
        // All string interpolation into the DOM goes through here. Per
        // Nancy review 2026-05-24: even though textContent is preferred,
        // a single utility makes the right tool visible for future edits
        // that reach for innerHTML for formatting convenience.
        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toast(msg, isError) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.toggle('error', !!isError);
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ─── Auth flow ───────────────────────────────────────────
        // Defensive: log every auth state transition so the operator can
        // diagnose hangs from the browser console. signInWithPopup is the
        // first attempt; on popup-blocker errors we fall back to redirect.
        let currentUser = null;

        $('sign-in-btn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                console.log('[auth] signInWithPopup starting...');
                $('auth-status-text').textContent = 'Opening Google sign-in popup…';
                await signInWithPopup(auth, provider);
                console.log('[auth] signInWithPopup resolved');
            } catch (e) {
                console.error('[auth] signInWithPopup failed:', e.code, e.message);
                $('auth-status-text').textContent = `Sign-in failed: ${e.code || e.message}`;
                // Common failure modes: popup blocker, third-party cookie
                // blocking. Fall back to redirect-mode which doesn't need
                // a popup window.
                if (e.code === 'auth/popup-blocked' ||
                    e.code === 'auth/popup-closed-by-user' ||
                    e.code === 'auth/cancelled-popup-request' ||
                    e.code === 'auth/operation-not-supported-in-this-environment') {
                    $('auth-status-text').textContent = 'Popup blocked — trying redirect sign-in…';
                    const { signInWithRedirect } = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js');
                    signInWithRedirect(auth, provider);
                }
            }
        });

        // Initialize banner UI synchronously — never leave the operator
        // staring at a blank page if onAuthStateChanged hasn't fired yet.
        console.log('[auth] page boot, waiting for auth state...');

        $('sign-out-btn').addEventListener('click', async () => {
            console.log('[auth] manual sign-out requested');
            await signOut(auth);
            // Force a clean reload after sign-out so any stale state is purged.
            location.reload();
        });

        onAuthStateChanged(auth, async (user) => {
            console.log('[auth] state change — full user object:', user);
            currentUser = user;
            if (!user) {
                $('auth-banner').style.display = 'flex';
                $('auth-status-text').textContent = 'Sign in with an admin Google account.';
                $('sign-in-btn').style.display = 'inline-block';
                $('sign-out-btn').style.display = 'none';
                $('controls-section').style.display = 'none';
                $('table-section').style.display = 'none';
                return;
            }
            // Stale-session guard: a Firebase Auth user object can exist with
            // user.email = null when the session is partial / refresh-stale /
            // came from a provider that didn't return the email scope. Don't
            // try to admin-check on null-email users — force re-auth instead.
            if (!user.email) {
                console.warn('[auth] user exists but email is null — forcing sign-out');
                $('auth-banner').style.display = 'flex';
                $('auth-status-text').textContent = 'Stale session detected (no email). Click Sign out, then Sign in.';
                $('sign-in-btn').style.display = 'inline-block';
                $('sign-out-btn').style.display = 'inline-block';
                $('controls-section').style.display = 'none';
                $('table-section').style.display = 'none';
                return;
            }
            // Verify admin claim before showing data (defense-in-depth;
            // firestore.rules also enforces this server-side).
            try {
                const token = await user.getIdTokenResult();
                const isAdmin = token.claims.admin === true ||
                    ['f.mora80@gmail.com', 'jorden@hexworth.com'].includes(user.email);
                console.log('[auth] admin check:', { email: user.email, claim: token.claims.admin, isAdmin });
                if (!isAdmin) {
                    $('auth-banner').style.display = 'flex';
                    $('auth-status-text').textContent = `Signed in as ${user.email} — not an admin.`;
                    $('sign-in-btn').style.display = 'none';
                    $('sign-out-btn').style.display = 'inline-block';
                    return;
                }
                $('auth-banner').style.display = 'flex';
                $('auth-status-text').textContent = `Signed in as ${user.email}`;
                $('sign-in-btn').style.display = 'none';
                $('sign-out-btn').style.display = 'inline-block';
                $('controls-section').style.display = 'block';
                $('table-section').style.display = 'block';
                loadObservations();
            } catch (e) {
                console.error('[auth] admin-check failed:', e);
                $('auth-status-text').textContent = `Admin check failed: ${e.message}`;
            }
        });

        // ─── Load + render ───────────────────────────────────────
        let allRows = [];  // raw docs from the last query

        async function loadObservations() {
            const status = $('filter-status').value;
            const category = $('filter-category').value;
            // Build query. Note: rule already gates on admin; client-side
            // filters are for UX, not security. PAGE_LIMIT enforces a sane
            // cap per Nancy 2026-05-24 — at 2000 docs an unbounded read
            // would silently burn Firestore quota.
            const constraints = [];
            if (status) constraints.push(where('status', '==', status));
            if (category) constraints.push(where('category', '==', category));
            constraints.push(orderBy('flaggedAt', 'desc'));
            constraints.push(limit(PAGE_LIMIT));
            try {
                const snap = await getDocs(query(COL, ...constraints));
                allRows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable();
                renderSummary();
                $('result-meta').textContent = `${allRows.length} loaded (limit ${PAGE_LIMIT})`;
            } catch (e) {
                console.error(e);
                toast('Failed to load observations: ' + e.message, true);
            }
        }
        $('refresh-btn').addEventListener('click', loadObservations);
        $('filter-status').addEventListener('change', loadObservations);
        $('filter-category').addEventListener('change', loadObservations);

        function renderTable() {
            const tbody = $('obs-tbody');
            tbody.innerHTML = '';
            if (allRows.length === 0) {
                $('empty-state').style.display = 'block';
                return;
            }
            $('empty-state').style.display = 'none';
            for (const row of allRows) {
                const tr = document.createElement('tr');
                tr.addEventListener('click', () => openModal(row));
                tr.innerHTML = `
                    <td><span class="pill pill-status-${escapeHtml(row.status)}">${escapeHtml(row.status || '?')}</span></td>
                    <td>${row.priority ? `<span class="pill pill-priority-${escapeHtml(row.priority)}">${escapeHtml(row.priority)}</span>` : '<span style="color:#5a5a6a">—</span>'}</td>
                    <td><span class="pill pill-cat">${escapeHtml(row.category)}</span></td>
                    <td class="snippet" title="${escapeHtml(row.studentQueryFirst60 || '')}">${escapeHtml(row.studentQueryFirst60 || '—')}</td>
                    <td class="mono">${escapeHtml(row.persona || '?')} / ${row.helpLevel != null ? escapeHtml(row.helpLevel) : '?'}</td>
                    <td class="mono">${row.flaggedAt ? escapeHtml(row.flaggedAt.toDate().toISOString().slice(0,16).replace('T',' ')) : '?'}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function renderSummary() {
            const buckets = { open: 0, triaged: 0, fixing: 0, fixed: 0, other: 0 };
            for (const r of allRows) {
                if (buckets[r.status] !== undefined) buckets[r.status]++;
                else buckets.other++;
            }
            $('stat-open').textContent = buckets.open;
            $('stat-triaged').textContent = buckets.triaged;
            $('stat-fixing').textContent = buckets.fixing;
            $('stat-fixed').textContent = buckets.fixed;
            $('stat-other').textContent = buckets.other;
            $('stat-total').textContent = allRows.length;
        }

        // ─── Modal ───────────────────────────────────────────────
        let editingId = null;

        function openModal(row) {
            editingId = row.id;
            $('modal-title').textContent = `Observation · ${row.category}`;
            // Build body via escaped interpolation (no innerHTML to user-data fields).
            const sections = [
                ['Status', row.status],
                ['Priority', row.priority || '—'],
                ['Category', row.category],
                ['Student query (first 60 chars)', row.studentQueryFirst60],
                ['Model response (first 200 chars)', row.modelResponseFirst200],
                ['Observation', row.observation],
                ['Notes', row.notes],
                ['Persona / Help-level', `${row.persona || '?'} / ${row.helpLevel != null ? row.helpLevel : '?'}`],
                ['Conversation ID', row.conversationId || '—'],
                ['Mission ID', row.missionId || '—'],
                ['Tool invocation IDs', (row.toolInvocationDocIds && row.toolInvocationDocIds.length) ? row.toolInvocationDocIds.join(', ') : '—'],
                ['Flagged by', row.flaggedBy || '?'],
                ['Flagged at', row.flaggedAt ? row.flaggedAt.toDate().toISOString() : '?'],
                ['Status changed by', row.statusChangedBy || '—'],
                ['Status changed at', row.statusChangedAt ? row.statusChangedAt.toDate().toISOString() : '—'],
                ['Original observation ID', row.originalObservationId || '—'],
                ['Fix commit', row.fixCommit || '—'],
                ['Document ID', row.id],
            ];
            const html = sections.map(([label, value]) => {
                const mono = ['Conversation ID', 'Mission ID', 'Tool invocation IDs', 'Flagged by', 'Flagged at', 'Status changed by', 'Status changed at', 'Original observation ID', 'Fix commit', 'Document ID'].includes(label);
                return `<div class="modal-section"><div class="label">${escapeHtml(label)}</div><div class="v ${mono ? 'mono' : ''}">${escapeHtml(value != null ? value : '')}</div></div>`;
            }).join('');
            $('modal-body').innerHTML = html;
            $('status-select').value = row.status || 'open';
            $('fix-commit').value = row.fixCommit || '';
            $('original-id').value = row.originalObservationId || '';
            $('modal-backdrop').classList.add('show');
        }

        $('modal-close').addEventListener('click', () => {
            $('modal-backdrop').classList.remove('show');
            editingId = null;
        });
        $('modal-backdrop').addEventListener('click', (e) => {
            if (e.target === $('modal-backdrop')) {
                $('modal-backdrop').classList.remove('show');
                editingId = null;
            }
        });

        // ─── Status update ───────────────────────────────────────
        $('status-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!editingId || !currentUser) return;
            const newStatus = $('status-select').value;
            const fixCommit = $('fix-commit').value.trim() || null;
            const originalId = $('original-id').value.trim() || null;
            // Audit fields are written on EVERY status update, even if the
            // value doesn't actually change. The firestore rule allows
            // either no-status-change or with-audit-fields, so this is
            // always-safe and gives us a "last touched" timestamp even on
            // no-op resaves (useful for "I confirmed this is still open").
            const update = {
                status: newStatus,
                statusChangedBy: currentUser.uid,
                statusChangedAt: serverTimestamp(),
            };
            if (fixCommit != null) update.fixCommit = fixCommit;
            if (originalId != null) update.originalObservationId = originalId;
            try {
                await updateDoc(doc(db, 'dr_hex_quality_observations', editingId), update);
                toast(`Saved — status: ${newStatus}`);
                $('modal-backdrop').classList.remove('show');
                editingId = null;
                loadObservations();
            } catch (err) {
                console.error(err);
                toast('Save failed: ' + err.message, true);
            }
        });
    </script>
</body>
</html>
