<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Tree Mapper &mdash; Admin Console &mdash; Hexworth Prime</title>
    <style>
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        /* -----------------------------------------------------------------------
         * CSS custom properties — cyan admin aesthetic
         * ----------------------------------------------------------------------- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:             #0a0a0f;
            --panel:          #0e0e16;
            --card:           #12121a;
            --card-hover:     #181824;
            --border:         rgba(255, 255, 255, 0.08);
            --border-bright:  rgba(255, 255, 255, 0.14);
            --accent:         #a855f7;
            --accent-dim:     rgba(168, 85, 247, 0.10);
            --accent-glow:    rgba(168, 85, 247, 0.22);
            --accent-border:  rgba(168, 85, 247, 0.35);
            --text:           #e2e8f0;
            --text-muted:     #8b949e;
            --text-dim:       #4b5563;
            --ok:             #4ade80;
            --ok-dim:         rgba(74, 222, 128, 0.15);
            --broken:         #f87171;
            --broken-dim:     rgba(248, 113, 113, 0.15);
            --warn:           #fbbf24;

            /* Link type badge palette */
            --lt-next:        #22d3ee;
            --lt-prev:        #fbbf24;
            --lt-home:        #c084fc;
            --lt-breadcrumb:  #64748b;
            --lt-return:      #60a5fa;
            --lt-redirect:    #fb923c;
            --lt-href:        #475569;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* -----------------------------------------------------------------------
         * Ambient glow — fixed decorative layer
         * ----------------------------------------------------------------------- */
        .ambient-glow {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(0, 229, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* -----------------------------------------------------------------------
         * Page layout
         * ----------------------------------------------------------------------- */
        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* -----------------------------------------------------------------------
         * Header bar
         * ----------------------------------------------------------------------- */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 0;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 28px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Tree icon built with CSS only — no emoji, no external assets */
        .header-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon::before {
            content: '';
            display: block;
            width: 22px;
            height: 22px;
            border-left: 2px solid var(--accent);
            border-bottom: 2px solid var(--accent);
            border-radius: 0 0 0 4px;
        }

        .header-icon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 17px;
            width: 12px;
            height: 12px;
            border-left: 2px solid var(--accent);
            border-bottom: 2px solid var(--accent);
            border-radius: 0 0 0 3px;
            opacity: 0.6;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-btn:hover {
            border-color: var(--accent-border);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* -----------------------------------------------------------------------
         * Hub selector section
         * ----------------------------------------------------------------------- */
        .selector-section {
            margin-bottom: 20px;
        }

        .selector-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        /* Autocomplete wrapper — positioned parent for dropdown */
        .autocomplete-wrap {
            position: relative;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            background: var(--card);
            border: 1px solid var(--border-bright);
            border-radius: 7px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        /* Clear button inside search input */
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 4px;
            display: none;
            transition: color 0.15s;
        }

        .search-clear:hover { color: var(--text-muted); }
        .search-clear.visible { display: block; }

        /* Dropdown list */
        .dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border-bright);
            border-radius: 7px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: none;
            max-height: 320px;
            overflow-y: auto;
        }

        .dropdown.open { display: block; }

        .dropdown::-webkit-scrollbar { width: 6px; }
        .dropdown::-webkit-scrollbar-track { background: transparent; }
        .dropdown::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

        .dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .dropdown-item:last-child { border-bottom: none; }

        .dropdown-item:hover,
        .dropdown-item.highlighted {
            background: var(--card-hover);
        }

        .dropdown-item.highlighted {
            border-left: 2px solid var(--accent);
            padding-left: 12px;
        }

        .dropdown-item-icon {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Small tree shape inside dropdown icon */
        .dropdown-item-icon::before {
            content: '';
            display: block;
            width: 12px;
            height: 10px;
            border-left: 1.5px solid var(--accent);
            border-bottom: 1.5px solid var(--accent);
            border-radius: 0 0 0 2px;
        }

        .dropdown-item-body { flex: 1; min-width: 0; }

        .dropdown-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-item-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .dropdown-item-stats {
            display: flex;
            gap: 8px;
            margin-top: 3px;
        }

        .stat-pill {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        .stat-pill.ok    { background: var(--ok-dim);     color: var(--ok);     }
        .stat-pill.broken{ background: var(--broken-dim); color: var(--broken); }
        .stat-pill.total { background: rgba(255,255,255,0.06); color: var(--text-muted); }

        .dropdown-empty {
            padding: 16px 14px;
            color: var(--text-dim);
            font-size: 13px;
            font-style: italic;
        }

        /* -----------------------------------------------------------------------
         * Stats bar — shown when a hub is selected
         * ----------------------------------------------------------------------- */
        .stats-bar {
            display: none;
            align-items: center;
            gap: 20px;
            padding: 12px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 7px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .stats-bar.visible { display: flex; }

        .stats-bar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-divider {
            width: 1px;
            height: 20px;
            background: var(--border-bright);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .stat-dot.ok      { background: var(--ok); }
        .stat-dot.broken  { background: var(--broken); }
        .stat-dot.visited { background: var(--text-dim); }

        .stat-value { font-weight: 700; color: var(--text); }
        .stat-label { color: var(--text-muted); }

        /* -----------------------------------------------------------------------
         * Tree controls bar
         * ----------------------------------------------------------------------- */
        .tree-controls {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tree-controls.visible { display: flex; }

        .ctrl-btn {
            padding: 6px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-muted);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        .ctrl-btn:hover {
            border-color: var(--accent-border);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .ctrl-spacer { flex: 1; }

        .ctrl-hint {
            font-size: 11px;
            color: var(--text-dim);
        }

        /* -----------------------------------------------------------------------
         * Tree container
         * ----------------------------------------------------------------------- */
        .tree-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        /* -----------------------------------------------------------------------
         * Tree nodes
         * ----------------------------------------------------------------------- */
        .tree-root { padding: 8px 0; }

        /* Each node row — the clickable/visible line */
        .tree-node {
            position: relative;
        }

        .node-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 14px;
            cursor: pointer;
            transition: background 0.12s;
            border-left: 2px solid transparent;
            /* Indent driven by --depth custom property set inline */
            padding-left: calc(14px + var(--depth, 0) * 20px);
        }

        .node-row:hover { background: var(--card-hover); }

        /* Broken nodes get a red left border accent */
        .tree-node.status-broken > .node-row {
            border-left-color: var(--broken);
        }

        /* Connector lines — purely CSS pseudo-elements */
        .node-row::before {
            content: '';
            position: absolute;
            left: calc(6px + var(--depth, 0) * 20px - 1px);
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--border);
            display: var(--show-line, none);
        }

        /* Toggle arrow */
        .node-toggle {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 10px;
            transition: transform 0.15s;
            user-select: none;
        }

        /* Filled right-pointing triangle for collapsed, down for expanded */
        .node-toggle::before {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 7px solid var(--text-dim);
            transition: transform 0.15s, border-left-color 0.15s;
        }

        .node-toggle.expanded::before {
            transform: rotate(90deg);
            border-left-color: var(--accent);
        }

        /* Leaf node — show a dash instead of toggle */
        .node-toggle.leaf::before {
            content: none;
        }

        .node-toggle.leaf::after {
            content: '-';
            color: var(--border-bright);
            font-size: 12px;
        }

        /* Status indicator dot / X */
        .node-status {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
        }

        .node-status.ok::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
        }

        .node-status.broken::before {
            content: 'X';
            color: var(--broken);
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }

        .node-status.visited::before {
            content: '~';
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1;
        }

        /* Link type badge */
        .link-type-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 9px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .lt-next        { background: rgba(34,211,238,0.15); color: var(--lt-next); }
        .lt-prev        { background: rgba(251,191,36,0.15); color: var(--lt-prev); }
        .lt-course-home { background: rgba(192,132,252,0.15); color: var(--lt-home); }
        .lt-breadcrumb  { background: rgba(100,116,139,0.15); color: var(--lt-breadcrumb); }
        .lt-returnUrl   { background: rgba(96,165,250,0.15); color: var(--lt-return); }
        .lt-redirect    { background: rgba(251,146,60,0.15); color: var(--lt-redirect); }
        .lt-href        { background: rgba(71,85,105,0.15); color: var(--lt-href); }

        /* Node text content */
        .node-content {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .node-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-node.status-broken > .node-row .node-title {
            color: var(--broken);
        }

        .node-path {
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            max-width: 340px;
        }

        /* Path link — opens in new tab on click, no underline */
        .node-path-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.12s;
        }

        .node-path-link:hover { color: var(--accent); }

        /* Children container — collapses/expands */
        .node-children {
            overflow: hidden;
        }

        .node-children.collapsed { display: none; }

        /* -----------------------------------------------------------------------
         * Empty / error states
         * ----------------------------------------------------------------------- */
        .state-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 12px;
            color: var(--text-dim);
            text-align: center;
        }

        .state-icon {
            width: 48px;
            height: 48px;
            border: 2px solid var(--border-bright);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        /* Large tree shape for empty state icon */
        .state-icon::before {
            content: '';
            width: 24px;
            height: 20px;
            border-left: 2px solid var(--text-dim);
            border-bottom: 2px solid var(--text-dim);
            border-radius: 0 0 0 3px;
            display: block;
        }

        .state-icon.error { border-color: rgba(248,113,113,0.3); }
        .state-icon.error::before { border-color: var(--broken); }

        .state-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .state-desc {
            font-size: 13px;
            color: var(--text-dim);
            max-width: 400px;
        }

        .state-cmd {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            background: var(--panel);
            border: 1px solid var(--border-bright);
            border-radius: 5px;
            padding: 6px 12px;
            color: var(--accent);
            margin-top: 4px;
        }

        /* -----------------------------------------------------------------------
         * Loading state
         * ----------------------------------------------------------------------- */
        .loading-bar {
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .loading-bar.active { display: block; }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: loadSweep 1.2s ease-in-out infinite;
            width: 40%;
        }

        @keyframes loadSweep {
            0%   { transform: translateX(-200%); }
            100% { transform: translateX(400%); }
        }

        /* -----------------------------------------------------------------------
         * Scrollbar global
         * ----------------------------------------------------------------------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* -----------------------------------------------------------------------
         * Depth-line guide — faint vertical guides per indent level
         * ----------------------------------------------------------------------- */
        @media (prefers-reduced-motion: reduce) {
            .loading-bar-fill { animation: none; }
            .node-toggle::before { transition: none; }
        }
    </style>
</head>
<body>
    <h1 class="sr-only">Course Tree Mapper &mdash; Admin Console &mdash; Hexworth Prime</h1>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="page-wrap">

        <!-- Header removed — runs inside admin console iframe -->

        <!-- ===== LOADING BAR ===== -->
        <div class="loading-bar" id="loadingBar" aria-hidden="true">
            <div class="loading-bar-fill"></div>
        </div>

        <!-- ===== HUB SELECTOR ===== -->
        <section class="selector-section" aria-label="Hub selector">
            <div class="selector-label">Select a Course Hub</div>
            <div class="autocomplete-wrap" id="autocompleteWrap">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Type to filter hubs..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Filter course hubs"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="dropdownList"
                    role="combobox"
                />
                <button
                    class="search-clear"
                    id="searchClear"
                    aria-label="Clear search"
                    type="button"
                    tabindex="-1"
                >&#10005;</button>
                <div
                    class="dropdown"
                    id="dropdownList"
                    role="listbox"
                    aria-label="Available hubs"
                ></div>
            </div>
        </section>

        <!-- ===== STATS BAR ===== -->
        <div class="stats-bar" id="statsBar" aria-live="polite">
            <div class="stats-bar-title" id="statsTitle"></div>
            <div class="stats-divider" aria-hidden="true"></div>
            <div class="stat-item">
                <div class="stat-dot" aria-hidden="true"></div>
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">total</span>
            </div>
            <div class="stat-item">
                <div class="stat-dot ok" aria-hidden="true"></div>
                <span class="stat-value" id="statOk" style="color: var(--ok);">0</span>
                <span class="stat-label">ok</span>
            </div>
            <div class="stat-item">
                <div class="stat-dot broken" aria-hidden="true"></div>
                <span class="stat-value" id="statBroken" style="color: var(--broken);">0</span>
                <span class="stat-label">broken</span>
            </div>
            <div class="stat-item">
                <div class="stat-dot visited" aria-hidden="true"></div>
                <span class="stat-value" id="statVisited" style="color: var(--text-dim);">0</span>
                <span class="stat-label">back-ref</span>
            </div>
        </div>

        <!-- ===== TREE CONTROLS ===== -->
        <div class="tree-controls" id="treeControls">
            <button class="ctrl-btn" id="expandAllBtn" type="button">Expand All</button>
            <button class="ctrl-btn" id="collapseAllBtn" type="button">Collapse All</button>
            <div class="ctrl-spacer"></div>
            <span class="ctrl-hint">Click node to expand &mdash; click path to open in new tab</span>
        </div>

        <!-- ===== TREE OUTPUT ===== -->
        <div id="treeOutput">
            <!-- Empty state shown initially -->
            <div class="state-panel" id="emptyState">
                <img src="/assets/images/icons/icon-branch.webp" alt="" aria-hidden="true" style="width:64px;height:64px;opacity:0.4;margin-bottom:8px;">
                <div class="state-title">No Hub Selected</div>
                <div class="state-desc">Select a course hub above to visualize its navigation tree.</div>
            </div>
        </div>

    </div><!-- /page-wrap -->

    <script>
    /**
     * Course Tree Mapper — main script
     *
     * Data flow:
     *   1. On load, fetch /data/course-trees/manifest.json
     *   2. Populate the autocomplete dropdown from manifest.hubs
     *   3. On hub selection, fetch /data/course-trees/<file>
     *   4. Render the collapsible tree into #treeOutput
     */

    /* -----------------------------------------------------------------------
     * Constants
     * ----------------------------------------------------------------------- */
    const MANIFEST_URL  = '/data/course-trees/manifest.json';
    const TREES_BASE    = '/data/course-trees/';

    /* Link type -> CSS class suffix mapping */
    const LINK_TYPE_CLASSES = {
        'next':        'lt-next',
        'prev':        'lt-prev',
        'course-home': 'lt-course-home',
        'breadcrumb':  'lt-breadcrumb',
        'returnUrl':   'lt-returnUrl',
        'redirect':    'lt-redirect',
        'href':        'lt-href',
    };

    /* -----------------------------------------------------------------------
     * State
     * ----------------------------------------------------------------------- */
    let allHubs       = [];   // Array of hub objects from manifest
    let filteredHubs  = [];   // Current filtered subset
    let highlightIdx  = -1;   // Currently highlighted dropdown item index
    let selectedHub   = null; // Currently loaded hub object

    /* -----------------------------------------------------------------------
     * DOM refs
     * ----------------------------------------------------------------------- */
    const searchInput    = document.getElementById('searchInput');
    const searchClear    = document.getElementById('searchClear');
    const dropdownList   = document.getElementById('dropdownList');
    const loadingBar     = document.getElementById('loadingBar');
    const statsBar       = document.getElementById('statsBar');
    const statsTitle     = document.getElementById('statsTitle');
    const statTotal      = document.getElementById('statTotal');
    const statOk         = document.getElementById('statOk');
    const statBroken     = document.getElementById('statBroken');
    const statVisited    = document.getElementById('statVisited');
    const treeControls   = document.getElementById('treeControls');
    const treeOutput     = document.getElementById('treeOutput');
    const emptyState     = document.getElementById('emptyState');
    const expandAllBtn   = document.getElementById('expandAllBtn');
    const collapseAllBtn = document.getElementById('collapseAllBtn');

    /* -----------------------------------------------------------------------
     * Utility: extract house name from hub path
     * e.g. "houses/web/network-plus/index.html" -> "web"
     * ----------------------------------------------------------------------- */
    function houseFromPath(path) {
        const parts = path.split('/');
        // Expected: houses/<house>/...
        if (parts[0] === 'houses' && parts.length > 1) return parts[1];
        return path.split('/')[0] || 'unknown';
    }

    /* -----------------------------------------------------------------------
     * Utility: count visited/back-reference nodes recursively
     * ----------------------------------------------------------------------- */
    function countVisited(node) {
        let count = node.status === 'visited' ? 1 : 0;
        if (node.children && node.children.length) {
            for (const child of node.children) count += countVisited(child);
        }
        return count;
    }

    /* -----------------------------------------------------------------------
     * Loading bar helpers
     * ----------------------------------------------------------------------- */
    function showLoading() { loadingBar.classList.add('active'); }
    function hideLoading() { loadingBar.classList.remove('active'); }

    /* -----------------------------------------------------------------------
     * Dropdown: render filtered hub list
     * ----------------------------------------------------------------------- */
    function renderDropdown() {
        dropdownList.innerHTML = '';
        highlightIdx = -1;

        if (!filteredHubs.length) {
            const empty = document.createElement('div');
            empty.className = 'dropdown-empty';
            empty.textContent = 'No hubs match your search.';
            dropdownList.appendChild(empty);
            return;
        }

        filteredHubs.forEach((hub, idx) => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.setAttribute('role', 'option');
            item.dataset.idx = idx;

            const house = houseFromPath(hub.hub);
            const s = hub.stats || {};

            item.innerHTML = `
                <div class="dropdown-item-icon" aria-hidden="true"></div>
                <div class="dropdown-item-body">
                    <div class="dropdown-item-title">${escHtml(hub.title || hub.file)}</div>
                    <div class="dropdown-item-meta">House: ${escHtml(house)} &nbsp;&middot;&nbsp; ${escHtml(hub.hub)}</div>
                    <div class="dropdown-item-stats">
                        <span class="stat-pill total">${s.totalNodes || 0} nodes</span>
                        <span class="stat-pill ok">${s.ok || 0} ok</span>
                        ${s.broken ? `<span class="stat-pill broken">${s.broken} broken</span>` : ''}
                    </div>
                </div>
            `;

            item.addEventListener('mousedown', (e) => {
                /* mousedown fires before blur; prevent input losing focus first */
                e.preventDefault();
                selectHub(hub);
            });

            dropdownList.appendChild(item);
        });
    }

    /* -----------------------------------------------------------------------
     * Dropdown: open / close
     * ----------------------------------------------------------------------- */
    function openDropdown() {
        dropdownList.classList.add('open');
        searchInput.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown() {
        dropdownList.classList.remove('open');
        searchInput.setAttribute('aria-expanded', 'false');
        highlightIdx = -1;
        clearHighlight();
    }

    /* -----------------------------------------------------------------------
     * Dropdown: keyboard highlight management
     * ----------------------------------------------------------------------- */
    function clearHighlight() {
        dropdownList.querySelectorAll('.dropdown-item.highlighted')
            .forEach(el => el.classList.remove('highlighted'));
    }

    function setHighlight(idx) {
        clearHighlight();
        const items = dropdownList.querySelectorAll('.dropdown-item');
        if (!items.length) return;
        highlightIdx = ((idx % items.length) + items.length) % items.length;
        const target = items[highlightIdx];
        if (target) {
            target.classList.add('highlighted');
            target.scrollIntoView({ block: 'nearest' });
        }
    }

    /* -----------------------------------------------------------------------
     * Filter: update filteredHubs based on query string
     * ----------------------------------------------------------------------- */
    function filterHubs(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            filteredHubs = allHubs.slice();
        } else {
            filteredHubs = allHubs.filter(h => {
                const title = (h.title || '').toLowerCase();
                const path  = (h.hub  || '').toLowerCase();
                return title.includes(q) || path.includes(q);
            });
        }
        renderDropdown();
    }

    /* -----------------------------------------------------------------------
     * Select hub: load its tree file
     * ----------------------------------------------------------------------- */
    async function selectHub(hub) {
        closeDropdown();
        searchInput.value = hub.title || hub.file;
        searchClear.classList.add('visible');
        selectedHub = hub;

        showLoading();
        try {
            const res = await fetch(TREES_BASE + hub.file);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const treeData = await res.json();
            hideLoading();
            renderTree(hub, treeData);
        } catch (err) {
            hideLoading();
            showTreeError(`Failed to load tree data: ${err.message}`);
        }
    }

    /* -----------------------------------------------------------------------
     * Render: update stats bar with hub metadata
     * ----------------------------------------------------------------------- */
    function updateStatsBar(hub, visitedCount) {
        const s = hub.stats || {};
        statsTitle.textContent = hub.title || hub.hub;
        statTotal.textContent   = s.totalNodes || 0;
        statOk.textContent      = s.ok         || 0;
        statBroken.textContent  = s.broken      || 0;
        statVisited.textContent = visitedCount  || s.visited || 0;
        statsBar.classList.add('visible');
        treeControls.classList.add('visible');
    }

    /* -----------------------------------------------------------------------
     * Render: build the DOM tree from JSON data
     * treeData is expected to be an array of root nodes, or a single node
     * with a "children" property, or an object with a "tree" key.
     * ----------------------------------------------------------------------- */
    function renderTree(hub, treeData) {
        /* Normalise: accept { tree: {...} }, { tree: [...] }, [...], or a single node */
        let roots;
        if (treeData.tree) {
            roots = Array.isArray(treeData.tree) ? treeData.tree : [treeData.tree];
        } else if (Array.isArray(treeData)) {
            roots = treeData;
        } else if (treeData.children) {
            roots = [treeData];
        } else {
            roots = [treeData];
        }

        /* Count back-references for the stats bar */
        let visitedCount = 0;
        roots.forEach(n => { visitedCount += countVisited(n); });

        updateStatsBar(hub, visitedCount);

        /* Build the container */
        const container = document.createElement('div');
        container.className = 'tree-container';
        const rootUl = document.createElement('div');
        rootUl.className = 'tree-root';

        roots.forEach(node => {
            rootUl.appendChild(buildNodeEl(node, 0));
        });

        container.appendChild(rootUl);

        /* Replace #treeOutput content */
        treeOutput.innerHTML = '';
        treeOutput.appendChild(container);

        /* Bind expand/collapse all controls */
        expandAllBtn.onclick  = () => setAllCollapsed(container, false);
        collapseAllBtn.onclick = () => setAllCollapsed(container, true);
    }

    /* -----------------------------------------------------------------------
     * Render: recursively build a single tree node element
     * ----------------------------------------------------------------------- */
    function buildNodeEl(node, depth) {
        const wrapper = document.createElement('div');
        wrapper.className = 'tree-node';

        const hasChildren = node.children && node.children.length > 0;
        const status = node.status || 'ok';

        wrapper.classList.add(`status-${status}`);

        /* ---- Node row (the visible clickable line) ---- */
        const row = document.createElement('div');
        row.className = 'node-row';
        row.style.setProperty('--depth', depth);
        if (depth > 0) row.style.setProperty('--show-line', 'block');

        /* Toggle icon */
        const toggle = document.createElement('div');
        toggle.className = 'node-toggle';
        if (!hasChildren) {
            toggle.classList.add('leaf');
        }
        toggle.setAttribute('aria-hidden', 'true');
        row.appendChild(toggle);

        /* Status dot */
        const statusEl = document.createElement('div');
        statusEl.className = `node-status ${status}`;
        statusEl.setAttribute('aria-label', `status: ${status}`);
        row.appendChild(statusEl);

        /* Link type badge */
        if (node.linkType) {
            const badge = document.createElement('span');
            badge.className = `link-type-badge ${LINK_TYPE_CLASSES[node.linkType] || 'lt-href'}`;
            badge.textContent = node.linkType;
            row.appendChild(badge);
        }

        /* Title + path content area */
        const content = document.createElement('div');
        content.className = 'node-content';

        const title = document.createElement('span');
        title.className = 'node-title';
        title.textContent = node.title || node.path || '(untitled)';
        content.appendChild(title);

        if (node.path) {
            const pathSpan = document.createElement('span');
            pathSpan.className = 'node-path';

            /* Build a browseable URL from the path */
            const href = buildUrl(node.path);
            const pathLink = document.createElement('a');
            pathLink.className = 'node-path-link';
            pathLink.href = href;
            pathLink.target = '_blank';
            pathLink.rel = 'noopener noreferrer';
            pathLink.textContent = node.path;
            /* Stop click from toggling the tree node */
            pathLink.addEventListener('click', e => e.stopPropagation());
            pathSpan.appendChild(pathLink);
            content.appendChild(pathSpan);
        }

        row.appendChild(content);
        wrapper.appendChild(row);

        /* ---- Children container ---- */
        let childrenEl = null;
        if (hasChildren) {
            childrenEl = document.createElement('div');
            childrenEl.className = 'node-children';

            /* Auto-collapse nodes deeper than depth 1 */
            if (depth >= 1) {
                childrenEl.classList.add('collapsed');
            } else {
                toggle.classList.add('expanded');
            }

            node.children.forEach(child => {
                childrenEl.appendChild(buildNodeEl(child, depth + 1));
            });

            wrapper.appendChild(childrenEl);

            /* Toggle on row click */
            row.addEventListener('click', () => {
                const isCollapsed = childrenEl.classList.toggle('collapsed');
                toggle.classList.toggle('expanded', !isCollapsed);
            });
        }

        return wrapper;
    }

    /* -----------------------------------------------------------------------
     * Utility: build a navigable URL from a relative path
     * Handles "houses/...", "pages/...", and bare filenames.
     * ----------------------------------------------------------------------- */
    function buildUrl(path) {
        if (!path) return '#';
        /* WHITELIST, not a prefix test. The previous version read:
         *     if (path.startsWith('http') || path.startsWith('/')) return path;
         * and "//evil.com".startsWith('/') is TRUE, so a protocol-relative URL was returned
         * unchanged and assigned straight to pathLink.href. No control character or trick was
         * needed. The rel="noopener noreferrer" a few lines down shows someone was thinking
         * about tabnabbing and the URL itself went unvalidated.
         *
         * Deliberately a whitelist and not the blacklist used in the hex shell. A blacklist has
         * to enumerate every current and future WHATWG normalisation quirk correctly, and the
         * shell's already needed one hand-patch after a control character slipped through. This
         * matches the pattern in catalog.html and houses/hub/index.html, both of which a
         * reviewer confirmed were never vulnerable, by construction: anchored front to back,
         * with (?!\/) rejecting the second slash outright. */
        if (/^\/(?!\/)[A-Za-z0-9\/_.?=&%#-]*$/.test(path)) return path;
        /* Relative: no scheme, no leading slash, no backslash, no control characters. */
        if (/^(?!\/)(?![A-Za-z][A-Za-z0-9+.-]*:)[A-Za-z0-9\/_.?=&%#-]+$/.test(path)) return '/' + path;
        return '#';
    }

    /* -----------------------------------------------------------------------
     * Tree control: expand or collapse all nodes
     * ----------------------------------------------------------------------- */
    function setAllCollapsed(container, collapse) {
        container.querySelectorAll('.node-children').forEach(el => {
            el.classList.toggle('collapsed', collapse);
        });
        container.querySelectorAll('.node-toggle').forEach(el => {
            if (!el.classList.contains('leaf')) {
                el.classList.toggle('expanded', !collapse);
            }
        });
    }

    /* -----------------------------------------------------------------------
     * Show error state inside the tree output area
     * ----------------------------------------------------------------------- */
    function showTreeError(message) {
        treeOutput.innerHTML = `
            <div class="state-panel">
                <img src="/assets/images/icons/icon-branch.webp" alt="" aria-hidden="true" style="width:64px;height:64px;opacity:0.3;filter:hue-rotate(330deg) saturate(2);margin-bottom:8px;">
                <div class="state-title">Tree Load Failed</div>
                <div class="state-desc">${escHtml(message)}</div>
            </div>
        `;
    }

    /* -----------------------------------------------------------------------
     * Show manifest-not-found error
     * ----------------------------------------------------------------------- */
    function showManifestError() {
        treeOutput.innerHTML = `
            <div class="state-panel">
                <img src="/assets/images/icons/icon-branch.webp" alt="" aria-hidden="true" style="width:64px;height:64px;opacity:0.3;filter:hue-rotate(330deg) saturate(2);margin-bottom:8px;">
                <div class="state-title">Tree data not generated yet.</div>
                <div class="state-desc">Run the scanner to generate course tree data.</div>
                <div class="state-cmd">eduscan --tree --all</div>
            </div>
        `;
        /* Also disable/hide the selector so user gets the right message */
        searchInput.disabled = true;
        searchInput.placeholder = 'No manifest available';
    }

    /* -----------------------------------------------------------------------
     * Security: escape HTML for use in innerHTML
     * Only used for trusted-but-safe display values (titles, paths from JSON)
     * ----------------------------------------------------------------------- */
    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    /* -----------------------------------------------------------------------
     * Search input event handlers
     * ----------------------------------------------------------------------- */
    searchInput.addEventListener('input', () => {
        const val = searchInput.value;
        searchClear.classList.toggle('visible', val.length > 0);
        filterHubs(val);
        openDropdown();
    });

    searchInput.addEventListener('focus', () => {
        filterHubs(searchInput.value);
        openDropdown();
    });

    searchInput.addEventListener('blur', () => {
        /* Slight delay so mousedown on dropdown items fires first */
        setTimeout(closeDropdown, 150);
    });

    searchInput.addEventListener('keydown', (e) => {
        const items = dropdownList.querySelectorAll('.dropdown-item');

        switch (e.key) {
            case 'ArrowDown':
                e.preventDefault();
                if (!dropdownList.classList.contains('open')) openDropdown();
                setHighlight(highlightIdx + 1);
                break;

            case 'ArrowUp':
                e.preventDefault();
                if (!dropdownList.classList.contains('open')) openDropdown();
                setHighlight(highlightIdx - 1);
                break;

            case 'Tab':
                /* Terminal-style: Tab cycles through options without closing */
                e.preventDefault();
                if (!items.length) break;
                if (!dropdownList.classList.contains('open')) openDropdown();
                setHighlight(e.shiftKey ? highlightIdx - 1 : highlightIdx + 1);
                /* Fill input with highlighted title for visual feedback */
                if (highlightIdx >= 0 && filteredHubs[highlightIdx]) {
                    searchInput.value = filteredHubs[highlightIdx].title || filteredHubs[highlightIdx].file;
                    searchClear.classList.add('visible');
                }
                break;

            case 'Enter':
                e.preventDefault();
                if (highlightIdx >= 0 && filteredHubs[highlightIdx]) {
                    selectHub(filteredHubs[highlightIdx]);
                } else if (filteredHubs.length === 1) {
                    selectHub(filteredHubs[0]);
                }
                break;

            case 'Escape':
                closeDropdown();
                searchInput.blur();
                break;

            default:
                break;
        }
    });

    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchClear.classList.remove('visible');
        filterHubs('');
        openDropdown();
        searchInput.focus();
    });

    /* -----------------------------------------------------------------------
     * Close dropdown when clicking outside the autocomplete widget
     * ----------------------------------------------------------------------- */
    document.addEventListener('mousedown', (e) => {
        if (!document.getElementById('autocompleteWrap').contains(e.target)) {
            closeDropdown();
        }
    });

    /* -----------------------------------------------------------------------
     * Init: load the manifest
     * ----------------------------------------------------------------------- */
    async function init() {
        showLoading();
        try {
            const res = await fetch(MANIFEST_URL);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const manifest = await res.json();
            hideLoading();

            allHubs = manifest.hubs || [];
            filteredHubs = allHubs.slice();

            if (!allHubs.length) {
                showManifestError();
            }
        } catch (err) {
            hideLoading();
            showManifestError();
        }
    }

    init();
    </script>
</body>
</html>
