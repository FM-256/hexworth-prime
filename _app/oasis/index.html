<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OASIS - Hall of Ring Bearers | Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Grid */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* Particle System */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .oasis-title {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6, #fbbf24);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.5);
            margin-bottom: 10px;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #a0a0a0;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            letter-spacing: 2px;
        }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        /* Ring Grid */
        .ring-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 80px;
        }

        /* Ring Card */
        .ring-card {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .ring-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ring-card.unclaimed {
            opacity: 0.7;
        }

        .ring-card.mine {
            border: 2px solid #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }

        .ring-card.mine::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b, #fbbf24);
            border-radius: 12px;
            z-index: -1;
            opacity: 0.5;
            animation: border-glow 3s ease-in-out infinite;
        }

        @keyframes border-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Ring Icon */
        .ring-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .ring-svg {
            width: 100%;
            height: 100%;
            animation: ring-rotate 20s linear infinite;
        }

        @keyframes ring-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .ring-glow {
            animation: ring-pulse 2s ease-in-out infinite;
        }

        @keyframes ring-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Ring Info */
        .ring-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .ring-theme {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Holder Section */
        .holder-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .unclaimed-badge {
            font-size: 1.5rem;
            font-weight: bold;
            color: #666;
            letter-spacing: 3px;
            animation: pulse-unclaimed 2s ease-in-out infinite;
        }

        @keyframes pulse-unclaimed {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .unclaimed-text {
            font-size: 0.75rem;
            color: #555;
            margin-top: 10px;
        }

        .holder-callsign {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .holder-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        .holder-stats {
            font-size: 0.8rem;
            color: #999;
        }

        .held-since {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
        }

        .my-ring-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0a0f;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        /* Action Button */
        .challenge-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            border: 1px solid;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .challenge-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .my-score {
            font-size: 0.75rem;
            color: #888;
            margin-top: 10px;
        }

        .attempt-count {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #999;
        }

        /* Activity Feed */
        .activity-section {
            margin-top: 60px;
            padding: 30px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .activity-title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: #60a5fa;
            text-align: center;
        }

        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .activity-timestamp {
            color: #666;
            font-size: 0.7rem;
            margin-top: 5px;
        }

        /* Legend Section */
        .legend-section {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .legend-section.visible {
            opacity: 0.3;
        }

        .legend-text {
            font-size: 0.85rem;
            color: #555;
            font-style: italic;
            letter-spacing: 2px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .footer-link:hover {
            color: #93c5fd;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .ring-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .ring-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .oasis-title {
                font-size: 3rem;
                letter-spacing: 6px;
            }
        }

        @media (max-width: 600px) {
            .ring-grid {
                grid-template-columns: 1fr;
            }

            .oasis-title {
                font-size: 2rem;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 1.2rem;
            }
        }

        /* Scrollbar Styling */
        .activity-feed::-webkit-scrollbar {
            width: 8px;
        }

        .activity-feed::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .activity-feed::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.3);
            border-radius: 4px;
        }

        .activity-feed::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.5);
        }
    </style>
</head>
<body>
    <!-- Background Grid -->
    <div class="grid-overlay"></div>

    <!-- Particle System -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="oasis-title">THE OASIS</h1>
            <h2 class="subtitle">HALL OF RING BEARERS</h2>
            <p class="tagline">"First to the Key. First to the Egg."</p>
            <a href="../dashboard.html" class="nav-link">← RETURN TO DASHBOARD</a>
        </header>

        <!-- Ring Grid -->
        <div class="ring-grid" id="ringGrid">
            <!-- Rings will be dynamically generated here -->
        </div>

        <!-- Activity Feed -->
        <section class="activity-section">
            <h3 class="activity-title">RECENT EVENTS</h3>
            <div class="activity-feed" id="activityFeed">
                <!-- Activity items will be dynamically generated here -->
            </div>
        </section>

        <!-- Legend Section (Easter Egg) -->
        <div class="legend-section" id="legendSection">
            <p class="legend-text">Legend speaks of a ninth ring... one to rule them all.</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <a href="../dashboard.html" class="footer-link">RETURN TO DASHBOARD</a>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../components/RingManager.js"></script>
    <script src="../components/AccessGuard.js"></script>

    <script>
        // Access control
        AccessGuard.require('any');

        // Ring Definitions
        const RINGS = [
            {
                id: 'shield',
                name: 'Ring of the Shield',
                theme: 'Defense & Security',
                color: '#f87171',
                symbol: 'shield'
            },
            {
                id: 'web',
                name: 'Ring of the Web',
                theme: 'Network & Protocol',
                color: '#60a5fa',
                symbol: 'web'
            },
            {
                id: 'forge',
                name: 'Ring of the Forge',
                theme: 'Hardware & Systems',
                color: '#fbbf24',
                symbol: 'hammer'
            },
            {
                id: 'script',
                name: 'Ring of the Script',
                theme: 'Automation & Code',
                color: '#a78bfa',
                symbol: 'code'
            },
            {
                id: 'cloud',
                name: 'Ring of the Cloud',
                theme: 'Infrastructure & Scale',
                color: '#38bdf8',
                symbol: 'cloud'
            },
            {
                id: 'code',
                name: 'Ring of the Code',
                theme: 'Development & Logic',
                color: '#4ade80',
                symbol: 'brackets'
            },
            {
                id: 'key',
                name: 'Ring of the Key',
                theme: 'Cryptography & Privacy',
                color: '#f472b6',
                symbol: 'key'
            },
            {
                id: 'eye',
                name: 'Ring of the Eye',
                theme: 'Intelligence & Recon',
                color: '#c084fc',
                symbol: 'eye'
            }
        ];

        // Generate SVG Ring Icon
        function generateRingIcon(ring) {
            let symbolPath = '';

            switch(ring.symbol) {
                case 'shield':
                    symbolPath = '<path d="M60 35 L40 50 L40 75 L60 85 L80 75 L80 50 Z" fill="none" stroke="' + ring.color + '" stroke-width="2"/>';
                    break;
                case 'web':
                    symbolPath = '<circle cx="60" cy="60" r="15" fill="none" stroke="' + ring.color + '" stroke-width="2"/><line x1="60" y1="45" x2="60" y2="75" stroke="' + ring.color + '" stroke-width="1"/><line x1="45" y1="60" x2="75" y2="60" stroke="' + ring.color + '" stroke-width="1"/><line x1="49" y1="49" x2="71" y2="71" stroke="' + ring.color + '" stroke-width="1"/><line x1="71" y1="49" x2="49" y2="71" stroke="' + ring.color + '" stroke-width="1"/>';
                    break;
                case 'hammer':
                    symbolPath = '<rect x="52" y="45" width="16" height="8" fill="' + ring.color + '"/><rect x="58" y="53" width="4" height="25" fill="' + ring.color + '"/>';
                    break;
                case 'code':
                    symbolPath = '<path d="M45 60 L50 55 L45 50" fill="none" stroke="' + ring.color + '" stroke-width="2"/><path d="M75 60 L70 55 L75 50" fill="none" stroke="' + ring.color + '" stroke-width="2"/><line x1="55" y1="48" x2="65" y2="72" stroke="' + ring.color + '" stroke-width="2"/>';
                    break;
                case 'cloud':
                    symbolPath = '<path d="M45 65 Q45 55 55 55 Q55 48 63 48 Q70 48 70 55 Q78 55 78 63 Q78 70 70 70 L45 70 Q40 70 40 65 Q40 60 45 60" fill="none" stroke="' + ring.color + '" stroke-width="2"/>';
                    break;
                case 'brackets':
                    symbolPath = '<text x="60" y="70" font-size="40" fill="' + ring.color + '" text-anchor="middle" font-family="Courier New">{}</text>';
                    break;
                case 'key':
                    symbolPath = '<circle cx="52" cy="52" r="8" fill="none" stroke="' + ring.color + '" stroke-width="2"/><line x1="58" y1="58" x2="72" y2="72" stroke="' + ring.color + '" stroke-width="2"/><line x1="68" y1="68" x2="68" y2="72" stroke="' + ring.color + '" stroke-width="2"/><line x1="72" y1="68" x2="72" y2="72" stroke="' + ring.color + '" stroke-width="2"/>';
                    break;
                case 'eye':
                    symbolPath = '<ellipse cx="60" cy="60" rx="20" ry="12" fill="none" stroke="' + ring.color + '" stroke-width="2"/><circle cx="60" cy="60" r="6" fill="' + ring.color + '"/>';
                    break;
            }

            return `
                <svg class="ring-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="glow-${ring.id}">
                            <stop offset="0%" style="stop-color:${ring.color};stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:${ring.color};stop-opacity:0" />
                        </radialGradient>
                    </defs>

                    <!-- Outer Glow -->
                    <circle cx="60" cy="60" r="50" fill="url(#glow-${ring.id})" class="ring-glow" opacity="0.3"/>

                    <!-- Ring Circle -->
                    <circle cx="60" cy="60" r="35" fill="none" stroke="${ring.color}" stroke-width="2" class="ring-glow"/>
                    <circle cx="60" cy="60" r="28" fill="none" stroke="${ring.color}" stroke-width="1" opacity="0.5"/>

                    <!-- Symbol -->
                    ${symbolPath}
                </svg>
            `;
        }

        // Generate Ring Card
        function generateRingCard(ring, ringData, myRings, myScores) {
            const isUnclaimed = !ringData || !ringData.holder;
            const isMine = myRings.includes(ring.id);
            const myScore = myScores[ring.id] || 0;
            const attemptCount = ringData ? ringData.attempts : 0;

            let cardClass = 'ring-card';
            if (isUnclaimed) cardClass += ' unclaimed';
            if (isMine) cardClass += ' mine';

            let holderHTML = '';
            if (isUnclaimed) {
                holderHTML = `
                    <div class="holder-section">
                        <div class="unclaimed-badge">UNCLAIMED</div>
                        <div class="unclaimed-text">Be the first to claim this ring!</div>
                    </div>
                `;
            } else {
                const holderBadgeStyle = `background: ${ring.color}; color: #0a0a0f;`;
                const heldSince = new Date(ringData.heldSince).toLocaleDateString();

                holderHTML = `
                    <div class="holder-section">
                        <div class="holder-callsign" style="color: ${ring.color};">${ringData.holder}</div>
                        <div class="holder-badge" style="${holderBadgeStyle}">${ringData.holderHouse.toUpperCase()}</div>
                        <div class="holder-stats">Score to beat: <strong>${ringData.score}</strong></div>
                        <div class="held-since">Held since ${heldSince}</div>
                    </div>
                `;
            }

            const buttonStyle = `background: rgba(${hexToRgb(ring.color)}, 0.1); border-color: ${ring.color}; color: ${ring.color};`;
            const buttonHoverStyle = `background: rgba(${hexToRgb(ring.color)}, 0.2);`;

            return `
                <div class="${cardClass}">
                    ${isMine ? '<div class="my-ring-badge">YOUR RING</div>' : ''}
                    ${attemptCount > 0 ? `<div class="attempt-count">${attemptCount} challengers</div>` : ''}

                    <div class="ring-icon">
                        ${generateRingIcon(ring)}
                    </div>

                    <div class="ring-name" style="color: ${ring.color};">${ring.name}</div>
                    <div class="ring-theme">${ring.theme}</div>

                    ${holderHTML}

                    <a href="challenge.html?ring=${ring.id}" class="challenge-btn" style="${buttonStyle}"
                       onmouseover="this.style.background='rgba(${hexToRgb(ring.color)}, 0.2)'"
                       onmouseout="this.style.background='rgba(${hexToRgb(ring.color)}, 0.1)'">
                        ${isMine ? 'DEFEND RING' : 'ATTEMPT CHALLENGE'}
                    </a>

                    ${myScore > 0 ? `<div class="my-score">Your best: ${myScore} points</div>` : ''}
                </div>
            `;
        }

        // Helper: Hex to RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ?
                `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` :
                '96, 165, 250';
        }

        // Generate Activity Item
        function generateActivityItem(event) {
            let borderColor = '#60a5fa';
            let icon = '▶';

            if (event.type === 'claimed') {
                borderColor = '#4ade80';
                icon = '★';
            } else if (event.type === 'defended') {
                borderColor = '#f87171';
                icon = '◆';
            } else if (event.type === 'close_call') {
                borderColor = '#fbbf24';
                icon = '◈';
            }

            return `
                <div class="activity-item" style="border-left-color: ${borderColor};">
                    <div>${icon} ${event.message}</div>
                    <div class="activity-timestamp">${event.timestamp}</div>
                </div>
            `;
        }

        // Create Particles
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#f87171', '#60a5fa', '#fbbf24', '#a78bfa', '#38bdf8', '#4ade80', '#f472b6', '#c084fc'];

            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Initialize Page
        async function initializePage() {
            try {
                // Create particle effect
                createParticles();

                // Get all ring data
                const allRings = await RingManager.getAllRings();
                const myRings = await RingManager.getMyRings();
                const myScores = await RingManager.getMyScores();

                // Render ring grid
                const ringGrid = document.getElementById('ringGrid');
                ringGrid.innerHTML = RINGS.map(ring => {
                    const ringData = allRings.find(r => r.id === ring.id);
                    return generateRingCard(ring, ringData, myRings, myScores);
                }).join('');

                // Load recent events
                const events = await RingManager.getRecentEvents(10);
                const activityFeed = document.getElementById('activityFeed');

                if (events.length === 0) {
                    activityFeed.innerHTML = '<div class="activity-item" style="border-left-color: #666; text-align: center;">No recent activity. Be the first to claim a ring!</div>';
                } else {
                    activityFeed.innerHTML = events.map(generateActivityItem).join('');
                }

                // Show legend if user holds 3+ rings
                if (myRings.length >= 3) {
                    document.getElementById('legendSection').classList.add('visible');
                }

                // Listen for ring events
                window.addEventListener('ring-claimed', handleRingEvent);
                window.addEventListener('ring-attempted', handleRingEvent);
                window.addEventListener('ring-defended', handleRingEvent);

            } catch (error) {
                console.error('Error initializing OASIS page:', error);

                // Fallback: Show all rings as unclaimed
                const ringGrid = document.getElementById('ringGrid');
                ringGrid.innerHTML = RINGS.map(ring => {
                    return generateRingCard(ring, null, [], {});
                }).join('');

                document.getElementById('activityFeed').innerHTML =
                    '<div class="activity-item" style="border-left-color: #666; text-align: center;">Activity feed unavailable. RingManager not loaded.</div>';
            }
        }

        // Handle Ring Events (Live Updates)
        function handleRingEvent(event) {
            console.log('Ring event detected:', event.type, event.detail);
            // In a real implementation, this would refresh the display
            // For now, we'll just log it
            // Could implement live updates via WebSocket or periodic polling
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
