<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Hexworth Prime</title>
    <script src="/components/FirebaseAuth.js"></script>
    <style>
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a14 0%, #131322 50%, #0a0a14 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signin-card {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 32px;
            backdrop-filter: blur(10px);
        }
        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            color: #00e5ff;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 32px;
        }
        .tenant-name {
            font-size: 0.85rem;
            color: #fbbf24;
            text-align: center;
            margin-bottom: 24px;
            padding: 8px 12px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 6px;
            display: none;
        }
        .tenant-name.show { display: block; }
        .google-btn {
            width: 100%;
            background: white;
            color: #1f2937;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }
        .google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .google-icon {
            width: 18px;
            height: 18px;
        }
        .status {
            margin-top: 16px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            min-height: 20px;
        }
        .status.error { color: #ef4444; }
        .return-note {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.78rem;
            color: #64748b;
            text-align: center;
        }
        .return-note code {
            font-family: 'Courier New', monospace;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 6px;
            border-radius: 3px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">Sign In</h1>
    <div class="signin-card">
        <div class="brand">Hexworth Prime</div>
        <!-- Was "Instructor Sign-In", which was never true of this page. There is no role check,
             no allowlist and no instructor gating anywhere in it: it is a generic Google sign-in
             that honours ?return=. And it is ALREADY the student path for the Signal toolkit,
             which sends students here from web-flasher.html and my-devices.html. So the label was
             telling a student they were in the wrong place while they were in the right one.
             Found while pointing the Hex Live kiosk at it, but it was wrong for existing student
             flows first. -->
        <div class="subtitle">Sign in to continue</div>
        <div id="tenant-name" class="tenant-name"></div>
        <button id="signin-btn" class="google-btn" onclick="doGoogleSignIn()">
            <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.836.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span>Sign in with Google</span>
        </button>
        <div id="status" class="status"></div>
        <div class="return-note">
            Sign in returns you to: <code id="return-target">…</code>
        </div>
    </div>

    <script>
        // Read query params: ?slug=<tenant>&return=<absolute-url-or-path>
        var params = new URLSearchParams(window.location.search);
        var slug = params.get('slug') || '';
        var returnUrl = params.get('return') || '/';

        // Decode return URL once for display + use
        try { returnUrl = decodeURIComponent(returnUrl); } catch (_) {}

        // Show tenant slug if present
        if (slug) {
            var tn = document.getElementById('tenant-name');
            tn.textContent = 'Tenant: ' + slug;
            tn.classList.add('show');
        }

        // Show return target
        document.getElementById('return-target').textContent = returnUrl.length > 80
            ? returnUrl.substring(0, 80) + '…'
            : returnUrl;

        // Validate return URL — only allow same-origin to prevent open redirect
        function isSafeReturnUrl(url) {
            if (!url) return false;
            try {
                var u = new URL(url, window.location.origin);
                return u.origin === window.location.origin;
            } catch (e) {
                // Relative path is fine
                return url.startsWith('/') && !url.startsWith('//');
            }
        }

        async function doGoogleSignIn() {
            var btn = document.getElementById('signin-btn');
            var status = document.getElementById('status');
            btn.disabled = true;
            status.classList.remove('error');
            status.textContent = 'Signing in…';

            try {
                if (typeof FirebaseAuth === 'undefined') {
                    throw new Error('FirebaseAuth not loaded — script tag missing or blocked');
                }
                await FirebaseAuth.init();
                var user = await FirebaseAuth.signInWithGoogle();
                if (!user) {
                    status.textContent = 'Sign-in cancelled.';
                    btn.disabled = false;
                    return;
                }
                status.textContent = 'Redirecting…';
                if (isSafeReturnUrl(returnUrl)) {
                    window.location.href = returnUrl;
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                status.classList.add('error');
                status.textContent = 'Sign-in failed: ' + (err.message || err);
                btn.disabled = false;
            }
        }

        // If already signed in, auto-redirect
        (async function autoRedirectIfSignedIn() {
            try {
                if (typeof FirebaseAuth === 'undefined') return;
                await FirebaseAuth.init();
                var user = FirebaseAuth.getCurrentUser && FirebaseAuth.getCurrentUser();
                if (user && isSafeReturnUrl(returnUrl)) {
                    document.getElementById('status').textContent = 'Already signed in. Redirecting…';
                    window.location.href = returnUrl;
                }
            } catch (_) {}
        })();
    </script>
</body>
</html>
