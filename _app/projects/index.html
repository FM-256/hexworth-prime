<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Hexworth Prime</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0c10;
            color: rgba(255,255,255,0.85);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* CRT scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9000;
        }

        /* Grid background */
        .ph-grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .ph-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #0e1018;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            height: 48px;
        }
        .ph-header-back {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .ph-header-back:hover { color: rgba(255,255,255,0.8); }
        .ph-header-title {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            font-weight: 600;
        }
        .ph-header-status {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }

        /* Hero */
        .ph-hero {
            text-align: center;
            padding: 60px 24px 40px;
        }
        .ph-emblem {
            width: 340px;
            height: 340px;
            margin: 0 auto 28px;
            position: relative;
        }
        .ph-emblem svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            z-index: 2;
        }
        .ph-globe-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 1;
        }
        /* PROJECTS text orbiting the globe equator */
        .ph-title-text {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.25em;
            fill: rgba(255,255,255,0.95);
            text-transform: uppercase;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)) drop-shadow(0 0 20px rgba(100,200,255,0.3));
        }
        .ph-title-ring {
            animation: phSpinTitle 20s linear infinite;
            transform-origin: 170px 170px;
        }
        @keyframes phSpinTitle {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        /* Outer rotating tagline ring */
        .ph-outer-text {
            font-family: 'Courier New', monospace;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.18em;
            fill: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        .ph-outer-ring {
            animation: phSpin 45s linear infinite;
            transform-origin: 170px 170px;
        }
        /* Stamp border rings */
        .ph-stamp-ring {
            fill: none;
            stroke: rgba(255,255,255,0.12);
            stroke-width: 1;
        }
        .ph-stamp-ring-inner {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 0.5;
        }
        @keyframes phSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ph-hero-sub {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.08em;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Filters */
        .ph-filters {
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ph-filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .ph-filter-label {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            margin-right: 4px;
        }
        .ph-filter-sep {
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.1);
            margin: 0 8px;
        }
        .ph-pill {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ph-pill:hover {
            border-color: rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.7);
        }
        .ph-pill.active {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.35);
            color: rgba(255,255,255,0.9);
        }

        /* Sections */
        .ph-sections {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }
        .ph-section {
            margin-bottom: 36px;
        }
        .ph-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .ph-section-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ph-section-icon img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            opacity: 0.8;
        }
        .ph-section-name {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .ph-section-domain {
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.3);
        }

        /* Card grid */
        .ph-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }

        /* Card */
        .ph-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: default;
        }
        .ph-card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .ph-card-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .ph-card-desc {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.35);
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .ph-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ph-badge {
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .ph-card-time {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.08em;
        }
        .ph-card-time img {
            width: 14px;
            height: 14px;
            opacity: 0.4;
        }
        .ph-card-xp {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-left: auto;
        }

        /* Empty state */
        .ph-empty {
            text-align: center;
            padding: 48px 24px;
            display: none;
        }
        .ph-empty-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.1em;
        }

        /* Footer */
        .ph-footer {
            text-align: center;
            padding: 24px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.1em;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .ph-emblem { width: 260px; height: 260px; }
            .ph-globe-video { width: 160px; height: 160px; }
            .ph-hero { padding: 40px 16px 30px; }
            .ph-sections { padding: 0 16px 40px; }
            .ph-filters { padding: 0 16px; }
            .ph-card { padding: 16px; }
            .ph-card-grid { grid-template-columns: 1fr; }
            .ph-filter-sep { display: none; }
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">Projects</h1>
    <div class="ph-grid-bg"></div>

    <!-- Header -->
    <div class="ph-header">
        <a href="../dashboard.html" class="ph-header-back">&larr; DASHBOARD</a>
        <div class="ph-header-title">PROJECTS</div>
        <div class="ph-header-status" id="phStats"></div>
    </div>

    <!-- Hero -->
    <div class="ph-hero">
        <div class="ph-emblem">
            <!-- 3D Globe video -->
            <video class="ph-globe-video" autoplay muted loop playsinline src="/assets/images/globe-spin.webm"></video>
            <!-- SVG overlay: text + rings -->
            <svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <path id="outerPath" d="M 170,18 a 152,152 0 1,1 -0.01,0" fill="none"/>
                    <path id="equatorPath" d="M 170,68 a 102,102 0 1,1 -0.01,0" fill="none"/>
                </defs>

                <!-- Stamp border rings -->
                <circle cx="170" cy="170" r="165" class="ph-stamp-ring"/>
                <circle cx="170" cy="170" r="158" class="ph-stamp-ring-inner"/>

                <!-- PROJECTS text orbiting the globe equator -->
                <g class="ph-title-ring">
                    <text class="ph-title-text">
                        <textPath href="#equatorPath" startOffset="0%">&#x25C6; PROJECTS &#x25C6; PORTFOLIO &#x25C6; PROJECTS &#x25C6; PORTFOLIO &#x25C6;</textPath>
                    </text>
                </g>

                <!-- Outer rotating tagline ring -->
                <g class="ph-outer-ring">
                    <text class="ph-outer-text">
                        <textPath href="#outerPath" startOffset="0%">PUSH TO GITHUB &#x25C6; DEPLOY TO FIREBASE &#x25C6; BUILD YOUR PORTFOLIO &#x25C6; PUSH TO GITHUB &#x25C6; DEPLOY TO FIREBASE &#x25C6; BUILD YOUR PORTFOLIO &#x25C6;</textPath>
                    </text>
                </g>

                <!-- Tick marks -->
                <g stroke="rgba(255,255,255,0.15)" stroke-width="1">
                    <line x1="170" y1="2" x2="170" y2="10"/>
                    <line x1="170" y1="330" x2="170" y2="338"/>
                    <line x1="2" y1="170" x2="10" y2="170"/>
                    <line x1="330" y1="170" x2="338" y2="170"/>
                    <line x1="50" y1="50" x2="56" y2="56"/>
                    <line x1="290" y1="50" x2="284" y2="56"/>
                    <line x1="50" y1="290" x2="56" y2="284"/>
                    <line x1="290" y1="290" x2="284" y2="284"/>
                </g>
            </svg>
        </div>
        <p class="ph-hero-sub">Guided builds that put your skills to work. Pick a project, follow the brief, ship something real.</p>
    </div>

    <!-- Filters -->
    <div class="ph-filters">
        <div class="ph-filter-group">
            <span class="ph-filter-label">Difficulty</span>
            <button class="ph-pill active" data-filter="diff" data-value="all">All</button>
            <button class="ph-pill" data-filter="diff" data-value="beginner">Beginner</button>
            <button class="ph-pill" data-filter="diff" data-value="journeyman">Journeyman</button>
            <button class="ph-pill" data-filter="diff" data-value="advanced">Advanced</button>
            <button class="ph-pill" data-filter="diff" data-value="pro">Pro</button>
        </div>
        <div class="ph-filter-sep"></div>
        <div class="ph-filter-group">
            <span class="ph-filter-label">Time</span>
            <button class="ph-pill active" data-filter="time" data-value="all">All</button>
            <button class="ph-pill" data-filter="time" data-value="quick">Quick</button>
            <button class="ph-pill" data-filter="time" data-value="medium">Medium</button>
            <button class="ph-pill" data-filter="time" data-value="long">Long</button>
        </div>
    </div>

    <!-- Sections container -->
    <div class="ph-sections" id="phSections"></div>

    <!-- Empty state -->
    <div class="ph-empty" id="phEmpty">
        <div class="ph-empty-text">No projects match the selected filters.</div>
    </div>

    <!-- Footer -->
    <div class="ph-footer">HEXWORTH PRIME &mdash; PROJECTS v1.0</div>

    <script src="ProjectsData.js"></script>
    <script>
    (function() {
        // State
        let activeDiff = 'all';
        let activeTime = 'all';

        // Time buckets
        function timeBucket(min) {
            if (min <= 60) return 'quick';
            if (min <= 90) return 'medium';
            return 'long';
        }

        // Format minutes
        function fmtTime(min) {
            if (min < 60) return min + ' MIN';
            const h = Math.floor(min / 60);
            const m = min % 60;
            return m ? h + 'H ' + m + 'M' : h + 'H';
        }

        // Build all sections once
        function buildSections() {
            const container = document.getElementById('phSections');
            const houseIds = ProjectsData.getHouseIds();

            houseIds.forEach(houseId => {
                const house = ProjectsData.getHouse(houseId);
                const projects = ProjectsData.getByHouse(houseId);
                if (!projects.length) return;

                const section = document.createElement('div');
                section.className = 'ph-section';
                section.dataset.house = houseId;

                // Section header
                const header = document.createElement('div');
                header.className = 'ph-section-header';
                header.innerHTML =
                    '<div class="ph-section-icon" style="background:' + house.primary + '12;border:1px solid ' + house.primary + '25">' +
                        '<img src="' + house.icon + '" alt="">' +
                    '</div>' +
                    '<div class="ph-section-name" style="color:' + house.primary + '">' + house.name.toUpperCase() + '</div>' +
                    '<div class="ph-section-domain">' + house.domain + '</div>';
                section.appendChild(header);

                // Card grid
                const grid = document.createElement('div');
                grid.className = 'ph-card-grid';

                // Projects with landing pages
                const hasPage = new Set([
                    'script-system-monitor', 'darkarts-port-scanner',
                    'code-cli-task-manager', 'forge-flashcard-engine',
                    'shield-log-analyzer', 'eye-osint-dashboard',
                    'web-topology-visualizer', 'cloud-container-checker',
                    'ai-threat-classifier', 'key-password-vault',
                    'matrix-packet-visualizer', 'divergent-multi-tool',
                    'script-pi-automation', 'web-pi-network-probe',
                    'cloud-pi-homelab', 'shield-pi-ids',
                    'forge-sensor-dashboard', 'code-serial-console',
                    'eye-motion-surveillance', 'key-rfid-access',
                    'darkarts-wifi-scanner', 'matrix-traffic-dashboard',
                    'ai-network-anomaly', 'divergent-field-terminal',
                    'forge-env-monitor', 'shield-perimeter-alarm',
                    'script-data-logger', 'code-arduino-pipeline',
                    'code-typing-speed', 'code-task-manager',
                    'cloud-k8s-deploy', 'cloud-terraform-infra',
                    'cloud-api-nginx', 'ai-rag-chatbot',
                    'ai-intrusion-detector', 'ai-research-agent',
                    'darkarts-metasploit', 'darkarts-recon-automation',
                    'script-etl-pipeline', 'script-github-actions',
                    'matrix-data-viz', 'matrix-time-series',
                    'web-rest-api', 'key-blockchain',
                    'shield-ids-ml', 'eye-selenium-testing',
                    'forge-telegram-bot', 'divergent-discord-bot',
                    'code-chat-app', 'code-resume-builder',
                    'web-online-portfolio', 'web-react-router',
                    'cloud-budget-fern', 'cloud-django-eks',
                    'ai-explainable-ml', 'ai-reinforcement-taxi',
                    'ai-music-generation', 'matrix-sentiment-nlp',
                    'matrix-climate-analysis', 'matrix-customer-segmentation',
                    'darkarts-web-scraping', 'script-video-summarizer',
                    'script-web-crawler', 'key-nft-marketplace',
                    'key-secure-doc-storage', 'shield-fake-news',
                    'eye-playwright-testing', 'forge-crossword-puzzle',
                    'code-ecommerce-stripe', 'code-memory-game',
                    'code-wordle-clone', 'web-elearning-flask',
                    'cloud-helm-charts', 'cloud-aws-vpc',
                    'cloud-serverless-django', 'ai-rasa-chatbot',
                    'ai-face-detection', 'ai-data-augmentation',
                    'matrix-plotly-viz', 'matrix-stock-analysis',
                    'matrix-kafka-streaming', 'key-brownie-contracts',
                    'shield-aws-cognito', 'darkarts-puppeteer',
                    'script-data-pipeline', 'eye-pytorch-onnx',
                    'forge-spring-fullstack', 'divergent-manim',
                    'divergent-faceless-youtube',
                    'starter-first-webpage', 'starter-first-app', 'starter-first-gui',
                    'starter-first-api', 'starter-first-database', 'starter-first-script',
                    'starter-first-server', 'starter-first-container', 'starter-first-network',
                    'starter-first-hack', 'starter-first-firewall', 'starter-first-scan',
                    'starter-first-bot', 'starter-first-pipeline'
                ]);

                projects.forEach(proj => {
                    const diff = ProjectsData.getDifficulty(proj.difficulty);
                    const card = document.createElement('div');
                    card.className = 'ph-card';
                    card.dataset.difficulty = proj.difficulty;
                    card.dataset.time = timeBucket(proj.minutes);
                    card.dataset.house = houseId;
                    card.dataset.id = proj.id;

                    const linked = hasPage.has(proj.id);
                    if (linked) card.style.cursor = 'pointer';

                    card.innerHTML =
                        '<div class="ph-card-accent" style="background:' + house.primary + '"></div>' +
                        '<div class="ph-card-title">' + proj.title + '</div>' +
                        '<div class="ph-card-desc">' + proj.description + '</div>' +
                        '<div class="ph-card-meta">' +
                            '<span class="ph-badge" style="background:' + diff.color + '18;color:' + diff.color + ';border:1px solid ' + diff.color + '30">' + diff.label + '</span>' +
                            '<span class="ph-card-time"><img src="/assets/images/icons/icon-clock.webp" alt="">' + fmtTime(proj.minutes) + '</span>' +
                            '<span class="ph-card-xp" style="color:' + house.primary + '">' + proj.xp.toLocaleString() + ' XP</span>' +
                        '</div>';

                    // Click to open project page
                    if (linked) {
                        card.addEventListener('click', function() {
                            location.href = proj.id + '.html';
                        });
                    }

                    // Hover effects
                    card.addEventListener('mouseenter', function() {
                        this.style.borderColor = house.primary;
                        this.style.boxShadow = '0 0 20px ' + house.glow + ', 0 4px 12px rgba(0,0,0,0.3)';
                        this.style.transform = 'translateY(-2px)';
                    });
                    card.addEventListener('mouseleave', function() {
                        this.style.borderColor = '';
                        this.style.boxShadow = '';
                        this.style.transform = '';
                    });

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // Filter logic
        function applyFilters() {
            const sections = document.querySelectorAll('.ph-section');
            let totalVisible = 0;

            sections.forEach(section => {
                const cards = section.querySelectorAll('.ph-card');
                let sectionVisible = 0;

                cards.forEach(card => {
                    const matchDiff = activeDiff === 'all' || card.dataset.difficulty === activeDiff;
                    const matchTime = activeTime === 'all' || card.dataset.time === activeTime;
                    const show = matchDiff && matchTime;
                    card.style.display = show ? '' : 'none';
                    if (show) sectionVisible++;
                });

                section.style.display = sectionVisible ? '' : 'none';
                totalVisible += sectionVisible;
            });

            // Empty state
            document.getElementById('phEmpty').style.display = totalVisible ? 'none' : 'block';

            // Update stats
            updateStats(totalVisible);
        }

        // Stats counter
        function updateStats(count) {
            const total = ProjectsData.getCount();
            const xp = ProjectsData.getTotalXP().toLocaleString();
            const el = document.getElementById('phStats');
            if (count === total) {
                el.textContent = total + ' PROJECTS \u00B7 ' + xp + ' XP';
            } else {
                el.textContent = count + ' / ' + total + ' PROJECTS';
            }
        }

        // Pill click handler
        document.querySelector('.ph-filters').addEventListener('click', function(e) {
            const pill = e.target.closest('.ph-pill');
            if (!pill) return;

            const filterType = pill.dataset.filter;
            const value = pill.dataset.value;

            // Deactivate siblings, activate this one
            const group = pill.parentElement;
            group.querySelectorAll('.ph-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');

            if (filterType === 'diff') activeDiff = value;
            if (filterType === 'time') activeTime = value;

            applyFilters();
        });

        // Init
        buildSections();
        updateStats(ProjectsData.getCount());
    })();
    </script>

    <hex-ai-button></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
