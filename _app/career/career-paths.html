    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #0a0a0f;
            --card:         #12121a;
            --card-hover:   #181824;
            --border:       rgba(255, 255, 255, 0.08);
            --border-hover: rgba(16, 185, 129, 0.35);
            --accent:       #10b981;
            --accent-dim:   rgba(16, 185, 129, 0.12);
            --accent-glow:  rgba(16, 185, 129, 0.25);
            --text:         #e2e8f0;
            --text-muted:   #8b949e;
            --text-dim:     #4b5563;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(16, 185, 129, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .ambient-glow { display: none; }
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Header */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 0;
            gap: 16px;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-icon { width: 36px; height: 36px; flex-shrink: 0; }
        .header-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
        .header-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-muted); text-decoration: none;
            font-size: 13px; transition: border-color 0.2s, color 0.2s, background 0.2s;
            white-space: nowrap; flex-shrink: 0;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .back-arrow { font-size: 15px; line-height: 1; }

        /* Page title */
        .page-hero {
            text-align: center;
            padding: 48px 0 16px;
        }
        .page-hero h1 {
            font-size: 32px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px;
        }
        .page-hero p { font-size: 15px; color: var(--text-muted); max-width: 560px; margin: 0 auto; }

        /* Filter pills */
        .filter-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            margin: 28px 0 32px;
        }
        .filter-pill {
            padding: 6px 14px; background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text-muted); cursor: pointer;
            font-size: 12px; font-weight: 500; transition: all 0.2s; user-select: none;
        }
        .filter-pill:hover, .filter-pill.active {
            border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
        }

        /* House cards grid */
        .house-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .house-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s, transform 0.25s;
            position: relative;
            overflow: hidden;
        }
        .house-card:hover {
            border-color: var(--border-hover);
            background: var(--card-hover);
            transform: translateY(-2px);
        }
        .house-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--house-color, var(--accent)), transparent);
            opacity: 0; transition: opacity 0.25s;
        }
        .house-card:hover::before { opacity: 1; }

        .house-card-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
        }
        .house-card-icon { width: 32px; height: 32px; flex-shrink: 0; }
        .house-card-name { font-size: 17px; font-weight: 700; }
        .house-card-domain { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .career-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .career-list li {
            padding: 3px 10px; border-radius: 20px; font-size: 11px;
            background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(16,185,129,0.2);
        }
        .salary-range { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
        .salary-range strong { color: var(--accent); }

        .cert-list { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .cert-list strong { color: var(--text); }

        /* Expanded roadmap panel */
        .roadmap-panel {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .roadmap-panel.open { display: block; }
        .roadmap-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--accent); }

        .roadmap-steps { list-style: none; padding: 0; }
        .roadmap-steps li {
            position: relative; padding: 8px 0 8px 24px; font-size: 13px; color: var(--text-muted);
        }
        .roadmap-steps li::before {
            content: ''; position: absolute; left: 6px; top: 14px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--bg);
        }
        .roadmap-steps li::after {
            content: ''; position: absolute; left: 9px; top: 22px;
            width: 2px; height: calc(100% - 6px); background: rgba(16,185,129,0.2);
        }
        .roadmap-steps li:last-child::after { display: none; }
        .roadmap-steps li strong { color: var(--text); }

        .expand-hint {
            font-size: 11px; color: var(--text-dim); text-align: right; margin-top: 10px;
        }

        /* Course links. DELIBERATELY OUTSIDE .roadmap-panel and always visible: that panel is
           display:none until a click on the card, and the card has no tabindex or keydown
           handler, so anything inside it is unreachable without a mouse. Prose behind that trap
           is a UX gap; the only route to a course would be content-access denial. */
        .track-links { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
        .track-links-label {
            font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text-dim); margin-bottom: 8px;
        }
        .track-links ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .track-links a {
            display: inline-block; padding: 5px 11px; border-radius: 6px; font-size: 12px;
            color: var(--text-muted); text-decoration: none;
            border: 1px solid var(--border); background: rgba(255,255,255,0.02);
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        .track-links a:hover, .track-links a:focus-visible {
            border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
        }
        .track-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (max-width: 680px) {
            .page-hero h1 { font-size: 24px; }
            .house-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function renderHouses(filter) {
            var grid = document.getElementById('houseGrid');
            grid.innerHTML = '';

            HOUSES.forEach(function (house) {
                if (filter !== 'all' && house.tags.indexOf(filter) === -1) return;

                var card = document.createElement('div');
                card.className = 'house-card';
                card.style.setProperty('--house-color', house.color);

                var careersHtml = house.careers.map(function (c) {
                    return '<li>' + c + '</li>';
                }).join('');

                var certsHtml = house.certs.join(', ');

                var roadmapHtml = house.roadmap.map(function (r) {
                    return '<li><strong>' + r.step + ':</strong> ' + r.desc + '</li>';
                }).join('');

                /* Courses that teach this house, from the generated map in HouseTracks.js.
                   This page must NOT keep its own copy: three hand-written career-content maps
                   had already drifted before this one was added. A house with no qualifying
                   track (House of the Key) renders nothing rather than a fabricated link. */
                var tracks = (window.HouseTracks && window.HouseTracks[house.id]) || [];
                var tracksHtml = tracks.length
                    ? '<div class="track-links">' +
                        '<div class="track-links-label">Courses in this house</div><ul>' +
                        tracks.map(function (t) {
                            return '<li><a href="' + t.url + '">' + t.title + '</a></li>';
                        }).join('') +
                      '</ul></div>'
                    : '';

                card.innerHTML =
                    '<div class="house-card-header">' +
                        '<img src="' + house.icon + '" alt="" class="house-card-icon">' +
                        '<div>' +
                            '<div class="house-card-name" style="color:' + house.color + '">' + house.name + '</div>' +
                            '<div class="house-card-domain">' + house.domain + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<ul class="career-list">' + careersHtml + '</ul>' +
                    '<div class="salary-range">Salary Range: <strong>' + house.salary + '</strong></div>' +
                    '<div class="cert-list"><strong>Key Certs:</strong> ' + certsHtml + '</div>' +
                    tracksHtml +
                    '<div class="expand-hint">Click to expand roadmap</div>' +
                    '<div class="roadmap-panel">' +
                        '<div class="roadmap-title">Career Roadmap</div>' +
                        '<ol class="roadmap-steps">' + roadmapHtml + '</ol>' +
                    '</div>';

                card.addEventListener('click', function (e) {
                    /* A course link inside the card must navigate, not collapse the card under
                       the cursor. Without this the whole card is one big toggle and the links
                       are unusable. */
                    if (e.target.closest('.track-links')) return;
                    var panel = card.querySelector('.roadmap-panel');
                    var isOpen = panel.classList.contains('open');
                    panel.classList.toggle('open');
                    card.querySelector('.expand-hint').textContent = isOpen ? 'Click to expand roadmap' : 'Click to collapse';
                });

                grid.appendChild(card);
            });
        }

        /* -------------------------------------------------------------------
         * Filter pills
         * ------------------------------------------------------------------- */
        document.querySelectorAll('.filter-pill').forEach(function (pill) {
            pill.addEventListener('click', function () {
                document.querySelectorAll('.filter-pill').forEach(function (p) { p.classList.remove('active'); });
                pill.classList.add('active');
                renderHouses(pill.dataset.filter);
            });
        });

        renderHouses('all');
    </script>
</body>
</html>
