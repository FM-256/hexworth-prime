<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Launchpad - Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-rocket.webp">
    <style>
        /* ================================================================
           CAREER LAUNCHPAD — Job Readiness Hub
           Cross-house resource, neutral dark theme
           ================================================================ */

        :root {
            --cl-primary: #60a5fa;
            --cl-secondary: #3b82f6;
            --cl-accent: #a78bfa;
            --cl-success: #34d399;
            --cl-warning: #fbbf24;
            --cl-glow: rgba(96, 165, 250, 0.25);
            --cl-bg: #0a0a0f;
            --cl-surface: #12121a;
            --cl-surface-2: #1a1a26;
            --cl-border: rgba(96, 165, 250, 0.15);
            --cl-text: #e2e8f0;
            --cl-text-dim: #94a3b8;
            --cl-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--cl-bg);
            color: var(--cl-text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Ambient background --- */
        .cl-ambient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .cl-ambient::before {
            content: '';
            position: absolute;
            top: -30%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(96,165,250,0.08) 0%, transparent 70%);
            animation: cl-drift 20s ease-in-out infinite;
        }
        .cl-ambient::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
            animation: cl-drift 25s ease-in-out infinite reverse;
        }
        @keyframes cl-drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, 40px); }
        }

        /* --- Particles --- */
        .cl-particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .cl-particle {
            position: absolute;
            bottom: -10px;
            width: 3px; height: 3px;
            background: var(--cl-primary);
            border-radius: 50%;
            animation: cl-rise linear infinite;
        }
        @keyframes cl-rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }

        /* --- Layout --- */
        .cl-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* --- Header bar --- */
        .cl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--cl-border);
            margin-bottom: 32px;
        }
        .cl-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cl-header-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            object-fit: contain;
        }
        .cl-header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--cl-primary);
        }
        .cl-header-sub {
            font-size: 0.75rem;
            color: var(--cl-text-dim);
        }
        .cl-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--cl-surface-2);
            border: 1px solid var(--cl-border);
            border-radius: 8px;
            color: var(--cl-text);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .cl-btn:hover {
            background: var(--cl-primary);
            color: #0a0a0f;
            border-color: var(--cl-primary);
        }

        /* --- Hero --- */
        .cl-hero {
            text-align: center;
            padding: 48px 0 40px;
        }
        .cl-hero-icon {
            width: 64px; height: 64px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px var(--cl-glow));
        }
        .cl-hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cl-primary), var(--cl-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .cl-hero p {
            font-size: 1.1rem;
            color: var(--cl-text-dim);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Overall progress bar --- */
        .cl-progress-bar {
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: var(--cl-radius);
            padding: 16px 24px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .cl-progress-label {
            font-size: 0.85rem;
            color: var(--cl-text-dim);
            white-space: nowrap;
        }
        .cl-progress-track {
            flex: 1;
            height: 8px;
            background: var(--cl-surface-2);
            border-radius: 4px;
            overflow: hidden;
        }
        .cl-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cl-primary), var(--cl-accent));
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .cl-progress-pct {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cl-primary);
            min-width: 40px;
            text-align: right;
        }

        /* --- Section navigation tabs --- */
        .cl-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--cl-surface-2) transparent;
        }
        .cl-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 8px;
            color: var(--cl-text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            user-select: none;
        }
        .cl-tab:hover {
            color: var(--cl-text);
            border-color: rgba(96,165,250,0.3);
        }
        .cl-tab.active {
            background: rgba(96,165,250,0.12);
            color: var(--cl-primary);
            border-color: var(--cl-primary);
        }
        .cl-tab img {
            width: 16px; height: 16px;
            object-fit: contain;
        }
        .cl-tab .cl-tab-check {
            width: 14px; height: 14px;
            opacity: 0.5;
        }
        .cl-tab.completed .cl-tab-check {
            opacity: 1;
            filter: brightness(1.3);
        }

        /* --- Section panels --- */
        .cl-section {
            display: none;
            animation: cl-fadeIn 0.3s ease;
        }
        .cl-section.active { display: block; }
        @keyframes cl-fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cl-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .cl-section-header img {
            width: 28px; height: 28px;
            object-fit: contain;
        }
        .cl-section-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .cl-section-intro {
            color: var(--cl-text-dim);
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* --- Card grid --- */
        .cl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .cl-grid-3 {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .cl-card {
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: var(--cl-radius);
            padding: 24px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .cl-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--cl-primary), var(--cl-accent));
            opacity: 0;
            transition: opacity 0.25s;
        }
        .cl-card:hover {
            border-color: rgba(96,165,250,0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .cl-card:hover::before { opacity: 1; }

        .cl-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .cl-card-icon {
            width: 36px; height: 36px;
            object-fit: contain;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .cl-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--cl-text);
        }
        .cl-card-subtitle {
            font-size: 0.78rem;
            color: var(--cl-accent);
            font-weight: 600;
            margin-top: 2px;
        }
        .cl-card-body {
            font-size: 0.88rem;
            color: var(--cl-text-dim);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* --- Tags / badges --- */
        .cl-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .cl-tag {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.15);
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--cl-primary);
        }
        .cl-tag.cert {
            background: rgba(167,139,250,0.1);
            border-color: rgba(167,139,250,0.2);
            color: var(--cl-accent);
        }
        .cl-tag.salary {
            background: rgba(52,211,153,0.1);
            border-color: rgba(52,211,153,0.2);
            color: var(--cl-success);
        }

        /* --- Salary range --- */
        .cl-salary {
            font-size: 0.85rem;
            color: var(--cl-success);
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* --- Data table --- */
        .cl-table-wrap {
            overflow-x: auto;
            margin-bottom: 24px;
            border-radius: var(--cl-radius);
            border: 1px solid var(--cl-border);
        }
        .cl-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .cl-table th {
            background: var(--cl-surface-2);
            color: var(--cl-primary);
            font-weight: 700;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--cl-border);
            white-space: nowrap;
        }
        .cl-table td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--cl-text-dim);
        }
        .cl-table tr:last-child td { border-bottom: none; }
        .cl-table tr:hover td { background: rgba(96,165,250,0.03); }

        /* --- Flowchart (cert roadmap) --- */
        .cl-roadmap {
            position: relative;
            padding: 32px 0;
            margin-bottom: 32px;
        }
        .cl-roadmap-track {
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
        }
        .cl-roadmap-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            position: relative;
        }
        .cl-roadmap-spine {
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }
        .cl-roadmap-dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--cl-surface-2);
            border: 3px solid var(--cl-primary);
            z-index: 2;
            flex-shrink: 0;
        }
        .cl-roadmap-dot.core { border-color: var(--cl-primary); }
        .cl-roadmap-dot.security { border-color: #f87171; }
        .cl-roadmap-dot.cloud { border-color: #fbbf24; }
        .cl-roadmap-dot.network { border-color: #34d399; }
        .cl-roadmap-line {
            width: 3px;
            flex: 1;
            min-height: 32px;
            background: var(--cl-border);
        }
        .cl-roadmap-content {
            flex: 1;
            padding-bottom: 24px;
        }
        .cl-roadmap-node {
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 10px;
            padding: 16px 20px;
            transition: all 0.2s;
        }
        .cl-roadmap-node:hover {
            border-color: rgba(96,165,250,0.3);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .cl-roadmap-node h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .cl-roadmap-node p {
            font-size: 0.8rem;
            color: var(--cl-text-dim);
            margin: 0;
        }
        .cl-roadmap-node .cl-node-meta {
            font-size: 0.72rem;
            color: var(--cl-accent);
            margin-top: 6px;
            font-weight: 600;
        }
        .cl-roadmap-branch {
            margin-top: 12px;
            padding: 12px 16px;
            background: var(--cl-surface-2);
            border-radius: 8px;
            border-left: 3px solid var(--cl-accent);
        }
        .cl-roadmap-branch h5 {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--cl-accent);
            margin-bottom: 4px;
        }
        .cl-roadmap-branch p {
            font-size: 0.78rem;
            color: var(--cl-text-dim);
        }

        /* --- Checklist style --- */
        .cl-checklist {
            list-style: none;
            margin-bottom: 24px;
        }
        .cl-checklist li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
            color: var(--cl-text-dim);
        }
        .cl-checklist li:last-child { border-bottom: none; }
        .cl-checklist li img {
            width: 18px; height: 18px;
            object-fit: contain;
            margin-top: 2px;
            flex-shrink: 0;
        }

        /* --- Tips / callout boxes --- */
        .cl-callout {
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-left: 4px solid var(--cl-primary);
            border-radius: 0 var(--cl-radius) var(--cl-radius) 0;
            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .cl-callout h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--cl-primary);
            margin-bottom: 8px;
        }
        .cl-callout p, .cl-callout li {
            font-size: 0.88rem;
            color: var(--cl-text-dim);
            line-height: 1.7;
        }
        .cl-callout ul {
            margin: 8px 0 0 20px;
        }
        .cl-callout.accent { border-left-color: var(--cl-accent); }
        .cl-callout.accent h4 { color: var(--cl-accent); }
        .cl-callout.success { border-left-color: var(--cl-success); }
        .cl-callout.success h4 { color: var(--cl-success); }

        /* --- Section complete toggle --- */
        .cl-complete-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 8px;
            color: var(--cl-text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            margin-top: 16px;
        }
        .cl-complete-toggle:hover {
            border-color: var(--cl-success);
            color: var(--cl-success);
        }
        .cl-complete-toggle.done {
            background: rgba(52,211,153,0.1);
            border-color: var(--cl-success);
            color: var(--cl-success);
        }
        .cl-complete-toggle img {
            width: 16px; height: 16px;
            object-fit: contain;
        }

        /* --- Footer --- */
        .cl-footer {
            text-align: center;
            padding: 40px 0 20px;
            color: var(--cl-text-dim);
            font-size: 0.78rem;
            border-top: 1px solid var(--cl-border);
            margin-top: 40px;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .cl-hero h1 { font-size: 1.8rem; }
            .cl-grid { grid-template-columns: 1fr; }
            .cl-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .cl-tabs { gap: 6px; }
            .cl-tab { padding: 8px 12px; font-size: 0.75rem; }
            .cl-roadmap-row { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="cl-ambient"></div>
    <div class="cl-particles" id="particles"></div>

    <div class="cl-wrapper">
        <!-- Header -->
        <div class="cl-header">
            <div class="cl-header-left">
                <img class="cl-header-icon" src="/assets/images/icons/icon-rocket.webp" alt="Career Launchpad">
                <div>
                    <div class="cl-header-title">Career Launchpad</div>
                    <div class="cl-header-sub">Job Readiness Hub</div>
                </div>
            </div>
            <a href="../dashboard.html" class="cl-btn">
                <img src="/assets/images/icons/icon-home.webp" alt="" style="width:14px;height:14px;object-fit:contain">
                Dashboard
            </a>
        </div>

        <!-- Hero -->
        <div class="cl-hero">
            <img class="cl-hero-icon" src="/assets/images/icons/icon-rocket.webp" alt="">
            <h1>Career Launchpad</h1>
            <p>Your bridge from student to cybersecurity professional. Explore career paths, build your resume, prep for interviews, and chart your certification journey.</p>
        </div>

        <!-- Overall Progress -->
        <div class="cl-progress-bar">
            <span class="cl-progress-label">Hub Progress</span>
            <div class="cl-progress-track">
                <div class="cl-progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <span class="cl-progress-pct" id="progressPct">0%</span>
        </div>

        <!-- Section Tabs -->
        <div class="cl-tabs" id="sectionTabs"></div>

        <!-- Section Panels -->
        <div id="sectionPanels"></div>

        <!-- Footer -->
        <div class="cl-footer">Career Launchpad &mdash; Hexworth Prime</div>
    </div>

    <!-- Components -->
    <script src="../components/AccessGuard.js"></script>
    <script src="../components/ModuleProgress.js"></script>
    <script src="../components/FluxCapacitor.js"></script>

    <script>
    /* =================================================================
       Career Launchpad — Controller
       ================================================================= */
    (function() {
        'use strict';

        const STORAGE_KEY = 'hexworth_career_launchpad';
        const ICON_BASE = '/assets/images/icons/';

        // --- Section definitions ---
        const SECTIONS = [
            { id: 'paths',       name: 'Career Paths',      icon: 'icon-compass.webp' },
            { id: 'resume',      name: 'Resume Builder',    icon: 'icon-document.webp' },
            { id: 'interview',   name: 'Interview Prep',    icon: 'icon-speech.webp' },
            { id: 'certs',       name: 'Cert Roadmap',      icon: 'icon-map.webp' },
            { id: 'salary',      name: 'Salary Research',   icon: 'icon-barchart.webp' },
            { id: 'internship',  name: 'Internships',       icon: 'icon-graduation.webp' }
        ];

        // --- Progress state ---
        let progress = {};
        function loadProgress() {
            try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { progress = {}; }
        }
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }
        function isSectionDone(id) { return !!progress[id]; }
        function toggleSection(id) {
            if (progress[id]) delete progress[id];
            else progress[id] = Date.now();
            saveProgress();
            updateProgressUI();
        }

        function updateProgressUI() {
            const done = SECTIONS.filter(s => isSectionDone(s.id)).length;
            const pct = Math.round((done / SECTIONS.length) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = pct + '%';

            // Update tab checkmarks
            SECTIONS.forEach(s => {
                const tab = document.querySelector(`[data-tab="${s.id}"]`);
                if (tab) tab.classList.toggle('completed', isSectionDone(s.id));
                const btn = document.getElementById('toggle-' + s.id);
                if (btn) {
                    btn.classList.toggle('done', isSectionDone(s.id));
                    btn.querySelector('span').textContent = isSectionDone(s.id) ? 'Section Complete' : 'Mark as Complete';
                }
            });
        }

        // --- Particles ---
        function spawnParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('span');
                p.className = 'cl-particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = -(Math.random() * 20) + 's';
                p.style.opacity = String(0.15 + Math.random() * 0.3);
                container.appendChild(p);
            }
        }

        // --- Tab navigation ---
        let activeSection = null;

        function activateTab(id) {
            if (activeSection === id) return;
            activeSection = id;
            document.querySelectorAll('.cl-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
            document.querySelectorAll('.cl-section').forEach(s => s.classList.toggle('active', s.id === 'section-' + id));
        }

        function buildTabs() {
            const container = document.getElementById('sectionTabs');
            SECTIONS.forEach(s => {
                const tab = document.createElement('div');
                tab.className = 'cl-tab' + (isSectionDone(s.id) ? ' completed' : '');
                tab.dataset.tab = s.id;
                tab.innerHTML = `<img src="${ICON_BASE}${s.icon}" alt=""><span>${s.name}</span><img class="cl-tab-check" src="${ICON_BASE}icon-checkbox.webp" alt="">`;
                tab.addEventListener('click', () => activateTab(s.id));
                container.appendChild(tab);
            });
        }

        // --- Section complete button helper ---
        function completeBtn(sectionId) {
            const done = isSectionDone(sectionId);

        function buildCertRoadmap() {
            const nodes = [
                { title: 'CompTIA A+', desc: 'Hardware, OS, networking basics, troubleshooting. The IT foundation.', meta: 'Entry Level | ~$350 | 2 exams', dot: 'core' },
                { title: 'CompTIA Network+', desc: 'Network architecture, protocols, security, and troubleshooting.', meta: 'Entry-Mid | ~$370 | 1 exam', dot: 'core' },
                { title: 'CompTIA Security+', desc: 'Threats, vulnerabilities, architecture, operations, governance. The industry baseline for security.', meta: 'Mid Level | ~$390 | 1 exam | DoD 8570 approved', dot: 'core',
                  branches: [
                    { title: 'Offensive Path', text: 'PenTest+ >> OSCP >> GPEN' },
                    { title: 'Cloud Security Path', text: 'AWS CCP >> AWS SAA >> AWS Security Specialty (or AZ-500)' },
                    { title: 'Networking Path', text: 'CCNA >> CCNP Enterprise >> CCNP Security' }
                  ]
                },
                { title: 'CompTIA CySA+', desc: 'Threat detection, analysis, and response. Defensive security analyst focus.', meta: 'Mid Level | ~$390 | 1 exam | DoD 8570 approved', dot: 'security' },
                { title: 'CompTIA CASP+', desc: 'Advanced enterprise security, risk management, and architecture. Practitioner-level (no multiple choice).', meta: 'Advanced | ~$480 | 1 exam | DoD 8570 approved', dot: 'security',
                  branches: [
                    { title: 'Leadership Path', text: 'CISSP >> CISM >> CCISO' },
                    { title: 'Audit & Compliance', text: 'CISA >> CRISC >> CGEIT' }
                  ]
                }

                        <div class="cl-roadmap-branch">
                            <h5>${b.title}</h5>
                            <p>${b.text}</p>
                        </div>
                    `).join('');

                return `
                    <div class="cl-roadmap-row">
                        <div class="cl-roadmap-spine">
                            <div class="cl-roadmap-dot ${n.dot}"></div>
                            ${i < nodes.length - 1 ? '<div class="cl-roadmap-line"></div>' : ''}
                        </div>
                        <div class="cl-roadmap-content">
                            <div class="cl-roadmap-node">
                                <h4>${n.title}</h4>
                                <p>${n.desc}</p>
                                <div class="cl-node-meta">${n.meta}</div>
                            </div>
                            ${branchHTML}
                        </div>
                    </div>
                `;

                        </div>

                        </div>
                        <div class="cl-tags">

                    </div>
                    <div class="cl-card">
                        <div class="cl-card-header">
                            <img class="cl-card-icon" src="${ICON_BASE}icon-globe.webp" alt="">
                            <div class="cl-card-title">Azure Path</div>
                        </div>
                        <div class="cl-card-body">
                            AZ-900 Fundamentals >> AZ-104 Administrator >> AZ-500 Security Engineer / AZ-400 DevOps
                        </div>
                        <div class="cl-tags">

                            <span class="cl-tag cert">AZ-104</span>
                            <span class="cl-tag cert">AZ-500</span>
                        </div>
                    </div>
                    <div class="cl-card">
                        <div class="cl-card-header">
                            <img class="cl-card-icon" src="${ICON_BASE}icon-network.webp" alt="">
                            <div class="cl-card-title">Cisco Path</div>
                        </div>
                        <div class="cl-card-body">

                    </ul>
                </div>

                <div class="cl-callout">

                    <ul>

                        <li>Total compensation includes base + bonus + RSUs + benefits — compare the full package</li>
                        <li>Remote roles often have location-adjusted pay bands — ask about their policy</li>

                        <li>Clearance holders (TS/SCI) command 15-30% premiums in government-adjacent roles</li>
                    </ul>
                </div>

                ${completeBtn('salary')}
            </div>`;
