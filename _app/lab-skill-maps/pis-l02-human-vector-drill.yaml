# Skill Map for: PIS-L02 Human Vector Drill (social engineering triage)
#
# Recognition-primary lab: 10 inbox messages (emails / texts / voicemails),
# 4 are social engineering attempts. Student identifies them, classifies
# the technique per message, and files an incident report.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l02-human-vector-drill
lab_name: PIS-L02 Human Vector Drill (social engineering recognition)

primary_skill:
  layer: Recognition
  description: Distinguishes legitimate communications from social engineering attempts across multiple channels (email, text, voicemail) by reading contextual indicators (urgency cues, authority claims, suspicious links, payload requests).
  evidence_required: Student correctly identifies all 4 social engineering messages out of 10 inbox items.

secondary_skill:
  layer: Recognition
  description: Classifies the social engineering technique per message (phishing, vishing, smishing, pretexting, baiting, etc.) using the actual indicators in each message.
  evidence_required: Per-message classification matches the lab's correct-technique grading.

assessed_artifact:
  type: flag
  description: FLAG captured after correctly identifying the 4 SE messages + classifying technique per message.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Which 4 of the 10 messages are the SE attempts is the graded judgment:
  - "message 1 is social engineering"
  - "message 2 is social engineering"
  - "message 3 is social engineering"
  - "message 4 is social engineering"
  - "message 5 is social engineering"
  - "message 6 is social engineering"
  - "message 7 is social engineering"
  - "message 8 is social engineering"
  - "message 9 is social engineering"
  - "message 10 is social engineering"
  - "the four phishing messages are"
  - "the social engineering attempts are"
  # Per-message technique classification is the secondary grade — never
  # spoon-feed:
  - "message 1 is phishing"
  - "message 2 is vishing"
  - "message 3 is smishing"
  - "message 4 is pretexting"
  - "this is a baiting attack"
  - "this is a pretexting attack"
  - "this is a vishing attack"

transfer_prompt: |
  You identified 4 SE messages out of 10 in a controlled drill. Now: a
  real organization receives ~120 emails per employee per day. Even
  excellent recognition (95% accuracy) means each employee misses about
  6 SE attempts per day if 1% of email is malicious. Beyond user
  training, what TECHNICAL + PROCEDURAL controls reduce that
  miss-rate to acceptable levels? Name at least three controls and
  explain what fails if any one of them is removed.
