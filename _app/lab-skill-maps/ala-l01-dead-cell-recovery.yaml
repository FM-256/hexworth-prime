# Skill Map for: Matrix Advanced Linux Administration — Lab 01: Dead Cell Recovery
#
# Recovery scenario: student must recover access to a Linux system whose
# root password is unknown by booting into single-user mode and resetting
# credentials. The lab assesses both Recognition (knowing WHEN to apply
# this technique) and Execution (actually performing the recovery steps).

lab_id: ala-l01-dead-cell-recovery
lab_name: ALA Lab 01 — Dead Cell Recovery

primary_skill:
  layer: Execution
  description: Performs the sequence of GRUB-edit + single-user-mode boot + passwd reset on a Linux system with unknown root credentials.
  evidence_required: Student successfully changes the root password and logs in interactively.

secondary_skill:
  layer: Recognition
  description: Recognizes that the situation calls for offline single-user recovery rather than online credential brute force.
  evidence_required: Student can explain why single-user mode bypasses the password requirement.

assessed_artifact:
  type: flag
  description: Flag is revealed by a file readable only after successful root login.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3   # max — Dr. Hex can describe single-user-mode and `init=/bin/bash` concepts, but should not provide the exact GRUB-edit keystrokes

forbidden_disclosures:
  - "init=/bin/bash"           # exact GRUB kernel-parameter syntax
  - "rw init=/bin/bash"        # variant
  - "mount -o remount,rw /"    # exact remount syntax students must derive

transfer_prompt: |
  How would a defensive sysadmin prevent the exact recovery technique you just used — which BIOS/UEFI setting AND which GRUB setting would they harden?
