# Skill Map for: key-kdf (Key Derivation Functions hands-on)
#
# Execution lab: student works with PBKDF2, bcrypt, scrypt, Argon2 —
# tunes work factors, observes time-vs-attack-cost trade, computes
# proper salting + derivation chains.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-kdf
lab_name: KDF Hands-On Lab (PBKDF2 / bcrypt / scrypt / Argon2)

primary_skill:
  layer: Execution
  description: Configures KDF parameters (iteration count, memory cost, parallelism) appropriate for the threat scenario, then verifies derivation correctness with known test vectors.
  evidence_required: Student produces correct derived keys against test vectors + tunes work factor to a defensible attack-cost target.

secondary_skill:
  layer: Hypothesis
  description: Reasons about the tradeoff between user-experience latency (a few hundred ms) and attacker cost (billions of attempts/sec on GPU); justifies the chosen work factor.
  evidence_required: Student's parameter choice reflects current threat model — bcrypt cost >= 12, Argon2 memory >= 64 MiB, PBKDF2 iterations >= 600k for SHA-256.

assessed_artifact:
  type: flag
  description: FLAG captured after deriving keys correctly + defending parameter choice.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specific test-vector outputs — student must compute, not look up:
  - "the derived key is 0x"
  - "PBKDF2 output is"
  - "bcrypt hash is $2"
  - "scrypt output is"
  - "Argon2 output is"
  # The work-factor target is the graded Hypothesis — don't preview:
  - "use bcrypt cost 12"
  - "use 600000 iterations"
  - "set memory to 64 MiB"
  - "the correct work factor is"
  # Salt-generation specifics:
  - "the salt is"
  - "use os.urandom(16) for salt"

transfer_prompt: |
  You tuned a KDF for human passwords. Now: same threat model, but
  the secret is a 30-character random API key (high entropy, machine-
  generated, never typed by humans). Should you still use bcrypt or
  PBKDF2 on it? Why or why not? Name what's different about the
  threat surface AND what the correct construction is for high-entropy
  machine secrets at rest.
