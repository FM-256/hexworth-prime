# Skill Map for: key-encryption-dh-rsa
#
# Execution + Hypothesis lab. Student performs ASCII↔Binary↔Hex
# conversions + DH key exchange + RSA encrypt/decrypt by hand
# (small primes) to build intuition for the math.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-encryption-dh-rsa
lab_name: Encryption Lab (ASCII ↔ Binary ↔ Hex · Diffie-Hellman · RSA)

primary_skill:
  layer: Execution
  description: Performs base conversions correctly + computes DH shared secret given parameters + computes RSA encrypt and decrypt on small primes.
  evidence_required: All numeric computations match expected values; student traces the math, not just runs a library call.

secondary_skill:
  layer: Hypothesis
  description: Reasons about WHY the math actually works — discrete log problem makes DH secret hard to derive from public values; integer factorization makes RSA private key hard to derive from modulus.
  evidence_required: Student articulates the hard problem under each system without confusing them.

assessed_artifact:
  type: flag
  description: FLAG captured after correct math + correct hard-problem identification per system.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Computed values — student must compute by hand:
  - "the DH shared secret is"
  - "the RSA ciphertext is"
  - "Alice's secret is"
  - "Bob's secret is"
  - "the binary of 65 is"
  - "the hex of"
  # Hard-problem mapping is the Hypothesis grade:
  - "DH security comes from discrete log"
  - "RSA security comes from integer factorization"
  - "the underlying hard problem for DH is"
  - "the underlying hard problem for RSA is"
  # Specific Euler-totient / modular-inverse calculations:
  - "phi(n) is"
  - "the private exponent d is"

transfer_prompt: |
  You computed DH and RSA by hand with small primes. The math works
  identically with 2048-bit primes — but the ATTACK math also works.
  Why is 2048-bit RSA still secure today even though the same math
  you used DOES theoretically attack it? Name the specific
  computational gap (in concrete operation count + current best
  algorithm) that makes 2048-bit RSA infeasible to break on classical
  hardware. THEN name what changes that calculus when a sufficient
  quantum computer exists.
