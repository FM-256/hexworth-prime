# Skill Map for: key-hashing-algorithms
#
# Recognition + Execution lab. Student works with MD5, SHA-1,
# SHA-256/384/512 — computes hashes, observes collisions in broken
# functions, identifies when each is appropriate.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-hashing-algorithms
lab_name: Interactive Hashing Lab (MD5 / SHA-1 / SHA-256 / 384 / 512)

primary_skill:
  layer: Execution
  description: Computes hashes correctly across the 5 algorithms + identifies which are broken (MD5 + SHA-1) + selects the appropriate algorithm for integrity, password storage, signature, etc.
  evidence_required: Student's hash outputs match known test vectors AND algorithm selection per scenario matches the lab's grading.

secondary_skill:
  layer: Recognition
  description: Recognizes hash properties (preimage resistance, second-preimage resistance, collision resistance) + when each property matters.
  evidence_required: Per-scenario selection demonstrates property awareness — not just default-to-SHA-256.

assessed_artifact:
  type: flag
  description: FLAG captured after correct computation + correct algorithm selection per scenario.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specific hash outputs — student must compute, not look up:
  - "the SHA-256 of"
  - "the MD5 of"
  - "the hash is 0x"
  # Algorithm-to-scenario mapping is graded Recognition:
  - "use SHA-256 for integrity"
  - "use SHA-384 for"
  - "use bcrypt for passwords"
  - "never use MD5 because"
  - "SHA-1 is broken because"
  # Specific collision examples:
  - "the SHAttered example"
  - "the MD5 collision is"

transfer_prompt: |
  You learned MD5 and SHA-1 are broken. A legacy system you support
  uses MD5 for checksums on internal log files (NOT for security —
  just transmission integrity). A security audit flags this as a
  finding. Is the audit correct that MD5 must be replaced here?
  Defend either yes (replace) or no (keep) — name the specific
  threat the auditor is reasoning about and why it does or does not
  apply to internal log checksums.
