# Skill Map for: key-cryptanalysis
#
# Recognition + Hypothesis lab. Student attacks weak cryptosystems
# (Caesar, Vigenère, weak block cipher modes, padding oracle) to
# build intuition about why modern crypto is hard to break.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-cryptanalysis
lab_name: Cryptanalysis Lab (frequency / Kasiski / padding oracle)

primary_skill:
  layer: Recognition
  description: Identifies the weakness in each cryptosystem from observable patterns (frequency distribution, key-period structure, error oracle), then applies the appropriate attack.
  evidence_required: Student recovers plaintext / key from each weak system using only the indicated attack class.

secondary_skill:
  layer: Hypothesis
  description: Reasons about WHY modern crypto resists these classical attacks — uniform output distribution, semantic security, authenticated encryption.
  evidence_required: Student articulates which property of modern crypto blocks each classical attack class.

assessed_artifact:
  type: flag
  description: FLAG captured after completing each break with the correct attack name + producing the recovered plaintext.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Recovered plaintext / keys — student must produce, not be given:
  - "the Caesar key is"
  - "the Vigenère key is"
  - "the key length is"
  - "the plaintext is"
  - "the decrypted message is"
  # Attack-class identification is Recognition grade:
  - "use frequency analysis"
  - "use Kasiski examination"
  - "this is a padding oracle attack"
  - "this is a chosen-ciphertext attack"
  # Specific letter frequencies / common-bigram tables:
  - "E is the most common letter at"
  - "TH is the most common bigram"

transfer_prompt: |
  You broke a Vigenère cipher in this lab using Kasiski + frequency
  analysis. A junior dev proposes "we'll use Vigenère with a 256-byte
  random key — that solves it." What's wrong with that defense, and
  what's the actual modern equivalent of 'large random key + simple
  XOR per byte' that IS secure (hint: it has a name + a specific
  constraint that Vigenère violates)?
