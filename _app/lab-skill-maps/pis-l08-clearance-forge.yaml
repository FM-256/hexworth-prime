# Skill Map for: PIS-L08 Clearance Forge (PKI build + CRL + OCSP + revocation)
#
# Execution-primary PKI lab. Student builds a complete PKI from
# scratch — root CA, certificates for 4 servers, CRL + OCSP validation,
# then revokes a compromised cert and confirms revocation propagates.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l08-clearance-forge
lab_name: PIS-L08 Clearance Forge (PKI build + revocation lifecycle)

primary_skill:
  layer: Execution
  description: Builds a complete PKI hierarchy from a root CA + issues 4 server certificates + configures CRL distribution + OCSP responder + revokes one cert + confirms revocation propagates through validation.
  evidence_required: All 4 server certs issued and chain-verifiable; revocation of compromised cert fails subsequent CRL/OCSP validation.

secondary_skill:
  layer: Recognition
  description: Distinguishes CRL (periodic snapshot) from OCSP (real-time query) and recognizes when each is appropriate; identifies which compromised cert needs revocation from the lab's evidence.
  evidence_required: Validation tests confirm both CRL and OCSP correctly report the revoked cert as invalid.

assessed_artifact:
  type: flag
  description: FLAG captured after building PKI + issuing certs + configuring CRL+OCSP + revoking compromised cert + verifying revocation.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Which server has the compromised cert is the Recognition grade:
  - "server 1's cert is compromised"
  - "server 2's cert is compromised"
  - "server 3's cert is compromised"
  - "server 4's cert is compromised"
  - "the compromised cert is on"
  # Specific OpenSSL invocations / CA config — Execution grade:
  - "use openssl ca -gencrl"
  - "the CA config is"
  - "the CRL URL is"
  - "the OCSP responder URL is"
  - "the cert subject DN is"
  # Revocation reason field — student must read RFC 5280 / pick correct
  # value from lab UI:
  - "the revocation reason is keyCompromise"
  - "the revocation reason is cACompromise"

transfer_prompt: |
  You used both CRL and OCSP for revocation checking. Real browsers
  today increasingly rely on neither — they use OCSP stapling,
  CRLite, CT (Certificate Transparency), and proprietary mechanisms
  like CRLSet. Why did the original CRL/OCSP design fall short in
  practice? Name at least two specific failure modes (operational +
  performance) and explain how one of the modern replacements
  (OCSP stapling, CRLite, or CT) addresses the failure.
