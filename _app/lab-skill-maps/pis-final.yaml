# Skill Map for: Shield House — PIS Final Exam (40Q timed, server-graded)
#
# Distinct artifact from `pis-final-patient-zero.yaml` (the practical lab).
# This skill map applies to `_app/houses/shield/infosec/exams/pis-final.exam.html`
# which carries `mission-id="pis-final"` on the floating Dr. Hex button.
#
# Format: 40 multiple-choice questions, 75-minute timer, 70% to pass,
# server-graded via `gradeQuiz` Cloud Function with answer key at
# Firestore `quiz_keys/shield-pis-final`. Covers Security+ SY0-701
# Domains 1.0-5.0 (General Concepts, Threats/Vulnerabilities,
# Architecture, Operations, Program Management).
#
# This is SUMMATIVE assessment, not formative practice. The student's
# accumulated knowledge across the entire course is being measured.
# Dr. Hex must NOT discuss specific exam questions, MUST NOT confirm
# or deny option selections, and MUST NOT pre-teach domain material
# during the active exam. The calm-mode chat button is available for
# meta-questions ("how long do I have?", "can I revisit a question?")
# and for explicit "I'm taking a break, can we talk?" debrief.

lab_id: pis-final
lab_name: "Shield House — PIS Final Exam (Security+ SY0-701, 40Q timed)"

primary_skill:
  layer: Recognition
  description: |
    Recognizes correct security concepts across all five Security+ SY0-701 domains under time pressure (75 minutes for 40 questions = ~1.9 min/Q). Tests integration of vocabulary + scenario-mapping across General Security Concepts, Threats/Vulnerabilities/Mitigations, Security Architecture, Security Operations, and Security Program Management/Oversight.
  evidence_required: |
    28/40 correct (70%) for pass. Score returned by `gradeQuiz` Cloud Function. Passing awards the Shield Guardian badge. One attempt; no retake during the active session.

secondary_skill:
  layer: Hypothesis
  description: |
    For each question, generates plausible answer hypotheses and rules out distractors. Each multiple-choice question contains 3 distractors that are SURFACE-PLAUSIBLE — they would be picked by a student who memorized vocabulary but didn't internalize concept relationships. Distinguishing the right answer requires conceptual fluency, not recall.
  evidence_required: |
    Per-question correctness on questions where distractors are designed to trap memorized-vocab-only students (the majority of the 40).

assessed_artifact:
  type: written-explanation
  description: |
    40 multiple-choice selections submitted as a form. Server-side grading. (No `quiz` artifact type exists in the loader; `written-explanation` is the closest semantic match — the student "writes" their answer by selecting one of four options.)

# SUMMATIVE EXAM — Help Level 0 ONLY.
# Dr. Hex is calm-mode background only during an active exam attempt.
# No question-specific scaffolding. No domain teaching. No option discussion.
# Level 0 = clarifying questions back to the student ("are you on break, or
# in the middle of a question?") and refusal to engage with question content.
allowed_help_levels:
  - 0

# Forbidden disclosures — substring-matched case-insensitively by
# voice_linter.check_no_forbidden_disclosure. Intentionally broad so
# any framing the LLM might use to leak answers gets caught.
forbidden_disclosures:
  # Direct answer framings
  - "the correct answer is"
  - "the right answer is"
  - "the answer to that question"
  - "the answer is"
  - "correct option"
  - "right option"
  - "best answer"

  # Option-letter / position framings
  - "option A is correct"
  - "option B is correct"
  - "option C is correct"
  - "option D is correct"
  - "the first option"
  - "the second option"
  - "the third option"
  - "the fourth option"

  # Domain pre-teaching during exam (refuses to substitute for study)
  - "let me teach you about"
  - "let me explain how"
  - "the CIA triad means"

  # Test-bank cheat patterns
  - "I can tell you which is right"
  - "skip ahead to the answer"
  - "if you select"
  - "you should pick"

# Transfer prompt — used in post-exam debrief mode (after submission,
# when the student returns to talk through results). Not during the
# active exam.
transfer_prompt: |
  Looking back at the questions you found hardest, which Security+ DOMAIN were they concentrated in (General Concepts, Threats/Vulnerabilities, Architecture, Operations, or Program Management)? When you hit that same domain in a real job context — say, a SOC ticket that asks you to classify a control as preventive vs detective vs corrective — what evidence in the ticket would tell you which framework concept applies?
