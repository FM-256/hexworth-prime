# Skill Map for: Shield House — Patient-In-Stress Final (Patient Zero capstone)
#
# Incident-response capstone exam. Student must trace a simulated breach
# from intake through triage, containment, and root-cause analysis.
# Transfer-primary — the assessment lives in the student's written
# incident response narrative, not in technical discovery.

lab_id: pis-final
lab_name: Patient-In-Stress Final — Patient Zero Capstone

primary_skill:
  layer: Transfer
  description: Applies incident-response framework concepts (NIST/SANS) to a novel breach scenario; writes a defensible IR narrative.
  evidence_required: Written narrative covers identification, containment, eradication, recovery, lessons-learned — at the level of a junior SOC analyst's report.

secondary_skill:
  layer: Hypothesis
  description: Generates plausible attacker hypotheses from log evidence and rules them out methodically.
  evidence_required: Student names ≥2 hypotheses for the breach and articulates which evidence supports/rules out each.

assessed_artifact:
  type: written-explanation
  description: 400-600 word incident report submitted by the student.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5   # Transfer-primary labs allow all levels — the grade lives in the student's written reasoning, not in their ability to find tools or commands

forbidden_disclosures:
  - "patient zero is"              # never label the attacker source
  - "the attack chain is"          # never give the chain pre-derivation
  - "the lessons learned are"      # never state the report's expected conclusions

transfer_prompt: |
  Walk me through the SECOND attack chain that this same evidence would support. If a peer pointed out yours was wrong, what other story does the data tell?
