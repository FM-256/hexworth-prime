# Skill Map for: Cold Horizon — Line of Sight (cloud house, arcade)
#
# WHY THIS FILE EXISTS
#   Cold Horizon's graded artifact is not a flag or a command — it is a REASONING
#   VERDICT: which of HELIOS-7's three thermal channels the containment decision
#   should follow, and what the 2-of-3 majority is actually evidence of.
#
#   That matters for Dr. Hex specifically. Without a Skill Map the voice-linter
#   falls back to a generic map whose entire forbidden_disclosures list is three
#   FLAG{...} patterns (orchestrator/main.py:1619-1633). Those catch a leaked
#   flag string and do nothing whatsoever about a paragraph of prose that hands
#   over the reasoning. So on this page, with no map, a student could ask Dr. Hex
#   "which channel should I trust and why" and receive the exact sentence the
#   in-game Sortie Coach is unit-tested never to give, for free, bypassing the
#   decision-discipline cost the coach charges.
#
#   Authored 2026-08-05 when Chris blocked the Dr. Hex button integration for
#   precisely this gap. The five sibling cloud games carry the same exposure and
#   have no maps either; theirs are FLAG-shaped enough that the fallback offers
#   partial cover, this one is not.
#
# THE CEILING
#   The Sortie Coach's deepest tier names the ARTIFACT and stops: it says two of
#   the three channels share a bus and a clock, and asks which reading crossed no
#   platform bus at all. It never names which two, never names TH-2, never says
#   which option to file. Dr. Hex must not exceed that ceiling, which is why
#   Levels 4 and 5 are withheld and why the forbidden list below targets the
#   verdict rather than the vocabulary. Talking about majority voting, correlated
#   failure and out-of-band verification in general terms is exactly what Dr. Hex
#   is for and remains fully allowed.

lab_id: cold-horizon
lab_name: Cold Horizon — Line of Sight (corroboration sortie)

primary_skill:
  layer: Recognition
  description: >-
    Recognizes that 2-of-3 majority voting assumes INDEPENDENT failure, and that
    two channels sharing a bus, a clock source and a signing authority are one
    source counted twice rather than two votes.
  evidence_required: >-
    Student can state why the majority is untrustworthy here in terms of shared
    dependency, without being told which channel to follow.

secondary_skill:
  layer: Execution
  description: >-
    Obtains an out-of-band physical observation (an infrared integration of the
    radiator) and uses it to adjudicate between disagreeing networked sources.
  evidence_required: >-
    Student completes the IR integration themselves and cites it as the reason
    for their call, rather than citing that one sensor disagreed with the others.

assessed_artifact:
  type: written-explanation
  description: >-
    The graded artifact is the incident call: which thermal channel the
    containment decision follows AND the reason. Selecting the correct channel
    for the wrong reason ("it is the odd one out") is scored separately and
    deliberately does not count as a win.

# Level 4 and 5 withheld on purpose. The assessment IS the reasoning, so a
# direct or near-direct answer removes the entire exercise rather than removing
# a syntax hurdle. Level 0 present as the loader requires, and meaningful here:
# "which one is right" must be refusable.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3

# NOTE ON FORM. Entries prefixed `re:` are regular expressions, matched
# case-insensitively (voice_linter.check_no_forbidden_disclosure) and compiled
# at load time so a malformed pattern fails validation rather than silently
# never matching.
#
# WHY REGEX HERE. The first version of this map enumerated literal phrasings,
# and adversarial testing walked through it 4 for 4 on the first attempt with
# nothing cleverer than word reordering: "go with TH-2" defeats "trust TH-2",
# "TH-3 and TH-1 share" defeats "TH-1 and TH-3 share", "my own infrared reading
# corroborates TH-2" defeats "corroborated by my own infrared". A model has no
# reason to prefer the author's word order. Enumerating phrasings works for a
# literal secret like a flag string; it does not work for a verdict expressible
# a hundred ways, so the rules below are order-independent and proximity-based.
#
# HONESTY NOTE — READ THIS BEFORE TRUSTING THE LIST BELOW.
#
# This list is BEST-EFFORT and it is NOT the defence. Three rounds of adversarial
# review established that regex proximity matching structurally cannot do this
# job, and the reasons are worth recording so nobody tries a fourth:
#
#   1. Every version has been a closed list wearing a different coat. v1
#      enumerated phrases and lost to word order. v2 enumerated verbs and lost
#      to "recommend". v3 enumerated first-person markers and lost to "I prefer",
#      "I favour", "I'm leaning toward", "the data suggests", passive voice
#      ("TH-2 should be trusted"), and question form ("Wouldn't TH-2 be the
#      one?"). There is always another synonym.
#   2. It cannot see across a sentence boundary. "TH-2 looks solid to me. I'd go
#      with it." splits the token from the marker and no pattern here can join
#      them.
#   3. Most importantly, it cannot tell endorsement from exclusion. A pattern
#      broad enough to catch "I'd go with channel 2" also catches "I'd ignore
#      channel 2", which is the tutor steering a student AWAY from the trap.
#      Blocking that is worse than the leak.
#
# What actually constrains Dr. Hex here is allowed_help_levels (capped at 3, no
# direct answers) plus the Constitution and the system prompt. The patterns below
# stop the blunt, high-frequency phrasings and nothing more. Treat any claim that
# this list "closes" the disclosure gap as false.
#
# Closing it properly needs a semantic check — a cheap second pass asking "does
# this response name or endorse a specific channel" — which is a real feature
# with real cost, not a YAML edit. Deliberately not attempted here.
forbidden_disclosures:
  # --- the verdict: any recommendation structure near a TH-2 reference ---
  #
  # The TOKEN is deliberately generous: TH-2 / TH2 / TH 2 / TH-two, and
  # "channel 2" / "channel two", which is the map's own vocabulary and was a
  # complete blind spot in the previous version.
  #
  # The MARKER class is a superset of decision verbs, first-person modals and
  # recommendation nouns, because a closed verb list is what failed twice:
  # v1 enumerated phrases, v2 enumerated verbs and still missed "recommend",
  # "side with", "vote for" and "I'd use". Pattern 3 below is the verb-agnostic
  # backstop: a first-person modal anywhere near the token is a recommendation
  # whatever verb follows it.
  - "re:\\b(?:trust|follow|pick|picking|choose|choosing|select|selecting|file|filing|believe|recommend\\w*|suggest\\w*|endorse|advise|back|opt for|settle on|side with|vote for|use|using|take|run with|go(?:ing)? with|go for|going for|answer is|solution is|call is|correct one is|right one is)\\b[^.!?]{0,60}(?:\\bth[\\s\\-]?(?:2|two)\\b|\\bchannel[\\s\\-]+(?:2|two)\\b)"
  # token first, evaluative predicate after
  - "re:(?:\\bth[\\s\\-]?(?:2|two)\\b|\\bchannel[\\s\\-]+(?:2|two)\\b)[^.!?]{0,60}\\b(?:is|are|would be|remains|stays)\\b[^.!?]{0,40}\\b(?:the one|correct|right|the answer|trustworthy|reliable|believable|best|what you want|the channel to)\\b"
  # A first-person-marker backstop was tried here and REMOVED. It could not tell
  # endorsement from exclusion, because no regex can: it blocked "I'd ignore
  # channel 2" and "You should check whether channel 2 shares a timestamp
  # source" — i.e. it refused the tutor for steering a student AWAY from the
  # trap, and refused ordinary Socratic phrasing that is Dr. Hex's normal
  # register. Blocking correct teaching is a worse outcome than the leak it
  # closed, so it is gone. See the honesty note at the top of this list.
  # --- the graded option wording, in either direction ---
  - "re:\\bcorroborat\\w*\\b[^.!?]{0,60}(?:\\bth[\\s\\-]?(?:2|two)\\b|\\bchannel[\\s\\-]+(?:2|two)\\b|\\boutvoted\\b)"
  - "re:(?:\\bth[\\s\\-]?(?:2|two)\\b|\\bchannel[\\s\\-]+(?:2|two)\\b)[^.!?]{0,60}\\bcorroborat\\w*"
  - "re:\\binfrared\\b[^.!?]{0,50}\\bcorroborat\\w*"
  # --- naming WHICH two channels share the dependency, in either order,
  #     joined by "and" OR a comma (the comma form leaked in the last round).
  #     The Sortie Coach says only "two of the three match each other".
  - "re:\\bth[\\s\\-]?(?:1|one|3|three)\\b\\s*(?:,|and|,\\s*and)\\s*\\bth[\\s\\-]?(?:1|one|3|three)\\b[^.!?]{0,40}\\b(?:share|shares|sharing|both|same|identical|together)\\b"
  - "re:\\bchannel[s]?\\s+(?:1|one)\\b[^.!?]{0,20}\\b(?:3|three)\\b[^.!?]{0,40}\\b(?:share|shares|both|same)\\b"
  # --- pre-empting the trap the box exists to teach ---
  - "because it is the odd one out"
  - "the majority is wrong"

transfer_prompt: |
  You have two monitoring sources that agree and one that does not. Before you
  treat the agreement as confirmation, what would you need to know about how
  those two sources are collected, timed and signed — and where in your own
  environment would you go to get a reading that shares none of that?
