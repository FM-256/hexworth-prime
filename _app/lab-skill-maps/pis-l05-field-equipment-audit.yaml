# Skill Map for: PIS-L05 Field Equipment Audit
#
# Recognition-primary device-security lab: student audits 8 devices for
# encryption / MDM enrollment / patch level / open ports, identifies the
# 3 non-compliant ones, and files specific remediation per device.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l05-field-equipment-audit
lab_name: PIS-L05 Field Equipment Audit (device-security compliance)

primary_skill:
  layer: Recognition
  description: Identifies device compliance failures across 4 dimensions (encryption, MDM enrollment, patch level, port exposure) and selects the 3 non-compliant devices out of 8 staged.
  evidence_required: Student flags exactly the 3 non-compliant devices via the lab's finding mechanism.

secondary_skill:
  layer: Execution
  description: Applies specific remediation per finding (BitLocker enable, MDM enrollment trigger, patch dispatch, port closure).
  evidence_required: Per-finding remediation documented correctly for each non-compliant device.

assessed_artifact:
  type: flag
  description: FLAG captured after both flagging the 3 failures + filing correct remediation for each.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Which 3 devices fail is the graded judgment — never reveal:
  - "device 1 fails"
  - "device 2 fails"
  - "device 3 fails"
  - "device 4 fails"
  - "device 5 fails"
  - "device 6 fails"
  - "device 7 fails"
  - "device 8 fails"
  - "the three failing devices are"
  - "the non-compliant devices are"
  # Specific remediation maps are graded — student must choose:
  - "the remediation is BitLocker"
  - "the remediation is MDM enrollment"
  - "the fix is patch"
  - "close the open port"

transfer_prompt: |
  You audited devices against the CS-12 standard. In a production
  environment with 800 field devices and a 2% monthly turnover, what
  process would you put in place to keep the compliance rate above
  98% without doing manual audits each month? Name at least three
  controls/processes and explain which compliance dimension each one
  addresses.
