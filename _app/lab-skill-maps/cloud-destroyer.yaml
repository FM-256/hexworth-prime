# Skill Map for: Cloud Destroyer (cloud house, arcade)
#
# Region-by-region arcade shooter across us-east-1, us-west-2, eu-west-1,
# ap-south-1, ap-northeast-1 and sa-east-1. Clearing a region shows a fact about
# it; XP is awarded at the halfway point and on full clear.
#
# HONEST RISK ASSESSMENT: LOWEST OF THE FIVE, and this map says so rather than
# inventing rigor to look thorough. There is no answer to leak — the region
# facts are the REWARD for clearing a region, delivered by the game itself, and
# no amount of chat gets a student past a reflex shooter. A student asking Dr.
# Hex "what is special about sa-east-1" should simply be told; refusing would be
# obstruction with nothing on the other side of it.
#
# The map exists for one narrow reason worth stating plainly: without it the
# linter substitutes a fallback granting allowed_help_levels [0,1,2,3,4,5] and
# no lab context at all. With it, the posture is a decision, Dr. Hex knows what
# this game is actually about, and the transfer prompt gets asked. If a reviewer
# concludes this file earns its keep only barely, that is a fair reading and it
# is recorded here rather than argued around.

lab_id: cloud-destroyer
lab_name: Cloud Destroyer (AWS region familiarity)

primary_skill:
  layer: Recognition
  description: >-
    Builds working familiarity with the major AWS regions as distinct places
    with distinct properties — latency, cost, data residency and service
    availability — rather than as interchangeable dropdown entries.
  evidence_required: >-
    Student can name a reason to prefer one region over another for a stated
    workload constraint.

assessed_artifact:
  type: written-explanation
  description: >-
    The game grades arcade performance across six regions. There is no textual
    answer key. The SKILL evidence is the student's region-selection reasoning,
    which the transfer prompt probes.

# Deliberately the most generous in this set. Nothing here is withheld from a
# student by design, so a restrictive posture would only get in the way.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  # Near-empty by design, and the loader requires at least one entry. Keeping
  # the generic flag pattern is honest: there is genuinely nothing lab-specific
  # to forbid in a reflex shooter whose facts are the reward for playing it.
  - "the flag is FLAG{"

transfer_prompt: |
  You cleared six regions that differ in more than name. A team asks you to host
  a service for users in Sao Paulo but the workload processes personal data
  belonging to EU residents. Which region would you choose, and which of the two
  pressures — latency or data residency — did you decide has to lose?
