# Skill Map for: key-encryption-ascii-binary
#
# Execution-primary base-conversion lab. Student converts text/data
# between ASCII, binary, and hex representations as foundation for
# all higher-level crypto work.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-encryption-ascii-binary
lab_name: Encryption Lab (ASCII / Binary / Hex base conversions)

primary_skill:
  layer: Execution
  description: Performs base conversions correctly in both directions (ASCII → Binary → Hex AND Hex → Binary → ASCII).
  evidence_required: All conversion challenges produce correct output values.

secondary_skill:
  layer: Recognition
  description: Recognizes that text encoding is not encryption (ASCII/Base64/Hex transforms are reversible without keys) — a key conceptual prerequisite for distinguishing encoding from cryptographic protection.
  # Quoted because the value contains a colon. Unquoted, YAML reads
  # "labeling:" as a second mapping key and the whole file fails to parse,
  # which silently left this lab with no Dr. Hex guardrail.
  evidence_required: "Per-question correct labeling: encoding vs encryption."

assessed_artifact:
  type: flag
  description: FLAG captured after correct base conversions + correct encoding-vs-encryption distinction.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Computed values — student must compute, not be given:
  - "the binary of"
  - "the hex of"
  - "the ASCII for"
  - "the decimal is"
  - "the hex value is 0x"
  # The encoding-vs-encryption distinction is the Recognition grade —
  # don't spoon-feed:
  - "Base64 is not encryption"
  - "encoding is reversible without a key"
  - "encryption requires a key"

transfer_prompt: |
  You converted ASCII to binary and hex. A junior developer sees a
  Base64-encoded JWT token in production logs and says "Good, the
  password is encrypted." Walk through why that's wrong. What IS
  protecting the JWT (if anything), and how would you check whether
  the JWT contains any sensitive data that shouldn't be there in
  the first place?
