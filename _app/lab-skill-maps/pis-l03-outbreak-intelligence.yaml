# Skill Map for: PIS-L03 Outbreak Intelligence (OSINT + MITRE ATT&CK)
#
# Hypothesis-primary lab: student queries CVE database, maps MITRE
# ATT&CK techniques, pulls threat intelligence feed, and synthesizes
# into a coherent threat profile for a fictional pathogen scenario.
# Real CVE referenced: CVE-2024-3094 (XZ Utils backdoor).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l03-outbreak-intelligence
lab_name: PIS-L03 Outbreak Intelligence (OSINT + MITRE ATT&CK synthesis)

primary_skill:
  layer: Hypothesis
  description: Synthesizes CVE data, MITRE ATT&CK technique mappings, and threat-feed intelligence into a coherent threat profile + containment recommendation.
  evidence_required: Student files complete containment recommendation grounded in at least 2 mapped ATT&CK techniques.

secondary_skill:
  layer: Recognition
  description: Identifies which MITRE ATT&CK techniques apply to specific attacker behaviors observed in the OSINT data.
  evidence_required: Per-flag mapping at least 2 ATT&CK technique IDs to the scenario behaviors.

assessed_artifact:
  type: flag
  description: FLAG captured after successful OSINT correlation + ATT&CK mapping + containment recommendation.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # The graded synthesis is the ATT&CK technique mapping — never name
  # the specific techniques the lab is testing:
  - "the technique is T1195"
  - "the technique is T1059"
  - "T1078 is the right answer"
  - "T1021 covers this behavior"
  - "the answer is T1562"
  - "T1685 maps here"
  - "supply chain compromise is T1195"
  - "command and scripting interpreter is T1059"
  - "valid accounts is T1078"
  - "remote services is T1021"
  - "impair defenses is T1562"
  # Containment recommendation framing is graded — never produce it:
  - "the containment recommendation is"
  - "you should recommend"
  - "the correct containment is"
  # CVE specifics are part of the lookup — student must run the query:
  - "CVE-2024-3094 affects xz-utils"
  - "the XZ backdoor was discovered by"

transfer_prompt: |
  You mapped this scenario to specific ATT&CK techniques. Now: an
  organization tells you it has full MITRE ATT&CK technique coverage
  in its SOC detection rules, but a real-world breach using the same
  techniques you mapped went undetected for 60 days. What's the most
  likely failure mode — false negatives on the detection rules,
  missing telemetry sources, or rule fatigue from too many alerts?
  How would you investigate to distinguish between these?
