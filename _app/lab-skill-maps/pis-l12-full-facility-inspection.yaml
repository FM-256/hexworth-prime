# Skill Map for: PIS-L12 Full Facility Inspection (Capstone)
#
# Auditor-judgment capstone. Student runs read-only audits across
# five domains, documents findings, weighs them, and makes a
# defensible certification decision (certify or fail-facility).
# Transfer-primary — there is no pre-baked "right answer." The
# assessed artifact is the defensibility of the documented decision,
# not the decision itself.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l12-full-facility-inspection
lab_name: PIS-L12 Full Facility Inspection (Capstone audit)

primary_skill:
  layer: Transfer
  description: Synthesizes findings across five security domains into a defensible go/no-go certification decision; applies the auditor mindset (read-only, evidence-based, no shortcuts).
  evidence_required: Student documents findings across all five domains AND makes a certification decision (certify or fail-facility) whose defensibility maps cleanly to the findings recorded.

secondary_skill:
  layer: Recognition
  description: Distinguishes critical findings (block certification) from observations (note but proceed).
  evidence_required: Student's `finding` entries are correctly categorized; the certification decision aligns with whether critical findings remain unresolved.

assessed_artifact:
  type: flag
  description: FLAG awarded for a defensible certification decision backed by documented findings — passing OR failing the facility is a valid outcome if the evidence supports it.

# Capstone-level lab; allow up to Help Level 4 (working examples in
# adjacent domains) but NOT Help Level 5 (solution walkthrough). The
# decision itself is the grade — Dr. Hex must never make the call for
# the student.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # The certification decision is the graded artifact — never reveal:
  - "you should certify"
  - "you should fail the facility"
  - "the correct decision is certify"
  - "the correct decision is fail-facility"
  - "certify the facility"
  - "fail-facility is the answer"
  # Never enumerate the specific findings the lab presents — student
  # must derive them from the audit command outputs:
  - "the findings are"
  - "the critical findings include"
  - "the network has the following finding"
  - "the access control finding is"
  - "the crypto finding is"
  - "the IR readiness finding is"
  - "the policy finding is"
  # Never give the verdict logic away pre-derivation:
  - "if you have critical findings then fail"
  - "if all critical findings are resolved then certify"
  # Audit commands themselves — student must discover the command set
  # through the auditor mindset, not from a tutor:
  - "run `audit network"
  - "run `audit access"
  - "run `audit crypto"
  - "run `audit ir"
  - "run `audit policy"
  - "use `finding "
  - "use `certify"
  - "use `fail-facility"

transfer_prompt: |
  You made a certification decision. Now imagine the facility director
  contests your decision in writing and the regulator asks you to defend
  it. Walk through your reasoning: which findings drove the decision,
  why those findings were critical (not just observations), and what
  evidence in the audit logs supports each one. If a peer auditor
  reviewed your evidence and reached the opposite conclusion, what
  specifically would they have to disagree with you about — the
  evidence itself, the categorization, or the weighting?
