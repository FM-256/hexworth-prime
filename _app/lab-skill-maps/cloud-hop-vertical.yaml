# Skill Map for: Cloud Hop — Vertical (cloud house, arcade)
#
# Ascending platformer. The player climbs environment tiers — DEV, STAGING,
# PRODUCTION, GLOBAL SCALE, AUTONOMOUS — using abilities named for real services
# (Lambda Invoke, CloudFront Burst, S3 Glacier, WAF Protect, Route 53), and
# falls to real operational failure modes: lost endpoints, rate limiting with
# 429, expired certificates, cost spikes, surprise billing suspension.
#
# HONEST RISK ASSESSMENT: LOW, same as its sibling. Reflex performance is what
# is graded; the failure modes are taught by dying to them. There is no secret.
# The map exists so the help posture is deliberate rather than the fallback's
# uncapped [0..5], and so the transfer prompt gets asked.

lab_id: cloud-hop-vertical
lab_name: Cloud Hop — Vertical (environment promotion and operational failure modes)

primary_skill:
  layer: Recognition
  description: >-
    Recognises the characteristic failure mode of each environment tier and
    which class of control answers it — that a 429 is answered by backoff and
    quota work rather than by scaling, and that an expired certificate is an
    operational lifecycle failure rather than a capacity one.
  evidence_required: >-
    Student names the control that addresses a given failure and explains why a
    plausible-but-wrong control would not have helped.

assessed_artifact:
  type: written-explanation
  description: >-
    The game grades height reached and survival. The SKILL evidence is the
    student's mapping of failure mode to control, which the transfer prompt
    probes.

# Generous, as with cloud-hop: these concepts are taught by playing, and
# refusing to explain what a 429 means would be obstruction. Level 5 withheld so
# a bare "which button" request is refusable.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  # The only real withhold: naming the ability to press as the answer.
  # Explaining what any service DOES stays fully allowed.
  - "re:\\b(?:the answer|just|simply|you (?:should|need to))\\b[^.!?]{0,25}\\b(?:use|press|pick|hit)\\b[^.!?]{0,25}\\b(?:lambda|cloudfront|glacier|waf|route ?53)\\b"

transfer_prompt: |
  You climbed from DEV to production scale and something different killed you at
  each tier. Which of those failures would NOT have been caught by a staging
  environment no matter how carefully you tested there, and what does that tell
  you about which risks only production can reveal?
