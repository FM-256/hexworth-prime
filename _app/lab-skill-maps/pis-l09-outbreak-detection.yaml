# Skill Map for: PIS-L09 Outbreak Detection (SIEM triage)
#
# Recognition + Hypothesis lab: 227 SIEM alerts, 3 are real incidents.
# Student triages alerts, identifies the real threats, correlates
# evidence, and files formal incident reports with correct severity
# and classification.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l09-outbreak-detection
lab_name: PIS-L09 Outbreak Detection (SIEM alert triage)

primary_skill:
  layer: Recognition
  description: Distinguishes real incidents from false-positive noise in a high-volume SIEM stream by correlating contextual threat indicators.
  evidence_required: Student identifies exactly the 3 real incidents out of 227 SIEM alerts.

secondary_skill:
  layer: Hypothesis
  description: Synthesizes correlated evidence into a coherent incident hypothesis, then assigns correct severity + classification per the IR playbook.
  evidence_required: Filed incident reports match the lab's correct severity + classification grading.

assessed_artifact:
  type: flag
  description: FLAG captured after identifying the 3 real incidents + filing correct severity-classified reports for each.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Which alerts are real is the graded triage — never reveal:
  - "alert 47 is real"
  - "alert 113 is real"
  - "alert 198 is real"
  - "the three real incidents are alerts"
  - "the real alerts are"
  # Severity + classification per incident is the secondary grade:
  - "incident 1 severity is"
  - "incident 2 severity is"
  - "incident 3 severity is"
  - "classification is malware"
  - "classification is data exfiltration"
  - "classification is lateral movement"
  # The 224 false-positive alerts aren't worth enumerating — but if
  # they were, that would also be a graded distinction:
  - "alerts 1 through 30 are noise"
  - "the false positives are"

transfer_prompt: |
  You triaged 227 alerts and identified the 3 real ones. A real SOC
  sees roughly 11,000 alerts per analyst per day. The math doesn't
  work — you cannot manually triage every alert. Which three concrete
  techniques (technological or procedural) would bring the actual
  alert-load down to a manageable level WITHOUT increasing the rate
  of missed-real incidents? For each, explain the tradeoff that
  determines whether it's safe to deploy in production.
