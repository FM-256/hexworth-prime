# Skill Map for: key-ecc (Elliptic Curve Cryptography Lab)
#
# Hands-on ECC lab: explore point operations, key derivation, and
# ECDSA-style operations on small curves. Execution-primary with
# strong Hypothesis support (student must reason about why ECC offers
# equivalent security at smaller key sizes than RSA).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-ecc
lab_name: Elliptic Curve Cryptography Lab

primary_skill:
  layer: Execution
  description: Performs point operations on a small elliptic curve, derives ECC keys, and validates a signature.
  evidence_required: Student completes the point-addition, scalar-multiplication, and signature-verification tasks to capture the flag.

secondary_skill:
  layer: Hypothesis
  description: Reasons about WHY ECC achieves equivalent security to RSA at much smaller key sizes — articulates the discrete-log-on-elliptic-curve problem and its difficulty relative to integer factorization.
  evidence_required: Student's hypothesis about equivalent-security key sizes (e.g., ECC-256 ≈ RSA-3072) is correct in direction (smaller ECC) and in approximate magnitude.

assessed_artifact:
  type: flag
  description: FLAG captured after correct point operations + key derivation + signature operations.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Computed point values are the graded artifact — never reveal them:
  - "the point P + Q is"
  - "the result of scalar multiplication is"
  - "the public key point is"
  - "the signature value is"
  # Key-size equivalence is the Hypothesis-tier graded reasoning —
  # never spoon-feed the answer:
  - "ECC-256 is equivalent to RSA-3072"
  - "ECC-256 ≈ RSA-3072"
  - "RSA-3072 is roughly equivalent to ECC-256"
  - "ECC achieves the same security at smaller key sizes because"
  # The discrete-log framing is part of the Hypothesis assessment —
  # don't preview the exact wording:
  - "the discrete logarithm problem on elliptic curves is harder"
  - "elliptic curve discrete log is exponential while integer factorization is sub-exponential"

transfer_prompt: |
  You derived a public key from a private key via scalar multiplication
  on the curve. Now: a colleague says "ECC is just a smaller version
  of RSA — same math, fewer bits." Why is that wrong, technically?
  Where does the security come from in ECC that's different from RSA,
  and why does post-quantum cryptography (Shor's algorithm) threaten
  BOTH systems? What's the structural similarity that lets quantum
  computers attack both?
