# Skill Map for: PIS-L10 Dual-Integrity Access (LDAP + MFA + RBAC + 2-person)
#
# Execution + Recognition lab. Student builds the full
# authentication/authorization stack: LDAP OU structure, MFA enrollment,
# RBAC per BSL tier, with BSL-4 requiring two-person integrity
# (no single-analyst access).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l10-dual-integrity-access
lab_name: PIS-L10 Dual-Integrity Access (auth + authz + 2-person)

primary_skill:
  layer: Execution
  description: Configures LDAP directory + MFA + RBAC + 2-person integrity gate so authorization works correctly at each BSL tier with BSL-4 requiring dual-analyst presence.
  evidence_required: Working auth stack — analysts at the right tier can access; BSL-4 access requires 2 analysts present.

secondary_skill:
  layer: Recognition
  description: Distinguishes RBAC from ABAC + recognizes when two-person integrity is the appropriate control (highest-impact, non-reversible operations).
  evidence_required: Student's BSL tier assignments match the lab's correct organizational structure; BSL-4 dual-control is enforced (not just documented).

assessed_artifact:
  type: flag
  description: FLAG captured after auth stack is configured + all 4 BSL tiers test correctly + dual-control gates BSL-4.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # The correct OU structure is graded design — never reveal:
  - "the OU structure is"
  - "place analysts under OU="
  - "create OU=BSL"
  - "the LDAP base DN is"
  # Per-tier role assignments are the RBAC grade:
  - "assign Tier 0 to"
  - "assign Tier 1 to"
  - "BSL-4 admins are"
  - "the RBAC policy for BSL-4 is"
  # Two-person integrity implementation is the central skill — never
  # spoon-feed:
  - "use M-of-N for BSL-4"
  - "implement Shamir secret sharing"
  - "two-person control means"
  - "configure dual approval via"
  # Specific MFA tokens / enrollment values:
  - "the MFA secret is"
  - "TOTP seed is"

transfer_prompt: |
  You enforced 2-person integrity on BSL-4 access. A senior leader
  argues 'in an emergency, we need single-analyst BSL-4 access — the
  2-person rule will cost lives if one analyst is unreachable.' What
  is your response? Build the argument for keeping the 2-person rule
  with at most one named exception, OR build the argument for an
  emergency-bypass mode. Name the specific controls that make whichever
  position you take auditable + non-abusable.
