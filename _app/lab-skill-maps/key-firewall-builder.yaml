# Skill Map for: key-firewall-builder
#
# Execution-primary firewall design lab. Student builds iptables /
# stateful firewall rules to enforce a defined access policy (default-
# deny, explicit allowlist, port/IP restrictions, stateful tracking).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-firewall-builder
lab_name: Firewall Builder (iptables / stateful rules / default-deny)

primary_skill:
  layer: Execution
  description: Constructs a working firewall rule set that enforces a default-deny policy with explicit allows for required services, ordered correctly so packets traverse the rules predictably.
  evidence_required: Test traffic against the rule set — required services allowed, all other traffic dropped, no rule ordering exploits.

secondary_skill:
  layer: Recognition
  description: Distinguishes stateful (connection-tracked) from stateless rules and recognizes when each is appropriate; reads `iptables -L` output to verify policy.
  evidence_required: Student's rule set uses conntrack appropriately for established/related traffic.

assessed_artifact:
  type: flag
  description: FLAG captured after the rule set passes all positive (must-allow) and negative (must-deny) test traffic.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specific iptables invocations — student must compose:
  - "iptables -A INPUT -p tcp --dport"
  - "iptables -P INPUT DROP"
  - "the correct command is iptables"
  - "use -m conntrack --ctstate ESTABLISHED,RELATED"
  # Rule order is part of the Execution grade — never spoon-feed:
  - "put the deny rule last"
  - "the established-related rule goes first"
  - "the correct rule order is"
  # Specific ports/IPs that should be allowed — Recognition grade:
  - "allow port 22 from"
  - "allow port 443"
  - "block port 23"

transfer_prompt: |
  You built a default-deny firewall with explicit allows. Now: same
  host, but it's a DNS resolver serving 50,000 external clients. Your
  current default-deny + allow-established won't work because new
  UDP/53 queries arrive constantly from new client IPs. Walk through
  the rule design: how do you allow legitimate DNS-over-UDP from
  arbitrary new clients while still defending against DNS
  amplification abuse from spoofed source IPs? Name at least two
  specific controls beyond the firewall rule itself.
