# Skill Map for: PIS-L04 Injection Vector (web injection attacks CTF)
#
# Execution-primary lab: student exploits real injection patterns
# (SQL injection, XSS, command injection, LDAP injection, etc.) on
# a sandbox web application to capture flags. Maps to SY0-701 2.3
# (malicious activity) + 4.3 (analyze indicators).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l04-injection-vector
lab_name: PIS-L04 Injection Vector (web injection exploitation CTF)

primary_skill:
  layer: Execution
  description: Crafts working injection payloads against a sandbox web application across multiple injection classes (SQL, XSS, command, LDAP).
  evidence_required: Student successfully demonstrates exploit on each required injection class to advance through the lab.

secondary_skill:
  layer: Recognition
  description: Identifies the injection class from application behavior (error messages, time delays, response variations).
  evidence_required: Student correctly identifies which injection class applies BEFORE crafting the payload.

assessed_artifact:
  type: flag
  description: FLAG captured after successful exploitation across the required injection classes.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Working payloads are the graded artifact — never produce them:
  - "the payload is ' OR '1'='1"
  - "try ' OR 1=1 --"
  - "use UNION SELECT"
  - "the SQL payload is"
  - "<script>alert"
  - "the XSS payload is"
  - "the command injection is `;`"
  - "use && or ;"
  - "the LDAP filter is *)"
  # Discrimination logic between injection classes is graded recognition
  # — never spoon-feed:
  - "this is SQL injection because"
  - "this is XSS because"
  - "this is command injection because"
  - "the error message means SQL"
  - "the time delay means blind SQL"
  # Specific endpoint paths in the lab — student should explore:
  - "try /search?q="
  - "the vulnerable endpoint is /login"
  - "POST to /api/users with"

transfer_prompt: |
  You exploited a SQL injection in the lab sandbox. Now: a colleague
  says "the production app uses parameterized queries, so we're safe."
  Beyond confirming parameterized queries are used everywhere, what
  other defense-in-depth controls would you require to actually
  reduce SQL injection risk to acceptable levels? Name at least three
  controls and explain WHY parameterized queries alone are insufficient
  for a high-value application.
