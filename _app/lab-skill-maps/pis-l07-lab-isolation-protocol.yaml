# Skill Map for: PIS-L07 Lab Isolation Protocol (VLANs + ACLs + segmentation)
#
# Execution-primary network-segmentation lab. Contagion in Lab 3 →
# spreading through shared segments. Student creates 7 VLANs + ACL
# rules, verifies the compromised labs are isolated, AND verifies the
# clean labs retain connectivity. Three flags = correct segmentation +
# isolation verified + connectivity preserved.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l07-lab-isolation-protocol
lab_name: PIS-L07 Lab Isolation Protocol (network micro-segmentation)

primary_skill:
  layer: Execution
  description: Builds VLAN segmentation + ACL rules that isolate the compromised lab segments while preserving clean-lab connectivity.
  evidence_required: All 7 VLANs created + ACL rules enforce expected isolation + clean-lab connectivity preserved (3 flags).

secondary_skill:
  layer: Hypothesis
  description: Designs segmentation that meets BOTH constraints (block lateral movement AND maintain operational continuity) — the central tradeoff of micro-segmentation.
  evidence_required: Final config passes both negative (compromised labs blocked) and positive (clean labs connected) tests.

assessed_artifact:
  type: flag
  description: FLAG captured after VLAN + ACL config achieves the dual constraint.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specific VLAN numbering / ACL rule construction is the graded
  # Execution — never reveal:
  - "VLAN 10 should be"
  - "VLAN 20 should be"
  - "ACL rule"
  - "deny tcp from"
  - "permit ip from"
  - "the correct VLAN tag for Lab 3 is"
  - "the correct ACL is"
  # Compromise scope is the graded recognition — student must read the
  # lab brief to know which labs are compromised:
  - "Lab 3 and Lab 4 are compromised"
  - "the compromised labs are"
  # Specific subnet plan / routing tables:
  - "use 10.10.3.0/24 for"
  - "the gateway should be"

transfer_prompt: |
  You isolated 2 compromised labs from 5 clean ones using VLAN+ACL.
  Now: same incident, but the compromised labs need to KEEP TALKING
  to a shared diagnostic system in the clean network (read-only). How
  do you allow exactly that one channel through without re-opening
  the contagion path? Name the network-architecture pattern + the
  control(s) that enforce the asymmetry, and explain how you'd
  monitor for someone abusing the allowed channel.
