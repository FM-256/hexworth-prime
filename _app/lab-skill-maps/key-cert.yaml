# Skill Map for: key-cert (Certificate Operations Lab)
#
# Hands-on certificate operations: parse cert fields, walk chain of
# trust, identify validity. Execution-primary with Recognition support
# (student must identify Subject/Issuer/dates from the parsed output).
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-cert
lab_name: Certificate Operations Lab (parse + chain-of-trust + validity)

primary_skill:
  layer: Execution
  description: Parses certificate fields and walks the chain of trust from leaf to root, identifying any chain or validity failures.
  evidence_required: Student completes parse tasks AND chain-validation tasks AND validity-check tasks, then captures the flag.

secondary_skill:
  layer: Recognition
  description: Identifies certificate fields (Subject, Issuer, Not Before/Not After, key algorithm) from parsed output and recognizes when an issuer/subject mismatch breaks the chain.
  evidence_required: Per-task checkbox completions on Subject/Issuer/validity identification.

assessed_artifact:
  type: flag
  description: FLAG captured after successful parse + chain-validation + validity-check across the lab's certificate samples.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Cert field identification is the graded skill — never label the
  # specific field values for the student:
  - "the Subject is "
  - "the Issuer is "
  - "Not Before is "
  - "Not After is "
  - "the certificate is valid"
  - "the certificate is expired"
  - "the certificate is not yet valid"
  # Chain-of-trust verification is the graded judgment — never give
  # the chain verdict pre-derivation:
  - "the leaf's issuer matches the intermediate"
  - "the intermediate's issuer matches the root"
  - "the chain is valid"
  - "the chain is broken"
  - "the chain fails because"
  # The specific cert-parsing commands and how to invoke them must come
  # from the lab UI button, not from Dr. Hex:
  - "click Parse Certificate"
  - "press the Parse Certificate button"

transfer_prompt: |
  You verified a chain of trust by following the issuer→subject linkage
  from leaf to root. Now: an attacker manages to obtain a valid leaf
  certificate from a real CA for "login.bank-secure.com" (not
  bank.com). The chain to a trusted root is intact. Why does this still
  fail to compromise users who type "bank.com" into their browser —
  and what would the attacker need to do differently to succeed? What
  control catches this scenario before user impact?
