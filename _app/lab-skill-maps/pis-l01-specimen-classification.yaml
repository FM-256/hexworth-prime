# Skill Map for: PIS-L01 Specimen Classification (malware taxonomy CTF)
#
# Recognition-primary lab: student classifies six unknown malware
# specimens by type from behavior reports (RAT, virus, worm, trojan,
# ransomware, rootkit). Each correct classification advances the lab.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l01-specimen-classification
lab_name: PIS-L01 Specimen Classification (malware taxonomy CTF)

primary_skill:
  layer: Recognition
  description: Classifies malware specimens by type using behavioral evidence from analysis logs (RAT, virus, worm, trojan, ransomware, rootkit).
  evidence_required: Student files containment reports with correct classification for all 6 specimens to capture the flag.

secondary_skill:
  layer: Hypothesis
  description: Distinguishes between near-neighbor malware types (worm vs. virus, RAT vs. trojan, ransomware vs. wiper) by identifying the discriminating behavior in the log.
  evidence_required: Student's classification reasoning isolates the diagnostic behavior — not just the malware family name.

assessed_artifact:
  type: flag
  description: FLAG captured after correctly classifying all 6 specimens (SPX-001 through SPX-006).

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specimen-to-type mappings are the graded artifact — never reveal:
  - "SPX-001 is a RAT"
  - "SPX-002 is a virus"
  - "SPX-003 is a worm"
  - "SPX-004 is a trojan"
  - "SPX-005 is ransomware"
  - "SPX-006 is a rootkit"
  - "SPX-001 is "
  - "SPX-002 is "
  - "SPX-003 is "
  - "SPX-004 is "
  - "SPX-005 is "
  - "SPX-006 is "
  # The set of valid classification labels is part of the lab UI; once
  # the student sees the menu, Dr. Hex shouldn't pre-narrow it for them:
  - "the type is rootkit"
  - "classify as ransomware"
  - "classify as RAT"

transfer_prompt: |
  You classified a specimen as ransomware based on its file-encryption
  + ransom-note behavior. Imagine the same specimen also modifies the
  Master Boot Record so the system can't boot without the key. Is it
  still a ransomware classification, or does the MBR modification push
  it into a different category? What test would you use to decide —
  and why does the answer affect the containment response?
