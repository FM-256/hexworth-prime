# Skill Map for: key-pqc (Post-Quantum Cryptography Lab)
#
# Hypothesis + Execution lab: student works with NIST PQC finalized
# standards — ML-KEM (FIPS 203, formerly CRYSTALS-Kyber), ML-DSA
# (FIPS 204, formerly CRYSTALS-Dilithium), SLH-DSA (FIPS 205, formerly
# SPHINCS+). Reasons about Shor's algorithm threat + migration paths.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-pqc
lab_name: Post-Quantum Cryptography Lab (NIST PQC standards)

primary_skill:
  layer: Execution
  description: Performs key encapsulation with ML-KEM + digital signature with ML-DSA or SLH-DSA + integrates a hybrid construction (classical + PQC) for the transition period.
  evidence_required: All three primitives produce correct outputs + hybrid construction validates correctly.

secondary_skill:
  layer: Hypothesis
  description: Reasons about Shor's algorithm threat to RSA/DH/ECC + harvest-now-decrypt-later risk model + when to deploy PQC vs hybrid.
  evidence_required: Student articulates which classical algorithms break under quantum attack + justifies a migration timeline for data with long confidentiality lifetimes.

assessed_artifact:
  type: flag
  description: FLAG captured after correct operations + defensible migration argument.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Specific keypair / ciphertext values — student must compute:
  - "the ML-KEM public key is"
  - "the ML-DSA signature is"
  - "the SLH-DSA hash signature is"
  - "the encapsulated key is"
  - "the shared secret is 0x"
  # Algorithm-to-classical-replacement mapping is part of Recognition —
  # don't spoon-feed:
  - "ML-KEM replaces RSA"
  - "ML-DSA replaces ECDSA"
  - "SLH-DSA replaces"
  - "use ML-KEM for key exchange"
  # Migration timeline is graded Hypothesis:
  - "migrate within 2030"
  - "the migration deadline is"
  - "harvest-now-decrypt-later means we need PQC by"

transfer_prompt: |
  You've worked with the three NIST PQC finalized standards. Now: an
  organization with 7-year-confidentiality data on legacy RSA-2048
  cipher suites asks you for a migration plan. Walk through the
  decision tree: (1) what's the actual quantum-computer threat
  timeline per current NIST guidance, (2) what's the hybrid-mode
  rationale during transition, (3) which PQC algorithm slots where
  in their stack, (4) what's the rollback path if a PQC algorithm
  is broken by classical cryptanalysis post-deployment? At least
  three of the four must be specific, not generic.
