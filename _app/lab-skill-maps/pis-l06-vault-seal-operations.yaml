# Skill Map for: PIS-L06 Vault Seal Operations (AES + RSA + SHA-256)
#
# Execution-primary cryptography lab: 3 graded operations on real
# crypto primitives — AES-256-CBC encrypt, RSA decrypt, SHA-256
# integrity verification + tampered-file identification.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l06-vault-seal-operations
lab_name: PIS-L06 Vault Seal Operations (symmetric + asymmetric + hash)

primary_skill:
  layer: Execution
  description: Performs three real crypto operations end-to-end — AES-256-CBC encryption of a specimen file, RSA decryption of an intercepted communication, SHA-256 hash verification across a manifest.
  evidence_required: All 3 operations succeed AND the tampered manifest file is correctly identified by hash mismatch.

secondary_skill:
  layer: Recognition
  description: Distinguishes which primitive applies per task — symmetric for data-at-rest, asymmetric for confidential communication, hash for integrity.
  evidence_required: Student selects the correct crypto operation for each of the 3 tasks without trial-and-error.

assessed_artifact:
  type: flag
  description: FLAG captured after successful encryption + decryption + tamper detection.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Which file is tampered is the graded SHA-256 judgment — never reveal:
  - "the tampered file is"
  - "specimen-1.dat is tampered"
  - "specimen-2.dat is tampered"
  - "specimen-3.dat is tampered"
  - "manifest entry 1 doesn't match"
  - "manifest entry 2 doesn't match"
  - "manifest entry 3 doesn't match"
  # Specific keys / IVs / private-key content — these are sandbox values
  # but Dr. Hex should not leak them:
  - "the AES key is"
  - "the IV is"
  - "the RSA private key is"
  - "the vault key value is"
  # Crypto primitive selection is part of the Recognition grade —
  # never spoon-feed which primitive to use:
  - "use AES for the specimen file"
  - "use RSA for the intercepted comms"
  - "use SHA-256 for the manifest"

transfer_prompt: |
  You used AES for data-at-rest, RSA for the intercepted comms, and
  SHA-256 for tamper detection. Now: imagine the same scenario but
  the intercepted comms file is 4 GB instead of 4 KB. Can you still
  use RSA the way you did? Why or why not — and what's the actual
  protocol/pattern real-world systems use (TLS, S/MIME, etc.) to
  encrypt large payloads securely? Name the construction and explain
  why it's needed.
