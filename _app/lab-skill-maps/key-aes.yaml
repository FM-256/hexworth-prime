# Skill Map for: Key House — AES Encryption Lab
#
# Symmetric-encryption lab. Student encrypts and decrypts files using AES
# with openssl. The lab is Recognition-primary (knowing when AES is the
# right choice + recognizing block-cipher mode implications) with
# Execution as secondary (correct openssl invocation).

lab_id: key-aes
lab_name: Key House — AES Encryption

primary_skill:
  layer: Recognition
  description: Identifies AES as appropriate symmetric cipher and recognizes when ECB vs CBC vs GCM matters.
  evidence_required: Student can explain why their chosen mode is appropriate for the lab's threat model.

secondary_skill:
  layer: Execution
  description: Uses openssl to encrypt and decrypt files with a chosen mode and verifies round-trip integrity.
  evidence_required: Student produces a correctly-encrypted ciphertext that decrypts back to plaintext.

assessed_artifact:
  type: command
  description: The graded artifact is the openssl invocation the student lands on AND a brief written rationale.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4   # Recognition-primary labs allow Level 4 because the assessment is the rationale, not the syntax discovery

forbidden_disclosures:
  - "openssl enc -aes-256-cbc"     # exact graded command shape
  - "openssl enc -aes-256-gcm"
  - "the answer is ECB is wrong"   # leaks the rationale gradient

transfer_prompt: |
  Where in a real system would the choice you just made matter — disk encryption, session keys, or both — and what specific failure would result from choosing the wrong mode?
