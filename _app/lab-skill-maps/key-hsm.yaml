# Skill Map for: key-hsm (HSM + Key Management)
#
# Hypothesis + Recognition lab. Student designs the key hierarchy
# for SecureShop (100K transactions/day e-commerce): Customer PII,
# payment card data (PCI DSS), order history, auth tokens. Decisions
# on Software KMS vs Dedicated HSM (FIPS 140-3 L3) vs Cloud HSM,
# KEK strategy.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-hsm
lab_name: HSM & Key Management Lab

primary_skill:
  layer: Hypothesis
  description: Designs a defensible key hierarchy + HSM strategy for a realistic e-commerce scenario, picking Software KMS vs Dedicated HSM vs Cloud HSM per data class.
  evidence_required: Per-data-class choice (PII / PCI cardholder / order / token) matches the lab's correct rubric (e.g., PCI requires dedicated HSM FIPS 140-3 L3, not Software KMS).

secondary_skill:
  layer: Recognition
  description: Recognizes the threat-model differences between Software KMS (in-process keys), Cloud HSM (vendor-managed, multi-tenant), and Dedicated HSM (physically isolated).
  evidence_required: Student articulates which threat class each HSM tier defends against (insider abuse, cloud vendor compromise, physical tamper).

assessed_artifact:
  type: flag
  description: FLAG captured after defensible per-data-class HSM strategy + correct KEK hierarchy.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Per-data-class HSM choice is the Hypothesis grade — never spoon-feed:
  - "use a dedicated HSM for PCI"
  - "use Software KMS for"
  - "Cloud HSM is right for"
  - "PII goes in"
  # KEK / DEK hierarchy structure is graded design:
  - "the KEK hierarchy is"
  - "wrap DEKs under KEK"
  - "rotate the KEK every"
  # PCI DSS specific requirements that drive choices:
  - "PCI DSS Requirement 3.5 says"
  - "PCI requires FIPS 140-3 L3 because"

transfer_prompt: |
  You designed a key hierarchy for SecureShop. Now: a startup founder
  argues "we're small — we'll just use AWS KMS for everything,
  including cardholder data. AWS is PCI compliant, so we are." What's
  wrong with that reasoning? Name the specific PCI DSS requirement
  that AWS KMS satisfies vs. doesn't satisfy + explain what
  'shared responsibility model' means here. Then say what the
  founder COULD do to legitimately use AWS for cardholder data
  WITHOUT a dedicated HSM (hint: the magic word starts with 't').
