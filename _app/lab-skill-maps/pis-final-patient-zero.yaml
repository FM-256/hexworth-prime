# Transfer prompt — what Dr. Hex asks at end-of-lab debriefs (or when
# the student is clearly done with one phase and ready to reflect)
# to probe whether the IR-framework skill TRANSFERS to a novel scenario.
transfer_prompt: |
  Next quarter your SOC sees a similar wire-fraud incident, but the attacker uses a DIFFERENT exploited CVE, a DIFFERENT C2 host (one of the major cloud providers, not bulletproof hosting), and a DIFFERENT lookalike-domain naming convention. Walk me through which phase of the IR workflow you'd execute FIRST and why. What evidence from the email headers would tell you which TOOL to pivot to next, and what would you do DIFFERENTLY than in this lab?

# Phase-aware hint scaffold — WIRED 2026-06-08 (#83).
# skill_map_loader.py now parses this field into PhaseScaffold dataclasses.
# main.compose_system_prompt injects the matching scaffold as a STUDENT
# CONTEXT line when the request supplies `phase_id` AND the active
# help_level >= 3 AND this lab's allowed_help_levels includes 3 or higher.
# Without phase_id telemetry from the frontend, scaffolds remain inert.
#
# Each entry is a Help-Level-3 scaffold (the method, not the answer).
# Phase_5 in particular still warrants a separate adversarial pass —
# it walks through the DNS→C2→auth filter sequence at a granularity
# that is L3 in lab vocabulary but L4 in practice given the small
# candidate set. Operator gate: when the frontend starts emitting
# phase_id=phase_5 telemetry, run Karl + Nancy on the live system
# prompt before broad rollout.
phase_scaffolds:
  phase_1:
    name: Inbox Triage
    hint: |
      The Outlook inbox has 13 messages. The active phish is the ONE whose headers fail authentication AND has a Reply-To mismatch AND a Message-ID host that doesn't match the From domain. Look at all three fields together — any single one alone might be a red herring.
  phase_2:
    name: Payload ID
    hint: |
      Download the suspicious attachment from the phish, hash it with sha256sum, look up the hash on VirusTotal Mirror. The result names both the malware family AND the CVE. Phase 2's flag combines them as FAMILY:CVE-YYYY-NNNNN.
  phase_3:
    name: DNS + PKI Forensics
    hint: |
      The lookalike domain's HTTPS cert reuses one cert across the attacker's domain stable. Pull the cert and read the SAN list: run openssl s_client -connect <host>:443 -showcerts AS A SEPARATE COMMAND, then run openssl x509 -noout -text AS A SEPARATE COMMAND. The simulator now supports shell pipes, but the two-command form is also the standard simulator pattern. The SAN list contains the canonical C2 domain — it has a distinctive prefix that signals dynamic-DNS abuse.
  phase_4:
    name: Attribution + Geolocation
    hint: |
      Query Threat Intel Mirror with the C2 domain. Multiple actors will return with partial TTP overlap. Use the disambiguator on the 4/4-match card to narrow to ONE. The IP geolocation answer is NOT the same as the actor-origin answer — read the HexIntel enrichment note on the IP geo result, not just the ASN country.
  phase_5:
    name: SIEM Correlation
    hint: |
      This phase tests a different skill than the previous phases — instead of digging deeper into one tool, you're correlating evidence across multiple log surfaces. Step back: not all logs prove the same thing about a host's state. A phishing link can be clicked without execution. A foreign-looking login can have a legitimate operational reason. The judgment work at this phase is reading what the SIEM has actually logged about each candidate's activity and weighing it. Whose activity has an explanation that holds up, and whose does not?
  phase_6:
    name: Containment + Remediation
    hint: |
      Three sub-actions, all required:
      (a) Apply the CVE from Phase 2 — NOT the other two outstanding CVEs on the host. Wrong patches cost -40 each.
      (b) Validate with the Rapid7 InsightVM scan. It returns a scan ID when CLEAN.
      (c) Configure a mail filter on the attacker pattern. The Reply-To domain or the Message-ID host are correct scopes. A subject keyword or TLD wildcard is too broad and gets rejected.
      The composite flag assembles from these three artifacts. The lab reveals it in WHICHEVER tool you complete the last sub-action in — you don't need to navigate back.
  phase_7:
    name: Synthesis
    hint: |
      The synthesis flag is SHA-256(flag1|flag2|flag3|flag4|flag5|flag6).hex().upper()[:16]. If you correctly captured Flag 6, the lab reveals Flag 7 in the same panel — submit it directly. Or compute it yourself in the lab terminal using:
        echo -n "<flag1>|<flag2>|<flag3>|<flag4>|<flag5>|<flag6>" | sha256sum | awk '{print toupper(substr($1,1,16))}'
      The terminal supports pipes + has a pure-JS sha256sum + minimal awk for the synthesis-formula pattern.
