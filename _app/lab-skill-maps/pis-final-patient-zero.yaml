# Skill Map for: Shield House — PIS Final Practical: Patient Zero (Eclipse Tier)
#
# Capstone IR investigation. Student walks a $4.2M wire-fraud breach
# from inbox triage through containment + remediation, capturing 7
# flags across 7 phases:
#   1. Inbox triage             — identify the real phish among 13 messages
#   2. Payload ID               — hash attachment, identify malware family + CVE
#   3. DNS + PKI forensics      — derive C2 from cert SAN list
#   4. Attribution + geo        — name the APT and reconcile actor-origin
#   5. SIEM correlation         — identify Patient Zero from DNS + auth logs
#   6. Containment + remediation — patch + scan + filter (3-action composite)
#   7. Synthesis                 — SHA-256 of prior flags (deterministic)
#
# Transfer-primary with Hypothesis as secondary: the student demonstrates
# IR-framework application through flag captures, but every phase has
# DECOYS (5 decoy emails, 2 decoy CVEs, 5 below-threshold APT profiles,
# 2 explained-anomaly users, 1 benign attachment). Generating + ruling
# out hypotheses is the load-bearing skill at each phase.
#
# Eclipse difficulty: hint penalty doubles (75 -> 150 per hint), wrong
# flag costs -40, score floors at 0. Dr. Hex must NOT obviate the
# challenge by leaking flag values or naming the canonical attacker
# elements directly.

lab_id: pis-final-patient-zero
lab_name: "Shield House — PIS Final Practical: Patient Zero (Eclipse)"

primary_skill:
  layer: Transfer
  description: |
    Applies an incident-response framework (identify -> analyze -> contain -> remediate -> synthesize) to an unfamiliar breach, using real-world-styled IR tools (Outlook, VirusTotal, NVD, WHOIS, IP geolocation, Mandiant-style threat intel, Splunk-style SIEM, Microsoft SCCM patch management, Rapid7 InsightVM, Proofpoint mail filter). Each tool's chrome mirrors a real product so the methodology transfers to a workplace SOC seat.
  evidence_required: |
    Six phase-specific flags captured in order (one per investigative phase) + one synthesis flag derived from the prior six. Wrong submissions cost -40 each. The synthesis flag is deterministic from correct prior flags, so getting Flag 7 right is itself evidence that all six prior phases were correctly executed.

secondary_skill:
  layer: Hypothesis
  description: |
    Generates plausible attacker hypotheses at each phase and rules out the wrong ones via tool evidence. The lab is dense with decoys: 5 phishing-decoy emails (msg/2, msg/3, msg/9, msg/11, msg/13) that have surface red flags but are NOT the active phish; 2 decoy CVEs (CVE-2024-21412, CVE-2024-26169) outstanding on the same host; 5 below-threshold APT profiles (CRIMSONTIDE, BLACKHELIX, IRONHAVEN, NORTHGALE, DESERTKITE) with partial-or-zero TTP overlap; 2 employees (r.chen, s.patel) whose foreign-IP logins look anomalous but are explained by HR records. Each phase requires the student to NAME the candidate hypotheses and rule them out with evidence, not just pick the right answer first try.
  evidence_required: |
    Student avoids wrong-flag submissions (which would prove failure to rule out decoys); also visible in the SIEM workflow where the student correctly distinguishes UNEXPLAINED vs EXPLAINED anomalies before identifying Patient Zero.

assessed_artifact:
  type: flag
  description: |
    7 flags submitted in order via the Submit Flag panel. Each flag is graded server-side by the lab engine. Final score = (250 base/phase) * 6 phases + 250 for synthesis = up to 1500 base, capped at 750 max (Eclipse), with hint penalties subtracted and a floor at 0.

# Eclipse capstone — Dr. Hex must NOT cross into spoiler territory.
# Levels capped at 3 (scaffolding the method, NOT giving the answer).
# Help Level 4 (showing a similar concrete answer) would essentially leak
# the phase's flag because the lab has only one canonical right answer
# per phase; Help Level 5 (showing the actual answer) is prohibited.
#
# ENFORCEMENT NOTE: This list is currently DESCRIPTIVE metadata — the
# orchestrator's resolve_help_level() in help_levels.py does NOT yet
# read allowed_help_levels to cap the resolved level. The student-side
# cap is the global L4 ceiling (helper-promoted from L2/L3 after repeated
# failed attempts). When orchestrator gains per-lab cap enforcement,
# this list becomes load-bearing.
allowed_help_levels:
  - 0   # Clarifying questions ("which phase are you on?", "what have you tried?")
  - 1   # Socratic prompting ("which header field would tell you if the sender is impersonated?")
  - 2   # Point toward where to look ("the Message-ID host should match the From domain — check that comparison")
  - 3   # Scaffold the method ("for phase 3, you need s_client first, then x509 — separate commands; the simulator doesn't pipe")

