# Skill Map for: PIS-L11 Containment Breach
#
# Incident-response CTF lab. Student executes NIST SP 800-61r3 IR
# lifecycle in correct order — Detection → Containment → Eradication
# → Recovery → Lessons Learned — with forensic preservation gated
# BEFORE eradication. Order is the test. Skipping evidence preservation
# is a designed trap; the lab fails defensibility check if so.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: pis-l11-containment-breach
lab_name: PIS-L11 Containment Breach (NIST 800-61r3 IR lifecycle CTF)

primary_skill:
  layer: Execution
  description: Executes the NIST IR phases in the correct order with forensic preservation gated before eradication.
  evidence_required: Student captures the flag, which requires correct phase ordering AND evidence preservation step completed before eradication.

secondary_skill:
  layer: Transfer
  description: Articulates WHY the phase order matters — both for operational integrity (don't reinfect by recovering before eradication) and legal defensibility (don't destroy evidence by eradicating before imaging).
  evidence_required: Student's root-cause analysis explains the maintenance-window-failure → containment-breach causal chain (not just what was breached).

assessed_artifact:
  type: flag
  description: FLAG captured at end of correct IR lifecycle execution with documented chain of custody.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

# Lab-specific forbidden disclosures. Dr. Hex must NEVER reveal:
forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  # Phase ordering is the graded skill — never reveal the sequence:
  - "the correct order is detection"
  - "first run detection then"
  - "containment comes before"
  - "eradication comes after"
  # Forensic preservation is the designed trap — never reveal that
  # it must precede eradication (student must derive this from "order matters
  # for legal defensibility"):
  - "preserve evidence before eradication"
  - "image the disk before"
  - "chain of custody must be filed before"
  # Specific commands that ARE the graded action:
  - "run `status`"
  - "execute `contain"
  - "type `eradicate"
  - "use `image"
  - "the command is `recover"
  # The root-cause framing is the Transfer assessment — never give it
  # away pre-derivation:
  - "the root cause is the maintenance window"
  - "the maintenance window left network isolation inactive"

transfer_prompt: |
  You executed the IR phases in order. Now: a colleague says "let's just
  eradicate first to stop the spread, then image afterward." What's wrong
  with that — both operationally and legally? Explain what specifically
  breaks (which lab outcome flips from success to failure) and which
  professional standard or law your reasoning anchors in.
