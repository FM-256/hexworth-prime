# Skill Map for: API Foundations Lab (cloud house)
#
# Interactive REST lab. The student is given a scenario and must choose the
# correct HTTP method (GET / POST / PUT / PATCH / DELETE) and reason about
# idempotency, safety and status codes. The graded answers are literal tokens
# held in the page as `answer: 'GET'` and so on.
#
# Disclosure risk is MEDIUM and unusually concrete: unlike a reasoning verdict,
# the answer here is a single word from a five-item set, so a student can get it
# by asking almost any question that mentions the scenario. The forbidden list
# is therefore about not naming a verb AS the answer to a described scenario —
# while leaving Dr. Hex completely free to explain what each verb means, which
# is exactly the teaching this lab wants.

lab_id: cloud-api-foundations-lab
lab_name: API Foundations Lab (REST methods, idempotency, status codes)

primary_skill:
  layer: Recognition
  description: >-
    Recognises which HTTP method a described operation calls for, from the
    semantics of the operation rather than from habit — in particular telling
    PUT from PATCH, and safe from idempotent.
  evidence_required: >-
    Student selects the correct method and can justify it by the operation's
    semantics, not by "that is what we always use".

secondary_skill:
  layer: Execution
  description: >-
    Chooses a status code consistent with the method and outcome, including the
    difference between 200, 201, 204 and 404.
  evidence_required: >-
    Student's chosen status code matches what the operation actually did.

assessed_artifact:
  type: command
  description: >-
    The graded artifact is the HTTP method (and where asked, the status code)
    the student selects for each scenario.

# Level 4 withheld: with a five-item answer set, a Level 4 hint is the answer.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3

forbidden_disclosures:
  # A verb named AS the answer, in either order. Explaining what a verb DOES is
  # untouched by these — they require answer-framing, not the verb alone.
  - "re:\\b(?:the answer|the correct method|the right method|you (?:should|want|need to) use|use)\\b[^.!?]{0,30}\\b(?:GET|POST|PUT|PATCH|DELETE)\\b"
  - "re:\\b(?:GET|POST|PUT|PATCH|DELETE)\\b[^.!?]{0,30}\\bis (?:the )?(?:answer|correct|right one|what you want)\\b"
  # Status code handed over as the answer.
  - "re:\\b(?:the answer|the correct (?:status|code)|should return)\\b[^.!?]{0,25}\\b(?:200|201|204|400|404|409|500)\\b"
  # NOTE: best-effort, same caveat as every map here. The real constraint is the
  # capped help levels. A determined paraphrase gets through.

transfer_prompt: |
  You picked a method based on what the operation does to the resource. Now the
  same endpoint has to survive a client that retries automatically on timeout.
  Which of the methods you have used would be dangerous under blind retry, and
  what would you change about the request or the server to make the operation
  safe to repeat?
