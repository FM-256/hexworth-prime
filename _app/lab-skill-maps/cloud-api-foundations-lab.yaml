# Skill Map for: API Foundations Lab (cloud house)
#
# Interactive REST lab. The student is given a scenario and must choose the
# correct HTTP method (GET / POST / PUT / PATCH / DELETE) and reason about
# idempotency, safety and status codes. The graded answers are literal tokens
# held in the page as `answer: 'GET'` and so on.
#
# Disclosure risk is MEDIUM and unusually concrete: unlike a reasoning verdict,
# the answer here is a single word from a five-item set, so a student can get it
# by asking almost any question that mentions the scenario. The forbidden list
# is therefore about not naming a verb AS the answer to a described scenario —
# while leaving Dr. Hex completely free to explain what each verb means, which
# is exactly the teaching this lab wants.

lab_id: cloud-api-foundations-lab
lab_name: API Foundations Lab (REST methods, idempotency, status codes)

primary_skill:
  layer: Recognition
  description: >-
    Recognises which HTTP method a described operation calls for, from the
    semantics of the operation rather than from habit — in particular telling
    PUT from PATCH, and safe from idempotent.
  evidence_required: >-
    Student selects the correct method and can justify it by the operation's
    semantics, not by "that is what we always use".

secondary_skill:
  layer: Execution
  description: >-
    Chooses a status code consistent with the method and outcome, including the
    difference between 200, 201, 204 and 404.
  evidence_required: >-
    Student's chosen status code matches what the operation actually did.

assessed_artifact:
  type: command
  description: >-
    The graded artifact is the HTTP method (and where asked, the status code)
    the student selects for each scenario.

# Level 4 withheld: with a five-item answer set, a Level 4 hint is the answer.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3

forbidden_disclosures:
  # HIGH-PRECISION ONLY, same reasoning as cloud-ad-attack-path.yaml.
  #
  # The broad framing class is GONE. It refused ordinary REST teaching that this
  # lab exists to deliver, including the answer to its OWN transfer prompt:
  #   "Use GET to retrieve data without side effects."          <- was blocked
  #   "If you want to update just one field, use PATCH."        <- was blocked
  #   "You should use idempotency keys with PATCH to make
  #    retries safe."                                            <- was blocked,
  #        and that sentence is a correct answer to this file's transfer_prompt.
  #
  # What remains fires only on explicit answer declaration, or on a reply that
  # IS the answer — which for a five-item answer set is the highest-value leak
  # and the one the old framing patterns missed entirely ("PATCH.", "Use PATCH.",
  # "Answer: PATCH"). Those are anchored to the whole reply, so they cannot fire
  # on a method name mentioned inside an explanation.
  #
  # A paraphrased handover still gets through. Accepted and stated. The real
  # constraint is allowed_help_levels capped at 3.
  - "re:\\b(?:the answer is|the correct (?:method|verb|answer) is|the right method is)\\b[^.!?]{0,15}\\b(?:GET|POST|PUT|PATCH|DELETE)\\b"
  - "re:\\b(?:GET|POST|PUT|PATCH|DELETE)\\b[^.!?]{0,15}\\bis the (?:answer|correct (?:one|method)|right one)\\b"
  - "re:\\b(?:the answer is|the correct (?:status|code) is)\\b[^.!?]{0,12}\\b(?:200|201|204|400|404|409|500)\\b"
  - "re:^\\W*(?:use\\s+|it'?s\\s+|answer\\s*:\\s*|the answer\\s*:\\s*|go\\s+with\\s+)?(?:GET|POST|PUT|PATCH|DELETE)\\W*$"
  - "re:^\\W*(?:use\\s+|it'?s\\s+|answer\\s*:\\s*)?(?:200|201|204|400|404|409|500)\\W*$"

# SEMANTIC GUARD — see cloud-ad-attack-path.yaml for the rationale.
semantic_guard:
  answer_summary: >-
    Each scenario has one correct HTTP method from GET, POST, PUT, PATCH or
    DELETE (and sometimes one correct status code such as 200, 201, 204 or
    404). Naming the specific method or status code that the described scenario
    calls for is the answer. Explaining what the methods mean, comparing them,
    or discussing idempotency in general is NOT the answer.
  trigger_terms:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - "200"
    - "201"
    - "204"
    - "400"
    - "404"
    - "409"
    - "500"

transfer_prompt: |
  You picked a method based on what the operation does to the resource. Now the
  same endpoint has to survive a client that retries automatically on timeout.
  Which of the methods you have used would be dangerous under blind retry, and
  what would you change about the request or the server to make the operation
  safe to repeat?
