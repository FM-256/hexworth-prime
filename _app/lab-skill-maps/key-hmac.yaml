# Skill Map for: key-hmac (HMAC hands-on)
#
# Execution lab: student builds + verifies HMAC with various hash
# functions, tests timing attacks, applies HMAC to API request
# signing / JWT signatures / cookie tamper protection.
#
# Promotion source: tools/generate_skill_map_drafts.py heuristic draft
# refined 2026-05-26 with lab-specific forbidden_disclosures.

lab_id: key-hmac
lab_name: HMAC Hands-On Lab

primary_skill:
  layer: Execution
  description: Builds + verifies HMAC tags correctly + uses timing-safe comparison + applies HMAC to a realistic auth/integrity scenario (signed request, signed cookie).
  evidence_required: HMAC tags match test vectors + timing-safe comparison demonstrated + signed-request flow works end-to-end.

secondary_skill:
  layer: Hypothesis
  description: Reasons about why plain hash is insufficient for authentication (length-extension attacks, no shared secret) and what HMAC adds.
  evidence_required: Student articulates the length-extension attack class + explains how HMAC's nested construction prevents it.

assessed_artifact:
  type: flag
  description: FLAG captured after HMAC operations + timing-safe verification + scenario walkthrough.

allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  - "the flag is FLAG{"
  - "the answer is FLAG{"
  - "the solution is FLAG{"
  - "the HMAC value is 0x"
  - "the HMAC-SHA256 output is"
  # Timing-attack details — Recognition grade:
  - "use hmac.compare_digest"
  - "the timing-safe comparison is"
  - "non-constant-time comparison leaks"
  # Length-extension attack mechanism is graded Hypothesis:
  - "length-extension works by"
  - "HMAC prevents length-extension because"
  - "the inner pad is opad and ipad"
  # Specific HMAC key value used in the lab:
  - "the HMAC key is"
  - "the shared secret is"

transfer_prompt: |
  You verified HMAC tags with timing-safe comparison. A junior
  developer suggests "just use SHA-256(secret + message) — it's
  faster than HMAC and we don't need the extra construction." What
  is your response? Name the specific attack their proposal enables
  (it has a name) and walk through ONE concrete exploit step. Then
  state which standard HMAC construction breaks the attack and why.
