# Skill Map for: Cloud Hop (cloud house, arcade)
#
# Side-scrolling platformer. A "cost avalanche" chases the player and never
# stops; abilities correspond to real FinOps levers (Savings Plans and Spot
# lower the ongoing rate, waste removal reclaims ground, monitoring gives early
# warning without changing cost). Between runs it teaches concrete billing
# facts, e.g. "an Application Load Balancer bills by the hour whether or not it
# has a single healthy target behind it."
#
# HONEST RISK ASSESSMENT: LOW, and this map does not pretend otherwise. The
# graded thing is reflex performance, and the billing facts are DELIVERED by the
# game rather than withheld by it — there is no secret for Dr. Hex to leak, and
# a student who asks "what does a Savings Plan do" should simply be told.
#
# So why author a map at all? Because without one the linter falls back to
# allowed_help_levels [0,1,2,3,4,5] — the full set including direct answers —
# and flag_values []. A map here is mostly about making the help posture a
# DECISION rather than an accident. The forbidden list is deliberately short and
# targets only the one thing worth withholding: which lever to pull, before the
# student has reasoned about why.

lab_id: cloud-hop
lab_name: Cloud Hop (cloud cost control under pressure)

primary_skill:
  layer: Recognition
  description: >-
    Distinguishes cloud actions that reduce the ONGOING RATE (Savings Plans,
    Spot, rightsizing) from actions that only reclaim a one-off amount or merely
    improve visibility — the difference between slowing the avalanche and
    stepping out of its way once.
  evidence_required: >-
    Student can say which of two plausible cost actions changes the run rate and
    which does not.

assessed_artifact:
  type: written-explanation
  description: >-
    The game itself grades reflex performance and distance survived. The SKILL
    evidence is the student's account of which lever changed the rate and why,
    which is what the transfer prompt probes.

# Generous on purpose. This is a low-stakes arcade game whose concepts are
# taught by playing it; refusing a student a straight explanation of Spot
# pricing would be obstruction, not pedagogy. Level 5 is still withheld so
# "just tell me which one to press" is refusable.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3
  - 4

forbidden_disclosures:
  # Only real withhold: naming the lever as the answer before the student has
  # reasoned. Explaining what any lever DOES stays fully allowed.
  - "re:\\b(?:the answer|just|simply|you (?:should|need to))\\b[^.!?]{0,25}\\b(?:use|pick|buy|switch to)\\b[^.!?]{0,20}\\b(?:savings plan|spot)\\b"

transfer_prompt: |
  You lowered a run rate under time pressure. Back in a real account, your
  finance team asks why last month's bill did not drop even though you deleted a
  large amount of unused infrastructure. What kinds of cost would survive that
  deletion untouched, and which lever would you have had to pull instead?
