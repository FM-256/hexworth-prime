# Skill Map for: Linux Practice Sandbox (Observatory)
#
# A disposable Ubuntu box where the learner runs REAL shell commands. The graded
# artifact is the 5 hexpractice challenges, verified server-side by the lab-manager
# /check endpoint. Dr. Hex CANNOT see the terminal (cross-origin ttyd iframe); his
# only ground truth about learner progress is the per-task pass/fail returned by the
# sandbox_task_state tool. This is an Execution-syntax lab: the exact command IS the
# answer, so the graded one-liners stay in forbidden_disclosures and Help is capped at
# Level 2 (name the command and explain its flags, never paste the graded line).

lab_id: linux-sandbox
lab_name: Linux Practice Sandbox

primary_skill:
  layer: Execution
  description: >-
    Performs core Linux CLI operations at a terminal: creating files and directories,
    output redirection, file permissions (octal chmod), text filtering with grep, and
    initializing a git repository with a first commit.
  evidence_required: >-
    Learner completes all five hexpractice challenges, each confirmed by the server-side
    grader (file contents, executable bit, permission mode, grep output, and a git commit).

secondary_skill:
  layer: Recognition
  description: >-
    Recognizes which command and option fits a stated goal ("make this private" -> chmod
    600; "keep only the error lines" -> grep plus redirection) rather than memorizing a
    fixed sequence.
  evidence_required: >-
    Learner can state, in plain terms, why a chosen command achieves the task before
    running it.

assessed_artifact:
  type: flag
  description: >-
    The 5 hexpractice challenges, server-verified via the lab-manager /check endpoint and
    surfaced to Dr. Hex through sandbox_task_state. Dr. Hex has no terminal visibility; the
    per-task pass/fail is the only signal he may use to calibrate help.

allowed_help_levels:
  - 0
  - 1
  - 2
# MAX = Level 2. Execution-syntax lab: Dr. Hex may name the command and explain what its
# flags do (what chmod 600 means, what grep does, what > redirection does), but MUST NOT
# assemble or paste the exact graded one-liner. Levels 3+ (partial/full solution) are
# withheld because the command itself is the assessed skill.

forbidden_disclosures:
  # The exact copy-paste answers for the 5 tasks. Teach the concept; never hand these over.
  - "mkdir -p ~/work && echo hexworth > ~/work/hello.txt"
  - "printf '#!/bin/bash\\necho hi\\n' > ~/work/greet.sh && chmod +x ~/work/greet.sh"
  - "touch ~/work/secret.txt && chmod 600 ~/work/secret.txt"
  - "grep ERROR ~/playground/logs/app.log > ~/work/found.txt"
  - "cd ~/work && git init && git config user.email you@hex.local && git config user.name You && git add . && git commit -m first"
  # Answer-bearing FRAGMENTS. voice_linter matches by exact substring, so the full
  # one-liners above do not catch a partial paste. These are the path/value-qualified
  # pieces that each constitute a graded answer on their own. Naming a bare command as
  # a concept ("use chmod", "git init starts a repo") is still allowed at Level 2; it
  # is these fully-specified fragments that must not be handed over.
  - "echo hexworth > ~/work/hello.txt"
  - "chmod +x ~/work/greet.sh"
  - "chmod 600 ~/work/secret.txt"
  - "grep ERROR ~/playground/logs/app.log"
  - "mkdir -p ~/work"

transfer_prompt: >-
  You used chmod 600 to make a file owner-only. If instead you had a script your teammates
  need to RUN but only you should be able to EDIT, which octal mode would you set, and what
  does each of the three digits control?

# ENFORCEMENT NOTE (read before wiring phase_id for this lab):
# phase_scaffolds below are injected VERBATIM into Dr. Hex's system prompt as
# per-task guidance, keyed by phase_id. The Linux Practice Sandbox has NO phase_id
# telemetry today (the guided tutorial tracks its own step client-side and does not
# report a phase to the orchestrator), so these hints are INERT until that wiring
# ships. They are written to stop at Socratic questions and never state a graded
# value or command sequence (Level 2 cap), but the moment phase_id is wired for this
# lab they become live student-facing text: require a fresh Nancy + Karl pass at that
# point to re-check every hint against forbidden_disclosures and the help-level cap.
phase_scaffolds:
  phase_1:
    name: Workspace and first file
    hint: |
      Goal: a ~/work folder holding a file named hello.txt that contains the word "hexworth".
      Two ideas do it. First, a command that creates a directory (its -p flag makes it
      succeed quietly even if the folder already exists). Second, output redirection: the >
      operator sends a command's output into a file instead of the screen, creating the file
      if it does not exist. So: which command prints a word, and how do you point that word
      at a new file? Try it, then run hexpractice check to see if task 1 is green.
  phase_2:
    name: A runnable script
    hint: |
      Goal: ~/work/greet.sh must be a shell script AND be marked executable. A script is just
      a text file whose first line is a "shebang" (#!/bin/bash) naming the interpreter,
      followed by at least one command that prints something. Being a script is not enough to
      run it as a program: Linux needs the execute permission bit set. Which chmod option adds
      "executable"? Think about how you write those lines into the file, then how you flip the
      execute bit.
  phase_3:
    name: Private permissions
    hint: |
      Goal: make secret.txt readable and writable ONLY by its owner. Linux permissions are
      three octal digits, one each for owner, group, and others; within a digit, read=4,
      write=2, execute=1, added together. "Owner can read and write, nobody else can do
      anything" is the standard for private files like SSH keys. Translate that sentence into
      three octal digits yourself, then apply them with chmod. If the mapping is fuzzy, run
      man chmod and read its octal-mode table.
  phase_4:
    name: Filter a log
    hint: |
      Goal: save ONLY the lines containing ERROR from ~/playground/logs/app.log into
      ~/work/found.txt. grep prints the lines that match a pattern. By default it prints them
      to the screen, so reuse the same redirection idea from task 1 to capture grep's output
      into a file instead of watching it scroll past.
  phase_5:
    name: Version control
    hint: |
      Goal: turn ~/work into a git repository with at least one commit. Three git operations
      are involved: staging your files, recording a commit, and initializing the repository.
      Work out which one has to come first for the others to work, and which order the other
      two go in. One gotcha on a fresh box: git refuses to commit until it knows who you are,
      so set a user.email and a user.name (any values are fine) before you try to commit. Run
      git help <command> if you are unsure what one of them does.
