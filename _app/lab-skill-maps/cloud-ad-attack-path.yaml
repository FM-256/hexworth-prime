# Skill Map for: AD Attack Path (cloud house, arcade)
#
# BloodHound-shaped privilege-escalation puzzle. Eight scenarios; the player is
# given a graph of users, groups, computers, GPOs and the domain, joined by real
# AD abuse primitives (MemberOf, AdminTo, HasSession, GenericAll, WriteDacl,
# ForceChangePassword, Kerberoast, DCSync, Unconstrained, SeBackupPrivilege,
# GPLink, Contains), and must trace a path from a low-privilege foothold to
# domain compromise.
#
# THIS IS THE HIGHEST-DISCLOSURE GAME OF THE FIVE. The assessed artifact is the
# PATH — an ordered chain of edges — and unlike a reflex game it is completely
# expressible in one sentence. "Kerberoast the service account, then DCSync"
# ends the exercise. That is why help is capped well below direct answers and
# why the forbidden list targets chained-edge naming rather than the vocabulary.
#
# Explaining what an individual primitive IS remains fully allowed and is the
# whole point of having Dr. Hex here — a student who does not know what DCSync
# means cannot learn anything from being refused.

lab_id: cloud-ad-attack-path
lab_name: AD Attack Path (Active Directory privilege escalation)

primary_skill:
  layer: Hypothesis
  description: >-
    Reads an Active Directory relationship graph and forms a hypothesis about
    which chain of rights composes into domain compromise, rather than
    evaluating each edge in isolation.
  evidence_required: >-
    Student traces a complete path from foothold to target and can say why each
    hop grants what the next hop requires.

secondary_skill:
  layer: Recognition
  description: >-
    Recognises individual AD abuse primitives and what each actually confers —
    that GenericAll is not the same as AdminTo, that Kerberoast yields a hash
    and not a session.
  evidence_required: >-
    Student names the primitive on an edge and states the access it grants.

assessed_artifact:
  type: written-explanation
  description: >-
    The graded artifact is the ordered attack path the student selects, and the
    reasoning that composes each hop into the next.

# Capped at 3. Level 4 and 5 would let Dr. Hex assemble the chain, which is the
# entire exercise — this is not a syntax hurdle that can be waved through.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3

forbidden_disclosures:
  # CHAINED-EDGE NAMING. Two primitives joined into a sequence is the answer.
  #
  # WHAT THIS ACTUALLY COVERS, stated precisely because the first version of
  # this comment claimed "any order and with any connector" and that was false:
  #   - a ~30-item connector class, not seven;
  #   - it DOES cross sentence boundaries ([\s\S] not [^.!?]), because putting a
  #     period between two steps is the most natural way to write a two-step
  #     answer and the earlier [^.!?] gap made a full stop a complete bypass;
  #   - a second pattern catches primitive-primitive followed by a trailing
  #     sequence word ("...and DCSync gets run next"), where the ordering marker
  #     comes after both primitives rather than between them.
  #
  # WHAT IT DOES NOT COVER: two primitives joined by nothing but a comma or a
  # bare "and". That is deliberate — "Kerberoast, DCSync and GenericAll are all
  # abuse primitives" is legitimate teaching and blocking it would be worse than
  # the leak. Best-effort, not a proof; the real constraint is the Level 3 cap.
  - "re:(?:kerberoast\\w*|dcsync\\w*|genericall|writedacl|forcechangepassword|admin\\s?to|hassession|unconstrained\\w*|sebackupprivilege|gplink)[\\s\\S]{0,90}?(?:then|next|after(?:ward|wards)?|after that|subsequently|followed by|which (?:lets|allows|grants|gives|means)|so you can|so that you|to get|to obtain|into|thereby|resulting in|leading to|giving you|letting you|and use|and then|use (?:the|those)|is used to|used to|to perform|to run|;)[\\s\\S]{0,90}?(?:kerberoast\\w*|dcsync\\w*|genericall|writedacl|forcechangepassword|admin\\s?to|hassession|unconstrained\\w*|sebackupprivilege|gplink)"
  - "re:(?:kerberoast\\w*|dcsync\\w*|genericall|writedacl|forcechangepassword|admin\\s?to|hassession|unconstrained\\w*|sebackupprivilege|gplink)[\\s\\S]{0,70}?(?:kerberoast\\w*|dcsync\\w*|genericall|writedacl|forcechangepassword|admin\\s?to|hassession|unconstrained\\w*|sebackupprivilege|gplink)[\\s\\S]{0,30}?\\b(?:next|afterwards?|then|finally|second|lastly)\\b"
  # Handing over a path wholesale.
  - "re:\\bthe (?:attack )?path is\\b"
  - "re:\\bthe (?:full |complete )?(?:chain|route|sequence) is\\b"
  - "re:\\bstart (?:at|with|from)\\b[^.!?]{0,40}\\bthen\\b[^.!?]{0,40}\\bdomain admin\\b"
  # Naming the terminal move for a scenario.
  - "the answer is DCSync"
  - "you need to DCSync"
  # NOTE, and it is the same honesty note as cold-horizon.yaml: this is
  # best-effort pattern matching, not a proof. A paraphrased path can get
  # through. The real constraint is allowed_help_levels plus the Constitution.

transfer_prompt: |
  You have just composed several ordinary-looking rights into domain compromise.
  Which single edge in that path would you remove first if you were defending
  this domain, and why that one rather than the one that looks most alarming?
  Name the AD control or configuration change that actually removes it.
