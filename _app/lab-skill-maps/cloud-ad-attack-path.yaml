# Skill Map for: AD Attack Path (cloud house, arcade)
#
# BloodHound-shaped privilege-escalation puzzle. Eight scenarios; the player is
# given a graph of users, groups, computers, GPOs and the domain, joined by real
# AD abuse primitives (MemberOf, AdminTo, HasSession, GenericAll, WriteDacl,
# ForceChangePassword, Kerberoast, DCSync, Unconstrained, SeBackupPrivilege,
# GPLink, Contains), and must trace a path from a low-privilege foothold to
# domain compromise.
#
# THIS IS THE HIGHEST-DISCLOSURE GAME OF THE FIVE. The assessed artifact is the
# PATH — an ordered chain of edges — and unlike a reflex game it is completely
# expressible in one sentence. "Kerberoast the service account, then DCSync"
# ends the exercise. That is why help is capped well below direct answers.
#
# THE CAP IS THE GUARDRAIL. The forbidden list below does NOT catch chained-edge
# naming; that machinery was tried across six review rounds and removed, because
# no proximity rule separates a chain from a contrast without also refusing
# correct teaching. See the note above the list. Do not read this file as
# preventing a determined student from eliciting a path.
#
# Explaining what an individual primitive IS remains fully allowed and is the
# whole point of having Dr. Hex here — a student who does not know what DCSync
# means cannot learn anything from being refused.

lab_id: cloud-ad-attack-path
lab_name: AD Attack Path (Active Directory privilege escalation)

primary_skill:
  layer: Hypothesis
  description: >-
    Reads an Active Directory relationship graph and forms a hypothesis about
    which chain of rights composes into domain compromise, rather than
    evaluating each edge in isolation.
  evidence_required: >-
    Student traces a complete path from foothold to target and can say why each
    hop grants what the next hop requires.

secondary_skill:
  layer: Recognition
  description: >-
    Recognises individual AD abuse primitives and what each actually confers —
    that GenericAll is not the same as AdminTo, that Kerberoast yields a hash
    and not a session.
  evidence_required: >-
    Student names the primitive on an edge and states the access it grants.

assessed_artifact:
  type: written-explanation
  description: >-
    The graded artifact is the ordered attack path the student selects, and the
    reasoning that composes each hop into the next.

# Capped at 3. Level 4 and 5 would let Dr. Hex assemble the chain, which is the
# entire exercise — this is not a syntax hurdle that can be waved through.
allowed_help_levels:
  - 0
  - 1
  - 2
  - 3

forbidden_disclosures:
  # HIGH-PRECISION ONLY. The chained-edge machinery that used to live here is
  # GONE, deliberately, after six rounds of adversarial review.
  #
  # WHY IT WAS REMOVED RATHER THAN TUNED AGAIN. Proximity matching cannot tell a
  # CHAIN from a CONTRAST. Every widening that caught "Kerberoast then DCSync"
  # also caught real teaching:
  #   "WriteDacl is used to modify permissions, whereas GenericAll is used to
  #    grant nearly complete control."          <- pure definition, was blocked
  #   "Kerberoasting used to be considered obscure, but DCSync is now more
  #    commonly abused."                        <- habitual past, was blocked
  #   "Step 1 is understanding GenericAll's scope. Step 2, a separate topic,
  #    is how DCSync replication rights work."  <- curriculum, was blocked
  # Refusing a student a correct explanation is a worse outcome than a leak, and
  # a guardrail that does it is net-negative. So the patterns below fire only on
  # explicit answer DECLARATION, where the wording admits no innocent reading.
  #
  # WHAT THIS MEANS: a paraphrased chain gets through. That is accepted, stated,
  # and NOT dressed up. The real constraint on this lab is allowed_help_levels
  # capped at 3 plus the Constitution — never this list.
  - "re:\\bthe (?:attack )?path is\\b"
  - "re:\\bthe (?:full |complete |whole )?(?:chain|route|sequence) is\\b"
  - "re:\\bthe answer is\\b[^.!?]{0,20}\\b(?:kerberoast\\w*|dcsync\\w*|genericall|writedacl|forcechangepassword)\\b"
  - "re:\\byou need to\\b[^.!?]{0,12}\\b(?:kerberoast|dcsync)\\b"

transfer_prompt: |
  You have just composed several ordinary-looking rights into domain compromise.
  Which single edge in that path would you remove first if you were defending
  this domain, and why that one rather than the one that looks most alarming?
  Name the AD control or configuration change that actually removes it.
