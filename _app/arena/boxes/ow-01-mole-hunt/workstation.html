let currentFolder = 'root';
let currentEvidence = null;

function showFolder(folderId) {
    currentFolder = folderId;
    const folder = FILES[folderId];
    if (!folder) return;

    document.getElementById('breadcrumbPath').textContent = folder.label;

    // Update sidebar active state
    document.querySelectorAll('.ws-sidebar-item').forEach(item => item.classList.remove('active'));
    const sideItems = document.querySelectorAll('.ws-sidebar-item');
    sideItems.forEach(item => {
        if (item.textContent.trim().includes(folder.label) || (folderId === 'root' && item.textContent.includes('This PC'))) {
            item.classList.add('active');
        }
    });

    const area = document.getElementById('fileArea');
    area.innerHTML = '<div class="ws-file-grid">' + folder.items.map(f => {
        const isRecoverable = f.recovered;
        const isRecovered = isRecoverable && engine.isFileRecovered('workstation', f.evidenceId);
        const opacity = isRecoverable && !isRecovered ? 'opacity:0.4;' : '';
        return '<div class="ws-file" onclick="openFile(\'' + (f.folder || f.evidenceId || f.name) + '\', \'' + f.type + '\')" style="' + opacity + '">' +
            '<div class="ws-file-icon"><img src="' + f.icon + '" alt="" width="32" height="32"></div>' +
            '<div class="ws-file-name">' + f.name + '</div>' +
            (f.size ? '<div style="font-size:0.55rem;color:#555;margin-top:2px;">' + f.size + (f.date ? ' | ' + f.date : '') + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
}

function openFile(id, type) {
    if (type === 'folder') {
        showFolder(id);
        return;
    }

    // Find the file across all folders
    let file = null;
    for (const folder of Object.values(FILES)) {
        file = folder.items.find(f => (f.evidenceId || f.name) === id);
        if (file) break;
    }
    if (!file) return;

    // Check if recoverable but not yet recovered
    if (file.recovered && !engine.isFileRecovered('workstation', file.evidenceId)) {
        engine.recoverFile('workstation', file.evidenceId);
        showFolder(currentFolder); // Refresh to update opacity
    }

    engine.openFile(id);
    currentEvidence = file.evidenceId ? MoleHuntConfig.evidence[file.evidenceId] : null;

    document.getElementById('viewerTitle').textContent = file.name;
    document.getElementById('viewerBody').innerHTML = file.content || '<p>No content available.</p>';

    // Pin button
    const pinBtn = document.getElementById('viewerPin');
    if (currentEvidence) {
        pinBtn.style.display = 'inline-block';
        const isPinned = engine.isEvidencePinned(file.evidenceId);
        pinBtn.textContent = isPinned ? 'Pinned' : 'Pin as Evidence';
        pinBtn.className = 'ws-pin-btn' + (isPinned ? ' pinned' : '');
        pinBtn.onclick = function() {
            if (!engine.isEvidencePinned(file.evidenceId)) {
                engine.pinEvidence({ id: file.evidenceId, ...currentEvidence });
                pinBtn.textContent = 'Pinned';
                pinBtn.className = 'ws-pin-btn pinned';
            }
        };
    } else {
        pinBtn.style.display = 'none';
    }

    const viewer = document.getElementById('fileViewer');
    viewer.style.top = window.scrollY + 'px';
    viewer.style.height = window.innerHeight + 'px';
    viewer.classList.add('active');
}

document.getElementById('viewerClose').addEventListener('click', function() {
    document.getElementById('fileViewer').classList.remove('active');
});
document.getElementById('fileViewer').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
});

// Initial render
showFolder('root');
