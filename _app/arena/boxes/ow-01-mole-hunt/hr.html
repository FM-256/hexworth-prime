<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Records — Operation Mole Hunt</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-user.webp">
    <link rel="stylesheet" href="shared.css">
    <style>
        .hr-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
        .hr-tab { padding: 8px 16px; background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.75rem; color: var(--ow-text-dim); font-family: var(--ow-font); transition: color 0.2s; }
        .hr-tab.active { color: var(--ow-hr); border-bottom-color: transparent; background: var(--ow-surface-2); }
        .hr-profile { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 0 6px 6px 6px; padding: 20px; }
        .hr-profile-header { display: flex; gap: 16px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--ow-border); }
        .hr-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--ow-surface-2); display: flex; align-items: center; justify-content: center; border: 2px solid var(--ow-hr); }
        .hr-name { font-size: 1.1rem; font-weight: bold; color: var(--ow-text-bright); }
        .hr-title { font-size: 0.75rem; color: var(--ow-text-dim); }
        .hr-section { margin-bottom: 16px; }
        .hr-section-title { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ow-hr); margin-bottom: 8px; font-weight: bold; }
        .hr-field { display: flex; gap: 12px; padding: 4px 0; font-size: 0.75rem; }
        .hr-label { color: var(--ow-text-dim); min-width: 140px; }
        .hr-value { color: var(--ow-text); }
        .hr-highlight { color: var(--ow-accent); font-weight: bold; }
    </style>
</head>
<body>
<h1 class="visually-hidden">Operation Mole Hunt — HR Records</h1>

<script src="../../engine/OpenWorldEngine.js"></script>
<script src="config-shared.js"></script>
<script>
    MoleHuntConfig.activePage = 'hr';
    const engine = new OpenWorldEngine(MoleHuntConfig);
    engine.init();
</script>

<div class="ow-content">
    <div class="hr-tabs">
        <div class="hr-tab active" onclick="showProfile('sarah',this)">Sarah Chen</div>
        <div class="hr-tab" onclick="showProfile('david',this)">David Park</div>
    </div>

    <div class="hr-profile" id="hrProfile"></div>
</div>

<script>

            { item: 'Workstation WS-ENG-042', serial: 'DL-7742-ENG', issued: '2022-06-15', status: 'Active' },
            { item: 'Dell U2722D Monitor', serial: 'CN-0X4F2-MON', issued: '2026-02-28', status: 'Active (replacement)' },
            { item: 'Badge MRD-1001', serial: 'HID-2019-1001', issued: '2019-03-15', status: 'Active' },
            { item: 'Cisco AnyConnect VPN Token', serial: 'VPN-SC-2019', issued: '2019-03-20', status: 'Active' },

        ],

        ],

            { system: 'JIRA / Confluence', provisioned: '2019-03-15', level: 'Engineering' },
            { system: 'Classified File Share (AURORA)', provisioned: '2021-08-10', level: 'SECRET — Read/Write' },
            { system: 'Git (Meridian Engineering)', provisioned: '2019-03-20', level: 'Contributor' },
            { system: 'VPN', provisioned: '2019-03-20', level: 'Engineering Group' },

        ],

    },
    david: {
        name: 'David Park',
        title: 'Systems Engineer I',
        dept: 'Engineering',
        badge: 'MRD-1042',
        hired: 'June 22, 2020',
        salary: '$128,000',
        clearance: 'SECRET',
        manager: 'Director M. Williams',
        evidence: [
            { id: 'hr-david-record', section: 'Performance', items: [
                { label: 'FY2023 Rating', value: 'Meets Expectations' },

            ]},

                { label: 'Previous Contact', value: 'Min-ji Park (Mother) — 555-0234 (on file since 2020)' },
                { label: 'Phone Analysis', value: '<span class="hr-highlight">555-0147 is a prepaid burner phone (T-Mobile, activated Feb 18)</span>', highlight: true }
            ]},
            { id: 'hr-david-pto', section: 'PTO Pattern', items: [
                { label: 'Feb 21 (Fri)', value: '<span class="hr-highlight">PTO — day after Victor\'s first visit (Feb 20)</span>', highlight: true },

            ]},

                { label: 'Beneficiary', value: '<span class="hr-highlight">"V. Park" (not his mother, not a spouse)</span>', highlight: true },

            ]}
        ],
        equipment: [
            { item: 'Workstation WS-ENG-078', serial: 'DL-7788-ENG', issued: '2020-07-01', status: 'Active' },
            { item: 'Dell P2419H Monitor', serial: 'CN-0Y3A1-MON', issued: '2020-07-01', status: 'Active' },
            { item: 'Badge MRD-1042', serial: 'HID-2020-1042', issued: '2020-06-22', status: 'Active' },
            { item: 'Cisco AnyConnect VPN Token', serial: 'VPN-DP-2020', issued: '2020-07-05', status: 'Active' },
            { item: 'YubiKey 5 NFC', serial: 'YK-5N-44388', issued: '2023-01-10', status: 'Active' }
        ],
        training: [
            { course: 'Security Awareness FY2026', completed: '2026-01-22', score: '82/100', status: 'Current' },
            { course: 'ITAR Compliance', completed: '2025-09-25', score: 'Pass', status: 'Current' },
            { course: 'Insider Threat Awareness', completed: '2025-09-25', score: 'Pass', status: 'Current' },
            { course: 'Fire Safety / Evacuation', completed: '2025-03-01', score: 'Attended', status: 'Current' },
            { course: 'Anti-Harassment (CA SB-1343)', completed: '2025-02-20', score: 'Pass', status: 'Current' }
        ],
        access: [
            { system: 'Active Directory', provisioned: '2020-06-22', level: 'Standard User' },
            { system: 'JIRA / Confluence', provisioned: '2020-06-22', level: 'Engineering' },
            { system: 'Classified File Share (AURORA)', provisioned: '2022-03-01', level: 'SECRET — Read Only' },
            { system: 'Git (Meridian Engineering)', provisioned: '2020-07-01', level: 'Contributor' },
            { system: 'VPN', provisioned: '2020-07-05', level: 'Engineering Group' }
        ],
        i9: { verified: '2020-06-22', document: 'US Passport', expiry: '2030-11-08' }
    }
};

let currentProfile = 'sarah';

function showProfile(id, el) {
    currentProfile = id;
    document.querySelectorAll('.hr-tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    renderProfile();
}

function renderProfile() {
    const p = PROFILES[currentProfile];
    let html = '<div class="hr-profile-header">' +
        '<div class="hr-avatar"><img src="/assets/images/icons/icon-user.webp" alt="" width="32" height="32"></div>' +
        '<div><div class="hr-name">' + p.name + '</div><div class="hr-title">' + p.title + ' — ' + p.dept + '</div></div>' +
    '</div>';

    // Basic info
    html += '<div class="hr-section"><div class="hr-section-title">Employment</div>' +
        '<div class="hr-field"><span class="hr-label">Badge ID</span><span class="hr-value">' + p.badge + '</span></div>' +
        '<div class="hr-field"><span class="hr-label">Hire Date</span><span class="hr-value">' + p.hired + '</span></div>' +
        '<div class="hr-field"><span class="hr-label">Salary</span><span class="hr-value">' + p.salary + '</span></div>' +
        '<div class="hr-field"><span class="hr-label">Clearance</span><span class="hr-value">' + p.clearance + '</span></div>' +
        '<div class="hr-field"><span class="hr-label">Manager</span><span class="hr-value">' + p.manager + '</span></div>' +
    '</div>';

    // Evidence sections
    p.evidence.forEach(ev => {
        const isPinned = engine.isEvidencePinned(ev.id);
        html += '<div class="hr-section"><div class="hr-section-title">' + ev.section +
            ' <span style="font-size:0.55rem;cursor:pointer;color:' + (isPinned ? 'var(--ow-green)' : 'var(--ow-accent)') + ';" onclick="pinHR(\'' + ev.id + '\')">[' + (isPinned ? 'PINNED' : 'PIN') + ']</span></div>';
        ev.items.forEach(item => {
            html += '<div class="hr-field"><span class="hr-label">' + item.label + '</span><span class="hr-value">' + item.value + '</span></div>';
        });
        html += '</div>';
    });

    // Emergency contact
    if (p.emergency) {
        html += '<div class="hr-section"><div class="hr-section-title">Emergency Contact</div>' +
            '<div class="hr-field"><span class="hr-label">Name</span><span class="hr-value">' + p.emergency.name + '</span></div>' +
            '<div class="hr-field"><span class="hr-label">Phone</span><span class="hr-value">' + p.emergency.phone + '</span></div>' +
            '<div class="hr-field"><span class="hr-label">On File Since</span><span class="hr-value">' + p.emergency.since + '</span></div>' +
        '</div>';
    }

    // Benefits
    if (p.benefits) {
        html += '<div class="hr-section"><div class="hr-section-title">Benefits</div>';
        if (typeof p.benefits === 'object') {
            Object.entries(p.benefits).forEach(function(pair) {
                var label = pair[0].charAt(0).toUpperCase() + pair[0].slice(1).replace(/([A-Z])/g, ' $1');
                html += '<div class="hr-field"><span class="hr-label">' + label + '</span><span class="hr-value">' + pair[1] + '</span></div>';
            });
        }
        html += '</div>';
    }

    // I-9 Verification
    if (p.i9) {
        html += '<div class="hr-section"><div class="hr-section-title">I-9 Employment Verification</div>' +
            '<div class="hr-field"><span class="hr-label">Verified</span><span class="hr-value">' + p.i9.verified + '</span></div>' +
            '<div class="hr-field"><span class="hr-label">Document</span><span class="hr-value">' + p.i9.document + '</span></div>' +
            '<div class="hr-field"><span class="hr-label">Expiry</span><span class="hr-value">' + p.i9.expiry + '</span></div>' +
        '</div>';
    }

    // Equipment Assignment
    if (p.equipment && p.equipment.length) {
        html += '<div class="hr-section"><div class="hr-section-title">Equipment Assignment</div>' +
            '<table class="ow-table" style="font-size:0.65rem;"><thead><tr><th>Item</th><th>Serial</th><th>Issued</th><th>Status</th></tr></thead><tbody>';
        p.equipment.forEach(function(eq) {
            html += '<tr><td>' + eq.item + '</td><td style="font-family:Consolas,monospace;font-size:0.6rem;">' + eq.serial + '</td><td>' + eq.issued + '</td><td>' + eq.status + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    // Training Records
    if (p.training && p.training.length) {
        html += '<div class="hr-section"><div class="hr-section-title">Training Records</div>' +
            '<table class="ow-table" style="font-size:0.65rem;"><thead><tr><th>Course</th><th>Completed</th><th>Score</th><th>Status</th></tr></thead><tbody>';
        p.training.forEach(function(tr) {
            html += '<tr><td>' + tr.course + '</td><td>' + tr.completed + '</td><td>' + tr.score + '</td><td style="color:var(--ow-green);">' + tr.status + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    // System Access Provisioning
    if (p.access && p.access.length) {
        html += '<div class="hr-section"><div class="hr-section-title">System Access Provisioning</div>' +
            '<table class="ow-table" style="font-size:0.65rem;"><thead><tr><th>System</th><th>Provisioned</th><th>Access Level</th></tr></thead><tbody>';
        p.access.forEach(function(ac) {
            html += '<tr><td>' + ac.system + '</td><td>' + ac.provisioned + '</td><td>' + ac.level + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    // PTO
    if (p.pto && typeof p.pto === 'string') {
        html += '<div class="hr-section"><div class="hr-section-title">PTO</div><div class="hr-field"><span class="hr-value">' + p.pto + '</span></div></div>';
    }

    document.getElementById('hrProfile').innerHTML = html;
}

function pinHR(evidenceId) {
    if (engine.isEvidencePinned(evidenceId)) return;
    const ev = MoleHuntConfig.evidence[evidenceId];
    if (ev) {
        engine.pinEvidence({ id: evidenceId, ...ev });
        engine.openFile(evidenceId);
        renderProfile();
    }
}

renderProfile();
</script>

</body>
</html>
