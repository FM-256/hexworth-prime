/* ═══════════════════════════════════════════════════════════════
   FILTER & RENDER ENGINE
   ═══════════════════════════════════════════════════════════════ */

let activeSev = 'all';
let activeSrc = 'all';

function toggleSev(sev, el) {
    activeSev = sev;
    document.querySelectorAll('.si-filter-group:first-child .si-fbtn').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    applyFilters();
}

function toggleSrc(src, el) {
    activeSrc = src;
    document.querySelectorAll('.si-filter-group:nth-child(2) .si-fbtn').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    applyFilters();
}

function applyFilters() {
    const search = document.getElementById('siemSearch').value.trim().toLowerCase();
    const filtered = ALERTS.filter(function(a) {
        // Severity filter
        if (activeSev !== 'all' && a.severity !== activeSev) return false;
        // Source filter
        if (activeSrc !== 'all' && a.source !== activeSrc) return false;
        // Search filter
        if (search) {
            return a.title.toLowerCase().includes(search) ||
                   a.body.toLowerCase().includes(search) ||
                   a.id.toLowerCase().includes(search) ||
                   a.source.toLowerCase().includes(search) ||
                   (a.rule || '').toLowerCase().includes(search);
        }
        return true;
    });
    renderAlerts(filtered);
}

function renderAlerts(alerts) {
    // Stats
    var critCount = alerts.filter(function(a) { return a.severity === 'critical'; }).length;
    var highCount = alerts.filter(function(a) { return a.severity === 'high'; }).length;
    var totalEvents = alerts.reduce(function(sum, a) { return sum + (a.events || 0); }, 0);
    document.getElementById('siemStats').innerHTML =
        'Showing <span class="si-stat-val">' + alerts.length + '</span> of ' + ALERTS.length + ' alerts' +
        ' &mdash; <span style="color:#fca5a5;">' + critCount + ' Critical</span>' +
        ', <span style="color:#fcd34d;">' + highCount + ' High</span>' +
        ' &mdash; ' + totalEvents.toLocaleString() + ' raw events';

    // Render
    var sevColors = {
        critical: 'background:rgba(220,38,38,0.15);color:#fca5a5;',
        high: 'background:rgba(245,158,11,0.15);color:#fcd34d;',
        medium: 'background:rgba(59,130,246,0.15);color:#93c5fd;',
        low: 'background:rgba(34,197,94,0.15);color:#86efac;',
        info: 'background:rgba(107,114,128,0.15);color:#9ca3af;'
    };

    document.getElementById('alertList').innerHTML = alerts.map(function(a) {
        var isPinned = a.evidenceId && engine.isEvidencePinned(a.evidenceId);
        return '<div class="si-alert ' + a.severity + '" id="alert-' + a.id + '">' +
            '<div class="si-alert-row" onclick="toggleAlert(\'' + a.id + '\')">' +
                '<div class="si-alert-left">' +
                    '<span class="si-alert-id">' + a.id + '</span>' +
                    '<span class="si-alert-title">' + a.title + '</span>' +
                '</div>' +
                '<div class="si-alert-right">' +
                    '<span class="si-alert-src">' + a.source + '</span>' +
                    '<span class="si-alert-sev" style="' + (sevColors[a.severity] || '') + '">' + a.severity.toUpperCase() + '</span>' +
                    '<span class="si-alert-time">' + a.time.split(' ')[0] + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="si-alert-detail">' +
                '<div class="si-alert-meta">' +
                    '<span>Rule: ' + (a.rule || 'N/A') + '</span>' +
                    '<span>Events: ' + (a.events || 1).toLocaleString() + '</span>' +
                    '<span>' + a.time + '</span>' +
                '</div>' +
                '<div>' + a.body + '</div>' +
                (a.evidenceId ? '<div class="si-pin-link" style="color:' + (isPinned ? 'var(--ow-green)' : 'var(--ow-accent)') + ';" onclick="event.stopPropagation();pinAlert(\'' + a.evidenceId + '\')">[' + (isPinned ? 'PINNED' : 'Pin as Evidence') + ']</div>' : '') +
            '</div>' +
        '</div>';
    }).join('') || '<div style="padding:30px;text-align:center;color:var(--ow-text-dim);">No alerts match your filters.</div>';
}

function toggleAlert(alertId) {
    var el = document.getElementById('alert-' + alertId);
    if (el) el.classList.toggle('expanded');
    // Mark as read
    var alert = ALERTS.find(function(a) { return a.id === alertId; });
    if (alert) engine.openFile(alertId);
}

function pinAlert(evidenceId) {
    if (!evidenceId || engine.isEvidencePinned(evidenceId)) return;
    var ev = MoleHuntConfig.evidence[evidenceId];
    if (ev) {
        engine.pinEvidence({ id: evidenceId, ...ev });
        engine.openFile(evidenceId);
        applyFilters();
    }
}

document.getElementById('siemSearch').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') applyFilters();
});

// Initial render
applyFilters();
</script>
