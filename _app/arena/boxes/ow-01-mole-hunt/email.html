<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email — Operation Mole Hunt</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-list.webp">
    <link rel="stylesheet" href="shared.css">
    <style>
        .em-client { display: flex; min-height: 550px; background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 6px; overflow: hidden; }
        .em-sidebar { width: 180px; border-right: 1px solid var(--ow-border); padding: 10px; background: #0d1117; }
        .em-sidebar-title { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ow-text-dim); padding: 6px 8px; }
        .em-folder { padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.72rem; color: #aaa; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
        .em-folder:hover { background: rgba(255,255,255,0.04); }
        .em-folder.active { background: rgba(245,158,11,0.12); color: var(--ow-email); }
        .em-folder-badge { background: var(--ow-email); color: #000; font-size: 0.55rem; padding: 1px 5px; border-radius: 8px; font-weight: bold; }
        .em-list { width: 300px; border-right: 1px solid var(--ow-border); overflow-y: auto; }
        .em-item { padding: 10px 12px; border-bottom: 1px solid var(--ow-border); cursor: pointer; transition: background 0.15s; }
        .em-item:hover { background: rgba(255,255,255,0.03); }
        .em-item.active { background: rgba(245,158,11,0.08); border-left: 2px solid var(--ow-email); }
        .em-item.unread { font-weight: bold; }
        .em-item-from { font-size: 0.72rem; color: var(--ow-text-bright); margin-bottom: 2px; }
        .em-item-subject { font-size: 0.7rem; color: #aaa; margin-bottom: 2px; }
        .em-item-date { font-size: 0.6rem; color: var(--ow-text-dim); }
        .em-detail { flex: 1; padding: 16px; overflow-y: auto; }
        .em-detail-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ow-border); }
        .em-detail-subject { font-size: 1rem; font-weight: bold; color: var(--ow-text-bright); margin-bottom: 8px; }
        .em-detail-meta { font-size: 0.7rem; color: var(--ow-text-dim); line-height: 1.6; }
        .em-detail-body { font-size: 0.78rem; line-height: 1.7; color: var(--ow-text); }
        .em-detail-body blockquote { border-left: 2px solid var(--ow-border); padding-left: 12px; margin: 10px 0; color: var(--ow-text-dim); }
        .em-pin-bar { display: flex; gap: 8px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--ow-border); }
    </style>
</head>
<body>
<h1 class="visually-hidden">Operation Mole Hunt — Email Server</h1>

<script src="../../engine/OpenWorldEngine.js"></script>
<script src="config-shared.js"></script>
<script>
    MoleHuntConfig.activePage = 'email';
    const engine = new OpenWorldEngine(MoleHuntConfig);
    engine.init();
</script>

<div class="ow-content" style="max-width:1100px;">
    <div class="em-client">
        <div class="em-sidebar">
            <div class="em-sidebar-title">Mailboxes</div>
            <div class="em-folder active" onclick="showMailbox('sarah-inbox',this)">
                <img src="/assets/images/icons/icon-list.webp" alt="" width="12" height="12"> Sarah - Inbox <span class="em-folder-badge" id="badge-sarah-inbox"></span>
            </div>
            <div class="em-folder" onclick="showMailbox('sarah-sent',this)">
                <img src="/assets/images/icons/icon-arrow-left.webp" alt="" width="12" height="12"> Sarah - Sent
            </div>
            <div class="em-folder" onclick="showMailbox('david-inbox',this)">
                <img src="/assets/images/icons/icon-list.webp" alt="" width="12" height="12"> David - Inbox <span class="em-folder-badge" id="badge-david-inbox"></span>
            </div>
            <div class="em-folder" onclick="showMailbox('david-sent',this)">
                <img src="/assets/images/icons/icon-arrow-left.webp" alt="" width="12" height="12"> David - Sent
            </div>
            <div class="em-folder" onclick="showMailbox('david-deleted',this)">
                <img src="/assets/images/icons/icon-delete.webp" alt="" width="12" height="12"> David - Deleted <span class="em-folder-badge" id="badge-david-deleted"></span>
            </div>
        </div>
        <div class="em-list" id="emailList"></div>
        <div class="em-detail" id="emailDetail">
            <div style="text-align:center;padding:60px 20px;color:var(--ow-text-dim);font-size:0.8rem;">
                Select an email to read.
            </div>
        </div>
    </div>
</div>

<script>
const EMAILS = {
    'sarah-inbox': [
        { id: 'si-1', from: 'HR Department', to: 'Sarah Chen', subject: 'Annual Performance Review — FY2025', date: 'Mar 1, 2026', unread: false, evidenceId: 'em-perf-review',
          body: '<p>Dear Sarah,</p><p>Your FY2025 performance review has been completed. Your overall rating is <strong>"Exceeds Expectations"</strong> for the third consecutive year.</p><p>Your manager, Director Williams, has noted:</p><blockquote>"Sarah consistently delivers exceptional work. Her satellite communication protocol analysis saved the AURORA project 3 months of development time. I strongly recommend her for the Senior Architect position."</blockquote><p>Please review and sign the attached evaluation document.</p><p>Best regards,<br>HR Department</p>' },
        { id: 'si-2', from: 'IT Security', to: 'Sarah Chen', subject: 'After-Hours Server Room Access — Approved', date: 'Mar 12, 2026 16:50', unread: false, evidenceId: 'em-access-req',
          body: '<p>Hi Sarah,</p><p>Your request for after-hours server room access on March 12 has been approved.</p><p><strong>Access window:</strong> 20:00 - 02:00<br><strong>Purpose:</strong> Hardware diagnostics on ENG-RACK-04<br><strong>Submitted by:</strong> WS-ENG-078 at 16:45</p><div style="background:var(--ow-accent-dim);border:1px solid var(--ow-accent-glow);border-radius:4px;padding:10px;margin-top:12px;"><strong style="color:var(--ow-accent);">ANOMALY:</strong> This request was submitted from <strong>WS-ENG-078</strong> (David Park\'s workstation), not Sarah\'s machine (WS-ENG-042). Sarah was still logged into her own workstation at 16:45.</div>' },
        { id: 'si-3', from: 'System (Auto-Forward)', to: 'sarah.chen.personal@gmail.com', subject: 'FWD: Project AURORA Status Update', date: 'Mar 12, 2026 23:55', unread: true, evidenceId: 'em-personal-fwd',
          body: '<p><em>This email was auto-forwarded to an external address.</em></p><p>--- Original Message ---</p><blockquote>From: Director Williams<br>Subject: Project AURORA Status Update<br>Date: Mar 11, 2026<br><br>Team,<br>The satellite communication protocol specifications (v4) have been finalized. All classified documents are stored on the secure share. Reminder: these are ITAR-controlled materials.</blockquote><div style="background:var(--ow-accent-dim);border:1px solid var(--ow-accent-glow);border-radius:4px;padding:10px;margin-top:12px;"><strong style="color:var(--ow-accent);">ANOMALY:</strong> This forward occurred at 23:55 on Mar 12 — but Sarah\'s VPN session ended at 18:12. The forward was triggered during David\'s RDP session on Sarah\'s workstation.</div>' },
        { id: 'si-4', from: 'Apex Defense HR', to: 'Sarah Chen', subject: 'Senior Architect Position — Offer Letter', date: 'Feb 24, 2026', unread: false,
          body: '<p>Dear Ms. Chen,</p><p>We are pleased to extend an offer for the Senior Systems Architect position at Apex Defense Solutions.</p><p>Compensation: $195,000 base + $25,000 sign-on bonus.<br>Start date: Flexible (within 60 days of acceptance).</p><p>Please respond by March 15, 2026.</p><p>This is a legitimate job offer. Sarah was actively interviewing but had not yet accepted.</p>' },
    ],
    'sarah-sent': [
        { id: 'ss-1', from: 'Sarah Chen', to: 'Director Williams', subject: 'RE: Senior Architect Position', date: 'Feb 15, 2026', unread: false, evidenceId: 'em-sarah-clean',
          body: '<p>Hi Director Williams,</p><p>I understand the decision to hire externally for the Senior Architect role. While I\'m disappointed, I remain committed to the AURORA project and the team.</p><p>I\'d appreciate being considered for the next opening.</p><p>Best,<br>Sarah</p><p style="color:var(--ow-text-dim);font-size:0.7rem;margin-top:12px;">Note: Sarah\'s sent folder contains 47 emails over 90 days. All are routine work correspondence. No unusual external contacts, no encrypted attachments, no personal forwards.</p>' },
    ],
    'david-inbox': [
        { id: 'di-1', from: '"Uncle Victor" <victor.park.consulting@proton.me>', to: 'David Park', subject: 'Family Garden', date: 'Mar 8, 2026', unread: false, evidenceId: 'em-david-coded',
          body: '<p>David,</p><p>The garden is ready for harvest. Package weighs about 40kg. Pick up arranged for Thursday at the usual spot.</p><p>Don\'t forget the special fertilizer we discussed.</p><p>- Victor</p><div style="background:var(--ow-accent-dim);border:1px solid var(--ow-accent-glow);border-radius:4px;padding:10px;margin-top:12px;"><strong style="color:var(--ow-accent);">ANALYSIS:</strong> "Uncle Victor" has no prior email history with David before Feb 18. The language is coded: "40kg" = 40GB of data. "Thursday" = Mar 12 (the exfiltration date). "Special fertilizer" = the framing tools (badge clone, browser history injection).</div>' },
        { id: 'di-2', from: '"Uncle Victor"', to: 'David Park', subject: 'RE: Family Reunion Plans', date: 'Feb 18, 2026', unread: false,
          body: '<p>David,</p><p>So glad you\'re interested in the family reunion. I\'ll visit the office on the 20th to discuss logistics in person.</p><p>Bring the blueprints of the venue so we can plan seating.</p><p>- Victor</p><p style="color:var(--ow-text-dim);font-size:0.7rem;margin-top:12px;">"Blueprints of the venue" = network architecture diagrams. This email preceded Victor\'s first visitor sign-in on Feb 20.</p>' },
        { id: 'di-3', from: 'David Park', to: 'David Park', subject: 'Backup', date: 'Feb 28, 2026', unread: false, evidenceId: 'em-david-crypto',
          body: '<p><em>Self-sent email</em></p><pre style="font-size:0.72rem;background:#0a0a14;padding:12px;border-radius:4px;">MetaMask Recovery Phrase:\nabrupt hollow verify canyon drift notable silk quantum bronze galaxy ripple obtain\n\nWallet: 0x7a3f...9e2d\nNetwork: Ethereum Mainnet\n\nDO NOT SHARE</pre><div style="background:var(--ow-accent-dim);border:1px solid var(--ow-accent-glow);border-radius:4px;padding:10px;margin-top:12px;"><strong style="color:var(--ow-accent);">FINDING:</strong> This wallet (0x7a3f...9e2d) received <strong>2.4 ETH ($8,400)</strong> on March 15 — three days after the exfiltration. Payment from wallet 0x1b2c...4d5e which traces to a known corporate espionage funding network.</div>' },
    ],
    'david-sent': [
        { id: 'ds-1', from: 'David Park', to: '"Uncle Victor"', subject: 'RE: Family Garden', date: 'Mar 10, 2026', unread: false,
          body: '<p>Victor,</p><p>Everything is set. The neighbor (the one who complains) will be out that evening — confirmed she leaves by 6. I\'ll prepare the soil and handle the planting myself.</p><p>The new fertilizer you brought on the 5th works perfectly. Tested it in a small patch — the neighbor\'s flowers look like mine now.</p><p>- David</p><p style="color:var(--ow-text-dim);font-size:0.7rem;margin-top:12px;">"Neighbor who complains" = Sarah (motive planted: passed over for promotion). "She leaves by 6" = Sarah leaves work at ~18:00. "Fertilizer from the 5th" = badge cloning tools delivered during Victor\'s Mar 5 visit. "Neighbor\'s flowers look like mine" = Sarah\'s browser history will match David\'s planted evidence.</p>' },
    ],
    'david-deleted': [
        { id: 'dd-1', from: 'DataBroker Services', to: 'David Park', subject: 'Confirmation: Order #DB-44721', date: 'Feb 16, 2026', unread: false,
          body: '<p>Thank you for your purchase.</p><p><strong>Item:</strong> HID Proxmark3 RDV4 — RFID Badge Cloner<br><strong>Ship to:</strong> David Park, 1847 Elm Street, Unit 4B<br><strong>Total:</strong> $349.99<br><strong>Payment:</strong> Bitcoin (confirmed)</p><p>Estimated delivery: Feb 19-20.</p><div style="background:var(--ow-accent-dim);border:1px solid var(--ow-accent-glow);border-radius:4px;padding:10px;margin-top:12px;"><strong style="color:var(--ow-accent);">CRITICAL:</strong> David purchased a Proxmark3 badge cloner on Feb 16 — four days before Victor\'s first visit. The device was delivered Feb 19. Victor visited Feb 20. David cloned Sarah\'s badge to gain server room access without his own badge being logged.</div>' },
    ]
};

let currentMailbox = 'sarah-inbox';

function showMailbox(id, el) {
    currentMailbox = id;
    document.querySelectorAll('.em-folder').forEach(f => f.classList.remove('active'));
    if (el) el.closest('.em-folder').classList.add('active');
    renderEmailList();
}

function renderEmailList() {
    const emails = EMAILS[currentMailbox] || [];
    const list = document.getElementById('emailList');
    list.innerHTML = emails.map(e => {
        return '<div class="em-item' + (e.unread ? ' unread' : '') + '" onclick="showEmail(\'' + currentMailbox + '\',' + emails.indexOf(e) + ')">' +
            '<div class="em-item-from">' + e.from + '</div>' +
            '<div class="em-item-subject">' + e.subject + '</div>' +
            '<div class="em-item-date">' + e.date + '</div>' +
        '</div>';
    }).join('') || '<div style="padding:20px;color:var(--ow-text-dim);font-size:0.78rem;text-align:center;">No emails in this folder.</div>';
}

function showEmail(mailbox, idx) {
    const email = EMAILS[mailbox][idx];
    if (!email) return;

    // Mark as read
    if (email.unread) {
        email.unread = false;
        renderEmailList();
        updateFolderBadges();
    }

    engine.openFile(email.id);

    // Highlight active email
    document.querySelectorAll('.em-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.em-item')[idx].classList.add('active');

    const evidence = email.evidenceId ? MoleHuntConfig.evidence[email.evidenceId] : null;
    const isPinned = email.evidenceId && engine.isEvidencePinned(email.evidenceId);

    document.getElementById('emailDetail').innerHTML = `
        <div class="em-detail-header">
            <div class="em-detail-subject">${email.subject}</div>
            <div class="em-detail-meta">
                <strong>From:</strong> ${email.from}<br>
                <strong>To:</strong> ${email.to}<br>
                <strong>Date:</strong> ${email.date}
            </div>
        </div>
        <div class="em-detail-body">${email.body}</div>
        ${evidence ? '<div class="em-pin-bar"><button class="ws-pin-btn' + (isPinned ? ' pinned' : '') + '" onclick="pinEmail(\'' + email.evidenceId + '\')">' + (isPinned ? 'Pinned' : 'Pin as Evidence') + '</button></div>' : ''}
    `;
}

function pinEmail(evidenceId) {
    if (engine.isEvidencePinned(evidenceId)) return;
    const ev = MoleHuntConfig.evidence[evidenceId];
    if (ev) engine.pinEvidence({ id: evidenceId, ...ev });
    // Refresh current view
    const activeIdx = Array.from(document.querySelectorAll('.em-item')).findIndex(i => i.classList.contains('active'));
    if (activeIdx >= 0) showEmail(currentMailbox, activeIdx);
}

function updateFolderBadges() {
    Object.keys(EMAILS).forEach(function(folder) {
        const badge = document.getElementById('badge-' + folder);
        if (!badge) return;
        const unreadCount = EMAILS[folder].filter(function(e) { return e.unread; }).length;
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    });
}

// Restore read state from engine (openedFiles tracks what's been read)
Object.values(EMAILS).forEach(function(folder) {
    folder.forEach(function(e) {
        if (engine.state.openedFiles.includes(e.id)) {
            e.unread = false;
        } else if (e.unread === undefined) {
            e.unread = true;
        }
    });
});

renderEmailList();
updateFolderBadges();
</script>

</body>
</html>
