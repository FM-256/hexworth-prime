let currentMailbox = 'sarah-inbox';

function showMailbox(id, el) {
    currentMailbox = id;
    document.querySelectorAll('.em-folder').forEach(f => f.classList.remove('active'));
    if (el) el.closest('.em-folder').classList.add('active');
    renderEmailList();
}

function renderEmailList() {
    const emails = EMAILS[currentMailbox] || [];
    const list = document.getElementById('emailList');
    list.innerHTML = emails.map(e => {
        return '<div class="em-item' + (e.unread ? ' unread' : '') + '" onclick="showEmail(\'' + currentMailbox + '\',' + emails.indexOf(e) + ')">' +
            '<div class="em-item-from">' + e.from + '</div>' +
            '<div class="em-item-subject">' + e.subject + '</div>' +
            '<div class="em-item-date">' + e.date + '</div>' +
        '</div>';
    }).join('') || '<div style="padding:20px;color:var(--ow-text-dim);font-size:0.78rem;text-align:center;">No emails in this folder.</div>';
}

function showEmail(mailbox, idx) {
    const email = EMAILS[mailbox][idx];
    if (!email) return;

    // Mark as read
    if (email.unread) {
        email.unread = false;
        renderEmailList();
        updateFolderBadges();
    }

    engine.openFile(email.id);

    // Highlight active email
    document.querySelectorAll('.em-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.em-item')[idx].classList.add('active');

    const evidence = email.evidenceId ? MoleHuntConfig.evidence[email.evidenceId] : null;
    const isPinned = email.evidenceId && engine.isEvidencePinned(email.evidenceId);

    document.getElementById('emailDetail').innerHTML = `
        <div class="em-detail-header">
            <div class="em-detail-subject">${email.subject}</div>
            <div class="em-detail-meta">
                <strong>From:</strong> ${email.from}<br>
                <strong>To:</strong> ${email.to}<br>
                <strong>Date:</strong> ${email.date}
            </div>
        </div>
        <div class="em-detail-body">${email.body}</div>
        ${evidence ? '<div class="em-pin-bar"><button class="ws-pin-btn' + (isPinned ? ' pinned' : '') + '" onclick="pinEmail(\'' + email.evidenceId + '\')">' + (isPinned ? 'Pinned' : 'Pin as Evidence') + '</button></div>' : ''}
    `;
}

function pinEmail(evidenceId) {
    if (engine.isEvidencePinned(evidenceId)) return;
    const ev = MoleHuntConfig.evidence[evidenceId];
    if (ev) engine.pinEvidence({ id: evidenceId, ...ev });
    // Refresh current view
    const activeIdx = Array.from(document.querySelectorAll('.em-item')).findIndex(i => i.classList.contains('active'));
    if (activeIdx >= 0) showEmail(currentMailbox, activeIdx);
}

function updateFolderBadges() {
    Object.keys(EMAILS).forEach(function(folder) {
        const badge = document.getElementById('badge-' + folder);
        if (!badge) return;
        const unreadCount = EMAILS[folder].filter(function(e) { return e.unread; }).length;
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    });
}

// Restore read state from engine (openedFiles tracks what's been read)
Object.values(EMAILS).forEach(function(folder) {
    folder.forEach(function(e) {
        if (engine.state.openedFiles.includes(e.id)) {
            e.unread = false;
        } else if (e.unread === undefined) {
            e.unread = true;
        }
    });
});

renderEmailList();
updateFolderBadges();
</script>
