var currentChannel = 'dev-chat';

function showChannel(id, el) {
    currentChannel = id;
    document.querySelectorAll('.dc-channel').forEach(function(c) { c.classList.remove('active'); });
    if (el) el.classList.add('active');
    renderMessages();
    document.getElementById('channelName').textContent = id.startsWith('dm-') ? 'DM: ' + id.replace('dm-', '') : '# ' + id;
}

function renderMessages() {
    var msgs = CHANNELS[currentChannel] || [];
    document.getElementById('messageArea').innerHTML = msgs.map(function(m, i) {
        if (m.system) return '<div class="dc-msg-system">' + m.text + '</div>';
        var cls = m.deleted ? 'dc-msg dc-msg-deleted' : 'dc-msg';
        var tag = m.tag ? ' <span class="dc-user-tag">' + m.tag + '</span>' : '';
        var pin = m.evidenceId ? '<div style="margin-top:4px;cursor:pointer;font-size:0.6rem;color:var(--ow-accent);" onclick="pinMsg(\'' + m.evidenceId + '\')">[Pin as Evidence]</div>' : '';
        var delNote = m.deleted ? '<div style="font-size:0.6rem;color:var(--ow-accent);margin-top:2px;">[This message was deleted by the author]</div>' : '';
        engine.openFile('dc-' + currentChannel + '-' + i);
        return '<div class="' + cls + '">' +
            '<div class="dc-msg-author" style="color:' + m.color + ';">' + m.author + tag + '<span class="dc-msg-time">' + m.time + '</span></div>' +
            '<div class="dc-msg-text">' + m.text + '</div>' +
            delNote + pin +
        '</div>';
    }).join('');
}

function pinMsg(evidenceId) {
    if (!evidenceId || engine.isEvidencePinned(evidenceId)) return;
    var ev = DeadDropConfig.evidence[evidenceId];
    if (ev) {
        engine.pinEvidence({ id: evidenceId, ...ev });
        engine.openFile(evidenceId);
    }
}
