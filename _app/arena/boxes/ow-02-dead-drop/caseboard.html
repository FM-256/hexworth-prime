<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseBoard — CTF Arena</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-table.webp">
    <link rel="stylesheet" href="shared.css">
    <style>
        .cb-layout { display: flex; gap: 0; min-height: calc(100vh - 50px); }
        .cb-sidebar { width: 280px; background: var(--ow-surface); border-right: 1px solid var(--ow-border); overflow-y: auto; padding: 12px; flex-shrink: 0; }
        .cb-main { flex: 1; padding: 16px; overflow-y: auto; }
        .cb-section-title { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ow-text-dim); padding: 8px 0 6px; border-bottom: 1px solid var(--ow-border); margin-bottom: 8px; }
        .cb-evidence-mini { padding: 8px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 0.68rem; cursor: pointer; border: 1px solid var(--ow-border); transition: border-color 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .cb-evidence-mini:hover { border-color: var(--ow-border-bright); }
        .cb-evidence-mini .cb-src { font-size: 0.55rem; padding: 1px 4px; border-radius: 2px; }

        /* Connection cards */
        .cb-connections { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .cb-conn { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 8px; padding: 14px; }
        .cb-conn.found { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.04); }
        .cb-conn.locked { opacity: 0.7; border-style: dashed; }
        .cb-conn-ev-tag.need { color: var(--ow-amber); border-color: rgba(245,158,11,0.35); border-style: dashed; }
        .cb-conn-label { font-size: 0.78rem; font-weight: bold; color: var(--ow-text-bright); margin-bottom: 6px; }
        .cb-conn-desc { font-size: 0.7rem; color: var(--ow-text-dim); margin-bottom: 8px; }
        .cb-conn-evidence { display: flex; gap: 6px; flex-wrap: wrap; }
        .cb-conn-ev-tag { font-size: 0.6rem; padding: 2px 6px; border-radius: 3px; background: var(--ow-surface-2); border: 1px solid var(--ow-border); color: var(--ow-text-dim); }
        .cb-conn-ev-tag.has { background: rgba(34,197,94,0.12); color: #86efac; border-color: rgba(34,197,94,0.3); }
        .cb-conn-btn { padding: 6px 12px; font-size: 0.68rem; background: rgba(34,197,94,0.12); color: var(--ow-green); border: 1px solid rgba(34,197,94,0.3); border-radius: 4px; cursor: pointer; font-family: var(--ow-font); margin-top: 8px; }
        .cb-conn-btn:hover { background: rgba(34,197,94,0.2); }
        .cb-conn-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Progress */
        .cb-progress { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 8px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .cb-progress-count { font-size: 2rem; font-weight: bold; color: var(--ow-accent); }
        .cb-progress-label { font-size: 0.7rem; color: var(--ow-text-dim); }
    </style>
</head>
<body>
<h1 class="visually-hidden">CaseBoard</h1>

<script src="../../engine/OpenWorldEngine.js"></script>
<script src="config-shared.js"></script>
<script>
    DeadDropConfig.activePage = 'caseboard';
    const engine = new OpenWorldEngine(DeadDropConfig);
    engine.init();
</script>

<div class="cb-layout">
    <!-- Sidebar: Pinned Evidence -->
    <div class="cb-sidebar">
        <div class="cb-section-title">Pinned Evidence</div>
        <div id="pinnedList"></div>
        <div id="pinnedEmpty" style="color:var(--ow-text-dim);font-size:0.7rem;padding:10px;text-align:center;">
            No evidence pinned yet. Visit devices to find and pin evidence.
        </div>
    </div>

    <!-- Main: Connections -->
    <div class="cb-main">
        <div class="cb-progress">
            <div class="cb-progress-count" id="connProgress">0 / 8</div>
            <div class="cb-progress-label">Key Connections Identified</div>
            <div class="ow-progress-bar" style="max-width:300px;margin:8px auto;">
                <div class="ow-progress-fill" id="connBar" style="width:0%"></div>
            </div>
        </div>

        <div class="cb-section-title">Key Connections</div>
        <div class="cb-connections" id="connList"></div>
    </div>
</div>

<script>
/* ── Connection Definitions ──────────────────────── */
const CONNECTIONS = [
    { id: 'conn-exploit', label: 'Exploit Vector', desc: 'The _beforeTokenTransfer hook in PR #847 creates a reentrancy vector \u2014 withdraw() sends ETH before updating balances.', requires: ['sc-vuln-pr', 'sc-reentrancy'], requireLabels: ['Malicious PR #847', 'Reentrancy in withdraw()'] },
    { id: 'conn-audit-complicity', label: 'Audit Complicity', desc: 'The auditor who signed off on PR #847 rated the vulnerable function as "Low Risk." The auditor is the attacker.', requires: ['sc-audit-report', 'sc-vuln-pr'], requireLabels: ['Audit Report', 'Malicious PR #847'] },
    { id: 'conn-fund-origin', label: 'Fund Flow Origin', desc: 'The attack TX drained 4,200 ETH, which moved through 6 hop wallets before entering Tornado Cash.', requires: ['bx-attack-tx', 'bx-mixer-entry'], requireLabels: ['Attack Transaction', 'Tornado Cash Deposits'] },
    { id: 'conn-mixer-timing', label: 'Mixer Timing Correlation', desc: 'All 42 Tornado Cash withdrawals separated by exactly 73 minutes \u2014 automated script, not manual.', requires: ['mx-timing', 'bx-mixer-exit'], requireLabels: ['73-Minute Pattern', 'Tornado Cash Withdrawals'] },
    { id: 'conn-exchange-endpoint', label: 'Exchange Cash-Out', desc: 'All 42 mixer exits deposited to a single Kraken account registered to "Marcus Webb."', requires: ['bx-mixer-exit', 'bx-exchange-dest'], requireLabels: ['Mixer Exits', 'Exchange Deposit Wallet'] },
    { id: 'conn-identity', label: 'Identity Link', desc: 'KYC name "Marcus Webb" is a one-letter variant of auditor "Marcus Weber." Discord profile confirms the match.', requires: ['ex-kyc-name', 'dc-username-match'], requireLabels: ['KYC Identity', 'Discord Username Match'] },
    { id: 'conn-ip-match', label: 'IP Correlation', desc: 'Exchange account accessed from the same VPN IP range as BlockShield Security office network.', requires: ['ex-login-ip', 'sc-audit-report'], requireLabels: ['Exchange Login IP', 'BlockShield Audit Report'] },
    { id: 'conn-premeditation', label: 'Premeditation', desc: 'The auditor asked about reentrancy guards in Discord 3 days before submitting the PR containing the exploit.', requires: ['dc-reentrancy-q', 'sc-vuln-pr'], requireLabels: ['Discord Reentrancy Question', 'Malicious PR #847'] }
];

function renderPinned() {
    const pinned = engine.state.pinnedEvidence;
    const list = document.getElementById('pinnedList');
    const empty = document.getElementById('pinnedEmpty');

    if (pinned.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    const srcColors = {
        workstation: 'ow-src-workstation',
        email: 'ow-src-email',
        badge: 'ow-src-badge',
        siem: 'ow-src-siem',
        hr: 'ow-src-hr'
    };

    list.innerHTML = pinned.map(ev => {
        const cls = srcColors[ev.source] || '';
        return '<div class="cb-evidence-mini">' +
            '<span>' + engine._esc(ev.title) + '</span>' +
            '<span class="cb-src ' + cls + '">' + (ev.source || '').toUpperCase() + '</span>' +
        '</div>';
    }).join('');
}

function renderConnections() {
    const found = engine.state.connections.map(c => c.id);
    const pinned = engine.state.pinnedEvidence.map(e => e.id);

    // All eight show (operator, 2026-11-12: a connection that stayed invisible until both pins were
    // in left students stuck below 8 / 8 with no clue). A locked card gives a LIGHT hint only: its
    // short name, the pieces already pinned, and for each missing piece just the page it is on,
    // never which item. The description and the Confirm button appear once both pieces are pinned.
    const visible = CONNECTIONS;

    {
        /* every connection always shows (locked, ready or confirmed), so there is no empty state */
        document.getElementById('connList').innerHTML = visible.map(conn => {
            const isFound = found.includes(conn.id);
            if (!isFound && !conn.requires.every(r => pinned.includes(r))) { return lockedCard(conn, pinned); }
            return '<div class="cb-conn' + (isFound ? ' found' : '') + '">' +
                '<div class="cb-conn-label">' +
                    (isFound ? '<img src="/assets/images/icons/icon-checkmark.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px;">' : '<img src="/assets/images/icons/icon-warning.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px;opacity:0.6;">') +
                    engine._esc(conn.label) +
                '</div>' +
                '<div class="cb-conn-desc">' + engine._esc(conn.desc) + '</div>' +
                '<div class="cb-conn-evidence">' +
                    conn.requires.map((r, i) => '<span class="cb-conn-ev-tag has">' + conn.requireLabels[i] + '</span>').join('') +
                '</div>' +
                (isFound ? '<div style="color:var(--ow-green);font-size:0.7rem;margin-top:6px;font-weight:bold;">CONNECTION CONFIRMED</div>' + getDeliveredFlagHtml(conn.id) :
                 '<button class="cb-conn-btn" onclick="makeConnection(\'' + conn.id + '\')">Confirm Connection</button>') +
            '</div>';
        }).join('');
    }

    // Update progress
    document.getElementById('connProgress').textContent = found.length + ' / 8';
    document.getElementById('connBar').style.width = (found.length / 8 * 100) + '%';
}

/* Where an item's pin actually is, when that differs from the evidence's `source` (which labels what
   the evidence is about, shown in the sidebar). The exchange destination is evidence ABOUT the
   exchange but is pinned on the Fund Flow page. ow-flag-delivery.test.js checks every hint. */
const PIN_PAGE = { 'bx-exchange-dest': 'mixer' };

/* A connection not yet unlocked: its name, what is pinned, and the page each missing piece is on. */
function lockedCard(conn, pinned) {
    const pageLabel = (id) => { const pg = (DeadDropConfig.pages || []).find(p => p.id === id); return pg ? pg.label : 'another device'; };
    const tags = conn.requires.map((r, i) => {
        if (pinned.includes(r)) { return '<span class="cb-conn-ev-tag has">' + engine._esc(conn.requireLabels[i]) + '</span>'; }
        const ev = DeadDropConfig.evidence[r];
        return '<span class="cb-conn-ev-tag need">Still needed: something on ' + engine._esc(pageLabel(PIN_PAGE[r] || (ev && ev.source))) + '</span>';
    }).join('');
    return '<div class="cb-conn locked">' +
        '<div class="cb-conn-label"><img src="/assets/images/icons/icon-lock.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px;">' +
            engine._esc(conn.label) + ' <span style="font-weight:normal;color:var(--ow-text-dim);">(locked)</span></div>' +
        '<div class="cb-conn-evidence">' + tags + '</div>' +
    '</div>';
}

function getDeliveredFlagHtml(connId) {
    var flagConns = DeadDropConfig.flagConnections || {};
    var flagId = flagConns[connId];
    if (!flagId) return '';
    var delivered = engine.state.deliveredFlags && engine.state.deliveredFlags[flagId];
    if (delivered) {
        return '<div style="background:#060610;border:1px solid rgba(34,197,94,0.3);border-radius:4px;padding:8px 10px;margin-top:8px;font-family:Consolas,monospace;font-size:0.78rem;color:var(--ow-green);word-break:break-all;">' + delivered + '</div><div style="font-size:0.6rem;color:var(--ow-text-dim);margin-top:4px;">Copy this flag and submit it on the Hub page.</div>';
    }
    /* why it is not here yet: the engine records the reason once a request has finished */
    var why = engine.getFlagStatus(flagId);
    var msg = why === 'signin' ? 'Sign in to Hexworth to receive this flag, then reload this page.'
        : why === 'refused' ? 'The server did not release this flag. Ask your instructor.'
        : why === 'error' ? 'Could not reach the server. Reload this page to try again.'
        : 'Flag loading from server...';
    return '<div style="color:var(--ow-amber);font-size:0.65rem;margin-top:6px;">' + msg + '</div>';
}

async function makeConnection(connId) {
    var conn = CONNECTIONS.find(function(c) { return c.id === connId; });
    if (!conn) return;
    var configConn = DeadDropConfig.connections.find(function(c) { return c.id === connId; });
    if (configConn) { engine.addConnection(configConn); }
    var flagConns = DeadDropConfig.flagConnections || {};
    var flagId = flagConns[connId];
    if (flagId) { await engine.requestFlag(flagId); }
    renderConnections();
}

// Initial render
renderPinned();
renderConnections();

// Cross-page sync
window.onOpenWorldStateChange = function() {
    renderPinned();
    renderConnections();
};
</script>

</body>
</html>
