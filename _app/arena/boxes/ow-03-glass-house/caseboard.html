<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseBoard — CTF Arena</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-table.webp">
    <link rel="stylesheet" href="shared.css">
    <style>
        .cb-layout { display: flex; gap: 0; min-height: calc(100vh - 50px); }
        .cb-sidebar { width: 280px; background: var(--ow-surface); border-right: 1px solid var(--ow-border); overflow-y: auto; padding: 12px; flex-shrink: 0; }
        .cb-main { flex: 1; padding: 16px; overflow-y: auto; }
        .cb-section-title { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ow-text-dim); padding: 8px 0 6px; border-bottom: 1px solid var(--ow-border); margin-bottom: 8px; }
        .cb-evidence-mini { padding: 8px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 0.68rem; cursor: pointer; border: 1px solid var(--ow-border); transition: border-color 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .cb-evidence-mini:hover { border-color: var(--ow-border-bright); }
        .cb-evidence-mini .cb-src { font-size: 0.55rem; padding: 1px 4px; border-radius: 2px; }

        /* Connection cards */
        .cb-connections { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .cb-conn { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 8px; padding: 14px; }
        .cb-conn.found { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.04); }
        .cb-conn.locked { opacity: 0.4; }
        .cb-conn-label { font-size: 0.78rem; font-weight: bold; color: var(--ow-text-bright); margin-bottom: 6px; }
        .cb-conn-desc { font-size: 0.7rem; color: var(--ow-text-dim); margin-bottom: 8px; }
        .cb-conn-evidence { display: flex; gap: 6px; flex-wrap: wrap; }
        .cb-conn-ev-tag { font-size: 0.6rem; padding: 2px 6px; border-radius: 3px; background: var(--ow-surface-2); border: 1px solid var(--ow-border); color: var(--ow-text-dim); }
        .cb-conn-ev-tag.has { background: rgba(34,197,94,0.12); color: #86efac; border-color: rgba(34,197,94,0.3); }
        .cb-conn-btn { padding: 6px 12px; font-size: 0.68rem; background: rgba(34,197,94,0.12); color: var(--ow-green); border: 1px solid rgba(34,197,94,0.3); border-radius: 4px; cursor: pointer; font-family: var(--ow-font); margin-top: 8px; }
        .cb-conn-btn:hover { background: rgba(34,197,94,0.2); }
        .cb-conn-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Progress */
        .cb-progress { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 8px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .cb-progress-count { font-size: 2rem; font-weight: bold; color: var(--ow-accent); }
        .cb-progress-label { font-size: 0.7rem; color: var(--ow-text-dim); }
    </style>
</head>
<body>
<h1 class="visually-hidden">CaseBoard</h1>

<script src="../../engine/OpenWorldEngine.js"></script>
<script src="config-shared.js"></script>
<script>
    GlassHouseConfig.activePage = 'caseboard';
    const engine = new OpenWorldEngine(GlassHouseConfig);
    engine.init();
</script>

<div class="cb-layout">
    <!-- Sidebar: Pinned Evidence -->
    <div class="cb-sidebar">
        <div class="cb-section-title">Pinned Evidence</div>
        <div id="pinnedList"></div>
        <div id="pinnedEmpty" style="color:var(--ow-text-dim);font-size:0.7rem;padding:10px;text-align:center;">
            No evidence pinned yet. Visit devices to find and pin evidence.
        </div>
    </div>

    <!-- Main: Connections -->
    <div class="cb-main">
        <div class="cb-progress">
            <div class="cb-progress-count" id="connProgress">0 / 7</div>
            <div class="cb-progress-label">Key Connections Identified</div>
            <div class="ow-progress-bar" style="max-width:300px;margin:8px auto;">
                <div class="ow-progress-fill" id="connBar" style="width:0%"></div>
            </div>
        </div>

        <div class="cb-section-title">Key Connections</div>
        <div class="cb-connections" id="connList"></div>
    </div>
</div>

<script>
/* ── Connection Definitions ──────────────────────── */
const CONNECTIONS = [
    { id: 'conn-anomaly', label: 'Side Channel Identified', desc: 'Zone 3 fan speed oscillations encode binary data via acoustic modulation. The hvac_mod.py script generates the pattern.', requires: ['bms-zone3-anomaly', 'ws-b-hvac-script'], requireLabels: ['Zone 3 Fan Anomaly', 'hvac_mod.py Script'] },
    { id: 'conn-source', label: 'BACnet Command Source', desc: 'Unauthorized BACnet Write commands to Zone 3 controller originate from the facilities workstation, not the BMS server.', requires: ['net-bacnet-cmds', 'ws-b-bacnet-tools'], requireLabels: ['BACnet Write Commands', 'BACnet Tools Installed'] },
    { id: 'conn-tool', label: 'Exfiltration Tool Chain', desc: 'hvac_mod.py encodes files as fan speed patterns. Bash history shows it was run on 4 research files.', requires: ['ws-b-hvac-script', 'ws-b-bash-history'], requireLabels: ['hvac_mod.py', 'Bash History'] },
    { id: 'conn-physical', label: 'Firmware Modification', desc: 'Suspect B entered HVAC mechanical room at 2 AM and flashed modified firmware on Zone 3 controller.', requires: ['cam-hvac-room', 'bms-firmware-time'], requireLabels: ['HVAC Room Camera', 'Firmware Timestamp'] },
    { id: 'conn-receiver', label: 'Acoustic Receiver', desc: 'Competitor vehicle parked near HVAC exhaust vent with directional microphone during exfiltration sessions.', requires: ['cam-competitor', 'bms-zone3-anomaly'], requireLabels: ['Competitor Vehicle', 'Zone 3 Fan Anomaly'] },
    { id: 'conn-firmware', label: 'Controller Tampered', desc: 'Zone 3 controller firmware hash differs from factory. Modified during the 2 AM mechanical room visit.', requires: ['bms-firmware-hash', 'cam-hvac-room'], requireLabels: ['Firmware Hash Mismatch', 'HVAC Room Camera'] },
    { id: 'conn-clean', label: 'Suspect A Cleared', desc: 'Lab Director activity is verified legitimate research. USB backups are encrypted and policy-compliant.', requires: ['ws-a-clean', 'ws-a-late-nights'], requireLabels: ['Workstation Clean', 'Late Nights Verified'] }
];

function renderPinned() {
    const pinned = engine.state.pinnedEvidence;
    const list = document.getElementById('pinnedList');
    const empty = document.getElementById('pinnedEmpty');

    if (pinned.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    const srcColors = {
        workstation: 'ow-src-workstation',
        email: 'ow-src-email',
        badge: 'ow-src-badge',
        siem: 'ow-src-siem',
        hr: 'ow-src-hr'
    };

    list.innerHTML = pinned.map(ev => {
        const cls = srcColors[ev.source] || '';
        return '<div class="cb-evidence-mini">' +
            '<span>' + engine._esc(ev.title) + '</span>' +
            '<span class="cb-src ' + cls + '">' + (ev.source || '').toUpperCase() + '</span>' +
        '</div>';
    }).join('');
}

function renderConnections() {
    const found = engine.state.connections.map(c => c.id);
    const pinned = engine.state.pinnedEvidence.map(e => e.id);

    // Only show connections where BOTH required evidence items are pinned (or already confirmed)
    const visible = CONNECTIONS.filter(conn => {
        if (found.includes(conn.id)) return true; // Already confirmed — always show
        return conn.requires.every(r => pinned.includes(r)); // Both pieces pinned — reveal
    });

    if (visible.length === 0) {
        document.getElementById('connList').innerHTML =
            '<div class="ow-card" style="text-align:center;padding:40px 20px;">' +
                '<img src="/assets/images/icons/icon-radar.webp" alt="" width="28" height="28" style="opacity:0.3;margin-bottom:8px;display:block;margin:0 auto 8px;">' +
                '<div style="color:var(--ow-text-dim);font-size:0.78rem;">No connections discovered yet.</div>' +
                '<div style="color:var(--ow-text-dim);font-size:0.68rem;margin-top:6px;">Pin related evidence from different devices. When two pieces of evidence are connected, a pattern will appear here.</div>' +
            '</div>';
    } else {
        document.getElementById('connList').innerHTML = visible.map(conn => {
            const isFound = found.includes(conn.id);
            return '<div class="cb-conn' + (isFound ? ' found' : '') + '">' +
                '<div class="cb-conn-label">' +
                    (isFound ? '<img src="/assets/images/icons/icon-checkmark.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px;">' : '<img src="/assets/images/icons/icon-warning.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px;opacity:0.6;">') +
                    engine._esc(conn.label) +
                '</div>' +
                '<div class="cb-conn-desc">' + engine._esc(conn.desc) + '</div>' +
                '<div class="cb-conn-evidence">' +
                    conn.requires.map((r, i) => '<span class="cb-conn-ev-tag has">' + conn.requireLabels[i] + '</span>').join('') +
                '</div>' +
                (isFound ? '<div style="color:var(--ow-green);font-size:0.7rem;margin-top:6px;font-weight:bold;">CONNECTION CONFIRMED</div>' :
                 '<button class="cb-conn-btn" onclick="makeConnection(\'' + conn.id + '\')">Confirm Connection</button>') +
            '</div>';
        }).join('');
    }

    // Update progress
    document.getElementById('connProgress').textContent = found.length + ' / 7';
    document.getElementById('connBar').style.width = (found.length / 7 * 100) + '%';
}

function makeConnection(connId) {
    const conn = CONNECTIONS.find(c => c.id === connId);
    if (!conn) return;
    const configConn = GlassHouseConfig.connections.find(c => c.id === connId);
    if (configConn) {
        engine.addConnection(configConn);
    }
    renderConnections();
}

// Initial render
renderPinned();
renderConnections();

// Cross-page sync
window.onOpenWorldStateChange = function() {
    renderPinned();
    renderConnections();
};
</script>

</body>
</html>
