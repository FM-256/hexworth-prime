<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OSINT — Operation Burned Source</title><link rel="icon" type="image/webp" href="/assets/images/icons/icon-globe.webp"><link rel="stylesheet" href="shared.css"></head>
<body>
<h1 class="visually-hidden">Operation Burned Source — OSINT Dashboard</h1>
<script src="../../engine/OpenWorldEngine.js"></script><script src="config-shared.js"></script>
<script>BurnedSourceConfig.activePage = 'osint'; const engine = new OpenWorldEngine(BurnedSourceConfig); engine.init();</script>

<div class="ow-content">
    <div class="ow-section-label">Open Source Intelligence Dashboard</div>

    <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input type="text" id="osintSearch" placeholder="Search records... (e.g. Rodriguez, Torres, Vargas, property, 34.1598)" style="flex:1;padding:8px 12px;background:#060610;border:1px solid var(--ow-border-bright);border-radius:4px;color:var(--ow-text);font-family:var(--ow-font);font-size:0.78rem;outline:none;">
        <button onclick="searchOsint()" style="padding:8px 14px;background:var(--ow-accent-dim);color:var(--ow-accent);border:1px solid var(--ow-accent-glow);border-radius:4px;font-family:var(--ow-font);font-size:0.72rem;cursor:pointer;">Search</button>
    </div>

    <div id="osintResults"></div>
</div>

<script>
var RECORDS = [
    { id: 'os-property-record', category: 'Property Records', title: 'Property: 34.1598 N, 118.6342 W — Malibu Lake Area', evidenceId: 'os-property-record',
      body: '<strong>Address:</strong> 28847 Lake Vista Drive, Malibu, CA 90265<br><strong>Owner:</strong> Maria Torres (individual)<br><strong>Purchase Date:</strong> June 14, 2022<br><strong>Purchase Price:</strong> $1,200,000<br><strong>Current Assessment:</strong> $1,350,000<br><strong>Lot Size:</strong> 0.82 acres<br><strong>Structure:</strong> 3,200 sq ft, 4BR/3BA, built 2018<br><strong>Features:</strong> Private dock, lake access<br><br><strong>Note:</strong> Maria Torres is the maiden name of Maria Rodriguez, wife of DEA Agent Miguel Rodriguez (marriage certificate: LA County, 2015).' },

    { id: 'os-wife-company', category: 'Business Records', title: 'Torres Consulting LLC — California Corporation', evidenceId: 'os-wife-company',
      body: '<strong>Entity:</strong> Torres Consulting LLC<br><strong>State:</strong> California (C4821739)<br><strong>Registered Agent:</strong> Maria Torres<br><strong>Filed:</strong> January 10, 2021<br><strong>Status:</strong> Active<br><strong>Principal Address:</strong> 28847 Lake Vista Drive, Malibu, CA<br><strong>Business Type:</strong> Management Consulting<br><br><strong>Financial Records (public filings):</strong><br>2021 Revenue: $180,000<br>2022 Revenue: $420,000<br>2023 Revenue: $890,000<br>2024 Revenue: $1,150,000<br>2025 Revenue: $2,100,000<br><br><strong>Largest Client:</strong> Grupo Vargas LLC — $2,100,000 in 2025 alone (100% of revenue)<br><br><em style="color:var(--ow-accent);">A consulting company with a single client that represents 100% of revenue is a strong indicator of a pass-through entity.</em>' },

    { id: 'os-vargas', category: 'Business Records', title: 'Grupo Vargas LLC — Florida Corporation',
      body: '<strong>Entity:</strong> Grupo Vargas LLC<br><strong>State:</strong> Florida<br><strong>Filed:</strong> March 2019<br><strong>Registered Agent:</strong> International Legal Associates (shell company service)<br><strong>Principal:</strong> Alejandro Vargas Mendoza<br><strong>Status:</strong> Active<br><br><strong>DEA Intelligence Assessment:</strong> Grupo Vargas is a known front company for the Vargas-Mendoza cartel organization. Under active investigation by DEA, FBI, and IRS-CI. The company conducts import/export operations used to launder drug proceeds.<br><br><em style="color:var(--ow-text-dim);">This is the cartel entity that Elena\'s article connects to Agent Rodriguez through Torres Consulting.</em>' },

    { id: 'os-rodriguez-linkedin', category: 'Social Media', title: 'LinkedIn: Miguel Rodriguez — DEA Special Agent',
      body: '<strong>Name:</strong> Miguel Rodriguez<br><strong>Title:</strong> Special Agent, Drug Enforcement Administration<br><strong>Location:</strong> Los Angeles, CA<br><strong>Experience:</strong><br>- DEA Special Agent, LA Field Division (2018 - Present)<br>- DEA Intelligence Analyst, San Diego (2014 - 2018)<br>- US Army Intelligence, 3rd Special Forces Group (2008 - 2014)<br><br><strong>Education:</strong> BS Criminal Justice, San Diego State University<br><strong>Connections:</strong> 487<br><br><em style="color:var(--ow-text-dim);">Profile is public. No posts or articles. Military and intel background.</em>' },

    { id: 'os-rodriguez-disclosure', category: 'Financial Disclosure', title: 'Rodriguez Financial Disclosure — OGE Form 278e',
      body: '<strong>Employee:</strong> Miguel Rodriguez, GS-13<br><strong>Agency:</strong> DEA<br><strong>Filing Year:</strong> 2025<br><br><strong>Assets Reported:</strong><br>- Bank of America checking: $5,001-$15,000<br>- Vanguard 401(k): $50,001-$100,000<br>- Primary residence: $350,000-$500,000<br><br><strong>Spouse Assets:</strong><br>- Torres Consulting LLC: "Consulting income" — Amount: "Over $1,000"<br><br><strong>NOT REPORTED:</strong><br>- Lake house property ($1.2M) — owned under wife\'s maiden name<br>- Belize offshore account (found in Elena\'s Tor research)<br>- Consulting revenue from Grupo Vargas ($2.1M in 2025 alone)<br><br><em style="color:var(--ow-accent);">Rodriguez significantly underreported his household assets. The $1.2M lake house and $2.1M consulting revenue are not disclosed. This is a federal crime (18 USC 1001).</em>' },

    // Red herring
    { id: 'rh-ex', category: 'Court Records', title: 'Restraining Order: Vasquez v. Donovan (2024)', evidenceId: 'rh-ex-boyfriend',
      body: '<strong>Case:</strong> LASC Case No. 24STRO04521<br><strong>Petitioner:</strong> Elena Vasquez<br><strong>Respondent:</strong> Ryan Donovan (ex-boyfriend)<br><strong>Filed:</strong> August 12, 2024<br><strong>Status:</strong> Granted (expires August 2025 — already expired)<br><br><strong>Alibi Check:</strong> Ryan Donovan was in New York City from March 3-8, 2026 (confirmed by Delta Air Lines flight records, JFK hotel reservation, and credit card charges at Manhattan restaurants).<br><br><em style="color:var(--ow-text-dim);">Donovan is not a suspect. He was 2,800 miles away during Elena\'s disappearance.</em>' },

    // Noise
    { id: 'os-elena-social', category: 'Social Media', title: 'Elena Vasquez — Twitter/X Profile',
      body: '<strong>Handle:</strong> @ElenaVasquezNT<br><strong>Followers:</strong> 12,400<br><strong>Last Post:</strong> March 4, 2026 — "Big story coming. Stay tuned."<br><strong>Bio:</strong> "Investigative journalist @NationalTribune. Corruption. Finance. Accountability."<br><br>No posts after March 4. No DMs of evidentiary value (checked with warrant).' },

    { id: 'os-marina-info', category: 'Public Records', title: 'Marina del Rey — Pier 7 Information',
      body: '<strong>Location:</strong> 33.9803 N, 118.4517 W<br><strong>Operator:</strong> County of Los Angeles, Dept. of Beaches & Harbors<br><strong>Pier 7:</strong> Private yacht berths, 42 slips, gate-controlled access<br><strong>Security:</strong> CCTV (4 cameras), gate access log, harbor patrol presence 20:00-06:00<br><br><strong>Note:</strong> CCTV footage for March 5 has been requested via subpoena. Harbor patrol log shows no incidents reported that night — but patrol was at Pier 12 (opposite end) during the 21:30-22:15 window.' },
];

function searchOsint() {
    var q = document.getElementById('osintSearch').value.trim().toLowerCase();
    var filtered = q ? RECORDS.filter(function(r) { return r.title.toLowerCase().includes(q) || r.body.toLowerCase().includes(q) || r.category.toLowerCase().includes(q); }) : RECORDS;
    renderRecords(filtered);
}

function renderRecords(records) {
    document.getElementById('osintResults').innerHTML = records.map(function(r) {
        var isPinned = r.evidenceId && engine.isEvidencePinned(r.evidenceId);
        return '<div class="ow-card" style="margin-bottom:12px;">' +
            '<div style="font-size:0.6rem;color:var(--ow-text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">' + r.category + '</div>' +
            '<div class="ow-card-title">' + r.title + '</div>' +
            '<div style="font-size:0.72rem;color:var(--ow-text);line-height:1.6;margin-top:8px;">' + r.body + '</div>' +
            (r.evidenceId ? '<div style="margin-top:8px;cursor:pointer;font-size:0.65rem;color:' + (isPinned ? 'var(--ow-green)' : 'var(--ow-accent)') + ';" onclick="pin(\'' + r.evidenceId + '\')">[' + (isPinned ? 'PINNED' : 'Pin as Evidence') + ']</div>' : '') +
        '</div>';
    }).join('') || '<div style="padding:30px;text-align:center;color:var(--ow-text-dim);">No records match your search.</div>';
}

function pin(evidenceId) {
    if (!evidenceId || engine.isEvidencePinned(evidenceId)) return;
    var ev = BurnedSourceConfig.evidence[evidenceId];
    if (ev) { engine.pinEvidence({ id: evidenceId, ...ev }); engine.openFile(evidenceId); searchOsint(); }
}

document.getElementById('osintSearch').addEventListener('keydown', function(e) { if (e.key === 'Enter') searchOsint(); });
renderRecords(RECORDS);
</script>
</body>
</html>
