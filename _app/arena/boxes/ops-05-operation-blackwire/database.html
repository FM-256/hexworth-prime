    /* ── SQL Parser ─────────────────────────────────────── */

    function _executeSql(query) {
        const q = query.trim().replace(/;$/, '').trim();
        const qUp = q.toUpperCase();

        // \dt — list tables
        if (q === '\\dt' || q === '\\dt+') {
            return _formatTable(
                ['Schema', 'Name', 'Type', 'Owner'],
                [
                    ['public', 'employees', 'table', 'postgres'],
                    ['hr', 'employees', 'table', 'postgres'],
                    ['projects', 'classified', 'table', 'postgres'],
                    ['projects', 'contracts', 'table', 'postgres'],
                    ['staging', 'exfil_manifest', 'table', 'postgres'],
                    ['staging', 'exfil_log', 'table', 'postgres'],
                    ['staging', 'exfil_queue', 'table', 'postgres']
                ]
            );
        }

        // \dn — list schemas
        if (q === '\\dn') {
            return _formatTable(
                ['Name', 'Owner'],
                [
                    ['public', 'postgres'],
                    ['hr', 'postgres'],
                    ['projects', 'postgres'],
                    ['staging', 'postgres'],
                    ['auth', 'postgres'],
                    ['security', 'postgres'],
                    ['infrastructure', 'postgres']
                ]
            );
        }

        // \df — list functions
        if (q === '\\df' || q === '\\df+') {
            const funcs = Object.entries(_db._procedures).map(([name, proc]) => [
                proc.schema, name, proc.returns, proc.language
            ]);
            return _formatTable(['Schema', 'Name', 'Result', 'Language'], funcs);
        }

        // \sf — show function source
        if (q.startsWith('\\sf ') || q.startsWith('\\sf\t')) {
            const funcName = q.substring(3).trim();
            const proc = _db._procedures[funcName];
            if (!proc) return 'ERROR: function "' + funcName + '" does not exist';
            return 'CREATE OR REPLACE FUNCTION ' + proc.schema + '.' + funcName + '()\n' +
                   ' RETURNS ' + proc.returns + '\n' +
                   ' LANGUAGE ' + proc.language + '\nAS $$\n' +
                   proc.source + '\n$$;';
        }

        // \d [table] — describe table
        if (q.startsWith('\\d ') || q.startsWith('\\d\t')) {
            const tableName = q.substring(2).trim();
            const table = _findTable(tableName);
            if (!table) return 'Did not find any relation named "' + tableName + '".';
            return _formatTable(
                ['Column', 'Type', 'Nullable'],
                table.columns.map(c => [c, _inferType(c), 'YES'])
            );
        }

        // SELECT queries
        if (qUp.startsWith('SELECT')) {
            return _handleSelect(q);
        }

        // SHOW / SET
        if (qUp.startsWith('SHOW')) {
            if (qUp.includes('SEARCH_PATH')) return ' search_path\n--------------\n public';
            if (qUp.includes('SERVER_VERSION')) return ' server_version\n-----------------\n 15.4';
            return 'ERROR: unrecognized configuration parameter';
        }

        // Help
        if (q === '\\?' || q === '\\help' || q === 'help') {
            return 'PostgreSQL Commands:\n' +
                   '  \\dt          List all tables\n' +
                   '  \\dn          List schemas\n' +
                   '  \\d [table]   Describe table columns\n' +
                   '  \\df          List stored procedures/functions\n' +
                   '  \\sf [func]   Show function source code\n' +
                   '  SELECT ...   Execute SQL query\n' +
                   '  \\?           Show this help';
        }

        return 'ERROR: syntax error at or near "' + q.split(' ')[0] + '"';
    }

    /* ── SELECT Handler ─────────────────────────────────── */

    function _handleSelect(query) {
        const q = query.replace(/;$/, '').trim();
        const qUp = q.toUpperCase();

        // SUM(records_sent) — Flag 8 answer
        if (qUp.includes('SUM') && qUp.includes('RECORDS_SENT')) {
            return _formatTable(['sum'], [[_exfilTotal]]);
        }

        // COUNT(*) variants
        if (qUp.includes('COUNT(*)') || qUp.includes('COUNT(1)')) {
            const table = _extractTableName(qUp);
            if (table) {
                const t = _findTable(table);
                if (t) return _formatTable(['count'], [[t.rows.length]]);
            }
        }

        // prosrc — reading function source (Flag 9 path)
        if (qUp.includes('PROSRC') && qUp.includes('PG_PROC')) {
            const nameMatch = q.match(/proname\s*=\s*'([^']+)'/i);
            if (nameMatch && _db._procedures[nameMatch[1]]) {
                return _formatTable(['prosrc'], [[_db._procedures[nameMatch[1]].source]]);
            }
            return '(0 rows)';
        }

        // information_schema.routines
        if (qUp.includes('INFORMATION_SCHEMA.ROUTINES')) {
            const funcs = Object.entries(_db._procedures).map(([name]) => [name]);
            return _formatTable(['routine_name'], funcs);
        }

        // information_schema.columns
        if (qUp.includes('INFORMATION_SCHEMA.COLUMNS')) {
            const tableMatch = q.match(/table_name\s*=\s*'([^']+)'/i);
            if (tableMatch) {
                const t = _findTable(tableMatch[1]);
                if (t) return _formatTable(['column_name', 'data_type'], t.columns.map(c => [c, _inferType(c)]));
            }
        }

        // information_schema.tables
        if (qUp.includes('INFORMATION_SCHEMA.TABLES')) {
            const tables = Object.keys(_db).filter(k => !k.startsWith('_')).map(k => {
                const parts = k.split('.');
                return [parts[0], parts[1]];
            });
            return _formatTable(['table_schema', 'table_name'], tables);
        }

        // JOINs across staging tables — Flag 8 path
        if (qUp.includes('JOIN') && (qUp.includes('EXFIL_MANIFEST') || qUp.includes('EXFIL_LOG'))) {
            // Return joined result
            const rows = _db['staging.exfil_manifest'].rows.map(mRow => {
                const logRow = _db['staging.exfil_log'].rows.find(l => l[1] === mRow[1]);
                if (logRow) {
                    return [mRow[1], mRow[2], mRow[3], logRow[2], logRow[4], logRow[5]];
                }
                return [mRow[1], mRow[2], mRow[3], 0, 'N/A', 'PENDING'];
            });
            return _formatTable(
                ['batch_id', 'target_table', 'target_schema', 'records_sent', 'timestamp', 'status'],
                rows
            );
        }

        // decrypt() — Flag 10 path
        if (qUp.includes('DECRYPT') || qUp.includes('CONVERT_FROM')) {
            // Check if they're using the right key
            if (q.includes(S.encryptionKey)) {
                return _formatTable(
                    ['convert_from'],
                    [['Classified Project Codename: ' + S.projectCodename + '\nDescription: Defense satellite communication protocol specifications\nClassification: TOP SECRET/SCI\nProject Lead: COL. R. Thompson, USSF']]
                );
            }
            return 'ERROR: decryption failed — invalid key or corrupted data';
        }

        // decode() only — show hex info
        if (qUp.includes('DECODE') && qUp.includes("'HEX'") && !qUp.includes('DECRYPT')) {
            return _formatTable(['decode'], [['\\x7a6f3e8c1d4b2a9f8e7c6d5b4a3f2e1d...  (binary data, 64 bytes)']]);
        }

        // Generic SELECT * FROM [table]
        const fromMatch = qUp.match(/FROM\s+([\w.]+)/);
        if (fromMatch) {
            const tableName = fromMatch[1].toLowerCase();
            const table = _findTable(tableName);
            if (!table) return 'ERROR: relation "' + tableName + '" does not exist';

            let rows = table.rows;

            // WHERE clause filtering
            const whereMatch = q.match(/WHERE\s+(.+?)(?:ORDER|LIMIT|GROUP|$)/i);
            if (whereMatch) {
                const cond = whereMatch[1].trim();
                rows = _filterRows(table, rows, cond);
            }

            // ORDER BY
            const orderMatch = qUp.match(/ORDER\s+BY\s+([\w.]+)(?:\s+(ASC|DESC))?/);
            if (orderMatch) {
                const colName = orderMatch[1].toLowerCase();
                const colIdx = table.columns.indexOf(colName);
                const desc = orderMatch[2] === 'DESC';
                if (colIdx >= 0) {
                    rows = [...rows].sort((a, b) => {
                        if (desc) return a[colIdx] > b[colIdx] ? -1 : 1;
                        return a[colIdx] > b[colIdx] ? 1 : -1;
                    });
                }
            }

            // LIMIT
            const limitMatch = qUp.match(/LIMIT\s+(\d+)/);
            if (limitMatch) rows = rows.slice(0, parseInt(limitMatch[1]));

            // Column selection
            let selectedCols = table.columns;
            const selectPart = q.substring(6, qUp.indexOf('FROM')).trim();
            if (selectPart !== '*') {
                selectedCols = selectPart.split(',').map(c => c.trim().split('.').pop().toLowerCase());
                rows = rows.map(row => {
                    return selectedCols.map(col => {
                        const idx = table.columns.indexOf(col);
                        return idx >= 0 ? row[idx] : 'NULL';
                    });
                });
            }

            if (rows.length === 0) return '(0 rows)';
            return _formatTable(selectedCols, rows);
        }

        return 'ERROR: cannot parse query';
    }

    /* ── Table lookup helper ────────────────────────────── */

    function _findTable(name) {
        const n = name.toLowerCase().replace(/['"]/g, '');
        // Direct match
        if (_db[n]) return _db[n];
        // Try with common schema prefixes
        for (const key of Object.keys(_db)) {
            if (key.endsWith('.' + n)) return _db[key];
        }
        return null;
    }

    function _extractTableName(qUp) {
        const m = qUp.match(/FROM\s+([\w.]+)/);
        return m ? m[1].toLowerCase() : null;
    }

    /* ── WHERE filter (basic) ───────────────────────────── */

    function _filterRows(table, rows, cond) {
        // String equality: badge_id = 'MRD-2847'
        const eqMatch = cond.match(/([\w.]+)\s*=\s*'([^']+)'/i);
        if (eqMatch) {
            const colIdx = table.columns.indexOf(eqMatch[1].toLowerCase());
            if (colIdx >= 0) {
                return rows.filter(r => String(r[colIdx]).toLowerCase() === eqMatch[2].toLowerCase());
            }
        }
        // Numeric equality: id = 5
        const numMatch = cond.match(/([\w.]+)\s*=\s*(\d+)/i);
        if (numMatch) {
            const colIdx = table.columns.indexOf(numMatch[1].toLowerCase());
            if (colIdx >= 0) {
                return rows.filter(r => Number(r[colIdx]) === Number(numMatch[2]));
            }
        }
        // LIKE
        const likeMatch = cond.match(/([\w.]+)\s+LIKE\s+'([^']+)'/i);
        if (likeMatch) {
            const colIdx = table.columns.indexOf(likeMatch[1].toLowerCase());
            if (colIdx >= 0) {
                const pattern = likeMatch[2].replace(/%/g, '.*');
                const regex = new RegExp('^' + pattern + '$', 'i');
                return rows.filter(r => regex.test(String(r[colIdx])));
            }
        }
        return rows;
    }

    /* ── Output formatting ──────────────────────────────── */

    function _formatTable(columns, rows) {
        if (!rows || rows.length === 0) return '(0 rows)';

        // Calculate column widths
        const widths = columns.map((col, i) => {
            const dataWidths = rows.map(r => String(r[i] !== undefined ? r[i] : 'NULL').length);
            return Math.max(col.length, ...dataWidths);
        });

        // Header
        const header = columns.map((col, i) => col.padEnd(widths[i])).join(' | ');
        const separator = widths.map(w => '-'.repeat(w)).join('-+-');

        // Rows
        const dataLines = rows.map(row =>
            columns.map((_, i) => String(row[i] !== undefined ? row[i] : 'NULL').padEnd(widths[i])).join(' | ')
        );

        return ' ' + header + '\n-' + separator + '-\n ' + dataLines.join('\n ') + '\n(' + rows.length + ' rows)';
    }

    function _inferType(colName) {
        const c = colName.toLowerCase();
        if (c === 'id' || c.endsWith('_id') || c === 'employee_id' || c === 'log_id' || c === 'manifest_id' || c === 'queue_id') return 'integer';
        if (c.includes('date') || c.includes('timestamp') || c.includes('time')) return 'timestamp';
        if (c.includes('value') || c.includes('bytes') || c.includes('records') || c.includes('count')) return 'integer';
        if (c.includes('encrypted') || c.includes('hash')) return 'text';
        return 'varchar(255)';
    }

    /* ── Flag validation ────────────────────────────────── */

    function _validateFlag(flagStr) {
        const val = flagStr.replace(/^FLAG\{/i, '').replace(/\}$/, '').trim();

        // Flag 8 — Exfiltration total
        if (val === String(_exfilTotal)) {
            return { correct: true, flagId: 'f8', points: 100 };
        }

        // Flag 9 — Encryption key
        if (val.toLowerCase() === S.encryptionKey.toLowerCase()) {
            return { correct: true, flagId: 'f9', points: 100 };
        }

        // Flag 10 — Project codename (accept with or without "PROJECT" prefix)
        const cleanVal = val.toUpperCase().replace(/^PROJECT\s+/, '');
        if (cleanVal === S.projectCodename) {
            return { correct: true, flagId: 'f10', points: 100 };
        }

        return { correct: false };
    }

        ],

// Initialize C2 Terminal widget (shared state with gateway)
C2Terminal.init({
    operationId:  'blackwire',
    storageKey:   'hexworth_c2_blackwire',
    handler:      { callsign: 'HANDLER' },
    student:      { callsign: 'OPERATIVE' },
    narrative:    BlackwireConfig.narrative,
    devices:      BlackwireConfig.devices,
    flags:        BlackwireConfig.flags,
    hints:        BlackwireConfig.hints,
    scoring:      BlackwireConfig.scoring,
    onFlagSubmit: function(flagStr, found) {
        // Try database flags first, then gateway flags
        const dbResult = DatabaseConfig._validateFlag(flagStr);
        if (dbResult.correct) {
            if (found.includes(dbResult.flagId)) return { duplicate: true };
            return dbResult;
        }
        // Also accept gateway flags submitted from here
        const val = flagStr.replace(/^FLAG\{/i, '').replace(/\}$/, '').trim();
        const S = BlackwireConfig._scenario;
        if (val.toLowerCase() === S.c2Domain.toLowerCase()) {
            if (found.includes('f1')) return { duplicate: true };
            return { correct: true, flagId: 'f1', points: 100 };
        }
        if (val.toLowerCase() === S.certThumbprint.toLowerCase()) {
            if (found.includes('f2')) return { duplicate: true };
            return { correct: true, flagId: 'f2', points: 100 };
        }
        return { correct: false };
    },
    onDeviceUnlock: function(deviceId) {
        C2Terminal.handlerMessage('Device ' + deviceId.toUpperCase() + ' is now accessible.');
    }
});

// Show briefing, then boot BoxEngine
BriefingPage.show(DatabaseConfig, function() {
    BoxEngine.init(DatabaseConfig);
});
