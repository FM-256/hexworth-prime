<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Lobby — Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-scales.webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #08080f;
            --surface: #0e0e18;
            --surface-2: #141420;
            --border: rgba(168,85,247,0.2);
            --border-dim: rgba(255,255,255,0.05);
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --green: #22c55e;
            --red: #ef4444;
            --gold: #f1c40f;
            --warning: #f59e0b;
            --text: #c0c0d0;
            --text-dim: #555568;
            --text-bright: #e8e8f0;
            --font: 'Share Tech Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lobby-container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
        }

        /* ── Header ── */
        .lobby-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .lobby-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-bright);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .lobby-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 8px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .lobby-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 12px;
        }
        .lobby-status-lobby   { background: rgba(96,165,250,0.18);  color: #60a5fa; }
        .lobby-status-active  { background: rgba(34,197,94,0.18);   color: #22c55e; }
        .lobby-status-draft   { background: rgba(148,163,184,0.18); color: #94a3b8; }
        .lobby-status-frozen  { background: rgba(245,158,11,0.18);  color: #f59e0b; }
        .lobby-status-ended   { background: rgba(168,85,247,0.18);  color: #a855f7; }

        /* ── Auth Banner ── */
        .lobby-auth-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }
        .lobby-auth-banner p {
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 12px;
        }
        .lobby-auth-btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .lobby-auth-btn:hover {
            background: var(--accent-bright);
        }

        /* ── User Bar ── */
        .lobby-user-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }
        .lobby-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(168,85,247,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--accent-bright);
        }
        .lobby-user-name { color: var(--text-bright); font-weight: 600; }
        .lobby-user-team {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .lobby-user-team-assigned {
            background: rgba(34,197,94,0.15);
            color: var(--green);
        }
        .lobby-user-team-none {
            background: rgba(245,158,11,0.15);
            color: var(--warning);
        }

        /* ── Info Cards ── */
        .lobby-info-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }
        .lobby-info-card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }
        .lobby-info-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-bright);
        }
        .lobby-info-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* ── Teams Grid ── */
        .lobby-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .lobby-teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        .lobby-team-card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 10px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .lobby-team-card:hover {
            border-color: var(--border);
        }
        .lobby-team-card.my-team {
            border-color: var(--green);
            box-shadow: 0 0 12px rgba(34,197,94,0.15);
        }
        .lobby-team-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }
        .lobby-team-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-bright);
            margin-left: 10px;
        }
        .lobby-team-members {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 6px;
            margin-left: 10px;
        }
        .lobby-team-members span {
            display: block;
            padding: 2px 0;
            color: var(--text);
        }
        .lobby-team-empty {
            font-style: italic;
            color: var(--text-dim);
        }
        .lobby-team-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            margin-left: 10px;
        }
        .lobby-team-count {
            font-size: 0.72rem;
            color: var(--text-dim);
        }
        .lobby-join-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 5px;
            font-family: var(--font);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }
        .lobby-join-btn:hover { background: var(--accent-bright); }
        .lobby-join-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .lobby-join-btn.joined {
            background: rgba(34,197,94,0.2);
            color: var(--green);
            cursor: default;
        }
        .lobby-leave-btn {
            background: rgba(239,68,68,0.15);
            color: var(--red);
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-family: var(--font);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lobby-leave-btn:hover { background: rgba(239,68,68,0.25); }

        /* ── Challenge Preview ── */
        .lobby-challenge-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.82rem;
        }
        .lobby-ch-cat {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: rgba(168,85,247,0.15);
            color: var(--accent-bright);
        }
        .lobby-ch-title { flex: 1; color: var(--text-bright); }
        .lobby-ch-pts { font-weight: 700; color: var(--accent-bright); }

        /* ── Links ── */
        .lobby-links {
            text-align: center;
            padding: 20px;
            margin-top: 10px;
        }
        .lobby-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .lobby-links a:hover {
            background: rgba(168,85,247,0.1);
        }

        /* ── Toast ── */
        .lobby-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        .lobby-toast.show { opacity: 1; }
        .lobby-toast.success { background: rgba(34,197,94,0.2); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .lobby-toast.error { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

        .lobby-loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .lobby-footer {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.72rem;
        }
        .lobby-footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <h1 class="sr-only">CTF Lobby</h1>

    <div class="lobby-container" id="lobbyContent">
        <div class="lobby-loading">Loading tournament...</div>
    </div>

    <div class="lobby-toast" id="lobbyToast"></div>

    <div class="lobby-footer">
        Powered by <a href="/">Hexworth Prime</a> CTF Tournament System
    </div>

    <!-- Firebase SDK -->
    <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-functions-compat.js"></script>
    <script src="/__/firebase/init.js"></script>

    <script>
    (function() {
        'use strict';

        const db = firebase.firestore();
        const auth = firebase.auth();
        const params = new URLSearchParams(window.location.search);
        const tournamentId = params.get('id');

        // State
        let currentUser = null;       // firebase auth user
        let currentUserName = null;   // display name or callsign
        let myTeamId = null;          // team ID user belongs to (null = not joined)
        let tournamentData = null;
        let teamsData = [];
        let challengesData = [];

        if (!tournamentId) {
            document.getElementById('lobbyContent').innerHTML =
                '<div class="lobby-loading" style="color:#ef4444;">No tournament ID provided.</div>';
            return;
        }

        // ── Toast ──
        function toast(msg, type) {
            const el = document.getElementById('lobbyToast');
            el.textContent = msg;
            el.className = 'lobby-toast show ' + (type || 'success');
            setTimeout(() => { el.className = 'lobby-toast'; }, 3000);
        }

        // ── Auth State ──
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                // Try to get callsign from Firestore profile
                try {
                    const profileSnap = await db.collection('users').doc(user.uid).get();
                    if (profileSnap.exists) {
                        const p = profileSnap.data();
                        currentUserName = p.callsign || p.displayName || user.displayName || user.email;
                    } else {
                        currentUserName = user.displayName || user.email;
                    }
                } catch (e) {
                    currentUserName = user.displayName || user.email;
                }
            } else {
                currentUserName = null;
                myTeamId = null;
            }
            await loadTournament();
        });

        // ── Sign In ──
        window.lobbySignIn = function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => {
                toast('Sign-in failed: ' + e.message, 'error');
            });
        };

        // ── Load Data ──
        async function loadTournament() {
            try {
                const tSnap = await db.collection('tournaments').doc(tournamentId).get();
                if (!tSnap.exists) {
                    document.getElementById('lobbyContent').innerHTML =
                        '<div class="lobby-loading" style="color:#ef4444;">Tournament not found.</div>';
                    return;
                }
                tournamentData = tSnap.data();
                document.title = (tournamentData.name || 'CTF Lobby') + ' — Hexworth Prime';

                // Load teams
                const teamSnap = await db.collection('tournaments').doc(tournamentId)
                    .collection('teams').orderBy('name').get();
                teamsData = [];
                teamSnap.forEach(d => teamsData.push({ id: d.id, ...d.data() }));

                // Determine which team user is on
                myTeamId = null;
                if (currentUser) {
                    for (const team of teamsData) {
                        if (Array.isArray(team.members) && team.members.includes(currentUser.uid)) {
                            myTeamId = team.id;
                            break;
                        }
                    }
                }

                // Load challenges
                const chSnap = await db.collection('tournaments').doc(tournamentId)
                    .collection('challenges').orderBy('order').get();
                challengesData = [];
                chSnap.forEach(d => {
                    const c = d.data();
                    challengesData.push({ title: c.title, category: c.category, points: c.points });
                });

                render();
            } catch (e) {
                document.getElementById('lobbyContent').innerHTML =
                    '<div class="lobby-loading" style="color:#ef4444;">Error: ' + escHtml(e.message) + '</div>';
            }
        }

        // ── Join Team ──
        window.joinTeam = async function(teamId) {
            if (!currentUser) { toast('Sign in first.', 'error'); return; }
            if (myTeamId) { toast('You are already on a team. Leave first.', 'error'); return; }

            const team = teamsData.find(t => t.id === teamId);
            if (!team) return;

            const maxSize = tournamentData.maxTeamSize || 4;
            if (Array.isArray(team.members) && team.members.length >= maxSize) {
                toast('Team is full.', 'error');
                return;
            }

            // TOURN-03: ask for the join code when the tournament has one.
            //
            // There was no prompt here at all, and ctfJoinTeam did not accept a code, so the
            // "join code" gated nothing: anyone who could list the public tournaments
            // collection could join any event they found, and anonymous sign-in satisfied the
            // only real check. The server is the gate — this input just carries the value to
            // it. A wrong code is refused by the Cloud Function, never here, so nothing about
            // this prompt is worth bypassing.
            //
            // `hasJoinCode` is a public boolean on the tournament doc; the code itself is not
            // readable by anyone but an admin.
            let joinCode = '';
            if (tournamentData.hasJoinCode || tournamentData.joinCode) {
                joinCode = (window.prompt('Enter the join code for ' + (tournamentData.name || 'this tournament') + ':') || '').trim();
                if (!joinCode) { toast('A join code is required for this tournament.', 'error'); return; }
            }

            try {
                // Server-validated self-join (Cloud Function). Teams are admin-write-only at the
                // rules layer (BUG-024); the CF binds the joiner's name to their uid server-side.
                await firebase.functions().httpsCallable('ctfJoinTeam')({ tournamentId, teamId, joinCode });
                myTeamId = teamId;
                toast('Joined ' + team.name + '!', 'success');
                await loadTournament();
            } catch (e) {
                toast(e.message || 'Failed to join.', 'error');
            }
        };

        // ── Leave Team ──
        window.leaveTeam = async function(teamId) {
            if (!currentUser) return;

            try {
                // Server-validated self-leave (Cloud Function).
                await firebase.functions().httpsCallable('ctfLeaveTeam')({ tournamentId, teamId });
                myTeamId = null;
                toast('Left team.', 'success');
                await loadTournament();
            } catch (e) {
                toast(e.message || 'Failed to leave.', 'error');
            }
        };

        // ── Render ──
        function render() {
            const container = document.getElementById('lobbyContent');
            const t = tournamentData;
            const status = t.status || 'draft';

            let html = '';

            // Header
            html += '<div class="lobby-header">';
            html += '<div class="lobby-title">' + escHtml(t.name || 'CTF Tournament') + '</div>';
            if (t.description) html += '<div class="lobby-desc">' + escHtml(t.description) + '</div>';
            html += '<div class="lobby-status lobby-status-' + (/^[a-z]+$/.test(status) ? status : 'unknown') + '">';
            const labels = { draft: 'COMING SOON', lobby: 'REGISTRATION OPEN', active: 'IN PROGRESS', frozen: 'IN PROGRESS', ended: 'FINISHED' };
            html += labels[status] || escHtml(String(status).toUpperCase());
            html += '</div>';
            html += '</div>';

            // Auth state
            if (!currentUser) {
                html += '<div class="lobby-auth-banner">';
                html += '<p>Sign in with your Hexworth account to join a team</p>';
                html += '<button class="lobby-auth-btn" onclick="lobbySignIn()">Sign In with Google</button>';
                html += '</div>';
            } else {
                // User bar
                const initials = (currentUserName || '??').substring(0, 2).toUpperCase();
                html += '<div class="lobby-user-bar">';
                html += '<div class="lobby-user-avatar">' + initials + '</div>';
                html += '<span class="lobby-user-name">' + escHtml(currentUserName) + '</span>';
                if (myTeamId) {
                    const myTeam = teamsData.find(t => t.id === myTeamId);
                    html += '<span class="lobby-user-team lobby-user-team-assigned">ON TEAM: ' + escHtml(myTeam ? myTeam.name : myTeamId) + '</span>';
                } else {
                    html += '<span class="lobby-user-team lobby-user-team-none">NO TEAM — JOIN BELOW</span>';
                }
                html += '</div>';
            }

            // Info cards
            html += '<div class="lobby-info-row">';
            html += infoCard(teamsData.length, 'Teams');
            html += infoCard(challengesData.length, 'Challenges');
            html += infoCard((t.duration || 120) + 'm', 'Duration');
            html += infoCard(t.scoringModel === 'dynamic' ? 'Dynamic' : 'Static', 'Scoring');
            html += infoCard(t.maxTeamSize || 4, 'Max per Team');
            html += '</div>';

            // Teams
            html += '<div class="lobby-section-title">Choose Your Team</div>';
            html += '<div class="lobby-teams-grid">';
            teamsData.forEach(team => {
                // Hex-whitelist the team color before it goes into an inline style, and count
                // members only from a real array — team docs accept arbitrary fields/types via the
                // open teams.create rule (BUG-024), so a crafted color/members would otherwise
                // inject into the style attribute or render a string length as markup (BUG-023).
                const color = (typeof team.color === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(team.color)) ? team.color : '#a855f7';
                const memberCount = Array.isArray(team.members) ? team.members.length : 0;
                // team.id is the Firestore doc id, and teams.create lets any user CHOOSE it (BUG-024),
                // so it is attacker-controlled and must NOT be interpolated raw into the onclick HTML
                // (a crafted id would break out of the attribute and inject markup). Only act on it
                // when it is a plain slug / Firestore auto-id; a crafted id yields no join/leave button.
                const safeId = /^[A-Za-z0-9_-]{1,128}$/.test(team.id) ? team.id : '';
                const maxSize = t.maxTeamSize || 4;
                const isFull = memberCount >= maxSize;
                const isMyTeam = team.id === myTeamId;
                const canJoin = currentUser && !myTeamId && !isFull && (status === 'lobby' || status === 'active');

                html += '<div class="lobby-team-card' + (isMyTeam ? ' my-team' : '') + '">';
                html += '<div class="lobby-team-stripe" style="background:' + color + ';"></div>';
                html += '<div class="lobby-team-name">' + escHtml(team.name) + '</div>';
                html += '<div class="lobby-team-members">';
                if (Array.isArray(team.memberNames) && team.memberNames.length > 0) {
                    team.memberNames.forEach(name => {
                        html += '<span>' + escHtml(name) + '</span>';
                    });
                } else {
                    html += '<span class="lobby-team-empty">Awaiting members...</span>';
                }
                html += '</div>';
                html += '<div class="lobby-team-footer">';
                html += '<span class="lobby-team-count">' + memberCount + '/' + maxSize + '</span>';

                if (isMyTeam) {
                    html += '<span style="display:flex;gap:6px;">';
                    html += '<span class="lobby-join-btn joined">JOINED</span>';
                    if ((status === 'lobby' || status === 'draft') && safeId) {
                        html += '<button class="lobby-leave-btn" onclick="leaveTeam(\'' + safeId + '\')">Leave</button>';
                    }
                    html += '</span>';
                } else if (canJoin && safeId) {
                    html += '<button class="lobby-join-btn" onclick="joinTeam(\'' + safeId + '\')">Join Team</button>';
                } else if (isFull) {
                    html += '<span class="lobby-join-btn" style="opacity:0.3;cursor:default;">FULL</span>';
                }

                html += '</div>';
                html += '</div>';
            });
            html += '</div>';

            // Challenges
            if (challengesData.length > 0) {
                html += '<div class="lobby-section-title">Challenges (' + challengesData.length + ')</div>';
                challengesData.forEach(ch => {
                    html += '<div class="lobby-challenge-row">';
                    html += '<span class="lobby-ch-cat">' + escHtml(ch.category) + '</span>';
                    html += '<span class="lobby-ch-title">' + escHtml(ch.title) + '</span>';
                    html += '<span class="lobby-ch-pts">' + ch.points + ' pts</span>';
                    html += '</div>';
                });
            }

            // Links
            html += '<div class="lobby-links">';
            if (myTeamId && (status === 'active' || status === 'frozen')) {
                html += '<a href="/arena/tournament-board.html?id=' + encodeURIComponent(tournamentId) + '" style="background:var(--accent); color:#fff; border-color:var(--accent);">Enter Challenge Board</a> ';
            }
            html += '<a href="/arena/tournament-podium.html?id=' + encodeURIComponent(tournamentId) + '">View Live Podium</a>';
            html += '</div>';

            container.innerHTML = html;
        }

        function infoCard(value, label) {
            return '<div class="lobby-info-card"><div class="lobby-info-value">' + value + '</div><div class="lobby-info-label">' + label + '</div></div>';
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }
    })();
    </script>
</body>
</html>
