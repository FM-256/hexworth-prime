<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexworth Panopticon — Discord Activity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0a0e14;
            color: #e6edf3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .loading-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .loading-screen.hidden { display: none; }
        .loading-title { font-size: 1.4rem; font-weight: 700; color: #06b6d4; letter-spacing: 0.1em; }
        .loading-sub { font-size: 0.85rem; color: #8b949e; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid #1e2a3a; border-top-color: #06b6d4;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-screen {
            height: 100%; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
        }
        .error-screen.visible { display: flex; }
        .error-title { font-size: 1.2rem; color: #ef4444; font-weight: 700; }
        .error-msg { font-size: 0.85rem; color: #8b949e; max-width: 400px; text-align: center; }
        .error-retry {
            margin-top: 8px; padding: 10px 24px; background: #06b6d4; color: #0a0e14;
            border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
        }
        #panopticon-frame {
            width: 100%; height: 100%; border: none; display: none;
        }
        #panopticon-frame.loaded { display: block; }
    </style>
</head>
<body>
    <h1 class="sr-only">Hexworth Panopticon — Discord Activity</h1>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-title">PANOPTICON</div>
        <div class="loading-sub" id="loadingSub">Connecting to Hexworth Prime...</div>
    </div>
    <div class="error-screen" id="errorScreen">
        <div class="error-title">Connection Failed</div>
        <div class="error-msg" id="errorMsg">Could not connect to Discord.</div>
        <button class="error-retry" onclick="location.reload()">Retry</button>
    </div>
    <iframe id="panopticon-frame" src="" allow="autoplay; encrypted-media"></iframe>

    <script type="module">
        import { DiscordSDK } from 'https://unpkg.com/@discord/embedded-app-sdk@2.4.1/output/index.mjs';

        var loadingEl = document.getElementById('loadingScreen');
        var loadingSub = document.getElementById('loadingSub');
        var errorEl = document.getElementById('errorScreen');
        var errorMsg = document.getElementById('errorMsg');
        var frame = document.getElementById('panopticon-frame');

        function showError(msg) {
            loadingEl.classList.add('hidden');
            errorMsg.textContent = msg;
            errorEl.classList.add('visible');
        }

        try {
            loadingSub.textContent = 'Initializing SDK...';
            var discordSdk = new DiscordSDK('1494405567593054389');

            loadingSub.textContent = 'Waiting for Discord...';
            await discordSdk.ready();

            loadingSub.textContent = 'Authenticating...';
            var authResult = await discordSdk.commands.authorize({
                client_id: '1494405567593054389',
                response_type: 'code',
                state: '',
                prompt: 'none',
                scope: ['identify']
            });

            loadingSub.textContent = 'Securing connection...';
            var tokenResp = await fetch('https://us-central1-hexworth-prime.cloudfunctions.net/discordActivityAuth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: authResult.code })
            });

            if (!tokenResp.ok) throw new Error('Token exchange failed: ' + tokenResp.status);
            var tokenData = await tokenResp.json();

            await discordSdk.commands.authenticate({ access_token: tokenData.access_token });

            loadingSub.textContent = 'Loading Panopticon...';
            var user = tokenData.user || {};
            var params = new URLSearchParams({
                discord: '1',
                discordUser: user.username || '',
                discordId: user.id || '',
                embedded: '1'
            });

            frame.src = '/arena/spectator.html?' + params.toString();
            frame.onload = function() {
                loadingEl.classList.add('hidden');
                frame.classList.add('loaded');
            };

        } catch (err) {
            console.error('[Panopticon Activity] Error:', err);
            showError(err.message || 'Unknown error');
        }
    </script>
</body>
</html>
