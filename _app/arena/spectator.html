<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Panopticon — CTF Arena</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-radar.webp">
    <style>
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0e14;
            --bg-card: #121820;
            --bg-hover: #1a2230;
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.15);
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --border: #1e2a3a;
            --live: #ef4444;
            --live-glow: rgba(239, 68, 68, 0.3);
        }

        html { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ─── Header ─── */

        .spec-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            flex-shrink: 0;
        }

        .spec-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .spec-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text);
        }

        .spec-header-eyebrow {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .spec-live-count {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .spec-live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--live);
            box-shadow: 0 0 8px var(--live-glow);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .spec-back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .spec-back-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Group the header's right-side links so .spec-header keeps two space-between children. */
        .spec-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* "Big Screen" = the produced projector/event display (/arena/broadcast.html);
           accent-tinted to read as a feature entry, distinct from the muted [< Arena] back-link
           and from the separate "Go Live" screen-share button on this page. */
        .spec-bigscreen-link {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ─── Gallery Grid ─── */

        .spec-gallery {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }

        /* ─── Channel Tile ─── */

        .spec-tile {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }

        .spec-tile:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .spec-tile-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .spec-tile-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spec-tile-video .no-video {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .spec-tile-live {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--live);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--live-glow);
        }

        .spec-tile-info {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .spec-tile-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spec-tile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
        }

        .spec-tile-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .spec-tile-room {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .spec-tile-time {
            font-size: 0.65rem;
            color: var(--text-dim);
        }

        /* ─── Expanded View (full-screen single channel) ─── */

        .spec-expanded {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            flex-direction: column;
        }

        .spec-expanded.active {
            display: flex;
        }

        .spec-expanded-header {
            padding: 12px 20px;
            background: rgba(10, 14, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .spec-expanded-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spec-expanded-info .spec-tile-live {
            position: static;
        }

        .spec-expanded-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .spec-expanded-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .spec-expanded-close:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .spec-expanded-video {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .spec-expanded-video video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ─── Empty State ─── */

        .spec-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
        }

        .spec-empty-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            opacity: 0.3;
        }

        .spec-empty h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .spec-empty p {
            font-size: 0.85rem;
        }

        /* ─── Go Live Button (for broadcasters) ─── */

        .spec-go-live-bar {
            padding: 10px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .spec-go-live-btn {
            background: var(--live);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-go-live-btn:hover {
            background: #dc2626;
        }

        .spec-go-live-btn.live {
            background: var(--text-dim);
        }

        .spec-go-live-btn.live:hover {
            background: var(--live);
        }

        .spec-go-live-status {
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        /* ─── Responsive ─── */

        @media (max-width: 840px) {
            .spec-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .spec-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
<!-- ACCESS GATE, in <head> so it runs BEFORE <body> opens.
     Moved 2026-08-12 (Mallory audit). Loading it at end-of-body meant the whole page was
     in the DOM, and on a slow connection painted, before AccessGuard's IIFE could hide it:
     a flash of the exact content being gated. Same fix Nancy applied to the WSA instructor
     decks on 2026-08-03, swept across the rest of the platform. -->
<script src="/components/AccessGuard.js"></script>
<script>AccessGuard.require('sorted');</script>
</head>
<body>
<h1 class="visually-hidden">The Panopticon</h1>
<script src="/components/TenantShell.js"></script>

    <div class="spec-header">
        <div class="spec-header-left">
            <div>
                <div class="spec-header-eyebrow">CTF Arena // The Panopticon</div>
                <h2>The Panopticon</h2>
            </div>
            <div class="spec-live-count" id="liveCount">
                <span class="spec-live-dot"></span>
                <span id="liveCountText">0 live</span>
            </div>
        </div>
        <div class="spec-header-actions">
            <a href="/arena/broadcast.html" class="spec-back-link spec-bigscreen-link">[ Big Screen ]</a>
            <a href="/arena/index.html" class="spec-back-link">[< Arena]</a>
        </div>
    </div>

    <div class="spec-gallery" id="gallery">
        <div class="spec-empty" id="emptyState">
            <img src="/assets/images/icons/icon-radar.webp" alt="" class="spec-empty-icon">
            <h3>The Panopticon is Empty</h3>
            <p>When operators go live, their channels will appear here. You see everything. They see nothing.</p>
        </div>
        <div class="spec-grid" id="grid" style="display: none;"></div>
    </div>

    <!-- Expanded single-channel view -->
    <div class="spec-expanded" id="expandedView">
        <div class="spec-expanded-header">
            <div class="spec-expanded-info">
                <span class="spec-tile-live">LIVE</span>
                <span class="spec-expanded-name" id="expandedName">--</span>
            </div>
            <button class="spec-expanded-close" id="expandedClose">[x] Back to Gallery</button>
        </div>
        <div class="spec-expanded-video" id="expandedVideo"></div>
    </div>

    <!-- Go Live bar (visible to authenticated users) -->
    <div class="spec-go-live-bar" id="goLiveBar" style="display: none;">
        <div>
            <span class="spec-go-live-status" id="goLiveStatus">Share your screen to go live</span>
        </div>
        <button class="spec-go-live-btn" id="goLiveBtn">
            <span class="spec-live-dot" style="width:6px;height:6px;animation:none;"></span>
            Go Live
        </button>
    </div>

    <!-- Firebase + LiveKit SDK -->
    <script src="/components/FirebaseAuth.js"></script>

    <script type="module">
        (async function() {
            'use strict';

            const user = await FirebaseAuth.waitForAuth();
            if (!user) {
                window.location.href = '/unauthorized.html';
                return;
            }

            const {
                getFirestore, collection, onSnapshot, query, where, orderBy
            } = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js');

            const { getApps } = window.firebaseApp;
            const db = getFirestore(getApps()[0]);

            // LiveKit client SDK (loaded from CDN)
            const lk = await import('https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs');

            const $ = (id) => document.getElementById(id);
            const grid = $('grid');
            const emptyState = $('emptyState');
            const expandedView = $('expandedView');
            const expandedVideo = $('expandedVideo');
            const expandedName = $('expandedName');
            const goLiveBar = $('goLiveBar');
            const goLiveBtn = $('goLiveBtn');
            const goLiveStatus = $('goLiveStatus');

            let activeRooms = new Map(); // streamId -> { data, room, tile }
            let expandedRoom = null;
            let isBroadcasting = false;
            let localRoom = null;

            // Show the Go Live bar
            goLiveBar.style.display = 'flex';

            // ═══════════════════════════════════════════════════════════
            // STREAM DISCOVERY — Firestore listener
            // ═══════════════════════════════════════════════════════════

            const streamsQ = query(
                collection(db, 'spectator_streams'),
                where('active', '==', true)
            );

            onSnapshot(streamsQ, (snapshot) => {
                const liveStreams = [];
                snapshot.forEach(d => liveStreams.push({ id: d.id, ...d.data() }));

                // Update live count
                $('liveCountText').textContent = liveStreams.length + ' live';

                // Remove stale tiles
                for (const [id] of activeRooms) {
                    if (!liveStreams.find(s => s.id === id)) {
                        removeChannel(id);
                    }
                }

                // Add/update tiles
                for (const stream of liveStreams) {
                    if (!activeRooms.has(stream.id)) {
                        addChannel(stream);
                    }
                }

                // Toggle empty state
                const hasStreams = liveStreams.length > 0;
                emptyState.style.display = hasStreams ? 'none' : 'block';
                grid.style.display = hasStreams ? 'grid' : 'none';
            });

            // ═══════════════════════════════════════════════════════════
            // CHANNEL MANAGEMENT
            // ═══════════════════════════════════════════════════════════

            async function addChannel(stream) {
                // Create tile DOM
                const tile = document.createElement('div');
                tile.className = 'spec-tile';
                tile.dataset.streamId = stream.id;

                const initials = (stream.displayName || '??').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                const elapsed = stream.startedAt ? getElapsed(stream.startedAt.toDate()) : '';

                tile.innerHTML = `
                    <div class="spec-tile-video">
                        <span class="no-video">Connecting...</span>
                        <span class="spec-tile-live">LIVE</span>
                    </div>
                    <div class="spec-tile-info">
                        <div class="spec-tile-user">
                            <div class="spec-tile-avatar">${esc(initials)}</div>
                            <div>
                                <div class="spec-tile-name">${esc(stream.displayName)}</div>
                                <div class="spec-tile-room">${esc(stream.roomName)}</div>
                            </div>
                        </div>
                        <div class="spec-tile-time">${elapsed}</div>
                    </div>
                `;

                tile.addEventListener('click', () => expandChannel(stream.id));
                grid.appendChild(tile);

                // Connect to LiveKit room as spectator
                const room = new lk.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                activeRooms.set(stream.id, { data: stream, room, tile });

                try {
                    const result = await FirebaseAuth.callFunction('getLiveKitToken', {
                        roomName: stream.roomName,
                        role: 'spectator'
                    });

                    await room.connect(result.data.wsUrl, result.data.token);
                    console.log(`[Spectator] Connected to room ${stream.roomName}, participants:`, room.remoteParticipants.size);

                    // Handle tracks already published
                    room.remoteParticipants.forEach(participant => {
                        participant.trackPublications.forEach(pub => {
                            if (pub.track && pub.track.kind === 'video') {
                                console.log(`[Spectator] Attaching existing track from ${participant.identity}`);
                                const videoContainer = tile.querySelector('.spec-tile-video');
                                const noVideo = videoContainer.querySelector('.no-video');
                                if (noVideo) noVideo.remove();
                                const el = pub.track.attach();
                                el.muted = true;
                                videoContainer.appendChild(el);
                            }
                        });
                    });

                    // Handle new tracks
                    room.on(lk.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                        if (track.kind === 'video') {
                            const videoContainer = tile.querySelector('.spec-tile-video');
                            const noVideo = videoContainer.querySelector('.no-video');
                            if (noVideo) noVideo.remove();

                            const el = track.attach();
                            el.muted = true;
                            videoContainer.appendChild(el);

                            // If this channel is expanded, also attach to expanded view
                            if (expandedRoom === stream.id) {
                                attachToExpanded(track);
                            }
                        }
                    });

                    room.on(lk.RoomEvent.TrackUnsubscribed, (track) => {
                        track.detach().forEach(el => el.remove());
                    });

                } catch (error) {
                    console.error(`[Spectator] Failed to connect to ${stream.roomName}:`, error);
                    const noVideo = tile.querySelector('.no-video');
                    if (noVideo) noVideo.textContent = 'Connection failed';
                }
            }

            function removeChannel(streamId) {
                const channel = activeRooms.get(streamId);
                if (!channel) return;

                // Disconnect from LiveKit room
                channel.room.disconnect();

                // Remove tile
                channel.tile.remove();

                // If expanded, close
                if (expandedRoom === streamId) {
                    closeExpanded();
                }

                activeRooms.delete(streamId);
            }

            // ═══════════════════════════════════════════════════════════
            // EXPANDED VIEW
            // ═══════════════════════════════════════════════════════════

            function expandChannel(streamId) {
                const channel = activeRooms.get(streamId);
                if (!channel) return;

                expandedRoom = streamId;
                expandedName.textContent = channel.data.displayName;
                expandedVideo.innerHTML = '';

                // Attach video tracks to expanded view
                channel.room.remoteParticipants.forEach(participant => {
                    participant.videoTrackPublications.forEach(pub => {
                        if (pub.track) {
                            attachToExpanded(pub.track);
                        }
                    });
                });

                expandedView.classList.add('active');
            }

            function attachToExpanded(track) {
                expandedVideo.innerHTML = '';
                const el = track.attach();
                el.style.maxWidth = '100%';
                el.style.maxHeight = '100%';
                expandedVideo.appendChild(el);
            }

            function closeExpanded() {
                expandedRoom = null;
                expandedVideo.innerHTML = '';
                expandedView.classList.remove('active');
            }

            $('expandedClose').addEventListener('click', closeExpanded);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && expandedView.classList.contains('active')) {
                    closeExpanded();
                }
            });

            // ═══════════════════════════════════════════════════════════
            // GO LIVE (broadcast own screen)
            // ═══════════════════════════════════════════════════════════

            goLiveBtn.addEventListener('click', async () => {
                if (isBroadcasting) {
                    await stopBroadcasting();
                } else {
                    await startBroadcasting();
                }
            });

            async function startBroadcasting() {
                try {
                    goLiveStatus.textContent = 'Requesting screen access...';

                    // Capture screen
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { max: 15 } },
                        audio: false
                    });

                    goLiveStatus.textContent = 'Connecting to LiveKit...';

                    const roomName = `arena-${user.uid.substring(0, 8)}-${Date.now()}`;

                    // Get token
                    const result = await FirebaseAuth.callFunction('getLiveKitToken', {
                        roomName,
                        role: 'broadcaster'
                    });

                    // Connect to LiveKit
                    localRoom = new lk.Room();
                    await localRoom.connect(result.data.wsUrl, result.data.token);

                    // Publish screen track (pass raw MediaStreamTrack)
                    const mediaTrack = stream.getVideoTracks()[0];
                    await localRoom.localParticipant.publishTrack(mediaTrack, {
                        name: 'screen',
                        source: lk.Track.Source.ScreenShare
                    });

                    // Handle screen share stop (user clicks browser's "Stop sharing")
                    stream.getVideoTracks()[0].onended = () => {
                        stopBroadcasting();
                    };

                    isBroadcasting = true;
                    goLiveBtn.textContent = 'End Stream';
                    goLiveBtn.classList.add('live');
                    goLiveStatus.textContent = 'You are LIVE';
                    goLiveStatus.style.color = '#ef4444';

                } catch (error) {
                    console.error('[Spectator] Broadcast failed:', error);
                    goLiveStatus.textContent = error.name === 'NotAllowedError'
                        ? 'Screen share was cancelled'
                        : 'Failed to go live: ' + error.message;
                    goLiveStatus.style.color = '';
                }
            }

            async function stopBroadcasting() {
                try {
                    if (localRoom) {
                        localRoom.disconnect();
                        localRoom = null;
                    }

                    await FirebaseAuth.callFunction('endLiveStream', {});

                    isBroadcasting = false;
                    goLiveBtn.innerHTML = '<span class="spec-live-dot" style="width:6px;height:6px;animation:none;"></span> Go Live';
                    goLiveBtn.classList.remove('live');
                    goLiveStatus.textContent = 'Share your screen to go live';
                    goLiveStatus.style.color = '';
                } catch (error) {
                    console.error('[Spectator] Failed to end stream:', error);
                }
            }

            // Clean up on page unload
            window.addEventListener('beforeunload', () => {
                if (isBroadcasting && localRoom) {
                    localRoom.disconnect();
                    // Fire-and-forget: mark stream as inactive
                    navigator.sendBeacon('/api/endStream'); // fallback
                    FirebaseAuth.callFunction('endLiveStream', {}).catch(() => {});
                }
            });

            // ═══════════════════════════════════════════════════════════
            // UTILITIES
            // ═══════════════════════════════════════════════════════════

            function esc(str) {
                if (!str) return '';
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function getElapsed(date) {
                const diff = Math.floor((Date.now() - date.getTime()) / 1000);
                if (diff < 60) return 'Just started';
                if (diff < 3600) return Math.floor(diff / 60) + 'm';
                return Math.floor(diff / 3600) + 'h ' + Math.floor((diff % 3600) / 60) + 'm';
            }

            // Update elapsed times every 30s
            setInterval(() => {
                activeRooms.forEach((channel) => {
                    if (channel.data.startedAt) {
                        const timeEl = channel.tile.querySelector('.spec-tile-time');
                        if (timeEl) timeEl.textContent = getElapsed(channel.data.startedAt.toDate());
                    }
                });
            }, 30000);

        })();
    </script>
</body>
</html>
