<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Podium — Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-scales.webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #08080f;
            --surface: #0e0e18;
            --surface-2: #141420;
            --border: rgba(168,85,247,0.2);
            --border-dim: rgba(255,255,255,0.05);
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --gold: #f1c40f;
            --silver: #94a3b8;
            --bronze: #cd7f32;
            --green: #22c55e;
            --red: #ef4444;
            --text: #c0c0d0;
            --text-dim: #555568;
            --text-bright: #e8e8f0;
            --font: 'Share Tech Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        .podium-header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .podium-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-bright);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .podium-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .podium-status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .podium-status-badge {
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .podium-status-draft   { background: rgba(148,163,184,0.18); color: #94a3b8; }
        .podium-status-lobby   { background: rgba(96,165,250,0.18);  color: #60a5fa; }
        .podium-status-active  { background: rgba(34,197,94,0.18);   color: #22c55e; }
        .podium-status-frozen  { background: rgba(245,158,11,0.18);  color: #f59e0b; }
        .podium-status-ended   { background: rgba(168,85,247,0.18);  color: #a855f7; }

        .podium-timer {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-bright);
            letter-spacing: 3px;
        }
        .podium-timer.warning { color: var(--red); }

        /* ── Podium Top 3 ── */
        .podium-top3 {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 16px;
            padding: 40px 20px 30px;
            max-width: 700px;
            margin: 0 auto;
        }
        .podium-place {
            flex: 1;
            max-width: 200px;
            text-align: center;
        }
        .podium-place-box {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 10px 10px 0 0;
            padding: 20px 12px 14px;
            position: relative;
        }
        .podium-place-rank {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }
        .podium-place-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .podium-place-score {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .podium-place-solves {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .podium-pedestal {
            border-radius: 0 0 6px 6px;
        }

        /* 1st place */
        .podium-1st .podium-place-box {
            border-color: rgba(241,196,15,0.3);
            background: linear-gradient(180deg, rgba(241,196,15,0.08) 0%, var(--surface) 100%);
        }
        .podium-1st .podium-place-rank { color: var(--gold); }
        .podium-1st .podium-place-score { color: var(--gold); }
        .podium-1st .podium-pedestal { background: var(--gold); height: 60px; }

        /* 2nd place */
        .podium-2nd .podium-place-box {
            border-color: rgba(148,163,184,0.2);
            background: linear-gradient(180deg, rgba(148,163,184,0.06) 0%, var(--surface) 100%);
        }
        .podium-2nd .podium-place-rank { color: var(--silver); }
        .podium-2nd .podium-place-score { color: var(--silver); }
        .podium-2nd .podium-pedestal { background: var(--silver); height: 40px; }

        /* 3rd place */
        .podium-3rd .podium-place-box {
            border-color: rgba(205,127,50,0.2);
            background: linear-gradient(180deg, rgba(205,127,50,0.06) 0%, var(--surface) 100%);
        }
        .podium-3rd .podium-place-rank { color: var(--bronze); }
        .podium-3rd .podium-place-score { color: var(--bronze); }
        .podium-3rd .podium-pedestal { background: var(--bronze); height: 24px; }

        /* ── Full Leaderboard Table ── */
        .podium-table-wrap {
            max-width: 800px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .podium-table {
            width: 100%;
            border-collapse: collapse;
        }
        .podium-table th {
            font-size: 0.72rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-dim);
            text-align: left;
        }
        .podium-table td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.85rem;
        }
        .podium-table tr:hover {
            background: rgba(168,85,247,0.04);
        }
        .podium-rank { font-weight: 700; color: var(--accent-bright); width: 40px; }
        .podium-team-name { font-weight: 600; color: var(--text-bright); }
        .podium-team-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .podium-score { font-weight: 700; font-size: 1rem; }

        /* ── Frozen overlay ── */
        .podium-frozen-msg {
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            color: #f59e0b;
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 8px;
            max-width: 600px;
            margin: 20px auto;
        }

        /* ── Loading / Empty ── */
        .podium-loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* ── Footer ── */
        .podium-footer {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.72rem;
            border-top: 1px solid var(--border-dim);
        }
        .podium-footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <h1 class="sr-only">CTF Podium</h1>

    <div class="podium-header">
        <div class="podium-title" id="podiumTitle">CTF Tournament</div>
        <div class="podium-subtitle" id="podiumSubtitle"></div>
        <div class="podium-status-row">
            <span class="podium-status-badge podium-status-draft" id="podiumStatusBadge">LOADING</span>
            <span class="podium-timer" id="podiumTimer"></span>
        </div>
    </div>

    <div id="podiumContent">
        <div class="podium-loading">Loading tournament data...</div>
    </div>

    <div class="podium-footer">
        Powered by <a href="/">Hexworth Prime</a> CTF Tournament System
    </div>

    <!-- Firebase SDK -->
    <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <!-- Canonical CTF standings ranking (BUG-022): score DESC then earliest lastSolveTime ASC. -->
    <script src="/components/CtfStandings.js"></script>

    <script>
    (function() {
        'use strict';

        const db = firebase.firestore();
        const params = new URLSearchParams(window.location.search);
        const tournamentId = params.get('id');

        if (!tournamentId) {
            document.getElementById('podiumContent').innerHTML =
                '<div class="podium-loading" style="color:#ef4444;">No tournament ID provided. Add ?id=TOURNAMENT_ID to the URL.</div>';
            return;
        }

        let timerInterval = null;
        let teamsUnsub = null;

        // TOURN-08: bound on the live listener.
        //
        // 200, not 50. The point of a limit is to stop an unbounded subscription re-sending
        // every team on every score change; it is NOT to hide anyone. maxTeams is hard-capped
        // at 200 in the admin console, so 200 is simultaneously a real bound and complete: no
        // team can ever fall off this page. Nancy caught the first draft at 50, which was fine
        // for deciding who WINS and wrong for a player ranked 51st trying to find their own
        // row, with no "+N more" affordance to tell them anything was missing.
        const PODIUM_LIMIT = 200;

        // Standings captured at the first 'frozen' observation, then shown unchanged until the
        // status leaves 'frozen'. null whenever the board is live. See displayTeams().
        let frozenTeams = null;
        let tournamentUnsub = null;

        // ── Load tournament and subscribe ──
        function init() {
            // Real-time tournament status
            tournamentUnsub = db.collection('tournaments').doc(tournamentId).onSnapshot(snap => {
                if (!snap.exists) {
                    document.getElementById('podiumContent').innerHTML =
                        '<div class="podium-loading" style="color:#ef4444;">Tournament not found.</div>';
                    return;
                }
                const t = snap.data();
                renderHeader(t);
                subscribeTeams(t);
            });
        }

        function renderHeader(t) {
            document.getElementById('podiumTitle').textContent = t.name || 'CTF Tournament';
            document.getElementById('podiumSubtitle').textContent = t.description || '';
            document.title = (t.name || 'CTF Podium') + ' — Hexworth Prime';

            const status = t.status || 'draft';
            const badge = document.getElementById('podiumStatusBadge');
            badge.className = 'podium-status-badge podium-status-' + status;

            const labels = { draft: 'DRAFT', lobby: 'REGISTRATION OPEN', active: 'LIVE', frozen: 'SCOREBOARD FROZEN', ended: 'FINISHED' };
            badge.textContent = labels[status] || status.toUpperCase();

            // Timer
            updateTimer(t);
        }

        function updateTimer(t) {
            if (timerInterval) clearInterval(timerInterval);
            const timerEl = document.getElementById('podiumTimer');

            if (t.status !== 'active' && t.status !== 'frozen') {
                timerEl.textContent = '';
                return;
            }

            if (!t.startTime) { timerEl.textContent = ''; return; }

            const startMs = (typeof t.startTime.toDate === 'function') ? t.startTime.toDate().getTime() : t.startTime;
            const durationMs = (t.duration || 120) * 60 * 1000;
            const endMs = startMs + durationMs;

            timerInterval = setInterval(() => {
                const remaining = endMs - Date.now();
                if (remaining <= 0) {
                    timerEl.textContent = '00:00:00';
                    timerEl.className = 'podium-timer warning';
                    clearInterval(timerInterval);
                    return;
                }
                const h = Math.floor(remaining / 3600000);
                const m = Math.floor((remaining % 3600000) / 60000);
                const s = Math.floor((remaining % 60000) / 1000);
                timerEl.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                timerEl.className = remaining < 300000 ? 'podium-timer warning' : 'podium-timer';
            }, 1000);
        }

        // ── Subscribe to teams (real-time leaderboard) ──
        let lastStatus = null;

        function subscribeTeams(t) {
            // Only re-subscribe if status changed
            if (lastStatus === t.status && teamsUnsub) return;
            lastStatus = t.status;

            if (teamsUnsub) teamsUnsub();

            // TOURN-08: bound the listener.
            //
            // This subscribed to EVERY team with no limit, live, so each score change re-sent
            // the whole field to every viewer. Invisible at six teams; after TOURN-01 a
            // tournament can hold 200, and this page is the one on a classroom projector.
            // PODIUM_LIMIT equals the hard cap on teams, so this bounds the subscription
            // without ever truncating the standings.
            teamsUnsub = db.collection('tournaments').doc(tournamentId)
                .collection('teams').orderBy('score', 'desc').limit(PODIUM_LIMIT)
                .onSnapshot(snap => {
                    renderLeaderboard(snap, t);
                });
        }

        // Solve count, tolerant of BOTH shapes this page receives.
        // A LIVE team document carries `solves` as an array of challenge ids; the frozen
        // snapshot written by the admin console stores it already reduced to a COUNT, because
        // storing 200 teams' full solve arrays would bloat the tournament document. Reading it
        // as an array only would render every team as 0 solves on the frozen board, on the
        // projector page, which is the one this whole change exists to fix.
        function solveCount(t) {
            if (typeof t.solves === 'number') return t.solves;
            return Array.isArray(t.solves) ? t.solves.length : 0;
        }

        function renderLeaderboard(snap, tournament) {
            const content = document.getElementById('podiumContent');
            const status = tournament.status || 'draft';

            if (snap.empty) {
                content.innerHTML = '<div class="podium-loading">No teams registered yet.</div>';
                return;
            }

            // Collect teams, then apply the canonical tie-break ranking (BUG-022).
            // Firestore returns them ordered by score, but score-ties fall back to
            // document-id order; CtfStandings.rankTeams re-ranks by score DESC then
            // earliest lastSolveTime ASC, so positions (and any trophy/credential
            // minted from them) are correct. Falls back to raw score order if the
            // helper failed to load. See /components/CtfStandings.js.
            const rawTeams = [];
            snap.forEach(d => rawTeams.push({ id: d.id, ...d.data() }));
            const ranked = (window.CtfStandings && window.CtfStandings.rankTeams)
                ? window.CtfStandings.rankTeams(rawTeams)
                : rawTeams;

            // TOURN-08: a REAL freeze, and ONE board for everybody.
            //
            // Two defects, fixed in order of severity. The branch below only ever prepended a
            // banner while this listener kept pushing live scores, so "final standings are a
            // surprise" was false on the page most likely to be projected. Fixing that with a
            // per-client capture then left a subtler problem: each viewer froze whatever THEY
            // first saw, so a student who had the page open before the freeze and an instructor
            // who opened it two minutes later held different "final" boards, both believing
            // theirs was authoritative. Play continues during a freeze, that is what a
            // scoreboard freeze is, so the scores genuinely do diverge.
            //
            // The authority is now `tournament.frozenStandings`, captured ONCE by the admin
            // console at the moment of freezing. Every viewer renders the same array.
            let teams;
            if (status === 'frozen' && Array.isArray(tournament.frozenStandings) && tournament.frozenStandings.length) {
                teams = tournament.frozenStandings;
                frozenTeams = null;
            } else if (status === 'frozen') {
                // A tournament frozen BEFORE this change has no snapshot. Fall back to the
                // per-client capture rather than showing a live board under a frozen banner:
                // inconsistent between viewers, but still frozen, which is the lesser wrong.
                if (!frozenTeams && ranked.length) frozenTeams = ranked.slice();
                teams = frozenTeams || ranked;
            } else {
                frozenTeams = null;
                teams = ranked;
            }

            let html = '';

            // Frozen message
            if (status === 'frozen') {
                html += '<div class="podium-frozen-msg">Scoreboard is frozen. Final standings will be revealed when the tournament ends.</div>';
            }

            // Waiting states
            if (status === 'draft' || status === 'lobby') {
                html += '<div style="text-align:center; padding:30px 20px; color:var(--text-dim);">';
                html += status === 'draft' ? 'Tournament has not started yet.' : 'Waiting for tournament to begin...';
                html += '<br><br>' + teams.length + ' team' + (teams.length !== 1 ? 's' : '') + ' registered';
                html += '</div>';
            }

            // Top 3 podium (only when active, frozen, or ended)
            if (status === 'active' || status === 'frozen' || status === 'ended') {
                const top3 = teams.slice(0, 3);
                // Pedestal is rendered in visual order 2nd, 1st, 3rd directly below.
                html += '<div class="podium-top3">';
                // 2nd
                if (top3[1]) {
                    html += renderPodiumPlace(top3[1], 2);
                }
                // 1st
                if (top3[0]) {
                    html += renderPodiumPlace(top3[0], 1);
                }
                // 3rd
                if (top3[2]) {
                    html += renderPodiumPlace(top3[2], 3);
                }
                html += '</div>';
            }

            // Full table
            html += '<div class="podium-table-wrap">';
            html += '<table class="podium-table"><thead><tr>';
            html += '<th>Rank</th><th>Team</th><th>Score</th><th>Solves</th><th>Last Solve</th>';
            html += '</tr></thead><tbody>';

            teams.forEach((t, i) => {
                const rank = i + 1;
                // Guard toDate: a captain can set lastSolveTime to a map with a truthy-but-not-
                // callable toDate (crafted team field), which would throw inside forEach and blank
                // the live podium for every spectator. Only call it when it's actually a function.
                const lastSolve = (t.lastSolveTime && typeof t.lastSolveTime.toDate === 'function')
                    ? t.lastSolveTime.toDate().toLocaleTimeString()
                    : '--';

                html += '<tr>';
                html += '<td class="podium-rank">' + rank + '</td>';
                html += '<td class="podium-team-name">';
                html += '<span class="podium-team-dot" style="background:' + safeColor(t.color) + ';"></span>';
                html += escHtml(t.name || 'Unnamed');
                html += '</td>';
                html += '<td class="podium-score">' + num(t.score) + '</td>';
                html += '<td>' + solveCount(t) + '</td>';
                html += '<td style="color:var(--text-dim);">' + lastSolve + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            content.innerHTML = html;
        }

        function renderPodiumPlace(team, place) {
            const cls = place === 1 ? 'podium-1st' : place === 2 ? 'podium-2nd' : 'podium-3rd';
            const medals = { 1: '\u{1F947}', 2: '\u{1F948}', 3: '\u{1F949}' };
            let h = '<div class="podium-place ' + cls + '">';
            h += '<div class="podium-place-box">';
            h += '<div class="podium-place-rank">#' + place + '</div>';
            h += '<div class="podium-place-name">' + escHtml(team.name || 'Unnamed') + '</div>';
            h += '<div class="podium-place-score">' + num(team.score) + ' pts</div>';
            h += '<div class="podium-place-solves">' + solveCount(team) + ' solves</div>';
            h += '</div>';
            h += '<div class="podium-pedestal"></div>';
            h += '</div>';
            return h;
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // Coerce a value that MUST be numeric (score/solves) before it reaches innerHTML.
        // Blocks stored XSS via the wide-open teams.create rule (BUG-024): a crafted string
        // or object becomes 0, never markup. See BUG-023.
        function num(v) { return Number(v) || 0; }
        // Whitelist a team color to a hex literal before injecting it into an inline style;
        // anything else falls back to the accent var, so a crafted color cannot break out of
        // the style attribute and inject markup/handlers.
        function safeColor(c) { return (typeof c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : 'var(--accent)'; }

        init();
    })();
    </script>
</body>
</html>
