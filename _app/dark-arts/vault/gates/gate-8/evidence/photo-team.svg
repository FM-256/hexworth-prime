<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Office Group Photo (Red Herring) - Blurred/Pixelated Faces -->

  <defs>
    <!-- Office wall gradient -->
    <linearGradient id="officeWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4d4cc;stop-opacity:1" />
    </linearGradient>

    <!-- Floor gradient -->
    <linearGradient id="officeFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8a8a80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a6a60;stop-opacity:1" />
    </linearGradient>

    <!-- Suit gradient (various shades for different people) -->
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="suitGray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a6a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5a6a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5a;stop-opacity:1" />
    </linearGradient>

    <!-- Pixelation pattern for faces -->
    <pattern id="pixelFace1" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#d4c4b0"/>
      <rect x="4" y="0" width="4" height="4" fill="#c4b4a0"/>
      <rect x="0" y="4" width="4" height="4" fill="#b4a490"/>
      <rect x="4" y="4" width="4" height="4" fill="#c4b4a0"/>
    </pattern>

    <pattern id="pixelFace2" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#e4d4c0"/>
      <rect x="4" y="0" width="4" height="4" fill="#d4c4b0"/>
      <rect x="0" y="4" width="4" height="4" fill="#c4b4a0"/>
      <rect x="4" y="4" width="4" height="4" fill="#d4c4b0"/>
    </pattern>

    <pattern id="pixelFace3" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#c4b4a0"/>
      <rect x="4" y="0" width="4" height="4" fill="#b49488"/>
      <rect x="0" y="4" width="4" height="4" fill="#a48478"/>
      <rect x="4" y="4" width="4" height="4" fill="#b49488"/>
    </pattern>
  </defs>

  <!-- Background - office wall -->
  <rect x="0" y="0" width="800" height="400" fill="url(#officeWall)"/>

  <!-- Floor -->
  <rect x="0" y="400" width="800" height="100" fill="url(#officeFloor)"/>

  <!-- Office wall texture (subtle) -->
  <rect x="0" y="0" width="800" height="400" fill="#d4d4cc" opacity="0.1"/>

  <!-- "Aegean Trade Solutions" banner on wall -->
  <g>
    <!-- Banner background -->
    <rect x="200" y="80" width="400" height="80" fill="#1a3a5a" rx="5"/>
    <rect x="205" y="85" width="390" height="70" fill="#2a4a6a"/>

    <!-- Company name -->
    <text x="400" y="115" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
          fill="#ffffff" text-anchor="middle">AEGEAN TRADE SOLUTIONS</text>
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="14"
          fill="#c0d0e0" text-anchor="middle">Excellence in International Commerce</text>
  </g>

  <!-- Decorative elements on wall -->
  <g opacity="0.3">
    <!-- Fake plant pot (left side) -->
    <rect x="50" y="320" width="40" height="80" fill="#8b6f47" rx="5"/>
    <ellipse cx="70" cy="320" rx="25" ry="15" fill="#6b5f37"/>
    <path d="M 60 300 Q 65 280 70 300 Q 75 280 80 300" stroke="#4a7c2a" stroke-width="3" fill="none"/>
    <path d="M 50 310 Q 55 290 60 310 Q 65 290 70 310" stroke="#4a7c2a" stroke-width="3" fill="none"/>

    <!-- Frame on wall (right side) -->
    <rect x="710" y="220" width="70" height="90" fill="#8a7a6a" rx="3"/>
    <rect x="715" y="225" width="60" height="80" fill="#c4b4a0"/>
  </g>

  <!-- Eight people standing in a row (business casual) -->

  <!-- Person 1 (far left) - Dark suit -->
  <g transform="translate(120, 220)">
    <ellipse cx="0" cy="80" rx="35" ry="50" fill="url(#suitDark)"/>
    <rect x="-10" y="50" width="20" height="35" fill="#ffffff"/>
    <rect x="-35" y="70" width="70" height="10" fill="url(#suitDark)"/>
    <ellipse cx="0" cy="20" rx="22" ry="28" fill="url(#pixelFace1)"/>
    <rect x="-22" y="5" width="44" height="36" fill="url(#pixelFace1)"/>
  </g>

  <!-- Person 2 - Gray suit, female silhouette -->
  <g transform="translate(220, 230)">
    <ellipse cx="0" cy="75" rx="32" ry="48" fill="url(#suitGray)"/>
    <path d="M -15 55 L -8 75 L 8 75 L 15 55" fill="#4a5a6a"/>
    <rect x="-8" y="50" width="16" height="30" fill="#e8e8e0"/>
    <ellipse cx="0" cy="18" rx="20" ry="26" fill="url(#pixelFace2)"/>
    <rect x="-20" y="5" width="40" height="32" fill="url(#pixelFace2)"/>
  </g>

  <!-- Person 3 - Blue suit -->
  <g transform="translate(310, 225)">
    <ellipse cx="0" cy="78" rx="34" ry="50" fill="url(#suitBlue)"/>
    <rect x="-10" y="50" width="20" height="35" fill="#ffffff"/>
    <rect x="-34" y="70" width="68" height="10" fill="url(#suitBlue)"/>
    <ellipse cx="0" cy="19" rx="21" ry="27" fill="url(#pixelFace3)"/>
    <rect x="-21" y="6" width="42" height="34" fill="url(#pixelFace3)"/>
  </g>

  <!-- Person 4 - Dark suit -->
  <g transform="translate(400, 220)">
    <ellipse cx="0" cy="80" rx="36" ry="52" fill="url(#suitDark)"/>
    <rect x="-11" y="50" width="22" height="36" fill="#ffffff"/>
    <rect x="-36" y="72" width="72" height="10" fill="url(#suitDark)"/>
    <ellipse cx="0" cy="20" rx="23" ry="29" fill="url(#pixelFace1)"/>
    <rect x="-23" y="5" width="46" height="38" fill="url(#pixelFace1)"/>
  </g>

  <!-- Person 5 (center) - Gray suit, taller -->
  <g transform="translate(490, 215)">
    <ellipse cx="0" cy="82" rx="35" ry="52" fill="url(#suitGray)"/>
    <rect x="-10" y="50" width="20" height="36" fill="#ffffff"/>
    <rect x="-35" y="72" width="70" height="10" fill="url(#suitGray)"/>
    <ellipse cx="0" cy="20" rx="22" ry="28" fill="url(#pixelFace2)"/>
    <rect x="-22" y="5" width="44" height="36" fill="url(#pixelFace2)"/>
  </g>

  <!-- Person 6 - Blue suit, female -->
  <g transform="translate(580, 228)">
    <ellipse cx="0" cy="76" rx="33" ry="49" fill="url(#suitBlue)"/>
    <path d="M -16 56 L -9 76 L 9 76 L 16 56" fill="#1a3a5a"/>
    <rect x="-9" y="51" width="18" height="31" fill="#e8e8e0"/>
    <ellipse cx="0" cy="19" rx="21" ry="27" fill="url(#pixelFace3)"/>
    <rect x="-21" y="6" width="42" height="34" fill="url(#pixelFace3)"/>
  </g>

  <!-- Person 7 - Gray suit -->
  <g transform="translate(670, 223)">
    <ellipse cx="0" cy="79" rx="35" ry="51" fill="url(#suitGray)"/>
    <rect x="-10" y="50" width="20" height="35" fill="#ffffff"/>
    <rect x="-35" y="71" width="70" height="10" fill="url(#suitGray)"/>
    <ellipse cx="0" cy="20" rx="22" ry="28" fill="url(#pixelFace1)"/>
    <rect x="-22" y="5" width="44" height="36" fill="url(#pixelFace1)"/>
  </g>

  <!-- Person 8 (far right) - Dark suit -->
  <g transform="translate(750, 226)">
    <ellipse cx="0" cy="78" rx="34" ry="50" fill="url(#suitDark)"/>
    <rect x="-10" y="50" width="20" height="35" fill="#ffffff"/>
    <rect x="-34" y="70" width="68" height="10" fill="url(#suitDark)"/>
    <ellipse cx="0" cy="19" rx="21" ry="27" fill="url(#pixelFace2)"/>
    <rect x="-21" y="6" width="42" height="34" fill="url(#pixelFace2)"/>
  </g>

  <!-- Shadows on floor -->
  <g opacity="0.3">
    <ellipse cx="120" cy="410" rx="30" ry="8" fill="#000000"/>
    <ellipse cx="220" cy="410" rx="28" ry="8" fill="#000000"/>
    <ellipse cx="310" cy="410" rx="30" ry="8" fill="#000000"/>
    <ellipse cx="400" cy="410" rx="32" ry="8" fill="#000000"/>
    <ellipse cx="490" cy="410" rx="31" ry="8" fill="#000000"/>
    <ellipse cx="580" cy="410" rx="29" ry="8" fill="#000000"/>
    <ellipse cx="670" cy="410" rx="31" ry="8" fill="#000000"/>
    <ellipse cx="750" cy="410" rx="30" ry="8" fill="#000000"/>
  </g>

  <!-- Additional pixelation effect overlay on faces for extra blur -->
  <g opacity="0.5">
    <!-- Mosaic blocks on each face area -->
    <rect x="98" y="225" width="44" height="38" fill="#c4b4a0" opacity="0.4"/>
    <rect x="200" y="235" width="40" height="32" fill="#d4c4b0" opacity="0.4"/>
    <rect x="289" y="231" width="42" height="34" fill="#b49488" opacity="0.4"/>
    <rect x="377" y="225" width="46" height="38" fill="#c4b4a0" opacity="0.4"/>
    <rect x="468" y="220" width="44" height="36" fill="#d4c4b0" opacity="0.4"/>
    <rect x="559" y="234" width="42" height="34" fill="#b49488" opacity="0.4"/>
    <rect x="648" y="228" width="44" height="36" fill="#c4b4a0" opacity="0.4"/>
    <rect x="729" y="232" width="42" height="34" fill="#d4c4b0" opacity="0.4"/>
  </g>

  <!-- Camera flash effect (bright overlay) -->
  <rect x="0" y="0" width="800" height="500" fill="#ffffff" opacity="0.08"/>

  <!-- Photo timestamp (bottom right corner) -->
  <g opacity="0.6">
    <text x="770" y="485" font-family="monospace" font-size="12" fill="#4a4a4a" text-anchor="end">2024-08-15 14:32</text>
  </g>

  <!-- Subtle vignette -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#000000" stroke-width="40" opacity="0.08"/>
</svg>