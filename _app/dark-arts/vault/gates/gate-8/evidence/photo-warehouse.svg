<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Warehouse at Dusk - Kadıköy District, Istanbul -->

  <defs>
    <!-- Dusk sky gradient -->
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#5c3d5e;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#8b4f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97531;stop-opacity:1" />
    </linearGradient>

    <!-- Metal corrugation gradient -->
    <linearGradient id="metalPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a5a6a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5f6f7f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5a6a;stop-opacity:1" />
    </linearGradient>

    <!-- Security light cone -->
    <radialGradient id="securityLight" cx="30%" cy="20%">
      <stop offset="0%" style="stop-color:#ffdb4d;stop-opacity:0.9" />
      <stop offset="20%" style="stop-color:#ffc933;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#cc9900;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Concrete texture -->
    <linearGradient id="concrete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a8388;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a6368;stop-opacity:1" />
    </linearGradient>

    <!-- Razor wire pattern -->
    <pattern id="razorPattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 10 5" stroke="#8a9ba8" stroke-width="1.5"/>
      <path d="M 5 3 L 7 5 L 5 7" stroke="#8a9ba8" stroke-width="1" fill="none"/>
      <path d="M 15 3 L 17 5 L 15 7" stroke="#8a9ba8" stroke-width="1" fill="none"/>
    </pattern>

    <!-- Chain link fence pattern -->
    <pattern id="chainLink" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 Q 7.5 7.5 15 15 Q 22.5 22.5 30 15" stroke="#4a5a6a" stroke-width="2" fill="none"/>
      <path d="M 0 0 Q 7.5 7.5 15 0 Q 22.5 -7.5 30 0" stroke="#4a5a6a" stroke-width="2" fill="none"/>
      <path d="M 0 30 Q 7.5 22.5 15 30" stroke="#4a5a6a" stroke-width="2" fill="none"/>
    </pattern>

    <!-- Gravel texture -->
    <filter id="gravel">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="1"/>
      <feColorMatrix type="saturate" values="0.3"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="300" fill="url(#duskSky)"/>

  <!-- Distant horizon glow -->
  <ellipse cx="700" cy="280" rx="200" ry="60" fill="#d97531" opacity="0.4"/>

  <!-- Ground (gravel) -->
  <rect x="0" y="300" width="800" height="200" fill="#3a3a3a"/>
  <rect x="0" y="300" width="800" height="200" fill="#4a4a4a" filter="url(#gravel)" opacity="0.6"/>

  <!-- Scattered rocks/debris on ground -->
  <ellipse cx="150" cy="380" rx="8" ry="5" fill="#2a2a2a" opacity="0.7"/>
  <ellipse cx="280" cy="420" rx="6" ry="4" fill="#2a2a2a" opacity="0.7"/>
  <ellipse cx="520" cy="390" rx="7" ry="5" fill="#2a2a2a" opacity="0.7"/>
  <ellipse cx="680" cy="440" rx="9" ry="6" fill="#2a2a2a" opacity="0.7"/>

  <!-- Shipping containers in background (right side) -->
  <g opacity="0.6">
    <rect x="650" y="240" width="120" height="60" fill="#8b3a3a" stroke="#6a2a2a" stroke-width="2"/>
    <rect x="655" y="245" width="110" height="50" fill="none" stroke="#6a2a2a" stroke-width="1"/>
    <rect x="650" y="180" width="130" height="60" fill="#3a5a8b" stroke="#2a4a6a" stroke-width="2"/>
    <rect x="655" y="185" width="120" height="50" fill="none" stroke="#2a4a6a" stroke-width="1"/>
  </g>

  <!-- Main warehouse building -->
  <g>
    <!-- Loading dock concrete platform -->
    <rect x="200" y="280" width="450" height="30" fill="url(#concrete)"/>
    <rect x="200" y="280" width="450" height="5" fill="#8a9398" opacity="0.5"/>

    <!-- Warehouse wall - corrugated metal -->
    <rect x="250" y="120" width="400" height="160" fill="#3a4a5a"/>

    <!-- Corrugation ridges (vertical lines) -->
    <line x1="270" y1="120" x2="270" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="280" stroke="#4a5a6a" stroke-width="1"/>
    <line x1="290" y1="120" x2="290" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="300" y1="120" x2="300" y2="280" stroke="#4a5a6a" stroke-width="1"/>
    <line x1="310" y1="120" x2="310" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="320" y1="120" x2="320" y2="280" stroke="#4a5a6a" stroke-width="1"/>
    <line x1="330" y1="120" x2="330" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="340" y1="120" x2="340" y2="280" stroke="#4a5a6a" stroke-width="1"/>
    <line x1="360" y1="120" x2="360" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="380" y1="120" x2="380" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="400" y1="120" x2="400" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="420" y1="120" x2="420" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="440" y1="120" x2="440" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="460" y1="120" x2="460" y2="280" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="480" y1="120" x2="480" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="500" y1="120" x2="500" y2="280" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="520" y1="120" x2="520" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="540" y1="120" x2="540" y2="280" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="560" y1="120" x2="560" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="580" y1="120" x2="580" y2="280" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="600" y1="120" x2="600" y2="280" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="620" y1="120" x2="620" y2="280" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="640" y1="120" x2="640" y2="280" stroke="#2a3a4a" stroke-width="2"/>

    <!-- Large "7" painted on wall (faded white) -->
    <text x="370" y="220" font-family="Arial, sans-serif" font-size="120" font-weight="bold"
          fill="#d4d4d4" opacity="0.4">7</text>

    <!-- East entrance door (slightly ajar) -->
    <rect x="480" y="190" width="80" height="90" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="3"/>
    <!-- Door frame -->
    <rect x="476" y="186" width="88" height="98" fill="none" stroke="#5a6a7a" stroke-width="2"/>
    <!-- Door handle -->
    <rect x="550" y="233" width="8" height="4" fill="#8a9aa8" rx="1"/>
    <!-- Door ajar - dark gap -->
    <rect x="558" y="190" width="3" height="90" fill="#0a0a0a"/>
    <!-- Light spilling from crack -->
    <rect x="559" y="200" width="2" height="70" fill="#ffdb4d" opacity="0.3"/>
  </g>

  <!-- Security light fixture above door -->
  <g>
    <!-- Light housing -->
    <rect x="515" y="165" width="30" height="15" fill="#2a2a2a" rx="3"/>
    <!-- Conduit -->
    <rect x="528" y="150" width="4" height="15" fill="#3a3a3a"/>
    <!-- Light cone effect -->
    <ellipse cx="530" cy="200" rx="80" ry="100" fill="url(#securityLight)" opacity="0.7"/>
    <!-- Bright center -->
    <ellipse cx="530" cy="180" rx="15" ry="8" fill="#ffdb4d" opacity="0.8"/>
  </g>

  <!-- Chain-link fence in foreground -->
  <g>
    <!-- Fence posts -->
    <rect x="50" y="200" width="8" height="220" fill="#3a3a3a"/>
    <rect x="200" y="200" width="8" height="220" fill="#3a3a3a"/>
    <rect x="100" y="180" width="8" height="240" fill="#3a3a3a"/>

    <!-- Chain link mesh -->
    <rect x="50" y="200" width="155" height="150" fill="url(#chainLink)" opacity="0.7"/>

    <!-- Top rail -->
    <rect x="48" y="198" width="162" height="6" fill="#4a5a6a"/>

    <!-- Razor wire coils on top -->
    <g opacity="0.8">
      <!-- Wire spine -->
      <path d="M 50 195 Q 70 190 90 195 Q 110 200 130 195 Q 150 190 170 195 Q 190 200 210 195"
            stroke="#7a8a98" stroke-width="3" fill="none"/>
      <!-- Coils -->
      <circle cx="60" cy="192" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="80" cy="197" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="100" cy="193" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="120" cy="198" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="140" cy="193" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="160" cy="197" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="180" cy="193" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>
      <circle cx="200" cy="198" r="8" fill="none" stroke="#8a9ba8" stroke-width="2"/>

      <!-- Barbs -->
      <rect x="55" y="188" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="75" y="193" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="95" y="189" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="115" y="194" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="135" y="189" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="155" y="193" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="175" y="189" width="10" height="8" fill="url(#razorPattern)"/>
      <rect x="195" y="194" width="10" height="8" fill="url(#razorPattern)"/>
    </g>
  </g>

  <!-- Roof edge -->
  <polygon points="240,120 250,115 650,115 660,120" fill="#2a3a4a"/>

  <!-- Shadows -->
  <rect x="250" y="278" width="400" height="8" fill="#000000" opacity="0.4"/>
  <polygon points="50,350 58,350 58,420 50,420" fill="#000000" opacity="0.3"/>
  <polygon points="100,330 108,330 108,420 100,420" fill="#000000" opacity="0.3"/>
  <polygon points="200,350 208,350 208,420 200,420" fill="#000000" opacity="0.3"/>

  <!-- Atmospheric depth - vignette -->
  <rect x="0" y="0" width="800" height="500" fill="#000000" opacity="0.15"/>
  <ellipse cx="400" cy="250" rx="450" ry="280" fill="none" stroke="#000000" stroke-width="80" opacity="0.3"/>
</svg>