<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Handwritten Note Close-up - Operational Details -->

  <defs>
    <!-- Paper gradient -->
    <linearGradient id="notePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcfcf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f8f0;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow gradient for photo depth -->
    <linearGradient id="photoShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.05" />
    </linearGradient>

    <!-- Ink gradient for pen -->
    <linearGradient id="penInk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a4a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background (photo taken at slight angle, so add shadow effect) -->
  <rect x="0" y="0" width="500" height="700" fill="#e8e8e0"/>
  <rect x="20" y="30" width="460" height="640" fill="url(#photoShadow)"/>

  <!-- Notebook paper -->
  <rect x="15" y="25" width="460" height="640" fill="url(#notePaper)"/>

  <!-- Left margin red line -->
  <line x1="85" y1="25" x2="85" y2="665" stroke="#e84a3c" stroke-width="2"/>

  <!-- Horizontal blue lines (college ruled - 9mm spacing ≈ 25px) -->
  <g stroke="#b8d4e8" stroke-width="1" opacity="0.6">
    <line x1="15" y1="100" x2="475" y2="100"/>
    <line x1="15" y1="125" x2="475" y2="125"/>
    <line x1="15" y1="150" x2="475" y2="150"/>
    <line x1="15" y1="175" x2="475" y2="175"/>
    <line x1="15" y1="200" x2="475" y2="200"/>
    <line x1="15" y1="225" x2="475" y2="225"/>
    <line x1="15" y1="250" x2="475" y2="250"/>
    <line x1="15" y1="275" x2="475" y2="275"/>
    <line x1="15" y1="300" x2="475" y2="300"/>
    <line x1="15" y1="325" x2="475" y2="325"/>
    <line x1="15" y1="350" x2="475" y2="350"/>
    <line x1="15" y1="375" x2="475" y2="375"/>
    <line x1="15" y1="400" x2="475" y2="400"/>
    <line x1="15" y1="425" x2="475" y2="425"/>
    <line x1="15" y1="450" x2="475" y2="450"/>
    <line x1="15" y1="475" x2="475" y2="475"/>
    <line x1="15" y1="500" x2="475" y2="500"/>
    <line x1="15" y1="525" x2="475" y2="525"/>
    <line x1="15" y1="550" x2="475" y2="550"/>
    <line x1="15" y1="575" x2="475" y2="575"/>
    <line x1="15" y1="600" x2="475" y2="600"/>
    <line x1="15" y1="625" x2="475" y2="625"/>
  </g>

  <!-- Handwritten text - hasty, slightly slanted -->
  <g font-family="cursive" fill="#1a2a3a">
    <!-- Date at top (smaller) -->
    <text x="95" y="95" font-size="16" opacity="0.7" transform="rotate(-2 95 95)">Tues, 6:20pm</text>

    <!-- Main operational details line 1 -->
    <text x="100" y="195" font-size="28" font-weight="normal" transform="rotate(-1.5 100 195)">W-7, east gate,</text>

    <!-- Line 2 -->
    <text x="105" y="245" font-size="28" font-weight="normal" transform="rotate(-2 105 245)">2000hrs</text>

    <!-- Spacing, then line 3 -->
    <text x="100" y="320" font-size="24" transform="rotate(-1 100 320)">Contact on site.</text>

    <!-- Line 4 -->
    <text x="105" y="370" font-size="24" transform="rotate(-1.5 105 370)">1 asset. Solo extraction.</text>

    <!-- Crossed out text (earlier attempt) -->
    <g opacity="0.5">
      <text x="100" y="445" font-size="22" transform="rotate(-2 100 445)">meet at dock-</text>
      <line x1="95" y1="442" x2="250" y2="440" stroke="#1a2a3a" stroke-width="2.5"/>
      <line x1="95" y1="446" x2="250" y2="444" stroke="#1a2a3a" stroke-width="2"/>
    </g>

    <!-- More scribbled text below -->
    <g opacity="0.4">
      <text x="105" y="495" font-size="20" transform="rotate(-1 105 495)">backup plan if-</text>
      <!-- Heavy scribble over it -->
      <path d="M 100 480 Q 150 485 200 480 Q 250 475 280 485" stroke="#1a2a3a" stroke-width="3" fill="none" opacity="0.6"/>
      <path d="M 105 488 Q 155 483 205 488 Q 255 493 285 483" stroke="#1a2a3a" stroke-width="3" fill="none" opacity="0.6"/>
      <path d="M 110 492 Q 160 497 210 492 Q 260 487 290 497" stroke="#1a2a3a" stroke-width="3" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- Ink variations (pressure points, slightly darker spots) -->
  <g opacity="0.3">
    <circle cx="240" cy="190" r="2" fill="#1a2a3a"/>
    <circle cx="180" cy="242" r="1.5" fill="#1a2a3a"/>
    <circle cx="150" cy="318" r="2" fill="#1a2a3a"/>
    <circle cx="220" cy="367" r="1.5" fill="#1a2a3a"/>
  </g>

  <!-- Pen resting on paper (bottom right, angled across) -->
  <g transform="translate(350, 550) rotate(-35)">
    <!-- Pen body -->
    <rect x="0" y="-4" width="180" height="8" fill="url(#penInk)" rx="4"/>
    <rect x="1" y="-3" width="178" height="6" fill="#2a4a6a" rx="3"/>

    <!-- Pen clip -->
    <rect x="140" y="-6" width="3" height="12" fill="#5a6a7a" rx="1"/>
    <rect x="141" y="-7" width="1" height="14" fill="#7a8a9a"/>

    <!-- Pen tip (metal) -->
    <polygon points="0,-3 -12,-2 -15,0 -12,2 0,3" fill="#8a9aaa"/>
    <polygon points="-12,-1.5 -18,0 -12,1.5" fill="#6a7a8a"/>

    <!-- Pen cap (top) -->
    <rect x="165" y="-4" width="15" height="8" fill="#1a3a5a" rx="4"/>
    <circle cx="180" cy="0" r="4" fill="#1a3a5a"/>

    <!-- Highlight on pen body -->
    <rect x="20" y="-2.5" width="100" height="2" fill="#4a6a8a" opacity="0.5" rx="1"/>
  </g>

  <!-- Shadow under pen -->
  <ellipse cx="420" cy="620" rx="80" ry="12" fill="#000000" opacity="0.1" transform="rotate(-35 420 620)"/>

  <!-- Paper edge shadow (photo taken at angle) -->
  <rect x="470" y="25" width="8" height="640" fill="#000000" opacity="0.15"/>
  <rect x="15" y="660" width="460" height="8" fill="#000000" opacity="0.15"/>

  <!-- Slight crease in paper (diagonal) -->
  <line x1="300" y1="25" x2="350" y2="665" stroke="#d4d4c8" stroke-width="1.5" opacity="0.4"/>

  <!-- Coffee ring stain (faint, top right) -->
  <circle cx="420" cy="120" r="35" fill="none" stroke="#b8a488" stroke-width="2" opacity="0.2"/>
  <circle cx="420" cy="120" r="38" fill="none" stroke="#b8a488" stroke-width="1" opacity="0.1"/>

  <!-- Small ink smudge (thumb print?) -->
  <ellipse cx="130" cy="540" rx="18" ry="22" fill="#1a2a3a" opacity="0.08" transform="rotate(20 130 540)"/>

  <!-- Vignette effect (photo edges) -->
  <rect x="0" y="0" width="500" height="700" fill="none" stroke="#000000" stroke-width="40" opacity="0.1"/>
</svg>