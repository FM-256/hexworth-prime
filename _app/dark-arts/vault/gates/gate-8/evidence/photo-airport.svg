<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Airport Terminal Selfie - IAH Terminal C, Wednesday 5:30 AM -->

  <defs>
    <!-- Pre-dawn sky gradient outside windows -->
    <linearGradient id="preDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3a4a;stop-opacity:1" />
    </linearGradient>

    <!-- Fluorescent lighting -->
    <linearGradient id="fluorescent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0ff;stop-opacity:1" />
    </linearGradient>

    <!-- Floor reflection -->
    <linearGradient id="floorReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8a9aa8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b4c4d4;stop-opacity:1" />
    </linearGradient>

    <!-- Light glow -->
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Steel beam gradient -->
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a6a7a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7a8a9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a6a7a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background - bright terminal interior -->
  <rect x="0" y="0" width="800" height="500" fill="url(#fluorescent)"/>

  <!-- High ceiling -->
  <rect x="0" y="0" width="800" height="150" fill="#d4e4f4"/>

  <!-- Exposed steel beams -->
  <rect x="0" y="30" width="800" height="20" fill="url(#steelBeam)"/>
  <rect x="0" y="32" width="800" height="4" fill="#4a5a6a"/>
  <rect x="0" y="46" width="800" height="4" fill="#8a9aaa"/>

  <rect x="0" y="80" width="800" height="18" fill="url(#steelBeam)"/>
  <rect x="0" y="82" width="800" height="3" fill="#4a5a6a"/>
  <rect x="0" y="94" width="800" height="3" fill="#8a9aaa"/>

  <!-- Vertical support beams -->
  <rect x="150" y="50" width="12" height="450" fill="url(#steelBeam)"/>
  <rect x="152" y="50" width="3" height="450" fill="#4a5a6a"/>

  <rect x="650" y="50" width="12" height="450" fill="url(#steelBeam)"/>
  <rect x="652" y="50" width="3" height="450" fill="#4a5a6a"/>

  <!-- Large windows showing pre-dawn sky -->
  <rect x="400" y="120" width="350" height="200" fill="url(#preDawn)"/>
  <rect x="400" y="120" width="350" height="200" fill="#1a2a3a" opacity="0.3"/>

  <!-- Window frames -->
  <rect x="395" y="115" width="360" height="210" fill="none" stroke="#5a6a7a" stroke-width="8"/>
  <line x1="575" y1="120" x2="575" y2="320" stroke="#5a6a7a" stroke-width="6"/>
  <line x1="400" y1="220" x2="750" y2="220" stroke="#5a6a7a" stroke-width="6"/>

  <!-- Fluorescent light fixtures (bright bars) -->
  <g filter="url(#lightGlow)">
    <rect x="50" y="110" width="300" height="12" fill="#ffffff" rx="3"/>
    <rect x="450" y="110" width="300" height="12" fill="#ffffff" rx="3"/>
    <ellipse cx="200" cy="116" rx="160" ry="20" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="600" cy="116" rx="160" ry="20" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- IAH TERMINAL C signage on wall -->
  <g>
    <!-- Sign background -->
    <rect x="80" y="180" width="280" height="60" fill="#1a3a5a" rx="5"/>
    <rect x="85" y="185" width="270" height="50" fill="#2a4a6a"/>

    <!-- Text -->
    <text x="220" y="215" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
          fill="#ffffff" text-anchor="middle">IAH TERMINAL C</text>
    <text x="220" y="228" font-family="Arial, sans-serif" font-size="12"
          fill="#c0d0e0" text-anchor="middle">George Bush Intercontinental</text>
  </g>

  <!-- Departure board in background -->
  <g>
    <!-- Board frame -->
    <rect x="420" y="50" width="320" height="55" fill="#1a1a1a" rx="3"/>
    <rect x="425" y="55" width="310" height="45" fill="#0a0a0a"/>

    <!-- Header row -->
    <text x="435" y="70" font-family="monospace" font-size="10" fill="#ffcc00">TIME    FLIGHT   DEST      GATE    STATUS</text>

    <!-- Flight rows (one to IST highlighted) -->
    <text x="435" y="85" font-family="monospace" font-size="10" fill="#00ff00">05:45   UA 4721  DFW       C12     ON TIME</text>

    <!-- Highlighted IST flight -->
    <rect x="425" y="88" width="310" height="12" fill="#ffcc00" opacity="0.2"/>
    <text x="435" y="97" font-family="monospace" font-size="10" fill="#ffcc00" font-weight="bold">06:15   TK 0034  IST       C28     BOARDING</text>
  </g>

  <!-- Gate seating area (right side) -->
  <g opacity="0.7">
    <!-- Seating row -->
    <rect x="500" y="340" width="40" height="35" fill="#3a4a5a" rx="3"/>
    <rect x="545" y="340" width="40" height="35" fill="#3a4a5a" rx="3"/>
    <rect x="590" y="340" width="40" height="35" fill="#3a4a5a" rx="3"/>
    <rect x="635" y="340" width="40" height="35" fill="#3a4a5a" rx="3"/>

    <!-- Metal armrests -->
    <rect x="538" y="340" width="4" height="35" fill="#7a8a9a"/>
    <rect x="583" y="340" width="4" height="35" fill="#7a8a9a"/>
    <rect x="628" y="340" width="4" height="35" fill="#7a8a9a"/>
  </g>

  <!-- Scattered travelers in background -->
  <g opacity="0.5">
    <!-- Traveler 1 - standing with luggage -->
    <ellipse cx="300" cy="280" rx="18" ry="22" fill="#2a3a4a"/>
    <ellipse cx="300" cy="315" rx="28" ry="35" fill="#3a4a5a"/>
    <rect x="320" y="310" width="15" height="30" fill="#4a5a6a" rx="2"/>
    <rect x="322" y="340" width="11" height="8" fill="#5a6a7a" rx="1"/>

    <!-- Traveler 2 - sitting -->
    <ellipse cx="550" cy="330" rx="16" ry="20" fill="#2a3a4a"/>
    <rect x="535" y="345" width="30" height="25" fill="#3a4a5a" rx="4"/>

    <!-- Traveler 3 - walking -->
    <ellipse cx="680" cy="300" rx="17" ry="21" fill="#2a3a4a"/>
    <ellipse cx="680" cy="335" rx="26" ry="32" fill="#3a4a5a"/>

    <!-- Luggage -->
    <rect x="265" y="340" width="20" height="28" fill="#1a2a3a" rx="2"/>
    <circle cx="268" cy="368" r="3" fill="#4a5a6a"/>
    <circle cx="282" cy="368" r="3" fill="#4a5a6a"/>
    <rect x="265" y="335" width="20" height="5" fill="#2a3a4a"/>
  </g>

  <!-- Polished floor with reflection -->
  <rect x="0" y="380" width="800" height="120" fill="url(#floorReflect)"/>
  <rect x="0" y="380" width="800" height="10" fill="#d4e4f4" opacity="0.3"/>

  <!-- Floor reflections (subtle) -->
  <ellipse cx="300" cy="400" rx="25" ry="8" fill="#2a3a4a" opacity="0.2"/>
  <ellipse cx="550" cy="405" rx="28" ry="8" fill="#2a3a4a" opacity="0.2"/>
  <ellipse cx="680" cy="398" rx="24" ry="8" fill="#2a3a4a" opacity="0.2"/>

  <!-- Foreground silhouette (selfie perspective) - person taking photo -->
  <g>
    <!-- Large silhouette in foreground (back to camera) -->
    <!-- Head and shoulder -->
    <ellipse cx="200" cy="320" rx="90" ry="100" fill="#0a0a0a" opacity="0.9"/>
    <ellipse cx="200" cy="420" rx="140" ry="80" fill="#0a0a0a" opacity="0.9"/>

    <!-- Arm holding phone up (implied by position) -->
    <ellipse cx="120" cy="280" rx="35" ry="50" fill="#0a0a0a" opacity="0.9"/>
    <rect x="90" y="240" width="40" height="60" fill="#0a0a0a" opacity="0.9" rx="15"/>

    <!-- Suggestion of phone (small rectangle) -->
    <rect x="85" y="220" width="25" height="40" fill="#1a2a3a" rx="3"/>
    <rect x="87" y="222" width="21" height="36" fill="#3a4a5a"/>
  </g>

  <!-- Bright contrast effect (selfie flash/bright terminal vs dark figure) -->
  <rect x="0" y="0" width="800" height="500" fill="#ffffff" opacity="0.05"/>

  <!-- Time display in corner -->
  <g>
    <text x="750" y="480" font-family="monospace" font-size="18" fill="#4a5a6a" text-anchor="end">05:30 AM</text>
    <text x="750" y="495" font-family="monospace" font-size="12" fill="#6a7a8a" text-anchor="end">Wed Feb 12</text>
  </g>
</svg>