<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Scanned Map - Istanbul with Kadıköy Circled -->

  <defs>
    <!-- Paper texture gradient -->
    <linearGradient id="paperTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4ead5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8dcc8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e4d0;stop-opacity:1" />
    </linearGradient>

    <!-- Water gradient for Bosphorus -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7fb3d5;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6a9bc5;stop-opacity:0.5" />
    </linearGradient>

    <!-- Coffee stain gradient -->
    <radialGradient id="coffeeStain" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8b6f47;stop-opacity:0.3" />
      <stop offset="60%" style="stop-color:#6b4f27;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4b3f17;stop-opacity:0.05" />
    </radialGradient>

    <!-- Fold line shadow -->
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#paperTexture)"/>

  <!-- Paper texture noise effect -->
  <rect x="0" y="0" width="800" height="500" fill="#d4c4a8" opacity="0.05"/>

  <!-- Fold lines -->
  <rect x="395" y="0" width="10" height="500" fill="url(#foldShadow)"/>
  <rect x="0" y="245" width="800" height="10" fill="url(#foldShadow)" opacity="0.5"/>

  <!-- Dog-eared corner (top right) -->
  <polygon points="750,0 800,0 800,50" fill="#c4b4a0"/>
  <polygon points="750,0 800,50 750,50" fill="url(#paperTexture)"/>
  <line x1="750" y1="0" x2="800" y2="50" stroke="#a49080" stroke-width="1"/>

  <!-- Map title -->
  <text x="400" y="40" font-family="Georgia, serif" font-size="24" font-weight="bold"
        fill="#2a2a2a" text-anchor="middle">İSTANBUL</text>
  <text x="400" y="60" font-family="Georgia, serif" font-size="14"
        fill="#4a4a4a" text-anchor="middle">City Map - 1:75,000</text>

  <!-- European side landmass (left) -->
  <path d="M 50 100 Q 120 110 180 130 L 220 160 L 250 200 L 280 250 L 300 310 L 280 370 L 250 420 L 200 450 L 120 460 L 50 450 Z"
        fill="#e4d4c0" stroke="#8a7a60" stroke-width="1.5"/>

  <!-- Asian side landmass (right) -->
  <path d="M 520 110 Q 600 120 650 140 L 700 170 L 730 210 L 750 270 L 740 330 L 710 390 L 660 430 L 590 455 L 520 460 L 480 440 L 460 400 L 450 350 L 460 300 L 480 240 L 500 180 L 510 140 Z"
        fill="#e4d4c0" stroke="#8a7a60" stroke-width="1.5"/>

  <!-- Bosphorus Strait -->
  <path d="M 300 100 Q 320 130 340 180 L 350 230 L 360 280 L 370 330 L 385 380 L 410 420 L 440 450"
        stroke="url(#water)" stroke-width="90" fill="none" opacity="0.7"/>
  <path d="M 300 100 Q 320 130 340 180 L 350 230 L 360 280 L 370 330 L 385 380 L 410 420 L 440 450"
        stroke="#5a8ab5" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Golden Horn -->
  <path d="M 250 200 Q 280 210 310 215 L 340 210"
        stroke="url(#water)" stroke-width="35" fill="none" opacity="0.7"/>
  <path d="M 250 200 Q 280 210 310 215 L 340 210"
        stroke="#5a8ab5" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Major districts labeled -->
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="12" fill="#3a3a3a">Beyoğlu</text>
  <text x="180" y="320" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a">Fatih</text>
  <text x="220" y="380" font-family="Arial, sans-serif" font-size="10" fill="#4a4a4a">Eminönü</text>
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a">Üsküdar</text>

  <!-- Kadıköy label -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#3a3a3a" font-weight="bold">Kadıköy</text>

  <!-- Street grid pattern (simplified) -->
  <g stroke="#a09080" stroke-width="0.5" opacity="0.4">
    <!-- European side streets -->
    <line x1="100" y1="150" x2="250" y2="170"/>
    <line x1="90" y1="200" x2="270" y2="220"/>
    <line x1="110" y1="250" x2="280" y2="265"/>
    <line x1="100" y1="300" x2="290" y2="320"/>
    <line x1="120" y1="350" x2="270" y2="365"/>
    <line x1="140" y1="400" x2="250" y2="410"/>

    <line x1="120" y1="120" x2="130" y2="440"/>
    <line x1="170" y1="130" x2="180" y2="450"/>
    <line x1="220" y1="140" x2="230" y2="430"/>

    <!-- Asian side streets -->
    <line x1="500" y1="160" x2="720" y2="180"/>
    <line x1="490" y1="210" x2="730" y2="230"/>
    <line x1="480" y1="260" x2="740" y2="275"/>
    <line x1="470" y1="310" x2="730" y2="330"/>
    <line x1="480" y1="360" x2="710" y2="380"/>
    <line x1="500" y1="410" x2="680" y2="425"/>

    <line x1="520" y1="150" x2="530" y2="450"/>
    <line x1="580" y1="140" x2="590" y2="455"/>
    <line x1="640" y1="150" x2="650" y2="445"/>
    <line x1="700" y1="180" x2="710" y2="420"/>
  </g>

  <!-- Red circle around Kadıköy (hand-drawn, irregular) -->
  <g>
    <!-- Slightly wobbly circle -->
    <path d="M 650 340 Q 655 320 645 305 Q 630 290 610 288 Q 590 288 575 298 Q 560 310 558 330 Q 558 350 568 368 Q 580 385 600 392 Q 620 395 640 388 Q 655 380 660 365 Q 665 350 650 340"
          fill="none" stroke="#c13832" stroke-width="3" opacity="0.8"/>
    <!-- Double it for emphasis (slightly offset) -->
    <path d="M 651 341 Q 656 321 646 306 Q 631 291 611 289 Q 591 289 576 299 Q 561 311 559 331 Q 559 351 569 369 Q 581 386 601 393 Q 621 396 641 389 Q 656 381 661 366 Q 666 351 651 341"
          fill="none" stroke="#c13832" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Handwritten annotations in pen -->
  <g font-family="cursive" fill="#1a3a5a">
    <!-- "meet point" with arrow -->
    <text x="670" y="350" font-size="14" transform="rotate(-8 670 350)">meet point</text>
    <path d="M 660 352 L 620 365" stroke="#1a3a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#1a3a5a"/>
      </marker>
    </defs>

    <!-- Specific location dot and annotation -->
    <circle cx="600" cy="365" r="4" fill="#c13832"/>
    <text x="555" y="395" font-size="12" transform="rotate(-5 555 395)">W-7, east gate</text>
  </g>

  <!-- Coffee stain ring (bottom right) -->
  <circle cx="680" cy="430" r="45" fill="url(#coffeeStain)"/>
  <circle cx="680" cy="430" r="48" fill="none" stroke="#8b6f47" stroke-width="2" opacity="0.3"/>
  <circle cx="680" cy="430" r="42" fill="none" stroke="#6b4f27" stroke-width="1" opacity="0.2"/>

  <!-- Compass rose (bottom left) -->
  <g transform="translate(100, 420)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
    <!-- North arrow -->
    <polygon points="0,-20 -4,-8 0,-10 4,-8" fill="#c13832"/>
    <text x="0" y="-28" font-family="serif" font-size="14" fill="#2a2a2a" text-anchor="middle">N</text>
    <!-- Cardinal points -->
    <text x="28" y="5" font-family="serif" font-size="10" fill="#4a4a4a">E</text>
    <text x="-28" y="5" font-family="serif" font-size="10" fill="#4a4a4a" text-anchor="end">W</text>
    <text x="0" y="35" font-family="serif" font-size="10" fill="#4a4a4a" text-anchor="middle">S</text>
    <!-- Cross lines -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#4a4a4a" stroke-width="1"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#4a4a4a" stroke-width="1"/>
  </g>

  <!-- Scale bar (bottom center) -->
  <g transform="translate(350, 470)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="#2a2a2a" stroke-width="2"/>
    <text x="50" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#2a2a2a" text-anchor="middle">0        5       10 km</text>
  </g>

  <!-- Pen resting on map (bottom right corner) -->
  <g>
    <rect x="620" y="465" width="150" height="6" fill="#2a4a8a" rx="3" transform="rotate(-25 695 468)"/>
    <rect x="622" y="466" width="146" height="4" fill="#3a5a9a" rx="2" transform="rotate(-25 695 468)"/>
    <polygon points="765,455 775,458 770,465" fill="#c4b4a0" transform="rotate(-25 770 460)"/>
    <circle cx="770" cy="460" r="3" fill="#1a2a3a" transform="rotate(-25 770 460)"/>
  </g>

  <!-- Additional aging marks -->
  <circle cx="200" cy="120" r="3" fill="#8b6f47" opacity="0.2"/>
  <circle cx="550" cy="90" r="2" fill="#8b6f47" opacity="0.15"/>
  <path d="M 300 450 Q 310 452 320 450" stroke="#a09080" stroke-width="1" opacity="0.3"/>
</svg>