<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Beach Scene (Red Herring) - Personal Vacation Photo -->

  <defs>
    <!-- Sky gradient - bright, sunny day -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#b0e4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4f4ff;stop-opacity:1" />
    </linearGradient>

    <!-- Ocean gradient -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40e0d0;stop-opacity:1" />
    </linearGradient>

    <!-- Sand gradient -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b0;stop-opacity:1" />
    </linearGradient>

    <!-- Umbrella stripe pattern -->
    <linearGradient id="umbrellaStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="16%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="16%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="83%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="83%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>

    <!-- Palm frond gradient -->
    <linearGradient id="palmFrond" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a7c2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </linearGradient>

    <!-- Drink gradient -->
    <linearGradient id="drink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="300" fill="url(#sky)"/>

  <!-- Fluffy clouds -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="150" cy="80" rx="40" ry="25"/>
    <ellipse cx="180" cy="75" rx="35" ry="22"/>
    <ellipse cx="200" cy="85" rx="30" ry="20"/>

    <ellipse cx="600" cy="60" rx="50" ry="30"/>
    <ellipse cx="640" cy="55" rx="45" ry="28"/>
    <ellipse cx="670" cy="65" rx="38" ry="24"/>

    <ellipse cx="400" cy="100" rx="35" ry="22"/>
    <ellipse cx="430" cy="95" rx="32" ry="20"/>
  </g>

  <!-- Ocean/water -->
  <rect x="0" y="200" width="800" height="100" fill="url(#ocean)"/>

  <!-- Waves (white foam lines) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 0 220 Q 100 215 200 220 Q 300 225 400 220 Q 500 215 600 220 Q 700 225 800 220"/>
    <path d="M 0 245 Q 80 240 160 245 Q 240 250 320 245 Q 400 240 480 245 Q 560 250 640 245 Q 720 240 800 245"/>
    <path d="M 0 270 Q 120 268 240 270 Q 360 272 480 270 Q 600 268 720 270 Q 760 271 800 270"/>
  </g>

  <!-- Sand/beach -->
  <rect x="0" y="300" width="800" height="200" fill="url(#sand)"/>

  <!-- Sand texture (subtle dots) -->
  <g fill="#d4c4a8" opacity="0.3">
    <circle cx="120" cy="350" r="2"/>
    <circle cx="280" cy="380" r="1.5"/>
    <circle cx="450" cy="360" r="2"/>
    <circle cx="620" cy="390" r="1.5"/>
    <circle cx="340" cy="420" r="2"/>
    <circle cx="580" cy="440" r="1.5"/>
    <circle cx="180" cy="410" r="2"/>
    <circle cx="720" cy="370" r="1.5"/>
  </g>

  <!-- Beach umbrella (red and white stripes) -->
  <g>
    <!-- Umbrella pole -->
    <rect x="145" y="280" width="6" height="140" fill="#8b6f47" rx="3"/>

    <!-- Umbrella canopy (circular segments) -->
    <g transform="translate(148, 280)">
      <!-- Canopy top view -->
      <ellipse cx="0" cy="0" rx="90" ry="40" fill="url(#umbrellaStripe)"/>

      <!-- Segments (radial lines) -->
      <line x1="0" y1="0" x2="-90" y2="0" stroke="#cc3333" stroke-width="2"/>
      <line x1="0" y1="0" x2="-64" y2="-64" stroke="#cc3333" stroke-width="2" transform="rotate(-30)"/>
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#cc3333" stroke-width="2" transform="rotate(-60)"/>
      <line x1="0" y1="0" x2="64" y2="-64" stroke="#cc3333" stroke-width="2" transform="rotate(-120)"/>
      <line x1="0" y1="0" x2="90" y2="0" stroke="#cc3333" stroke-width="2"/>
      <line x1="0" y1="0" x2="64" y2="64" stroke="#cc3333" stroke-width="2" transform="rotate(120)"/>

      <!-- Umbrella tip (center cap) -->
      <circle cx="0" cy="0" r="8" fill="#cc3333"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- Shadow under umbrella -->
    <ellipse cx="148" cy="420" rx="95" ry="15" fill="#000000" opacity="0.2"/>
  </g>

  <!-- Palm trees (right side) -->
  <g>
    <!-- Trunk 1 -->
    <path d="M 680 250 Q 685 280 680 310 Q 678 340 680 370 Q 682 400 680 430 Q 678 460 680 500"
          stroke="#8b6f47" stroke-width="18" fill="none"/>
    <path d="M 680 250 Q 685 280 680 310 Q 678 340 680 370 Q 682 400 680 430 Q 678 460 680 500"
          stroke="#a08858" stroke-width="14" fill="none"/>

    <!-- Trunk texture (horizontal marks) -->
    <line x1="672" y1="280" x2="688" y2="280" stroke="#6b5037" stroke-width="2"/>
    <line x1="672" y1="320" x2="688" y2="320" stroke="#6b5037" stroke-width="2"/>
    <line x1="672" y1="360" x2="688" y2="360" stroke="#6b5037" stroke-width="2"/>
    <line x1="672" y1="400" x2="688" y2="400" stroke="#6b5037" stroke-width="2"/>
    <line x1="672" y1="440" x2="688" y2="440" stroke="#6b5037" stroke-width="2"/>

    <!-- Palm fronds -->
    <g transform="translate(680, 250)">
      <!-- Frond 1 (upper right) -->
      <path d="M 0 0 Q 40 -30 80 -50" stroke="url(#palmFrond)" stroke-width="8" fill="none"/>
      <path d="M 20 -15 L 30 -25 L 25 -18 Z" fill="#4a7c2a"/>
      <path d="M 40 -25 L 50 -35 L 45 -28 Z" fill="#4a7c2a"/>
      <path d="M 60 -35 L 70 -45 L 65 -38 Z" fill="#4a7c2a"/>

      <!-- Frond 2 (upper left) -->
      <path d="M 0 0 Q -40 -30 -80 -45" stroke="url(#palmFrond)" stroke-width="8" fill="none"/>
      <path d="M -20 -15 L -30 -25 L -25 -18 Z" fill="#4a7c2a"/>
      <path d="M -40 -25 L -50 -35 L -45 -28 Z" fill="#4a7c2a"/>
      <path d="M -60 -32 L -70 -42 L -65 -35 Z" fill="#4a7c2a"/>

      <!-- Frond 3 (middle right) -->
      <path d="M 0 0 Q 50 -10 90 -10" stroke="url(#palmFrond)" stroke-width="7" fill="none"/>
      <path d="M 30 -5 L 38 -8 L 35 -4 Z" fill="#4a7c2a"/>
      <path d="M 60 -8 L 68 -9 L 65 -7 Z" fill="#4a7c2a"/>

      <!-- Frond 4 (middle left) -->
      <path d="M 0 0 Q -50 -8 -85 -5" stroke="url(#palmFrond)" stroke-width="7" fill="none"/>
      <path d="M -30 -4 L -38 -6 L -35 -3 Z" fill="#4a7c2a"/>
      <path d="M -60 -5 L -68 -5 L -65 -4 Z" fill="#4a7c2a"/>

      <!-- Frond 5 (center top) -->
      <path d="M 0 0 Q 5 -40 0 -80" stroke="url(#palmFrond)" stroke-width="8" fill="none"/>
      <path d="M 2 -30 L 8 -35 L 4 -32 Z" fill="#4a7c2a"/>
      <path d="M 3 -50 L 9 -55 L 5 -52 Z" fill="#4a7c2a"/>
      <path d="M 1 -70 L 7 -75 L 3 -72 Z" fill="#4a7c2a"/>
    </g>
  </g>

  <!-- Distant figure walking along shoreline -->
  <g opacity="0.6">
    <ellipse cx="500" cy="270" rx="8" ry="10" fill="#2a3a4a"/>
    <ellipse cx="500" cy="285" rx="12" ry="15" fill="#3a4a5a"/>
    <line x1="495" y1="300" x2="492" y2="315" stroke="#2a3a4a" stroke-width="3"/>
    <line x1="505" y1="300" x2="508" y2="315" stroke="#2a3a4a" stroke-width="3"/>
  </g>

  <!-- Tropical drink with umbrella (bottom left corner) -->
  <g transform="translate(80, 430)">
    <!-- Glass -->
    <path d="M -20 0 L -15 40 L 15 40 L 20 0 Z" fill="url(#drink)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#ffcc00"/>
    <ellipse cx="0" cy="40" rx="15" ry="6" fill="#ff8800" opacity="0.6"/>

    <!-- Ice cubes (lighter squares) -->
    <rect x="-8" y="15" width="8" height="8" fill="#ffffff" opacity="0.4"/>
    <rect x="2" y="22" width="7" height="7" fill="#ffffff" opacity="0.4"/>

    <!-- Straw -->
    <rect x="8" y="-15" width="3" height="55" fill="#ff4444" rx="1.5"/>
    <rect x="9" y="-15" width="1" height="55" fill="#ff8888"/>

    <!-- Decorative umbrella pick -->
    <line x1="-5" y1="0" x2="-5" y2="-25" stroke="#4a7c2a" stroke-width="1"/>
    <path d="M -5 -25 Q -15 -23 -20 -25 Q -15 -27 -5 -25 Q 5 -27 0 -25 Q -2 -23 -5 -25"
          fill="#ff4444"/>

    <!-- Orange slice on rim -->
    <circle cx="-18" cy="0" r="8" fill="#ff8800" opacity="0.8"/>
    <circle cx="-18" cy="0" r="6" fill="#ffaa44" opacity="0.6"/>
    <line x1="-18" y1="-6" x2="-18" y2="6" stroke="#ff8800" stroke-width="1"/>
    <line x1="-24" y1="0" x2="-12" y2="0" stroke="#ff8800" stroke-width="1"/>
  </g>

  <!-- Shadow of drink -->
  <ellipse cx="80" cy="478" rx="25" ry="8" fill="#000000" opacity="0.15"/>

  <!-- Sun glare effect (bright spot in sky) -->
  <g opacity="0.4">
    <circle cx="700" cy="100" r="60" fill="#ffffff"/>
    <circle cx="700" cy="100" r="40" fill="#ffffcc"/>
  </g>

  <!-- Subtle vignette for photo effect -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#000000" stroke-width="50" opacity="0.05"/>
</svg>