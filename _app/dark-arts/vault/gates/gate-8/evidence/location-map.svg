<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Route Map - Full Journey Visualization -->

  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2638;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>

    <!-- Route glow effect -->
    <filter id="routeGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon glow -->
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulsing animation for signal lost -->
    <animate id="pulse" attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#darkBg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#2a3a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Simplified continental outlines (very minimal) -->
  <g stroke="#3a4a5a" stroke-width="2" fill="none" opacity="0.4">
    <!-- East coast US (left side) -->
    <path d="M 80 150 L 100 180 L 90 220 L 100 260 L 80 300"/>
    <!-- Europe (middle-right) -->
    <path d="M 500 180 L 520 200 L 540 190 L 560 210"/>
    <!-- Turkey/Asia Minor (far right) -->
    <path d="M 650 230 L 680 240 L 700 260 L 720 270"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
        fill="#ffd966" text-anchor="middle" opacity="0.9">OPERATION TIMELINE - GONE DARK</text>

  <!-- Route path -->
  <g filter="url(#routeGlow)">
    <!-- Arlington to Georgetown (short line) -->
    <line x1="120" y1="240" x2="150" y2="220" stroke="#ffd966" stroke-width="3"/>

    <!-- Georgetown to IAH airport (line to airport) -->
    <line x1="150" y1="220" x2="200" y2="260" stroke="#ffd966" stroke-width="3"/>

    <!-- Flight arc across Atlantic (dotted arc) -->
    <path d="M 200 260 Q 350 150 650 240" stroke="#ffd966" stroke-width="3"
          stroke-dasharray="10,8" fill="none"/>

    <!-- Istanbul to Kadıköy (short line) -->
    <line x1="650" y1="240" x2="700" y2="270" stroke="#ffd966" stroke-width="3"/>

    <!-- Final position to signal lost -->
    <line x1="700" y1="270" x2="720" y2="300" stroke="#ffd966" stroke-width="3" stroke-dasharray="5,5"/>
  </g>

  <!-- Location 1: Arlington, VA (home icon) -->
  <g transform="translate(120, 240)" filter="url(#iconGlow)">
    <!-- Home icon -->
    <path d="M -12 0 L 0 -12 L 12 0 L 12 12 L 8 12 L 8 4 L -8 4 L -8 12 L -12 12 Z"
          fill="#66b3ff" stroke="#4d9fff" stroke-width="1.5"/>
    <rect x="-3" y="4" width="6" height="8" fill="#3a8fef"/>
    <!-- Label -->
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="12" fill="#ffd966" text-anchor="middle">Arlington, VA</text>
    <!-- Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffd966"/>
  </g>

  <!-- Location 2: Georgetown DC (restaurant icon) -->
  <g transform="translate(150, 220)" filter="url(#iconGlow)">
    <!-- Restaurant icon (fork and knife) -->
    <rect x="-10" y="-12" width="20" height="18" fill="#ff8c66" stroke="#ff7050" stroke-width="1.5" rx="2"/>
    <line x1="-5" y1="-9" x2="-5" y2="-3" stroke="#ffffff" stroke-width="2"/>
    <line x1="5" y1="-9" x2="5" y2="-3" stroke="#ffffff" stroke-width="2"/>
    <circle cx="5" cy="-7" r="1.5" fill="#ffffff"/>
    <!-- Label with timeline -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#ffd966" text-anchor="middle">Georgetown DC</text>
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="10" fill="#ff8c66" text-anchor="middle">Mon evening</text>
    <!-- Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffd966"/>
  </g>

  <!-- Location 3: IAH Airport (plane icon) -->
  <g transform="translate(200, 260)" filter="url(#iconGlow)">
    <!-- Airplane icon -->
    <path d="M -8 0 L 0 -3 L 8 0 L 6 2 L 2 1 L 0 4 L -2 1 L -6 2 Z"
          fill="#66ff99" stroke="#50ff80" stroke-width="1.5"/>
    <ellipse cx="0" cy="-2" rx="3" ry="2" fill="#66ff99"/>
    <rect x="-1" y="-8" width="2" height="6" fill="#66ff99"/>
    <!-- Label with timeline -->
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="12" fill="#ffd966" text-anchor="middle">IAH</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#66ff99" text-anchor="middle">Wed 5:30 AM</text>
    <!-- Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffd966"/>
  </g>

  <!-- Flight path indicator (small plane along arc) -->
  <g transform="translate(425, 200)">
    <path d="M -6 0 L 0 -2 L 6 0 L 4 1.5 L 1.5 0.5 L 0 3 L -1.5 0.5 L -4 1.5 Z"
          fill="#ffd966" opacity="0.7" transform="rotate(35)"/>
  </g>

  <!-- Location 4: Istanbul (map pin) -->
  <g transform="translate(650, 240)" filter="url(#iconGlow)">
    <!-- Map pin icon -->
    <circle cx="0" cy="-8" r="8" fill="#ff66b3" stroke="#ff4d9f" stroke-width="1.5"/>
    <circle cx="0" cy="-8" r="4" fill="#ffffff"/>
    <path d="M 0 0 L -4 -3 L 4 -3 Z" fill="#ff66b3"/>
    <!-- Label with timeline -->
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" fill="#ffd966" text-anchor="middle">Istanbul</text>
    <text x="0" y="31" font-family="Arial, sans-serif" font-size="10" fill="#ff66b3" text-anchor="middle">Wed 12:15 PM</text>
    <!-- Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffd966"/>
  </g>

  <!-- Location 5: Kadıköy (warehouse marker) -->
  <g transform="translate(700, 270)" filter="url(#iconGlow)">
    <!-- Warehouse icon -->
    <rect x="-10" y="-6" width="20" height="12" fill="#9966ff" stroke="#8050ff" stroke-width="1.5"/>
    <polygon points="-10,-6 0,-12 10,-6" fill="#7a50cc" stroke="#8050ff" stroke-width="1.5"/>
    <rect x="-3" y="-2" width="6" height="8" fill="#5a3a8a"/>
    <!-- Label -->
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="12" fill="#ffd966" text-anchor="middle">Kadıköy</text>
    <!-- Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffd966"/>
  </g>

  <!-- Location 6: SIGNAL LOST (red X with warning) -->
  <g transform="translate(720, 300)">
    <!-- Pulsing danger circle -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff3333" stroke-width="2.5" opacity="0.6">
      <animate attributeName="r" values="25;30;25" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Red X -->
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ff3333" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#ff3333" stroke-width="5" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ff6666" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#ff6666" stroke-width="3" stroke-linecap="round"/>

    <!-- Label with timeline -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
          fill="#ff3333" text-anchor="middle">SIGNAL LOST</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#ff6666" text-anchor="middle">Wed ~9:02 PM</text>

    <!-- Warning symbol (triangle with exclamation) -->
    <g transform="translate(35, -5)">
      <polygon points="0,-10 -9,8 9,8" fill="none" stroke="#ff3333" stroke-width="2"/>
      <line x1="0" y1="-4" x2="0" y2="3" stroke="#ff3333" stroke-width="2.5"/>
      <circle cx="0" cy="6" r="1.5" fill="#ff3333"/>
    </g>
  </g>

  <!-- Legend box (bottom left) -->
  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="200" height="80" fill="#1a2638" stroke="#3a4a5a" stroke-width="2" rx="5" opacity="0.9"/>

    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffd966">LEGEND</text>

    <line x1="10" y1="35" x2="35" y2="35" stroke="#ffd966" stroke-width="3"/>
    <text x="45" y="39" font-family="Arial, sans-serif" font-size="10" fill="#c0c0c0">Ground travel</text>

    <line x1="10" y1="52" x2="35" y2="52" stroke="#ffd966" stroke-width="3" stroke-dasharray="10,8"/>
    <text x="45" y="56" font-family="Arial, sans-serif" font-size="10" fill="#c0c0c0">Air travel</text>

    <line x1="10" y1="69" x2="35" y2="69" stroke="#ff3333" stroke-width="3"/>
    <text x="45" y="73" font-family="Arial, sans-serif" font-size="10" fill="#c0c0c0">Lost signal</text>
  </g>

  <!-- Time elapsed indicator (bottom right) -->
  <g transform="translate(600, 420)">
    <rect x="0" y="0" width="180" height="60" fill="#1a2638" stroke="#3a4a5a" stroke-width="2" rx="5" opacity="0.9"/>

    <text x="10" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffd966">TOTAL ELAPSED:</text>
    <text x="10" y="38" font-family="monospace" font-size="14" fill="#66ff99">~51 hours</text>
    <text x="10" y="52" font-family="Arial, sans-serif" font-size="9" fill="#c0c0c0">Mon 7PM → Wed 9PM (EST)</text>
  </g>

  <!-- Distance markers along route -->
  <text x="325" y="140" font-family="Arial, sans-serif" font-size="9" fill="#8090a0" text-anchor="middle">~5,800 mi</text>

  <!-- Coordinates display (top right corner) -->
  <g transform="translate(620, 80)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#8090a0">LAST KNOWN:</text>
    <text x="0" y="15" font-family="monospace" font-size="10" fill="#ff6666">40.9942°N, 29.0258°E</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#8090a0">(Kadıköy, Istanbul)</text>
  </g>

  <!-- Classification marking (top left) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="150" height="30" fill="#ff3333" opacity="0.2" stroke="#ff3333" stroke-width="2"/>
    <text x="75" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
          fill="#ff3333" text-anchor="middle">CLASSIFIED</text>
  </g>

  <!-- Subtle scanline effect -->
  <g opacity="0.05">
    <rect x="0" y="0" width="800" height="2" fill="#ffffff"/>
    <rect x="0" y="100" width="800" height="2" fill="#ffffff"/>
    <rect x="0" y="200" width="800" height="2" fill="#ffffff"/>
    <rect x="0" y="300" width="800" height="2" fill="#ffffff"/>
    <rect x="0" y="400" width="800" height="2" fill="#ffffff"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#000000" stroke-width="60" opacity="0.3"/>
</svg>