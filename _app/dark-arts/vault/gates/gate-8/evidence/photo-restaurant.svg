<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- The Anchor Restaurant - Georgetown DC, Monday Evening -->

  <!-- Background gradient - dark, moody interior -->
  <defs>
    <!-- Ambient lighting gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0805;stop-opacity:1" />
    </linearGradient>

    <!-- Wood texture gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d2817;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a3420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2817;stop-opacity:1" />
    </linearGradient>

    <!-- Warm light cone -->
    <radialGradient id="warmLight" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffb347;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#ff8c42;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a0f0a;stop-opacity:0" />
    </radialGradient>

    <!-- Candlelight -->
    <radialGradient id="candle" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffe4b3;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffb347;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:0" />
    </radialGradient>

    <!-- Neon glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect x="0" y="0" width="800" height="500" fill="url(#wallGrad)"/>

  <!-- Brick wall texture pattern -->
  <g opacity="0.3">
    <rect x="400" y="0" width="200" height="30" fill="#2a1810"/>
    <rect x="610" y="0" width="190" height="30" fill="#2a1810"/>
    <rect x="450" y="35" width="200" height="30" fill="#2a1810"/>
    <rect x="660" y="35" width="140" height="30" fill="#2a1810"/>
    <rect x="400" y="70" width="180" height="30" fill="#2a1810"/>
    <rect x="590" y="70" width="210" height="30" fill="#2a1810"/>
    <rect x="430" y="105" width="190" height="30" fill="#2a1810"/>
    <rect x="630" y="105" width="170" height="30" fill="#2a1810"/>
    <rect x="410" y="140" width="200" height="30" fill="#2a1810"/>
    <rect x="620" y="140" width="180" height="30" fill="#2a1810"/>
  </g>

  <!-- Overhead warm lighting pools -->
  <ellipse cx="300" cy="150" rx="180" ry="200" fill="url(#warmLight)" opacity="0.7"/>
  <ellipse cx="600" cy="180" rx="200" ry="220" fill="url(#warmLight)" opacity="0.6"/>

  <!-- Window on right side (view from inside) -->
  <rect x="650" y="80" width="130" height="200" fill="#0a0604" stroke="#3d2817" stroke-width="12"/>
  <rect x="656" y="86" width="118" height="188" fill="#1a1410"/>

  <!-- THE ANCHOR neon sign (reversed, seen from inside) -->
  <g filter="url(#neonGlow)">
    <!-- Reversed text effect -->
    <text x="715" y="140" font-family="sans-serif" font-size="16" font-weight="bold"
          fill="#ff6b6b" text-anchor="middle" transform="scale(-1,1) translate(-1430,0)">THE</text>
    <text x="715" y="165" font-family="sans-serif" font-size="20" font-weight="bold"
          fill="#ff6b6b" text-anchor="middle" transform="scale(-1,1) translate(-1430,0)">ANCHOR</text>
    <!-- Glow -->
    <ellipse cx="715" cy="150" rx="50" ry="30" fill="#ff6b6b" opacity="0.2"/>
  </g>

  <!-- Window reflection -->
  <rect x="656" y="86" width="40" height="80" fill="url(#glassReflect)"/>

  <!-- Foreground booth seating - dark wood -->
  <g>
    <!-- Left booth back -->
    <rect x="20" y="250" width="180" height="200" fill="url(#woodGrad)" rx="8"/>
    <rect x="25" y="255" width="170" height="15" fill="#4a3420" opacity="0.5"/>
    <rect x="25" y="430" width="170" height="15" fill="#2a1810" opacity="0.8"/>

    <!-- Left booth seat -->
    <ellipse cx="110" cy="380" rx="90" ry="40" fill="#5a4030"/>
    <rect x="20" y="340" width="180" height="40" fill="#5a4030"/>
    <ellipse cx="110" cy="345" rx="85" ry="35" fill="#6a5040"/>
  </g>

  <!-- Back table with two silhouettes -->
  <g>
    <!-- Table surface -->
    <ellipse cx="520" cy="280" rx="80" ry="35" fill="#3d2817"/>
    <ellipse cx="520" cy="275" rx="78" ry="33" fill="#4a3420"/>

    <!-- Candlelight on table -->
    <ellipse cx="520" cy="270" rx="30" ry="20" fill="url(#candle)" opacity="0.8"/>
    <circle cx="520" cy="268" r="3" fill="#ffe4b3"/>

    <!-- Whiskey glasses -->
    <!-- Glass 1 -->
    <g opacity="0.7">
      <rect x="480" y="270" width="20" height="25" fill="#8b4513" rx="2"/>
      <rect x="481" y="271" width="18" height="3" fill="url(#glassReflect)"/>
      <ellipse cx="490" cy="270" rx="10" ry="4" fill="#a0522d"/>
    </g>

    <!-- Glass 2 -->
    <g opacity="0.7">
      <rect x="540" y="272" width="20" height="23" fill="#8b4513" rx="2"/>
      <rect x="541" y="273" width="18" height="3" fill="url(#glassReflect)"/>
      <ellipse cx="550" cy="272" rx="10" ry="4" fill="#a0522d"/>
    </g>

    <!-- Left silhouette - leaning forward -->
    <g opacity="0.9">
      <!-- Head -->
      <ellipse cx="450" cy="200" rx="28" ry="32" fill="#0d0805"/>
      <!-- Shoulders -->
      <ellipse cx="450" cy="240" rx="50" ry="35" fill="#0d0805"/>
      <!-- Arm on table -->
      <rect x="470" y="250" width="30" height="15" fill="#0d0805" rx="5"/>
    </g>

    <!-- Right silhouette - sitting back -->
    <g opacity="0.85">
      <!-- Head -->
      <ellipse cx="590" cy="210" rx="26" ry="30" fill="#0d0805"/>
      <!-- Shoulders -->
      <ellipse cx="590" cy="250" rx="48" ry="38" fill="#0d0805"/>
    </g>
  </g>

  <!-- Background patrons (simple silhouettes) -->
  <g opacity="0.4">
    <!-- Patron 1 - far left -->
    <ellipse cx="120" cy="150" rx="20" ry="24" fill="#0d0805"/>
    <ellipse cx="120" cy="180" rx="35" ry="25" fill="#0d0805"/>

    <!-- Patron 2 - far right -->
    <ellipse cx="750" cy="160" rx="18" ry="22" fill="#0d0805"/>
    <ellipse cx="750" cy="185" rx="32" ry="22" fill="#0d0805"/>
  </g>

  <!-- Overhead lamp (right side) -->
  <g>
    <!-- Lamp shade cone -->
    <path d="M 600 50 L 580 90 L 620 90 Z" fill="#2a1810" stroke="#1a0f0a" stroke-width="2"/>
    <!-- Chain -->
    <line x1="600" y1="0" x2="600" y2="50" stroke="#3d2817" stroke-width="2"/>
    <!-- Light emission -->
    <ellipse cx="600" cy="100" rx="60" ry="40" fill="#ffb347" opacity="0.3"/>
  </g>

  <!-- Overhead lamp (left side) -->
  <g>
    <!-- Lamp shade cone -->
    <path d="M 300 40 L 280 80 L 320 80 Z" fill="#2a1810" stroke="#1a0f0a" stroke-width="2"/>
    <!-- Chain -->
    <line x1="300" y1="0" x2="300" y2="40" stroke="#3d2817" stroke-width="2"/>
    <!-- Light emission -->
    <ellipse cx="300" cy="90" rx="70" ry="45" fill="#ffb347" opacity="0.35"/>
  </g>

  <!-- Floor (dark, barely visible) -->
  <rect x="0" y="450" width="800" height="50" fill="#0a0604"/>

  <!-- Ambient shadows and depth -->
  <rect x="0" y="0" width="400" height="500" fill="#000000" opacity="0.2"/>
  <rect x="0" y="400" width="800" height="100" fill="#000000" opacity="0.3"/>

  <!-- Subtle vignette -->
  <ellipse cx="400" cy="250" rx="500" ry="300" fill="none" stroke="#000000" stroke-width="100" opacity="0.4"/>
</svg>