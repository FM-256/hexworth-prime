<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone — Operation Gone Dark</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'><img src="/assets/images/icons/icon-mobile.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></text></svg>">
    <link rel="stylesheet" href="shared.css">
    <style>
        body { background: #0a0a1a; display: flex; flex-direction: column; }

        .phone-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Phone Frame */
        .phone-frame {
            width: 380px;
            min-height: 700px;
            max-height: 85vh;
            background: #111;
            border: 2px solid #333;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.03);
            position: relative;
        }

        /* Status Bar */
        .phone-statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 24px;
            font-size: 0.6rem;
            color: #aaa;
            background: rgba(0,0,0,0.3);
        }

        .phone-notch {
            width: 120px;
            height: 24px;
            background: #000;
            border-radius: 0 0 16px 16px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Phone Screen */
        .phone-screen {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        /* Home Screen */
        .home-screen {
            padding: 48px 16px 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .app-icon:hover { background: rgba(255,255,255,0.06); }

        .app-icon .ai-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }

        .app-icon .ai-label { font-size: 0.55rem; color: #bbb; text-align: center; }

        .ai-messages { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .ai-photos { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .ai-phone { background: linear-gradient(135deg, #3498db, #2980b9); }
        .ai-credit { background: linear-gradient(135deg, #1a1a4e, #2c3e80); }
        .ai-maps { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .ai-settings { background: linear-gradient(135deg, #555, #333); }
        .ai-camera { background: linear-gradient(135deg, #222, #111); border: 1px solid #444; }
        .ai-browser { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        .app-badge {
            position: absolute;
            top: -4px; right: -4px;
            width: 18px; height: 18px;
            background: #e74c3c;
            border-radius: 50%;
            font-size: 0.5rem;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        /* App Views */
        .app-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .app-view.active { display: flex; }

        .app-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20,20,30,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            gap: 10px;
        }

        .app-back {
            background: none; border: none; color: #3498db;
            font-size: 0.75rem; cursor: pointer; font-family: var(--g8-font);
            padding: 4px 8px;
        }

        .app-title {
            font-size: 0.8rem;
            color: #ddd;
            font-weight: bold;
            flex: 1;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        /* === MESSAGES APP === */
        .msg-thread-list { padding: 0; }

        .msg-thread-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.1s;
        }

        .msg-thread-item:hover { background: rgba(255,255,255,0.03); }

        .msg-thread-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .msg-thread-avatar.sarah { background: rgba(52,152,219,0.2); border: 1px solid rgba(52,152,219,0.3); }
        .msg-thread-avatar.mom { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.2); }
        .msg-thread-avatar.alex { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.2); }
        .msg-thread-avatar.unknown { background: rgba(241,196,15,0.15); border: 1px solid rgba(241,196,15,0.2); }
        .msg-thread-avatar.deleted { background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.1); }

        .msg-thread-info { flex: 1; min-width: 0; }
        .msg-thread-name { font-size: 0.72rem; color: #ddd; font-weight: bold; }
        .msg-thread-preview { font-size: 0.62rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-thread-time { font-size: 0.55rem; color: #666; flex-shrink: 0; }

        /* Chat View */
        .chat-view { padding: 12px 16px; }

        .chat-bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.68rem;
            line-height: 1.5;
            margin-bottom: 6px;
            position: relative;
        }

        .chat-bubble.sent {
            background: #0078d4;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.received {
            background: #2a2a3a;
            color: #ddd;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .chat-time {
            font-size: 0.5rem;
            color: #666;
            text-align: center;
            padding: 8px 0;
        }

        .chat-deleted {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            font-style: italic;
            padding: 12px;
            border: 1px dashed rgba(255,255,255,0.05);
            border-radius: 8px;
            margin: 8px 0;
        }

        .chat-recovered {
            border-color: var(--g8-ev-recovered);
            color: var(--g8-ev-recovered);
            animation: glitchIn 0.6s ease-out;
        }

        /* === PHOTOS APP === */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }

        .photo-thumb {
            aspect-ratio: 1;
            background: #1a1a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: opacity 0.15s;
        }

        .photo-thumb:hover { opacity: 0.85; }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .photo-thumb .pt-icon { font-size: 2rem; opacity: 0.3; }

        .photo-thumb.deleted-photo {
            border: 1px dashed rgba(255,255,255,0.08);
        }

        .photo-thumb.deleted-photo.recovered {
            border-color: var(--g8-ev-recovered);
        }

        .photo-detail {
            padding: 12px;
            text-align: center;
        }

        .photo-detail .pd-image {
            background: #111;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .photo-detail .pd-image img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 4px;
        }

        .photo-detail .pd-exif {
            text-align: left;
            font-size: 0.6rem;
            color: #888;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .photo-detail .pd-exif .exif-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .photo-detail .pd-exif .exif-label { color: var(--g8-amber); }

        /* === CALL LOG === */
        .call-log { padding: 0; }

        .call-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .call-dir {
            font-size: 1rem;
            width: 24px;
            text-align: center;
        }

        .call-dir.outgoing { color: #2ecc71; }
        .call-dir.incoming { color: #3498db; }

        .call-info { flex: 1; }
        .call-name { font-size: 0.7rem; color: #ccc; }
        .call-time { font-size: 0.58rem; color: #666; margin-top: 2px; }
        .call-duration { font-size: 0.6rem; color: #888; }

        /* === VOICEMAIL === */
        .voicemail-section {
            padding: 16px;
            background: rgba(52,152,219,0.05);
            border-bottom: 2px solid rgba(52,152,219,0.2);
            border-top: 2px solid rgba(52,152,219,0.2);
            margin-bottom: 8px;
        }

        .voicemail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .voicemail-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #3498db;
            font-weight: bold;
        }

        .voicemail-badge .vb-icon {
            width: 32px; height: 32px;
            background: rgba(52,152,219,0.15);
            border: 1px solid rgba(52,152,219,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .voicemail-player {
            display: none;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin-top: 12px;
        }

        .voicemail-player.active { display: block; animation: fadeIn 0.3s ease-out; }

        .vm-caller {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .vm-caller-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .vm-caller-info { flex: 1; }
        .vm-caller-name { font-size: 0.7rem; color: #ddd; font-weight: bold; }
        .vm-caller-time { font-size: 0.58rem; color: #888; margin-top: 2px; }
        .vm-duration { font-size: 0.6rem; color: #888; }

        .vm-waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 50px;
            margin: 16px 0;
            padding: 0 20px;
        }

        .vm-bar {
            width: 3px;
            background: rgba(52,152,219,0.3);
            border-radius: 2px;
            transition: all 0.15s;
        }

        .vm-waveform.playing .vm-bar {
            background: #3498db;
            animation: waveformBounce 0.6s ease-in-out infinite;
        }

        @keyframes waveformBounce {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.4); }
        }

        .vm-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .vm-play-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(52,152,219,0.3);
        }

        .vm-play-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(52,152,219,0.5); }
        .vm-play-btn:active { transform: scale(0.95); }

        .vm-transcript {
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
            padding: 12px;
            min-height: 120px;
            margin-bottom: 12px;
            border-left: 3px solid rgba(231,76,60,0.3);
        }

        .vm-transcript-line {
            font-size: 0.65rem;
            color: #aaa;
            line-height: 1.8;
            opacity: 0;
            padding: 4px 0;
            transition: opacity 0.5s ease-out;
        }

        .vm-transcript-line.revealed { opacity: 1; }

        .vm-transcript-line.pause {
            font-style: italic;
            color: #666;
            text-align: center;
            font-size: 0.6rem;
        }

        .vm-transcript-line.emotional {
            color: #e74c3c;
            font-weight: 500;
        }

        .vm-pin-section {
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === CREDIT CARD === */
        .cc-card {
            margin: 16px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a4e, #2c3e80);
            border-radius: 12px;
            color: white;
        }

        .cc-card .cc-bank { font-size: 0.6rem; letter-spacing: 0.15em; opacity: 0.7; }
        .cc-card .cc-number { font-size: 1rem; letter-spacing: 0.15em; margin: 12px 0; }
        .cc-card .cc-name { font-size: 0.65rem; opacity: 0.8; }

        .cc-transactions { padding: 0 16px 16px; }

        .cc-tx {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.65rem;
        }

        .cc-tx .tx-merchant { color: #ccc; }
        .cc-tx .tx-location { font-size: 0.55rem; color: #666; margin-top: 2px; }
        .cc-tx .tx-amount { color: #e74c3c; font-weight: bold; }
        .cc-tx .tx-date { font-size: 0.55rem; color: #666; text-align: right; }

        /* === MAPS / LOCATION === */
        .maps-view {
            padding: 12px;
            text-align: center;
        }

        .maps-view img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .maps-legend {
            margin-top: 12px;
            font-size: 0.6rem;
            color: #888;
            text-align: left;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .maps-legend .ml-item {
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .maps-legend .ml-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Phone nav bar — Android 3-button style */
        .phone-navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 40px 10px;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .phone-navbar button {
            background: none;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.15s;
            line-height: 1;
        }

        .phone-navbar button:hover {
            color: #ddd;
            background: rgba(255,255,255,0.06);
        }

        .phone-navbar button:active {
            transform: scale(0.9);
        }

        .phone-navbar .nav-home {
            width: 32px;
            height: 32px;
            border: 2px solid #888;
            border-radius: 50%;
            padding: 0;
            font-size: 0;
            transition: all 0.15s;
        }

        .phone-navbar .nav-home:hover {
            border-color: #ddd;
            background: rgba(255,255,255,0.06);
        }

        @media (max-width: 480px) {
            .phone-frame {
                width: 100%;
                min-height: auto;
                max-height: none;
                border-radius: 0;
                border: none;
            }
            .phone-container { padding: 0; }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-statusbar">
                <span id="phoneTime"></span>
                <span><img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> <img src="/assets/images/icons/icon-battery.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> 73%</span>
            </div>

            <div class="phone-screen" id="phoneScreen">
                <!-- Home Screen -->
                <div class="home-screen" id="homeScreen">
                    <div class="app-icon" onclick="openApp('messages')">

                        <span class="ai-label">Messages</span>
                    </div>
                    <div class="app-icon" onclick="openApp('photos')">
                        <div class="ai-icon ai-photos"><img src="/assets/images/icons/icon-picture.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                        <span class="ai-label">Photos</span>
                    </div>
                    <div class="app-icon" onclick="openApp('phone')">

                        <span class="ai-label">Phone</span>
                    </div>
                    <div class="app-icon" onclick="openApp('creditcard')">
                        <div class="ai-icon ai-credit">&#128179;</div>
                        <span class="ai-label">Capital One</span>
                    </div>
                    <div class="app-icon" onclick="openApp('maps')">
                        <div class="ai-icon ai-maps"><img src="/assets/images/icons/icon-target.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                        <span class="ai-label">Maps</span>
                    </div>
                    <div class="app-icon" onclick="openApp('camera')">
                        <div class="ai-icon ai-camera">&#128248;</div>
                        <span class="ai-label">Camera</span>
                    </div>
                    <div class="app-icon">
                        <div class="ai-icon ai-browser"><img src="/assets/images/icons/icon-globe.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                        <span class="ai-label">Chrome</span>
                    </div>
                    <div class="app-icon">
                        <div class="ai-icon ai-settings"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                        <span class="ai-label">Settings</span>
                    </div>
                </div>

                <!-- Messages App -->
                <div class="app-view" id="app-messages">
                    <div class="app-header">
                        <button class="app-back" onclick="goHome()">&#9664; Home</button>
                        <span class="app-title">Messages</span>
                    </div>
                    <div class="app-content" id="messagesContent"></div>
                </div>

                <!-- Photos App -->
                <div class="app-view" id="app-photos">
                    <div class="app-header">
                        <button class="app-back" id="photosBack" onclick="goHome()">&#9664; Home</button>
                        <span class="app-title">Photos</span>
                    </div>
                    <div class="app-content" id="photosContent"></div>
                </div>

                <!-- Phone App -->
                <div class="app-view" id="app-phone">
                    <div class="app-header">
                        <button class="app-back" onclick="goHome()">&#9664; Home</button>
                        <span class="app-title">Recent Calls</span>
                        <button class="g8-pin-btn" id="callPinBtn" onclick="pinCallLog()" style="font-size:0.5rem">&#128204; Pin</button>
                    </div>
                    <div class="app-content" id="phoneContent"></div>
                </div>

                <!-- Credit Card App -->
                <div class="app-view" id="app-creditcard">
                    <div class="app-header">
                        <button class="app-back" onclick="goHome()">&#9664; Home</button>
                        <span class="app-title">Capital One</span>
                    </div>
                    <div class="app-content" id="creditContent"></div>
                </div>

                <!-- Maps App -->
                <div class="app-view" id="app-maps">
                    <div class="app-header">
                        <button class="app-back" onclick="goHome()">&#9664; Home</button>
                        <span class="app-title">Location History</span>
                        <button class="g8-pin-btn" id="mapsPinBtn" onclick="pinLocationHistory()" style="font-size:0.5rem">&#128204; Pin</button>
                    </div>
                    <div class="app-content" id="mapsContent"></div>
                </div>
            </div>

            <div class="phone-navbar">
                <button onclick="history.back()" title="Back">&#9664;</button>
                <button class="nav-home" onclick="goHome()" title="Home"></button>
                <button onclick="openApp('messages')" title="Recent">&#9646;&#9646;</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
    // === DATA ===
    const THREADS = [
        {
            id: 'sarah',
            name: 'Sarah K',
            avatar: 'sarah',
            preview: 'At the site. Going silent.',
            time: 'Wed 8:47 PM',
            evidenceId: 'phone-msg-sarah-thread',
            messages: [
                { dir: 'received', text: 'Anchor tonight? 7pm.', time: 'Mon 3:12 PM' },
                { dir: 'sent', text: 'Copy. I\'ll be there.', time: 'Mon 3:14 PM' },
                { dir: 'sent', text: 'Good meeting. Intel checks out.', time: 'Mon 9:30 PM' },
                { dir: 'received', text: 'Understood. Proceed to planning phase.', time: 'Mon 9:32 PM' },

    function updatePhoneTime() {
        const now = new Date();
        const h = now.getHours() % 12 || 12;
        const m = String(now.getMinutes()).padStart(2, '0');

    // Track which messages have been read (persists in GoneDark state)
    function markRead(id) {
        if (!GoneDark.state.readMessages) GoneDark.state.readMessages = [];
        if (!GoneDark.state.readMessages.includes(id)) {
            GoneDark.state.readMessages.push(id);
            GoneDark.save();
        }
        updateBadge();
    }

    function isRead(id) {
        return (GoneDark.state.readMessages || []).includes(id);
    }

    function updateBadge() {
        const badge = document.getElementById('msgBadge');
        if (!GoneDark.state.readMessages) GoneDark.state.readMessages = [];
        const read = GoneDark.state.readMessages;

        let unread = 0;
        THREADS.forEach(t => { if (!read.includes('thread-' + t.id)) unread++; });
        (GoneDark.state.threats || []).forEach((_, i) => { if (!read.includes('threat-' + i)) unread++; });
        (GoneDark.state.anonymousTips || []).forEach((_, i) => { if (!read.includes('tip-' + i)) unread++; });
        (GoneDark.state.novakMessages || []).forEach((_, i) => { if (!read.includes('novak-' + i)) unread++; });

        if (unread > 0) {
            badge.textContent = unread;
            badge.style.display = '';
        } else {
            badge.style.display = 'none';
        }
    }

    // === VOICEMAIL ===
    function toggleVoicemail() {

    function toggleVoicemailPlayback() {
        if (voicemailPlaying) {
            stopVoicemail();
        } else {
            playVoicemail();
        }
    }

    function playVoicemail() {
        voicemailPlaying = true;

        // Update UI
        const playBtn = document.getElementById('vmPlayBtn');
        const waveform = document.getElementById('vmWaveform');
        if (playBtn) playBtn.innerHTML = '&#9632;';
        if (waveform) waveform.classList.add('playing');

        // Play voicemail beep
        playVoicemailBeep();

        // Start background static (very subtle)
        playBackgroundStatic();

        // Reveal transcript lines progressively
        let cumulativeDelay = 800; // Start after beep
        const transcriptLines = document.querySelectorAll('.vm-transcript-line');

        VOICEMAIL.transcript.forEach((line, i) => {
            voicemailPlaybackTimer = setTimeout(() => {
                if (transcriptLines[i]) {
                    transcriptLines[i].classList.add('revealed');
                }

                // Stop when done
                if (i === VOICEMAIL.transcript.length - 1) {
                    setTimeout(() => {
                        stopVoicemail();
                    }, 1500);
                }
            }, cumulativeDelay);

            cumulativeDelay += line.delay;
        });
    }

    function stopVoicemail() {
        voicemailPlaying = false;

        // Clear timers
        if (voicemailPlaybackTimer) {
            clearTimeout(voicemailPlaybackTimer);
        }

        // Stop audio
        if (voicemailAudioContext) {
            voicemailAudioContext.close();
            voicemailAudioContext = null;
        }

        // Update UI
        const playBtn = document.getElementById('vmPlayBtn');
        const waveform = document.getElementById('vmWaveform');
        if (playBtn) playBtn.innerHTML = '<img src="/assets/images/icons/icon-play.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
        if (waveform) waveform.classList.remove('playing');
    }

    function playVoicemailBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.frequency.value = 440; // A4 note
            gain.gain.value = 0.1;

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);

            setTimeout(() => ctx.close(), 300);
        } catch (e) {
            /* silently ignore */
        }
    }

    function playBackgroundStatic() {
        try {
            voicemailAudioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Create white noise buffer
            const bufferSize = voicemailAudioContext.sampleRate * 30; // 30 seconds
            const buffer = voicemailAudioContext.createBuffer(1, bufferSize, voicemailAudioContext.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; // White noise
            }

            // Create nodes
            const source = voicemailAudioContext.createBufferSource();
            source.buffer = buffer;

            // Low-pass filter to simulate phone quality
            const filter = voicemailAudioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 3400; // Phone bandwidth limit

            // Very low gain (barely audible static)
            const gain = voicemailAudioContext.createGain();
            gain.gain.value = 0.008;

            // Connect chain
            source.connect(filter);
            filter.connect(gain);
            gain.connect(voicemailAudioContext.destination);

            source.start();
        } catch (e) {
            /* silently ignore */
        }
    }

    function pinVoicemail() {
        const result = GoneDark.pinEvidence({
