        .mac-menubar {
            height: 28px;

            display: flex;
            align-items: center;
            padding: 0 12px;

            color: #ddd;
            gap: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 30;

        .mac-menubar .menu-item { cursor: pointer; opacity: 0.85; }
        .mac-menubar .menu-item:hover { opacity: 1; }
        .mac-menubar .menu-right { margin-left: auto; display: flex; gap: 14px; color: #aaa; font-size: 0.6rem; }

        /* Main Area */
        .mac-main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Finder Window */
        .finder-window {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 80px;
            background: #1e1e2e;
            border: 1px solid #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 20;

        .finder-titlebar {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #2a2a3a;
            border-bottom: 1px solid #333;
            gap: 8px;
            border-radius: 10px 10px 0 0;

        .finder-dots { display: flex; gap: 6px; }
        .finder-dots span { width: 12px; height: 12px; border-radius: 50%; display: block; }

        .finder-dots .d-min { background: #f39c12; }

        .finder-title {
            flex: 1;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
            font-weight: bold;

        .finder-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .finder-sidebar {
            width: 200px;
            background: #16162a;
            border-right: 1px solid #2a2a3a;
            padding: 8px 0;
            overflow-y: auto;
        }

        .fs-section {
            font-size: 0.5rem;

            color: #555;

            font-weight: bold;
        }

        .fs-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            font-size: 0.65rem;
            color: #999;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 4px;
            margin: 1px 4px;
        }

        .fs-item:hover { background: rgba(255,255,255,0.05); color: #ccc; }
        .fs-item.active { background: rgba(59,130,246,0.2); color: #7ab8ff; }
        .fs-item .fs-icon { font-size: 0.9rem; width: 20px; text-align: center; }

        /* Content Area */
        .finder-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* File Grid (Finder icon view for main folders) */
        .file-grid {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
        }

            width: 110px;
            padding: 12px 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;

        .fg-item.recovered {
            border: 1px dashed var(--g8-ev-recovered);
            animation: glitchIn 0.6s ease-out;
        }

        .email-list { display: none; }
        .email-list.active { display: block; }

            display: grid;
            grid-template-columns: 32px 1fr 80px;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.1s;
            align-items: center;

            border-radius: 6px;
            overflow: hidden;
        }

            border-bottom: 1px solid #2a2a3a;

            font-size: 0.65rem;
            color: #888;
            border-right: 1px solid #2a2a3a;

        .cal-day-label .day-date { font-size: 0.55rem; margin-top: 2px; }

        .cal-event {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-bottom: 4px;
            cursor: pointer;
            transition: opacity 0.2s;

        .cal-event:hover { opacity: 0.8; }
        .cal-event.normal { background: rgba(52,152,219,0.15); border-left: 3px solid #3498db; color: #7ab8ff; }
        .cal-event.urgent { background: rgba(231,76,60,0.15); border-left: 3px solid #e74c3c; color: #ff8a80; }

            left: 50%;

            transition: transform 0.2s;

        .dock-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #aaa;
        }

        .dock-sep {
            width: 1px;
            background: rgba(255,255,255,0.1);
            margin: 8px 4px;

        sidebarItems.forEach(item => {
