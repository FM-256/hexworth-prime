<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('dark-arts');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5: Network Attacks - EHE Course</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 5: Network Attacks</h1>
            <p class="page-subtitle">Switch Attacks, DDoS Amplification, and Session Hijacking</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week05-quiz',
                title: 'Week 5: Network Attacks',
                questions: [
                    {
                        question: "Which of the following techniques does an attacker use to compromise the network switches' security for sniffing all the traffic passing through it?",
                        options: ["MAC flooding", "UDP flooding", "SYN flooding", "DNS spoofing"],
                        correct: 0,
                        explanation: "MAC flooding overwhelms a switch's CAM table with fake MAC addresses, causing it to operate like a hub and broadcast all traffic, enabling sniffing."
                    },
                    {
                        question: "Martin, a hacker, spoofed the source IP address with the target's IP address and sent many ICMP ECHO request packets to an IP broadcast network, causing all hosts to respond and crash the target. Identify the attack.",
                        options: ["UDP flood attack", "Smurf attack", "Fragmentation attack", "Multi-vector attack"],
                        correct: 1,
                        explanation: "A Smurf attack spoofs the victim's IP as the source, sends ICMP echo requests to a broadcast address, and all responding hosts flood the victim with replies."
                    },
                    {
                        question: "In which phase of session hijacking does an attacker change the sequence number or acknowledgment number (SEQ/ACK) of the server to halt data transmission to a legitimate user?",
                        options: ["Command injection", "Session desynchronization", "Session ID prediction", "Packet injection"],
                        correct: 1,
                        explanation: "Session desynchronization disrupts the TCP connection between client and server by manipulating SEQ/ACK numbers, causing the legitimate session to break."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week05', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
