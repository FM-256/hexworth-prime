        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;

            -webkit-background-clip: text; -webkit-text-fill-color: transparent;

<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 6: Web App Attacks</h1>
            <p class="page-subtitle">Web Server Components, Injection Flaws, and SQL Injection Techniques</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week06-quiz',
            serverGrading: true,
                title: 'Week 6: Web App Attacks',
                questions: [
                    {
                        question: "Which of the following web-server components facilitates storage on another machine or disk if the original disk becomes full, in addition to providing object-level security?",
                        options: ["Server root", "Document root", "Virtual document tree", "Web proxy"],
                        explanation: "A virtual document tree allows storage on another machine or disk beyond the primary document root, while also providing object-level security controls."
                    },
                    {
                        question: "Which of the following web application vulnerabilities allow untrusted data to be interpreted and executed as part of a command or query?",
                        options: ["Injection flaws", "Insufficient logging", "Insufficient monitoring", "Broken access control"],
                        explanation: "Injection flaws (SQL injection, OS command injection, LDAP injection) occur when untrusted data is sent to an interpreter as part of a command or query."
                    },
                    {
                        question: "In which of the following attacks does an attacker inject an additional malicious query into an original query to make a DBMS execute multiple SQL queries?",
                        options: ["Piggybacked query", "Illegal/logically incorrect query", "System stored procedure", "Tautology"],
                        explanation: "A piggybacked query attack appends additional malicious SQL statements to a legitimate query using delimiters like semicolons, causing the DBMS to execute multiple queries."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week06', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
