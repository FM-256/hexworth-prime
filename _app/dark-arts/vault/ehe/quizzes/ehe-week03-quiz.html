<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('dark-arts');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3: Threats & Vulnerabilities - EHE Course</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'><img src="/assets/images/icons/icon-skull-crossbones.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></text></svg>">
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 3: Threats & Vulnerabilities</h1>
            <p class="page-subtitle">Threat Sources, Malware Components, and Trojans</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week03-quiz',
                title: 'Week 3: Threats & Vulnerabilities',
                questions: [
                    {
                        question: "Sam recently joined as a network admin in an organization. He failed to comprehend all the security practices during his training but pretended to have acquired adequate skills. With mediocre knowledge, he left a few loopholes in the firewall implementation that eventually led to unwanted network intrusions. Identify the threat source.",
                        options: ["External threat", "Intentional threat", "Natural threat", "Unintentional threat"],
                        correct: 3,
                        explanation: "Sam did not intentionally create vulnerabilities — his lack of knowledge led to unintentional security gaps, making this an unintentional (accidental) threat."
                    },
                    {
                        question: "Which of the following malware components hides the malware presence and protects the malware from reverse engineering, thus making it difficult to be detected by security solutions?",
                        options: ["Exploit", "Injector", "Crypter", "Payload"],
                        correct: 2,
                        explanation: "A crypter encrypts and obfuscates malware code, making it undetectable by signature-based security solutions and resistant to reverse engineering."
                    },
                    {
                        question: "Which of the following Trojans can an attacker use for the auto-deletion of files, folders, and registry entries as well as local network drives to cause the operating system to fail?",
                        options: ["Defacement Trojan", "Backdoor Trojan", "Destructive Trojan", "e-Banking Trojan"],
                        correct: 2,
                        explanation: "Destructive Trojans are designed to delete files, folders, registry entries, and network drives, causing system failure and data loss."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week03', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
