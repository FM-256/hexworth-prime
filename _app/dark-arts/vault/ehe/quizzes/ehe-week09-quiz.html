<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 9: IoT & OT Attacks</h1>
            <p class="page-subtitle">IoT Architecture, Mobile Layer Security, and Industrial Control Exploits</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week09-quiz',
                title: 'Week 9: IoT & OT Attacks',
                questions: [
                    {
                        question: "Which of the following layers of the IoT architecture is responsible for delivering services to respective users from different sectors?",
                        options: ["Edge technology layer", "Access gateway layer", "Middleware layer", "Application layer"],
                        correct: 3,
                        explanation: "The application layer in IoT architecture delivers services to end users across sectors including building, industrial, manufacturing, automobile, security, and healthcare."
                    },
                    {
                        question: "Which of the following layers in the IoT system has security issues such as insecure API, lack of encryption, and lack of storage security?",
                        options: ["Cloud", "Mobile", "Network", "Application"],
                        correct: 1,
                        explanation: "The mobile layer of IoT systems often has security issues including insecure APIs, lack of encryption in communication channels, lack of authentication, and insecure storage."
                    },
                    {
                        question: "James used a specially designed radio transceiver device to sniff radio commands and inject arbitrary code into the firmware of remote controllers. Which attack is this?",
                        options: ["Re-pairing with a malicious RF controller", "Malicious reprogramming attack", "Abusing reprogramming attack", "Command injection"],
                        correct: 1,
                        explanation: "A malicious reprogramming attack involves sniffing radio commands and injecting arbitrary code into firmware of remote controllers to maintain persistent access to industrial systems."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week09', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
