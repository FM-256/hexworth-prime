<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHE Comprehensive Final Exam - EHE Course</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-skull-crossbones.webp">
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">EHE Comprehensive Final Exam</h1>
            <p class="page-subtitle">34 questions covering all 12 modules — 70% to pass</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-final-exam',
                title: 'EHE Comprehensive Final Exam',
                questions: [
                    // Week 1: InfoSec Fundamentals (Q1-Q3)
                    {
                        question: "Which of the following elements of information security ensures that a recipient receives the original message from the sender without any modifications during transit?",
                        options: ["Confidentiality", "Integrity", "Availability", "Authenticity"],
                        correct: 1,
                        explanation: "Integrity ensures that data remains unaltered during transit. It guarantees the message received is the same as the message sent, without any modifications."
                    },
                    {
                        question: "Which of the following attack vectors involves the use of a huge network of compromised systems by attackers to perform denial-of-service attacks on the target network or systems?",
                        options: ["Botnet", "Virus", "APT", "Keylogger"],
                        correct: 0,
                        explanation: "A botnet is a network of compromised computers (bots/zombies) controlled by an attacker to launch coordinated attacks such as DDoS."
                    },
                    {
                        question: "Which of the following civilian acts enforces \"Electronic Transactions and Code Set Standards\"?",
                        options: ["HIPAA", "ISO/IEC", "PCI-DSS", "Sarbanes Oxley Act"],
                        correct: 0,
                        explanation: "HIPAA (Health Insurance Portability and Accountability Act) enforces Electronic Transactions and Code Set Standards to protect health information."
                    },
                    // Week 2: Ethical Hacking Fundamentals (Q4-Q6)
                    {
                        question: "In which of the following phases of the cyber kill chain methodology does the adversary create a tailored malicious payload based on the vulnerabilities identified?",
                        options: ["Installation", "Command and control", "Exploitation", "Weaponization"],
                        correct: 3,
                        explanation: "In the Weaponization phase, the attacker creates a deliverable payload (e.g., malware embedded in a document) based on vulnerabilities discovered during reconnaissance."
                    },
                    {
                        question: "Which of the following terms refers to the patterns of activities and methods associated with specific threat actors or groups of threat actors?",
                        options: ["Tactics, techniques, and procedures", "Tactics, technology, and procedures", "Tactics, tricks, and process", "Tactics, technology, and process"],
                        correct: 0,
                        explanation: "TTPs (Tactics, Techniques, and Procedures) describe the behavior patterns of threat actors, used to profile and track them for improved security posture."
                    },
                    {
                        question: "Identify the type of hackers recruited by organizations to enhance their cybersecurity by reporting all vulnerabilities to the system and network for remediation.",
                        options: ["State sponsor hacker", "Ethical hacker", "Industrial spy", "Organized hacker"],
                        correct: 1,
                        explanation: "Ethical hackers (white hat hackers) are authorized security professionals hired to find and report vulnerabilities before malicious actors can exploit them."
                    },
                    // Week 3: Threats & Vulnerabilities (Q7-Q9)
                    {
                        question: "Sam recently joined as a network admin in an organization. He failed to comprehend all the security practices during his training but pretended to have acquired adequate skills. With mediocre knowledge, he left a few loopholes in the firewall implementation that eventually led to unwanted network intrusions. Identify the threat source.",
                        options: ["External threat", "Intentional threat", "Natural threat", "Unintentional threat"],
                        correct: 3,
                        explanation: "Sam did not intentionally create vulnerabilities — his lack of knowledge led to unintentional security gaps, making this an unintentional (accidental) threat."
                    },
                    {
                        question: "Which of the following malware components hides the malware presence and protects the malware from reverse engineering, thus making it difficult to be detected by security solutions?",
                        options: ["Exploit", "Injector", "Crypter", "Payload"],
                        correct: 2,
                        explanation: "A crypter encrypts and obfuscates malware code, making it undetectable by signature-based security solutions and resistant to reverse engineering."
                    },
                    {
                        question: "Which of the following Trojans can an attacker use for the auto-deletion of files, folders, and registry entries as well as local network drives to cause the operating system to fail?",
                        options: ["Defacement Trojan", "Backdoor Trojan", "Destructive Trojan", "e-Banking Trojan"],
                        correct: 2,
                        explanation: "Destructive Trojans are designed to delete files, folders, registry entries, and network drives, causing system failure and data loss."
                    },
                    // Week 4: Passwords & Social Engineering (Q10-Q12)
                    {
                        question: "Identify the default authentication method in Microsoft operating systems that uses secret-key cryptography for validating identities.",
                        options: ["Kerberos", "LM", "NTLM", "SAM"],
                        correct: 0,
                        explanation: "Kerberos is the default authentication protocol in Windows Active Directory environments, using secret-key (symmetric) cryptography and ticket-based authentication."
                    },
                    {
                        question: "Which of the following techniques involves gaining information by listening to someone's conversation or reading private messages being shared between them?",
                        options: ["Tailgating", "Dumpster diving", "Eavesdropping", "Piggybacking"],
                        correct: 2,
                        explanation: "Eavesdropping is the act of secretly listening to private conversations or intercepting communications to gather sensitive information."
                    },
                    {
                        question: "Messy, an ex-employee of an organization, was fired because of misuse of resources and security violations. He sought revenge against the company and targeted its network. Which category of insider does Messy belong to?",
                        options: ["Malicious insider", "Negligent insider", "Professional insider", "Compromised insider"],
                        correct: 0,
                        explanation: "A malicious insider intentionally exploits their knowledge of the organization to cause harm, typically motivated by revenge, financial gain, or ideology."
                    },
                    // Week 5: Network Attacks (Q13-Q15)
                    {
                        question: "Which of the following techniques does an attacker use to compromise the network switches' security for sniffing all the traffic passing through it?",
                        options: ["MAC flooding", "UDP flooding", "SYN flooding", "DNS spoofing"],
                        correct: 0,
                        explanation: "MAC flooding overwhelms a switch's CAM table with fake MAC addresses, causing it to operate like a hub and broadcast all traffic, enabling sniffing."
                    },
                    {
                        question: "Martin, a hacker, spoofed the source IP address with the target's IP address and sent many ICMP ECHO request packets to an IP broadcast network, causing all hosts to respond and crash the target. Identify the attack.",
                        options: ["UDP flood attack", "Smurf attack", "Fragmentation attack", "Multi-vector attack"],
                        correct: 1,
                        explanation: "A Smurf attack spoofs the victim's IP as the source, sends ICMP echo requests to a broadcast address, and all responding hosts flood the victim with replies."
                    },
                    {
                        question: "In which phase of session hijacking does an attacker change the sequence number or acknowledgment number (SEQ/ACK) of the server to halt data transmission to a legitimate user?",
                        options: ["Command injection", "Session desynchronization", "Session ID prediction", "Packet injection"],
                        correct: 1,
                        explanation: "Session desynchronization disrupts the TCP connection between client and server by manipulating SEQ/ACK numbers, causing the legitimate session to break."
                    },
                    // Week 6: Web App Attacks (Q16-Q18)
                    {
                        question: "Which of the following web-server components facilitates storage on another machine or disk if the original disk becomes full, in addition to providing object-level security?",
                        options: ["Server root", "Document root", "Virtual document tree", "Web proxy"],
                        correct: 2,
                        explanation: "A virtual document tree allows storage on another machine or disk beyond the primary document root, while also providing object-level security controls."
                    },
                    {
                        question: "Which of the following web application vulnerabilities allow untrusted data to be interpreted and executed as part of a command or query?",
                        options: ["Injection flaws", "Insufficient logging", "Insufficient monitoring", "Broken access control"],
                        correct: 0,
                        explanation: "Injection flaws (SQL injection, OS command injection, LDAP injection) occur when untrusted data is sent to an interpreter as part of a command or query."
                    },
                    {
                        question: "In which of the following attacks does an attacker inject an additional malicious query into an original query to make a DBMS execute multiple SQL queries?",
                        options: ["Piggybacked query", "Illegal/logically incorrect query", "System stored procedure", "Tautology"],
                        correct: 0,
                        explanation: "A piggybacked query attack appends additional malicious SQL statements to a legitimate query using delimiters like semicolons, causing the DBMS to execute multiple queries."
                    },
                    // Week 7: Wireless Attacks (Q19-Q21)
                    {
                        question: "Which of the following communication standards is also known as WiMAX and is designed to provide multiple physical layer (PHY) and MAC options?",
                        options: ["802.15.1", "802.16", "802.11n", "802.11g"],
                        correct: 1,
                        explanation: "IEEE 802.16 (WiMAX - Worldwide Interoperability for Microwave Access) provides broadband wireless access with multiple PHY and MAC layer options."
                    },
                    {
                        question: "Which of the following devices does an attacker use to overload traffic to prevent authorized users from accessing a wireless network?",
                        options: ["Repeater", "Amplifying device", "Jamming device", "Routing device"],
                        correct: 2,
                        explanation: "A jamming device transmits radio signals on the same frequency as the wireless network, overwhelming legitimate communications and preventing authorized access."
                    },
                    {
                        question: "Which of the following attacks does an attacker use to breach the security mechanism of a paired Bluetooth device for eavesdropping?",
                        options: ["Bluejacking", "KNOB attack", "Bluebugging", "Bluesmacking"],
                        correct: 1,
                        explanation: "The KNOB (Key Negotiation of Bluetooth) attack exploits a vulnerability in the Bluetooth pairing process to reduce encryption key entropy, enabling eavesdropping."
                    },
                    // Week 8: Mobile Attacks (Q22-Q24)
                    {
                        question: "Which of the following techniques allows attackers to attain privileged control within Android's subsystem, resulting in the exposure of sensitive data?",
                        options: ["OS data caching", "Simjacker", "Carrier-loaded software", "Rooting"],
                        correct: 3,
                        explanation: "Rooting an Android device provides root-level (superuser) access to the OS, bypassing security controls and exposing sensitive data and system functions."
                    },
                    {
                        question: "Which of the following vulnerabilities leads to erratic program behavior, including memory access errors and incorrect results, and causes mobile devices to crash?",
                        options: ["Clickjacking", "Buffer overflow", "Data caching", "Phishing"],
                        correct: 1,
                        explanation: "Buffer overflow occurs when a program writes data beyond the allocated buffer boundary, corrupting adjacent memory and causing crashes or enabling code execution."
                    },
                    {
                        question: "Which of the following guidelines must be followed to protect a mobile device from malicious attackers?",
                        options: ["Maintain configuration control and management", "Never install applications from trusted stores", "Always load too many applications and auto-upload photos to social networks", "Always connect to two separate networks simultaneously"],
                        correct: 0,
                        explanation: "Maintaining configuration control and management ensures devices are properly secured with appropriate settings, updates, and policies."
                    },
                    // Week 9: IoT & OT Attacks (Q25-Q27)
                    {
                        question: "Which of the following layers of the IoT architecture is responsible for delivering services to respective users from different sectors?",
                        options: ["Edge technology layer", "Access gateway layer", "Middleware layer", "Application layer"],
                        correct: 3,
                        explanation: "The application layer in IoT architecture delivers services to end users across sectors including building, industrial, manufacturing, automobile, security, and healthcare."
                    },
                    {
                        question: "Which of the following layers in the IoT system has security issues such as insecure API, lack of encryption, and lack of storage security?",
                        options: ["Cloud", "Mobile", "Network", "Application"],
                        correct: 1,
                        explanation: "The mobile layer of IoT systems often has security issues including insecure APIs, lack of encryption in communication channels, lack of authentication, and insecure storage."
                    },
                    {
                        question: "James used a specially designed radio transceiver device to sniff radio commands and inject arbitrary code into the firmware of remote controllers. Which attack is this?",
                        options: ["Re-pairing with a malicious RF controller", "Malicious reprogramming attack", "Abusing reprogramming attack", "Command injection"],
                        correct: 1,
                        explanation: "A malicious reprogramming attack involves sniffing radio commands and injecting arbitrary code into firmware of remote controllers to maintain persistent access to industrial systems."
                    },
                    // Week 10: Cloud & Pentest (Q28-Q34)
                    {
                        question: "Which type of cloud service provides data processing services such as IoT services, mobile and web applications, and batch-and-stream processing?",
                        options: ["Function-as-a-service (FaaS)", "Identity-as-a-service (IDaaS)", "Security-as-a-service (SECaaS)", "Platform-as-a-service (PaaS)"],
                        correct: 0,
                        explanation: "FaaS provides event-driven compute services for processing data from IoT devices, mobile/web applications, and batch/stream processing workloads."
                    },
                    {
                        question: "Identify the node component of Kubernetes that ensures all pods and containers are healthy and running as expected.",
                        options: ["Kube-apiserver", "Kube-proxy", "Kubelet", "Container runtime"],
                        correct: 2,
                        explanation: "The kubelet is the primary node agent in Kubernetes that ensures containers in pods are running and healthy according to their PodSpecs."
                    },
                    {
                        question: "In which attack does an attacker exploit a bare-metal cloud server vulnerability to implant a malicious backdoor in its firmware?",
                        options: ["Cloud hopper attack", "Cloudborne attack", "Man-in-the-cloud", "Cloud Cryptojacking"],
                        correct: 1,
                        explanation: "A Cloudborne attack targets bare-metal cloud server firmware, implanting a persistent backdoor that survives server reallocation to other customers."
                    },
                    {
                        question: "Which best practice should be followed for securing a cloud environment?",
                        options: ["Do not disclose applicable logs and data to customers", "Never apply a baseline security breach notification process", "Do not enforce legal contracts in employee behavior policy", "Verify one's own cloud in public domain blacklists"],
                        correct: 3,
                        explanation: "Regularly verifying your cloud assets against public domain blacklists helps identify compromised resources and maintain the security reputation of your cloud environment."
                    },
                    {
                        question: "Which activity is implemented to check whether an organization follows standard policies and procedures in protecting its network?",
                        options: ["Ethical hacking", "Vulnerability assessment", "Security audit", "Penetration testing"],
                        correct: 2,
                        explanation: "A security audit systematically evaluates an organization's adherence to established security policies, procedures, and standards."
                    },
                    {
                        question: "Steve was provided network topology documents, asset inventory, and valuation information for his pentest. Identify the testing strategy.",
                        options: ["Black-box testing", "White-box testing", "Grey-box testing", "Goal-oriented penetration testing"],
                        correct: 1,
                        explanation: "White-box (clear-box) testing provides the tester with full knowledge of the target environment including network diagrams, source code, and system details."
                    },
                    {
                        question: "Which guideline helps a pen tester minimize risks and avoid DoS conditions during testing?",
                        options: ["Use direct testing", "Perform uninterruptible testing", "Use reserved addresses", "Directly exploit vulnerabilities"],
                        correct: 2,
                        explanation: "Using reserved addresses helps isolate testing traffic, preventing accidental DoS conditions on production systems and minimizing risk during penetration testing."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'final-exam', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
