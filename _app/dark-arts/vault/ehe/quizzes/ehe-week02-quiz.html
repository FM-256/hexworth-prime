<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('dark-arts');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2: Ethical Hacking Fundamentals - EHE Course</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-skull-crossbones.webp">
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 2: Ethical Hacking Fundamentals</h1>
            <p class="page-subtitle">Cyber Kill Chain, TTPs, and Hacker Classifications</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week02-quiz',
            serverGrading: true,
                title: 'Week 2: Ethical Hacking Fundamentals',
                questions: [
                    {
                        question: "In which of the following phases of the cyber kill chain methodology does the adversary create a tailored malicious payload based on the vulnerabilities identified?",
                        options: ["Installation", "Command and control", "Exploitation", "Weaponization"],
                        explanation: "In the Weaponization phase, the attacker creates a deliverable payload (e.g., malware embedded in a document) based on vulnerabilities discovered during reconnaissance."
                    },
                    {
                        question: "Which of the following terms refers to the patterns of activities and methods associated with specific threat actors or groups of threat actors?",
                        options: ["Tactics, techniques, and procedures", "Tactics, technology, and procedures", "Tactics, tricks, and process", "Tactics, technology, and process"],
                        explanation: "TTPs (Tactics, Techniques, and Procedures) describe the behavior patterns of threat actors, used to profile and track them for improved security posture."
                    },
                    {
                        question: "Identify the type of hackers recruited by organizations to enhance their cybersecurity by reporting all vulnerabilities to the system and network for remediation.",
                        options: ["State sponsor hacker", "Ethical hacker", "Industrial spy", "Organized hacker"],
                        explanation: "Ethical hackers (white hat hackers) are authorized security professionals hired to find and report vulnerabilities before malicious actors can exploit them."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week02', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
