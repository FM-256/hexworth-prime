<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0a1a 0%, #1a0a2e 100%);
            color: #e0e0e0;
        }
        .page-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .back-link {
            color: #6a4a7a; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; font-family: Georgia, serif;
        }
        .back-link:hover { color: #9333ea; }
        .page-title {
            font-size: 2rem; font-weight: 700; margin-top: 15px;
            background: linear-gradient(90deg, #9333ea, #7e22ce);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: Georgia, serif;
        }
        .page-subtitle {
            color: #6a4a7a; font-size: 0.85rem; margin-top: 8px;
            font-family: Georgia, serif;
        }
        .page-footer {
            text-align: center; margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(100, 60, 130, 0.15);
            color: #3a2a4a; font-size: 0.7rem; font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="../index.html" class="back-link">← Back to EHE Course</a>
            <h1 class="page-title">Week 7: Wireless Attacks</h1>
            <p class="page-subtitle">Wireless Standards, Jamming Devices, and Bluetooth Exploits</p>
        </div>
        <div id="quiz-container"><div class="loading">Preparing quiz</div></div>
        <div class="page-footer">
            <p>Ethical Hacking Essentials // <strong>Dark Arts</strong> // Hexworth Prime</p>
        </div>
    </div>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quiz = new QuizEngine({
                containerId: 'quiz-container',
                houseId: 'dark-arts',
                moduleId: 'ehe-week07-quiz',
                title: 'Week 7: Wireless Attacks',
                questions: [
                    {
                        question: "Which of the following communication standards is also known as WiMAX and is designed to provide multiple physical layer (PHY) and MAC options?",
                        options: ["802.15.1", "802.16", "802.11n", "802.11g"],
                        correct: 1,
                        explanation: "IEEE 802.16 (WiMAX - Worldwide Interoperability for Microwave Access) provides broadband wireless access with multiple PHY and MAC layer options."
                    },
                    {
                        question: "Which of the following devices does an attacker use to overload traffic to prevent authorized users from accessing a wireless network?",
                        options: ["Repeater", "Amplifying device", "Jamming device", "Routing device"],
                        correct: 2,
                        explanation: "A jamming device transmits radio signals on the same frequency as the wireless network, overwhelming legitimate communications and preventing authorized access."
                    },
                    {
                        question: "Which of the following attacks does an attacker use to breach the security mechanism of a paired Bluetooth device for eavesdropping?",
                        options: ["Bluejacking", "KNOB attack", "Bluebugging", "Bluesmacking"],
                        correct: 1,
                        explanation: "The KNOB (Key Negotiation of Bluetooth) attack exploits a vulnerability in the Bluetooth pairing process to reduce encryption key entropy, enabling eavesdropping."
                    }
                ],
                passingScore: 70,
                showFeedback: true,
                randomize: true,
                theme: 'dark-arts',
                onComplete: function(results) {
                    const history = JSON.parse(localStorage.getItem('ehe_quiz_history') || '[]');
                    history.push({ date: new Date().toISOString(), quiz: 'week07', score: results.score, percentage: results.percentage, passed: results.passed });
                    if (history.length > 50) history.shift();
                    localStorage.setItem('ehe_quiz_history', JSON.stringify(history));
                }
            });
            quiz.start();
        });
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
