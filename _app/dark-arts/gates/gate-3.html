<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access Control -->
    <script src="../../components/AccessGuard.js"></script>
    <script>
        AccessGuard.require('sorted');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>. . . . .</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            font-family: 'Courier New', monospace;
            color: #00aa2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Stronger terminal aesthetic */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.08) 0px,
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* CRT flicker */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 0.97; }
            94% { opacity: 1; }
            97% { opacity: 0.95; }
        }

        .gate-container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 40px;
            max-width: 800px;
            animation: flicker 0.15s infinite;
        }

        .gate-symbol {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #00ff41;
            letter-spacing: 0.5em;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .gate-message {
            font-size: 0.9rem;
            color: #00aa2a;
            line-height: 1.8;
            letter-spacing: 0.08em;
            margin-bottom: 40px;
        }

        .gate-message .emphasis {
            color: #00ff41;
        }

        /* Image display area */
        .image-container {
            background: rgba(0, 20, 0, 0.2);
            border: 1px solid #0d3d0d;
            padding: 30px;
            margin: 30px auto;
            max-width: 450px;
        }

        .image-label {
            font-size: 0.65rem;
            color: #006620;
            letter-spacing: 0.2em;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .shadow-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border: 1px solid #0a2a0a;
        }

        .image-filename {
            font-size: 0.7rem;
            color: #0d3d0d;
            margin-top: 15px;
            font-family: monospace;
        }

        /* Input section */
        .gate-input-section {
            margin-top: 40px;
        }

        .gate-label {
            font-size: 0.6rem;
            color: #006620;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        .gate-input {
            background: rgba(0, 20, 0, 0.3);
            border: 1px solid #0d3d0d;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 12px 20px;
            width: 350px;
            text-align: center;
            letter-spacing: 0.1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .gate-input:focus {
            border-color: #00aa2a;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
        }

        .gate-input::placeholder {
            color: #0d3d0d;
        }

        .gate-submit {
            display: block;
            margin: 20px auto 0;
            background: rgba(0, 30, 0, 0.3);
            border: 1px solid #0d3d0d;
            color: #00aa2a;
            padding: 12px 50px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gate-submit:hover {
            background: rgba(0, 50, 0, 0.4);
            border-color: #00aa2a;
            color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        .gate-error {
            color: #00aa2a;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gate-error.show {
            opacity: 0.8;
        }

        /* Success */
        .gate-container.unlocked {
            animation: unlockMatrix 1.5s ease forwards;
        }

        @keyframes unlockMatrix {
            0% { opacity: 1; }
            30% { text-shadow: 0 0 20px rgba(0, 255, 65, 0.8); }
            100% { opacity: 0; }
        }

        .footer-whisper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.5rem;
            color: #0d2d0d;
            letter-spacing: 0.5em;
            z-index: 10;
        }

        /* Right-click hint */
        .context-hint {
            font-size: 0.6rem;
            color: #0a2a0a;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="gate-container" id="gateContainer">
        <div class="gate-symbol">III</div>

        <div class="gate-message">
            The shadows have taught you to see beyond color.<br>
            Now learn that <span class="emphasis">images hold more than pixels</span>.<br>
            Every file has layers. Every format has secrets.
        </div>

        <div class="image-container">
            <div class="image-label">> analyzing: shadow.svg</div>
            <img src="" alt="The Shadow" class="shadow-image" id="shadowImage">
            <div class="image-filename">../assets/shadow.svg</div>
        </div>

        <div class="gate-input-section">
            <label class="gate-label">> what does the shadow hide?</label>
            <input type="text" class="gate-input" id="gateInput" placeholder="..." autocomplete="off" spellcheck="false">
            <button class="gate-submit" id="gateSubmit">[ DECODE ]</button>
            <div class="gate-error" id="gateError">DATA NOT RECOGNIZED</div>
        </div>

        <div class="gate-hint" style="font-size: 0.7rem; color: #0d3d0d; margin-top: 30px; font-style: italic;">
            <span class="trail-hint">🦎</span> "Trust not the chameleon's skin. What you see is rarely what it is."
        </div>
    </div>

    <div class="footer-whisper">GATE III</div>

    <script src="../gate-cipher.js"></script>
    <script>
        // Version check — clears progress if rotation changed
        GATE_CIPHER.checkVersion();

        // Skip if already completed — advance to next uncompleted gate or vault
        (function skipIfComplete() {
            if (localStorage.getItem('gate3_complete') !== 'true') return;
            if (localStorage.getItem('gate4_complete') !== 'true') { window.location.replace('gate-4.html'); return; }
            if (localStorage.getItem('gate5_complete') !== 'true') { window.location.replace('gate-5.html'); return; }
            window.location.replace('../vault/index.html');
        })();

        // Gate 2 check (optional - allow testing)
        if (!localStorage.getItem('gate2_complete')) {
            console.log('%cGate 2 not completed. Shortcut detected.', 'color: #00aa2a;');
        }

        // Gate 3: SVG steganography challenge
        // Students must examine the SVG file's source code
        // Hidden data exists in metadata and text elements
        // Decoding tools will be needed for encoded strings

        // Dynamic SVG loading — injects current rotation's data into the template
        (async function loadShadowSVG() {
            try {
                const set = GATE_CIPHER.getCurrentSet();
                const response = await fetch('../assets/shadow.svg');
                let svgText = await response.text();

                // Replace Base64 placeholder in metadata with current rotation's value
                svgText = svgText.replace(/%%GATE3_BASE64%%/g, set.gate3.base64);

                // Decode the base64 to get the hint text for hidden elements
                const hintText = atob(set.gate3.base64);
                svgText = svgText.replace(/%%GATE3_HINT%%/g, hintText);

                // Create a Blob URL from the modified SVG
                const blob = new Blob([svgText], { type: 'image/svg+xml' });
                const blobUrl = URL.createObjectURL(blob);

                const img = document.getElementById('shadowImage');
                img.src = blobUrl;
            } catch (err) {
                console.error('Shadow load failed:', err);
            }
        })();

        const input = document.getElementById('gateInput');
        const submit = document.getElementById('gateSubmit');
        const error = document.getElementById('gateError');
        const container = document.getElementById('gateContainer');

        async function checkAnswer() {
            const userInput = input.value.trim();

            if (userInput.length === 0) return;

            if (localStorage.getItem('hexworth_god_mode') === 'true') {
                container.classList.add('unlocked');
                localStorage.setItem('gate3_complete', 'true');
                localStorage.setItem('gate3_timestamp', Date.now().toString());
                if (typeof AchievementSystem !== 'undefined') AchievementSystem.unlockDarkArtsGate(3);
                setTimeout(() => { window.location.href = 'gate-4.html'; }, 1500);
                return;
            }

            const set = GATE_CIPHER.getCurrentSet();
            const isCorrect = await GATE_CIPHER.checkAnswer(userInput, set.gate3.hash);

            if (isCorrect) {
                container.classList.add('unlocked');
                localStorage.setItem('gate3_complete', 'true');
                localStorage.setItem('gate3_timestamp', Date.now().toString());
                if (typeof AchievementSystem !== 'undefined') AchievementSystem.unlockDarkArtsGate(3);

                setTimeout(() => {
                    window.location.href = 'gate-4.html';
                }, 1500);
            } else {
                error.classList.add('show');
                input.value = '';

                setTimeout(() => {
                    error.classList.remove('show');
                }, 3000);
            }
        }

        submit.addEventListener('click', checkAnswer);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Console
        console.log('%c. . . . .', 'color: #00ff41; font-size: 14px;');
    </script>
<script src="../../components/AchievementSystem.js"></script>
<script src="../../components/FluxCapacitor.js"></script>
</body>
</html>
