<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access Control -->
    <script src="../../components/AccessGuard.js"></script>
    <script>
        AccessGuard.require('sorted');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>. . . .</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle scanlines - terminal aesthetic emerging */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05) 0px,
                rgba(0, 0, 0, 0.05) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .gate-container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 60px;
            max-width: 700px;
        }

        .gate-symbol {
            font-size: 3rem;
            margin-bottom: 40px;
            color: #0d1a0d;
            letter-spacing: 0.5em;
            animation: terminalFlicker 0.15s infinite;
        }

        @keyframes terminalFlicker {
            0%, 100% { opacity: 0.15; }
            92% { opacity: 0.13; }
            94% { opacity: 0.15; }
            97% { opacity: 0.12; }
        }

        .gate-message {
            font-size: 0.95rem;
            color: #151515;
            line-height: 2;
            letter-spacing: 0.1em;
            margin-bottom: 40px;
        }

        .gate-message .highlight {
            color: #0d2010;
        }

        /* THE HIDDEN CONTENT - same color as background */
        .hidden-in-shadows {
            color: #0a0a0a;
            font-size: 0.8rem;
            line-height: 1.8;
            margin: 30px 0;
            padding: 20px;
            user-select: all;
        }

        /* When selected, text becomes visible */
        .hidden-in-shadows::selection {
            background: #0d2a0d;
            color: #00aa2a;
        }

        .gate-input-section {
            margin-top: 40px;
        }

        .gate-label {
            font-size: 0.65rem;
            color: #0d1a0d;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        .gate-input {
            background: rgba(0, 20, 0, 0.1);
            border: 1px solid #0d1a0d;
            color: #1a3a1a;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 12px 20px;
            width: 320px;
            text-align: center;
            letter-spacing: 0.15em;
            outline: none;
            transition: all 0.3s ease;
        }

        .gate-input:focus {
            border-color: #0d2a0d;
            background: rgba(0, 30, 0, 0.2);
        }

        .gate-input::placeholder {
            color: #0d1a0d;
        }

        .gate-submit {
            display: block;
            margin: 20px auto 0;
            background: rgba(0, 20, 0, 0.1);
            border: 1px solid #0d1a0d;
            color: #0d2010;
            padding: 12px 50px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gate-submit:hover {
            background: rgba(0, 40, 0, 0.2);
            border-color: #0d3010;
            color: #1a4a1a;
        }

        .gate-error {
            color: #2a1010;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gate-error.show {
            opacity: 0.7;
        }

        .gate-hint {
            font-size: 0.7rem;
            color: #0d1a0d;
            margin-top: 50px;
            letter-spacing: 0.1em;
            font-style: italic;
        }

        /* Success animation */
        .gate-container.unlocked {
            animation: unlockGreen 1.5s ease forwards;
        }

        @keyframes unlockGreen {
            0% { opacity: 1; }
            50% { opacity: 0.5; filter: hue-rotate(90deg); }
            100% { opacity: 0; }
        }

        .footer-whisper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            color: #0d1a0d;
            letter-spacing: 0.5em;
            z-index: 10;
        }

        /* Selection color for visible text */
        ::selection {
            background: #0d2a0d;
            color: #00aa2a;
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">. . . .</h1>
    <div class="gate-container" id="gateContainer">
        <div class="gate-symbol">II</div>

        <div class="gate-message">
            You found your way here.<br>
            But <span class="highlight">shadows hide what they wish to conceal</span>.<br>
            Not everything visible is meant to be seen.<br>
            Not everything hidden is meant to stay hidden.
        </div>

        <div class="hidden-in-shadows" id="hiddenText">
            <!-- Content injected dynamically by gate-cipher.js -->
        </div>

        <div class="gate-input-section">
            <label class="gate-label">> enter decoded message</label>
            <input type="text" class="gate-input" id="gateInput" placeholder="..." autocomplete="off" spellcheck="false">
            <button class="gate-submit" id="gateSubmit">[ SUBMIT ]</button>
            <div class="gate-error" id="gateError">ACCESS DENIED</div>
        </div>

        <div class="gate-hint">
            <span class="trail-hint"><img src="/assets/images/icons/icon-detective.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> "The owl finds prey hidden in darkness."
        </div>
    </div>

    <div class="footer-whisper">GATE II</div>

    <script src="../../components/FirebaseAuth.js"></script>
    <script src="../gate-cipher.js"></script>
    <script>
        // Skip if already completed — return to vault
        (function skipIfComplete() {
            if (localStorage.getItem('gate2_complete') === 'true') {
                window.location.replace('../vault/index.html');
            }
        })();

        // Version check — clears stale progress when cipher rotates
        GATE_CIPHER.checkVersion();

        // Gate 1 check
        if (!localStorage.getItem('gate1_complete')) {
            /* gate 1 not completed — shortcut detected */
        }

        // Gate 2: Hidden text + Base64 challenge
        // Students must select hidden text (same color as background)
        // and decode the Base64 string within it

        // Dynamically inject hidden text with the current rotation's Base64 clue
        (function injectHiddenText() {
            const set = GATE_CIPHER.getCurrentSet();
            const hiddenEl = document.getElementById('hiddenText');
            if (hiddenEl) {
                hiddenEl.textContent = 'The answer hides in plain sight: ' + set.gate2.base64 + ' \u2014 decode what the shadows conceal.';
            }
        })();

        const input = document.getElementById('gateInput');
        const submit = document.getElementById('gateSubmit');
        const error = document.getElementById('gateError');
        const container = document.getElementById('gateContainer');

        async function checkAnswer() {
            const answer = input.value.trim().toLowerCase();
            if (!answer) return;

            try {
                const serverResult = await GATE_CIPHER.checkAnswerServer(2, answer);
                const isCorrect = serverResult !== null ? serverResult : false;

                if (isCorrect) {
                    container.classList.add('unlocked');
                    localStorage.setItem('gate2_complete', 'true');
                    localStorage.setItem('gate2_timestamp', Date.now().toString());
                    if (typeof AchievementSystem !== 'undefined') AchievementSystem.unlockDarkArtsGate(2);

                    setTimeout(() => {
                        window.location.href = '../vault/index.html';
                    }, 1500);
                } else {
                    error.classList.add('show');
                    input.value = '';
                    setTimeout(() => { error.classList.remove('show'); }, 3000);
                }
            } catch (err) {
                if (err.code === 'functions/resource-exhausted') {
                    error.textContent = 'Too many attempts. Wait 60 seconds.';
                    error.classList.add('show');
                    input.disabled = true;
                    submit.disabled = true;
                    setTimeout(() => {
                        error.classList.remove('show');
                        error.textContent = 'ACCESS DENIED';
                        input.disabled = false;
                        submit.disabled = false;
                    }, 60000);
                }
            }
        }

        submit.addEventListener('click', checkAnswer);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Console breadcrumb removed
    </script>
<script src="../../components/AchievementSystem.js"></script>
<script src="../../components/FluxCapacitor.js"></script>
</body>
</html>
