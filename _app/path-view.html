<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --house-primary: #9f7aea;
            --house-secondary: #7c3aed;
            --house-glow: rgba(159, 122, 234, 0.3);
        }

        /* House Color Themes */
        .house-web { --house-primary: #60a5fa; --house-secondary: #3b82f6; --house-glow: rgba(96, 165, 250, 0.3); }
        .house-shield { --house-primary: #f87171; --house-secondary: #ef4444; --house-glow: rgba(248, 113, 113, 0.3); }
        .house-cloud { --house-primary: #38bdf8; --house-secondary: #0ea5e9; --house-glow: rgba(56, 189, 248, 0.3); }
        .house-forge { --house-primary: #fbbf24; --house-secondary: #f59e0b; --house-glow: rgba(251, 191, 36, 0.3); }
        .house-script { --house-primary: #a78bfa; --house-secondary: #8b5cf6; --house-glow: rgba(167, 139, 250, 0.3); }
        .house-code { --house-primary: #4ade80; --house-secondary: #22c55e; --house-glow: rgba(74, 222, 128, 0.3); }
        .house-key { --house-primary: #f472b6; --house-secondary: #ec4899; --house-glow: rgba(244, 114, 182, 0.3); }
        .house-eye { --house-primary: #c084fc; --house-secondary: #a855f7; --house-glow: rgba(192, 132, 252, 0.3); }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--house-primary);
            border-color: var(--house-primary);
            color: #000;
        }

        .path-title {
            flex: 1;
        }

        .path-title h1 {
            font-size: 1.8rem;
            color: var(--house-primary);
            margin-bottom: 5px;
        }

        .path-title p {
            color: #888;
            font-size: 0.95rem;
        }

        .path-icon {
            font-size: 3rem;
        }

        /* Progress Section */
        .progress-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--house-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--house-secondary), var(--house-primary));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Module List */
        .modules-section h2 {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .module-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .module-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--house-primary);
            transform: translateX(5px);
        }

        .module-card.locked:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .module-card.completed {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .module-card.locked {
            opacity: 0.6;
            cursor: pointer;
        }

        .module-card.current {
            border-color: var(--house-primary);
            box-shadow: 0 0 15px var(--house-glow);
        }

        .module-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #888;
            flex-shrink: 0;
        }

        .module-card.completed .module-number {
            background: #22c55e;
            color: #000;
        }

        .module-card.current .module-number {
            background: var(--house-primary);
            color: #000;
        }

        .module-info {
            flex: 1;
        }

        .module-title {
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .module-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .module-type {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: capitalize;
        }

        .module-status {
            margin-left: auto;
            font-size: 1.2rem;
        }

        /* Connector Lines */
        .module-card::before {
            content: '';
            position: absolute;
            left: 32px;
            top: -12px;
            width: 2px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
        }

        .module-card:first-child::before {
            display: none;
        }

        .module-card.completed::before {
            background: #22c55e;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--house-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error {
            text-align: center;
            padding: 60px;
            color: #f87171;
        }

        /* Continue Button */
        .continue-section {
            margin-top: 30px;
            text-align: center;
        }

        .continue-btn {
            background: linear-gradient(135deg, var(--house-secondary), var(--house-primary));
            border: none;
            color: #000;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--house-glow);
        }

        .continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">Learning Path</h1>
    <div class="container" id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading learning path...</p>
        </div>
    </div>

    <script src="components/LearningPaths.js"></script>
    <script src="components/HubRegistry.js"></script>
    <script src="components/AccessGuard.js"></script>
    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const houseId = urlParams.get('house') || urlParams.get('path');
        const pathId = urlParams.get('path') || houseId;

        // For path lookup, try pathId first (for cert paths like 'comptia-linux'),
        // then fall back to houseId (for house paths like 'script')
        const lookupId = pathId;

        // Storage keys - check both legacy and ProgressManager formats
        const LEGACY_KEY = 'hexworth_completed_modules';
        const PROGRESS_KEY = 'hexworth_progress';

        function getCompletedModules() {
            const completed = new Set();

            try {
                // Check ProgressManager format (primary)
                const progressData = localStorage.getItem(PROGRESS_KEY);
                if (progressData) {
                    const progress = JSON.parse(progressData);
                    if (progress.completedModules && Array.isArray(progress.completedModules)) {
                        progress.completedModules.forEach(id => {
                            completed.add(id);
                            // Strip house prefix to get LearningPaths short ID
                            // e.g. 'script-lm-01-welcome' → 'lm-01-welcome'
                            const dashIdx = id.indexOf('-');
                            if (dashIdx > 0) completed.add(id.substring(dashIdx + 1));
                        });
                    }

                    // Also extract from house-level progress.
                    // Keys here are compound (e.g. 'script-lm-01-welcome'), so add
                    // both the raw key and the stripped short form for LearningPaths matching.
                    for (const [house, modules] of Object.entries(progress)) {
                        if (!modules || typeof modules !== 'object' || Array.isArray(modules)) continue;
                        for (const [key, data] of Object.entries(modules)) {
                            if (data && data.completed) {
                                completed.add(key);
                                // Strip house prefix: 'script-lm-01-welcome' → 'lm-01-welcome'
                                const dashIdx = key.indexOf('-');
                                if (dashIdx > 0) completed.add(key.substring(dashIdx + 1));
                            }
                        }
                    }
                }

                // Also check legacy format for backwards compatibility
                const legacyData = localStorage.getItem(LEGACY_KEY);
                if (legacyData) {
                    const legacyModules = JSON.parse(legacyData);
                    if (Array.isArray(legacyModules)) {
                        legacyModules.forEach(id => completed.add(id));
                    }
                }

                // Check Arctic progress — Arctic uses abbreviated IDs (e.g. 'lm-02-first-cmds')
                // that differ from LearningPaths long IDs ('lm-02-first-commands').
                // Bridge by matching numeric prefix ('lm-02') to find the LP equivalent.
                try {
                    const arctic = JSON.parse(localStorage.getItem('hexworth_arctic_progress') || '{}');
                    const lpPath = (typeof LearningPaths !== 'undefined') ? LearningPaths.PATHS[lookupId] : null;
                    for (const id of Object.keys(arctic)) {
                        if (!arctic[id]) continue;
                        completed.add(id);
                        // Bridge Arctic→LearningPaths: 'lm-02-first-cmds' → 'lm-02-first-commands'
                        if (lpPath) {
                            const numMatch = id.match(/^([a-z]+-\d+)/);
                            if (numMatch) {
                                const prefix = numMatch[1] + '-';
                                const lpMod = lpPath.modules.find(m => m.id.startsWith(prefix));
                                if (lpMod) completed.add(lpMod.id);
                            }
                        }
                    }
                } catch(e) {}
            } catch (e) {
                console.error('Error reading completed modules:', e);
            }

            return Array.from(completed);
        }

        function markModuleComplete(moduleId) {
            // Mark in both systems for compatibility
            try {
                // Legacy system
                const legacyData = localStorage.getItem(LEGACY_KEY);
                const legacyModules = legacyData ? JSON.parse(legacyData) : [];
                if (!legacyModules.includes(moduleId)) {
                    legacyModules.push(moduleId);
                    localStorage.setItem(LEGACY_KEY, JSON.stringify(legacyModules));
                }

                // ProgressManager system
                const progressData = localStorage.getItem(PROGRESS_KEY);
                if (progressData) {
                    const progress = JSON.parse(progressData);
                    if (!progress.completedModules) {
                        progress.completedModules = [];
                    }
                    if (!progress.completedModules.includes(moduleId)) {
                        progress.completedModules.push(moduleId);
                        localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
                    }
                }
            } catch (e) {
                console.error('Error marking module complete:', e);
            }
        }

        function renderPath() {
            const app = document.getElementById('app');

            /* Workshop-status paths are admin-only (barricaded for admin testing):
               honor the same lifecycle state the hub page + catalog enforce.
               Admins fall through and see the real path; non-admins are hidden
               and redirected by AccessGuard, and we stop building the DOM. */
            const hubMeta = (window.HubRegistry && HubRegistry.all ? HubRegistry.all() : [])
                .find(h => h && h.id === lookupId);
            if (hubMeta && hubMeta.status === 'workshop') {
                AccessGuard.require('admin');
                if (!(AccessGuard.isFirebaseAdmin() || AccessGuard.hasGodMode())) return;
            } else {
                /* AccessGuard auto-hides the body at load expecting a require()
                   call to reveal it; this page gates only workshop-status paths,
                   so explicitly un-hide for everything else. */
                AccessGuard.showContent();
            }

            if (!houseId) {
                app.innerHTML = `
                    <div class="error">
                        <h2>No path specified</h2>
                        <p>Please select a learning path from a house page.</p>
                        <button class="back-btn" onclick="history.back()">Go Back</button>
                    </div>
                `;
                return;
            }

            // Apply house theme
            document.body.classList.add(`house-${houseId}`);

            const completedModules = getCompletedModules();
            // Use lookupId (pathId) to find certification paths like 'comptia-linux'
            const pathOverview = LearningPaths.getPathOverview(lookupId, completedModules);

            if (!pathOverview) {
                app.innerHTML = `
                    <div class="error">
                        <h2>Path not found</h2>
                        <p>The learning path "${lookupId}" was not found.</p>
                        <button class="back-btn" onclick="history.back()">Go Back</button>
                    </div>
                `;
                return;
            }

            // Find current module (first incomplete with met prerequisites)
            let currentModuleIndex = -1;
            for (let i = 0; i < pathOverview.modules.length; i++) {
                const mod = pathOverview.modules[i];
                if (!mod.completed && mod.available) {
                    currentModuleIndex = i;
                    break;
                }
            }

            // Build module list HTML
            const modulesHtml = pathOverview.modules.map((mod, index) => {
                let statusClass = '';
                let statusIcon = '';

                if (mod.completed) {
                    statusClass = 'completed';
                    statusIcon = '✓';
                } else if (index === currentModuleIndex) {
                    statusClass = 'current';
                    statusIcon = '<img src="/assets/images/icons/icon-play.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                } else if (!mod.available) {
                    statusClass = 'locked';
                    statusIcon = '<img src="/assets/images/icons/icon-padlock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                }

                const typeIcons = {
                    presentation: '<img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                    quiz: '<img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                    applet: '<img src="/assets/images/icons/icon-joystick.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                    tool: '<img src="/assets/images/icons/icon-wrench.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                    lab: '<img src="/assets/images/icons/icon-flask.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">'
                };

                return `
                    <div class="module-card ${statusClass}"
                         onclick="handleModuleClick('${mod.href}', ${mod.available || mod.completed}, '${mod.title}')"
                         title="${!mod.available && !mod.completed ? 'Prerequisites recommended - click to continue anyway' : ''}">
                        <div class="module-number">${mod.completed ? '✓' : index + 1}</div>
                        <div class="module-info">
                            <div class="module-title">${mod.title}</div>
                            <div class="module-meta">
                                <span class="module-type">${typeIcons[mod.type] || '<img src="/assets/images/icons/icon-document.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">'} ${mod.type}</span>
                                <span><img src="/assets/images/icons/icon-stopwatch.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${mod.duration}</span>
                                <span><img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${mod.difficulty}</span>
                            </div>
                        </div>
                        <div class="module-status">${statusIcon}</div>
                    </div>
                `;
            }).join('');

            // Paths sourced from the Arctic hub
            const ARCTIC_PATHS = new Set(['linux-mastery']);

            // Render icon — detect image paths vs plain text/emoji
            const iconHtml = (pathOverview.icon && pathOverview.icon.includes('/'))
                ? `<img src="${pathOverview.icon}" alt="" style="width:5rem;height:5rem;filter:drop-shadow(0 0 12px var(--house-glow));">`
                : (pathOverview.icon || '');

            // Calculate duration
            const duration = LearningPaths.getPathDuration(lookupId);

            app.innerHTML = `
                <div class="header">
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        <button class="back-btn" onclick="goBack()">← Back to House</button>
                        ${ARCTIC_PATHS.has(pathId) ? '<button class="back-btn" onclick="goToArctic()">← Back to Arctic</button>' : ''}
                    </div>
                    <div class="path-title">
                        <h1>${pathOverview.name}</h1>
                        <p>${pathOverview.description}</p>
                    </div>
                    <div class="path-icon">${iconHtml}</div>
                </div>

                <div class="progress-section">
                    <div class="progress-header">
                        <div class="progress-stats">
                            <div class="stat">
                                <div class="stat-value">${pathOverview.completedCount}/${pathOverview.totalModules}</div>
                                <div class="stat-label">Modules</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${pathOverview.progressPercent}%</div>
                                <div class="stat-label">Complete</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${duration}</div>
                                <div class="stat-label">Total Time</div>
                            </div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${pathOverview.progressPercent}%"></div>
                    </div>
                </div>

                <div class="modules-section">
                    <h2><img src="/assets/images/icons/icon-books.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Learning Path</h2>
                    <div class="module-list">
                        ${modulesHtml}
                    </div>
                </div>

                ${pathOverview.nextModule ? `
                    <div class="continue-section">
                        <button class="continue-btn" onclick="navigateToModule('${pathOverview.nextModule.href}')">
                            Continue: ${pathOverview.nextModule.title} →
                        </button>
                    </div>
                ` : pathOverview.progressPercent === 100 ? `
                    <div class="continue-section">
                        <button class="continue-btn" disabled>
                            <img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Path Completed!
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function handleModuleClick(href, isUnlocked, title) {
            // Soft locking: always allow navigation, but confirm for locked modules
            if (isUnlocked) {
                navigateToModule(href);
            } else {
                // Show confirmation for locked modules
                if (confirm(`"${title}" has prerequisites you haven't completed yet.\n\nThis is just a recommendation - you can skip ahead if you're returning to the course or already know this material.\n\nContinue anyway?`)) {
                    navigateToModule(href);
                }
            }
        }

        function navigateToModule(href) {
            // hrefs may be app-relative (houses/shield/...) or house-relative (presentations/...)
            if (href.startsWith('houses/')) {
                window.location.href = href;
            } else {
                window.location.href = `houses/${houseId}/${href}`;
            }
        }

        function goBack() {
            // Go back to house index
            window.location.href = `houses/${houseId}/index.html`;
        }

        function goToArctic() {
            window.location.href = 'arctic/index.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderPath);
    </script>
</body>
</html>
