<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access Control: the baseline tier that the large majority of manifest apps declare -->
    <!-- Tenant containment, loaded STATICALLY rather than relying on tenant-sw.js injecting them.
         _app/hex/index.html:94 has a literal <a href="/">back to Hexworth</a>, and it is contained
         today ONLY because TenantShell.overrideLinks() rewrites it; AccessGuard.redirect() also
         consults TenantRouter.isActive() before falling back to hardcoded Hexworth destinations.
         Both arrive via service-worker injection, so containment currently depends on which worker
         wins the scope race for this path. A reviewer traced that to a one-click escape from the
         tenant wrapper for a white-label student. Loading them here makes containment independent
         of the worker entirely.
         SAFE FOR NON-TENANT STUDENTS: both no-op without tenant context (TenantShell returns at
         :56 when the blob is absent, TenantRouter's _init returns likewise), so a direct Hexworth
         user sees nothing. Double-load with tenant-sw's injected copy is now a no-op too, since
         BUG-244 made TenantRouter idempotent; TenantShell already was. -->
    <script src="/components/TenantRouter.js"></script>
    <script src="/components/TenantShell.js"></script>
    <script>
        /* Tell the auto-loaders these are already here. AccessGuard.js:1311 and FirebaseAuth.js
           both re-fetch TenantShell.js unless window.__tenantShellRequested is set, and a static
           <script src> does not set it, so the shell was being fetched and executed a SECOND time
           on every load of this page for a tenant user, taking a duplicate getTenantConfig call
           with it. Not a break, because TenantShell's own __tenantShellExecuted guard absorbs the
           re-run, but a wasted fetch and a wasted network round trip on every page view.
           TenantRouter needs no equivalent: those loaders gate it on
           `typeof TenantRouter === 'undefined'`, which the static include already satisfies.
           Found by a reviewer running an UNSTUBBED probe; my own test replaced AccessGuard.js with
           a stub, so the loader whose interaction I was testing never ran. */
        window.__tenantShellRequested = true;
        window.__tenantRouterRequested = true;
    </script>
    <script src="../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- Firebase auth MUST precede SandboxLauncher. Without it SandboxLauncher.getIdToken()
         returns null, apiCall() falls back to an X-Dev-Uid header, and lab-manager (which runs
         NODE_ENV=production, so DEV_MODE is false) answers a hard 401 to every request from every
         student. This page was the ONLY one of 38 loading SandboxLauncher that omitted it, and the
         omission was invisible until ps/stop/restart began actually calling the network. -->
    <script src="../components/FirebaseAuth.js"></script>
    <!-- Session owner for ps/stop/restart. Was MISSING: an earlier edit anchored to a script tag
         that exists in the module template and not here, and .replace() silently did nothing, so
         every process command hit "session manager not available" for every student. A stub in the
         test harness hid it completely. -->
    <script src="../components/SandboxLauncher.js"></script>
    <!-- HEXOS-5: installable to a Chromebook, tablet or laptop. Real icon, no browser chrome,
         no flashing.

         THERE IS DELIBERATELY NO SERVICE WORKER HERE, and hex-sw.js is deliberately not
         registered. A worker scoped to /hex/ would take control of these two pages away from
         tenant-sw.js, which is registered at scope '/' and injects TenantRouter + TenantShell
         into every navigation outside /tenant/ and /admin/. That injection IS the white-label
         guarantee, and scope matching prefers the longest match, so '/hex/' silently outranks
         '/' here. Registering ANY worker at this path, even a pass-through that calls no
         respondWith, is enough to suppress it, because the controller is chosen by scope and not
         by what the handler does.

         A load-time guard cannot fix that. The controller for a navigation is resolved before
         any of this document's script runs, so a guard that detects a tenant and unregisters is
         already too late for the page it is running on; it only protects the NEXT load. That is
         the reason this is absence rather than mitigation.

         Nothing is lost for installability: Chrome's own Page.getInstallabilityErrors returns []
         for this page with no worker registered. Offline launch is what a worker would add, and
         it belongs in the single root-scoped worker that already controls every page, not in a
         second one competing for these two. Tracked as HEXOS-5b. -->
    <link rel="manifest" href="/hex/manifest.webmanifest">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hex OS">
    <link rel="apple-touch-icon" sizes="256x256" href="/assets/media/brand/mark-cyan-256.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hex shell: launch anything on Hexworth by name. run arena, ls, search.">
    <title>hex shell</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-terminal.webp">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #08090c; --fg: #c8d3d5; --dim: #5e6b70; --accent: #4ade80;
            --accent2: #38bdf8; --warn: #fbbf24; --err: #f87171; --line: rgba(255,255,255,.07);
        }
        body {
            background: var(--bg); color: var(--fg); min-height: 100vh;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 14px; line-height: 1.65; padding: 0 0 40px;
        }
        .bar {
            position: sticky; top: 0; z-index: 10; background: rgba(8,9,12,.95);
            border-bottom: 1px solid var(--line); padding: 10px 18px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            backdrop-filter: blur(8px);
        }
        .bar .t { color: var(--accent); letter-spacing: .06em; }
        .bar a { color: var(--dim); text-decoration: none; font-size: 12px; }
        .bar a:hover, .bar a:focus-visible { color: var(--accent2); }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 18px; }
        #out { white-space: pre-wrap; word-break: break-word; }
        .row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
        .ps1 { color: var(--accent); flex: 0 0 auto; }
        #cmd {
            flex: 1 1 auto; background: transparent; border: 0; outline: 0;
            color: var(--fg); font: inherit; caret-color: var(--accent);
        }
        .muted { color: var(--dim); }
        .ok { color: var(--accent); }
        .info { color: var(--accent2); }
        .warn { color: var(--warn); }
        .err { color: var(--err); }
        .echo { color: var(--dim); }
        a.app { color: var(--accent2); text-decoration: none; }
        a.app:hover, a.app:focus-visible { text-decoration: underline; }
        table { border-collapse: collapse; margin: 4px 0 10px; }
        td { padding: 1px 16px 1px 0; vertical-align: top; }
        .hint { color: var(--dim); font-size: 12px; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="bar">
        <span class="t">hex shell</span>
        <a href="/">back to Hexworth</a>
    </div>
    <div class="wrap">
        <div id="out"></div>
        <div class="row">
            <span class="ps1" id="ps1">hex&gt;</span>
            <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
                   aria-label="Hex shell command" autofocus>
        </div>
        <p class="hint">Tab completes. Up and Down walk history. Try <span class="ok">help</span>.</p>
    </div>

<script>
/**
 * Hex shell. Resolves a name to an entry and launches it.
 *
 * Reads /data/hex-apps.json and NOTHING else. No hardcoded entry point lives here, which is the
 * whole point: a registry nothing launches from drifts silently, while a registry the launcher
 * depends on breaks loudly. If an app is missing from this shell, the manifest is wrong, and
 * post-verify check 4f fails on exactly that.
 */
(function () {
    'use strict';

    var out = document.getElementById('out');
    var cmd = document.getElementById('cmd');
    var APPS = [];
    var META = {};
    var history = [];
    var hIdx = -1;
    // Current working context: a house or a category. Scopes ls and completion the way a working
    // directory scopes a shell. run stays global, because a shell lets you run an absolute path
    // from anywhere and forcing a cd before every launch would be worse than no cd at all.
    var cwd = null;

    // Escapes quotes too, because esc() is used inside href="..." where &lt; and &gt; are not the
    // only way out of the context. A value containing a double quote could otherwise close the
    // attribute and inject another one.
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Only ever navigate to a same-origin absolute path. The manifest is generated from
    // build-time literals today, so this is defence in depth rather than a live hole, but
    // window.location.href will happily execute a javascript: URL and nothing upstream of here
    // guarantees it never sees one.
    // A reviewer defeated the shape check by probing the rendered href instead of reading the
    // regex: "/" + a TAB, LF, CR, FF, VT, SPACE or NUL + "/evil.com" passed, because the browser
    // strips those per WHATWG BEFORE deciding scheme-relativity, resolving to a protocol-relative
    // URL that navigates OFFSITE. The regex tested the raw string and never saw the normalised
    // MEASURED, and narrower than I first wrote it. Only TAB, LF and CR actually escape: the
    // WHATWG parser removes those ANYWHERE in the string, so "/<TAB>/evil.com" resolves to
    // http://evil.com/. FF, VT, SPACE and NUL pass the old shape check but percent-encode into
    // the path and stay same-origin, so they are blocked here as a defensive superset, not
    // because they were shown to be exploitable. An earlier version of this comment claimed all
    // seven "exploit it"; that was proven only against the regex, never against a browser, which
    // is the same mistake the fix itself exists to correct. Zero manifest entries are
    // affected either way.
    function safeEntry(e) {
        return typeof e === 'string' && !/[\x00-\x20\x7f]/.test(e)
            && /^\/[^/\\]/.test(e) ? e : null;
    }
    function say(html, cls) {
        var d = document.createElement('div');
        if (cls) d.className = cls;
        d.innerHTML = html;
        out.appendChild(d);
        window.scrollTo(0, document.body.scrollHeight);
    }
    /**
     * True once the manifest has loaded. Before that, APPS is [] and every place lookup fails,
     * so cd would say "no such place: dark-arts", an assertion that is FALSE. The fetch handler
     * in this file already states the principle: say what is actually wrong. cd was not obeying it.
     */
    var manifestState = 'loading';   // 'loading' | 'ready' | 'failed'

    /**
     * Guards every command that reads APPS. Without it, a stalled or failed manifest makes the
     * shell answer "no app called arena", which is a FALSE assertion: the true fact is that the
     * list has not arrived. cd was fixed for this first; Nancy pointed out run/info/ls/search
     * still had the same shape, lower severity only because their wording is vaguer.
     */
    function notReady() {
        if (manifestState === 'ready') return false;
        say(manifestState === 'failed'
            ? 'the app list failed to load, so there is nowhere to go yet. reload the page.'
            : 'the app list is still loading. try again in a moment.', 'warn');
        return true;
    }

    function errText(e) {
        return (e && e.message) ? e.message : 'the request failed';
    }

    /**
     * Turn whatever a student typed into { labId, sessionId }. Accepts a lab id or a session id,
     * because `ps` shows both and expecting them to know which one a command wants is the kind of
     * detail that makes a shell feel hostile.
     * allowStopped: restart is happy with a lab that is not currently running.
     */
    var procBusy = null;    // command name currently mutating a session, or null
    var procTimer = null;   // watchdog for the CURRENT hold
    var procGen = 0;        // identity of the current hold, incremented once per invocation.
    // 90s in production. Overridable so the watchdog is reachable in a test without a 90s
    // wait: a stalled request is the one case that cannot be provoked against a mock that
    // always answers, and "cannot be tested" is not an acceptable position for concurrency
    // code. This is a configuration value, not a state hook. It exposes no internals, which
    // is why it ships where a `procBusy` accessor deliberately does not.
    // Read ONCE at parse time, which bounds the exposure more tightly than first described: a
    // devtools console after load cannot change it, since PROC_TIMEOUT_MS is already bound.
    // Only a pre-parse injection (extension or userscript) can set it, and the worst such an
    // actor achieves is a shorter or longer watchdog on their OWN session. Anyone able to inject
    // pre-parse can already call SandboxLauncher directly, so this adds no reachable capability.
    var PROC_TIMEOUT_MS = (typeof window.HEX_PROC_TIMEOUT_MS === 'number')
        ? window.HEX_PROC_TIMEOUT_MS : 90000;

    function holdProc(name) {
        var gen = ++procGen;
        procBusy = name;
        // SandboxLauncher.apiCall() uses fetch() with no timeout and no AbortController, so a
        // request that never settles would hold this lock for the life of the tab. Without a
        // watchdog the fix for the double-fire race would itself become a way to permanently
        // disable both commands. Releasing here does NOT cancel the in-flight request; it only
        // stops the shell refusing forever, and says so rather than implying it was cancelled.
        procTimer = setTimeout(function () {
            // Defensive, NOT a bug fix, and the distinction is worth recording. The guard this
            // replaced compared command NAMES, and two sequential `stop` commands share a name.
            // I claimed that was a second live defect; a fixture disproved it. procTimer is
            // always either fired or cleared before a new hold can be taken, because a second
            // command cannot start while the first holds the lock, so a stale timer can never
            // observe a later generation. Generation is used anyway because identity is the
            // thing actually meant, and a guard that is only accidentally correct rots.
            if (procGen !== gen) return;
            procBusy = null;
            procTimer = null;
            say(esc(name) + ' has not answered in time, so the shell is no longer waiting on '
                + 'it. The request may still be running.', 'warn');
            say('run <span class="ok">ps</span> to see the real state before trying again.', 'muted');
        }, PROC_TIMEOUT_MS);
        return gen;
    }

    // MUST be called with the generation from its own holdProc. A request that outlived its
    // watchdog still settles later, and an unguarded release let that stale settle null out a
    // LATER command's lock and clear that later command's watchdog, reopening the exact
    // double-mutation race this lock exists to close, while the manual told the student a
    // retry was safe. Found independently by both reviewers; the watchdog callback already
    // had an ownership guard and this did not.
    // Sentinel for a chain that was superseded mid-flight. An object identity, not a string,
    // so it can never collide with a value the launch API might return.
    var SUPERSEDED = {};

    // labId -> true while a launch for it is outstanding. This deliberately SURVIVES the
    // watchdog. The watchdog frees the lock so the shell stops refusing forever, but the request
    // it gave up waiting for is still running. If launch() is the slow leg, a retry cannot see
    // the not-yet-provisioned session in list() and would launch a SECOND one: two live sessions
    // for one lab, the same failure as the slow-destroy case but through the mirror leg.
    // Guarding the launch CALL did not cover this, because the second launch is issued by a
    // different, legitimate invocation rather than by the superseded chain.
    // Tradeoff, stated rather than hidden: a launch that truly never settles leaves this set, and
    // restart for that ONE lab keeps refusing until the page is reloaded. That is a bounded,
    // visible, single-lab refusal, and it is preferable to silently consuming a second capacity
    // slot the student did not ask for and cannot see.
    var launchPending = {};

    // ALWAYS key launchPending through this, never with a raw id. Two sources feed the ids that
    // reach it: what the student typed, and what the server returned in `list()`. Neither
    // is guaranteed to agree with the other on case. A read keyed one way against a write keyed the
    // other silently reports "nothing pending", which is exactly the duplicate-session bug this map
    // exists to prevent.
    //
    // What the STUDENT sees is a separate question and is not uniform, deliberately. When the lab
    // is in the session list, messages echo the server's own casing for it. When it is not, in the
    // allowStopped fallback in resolveProcess, there is no server record and so no server casing
    // to echo, and the message carries the folded id instead. That is the canonical manifest
    // spelling and the one every other command prints, so it is the better thing to show; it is
    // just not "the server's casing", and an earlier draft of this comment claimed it was.
    // The one fold. This shell compares ids case-insensitively in nine places now, and every one
    // of them was written as its own inline String(x == null ? '' : x).toLowerCase(); the seven
    // separate case bugs found in this file all came from a site that simply did not get one.
    // A named helper makes the omission visible at the call site.
    function low(v) { return String(v == null ? '' : v).toLowerCase(); }

    /* Commands that change a student's running lab. Never offered as a GUESS: see the fuzzy
       matcher in exec(). A suggestion is the shell speaking with confidence it has not earned,
       and it must not spend that on something destructive. */
    var MUTATING = { stop: 1, restart: 1 };
    /* Was a blanket ban on suggesting these. See the fuzzy matcher in exec(): it is now a tighter
       DISTANCE for them plus a spoken warning, because banning them stranded the real typo. */

    /* Damerau-Levenshtein, small and iterative. Inputs are command names, so they are tiny.
       TRANSPOSITION COSTS 1, not 2, and that is the whole reason this is Damerau: plain
       Levenshtein scores `hlep` against `help` as 2, which pushed the single most common typo in
       the English language past a threshold of 1 and made the shell stop suggesting `help`. I
       introduced that regression while fixing a worse one and caught it by re-running the same
       student inputs rather than assuming the new matcher was strictly better. */
    function editDistance(a, b) {
        a = low(a); b = low(b);
        if (a === b) return 0;
        var d = [], i, j;
        for (i = 0; i <= a.length; i++) { d[i] = []; d[i][0] = i; }
        for (j = 0; j <= b.length; j++) d[0][j] = j;
        for (i = 1; i <= a.length; i++) {
            for (j = 1; j <= b.length; j++) {
                var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                if (i > 1 && j > 1
                    && a.charAt(i - 1) === b.charAt(j - 2)
                    && a.charAt(i - 2) === b.charAt(j - 1)) {
                    d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);   // transposition
                }
            }
        }
        return d[a.length][b.length];
    }

    function pKey(id) { return low(id); }

    function clearProc(gen) {
        if (procGen !== gen) return;
        procBusy = null;
        if (procTimer) { clearTimeout(procTimer); procTimer = null; }
    }

    function resolveProcess(arg, allowStopped) {
        var SL = window.SandboxLauncher;
        if (!SL) return Promise.resolve({ error: 'the session manager is not available.' });
        // TWO NAMESPACES REACH THIS FUNCTION, AND ONLY ONE OF THEM IS CASE-INSENSITIVE.
        //   labId     is the lowercase manifest convention, the same id space `run`, `info`, `ls`,
        //             `cd` and tab-completion all match case-insensitively (SandboxLauncher.js:32
        //             onward: do-100, arctic, linux-mastery, ...). A student who has just learned
        //             from tab-completion that capitals are fine will type them here too.
        //   sessionId is a server-issued opaque handle, copied verbatim out of `ps`. Nobody types
        //             it against a known convention, so folding its case would invent a match the
        //             server never promised. Left exact on purpose.
        // A reviewer measured what missing this costs. With linux-mastery RUNNING,
        // `restart LINUX-MASTERY` answered "is a page, not a running process. There is nothing to
        // stop; just navigate away." Not merely unhelpful: false, and said to a student looking at
        // a lab that is still up.
        var labKey = String(arg == null ? '' : arg).toLowerCase();
        return SL.list().then(function (r) {
            // See the contract note in `ps`. Key is `sandboxes`; fields are sessionId/labId/status.
            var rows = (r && r.sandboxes) || [];
            for (var i = 0; i < rows.length; i++) {
                // Fold BOTH sides. The ids are lowercase by convention, not by enforcement, and
                // this list arrives off the wire.
                var rowLab = String(rows[i].labId == null ? '' : rows[i].labId).toLowerCase();
                if (rowLab === labKey || rows[i].sessionId === arg) {
                    return { labId: rows[i].labId, sessionId: rows[i].sessionId,
                             status: rows[i].status };
                }
            }
            if (SL.LAB_INFO && SL.LAB_INFO[labKey]) {
                if (allowStopped) return { labId: labKey, sessionId: null, status: 'none' };
                // A launch already in flight means "nothing running" is true this instant and
                // misleading a second later. The student asked to stop something the server has
                // not finished building; saying only "nothing running" invites them to conclude
                // the box is gone when it is about to appear.
                if (launchPending[pKey(arg)]) {
                    return { error: 'nothing is running for ' + esc(arg) + ' YET: a launch from an '
                             + 'earlier restart is still outstanding, so a box may appear shortly. '
                             + 'Run <span class="ok">ps</span> in a moment and stop it then.',
                             cls: 'warn' };
                }
                return { error: esc(arg) + ' is a lab, but you have nothing running for it. ' +
                         '<span class="ok">run ' + esc(arg) + '</span> starts it.', cls: 'warn' };
            }
            // stop/restart already call notReady() before reaching here, but this runs AFTER an
            // await: the manifest can finish or fail in the window between their check and this
            // line. Re-check rather than trust the caller's older answer.
            if (manifestState !== 'ready') {
                return { error: 'still loading the app list, so I cannot tell whether ' + esc(arg) +
                         ' is a page or a typo. Try again in a moment.', cls: 'warn' };
            }
            if (byId(arg)) {
                return { error: esc(arg) + ' is a page, not a running process. There is nothing ' +
                         'to stop; just navigate away.', cls: 'warn' };
            }
            // CASE-ONLY NEAR-MISS ON A SESSION ID. Session ids are matched exactly, on purpose:
            // they are opaque server handles, and folding them could point stop/restart at the
            // WRONG session if the id space is ever mixed-case. But "no lab or session called
            // SESS-ABC" is useless to a student looking at sess-abc in their own `ps` output, and
            // case sensitivity here is invisible: every OTHER id on this shell is forgiving. So
            // when the only thing wrong is the spelling, say that specifically rather than making
            // them guess which of the two namespaces they are in.
            for (var j = 0; j < rows.length; j++) {
                var sid = rows[j].sessionId;
                if (sid && String(sid).toLowerCase() === labKey) {
                    return { error: 'session ids are case-sensitive, and ' + esc(arg) + ' is not '
                             + 'the exact spelling. Use <span class="ok">' + esc(sid) + '</span>, '
                             + 'or the lab name, which is not case-sensitive.', cls: 'warn' };
                }
            }
            /* A reviewer asked whether `stop incubator` is another mirror. It is a DIFFERENT id
               namespace: labs come from SandboxLauncher's LAB_INFO, not the app manifest, so
               "no lab called incubator" is literally true. But the student's confusion is the
               same one, so name what the word actually is rather than leaving them to guess.
               Deliberately does not claim `stop` can act on it, because it cannot. */
            if (manifestState === 'ready') {
                var stopGroup = groupOf(arg);
                if (stopGroup) {
                    return { error: esc(arg) + ' is a ' + stopGroup.kind + ' of apps, not a lab, '
                             + 'so nothing runs under that name. <span class="ok">ps</span> lists '
                             + 'your running labs.', cls: 'warn' };
                }
            }
            return { error: 'no lab or session called ' + esc(arg) + '. ' +
                     '<span class="ok">ps</span> lists what is running.' };
        }).catch(function (e) {
            return { error: 'could not reach the session manager: ' + esc(errText(e)) };
        });
    }

    function setPrompt() {
        document.getElementById('ps1').innerHTML = cwd ? 'hex:' + esc(cwd) + '&gt;' : 'hex&gt;';
    }

    /** Apps visible from the current context. */
    /* Folded, like every other id comparison in this file. `cwd` is already lowercased by `cd`,
       and all 192 manifest entries happen to carry lowercase house/category values today, so an
       exact compare works RIGHT NOW, but only because the data is clean, not because anything
       enforces it. A reviewer flagged this as the last place in the file still trusting a
       convention instead of the code; one capitalised `house:` in the manifest would empty a
       student's `ls` with no error. Nothing validates that field on the way in. */
    function scope() {
        if (!cwd) return APPS;
        return APPS.filter(function (a) {
            return low(a.house) === cwd || low(a.category) === cwd;
        });
    }

    /** Every valid cd target: the houses and categories that actually exist in the manifest. */
    /* Folded at the source. `cd` lowercases its argument (see cd) and then tests membership with
       places().indexOf(arg), so an unfolded list would reject a destination that genuinely exists
       the moment one manifest entry carried a capital: "no such place: cloud" for a house named
       "Cloud". Folding here fixes the membership test and the did-you-mean list together, and
       makes the printed spelling the canonical one the rest of the shell uses. */
    function places() {
        var v = {};
        APPS.forEach(function (a) {
            if (a.category) v[low(a.category)] = 1;
            if (a.house) v[low(a.house)] = 1;
        });
        return Object.keys(v).sort();
    }

    /* Is this name a GROUP rather than an app? One definition, used by run, info and cd, so the

       cache built at parse time would be empty for the first query. */

        APPS.forEach(function (x) { if (x.category) out[low(x.category)] = true; });
        return out;

     *
     * Every one of the 13 houses ALSO has an app whose id is the house name exactly: the
     * house-index pages, each carrying category 'house'. So `cloud` is simultaneously a valid
     * group and a valid app id, for all 13. Which one wins is decided by each caller's check
     * order, and the orders differ ON PURPOSE:
     *
     *   CONTAINER verbs check groupOf FIRST      ls, cd
     *     `ls cloud` lists the house's 26 apps. `cd cloud` scopes to it. Both are asking about a
     *     container, and answering "cloud is an app" there would be useless.
     *   THING verbs check byId FIRST             run, info, man, and stop/restart via resolveProcess
     *     `run cloud` opens the Cloud house page, which is a real page a student wants. `info
     *     cloud` shows that page's record. Answering "cloud is a house, it groups 26 apps" when
     *     someone asked to OPEN it would be the true-and-useless shape this file exists to remove.
     *

     * `if` statements, and was right that it was accidental rather than decided: nothing said
     * which was intended, so a future consistency pass could have flipped `ls cloud` into "cloud
     * is an app, not a category", which is false. It is now stated here, in the one function all
     * six callers share, and pinned by tests for both halves so the flip cannot happen silently.
     * groupOf's own isCat/isHouse tie-break is separate and currently unreachable: no name is both
     * a category and a house today (7 and 13, empty intersection, measured). */

        if (!isCat && !isHouse) return null;
        var members = APPS.filter(function (x) {
            return low(x.category) === lower || low(x.house) === lower;
        });
        /* Reports BOTH when a name is both, rather than silently preferring category. No manifest
           name is currently both (7 categories, 13 houses, empty intersection, measured), but
           `cd` had its own hand-rolled copy of this that DID handle the both case, so the two
           would have disagreed the moment one appeared. A reviewer caught that my commit claimed
           this function was already shared by cd when it was not. Now it genuinely is, and the
           tie-break lives in one place. */
        return {

           VERB meant a bare app name reached this function already lowered and launched, while
           `run ARENA` passed the raw argument here and failed with "no app called ARENA". Two
           paths the shell documents as equivalent, disagreeing on a capital letter.
           A reviewer found it by testing both, after I had asserted in a commit message that "run
           already lowercases for its own matching". It did not. The claim was wrong; this makes it
           true instead of correcting the sentence.

           collide with another by case alone. */

            // stale cached component here). launch() throws `Unknown lab` locally in that case --

                // Guard the SETTLEMENT, not only the call. If launch() was the slow leg, the
                // watchdog has already fired and a later invocation owns the lab; claiming
                // "restarted from clean state" here would describe a box this chain no longer
                // speaks for, and possibly one a later restart has since replaced.

    function exec(line) {
        var parts = line.trim().split(/\s+/);
        /* The VERB is matched case-insensitively; the ARGUMENT is not. A student typing `Help`
           or `LS` was told "not a command", which is true of the literal string and useless as an
           answer: they typed the right command with a capital letter. Found by exercising the shell
           the way a person uses it rather than the way a test does. Arguments keep their case
           here; byId() lowercases the needle instead, so `run ARENA` and a bare `ARENA` agree. */
        var verb = String(parts.shift() || '').toLowerCase();
        var arg = parts.join(' ');
        if (!verb) return;
        // A bare app name is a launch. `arena` should do what `run arena` does.
        // Reads APPS outside the COMMANDS table, so the gate's audit could not see it and Nancy
        // found it by hand. Without this, a bare app name during the load window answers
        // "not a command" rather than "still loading".
        if (!COMMANDS[verb] && notReady()) return;
        if (!COMMANDS[verb] && byId(verb)) return COMMANDS.run(verb);
        if (!COMMANDS[verb]) {
            /* THE SHELL SUGGESTS FOR APPS AND NOT FOR COMMANDS, which is its own vocabulary
               applied unevenly: `run pythn` offers six real ids, while `hlep` offered nothing but
               "try help". Same student, same kind of slip, two different levels of service.
               Three cases, in the order a person actually hits them. */

            // 1. A word other shells use for this. Not a typo, a transfer of habit, and telling
            //    someone "exit: not a command" when they mean "how do I leave" is the same
            //    true-and-useless answer that started this whole thread.
            var SYNONYMS = {
                'back': 'cd ..', 'list': 'ls', 'dir': 'ls', 'show': 'ls',
                'find': 'search', 'grep': 'search', 'open': 'run', 'launch': 'run',
                'start': 'run', 'cat': 'info', 'about': 'info', 'top': 'ps', 'jobs': 'ps',
                '?': 'help', 'h': 'help', 'commands': 'help', 'usage': 'help'
            };
            /* THE ACCOUNT VOCABULARY GOT NO TYPO TOLERANCE. Synonyms and the logout/exit checks
               were exact-match only and ran BEFORE the fuzzy stage, so `lgout`, `eixt` and `qiut`
               got none of the help `hlep` now gets. That is the same unevenness this feature
               exists to remove, surviving in the one part of the shell that touches a student's
               account. A reviewer found it by reading the comment that framed the feature and
               then checking whether it held here.
               Resolved only when the correction is UNAMBIGUOUS: exactly one candidate within one
               edit. Two candidates means the shell would be guessing which account action was
               meant, and guessing about sign-out is not a service. */
            var accountVocab = Object.keys(SYNONYMS).concat(['logout', 'signout', 'exit', 'quit']);
            if (!SYNONYMS[verb] && !COMMANDS[verb] && verb.length > 2) {
                var vFix = accountVocab.filter(function (w) { return editDistance(verb, w) <= 1; });
                if (vFix.length === 1) verb = vFix[0];
            }
            if (SYNONYMS[verb]) {
                /* CARRY THE ARGUMENT. A reviewer caught the first version answering `open arena`
                   with "run does what you mean" and silently dropping `arena`, so a student who
                   typed a complete, unambiguous intent had to type the whole thing again. That is
                   the same true-and-useless shape this work exists to remove. */
                var suggestion = SYNONYMS[verb] + (arg ? ' ' + arg : '');
                say(esc(verb) + ' is not a command here. Try <span class="ok">'
                    + esc(suggestion) + '</span>', 'warn');
                return say('<span class="ok">help</span> lists everything.', 'muted');
            }

            /* LEAVING AND SIGNING OUT ARE DIFFERENT THINGS, and the first version told a student
               they were the same. It mapped exit, quit AND logout to `cd /`, which only clears the
               shell's scope: it does not leave the page and it certainly does not sign anyone out.
               A reviewer pointed out that `logout` therefore made a FALSE claim about account
               state, while FirebaseAuth.signOut() is loaded on this very page. So they are now two
               different answers, and the one that can be true is done rather than described. */
            if (verb === 'logout' || verb === 'signout') {
                if (typeof FirebaseAuth !== 'undefined' && FirebaseAuth.signOut) {
                    say('signing out...', 'muted');
                    return Promise.resolve(FirebaseAuth.signOut()).then(function () {
                        say('signed out.', 'ok');
                    }, function (e) {
                        say('could not sign out: ' + esc(errText(e)), 'err');
                        say('use the account menu on the main site.', 'muted');
                    });
                }
                say('sign-out is not available from this page.', 'warn');
                return say('use the account menu on the main site.', 'muted');
            }
            if (verb === 'exit' || verb === 'quit') {
                say('there is nothing to exit: this shell is a page, not a session.', 'warn');
                return say('<span class="ok">cd /</span> returns to the top of the app list, the '
                    + '"back to Hexworth" link leaves this page, and <span class="ok">logout</span> '
                    + 'signs you out.', 'muted');
            }

            // 2. A near miss on a real command. Prefix first, then substring, matching how `run`
            //    and `cd` already suggest, so the shell behaves the same way everywhere.
            var names = Object.keys(COMMANDS);
            /* ONE POLICY FOR DESTRUCTIVE SUGGESTIONS, applied to every stage.
               My commit message claimed "mutating commands are suggested at distance 1 only". That
               was true of the typo stage and false of these two, which had no filter at all: a
               reviewer showed that a single `s` offered `stop` and a single `r` offered `restart`,
               each with the warning attached, on one keystroke that means nothing in particular.
               I had described the branch I touched as though it were the rule.
               The rule now: a destructive command is offered only on a STRONG signal, meaning at
               least three characters of prefix, or an exact-length typo, and never on a one or
               two character fragment that is equally consistent with half the table. */
            /* A DESTRUCTIVE SUGGESTION NEEDS SPECIFICITY, NOT LENGTH. The bar was "3 characters
               of prefix", which is under half of `restart`, so `rest` and `res` both offered it.
               `rest` is not a strained example: "REST API" appears in 180 files here, across
               Cloud, Web and the cert-prep tracks, so a student thinking about REST was told
               "did you mean: restart" and warned about ending their lab session. A reviewer
               constructed it in one try.
               The bar is now "you typed nearly the whole word": a prefix within one character of
               the full command. `sto` still reaches `stop` (3 of 4), `restar` still reaches
               `restart` (6 of 7), `rest` does not (4 of 7). Genuine typos arrive by the
               distance-1 path below instead, which is what `restrt` and `sotp` use. */
            var strongEnough = function (n) {
                if (!MUTATING[n]) return true;
                return n.indexOf(verb) === 0 && verb.length >= n.length - 1;
            };
            var near = names.filter(function (n) {
                return n.indexOf(verb) === 0 && strongEnough(n);
            });
            if (!near.length && verb.length > 1) {
                near = names.filter(function (n) {
                    return n.indexOf(verb) !== -1 && strongEnough(n);
                });
            }
            /* Still nothing: allow a real typo, measured properly.
               The first version counted shared characters, and a reviewer reproduced two bad
               outcomes with it. `strt`, a plausible slip for "start", suggested `stop`. So did
               `top`, which is the actual Linux command a student reaches for wanting a process
               list, where `ps` is the right answer. And `reset`, a reasonable word for restarting
               a wedged lab, suggested `search`. Counting shared letters is not a typo model.
               Two changes: real edit distance, and MUTATING COMMANDS ARE NEVER FUZZY-SUGGESTED.
               `stop` and `restart` destroy a student's running box. Reaching them requires typing
               them, or a prefix of them; a guess must never put a destructive verb in front of
               someone who typed something else. */
            if (!near.length && verb.length > 2) {
                near = names.filter(function (n) {
                    var d = editDistance(verb, n);
                    /* MUTATING COMMANDS: distance 1 ONLY, never the looser threshold.
                       The first version banned them outright, and a reviewer showed that strands
                       the genuine typo: `restrt` is distance 1 from `restart`, closer than `hlep`
                       is to `help`, and the shell suggested one while stonewalling the other, with
                       the fallback recommending `search restrt` which returns nothing. A dead end.
                       The ban was also solving a problem the better matcher had already solved.
                       It existed because letter-counting matched `strt` to `stop`; with
                       Damerau-Levenshtein that distance is 2, so a tight threshold excludes it on
                       its own. The only remaining distance-1 collision was `top` to `stop`, and
                       `top` is now a synonym for `ps`, so it never reaches this branch.
                       So: a typo one character away from `stop` almost certainly IS `stop`. Offer
                       it, and say what it does, rather than pretending it does not exist. */
                    /* Destructive names are SHORT, and short words have many distance-1
                       neighbours that are real words: a reviewer found `atop` (a real Linux
                       monitoring tool, curriculum-adjacent here) is distance 1 from `stop`, as are
                       `shop` and `stow`. Distance alone cannot separate "typo of stop" from
                       "different word that happens to be close". Requiring the first character to
                       match keeps the genuine typos (`sotp`, `stpo`, `restrt`) and drops `atop`,
                       because people mistype the middle of a word far more often than its first
                       letter. Not a whitelist; a property of how typing goes wrong. */
                    if (MUTATING[n]) {
                        return d <= 1 && verb.charAt(0) === n.charAt(0);
                    }
                    return d <= (verb.length > 4 ? 2 : 1);
                });
            }
            if (near.length) {
                say(esc(verb) + ': not a command.', 'err');
                say('did you mean: <span class="ok">'
                    + near.slice(0, 4).map(esc).join('</span>, <span class="ok">') + '</span>', 'muted');
                // A suggestion that tears down a running box says so. The student asked for
                // neither, so the shell should not hand one over without naming the consequence.
                var risky = near.slice(0, 4).filter(function (n) { return MUTATING[n]; });
                if (risky.length) {
                    say(risky.join(' and ') + (risky.length > 1 ? ' end' : ' ends')
                        + ' a running lab session, so check <span class="ok">ps</span> first.', 'warn');
                }
                return;
            }

            // 3. Genuinely unrecognised. Say what the shell IS, because a student who types a
            //    sentence at it has the wrong model of the thing and repeating "try help" does
            //    not correct that.
            say(esc(verb) + ': not a command.', 'err');
            return say('this is a command line, not a search box. <span class="ok">help</span> '
                + 'lists the 12 commands, <span class="ok">ls</span> shows what is here, and '
                + '<span class="ok">search ' + esc(verb) + '</span> looks for it by name.', 'muted');
        }
        COMMANDS[verb](arg);
    }

    // Tab completion state, so repeated Tab cycles through candidates instead of re-computing
    // the same longest-common-prefix and appearing to do nothing.
    var tabState = null;

    /** What is completable at this point in the line, and from which pool. */
    function completionContext(v) {
        var m = /^(\s*)(\S*)$/.exec(v);
        if (m) {
            // Still typing the first word: commands AND app ids, since a bare app name launches.
            return { prefix: m[1], frag: m[2],
                     pool: Object.keys(COMMANDS).concat(APPS.map(function (a) { return a.id; })) };
        }
        var r = /^(\s*(\S+)\s+)(.*)$/.exec(v);
        if (!r) return null;
        /* EIGHTH case site, and the worst-placed one: this function decides WHICH pool Tab draws
           from, so an unfolded verb here means Tab does nothing at all. Every branch below compares
           against a lowercase literal, exec() folds the verb before dispatch (see exec), and
           candidates() folds the fragment, so this single unfolded read was the one link left.
           `RUN ar` + Tab fell past every branch to `return null`, and complete()'s `if (!ctx)
           return;` makes that SILENT: not even the "no completion" line that an empty pool
           produces. A student cannot tell that from a dead key, and this file's own commentary
           calls silence a first-class bug.
           I had been calling tab-completion "already fixed" for three rounds. What was fixed was
           candidate MATCHING; the verb PARSING that decides whether matching ever runs was not.
           Found by a reviewer pressing Tab, which no test in this repo did.
           frag is deliberately NOT folded: it is the text being typed, and candidates() already
           matches it case-insensitively while preserving what the student sees. */
        var verb = low(r[2]), frag = r[3];
        if (/\s/.test(frag)) return null;          // past the first argument, nothing to complete
        if (verb === 'man') {
            // Commands first, then app ids, since man falls through to an app record.
            return { prefix: r[1], frag: frag,
                     pool: Object.keys(MANUAL).sort().concat(APPS.map(function (a) { return a.id; })) };
        }
        if (verb === 'cd') {
            return { prefix: r[1], frag: frag, pool: places() };
        }
        if (verb === 'run' || verb === 'info') {
            // Inside a context, complete what is here first; fall through to everything so an
            // app outside the current scope is still reachable without cd-ing back out.
            var here = scope().map(function (a) { return a.id; });
            var all = APPS.map(function (a) { return a.id; });
            var pool = here.concat(all.filter(function (x) { return here.indexOf(x) === -1; }));
            return { prefix: r[1], frag: frag, pool: pool };
        }
        if (verb === 'ls') {
            /* USES places(), which computes exactly this and is already used by cd's completion
               one branch away. This was a hand-rolled copy of it: not wrong, but the fourth
               instance of the same duplication this round has fixed twice already (cd's
               tie-break, ls's search predicate), relocated into the completion subsystem where
               nobody had looked. A reviewer found it while answering a different question. */
            var vals = {};
            places().forEach(function (pl) { vals[pl] = 1; });
            return { prefix: r[1], frag: frag, pool: Object.keys(vals).sort() };
        }
        if (verb === 'stop' || verb === 'restart') {
            /* These take a lab id and had NO branch, so `stop lin` + Tab fell through to
               `return null` and complete() returned in silence: no candidates, no message. That is
               the same dead-key symptom this file calls a first-class bug a few lines above, left
               on the two commands that got the most scrutiny this round.
               Completes from LAB_INFO, which is synchronous and is the id space stop/restart
               actually accept. Deliberately NOT the app manifest: those are different namespaces
               and offering an app id here would be a confident wrong answer, which is worse than
               none. Session ids are not offered either, since they arrive over the network. */
            var SL = window.SandboxLauncher;
            var labs = (SL && SL.LAB_INFO) ? Object.keys(SL.LAB_INFO) : [];
            return { prefix: r[1], frag: frag, pool: labs };
        }
        if (verb === 'search') {
            /* Ids, houses AND CATEGORIES. `search cert-prep` works when typed in full, but Tab
               after `search inc` offered nothing toward "incubator", so the word that makes the
               feature discoverable was absent from the mechanism that drives discovery. `ls` and
               `cd` both complete categories; search did not. Found by a reviewer. */
            var pool = APPS.map(function (a) { return a.id; });
            APPS.forEach(function (a) {
                if (a.house && pool.indexOf(a.house) === -1) pool.push(a.house);
                if (a.category && pool.indexOf(a.category) === -1) pool.push(a.category);
            });
            return { prefix: r[1], frag: frag, pool: pool };
        }
        return null;
    }

    /**
     * Prefix matches first; if none, fall back to substring. Typing "hunting" should find
     * bug-hunting, because a student who remembers half a name should not have to remember which
     * half, and prefix-only completion punishes them for guessing the wrong end.
     */
    function candidates(pool, frag) {
        // Empty fragment keeps the pool's own order. Sorting alphabetically buried every command
        // behind every app id starting with "adv-linux", so Tab on a blank line answered a question
        // nobody asked.
        if (!frag) return pool.slice();
        // Commands rank ahead of app ids at every stage, not only on a blank line. Sorting the
        // merged pool alphabetically put pwd 9th behind platform-* ids the moment you typed "p",
        // which undid the whole reason the empty-line branch exists.
        var cmds = Object.keys(COMMANDS);
        var rank = function (list) {
            var c = list.filter(function (x) { return cmds.indexOf(x) !== -1; }).sort();
            var a = list.filter(function (x) { return cmds.indexOf(x) === -1; }).sort();
            return c.concat(a);
        };
        /* Lowercase the fragment, matching the verb, byId, ls and cd. This was the FIFTH site and
           the only one left case-sensitive, caught by a reviewer after the other four shipped:
           `RUN ARENA` worked cold, but typing `AREN` and reaching for Tab, the exact discovery aid
           Tab exists for, silently did nothing and printed "no completion for AREN". Worse for a
           student than the original bug, because they had just learned capitals were fine. The pool
           is lowercase by convention, verified against all 192 ids and every category and house, so
           lowering the needle cannot change which candidate wins. */
        var needle = String(frag).toLowerCase();
        var pre = pool.filter(function (x) { return x.indexOf(needle) === 0; });
        if (pre.length) return rank(pre);
        return rank(pool.filter(function (x) { return x.indexOf(needle) !== -1; }));
    }

    function longestCommonPrefix(list) {
        return list.reduce(function (acc, s) {
            var i = 0;
            while (i < acc.length && i < s.length && acc[i] === s[i]) i++;
            return acc.slice(0, i);
        });
    }

    function complete() {
        // Repeated Tab on an unchanged line cycles through the candidates.
        if (tabState && tabState.line === cmd.value) {
            tabState.idx = (tabState.idx + 1) % tabState.hits.length;
            cmd.value = tabState.prefix + tabState.hits[tabState.idx];
            tabState.line = cmd.value;
            return;
        }

        var ctx = completionContext(cmd.value);
        if (!ctx) {
            /* This used to `return` silently, three lines above a comment asserting that silence
               is indistinguishable from a broken key. That contradiction is what made the verb
               case bug invisible: `RUN ar` fell through every branch of completionContext, landed
               here, and produced nothing at all, so it looked exactly like a dead Tab key rather
               than a shell that did not understand the line. Two paths reach here legitimately
               (past the first argument, and a command with no completion pool), and both are worth
               saying out loud. */
            var vm = /^\s*(\S+)\s+(.*)$/.exec(cmd.value);
            var vb = vm ? low(vm[1]) : '';
            var rest = vm ? vm[2] : '';
            if (vb && COMMANDS[vb]) {
                /* SEPARATE THE TWO REASONS. completionContext returns null both when the caret is
                   past the first argument and when the verb has no pool at all, and the first
                   draft of this collapsed them into one sentence. That made "nothing to complete
                   for cd" appear after `cd cloud extra`, which is false: `cd ` completes fine, it
                   is this POSITION that has nothing left. Mirrors completionContext's own test, so
                   the two cannot drift into disagreeing about which case is which. */
                if (/\s/.test(rest)) {
                    return say('nothing more to complete on this line.', 'muted');
                }
                return say('nothing to complete for <span class="ok">' + esc(vb) + '</span>.', 'muted');
            }
            return say('nothing to complete here.', 'muted');
        }
        var hits = candidates(ctx.pool, ctx.frag);

        if (!hits.length) {
            // Say so. Silence is indistinguishable from a broken key.
            return say('no completion for ' + esc(ctx.frag || '(empty)'), 'muted');
        }
        if (hits.length === 1) {
            cmd.value = ctx.prefix + hits[0] + ' ';
            tabState = null;
            return;
        }

        // Extend to the longest common prefix when that actually adds characters, then list.
        var lcp = longestCommonPrefix(hits);
        if (lcp.length > ctx.frag.length) cmd.value = ctx.prefix + lcp;

        var SHOWN = 60;
        say(hits.slice(0, SHOWN).map(esc).join('   ') +
            (hits.length > SHOWN
                ? '\n' + (hits.length - SHOWN) + ' more not shown; type another character or use search'
                : ''), 'muted');

        // Arm cycling from the current line so the next Tab steps through the list.
        tabState = { line: cmd.value, prefix: ctx.prefix, hits: hits, idx: -1 };
    }

    cmd.addEventListener('keydown', function (e) {
        // Any key that is not Tab ends the cycle, so completion never fights the user's typing.
        if (e.key !== 'Tab') tabState = null;
        if (e.key === 'Enter') {
            var line = cmd.value;
            say('<span class="echo">hex&gt; ' + esc(line) + '</span>');
            if (line.trim()) { history.push(line); hIdx = history.length; }
            cmd.value = '';
            // Students see a plain message; the detail goes to the console for whoever debugs it.
            try { exec(line); } catch (err) {
                say('something went wrong running that.', 'err');
                if (window.console) console.error('hex shell:', err);
            }
        } else if (e.key === 'Tab') {
            e.preventDefault(); complete(); return;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (hIdx > 0) cmd.value = history[--hIdx];
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (hIdx < history.length - 1) cmd.value = history[++hIdx];
            else { hIdx = history.length; cmd.value = ''; }
        }
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('a')) cmd.focus();
    });

    fetch('/data/hex-apps.json')
        .then(function (r) {
            if (!r.ok) throw new Error('manifest returned HTTP ' + r.status);
            return r.json();
        })
        .then(function (j) {
            APPS = j.apps || [];
            META = j;
            manifestState = 'ready';
            say('<span class="ok">hex shell</span> <span class="muted">' + APPS.length +
                ' apps from the manifest</span>');
            say('<span class="muted">type <span class="ok">help</span>, or an app name to launch it. ' +
                'try <span class="ok">run arena</span>.</span>');
        })
        .catch(function (e) {
            // Say what is actually wrong. A shell that fails silently is worse than no shell.
            manifestState = 'failed';
            say('could not load the app list.', 'err');
            say('reload the page. if it keeps happening, tell your instructor.', 'muted');
            if (window.console) console.error('hex shell: manifest load failed', e);
        });
})();
</script>

    <script src="/components/ObservatoryTelemetry.js"></script>
</body>
