<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Tenant containment, loaded STATICALLY rather than relying on tenant-sw.js injecting them.
         _app/hex/index.html carries a literal `<a href="/">back to Hexworth</a>` in its top bar
         (cited by CONTENT, not by line: this said ":94" and the link is now at 122, because my own
         edits moved it. A line number in a comment rots on the next insertion, which is BUG-249),
         and it is contained
         today ONLY because TenantShell.overrideLinks() rewrites it; AccessGuard.redirect() also
         consults TenantRouter.isActive() before falling back to hardcoded Hexworth destinations.
         Both arrive via service-worker injection, so containment currently depends on which worker
         wins the scope race for this path. A reviewer traced that to a one-click escape from the
         tenant wrapper for a white-label student. Loading them here makes containment independent
         of the worker entirely.
         SAFE FOR NON-TENANT STUDENTS: both no-op without tenant context (TenantShell returns at
         :56 when the blob is absent, TenantRouter's _init returns likewise), so a direct Hexworth
         user sees nothing. Double-load with tenant-sw's injected copy is now a no-op too, since
         BUG-244 made TenantRouter idempotent; TenantShell already was. -->
    <script src="/components/TenantRouter.js"></script>
    <script src="/components/TenantShell.js"></script>
    <script>
        /* Tell the auto-loaders these are already here. AccessGuard.js:1311 and FirebaseAuth.js
           both re-fetch TenantShell.js unless window.__tenantShellRequested is set, and a static
           <script src> does not set it, so the shell was being fetched and executed a SECOND time
           on every load of this page for a tenant user, taking a duplicate getTenantConfig call
           with it. Not a break, because TenantShell's own __tenantShellExecuted guard absorbs the
           re-run, but a wasted fetch and a wasted network round trip on every page view.
           TenantRouter needs no equivalent: those loaders gate it on
           `typeof TenantRouter === 'undefined'`, which the static include already satisfies.
           Found by a reviewer running an UNSTUBBED probe; my own test replaced AccessGuard.js with
           a stub, so the loader whose interaction I was testing never ran. */
        window.__tenantShellRequested = true;
        window.__tenantRouterRequested = true;
    </script>
    <script src="../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- HEXOS-5: installable to a Chromebook, tablet or laptop. Real icon, no browser chrome,
         no flashing.

         THERE IS DELIBERATELY NO SERVICE WORKER HERE, and hex-sw.js is deliberately not
         registered. A worker scoped to /hex/ would take control of these two pages away from
         tenant-sw.js, which is registered at scope '/' and injects TenantRouter + TenantShell
         into every navigation outside /tenant/ and /admin/. That injection IS the white-label
         guarantee, and scope matching prefers the longest match, so '/hex/' silently outranks
         '/' here. Registering ANY worker at this path, even a pass-through that calls no
         respondWith, is enough to suppress it, because the controller is chosen by scope and not
         by what the handler does.

         A load-time guard cannot fix that. The controller for a navigation is resolved before
         any of this document's script runs, so a guard that detects a tenant and unregisters is
         already too late for the page it is running on; it only protects the NEXT load. That is
         the reason this is absence rather than mitigation.

         Nothing is lost for installability: Chrome's own Page.getInstallabilityErrors returns []
         for this page with no worker registered. Offline launch is what a worker would add, and
         it belongs in the single root-scoped worker that already controls every page, not in a
         second one competing for these two. Tracked as HEXOS-5b. -->
    <link rel="manifest" href="/hex/manifest.webmanifest">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hex OS">
    <link rel="apple-touch-icon" sizes="256x256" href="/assets/media/brand/mark-cyan-256.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex OS Launcher</title>
    <style>
        :root {
            --bg: #0a0a0f; --panel: #12121a; --line: #23232e;
            --ink: #e8e8f0; --dim: #8b8b9e; --accent: #7dd3fc; --warn: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            font-size: 14px; line-height: 1.5;
        }
        header {
            position: sticky; top: 0; z-index: 10;
            background: rgba(10,10,15,0.94); border-bottom: 1px solid var(--line);
            padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
        }
        h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
        h1 .dim { color: var(--dim); font-weight: 400; }
        #q {
            flex: 1 1 240px; min-width: 0; background: #0d0d14; color: var(--ink);
            border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px;
            font: inherit; font-size: 13px;
        }
        #q:focus { outline: none; border-color: var(--accent); }
        .shell-link { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; }
        .shell-link:hover, .shell-link:focus-visible { text-decoration: underline; }
        .cats { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
        .cat {
            background: transparent; color: var(--dim); border: 1px solid var(--line);
            border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
        }
        .cat[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 700; }
        .cat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        main { padding: 16px 20px 60px; }
        .sec { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); margin-bottom: 30px; }
        .app {
            display: flex; flex-direction: column; gap: 7px; padding: 13px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
            color: var(--ink); text-decoration: none; min-height: 96px;
        }
        .app:hover, .app:focus-visible { border-color: var(--accent); background: #16161f; }
        .app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .app img, .noicon {
            width: 26px; height: 26px; border-radius: 5px; flex: none;
        }
        /* The 45 apps with no icon in the manifest get an initial, not a blank hole. This is a
           visible placeholder ON PURPOSE: HEXOS-2's job is to falsify the manifest, so a missing
           field should look missing rather than be quietly styled away. */
        .noicon {
            display: grid; place-items: center; background: #1d1d28;
            color: var(--dim); font-weight: 700; font-size: 13px; border: 1px dashed var(--line);
        }
        .nm { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
        .sub { font-size: 11px; color: var(--dim); }
        .tag { font-size: 10px; color: var(--dim); letter-spacing: 0.05em; text-transform: uppercase; }
        .app[data-status="workshop"] .tag { color: var(--warn); }
        .empty { color: var(--dim); padding: 30px 0; }
        .note { color: var(--dim); font-size: 11.5px; border-top: 1px solid var(--line); padding-top: 14px; }
        @media (prefers-reduced-motion: no-preference) { .app { transition: border-color .12s, background .12s; } }
    </style>
</head>
<body>
<header>
    <h1>hex<span class="dim">/apps</span></h1>
    <input id="q" type="search" placeholder="filter by name, id, house or course code" aria-label="Filter apps" autocomplete="off">
    <a class="shell-link" href="/hex/">use the shell instead</a>
    <!-- A real href, not just `run faq`. The dead-entry gate requires an inbound LINK, and it
         is right to: a page reachable only by typing a command you do not know exists is the
         same defect as an unreachable page. This is also where someone confused by the grid
         is already looking. -->
    <a class="shell-link" href="/hex/faq.html">what is an app?</a>
</header>
<div class="cats" id="cats" role="group" aria-label="Filter by category"></div>
<main>
    <p class="sec" id="count" aria-live="polite" aria-atomic="true"></p>
    <div id="out"><p class="empty">loading the app list...</p></div>
    <p class="note" id="note"></p>
</main>
<script>
(function () {
    'use strict';
    var APPS = [], cat = 'all', q = '';
    var out = document.getElementById('out'), note = document.getElementById('note');
    var RECENT_KEY = 'hexos_recent';

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // Same shape-check the shell uses: an entry must be a rooted path, never a scheme or a
    // protocol-relative URL, so a bad manifest row cannot turn a tile into an offsite link.
    // A reviewer defeated the shape check by probing the rendered href instead of reading the
    // regex: "/" + a TAB, LF, CR, FF, VT, SPACE or NUL + "/evil.com" passed, because the browser
    // strips those per WHATWG BEFORE deciding scheme-relativity, resolving to a protocol-relative
    // URL that navigates OFFSITE. The regex tested the raw string and never saw the normalised
    // MEASURED, and narrower than I first wrote it. Only TAB, LF and CR actually escape: the
    // WHATWG parser removes those ANYWHERE in the string, so "/<TAB>/evil.com" resolves to
    // http://evil.com/. FF, VT, SPACE and NUL pass the old shape check but percent-encode into
    // the path and stay same-origin, so they are blocked here as a defensive superset, not
    // because they were shown to be exploitable. An earlier version of this comment claimed all
    // seven "exploit it"; that was proven only against the regex, never against a browser, which
    // is the same mistake the fix itself exists to correct. Zero manifest entries are
    // affected either way.
    function safeEntry(e) {
        return typeof e === 'string' && !/[\x00-\x20\x7f]/.test(e)
            && /^\/[^/\\]/.test(e) ? e : null;
    }

    function recents() {
        try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; }
    }
    function remember(id) {
        try {
            var r = recents().filter(function (x) { return x !== id; });
            r.unshift(id);
            localStorage.setItem(RECENT_KEY, JSON.stringify(r.slice(0, 8)));
        } catch (e) { /* storage blocked: recents simply do not persist */ }
    }

    function tile(a) {
        var href = safeEntry(a.entry);
        if (!href) return '';
        var icon = a.icon
            ? '<img src="' + esc(a.icon) + '" alt="" loading="lazy">'
            : '<span class="noicon" aria-hidden="true">' + esc((a.name || '?').charAt(0).toUpperCase()) + '</span>';
        return '<a class="app" href="' + esc(href) + '" data-id="' + esc(a.id) + '" data-status="' + esc(a.status) + '">'
            + icon
            + '<span class="nm">' + esc(a.name) + '</span>'
            + (a.sublabel ? '<span class="sub">' + esc(a.sublabel) + '</span>' : '')
            + '<span class="tag">' + esc(a.house || a.category)
                + (a.clientGuard ? ' · ' + esc(a.clientGuard) : '')
                + (a.status === 'workshop' ? ' · workshop' : '') + '</span>'
            + '</a>';
    }

    function matches(a) {
        if (cat !== 'all' && a.category !== cat) return false;
        if (!q) return true;
        var hay = (a.id + ' ' + a.name + ' ' + (a.sublabel || '') + ' ' + (a.house || '') + ' ' + a.category).toLowerCase();
        return hay.indexOf(q) !== -1;
    }

    function render() {
        var list = APPS.filter(matches);
        var html = '';
        if (!q && cat === 'all') {
            var ids = recents(), rec = [];
            for (var i = 0; i < ids.length; i++) {
                for (var j = 0; j < APPS.length; j++) if (APPS[j].id === ids[i]) rec.push(APPS[j]);
            }
            if (rec.length) {
                html += '<p class="sec">recent</p><div class="grid">' + rec.map(tile).join('') + '</div>';
            }
        }
        // The count lives OUTSIDE the replaced region and is a live region, so a screen reader
        // hears the result of a filter or keystroke. Announcing the grid itself would read out
        // every tile.
        document.getElementById('count').textContent =
            (q || cat !== 'all') ? list.length + ' match' + (list.length === 1 ? '' : 'es')
                                 : 'all apps · ' + list.length;
        html += list.length
            ? '<div class="grid">' + list.map(tile).join('') + '</div>'
            : '<p class="empty">nothing matches. Try a house name, a course code, or clear the filter.</p>';
        out.innerHTML = html;
    }

    document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('.app') : null;
        if (a && a.dataset.id) remember(a.dataset.id);
    });
    document.getElementById('q').addEventListener('input', function (e) {
        q = e.target.value.trim().toLowerCase(); render();
    });

    fetch('/data/hex-apps.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
            // A 200 carrying a malformed or empty body is NOT the same as "no results", and the
            // previous version collapsed them: `d.apps || []` swallowed a renamed key, then the
            // page printed "nothing matches. Try a house name" with no filter active. That is
            // wrong advice during total data loss, and worse than the fetch-failure path which
            // at least says something is broken. A reviewer caught the asymmetry.
            if (!d || !Array.isArray(d.apps)) throw new Error('the app list is malformed: no "apps" array');
            if (!d.apps.length) throw new Error('the app list is empty');
            // Isolate a bad ROW; do not let it take the page down. A row missing `name` used to
            // throw inside .then() on undefined.localeCompare, reject the chain, and replace the
            // entire launcher with a raw JS error for every student. One malformed row out of 190
            // was a total outage, while the very next lines already knew how to drop a row with a
            // bad `entry` and report the count.
            var malformed = d.apps.filter(function (a) { return !a || typeof a.name !== 'string' || !a.id; });
            APPS = d.apps.filter(function (a) { return a && typeof a.name === 'string' && a.id; })
                         .sort(function (x, y) { return x.name.localeCompare(y.name); });
            if (!APPS.length) throw new Error('every row in the app list is malformed');
            var counts = {}, order = [];
            APPS.forEach(function (a) {
                if (!counts[a.category]) { counts[a.category] = 0; order.push(a.category); }
                counts[a.category]++;
            });
            order.sort();
            var cats = document.getElementById('cats');
            cats.innerHTML = ['all'].concat(order).map(function (c) {
                var n = c === 'all' ? APPS.length : counts[c];
                return '<button class="cat" data-cat="' + esc(c) + '" aria-pressed="' + (c === 'all') + '">'
                    + esc(c) + ' <span class="dim">' + n + '</span></button>';
            }).join('');
            cats.addEventListener('click', function (e) {
                var b = e.target.closest('.cat'); if (!b) return;
                cat = b.dataset.cat;
                Array.prototype.forEach.call(cats.children, function (x) {
                    x.setAttribute('aria-pressed', String(x === b));
                });
                render();
            });
            // Falsification is this page's actual job, so the gap is reported, not hidden.
            var noIcon = APPS.filter(function (a) { return !a.icon; }).length;
            var bad = APPS.filter(function (a) { return !safeEntry(a.entry); }).length;
            note.textContent = APPS.length + ' apps from the same manifest the shell reads. '
                + (malformed.length ? malformed.length + ' row(s) dropped as malformed. ' : '')
                + noIcon + ' have no icon and show an initial instead'
                + (bad ? '; ' + bad + ' have an entry this page refuses to link' : '')
                + '. clientGuard shown on a tile is what the page DECLARES, not enforcement.';
            render();
        })
        .catch(function (e) {
            out.innerHTML = '<p class="empty">could not load the app list: ' + esc(e.message)
                + '<br>The shell at <a class="shell-link" href="/hex/">/hex/</a> reads the same file, '
                + 'so it will be having the same trouble.</p>';
        });
})();
</script>
<script src="/components/ObservatoryTelemetry.js"></script>
</body>
</html>
