<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal — Hardware Projects — Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-antenna.webp">
</head>
<body style="margin:0;background:#0a0a0f">
<h1 class="visually-hidden">The Signal — Hardware Projects</h1>
    <script src="../components/FavoritesManager.js"></script>
    <script src="SignalData.js"></script>
    <script src="SignalEngine.js"></script>
    <script>SignalEngine.renderHub();</script>

    <!-- Careers-from-this-house CTA. SignalEngine.renderHub() wipes body.innerHTML and
         rebuilds it synchronously, so this injection runs AFTER renderHub completes. It
         appends a single Orange-accented card into the <main> element the engine created.
         If the engine's main element is missing for any reason, this is a no-op. -->
    <script>
    (function injectSignalCareersCard() {
        var main = document.querySelector('main.se-main');
        if (!main) return;
        var card = document.createElement('div');
        card.style.cssText = 'margin:1.5rem auto;max-width:1100px;padding:0 1rem;';
        card.innerHTML = '<a href="careers.html" style="' +
            'display:block;padding:24px 28px;' +
            'background:rgba(251,146,60,0.04);' +
            'border:1px solid rgba(251,146,60,0.22);' +
            'border-radius:12px;text-decoration:none;color:#e2e8f0;' +
            'font-family:\'Segoe UI\',system-ui,sans-serif;transition:all .3s;' +
            '" onmouseover="this.style.borderColor=\'#fb923c\';this.style.boxShadow=\'0 0 24px rgba(251,146,60,0.15)\'"' +
            ' onmouseout="this.style.borderColor=\'rgba(251,146,60,0.22)\';this.style.boxShadow=\'none\'">' +
            '<span style="display:inline-block;background:rgba(251,146,60,0.15);' +
            'border:1px solid rgba(251,146,60,0.3);color:#fb923c;font-size:.65rem;' +
            'font-weight:600;letter-spacing:.15em;padding:3px 12px;border-radius:4px;' +
            'margin-bottom:10px;">CAREERS // HARDWARE &amp; IoT</span>' +
            '<div style="font-size:1.2rem;font-weight:600;color:#fff;margin-bottom:6px;">' +
            'Careers from The Signal</div>' +
            '<div style="font-size:.82rem;color:#fb923c;margin-bottom:10px;">' +
            '9 Roles | Entry to Senior | 2026 US Salary Data</div>' +
            '<div style="font-size:.8rem;color:#94a3b8;line-height:1.55;">' +
            'IoT Security Analyst, Firmware Security Analyst, Hardware Security Engineer, Embedded Security ' +
            'Researcher, RF/SDR Specialist, Physical Pentester, Red Team Hardware Specialist, ICS/SCADA ' +
            'Security Engineer, and Drone &amp; Aerospace Security Researcher. Salary ranges, certifications, ' +
            'day-in-the-life descriptions.</div></a>';
        // Insert before the footer if present; otherwise append at end of main.
        var footer = main.querySelector('.se-footer');
        if (footer) {
            main.insertBefore(card, footer);
        } else {
            main.appendChild(card);
        }
    })();
    </script>

    <!-- Signal Bot — Nikola Tesla (Aminos AI) -->
    <script src="https://platform.aminos.ai/w/chat_plugin.js" data-bot-id="8210"></script>
</body>
</html>
