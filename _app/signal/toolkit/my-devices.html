<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Devices &mdash; Signal Toolkit &mdash; Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="../../assets/images/icons/icon-plug.webp">

    <script src="../../components/FirebaseAuth.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card-hover: #181824;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 107, 53, 0.35);
            --accent: #ff6b35;
            --accent-dim: rgba(255, 107, 53, 0.12);
            --text: #e2e8f0;
            --text-muted: #8b949e;
            --text-dim: #4b5563;
            --ok: #4ade80;
            --warn: #facc15;
            --err: #f87171;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            padding: 0 16px;
        }
        .page-wrap { max-width: 1000px; margin: 0 auto; padding: 32px 0 96px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px;
            margin-bottom: 24px;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--border-hover); }
        h1 {
            font-size: 28px; font-weight: 700; margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--accent) 0%, #ff9d6a 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .tagline { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
        .gate {
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 36px 24px; text-align: center; color: var(--text-muted);
        }
        .gate a {
            color: var(--accent); text-decoration: none; font-weight: 600;
            border-bottom: 1px dashed var(--accent);
        }
        table {
            width: 100%; border-collapse: collapse;
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border);
            font-size: 13px; vertical-align: top;
        }
        th {
            text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
            color: var(--text-muted); background: var(--bg);
        }
        tr:last-child td { border-bottom: none; }
        .pill {
            display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
            text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;
        }
        .pill.online   { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
        .pill.idle     { background: rgba(250, 204, 21, 0.15); color: var(--warn); }
        .pill.offline  { background: rgba(248, 113, 113, 0.15); color: var(--err); }
        .pill.new      { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        code {
            font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px;
            color: var(--accent);
        }
        .empty {
            background: var(--card); border: 1px dashed var(--border);
            border-radius: 8px; padding: 36px 24px; text-align: center;
            color: var(--text-muted);
        }
        .empty a {
            color: var(--accent); text-decoration: none; font-weight: 600;
        }
        .meta-line { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
        .err-banner {
            background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--err); padding: 14px; border-radius: 6px; margin-bottom: 20px;
        }
        .reload-btn {
            background: transparent; color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
            margin-bottom: 14px;
        }
        .reload-btn:hover { border-color: var(--border-hover); color: var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a href="../index.html" class="back-btn">&larr; Back to Signal</a>
        <h1>My Devices</h1>
        <p class="tagline">Devices you have registered against the Hexworth C2 backend. Read-only view — devices report status every 30 seconds while they have power and WiFi.</p>

        <div id="gate" class="gate hidden">
            <p>Sign in to see the devices linked to your account.</p>
            <p style="margin-top:14px;"><a href="/login.html?return=/signal/toolkit/my-devices.html">Sign in &rarr;</a></p>
        </div>

        <div id="content" class="hidden">
            <button class="reload-btn" id="reload-btn">Refresh</button>
            <div id="error-banner" class="err-banner hidden"></div>
            <div id="device-table-wrap"></div>
        </div>
    </div>

<script type="module">
'use strict';

const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fmtRelative(ts) {
    if (!ts) return 'never';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const secs = (Date.now() - d.getTime()) / 1000;
    if (secs < 60) return Math.round(secs) + 's ago';
    if (secs < 3600) return Math.round(secs / 60) + 'm ago';
    if (secs < 86400) return Math.round(secs / 3600) + 'h ago';
    return Math.round(secs / 86400) + 'd ago';
}

function statusPill(device) {
    if (!device.lastCheckIn) {
        return '<span class="pill new">new</span>';
    }
    const last = device.lastCheckIn.toDate ? device.lastCheckIn.toDate() : new Date(device.lastCheckIn);
    const ageSecs = (Date.now() - last.getTime()) / 1000;
    const interval = device.checkInInterval || 30;
    if (ageSecs < interval * 3) return '<span class="pill online">online</span>';
    if (ageSecs < interval * 12) return '<span class="pill idle">idle</span>';
    return '<span class="pill offline">offline</span>';
}

async function loadDevices(db, uid, fsMod) {
    const { collection, query, where, getDocs } = fsMod;
    const q = query(collection(db, 'c2_devices'), where('ownerUid', '==', uid));
    const snap = await getDocs(q);
    const rows = [];
    snap.forEach(doc => rows.push(doc.data()));
    rows.sort((a, b) => {
        const at = a.registeredAt && a.registeredAt.toMillis ? a.registeredAt.toMillis() : 0;
        const bt = b.registeredAt && b.registeredAt.toMillis ? b.registeredAt.toMillis() : 0;
        return bt - at;
    });
    return rows;
}

function renderDevices(rows) {
    const host = $('device-table-wrap');
    if (!rows.length) {
        host.innerHTML = `
            <div class="empty">
                <p>You haven't registered any devices yet.</p>
                <p style="margin-top:14px;"><a href="web-flasher.html">Flash a device &rarr;</a></p>
            </div>`;
        return;
    }
    const head = `
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Firmware</th>
                <th>Status</th>
                <th>Last check-in</th>
                <th>Device ID</th>
            </tr>
        </thead>`;
    const body = rows.map(d => `
        <tr>
            <td>
                ${escapeHtml(d.name || '(unnamed)')}
                <div class="meta-line">registered ${fmtRelative(d.registeredAt)}</div>
            </td>
            <td>${escapeHtml(d.type || '?')}</td>
            <td>${escapeHtml(d.firmware || '?')}</td>
            <td>${statusPill(d)}</td>
            <td>${fmtRelative(d.lastCheckIn)}<div class="meta-line">interval ${d.checkInInterval || 30}s</div></td>
            <td><code>${escapeHtml(d.deviceId || '')}</code></td>
        </tr>`).join('');
    host.innerHTML = '<table>' + head + '<tbody>' + body + '</tbody></table>';
}

async function ensureFirebase() {
    const fsMod = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js');
    const apps = window.firebaseApp.getApps();
    if (apps.length === 0) throw new Error('Firebase app not initialized');
    const db = fsMod.getFirestore(apps[0]);
    return { db, fsMod };
}

async function refresh() {
    const banner = $('error-banner');
    banner.classList.add('hidden');
    try {
        const { db, fsMod } = await ensureFirebase();
        const user = FirebaseAuth.getUser();
        if (!user) throw new Error('not signed in');
        const rows = await loadDevices(db, user.uid, fsMod);
        renderDevices(rows);
    } catch (e) {
        banner.textContent = 'Could not load devices: ' + (e && e.message ? e.message : String(e));
        banner.classList.remove('hidden');
    }
}

(async function init() {
    if (typeof FirebaseAuth === 'undefined') {
        $('gate').classList.remove('hidden');
        return;
    }
    await FirebaseAuth.waitForAuth();
    const user = FirebaseAuth.getUser();
    if (!user || user.isAnonymous) {
        $('gate').classList.remove('hidden');
        return;
    }
    $('content').classList.remove('hidden');
    $('reload-btn').addEventListener('click', refresh);
    await refresh();
})();
</script>
</body>
</html>
