    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1545 50%, #1a0a2e 100%);

        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #9b59d033;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #9b59d0;
            text-decoration: none;

            transition: color 0.2s;
        }

            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;

        }
        #quiz-container { width: 100%; max-width: 800px; }

</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>
        <span class="brand"><span>&#9760;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-02: Reconnaissance & OSINT Challenge',
            description: 'Test your knowledge of feh-02: reconnaissance & osint',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-02',
            moduleId: 'feh-02',
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'Which type of reconnaissance involves directly interacting with target systems, potentially leaving traces in their logs?',
                    options: [
                        'Passive reconnaissance',
                        'Active reconnaissance',
                        'OSINT gathering',
                        'Social engineering'
                    ],
                    correct: 1,
                    explanation: 'Active reconnaissance sends packets to or queries target systems directly (port scans, banner grabbing), generating log entries. Passive recon uses publicly available data sources without ever touching the target.'
                },
                {
                    question: 'A penetration tester uses the Google dork <code>site:target.com filetype:pdf</code>. What is the purpose of this query?',
                    options: [
                        'Find all subdomains of target.com',
                        'Locate PDF documents hosted on target.com',
                        'Search for target.com in PDF metadata',
                        'List all Google-indexed pages on target.com'
                    ],
                    correct: 1,
                    explanation: 'The <code>filetype:</code> operator restricts results to a specific file type. PDFs, Excel files, and Word documents often contain sensitive metadata, internal paths, and employee names — valuable OSINT without touching the target.'
                },
                {
                    question: 'Which Google dork operator returns pages whose &lt;title&gt; tag contains a specific keyword?',
                    options: [
                        '<code>inurl:</code>',
                        '<code>intext:</code>',
                        '<code>intitle:</code>',
                        '<code>cache:</code>'
                    ],
                    correct: 2,
                    explanation: '<code>intitle:</code> searches within the HTML title tag. Useful for finding admin panels (<code>intitle:"admin login"</code>), exposed dashboards, or misconfigured services that reveal their purpose in the page title.'
                },
                {
                    question: 'Passive reconnaissance best describes which activity?',
                    options: [
                        'Running Nmap against a target subnet',
                        'Querying public WHOIS records for domain registration info',
                        'Sending crafted packets to identify open ports',
                        'Using Metasploit to fingerprint services'
                    ],
                    correct: 1,
                    explanation: 'WHOIS queries public registration databases — no packets are sent to the target. This is classic passive recon: gathering intelligence using data the target itself published or that third parties maintain.'
                },
                {
                    question: 'A WHOIS lookup for a domain reveals the registrar, registration dates, and name servers. Which additional piece of information is most valuable to an attacker?',
                    options: [
                        'The domain\'s PageRank',
                        'Registrant contact information (name, email, phone)',
                        'The domain\'s SSL certificate expiry',
                        'The number of DNS records'
                    ],
                    correct: 1,
                    explanation: 'Registrant contact info provides employee names, email formats, and sometimes physical addresses — directly fueling spear-phishing and social engineering. Many attackers use this before any technical attack.'
                },
                {
                    question: 'DNS enumeration using a zone transfer (AXFR) attempt is considered which type of recon?',
                    options: [
                        'Passive — it only reads public DNS records',
                        'Active — it sends a query directly to the target\'s DNS server',
                        'Neither — it requires physical access',
                        'Passive — it uses a third-party DNS resolver'
                    ],
                    correct: 1,
                    explanation: 'AXFR queries are sent directly to the target\'s authoritative name server, making them active recon. A successful zone transfer hands the attacker the entire DNS zone — hostnames, IPs, mail servers, and more. Most modern DNS servers reject unauthorized AXFR requests.'
                },
                {
                    question: 'Shodan is best described as:',
                    options: [
                        'A social media OSINT aggregation platform',
                        'A search engine that indexes internet-connected devices and their banners',
                        'A DNS enumeration tool',
                        'A credential dumping utility'
                    ],
                    correct: 1,
                    explanation: 'Shodan continuously scans the internet and indexes service banners from exposed devices — routers, cameras, SCADA systems, databases. Attackers use it to find vulnerable internet-facing systems without scanning them directly.'
                },
                {
                    question: 'Which Shodan query would find Apache servers on port 80 running in Germany?',
                    options: [
                        '<code>port:80 country:DE Apache</code>',
                        '<code>ip:0.0.0.0/0 port=80 country=germany</code>',
                        '<code>find:apache location:germany</code>',
                        '<code>scan port:80 header:apache geo:DE</code>'
                    ],
                    correct: 0,
                    explanation: 'Shodan uses filter syntax: <code>port:80</code>, <code>country:DE</code>, and keyword terms separated by spaces. This is passive recon since Shodan already indexed the data — you\'re searching a database, not scanning the target.'
                },
                {
                    question: 'theHarvester is primarily used to collect:',
                    options: [
                        'Password hashes from target systems',
                        'Email addresses, subdomains, and open ports from public sources',
                        'Packet captures from network traffic',
                        'Social media profile images'
                    ],
                    correct: 1,
                    explanation: 'theHarvester scrapes search engines, certificate transparency logs, and public APIs to enumerate email addresses, employee names, subdomains, and IP addresses — all without touching the target. It\'s a staple first-phase OSINT tool.'
                },
                {
                    question: 'Maltego is best known for its ability to:',
                    options: [
                        'Perform automated exploitation of discovered services',
                        'Visualize and correlate relationships between OSINT data entities',
                        'Capture network packets in promiscuous mode',
                        'Brute-force web application login forms'
                    ],
                    correct: 1,
                    explanation: 'Maltego uses \'transforms\' to pivot between data entities (domains, emails, IPs, people, companies) and visualize their relationships as a graph. This link analysis is invaluable for understanding the attack surface\'s structure.'
                },
                {
                    question: 'A JPEG photo posted on social media contains GPS coordinates, camera model, and timestamp embedded in it. What tool extracts this metadata?',
                    options: [
                        'Nmap',
                        'ExifTool',
                        'Wireshark',
                        'theHarvester'
                    ],
                    correct: 1,
                    explanation: 'ExifTool reads and writes metadata embedded in image files (EXIF, IPTC, XMP). GPS coordinates in unstripped photos have de-anonymized targets, revealed safe house locations, and exposed military positions in real-world incidents.'
                },
                {
                    question: 'Footprinting specifically refers to:',
                    options: [
                        'Installing monitoring software on target systems',
                        'Creating a comprehensive map of the target\'s digital presence before attacking',
                        'Performing exploitation after gaining access',
                        'Analyzing memory dumps for credentials'
                    ],
                    correct: 1,
                    explanation: 'Footprinting (a subset of recon) is the systematic process of profiling a target: gathering network ranges, domain info, employee data, technology stack details, and physical locations. It forms the intelligence foundation for every subsequent attack phase.'
                },
                {
                    question: 'When conducting social media OSINT against a target organization, which platform is most valuable for mapping employee professional relationships and org structure?',
                    options: [
                        'Instagram',
                        'Twitter/X',
                        'LinkedIn',
                        'TikTok'
                    ],
                    correct: 2,
                    explanation: 'LinkedIn exposes org charts, job titles, reporting structures, technology stacks (from job postings), and employee names. Job postings alone reveal internal software, security tools, and infrastructure details that inform attack planning.'
                },
                {
                    question: 'The Google dork <code>inurl:admin site:target.com</code> is designed to:',
                    options: [
                        'Find pages where \'admin\' appears in the body text',
                        'Find pages on target.com with \'admin\' in the URL',
                        'List all admin users registered on target.com',
                        'Search Google\'s cache of target.com\'s admin page'
                    ],
                    correct: 1,
                    explanation: '<code>inurl:</code> restricts results to pages where the specified term appears in the URL path. Admin panels, login pages, and configuration interfaces indexed by Google are common high-value targets discovered this way.'
                },
                {
                    question: 'Certificate Transparency (CT) logs are useful for OSINT reconnaissance because they:',
                    options: [
                        'Reveal private keys associated with SSL certificates',
                        'Enumerate subdomains by logging all issued SSL/TLS certificates publicly',
                        'Show the internal network topology of a target',
                        'Contain hashed passwords from web applications'
                    ],
                    correct: 1,
                    explanation: 'Every publicly-trusted SSL certificate is logged in CT logs (RFC 6962). Tools like crt.sh and Sublist3r query these logs to discover subdomains the organization may have thought were private — entirely passive, no target interaction required.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
