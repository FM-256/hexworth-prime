<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>
        <span class="brand"><span>&#9760;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-08: Social Engineering Challenge',
            description: 'Test your knowledge of feh-08: social engineering',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-08',
            moduleId: 'feh-08',
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'Spear phishing differs from generic phishing primarily because:',
                    options: [
                        'Spear phishing uses malware attachments; generic phishing uses only links',
                        'Spear phishing is highly targeted using personalized information about the victim; generic phishing is mass-sent with generic lures',
                        'Spear phishing targets C-suite executives only',
                        'Spear phishing occurs via phone calls rather than email'
                    ],
                    correct: 1,
                    explanation: 'Spear phishing uses OSINT to craft believable, personalized lures referencing the victim\'s name, employer, colleagues, or recent activity. This dramatically increases success rates. Generic phishing is volume-based with no personalization.'
                },
                {
                    question: 'A \'whaling\' attack is best described as:',
                    options: [
                        'A phishing campaign targeting thousands of users simultaneously',
                        'A spear phishing attack specifically targeting high-value executives (C-suite, VPs, board members)',
                        'A phishing attack delivered via SMS',
                        'A watering hole attack on financial websites'
                    ],
                    correct: 1,
                    explanation: 'Whaling targets \'big fish\' — CEOs, CFOs, legal counsel. These targets have elevated access and authority. Successful whaling attacks often lead to wire transfer fraud (Business Email Compromise) and data breaches affecting the entire organization.'
                },
                {
                    question: 'Vishing attacks are conducted via:',
                    options: [
                        'Malicious email attachments',
                        'Voice calls — attackers impersonate IT support, banks, or government agencies to extract information',
                        'SMS text messages',
                        'Fake QR codes at physical locations'
                    ],
                    correct: 1,
                    explanation: 'Vishing (Voice phishing) exploits trust in phone communication. Attackers impersonate IT helpdesks, IRS agents, or bank fraud departments. They use urgency, authority, and fear to coerce victims into revealing credentials or making wire transfers.'
                },
                {
                    question: 'Smishing attacks target victims through:',
                    options: [
                        'Compromised social media accounts',
                        'SMS text messages containing malicious links or requests',
                        'Fake software update prompts',
                        'Email with homoglyph domain spoofing'
                    ],
                    correct: 1,
                    explanation: 'Smishing (SMS phishing) exploits the high open rate of text messages (98% vs email\'s 20%). Attackers send fake package delivery alerts, bank fraud warnings, or prize notifications with malicious URLs. Mobile browsers also obscure full URLs, aiding deception.'
                },
                {
                    question: 'In social engineering, pretexting involves:',
                    options: [
                        'Sending malware before making contact to weaken defenses',
                        'Creating a fabricated scenario (pretext) to establish false trust and manipulate the target into revealing information',
                        'Physically following an authorized person through a secured door',
                        'Leaving infected USB drives in parking lots'
                    ],
                    correct: 1,
                    explanation: 'Pretexting creates a believable backstory — an attacker might claim to be an IT auditor, a new employee, or a vendor. The pretext establishes legitimacy before requesting sensitive information. It\'s the foundation of most social engineering attacks.'
                },
                {
                    question: 'A baiting attack most closely resembles which scenario?',
                    options: [
                        'Sending urgent emails claiming the victim\'s account will be suspended',
                        'Leaving malware-infected USB drives in locations where targets will find and use them',
                        'Calling a help desk while impersonating an employee',
                        'Observing a victim entering credentials from a distance'
                    ],
                    correct: 1,
                    explanation: 'Baiting exploits curiosity. Infected USB drives labeled \'Employee Salaries Q4\' or \'Confidential\' are left in parking lots. Studies show 45-98% of found USB drives are plugged in. Once inserted, the device executes the payload. Defense: disable AutoRun and prohibit unauthorized USB use.'
                },
                {
                    question: 'Tailgating and piggybacking differ in that:',
                    options: [
                        'Tailgating is digital; piggybacking is physical',
                        'In tailgating the attacker follows without the victim\'s knowledge; in piggybacking the victim knowingly holds the door (social pressure)',
                        'Piggybacking requires a fake badge; tailgating does not',
                        'They are identical — the terms are fully interchangeable'
                    ],
                    correct: 1,
                    explanation: 'Tailgating: the attacker physically follows behind an authorized person through a secured door, often unnoticed. Piggybacking: the authorized person is aware but complies due to social pressure (\'Can you hold the door? My hands are full\'). Both bypass physical access controls.'
                },
                {
                    question: 'A watering hole attack compromises:',
                    options: [
                        'Public water utility SCADA systems',
                        'Websites frequently visited by the target group, infecting visitors with malware when they visit',
                        'Email servers handling high volumes of corporate mail',
                        'Physical water stations in office buildings to plant surveillance devices'
                    ],
                    correct: 1,
                    explanation: 'Watering hole attacks identify industry-specific websites (trade forums, vendor portals) the target group frequently visits, compromise them with drive-by download exploits, and wait for victims to arrive. APT groups use this for targeted industry attacks where spear phishing is too risky.'
                },
                {
                    question: 'Shoulder surfing in a cybersecurity context refers to:',
                    options: [
                        'Analyzing network traffic by positioning near the target organization',
                        'Directly observing a person\'s screen, keyboard, or PIN pad to steal credentials or sensitive information',
                        'Riding a target\'s shoulder in a social platform to gather OSINT',
                        'Monitoring shoulder-mounted cameras for physical security'
                    ],
                    correct: 1,
                    explanation: 'Shoulder surfing is low-tech observation — watching someone enter a PIN at an ATM, type credentials at a coffee shop, or review sensitive documents on a train. It requires no technical tools. Defense: privacy screens, awareness, and shielding entry with your body.'
                },
                {
                    question: 'Dumpster diving as a social engineering tactic involves:',
                    options: [
                        'Exploiting SQL injection in web applications',
                        'Searching through an organization\'s discarded materials (trash, recycling) for sensitive information',
                        'Installing keyloggers on shared workstations',
                        'Brute-forcing discarded default passwords'
                    ],
                    correct: 1,
                    explanation: 'Dumpster diving recovers printed documents, discarded hard drives, organizational charts, and access badges from trash. In many jurisdictions it\'s legal once trash is in a public area. Defense: cross-cut shredding, degaussing/destroying storage media, and a formal media disposal policy.'
                },
                {
                    question: 'A quid pro quo attack offers:',
                    options: [
                        'Financial compensation for system access during penetration tests',
                        'Something of perceived value (IT help, prizes, gift cards) in exchange for information or access',
                        'Legal immunity in exchange for whistleblowing',
                        'Physical gifts delivered to executives to gain building access'
                    ],
                    correct: 1,
                    explanation: 'Quid pro quo (\'this for that\') offers a service or benefit in exchange for credentials or access. Classic example: attackers call random employees claiming to be IT support offering to fix an issue — in exchange they request login credentials. Defense: verify IT requests through official channels.'
                },
                {
                    question: 'KnowBe4-style security awareness training programs primarily measure effectiveness through:',
                    options: [
                        'Annual mandatory video completion rates',
                        'Simulated phishing campaigns that track click rates, credential submission, and reporting rates over time',
                        'Quarterly written examinations on security policy',
                        'Network monitoring for insider threat behaviors'
                    ],
                    correct: 1,
                    explanation: 'Simulated phishing campaigns send realistic fake phishing emails to employees. Organizations track who clicks, who submits credentials, and who reports. Repeat offenders receive targeted training. This behavioral, measurable approach outperforms passive video training.'
                },
                {
                    question: 'Social proof as a social engineering principle exploits:',
                    options: [
                        'Authority figures in the organization to compel compliance',
                        'The human tendency to follow the actions of others — \'everyone else is doing this, so it must be legitimate\'',
                        'The victim\'s desire for physical proof of identity',
                        'Legal proof requirements in corporate environments'
                    ],
                    correct: 1,
                    explanation: 'Robert Cialdini\'s social proof principle: humans look to others\' behavior in uncertain situations. Attackers use it by claiming \'Everyone in accounting uses this portal\' or \'Your colleague just verified their account.\' Fake reviews, testimonials, and fabricated consensus exploit this bias.'
                },
                {
                    question: 'Which physical security control is most directly designed to prevent tailgating?',
                    options: [
                        'CCTV cameras at all entry points',
                        'Mantrap (airlock vestibule) — a small room requiring one door to close before the next opens, allowing only one person at a time',
                        'Biometric fingerprint readers at external doors',
                        'Security guards issuing visitor badges'
                    ],
                    correct: 1,
                    explanation: 'A mantrap (airlock, security vestibule) physically enforces one-person-at-a-time access. The outer door must close and lock before the inner door can open. Often combined with weight sensors or cameras. It\'s the most robust hardware countermeasure against tailgating.'
                },
                {
                    question: 'An attacker researches a target executive\'s LinkedIn, recent conference talks, and published interviews before calling their assistant. This technique is called:',
                    options: [
                        'Vishing with random target selection',
                        'OSINT-enhanced pretexting — using open-source intelligence to build a convincing backstory for social engineering',
                        'Spear phishing via voice channel',
                        'Cold calling with authority exploitation'
                    ],
                    correct: 1,
                    explanation: 'Combining OSINT (LinkedIn, Twitter/X, conference programs, company press releases) with pretexting creates highly convincing scenarios. The attacker can reference real projects, names, and events, dramatically increasing credibility. This is the foundation of Business Email Compromise (BEC) and executive fraud attacks.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>

</html>
