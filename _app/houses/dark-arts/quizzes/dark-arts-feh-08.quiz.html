<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEH-08: Social Engineering — Dark Arts</title>
    <style>
        :root {
            --house-primary: #6b21a8; --house-accent: #9333ea;
            --correct: #00ff41; --incorrect: #ef4444; --info: #38bdf8;
            --bg: #0a0a0a; --card: rgba(15,5,25,0.85); --border: rgba(107,33,168,0.3);
            --text: #d4d4d8; --muted: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: var(--bg); font-family: 'Courier New', monospace; color: var(--text); }
        body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--house-accent), transparent);
            opacity: 0.25; animation: scan 10s linear infinite; pointer-events: none; z-index: 999; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .header { padding: 16px 28px; background: rgba(10,0,20,0.95); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
        .back-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: transparent;
            color: var(--house-accent); cursor: pointer; border-radius: 6px; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { background: rgba(147,51,234,0.15); }
        .header-title { font-size: 0.95rem; color: var(--text); }
        .house-badge { margin-left: auto; font-size: 0.65rem; padding: 3px 10px;
            background: rgba(107,33,168,0.2); border: 1px solid var(--border); border-radius: 20px;
            color: var(--house-accent); letter-spacing: 0.1em; }

        .progress-wrap { padding: 14px 28px; background: rgba(10,0,20,0.7); }
        .progress-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--house-primary), var(--house-accent));
            border-radius: 4px; transition: width 0.4s ease; }

        .container { max-width: 820px; margin: 0 auto; padding: 36px 24px; }

        .intro { text-align: center; padding: 40px 20px; }
        .intro-icon { font-size: 2.8rem; margin-bottom: 14px; }
        .intro-title { font-size: 1.8rem; font-weight: 300; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, var(--house-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .intro-sub { color: var(--muted); margin-bottom: 24px; line-height: 1.6; font-size: 0.9rem; }
        .stats-row { display: flex; justify-content: center; gap: 36px; margin-bottom: 28px; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--house-accent); }
        .stat-lbl { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; }

        .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 26px; margin-bottom: 20px; }
        .q-meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--house-accent);
            margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .q-text { font-size: 1rem; line-height: 1.6; margin-bottom: 18px; color: var(--text); }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
            background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 7px; cursor: pointer; transition: all 0.18s; }
        .opt:hover:not(.locked) { border-color: rgba(147,51,234,0.5); background: rgba(147,51,234,0.07); }
        .opt.selected { border-color: var(--house-accent); background: rgba(147,51,234,0.12); }
        .opt.correct { border-color: var(--correct); background: rgba(0,255,65,0.07); }
        .opt.wrong { border-color: var(--incorrect); background: rgba(239,68,68,0.08); }
        .opt.locked { cursor: default; }
        .opt-radio { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; accent-color: var(--house-accent); }
        .opt-label { font-size: 0.88rem; line-height: 1.5; color: var(--muted); }
        .opt.selected .opt-label, .opt.correct .opt-label, .opt.wrong .opt-label { color: var(--text); }

        .feedback { display: none; margin-top: 14px; padding: 12px 16px;
            border-left: 3px solid var(--info); background: rgba(56,189,248,0.07); border-radius: 6px; }
        .feedback.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .feedback-verdict { font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; }
        .feedback-verdict.ok { color: var(--correct); }
        .feedback-verdict.bad { color: var(--incorrect); }
        .feedback-txt { font-size: 0.82rem; color: var(--muted); line-height: 1.55; }

        .nav-row { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
        .btn { padding: 10px 24px; border: none; border-radius: 7px; font-size: 0.88rem;
            font-family: 'Courier New', monospace; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--house-primary), var(--house-accent)); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(107,33,168,0.5); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(22,163,74,0.4); }

        .results { display: none; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 40px; text-align: center; }
        .results.show { display: block; animation: fadeIn 0.5s ease; }
        .r-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .r-title { font-size: 1.6rem; margin-bottom: 10px; }
        .r-score { font-size: 3rem; font-weight: 700; margin: 16px 0; }
        .r-score.pass { color: var(--correct); }
        .r-score.fail { color: var(--incorrect); }
        .r-msg { color: var(--muted); font-size: 0.88rem; line-height: 1.7; margin-bottom: 24px; }
        .r-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin: 20px 0; }
        .r-cell { background: rgba(0,0,0,0.3); border-radius: 7px; padding: 16px; }
        .r-val { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .r-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

        @media (max-width: 640px) { .stats-row { gap: 18px; } .r-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="header">
    <a class="back-btn" href="../index.html">&#8592;</a>
    <span class="header-title">FEH-08: Social Engineering</span>
    <span class="house-badge">DARK ARTS</span>
</header>

<div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-label" id="progress-label">Question 1 of 15</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="container">
    <div id="intro" class="intro">
        <div class="intro-icon">&#x1F3AD;</div>
        <h2 class="intro-title">Social Engineering</h2>
        <p class="intro-sub">Phishing variants, pretexting, physical attacks, psychological principles, and security awareness.<br>
            The human OS is the most exploited attack surface.</p>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-val">15</div><div class="stat-lbl">QUESTIONS</div></div>
            <div class="stat-box"><div class="stat-val">70%</div><div class="stat-lbl">PASSING</div></div>
            <div class="stat-box"><div class="stat-val">~15m</div><div class="stat-lbl">DURATION</div></div>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">[ INITIALIZE QUIZ ]</button>
    </div>

    <div id="quiz-area" style="display:none"></div>
    <div id="nav-row" class="nav-row" style="display:none">
        <button class="btn btn-secondary" id="prev-btn" onclick="goTo(state.idx - 1)">&#8592; Prev</button>
        <button class="btn btn-primary"   id="next-btn" onclick="advanceOrSubmit()">Next &#8594;</button>
    </div>

    <div class="results" id="results">
        <div class="r-icon" id="r-icon"></div>
        <div class="r-title" id="r-title"></div>
        <div class="r-score" id="r-score"></div>
        <div class="r-msg" id="r-msg"></div>
        <div class="r-grid">
            <div class="r-cell"><div class="r-val" id="r-correct" style="color:var(--correct)"></div><div class="r-lbl">Correct</div></div>
            <div class="r-cell"><div class="r-val" id="r-wrong" style="color:var(--incorrect)"></div><div class="r-lbl">Incorrect</div></div>
            <div class="r-cell"><div class="r-val" id="r-total" style="color:var(--house-accent)">15</div><div class="r-lbl">Total</div></div>
        </div>
        <div class="nav-row">
            <button class="btn btn-secondary" onclick="reviewMode()">Review Answers</button>
            <button class="btn btn-primary" onclick="location.href='../index.html'">Return to House</button>
        </div>
    </div>
</div>

<script>
const RAW_QUESTIONS = [
    { q: "Spear phishing differs from generic phishing primarily because:",
      opts: ["Spear phishing uses malware attachments; generic phishing uses only links","Spear phishing is highly targeted using personalized information about the victim; generic phishing is mass-sent with generic lures","Spear phishing targets C-suite executives only","Spear phishing occurs via phone calls rather than email"],
      ans: 1, exp: "Spear phishing uses OSINT to craft believable, personalized lures referencing the victim's name, employer, colleagues, or recent activity. This dramatically increases success rates. Generic phishing is volume-based with no personalization." },
    { q: "A 'whaling' attack is best described as:",
      opts: ["A phishing campaign targeting thousands of users simultaneously","A spear phishing attack specifically targeting high-value executives (C-suite, VPs, board members)","A phishing attack delivered via SMS","A watering hole attack on financial websites"],
      ans: 1, exp: "Whaling targets 'big fish' — CEOs, CFOs, legal counsel. These targets have elevated access and authority. Successful whaling attacks often lead to wire transfer fraud (Business Email Compromise) and data breaches affecting the entire organization." },
    { q: "Vishing attacks are conducted via:",
      opts: ["Malicious email attachments","Voice calls — attackers impersonate IT support, banks, or government agencies to extract information","SMS text messages","Fake QR codes at physical locations"],
      ans: 1, exp: "Vishing (Voice phishing) exploits trust in phone communication. Attackers impersonate IT helpdesks, IRS agents, or bank fraud departments. They use urgency, authority, and fear to coerce victims into revealing credentials or making wire transfers." },
    { q: "Smishing attacks target victims through:",
      opts: ["Compromised social media accounts","SMS text messages containing malicious links or requests","Fake software update prompts","Email with homoglyph domain spoofing"],
      ans: 1, exp: "Smishing (SMS phishing) exploits the high open rate of text messages (98% vs email's 20%). Attackers send fake package delivery alerts, bank fraud warnings, or prize notifications with malicious URLs. Mobile browsers also obscure full URLs, aiding deception." },
    { q: "In social engineering, pretexting involves:",
      opts: ["Sending malware before making contact to weaken defenses","Creating a fabricated scenario (pretext) to establish false trust and manipulate the target into revealing information","Physically following an authorized person through a secured door","Leaving infected USB drives in parking lots"],
      ans: 1, exp: "Pretexting creates a believable backstory — an attacker might claim to be an IT auditor, a new employee, or a vendor. The pretext establishes legitimacy before requesting sensitive information. It's the foundation of most social engineering attacks." },
    { q: "A baiting attack most closely resembles which scenario?",
      opts: ["Sending urgent emails claiming the victim's account will be suspended","Leaving malware-infected USB drives in locations where targets will find and use them","Calling a help desk while impersonating an employee","Observing a victim entering credentials from a distance"],
      ans: 1, exp: "Baiting exploits curiosity. Infected USB drives labeled 'Employee Salaries Q4' or 'Confidential' are left in parking lots. Studies show 45-98% of found USB drives are plugged in. Once inserted, the device executes the payload. Defense: disable AutoRun and prohibit unauthorized USB use." },
    { q: "Tailgating and piggybacking differ in that:",
      opts: ["Tailgating is digital; piggybacking is physical","In tailgating the attacker follows without the victim's knowledge; in piggybacking the victim knowingly holds the door (social pressure)","Piggybacking requires a fake badge; tailgating does not","They are identical — the terms are fully interchangeable"],
      ans: 1, exp: "Tailgating: the attacker physically follows behind an authorized person through a secured door, often unnoticed. Piggybacking: the authorized person is aware but complies due to social pressure ('Can you hold the door? My hands are full'). Both bypass physical access controls." },
    { q: "A watering hole attack compromises:",
      opts: ["Public water utility SCADA systems","Websites frequently visited by the target group, infecting visitors with malware when they visit","Email servers handling high volumes of corporate mail","Physical water stations in office buildings to plant surveillance devices"],
      ans: 1, exp: "Watering hole attacks identify industry-specific websites (trade forums, vendor portals) the target group frequently visits, compromise them with drive-by download exploits, and wait for victims to arrive. APT groups use this for targeted industry attacks where spear phishing is too risky." },
    { q: "Shoulder surfing in a cybersecurity context refers to:",
      opts: ["Analyzing network traffic by positioning near the target organization","Directly observing a person's screen, keyboard, or PIN pad to steal credentials or sensitive information","Riding a target's shoulder in a social platform to gather OSINT","Monitoring shoulder-mounted cameras for physical security"],
      ans: 1, exp: "Shoulder surfing is low-tech observation — watching someone enter a PIN at an ATM, type credentials at a coffee shop, or review sensitive documents on a train. It requires no technical tools. Defense: privacy screens, awareness, and shielding entry with your body." },
    { q: "Dumpster diving as a social engineering tactic involves:",
      opts: ["Exploiting SQL injection in web applications","Searching through an organization's discarded materials (trash, recycling) for sensitive information","Installing keyloggers on shared workstations","Brute-forcing discarded default passwords"],
      ans: 1, exp: "Dumpster diving recovers printed documents, discarded hard drives, organizational charts, and access badges from trash. In many jurisdictions it's legal once trash is in a public area. Defense: cross-cut shredding, degaussing/destroying storage media, and a formal media disposal policy." },
    { q: "A quid pro quo attack offers:",
      opts: ["Financial compensation for system access during penetration tests","Something of perceived value (IT help, prizes, gift cards) in exchange for information or access","Legal immunity in exchange for whistleblowing","Physical gifts delivered to executives to gain building access"],
      ans: 1, exp: "Quid pro quo ('this for that') offers a service or benefit in exchange for credentials or access. Classic example: attackers call random employees claiming to be IT support offering to fix an issue — in exchange they request login credentials. Defense: verify IT requests through official channels." },
    { q: "KnowBe4-style security awareness training programs primarily measure effectiveness through:",
      opts: ["Annual mandatory video completion rates","Simulated phishing campaigns that track click rates, credential submission, and reporting rates over time","Quarterly written examinations on security policy","Network monitoring for insider threat behaviors"],
      ans: 1, exp: "Simulated phishing campaigns send realistic fake phishing emails to employees. Organizations track who clicks, who submits credentials, and who reports. Repeat offenders receive targeted training. This behavioral, measurable approach outperforms passive video training." },
    { q: "Social proof as a social engineering principle exploits:",
      opts: ["Authority figures in the organization to compel compliance","The human tendency to follow the actions of others — 'everyone else is doing this, so it must be legitimate'","The victim's desire for physical proof of identity","Legal proof requirements in corporate environments"],
      ans: 1, exp: "Robert Cialdini's social proof principle: humans look to others' behavior in uncertain situations. Attackers use it by claiming 'Everyone in accounting uses this portal' or 'Your colleague just verified their account.' Fake reviews, testimonials, and fabricated consensus exploit this bias." },
    { q: "Which physical security control is most directly designed to prevent tailgating?",
      opts: ["CCTV cameras at all entry points","Mantrap (airlock vestibule) — a small room requiring one door to close before the next opens, allowing only one person at a time","Biometric fingerprint readers at external doors","Security guards issuing visitor badges"],
      ans: 1, exp: "A mantrap (airlock, security vestibule) physically enforces one-person-at-a-time access. The outer door must close and lock before the inner door can open. Often combined with weight sensors or cameras. It's the most robust hardware countermeasure against tailgating." },
    { q: "An attacker researches a target executive's LinkedIn, recent conference talks, and published interviews before calling their assistant. This technique is called:",
      opts: ["Vishing with random target selection","OSINT-enhanced pretexting — using open-source intelligence to build a convincing backstory for social engineering","Spear phishing via voice channel","Cold calling with authority exploitation"],
      ans: 1, exp: "Combining OSINT (LinkedIn, Twitter/X, conference programs, company press releases) with pretexting creates highly convincing scenarios. The attacker can reference real projects, names, and events, dramatically increasing credibility. This is the foundation of Business Email Compromise (BEC) and executive fraud attacks." }
];

const state = { questions: [], answers: [], answered: [], idx: 0, submitted: false };

function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }

function startQuiz() {
    state.questions = shuffle(RAW_QUESTIONS).map(q => {
        const indices = shuffle([0,1,2,3]);
        return { q: q.q, opts: indices.map(i => q.opts[i]), ans: indices.indexOf(q.ans), exp: q.exp };
    });
    state.answers = new Array(15).fill(null);
    state.answered = new Array(15).fill(false);
    state.idx = 0; state.submitted = false;
    document.getElementById('intro').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'block';
    document.getElementById('nav-row').style.display = 'flex';
    render();
}

function render() {
    const q = state.questions[state.idx];
    const locked = state.answered[state.idx] || state.submitted;
    updateProgress();
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('quiz-area').innerHTML = `
        <div class="q-card">
            <div class="q-meta"><span>QUESTION ${state.idx+1} / 15</span><span>1 POINT</span></div>
            <div class="q-text">${q.q}</div>
            <div class="options">
                ${q.opts.map((o,i) => {
                    let cls = 'opt';
                    if (locked) { cls+=' locked'; if(i===q.ans) cls+=' correct'; else if(i===state.answers[state.idx]&&i!==q.ans) cls+=' wrong'; }
                    else if (state.answers[state.idx]===i) cls+=' selected';
                    return `<div class="${cls}" onclick="pick(${i})">
                        <input class="opt-radio" type="radio" name="q${state.idx}" ${state.answers[state.idx]===i?'checked':''} ${locked?'disabled':''}>
                        <span class="opt-label">${o}</span></div>`;
                }).join('')}
            </div>
            <div class="feedback ${locked?'show':''}">
                <div class="feedback-verdict ${state.answers[state.idx]===q.ans?'ok':'bad'}">${state.answers[state.idx]===q.ans?'CORRECT':'INCORRECT'}</div>
                <div class="feedback-txt">${q.exp}</div>
            </div>
        </div>`;
    updateNav();
}

function pick(i) { if(state.answered[state.idx]||state.submitted) return; state.answers[state.idx]=i; state.answered[state.idx]=true; render(); }
function updateProgress() { document.getElementById('progress-fill').style.width=((state.idx+1)/15*100)+'%'; document.getElementById('progress-label').textContent=`Question ${state.idx+1} of 15`; }
function updateNav() {
    document.getElementById('prev-btn').style.visibility=state.idx===0?'hidden':'visible';
    const nb=document.getElementById('next-btn');
    if(state.idx===14){nb.textContent='[ SUBMIT QUIZ ]';nb.classList.remove('btn-primary');nb.classList.add('btn-green');}
    else{nb.textContent='Next \u2192';nb.classList.remove('btn-green');nb.classList.add('btn-primary');}
}
function goTo(i){if(i<0||i>14)return;state.idx=i;render();}
function advanceOrSubmit(){if(state.idx<14)goTo(state.idx+1);else submitQuiz();}

function submitQuiz() {
    const unanswered=state.answers.filter(a=>a===null).length;
    if(unanswered>0&&!confirm(`${unanswered} unanswered question(s). Submit anyway?`))return;
    state.submitted=true;
    const correct=state.answers.filter((a,i)=>a===state.questions[i].ans).length;
    const pct=Math.round((correct/15)*100);
    const passed=pct>=70;
    document.getElementById('quiz-area').style.display='none';
    document.getElementById('nav-row').style.display='none';
    document.getElementById('progress-wrap').style.display='none';
    document.getElementById('r-icon').textContent=passed?'\uD83C\uDFC6':'\uD83D\uDCDA';
    document.getElementById('r-title').textContent=passed?'ACCESS GRANTED':'AUTHENTICATION FAILED';
    const sc=document.getElementById('r-score');
    sc.textContent=pct+'%';sc.className='r-score '+(passed?'pass':'fail');
    document.getElementById('r-msg').innerHTML=passed
        ?`You answered <strong>${correct}</strong> of 15 correctly. Social engineering awareness confirmed.`
        :`You answered <strong>${correct}</strong> of 15 correctly. The human vector requires more study.`;
    document.getElementById('r-correct').textContent=correct;
    document.getElementById('r-wrong').textContent=15-correct;
    document.getElementById('results').classList.add('show');
    if(passed) ModuleProgress.complete('dark-arts','dark-arts-feh-08',{returnUrl:'../index.html'});
}

function reviewMode(){
    document.getElementById('results').classList.remove('show');
    document.getElementById('quiz-area').style.display='block';
    document.getElementById('nav-row').style.display='flex';
    document.getElementById('progress-wrap').style.display='block';
    state.idx=0;render();
}
</script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
