<html lang="en">

    <meta charset="UTF-8">

    <title>FEH-04: Vulnerability Assessment Challenge - House of the Dark Arts</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1545 50%, #1a0a2e 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #9b59d033;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #9b59d0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>
        <span class="brand"><span>&#9760;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-04: Vulnerability Assessment Challenge',
            description: 'Test your knowledge of feh-04: vulnerability assessment',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-04',
            moduleId: 'feh-04',
            serverGrading: true,
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the correct format for a CVE identifier?',
                    options: [
                        'CVE-VENDOR-YEAR-SEQUENCE',
                        'CVE-YEAR-SEQUENCE_NUMBER',
                        'CVE-YEAR-ARBITRARYNUMBER',
                        'CVSS-YEAR-ID'
                    ],explanation: 'CVE identifiers follow the format CVE-YEAR-NUMBER (e.g., CVE-2021-44228 for Log4Shell). The year indicates when the CVE was reserved or assigned, not necessarily when the vulnerability was discovered. Numbers can exceed 4 digits for high-volume years.'
                },
                {
                    question: 'CVSS v3.1 scores range from 0.0 to 10.0. A score of 9.8 would be classified as:',
                    options: [
                        'High',
                        'Medium',
                        'Critical',
                        'Low'
                    ],explanation: 'CVSS v3.1 severity ratings: None (0.0), Low (0.1-3.9), Medium (4.0-6.9), High (7.0-8.9), Critical (9.0-10.0). A 9.8 — like Log4Shell — is Critical. This rating system helps organizations prioritize patching.'
                },
                {
                    question: 'Which CVSS v3.1 metric group accounts for how a vulnerability might be mitigated by compensating controls in your specific environment?',
                    options: [
                        'Base Score',
                        'Temporal Score',
                        'Environmental Score',
                        'Exploitability Score'
                    ],explanation: 'The Environmental Score allows organizations to adjust the Base Score based on their specific environment — the presence of compensating controls, asset criticality (CIA requirements), and scope. This produces an organization-specific risk score rather than a universal one.'
                },
                {
                    question: 'The National Vulnerability Database (NVD) is maintained by which organization?',
                    options: [
                        'MITRE Corporation',
                        'CISA',
                        'NIST (National Institute of Standards and Technology)',
                        'The SANS Institute'
                    ],explanation: 'NIST maintains the NVD, which enriches CVE entries with CVSS scores, CWE classifications, CPE applicability, and fix information. MITRE maintains the CVE List itself — NVD and CVE are complementary but separate resources.'
                },
                {
                    question: 'Exploit-DB (exploit-db.com) is best described as:',
                    options: [
                        'A real-time feed of active cyberattacks',
                        'An archive of public exploits, shellcode, and vulnerable software for research and testing',
                        'A commercial vulnerability scanner',
                        'A government-operated patch distribution system'
                    ],explanation: 'Exploit-DB is maintained by Offensive Security and archives proof-of-concept exploit code, shellcode, and vulnerability papers. It\'s a legitimate research resource used by pentesters to find working exploits for discovered CVEs — and by defenders to understand what attackers may use.'
                },
                {
                    question: 'A vulnerability scanner reports a finding on a port that is actually closed and not running the service flagged. This is an example of:',
                    options: [
                        'A false negative',
                        'A true positive',
                        'A false positive',
                        'A zero-day'
                    ],explanation: 'A false positive is a reported finding that doesn\'t actually exist in the environment. Scanners generate false positives due to banner misidentification, version string spoofing, or overly aggressive matching logic. All scanner findings require manual validation before reporting.'
                },
                {
                    question: 'A false negative in vulnerability scanning means:',
                    options: [
                        'A vulnerability is reported that doesn\'t exist',
                        'A vulnerability exists but the scanner failed to detect it',
                        'A patch was applied but the scanner still flags it',
                        'The scanner crashed before completing'
                    ],explanation: 'False negatives are missed vulnerabilities — the scanner didn\'t detect a real weakness. This is dangerous because it creates false confidence. Causes include scan scope limitations, authenticated vs. unauthenticated scan differences, and novel vulnerability types not in the scanner\'s signature database.'
                },
                {
                    question: 'Which of the following best describes the \'vulnerability lifecycle\'?',
                    options: [
                        'The time it takes to write and deploy an exploit',
                        'Discovery → Disclosure → Patch Release → Deployment → Verification',
                        'Installation → Scanning → Reporting → Remediation',
                        'Reconnaissance → Exploitation → Post-exploitation → Cleanup'
                    ],explanation: 'The vulnerability lifecycle: a researcher discovers a flaw, it\'s disclosed (coordinated or full), the vendor releases a patch, organizations deploy patches, and validation confirms remediation. The \'window of exposure\' between discovery and patching is when risk is highest.'
                },
                {
                    question: 'Nessus is categorized as which type of security tool?',
                    options: [
                        'Network packet analyzer',
                        'Vulnerability scanner',
                        'Exploit framework',
                        'Web application firewall'
                    ],explanation: 'Nessus (by Tenable) is a commercial vulnerability scanner that actively probes systems for known vulnerabilities, misconfigurations, and compliance issues. It uses plugins (updated regularly) to check against CVE databases and configuration benchmarks like CIS.'
                },
                {
                    question: 'OpenVAS differs from Nessus primarily in that OpenVAS is:',
                    options: [
                        'A more expensive enterprise solution',
                        'An open-source vulnerability scanning framework',
                        'A web application scanner only',
                        'A network intrusion detection system'
                    ],explanation: 'OpenVAS (Open Vulnerability Assessment Scanner) is the open-source fork of the original Nessus codebase. It\'s maintained by Greenbone Networks as part of the Greenbone Vulnerability Management (GVM) framework. Both use plugin-based scanning against CVE databases.'
                },
                {
                    question: 'When prioritizing vulnerabilities for remediation, which factor combination should receive highest priority?',
                    options: [
                        'High CVSS score only',
                        'High CVSS score + public exploit available + asset is internet-facing and critical',
                        'Any vulnerability reported by an automated scanner',
                        'Vulnerabilities affecting the most number of hosts'
                    ],explanation: 'Effective risk prioritization considers: CVSS score, whether a public exploit exists (weaponized = immediate threat), asset criticality (production vs. dev), internet exposure, and business impact. A CVSS 9.8 on an isolated dev server is lower priority than a CVSS 7.0 on an internet-facing payment system.'
                },
                {
                    question: 'The CVSS v3.1 \'Attack Vector\' metric value of \'Network\' (AV:N) means:',
                    options: [
                        'The attacker must be on the same local network segment',
                        'The vulnerability is only exploitable with physical device access',
                        'The vulnerability can be exploited remotely over a network without requiring proximity',
                        'The attack requires a man-in-the-middle position'
                    ],explanation: 'AV:N (Network) means the vulnerable component is bound to the network stack and the attacker can exploit it remotely — the worst-case attack vector for exposure. Compare: Adjacent (AV:A) requires same network, Local (AV:L) requires local access, Physical (AV:P) requires physical touch.'
                },
                {
                    question: 'Which CVSS v3.1 base metric measures whether exploitation requires user interaction?',
                    options: [
                        'Attack Complexity',
                        'Privileges Required',
                        'User Interaction',
                        'Scope'
                    ],explanation: 'User Interaction (UI) has two values: None (UI:N) — no user action needed, exploitation is automatic — or Required (UI:R) — a human must take an action (click a link, open a file). UI:N is more dangerous and raises the CVSS score.'
                },
                {
                    question: 'A \'zero-day vulnerability\' is defined as:',
                    options: [
                        'A vulnerability with a CVSS score of 0.0',
                        'A vulnerability that has existed for zero days in the codebase',
                        'A vulnerability for which no vendor patch exists at the time of discovery or exploitation',
                        'A vulnerability that can only be exploited for 24 hours'
                    ],explanation: 'A zero-day is a vulnerability unknown to the vendor (or for which no patch exists). The term comes from \'zero days to patch\' — defenders have had no time to remediate. Zero-days are highly valuable: nation-states, criminal groups, and brokers pay millions for reliable ones.'
                },
                {
                    question: 'Patch management\'s primary goal in the context of vulnerability management is to:',
                    options: [
                        'Eliminate all vulnerabilities immediately upon discovery',
                        'Systematically apply vendor-released fixes to reduce the attack surface within acceptable risk timelines',
                        'Replace all hardware every three years',
                        'Prevent users from installing unauthorized software'
                    ],explanation: 'Patch management isn\'t about instant patching of everything — it\'s about systematic, risk-prioritized application of vendor fixes. Organizations define SLAs (e.g., Critical: 24-72 hours, High: 7 days, Medium: 30 days) balancing risk reduction against change management, testing, and operational stability.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
