<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>

    </header>
    <main class="quiz-wrapper">

    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-01: The Hacker Mindset Challenge',
            description: 'Test your knowledge of feh-01: the hacker mindset',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-01',
            moduleId: 'feh-01',
            serverGrading: true,
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'Which hacker category operates with explicit permission from system owners and follows legal boundaries at all times?',
                    options: [
                        'Black hat',
                        'Grey hat',
                        'White hat',
                        'Script kiddie'
                    ],explanation: 'White hat hackers (ethical hackers) always have documented authorization before testing. They operate within legal and contractual boundaries — the foundation of ethical hacking.'
                },
                {
                    question: 'A grey hat hacker differs from a black hat hacker primarily because the grey hat:',
                    options: [
                        'Uses more sophisticated tools',
                        'Hacks without permission but typically reports vulnerabilities afterward',
                        'Always works for government agencies',
                        'Never causes any damage'
                    ],explanation: 'Grey hats operate without explicit authorization (which is still illegal) but usually disclose what they find rather than exploit it for personal gain. The critical issue: lack of written permission makes their actions criminal regardless of intent.'
                },
                {
                    question: 'In the Cyber Kill Chain, which phase involves the attacker researching the target and gathering intelligence before any attack is launched?',
                    options: [
                        'Weaponization',
                        'Exploitation',
                        'Reconnaissance',
                        'Command & Control'
                    ],explanation: 'Reconnaissance is Phase 1 of the Kill Chain — the attacker collects information (OSINT, scanning, social engineering) to plan the attack. Understanding this phase helps defenders detect early attacker behavior.'
                },
                {
                    question: 'The Cyber Kill Chain Phase 2 (Weaponization) refers to:',
                    options: [
                        'Gaining administrator access to a system',
                        'Coupling malware with an exploit into a deliverable payload',
                        'Sending a phishing email to the target',
                        'Moving laterally across the internal network'
                    ],explanation: 'Weaponization occurs entirely off-network — the attacker builds the weapon (e.g., embeds shellcode into a PDF). Defenders rarely see this phase directly, making Delivery detection critical.'
                },
                {
                    question: 'Which Cyber Kill Chain phase occurs when a user opens a malicious attachment and the exploit code executes on their machine?',
                    options: [
                        'Delivery',
                        'Installation',
                        'Exploitation',
                        'Actions on Objectives'
                    ],explanation: 'Exploitation (Phase 4) is when the weapon triggers and code executes — typically by leveraging a software vulnerability, misconfig, or human action. This is the moment of compromise.'
                },
                {
                    question: 'MITRE ATT&CK differs from the Cyber Kill Chain primarily because ATT&CK:',
                    options: [
                        'Only covers network-based attacks',
                        'Provides a high-level 7-step model',
                        'Catalogs specific adversary techniques and sub-techniques with real-world examples',
                        'Was developed by the US military'
                    ],explanation: 'MITRE ATT&CK is a knowledge base of adversary tactics, techniques, and procedures (TTPs) mapped to real threat actors. It goes far deeper than Kill Chain\'s 7 phases — covering hundreds of specific techniques used in the wild.'
                },
                {
                    question: 'A penetration test Rules of Engagement (ROE) document would most likely specify:',
                    options: [
                        'The attacker\'s preferred programming language',
                        'Which systems are in-scope, testing hours, and emergency contacts',
                        'The client\'s internal password policy',
                        'A list of all known vulnerabilities in the target'
                    ],explanation: 'The ROE defines authorized scope, timing windows, emergency halt procedures, and communication protocols. It protects both the tester (legal cover) and the client (prevents unintended outages).'
                },
                {
                    question: 'What document defines the legal boundaries of an engagement and protects the penetration tester from criminal prosecution?',
                    options: [
                        'Non-Disclosure Agreement (NDA)',
                        'Statement of Work (SOW)',
                        'Written Authorization / Scope Document',
                        'Incident Response Plan'
                    ],explanation: 'Written authorization (scope document / letter of authorization) explicitly grants the tester permission to attack defined systems. Without it, identical technical actions constitute unauthorized computer access — a felony in most jurisdictions.'
                },
                {
                    question: 'During a pentest, a tester discovers an in-scope server is also hosting a critical production database not mentioned in the scope. The correct action is:',
                    options: [
                        'Exploit the database since it is on an in-scope host',
                        'Immediately halt testing and notify the client',
                        'Document it and continue with the original scope',
                        'Report it only in the final deliverable'
                    ],explanation: 'Scope creep — discovering systems outside authorization — requires immediate notification. Proceeding without updated written authorization creates criminal liability. Always pause and communicate before expanding scope.'
                },
                {
                    question: 'Which phase of a penetration test methodology involves analyzing results and delivering findings to the client?',
                    options: [
                        'Reconnaissance',
                        'Exploitation',
                        'Reporting',
                        'Post-exploitation'
                    ],explanation: 'Reporting is the final and arguably most important phase for the client. A pentest that isn\'t communicated clearly provides no business value. Reports typically include executive summary, technical findings, risk ratings, and remediation guidance.'
                },
                {
                    question: 'The primary legal basis that makes unauthorized computer access a federal crime in the United States is:',
                    options: [
                        'HIPAA',
                        'The Computer Fraud and Abuse Act (CFAA)',
                        'The Digital Millennium Copyright Act (DMCA)',
                        'SOX'
                    ],explanation: 'The CFAA (18 U.S.C. § 1030) is the primary US federal statute criminalizing unauthorized access to computers. This is why written authorization is non-negotiable — the CFAA has no \'good intent\' exception.'
                },
                {
                    question: 'A \'script kiddie\' is best characterized as:',
                    options: [
                        'A professional penetration tester who uses automated tools',
                        'An attacker who uses pre-written tools without understanding the underlying techniques',
                        'A developer who writes exploit code for research',
                        'A government-sponsored advanced persistent threat actor'
                    ],explanation: 'Script kiddies use tools written by others without understanding the underlying vulnerabilities or techniques. While technically less sophisticated, they can still cause significant damage using readily available exploit frameworks.'
                },
                {
                    question: 'In MITRE ATT&CK terminology, a \'Tactic\' represents:',
                    options: [
                        'A specific technical implementation of an attack',
                        'The adversary\'s technical goal or \'why\' behind a set of techniques',
                        'A named threat actor group',
                        'A defensive countermeasure'
                    ],explanation: 'Tactics in ATT&CK represent the adversary\'s objective (the \'why\') — e.g., Persistence, Privilege Escalation, Lateral Movement. Techniques describe \'how\' the tactic is achieved. This distinction helps defenders prioritize detection strategies.'
                },
                {
                    question: 'Which statement about black hat hackers is most accurate?',
                    options: [
                        'They operate with implied consent from system owners',
                        'They only target government systems',
                        'They exploit systems for personal gain, espionage, or malice without authorization',
                        'They always disclose vulnerabilities to vendors before publishing'
                    ],explanation: 'Black hat hackers operate without authorization and with malicious or self-serving intent — financial theft, espionage, sabotage, or vandalism. Their activities are criminal regardless of the technical sophistication involved.'
                },
                {
                    question: 'The MITRE ATT&CK framework\'s \'Actions on Objectives\' maps most closely to which Kill Chain phase?',
                    options: [
                        'Reconnaissance',
                        'Weaponization',
                        'Command and Control',
                        'Actions on Objectives — it maps directly as both models share this phase name'
                    ],explanation: 'Both models share the \'Actions on Objectives\' phase name. This phase represents the attacker achieving their ultimate goal — data exfiltration, ransomware deployment, destructive wiper execution, or persistent access establishment.'
                }
            ]
        });
        quiz.start();
    </script>
