<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>
        <span class="brand"><span>&#9760;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-09: Cryptography & Steganography Challenge',
            description: 'Test your knowledge of feh-09: cryptography & steganography',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-09',
            moduleId: 'feh-09',
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the fundamental difference between symmetric and asymmetric encryption?',
                    options: [
                        'Symmetric is quantum-resistant; asymmetric is not',
                        'Symmetric uses the same key to encrypt and decrypt; asymmetric uses a mathematically related key pair (public/private)',
                        'Symmetric is used only for hashing; asymmetric for encryption',
                        'Asymmetric is faster but less secure than symmetric'
                    ],
                    correct: 1,
                    explanation: 'Symmetric (AES, 3DES): one shared secret key — fast, used for bulk data. Asymmetric (RSA, ECC): public key encrypts, private key decrypts — slow, used for key exchange and signatures. TLS combines both: asymmetric for handshake, symmetric for session data.'
                },
                {
                    question: 'AES is preferred over DES in modern systems primarily because:',
                    options: [
                        'AES is patented and therefore legally safer to use',
                        'DES uses a 56-bit key that can be brute-forced in hours with modern hardware; AES uses 128/192/256-bit keys',
                        'AES operates in stream cipher mode which DES cannot',
                        'DES lacks block cipher modes while AES supports all modes'
                    ],
                    correct: 1,
                    explanation: 'DES\'s 56-bit key space (~7.2 x 10^16 combinations) was demonstrated breakable in 22 hours in 1999 (EFF DES Cracker). 3DES applies DES three times but is slow. AES (Rijndael) with 128+ bit keys remains computationally unbreakable by brute force today.'
                },
                {
                    question: 'Triple DES (3DES) applies DES encryption three times. Why does it not achieve 3x DES\'s key strength?',
                    options: [
                        'The third DES pass decrypts the output of the second pass, reducing effective security',
                        'Meet-in-the-middle attacks reduce 3DES\'s effective security to approximately 112 bits, not 168',
                        '3DES uses the same key for all three passes by default',
                        '3DES operates on 32-bit blocks instead of 64-bit blocks'
                    ],
                    correct: 1,
                    explanation: 'With three independent 56-bit keys (168 bits total), meet-in-the-middle attacks reduce effective security to ~112 bits. Standard 3DES (EDE: Encrypt-Decrypt-Encrypt) uses K1, K2, K3. When K1=K3, it degrades to 2-key 3DES (~80 bits). NIST deprecated 3DES in 2017.'
                },
                {
                    question: 'RSA encryption security relies on the computational difficulty of:',
                    options: [
                        'Solving discrete logarithm problems over elliptic curves',
                        'Factoring the product of two large prime numbers',
                        'Computing SHA-256 hashes in reverse',
                        'Solving the Travelling Salesman Problem'
                    ],
                    correct: 1,
                    explanation: 'RSA: n = p * q where p and q are large primes. The public key is (n, e); the private key is d (the modular inverse). Breaking RSA requires factoring n to find p and q — a problem with no known efficient classical algorithm for large n (2048+ bits).'
                },
                {
                    question: 'ECC (Elliptic Curve Cryptography) achieves equivalent security to RSA with:',
                    options: [
                        'Larger key sizes, making it more secure',
                        'Much smaller key sizes — a 256-bit ECC key is roughly equivalent to a 3072-bit RSA key',
                        'The same key sizes but faster operations',
                        'Larger key sizes but faster hardware support'
                    ],
                    correct: 1,
                    explanation: 'ECC\'s security is based on the Elliptic Curve Discrete Logarithm Problem (ECDLP), which is harder to solve than integer factorization. A 256-bit ECC key ≈ 3072-bit RSA key. Smaller keys mean faster operations and lower power consumption — critical for IoT and mobile.'
                },
                {
                    question: 'MD5 is considered cryptographically broken primarily because:',
                    options: [
                        'Its hash output (128 bits) is too short for modern storage',
                        'Collision attacks can be performed quickly — two different inputs can produce the same MD5 hash',
                        'It has been superseded by a faster algorithm',
                        'MD5 is symmetric, not a true hash function'
                    ],
                    correct: 1,
                    explanation: 'MD5 collision attacks were first demonstrated in 2004 (Wang et al.). By 2008, researchers created a rogue CA certificate using MD5 collisions. MD5 should never be used for integrity verification or digital signatures. Use SHA-256 or SHA-3 for security-critical hashing.'
                },
                {
                    question: 'A digital signature using RSA works by:',
                    options: [
                        'Encrypting the message with the recipient\'s public key',
                        'Hashing the message and encrypting the hash with the sender\'s private key; recipients verify by decrypting with the sender\'s public key',
                        'Hashing the message with a shared symmetric key',
                        'Encrypting both the message and hash with the sender\'s public key'
                    ],
                    correct: 1,
                    explanation: 'RSA signatures: sender computes H = hash(message), then signature S = H^d mod n (private key operation). Recipient computes H\' = S^e mod n (public key operation) and compares with hash(message). Only the private key holder can produce a valid signature.'
                },
                {
                    question: 'In a PKI (Public Key Infrastructure), what is the role of a Certificate Authority (CA)?',
                    options: [
                        'To store encrypted private keys for all users',
                        'To digitally sign public key certificates, binding identities to public keys and establishing a chain of trust',
                        'To manage symmetric key distribution between servers',
                        'To encrypt all web traffic passing through the network'
                    ],
                    correct: 1,
                    explanation: 'A CA signs X.509 certificates with its own private key, asserting that the public key within belongs to the named subject. Browsers and OSes ship with trusted root CA certificates. This chain of trust allows HTTPS without prior knowledge of server keys.'
                },
                {
                    question: 'During a TLS 1.3 handshake, what happens after the ClientHello message?',
                    options: [
                        'The server sends its private key to establish encryption',
                        'Both parties use the Server\'s public key and Diffie-Hellman key shares to derive session keys; all data after ServerHello is encrypted',
                        'The client and server negotiate which version of TLS to downgrade to',
                        'The server requests the client\'s private key for mutual authentication'
                    ],
                    correct: 1,
                    explanation: 'TLS 1.3 reduced the handshake to 1 RTT. The ServerHello includes a key share for ECDHE. Both sides independently derive the same symmetric session keys. ServerHello and beyond are encrypted immediately. TLS 1.3 removed RSA key exchange, requiring forward secrecy via ephemeral DH.'
                },
                {
                    question: 'LSB (Least Significant Bit) steganography conceals data by:',
                    options: [
                        'Replacing the most significant bits of pixel color values, drastically changing image appearance',
                        'Replacing the least significant bits of pixel values with message bits — changes are imperceptible to the human eye',
                        'Encoding data in image EXIF metadata fields',
                        'Compressing the carrier image and embedding data in the compression headers'
                    ],
                    correct: 1,
                    explanation: 'Each pixel\'s color value (0-255) has 8 bits. Changing the LSB changes the color by 1 unit — invisible to humans. A 1 MB image can hide ~128KB of data. Steganalysis tools like StegSolve or zsteg detect LSB steganography via statistical analysis of bit plane distributions.'
                },
                {
                    question: 'DCT (Discrete Cosine Transform) steganography is primarily used in:',
                    options: [
                        'PNG images by modifying color palette tables',
                        'JPEG images by modifying DCT coefficients in the frequency domain after compression',
                        'MP3 audio files by altering temporal frame headers',
                        'PDF documents by hiding data in unused object streams'
                    ],
                    correct: 1,
                    explanation: 'JPEG uses DCT to transform pixel blocks into frequency coefficients. DCT steganography (e.g., JSteg, OutGuess, F5) embeds data in DCT coefficients during or after compression. It\'s more robust than LSB since JPEG re-compression would destroy LSB-embedded data.'
                },
                {
                    question: 'The Diffie-Hellman key exchange allows two parties to:',
                    options: [
                        'Authenticate each other\'s identities before encryption',
                        'Establish a shared secret over an insecure channel without transmitting the secret itself',
                        'Share their private keys securely using RSA',
                        'Generate identical one-time pads from separate random seeds'
                    ],
                    correct: 1,
                    explanation: 'DH: Both agree on public parameters (prime p, generator g). Each generates a private key (a, b) and sends g^a mod p and g^b mod p. The shared secret is g^(ab) mod p, computable by both but not derivable by an eavesdropper who only sees g^a and g^b (discrete log problem).'
                },
                {
                    question: 'A birthday attack against a hash function exploits:',
                    options: [
                        'The attacker\'s knowledge of the plaintext to reverse the hash',
                        'The probability that two random inputs share the same hash output — significantly lower work than expected due to the birthday paradox',
                        'The cyclical nature of hash function output distributions',
                        'The use of the same hash for multiple files in the same directory'
                    ],
                    correct: 1,
                    explanation: 'The birthday paradox: finding a collision in a hash with n-bit output requires approximately 2^(n/2) operations, not 2^n. For MD5 (128-bit): ~2^64 operations; SHA-256: ~2^128. This is why SHA-1 (160-bit, 2^80 effective) was deprecated — demonstrated collisions (SHAttered, 2017).'
                },
                {
                    question: 'Rainbow table attacks precompute:',
                    options: [
                        'All possible hash outputs in a network topology diagram',
                        'Hash-to-plaintext chains allowing fast password hash reversal, defeated by using unique salts per password',
                        'A dictionary of common passwords with their encrypted forms',
                        'Statistical frequency tables of characters in hashed output'
                    ],
                    correct: 1,
                    explanation: 'Rainbow tables precompute chains of hash-then-reduce operations, creating compact lookup tables. Given a hash, an attacker looks up the chain endpoint to find the plaintext. Salting (prepending/appending random bytes per user) invalidates rainbow tables since each salt creates a unique hash space.'
                },
                {
                    question: 'Which attack against RSA is possible when the same message is encrypted with the same public key exponent e=3 for three different recipients?',
                    options: [
                        'Factorization attack using the repeated public key',
                        'Hastad\'s Broadcast Attack — using the Chinese Remainder Theorem to recover the plaintext without factoring any modulus',
                        'Padding oracle attack on RSA-OAEP implementations',
                        'Timing attack measuring decryption operation duration'
                    ],
                    correct: 1,
                    explanation: 'Hastad\'s Broadcast Attack: if m^3 < n1*n2*n3, CRT recovers m^3 directly from the three ciphertexts, then a cube root gives m. Defense: use randomized padding (OAEP) so even the same plaintext produces different ciphertexts, and use e=65537 instead of small exponents.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
