<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Dark Arts</a>
        <span class="brand"><span>&#9760;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-07: Network Attacks & Defense Challenge',
            description: 'Test your knowledge of feh-07: network attacks & defense',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-07',
            moduleId: 'feh-07',
            serverGrading: true,
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'Packet sniffing on a switched network is most effectively performed using which technique?',
                    options: [
                        'Port mirroring (SPAN port) or ARP poisoning',
                        'Plugging a hub into any switch port',
                        'Broadcasting ICMP packets across the subnet',
                        'Exploiting VLAN trunking directly'
                    ],explanation: 'Switches forward frames only to the destination port, so passive sniffing fails. Attackers use ARP poisoning to redirect traffic through their machine, or administrators use SPAN/mirror ports on managed switches for legitimate capture.'
                },
                {
                    question: 'ARP poisoning attacks exploit which fundamental design flaw in ARP?',
                    options: [
                        'ARP uses UDP which is unreliable',
                        'ARP has no authentication — any host can send gratuitous ARP replies claiming any IP-MAC mapping',
                        'ARP is encrypted with weak DES by default',
                        'ARP requests are broadcast only on IPv6 networks'
                    ],explanation: 'ARP is stateless and unauthenticated. Attackers send unsolicited (gratuitous) ARP replies associating their MAC with the gateway\'s IP. Hosts update their cache without verification, redirecting traffic through the attacker — a classic MITM setup.'
                },
                {
                    question: 'In a Man-in-the-Middle (MITM) attack over HTTPS, what technique allows the attacker to intercept encrypted traffic?',
                    options: [
                        'Breaking AES-256 encryption in real time',
                        'SSL stripping — downgrading HTTPS to HTTP, or presenting a forged certificate the victim accepts',
                        'Injecting JavaScript into HTTPS responses',
                        'Exploiting Diffie-Hellman key exchange weaknesses directly'
                    ],explanation: 'SSL stripping (Moxie Marlinspike, 2009) downgrades HTTPS to HTTP between the attacker and victim while maintaining HTTPS to the server. HSTS counters this. Alternatively, attackers present fake certificates — only accepted if the victim ignores browser warnings.'
                },
                {
                    question: 'DNS poisoning (cache poisoning) attacks target:',
                    options: [
                        'The authoritative DNS server\'s zone file',
                        'The resolver\'s cache, inserting forged DNS records to redirect users to attacker-controlled IPs',
                        'The victim\'s local hosts file',
                        'BGP route tables that affect DNS resolution'
                    ],explanation: 'DNS cache poisoning injects fraudulent records into a recursive resolver\'s cache. Because resolvers serve millions of users, a single poisoned entry can redirect all of them. The Kaminsky attack (2008) demonstrated high-speed cache poisoning via transaction ID guessing.'
                },
                {
                    question: 'What is the key difference between DNS poisoning and DNS spoofing?',
                    options: [
                        'DNS poisoning is on IPv6; DNS spoofing is on IPv4',
                        'DNS poisoning corrupts a resolver\'s cache affecting many users; DNS spoofing intercepts and forges individual query responses in transit',
                        'DNS spoofing requires physical network access; poisoning is remote',
                        'They are identical attacks with different names'
                    ],explanation: 'DNS spoofing typically refers to intercepting an individual DNS response and replacing it with a forged one (requires MITM position). DNS poisoning corrupts the resolver\'s persistent cache, creating widespread long-term redirection for all clients using that resolver.'
                },
                {
                    question: 'Session hijacking attacks succeed by:',
                    options: [
                        'Breaking the TLS session key through brute force',
                        'Stealing or predicting the session token to impersonate an authenticated user',
                        'Exploiting HTTP/2 multiplexing headers',
                        'Replaying Kerberos tickets on non-Windows systems'
                    ],explanation: 'Session tokens (cookies, URL parameters) represent authenticated state. Attackers steal them via XSS, network sniffing, or predict them if they\'re weakly generated. Once obtained, the attacker sends requests with the stolen token and the server treats them as the legitimate user.'
                },
                {
                    question: 'VLAN hopping via switch spoofing exploits:',
                    options: [
                        'Misconfigured ACLs on routed VLAN interfaces',
                        'A switch port left in dynamic trunking mode — an attacker\'s device negotiates a trunk and accesses all VLANs',
                        'Weak VLAN IDs that are easily guessable',
                        'ARP broadcasts that cross VLAN boundaries'
                    ],explanation: 'If a port is set to DTP auto/desirable, an attacker can send DTP negotiation frames and establish a trunk. Once trunking, they tag frames with any VLAN ID and access traffic across all VLANs. Defense: disable DTP, set unused ports to access mode, use a dedicated native VLAN.'
                },
                {
                    question: 'MAC flooding attacks are designed to:',
                    options: [
                        'Exhaust the switch\'s CAM (MAC address) table, forcing it to broadcast all frames like a hub',
                        'Spoof the gateway MAC to enable MITM attacks',
                        'Flood DHCP with fake MAC addresses to exhaust the IP pool',
                        'Disable 802.1X port authentication'
                    ],explanation: 'CAM table flooding sends thousands of frames with random source MACs. When the CAM table fills, the switch fails-open and broadcasts frames to all ports (acts as a hub), allowing passive sniffing. Port security with MAC address limits mitigates this.'
                },
                {
                    question: 'What distinguishes a DDoS attack from a DoS attack?',
                    options: [
                        'DDoS uses encrypted traffic; DoS uses plaintext',
                        'DDoS originates from multiple distributed sources (botnet) making attribution and blocking harder; DoS is from a single source',
                        'DDoS targets the application layer only; DoS targets the network layer',
                        'DDoS requires insider access; DoS is external'
                    ],explanation: 'A DoS attack from a single IP can be blocked with a firewall rule. DDoS coordinates thousands of compromised hosts (botnet) to overwhelm targets simultaneously from globally distributed IPs, making source-based blocking impractical.'
                },
                {
                    question: 'In a SYN flood attack, the attacker sends:',
                    options: [
                        'Malformed TCP segments that crash the server OS',
                        'Thousands of SYN packets with spoofed source IPs, exhausting server connection state (half-open connections)',
                        'ICMP PING packets at maximum bandwidth',
                        'UDP packets to all ports simultaneously'
                    ],explanation: 'TCP\'s three-way handshake requires servers to allocate resources for each SYN. A SYN flood sends SYN packets with forged source IPs — the server sends SYN-ACKs that never receive ACK responses. The backlog fills, denying service to legitimate clients. SYN cookies mitigate this.'
                },
                {
                    question: 'The primary functional difference between an IDS and an IPS is:',
                    options: [
                        'IDS works on encrypted traffic; IPS only works on plaintext',
                        'IDS detects and alerts on suspicious traffic; IPS can actively block or modify malicious traffic in real time',
                        'IDS is host-based only; IPS is network-based only',
                        'IPS requires human approval for each block; IDS blocks automatically'
                    ],explanation: 'An Intrusion Detection System (IDS) is passive — it monitors and alerts. An Intrusion Prevention System (IPS) is inline — it sits in the traffic path and can drop packets, reset connections, or block IPs automatically. IPS introduces latency risk but provides active defense.'
                },
                {
                    question: 'Firewall Access Control Lists (ACLs) filter traffic based on:',
                    options: [
                        'Deep packet inspection of Layer 7 application payloads only',
                        'Packet headers — source/destination IP, port, and protocol (stateless) or connection state (stateful)',
                        'DNS resolution results for each connection',
                        'Behavioral analysis of traffic patterns over time'
                    ],explanation: 'Standard ACLs filter on source IP. Extended ACLs add destination IP, port, and protocol. Stateless firewalls check each packet independently. Stateful firewalls track connection state tables, allowing return traffic automatically. Next-gen firewalls add L7 application awareness.'
                },
                {
                    question: 'DNSSEC prevents DNS cache poisoning by:',
                    options: [
                        'Encrypting DNS queries so attackers cannot read responses',
                        'Digitally signing DNS records with asymmetric cryptography so resolvers can verify authenticity',
                        'Rate-limiting DNS queries per client IP',
                        'Replacing UDP with TCP for all DNS communications'
                    ],explanation: 'DNSSEC adds digital signatures (RRSIG records) to DNS data. Resolvers with DNSSEC validation verify signatures against the zone\'s public key. A poisoned response without a valid signature is rejected. Note: DNSSEC authenticates but does NOT encrypt DNS queries.'
                },
                {
                    question: 'Which technique is most effective at detecting ARP poisoning on a network segment?',
                    options: [
                        'Monitoring for unusual DNS query volume',
                        'Dynamic ARP Inspection (DAI) on managed switches, which validates ARP packets against a DHCP snooping binding table',
                        'Configuring static routes on all routers',
                        'Running frequent ICMP sweeps across the subnet'
                    ],explanation: 'Dynamic ARP Inspection (DAI) intercepts all ARP packets on untrusted ports and validates them against the DHCP snooping binding table (IP-MAC-port mappings). Invalid ARP replies (from ARP poisoning) are dropped. It requires a managed switch that supports DHCP snooping.'
                },
                {
                    question: 'In a session hijacking attack, what makes httpOnly cookies more resistant than standard cookies?',
                    options: [
                        'httpOnly cookies are encrypted with server-side keys',
                        'httpOnly cookies cannot be accessed by JavaScript, preventing XSS-based theft — the attacker must intercept the cookie at the network level',
                        'httpOnly cookies expire after each request',
                        'httpOnly cookies contain a digital signature that servers verify'
                    ],explanation: 'The httpOnly flag prevents JavaScript from reading the cookie (document.cookie returns nothing). This stops XSS-based session hijacking. The attacker must instead intercept the cookie in transit (requires no TLS or MITM), which is why combining httpOnly with Secure and SameSite flags is the defense standard.'
                }
            ]
        });
        quiz.start();
    </script>
