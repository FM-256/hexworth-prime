        <a href="../offensive/ceh/index.html">&larr; Back to CEH v12 Track</a>

    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CEH-01: Reconnaissance & Footprinting',
            description: 'Test your knowledge of CEH v12 footprinting and reconnaissance techniques',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-ceh-01',
            moduleId: 'ceh-01',
            serverGrading: true,
            houseId: 'dark-arts',
            trackProgress: true,

            // Explicit, guaranteed completion write - see onComplete below.
            // (trackProgress above is kept for XP/quizHistory bonus bookkeeping,
            // but card-completion on the CEH track index reads the exact key
            // written by ModuleProgress.completeQuiz(), not ProgressManager's
            // internal dual-write, which uses a different key shape. See the
            // writer/reader convention comment in offensive/ceh/index.html.)
            onComplete: function(results) {
                if (typeof ModuleProgress !== 'undefined') {
                    ModuleProgress.completeQuiz('dark-arts', 'dark-arts-ceh-01-quiz', results.percentage, {
                        silent: true,
                        returnToDashboard: false,
                        passingScore: 70
                    });
                }
            },

            questions: [
                {
                    question: 'What is the primary goal of the footprinting and reconnaissance phase of an engagement?',
                    options: [
                        'Determine the size and scope of the target\'s attack surface',
                        'Exploit discovered vulnerabilities on production systems',
                        'Escalate privileges after initial access',
                        'Draft the final penetration test report'
                    ],
                    explanation: 'Footprinting establishes how big and how reachable the target is before any active testing begins. It rarely compromises a target directly, but it is the crucial setup step for social engineering, sensitive data exposure, and system or network hacking.'
                },
                {
                    question: 'Which of the following best distinguishes passive footprinting from active footprinting?',
                    options: [
                        'Passive footprinting requires direct interaction with the target; active footprinting does not',
                        'Passive footprinting gathers information without direct interaction with the target, making it difficult to detect',
                        'Active footprinting is always illegal; passive footprinting is always legal',
                        'Passive footprinting only works against cloud-hosted targets'
                    ],
                    explanation: 'Passive footprinting is comparable to eavesdropping - no direct interaction with the target, and difficult or impossible to detect. Active footprinting interacts directly with the target, more like interrogation, and detection is possible.'
                },
                {
                    question: 'A WHOIS lookup on a target domain returns only a reference to the domain\'s registrar WHOIS server, with no administrative, billing, or technical contact detail. This is characteristic of which WHOIS response model?',
                    options: [
                        'Full administrative, billing, and technical contact detail',
                        'A complete history of every past registrant since domain creation',
                        'Only the domain\'s registrar WHOIS server reference',
                        'The target\'s internal DNS zone file'
                    ],
                    explanation: 'This describes the Thin WHOIS model - the response contains only a pointer to the registrar\'s own WHOIS server rather than the full registrant/admin/technical contact set. The Thick model returns the complete detail.'
                },
                {
                    question: 'From an attacker\'s perspective, why is a successful DNS zone transfer valuable during footprinting?',
                    options: [
                        'It encrypts DNS traffic between resolvers',
                        'It registers a new subdomain under the target\'s domain',
                        'It bypasses WHOIS privacy protection on the domain',
                        'It pulls the full set of DNS records from a primary server to a secondary, mapping the target\'s entire network'
                    ],
                    explanation: 'A zone transfer (AXFR) is meant to legitimately sync a primary DNS server\'s records to its secondaries. When a misconfigured server answers a transfer request from anyone, it hands an attacker the complete hostname and IP map of the domain in a single request.'
                },
                {
                    question: 'Which Google search operator restricts results to pages within a single specified domain?',
                    options: [
                        'site:',
                        'axfr:',
                        'transform:',
                        'recon:'
                    ],
                    explanation: 'site: restricts a Google search to a single domain. Combined with other operators like filetype: or inurl:, it is one of the most useful Google dorking building blocks for footprinting a specific target.'
                },
                {
                    question: 'Shodan and Censys are best described as:',
                    options: [
                        'Password-cracking utilities bundled with Kali Linux',
                        'Search engines that index internet-connected devices and services, useful for footprinting deployed technologies and exposed infrastructure',
                        'DNS zone transfer clients',
                        'Social media OSINT aggregators only'
                    ],
                    explanation: 'Where Google indexes web pages, Shodan and Censys index the devices and services themselves - cameras, printers, industrial control systems, VoIP and VPN endpoints - searchable by filters like port, device type, or organization.'
                },
                {
                    question: 'Why does an ethical hacker enumerate a target\'s subdomains during footprinting?',
                    options: [
                        'Subdomains are the only DNS record type an attacker can legally query',
                        'Subdomains always contain the organization\'s WHOIS contact info',
                        'Subdomains are part of the organization\'s attack surface and may run separate, less-hardened applications',
                        'Subdomains replace the need for a zone transfer entirely'
                    ],
                    explanation: 'A subdomain like dev.target.com or vpn.target.com is a separate web presence, often run by a different team with different patching discipline. Each one discovered expands the mapped attack surface - via manual site: searches, page-source review, or automated tools like Netcraft and Sublist3r.'
                },
                {
                    question: 'A tester wants to find every social media platform where a specific username has been registered. Which tool is purpose-built for this?',
                    options: [
                        'FOCA',
                        'dnsrecon',
                        'Wappalyzer',
                        'Sherlock'
                    ],
                    explanation: 'Sherlock checks a given username across a large number of social platforms at once, making it the right tool for cross-platform username discovery. Social Searcher serves a related but distinct purpose - public social-media content search.'
                },
                {
                    question: 'Reading a target company\'s job postings during footprinting is useful primarily because postings often reveal:',
                    options: [
                        'Implemented technologies, organizational structure, and contact details the company didn\'t intend to expose this way',
                        'The organization\'s internal DNS zone file',
                        'Employee passwords in plaintext',
                        'The company\'s WHOIS registrar'
                    ],
                    explanation: 'To attract qualified candidates, job listings routinely name the exact vendor technologies in use ("5+ years administering Cisco ASA firewalls"), plus roles, locations, and contact info - none of which the company necessarily meant as public infrastructure disclosure.'
                },
                {
                    question: 'The "deep web" is best defined as:',
                    options: [
                        'Any website reachable only through the Tor browser',
                        'The part of the internet not indexed by standard search engines, such as paywalled content, webmail, or cloud storage',
                        'A synonym for the dark web',
                        'A search engine index maintained by Shodan'
                    ],
                    explanation: 'The deep web is simply content search engines don\'t index - banking portals, webmail, cloud storage, paywalled articles. It is distinct from the dark net (an intentionally anonymous, encrypted network layer like Tor) and the dark web (sites that live on that layer).'
                },
                {
                    question: 'A tester embeds a 1x1 image into a phishing-simulation email to learn when and where it is opened. This technique is called:',
                    options: [
                        'A trackable link',
                        'A read receipt',
                        'A tracking pixel',
                        'DNS poisoning'
                    ],
                    explanation: 'A tracking pixel is a tiny (often 1x1) image embedded in an email or page that phones home when loaded, revealing IP address, approximate geolocation, timing, and client details. Read receipts require the recipient to opt in; trackable links log clicks on a redirect URL instead.'
                },
                {
                    question: 'Retrieving discarded day calendars, sticky notes, and printouts from a target\'s trash to gather intelligence is an example of:',
                    options: [
                        'Shoulder surfing',
                        'Impersonation',
                        'Eavesdropping',
                        'Dumpster diving'
                    ],
                    explanation: 'Dumpster diving is literally searching discarded physical materials for useful information. It sits alongside eavesdropping (listening in on conversations), shoulder surfing (watching for entered credentials), and impersonation (posing as someone else) as social-engineering recon techniques.'
                },
                {
                    question: 'Which footprinting tool specializes in extracting metadata from documents published on a target\'s domain?',
                    options: [
                        'FOCA (Fingerprinting Organizations with Collected Archives)',
                        'Recon-Dog',
                        'Maltego',
                        'OSINT Framework'
                    ],
                    explanation: 'FOCA is purpose-built to pull metadata (author names, software versions, internal file paths) out of documents like PDFs and Office files published on a target\'s site. Maltego is a link-analysis graphing tool; OSINT Framework is a curated index of OSINT tools rather than a scanner itself.'
                },
                {
                    question: 'Which of the following is a recommended countermeasure against footprinting via job postings?',
                    options: [
                        'Publish the full internal network diagram alongside job openings',
                        'Sanitize job listings so they don\'t disclose specific internal technology names and versions',
                        'Disable WHOIS privacy protection so contact info is always current',
                        'Require zone transfers to be open to all secondary name servers'
                    ],
                    explanation: 'Sanitizing job listings (naming a technology category instead of an exact vendor and version) removes one of the easiest footprinting wins available to an attacker, without hurting the listing\'s usefulness to a real applicant.'
                },
                {
                    question: 'Opting into a WHOIS privacy service primarily protects an organization by:',
                    options: [
                        'Preventing all DNS resolution of the domain',
                        'Blocking Google from indexing the organization\'s website',
                        'Hiding the registrant\'s actual administrative, billing, and technical contact details behind the registrar',
                        'Disabling subdomain enumeration entirely'
                    ],
                    explanation: 'A WHOIS privacy service substitutes the registrar\'s own contact details for the registrant\'s real information in public WHOIS output - reducing what a footprinting attacker (or a spammer) can learn from a simple whois lookup, without affecting DNS resolution or search indexing.'
                }
            ]
        });
        quiz.start();
    </script>
