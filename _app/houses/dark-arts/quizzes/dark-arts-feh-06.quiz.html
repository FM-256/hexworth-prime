<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEH-06: Web Application Security — Dark Arts</title>
    <style>
        :root {
            --house-primary: #6b21a8; --house-accent: #9333ea;
            --correct: #00ff41; --incorrect: #ef4444; --info: #38bdf8;
            --bg: #0a0a0a; --card: rgba(15,5,25,0.85); --border: rgba(107,33,168,0.3);
            --text: #d4d4d8; --muted: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: var(--bg); font-family: 'Courier New', monospace; color: var(--text); }
        body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--house-accent), transparent);
            opacity: 0.25; animation: scan 10s linear infinite; pointer-events: none; z-index: 999; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .header { padding: 16px 28px; background: rgba(10,0,20,0.95); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
        .back-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: transparent;
            color: var(--house-accent); cursor: pointer; border-radius: 6px; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { background: rgba(147,51,234,0.15); }
        .header-title { font-size: 0.95rem; color: var(--text); }
        .house-badge { margin-left: auto; font-size: 0.65rem; padding: 3px 10px;
            background: rgba(107,33,168,0.2); border: 1px solid var(--border); border-radius: 20px;
            color: var(--house-accent); letter-spacing: 0.1em; }

        /* Progress bar */
        .progress-wrap { padding: 14px 28px; background: rgba(10,0,20,0.7); }
        .progress-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--house-primary), var(--house-accent));
            border-radius: 4px; transition: width 0.4s ease; }

        .container { max-width: 820px; margin: 0 auto; padding: 36px 24px; }

        /* Intro */
        .intro { text-align: center; padding: 40px 20px; }
        .intro-icon { font-size: 2.8rem; margin-bottom: 14px; }
        .intro-title { font-size: 1.8rem; font-weight: 300; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, var(--house-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .intro-sub { color: var(--muted); margin-bottom: 24px; line-height: 1.6; font-size: 0.9rem; }
        .stats-row { display: flex; justify-content: center; gap: 36px; margin-bottom: 28px; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--house-accent); }
        .stat-lbl { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; }

        /* Card */
        .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 26px; margin-bottom: 20px; }
        .q-meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--house-accent);
            margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .q-text { font-size: 1rem; line-height: 1.6; margin-bottom: 18px; color: var(--text); }

        /* Options */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
            background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 7px; cursor: pointer; transition: all 0.18s; }
        .opt:hover:not(.locked) { border-color: rgba(147,51,234,0.5); background: rgba(147,51,234,0.07); }
        .opt.selected { border-color: var(--house-accent); background: rgba(147,51,234,0.12); }
        .opt.correct { border-color: var(--correct); background: rgba(0,255,65,0.07); }
        .opt.wrong { border-color: var(--incorrect); background: rgba(239,68,68,0.08); }
        .opt.locked { cursor: default; }
        .opt-radio { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px;
            accent-color: var(--house-accent); cursor: pointer; }
        .opt-label { font-size: 0.88rem; line-height: 1.5; color: var(--muted); }
        .opt.selected .opt-label, .opt.correct .opt-label, .opt.wrong .opt-label { color: var(--text); }

        /* Feedback */
        .feedback { display: none; margin-top: 14px; padding: 12px 16px;
            border-left: 3px solid var(--info); background: rgba(56,189,248,0.07); border-radius: 6px; }
        .feedback.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .feedback-verdict { font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; }
        .feedback-verdict.ok { color: var(--correct); }
        .feedback-verdict.bad { color: var(--incorrect); }
        .feedback-txt { font-size: 0.82rem; color: var(--muted); line-height: 1.55; }

        /* Nav */
        .nav-row { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
        .btn { padding: 10px 24px; border: none; border-radius: 7px; font-size: 0.88rem;
            font-family: 'Courier New', monospace; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--house-primary), var(--house-accent)); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(107,33,168,0.5); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(22,163,74,0.4); }

        /* Results */
        .results { display: none; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 40px; text-align: center; }
        .results.show { display: block; animation: fadeIn 0.5s ease; }
        .r-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .r-title { font-size: 1.6rem; margin-bottom: 10px; }
        .r-score { font-size: 3rem; font-weight: 700; margin: 16px 0; }
        .r-score.pass { color: var(--correct); }
        .r-score.fail { color: var(--incorrect); }
        .r-msg { color: var(--muted); font-size: 0.88rem; line-height: 1.7; margin-bottom: 24px; }
        .r-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin: 20px 0; }
        .r-cell { background: rgba(0,0,0,0.3); border-radius: 7px; padding: 16px; }
        .r-val { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .r-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

        @media (max-width: 640px) {
            .stats-row { gap: 18px; }
            .r-grid { grid-template-columns: 1fr; }
            .nav-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<header class="header">
    <a class="back-btn" href="../index.html">&#8592;</a>
    <span class="header-title">FEH-06: Web Application Security</span>
    <span class="house-badge">DARK ARTS</span>
</header>

<div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-label" id="progress-label">Question 1 of 15</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="container">

    <!-- Intro -->
    <div id="intro" class="intro">
        <div class="intro-icon">&#x1F578;</div>
        <h2 class="intro-title">Web Application Security</h2>
        <p class="intro-sub">OWASP Top 10, injection attacks, XSS variants, Burp Suite, and more.<br>
            Answer immediately — feedback appears after each selection.</p>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-val">15</div><div class="stat-lbl">QUESTIONS</div></div>
            <div class="stat-box"><div class="stat-val">70%</div><div class="stat-lbl">PASSING</div></div>
            <div class="stat-box"><div class="stat-val">~15m</div><div class="stat-lbl">DURATION</div></div>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">[ INITIALIZE QUIZ ]</button>
    </div>

    <!-- Quiz -->
    <div id="quiz-area" style="display:none"></div>
    <div id="nav-row" class="nav-row" style="display:none">
        <button class="btn btn-secondary" id="prev-btn" onclick="goTo(state.idx - 1)">&#8592; Prev</button>
        <button class="btn btn-primary"   id="next-btn" onclick="advanceOrSubmit()">Next &#8594;</button>
    </div>

    <!-- Results -->
    <div class="results" id="results">
        <div class="r-icon" id="r-icon"></div>
        <div class="r-title" id="r-title"></div>
        <div class="r-score" id="r-score"></div>
        <div class="r-msg" id="r-msg"></div>
        <div class="r-grid">
            <div class="r-cell"><div class="r-val" id="r-correct" style="color:var(--correct)"></div><div class="r-lbl">Correct</div></div>
            <div class="r-cell"><div class="r-val" id="r-wrong" style="color:var(--incorrect)"></div><div class="r-lbl">Incorrect</div></div>
            <div class="r-cell"><div class="r-val" id="r-total" style="color:var(--house-accent)">15</div><div class="r-lbl">Total</div></div>
        </div>
        <div class="nav-row">
            <button class="btn btn-secondary" onclick="reviewMode()">Review Answers</button>
            <button class="btn btn-primary" onclick="location.href='../index.html'">Return to House</button>
        </div>
    </div>

</div>

<script>
const RAW_QUESTIONS = [
    { q: "Which OWASP Top 10 (2021) category covers flaws where an attacker can access data or functionality outside their intended authorization?",
      opts: ["Security Misconfiguration","Broken Access Control","Cryptographic Failures","Injection"],
      ans: 1, exp: "Broken Access Control (A01:2021) is the #1 category. It covers IDOR, privilege escalation, path traversal, and CORS misconfigurations — anywhere an attacker bypasses authorization checks." },
    { q: "In a UNION-based SQL injection attack, what must the injected SELECT statement satisfy?",
      opts: ["It must use the same table name","It must return the same number of columns with compatible types","It must include an ORDER BY clause","It must begin with a comment character"],
      ans: 1, exp: "UNION-based SQLi requires the injected SELECT to return the same number of columns as the original query, with compatible data types. Attackers first determine column count using ORDER BY or UNION SELECT NULL payloads." },
    { q: "A stored XSS attack differs from a reflected XSS attack in that:",
      opts: ["Stored XSS uses JavaScript while reflected uses HTML","Stored XSS persists in the database and executes for every visitor; reflected XSS is in a single response","Reflected XSS is server-side; stored XSS is client-side","Stored XSS cannot steal cookies"],
      ans: 1, exp: "Stored (persistent) XSS saves the malicious script in the backend (e.g., comment database) and serves it to every user who loads that page. Reflected XSS is embedded in a URL and only affects users tricked into clicking that link." },
    { q: "Which type of XSS does NOT require server interaction after initial page load?",
      opts: ["Reflected XSS","Stored XSS","DOM-based XSS","Blind XSS"],
      ans: 2, exp: "DOM-based XSS executes entirely in the browser. The payload is never sent to the server — it manipulates the DOM via client-side JavaScript reading attacker-controlled sources (e.g., location.hash, document.URL)." },
    { q: "What is the primary defense mechanism against CSRF attacks?",
      opts: ["Input validation on all form fields","Synchronizer tokens (CSRF tokens) unique per session or request","Using POST instead of GET for sensitive actions","Enabling HTTPS on the server"],
      ans: 1, exp: "CSRF tokens are unpredictable, session-tied values embedded in forms. The server validates the token on each state-changing request. An attacker's forged request from another origin cannot read the token (SOP), so it fails validation." },
    { q: "In a blind SQL injection attack, the attacker:",
      opts: ["Can directly see query error messages","Infers data by observing differences in application behavior or response time","Injects JavaScript into the query","Requires DBA-level access to execute"],
      ans: 1, exp: "Blind SQLi has no visible output. Boolean-based blind SQLi observes true/false behavior differences. Time-based blind SQLi uses SLEEP() or WAITFOR to infer data from response delays. Both are slower but equally dangerous." },
    { q: "Server-Side Request Forgery (SSRF) is dangerous primarily because it allows an attacker to:",
      opts: ["Forge user sessions on the server","Make the server send requests to internal resources on behalf of the attacker","Steal TLS certificates from the server","Execute JavaScript in the victim's browser"],
      ans: 1, exp: "SSRF makes the vulnerable server act as a proxy. Attackers can reach internal services (AWS metadata endpoint, Redis, internal APIs), cloud metadata at 169.254.169.254, and internal network segments unreachable from the internet." },
    { q: "Directory traversal (path traversal) attacks exploit:",
      opts: ["Weak directory indexing in Apache","Insufficient input validation allowing relative path sequences like ../ to escape intended directories","LDAP injection in directory services","Misconfigured DNS resolvers"],
      ans: 1, exp: "Path traversal exploits unchecked user input that includes ../ sequences to walk up the directory tree. For example, GET /download?file=../../etc/passwd. Defense: canonicalize paths and validate they remain within the allowed root." },
    { q: "Insecure deserialization can lead to which critical vulnerability class?",
      opts: ["XSS via serialized cookies","Remote Code Execution (RCE) when attacker-controlled objects are deserialized","SQL injection via object properties","SSRF through object constructors"],
      ans: 1, exp: "Deserializing attacker-controlled data can trigger gadget chains that execute arbitrary code. Java (.readObject()), PHP (unserialize()), and Python (pickle.loads()) are classic targets. Never deserialize untrusted data." },
    { q: "In Burp Suite, the Repeater tool is primarily used to:",
      opts: ["Automatically scan for vulnerabilities across a site","Manually replay and modify individual HTTP requests to test server behavior","Intercept and display all browser traffic","Brute-force login forms"],
      ans: 1, exp: "Repeater lets you take a captured request, modify any part of it (headers, body, parameters), resend it, and inspect the response. It's essential for manual testing of injection points, parameter tampering, and logic flaws." },
    { q: "An Insecure Direct Object Reference (IDOR) vulnerability occurs when:",
      opts: ["An attacker references server-internal object addresses in memory","Application exposes a direct reference to an internal object (user ID, filename) without authorization checks","An API returns object schemas that reveal database structure","JavaScript objects are stored insecurely in localStorage"],
      ans: 1, exp: "IDOR is a type of Broken Access Control. Example: changing /invoice?id=1001 to /invoice?id=1002 to view another user's invoice. Defense: check that the authenticated user owns or is authorized to access the referenced object." },
    { q: "HTTP Response Splitting attacks inject which characters to create fake server responses?",
      opts: ["Null bytes and NUL characters","CRLF sequences (\\r\\n) into HTTP headers","Unicode escape sequences","SQL comment characters (-- and #)"],
      ans: 1, exp: "HTTP Response Splitting injects CR (\\r) + LF (\\n) into header values to prematurely end the original response and inject a crafted second response. This enables cache poisoning, XSS, and session fixation. Sanitize all header injection points." },
    { q: "Which OWASP Top 10 (2021) category specifically covers logging and monitoring failures?",
      opts: ["A08 - Software and Data Integrity Failures","A09 - Security Logging and Monitoring Failures","A05 - Security Misconfiguration","A06 - Vulnerable and Outdated Components"],
      ans: 1, exp: "A09:2021 Security Logging and Monitoring Failures covers insufficient logging, lack of alerting on suspicious activity, and undetected breaches. OWASP notes that average breach detection time is over 200 days, largely due to monitoring gaps." },
    { q: "What does Burp Suite's Intruder tool enable that Repeater does not?",
      opts: ["Passive scanning of all site pages","Automated fuzzing with payload lists across multiple request positions","Decoding and encoding of session tokens","Mapping the full site structure"],
      ans: 1, exp: "Intruder automates parameter fuzzing. You mark injection positions and supply payloads (wordlists, numbers, custom). It then iterates all combinations and lets you analyze responses for anomalies — ideal for brute-force, SQLi, and XSS discovery." },
    { q: "Which Content Security Policy (CSP) directive most directly mitigates XSS attacks?",
      opts: ["Strict-Transport-Security","script-src 'self' (restricting script execution to same-origin sources)","X-Frame-Options DENY","Referrer-Policy no-referrer"],
      ans: 1, exp: "script-src controls which script sources the browser will execute. Setting script-src 'self' prevents inline scripts and external script loads from attacker-controlled domains, directly blocking most XSS vectors." }
];

const state = { questions: [], answers: [], answered: [], idx: 0, submitted: false };

function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }

function startQuiz() {
    // Shuffle questions and options
    state.questions = shuffle(RAW_QUESTIONS).map(q => {
        const indices = shuffle([0,1,2,3]);
        return {
            q: q.q,
            opts: indices.map(i => q.opts[i]),
            ans: indices.indexOf(q.ans),
            exp: q.exp
        };
    });
    state.answers = new Array(15).fill(null);
    state.answered = new Array(15).fill(false);
    state.idx = 0;
    state.submitted = false;
    document.getElementById('intro').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'block';
    document.getElementById('nav-row').style.display = 'flex';
    render();
}

function render() {
    const q = state.questions[state.idx];
    const locked = state.answered[state.idx] || state.submitted;
    updateProgress();
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('quiz-area').innerHTML = `
        <div class="q-card">
            <div class="q-meta"><span>QUESTION ${state.idx+1} / 15</span><span>1 POINT</span></div>
            <div class="q-text">${q.q}</div>
            <div class="options" id="opts">
                ${q.opts.map((o,i) => {
                    let cls = 'opt';
                    if (locked) {
                        cls += ' locked';
                        if (i === q.ans) cls += ' correct';
                        else if (i === state.answers[state.idx] && i !== q.ans) cls += ' wrong';
                    } else if (state.answers[state.idx] === i) cls += ' selected';
                    return `<div class="${cls}" onclick="pick(${i})">
                        <input class="opt-radio" type="radio" name="q${state.idx}" ${state.answers[state.idx]===i?'checked':''} ${locked?'disabled':''}>
                        <span class="opt-label">${o}</span>
                    </div>`;
                }).join('')}
            </div>
            <div class="feedback ${locked?'show':''}" id="feedback">
                <div class="feedback-verdict ${state.answers[state.idx]===q.ans?'ok':'bad'}">
                    ${state.answers[state.idx]===q.ans?'CORRECT':'INCORRECT'}
                </div>
                <div class="feedback-txt">${q.exp}</div>
            </div>
        </div>`;
    updateNav();
}

function pick(i) {
    if (state.answered[state.idx] || state.submitted) return;
    state.answers[state.idx] = i;
    state.answered[state.idx] = true;
    render();
}

function updateProgress() {
    const pct = ((state.idx + 1) / 15) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `Question ${state.idx+1} of 15`;
}

function updateNav() {
    document.getElementById('prev-btn').style.visibility = state.idx === 0 ? 'hidden' : 'visible';
    const nb = document.getElementById('next-btn');
    if (state.idx === 14) {
        nb.textContent = '[ SUBMIT QUIZ ]';
        nb.classList.remove('btn-primary');
        nb.classList.add('btn-green');
    } else {
        nb.textContent = 'Next \u2192';
        nb.classList.remove('btn-green');
        nb.classList.add('btn-primary');
    }
}

function goTo(i) {
    if (i < 0 || i > 14) return;
    state.idx = i;
    render();
}

function advanceOrSubmit() {
    if (state.idx < 14) { goTo(state.idx + 1); }
    else { submitQuiz(); }
}

function submitQuiz() {
    const unanswered = state.answers.filter(a => a === null).length;
    if (unanswered > 0 && !confirm(`${unanswered} unanswered question(s). Submit anyway?`)) return;
    state.submitted = true;
    const correct = state.answers.filter((a,i) => a === state.questions[i].ans).length;
    const pct = Math.round((correct / 15) * 100);
    const passed = pct >= 70;
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('nav-row').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('r-icon').textContent = passed ? '\uD83C\uDFC6' : '\uD83D\uDCDA';
    document.getElementById('r-title').textContent = passed ? 'ACCESS GRANTED' : 'AUTHENTICATION FAILED';
    const scoreEl = document.getElementById('r-score');
    scoreEl.textContent = pct + '%';
    scoreEl.className = 'r-score ' + (passed ? 'pass' : 'fail');
    document.getElementById('r-msg').innerHTML = passed
        ? `You answered <strong>${correct}</strong> of 15 correctly. Web app security concepts confirmed.`
        : `You answered <strong>${correct}</strong> of 15 correctly. Review OWASP Top 10 and retry.`;
    document.getElementById('r-correct').textContent = correct;
    document.getElementById('r-wrong').textContent = 15 - correct;
    document.getElementById('results').classList.add('show');
    if (passed) {
        ModuleProgress.complete('dark-arts', 'dark-arts-feh-06', { returnUrl: '../index.html' });
    }
}

function reviewMode() {
    document.getElementById('results').classList.remove('show');
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('nav-row').style.display = 'flex';
    document.getElementById('progress-wrap').style.display = 'block';
    state.idx = 0;
    render();
}
</script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
