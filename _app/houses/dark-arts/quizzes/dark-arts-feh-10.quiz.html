    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'FEH-10: Malware Analysis Basics Challenge',
            description: 'Test your knowledge of feh-10: malware analysis basics',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'dark-arts',
            achievement: 'dark-arts-feh-10',
            moduleId: 'feh-10',
            houseId: 'dark-arts',
            trackProgress: true,

            questions: [
                {
                    question: 'A computer worm differs from a virus in that:',
                    options: [
                        'A worm requires antivirus software to be disabled before spreading',
                        'A worm self-replicates and spreads across networks without requiring a host file or user interaction',
                        'A worm only infects Windows systems while viruses are cross-platform',
                        'A worm encrypts files; a virus corrupts them'
                    ],
                    correct: 1,
                    explanation: 'Viruses require a host file and user interaction (running the infected file) to spread. Worms self-propagate automatically by exploiting network vulnerabilities, email systems, or file shares. WannaCry used EternalBlue (SMB exploit) to spread as a worm across networks.'
                },
                {
                    question: 'A rootkit\'s primary goal after infection is to:',
                    options: [
                        'Encrypt all files and demand ransom from the victim',
                        'Maintain persistent, stealthy access by hiding its presence from the OS, antivirus, and administrators',
                        'Replicate itself to as many network hosts as possible',
                        'Exfiltrate credentials to a remote command-and-control server immediately'
                    ],
                    correct: 1,
                    explanation: 'Rootkits operate at ring 0 (kernel) or hypervisor level, intercepting OS calls to hide processes, files, registry keys, and network connections from security tools. A rootkit makes the OS lie about what\'s running. Detection requires out-of-band analysis (bootable media, hardware forensics).'
                },
                {
                    question: 'What distinguishes ransomware from other malware types?',
                    options: [
                        'Ransomware only targets government networks',
                        'Ransomware encrypts victim data or locks systems and demands payment (usually cryptocurrency) for the decryption key',
                        'Ransomware operates only in memory with no disk presence',
                        'Ransomware is always delivered via USB drives'
                    ],
                    correct: 1,
                    explanation: 'Ransomware monetizes access directly. Modern ransomware (Ryuk, LockBit, BlackCat) uses double extortion: encrypt data AND threaten to publish it. Ransomware-as-a-Service (RaaS) has democratized deployment. Offline backups and network segmentation are the primary defenses.'
                },
                {
                    question: 'Fileless malware evades traditional antivirus by:',
                    options: [
                        'Compressing itself with maximum compression to reduce signature footprint',
                        'Executing entirely in memory without writing to disk, using legitimate OS tools (PowerShell, WMI, LOLBins)',
                        'Encrypting its binary with a unique key per infection',
                        'Targeting only virtualized environments where AV cannot run'
                    ],
                    correct: 1,
                    explanation: 'Fileless malware (e.g., PowerSploit, Cobalt Strike in-memory) leaves no executable on disk, defeating file-based AV scanning. It hijacks legitimate processes (PowerShell, regsvr32, mshta) and runs shellcode from memory. Detection requires behavior-based EDR and memory forensics.'
                },
                {
                    question: 'In malware analysis, static analysis refers to:',
                    options: [
                        'Analyzing malware behavior while it executes in a controlled sandbox',
                        'Examining malware without executing it — inspecting the binary, strings, PE headers, imports, and disassembly',
                        'Monitoring network traffic generated by running malware',
                        'Comparing malware to known signatures in a threat intelligence database'
                    ],
                    correct: 1,
                    explanation: 'Static analysis: no execution. Analysts use tools like PEiD (packer detection), strings, IDA Pro/Ghidra (disassembly), PEview (PE header analysis), and VirusTotal. It\'s safe but time-consuming for obfuscated/packed samples. Dynamic analysis is the complement — running the sample observing behavior.'
                },
                {
                    question: 'Dynamic analysis of malware is performed by:',
                    options: [
                        'Disassembling the malware binary with IDA Pro and annotating functions',
                        'Executing the malware in an isolated sandbox and monitoring system calls, registry changes, network connections, and file activity',
                        'Submitting the file hash to VirusTotal for signature matching',
                        'Decompiling the malware source code for manual review'
                    ],
                    correct: 1,
                    explanation: 'Dynamic analysis executes the sample in a controlled environment (Cuckoo Sandbox, Any.run, FlareVM). Analysts capture API calls (ProcMon), network traffic (Wireshark), registry changes (RegShot), and file system modifications. It reveals runtime behavior even when static analysis is blocked by packing.'
                },
                {
                    question: 'A malware sandbox detects its environment and refuses to execute. This is called:',
                    options: [
                        'Privilege escalation — the malware requires admin rights to run',
                        'Sandbox evasion — the malware detects virtualization, user inactivity, or analysis tools and delays or alters behavior',
                        'Polymorphic behavior — the malware changes code to avoid detection',
                        'Lateral movement — the malware refuses to run without network access'
                    ],
                    correct: 1,
                    explanation: 'Sandbox evasion techniques: checking for VM artifacts (VMware registry keys, VirtualBox DLLs), mouse movement/idle time, sleep calls to outlast sandbox timeouts, detecting analysis tools (Wireshark, OllyDbg), and checking CPU core count. Advanced malware waits days before activating.'
                },
                {
                    question: 'Indicators of Compromise (IOCs) are used to:',
                    options: [
                        'Predict future attack vectors before they are exploited',
                        'Identify evidence of a breach — file hashes, IP addresses, domain names, registry keys, and behavioral patterns that indicate malware presence',
                        'Configure firewall rules to block known attacker IP ranges',
                        'Certify that a system has been verified clean after remediation'
                    ],
                    correct: 1,
                    explanation: 'IOCs are forensic artifacts indicating compromise: file hashes (MD5/SHA256), malicious IPs/domains (C2 servers), suspicious registry keys, unusual process names, and YARA rule matches. IOCs are shared via STIX/TAXII, ISACs, and threat intel platforms (VirusTotal, MISP). They identify past compromise, not predict future attacks.'
                },
                {
                    question: 'YARA rules are used in malware analysis to:',
                    options: [
                        'Automate sandbox submission and result retrieval',
                        'Define pattern-matching rules that identify malware samples based on strings, byte sequences, or behavioral characteristics',
                        'Generate random file hashes for anonymizing malware samples',
                        'Configure IDS signatures for network-based detection only'
                    ],
                    correct: 1,
                    explanation: 'YARA rules match files based on byte patterns, strings, and conditions. Example: a rule matching the PDB path string, specific API call sequences, or XOR-encoded C2 URLs. Tools like Loki, THOR, and yara-python scan file systems, memory dumps, and network captures against rule sets.'
                },
                {
                    question: 'The PE (Portable Executable) file format\'s Import Address Table (IAT) reveals what about a malware sample?',
                    options: [
                        'The malware\'s encryption keys for its payload',
                        'Which Windows API functions the malware calls — providing insight into capabilities (network, file, process injection, registry)',
                        'The list of files the malware will encrypt during execution',
                        'The malware author\'s digital signature and build environment'
                    ],
                    correct: 1,
                    explanation: 'The IAT lists DLLs and functions imported by the executable. Analysts look for suspicious imports: CreateRemoteThread/VirtualAllocEx (process injection), InternetOpenUrl/HttpSendRequest (C2), RegSetValueEx (persistence), CryptEncrypt (ransomware). Packed malware has minimal IAT — a red flag.'
                },
                {
                    question: 'The \'strings\' command during static malware analysis reveals:',
                    options: [
                        'The malware\'s disassembled assembly code',
                        'Printable ASCII/Unicode sequences embedded in the binary — potential C2 URLs, file paths, registry keys, error messages, and encryption keys',
                        'The complete list of API calls in execution order',
                        'The malware\'s cryptographic certificate and signing information'
                    ],
                    correct: 1,
                    explanation: 'strings extracts human-readable sequences (typically 4+ characters). Analysts find: hardcoded C2 domains/IPs, mutex names (for single-instance enforcement), file paths, registry keys, base64-encoded payloads, and error messages. Packed/obfuscated malware yields few meaningful strings — use after unpacking.'
                },
                {
                    question: 'Behavioral analysis of malware focuses on:',
                    options: [
                        'Reverse-engineering the malware source code from binary',
                        'Observing what the malware does when executed — file creation, registry modification, network connections, process spawning, and privilege escalation',
                        'Comparing the malware hash against the VirusTotal database',
                        'Identifying the programming language and compiler used to build the malware'
                    ],
                    correct: 1,
                    explanation: 'Behavioral analysis monitors runtime actions using ProcMon (process/file/registry), Wireshark (network), Process Hacker (process tree/memory), and Regshot (registry snapshots). It answers: where does it persist? What does it communicate? What does it create/delete/encrypt? Essential when static analysis fails.'
                },
                {
                    question: 'Packing as a malware evasion technique works by:',
                    options: [
                        'Splitting the malware into multiple small files to avoid size-based detection',
                        'Compressing or encrypting the malware binary so its actual code is hidden until runtime, evading signature-based detection',
                        'Replacing all strings with numeric codes to avoid string-based IOCs',
                        'Copying legitimate system binaries and replacing core code sections'
                    ],
                    correct: 1,
                    explanation: 'Packers (UPX, Themida, MPRESS) compress/encrypt the malware payload. The unpacker stub decompresses/decrypts in memory at runtime. AV signatures see only the packer, not the payload. Analysts identify packing via PEiD, high file entropy, or minimal import tables, then unpack before analysis.'
                },
                {
                    question: 'A polymorphic virus evades signature detection by:',
                    options: [
                        'Targeting only non-Windows operating systems where AV is less common',
                        'Changing its code signature with each infection while preserving functionality, making signature-based detection ineffective',
                        'Deleting itself immediately after delivering its payload',
                        'Encrypting the hard drive before AV can scan the file system'
                    ],
                    correct: 1,
                    explanation: 'Polymorphic malware uses mutation engines to rewrite its own code (instruction substitution, junk code insertion, register reassignment) while maintaining the same behavior. Each infection produces a different binary. AV must rely on heuristic/behavioral detection rather than static signatures.'
                },
                {
                    question: 'Metamorphic malware is more advanced than polymorphic malware because:',
                    options: [
                        'Metamorphic malware uses stronger encryption for its payload',
                        'Metamorphic malware completely rewrites its own code — not just encrypting it — producing functionally equivalent but structurally different code with no decryption stub to detect',
                        'Metamorphic malware only targets enterprise endpoints while polymorphic targets consumers',
                        'Metamorphic malware uses kernel-level rootkit techniques while polymorphic operates in user space'
                    ],
                    correct: 1,
                    explanation: 'Polymorphic malware encrypts its body and changes the decryption stub (the stub itself is the signature). Metamorphic malware has NO stub — it rewrites the entire codebase using code transformation (dead code insertion, code transposition, instruction substitution). This makes even heuristic detection extremely difficult.'
                }
            ]
        });
        quiz.start();
    </script>
