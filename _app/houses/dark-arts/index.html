<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access Control -->
    <script src="../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of the Dark Arts - Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-skull.webp">
    <style>
        :root {
            --house-primary: #6b21a8;
            --house-secondary: #581c87;
            --house-accent: #9333ea;
            --house-glow: rgba(107, 33, 168, 0.3);
            --house-bright-glow: rgba(147, 51, 234, 0.4);
            --house-bg: rgba(107, 33, 168, 0.05);
            --house-border: rgba(107, 33, 168, 0.25);
            --terminal-green: #00ff41;
            --terminal-glow: rgba(0, 255, 65, 0.3);
        }

        /* Dark Arts body override — monospace terminal feel */
        body {
            font-family: 'Courier New', 'Consolas', monospace !important;
            background: #0a0a0a !important;
        }

        /* Dark matrix background effect */
        body::before {
            background:
                radial-gradient(ellipse at 15% 15%, var(--house-bg) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 85%, rgba(88, 28, 135, 0.03) 0%, transparent 40%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(107, 33, 168, 0.02) 2px,
                    rgba(107, 33, 168, 0.02) 4px
                ) !important;
        }

        /* Animated scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--house-accent), transparent);
            opacity: 0.3;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes scanline {
            from { top: 0; }
            to { top: 100%; }
        }

        /* ============================================
           DARK ARTS SPECIFIC SECTIONS
           (FEH course, CyberOps, Gates, Vault, Games)
           ============================================ */

        /* Course grid */
        .course-section {
            background: #111;
            border: 1px solid #1a1a2e;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 50px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .course-title {
            font-size: 1.2rem;
            color: var(--house-accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--house-glow);
            font-family: 'Segoe UI', sans-serif;
        }

        .course-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 25px;
            font-family: 'Segoe UI', sans-serif;
        }

        .da-module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .da-module-card {
            background: rgba(15, 15, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .da-module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--house-primary), var(--house-accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .da-module-card:hover {
            transform: translateY(-3px);
            border-color: var(--house-border);
            background: rgba(20, 20, 25, 0.8);
            box-shadow: 0 0 20px var(--house-glow);
        }

        .da-module-card:hover::before {
            opacity: 1;
        }

        .da-module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .da-module-icon {
            font-size: 1.4rem;
            display: inline-flex;
            align-items: center;
        }

        .da-module-icon img {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 6px;
        }

        .da-module-status {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .da-module-status.available {
            background: rgba(147, 51, 234, 0.15);
            color: var(--house-accent);
        }

        .da-module-status.completed {
            background: rgba(0, 255, 65, 0.15);
            color: var(--terminal-green);
        }

        .da-module-title {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 8px;
            font-family: 'Segoe UI', sans-serif;
        }

        .da-module-description {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.5;
            font-family: 'Segoe UI', sans-serif;
        }

        .da-module-links {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .da-link {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-family: 'Segoe UI', sans-serif;
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .da-link-pres {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(147, 51, 234, 0.3);
            color: var(--house-accent);
        }

        .da-link-pres:hover {
            background: rgba(147, 51, 234, 0.3);
            box-shadow: 0 0 10px var(--house-glow);
        }

        .da-link-quiz {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid rgba(0, 255, 65, 0.25);
            color: var(--terminal-green);
        }

        .da-link-quiz:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px var(--terminal-glow);
        }

        .da-link-lab {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #60a5fa;
        }

        .da-link-lab:hover {
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .da-link-review {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            padding: 6px 20px;
        }

        .da-link-review:hover {
            background: rgba(245, 158, 11, 0.2);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        /* Gates section - dramatic styling */
        .gates-section {
            background: linear-gradient(135deg, rgba(107, 33, 168, 0.1), rgba(88, 28, 135, 0.05));
            border: 1px solid var(--house-border);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px var(--house-glow);
        }

        .gates-section::before {
            content: '\26A0';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 8rem;
            opacity: 0.03;
            pointer-events: none;
        }

        .gates-title {
            font-size: 1.5rem;
            color: var(--house-accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--house-glow);
            font-family: 'Segoe UI', sans-serif;
        }

        .gates-description {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.7;
            max-width: 800px;
            font-family: 'Segoe UI', sans-serif;
        }

        .gates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .gate-card {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(107, 33, 168, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gate-card.completed {
            border-color: var(--terminal-green);
            box-shadow: 0 0 20px var(--terminal-glow);
        }

        .gate-card:hover:not(.completed) {
            border-color: var(--house-accent);
            box-shadow: 0 0 25px var(--house-glow);
            transform: translateY(-3px);
        }

        .gate-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            border-radius: 50%;
            overflow: hidden;
        }

        .gate-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .gate-name {
            font-size: 0.85rem;
            color: #ddd;
            margin-bottom: 5px;
            font-family: 'Segoe UI', sans-serif;
        }

        .gate-hint {
            font-size: 0.7rem;
            color: #666;
            font-family: 'Segoe UI', sans-serif;
        }

        .gate-status {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--terminal-green);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gate-card.completed .gate-status {
            opacity: 1;
        }

        .gates-cta {
            text-align: center;
            margin-top: 30px;
        }

        .gate-start-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--house-primary), var(--house-accent));
            border: 1px solid var(--house-accent);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--house-glow);
            font-family: 'Segoe UI', sans-serif;
        }

        .gate-start-btn:hover {
            box-shadow: 0 0 40px var(--house-bright-glow);
            transform: translateY(-2px);
        }

        .gate-reset-btn {
            display: inline-block;
            margin-left: 15px;
            padding: 15px 30px;
            background: transparent;
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 8px;
            color: #aa4444;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .gate-reset-btn:hover {
            background: rgba(255, 60, 60, 0.1);
            border-color: rgba(255, 60, 60, 0.6);
            color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 60, 60, 0.2);
        }

        /* Vault section - locked */
        .vault-section {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 50px;
            text-align: center;
            opacity: 0.5;
            transition: all 0.5s ease;
        }

        .vault-section.unlocked {
            opacity: 1;
            border-color: var(--terminal-green);
            box-shadow: 0 0 30px var(--terminal-glow);
        }

        .vault-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            filter: grayscale(1);
            transition: filter 0.5s ease;
        }

        .vault-section.unlocked .vault-icon {
            filter: grayscale(0) drop-shadow(0 0 20px var(--terminal-green));
        }

        .vault-title {
            font-size: 1.3rem;
            color: #444;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 15px;
            transition: color 0.5s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .vault-section.unlocked .vault-title {
            color: var(--terminal-green);
            text-shadow: 0 0 15px var(--terminal-glow);
        }

        .vault-description {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 20px;
            transition: color 0.5s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .vault-section.unlocked .vault-description {
            color: #888;
        }

        .vault-requirements {
            font-size: 0.75rem;
            color: #333;
            font-family: 'Segoe UI', sans-serif;
        }

        .vault-section.unlocked .vault-requirements {
            color: var(--terminal-green);
        }

        /* Games placeholder */
        .games-section {
            background: rgba(15, 15, 20, 0.4);
            border: 1px solid rgba(107, 33, 168, 0.2);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 50px;
            text-align: center;
        }

        .games-title {
            font-size: 0.8rem;
            color: var(--house-accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-family: 'Segoe UI', sans-serif;
        }

        .games-placeholder {
            font-size: 0.85rem;
            color: #666;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Responsive overrides for dark-arts sections */
        @media (max-width: 768px) {
            .da-module-grid {
                grid-template-columns: 1fr;
            }

            .gates-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            body::after { animation: none; }
        }

        /* High contrast */
        @media (prefers-contrast: more) {
            .da-module-card,
            .gate-card { border-color: rgba(255, 255, 255, 0.4); }
        }
    
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <h1 class="visually-hidden">House of the Dark Arts</h1>
    <script src="../../dark-arts/gate-cipher.js"></script>
    <script>
        // ============================================
        // DARK ARTS CONFIGURATION
        // ============================================

        const HOUSE_ID = 'dark_arts';

        // Foundations of Ethical Hacking (FEH) modules
        const FEH_MODULES = [
            {
                id: 'feh-01', icon: '<img src="/assets/images/categories/feh-01.webp" alt="Hacker Mindset">', title: 'The Hacker Mindset',
                description: 'Ethics, legality, hacker types, kill chain',
                presentation: 'presentations/dark-arts-feh-01.presentation.html',
                quiz: 'quizzes/dark-arts-feh-01.quiz.html',
                lab: 'labs/dark-arts-feh-01.lab.html'
            },
            {
                id: 'feh-02', icon: '<img src="/assets/images/categories/feh-02.webp" alt="Recon & OSINT">', title: 'Reconnaissance & OSINT',
                description: 'Google dorking, whois, Shodan, footprinting',
                presentation: 'presentations/dark-arts-feh-02.presentation.html',
                quiz: 'quizzes/dark-arts-feh-02.quiz.html',
                lab: 'labs/dark-arts-feh-02.lab.html'
            },
            {
                id: 'feh-03', icon: '<img src="/assets/images/categories/feh-03.webp" alt="Scanning">', title: 'Scanning & Enumeration',
                description: 'Nmap, port scanning, service fingerprinting',
                presentation: 'presentations/dark-arts-feh-03.presentation.html',
                quiz: 'quizzes/dark-arts-feh-03.quiz.html',
                lab: 'labs/dark-arts-feh-03.lab.html'
            },
            {
                id: 'feh-04', icon: '<img src="/assets/images/categories/feh-04.webp" alt="Vuln Assessment">', title: 'Vulnerability Assessment',
                description: 'CVEs, CVSS, vulnerability databases',
                presentation: 'presentations/dark-arts-feh-04.presentation.html',
                quiz: 'quizzes/dark-arts-feh-04.quiz.html',
                lab: 'labs/dark-arts-feh-04.lab.html'
            },
            {
                id: 'feh-05', icon: '<img src="/assets/images/categories/feh-05.webp" alt="Exploitation">', title: 'System Exploitation',
                description: 'Password attacks, privilege escalation',
                presentation: 'presentations/dark-arts-feh-05.presentation.html',
                quiz: 'quizzes/dark-arts-feh-05.quiz.html',
                lab: 'labs/dark-arts-feh-05.lab.html'
            },
            {
                id: 'feh-06', icon: '<img src="/assets/images/categories/feh-06.webp" alt="Web AppSec">', title: 'Web Application Security',
                description: 'OWASP Top 10, injection, XSS, CSRF',
                presentation: 'presentations/dark-arts-feh-06.presentation.html',
                quiz: 'quizzes/dark-arts-feh-06.quiz.html',
                lab: 'labs/dark-arts-feh-06.lab.html'
            },
            {
                id: 'feh-07', icon: '<img src="/assets/images/categories/feh-07.webp" alt="Network Attacks">', title: 'Network Attacks & Defense',
                description: 'Sniffing, MITM, ARP poisoning',
                presentation: 'presentations/dark-arts-feh-07.presentation.html',
                quiz: 'quizzes/dark-arts-feh-07.quiz.html',
                lab: 'labs/dark-arts-feh-07.lab.html'
            },
            {
                id: 'feh-08', icon: '<img src="/assets/images/categories/feh-08.webp" alt="Social Engineering">', title: 'Social Engineering',
                description: 'Phishing, pretexting, physical security',
                presentation: 'presentations/dark-arts-feh-08.presentation.html',
                quiz: 'quizzes/dark-arts-feh-08.quiz.html',
                lab: 'labs/dark-arts-feh-08.lab.html'
            },
            {
                id: 'feh-09', icon: '<img src="/assets/images/categories/feh-09.webp" alt="Cryptography">', title: 'Cryptography & Steganography',
                description: 'Encryption, hashing, data hiding',
                presentation: 'presentations/dark-arts-feh-09.presentation.html',
                quiz: 'quizzes/dark-arts-feh-09.quiz.html',
                lab: 'labs/dark-arts-feh-09.lab.html'
            },
            {
                id: 'feh-10', icon: '<img src="/assets/images/categories/feh-10.webp" alt="Malware Analysis">', title: 'Malware Analysis Basics',
                description: 'Types, behavior, static/dynamic analysis',
                presentation: 'presentations/dark-arts-feh-10.presentation.html',
                quiz: 'quizzes/dark-arts-feh-10.quiz.html',
                lab: 'labs/dark-arts-feh-10.lab.html'
            }
        ];

        // Five Gates configuration
        const GATES = [
            { id: 'gate1', number: 1, icon: '<img src="/assets/images/gates/gate-1.webp" alt="Hex Gate">', name: 'The Hex Gate', hint: 'Source code, hex encoding' },
            { id: 'gate2', number: 2, icon: '<img src="/assets/images/gates/gate-2.webp" alt="Shadow Gate">', name: 'The Shadow Gate', hint: 'CSS, Base64' },
            { id: 'gate3', number: 3, icon: '<img src="/assets/images/gates/gate-3.webp" alt="Image Gate">', name: 'The Image Gate', hint: 'Steganography' },
            { id: 'gate4', number: 4, icon: '<img src="/assets/images/gates/gate-4.webp" alt="Sound Gate">', name: 'The Sound Gate', hint: 'DTMF audio' },
            { id: 'gate5', number: 5, icon: '<img src="/assets/images/gates/gate-5.webp" alt="Synthesis Gate">', name: 'The Synthesis Gate', hint: 'Combine all clues' }
        ];


        const CATEGORIES = [
            { id: 'feh-course', name: 'FEH Course', icon: '<img src="/assets/images/categories/feh-course.webp" alt="FEH Course" style="width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;">', description: 'Foundations of Ethical Hacking modules', count: 10, topics: ['hacking', 'pentesting', 'offensive'] },
            { id: 'certifications', name: 'Certifications', icon: '<img src="/assets/images/categories/certifications.webp" alt="Certifications" style="width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;">', description: 'Industry certification prep courses', count: 1, topics: ['cyberops', 'cisco', 'ceh'] },
            { id: 'gates', name: 'Gates', icon: '<img src="/assets/images/categories/gates.webp" alt="Gates" style="width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;">', description: 'CTF challenges to unlock vault access', count: 1, topics: ['ctf', 'challenges'] },
            { id: 'vault', name: 'Vault', icon: '<img src="/assets/images/categories/vault.webp" alt="Vault" style="width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;">', description: 'Advanced tools and training labs', count: 1, topics: ['malware', 'exploits', 'tools'] }
        ];

        // ============================================
        // COMPLETION TRACKING
        // ============================================

        function isModuleCompleted(moduleId) {
            return localStorage.getItem(`${HOUSE_ID}_${moduleId}_completed`) === 'true';
        }

        function isGateCompleted(gateNumber) {
            return localStorage.getItem(`gate${gateNumber}_complete`) === 'true';
        }

        function markModuleComplete(moduleId) {
            localStorage.setItem(`${HOUSE_ID}_${moduleId}_completed`, 'true');
        }

        function getCompletedCount() {
            let count = 0;
            FEH_MODULES.forEach(mod => {
                if (isModuleCompleted(mod.id)) count++;
            });
            return count;
        }

        function getGatesCleared() {
            let count = 0;
            for (let i = 1; i <= 5; i++) {
                if (isGateCompleted(i)) count++;
            }
            return count;
        }

        function areAllGatesCleared() {
            for (let i = 1; i <= 5; i++) {
                if (!isGateCompleted(i)) return false;
            }
            return true;
        }

        function resetGates() {
            if (!confirm('This will erase all your gate progress.\nYou will need to solve all Five Gates again.\n\nAre you sure?')) return;
            for (let i = 1; i <= 5; i++) {
                localStorage.removeItem('gate' + i + '_complete');
                localStorage.removeItem('gate' + i + '_timestamp');
            }
            localStorage.removeItem('dark_arts_unlocked');
            localStorage.removeItem('gate4_code');
            localStorage.removeItem('gate_version');
            location.reload();
        }

        // ============================================
        // UI POPULATION (gate/vault sections)
        // ============================================

        function populateFEHModules() {
            const grid = document.getElementById('fehModuleGrid');
            if (!grid) return;
            grid.innerHTML = '';

            FEH_MODULES.forEach(mod => {
                const completed = isModuleCompleted(mod.id);
                const card = document.createElement('div');
                card.className = 'da-module-card';

                card.innerHTML = `
                    <div class="da-module-header">
                        <span class="da-module-icon">${mod.icon}</span>
                        <span class="da-module-status ${completed ? 'completed' : 'available'}">
                            ${completed ? 'completed' : 'available'}
                        </span>
                    </div>
                    <div class="da-module-title">${mod.title}</div>
                    <div class="da-module-description">${mod.description}</div>
                    <div class="da-module-links">
                        <a href="${mod.presentation}" class="da-link da-link-pres" title="Presentation">Slides</a>
                        <a href="${mod.quiz}" class="da-link da-link-quiz" title="Quiz">Quiz</a>
                        <a href="${mod.lab}" class="da-link da-link-lab" title="Lab">Lab</a>
                    </div>
                `;

                grid.appendChild(card);
            });

            // Add comprehensive review card
            const reviewCard = document.createElement('div');
            reviewCard.className = 'da-module-card';
            reviewCard.style.borderColor = 'rgba(147, 51, 234, 0.4)';
            const reviewCompleted = isModuleCompleted('feh-review');

        function populateGates() {
            const grid = document.getElementById('gatesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            GATES.forEach(gate => {
                const completed = isGateCompleted(gate.number);
                const card = document.createElement('div');
                card.className = 'gate-card' + (completed ? ' completed' : '');
                card.onclick = () => openGate(gate.number);

                card.innerHTML = `
                    <div class="gate-icon">${gate.icon}</div>
                    <div class="gate-name">${gate.name}</div>
                    <div class="gate-hint">${gate.hint}</div>
                    <div class="gate-status">\u2713 CLEARED</div>
                `;

                grid.appendChild(card);
            });
        }

            // Gate stats are visual in the gates-section itself, not in the renderer stats bar
        }

        function updateVaultStatus() {
            const vaultSection = document.getElementById('vaultSection');
            const vaultRequirements = document.getElementById('vaultRequirements');

                vaultSection.onclick = () => {

            } else {

        }

    <!-- ── Coming-soon interceptor for unbuilt Vault-family tracks ──────
         EHE, WiFi Arsenal, Bug Hunting, and The Vault (paths array above)
         have no built index.html yet (vault/index.html, vault/ehe/index.html,
         vault/wifi-arsenal/index.html, vault/bug-hunting/index.html do not
         exist; only vault/ehe/da-ad-attack-lab.lab.html does). Their cards
         keep the existing href (nothing deleted, per "we do not destroy"),
         but this capture-phase listener intercepts the click/keydown BEFORE
         HouseRenderer's own navigate handler fires, and shows the same
         "coming soon" message HouseRenderer already uses for module cards
         (see getTypeBadge/openModule's mod.status === 'coming-soon' path in
         components/HouseRenderer.js) instead of navigating to a 404.
         Any href containing 'dark-arts/vault' is treated as not-yet-built.
         SCOPE: this covers ONLY the 4 Vault-family track links (EHE, WiFi Arsenal,
         Bug Hunting, The Vault) rendered as .path-card / .hr-hub-card. The Five-Gates
         -> Vault CTA in updateVaultStatus() above fires on #vaultSection (a different
         element) so it is not covered here — it now shows its own "coming soon" notice
         directly instead of navigating to the unbuilt vault/index.html (#157 fixed). ── -->
    <script>
    (function() {
        function isComingSoonHref(href) {
            return !!href && href.indexOf('dark-arts/vault') !== -1;
        }
        function interceptComingSoon(e) {
            const card = e.target.closest('.path-card, .hr-hub-card');
            if (!card) return;
            const href = card.dataset.pathHref || card.dataset.href || '';
            if (isComingSoonHref(href)) {
                e.preventDefault();
                e.stopImmediatePropagation();
                alert('This track is coming soon!');
            }
        }
        document.addEventListener('click', interceptComingSoon, true);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') interceptComingSoon(e);
        }, true);
    })();
    </script>
