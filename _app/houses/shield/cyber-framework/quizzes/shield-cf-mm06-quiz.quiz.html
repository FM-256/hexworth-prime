    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM06: Encryption Law & Policy Quiz',
            description: '10 questions on encryption policy, law enforcement access, and legal doctrine',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm06',
            moduleId: 'shield-cf-mm06',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "The 'Going Dark' problem, as framed by the FBI and DOJ, refers to which specific challenge?",
                    options: [
                        "The difficulty of recruiting cybersecurity professionals for law enforcement agencies",
                        "The challenge of investigating cybercrime that occurs on the dark web",
                        "Law enforcement's inability to access the content of lawfully targeted communications because of pervasive end-to-end encryption",
                        "The problem of critical infrastructure systems operating without network visibility"
                    ],explanation: "Going Dark is the FBI and DOJ's framing of the problem created by ubiquitous strong encryption. When communications platforms implement end-to-end encryption by default (Signal, WhatsApp, iMessage, FaceTime), even a valid, court-authorized wiretap order cannot yield readable content \u2014 the provider simply doesn't have the keys. Critics note that while content may go dark, metadata (who communicates with whom, when, for how long) remains broadly available and is often more valuable."
                },
                {
                    question: "The Apple v. FBI dispute arose from which specific incident?",
                    options: [
                        "The NSA's bulk phone metadata collection program revealed by Snowden",
                        "The 2015 San Bernardino terrorist attack and the FBI's inability to access the attacker's iPhone",
                        "A 2014 celebrity photo breach exploiting iCloud security vulnerabilities",
                        "Apple's refusal to provide user data to Chinese government authorities"
                    ],explanation: "In December 2015, Syed Rizwan Farook and Tashfeen Malik killed 14 people in San Bernardino, California. The FBI recovered Farook's iPhone 5c but could not unlock it because of Apple's iOS encryption and the auto-erase feature (which deletes data after 10 failed passcode attempts). The FBI sought Apple's assistance \u2014 specifically, to create a version of iOS without the security features \u2014 calling it 'GovtOS.' This became the highest-profile encryption policy confrontation in U.S. legal history."
                },
                {
                    question: "The FBI's court order compelling Apple to assist in unlocking the San Bernardino iPhone was issued under which legal authority?",
                    options: [
                        "The USA PATRIOT Act Section 215 (business records provision)",
                        "The Communications Assistance for Law Enforcement Act (CALEA)",
                        "The All Writs Act of 1789 (28 U.S.C. \u00a7 1651)",
                        "FISA Court Order under 50 U.S.C. \u00a7 1881a"
                    ],explanation: "The FBI used the All Writs Act of 1789 (28 U.S.C. \u00a7 1651), one of the oldest federal statutes, which authorizes federal courts to issue 'all writs necessary or appropriate in aid of their respective jurisdictions.' The government argued this broad authority empowered courts to compel Apple's assistance. Apple countered that the All Writs Act cannot be used to compel a company to write new software, and that such an order would violate Apple's First Amendment rights (compelled speech) and impose an 'unreasonable burden.'"
                },
                {
                    question: "Why was the Apple v. FBI legal dispute never decided by a court on its merits?",
                    options: [
                        "Apple complied with the court order before the hearing date",
                        "The Supreme Court declined to hear the case, leaving the issue unresolved",
                        "The Department of Justice withdrew the case after an unnamed third party provided a method to unlock the phone",
                        "Congress passed legislation making the order moot by mandating Apple provide law enforcement access"
                    ],explanation: "On March 28, 2016 \u2014 just before the scheduled court hearing \u2014 the DOJ abruptly withdrew its case after announcing that 'an outside party' had demonstrated a method to unlock the iPhone 5c without Apple's assistance. The FBI paid approximately $1 million to an Australian cybersecurity firm (later reported to be Azimuth Security) for the exploit. The Supreme Court never ruled on whether the All Writs Act could compel Apple's assistance, leaving the core legal question unresolved."
                },
                {
                    question: "Under the Fifth Amendment, biometric data (fingerprints, face scans, iris patterns) used to unlock a device is generally treated as what type of evidence?",
                    options: [
                        "Testimonial evidence \u2014 protected by the Fifth Amendment right against self-incrimination",
                        "Non-testimonial/physical evidence \u2014 not protected by the Fifth Amendment",
                        "Privileged communication \u2014 protected under attorney-client privilege",
                        "Derivative evidence \u2014 inadmissible unless independently discovered"
                    ],explanation: "Courts have consistently held that biometric authentication (fingerprints, Face ID, iris scans) is non-testimonial physical evidence \u2014 like a physical key or a DNA sample \u2014 and therefore not protected by the Fifth Amendment privilege against self-incrimination. The Fifth Amendment protects 'testimonial' communications \u2014 the contents of your mind. Physically pressing your finger to a sensor does not reveal anything you know; it merely confirms a biological fact."
                },
                {
                    question: "Providing a passcode or password to law enforcement when compelled is generally considered what type of evidence under the Fifth Amendment?",
                    options: [
                        "Non-testimonial physical evidence \u2014 not protected by the Fifth Amendment",
                        "Testimonial evidence \u2014 potentially protected because it reveals the contents of one's mind",
                        "Documentary evidence \u2014 subject to the business records exception",
                        "Derivative evidence \u2014 admissible only if corroborated by other evidence"
                    ],explanation: "Unlike biometrics, a passcode or password is 'the contents of your mind' \u2014 it is something you know, not something you are. Courts have generally held that compelling someone to disclose a password is testimonial because it requires the person to use their mental faculties to communicate information to the government. This triggers Fifth Amendment protection."
                },
                {
                    question: "The 'Foregone Conclusion Doctrine' in encryption cases allows courts to compel password disclosure when which condition is met?",
                    options: [
                        "The crime being investigated carries a maximum sentence of more than 10 years",
                        "The government already knows, with reasonable particularity, what is on the encrypted device \u2014 making the act of production non-testimonial",
                        "The device has been seized pursuant to a valid warrant and held for more than 30 days",
                        "A neutral magistrate has certified that the encrypted data is essential to national security"
                    ],explanation: "The Foregone Conclusion Doctrine (from Fisher v. United States, 1976) holds that if the government already knows \u2014 with reasonable particularity \u2014 that incriminating content exists on the device, that the suspect has access to it, and the specific nature of the content, then compelling production of the password is non-testimonial. The person's knowledge of the password reveals nothing new to the government."
                },
                {
                    question: "Apple argued that being compelled to write new 'GovtOS' software to unlock iPhones would violate which constitutional provision?",
                    options: [
                        "The Fourth Amendment prohibition against unreasonable searches and seizures",
                        "The First Amendment, arguing that computer code is protected speech and compelling Apple to write new code is compelled speech",
                        "The Thirteenth Amendment prohibition against involuntary servitude",
                        "The Takings Clause of the Fifth Amendment, arguing the government was seizing Apple's intellectual property"
                    ],explanation: "Apple's lead constitutional argument was that computer code is protected speech under the First Amendment (relying on Junger v. Daley and Bernstein v. DOJ, which held that source code is expressive). Compelling Apple to write new software would constitute compelled speech \u2014 the government forcing a private party to create and express a message it did not choose."
                },
                {
                    question: "Opponents of government-mandated encryption backdoors (sometimes called 'exceptional access' mechanisms) make which primary technical argument?",
                    options: [
                        "Backdoors would make encryption too slow to be practical for everyday use",
                        "Once a backdoor exists, it cannot be restricted to authorized government use \u2014 malicious actors, foreign governments, and criminals would exploit the same vulnerability",
                        "Backdoors are prohibited by international treaty obligations under the Budapest Convention",
                        "Backdoors would create patent disputes between technology companies and government agencies"
                    ],explanation: "The core technical argument against backdoors, articulated in the landmark 'Keys Under Doormats' paper (2015) by MIT cryptographers and others, is that you cannot build a backdoor that only good guys can use. A vulnerability is a vulnerability \u2014 once created, it becomes a target. History supports this: in 2010, Google was hacked through a backdoor China had demanded be built into Gmail for law enforcement access; the Juniper Networks breach (2015) exploited an NSA backdoor to create an unauthorized backdoor."
                },
                {
                    question: "Which of the following accurately describes a benefit of strong, ubiquitous encryption?",
                    options: [
                        "It prevents law enforcement from conducting any form of digital surveillance",
                        "It protects privacy, secures financial transactions, enables safe commerce, and helps organizations meet regulatory compliance requirements",
                        "It ensures that all digital communications are anonymous and untraceable",
                        "It replaces the need for other security controls like firewalls and endpoint protection"
                    ],explanation: "Encryption provides foundational benefits to modern society: (1) Privacy \u2014 protecting sensitive personal communications from mass surveillance and hackers; (2) Security \u2014 securing banking, healthcare, government, and commercial data; (3) Commerce \u2014 enabling secure online transactions (TLS/HTTPS); (4) Compliance \u2014 satisfying regulatory requirements (HIPAA, PCI DSS, GDPR, GLBA all mandate encryption); (5) Trust \u2014 enabling cloud computing and remote work."
                }
            ]
        });
