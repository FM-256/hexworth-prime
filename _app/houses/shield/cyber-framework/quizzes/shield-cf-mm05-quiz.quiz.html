<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cyber Framework</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM05: Critical Infrastructure & NIST CSF Quiz',
            description: '10 questions on critical infrastructure protection and NIST Cybersecurity Framework',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm05',
            moduleId: 'shield-cf-mm05',
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "How many critical infrastructure sectors are officially designated under the U.S. National Infrastructure Protection Plan (NIPP)?",
                    options: ["12 sectors", "14 sectors", "16 sectors", "18 sectors"],
                    correct: 2,
                    explanation: "Presidential Policy Directive 21 (PPD-21, 2013) designates 16 critical infrastructure sectors: Chemical, Commercial Facilities, Communications, Critical Manufacturing, Dams, Defense Industrial Base, Emergency Services, Energy, Financial Services, Food and Agriculture, Government Facilities, Healthcare and Public Health, Information Technology, Nuclear Reactors, Transportation Systems, and Water/Wastewater Systems. Each sector has a designated Sector Risk Management Agency (SRMA)."
                },
                {
                    question: "The original NIST Cybersecurity Framework was developed pursuant to which Presidential Executive Order?",
                    options: [
                        "Executive Order 12333 (1981) \u2014 United States Intelligence Activities",
                        "Executive Order 13636 (2013) \u2014 Improving Critical Infrastructure Cybersecurity",
                        "Executive Order 13800 (2017) \u2014 Strengthening the Cybersecurity of Federal Networks",
                        "Executive Order 14028 (2021) \u2014 Improving the Nation's Cybersecurity"
                    ],
                    correct: 1,
                    explanation: "President Obama signed Executive Order 13636 in February 2013, directing NIST to develop a voluntary cybersecurity framework through industry collaboration. NIST published CSF Version 1.0 in February 2014 \u2014 exactly one year later. EO 13636 was significant because it explicitly recognized that critical infrastructure is mostly privately owned (~85%) and mandated a collaborative public-private approach rather than mandatory regulation."
                },
                {
                    question: "The NIST Cybersecurity Framework (CSF) 2.0 Core contains how many Functions?",
                    options: ["4 Functions", "5 Functions", "6 Functions", "7 Functions"],
                    correct: 2,
                    explanation: "CSF 2.0 (released February 2024) has 6 Core Functions: Govern, Identify, Protect, Detect, Respond, and Recover. The original CSF 1.0/1.1 had 5 Functions \u2014 Identify, Protect, Detect, Respond, and Recover. Version 2.0 added 'Govern' as the overarching function to emphasize that cybersecurity risk management must be embedded in organizational governance."
                },
                {
                    question: "What are the six Core Functions of NIST CSF 2.0, in the correct order presented by NIST?",
                    options: [
                        "Govern, Identify, Protect, Detect, Respond, Recover",
                        "Identify, Protect, Detect, Respond, Recover, Review",
                        "Plan, Do, Check, Act, Govern, Improve",
                        "Assess, Mitigate, Monitor, Report, Recover, Govern"
                    ],
                    correct: 0,
                    explanation: "The six CSF 2.0 Functions are: (1) Govern \u2014 establish organizational cybersecurity risk strategy, expectations, and policy; (2) Identify \u2014 understand organizational context and assets; (3) Protect \u2014 implement safeguards; (4) Detect \u2014 identify cybersecurity events; (5) Respond \u2014 take action on detected incidents; (6) Recover \u2014 restore capabilities after incidents. NIST places Govern at the center of the framework diagram because it informs and is supported by all other functions."
                },
                {
                    question: "In NIST CSF, 'Implementation Tiers' are used to describe what aspect of an organization's cybersecurity program?",
                    options: [
                        "The specific technical controls an organization has deployed (firewall, SIEM, EDR, etc.)",
                        "The compliance level with specific regulatory frameworks (HIPAA, PCI DSS, SOC 2)",
                        "The degree to which cybersecurity risk management practices are integrated, repeatable, and informed by risk",
                        "The maturity level of the organization's incident response team on a 1-5 scale"
                    ],
                    correct: 2,
                    explanation: "CSF Implementation Tiers (1 through 4) describe the degree of sophistication in how organizations manage cybersecurity risk. Tier 1 (Partial) \u2014 ad-hoc, reactive, limited risk awareness. Tier 2 (Risk Informed) \u2014 some risk practices but not organization-wide. Tier 3 (Repeatable) \u2014 formally approved, consistently implemented policies. Tier 4 (Adaptive) \u2014 actively adapts to threat landscape, integrates lessons learned. Tiers are NOT compliance levels."
                },
                {
                    question: "NIST CSF 2.0 added 'Govern' as a new sixth Function. What did this addition primarily address?",
                    options: [
                        "The need for government agencies to have mandatory compliance with the framework",
                        "The recognition that cybersecurity risk management must be driven by and integrated into organizational governance and leadership",
                        "Requirements for organizations to obtain government certification before using the framework",
                        "The technical governance of cloud infrastructure and API security controls"
                    ],
                    correct: 1,
                    explanation: "The Govern function was added to address a critical gap in CSF 1.0: cybersecurity was too often treated as a purely technical/IT matter. Govern emphasizes that effective cybersecurity requires: organizational context and mission alignment, documented cybersecurity policy and strategy, defined roles and responsibilities (including board-level accountability), integration with enterprise risk management, clear supply chain risk management processes, and continuous oversight."
                },
                {
                    question: "In NIST CSF, an 'Organizational Profile' is used to compare what two states?",
                    options: [
                        "The organization's security posture compared to similar industry peers",
                        "The current cybersecurity state (Current Profile) against the desired target state (Target Profile)",
                        "Pre-incident security status compared to post-incident recovery status",
                        "The organization's compliance with federal frameworks versus international standards"
                    ],
                    correct: 1,
                    explanation: "An Organizational Profile has two components: the Current Profile (what the organization does now \u2014 which Framework outcomes are being achieved and at what level) and the Target Profile (what the organization wants to achieve based on risk tolerance, mission requirements, and resources). The gap between current and target profiles drives the organization's roadmap for cybersecurity improvement."
                },
                {
                    question: "What is CISA's primary mission related to critical infrastructure?",
                    options: [
                        "Prosecuting cybercriminals who attack critical infrastructure sectors",
                        "Developing mandatory cybersecurity standards for all 16 critical infrastructure sectors",
                        "Protecting the nation's critical infrastructure from physical and cyber threats through risk reduction and resilience building",
                        "Operating the nation's defensive cyber capabilities as part of U.S. Cyber Command"
                    ],
                    correct: 2,
                    explanation: "CISA's mission is to lead the national effort to understand, manage, and reduce risk to the cyber and physical infrastructure that Americans rely on. CISA partners with government and private sector owners of critical infrastructure to: assess risks, share threat information, provide cybersecurity tools and services, coordinate sector-specific security planning, build resilience against all hazards, and run national-level exercises. CISA is civilian-focused and does not have law enforcement or military authorities."
                },
                {
                    question: "Federal agencies (civilian) are required to use the NIST Cybersecurity Framework primarily due to which mandate?",
                    options: [
                        "The Federal Information Security Modernization Act (FISMA)",
                        "Presidential Executive Orders directing federal agency adoption",
                        "A mandatory NIST publication requirement under OMB Circular A-130",
                        "A Supreme Court ruling requiring agencies to adopt industry security standards"
                    ],
                    correct: 1,
                    explanation: "Federal civilian agency adoption of the NIST CSF was directed through Presidential Executive Orders \u2014 notably EO 13800 (2017) by President Trump and EO 14028 (2021) by President Biden. EO 14028 in particular drove significant federal cybersecurity improvement requirements. While FISMA governs the overall federal information security program, the specific CSF requirement comes from EOs."
                },
                {
                    question: "The original NIST CSF was developed through a collaborative process. Approximately how many unique stakeholders participated in its development?",
                    options: [
                        "Approximately 200 stakeholders",
                        "Approximately 800 stakeholders",
                        "More than 3,000 stakeholders",
                        "More than 10,000 stakeholders"
                    ],
                    correct: 2,
                    explanation: "NIST engaged more than 3,000 individuals and organizations across government, industry, and academia in developing the original CSF through an unprecedented open, transparent process that included public workshops, RFI responses, and multiple public drafts. This collaborative approach was intentional \u2014 by getting industry buy-in during development, NIST ensured the framework would be practically useful."
                }
            ]
        });
        quiz.start();
    </script>
