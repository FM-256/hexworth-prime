    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM04: Regulatory Frameworks Quiz',
            description: '10 questions on FTC, HIPAA, GLBA, and SEC cybersecurity regulatory frameworks',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm04',
            moduleId: 'shield-cf-mm04',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "The FTC's authority to regulate cybersecurity practices of commercial entities derives primarily from which legal source?",
                    options: [
                        "The Computer Fraud and Abuse Act (18 U.S.C. \u00a7 1030)",
                        "Section 5 of the FTC Act, which prohibits unfair or deceptive acts or practices",
                        "The Privacy Act of 1974, which governs federal agency data handling",
                        "Executive Order 13636, which directed NIST to develop the CSF"
                    ],explanation: "Section 5 of the FTC Act (15 U.S.C. \u00a7 45) prohibits 'unfair or deceptive acts or practices in or affecting commerce.' The FTC uses two theories: (1) Deception \u2014 companies that promise data security in privacy policies but fail to deliver are engaged in deceptive practices. (2) Unfairness \u2014 companies whose inadequate security causes substantial consumer harm are engaged in unfair practices. The Third Circuit's 2015 ruling in FTC v. Wyndham confirmed Congress intended this authority to extend to cybersecurity."
                },
                {
                    question: "The FTC first began actively asserting cybersecurity enforcement authority starting with which case in 2001?",
                    options: [
                        "FTC v. Wyndham Hotels (2015)",
                        "FTC v. LabMD (2016)",
                        "In the Matter of Eli Lilly and Company (2002)",
                        "In the Matter of Microsoft Corporation (2002)"
                    ],explanation: "The FTC's first cybersecurity enforcement action was In the Matter of Eli Lilly (2002), which arose from a 2001 incident where Eli Lilly accidentally exposed 669 patients' email addresses when discontinuing a Prozac reminder service. The FTC alleged this was a deceptive practice because Lilly's privacy policy promised to protect user data. The consent order required Lilly to implement a security program. This established the precedent that the FTC would use Section 5 to police corporate data security."
                },
                {
                    question: "The HIPAA Security Rule primarily applies to which category of organizations?",
                    options: [
                        "All companies that handle any health-related data, including fitness apps",
                        "Covered entities \u2014 health plans, healthcare clearinghouses, and healthcare providers that conduct electronic transactions",
                        "All federal agencies and their contractors who process health data",
                        "Only hospitals with more than 50 beds and insurance companies with over $1 billion in revenue"
                    ],explanation: "The HIPAA Security Rule (45 CFR Part 164) applies to 'covered entities': (1) health plans (insurance companies, HMOs, Medicare/Medicaid), (2) healthcare clearinghouses (entities that process health data), and (3) healthcare providers who conduct standard electronic health transactions (billing, claims). Business associates \u2014 vendors with access to PHI (Protected Health Information) \u2014 also became directly subject to HIPAA under the 2013 HIPAA Omnibus Rule."
                },
                {
                    question: "The Gramm-Leach-Bliley Act (GLBA) Safeguards Rule requires what from financial institutions?",
                    options: [
                        "Annual penetration testing performed by a Big Four accounting firm",
                        "Implementation of a comprehensive information security program with administrative, technical, and physical safeguards",
                        "Encryption of all customer data both in transit and at rest using AES-256 minimum",
                        "Disclosure to customers whenever their data is shared with third-party affiliates"
                    ],explanation: "The GLBA Safeguards Rule (16 CFR Part 314), significantly strengthened in 2023, requires financial institutions to develop, implement, and maintain a comprehensive information security program. Key requirements include: designating a qualified individual (CISO), conducting a written risk assessment, implementing safeguards based on risk (access controls, encryption, multi-factor authentication, pen testing, change management, and more), overseeing service providers, and having an incident response plan."
                },
                {
                    question: "SEC rules require public companies to disclose material cybersecurity incidents using Form 8-K within what timeframe?",
                    options: [
                        "24 hours of discovering the incident",
                        "72 hours, consistent with GDPR notification requirements",
                        "4 business days of determining the incident is material",
                        "30 days, to allow for investigation and verification before disclosure"
                    ],explanation: "Under SEC rules effective December 2023, public companies must file a Form 8-K to disclose material cybersecurity incidents within 4 business days of determining that a cybersecurity incident is material. The company need not file while the materiality determination is still being made, and the SEC can delay disclosure for national security reasons upon request from the Attorney General."
                },
                {
                    question: "Under FTC Section 5, a practice is considered 'unfair' when it meets which standard?",
                    options: [
                        "It violates an industry code of conduct or best practice standard",
                        "It causes or is likely to cause substantial injury that consumers cannot reasonably avoid, and the harm is not outweighed by benefits",
                        "It involves intentional deception about data security capabilities in marketing materials",
                        "It results in actual financial harm to more than 1,000 consumers"
                    ],explanation: "The FTC's unfairness standard (Section 5(n)) has three elements: (1) the act causes or is likely to cause substantial injury to consumers, (2) consumers cannot reasonably avoid the injury themselves (they have no meaningful way to protect themselves), and (3) the injury is not outweighed by countervailing benefits to consumers or competition. For cybersecurity, 'substantial injury' includes fraud losses, costs of mitigation (credit monitoring, new account setup), and emotional distress."
                },
                {
                    question: "FTC v. Wyndham Hotels (3rd Circuit, 2015) is significant because it affirmed which principle?",
                    options: [
                        "That the FTC can issue fines of up to $50,000 per day for cybersecurity violations",
                        "That the FTC has authority under Section 5 to regulate corporate cybersecurity practices",
                        "That hotels are not considered financial institutions under GLBA",
                        "That data breach victims must prove actual identity theft to have standing to sue"
                    ],explanation: "The Third Circuit's 2015 ruling in FTC v. Wyndham Worldwide Corporation was a landmark decision affirming that the FTC has authority under Section 5 of the FTC Act to regulate cybersecurity practices. Wyndham had argued that Congress never explicitly granted the FTC cybersecurity authority. The court disagreed, holding that cybersecurity failures can constitute 'unfair' practices under Section 5."
                },
                {
                    question: "HIPAA's 2024 proposed updates to the Security Rule would add which new technical safeguards requirements?",
                    options: [
                        "Mandatory use of FIPS-validated encryption and annual SOC 2 Type II audits",
                        "Multi-factor authentication, annual penetration testing, and technology asset inventory requirements",
                        "Real-time threat intelligence sharing with HHS and FBI within 24 hours",
                        "Quantum-resistant encryption for all PHI and zero-trust network architecture"
                    ],explanation: "HHS's 2024 proposed HIPAA Security Rule overhaul (the first major update since 2013) would remove the distinction between 'required' and 'addressable' implementation specifications (making most requirements mandatory), add requirements for multi-factor authentication, network segmentation, vulnerability scanning and penetration testing, technology asset inventories, and incident response plans."
                },
                {
                    question: "The GLBA Safeguards Rule's 2023 amendments require financial institutions to designate which role?",
                    options: [
                        "A Data Protection Officer (DPO) analogous to the GDPR requirement",
                        "A Qualified Individual responsible for overseeing the information security program",
                        "A Chief Privacy Officer (CPO) with direct reporting authority to the CEO",
                        "An independent security auditor who reports directly to the board of directors"
                    ],explanation: "The FTC's revised Safeguards Rule requires covered financial institutions to designate a 'Qualified Individual' to oversee and implement their information security program. This individual must report to the board of directors (or governing body) at least annually on the security program's status and compliance. The 'Qualified Individual' can be an employee (like a CISO) or an outsourced service provider, provided they have the necessary expertise."
                },
                {
                    question: "For SEC purposes, determining whether a cybersecurity incident is 'material' requires what kind of analysis?",
                    options: [
                        "A purely financial analysis \u2014 incidents costing more than $1 million are automatically material",
                        "A technical severity analysis \u2014 incidents affecting more than 10% of systems are material",
                        "Both quantitative and qualitative analysis of whether a reasonable investor would consider the information important",
                        "A legal analysis \u2014 only incidents involving criminal activity or regulatory violations are material"
                    ],explanation: "The SEC uses the standard materiality definition from Basic Inc. v. Levinson (1988): information is material if there is a substantial likelihood that a reasonable investor would consider it important in making an investment decision. For cybersecurity, this is inherently both quantitative (financial impact \u2014 costs of remediation, lost revenue, regulatory fines) and qualitative (reputational harm, loss of competitive advantage, data sensitivity, customer impact, likelihood of litigation)."
                }
            ]
        });
        quiz.start();
    </script>
