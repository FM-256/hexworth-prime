<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cyber Framework</a>
        <span class="brand"><span>&#128737;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM01: Legal, Regulatory & Policy Issues Quiz',
            description: '10 questions on cybersecurity law, policy, and foundational concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm01',
            moduleId: 'shield-cf-mm01',
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "The CIA triad in cybersecurity stands for which three core principles?",
                    options: [
                        "Confidentiality, Integrity, Availability",
                        "Control, Identification, Authentication",
                        "Compliance, Inspection, Authorization",
                        "Cryptography, Identity, Access"
                    ],
                    correct: 0,
                    explanation: "The CIA triad — Confidentiality, Integrity, and Availability — is the foundational model of information security. Confidentiality ensures only authorized parties access data. Integrity ensures data is accurate and unaltered. Availability ensures systems and data are accessible when needed. Every security control maps back to protecting one or more of these properties."
                },
                {
                    question: "Which cyber attack was the first publicly confirmed to have caused physical damage to industrial equipment?",
                    options: [
                        "NotPetya (2017)",
                        "WannaCry (2017)",
                        "Stuxnet (2010)",
                        "Mirai Botnet (2016)"
                    ],
                    correct: 2,
                    explanation: "Stuxnet, discovered in 2010, was the first known cyberweapon to cause verifiable physical destruction. It targeted Iranian nuclear centrifuges at the Natanz facility, causing roughly 1,000 centrifuges to spin out of control and destroy themselves while reporting normal status to operators. This crossed a critical threshold by demonstrating that cyber attacks could produce kinetic, real-world damage."
                },
                {
                    question: "Which category of threat actor is characterized by operating like a corporation — complete with HR departments, business models, and profit-sharing structures?",
                    options: [
                        "Nation-state sponsored hackers",
                        "Organized cybercrime groups",
                        "Hacktivists",
                        "Script kiddies"
                    ],
                    correct: 1,
                    explanation: "Modern organized cybercrime groups have evolved into corporate-like entities. Groups like REvil and Conti operated ransomware-as-a-service businesses with profit-sharing (affiliates kept ~70-80%), HR functions for recruiting, technical support desks for victims, and structured management hierarchies. This professionalization makes them significantly more dangerous and persistent than disorganized criminal actors."
                },
                {
                    question: "By volume, what is the primary motive behind the majority of cyber attacks globally?",
                    options: [
                        "Espionage and intelligence gathering",
                        "Ideological or political activism",
                        "Financial gain",
                        "Sabotage of critical infrastructure"
                    ],
                    correct: 2,
                    explanation: "Financial gain drives the overwhelming majority of cyber attacks by volume. This encompasses ransomware, business email compromise (BEC), banking trojans, credit card theft, and fraud. Verizon's annual Data Breach Investigations Reports consistently show financial motives account for 70-80%+ of all breaches. Espionage, while high-profile, represents a smaller absolute number of incidents."
                },
                {
                    question: "Approximately how many unfilled cybersecurity positions exist globally, representing a critical workforce gap?",
                    options: [
                        "Approximately 500,000",
                        "Approximately 1.2 million",
                        "Approximately 3.5 million",
                        "Approximately 10 million"
                    ],
                    correct: 2,
                    explanation: "The global cybersecurity workforce gap is estimated at approximately 3.5 million unfilled positions (ISC2 Cybersecurity Workforce Study). This shortage is not due to lack of interest but to a pipeline problem — educational institutions cannot produce qualified professionals fast enough. The gap creates risk for organizations that cannot staff security teams, making cyber education initiatives like Hexworth Prime critically important."
                },
                {
                    question: "The 'Going Dark' problem refers to which challenge facing law enforcement?",
                    options: [
                        "Cybercriminals operating during nighttime hours to avoid detection",
                        "The inability of law enforcement to access communications due to strong encryption",
                        "Dark web marketplaces that are impossible to shut down",
                        "The difficulty of attributing attacks to nation-state actors"
                    ],
                    correct: 1,
                    explanation: "Going Dark describes the challenge law enforcement faces when lawfully authorized surveillance is defeated by end-to-end encryption. As communications platforms adopt strong encryption by default (Signal, WhatsApp, iMessage), even lawfully obtained court orders cannot compel readable access to content. The FBI and DOJ have used this framing to argue for encryption backdoors, which technologists and privacy advocates strongly oppose as fatally insecure by design."
                },
                {
                    question: "What is hacktivism?",
                    options: [
                        "Hacking into systems for financial profit under corporate direction",
                        "Government-sponsored cyber espionage operations against foreign targets",
                        "The use of cyber attacks to advance political, social, or ideological causes",
                        "Coordinated distributed denial-of-service attacks by criminal organizations"
                    ],
                    correct: 2,
                    explanation: "Hacktivism combines 'hacking' and 'activism' — using cyber techniques to advance political or ideological goals rather than for profit. Anonymous is the most well-known hacktivist collective, targeting organizations perceived as enemies of free speech, government transparency, or social justice. Tactics typically include DDoS attacks, website defacement, and data leaks. Hacktivists occupy a complex legal and ethical space distinct from purely criminal actors."
                },
                {
                    question: "Which scenario best illustrates the tension between security interests and privacy interests?",
                    options: [
                        "Choosing between antivirus software vendors",
                        "Government mass surveillance programs that collect bulk communications metadata",
                        "The debate over which programming language is most secure",
                        "Corporate policies requiring strong passwords"
                    ],
                    correct: 1,
                    explanation: "Mass surveillance programs — exemplified by NSA PRISM, MUSCULAR, and XKeyscore programs revealed by Edward Snowden in 2013 — represent the core security-versus-privacy tension. Governments argue bulk data collection prevents terrorism and serious crime (security interest). Privacy advocates argue this constitutes warrantless surveillance of innocent citizens with chilling effects on free expression (privacy interest). Courts and legislatures continue to struggle with where this line should be drawn."
                },
                {
                    question: "Why is cybersecurity considered 'not just a technical problem'?",
                    options: [
                        "Because most attackers use social engineering rather than technical exploits",
                        "Because antivirus software already solves the technical components",
                        "Because effective security requires law, policy, leadership, ethics, and human behavior alongside technology",
                        "Because the majority of cyber incidents are caused by hardware failures"
                    ],
                    correct: 2,
                    explanation: "Cybersecurity is a sociotechnical challenge. Technical controls alone cannot prevent breaches when employees click phishing links (human behavior), when laws fail to deter attackers or enforce accountability (law/policy), when executives deprioritize security investment (leadership), or when vendors ship insecure products without consequence (regulatory environment). The most secure technology fails in an organization without security culture, proper governance, and appropriate legal frameworks."
                },
                {
                    question: "The Colonial Pipeline ransomware attack of 2021 primarily demonstrated which critical point about cybersecurity?",
                    options: [
                        "That small businesses are the most common target of ransomware",
                        "That attackers only target government networks",
                        "That cyber attacks on critical infrastructure can produce immediate, real-world physical and economic consequences",
                        "That all ransomware attacks are conducted by nation-state actors"
                    ],
                    correct: 2,
                    explanation: "The Colonial Pipeline attack — conducted by the DarkSide ransomware group — caused the largest publicly known disruption of U.S. energy infrastructure, halting 45% of the East Coast's fuel supply for nearly a week. The company paid a $4.4 million ransom. The attack caused fuel shortages, panic buying, and gas station outages across the southeastern U.S. It powerfully demonstrated that attacks on privately owned critical infrastructure have cascading public consequences far beyond the victim organization."
                }
            ]
        });
        quiz.start();
    </script>
