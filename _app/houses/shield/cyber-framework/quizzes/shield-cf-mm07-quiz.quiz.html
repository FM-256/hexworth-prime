    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM07: Data Breach Litigation Quiz',
            description: '10 questions on data breach civil litigation and standing doctrine',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm07',
            moduleId: 'shield-cf-mm07',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "In data breach civil lawsuits, what is typically the most commonly alleged cause of action against the breached organization?",
                    options: [
                        "Strict liability for product defects",
                        "Negligence",
                        "Breach of fiduciary duty",
                        "Intentional infliction of emotional distress"
                    ],explanation: "Negligence is the dominant tort claim in data breach litigation. Plaintiffs allege the organization had a duty to protect their data, breached that duty by failing to implement adequate security measures, which caused their injury. Other common claims include breach of contract (violating privacy policies), unjust enrichment, breach of implied warranty, and statutory claims under state consumer protection laws."
                },
                {
                    question: "What are the four required elements a plaintiff must prove to establish a negligence claim in a data breach lawsuit?",
                    options: [
                        "Intent, knowledge, causation, and financial loss",
                        "Duty, breach, causation, and harm (damages)",
                        "Foreseeability, opportunity, motive, and harm",
                        "Consent, reliance, deception, and injury"
                    ],explanation: "The four elements of negligence are: (1) Duty \u2014 the defendant owed the plaintiff a legal duty of care (courts have generally found that organizations collecting personal data owe a duty to protect it); (2) Breach \u2014 the defendant violated that duty by failing to use reasonable care; (3) Causation \u2014 the breach actually and proximately caused the plaintiff's injury; (4) Harm/Damages \u2014 the plaintiff suffered actual harm."
                },
                {
                    question: "In Clapper v. Amnesty International (2013), the Supreme Court held which principle regarding standing?",
                    options: [
                        "Surveillance victims automatically have standing because surveillance constitutes inherent harm",
                        "Speculative or potential future harm \u2014 even if highly probable \u2014 is insufficient to establish Article III standing",
                        "Non-profit organizations have enhanced standing rights in national security litigation",
                        "The government must disclose surveillance programs before targeted parties can sue"
                    ],explanation: "In Clapper v. Amnesty International (2013), the Supreme Court rejected standing for attorneys, journalists, and human rights organizations who feared the NSA might be surveilling their foreign communications. The Court held that the alleged injury was too speculative \u2014 it required a 'chain of speculative contingencies' before harm would materialize. This ruling became critically important in data breach cases because it established that mere fear of future harm is insufficient."
                },
                {
                    question: "The Economic Loss Doctrine is a barrier to negligence claims in some data breach cases because it holds what?",
                    options: [
                        "Plaintiffs cannot recover economic damages unless they also suffered physical injury",
                        "Companies cannot be held liable for economic losses caused by cybercriminals they did not employ",
                        "Purely economic losses (without accompanying physical harm or property damage) cannot be recovered in a negligence action",
                        "Economic harm that is less than $75,000 is insufficient to create federal jurisdiction"
                    ],explanation: "The Economic Loss Doctrine (ELD), adopted in many states, holds that a plaintiff cannot use a negligence tort claim to recover purely economic losses (financial harm) unaccompanied by physical injury or property damage. In data breach cases, courts in some states have used the ELD to dismiss negligence claims. California and some other states have carved out exceptions for data breach cases."
                },
                {
                    question: "Article III standing requires a plaintiff to demonstrate what three elements?",
                    options: [
                        "Financial harm, legal violation, and intent to continue the violating conduct",
                        "Concrete and particularized injury that is actual or imminent, causation (traceable to defendant), and redressability",
                        "Verified identity theft, documented financial losses, and a police report filed within 30 days",
                        "Membership in the affected class, notice of the breach, and mitigation efforts undertaken"
                    ],explanation: "Article III constitutional standing requires: (1) Injury in fact \u2014 a concrete, particularized injury that is actual or imminent (not conjectural or hypothetical); (2) Causation \u2014 the injury must be fairly traceable to the challenged conduct of the defendant, not some independent action; (3) Redressability \u2014 it must be likely that a favorable court decision will redress the injury."
                },
                {
                    question: "In Remijas v. Neiman Marcus (7th Cir. 2015), the court found plaintiffs had standing. What distinguished this case from Clapper?",
                    options: [
                        "Neiman Marcus had admitted liability, making the harm non-speculative",
                        "Some plaintiffs had already suffered actual fraudulent charges on their compromised cards, making the injury concrete rather than speculative",
                        "The 7th Circuit rejected the Clapper standard as applying only to national security cases",
                        "Federal legislation specifically provided standing for retail data breach victims"
                    ],explanation: "In Remijas v. Neiman Marcus (2015), the 7th Circuit found standing because (1) approximately 9,200 of the 350,000 affected customers had already experienced actual fraudulent charges \u2014 concrete, realized harm; (2) the remaining plaintiffs faced a 'substantial risk' of future fraud that was not speculative but highly probable given their cards were actually compromised; and (3) plaintiffs spent time and money taking protective measures \u2014 'mitigation costs' as cognizable injury."
                },
                {
                    question: "TransUnion LLC v. Ramirez (2021) imposed which important limitation on data breach class actions?",
                    options: [
                        "Class actions involving more than 10,000 plaintiffs must be tried in multiple jurisdictions",
                        "Every member of a plaintiff class must individually demonstrate concrete harm \u2014 not just the named plaintiffs",
                        "Credit reporting agencies are immune from class action suits under the Fair Credit Reporting Act",
                        "Statutory damages in class actions cannot exceed $5,000 per class member"
                    ],explanation: "TransUnion v. Ramirez (2021) was a watershed Supreme Court ruling that significantly limited privacy and data breach class actions. The Court held (5-4) that only plaintiffs with concrete, real-world harm \u2014 not merely technical statutory violations \u2014 have Article III standing. Of 8,185 class members whose FCRA rights were violated, only the ~1,800 whose files were actually provided to third-party businesses had standing."
                },
                {
                    question: "Spokeo, Inc. v. Robins (2016) held which principle about statutory violations and standing?",
                    options: [
                        "Companies that violate federal privacy statutes are automatically liable for $1,000 per violation",
                        "A plaintiff cannot establish concrete injury for Article III standing by alleging a bare procedural or technical statutory violation divorced from any real harm",
                        "Individual plaintiffs have standing to sue for any federal statutory violation regardless of actual harm",
                        "Class certification automatically creates standing for all class members under FRCP Rule 23"
                    ],explanation: "Spokeo v. Robins (2016) held that a 'bare procedural violation' of a statute (here, the FCRA) is not automatically enough for Article III standing \u2014 the violation must result in a concrete, real-world injury, not merely a technical legal wrong. The principle \u2014 bare statutory violations without real harm aren't enough \u2014 has been wielded to defeat countless privacy class actions."
                },
                {
                    question: "In data breach cases involving public companies, what type of claim do shareholders commonly bring?",
                    options: [
                        "RICO (Racketeer Influenced and Corrupt Organizations Act) claims against board members",
                        "Securities class action claims alleging the company made false or misleading statements about its cybersecurity posture",
                        "Derivative suits under state corporate law for breach of the business judgment rule",
                        "Contract claims based on implied warranties of data security in terms of service agreements"
                    ],explanation: "Following major breaches, shareholder securities class actions typically allege violations of Securities Exchange Act Section 10(b) and Rule 10b-5 \u2014 that the company made materially false or misleading statements about its cybersecurity practices, controls, and preparedness before the breach. The SolarWinds SEC enforcement action (2023) added regulatory pressure on top of private securities litigation for companies that overstate their cybersecurity."
                },
                {
                    question: "In a PCI DSS (Payment Card Industry Data Security Standard) breach scenario, which parties bear the direct financial consequences of fraudulent charges?",
                    options: [
                        "The merchant where the breach occurred directly compensates all affected cardholders",
                        "Card brand networks (Visa, Mastercard) absorb all breach-related fraud losses",
                        "Card-issuing banks cover fraudulent charges and issue new cards, then seek to recover costs from the breached merchant or its acquirer through PCI assessments",
                        "Federal Deposit Insurance Corporation (FDIC) covers all breach-related consumer losses up to $250,000"
                    ],explanation: "In a PCI DSS breach: (1) Issuing banks immediately cover fraudulent charges for cardholders (consumer protection) and bear the cost of reissuing compromised cards (~$5-15 per card); (2) Card brand networks assess fines against the breached merchant's acquiring bank; (3) The acquiring bank passes these fines and reissuance costs to the merchant; (4) If the merchant cannot pay, the acquiring bank absorbs the losses."
                }
            ]
        });

    </script>
