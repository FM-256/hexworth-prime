    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM03: CFAA & Data Breach Notification Quiz',
            description: '10 questions on the Computer Fraud and Abuse Act and data breach notification law',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm03',
            moduleId: 'shield-cf-mm03',
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "In what year was the Computer Fraud and Abuse Act (CFAA) enacted by Congress?",
                    options: ["1984", "1986", "1990", "1994"],
                    correct: 1,
                    explanation: "The CFAA was enacted in 1986, amending the earlier Counterfeit Access Device and Computer Fraud and Abuse Act of 1984. It was originally focused on government computers and financial institution computers. The law has been amended multiple times (1988, 1994, 1996, 2001, 2008) to expand its scope and penalties, but its core framework has remained largely unchanged since 1986. It is codified at 18 U.S.C. \u00a7 1030."
                },
                {
                    question: "In Van Buren v. United States (2021), the Supreme Court adopted which interpretation of 'exceeds authorized access' under the CFAA?",
                    options: [
                        "The broad/purpose-based interpretation \u2014 accessing data for improper purposes violates the CFAA",
                        "The narrow/code-based interpretation \u2014 only circumventing technical access restrictions violates the CFAA",
                        "The contract-based interpretation \u2014 violating an employer's acceptable use policy violates the CFAA",
                        "The damage-based interpretation \u2014 only violations causing actual financial harm violate the CFAA"
                    ],
                    correct: 1,
                    explanation: "In Van Buren (2021), the Supreme Court held 6-3 that the CFAA's 'exceeds authorized access' clause only covers situations where someone circumvents code-based restrictions \u2014 i.e., accesses files or databases they are technically prevented from accessing. A police officer who ran a license plate search (authorized to use the database) for personal gain did not 'exceed authorized access' because no technical barrier was circumvented. The Court rejected the broad interpretation that would have criminalized any access that violates an employer policy or terms of service."
                },
                {
                    question: "California was the first state to enact a data breach notification law. In what year did this landmark legislation pass?",
                    options: ["2000", "2002", "2003", "2005"],
                    correct: 2,
                    explanation: "California enacted the first state data breach notification law in 2002 (effective July 2003), codified at California Civil Code \u00a7\u00a7 1798.29 and 1798.82. The law was prompted by a 2001 breach at the California DMV. It required businesses to notify California residents when their unencrypted personal information was acquired by unauthorized persons. This California law became the template for every subsequent state breach notification law in the country."
                },
                {
                    question: "Which state was the last in the United States to enact a data breach notification law?",
                    options: ["South Dakota", "Alabama", "Wyoming", "Mississippi"],
                    correct: 1,
                    explanation: "Alabama enacted its data breach notification law in 2018 (the Alabama Data Breach Notification Act), making it the last state to do so. South Dakota also enacted its law in 2018. This completed the national patchwork \u2014 all 50 states, plus DC, Puerto Rico, and the Virgin Islands, now have breach notification requirements. The variation in these laws (different definitions, timeframes, covered entities, and exemptions) creates significant compliance complexity for organizations operating nationally."
                },
                {
                    question: "The Computer Fraud and Abuse Act is codified at which federal statute number?",
                    options: ["17 U.S.C. \u00a7 1030", "18 U.S.C. \u00a7 1030", "18 U.S.C. \u00a7 2701", "47 U.S.C. \u00a7 230"],
                    correct: 1,
                    explanation: "The CFAA is codified at 18 U.S.C. \u00a7 1030 (Title 18, United States Code, Section 1030). Title 18 is the federal criminal code. Section 2701 (also Title 18) is the Stored Communications Act, which governs government access to stored electronic communications. Section 230 of Title 47 is the Communications Decency Act provision protecting platforms from liability for user-generated content."
                },
                {
                    question: "Under most state breach notification laws, a 'safe harbor' exception applies that can eliminate the notification obligation when which condition is met?",
                    options: [
                        "The breach affected fewer than 500 individuals",
                        "The breached data was encrypted and the encryption key was not also compromised",
                        "The company had a cyber insurance policy in place at the time of the breach",
                        "The breach was discovered by the company's own security team rather than by a third party"
                    ],
                    correct: 1,
                    explanation: "Nearly all state breach notification laws include a safe harbor: if the breached data was encrypted (and the encryption key was not compromised in the same incident), notification is not required because the data is not 'readable' \u2014 and thus poses no harm to the individuals whose data was exposed. This safe harbor creates a powerful incentive for organizations to encrypt data at rest."
                },
                {
                    question: "What four categories of information must breach notification notices generally include under most state laws?",
                    options: [
                        "The attacker's identity, the attack method, the system affected, and the remediation cost",
                        "What happened, what information was involved, what steps are being taken, and what affected individuals can do to protect themselves",
                        "The date of discovery, date of breach, duration of breach, and number of affected individuals",
                        "The CISO's contact information, the breach insurance policy number, a credit monitoring offer, and a legal disclaimer"
                    ],
                    correct: 1,
                    explanation: "Most state breach notification laws and FTC guidance require notices to cover: (1) a description of what happened, (2) what types of personal information were involved, (3) what steps the organization is taking to investigate and prevent future breaches, and (4) what steps affected individuals can take to protect themselves (e.g., credit freeze, fraud alert). Many states also require a contact number for affected individuals to ask questions."
                },
                {
                    question: "Under the Van Buren narrow interpretation, what does it mean to 'exceed authorized access' under the CFAA?",
                    options: [
                        "Using a company computer for any non-work-related purpose",
                        "Accessing any system without a written authorization agreement in place",
                        "Circumventing a technical, code-based restriction to access files or areas one is not technically permitted to access",
                        "Accessing data with knowledge that the data owner would object to the access"
                    ],
                    correct: 2,
                    explanation: "Post-Van Buren, 'exceeds authorized access' means technically bypassing a code-based gate \u2014 accessing files, databases, or system areas that are technically off-limits (e.g., a different user's account, a restricted database partition, a folder you lack permissions for). It does NOT include accessing permitted areas for improper purposes. This narrowing has significant cybersecurity implications: pen testers with permission scopes, employees with broad access, and security researchers occupy safer legal ground than under the broad interpretation."
                },
                {
                    question: "Why does the United States not have a single, unified federal data breach notification law?",
                    options: [
                        "The Constitution prohibits Congress from regulating data privacy",
                        "Ongoing congressional debate over whether a federal law should preempt stronger state protections or establish a national floor",
                        "Federal agencies have determined that state laws are sufficient and no federal law is needed",
                        "The EU's GDPR already applies to all U.S. companies, making a federal law redundant"
                    ],
                    correct: 1,
                    explanation: "The primary obstacle to a federal breach notification law is the preemption debate: consumer advocates and states want a federal law that sets a minimum floor but allows states to maintain stronger protections; industry groups and some legislators want a single uniform federal standard that preempts the patchwork of 50+ state laws. Congress has introduced numerous breach notification bills since 2003, but none have passed."
                },
                {
                    question: "CFAA subsection 18 U.S.C. \u00a7 1030(g) creates what type of legal action?",
                    options: [
                        "A criminal prosecution mechanism for repeat offenders",
                        "A civil cause of action allowing victims to sue attackers for compensatory damages",
                        "An administrative enforcement mechanism for the FTC",
                        "A framework for international extradition of cybercriminals"
                    ],
                    correct: 1,
                    explanation: "Section 1030(g) creates a civil cause of action \u2014 victims of CFAA violations can sue the attacker in federal civil court for compensatory damages and injunctive relief, without waiting for a criminal prosecution. This private right of action is commonly used by companies against employees who misappropriate data upon departure, former business partners who access systems without authorization, and competitors engaged in computer intrusions."
                }
            ]
        });

    </script>
