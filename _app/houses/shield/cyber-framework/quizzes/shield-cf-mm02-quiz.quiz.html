<body>

        <a href="../index.html">&larr; Back to Cyber Framework</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MM02: Government Agencies Quiz',
            description: '10 questions on U.S. government cybersecurity agencies and their roles',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-cf-mm02',
            moduleId: 'shield-cf-mm02',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Which U.S. government entity serves as the lead federal law enforcement agency for investigating cybercrime?",
                    options: [
                        "CISA (Cybersecurity and Infrastructure Security Agency)",
                        "FBI/DOJ (Federal Bureau of Investigation / Department of Justice)",
                        "NSA (National Security Agency)",
                        "US Cyber Command (USCYBERCOM)"
                    ],explanation: "The FBI, operating under the Department of Justice, is the lead federal law enforcement agency for domestic cybercrime investigation. Its Cyber Division investigates computer intrusions, ransomware, intellectual property theft, and cybercrime affecting financial institutions. DOJ prosecutes cybercriminals. CISA focuses on infrastructure protection, NSA on signals intelligence, and USCYBERCOM on military cyber operations."
                },
                {
                    question: "In 2024, NIST released a major update to the Cybersecurity Framework. What version number was released?",
                    options: [
                        "Version 1.2",
                        "Version 1.5",
                        "Version 2.0",
                        "Version 3.0"
                    ],explanation: "NIST released Cybersecurity Framework (CSF) 2.0 in February 2024 — the first major revision since the framework's 2014 release. Version 2.0 added 'Govern' as a sixth core function, expanded the framework's scope beyond critical infrastructure to all organizations, and provided more detailed guidance on supply chain risk management. The original version 1.1 (2018) had added supply chain considerations but kept the same five functions."
                },
                {
                    question: "CISA (Cybersecurity and Infrastructure Security Agency) operates under which federal department?",
                    options: [
                        "Department of Defense (DoD)",
                        "Department of Justice (DOJ)",
                        "Department of Homeland Security (DHS)",
                        "Department of Commerce"
                    ],explanation: "CISA was established in November 2018 under the Department of Homeland Security (DHS) when the Cybersecurity and Infrastructure Security Agency Act was signed into law. CISA absorbed the functions of the former National Protection and Programs Directorate (NPPD) and serves as the nation's risk advisor for critical infrastructure protection against physical and cyber threats. Its mission is civilian-focused, distinct from NSA (intelligence) and USCYBERCOM (military)."
                },
                {
                    question: "NSA's cybersecurity mission is described as defeating adversaries through how many core mission areas?",
                    options: [
                        "3 core mission areas",
                        "5 core mission areas",
                        "7 core mission areas",
                        "10 core mission areas"
                    ],explanation: "The NSA describes its cybersecurity mission through 7 core mission areas: (1) securing National Security Systems, (2) enabling crypto modernization, (3) establishing technical standards, (4) sharing threat intelligence, (5) guiding defensive operations, (6) building a world-class workforce, and (7) operating its own infrastructure securely. NSA's Cybersecurity Directorate (established 2019) coordinates these efforts and publicly shares advisories on nation-state threats."
                },
                {
                    question: "U.S. Cyber Command (USCYBERCOM) is primarily responsible for defending which network?",
                    options: [
                        "The public internet backbone infrastructure",
                        "Civilian federal agency networks (.gov domains)",
                        "The Department of Defense Information Networks (DoDIN)",
                        "State and local government emergency networks"
                    ],explanation: "U.S. Cyber Command's Defend the Nation mission includes three components: defending DoDIN (Department of Defense Information Networks), defending the nation against significant cyber attacks on critical infrastructure, and providing cyber support to combatant commands. USCYBERCOM was established in 2009 under Strategic Command and was elevated to a unified combatant command in 2018. It operates cyber mission force teams for defensive and offensive operations."
                },
                {
                    question: "Presidential Policy Directive 41 (PPD-41) was significant because it established what?",
                    options: [
                        "The authority for NSA to conduct warrantless surveillance",
                        "The federal government's cyber incident response framework defining agency roles",
                        "Mandatory cybersecurity standards for all federal contractors",
                        "The creation of US Cyber Command as a unified combatant command"
                    ],explanation: "PPD-41, issued by President Obama in July 2016, established the United States Cyber Incident Coordination framework. It defined clear agency roles: FBI/USSS lead for threat response (law enforcement), DHS/CISA lead for asset response (helping affected entities), and ODNI lead for intelligence support. This framework formalized interagency coordination during significant cyber incidents and fed into the National Cyber Incident Response Plan (NCIRP)."
                },
                {
                    question: "The National Cyber Incident Response Plan (NCIRP) was first published in which year?",
                    options: [
                        "2013",
                        "2014",
                        "2016",
                        "2018"
                    ],explanation: "The first National Cyber Incident Response Plan (NCIRP) was published in December 2016, implementing the framework established by PPD-41. The NCIRP describes how the federal government coordinates cyber incident response across government, private sector, and international partners. It built upon earlier National Response Framework annexes and formalized the 'three concurrent lines of effort' model: threat response, asset response, and intelligence support."
                },
                {
                    question: "The FTC (Federal Trade Commission) can issue consent orders against companies for deceptive cybersecurity practices under what authority?",
                    options: [
                        "The Computer Fraud and Abuse Act (CFAA)",
                        "Section 5 of the FTC Act, which prohibits unfair or deceptive practices",
                        "HIPAA Security Rule enforcement authority",
                        "The Gramm-Leach-Bliley Act (GLBA) financial privacy provisions"
                    ],explanation: "The FTC's authority to regulate cybersecurity derives from Section 5 of the FTC Act, which prohibits 'unfair or deceptive acts or practices in or affecting commerce.' When a company promises to protect user data (in a privacy policy) but fails to do so, the FTC treats this as a deceptive practice. The 2015 Third Circuit ruling in FTC v. Wyndham confirmed this authority extends to cybersecurity failures. Consent orders (settlements) require companies to implement specified security programs for 20 years."
                },
                {
                    question: "HIRT (CISA Hunt and Incident Response Teams) provide what service to eligible organizations?",
                    options: [
                        "Cybersecurity insurance underwriting and risk assessment",
                        "Onsite incident response assistance at no cost to qualifying entities",
                        "Criminal prosecution of cybercriminals who attack their networks",
                        "Free antivirus software licenses and endpoint protection tools"
                    ],explanation: "CISA's HIRT teams provide free, voluntary onsite and remote incident response assistance to federal agencies, state/local/tribal/territorial governments, and critical infrastructure owners. HIRT teams conduct threat hunting, malware analysis, network forensics, and help organizations contain and remediate incidents. The 'free of charge' nature is important — CISA's mission is to reduce national cyber risk, so they do not charge for these services."
                },
                {
                    question: "The SEC's Crypto Assets and Cyber Unit (formerly Cyber Unit) handles which types of cases?",
                    options: [
                        "Criminal prosecution of ransomware groups and state-sponsored hackers",
                        "Fraudulent cryptocurrency offerings and failures of public companies to disclose material cybersecurity incidents",
                        "Export control violations involving encryption technology",
                        "Patent disputes over cybersecurity software and algorithms"
                    ],explanation: "The SEC's Crypto Assets and Cyber Unit (rebranded from 'Cyber Unit' in 2022) focuses on: (1) fraudulent crypto asset securities offerings (ICO fraud, pump-and-dump schemes), (2) unregistered crypto exchanges, (3) cyber-related securities fraud (market manipulation via hacking), and (4) failures by public companies to maintain adequate cybersecurity controls or disclose material breaches. The unit's enforcement actions against companies like SolarWinds (2023) establish that negligent cybersecurity disclosures violate securities law."
                }
            ]
        });
        quiz.start();
    </script>
