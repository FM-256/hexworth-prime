        <a href="../index.html">&larr; Back to SC-200 Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 9: Sentinel Threat Hunting",
            description: "Test your understanding of hypothesis-driven hunting, KQL hunting queries, bookmarks, livestream, Jupyter notebooks with MSTICPy, threat intelligence integration, and MITRE ATT&CK coverage mapping",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch09-quiz",
            moduleId: "sc200-ch09-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is the starting point of a threat hunting investigation in Microsoft Sentinel?",
                    "options": [
                              "An automated alert from an analytics rule",
                              "A hypothesis based on threat intelligence or MITRE ATT&CK coverage gaps",
                              "A user-reported phishing email",
                              "A failed sign-in attempt in the audit log"
                    ],
                    "explanation": "Threat hunting is proactive and hypothesis-driven. The analyst forms a hypothesis about potential attacker activity -- informed by threat intelligence reports, MITRE ATT&CK coverage gaps, or industry advisories -- and then writes KQL queries to test that hypothesis against log data. This is distinct from reactive alert investigation."
          },
          {
                    "question": "What is the purpose of bookmarks in Sentinel threat hunting?",
                    "options": [
                              "To save browser favorites for Sentinel pages",
                              "To save interesting query results as tagged evidence that can be promoted to incidents",
                              "To schedule recurring hunting queries",
                              "To block malicious IP addresses in the firewall"
                    ],
                    "explanation": "Bookmarks save specific rows from hunting query results along with the query, time range, entity mappings, and analyst notes. Bookmarks can be reviewed in the Hunting > Bookmarks tab, appear as entities in the investigation graph, and can be promoted to incidents when evidence confirms a threat."
          },
          {
                    "question": "How does livestream differ from a scheduled analytics rule in Sentinel?",
                    "options": [
                              "Livestream creates incidents automatically; analytics rules do not",
                              "Livestream is a temporary, interactive real-time monitoring session; analytics rules are permanent scheduled detections that create incidents",
                              "Livestream runs once a day; analytics rules run every minute",
                              "There is no difference -- they are the same feature"
                    ],
                    "explanation": "Livestream is a temporary, interactive monitoring session that runs a KQL query continuously against incoming data and displays matches in real time. It is tied to the analyst's browser session and does not create incidents. Analytics rules are permanent, scheduled detections that run automatically and generate incidents when conditions are met."
          },
          {
                    "question": "When should you use a Jupyter notebook instead of a KQL query for threat hunting?",
                    "options": [
                              "When you need to filter events by timestamp",
                              "When you need advanced statistical analysis, anomaly detection, or custom visualizations beyond what KQL provides",
                              "When you want to create a new analytics rule",
                              "When you need to bookmark query results"
                    ],
                    "explanation": "Jupyter notebooks with MSTICPy extend hunting beyond KQL capabilities. Use notebooks when you need Python-based statistical modeling, machine learning anomaly detection, custom timeline visualizations, process tree analysis, or enrichment from multiple external threat intelligence providers. KQL handles structured log queries; notebooks handle advanced analytics."
          },
          {
                    "question": "What does MSTICPy provide in a Sentinel hunting notebook?",
                    "options": [
                              "A graphical drag-and-drop query builder",
                              "Pre-built Python functions for querying Sentinel data, enriching IOCs with threat intelligence, visualizing timelines, and performing anomaly detection",
                              "A replacement for the KQL query language",
                              "Automated incident response playbooks"
                    ],
                    "explanation": "MSTICPy (Microsoft Threat Intelligence Center Python library) provides purpose-built security analysis functions. It includes data providers for querying Sentinel workspaces, threat intelligence enrichment from multiple sources, timeline visualization, process tree analysis, and anomaly detection -- all callable from within a Jupyter notebook."
          },
          {
                    "question": "Which KQL table contains threat intelligence indicators imported into Sentinel?",
                    "options": [
                              "SecurityEvent",
                              "SigninLogs",
                              "ThreatIntelligenceIndicator",
                              "DeviceProcessEvents"
                    ],
                    "explanation": "The ThreatIntelligenceIndicator table stores all indicators of compromise (IOCs) imported from connected threat intelligence sources -- TAXII feeds, Microsoft Defender Threat Intelligence (MDTI), and manual uploads. Hunting queries join this table with log tables to find matches between known-bad indicators and activity in your environment."
          },
          {
                    "question": "How do you convert a successful hunting query into continuous automated detection?",
                    "options": [
                              "Save it as a bookmark",
                              "Create a scheduled analytics rule from the hunting query",
                              "Run it in livestream mode permanently",
                              "Export it as a CSV file"
                    ],
                    "explanation": "When a hunting query consistently identifies true threats, you promote it to a scheduled analytics rule. In the hunting dashboard, click 'New alert rule' > 'Create Microsoft Sentinel alert' to convert the query into a rule that runs automatically on a schedule and generates incidents. This closes the loop from manual hunting to automated detection."
          },
          {
                    "question": "What does the MITRE ATT&CK blade in Sentinel show?",
                    "options": [
                              "A list of all active incidents sorted by severity",
                              "A heatmap of detection coverage per MITRE ATT&CK technique, showing which techniques have analytics rules and which are blind spots",
                              "A real-time feed of attacker activity",
                              "The complete MITRE ATT&CK knowledge base documentation"
                    ],
                    "explanation": "The MITRE ATT&CK blade displays a heatmap where each cell represents a technique. Darker cells indicate more analytics rules cover that technique. White or empty cells represent blind spots with no detection coverage. Analysts use these gaps to prioritize hunting queries and fill detection holes."
          },
          {
                    "question": "What must be configured on a bookmark for it to appear in the Sentinel investigation graph?",
                    "options": [
                              "A severity level",
                              "Entity mappings that identify accounts, hosts, IPs, or other entity types in the bookmarked data",
                              "A MITRE ATT&CK tactic tag",
                              "An automation rule trigger"
                    ],
                    "explanation": "Entity mapping is required for bookmarks to appear in the investigation graph. Entity mappings tell Sentinel which columns in the bookmarked data represent accounts, hosts, IPs, URLs, or other entity types. Without entity mappings, bookmarks are saved as raw data rows that cannot be linked to other entities visually."
          },
          {
                    "question": "You are investigating an active compromise and need to see attacker actions as new events arrive. Which Sentinel feature should you use?",
                    "options": [
                              "A workbook with auto-refresh",
                              "Livestream to run a hunting query continuously against incoming data in real time",
                              "A scheduled analytics rule with a 5-minute frequency",
                              "The incident timeline view"
                    ],
                    "explanation": "Livestream runs a hunting query continuously against incoming data and displays matches as they arrive in real time. It is designed for active incident response where you need immediate visibility into attacker actions. The session runs every 30 seconds and shows results interactively in the Sentinel portal."
          },
          {
                    "question": "What are watchlists used for in Sentinel hunting?",
                    "options": [
                              "Monitoring Azure resource health",
                              "Storing reference data (CSV) like VIP users, critical assets, or allowed IPs that can be joined with log tables in KQL queries",
                              "Tracking incident assignment and SLA compliance",
                              "Scheduling automated playbook runs"
                    ],
                    "explanation": "Watchlists are uploaded reference tables (CSV format) stored in Sentinel. They are queried with _GetWatchlist('name') in KQL and joined with log tables to enrich hunting results. Common uses include excluding known-good IPs from hunting results, flagging VIP accounts for priority investigation, and defining high-value asset lists."
          },
          {
                    "question": "Which threat intelligence connector format does Sentinel support for importing external TI feeds?",
                    "options": [
                              "RSS feeds only",
                              "STIX/TAXII 2.0 and 2.1",
                              "YARA rules only",
                              "Syslog CEF format"
                    ],
                    "explanation": "Sentinel supports TAXII (Trusted Automated eXchange of Intelligence Information) connectors using STIX (Structured Threat Information eXpression) format versions 2.0 and 2.1. This is the industry standard for sharing threat intelligence indicators. Sentinel also supports Microsoft Defender Threat Intelligence (MDTI) and custom indicator uploads via API."
          }
]
        });
        quiz.start();
    </script>
