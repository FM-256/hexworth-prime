<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 3: Microsoft Defender for Office 365",
            description: "Test your understanding of Safe Attachments, Safe Links, anti-phishing policies, Threat Explorer, ZAP, attack simulation training, and automated investigation for email",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch03-quiz",
            moduleId: "sc200-ch03-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What does Safe Attachments do when it encounters a suspicious email attachment?",
                    "options": [
                              "Encrypts the attachment before delivery",
                              "Opens the attachment in a sandbox (detonation chamber) to analyze it for malicious behavior",
                              "Sends the attachment back to the sender for verification",
                              "Converts the attachment to PDF format"
                    ],
                    "explanation": "Safe Attachments opens email attachments in a virtual sandbox (detonation chamber) where the file is executed and monitored for malicious behavior such as process injection, C2 callbacks, and file system modifications. This detects zero-day malware that signature-based scanning would miss."
          },
          {
                    "question": "Which Safe Attachments policy action delivers the message body immediately while scanning the attachment?",
                    "options": [
                              "Block",
                              "Monitor",
                              "Replace",
                              "Dynamic Delivery"
                    ],
                    "explanation": "Dynamic Delivery delivers the email body to the recipient immediately with a placeholder for the attachment. Once the sandbox scan completes, the placeholder is replaced with the clean attachment or removed if malicious. This avoids delivery delays while maintaining protection."
          },
          {
                    "question": "What is the primary protection mechanism of Safe Links?",
                    "options": [
                              "Blocking all URLs in email messages",
                              "URL rewriting and time-of-click verification that checks URL reputation when the user clicks",
                              "Removing all hyperlinks from email messages",
                              "Scanning URLs only at the time of email delivery"
                    ],
                    "explanation": "Safe Links rewrites URLs in email to route through the Microsoft filtering service and verifies the URL reputation at the moment the user clicks. This protects against weaponized URLs -- URLs that are clean at delivery time but become malicious later."
          },
          {
                    "question": "Which services does Safe Links protect beyond email messages?",
                    "options": [
                              "Only Exchange Online email",
                              "Microsoft Teams, Office desktop apps (Word, Excel, PowerPoint), and Office for the web",
                              "Only SharePoint Online",
                              "Only third-party email clients"
                    ],
                    "explanation": "Safe Links protection extends beyond email to Microsoft Teams messages, Office desktop applications (Word, Excel, PowerPoint), and Office for the web. URLs in Teams chats are scanned at click time the same way email URLs are scanned."
          },
          {
                    "question": "What is the maximum number of protected users that can be configured per anti-phishing policy for impersonation detection?",
                    "options": [
                              "50",
                              "100",
                              "250",
                              "350"
                    ],
                    "explanation": "Each anti-phishing policy supports up to 350 protected users for user impersonation detection. These are typically high-value targets such as executives, finance personnel, and HR directors whose identities are commonly impersonated in BEC attacks."
          },
          {
                    "question": "What does mailbox intelligence do in anti-phishing policies?",
                    "options": [
                              "Encrypts all outbound email from the mailbox",
                              "Uses AI to learn each user's communication patterns and flags messages from senders that break established patterns",
                              "Automatically deletes spam from the mailbox",
                              "Monitors mailbox storage quotas"
                    ],
                    "explanation": "Mailbox intelligence uses per-user AI models to learn each user's communication graph -- who they email frequently, typical senders, expected domains. When a message arrives from a sender that appears to impersonate a known contact but breaks established patterns, it is flagged. This significantly reduces false positives in impersonation detection."
          },
          {
                    "question": "What are the phishing email threshold levels available in anti-phishing policies?",
                    "options": [
                              "Low, Medium, High",
                              "1 (Standard), 2 (Aggressive), 3 (More Aggressive), 4 (Most Aggressive)",
                              "Basic, Enhanced, Premium",
                              "Disabled, Enabled, Strict"
                    ],
                    "explanation": "Anti-phishing policies provide four threshold levels: 1 (Standard), 2 (Aggressive), 3 (More Aggressive), and 4 (Most Aggressive). Higher levels catch more phishing but may increase false positives. The Standard preset uses level 2 and the Strict preset uses level 4."
          },
          {
                    "question": "How does ZAP for spam differ from ZAP for malware and phishing?",
                    "options": [
                              "ZAP for spam is faster",
                              "ZAP for spam only acts on unread messages, while ZAP for malware and phishing act on both read and unread messages",
                              "ZAP for spam quarantines messages while others move to Junk",
                              "ZAP for spam cannot be configured"
                    ],
                    "explanation": "ZAP for spam only moves unread messages to the Junk Email folder -- if the user has already read the message, ZAP for spam will not move it. ZAP for malware and ZAP for phishing quarantine both read and unread messages, providing stronger protection for these higher-severity threats."
          },
          {
                    "question": "How many days of email data does Threat Explorer (Plan 2) retain?",
                    "options": [
                              "7 days",
                              "14 days",
                              "30 days",
                              "90 days"
                    ],
                    "explanation": "Threat Explorer in Defender for Office 365 Plan 2 provides access to 30 days of email data. It supports pivoting by sender, recipient, subject, delivery action, detection technology, URL, and attachment hash. The Plan 1 subset (Real-Time Detections) is limited to 7 days."
          },
          {
                    "question": "What is the key difference between Threat Explorer (P2) and Real-Time Detections (P1)?",
                    "options": [
                              "They are identical features with different names",
                              "Threat Explorer has 30 days of data and supports bulk remediation; Real-Time Detections has 7 days and no bulk remediation",
                              "Real-Time Detections is more powerful than Threat Explorer",
                              "Threat Explorer only shows malware while Real-Time Detections shows all threats"
                    ],
                    "explanation": "Threat Explorer (Plan 2) provides 30 days of data, full pivot capabilities, and supports bulk remediation actions (soft delete, hard delete, move to Junk across all affected mailboxes). Real-Time Detections (Plan 1) is a subset with only 7 days of data and no bulk remediation support."
          },
          {
                    "question": "Which attack simulation types are available in Attack Simulation Training?",
                    "options": [
                              "Only credential harvest",
                              "Credential harvest, malware attachment, link in attachment, link to malware, and drive-by URL",
                              "Only phishing and ransomware",
                              "DDoS, SQL injection, and cross-site scripting"
                    ],
                    "explanation": "Attack Simulation Training supports five social engineering techniques: credential harvest (fake login page), malware attachment (simulated malicious file), link in attachment (URL inside an attached document), link to malware (direct malware download URL), and drive-by URL (compromised website). Each mimics a real attack technique."
          },
          {
                    "question": "What happens to simulated phishing emails with respect to Safe Links and Safe Attachments?",
                    "options": [
                              "They are blocked like real phishing emails",
                              "They bypass Safe Links and Safe Attachments so they reach users realistically",
                              "They are flagged with a simulation banner",
                              "They are only delivered to IT administrators"
                    ],
                    "explanation": "Simulated phishing emails from Attack Simulation Training bypass Safe Links and Safe Attachments scanning by design. This ensures the simulation emails reach users realistically so the organization can accurately measure user susceptibility to real-world phishing attacks."
          },
          {
                    "question": "What triggers an automated investigation (AIR) for email in Defender for Office 365?",
                    "options": [
                              "Only manual administrator action",
                              "A user reporting phishing, ZAP quarantining a message, admin trigger from Threat Explorer, or a high-confidence phishing alert",
                              "Only when a virus is detected in an attachment",
                              "Only during scheduled scans"
                    ],
                    "explanation": "AIR for email can be triggered by: a user reporting a phishing message via the Report Message button, ZAP quarantining a delivered message, an administrator triggering investigation from Threat Explorer, or a high-confidence phishing alert firing. Each trigger starts the automated investigation playbook."
          },
          {
                    "question": "Which preset security policy priority order is correct (highest to lowest)?",
                    "options": [
                              "Built-in Protection > Standard > Strict",
                              "Custom > Strict > Standard > Built-in Protection",
                              "Strict > Standard > Custom > Built-in Protection",
                              "Standard > Strict > Custom > Built-in Protection"
                    ],
                    "explanation": "The priority order from highest to lowest is: Strict preset > Standard preset > Custom policies > Built-in Protection. Higher-priority policies are evaluated first. Built-in Protection is always the lowest priority and serves as the fallback for users not covered by any other policy."
          },
          {
                    "question": "When AIR for email investigates a user-reported phishing message, what does it do with similar messages across the organization?",
                    "options": [
                              "It only investigates the single reported message",
                              "It expands scope to find all similar messages (same sender, URL, or attachment hash) across all mailboxes and recommends organization-wide remediation",
                              "It forwards the report to Microsoft for manual review",
                              "It blocks the sender for the reporting user only"
                    ],
                    "explanation": "When AIR investigates a reported message, it automatically expands scope to identify all related messages across the organization -- matching by sender, URL, and attachment hash. It determines how many mailboxes received the same threat, checks for user clicks, and recommends bulk remediation actions in the Action Center."
          }
]
        });
        quiz.start();
    </script>
</body>
</html>
