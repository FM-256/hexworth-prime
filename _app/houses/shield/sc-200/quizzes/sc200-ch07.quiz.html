<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 7: Configure Detections in Microsoft Sentinel",
            description: "Test your knowledge of KQL analytics rules, scheduled and NRT detections, Fusion correlation, watchlists, entity mapping, and alert grouping in Microsoft Sentinel",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch07-quiz",
            moduleId: "sc200-ch07-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "Which type of Sentinel analytics rule provides sub-minute detection latency?",
                    "options": [
                              "Scheduled analytics rule",
                              "Near-Real-Time (NRT) analytics rule",
                              "Fusion rule",
                              "Microsoft Security rule"
                    ],
                    "explanation": "Near-Real-Time (NRT) analytics rules run approximately every 60 seconds with a 14-minute overlapping lookback window. They provide the fastest detection latency in Sentinel. Scheduled rules run at configurable intervals (minimum 5 minutes). Fusion rules process asynchronously using ML. Microsoft Security rules import alerts from other Defender products."
          },
          {
                    "question": "What is the minimum query frequency you can set for a scheduled analytics rule in Sentinel?",
                    "options": [
                              "1 minute",
                              "5 minutes",
                              "15 minutes",
                              "1 hour"
                    ],
                    "explanation": "The minimum frequency for a scheduled analytics rule is 5 minutes. If you need faster detection (sub-minute), use an NRT rule instead. The lookback period must be at least as long as the frequency to avoid gaps in detection coverage. Common configurations pair 5-minute frequency with 15-minute lookback."
          },
          {
                    "question": "What does the Fusion rule in Microsoft Sentinel use to detect multi-stage attacks?",
                    "options": [
                              "Static correlation rules written in KQL",
                              "Machine learning algorithms that correlate low-fidelity signals across multiple sources",
                              "Signature-based pattern matching from threat intelligence feeds",
                              "Manual incident linking by SOC analysts"
                    ],
                    "explanation": "The Fusion rule uses machine learning to correlate low-fidelity alerts and anomalous signals from multiple data sources (Microsoft Entra ID Protection, Defender products, Sentinel scheduled rules, third-party firewalls) into high-confidence multi-stage attack detections. It cannot be modified but can be enabled or disabled."
          },
          {
                    "question": "Which KQL function retrieves rows from a Sentinel watchlist for use in a query?",
                    "options": [
                              "GetWatchlist()",
                              "_GetWatchlist()",
                              "watchlist.load()",
                              "sentinel_watchlist()"
                    ],
                    "explanation": "The _GetWatchlist('AliasName') function retrieves all rows from a named watchlist as a table that can be joined, filtered, or projected in KQL. The underscore prefix indicates it is a Sentinel-specific function. Watchlists are stored in the Log Analytics workspace and support CSV upload or Azure Storage integration."
          },
          {
                    "question": "A scheduled rule fires 50 times per day for the same attacker IP targeting different accounts. What feature reduces this alert noise?",
                    "options": [
                              "Increasing the query threshold",
                              "Disabling the rule during business hours",
                              "Alert grouping with entity-based incident correlation",
                              "Converting the rule to a Fusion detection"
                    ],
                    "explanation": "Alert grouping collapses multiple firings of the same analytics rule into a single incident based on matching entities (IP, account, host) or alert properties within a configurable time window. This reduces noise without losing detection coverage. Increasing the threshold would miss some attacks. Disabling rules creates coverage gaps."
          },
          {
                    "question": "What is the purpose of entity mapping in a Sentinel analytics rule?",
                    "options": [
                              "It maps KQL output columns to Sentinel entity types for investigation enrichment",
                              "It creates a geographic map of alert locations",
                              "It links the rule to a specific data connector",
                              "It assigns the alert to a specific SOC analyst"
                    ],
                    "explanation": "Entity mapping links KQL output columns (e.g., TargetUserName, IpAddress, Computer) to Sentinel entity types (Account, IP, Host, URL, File). This enables the investigation graph, entity pages, entity timeline, and cross-incident entity correlation. Without entity mapping, incidents lack the context needed for efficient investigation."
          },
          {
                    "question": "Which Sentinel entity type would you map the TargetUserName column to in a brute force detection rule?",
                    "options": [
                              "Host",
                              "IP",
                              "Account",
                              "Process"
                    ],
                    "explanation": "TargetUserName represents a user account that is the target of the attack, so it maps to the Account entity type. The Account entity supports Name, UPNSuffix, and SID identifiers. IP maps to source or destination addresses. Host maps to computer names. Process maps to executable information."
          },
          {
                    "question": "What is the key advantage of a watchlist over hardcoding values directly in a KQL query?",
                    "options": [
                              "Watchlists execute queries faster than hardcoded values",
                              "Watchlists can be updated without editing the analytics rule, and multiple rules can reference the same list",
                              "Watchlists automatically block the listed entities",
                              "Watchlists are encrypted while KQL queries are not"
                    ],
                    "explanation": "Watchlists are maintained independently of analytics rules. When you update a watchlist (add or remove entries), all rules referencing that watchlist automatically use the updated data without requiring rule edits. This separation of data from logic simplifies maintenance and ensures consistency across multiple rules that reference the same list."
          },
          {
                    "question": "A Sentinel workspace has scheduled rules, NRT rules, and Fusion enabled. Which rule type can also feed signals into the Fusion detection engine?",
                    "options": [
                              "Only Microsoft Security rules",
                              "Scheduled analytics rules (custom)",
                              "Only third-party firewall rules",
                              "NRT rules exclusively"
                    ],
                    "explanation": "Custom scheduled analytics rules can be configured as signal sources for the Fusion engine. When a scheduled rule fires, its alert can be correlated by Fusion with alerts from Defender products, Entra ID Protection, and third-party sources to detect multi-stage attacks that no single rule would catch alone."
          },
          {
                    "question": "What is the maximum lookback period for a near-real-time (NRT) analytics rule?",
                    "options": [
                              "1 minute",
                              "5 minutes",
                              "14 minutes",
                              "1 hour"
                    ],
                    "explanation": "NRT rules have a fixed 14-minute lookback window. This overlapping window ensures no events are missed between the approximately 60-second execution cycles. The 14-minute lookback is not configurable for NRT rules, unlike scheduled rules where the lookback period is adjustable."
          },
          {
                    "question": "Which analytics rule type imports alerts directly from other Microsoft Defender products without requiring KQL?",
                    "options": [
                              "Scheduled analytics rule",
                              "NRT analytics rule",
                              "Fusion rule",
                              "Microsoft Security rule"
                    ],
                    "explanation": "Microsoft Security rules automatically create Sentinel incidents from alerts generated by Microsoft Defender for Cloud, Defender for Endpoint, Defender for Identity, and other Defender products. No KQL is needed -- you configure filtering by severity, product, or alert name. This ensures Defender alerts flow into the Sentinel incident queue."
          },
          {
                    "question": "When configuring alert grouping, what does the 'group by entities' option do?",
                    "options": [
                              "Groups alerts by the time they were generated",
                              "Merges alerts into one incident when they share the same mapped entity values",
                              "Groups alerts by severity level only",
                              "Sends grouped alerts to different SOC teams"
                    ],
                    "explanation": "Group by entities merges alerts into a single incident when they share matching entity values from the entity mapping configuration. For example, if a brute force rule fires 20 times for the same IP targeting the same account, all 20 alerts are grouped into one incident, reducing the queue from 20 items to 1."
          },
          {
                    "question": "What happens when a scheduled analytics rule query returns results below the configured alert threshold?",
                    "options": [
                              "An informational alert is generated",
                              "The rule is automatically disabled",
                              "No alert is generated for that execution cycle",
                              "The results are sent to the watchlist"
                    ],
                    "explanation": "If the query returns fewer results than the configured threshold, no alert is generated for that execution cycle. The rule continues running at its configured frequency. The threshold prevents alerting on low-volume, expected activity. For example, a threshold of 10 means the rule only fires when 10 or more results are returned."
          },
          {
                    "question": "Which field in a watchlist definition serves as the unique identifier for joining with log data?",
                    "options": [
                              "Watchlist Name",
                              "Watchlist Alias",
                              "SearchKey",
                              "TimeGenerated"
                    ],
                    "explanation": "The SearchKey is the column designated as the primary lookup field when creating a watchlist. It is used for efficient joins between the watchlist and log tables in KQL. For example, a VIP users watchlist might use UPN as the SearchKey to join with SigninLogs on the UserPrincipalName column."
          },
          {
                    "question": "You need to detect attacks that span initial phishing (email), credential theft (identity), and lateral movement (endpoint) in a single correlated incident. Which rule type is best suited?",
                    "options": [
                              "A single scheduled rule querying all three tables",
                              "Three separate NRT rules with manual linking",
                              "The Fusion rule with signals from Defender for Office 365, Entra ID Protection, and Defender for Endpoint",
                              "A watchlist containing known attack patterns"
                    ],
                    "explanation": "Fusion is specifically designed for multi-stage, cross-product attack detection. It uses ML to correlate signals from email (Defender for Office 365), identity (Entra ID Protection), and endpoint (Defender for Endpoint) into a single high-confidence incident. A single scheduled rule cannot efficiently query across all three workloads in real time."
          }
]
        });
        quiz.start();
    </script>
