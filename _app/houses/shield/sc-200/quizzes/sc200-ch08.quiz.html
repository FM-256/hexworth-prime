<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 8: Sentinel Response",
            description: "Test your understanding of automation rules, playbooks, incident management, SOAR capabilities, entity behavior analytics (UEBA), and Jupyter notebooks in Microsoft Sentinel",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch08-quiz",
            moduleId: "sc200-ch08-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is the execution order of automation rules in Microsoft Sentinel?",
                    "options": [
                              "They run in random order based on system load",
                              "They run in numeric order from 1 to 512, with lower numbers executing first",
                              "They run alphabetically by rule name",
                              "They all execute simultaneously in parallel"
                    ],
                    "explanation": "Automation rules are evaluated in numeric order from 1 to 512. Lower-numbered rules execute first and can modify the incident before higher-numbered rules evaluate it. This ordering enables chaining logic: Rule 1 can tag an incident, and Rule 2 can trigger a playbook only if that tag is present."
          },
          {
                    "question": "What technology powers Sentinel playbooks?",
                    "options": [
                              "Azure Functions",
                              "Azure Logic Apps",
                              "Power Automate Desktop",
                              "Azure Automation Runbooks"
                    ],
                    "explanation": "Every Sentinel playbook is an Azure Logic Apps workflow. Logic Apps provides a visual designer, hundreds of connectors for Microsoft and third-party services, and built-in retry and error handling. Sentinel triggers pass incident or alert data as JSON that the Logic Apps workflow consumes."
          },
          {
                    "question": "What authentication method is recommended for Sentinel playbooks to access the Sentinel API?",
                    "options": [
                              "A shared service account with username and password",
                              "An API key stored in the Logic App configuration",
                              "A managed identity with the Microsoft Sentinel Responder role",
                              "OAuth tokens refreshed manually by the SOC team"
                    ],
                    "explanation": "Playbooks should use a managed identity to authenticate to Sentinel and other Azure services. No credentials are stored in the workflow. The managed identity must be granted the Microsoft Sentinel Responder role on the workspace to read and update incidents, add comments, and run response actions."
          },
          {
                    "question": "Which closing classification should an analyst use when an alert is legitimate but the detected activity is expected and authorized?",
                    "options": [
                              "True Positive",
                              "False Positive",
                              "Benign Positive",
                              "Undetermined"
                    ],
                    "explanation": "Benign Positive means the alert correctly detected the activity (it is a true detection), but the activity itself is expected and authorized -- not malicious. For example, a penetration test triggering a brute force alert. The detection worked correctly, but no threat exists. Use this classification to track rule accuracy without inflating false positive counts."
          },
          {
                    "question": "What are the three incident statuses in Microsoft Sentinel?",
                    "options": [
                              "Open, In Progress, Resolved",
                              "New, Active, Closed",
                              "Pending, Assigned, Complete",
                              "Created, Investigating, Archived"
                    ],
                    "explanation": "Sentinel incidents have three statuses: New (created but not yet assigned or investigated), Active (assigned to an analyst and under investigation), and Closed (investigation complete). Closing an incident requires selecting a classification: True Positive, Benign Positive, False Positive, or Undetermined."
          },
          {
                    "question": "What must be enabled manually in Sentinel settings before UEBA anomalies appear?",
                    "options": [
                              "Advanced hunting",
                              "User and Entity Behavior Analytics with at least the Microsoft Entra ID data source selected",
                              "The Fusion analytics rule",
                              "Threat intelligence indicators"
                    ],
                    "explanation": "UEBA is not enabled by default. You must enable it in Sentinel settings and select which data sources to feed it. Microsoft Entra ID is the required minimum data source. Additional sources (Active Directory via Defender for Identity, Azure Activity, SecurityEvent) enrich the behavioral profiles."
          },
          {
                    "question": "What does the UEBA investigation priority score represent?",
                    "options": [
                              "The severity of the most recent alert for that entity",
                              "A score from 0-10 based on anomaly count, severity, and alert association that ranks entities for investigation",
                              "The number of incidents the entity appears in",
                              "The user's access level in the organization"
                    ],
                    "explanation": "The investigation priority score ranges from 0 to 10 per entity. It is calculated based on the number of anomalies detected, the severity of those anomalies, and whether the entity is associated with existing alerts or incidents. Entities with high scores appear at the top of entity lists, directing analyst attention to the most suspicious users and hosts."
          },
          {
                    "question": "What Python library does Microsoft provide for security investigation in Sentinel Jupyter notebooks?",
                    "options": [
                              "pandas",
                              "scikit-learn",
                              "MSTICPy",
                              "TensorFlow"
                    ],
                    "explanation": "MSTICPy (Microsoft Threat Intelligence Center Python) is Microsoft's open-source Python library for security investigation. It provides KQL query helpers to connect to Sentinel workspaces, entity enrichment functions (GeoIP, threat intelligence lookups, Whois), visualization tools (timeline charts, process trees), and data manipulation utilities."
          },
          {
                    "question": "An automation rule is configured to suppress incidents from a specific analytics rule. What happens when that rule fires?",
                    "options": [
                              "The alert is created but the incident is not created",
                              "Both the alert and the incident are blocked completely",
                              "The incident is created but immediately closed as False Positive",
                              "The incident is created but hidden from the queue"
                    ],
                    "explanation": "When an automation rule suppresses incident creation, the underlying alert is still created (it appears in the SecurityAlert table), but no incident is generated from it. This is useful for blocking known false positive patterns quickly while you refine the analytics rule query to eliminate the false positives at the source."
          },
          {
                    "question": "Which action should be automated FIRST when implementing SOAR in Sentinel?",
                    "options": [
                              "Automatically disable user accounts on any high-severity alert",
                              "Enrichment playbooks that add context to incidents without taking destructive actions",
                              "Automatically isolate endpoints on any medium or higher alert",
                              "Automatically close all low-severity incidents"
                    ],
                    "explanation": "Start automation with enrichment playbooks -- adding context to incidents is low-risk and high-value. IP reputation lookups, user details, asset classification. Once enrichment is reliable and trusted, gradually add containment actions with human-in-the-loop approval gates. Automating destructive actions too early risks acting on false positives."
          },
          {
                    "question": "What is the purpose of incident tasks in Sentinel?",
                    "options": [
                              "They automatically execute containment actions",
                              "They provide standardized investigation checklists with titles, descriptions, and completion tracking",
                              "They assign incidents to different SOC tiers",
                              "They schedule follow-up reviews for closed incidents"
                    ],
                    "explanation": "Incident tasks are investigation checklists added to incidents. Each task has a title, description, and completion status. Tasks standardize investigation procedures per incident type: a phishing incident gets different tasks than a brute force incident. They ensure consistent investigation quality regardless of which analyst handles the case."
          },
          {
                    "question": "Which UEBA anomaly type detects when a user's behavior deviates from others in similar roles?",
                    "options": [
                              "Anomalous Logon",
                              "First-Time Activity",
                              "Peer Group Deviation",
                              "Unusual Data Volume"
                    ],
                    "explanation": "Peer Group Deviation compares a user's behavior against their peer group -- users with similar roles, departments, or access patterns. A finance analyst suddenly behaving like an IT administrator is flagged even if the individual actions are not inherently suspicious. This catches compromised accounts using the account for purposes outside its normal role."
          },
          {
                    "question": "What SOC metric measures the time from incident creation to when an analyst first begins investigation?",
                    "options": [
                              "Mean Time to Resolve (MTTR)",
                              "Mean Time to Acknowledge (MTTA)",
                              "Mean Time Between Failures (MTBF)",
                              "Mean Time to Detect (MTTD)"
                    ],
                    "explanation": "Mean Time to Acknowledge (MTTA) measures the time from incident creation to when an analyst first acknowledges it (changes status from New to Active). MTTR measures the time from creation to closure. Both metrics help identify bottlenecks in the SOC response pipeline."
          },
          {
                    "question": "A playbook needs to disable a user account in Microsoft Entra ID and isolate their endpoint via Defender for Endpoint. What concept does this represent?",
                    "options": [
                              "Automation",
                              "Orchestration",
                              "Detection",
                              "Enrichment"
                    ],
                    "explanation": "Orchestration coordinates actions across multiple tools and services from a single trigger. Disabling a user in Entra ID and isolating an endpoint in Defender for Endpoint involves two different services acting in concert. Automation refers to executing a single repeated action. Orchestration implies multi-service coordination."
          },
          {
                    "question": "Where are Sentinel Jupyter notebooks hosted?",
                    "options": [
                              "Directly in the Sentinel workspace storage",
                              "In Azure Machine Learning workspaces",
                              "On the analyst's local machine only",
                              "In Azure Blob Storage"
                    ],
                    "explanation": "Sentinel integrates with Azure Machine Learning to host Jupyter notebooks. Notebooks are launched from the Sentinel portal and persist in the Azure ML workspace. This allows analysts to save investigation state, share notebooks with team members, and resume investigations later. The AML workspace provides compute resources for running Python code."
          }
]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
