        <a href="../index.html">&larr; Back to SC-200 Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 4: Microsoft Defender for Identity",
            description: "Test your understanding of Defender for Identity sensor deployment, credential theft detection, lateral movement paths, security posture assessments, and hybrid identity integration",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch04-quiz",
            moduleId: "sc200-ch04-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is the recommended sensor deployment model for Microsoft Defender for Identity?",
                    "options": [
                              "Standalone sensor on a dedicated server",
                              "Domain controller sensor installed directly on the DC",
                              "Cloud-only sensor with no on-premises component",
                              "Agent installed on each workstation"
                    ],
                    "explanation": "The domain controller sensor is installed directly on the domain controller and is the recommended deployment model. It captures authentication traffic internally without requiring port mirroring or dedicated hardware. Install sensors on ALL domain controllers for complete coverage."
          },
          {
                    "question": "When is a standalone sensor required instead of a DC sensor?",
                    "options": [
                              "When the domain has more than 100 users",
                              "When installing directly on the DC is not possible, such as Server Core or resource-constrained DCs",
                              "When the organization uses Microsoft Entra ID exclusively",
                              "When Kerberos is disabled in the environment"
                    ],
                    "explanation": "The standalone sensor is installed on a dedicated server and requires port mirroring from the domain controller switch to receive traffic. It is used when installing directly on the DC is not possible -- for example, on Server Core installations or when DC resources are too constrained to run the sensor."
          },
          {
                    "question": "In a Pass-the-Hash attack, what does the attacker replay to authenticate?",
                    "options": [
                              "The user plaintext password",
                              "A Kerberos service ticket",
                              "An NTLM password hash captured from memory",
                              "An OAuth refresh token"
                    ],
                    "explanation": "In a Pass-the-Hash attack, the attacker captures an NTLM password hash from a compromised machine's memory (using tools like Mimikatz) and replays that hash to authenticate as the user without knowing the plaintext password. Defender for Identity detects anomalous NTLM authentication patterns that indicate hash reuse."
          },
          {
                    "question": "What does a DCSync attack use to extract password hashes from a domain controller?",
                    "options": [
                              "Brute force against the SAM database",
                              "The Directory Replication Service (DRS) protocol, mimicking DC-to-DC replication",
                              "LDAP injection queries",
                              "Kerberos pre-authentication requests"
                    ],
                    "explanation": "DCSync uses the Directory Replication Service (MS-DRSR) protocol to request password hashes directly from a domain controller -- mimicking legitimate DC-to-DC replication. Defender for Identity alerts when non-DC machines initiate replication requests, since only domain controllers should perform this operation."
          },
          {
                    "question": "What must be rotated to invalidate Golden Tickets after a confirmed attack?",
                    "options": [
                              "All user passwords in the domain",
                              "The KRBTGT account password, rotated twice",
                              "The domain controller machine account password",
                              "The DNS zone signing key"
                    ],
                    "explanation": "Golden Tickets are forged using the KRBTGT account hash. To invalidate all existing forged tickets, the KRBTGT password must be rotated twice -- once to move the current hash to the password history, and a second time to flush the old hash entirely. This revokes all existing Kerberos TGTs domain-wide."
          },
          {
                    "question": "How does Defender for Identity build lateral movement path maps?",
                    "options": [
                              "By scanning network ports on all machines",
                              "By analyzing local admin group memberships, active sessions, and cached credentials across machines",
                              "By querying Microsoft Entra ID for role assignments",
                              "By running vulnerability scans on domain controllers"
                    ],
                    "explanation": "Defender for Identity analyzes local admin group memberships, active user sessions, and cached credentials across all machines to map lateral movement paths. It calculates how many hops separate any compromised standard account from sensitive accounts like Domain Admins."
          },
          {
                    "question": "What is a honeytoken account in Defender for Identity?",
                    "options": [
                              "A service account with elevated privileges for monitoring",
                              "A decoy account that should never be used -- any activity targeting it triggers a high-severity alert",
                              "A shared admin account used by the SOC team",
                              "A temporary account for penetration testing"
                    ],
                    "explanation": "Honeytoken accounts are decoy accounts configured in Defender for Identity that should never be used in production. Any authentication attempt, enumeration query, or other activity targeting a honeytoken triggers an immediate high-severity alert. They provide high-fidelity detection because no legitimate process should reference them."
          },
          {
                    "question": "Which identity posture finding indicates the highest risk for Golden Ticket attacks?",
                    "options": [
                              "Dormant privileged accounts",
                              "LDAP signing not enforced",
                              "KRBTGT password not rotated in over 180 days",
                              "Accounts using DES encryption"
                    ],
                    "explanation": "A stale KRBTGT password increases the window for Golden Ticket attacks. If an attacker compromises the KRBTGT hash, they can forge tickets indefinitely until the password is rotated. Defender for Identity recommends rotating the KRBTGT password at least every 180 days as a security posture assessment."
          },
          {
                    "question": "What is the difference between user risk and sign-in risk in Microsoft Entra ID Identity Protection?",
                    "options": [
                              "User risk measures password complexity; sign-in risk measures network speed",
                              "User risk is the probability the account is compromised; sign-in risk is the probability a specific sign-in is not from the account owner",
                              "User risk applies to admins only; sign-in risk applies to all users",
                              "They are the same measurement with different names"
                    ],
                    "explanation": "User risk represents the probability that an account has been compromised, based on signals like leaked credentials and anomalous behavior over time. Sign-in risk represents the probability that a specific sign-in attempt is not from the legitimate account owner, based on impossible travel, anonymous IP, or malware-linked IP."
          },
          {
                    "question": "Which KQL table in Defender XDR contains on-premises Active Directory sign-in events from Defender for Identity?",
                    "options": [
                              "DeviceLogonEvents",
                              "CloudAppEvents",
                              "IdentityLogonEvents",
                              "EmailEvents"
                    ],
                    "explanation": "The IdentityLogonEvents table contains sign-in events from both on-premises Active Directory (captured by Defender for Identity sensors) and Microsoft Entra ID. It includes authentication method, source device, result, and protocol details for advanced hunting queries."
          },
          {
                    "question": "What type of account does Defender for Identity recommend for the sensor Directory Service account?",
                    "options": [
                              "A standard domain user account",
                              "A Group Managed Service Account (gMSA)",
                              "The built-in Administrator account",
                              "A Microsoft account linked to the tenant"
                    ],
                    "explanation": "A Group Managed Service Account (gMSA) is the recommended account type for the Defender for Identity sensor Directory Service account. gMSAs provide automatic password management and rotation, eliminating the risk of stale service account passwords. The account needs read access to all objects in the domain."
          },
          {
                    "question": "How does Defender for Identity detect Pass-the-Ticket attacks?",
                    "options": [
                              "By scanning endpoint memory for ticket files",
                              "By analyzing Kerberos ticket usage anomalies -- tickets appearing on machines where the original authentication did not occur",
                              "By monitoring DNS query patterns",
                              "By checking firewall logs for unusual ports"
                    ],
                    "explanation": "In a Pass-the-Ticket attack, the attacker steals a Kerberos ticket from one machine and injects it into a session on another machine. Defender for Identity detects this by analyzing Kerberos ticket usage patterns across the network -- identifying tickets being used on machines where the original authentication never occurred."
          },
          {
                    "question": "What is the primary remediation for closing a lateral movement path to sensitive accounts?",
                    "options": [
                              "Disable all user accounts in the domain",
                              "Remove unnecessary local admin rights and enforce tiered administration",
                              "Reinstall all domain controllers",
                              "Migrate all users to cloud-only accounts"
                    ],
                    "explanation": "The primary remediation is removing unnecessary local admin rights and enforcing a tiered administration model where admin accounts only log into dedicated admin workstations. This eliminates cached admin credentials on standard machines, breaking the paths attackers use to hop from compromised accounts to sensitive targets."
          }
]
        });
        quiz.start();
    </script>
