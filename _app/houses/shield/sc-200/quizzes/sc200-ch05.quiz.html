<body>

        <a href="../index.html">&larr; Back to SC-200 Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 5: Microsoft Defender for Cloud Apps",
            description: "Test your understanding of Cloud Discovery, app connectors, session controls, anomaly detection, OAuth governance, file policies, and UEBA",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch05-quiz",
            moduleId: "sc200-ch05-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What type of solution is Microsoft Defender for Cloud Apps?",
                    "options": [
                              "Endpoint Detection and Response (EDR)",
                              "Cloud Access Security Broker (CASB)",
                              "Security Information and Event Management (SIEM)",
                              "Identity Provider (IdP)"
                    ],
                    "explanation": "Microsoft Defender for Cloud Apps is a Cloud Access Security Broker (CASB). It provides visibility into shadow IT, controls access to cloud applications, detects anomalous behavior, and governs OAuth app permissions across SaaS, PaaS, and IaaS environments."
          },
          {
                    "question": "Which Cloud Discovery method provides per-device, per-user visibility without requiring proxy or firewall log uploads?",
                    "options": [
                              "Manual snapshot report",
                              "Automated log upload via log collector",
                              "Defender for Endpoint integration",
                              "CEF Syslog forwarding"
                    ],
                    "explanation": "Defender for Endpoint integration is the recommended Cloud Discovery method because it provides per-device and per-user visibility by analyzing network traffic directly on managed endpoints. It works regardless of whether the user is on the corporate network, VPN, or remote."
          },
          {
                    "question": "What risk score range does the Cloud App Catalog assign to discovered applications?",
                    "options": [
                              "1 to 5",
                              "1 to 10",
                              "0 to 100",
                              "Low, Medium, High"
                    ],
                    "explanation": "The Cloud App Catalog assigns risk scores from 1 to 10 based on over 90 factors including general information, security controls, compliance certifications, and legal factors. Over 31,000 apps are cataloged with detailed risk assessments."
          },
          {
                    "question": "What is the key architectural difference between app connectors and session controls?",
                    "options": [
                              "App connectors are for Microsoft apps; session controls are for third-party apps",
                              "App connectors provide out-of-band API visibility; session controls provide inline real-time enforcement",
                              "App connectors are free; session controls require a premium license",
                              "App connectors work on mobile; session controls only work on desktop"
                    ],
                    "explanation": "App connectors use provider APIs to pull data out-of-band (after the fact). Session controls use a reverse proxy to inspect and enforce policies inline during live user sessions. The exam tests whether you know which approach handles which scenario."
          },
          {
                    "question": "What must be configured in Microsoft Entra ID before Conditional Access App Control session policies can work?",
                    "options": [
                              "A device compliance policy",
                              "A Conditional Access policy that routes sessions to Defender for Cloud Apps",
                              "A custom domain name",
                              "An app registration in Microsoft Entra ID"
                    ],
                    "explanation": "Conditional Access App Control requires a Microsoft Entra ID Conditional Access policy as the trigger mechanism. The Conditional Access policy routes matching user sessions through the Defender for Cloud Apps reverse proxy (*.mcas.ms domain). Without this integration, traffic does not route through the proxy."
          },
          {
                    "question": "Which anomaly detection policy identifies sign-ins from geographically distant locations within an impossible timeframe?",
                    "options": [
                              "Risky sign-in",
                              "Impossible travel",
                              "New country activity",
                              "Unusual admin activity"
                    ],
                    "explanation": "The impossible travel anomaly detection policy detects when a user signs in from two geographically distant locations within a timeframe that makes physical travel impossible. It filters out known VPN IPs and corporate locations to reduce false positives."
          },
          {
                    "question": "What does the UEBA investigation priority score represent in Defender for Cloud Apps?",
                    "options": [
                              "The user's job level in the organization",
                              "A dynamic score (0-100) based on anomalous activities and behavioral deviations",
                              "The number of alerts generated by the user",
                              "The user's compliance training completion rate"
                    ],
                    "explanation": "The investigation priority score is a dynamic score from 0 to 100 that ranks users based on anomalous activities, alert correlations, and behavioral deviations from their learned baselines. Higher scores indicate more suspicious behavior requiring analyst investigation."
          },
          {
                    "question": "Why is OAuth phishing particularly dangerous compared to traditional credential phishing?",
                    "options": [
                              "OAuth phishing is harder to detect by email filters",
                              "OAuth app access persists even after the user resets their password",
                              "OAuth phishing bypasses multi-factor authentication completely",
                              "OAuth phishing only targets administrator accounts"
                    ],
                    "explanation": "Once a user consents to a malicious OAuth app, the attacker has persistent API access through the app's tokens. This access survives password resets because the app's authorization is separate from the user's credentials. App governance in Defender for Cloud Apps can detect and revoke these risky apps."
          },
          {
                    "question": "What happens when a file policy detects a sensitive file shared externally and applies a sensitivity label?",
                    "options": [
                              "The file is deleted permanently",
                              "The label persists even if the file is downloaded and shared outside the organization",
                              "The label is removed when the file leaves SharePoint",
                              "The file is moved to a quarantine folder only"
                    ],
                    "explanation": "When a file policy applies a Microsoft Information Protection sensitivity label, the label persists with the file regardless of where it goes. Even if the file is downloaded and shared outside the organization, the encryption and access controls from the label travel with it."
          },
          {
                    "question": "Which governance action can an activity policy trigger to feed risk information back to Microsoft Entra ID Protection?",
                    "options": [
                              "Suspend user",
                              "Confirm user compromised",
                              "Block IP address",
                              "Quarantine device"
                    ],
                    "explanation": "The 'Confirm user compromised' governance action marks the user as compromised in Microsoft Entra ID Protection. This raises the user's risk level, which can trigger additional Conditional Access policies such as requiring password reset or blocking access entirely."
          },
          {
                    "question": "How many factors does the Cloud App Catalog evaluate when calculating an app's risk score?",
                    "options": [
                              "10 factors",
                              "25 factors",
                              "Over 90 factors",
                              "Over 200 factors"
                    ],
                    "explanation": "The Cloud App Catalog evaluates over 90 risk factors across four categories: general information, security controls, compliance certifications, and legal considerations. These factors determine the app's risk score from 1 to 10."
          },
          {
                    "question": "What is the primary benefit of using Defender for Endpoint to block unsanctioned cloud apps?",
                    "options": [
                              "It is cheaper than firewall-based blocking",
                              "It enforces blocks at the device level regardless of network location (on-prem, VPN, remote)",
                              "It blocks apps faster than other methods",
                              "It only blocks apps on managed mobile devices"
                    ],
                    "explanation": "When Defender for Endpoint enforces app blocks via network protection, the block applies at the device level. This means unsanctioned apps are blocked whether the user is on the corporate network, connected via VPN, or working remotely on an unmanaged network."
          }
]
        });
        quiz.start();
    </script>
