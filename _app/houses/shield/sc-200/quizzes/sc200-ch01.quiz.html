<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 1: Mitigate Threats Using Microsoft Defender XDR",
            description: "Test your understanding of the Defender XDR portal, incident management, AIR, advanced hunting with KQL, threat analytics, and response actions",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch01-quiz",
            moduleId: "sc200-ch01-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is the primary URL for the Microsoft Defender XDR unified portal?",
                    "options": [
                              "portal.azure.com",
                              "security.microsoft.com",
                              "admin.microsoft.com",
                              "compliance.microsoft.com"
                    ],
                    "explanation": "The Microsoft Defender XDR unified portal is accessed at security.microsoft.com. It combines Defender for Endpoint, Defender for Identity, Defender for Office 365, and Defender for Cloud Apps into a single console with one incident queue."
          },
          {
                    "question": "What is the key difference between an alert and an incident in Defender XDR?",
                    "options": [
                              "Alerts are more severe than incidents",
                              "An incident is a correlated group of related alerts representing a full attack story",
                              "Incidents are generated by users while alerts are automated",
                              "Alerts contain more detail than incidents"
                    ],
                    "explanation": "An alert is a single detection from one Defender product. An incident is a correlated group of related alerts that together represent a complete attack narrative. Defender XDR uses AI to automatically group alerts belonging to the same attack into one incident."
          },
          {
                    "question": "Which tab in an incident provides a chronological timeline of all alerts and entities?",
                    "options": [
                              "Evidence tab",
                              "Assets tab",
                              "Attack Story tab",
                              "Alerts tab"
                    ],
                    "explanation": "The Attack Story tab provides the chronological timeline view showing all alerts and entities in order of occurrence. It is the recommended starting point for every incident investigation because it shows the full attack chain from initial access to impact."
          },
          {
                    "question": "What does AIR stand for in Microsoft Defender XDR?",
                    "options": [
                              "Advanced Incident Reporting",
                              "Automated Investigation and Response",
                              "Alert Integration and Remediation",
                              "Active Incident Resolution"
                    ],
                    "explanation": "AIR stands for Automated Investigation and Response. AIR uses security playbooks to automatically investigate alerts, determine verdicts for entities (Malicious, Suspicious, Clean), and propose or execute remediation actions depending on the automation level."
          },
          {
                    "question": "In AIR, what are the three automation levels that can be configured per device group?",
                    "options": [
                              "Basic, Standard, Premium",
                              "Full, Semi, No automated response",
                              "Low, Medium, High",
                              "Manual, Assisted, Automatic"
                    ],
                    "explanation": "The three automation levels are: Full (all remediation actions auto-executed), Semi (requires analyst approval for specific action types), and No automated response (AIR investigates but takes no remediation action). These are configured per device group in Defender for Endpoint settings."
          },
          {
                    "question": "Where do pending AIR actions that require analyst approval appear?",
                    "options": [
                              "The Alerts queue",
                              "The Action Center",
                              "The Secure Score dashboard",
                              "The Threat Analytics page"
                    ],
                    "explanation": "The Action Center is the central hub for all pending and completed remediation actions. When AIR is set to semi-automation, actions requiring analyst approval appear in the Action Center Pending tab. Analysts review and approve or reject each action."
          },
          {
                    "question": "Which query language is used for advanced hunting in Defender XDR?",
                    "options": [
                              "SQL",
                              "PowerShell",
                              "Kusto Query Language (KQL)",
                              "Python"
                    ],
                    "explanation": "Advanced hunting uses Kusto Query Language (KQL), a pipe-based query language. KQL queries start with a table name, then chain operators like where (filter), project (select columns), summarize (aggregate), and join (combine tables). Data flows left to right through the pipe chain."
          },
          {
                    "question": "How many days of raw telemetry data does advanced hunting retain?",
                    "options": [
                              "7 days",
                              "14 days",
                              "30 days",
                              "90 days"
                    ],
                    "explanation": "Advanced hunting provides access to 30 days of raw telemetry data across endpoints, email, identity, and cloud apps. This data can be queried using KQL to proactively hunt for threats that may not have triggered automated alerts."
          },
          {
                    "question": "Which advanced hunting table contains email delivery and sender information?",
                    "options": [
                              "DeviceEvents",
                              "IdentityLogonEvents",
                              "EmailEvents",
                              "CloudAppEvents"
                    ],
                    "explanation": "The EmailEvents table contains all email activity including sender, recipient, subject, delivery action, and detection details. Related tables include EmailAttachmentInfo for attachments, EmailUrlInfo for URLs, and EmailPostDeliveryEvents for post-delivery actions like ZAP."
          },
          {
                    "question": "What happens when you save an advanced hunting query as a custom detection rule?",
                    "options": [
                              "It runs once and generates a report",
                              "It runs on a schedule and automatically generates alerts when results are found",
                              "It replaces the default detection engine",
                              "It is shared to the community library"
                    ],
                    "explanation": "Custom detection rules run saved KQL queries on a schedule (every 1, 3, 12, or 24 hours). When the query returns results, it automatically generates alerts and can trigger response actions. This turns proactive hunting into automated, recurring detection."
          },
          {
                    "question": "What does threat analytics automatically check for each report?",
                    "options": [
                              "Whether your firewall rules are current",
                              "Whether your organization is exposed to the specific threat and how many devices are vulnerable",
                              "Whether your security team has completed training",
                              "Whether your backup policies are configured"
                    ],
                    "explanation": "Threat analytics automatically assesses your environment against each active threat campaign. It shows the number of vulnerable devices, devices with mitigations applied, impacted mailboxes, and provides recommended mitigation steps with direct links to remediation actions."
          },
          {
                    "question": "Which response action cuts network access to a device while maintaining Defender for Endpoint connectivity?",
                    "options": [
                              "Disable device",
                              "Quarantine device",
                              "Isolate device",
                              "Wipe device"
                    ],
                    "explanation": "Device isolation blocks all inbound and outbound network traffic on the device while preserving the Defender for Endpoint management channel. This prevents lateral movement from a compromised device while allowing the SOC team to continue investigating and remediating remotely."
          },
          {
                    "question": "Which Defender XDR product provides Cloud Access Security Broker (CASB) capabilities?",
                    "options": [
                              "Defender for Endpoint",
                              "Defender for Identity",
                              "Defender for Office 365",
                              "Defender for Cloud Apps"
                    ],
                    "explanation": "Defender for Cloud Apps is the CASB component. It discovers shadow IT, controls app access, monitors user activity in SaaS applications, provides session policies for conditional access to cloud apps, and manages OAuth app permissions across the organization."
          },
          {
                    "question": "What does Microsoft Secure Score measure?",
                    "options": [
                              "The number of incidents resolved this month",
                              "A numerical representation of the organization security posture based on implemented controls",
                              "The speed of incident response",
                              "The total number of devices protected"
                    ],
                    "explanation": "Microsoft Secure Score is a numerical measurement of security posture. It evaluates your tenant configuration against hundreds of security best practices, assigning points for each implemented recommendation. Higher scores indicate more security controls are in place."
          },
          {
                    "question": "Which Defender XDR product monitors on-premises Active Directory for credential theft and lateral movement?",
                    "options": [
                              "Defender for Endpoint",
                              "Defender for Identity",
                              "Defender for Office 365",
                              "Defender for Cloud Apps"
                    ],
                    "explanation": "Defender for Identity monitors on-premises Active Directory signals to detect lateral movement, credential theft (such as pass-the-hash and pass-the-ticket), reconnaissance activities, and compromised identities. It integrates with Microsoft Entra ID Protection for hybrid identity threat detection."
          }
]
        });
        quiz.start();
    </script>
