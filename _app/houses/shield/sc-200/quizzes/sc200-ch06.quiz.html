<body>

        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 6: Configure Microsoft Sentinel",
            description: "Test your understanding of Log Analytics workspace setup, data connectors, Content Hub solutions, analytics rules, workspace architecture, and cost management",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch06-quiz",
            moduleId: "sc200-ch06-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What Azure resource must be created before Microsoft Sentinel can be enabled?",
                    "options": [
                              "Azure Key Vault",
                              "Azure Virtual Network",
                              "Log Analytics workspace",
                              "Azure Storage Account"
                    ],
                    "explanation": "Microsoft Sentinel runs on top of an Azure Log Analytics workspace. All ingested data is stored as tables in the workspace and queried using KQL. You must create or designate a Log Analytics workspace before enabling Sentinel."
          },
          {
                    "question": "Which of these data sources is free to ingest into Microsoft Sentinel?",
                    "options": [
                              "Windows Security Events",
                              "Azure Activity logs",
                              "Syslog from Linux servers",
                              "CEF logs from firewalls"
                    ],
                    "explanation": "Azure Activity logs, Office 365 audit logs, and alerts from Microsoft security products are free to ingest into Sentinel. Windows Security Events, Syslog, and CEF data are billed at standard ingestion rates (Pay-As-You-Go or Commitment Tier)."
          },
          {
                    "question": "What is the key difference between CEF and Syslog data connectors in Sentinel?",
                    "options": [
                              "CEF is for Windows devices; Syslog is for Linux devices",
                              "CEF lands in CommonSecurityLog with structured fields; Syslog lands in the Syslog table with the message as a single string",
                              "CEF is free to ingest; Syslog is not",
                              "CEF uses HTTPS; Syslog uses TCP only"
                    ],
                    "explanation": "CEF (Common Event Format) messages use Syslog as the transport layer but add structured key-value pair fields. CEF data lands in the CommonSecurityLog table with parsed columns like DeviceVendor and DeviceProduct. Raw Syslog lands in the Syslog table with the message as a single unparsed string."
          },
          {
                    "question": "What does a Content Hub solution include?",
                    "options": [
                              "Only data connectors",
                              "Only analytics rules",
                              "A bundled package of data connectors, analytics rule templates, workbooks, hunting queries, and playbooks",
                              "Only workbooks and dashboards"
                    ],
                    "explanation": "A Content Hub solution is a packaged bundle of related content for a specific product or scenario. Solutions can include data connectors, analytics rule templates, workbooks (dashboards), hunting queries, playbooks (Logic Apps), watchlists, parsers, and notebook templates."
          },
          {
                    "question": "In a scheduled analytics rule, what happens if the lookup period is shorter than the run frequency?",
                    "options": [
                              "The rule runs faster",
                              "Events in the gap between lookback and frequency are never evaluated, creating a detection blind spot",
                              "The rule automatically adjusts the lookup period",
                              "The rule fails to save"
                    ],
                    "explanation": "If the lookup period is shorter than the run frequency, there is a time gap where events are never evaluated by the rule. For example, running every 5 minutes but looking back only 3 minutes leaves a 2-minute blind spot. The lookup period must be >= the run frequency."
          },
          {
                    "question": "Which analytics rule type runs every minute and is designed for high-priority detections?",
                    "options": [
                              "Scheduled",
                              "Fusion",
                              "Near Real-Time (NRT)",
                              "ML Behavior Analytics"
                    ],
                    "explanation": "Near Real-Time (NRT) rules run every minute with a 14-minute lookback. They are designed for high-priority detections where speed matters, such as detecting known-bad indicators. NRT rules use simplified KQL -- no joins, no external data, limited operators."
          },
          {
                    "question": "What does the Fusion analytics rule type use to detect threats?",
                    "options": [
                              "Static signature matching",
                              "Machine learning to correlate low-fidelity alerts from multiple sources into multi-stage attack detections",
                              "Regularly scheduled KQL queries",
                              "External threat intelligence feeds only"
                    ],
                    "explanation": "Fusion uses machine learning to correlate low-fidelity alerts from multiple data sources into high-confidence multi-stage attack detections. It automatically identifies kill chain patterns like reconnaissance followed by exploitation followed by exfiltration without manual rule writing."
          },
          {
                    "question": "When is a multi-workspace architecture recommended for Microsoft Sentinel?",
                    "options": [
                              "Always, for better performance",
                              "When you have more than 100 GB daily ingestion",
                              "When data residency mandates, strict RBAC isolation, or MSSP multi-tenant scenarios require it",
                              "When you have more than 10 data connectors"
                    ],
                    "explanation": "Multi-workspace is required when data residency mandates different Azure regions, strict RBAC requires data isolation between business units, or MSSP (managed security) scenarios need tenant separation. For most organizations, a single workspace is recommended for simplicity and native cross-data correlation."
          },
          {
                    "question": "Which KQL function allows querying data across multiple Sentinel workspaces?",
                    "options": [
                              "union()",
                              "join()",
                              "workspace()",
                              "external_data()"
                    ],
                    "explanation": "The workspace() function in KQL allows querying data from other Log Analytics workspaces. Cross-workspace analytics rules can correlate events from multiple workspaces, though performance degrades as cross-workspace query volume increases."
          },
          {
                    "question": "What is the purpose of the Basic Logs tier in a Log Analytics workspace?",
                    "options": [
                              "Free storage for all data types",
                              "Lower-cost ingestion for high-volume, low-value data with limited KQL support",
                              "Faster query performance for frequently accessed data",
                              "Long-term archive storage only"
                    ],
                    "explanation": "Basic Logs is a lower-cost ingestion tier for high-volume data that is rarely queried. It supports limited KQL (no joins, no summarize) and is ideal for verbose logs needed for compliance but not for daily security operations. Analytics Logs is the full-featured tier with complete KQL support."
          },
          {
                    "question": "Which RBAC role allows managing incidents in Sentinel but does not grant access to modify analytics rules or data connectors?",
                    "options": [
                              "Microsoft Sentinel Contributor",
                              "Microsoft Sentinel Responder",
                              "Microsoft Sentinel Reader",
                              "Log Analytics Contributor"
                    ],
                    "explanation": "Microsoft Sentinel Responder can manage incidents (assign, dismiss, change severity, add comments) and run playbooks, but cannot create or modify analytics rules, data connectors, or other Sentinel configuration. Contributor has full access, and Reader has view-only access."
          },
          {
                    "question": "What do Data Collection Rules (DCRs) allow you to do before data reaches the Sentinel workspace?",
                    "options": [
                              "Encrypt data in transit",
                              "Filter and transform data to reduce ingestion volume and cost",
                              "Automatically create analytics rules",
                              "Route data to multiple SIEM platforms"
                    ],
                    "explanation": "Data Collection Rules (DCRs) filter and transform data before it is ingested into the workspace. You can drop unnecessary fields, filter by severity, or route data to Basic Logs -- reducing both ingestion volume and cost at the source before data reaches the workspace."
          }
]
        });
        quiz.start();
    </script>
