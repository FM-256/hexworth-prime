<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-200 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 2: Microsoft Defender for Endpoint",
            description: "Test your understanding of device onboarding, attack surface reduction rules, endpoint detection and response, live response sessions, automated investigation, and threat and vulnerability management",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc200-ch02-quiz",
            moduleId: "sc200-ch02-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "Which onboarding method is recommended for up to 10 devices during a pilot or proof-of-concept deployment?",
                    "options": [
                              "Local onboarding script downloaded from the portal",
                              "Group Policy Object (GPO)",
                              "Microsoft Intune endpoint detection and response profile",
                              "Microsoft Configuration Manager (ConfigMgr)"
                    ],
                    "explanation": "The local onboarding script is designed for small-scale deployments of up to 10 devices. It is downloaded from the Defender for Endpoint portal and run manually on each device. For production at scale, use Intune, GPO, or ConfigMgr."
          },
          {
                    "question": "How long is a Defender for Endpoint onboarding package valid before it expires?",
                    "options": [
                              "7 days",
                              "30 days",
                              "14 days",
                              "90 days"
                    ],
                    "explanation": "Onboarding packages expire after 30 days. After expiration, a new package must be downloaded from the portal. The packages are tenant-specific and contain the workspace ID and key used to authenticate devices with the service."
          },
          {
                    "question": "Which service process must be running on a Windows device for the Defender for Endpoint sensor to function?",
                    "options": [
                              "MsMpEng.exe",
                              "WdFilter.sys",
                              "MsSense.exe",
                              "SecurityHealthService.exe"
                    ],
                    "explanation": "MsSense.exe is the Defender for Endpoint sensor service. It must be running and set to automatic start. MsMpEng.exe is the Microsoft Defender Antivirus engine, which is a separate component from the EDR sensor."
          },
          {
                    "question": "What are the three deployment modes for attack surface reduction (ASR) rules?",
                    "options": [
                              "Enable, Disable, Monitor",
                              "Low, Medium, High",
                              "Detect, Prevent, Respond",
                              "Audit, Block, Warn"
                    ],
                    "explanation": "ASR rules support three modes: Audit (log events without blocking), Block (actively prevent the behavior), and Warn (show user a warning but allow override). Best practice is to deploy in Audit mode first to assess impact, then switch to Block."
          },
          {
                    "question": "Which ASR rule specifically protects against Mimikatz-style credential dumping attacks?",
                    "options": [
                              "Block credential stealing from the Windows Local Security Authority Subsystem (LSASS)",
                              "Block Office applications from creating child processes",
                              "Block executable content from email client and webmail",
                              "Use advanced protection against ransomware"
                    ],
                    "explanation": "The LSASS credential stealing protection rule blocks processes from accessing LSASS process memory. LSASS stores credential material, and tools like Mimikatz dump this memory to extract passwords, hashes, and Kerberos tickets for lateral movement."
          },
          {
                    "question": "Through which management tools can ASR rules be configured?",
                    "options": [
                              "Only Microsoft Intune",
                              "Only Group Policy and SCCM",
                              "Intune, Group Policy, and PowerShell",
                              "Only the Defender XDR portal"
                    ],
                    "explanation": "ASR rules can be configured through Microsoft Intune (endpoint security policy), Group Policy (Administrative Templates), and PowerShell (Set-MpPreference cmdlet). Each rule is identified by a unique GUID. Intune is recommended for cloud-managed environments."
          },
          {
                    "question": "What does EDR in block mode allow Defender for Endpoint to do?",
                    "options": [
                              "Block all network traffic to and from the device",
                              "Prevent users from disabling the endpoint sensor",
                              "Block execution of unsigned applications",
                              "Take automated remediation on post-breach detections when a third-party antivirus is the primary engine"
                    ],
                    "explanation": "EDR in block mode enables Defender for Endpoint to act as a safety net when a non-Microsoft antivirus product is the primary protection engine. It allows automated remediation actions on post-breach behavioral detections that the third-party AV may have missed."
          },
          {
                    "question": "What is the maximum data retention period for advanced hunting endpoint telemetry?",
                    "options": [
                              "30 days",
                              "14 days",
                              "180 days",
                              "7 days"
                    ],
                    "explanation": "Advanced hunting provides access to 30 days of raw telemetry data across endpoints, email, identity, and cloud apps. This data includes process events, file operations, network connections, and registry changes that can be queried using KQL."
          },
          {
                    "question": "Which live response permission level is required to use the getfile and putfile commands?",
                    "options": [
                              "Security Administrator role",
                              "Advanced permissions",
                              "Basic permissions",
                              "Global Administrator role"
                    ],
                    "explanation": "Advanced live response permissions are required for getfile (download files from device), putfile (upload tools to device), run (execute scripts), and remediate (quarantine files). Basic permissions provide read-only commands like dir, processes, and connections."
          },
          {
                    "question": "In what security context does a live response session execute commands on the target device?",
                    "options": [
                              "The SYSTEM account context",
                              "The analyst's Microsoft Entra ID context",
                              "The signed-in user context",
                              "A sandboxed low-privilege context"
                    ],
                    "explanation": "Live response sessions run in the context of the SYSTEM account on the target device. This provides full access to the file system, registry, and running processes for thorough investigation and remediation. Sessions time out after 30 minutes of inactivity."
          },
          {
                    "question": "What determines whether automated investigation remediation actions execute automatically or require analyst approval?",
                    "options": [
                              "The severity of the alert that triggered the investigation",
                              "The role of the analyst assigned to the incident",
                              "The type of remediation action being proposed",
                              "The automation level configured for the device group"
                    ],
                    "explanation": "Automation levels are configured per device group. Full automation executes all remediation actions automatically. Semi-automation requires analyst approval for specific action types. No automated response means AIR investigates but takes no remediation action."
          },
          {
                    "question": "Where do pending automated investigation actions that need analyst approval appear?",
                    "options": [
                              "The device timeline",
                              "The Action Center",
                              "The alert details page",
                              "The Secure Score dashboard"
                    ],
                    "explanation": "The Action Center is the central hub for all pending and completed remediation actions across the tenant. When automation is set to Semi, actions requiring approval appear in the Pending tab. Analysts review each action and approve or reject it."
          },
          {
                    "question": "What does the TVM exposure score measure?",
                    "options": [
                              "The number of active security incidents in the organization",
                              "The percentage of devices with the endpoint sensor installed",
                              "A numerical representation of the organization's vulnerability exposure based on severity, affected devices, and active exploits",
                              "The average time to remediate security vulnerabilities"
                    ],
                    "explanation": "The TVM exposure score (0-100) represents vulnerability exposure. It factors in the number of vulnerabilities, their CVSS severity, the number of affected devices, and whether active exploits exist in the wild. A lower score indicates better vulnerability posture."
          },
          {
                    "question": "How does TVM discover vulnerabilities on endpoints without requiring additional scanning agents?",
                    "options": [
                              "It queries Windows Update to check for missing patches",
                              "It uses the existing Defender for Endpoint sensor telemetry for continuous real-time discovery",
                              "It relies on periodic network vulnerability scans from the portal",
                              "It downloads vulnerability databases to each endpoint nightly"
                    ],
                    "explanation": "TVM leverages the same Defender for Endpoint sensor that is already installed for EDR. The sensor continuously collects software inventory and configuration data, providing real-time vulnerability discovery without additional agents or periodic scan windows."
          },
          {
                    "question": "Which onboarding method is recommended for deploying Defender for Endpoint to cloud-managed devices across Windows, macOS, Linux, iOS, and Android?",
                    "options": [
                              "Local onboarding script",
                              "Group Policy Object (GPO)",
                              "Microsoft Intune endpoint detection and response configuration profile",
                              "Microsoft Configuration Manager (ConfigMgr)"
                    ],
                    "explanation": "Microsoft Intune is the recommended onboarding method for cloud-managed environments. It supports the broadest platform coverage including Windows, macOS, Linux, iOS, and Android through endpoint detection and response configuration profiles assigned to device groups."
          }
]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
