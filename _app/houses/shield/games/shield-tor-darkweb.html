        #terminal {

            height: 100vh;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            line-height: 1.6;

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

                rgba(0, 0, 0, 0.15),

            pointer-events: none;
            z-index: 2;
        }

        #terminal::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%);

            z-index: 2;

            animation: blink 1s infinite;
        }

            51%, 100% { opacity: 0; }

            color: #ef4444;
        }

        }

        }

        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }

            cursor: pointer;
            z-index: 1000;

        // Audio Context for sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ambientOscillator = null;

        // Sound effects using Web Audio API
        function playClick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.value = 0.05;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playConnectionSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 200;
            gain.gain.value = 0.1;
            osc.start();
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.3);

            const osc = audioCtx.createOscillator();

            gain.connect(audioCtx.destination);
            osc.frequency.value = 1200;
            gain.gain.value = 0.08;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.stop(audioCtx.currentTime + 0.15);

        function playAlertSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 400;
            gain.gain.value = 0.12;

            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playStaticSound() {
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.03;
            source.start();
        }

        function startAmbientDrone() {
            if (ambientOscillator) return;
            ambientOscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            ambientOscillator.connect(gain);
            gain.connect(audioCtx.destination);
            ambientOscillator.frequency.value = 55;
            ambientOscillator.type = 'sine';
            gain.gain.value = 0.03;
            ambientOscillator.start();
        }

        function playDramaticReveal() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 150;
            filter.type = 'lowpass';
            filter.frequency.value = 500;
            gain.gain.value = 0.15;
            osc.start();
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 1.5);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            if (window.FirestoreManager) {

            if ((typeof AchievementManager !== 'undefined' && AchievementManager)) AchievementManager.unlock('game_tor');

            print('');
