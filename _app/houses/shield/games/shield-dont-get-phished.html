<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Get Phished - Shield House - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --house-primary: #f87171;
            --house-secondary: #dc2626;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text-primary: #e0e0e0;
            --text-dim: #888;
            --text-warning: #fbbf24;
            --text-critical: #ef4444;
            --success: #10b981;
            --error: #ef4444;
        }

        @keyframes statPulse {
            0%, 100% { text-shadow: 0 0 8px rgba(239,68,68,0.3); }
            50% { text-shadow: 0 0 16px rgba(239,68,68,0.6); }
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(160deg, var(--bg-dark) 0%, #0d0505 50%, var(--bg-dark) 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CRT scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.08),
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-darker) 0%, #0d0505 100%);
            border-bottom: 2px solid var(--house-primary);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(239,68,68,0.1);
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ef4444, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(239,68,68,0.4));
        }

        .meta {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .achievement-counter {
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.1) 0%, rgba(239,68,68,0.15) 100%);
            border: 1px solid var(--house-primary);
            border-radius: 4px;
            transition: all 0.3s ease;
            animation: statPulse 3s ease-in-out infinite;
        }

        .achievement-counter:hover {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.2) 0%, rgba(239,68,68,0.3) 100%);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(239,68,68,0.3);
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            min-width: 120px;
            text-align: center;
            transition: all 0.3s;
        }

        .timer.safe {
            color: var(--success);
            border: 1px solid var(--success);
        }

        .timer.warning {
            color: var(--text-warning);
            border: 1px solid var(--text-warning);
        }

        .timer.critical {
            color: var(--text-critical);
            border: 1px solid var(--text-critical);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .output {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .output::-webkit-scrollbar {
            width: 8px;
        }

        .output::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        .output::-webkit-scrollbar-thumb {
            background: var(--house-primary);
            border-radius: 4px;
        }

        .line {
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .line-system { color: var(--house-primary); font-weight: bold; }
        .line-success { color: var(--success); }
        .line-error { color: var(--error); }
        .line-warning { color: var(--text-warning); }
        .line-critical {
            color: var(--text-critical);
            font-weight: bold;
            animation: blink 1s infinite;
        }
        .line-alert {
            color: var(--text-warning);
            background: rgba(251, 191, 36, 0.1);
            padding: 0.25rem;
        }
        .line-info { color: #60a5fa; }
        .line-dim { color: var(--text-dim); }
        .line-achievement {
            color: #fbbf24;
            font-weight: bold;
            background: rgba(251, 191, 36, 0.1);
            padding: 0.5rem;
            border-left: 3px solid #fbbf24;
            margin: 0.5rem 0;
        }
        .line-narrative { color: #a78bfa; font-style: italic; }
        .line-title {
            color: var(--house-primary);
            font-size: 1.1rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .line-hint {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 0.5rem;
            border-left: 3px solid #10b981;
        }
        .line-ps-output { color: var(--text-dim); margin-left: 1rem; }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        .input-area {
            border-top: 1px solid var(--house-primary);
            background: linear-gradient(135deg, var(--bg-darker) 0%, #0d0505 100%);
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 -4px 20px rgba(239,68,68,0.1);
        }

        .prompt {
            color: var(--house-primary);
            font-weight: bold;
        }

        #commandInput {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--house-primary);
            color: var(--text-primary);
            padding: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            outline: none;
        }

        #commandInput:focus {
            border-color: var(--house-secondary);
            box-shadow: 0 0 15px rgba(239,68,68,0.4);
        }

        .toast {
            position: fixed;
            top: 5rem;
            right: -400px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 1rem;
            min-width: 300px;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
            transition: right 0.5s;
            z-index: 1000;
        }

        .toast.show {
            right: 2rem;
        }

        .toast-title {
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .toast-message {
            color: var(--text-primary);
        }

        .gallery-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            overflow-y: auto;
            padding: 2rem;
        }

        .gallery-overlay.show {
            display: flex;
        }

        .gallery-content {
            background: linear-gradient(160deg, var(--bg-darker) 0%, #0d0505 50%, var(--bg-darker) 100%);
            border: 2px solid var(--house-primary);
            border-radius: 8px;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 40px rgba(239,68,68,0.2);
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .gallery-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ef4444, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(239,68,68,0.4));
        }

        .gallery-subtitle {
            color: var(--text-dim);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .achievement-item {
            background: linear-gradient(145deg, var(--bg-dark) 0%, #0d0808 100%);
            border: 1px solid var(--text-dim);
            border-radius: 4px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .achievement-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .achievement-item.unlocked {
            border-color: #fbbf24;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.05) 0%, rgba(251, 191, 36, 0.1) 100%);
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.1);
        }

        .achievement-name {
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .achievement-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .achievement-item.locked .achievement-name {
            color: var(--text-dim);
        }

        .achievement-item.locked .achievement-desc {
            opacity: 0.5;
        }

        .close-gallery {
            text-align: center;
            color: var(--house-primary);
            padding: 1rem;
            cursor: pointer;
            border-top: 1px solid var(--house-primary);
        }

        .close-gallery:hover {
            background: rgba(248, 113, 113, 0.1);
        }
        .back-link { position:fixed; top:12px; left:20px; color:#ef4444; text-decoration:none; font-size:14px; cursor:pointer; z-index:10000; transition:color 0.3s; font-family:monospace; }
        .back-link:hover { color:#f87171; }
    </style>
</head>
<body>
<h1 class="visually-hidden">Don't Get Phished - Shield House</h1>
    <a class="back-link" href="../index.html">&larr; Back to Shield House</a>
    <div class="header">
        <div class="title">DON'T GET PHISHED</div>
        <div class="meta">
            <div class="achievement-counter" id="achievementCounter"><img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> 0/12</div>
            <div class="timer safe" id="timer">03:00</div>
        </div>
    </div>

    <div class="output" id="output"></div>

    <div class="input-area">
        <span class="prompt">SOC&gt;</span>
        <input type="text" id="commandInput" autocomplete="off" autofocus>
    </div>

    <div class="toast" id="toast">
        <div class="toast-title">Achievement Unlocked!</div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <div class="gallery-overlay" id="gallery">
        <div class="gallery-content">
            <div class="gallery-header">
                <div class="gallery-title">ACHIEVEMENTS</div>
                <div class="gallery-subtitle">Security Operations Center - Shield House</div>
            </div>
            <div class="achievements-grid" id="achievementsGrid"></div>
            <div class="close-gallery" id="closeGallery">[Press ESC or Click to Close]</div>
        </div>
    </div>

    <script>
        // Game Engine - IIFE Pattern
        const Game = (function() {
            // Achievement definitions
            const ACHIEVEMENTS = {
                first_detection: {
                    name: 'First Detection',
                    description: 'Searched the email gateway for threats'
                },
                quick_block: {
                    name: 'Quick Block',
                    description: 'Blocked sender within 30 seconds'
                },
                by_the_book: {
                    name: 'NIST Compliant',
                    description: 'Followed full IR lifecycle: detect, analyze, contain, eradicate, recover, document'
                },
                ceo_saver: {
                    name: 'Executive Protection',
                    description: 'Warned the CEO before they opened the email'
                },
                full_lockdown: {
                    name: 'Full Lockdown',
                    description: 'Blocked sender + quarantined + firewall + reset passwords'
                },
                sandbox_analyst: {
                    name: 'Sandbox Analyst',
                    description: 'Analyzed the phishing attachment in sandbox'
                },
                panic_mode: {
                    name: 'Panic Mode',
                    description: 'Used the panic command during incident response'
                },
                caffeine_addict: {
                    name: 'Caffeine Addict',
                    description: 'Consumed caffeine during a critical incident'
                },
                frozen: {
                    name: 'Deer in Headlights',
                    description: 'Did nothing until time ran out'
                },
                wrong_field: {
                    name: 'Wrong Field',
                    description: 'Tried Windows/Linux commands in a SOC environment'
                },
                speed_run: {
                    name: 'Speed Run',
                    description: 'Contained the threat in under 25 seconds'
                },
                over_reactor: {
                    name: 'Over-Reactor',
                    description: 'Called police AND panicked AND unplugged everything'
                }
            };

            // Game state
            let state = {
                timeRemaining: 180,
                timerInterval: null,
                gameActive: false,
                gameStarted: false,
                inputEnabled: true,
                commandCount: 0,

                // Threat state
                emailsBlocked: false,
                senderBlocked: false,
                ceoWarned: false,
                logsPulled: false,
                incidentCreated: false,
                quarantined: false,
                ceoClicked: false,
                credentialsCompromised: false,
                lateralMovement: false,
                firewallBlocked: false,
                passwordReset: false,
                sandboxAnalyzed: false,
                teamAlerted: false,
                gatewaySearched: false,

                // NIST IR Lifecycle tracking
                detected: false,
                analyzed: false,
                contained: false,
                eradicated: false,
                recovered: false,
                documented: false,

                // Event tracking
                events: {
                    expansion: false,
                    cfoOpened: false,
                    ceoOpened: false,
                    ceoClickedLink: false,
                    credsEntered: false,
                    unauthorizedAccess: false
                },

                // Fun tracking
                panicked: false,
                calledPolice: false,
                unpluggedEverything: false,
                drankCoffee: false,
                usedWindowsCommands: false,

                ending: null
            };

            // Saved achievements
            let savedAchievements = {};

            // DOM elements
            const elements = {
                output: document.getElementById('output'),
                input: document.getElementById('commandInput'),
                timer: document.getElementById('timer'),
                achievementCounter: document.getElementById('achievementCounter'),
                toast: document.getElementById('toast'),
                toastMessage: document.getElementById('toastMessage'),
                gallery: document.getElementById('gallery'),
                achievementsGrid: document.getElementById('achievementsGrid'),
                closeGallery: document.getElementById('closeGallery')
            };

            // Initialize
            function init() {
                loadAchievements();
                updateAchievementCounter();
                setupEventListeners();
                showTitleScreen();
            }

            // Load achievements from localStorage
            function loadAchievements() {
                try {
                    const saved = localStorage.getItem('hexworth_dontphished_achievements');
                    savedAchievements = saved ? JSON.parse(saved) : {};
                } catch (e) {
                    savedAchievements = {};
                }
            }

            // Save achievements to localStorage
            function saveAchievements() {
                try {
                    localStorage.setItem('hexworth_dontphished_achievements', JSON.stringify(savedAchievements));
                } catch (e) {
                    console.error('Failed to save achievements');
                }
            }

            // Update achievement counter display
            function updateAchievementCounter() {
                const count = Object.keys(savedAchievements).length;
                elements.achievementCounter.innerHTML = `<img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ${count}/12`;
            }

            // Unlock achievement
            function unlockAchievement(key) {
                if (!savedAchievements[key]) {
                    savedAchievements[key] = true;
                    saveAchievements();
                    updateAchievementCounter();
                    showToast(ACHIEVEMENTS[key].name);
                    return true;
                }
                return false;
            }

            // Show toast notification
            function showToast(achievementName) {
                elements.toastMessage.textContent = achievementName;
                elements.toast.classList.add('show');
                setTimeout(() => {
                    elements.toast.classList.remove('show');
                }, 3000);
            }

            // Setup event listeners
            function setupEventListeners() {
                elements.input.addEventListener('keydown', handleInput);
                elements.achievementCounter.addEventListener('click', showGallery);
                elements.closeGallery.addEventListener('click', hideGallery);
                elements.gallery.addEventListener('click', (e) => {
                    if (e.target === elements.gallery) hideGallery();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') hideGallery();
                });
            }

            // Handle input
            function handleInput(e) {
                if (e.key === 'Enter') {
                    const command = elements.input.value.trim();
                    if (command) {
                        print(`SOC> ${command}`);
                        elements.input.value = '';

                        if (!state.gameStarted) {
                            handlePreGameCommand(command);
                        } else if (state.gameActive && state.inputEnabled) {
                            state.commandCount++;
                            handleCommand(command);
                        }
                    }
                }
            }

            // Print line to output
            function print(text, className = '') {
                const line = document.createElement('div');
                line.className = 'line' + (className ? ' line-' + className : '');
                line.textContent = text;
                elements.output.appendChild(line);
                elements.output.scrollTop = elements.output.scrollHeight;
            }

            // Styled print helper
            function styled(text, className) {
                const str = new String(text);
                str._className = className;
                return str;
            }

            // Print with optional styling
            function printLine(text) {
                if (text && text._className) {
                    print(text.toString(), text._className);
                } else {
                    print(text);
                }
            }

            // Clear output
            function clear() {
                elements.output.innerHTML = '';
            }

            // Show title screen
            function showTitleScreen() {
                clear();
                const unlocked = Object.keys(savedAchievements).length;

                printLine(styled('╔══════════════════════════════════════════════════════════════╗', 'system'));
                printLine(styled('║                                                              ║', 'system'));
                printLine(styled('║                    DON\'T GET PHISHED                         ║', 'title'));
                printLine(styled('║                                                              ║', 'system'));
                printLine(styled('║              SHIELD HOUSE - SECURITY OPERATIONS              ║', 'system'));
                printLine(styled('║                                                              ║', 'system'));
                printLine(styled('╚══════════════════════════════════════════════════════════════╝', 'system'));
                print('');
                printLine(styled('SITUATION BRIEF:', 'warning'));
                printLine(styled('You are a SOC Analyst on the night shift.', 'narrative'));
                printLine(styled('A sophisticated phishing campaign has been detected.', 'narrative'));
                printLine(styled('Spear-phishing emails are landing in C-suite executive inboxes.', 'narrative'));
                printLine(styled('The CEO will check his email in 3 minutes.', 'narrative'));
                print('');
                printLine(styled('YOUR MISSION:', 'critical'));
                printLine(styled('Detect. Analyze. Contain. Eradicate. Recover. Document.', 'info'));
                printLine(styled('Block the threat before credentials are compromised.', 'info'));
                print('');
                if (unlocked > 0) {
                    printLine(styled(`You have unlocked ${unlocked}/12 achievements.`, 'achievement'));
                    print('');
                }
                printLine(styled('Type "start" to begin your shift.', 'success'));
                printLine(styled('Type "achievements" to view your progress.', 'dim'));
                print('');
            }

            // Handle pre-game commands
            function handlePreGameCommand(command) {
                const cmd = command.toLowerCase();

                if (cmd === 'start' || cmd === 'begin' || cmd === 'play') {
                    startGame();
                } else if (cmd === 'achievements' || cmd === 'gallery' || cmd === 'a') {
                    showGallery();
                } else if (cmd === 'help' || cmd === '?') {
                    printLine(styled('Type "start" to begin the game.', 'info'));
                    printLine(styled('Type "achievements" to view unlocked achievements.', 'info'));
                } else {
                    printLine(styled('Type "start" to begin your shift.', 'dim'));
                }
            }

            // Start game
            function startGame() {
                clear();
                state.gameStarted = true;
                state.gameActive = true;
                state.timeRemaining = 180;

                // Reset all state flags
                state.emailsBlocked = false;
                state.senderBlocked = false;
                state.ceoWarned = false;
                state.logsPulled = false;
                state.incidentCreated = false;
                state.quarantined = false;
                state.ceoClicked = false;
                state.credentialsCompromised = false;
                state.lateralMovement = false;
                state.firewallBlocked = false;
                state.passwordReset = false;
                state.sandboxAnalyzed = false;
                state.teamAlerted = false;
                state.gatewaySearched = false;
                state.detected = false;
                state.analyzed = false;
                state.contained = false;
                state.eradicated = false;
                state.recovered = false;
                state.documented = false;
                state.events = {
                    expansion: false,
                    cfoOpened: false,
                    ceoOpened: false,
                    ceoClickedLink: false,
                    credsEntered: false,
                    unauthorizedAccess: false
                };
                state.panicked = false;
                state.calledPolice = false;
                state.unpluggedEverything = false;
                state.drankCoffee = false;
                state.usedWindowsCommands = false;
                state.commandCount = 0;
                state.ending = null;

                printLine(styled('[SYSTEM] SOC Terminal - Night Shift', 'system'));
                printLine(styled('[SYSTEM] Analyst: Shield House Operative', 'system'));
                printLine(styled('[SYSTEM] Security Tools: Online', 'system'));
                print('');
                printLine(styled('[SIEM] ALERT - HIGH PRIORITY', 'alert'));
                printLine(styled('[SIEM] Multiple phishing emails detected', 'warning'));
                printLine(styled('[SIEM] Target: C-Suite executives', 'warning'));
                printLine(styled('[SIEM] Sender: suspicious domain detected', 'warning'));
                print('');
                printLine(styled('Your coffee is cold. Three monitors glow in the darkness.', 'narrative'));
                printLine(styled('The SIEM dashboard is flashing red. Time to work.', 'narrative'));
                print('');
                printLine(styled('Type "help" for available commands. Type "hint" for guidance.', 'dim'));
                print('');

                startTimer();
            }

            // Start timer
            function startTimer() {
                updateTimerDisplay();
                state.timerInterval = setInterval(() => {
                    state.timeRemaining--;
                    updateTimerDisplay();
                    checkTimedEvents();

                    if (state.timeRemaining <= 0) {
                        timeUp();
                    }
                }, 1000);
            }

            // Update timer display
            function updateTimerDisplay() {
                const minutes = Math.floor(state.timeRemaining / 60);
                const seconds = state.timeRemaining % 60;
                const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                elements.timer.textContent = display;

                // Update timer color
                elements.timer.classList.remove('safe', 'warning', 'critical');
                if (state.timeRemaining > 60) {
                    elements.timer.classList.add('safe');
                } else if (state.timeRemaining > 30) {
                    elements.timer.classList.add('warning');
                } else {
                    elements.timer.classList.add('critical');
                }
            }

            // Check for timed events
            function checkTimedEvents() {
                // Expansion at 160s (20s elapsed)
                if (state.timeRemaining === 160 && !state.events.expansion && !state.senderBlocked && !state.firewallBlocked) {
                    state.events.expansion = true;
                    print('');
                    printLine(styled('[SIEM] Additional phishing emails detected - campaign is expanding', 'alert'));
                    print('');
                }

                // CFO opened at 130s (50s elapsed)

                    printLine(styled('FAILURE: CREDENTIALS COMPROMISED', 'error'));
                } else if (state.ceoClicked) {
                    printLine(styled('[SIEM] CEO clicked phishing link', 'critical'));
                    printLine(styled('[SIEM] Credential harvester loaded', 'critical'));
                    print('');
                    printLine(styled('You acted too slowly.', 'narrative'));
                    printLine(styled('The threat escalated beyond control.', 'narrative'));
                    print('');
                    printLine(styled('FAILURE: THREAT NOT CONTAINED', 'error'));
                } else {
                    printLine(styled('[SIEM] Time expired', 'warning'));
                    printLine(styled('[SIEM] Threat not adequately contained', 'warning'));
                    print('');
                    printLine(styled('You didn\'t do enough to stop the attack.', 'narrative'));
                    printLine(styled('Better luck next shift.', 'narrative'));
                    print('');
                    printLine(styled('FAILURE: INCOMPLETE RESPONSE', 'error'));
                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    GameTracker.record('phished', {
                        result: state.ending || 'unknown',
                        timeElapsed: 180 - state.timeRemaining,
                        commandsUsed: state.commandCount,
                        achievementsEarned: Object.keys(savedAchievements).length,
                        achievementsTotal: Object.keys(ACHIEVEMENTS).length
                    });
                }

                showEndScreen();
            }

            // Show end screen
            function showEndScreen() {
                print('');
                printLine(styled('═════════════════════════════════════════════════', 'system'));
                const count = Object.keys(savedAchievements).length;
                printLine(styled(`Achievements Unlocked: ${count}/12`, 'achievement'));
                printLine(styled('═════════════════════════════════════════════════', 'system'));
                print('');
                printLine(styled('[R] Play Again', 'info'));
                printLine(styled('[A] View Achievements', 'info'));
                print('');

                state.inputEnabled = false;
                setupEndGameListeners();
            }

            // Setup end game listeners
            function setupEndGameListeners() {
                const endGameHandler = (e) => {
                    if (e.key.toLowerCase() === 'r') {
                        document.removeEventListener('keydown', endGameHandler);
                        startGame();
                    } else if (e.key.toLowerCase() === 'a') {
                        showGallery();
                    }
                };
                document.addEventListener('keydown', endGameHandler);
            }

            // Show gallery
            function showGallery() {
                elements.achievementsGrid.innerHTML = '';

                for (const [key, achievement] of Object.entries(ACHIEVEMENTS)) {
                    const div = document.createElement('div');
                    div.className = 'achievement-item' + (savedAchievements[key] ? ' unlocked' : ' locked');

                    const name = document.createElement('div');
                    name.className = 'achievement-name';
                    name.innerHTML = (savedAchievements[key] ? '<img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ' : '<img src="/assets/images/icons/icon-padlock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> ') + achievement.name;

                    const desc = document.createElement('div');
                    desc.className = 'achievement-desc';
                    desc.textContent = achievement.description;

                    div.appendChild(name);
                    div.appendChild(desc);
                    elements.achievementsGrid.appendChild(div);
                }

                elements.gallery.classList.add('show');
            }

            // Hide gallery
            function hideGallery() {
                elements.gallery.classList.remove('show');
            }

            // Public API
            return {
                init
            };
        })();

        // Initialize game on load
        document.addEventListener('DOMContentLoaded', () => {
            Game.init();
        });
    </script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/GameScoreboard.js"></script>
    <script src="../../../components/AchievementSystem.js"></script>
</body>
</html>
