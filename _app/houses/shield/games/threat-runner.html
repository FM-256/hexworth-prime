<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Runner - Shield House - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #e5e5e5;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            padding: 20px;
        }

        .nav-bar {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            cursor: pointer;
            color: #ef4444;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ef4444;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
        }

        .controls-info {
            font-size: 12px;
            color: #999;
        }

        canvas {
            display: block;
            background: #1a1a1a;
            border: 3px solid #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
            width: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .info-panel {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 14px;
        }

        .info-item {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 10px;
            border-radius: 4px;
        }

        .info-label {
            color: #999;
            font-size: 11px;
            text-transform: uppercase;
        }

        .info-value {
            color: #ef4444;
            font-size: 18px;
            font-weight: bold;
        }

        .button-panel {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-over-content {
            background: #1a1a1a;
            border: 4px solid #ef4444;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5);
        }

        .game-over-title {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.8);
        }

        .game-over-stats {
            font-size: 18px;
            margin: 15px 0;
            color: #e5e5e5;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 20px;
            }

            .controls-info {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="nav-bar">
            <a class="back-link" onclick="history.back()">← Back to Shield House</a>
            <div class="title">THREAT RUNNER</div>
            <div class="controls-info">SPACE/UP: Jump | DOWN: Duck</div>
        </div>

        <canvas id="gameCanvas" width="1000" height="400"></canvas>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">Threats Neutralized</div>
                <div class="info-value" id="scoreDisplay">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">High Score</div>
                <div class="info-value" id="highScoreDisplay">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Threat Level</div>
                <div class="info-value" id="levelDisplay">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Combo Multiplier</div>
                <div class="info-value" id="comboDisplay">x1</div>
            </div>
        </div>

        <div class="button-panel">
            <button id="startBtn">START SHIFT</button>
            <button id="muteBtn">MUTE AUDIO</button>
            <button id="helpBtn">INTEL BRIEFING</button>
        </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-content">
            <div class="game-over-title">SHIFT ENDED</div>
            <div class="game-over-stats">Threats Neutralized: <span id="finalScore">0</span></div>
            <div class="game-over-stats">High Score: <span id="finalHighScore">0</span></div>
            <div class="game-over-stats" id="xpMessage" style="color: #ef4444; display: none;">+50 XP AWARDED!</div>
            <div style="margin-top: 30px;">
                <button id="restartBtn">RESTART SHIFT</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const COLORS = {
            shield: '#ef4444',
            bg1: '#0a0a0a',
            bg2: '#1a1a1a',
            bg3: '#2a2a2a',
            ground: '#1a1a1a',
            player: '#60a5fa',
            text: '#e5e5e5',
            warning: '#fbbf24',
            danger: '#ef4444',
            safe: '#10b981'
        };

        // Game state
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('threat_runner_high_score') || '0');
        let speed = 6;
        let gravity = 0.6;
        let jumpStrength = -12;
        let frameCount = 0;
        let obstaclesCleared = 0;
        let comboCount = 0;
        let comboMultiplier = 1;
        let hasDoubleJump = false;
        let canDoubleJump = false;
        let muted = false;

        // Player object
        const player = {
            x: 100,
            y: 0,
            width: 20,
            height: 24,
            velocityY: 0,
            isJumping: false,
            isDucking: false,
            health: 1,
            shield: false,
            animFrame: 0,
            animSpeed: 0
        };

        // Arrays for game objects
        let obstacles = [];
        let powerups = [];
        let particles = [];
        let backgroundElements = [];
        let siemLogs = [];

        // Ground position
        const groundY = canvas.height - 60;
        player.y = groundY - player.height;

        // ============================================
        // WEB AUDIO API - CHIPTUNE MUSIC ENGINE
        // ============================================
        let audioContext;
        let masterGain;
        let musicNodes = [];
        let musicPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.connect(audioContext.destination);
                masterGain.gain.value = 0.3;
            }
        }

        // Background music - Intense 8-bit chiptune
        function playBackgroundMusic() {
            if (muted || musicPlaying) return;
            initAudio();
            musicPlaying = true;

            const tempo = 140; // BPM
            const beatDuration = 60 / tempo;
            const startTime = audioContext.currentTime;

            // Melody pattern (square wave lead)
            const melody = [
                { note: 329.63, duration: 0.25 }, // E4
                { note: 392.00, duration: 0.25 }, // G4
                { note: 523.25, duration: 0.25 }, // C5
                { note: 493.88, duration: 0.25 }, // B4
                { note: 440.00, duration: 0.5 },  // A4
                { note: 329.63, duration: 0.25 }, // E4
                { note: 392.00, duration: 0.25 }, // G4
                { note: 440.00, duration: 0.5 },  // A4
                { note: 329.63, duration: 0.25 }, // E4
                { note: 392.00, duration: 0.25 }, // G4
                { note: 523.25, duration: 0.25 }, // C5
                { note: 587.33, duration: 0.25 }, // D5
                { note: 523.25, duration: 0.5 },  // C5
                { note: 493.88, duration: 0.25 }, // B4
                { note: 440.00, duration: 0.25 }  // A4
            ];

            // Bass pattern (pulse wave)
            const bass = [
                { note: 82.41, duration: 0.5 },   // E2
                { note: 110.00, duration: 0.5 },  // A2
                { note: 98.00, duration: 0.5 },   // G2
                { note: 82.41, duration: 0.5 }    // E2
            ];

            let time = startTime;

            // Play melody
            melody.forEach((note, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'square';
                osc.frequency.value = note.note;

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.15, time + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.01, time + note.duration * beatDuration);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(time);
                osc.stop(time + note.duration * beatDuration);

                time += note.duration * beatDuration;
                musicNodes.push(osc);
            });

            // Play bass
            time = startTime;
            bass.forEach((note, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'sawtooth';
                osc.frequency.value = note.note;

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.2, time + 0.01);
                gain.gain.setValueAtTime(0.2, time + note.duration * beatDuration - 0.05);
                gain.gain.linearRampToValueAtTime(0, time + note.duration * beatDuration);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(time);
                osc.stop(time + note.duration * beatDuration);

                time += note.duration * beatDuration;
                musicNodes.push(osc);
            });

            // Drum pattern (noise)
            time = startTime;
            for (let i = 0; i < 16; i++) {
                const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let j = 0; j < data.length; j++) {
                    data[j] = Math.random() * 2 - 1;
                }

                const noise = audioContext.createBufferSource();
                const filter = audioContext.createBiquadFilter();
                const gain = audioContext.createGain();

                noise.buffer = buffer;
                filter.type = 'highpass';
                filter.frequency.value = i % 4 === 0 ? 100 : 2000;

                gain.gain.setValueAtTime(i % 4 === 0 ? 0.3 : 0.15, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                noise.start(time);

                time += beatDuration * 0.25;
                musicNodes.push(noise);
            }

            // Loop the music
            const totalDuration = melody.reduce((sum, note) => sum + note.duration, 0) * beatDuration;
            setTimeout(() => {
                musicPlaying = false;
                if (gameRunning) playBackgroundMusic();
            }, totalDuration * 1000);
        }

        function stopMusic() {
            musicNodes.forEach(node => {
                try { node.stop(); } catch (e) {}
            });
            musicNodes = [];
            musicPlaying = false;
        }

        // Sound effects
        function playSound(type) {
            if (muted) return;
            initAudio();

            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(masterGain);

            switch (type) {
                case 'jump':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'duck':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'hit':
                    const noise = audioContext.createBufferSource();
                    const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    noise.buffer = buffer;
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    noise.connect(gain);
                    noise.start(now);

                    // Alarm beep
                    const alarm = audioContext.createOscillator();
                    const alarmGain = audioContext.createGain();
                    alarm.frequency.value = 800;
                    alarm.type = 'square';
                    alarmGain.gain.setValueAtTime(0.15, now);
                    alarmGain.gain.setValueAtTime(0.15, now + 0.1);
                    alarmGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    alarm.connect(alarmGain);
                    alarmGain.connect(masterGain);
                    alarm.start(now);
                    alarm.stop(now + 0.3);
                    break;

                case 'score':
                    const notes = [523.25, 659.25, 783.99];
                    notes.forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                        o.connect(g);
                        g.connect(masterGain);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.2);
                    });
                    break;

                case 'powerup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;

                case 'nearmiss':
                    osc.type = 'triangle';
                    osc.frequency.value = 600;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;

                case 'gameover':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 1.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                    osc.start(now);
                    osc.stop(now + 1.5);
                    break;

                case 'speedup':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
            }
        }

        // ============================================
        // PIXEL ART RENDERING
        // ============================================

        // Draw player character with running animation
        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const h = player.isDucking ? player.height * 0.6 : player.height;

            // Body
            ctx.fillStyle = COLORS.player;
            ctx.fillRect(x + 6, y + 8, 8, h - 8);

            // Head
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(x + 5, y + 2, 10, 8);

            // Headset
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x + 4, y + 4, 2, 4);
            ctx.fillRect(x + 14, y + 4, 2, 4);
            ctx.fillStyle = COLORS.shield;
            ctx.fillRect(x + 6, y + 5, 8, 3);

            if (!player.isDucking) {
                // Arms (animated)
                const armOffset = Math.sin(player.animFrame * 0.3) * 2;
                ctx.fillStyle = COLORS.player;
                ctx.fillRect(x + 4, y + 12 + armOffset, 3, 6);
                ctx.fillRect(x + 13, y + 12 - armOffset, 3, 6);

                // Legs (animated running)
                const legOffset = Math.sin(player.animFrame * 0.3) * 4;
                ctx.fillRect(x + 6, y + h - 6, 3, 6 + legOffset);
                ctx.fillRect(x + 11, y + h - 6, 3, 6 - legOffset);
            }

            // Shield effect
            if (player.shield) {
                ctx.strokeStyle = COLORS.shield;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x + player.width / 2, y + h / 2, player.width, frameCount * 0.1, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Draw obstacle sprites
        function drawObstacle(obs) {
            ctx.fillStyle = obs.color || COLORS.danger;

            switch (obs.type) {
                case 'ransomware':
                    // Skull pixel art
                    ctx.fillRect(obs.x + 4, obs.y + 2, 24, 28);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(obs.x + 8, obs.y + 8, 6, 8);
                    ctx.fillRect(obs.x + 18, obs.y + 8, 6, 8);
                    ctx.fillRect(obs.x + 10, obs.y + 20, 12, 6);
                    break;

                case 'phishing':
                    // Hook from above
                    ctx.fillStyle = '#64748b';
                    ctx.fillRect(obs.x + 14, 0, 2, obs.y + 10);
                    ctx.fillStyle = COLORS.warning;
                    ctx.beginPath();
                    ctx.arc(obs.x + 15, obs.y + 15, 8, 0.5 * Math.PI, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillRect(obs.x + 18, obs.y + 10, 8, 3);
                    break;

                case 'zeroday':
                    // Glitchy transparent block
                    const alpha = 0.3 + Math.sin(frameCount * 0.2) * 0.2;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#8b5cf6';
                    for (let i = 0; i < obs.width; i += 4) {
                        for (let j = 0; j < obs.height; j += 4) {
                            if (Math.random() > 0.5) {
                                ctx.fillRect(obs.x + i, obs.y + j, 3, 3);
                            }
                        }
                    }
                    ctx.globalAlpha = 1;
                    break;

                case 'ddos':
                    // Wave of traffic
                    ctx.fillStyle = '#3b82f6';
                    for (let i = 0; i < 5; i++) {
                        const waveY = obs.y + Math.sin((frameCount + i * 10) * 0.2) * 5;
                        ctx.fillRect(obs.x + i * 6, waveY, 5, obs.height - (waveY - obs.y));
                    }
                    break;

                case 'insider':
                    // Friendly-looking NPC (surprise!)
                    ctx.fillStyle = obs.revealed ? COLORS.danger : COLORS.safe;
                    ctx.fillRect(obs.x + 6, obs.y + 2, 10, 8); // head
                    ctx.fillRect(obs.x + 6, obs.y + 10, 10, 14); // body
                    ctx.fillRect(obs.x + 4, obs.y + 14, 3, 8); // arm
                    ctx.fillRect(obs.x + 15, obs.y + 14, 3, 8); // arm
                    // Eyes
                    ctx.fillStyle = obs.revealed ? '#fff' : '#000';
                    ctx.fillRect(obs.x + 8, obs.y + 5, 2, 2);
                    ctx.fillRect(obs.x + 12, obs.y + 5, 2, 2);
                    break;

                case 'apt':
                    // Advanced Persistent Threat - menacing block
                    ctx.fillStyle = '#7c3aed';
                    ctx.fillRect(obs.x + 2, obs.y + 2, obs.width - 4, obs.height - 4);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(obs.x + 8, obs.y + 8, 4, 4);
                    ctx.fillRect(obs.x + 16, obs.y + 8, 4, 4);
                    ctx.fillRect(obs.x + 10, obs.y + 16, 8, 3);
                    break;
            }
        }

        // Draw powerup
        function drawPowerup(powerup) {
            ctx.fillStyle = powerup.color;

            switch (powerup.type) {
                case 'shield':
                    ctx.beginPath();
                    ctx.moveTo(powerup.x + 15, powerup.y + 5);
                    ctx.lineTo(powerup.x + 25, powerup.y + 10);
                    ctx.lineTo(powerup.x + 25, powerup.y + 20);
                    ctx.lineTo(powerup.x + 15, powerup.y + 28);
                    ctx.lineTo(powerup.x + 5, powerup.y + 20);
                    ctx.lineTo(powerup.x + 5, powerup.y + 10);
                    ctx.closePath();
                    ctx.fill();
                    break;

                case 'siem':
                    ctx.fillRect(powerup.x + 5, powerup.y + 8, 20, 16);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(powerup.x + 8, powerup.y + 12, 6, 8);
                    ctx.fillRect(powerup.x + 16, powerup.y + 12, 6, 8);
                    break;

                case 'patch':
                    ctx.fillRect(powerup.x + 8, powerup.y + 6, 14, 4);
                    ctx.fillRect(powerup.x + 8, powerup.y + 14, 14, 4);
                    ctx.fillRect(powerup.x + 8, powerup.y + 22, 14, 4);
                    ctx.fillRect(powerup.x + 6, powerup.y + 10, 4, 8);
                    ctx.fillRect(powerup.x + 20, powerup.y + 10, 4, 8);
                    break;
            }

            // Glow effect
            ctx.strokeStyle = powerup.color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.15) * 0.3;
            ctx.strokeRect(powerup.x + 3, powerup.y + 3, 24, 24);
            ctx.globalAlpha = 1;
        }

        // Draw scrolling background
        function drawBackground() {
            // Day/night cycle based on score
            const cycleProgress = (score % 1000) / 1000;
            const bgShift = Math.sin(cycleProgress * Math.PI) * 20;

            ctx.fillStyle = `rgb(${10 + bgShift}, ${10 + bgShift}, ${10 + bgShift * 2})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background SOC monitors
            backgroundElements.forEach(elem => {
                elem.x -= speed * 0.3;
                if (elem.x < -100) elem.x = canvas.width + Math.random() * 200;

                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(elem.x, elem.y, 80, 60);

                // Fake graph lines
                ctx.strokeStyle = COLORS.shield;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const px = elem.x + i * 16;
                    const py = elem.y + 20 + Math.sin((frameCount + elem.x + i * 30) * 0.1) * 15;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            });
        }

        // Draw ground with SIEM logs
        function drawGround() {
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Scrolling SIEM log text
            ctx.fillStyle = '#333';
            ctx.font = '10px Courier New';
            siemLogs.forEach(log => {
                log.x -= speed;
                if (log.x < -200) {
                    log.x = canvas.width;
                    log.text = generateLogText();
                }
                ctx.fillText(log.text, log.x, groundY + 20);
            });

            // Ground line
            ctx.strokeStyle = COLORS.shield;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
        }

        function generateLogText() {
            const events = ['ALERT', 'WARN', 'INFO', 'THREAT'];
            const sources = ['FW', 'IDS', 'EDR', 'SIEM'];
            return `[${sources[Math.floor(Math.random() * sources.length)]}] ${events[Math.floor(Math.random() * events.length)]} ${Math.floor(Math.random() * 9999)}`;
        }

        // Particle effects
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: color,
                    life: 30
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life--;

                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;

                return p.life > 0;
            });
        }

        // ============================================
        // GAME LOGIC
        // ============================================

        function initGame() {
            score = 0;
            speed = 6;
            player.y = groundY - player.height;
            player.velocityY = 0;
            player.isJumping = false;
            player.isDucking = false;
            player.shield = false;
            player.health = 1;
            obstacles = [];
            powerups = [];
            particles = [];
            frameCount = 0;
            obstaclesCleared = 0;
            comboCount = 0;
            comboMultiplier = 1;
            hasDoubleJump = false;

            // Initialize background elements
            backgroundElements = [];
            for (let i = 0; i < 5; i++) {
                backgroundElements.push({
                    x: Math.random() * canvas.width,
                    y: 50 + Math.random() * 150,
                });
            }

            // Initialize SIEM logs
            siemLogs = [];
            for (let i = 0; i < 6; i++) {
                siemLogs.push({
                    x: i * 170,
                    text: generateLogText()
                });
            }

            updateDisplay();
        }

        function startGame() {
            if (gameRunning) return;
            initGame();
            gameRunning = true;
            document.getElementById('gameOverScreen').style.display = 'none';
            playBackgroundMusic();
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            stopMusic();
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('threat_runner_high_score', highScore.toString());
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalHighScore').textContent = highScore;

            // Award XP at 500 points
            if (score >= 500) {
                awardXP();
                document.getElementById('xpMessage').style.display = 'block';
            } else {
                document.getElementById('xpMessage').style.display = 'none';
            }

            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function updateDisplay() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('levelDisplay').textContent = Math.floor(speed - 5);
            document.getElementById('comboDisplay').textContent = 'x' + comboMultiplier;
        }

        function jump() {
            if (!player.isJumping) {
                player.velocityY = jumpStrength;
                player.isJumping = true;
                canDoubleJump = true;
                playSound('jump');
            } else if (hasDoubleJump && canDoubleJump) {
                player.velocityY = jumpStrength * 0.8;
                canDoubleJump = false;
                playSound('jump');
            }
        }

        function duck() {
            if (!player.isJumping) {
                player.isDucking = true;
                playSound('duck');
            }
        }

        function spawnObstacle() {
            const types = ['ransomware', 'phishing', 'zeroday', 'ddos', 'insider', 'apt'];
            const type = types[Math.floor(Math.random() * types.length)];

            const obstacle = {
                type: type,
                x: canvas.width,
                width: 30,
                height: 30,
                color: COLORS.danger,
                revealed: false
            };

            switch (type) {
                case 'ransomware':
                    obstacle.y = groundY - obstacle.height;
                    obstacle.height = 32;
                    break;
                case 'phishing':
                    obstacle.y = groundY - 120;
                    obstacle.height = 30;
                    break;
                case 'zeroday':
                    obstacle.y = groundY - obstacle.height;
                    obstacle.color = '#8b5cf6';
                    break;
                case 'ddos':
                    obstacle.y = groundY - 80;
                    obstacle.width = 40;
                    obstacle.height = 80;
                    break;
                case 'insider':
                    obstacle.y = groundY - 28;
                    obstacle.height = 28;
                    break;
                case 'apt':
                    obstacle.y = groundY - obstacle.height;
                    obstacle.tracking = true;
                    break;
            }

            obstacles.push(obstacle);
        }

        function spawnPowerup() {
            const types = ['shield', 'siem', 'patch'];
            const type = types[Math.floor(Math.random() * types.length)];

            powerups.push({
                type: type,
                x: canvas.width,
                y: groundY - 60 - Math.random() * 80,
                width: 30,
                height: 30,
                color: type === 'shield' ? COLORS.shield : type === 'siem' ? COLORS.warning : COLORS.safe
            });
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function checkNearMiss(obstacle) {
            const distance = Math.abs((player.x + player.width) - obstacle.x);
            return distance < 10 && distance > 0;
        }

        function updateGame() {
            frameCount++;
            player.animFrame++;

            // Update player physics
            player.velocityY += gravity;
            player.y += player.velocityY;

            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // Update obstacles
            obstacles = obstacles.filter(obs => {
                obs.x -= speed;

                // APT tracking behavior
                if (obs.tracking && obs.x > player.x) {
                    const targetY = player.y;
                    obs.y += (targetY - obs.y) * 0.02;
                }

                // Insider threat reveals itself when close
                if (obs.type === 'insider' && !obs.revealed && obs.x < player.x + 100) {
                    obs.revealed = true;
                    obs.color = COLORS.danger;
                }

                // Check collision
                const playerRect = {
                    x: player.x + 2,
                    y: player.y + 2,
                    width: player.width - 4,
                    height: (player.isDucking ? player.height * 0.6 : player.height) - 4
                };

                if (checkCollision(playerRect, obs)) {
                    if (player.shield) {
                        player.shield = false;
                        createParticles(obs.x, obs.y, COLORS.shield, 10);
                        playSound('hit');
                        return false;
                    } else {
                        gameOver();
                        return true;
                    }
                }

                // Check near miss
                if (!obs.nearMissChecked && checkNearMiss(obs)) {
                    obs.nearMissChecked = true;
                    score += 5 * comboMultiplier;
                    playSound('nearmiss');
                    createParticles(player.x + player.width, player.y + player.height / 2, COLORS.warning, 5);
                }

                // Obstacle cleared
                if (obs.x + obs.width < player.x && !obs.cleared) {
                    obs.cleared = true;
                    obstaclesCleared++;
                    comboCount++;

                    if (comboCount >= 10) {
                        comboMultiplier = Math.min(comboMultiplier + 1, 5);
                        comboCount = 0;
                        createParticles(player.x, player.y, COLORS.safe, 15);
                    }

                    score += 10 * comboMultiplier;
                    updateDisplay();

                    if (score % 100 === 0) {
                        playSound('score');
                    }
                }

                return obs.x > -obs.width;
            });

            // Update powerups
            powerups = powerups.filter(powerup => {
                powerup.x -= speed;

                const playerRect = {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height
                };

                if (checkCollision(playerRect, powerup)) {
                    playSound('powerup');
                    createParticles(powerup.x, powerup.y, powerup.color, 15);

                    switch (powerup.type) {
                        case 'shield':
                            player.shield = true;
                            break;
                        case 'siem':
                            // Highlight all obstacles briefly (visual only)
                            obstacles.forEach(obs => {
                                obs.highlighted = true;
                                setTimeout(() => obs.highlighted = false, 5000);
                            });
                            break;
                        case 'patch':
                            obstacles = [];
                            break;
                    }

                    return false;
                }

                return powerup.x > -powerup.width;
            });

            // Spawn new obstacles
            if (frameCount % Math.max(60 - Math.floor(speed) * 3, 30) === 0) {
                spawnObstacle();
            }

            // Spawn powerups
            if (frameCount % 400 === 0) {
                spawnPowerup();
            }

            // Increase difficulty
            if (frameCount % 300 === 0 && speed < 15) {
                speed += 0.2;
                playSound('speedup');
            }

            // Unlock double jump at 250 points
            if (score >= 250 && !hasDoubleJump) {
                hasDoubleJump = true;
                createParticles(player.x, player.y, COLORS.safe, 20);
                playSound('powerup');
            }

            // Reset ducking
            player.isDucking = false;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawGround();

            obstacles.forEach(obs => {
                if (obs.highlighted) {
                    ctx.strokeStyle = COLORS.warning;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x - 5, obs.y - 5, obs.width + 10, obs.height + 10);
                }
                drawObstacle(obs);
            });

            powerups.forEach(drawPowerup);
            updateParticles();
            drawPlayer();

            // UI overlays
            if (hasDoubleJump && frameCount % 60 < 30) {
                ctx.fillStyle = COLORS.safe;
                ctx.font = '12px Courier New';
                ctx.fillText('DOUBLE JUMP UNLOCKED', canvas.width - 200, 30);
            }

            if (player.shield) {
                ctx.fillStyle = COLORS.shield;
                ctx.font = '12px Courier New';
                ctx.fillText('FIREWALL ACTIVE', 20, 30);
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            updateGame();
            render();

            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                duck();
            }
        });

        // Touch controls
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            touchStartY = e.touches[0].clientY;
            jump();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            const touchY = e.touches[0].clientY;
            if (touchY - touchStartY > 30) {
                duck();
            }
        });

        // Button controls
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        document.getElementById('muteBtn').addEventListener('click', () => {
            muted = !muted;
            document.getElementById('muteBtn').textContent = muted ? 'UNMUTE AUDIO' : 'MUTE AUDIO';
            if (muted) {
                stopMusic();
            } else if (gameRunning) {
                playBackgroundMusic();
            }
        });

        document.getElementById('helpBtn').addEventListener('click', () => {
            alert(`THREAT RUNNER - INTEL BRIEFING

MISSION: Survive the cyber threat landscape as a SOC analyst.

CONTROLS:
- SPACE/UP ARROW: Jump over threats
- DOWN ARROW: Duck under attacks
- Double Jump unlocks at 250 points

THREATS:
- Ransomware: Jump over skull icon
- Phishing Hook: Duck under dangling hooks
- Zero-Day: Hard to see glitchy blocks
- DDoS Wave: Duck through the gap
- Insider Threat: Friendly until revealed
- APT: Tracks your position

POWERUPS:
- Red Shield: Block one hit
- Yellow Alert: Reveals all threats
- Green Patch: Clears all obstacles

SCORING:
- +10 points per threat cleared
- +5 points for near misses
- Combo multiplier after 10 threats
- Score 500+ to earn 50 XP

SURVIVE THE SHIFT!`);
        });

        // ============================================
        // XP AWARD SYSTEM
        // ============================================

        function awardXP() {
            if (localStorage.getItem('game_threatrunner_xp_awarded')) return;
            localStorage.setItem('game_threatrunner_xp_awarded', 'true');
            let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
            xp += 50;
            localStorage.setItem('hexworth_xp', xp.toString());
            if (window.FirestoreManager) {
                const uid = localStorage.getItem('hexworth_uid');
                if (uid) FirestoreManager.addXP(uid, 50, 'Threat Runner');
            }
            if (window.AchievementManager) AchievementManager.unlock('game_threatrunner');
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        initGame();
        updateDisplay();

    </script>

    <script src="../../../components/FluxCapacitor.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
</body>
