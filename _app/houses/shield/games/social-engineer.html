        }

        }

        .timer-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .timer-fill.critical {
            background: linear-gradient(90deg, #ef4444, #dc2626);

        .score-display {

            font-size: 18px;
            color: #888;
        }

        .scenario-card {

            color: #ef4444;
            font-weight: bold;
            margin-bottom: 15px;

        .transcript-line {

        .speaker {

        .red-flag.selected {
            background: rgba(239, 68, 68, 0.4);

        /* Classification Section */
        .classification-section {
            margin-top: 25px;

        .section-title {
            color: #ef4444;

            font-weight: bold;

        .technique-grid {
            display: grid;

        .technique-btn {

            border: 2px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;

        .technique-btn:hover {
            border-color: #ef4444;
            background: #2a2a2a;
        }

        .technique-btn.selected {
            border-color: #ef4444;
            background: #ef4444;
            color: #fff;
        }

        /* Red Flags Selection */
        .red-flags-section {
            margin-top: 20px;
        }

        .red-flags-info {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .red-flags-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .red-flag-item {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;

            align-items: center;
            gap: 10px;

        .red-flag-item:hover {
            border-color: #ef4444;
            background: #2a2a2a;
        }

        .red-flag-item.selected {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);

        .red-flag-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;

        .red-flag-item.selected .red-flag-checkbox {
            background: #ef4444;
            border-color: #ef4444;
        }

        .red-flag-checkbox::after {
            content: '✓';
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .red-flag-item.selected .red-flag-checkbox::after {

        .feedback-result {

        }

        .feedback-result.correct {

        }

        .feedback-result.incorrect {

        }

        .feedback-score {
            font-size: 18px;
            color: #888;
        }

        .feedback-details {

        }

        .feedback-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #666;
        }

        .feedback-item.correct {
            border-left-color: #22c55e;
        }

        .feedback-item.incorrect {
            border-left-color: #ef4444;
        }

        .feedback-label {
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 5px;
        }

        .feedback-content {
            color: #ccc;
        }

        .explanation {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }

        .explanation-title {
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 10px;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .next-btn:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        /* Final Results */
        .final-results {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
        }

        .final-title {
            color: #ef4444;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: #22c55e;
            margin-bottom: 10px;
        }

        .final-subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
        }

        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .scenario-card {
                padding: 15px;
            }

            .classification-buttons {
                flex-direction: column;
            }

            .technique-grid {
                grid-template-columns: 1fr;
            }

            .final-score {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" onclick="history.back(); return false;" class="back-link">← Back</a>
            <h1>Social Engineer</h1>
            <p class="subtitle">Identify social engineering attacks across multiple communication channels</p>
        </header>

        <div class="game-header">
            <div class="scenario-counter" id="scenarioCounter">Scenario 1 of 12</div>
            <div class="timer-container">
                <div class="timer-label">Time Remaining: <span id="timerText">45s</span></div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
            </div>
            <div class="score-display">Score: <strong id="scoreDisplay">0</strong> / 360</div>
        </div>

        <div id="gameContainer"></div>
    </div>

    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>

    <script>
        // Game State
        let currentScenarioIndex = 0;
        let totalScore = 0;
        let timerInterval = null;
        let timeRemaining = 45;
        let scenarioResults = [];

        // Player's current selections
        let selectedClassification = null;
        let selectedTechnique = null;
        let selectedRedFlags = [];

        // Scenario Database
        const scenarios = [
            {
                id: 1,
                type: 'email',
                isLegitimate: false,
                technique: 'Phishing',
                content: {
                    from: 'security@amaz0n-support.com',
                    to: 'you@company.com',
                    subject: 'Urgent: Account Suspension Notice',
                    body: 'Dear Valued Customer,\n\nYour Amazon account will be suspended within 24 hours due to unusual activity. To prevent suspension, please verify your account information immediately by clicking the link below:\n\nhttp://amaz0n-verify-account.tk/login\n\nFailure to verify within 24 hours will result in permanent account closure.\n\nThank you,\nAmazon Security Team'
                },
                redFlags: [
                    'Misspelled domain (amaz0n instead of amazon)',
                    'Creates false urgency (24-hour deadline)',
                    'Generic greeting (Dear Valued Customer)',
                    'Suspicious URL with .tk domain',
                    'Threatens account closure'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is a classic phishing email. The sender domain uses a zero instead of the letter "o" in Amazon. The message creates false urgency to pressure you into clicking without thinking. Legitimate companies never ask you to verify credentials via email links, and Amazon would address you by name.'
            },
            {
                id: 2,
                type: 'email',
                isLegitimate: true,
                technique: null,
                content: {
                    from: 'no-reply@accounts.google.com',
                    to: 'you@company.com',
                    subject: 'Password reset confirmation for your Google Account',
                    body: 'Hi John Smith,\n\nYou recently requested a password reset for your Google Account (you@company.com).\n\nYour password was successfully changed on February 10, 2026 at 2:45 PM EST from IP address 192.168.1.100 (Your usual location: New York, NY).\n\nIf you did not make this change, please secure your account immediately:\nhttps://myaccount.google.com/security\n\nThe Google Accounts team'
                },
                redFlags: [
                    'This is actually a legitimate email',
                    'No red flags present'
                ],
                correctRedFlags: [],
                explanation: 'This is a LEGITIMATE email. It came from the correct Google domain, addresses you by name, references a password reset you actually requested, includes accurate timestamp and location data, and provides a legitimate Google security link. This scenario tests whether you can identify safe communications and avoid false positives.'
            },
            {
                id: 3,
                type: 'phone',
                isLegitimate: false,
                technique: 'Pretexting',
                content: [
                    { speaker: 'Caller', text: 'Hi, this is Dave from the IT department. How are you today?' },
                    { speaker: 'You', text: 'I\'m fine, thanks. What can I help you with?' },
                    { speaker: 'Caller', text: 'We\'re performing emergency server maintenance tonight and need to migrate all user accounts to the new system. To ensure your account transfers correctly, I need to verify your current password.' },
                    { speaker: 'You', text: 'My password? Really?' },
                    { speaker: 'Caller', text: 'Yes, it\'s just a quick verification. This is a routine procedure during migrations. What is your current password?' }
                ],
                redFlags: [
                    'Unsolicited call from "IT"',
                    'Requests password directly',
                    'Vague about specifics (which server, which system)',
                    'Creates false urgency (emergency maintenance)',
                    'IT should never ask for passwords'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is pretexting - the attacker creates a fabricated scenario (server maintenance) to justify an illegitimate request (asking for your password). Legitimate IT staff NEVER ask for your password. They can reset it without knowing it. The vague details and unsolicited nature are major red flags.'
            },
            {
                id: 4,
                type: 'physical',
                isLegitimate: false,
                technique: 'Tailgating',
                content: {
                    icon: '📦',
                    description: 'You are entering the secure server room using your badge. A person in a delivery uniform carrying several heavy boxes approaches behind you and says, "Hey, can you hold the door? My hands are full and I left my badge in the truck." The person is not wearing a visible company badge.'
                },
                redFlags: [
                    'No visible security badge',
                    'Asking to bypass security (hold the door)',
                    'Targeting a secure area (server room)',
                    'Using social pressure (hands full)',
                    'Unverified delivery person'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is tailgating (also called piggybacking) - an attacker gains physical access by following an authorized person into a restricted area. The heavy boxes create sympathy and social pressure. A legitimate delivery person would have proper authorization and escort. Always verify identity and never grant access to secure areas without proper credentials, regardless of how inconvenient it seems.'
            },
            {
                id: 5,
                type: 'email',
                isLegitimate: false,
                technique: 'Spear Phishing',
                content: {
                    from: 'ceo@companey.com',
                    to: 'cfo@company.com',
                    subject: 'RE: Urgent - Project Phoenix Payment',
                    body: 'Sarah,\n\nI need you to process an urgent wire transfer for Project Phoenix. Our new vendor TechSolutions Inc. needs the initial payment today to begin work.\n\nAmount: $50,000\nAccount: [Bank details provided]\n\nMike from legal approved this yesterday, and Jennifer in procurement has the contract. Please process this before 5 PM today as the vendor needs to order equipment tonight.\n\nThanks,\nRobert Chen\nCEO, Company Inc.'
                },
                redFlags: [
                    'Domain misspelling (companey vs company)',
                    'Urgent financial request via email',
                    'Pressure with tight deadline (before 5 PM)',
                    'Name-drops real colleagues to build trust',
                    'Unusual request (CEO rarely handles vendor payments)'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is spear phishing - a targeted attack using research about the organization. The attacker knows real employee names, current project names, and company structure. However, the domain has a subtle misspelling. The urgency and unusual request (CEO handling vendor payments) are red flags. Always verify financial requests through a separate channel (call the CEO directly).'
            },
            {
                id: 6,
                type: 'phone',
                isLegitimate: true,
                technique: null,
                content: [
                    { speaker: 'Caller', text: 'Hello, this is Marcus from IT Support calling about ticket #8472 that you submitted this morning.' },
                    { speaker: 'You', text: 'Oh yes, about my email issues?' },
                    { speaker: 'Caller', text: 'Exactly. I can see you\'re having trouble with your Outlook connection. I\'ve checked your account settings remotely and I think I can fix this. Can you try restarting Outlook now while I monitor the connection?' },
                    { speaker: 'You', text: 'Sure, let me do that.' },
                    { speaker: 'Caller', text: 'Great. And just to confirm security protocols - I won\'t need your password. I can see the connection status from my admin console. Let me know when it restarts.' }
                ],
                redFlags: [
                    'This is actually a legitimate call',
                    'IT is calling back about YOUR ticket',
                    'References specific ticket number you recognize'
                ],
                correctRedFlags: [],
                explanation: 'This is a LEGITIMATE call. The IT person is calling back about a ticket YOU opened (ticket #8472), knows the specific issue (Outlook connection), and explicitly states they don\'t need your password. They\'re using remote admin tools, which is standard IT practice. This tests whether you can distinguish between legitimate IT support and pretexting attacks.'
            },
            {
                id: 7,
                type: 'physical',
                isLegitimate: false,
                technique: 'Baiting',
                content: {
                    icon: '💾',
                    description: 'While walking to your car in the company parking lot, you notice a USB flash drive on the ground near the entrance. It has a label that reads "CONFIDENTIAL - Salary Data 2026" with your company\'s logo printed on it.'
                },
                redFlags: [
                    'Unknown USB device from untrusted source',
                    'Enticing label designed to create curiosity',
                    'Found in public area (parking lot)',
                    'Could contain malware',
                    'Social engineering through curiosity exploitation'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is baiting - leaving physical media (USB drives, CDs) in places where targets will find them. The enticing label ("Salary Data") exploits human curiosity. When plugged in, the USB could automatically install malware or ransomware. Attackers often leave multiple drives near target companies. Never plug unknown USB devices into your computer. Report found devices to security.'
            },
            {
                id: 8,
                type: 'phone',
                isLegitimate: false,
                technique: 'Vishing',
                content: [
                    { speaker: 'Caller', text: 'Hello, this is Jessica from Chase Bank fraud prevention. We\'ve detected suspicious activity on your account ending in 4782.' },
                    { speaker: 'You', text: 'Oh no, what kind of activity?' },
                    { speaker: 'Caller', text: 'Someone attempted a $2,400 purchase in California. We blocked it, but we need to verify your identity. I just sent a security code to your phone. Can you read me that code?' },
                    { speaker: 'You', text: 'I did just get a text with a code...' },
                    { speaker: 'Caller', text: 'Perfect. Please read me that 6-digit code so I can secure your account and prevent further unauthorized access.' }
                ],
                redFlags: [
                    'Unsolicited call claiming to be from bank',
                    'Creates urgency with fraud claim',
                    'Asks for security/MFA code',
                    'Caller initiated the contact',
                    'Legitimate banks never ask for codes they sent'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is vishing (voice phishing) - phone-based social engineering. The attacker knows your account number (possibly from a data breach) to build credibility. They trigger a real security code by attempting to log into your account, then trick you into reading it to them, giving them access. Never give security codes to inbound callers. Hang up and call your bank directly using the number on your card.'
            },
            {
                id: 9,
                type: 'sms',
                isLegitimate: false,
                technique: 'Smishing',
                content: {
                    from: 'USPS',
                    message: 'USPS: Your package cannot be delivered due to incomplete address information. Update your delivery preferences to avoid return to sender:\n\nhttp://usps-delivery-update.tk/track?id=94857362\n\nPackage will be returned in 48 hours if not updated.'
                },
                redFlags: [
                    'Suspicious .tk domain (not USPS.com)',
                    'Unsolicited text message',
                    'Creates false urgency (48-hour deadline)',
                    'URL doesn\'t match legitimate USPS website',
                    'USPS doesn\'t send links via SMS for address updates'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is smishing (SMS phishing) - phishing via text message. The .tk domain is a red flag (free domain often used by scammers). USPS does send delivery notifications, but they don\'t ask you to update addresses via SMS links. The link likely leads to a fake site designed to steal personal information or install mobile malware. Always navigate to USPS.com directly rather than clicking SMS links.'
            },
            {
                id: 10,
                type: 'chat',
                isLegitimate: true,
                technique: null,
                content: {
                    platform: 'Slack',
                    from: 'Jennifer Martinez (Engineering)',
                    verified: true,
                    message: 'Hey! Quick question about tomorrow\'s standup - are we still meeting at 10am or did it get moved to 2pm? I have conflicting info in my calendar.'
                },
                redFlags: [
                    'This is actually a legitimate message',
                    'From verified colleague account',
                    'Normal work-related question'
                ],
                correctRedFlags: [],
                explanation: 'This is a LEGITIMATE Slack message. It\'s from a verified colleague (Jennifer Martinez with verified badge), asking a normal work-related question about meeting times. There are no requests for credentials, no suspicious links, and no urgency. This tests whether you\'re being paranoid rather than vigilant - not every message is an attack. Healthy security awareness means distinguishing real threats from normal work communications.'
            },
            {
                id: 11,
                type: 'email',
                isLegitimate: false,
                technique: 'Quid Pro Quo',
                content: {
                    from: 'rewards@employee-survey-center.com',
                    to: 'you@company.com',
                    subject: 'You\'ve Been Selected! Free $50 Amazon Gift Card',
                    body: 'Congratulations!\n\nYou have been randomly selected to participate in our Employee Satisfaction Survey. As a thank you for your time, you will receive a $50 Amazon gift card upon completion!\n\nThe survey takes only 5 minutes. To claim your reward, please provide:\n\n- Your work email address\n- Your employee ID number\n- Your department\n- Your manager\'s name\n\nClick here to start the survey and claim your gift card:\nhttp://employee-survey-rewards.net/start\n\nOffer expires in 48 hours!'
                },
                redFlags: [
                    'Too-good-to-be-true offer (free $50 for 5 minutes)',
                    'Requests employee ID number',
                    'Unknown sender domain (not company domain)',
                    'Creates urgency (48-hour expiration)',
                    'Asks for organizational information (manager, department)'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is quid pro quo - offering something (gift card) in exchange for information. The attacker wants your employee ID and organizational details to conduct further targeted attacks or commit identity fraud. Legitimate employee surveys come from your company\'s HR department using internal systems. The external domain and too-good-to-be-true reward are major red flags. Never provide employee credentials to external surveys.'
            },
            {
                id: 12,
                type: 'physical',
                isLegitimate: false,
                technique: 'Watering Hole',
                content: {
                    icon: '💻',
                    description: 'You\'re visiting your favorite cybersecurity industry blog that you read daily. Today, when you load the page, a popup appears stating: "Critical Flash Player Update Required - Your Flash Player is out of date and must be updated to view this content. Click here to download the latest version." The popup has an official-looking Adobe logo and a download button.'
                },
                redFlags: [
                    'Unexpected software update popup',
                    'Flash Player is deprecated (no longer supported)',
                    'Trusted site may be compromised',
                    'Popup requests executable download',
                    'Legitimate updates come through OS/browser, not websites'
                ],
                correctRedFlags: [0, 1, 2, 3, 4],
                explanation: 'This is a watering hole attack - compromising a website frequently visited by the target demographic (cybersecurity professionals). The attacker knows you trust this blog and visit regularly. Flash Player was discontinued in 2020, making any Flash update request automatically suspicious. The "update" is likely malware. Legitimate software updates come through your operating system or directly from the vendor\'s official site, never through popup requests on third-party websites.'
            }
        ];

        // Initialize game
        function initGame() {
            renderScenario();
            startTimer();
        }

        // Render current scenario
        function renderScenario() {
            const scenario = scenarios[currentScenarioIndex];
            const container = document.getElementById('gameContainer');

            let scenarioHTML = '';

            // Render scenario based on type
            if (scenario.type === 'email') {
                scenarioHTML = `
                    <div class="scenario-card">
                        <div class="email-container">
                            <div class="email-header">
                                <div class="email-field"><strong>From:</strong> ${scenario.content.from}</div>
                                <div class="email-field"><strong>To:</strong> ${scenario.content.to}</div>
                                <div class="email-field"><strong>Subject:</strong> ${scenario.content.subject}</div>
                            </div>
                            <div class="email-body">${scenario.content.body.replace(/\n/g, '<br>')}</div>
                        </div>
                        ${renderClassificationSection()}
                    </div>
                `;
            } else if (scenario.type === 'phone') {
                const transcript = scenario.content.map(line => `
                    <div class="transcript-line">
                        <div class="speaker">${line.speaker}:</div>
                        <div class="dialogue">${line.text}</div>
                    </div>
                `).join('');

                scenarioHTML = `
                    <div class="scenario-card">
                        <div class="phone-transcript">
                            <div class="phone-header">📞 Phone Call Transcript</div>
                            ${transcript}
                        </div>
                        ${renderClassificationSection()}
                    </div>
                `;
            } else if (scenario.type === 'physical') {
                scenarioHTML = `
                    <div class="scenario-card">
                        <div class="physical-scenario">
                            <div class="physical-icon">${scenario.content.icon}</div>
                            <div class="physical-description">${scenario.content.description}</div>
                        </div>
                        ${renderClassificationSection()}
                    </div>
                `;
            } else if (scenario.type === 'chat') {
                scenarioHTML = `
                    <div class="scenario-card">
                        <div class="chat-container">
                            <div class="chat-header">
                                ${scenario.content.platform} - ${scenario.content.from}
                                ${scenario.content.verified ? '✓' : ''}
                            </div>
                            <div class="chat-message">${scenario.content.message}</div>
                        </div>
                        ${renderClassificationSection()}
                    </div>
                `;
            } else if (scenario.type === 'sms') {
                scenarioHTML = `
                    <div class="scenario-card">
                        <div class="sms-container">
                            <div class="sms-header">Text Message from ${scenario.content.from}</div>
                            <div class="sms-message">${scenario.content.message.replace(/\n/g, '<br>')}</div>
                        </div>
                        ${renderClassificationSection()}
                    </div>
                `;
            }

            container.innerHTML = scenarioHTML;

            // Attach event listeners
            attachEventListeners();
        }

        // Render classification section
        function renderClassificationSection() {
            const scenario = scenarios[currentScenarioIndex];

            return `
                <div class="classification-section">
                    <div class="section-title">1. Classification</div>
                    <div class="classification-buttons">
                        <button class="classification-btn safe" onclick="selectClassification('safe')">
                            ✓ SAFE
                        </button>
                        <button class="classification-btn attack" onclick="selectClassification('attack')">
                            ⚠ SOCIAL ENGINEERING
                        </button>
                    </div>

                    <div class="technique-section" id="techniqueSection">
                        <div class="section-title">2. Attack Technique</div>
                        <div class="technique-grid">
                            <button class="technique-btn" onclick="selectTechnique('Phishing')">Phishing</button>
                            <button class="technique-btn" onclick="selectTechnique('Spear Phishing')">Spear Phishing</button>
                            <button class="technique-btn" onclick="selectTechnique('Pretexting')">Pretexting</button>
                            <button class="technique-btn" onclick="selectTechnique('Tailgating')">Tailgating</button>
                            <button class="technique-btn" onclick="selectTechnique('Baiting')">Baiting</button>
                            <button class="technique-btn" onclick="selectTechnique('Vishing')">Vishing</button>
                            <button class="technique-btn" onclick="selectTechnique('Smishing')">Smishing</button>
                            <button class="technique-btn" onclick="selectTechnique('Quid Pro Quo')">Quid Pro Quo</button>
                            <button class="technique-btn" onclick="selectTechnique('Watering Hole')">Watering Hole</button>
                        </div>
                    </div>

                    <div class="red-flags-section">
                        <div class="section-title">3. Identify Red Flags</div>
                        <div class="red-flags-info">Select all warning signs you notice in this scenario:</div>
                        <div class="red-flags-list">
                            ${scenario.redFlags.map((flag, index) => `
                                <div class="red-flag-item" onclick="toggleRedFlag(${index})">
                                    <div class="red-flag-checkbox"></div>
                                    <div>${flag}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button class="submit-btn" onclick="submitAnswer()">Submit Answer</button>
                </div>
            `;
        }

        // Attach event listeners
        function attachEventListeners() {
            // Event listeners are handled via onclick in HTML for simplicity
        }

        // Select classification
        function selectClassification(type) {
            selectedClassification = type;

            // Update button states
            document.querySelectorAll('.classification-btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            if (type === 'safe') {
                document.querySelector('.classification-btn.safe').classList.add('selected');
                document.getElementById('techniqueSection').classList.remove('visible');
                selectedTechnique = null;
            } else {
                document.querySelector('.classification-btn.attack').classList.add('selected');
                document.getElementById('techniqueSection').classList.add('visible');
            }
        }

        // Select technique
        function selectTechnique(technique) {
            selectedTechnique = technique;

            // Update button states
            document.querySelectorAll('.technique-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent === technique) {
                    btn.classList.add('selected');
                }
            });
        }

        // Toggle red flag selection
        function toggleRedFlag(index) {
            const flagIndex = selectedRedFlags.indexOf(index);
            if (flagIndex > -1) {
                selectedRedFlags.splice(flagIndex, 1);
            } else {
                selectedRedFlags.push(index);
            }

            // Update UI
            const items = document.querySelectorAll('.red-flag-item');
            items[index].classList.toggle('selected');
        }

        // Submit answer
        function submitAnswer() {
            stopTimer();

            const scenario = scenarios[currentScenarioIndex];
            let scenarioScore = 0;
            const feedback = {
                classification: { correct: false, points: 0 },
                technique: { correct: false, points: 0 },
                redFlags: { correct: 0, total: 0, points: 0 }
            };

            // Check classification
            const isCorrectClassification =
                (selectedClassification === 'safe' && scenario.isLegitimate) ||
                (selectedClassification === 'attack' && !scenario.isLegitimate);

            if (isCorrectClassification) {
                scenarioScore += 10;
                feedback.classification.correct = true;
                feedback.classification.points = 10;
            }

            // Check technique (only if attack and not legitimate)
            if (!scenario.isLegitimate) {
                if (selectedTechnique === scenario.technique) {
                    scenarioScore += 10;
                    feedback.technique.correct = true;
                    feedback.technique.points = 10;
                }
            } else {
                // For legitimate scenarios, technique should be null
                if (selectedClassification === 'safe') {
                    scenarioScore += 10;
                    feedback.technique.correct = true;
                    feedback.technique.points = 10;
                }
            }

            // Check red flags
            const correctFlags = scenario.correctRedFlags;
            let correctlyIdentified = 0;

            for (const flag of correctFlags) {
                if (selectedRedFlags.includes(flag)) {
                    correctlyIdentified++;
                    scenarioScore += 5;
                }
            }

            feedback.redFlags.correct = correctlyIdentified;
            feedback.redFlags.total = correctFlags.length;
            feedback.redFlags.points = correctlyIdentified * 5;

            totalScore += scenarioScore;

            // Store result
            scenarioResults.push({
                scenario: scenario.id,
                score: scenarioScore,
                feedback: feedback
            });

            // Show feedback
            showFeedback(scenario, feedback, scenarioScore);
        }

        // Show feedback
        function showFeedback(scenario, feedback, scenarioScore) {
            const container = document.getElementById('gameContainer');
            const maxScenarioScore = 10 + 10 + (scenario.correctRedFlags.length * 5);

            const isCorrect = feedback.classification.correct &&
                            feedback.technique.correct &&
                            feedback.redFlags.correct === feedback.redFlags.total;

            let feedbackHTML = `
                <div class="feedback-section">
                    <div class="feedback-header">
                        <div class="feedback-result ${isCorrect ? 'correct' : 'incorrect'}">
                            ${isCorrect ? '✓ Excellent Analysis!' : '⚠ Review Needed'}
                        </div>
                        <div class="feedback-score">
                            Earned: ${scenarioScore} / ${maxScenarioScore} points
                        </div>
                    </div>

                    <div class="feedback-details">
                        <div class="feedback-item ${feedback.classification.correct ? 'correct' : 'incorrect'}">
                            <div class="feedback-label">Classification: ${feedback.classification.points} pts</div>
                            <div class="feedback-content">
                                Your answer: <strong>${selectedClassification === 'safe' ? 'SAFE' : 'SOCIAL ENGINEERING'}</strong><br>
                                Correct answer: <strong>${scenario.isLegitimate ? 'SAFE' : 'SOCIAL ENGINEERING'}</strong>
                            </div>
                        </div>

                        <div class="feedback-item ${feedback.technique.correct ? 'correct' : 'incorrect'}">
                            <div class="feedback-label">Technique: ${feedback.technique.points} pts</div>
                            <div class="feedback-content">
                                Your answer: <strong>${selectedTechnique || 'None (Safe)'}</strong><br>
                                Correct answer: <strong>${scenario.technique || 'None (Legitimate)'}</strong>
                            </div>
                        </div>

                        <div class="feedback-item ${feedback.redFlags.correct === feedback.redFlags.total ? 'correct' : 'incorrect'}">
                            <div class="feedback-label">Red Flags: ${feedback.redFlags.points} pts</div>
                            <div class="feedback-content">
                                You identified ${feedback.redFlags.correct} of ${feedback.redFlags.total} red flags correctly
                            </div>
                        </div>

                        <div class="explanation">
                            <div class="explanation-title">📚 Explanation</div>
                            <div>${scenario.explanation}</div>
                        </div>
                    </div>

                    <button class="next-btn" onclick="nextScenario()">
                        ${currentScenarioIndex < scenarios.length - 1 ? 'Next Scenario →' : 'View Final Results →'}
                    </button>
                </div>
            `;

            container.innerHTML = feedbackHTML;

            // Update score display
            document.getElementById('scoreDisplay').textContent = totalScore;
        }

        // Next scenario
        function nextScenario() {
            currentScenarioIndex++;

            if (currentScenarioIndex >= scenarios.length) {
                showFinalResults();
            } else {
                // Reset selections
                selectedClassification = null;
                selectedTechnique = null;
                selectedRedFlags = [];

                // Update counter
                document.getElementById('scenarioCounter').textContent =
                    `Scenario ${currentScenarioIndex + 1} of ${scenarios.length}`;

                // Render next scenario
                renderScenario();
                startTimer();
            }
        }

        // Timer functions
        function startTimer() {
            timeRemaining = 45;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    stopTimer();
                    autoSubmit();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const percentage = (timeRemaining / 45) * 100;
            const fill = document.getElementById('timerFill');
            const text = document.getElementById('timerText');

            fill.style.width = percentage + '%';
            text.textContent = timeRemaining + 's';

            fill.classList.remove('warning', 'critical');
            if (timeRemaining <= 10) {
                fill.classList.add('critical');
            } else if (timeRemaining <= 20) {
                fill.classList.add('warning');
            }
        }

        function autoSubmit() {
            // If player hasn't answered, submit with current selections (possibly incomplete)
            if (selectedClassification) {
                submitAnswer();
            } else {
                // Force a safe classification if nothing selected
                selectedClassification = 'safe';
                submitAnswer();
            }
        }

        // Show final results
        function showFinalResults() {
            const maxPossibleScore = scenarios.reduce((total, scenario) => {
                return total + 10 + 10 + (scenario.correctRedFlags.length * 5);
            }, 0);

            const percentage = Math.round((totalScore / maxPossibleScore) * 100);

            let performanceMessage = '';
            if (percentage >= 90) {
                performanceMessage = 'Outstanding! You have excellent social engineering detection skills.';
            } else if (percentage >= 75) {
                performanceMessage = 'Great work! You caught most of the attacks.';
            } else if (percentage >= 60) {
                performanceMessage = 'Good effort! Review the scenarios to improve your detection skills.';
            } else {
                performanceMessage = 'Keep practicing! Social engineering is subtle and requires careful attention.';
            }

            const correctClassifications = scenarioResults.filter(r => r.feedback.classification.correct).length;
            const correctTechniques = scenarioResults.filter(r => r.feedback.technique.correct).length;

            const container = document.getElementById('gameContainer');
            container.innerHTML = `
                <div class="final-results">
                    <div class="final-title">Mission Complete!</div>
                    <div class="final-score">${totalScore} / ${maxPossibleScore}</div>
                    <div class="final-subtitle">${percentage}% - ${performanceMessage}</div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${correctClassifications}/12</div>
                            <div class="stat-label">Correct Classifications</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${correctTechniques}/12</div>
                            <div class="stat-label">Correct Techniques</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${percentage}%</div>
                            <div class="stat-label">Accuracy</div>
                        </div>
                    </div>

                    <button class="restart-btn" onclick="restartGame()">Play Again</button>
                </div>
            `;

            // Award XP and achievement
            awardCompletion();

            // Track game completion
            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('soceng', { score: totalScore, total: maxPossibleScore });
            }
        }

        // Award XP and achievement
        function awardCompletion() {
            if (!localStorage.getItem('game_soceng_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_soceng_xp_awarded', 'true');
                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    const uid = localStorage.getItem('hexworth_uid');
                    if (uid) FirestoreManager.addXP(uid, 50, 'Social Engineer Complete');
                }
            }
            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_soceng');
            }
        }

        // Restart game
        function restartGame() {
            currentScenarioIndex = 0;
            totalScore = 0;
            scenarioResults = [];
            selectedClassification = null;
            selectedTechnique = null;
            selectedRedFlags = [];

            document.getElementById('scenarioCounter').textContent = 'Scenario 1 of 12';
            document.getElementById('scoreDisplay').textContent = '0';

            initGame();
        }

        // Initialize game on page load
        initGame();
    </script>
</body>
</html>
