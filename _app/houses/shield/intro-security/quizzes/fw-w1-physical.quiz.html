        <a href="../index.html">&larr; Back to First Watch Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 1: Physical Security',
            description: '15 questions on physical security controls — locks, badges, biometrics, CCTV, environmental controls, secure areas, and mantraps',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w1-physical',
            moduleId: 'fw-w1-physical',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "A mantrap (or access control vestibule) prevents unauthorized entry by requiring what mechanism?",
                    options: [
                        "Two interlocking doors where the first must close before the second opens",
                        "A single reinforced door with a biometric scanner",
                        "A turnstile connected to an alarm system",
                        "A guard station with a sign-in sheet"
                    ],explanation: "A mantrap (now often called an access control vestibule) uses two interlocking doors that cannot be open simultaneously. A person enters through the first door, which must close and lock before the second door can be unlocked. This prevents tailgating and piggybacking by ensuring only one authenticated person passes through at a time."
                },
                {
                    question: "Which biometric method measures the unique pattern of blood vessels in the eye?",
                    options: [
                        "Retinal scanning",
                        "Fingerprint scanning",
                        "Facial recognition",
                        "Voice recognition"
                    ],explanation: "Retinal scanning maps the unique pattern of blood vessels at the back of the eye using infrared light. It is one of the most accurate biometric methods but requires close proximity to the scanner. Iris scanning (different from retinal) examines the colored ring around the pupil. Both are eye-based biometrics but measure different structures."
                },
                {
                    question: "What is the primary purpose of a Faraday cage in a secure facility?",
                    options: [
                        "To prevent physical break-ins through reinforced walls",
                        "To maintain constant temperature for server equipment",
                        "To suppress fire using inert gas",
                        "To block electromagnetic signals from entering or leaving an area"
                    ],explanation: "A Faraday cage is an enclosure made of conductive material that blocks electromagnetic fields. In security contexts, it prevents wireless signals (Wi-Fi, cellular, Bluetooth, RFID) from entering or leaving a room. This stops wireless eavesdropping, signal interception, and electromagnetic emanations (TEMPEST) from leaking sensitive data."
                },
                {
                    question: "An organization installs CCTV cameras at all entry points. What type of security control does this represent?",
                    options: [
                        "Preventive control only",
                        "Corrective control",
                        "Detective and deterrent control",
                        "Compensating control"
                    ],explanation: "CCTV cameras serve as both detective controls (they record events for later review and investigation) and deterrent controls (their visible presence discourages potential attackers). They do not prevent an attack from happening — they detect and deter. A locked door would be a preventive control."
                },
                {
                    question: "Which environmental control protects server rooms from fire damage without harming electronic equipment?",
                    options: [
                        "Wet-pipe sprinkler system",
                        "Dry chemical extinguisher",
                        "Foam-based suppression system",
                        "Clean agent fire suppression (e.g., FM-200 or Novec 1230)"
                    ],explanation: "Clean agent fire suppression systems like FM-200 (HFC-227ea) or Novec 1230 extinguish fires by removing heat without leaving residue or water damage. They are safe for use around electronics and are the standard for data centers and server rooms. Water-based sprinklers would destroy electronic equipment."
                },
                {
                    question: "What is tailgating in the context of physical security?",
                    options: [
                        "Following too closely behind a vehicle in a parking lot",
                        "An unauthorized person following an authorized person through a secured door before it closes",
                        "Monitoring someone's screen from behind them",
                        "Intercepting wireless badge signals at a distance"
                    ],explanation: "Tailgating (also called piggybacking) occurs when an unauthorized person follows closely behind an authorized person to pass through a secured door or access point without presenting their own credentials. The key difference: tailgating is done without the authorized person's knowledge, while piggybacking implies the authorized person is aware and complicit."
                },
                {
                    question: "A proximity card (prox card) used for building access operates using what technology?",
                    options: [
                        "Radio Frequency Identification (RFID)",
                        "Bluetooth Low Energy (BLE)",
                        "Near Field Communication (NFC) only",
                        "Infrared (IR) transmission"
                    ],explanation: "Proximity cards use RFID technology operating at 125 kHz (legacy) or 13.56 MHz (smart cards). The card contains a small antenna and chip that transmit a unique identifier when energized by the reader's electromagnetic field. While NFC is a subset of RFID, traditional prox cards use the broader RFID standard. Smart cards (like HID iCLASS) add encryption to prevent cloning."
                },
                {
                    question: "Which physical security measure uses bollards?",
                    options: [
                        "Preventing electromagnetic interference",
                        "Monitoring personnel movement with sensors",
                        "Controlling humidity in server rooms",
                        "Blocking vehicle access to a building or area"
                    ],explanation: "Bollards are short, sturdy vertical posts installed to prevent vehicles from ramming into buildings, pedestrian areas, or secure perimeters. They can be fixed (permanent), removable, or retractable (hydraulic). Anti-ram bollards are rated by their ability to stop vehicles of specific weights at specific speeds (ASTM F2656 ratings)."
                },
                {
                    question: "What does HVAC monitoring in a data center primarily protect against?",
                    options: [
                        "Unauthorized physical access",
                        "Equipment failure due to temperature and humidity extremes",
                        "Electromagnetic pulse attacks",
                        "Power surges from lightning strikes"
                    ],explanation: "HVAC (Heating, Ventilation, and Air Conditioning) monitoring ensures server rooms maintain optimal temperature (typically 64-75F / 18-24C) and humidity (40-60% relative). Equipment overheating causes hardware failure and data loss. Too much humidity causes condensation; too little causes electrostatic discharge. Environmental monitoring systems alert staff to deviations before damage occurs."
                },
                {
                    question: "A security guard checks photo IDs at the front desk before issuing visitor badges. This is an example of which access control type?",
                    options: [
                        "Technical (logical) control",
                        "Detective control only",
                        "Physical and administrative control",
                        "Compensating control"
                    ],explanation: "This combines physical control (the guard physically verifying identity and issuing a badge) with administrative control (the policy requiring ID checks and visitor badge procedures). The guard is a physical deterrent and gatekeeper; the ID verification policy is an administrative procedure. Technical controls would be electronic systems like card readers or biometric scanners."
                },
                {
                    question: "Which type of lock provides the highest level of physical security for a server room?",
                    options: [
                        "Standard pin tumbler deadbolt",
                        "Cipher lock (push-button combination)",
                        "Electronic lock with multi-factor authentication (badge + PIN or biometric)",
                        "Padlock with hardened steel shackle"
                    ],explanation: "Electronic locks with multi-factor authentication provide the highest security because they combine something you have (badge/card) with something you know (PIN) or something you are (biometric). They also provide audit trails of every access attempt with timestamps. Single-factor locks (key, combination, or badge alone) are more vulnerable to compromise."
                },
                {
                    question: "What is the purpose of a cable lock on a laptop?",
                    options: [
                        "To encrypt the hard drive contents",
                        "To prevent unauthorized USB device connections",
                        "To ground the device against electrostatic discharge",
                        "To physically secure the device to a fixed object to prevent theft"
                    ],explanation: "Cable locks (Kensington locks) attach to a security slot on a laptop and anchor it to a desk, table, or other fixed object. They deter opportunistic theft in public or shared spaces. While they can be cut with bolt cutters, they prevent casual grab-and-go theft. They are a physical control — they do not protect data, only the hardware."
                },
                {
                    question: "An uninterruptible power supply (UPS) protects equipment from which threats?",
                    options: [
                        "Only power outages (blackouts)",
                        "Power outages, voltage sags, surges, and brief interruptions",
                        "Only lightning strikes and power surges",
                        "Only brownouts and frequency variations"
                    ],explanation: "A UPS protects against multiple power anomalies: blackouts (complete loss), brownouts (voltage sags), surges (voltage spikes), noise (electromagnetic interference), and brief interruptions. Line-interactive and online/double-conversion UPS models provide continuous power conditioning. The battery backup allows graceful shutdown during extended outages, preventing data corruption."
                },
                {
                    question: "Which document establishes the rules and procedures for who can access a secure area and under what conditions?",
                    options: [
                        "Acceptable Use Policy (AUP)",
                        "Physical Security Policy and access control procedures",
                        "Service Level Agreement (SLA)",
                        "Business Continuity Plan (BCP)"
                    ],explanation: "The Physical Security Policy defines who is authorized to access secure areas, what credentials are required, visitor escort procedures, hours of access, and emergency protocols. It is an administrative control that governs all physical access decisions. The AUP covers acceptable use of IT resources, the SLA defines service commitments, and the BCP covers disaster recovery."
                },
                {
                    question: "Placing a server room in the interior of a building with no exterior walls is an example of what security concept?",
                    options: [
                        "Defense in depth through layered physical barriers",
                        "Obscurity-based security",
                        "Network segmentation",
                        "Environmental hardening"
                    ],explanation: "Placing a server room in the building interior creates multiple physical layers an attacker must bypass: the building perimeter, the floor access controls, hallway access, and finally the server room door. Each layer adds delay and detection opportunity. This is defense in depth applied to physical security — the same principle used in network security with firewalls, IDS, and segmentation."
                }
            ]
        });
        quiz.start();
    </script>
