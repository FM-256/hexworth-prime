<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to First Watch Hub</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 3: Windows OS Security',
            description: '15 questions on Windows Defender, BitLocker, Windows Firewall, UAC, Group Policy, and audit policies',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w3-os-security',
            moduleId: 'fw-w3-os-security',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Windows Defender (Microsoft Defender Antivirus) provides which type of protection?",
                    options: [
                        "Only signature-based file scanning",
                        "Real-time protection using signatures, heuristics, behavioral monitoring, and cloud-delivered protection",
                        "Only firewall and network monitoring",
                        "Only email scanning for phishing"
                    ],explanation: "Microsoft Defender Antivirus is a multi-layered endpoint protection platform. It combines traditional signature-based detection with behavioral monitoring (detecting suspicious process behavior), heuristic analysis (identifying unknown malware by code patterns), cloud-delivered protection (rapid definition updates), and exploit protection. In enterprise environments, it integrates with Microsoft Defender for Endpoint for advanced threat hunting."
                },
                {
                    question: "BitLocker encrypts data using which encryption standard?",
                    options: [
                        "DES (Data Encryption Standard)",
                        "AES (128-bit or 256-bit)",
                        "RSA-2048",
                        "MD5 hashing"
                    ],explanation: "BitLocker uses AES encryption — either AES-128 or AES-256 in XTS mode (XTS-AES). AES-128 is the default; AES-256 can be configured via Group Policy for higher security requirements. BitLocker stores its encryption key in the TPM (Trusted Platform Module) chip, which verifies system integrity at boot. If the boot process is tampered with, BitLocker refuses to release the key."
                },
                {
                    question: "User Account Control (UAC) in Windows is designed to:",
                    options: [
                        "Encrypt user files on the desktop",
                        "Prompt for administrative consent before allowing changes that could affect system security or other users",
                        "Manage user passwords and enforce complexity requirements",
                        "Monitor network traffic for suspicious activity"
                    ],explanation: "UAC reduces the attack surface by running applications with standard user privileges even when an administrator is logged in. When an action requires elevated privileges (installing software, changing system settings, modifying protected files), UAC prompts for consent (admins) or credentials (standard users). This prevents malware from silently making system-wide changes without user awareness."
                },
                {
                    question: "Group Policy Objects (GPOs) in Active Directory allow administrators to:",
                    options: [
                        "Only manage printer connections across the network",
                        "Centrally configure and enforce security settings, software deployment, and user restrictions across domain-joined computers",
                        "Only reset user passwords remotely",
                        "Only monitor real-time network traffic"
                    ],explanation: "GPOs are the primary mechanism for centralized management in Windows domains. Administrators can enforce password policies, configure firewall rules, deploy software, restrict USB access, configure BitLocker, set audit policies, lock down Control Panel settings, and hundreds of other configurations — all pushed automatically to domain-joined computers. GPOs apply at site, domain, or OU level."
                },
                {
                    question: "Windows Firewall with Advanced Security can filter traffic based on:",
                    options: [
                        "Only IP addresses and port numbers",
                        "IP addresses, ports, protocols, applications, users, and connection security (IPsec) rules",
                        "Only domain names and URLs",
                        "Only inbound traffic — outbound traffic is always allowed"
                    ],explanation: "Windows Firewall with Advanced Security (WFAS) supports inbound rules, outbound rules, and connection security rules (IPsec). Rules can filter by program path, port, protocol, IP address/range, interface type, service, user/group (authenticated via IPsec), and Windows Store app. It supports three profiles: Domain (domain-joined), Private (home/work), and Public (untrusted), each with independent rule sets."
                },
                {
                    question: "Windows audit policies track which types of events?",
                    options: [
                        "Only failed login attempts",
                        "Logon events, object access, privilege use, policy changes, account management, and system events",
                        "Only file deletion events",
                        "Only changes made by administrator accounts"
                    ],explanation: "Windows Advanced Audit Policy Configuration tracks nine categories: Account Logon, Account Management, Detailed Tracking (process creation/termination), DS Access, Logon/Logoff, Object Access (file/registry/printer), Policy Change, Privilege Use, and System events. Each category has subcategories with Success/Failure audit options. Events are recorded in the Security Event Log, typically forwarded to a SIEM for analysis."
                },
                {
                    question: "The Local Security Policy editor (secpol.msc) allows configuration of:",
                    options: [
                        "Only screen saver timeout settings",
                        "Account policies, local policies (audit, user rights, security options), and other security-related settings on a local machine",
                        "Only network adapter settings",
                        "Only Windows Update schedules"
                    ],explanation: "Local Security Policy (secpol.msc) provides access to security configuration on standalone or non-domain computers: Account Policies (password policy, account lockout), Local Policies (audit policy, user rights assignments, security options), Windows Firewall rules, IPsec policies, and software restriction policies. On domain-joined machines, GPOs override local security policy settings."
                },
                {
                    question: "BitLocker Recovery Key is essential because:",
                    options: [
                        "It is needed every time the computer starts up normally",
                        "It allows access to the encrypted drive if the TPM detects a boot integrity change or the TPM fails",
                        "It replaces the user's Windows password",
                        "It is used to encrypt files individually"
                    ],explanation: "The BitLocker Recovery Key (48-digit numerical key) is a backup mechanism. If the TPM detects changes to the boot process (BIOS update, boot drive change, hardware modification), it withholds the encryption key and requires the recovery key. Without the recovery key, the encrypted data is permanently inaccessible. Recovery keys should be stored in Active Directory, Azure AD, or printed and secured physically."
                },
                {
                    question: "Windows Credential Guard protects against:",
                    options: [
                        "Phishing emails targeting user inboxes",
                        "Credential theft attacks (Pass-the-Hash, Pass-the-Ticket) by isolating secrets in a hardware-backed virtual container",
                        "USB-based malware infections",
                        "Brute-force attacks against the login screen"
                    ],explanation: "Credential Guard uses virtualization-based security (VBS) to isolate NTLM hashes, Kerberos tickets, and other credentials in a protected memory space that even kernel-level malware cannot access. This prevents popular credential theft techniques like Pass-the-Hash, Pass-the-Ticket, and Mimikatz-based LSASS dumping. It requires UEFI Secure Boot, TPM 2.0, and Hyper-V."
                },
                {
                    question: "Windows Event ID 4625 in the Security Log indicates:",
                    options: [
                        "A successful user logon",
                        "A failed logon attempt",
                        "A system shutdown event",
                        "A successful file access"
                    ],explanation: "Event ID 4625 is logged when a logon attempt fails. The event details include the target account name, source IP address, logon type (interactive, network, remote desktop), and failure reason (bad password, account locked, account disabled). Monitoring for clusters of 4625 events is critical for detecting brute-force and password spraying attacks. Event 4624 is the corresponding successful logon event."
                },
                {
                    question: "Windows Defender Firewall uses three network profiles. What are they?",
                    options: [
                        "Internal, External, and DMZ",
                        "Domain, Private, and Public",
                        "Trusted, Untrusted, and Neutral",
                        "Home, Work, and Enterprise"
                    ],explanation: "Windows Firewall has three profiles: Domain (active when the computer is connected to its Active Directory domain — typically the most permissive), Private (for trusted home or work networks — moderate rules), and Public (for untrusted networks like coffee shops or airports — most restrictive). Each profile has independent inbound/outbound rule sets. Network Location Awareness (NLA) service determines which profile applies."
                },
                {
                    question: "AppLocker in Windows is used to:",
                    options: [
                        "Lock the computer screen after inactivity",
                        "Control which applications, scripts, and installers users are allowed to run based on rules",
                        "Lock user accounts after failed login attempts",
                        "Encrypt application data at rest"
                    ],explanation: "AppLocker is an application whitelisting feature that allows administrators to define rules controlling which executables (.exe), scripts (.ps1, .bat, .vbs), Windows Installers (.msi), DLLs, and packaged apps users can run. Rules are based on publisher (digital signature), path, or file hash. AppLocker is managed through Group Policy and is a powerful defense against unauthorized software and malware execution."
                },
                {
                    question: "The principle behind Windows Secure Boot is to:",
                    options: [
                        "Speed up the boot process by skipping hardware checks",
                        "Ensure that only trusted, digitally signed firmware and OS boot loaders execute during startup",
                        "Encrypt the entire hard drive during the boot process",
                        "Authenticate the user before the OS loads"
                    ],explanation: "Secure Boot is a UEFI firmware feature that validates the digital signatures of boot loaders, firmware drivers, and OS kernels before execution. If a component is unsigned or signed by an untrusted certificate, Secure Boot blocks it from loading. This prevents bootkits and rootkits from loading before the OS and antimalware software. It is a requirement for Windows 11 and BitLocker with TPM."
                },
                {
                    question: "Windows Security Baselines provided by Microsoft are:",
                    options: [
                        "Default Windows installations with no additional configuration",
                        "Pre-configured GPO templates with recommended security settings based on Microsoft's security guidance",
                        "Third-party antivirus configuration files",
                        "Network infrastructure blueprints for Windows environments"
                    ],explanation: "Microsoft Security Baselines are GPO templates containing recommended security configurations for Windows OS, Microsoft Edge, Microsoft 365, and other products. They are published with each major Windows release and include settings for password policies, audit policies, user rights, Windows Firewall, Defender, and hundreds of other security parameters. Organizations import these baselines and customize them for their environment using the Security Compliance Toolkit (SCT)."
                },
                {
                    question: "What is the purpose of the Windows LAPS (Local Administrator Password Solution)?",
                    options: [
                        "To synchronize user passwords across all domain computers",
                        "To automatically manage and rotate unique local administrator passwords on each domain-joined computer",
                        "To encrypt passwords stored in Active Directory",
                        "To enforce password complexity for domain user accounts"
                    ],explanation: "Windows LAPS (formerly Microsoft LAPS) automatically generates unique, random local administrator passwords for each domain-joined computer and stores them securely in Active Directory or Azure AD. This eliminates the common security risk of using the same local admin password on every workstation — if one is compromised, only that single machine is affected. Passwords rotate automatically on a configurable schedule."
                }
            ]
        });
        quiz.start();
    </script>
