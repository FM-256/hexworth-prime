        <a href="../index.html">&larr; Back to First Watch Hub</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 3: Social Engineering',
            description: '15 questions on phishing, vishing, smishing, pretexting, tailgating, threat actors, and vulnerabilities',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w3-social',
            moduleId: 'fw-w3-social',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Phishing is BEST defined as:",
                    options: [
                        "A social engineering attack using fraudulent emails or messages to trick recipients into revealing sensitive information or clicking malicious links",
                        "A physical attack where an intruder follows an employee through a secured door",
                        "A network attack that floods a server with traffic to cause a denial of service",
                        "A brute-force attack against a password database"
                    ],explanation: "Phishing uses deceptive communications (typically email) that impersonate trusted entities to trick victims into revealing credentials, financial information, or clicking malicious links/attachments. It exploits trust and urgency. Phishing is the most common initial attack vector — Verizon's DBIR consistently reports it as the top method for data breaches."
                },
                {
                    question: "Spear phishing differs from regular phishing because it:",
                    options: [
                        "Targets specific individuals or organizations with personalized, researched content",
                        "Uses phone calls instead of emails",
                        "Requires physical access to the victim's computer",
                        "Only targets financial institutions"
                    ],explanation: "Spear phishing is targeted — the attacker researches the victim (via LinkedIn, social media, company websites) and crafts a personalized message that appears to come from a trusted colleague, vendor, or authority figure. Regular phishing is mass-distributed to thousands of recipients with generic content. Spear phishing has a much higher success rate because the personalization increases credibility."
                },
                {
                    question: "Vishing is a social engineering attack conducted through:",
                    options: [
                        "Email messages with malicious attachments",
                        "Text messages containing malicious links",
                        "Voice calls (phone or VoIP) where the attacker impersonates a trusted entity",
                        "Fake websites that mimic legitimate login pages"
                    ],explanation: "Vishing (voice phishing) uses phone calls to manipulate victims. Attackers impersonate banks, tech support, government agencies, or IT departments. Caller ID spoofing makes calls appear to come from legitimate numbers. Tactics include creating urgency (your account is compromised), authority (this is your bank's fraud department), and fear (the IRS is filing charges). VoIP technology makes vishing cheap and scalable."
                },
                {
                    question: "Smishing attacks are delivered via:",
                    options: [
                        "Email",
                        "Voice phone calls",
                        "Social media direct messages only",
                        "SMS text messages or messaging apps"
                    ],explanation: "Smishing (SMS phishing) uses text messages to deliver social engineering attacks. Messages typically contain urgent prompts (package delivery failed, suspicious account activity, prize notification) with a malicious link or phone number. Smishing exploits the trust people place in text messages and the smaller screen size of mobile devices, which makes it harder to verify URLs before clicking."
                },
                {
                    question: "Pretexting involves:",
                    options: [
                        "Sending mass emails to random recipients",
                        "Using malware to capture keystrokes",
                        "Creating a fabricated scenario (pretext) to manipulate a victim into providing information or performing an action",
                        "Physically breaking into a building to steal equipment"
                    ],explanation: "Pretexting is creating a false narrative to establish trust and manipulate the victim. The attacker assumes a role (IT technician, vendor, auditor, police officer) and constructs a believable story to extract information. Example: calling an employee while pretending to be from the help desk, claiming they need the employee's password to fix a system issue. Pretexting requires research and social skills."
                },
                {
                    question: "Whaling targets:",
                    options: [
                        "New employees who are unfamiliar with security policies",
                        "IT administrators with access to server infrastructure",
                        "Random individuals through mass email campaigns",
                        "High-level executives (C-suite) or senior leadership with highly customized attacks"
                    ],explanation: "Whaling is spear phishing specifically targeting high-value individuals — CEOs, CFOs, board members, and senior executives. These targets have authority to authorize wire transfers, access sensitive data, and make strategic decisions. Whaling emails are extremely well-crafted, often referencing real business deals, legal matters, or board-level concerns. A successful whale attack can result in multi-million dollar losses."
                },
                {
                    question: "A watering hole attack works by:",
                    options: [
                        "Sending poisoned USB drives to targeted organizations",
                        "Compromising a website frequently visited by the target group and injecting malicious code",
                        "Creating a fake Wi-Fi hotspot near the target's office",
                        "Intercepting mail deliveries to the target organization"
                    ],explanation: "A watering hole attack identifies websites frequented by the target group (industry forums, professional associations, regional news sites), compromises one of those sites, and injects malicious code (exploit kit, drive-by download). When target employees visit the compromised site, their browsers execute the malicious code. The name comes from predators waiting at a watering hole for prey to arrive."
                },
                {
                    question: "Which social engineering principle does an attacker exploit when impersonating a CEO and demanding immediate action from an employee?",
                    options: [
                        "Authority",
                        "Reciprocity",
                        "Likability",
                        "Consensus"
                    ],explanation: "The authority principle exploits the human tendency to comply with requests from perceived authority figures. When an attacker impersonates a CEO, police officer, or IT director, victims are less likely to question the request. Business Email Compromise (BEC) attacks frequently exploit authority — a spoofed email from the CEO to the CFO requesting an urgent wire transfer has caused billions in losses worldwide."
                },
                {
                    question: "An attacker leaves infected USB drives in a company's parking lot, hoping employees will pick them up and plug them in. This is called:",
                    options: [
                        "Phishing",
                        "Pretexting",
                        "Shoulder surfing",
                        "Baiting"
                    ],explanation: "Baiting exploits curiosity or greed by offering something enticing (a USB drive labeled 'Salary Information', a free movie download, a promotional gift). The physical variant involves leaving infected USB drives in locations where targets will find them. When plugged in, the USB can auto-execute malware, install a backdoor, or act as a HID (Human Interface Device) keyboard that types malicious commands."
                },
                {
                    question: "Shoulder surfing is a technique where an attacker:",
                    options: [
                        "Sends a phishing email with an embedded keylogger",
                        "Creates a fake login page to capture credentials",
                        "Observes a victim entering sensitive information by looking over their shoulder or using cameras",
                        "Intercepts wireless network traffic"
                    ],explanation: "Shoulder surfing is the direct observation of someone entering sensitive data — PINs at ATMs, passwords on laptops, badge codes at doors. It can be done in person (standing nearby) or remotely (using binoculars, cameras, or even satellite imagery for outdoor keypads). Countermeasures: privacy screens on laptops, shielding keypads when entering PINs, and awareness of surroundings."
                },
                {
                    question: "A threat actor with limited technical skills who uses pre-built tools and scripts to launch attacks is called a:",
                    options: [
                        "Advanced Persistent Threat",
                        "Script kiddie",
                        "Nation-state actor",
                        "Insider threat"
                    ],explanation: "Script kiddies (also called skiddies) lack deep technical knowledge but use readily available tools, exploit kits, and tutorials to launch attacks. While individually less sophisticated than APTs or nation-state actors, script kiddies can still cause significant damage — especially with powerful tools like Metasploit, Cobalt Strike (cracked versions), or ransomware-as-a-service platforms that require minimal skill to operate."
                },
                {
                    question: "An insider threat is particularly dangerous because:",
                    options: [
                        "Insiders always have more technical skills than external attackers",
                        "Insiders already have legitimate access, knowledge of systems, and can bypass perimeter defenses",
                        "Insiders are impossible to detect with any security tool",
                        "Insiders only target financial data"
                    ],explanation: "Insider threats (malicious employees, disgruntled staff, or compromised accounts) are dangerous because they already possess legitimate credentials, understand internal systems and processes, and operate inside the security perimeter. They bypass firewalls, intrusion detection, and other perimeter controls. Detection requires User and Entity Behavior Analytics (UEBA), Data Loss Prevention (DLP), and access monitoring."
                },
                {
                    question: "Business Email Compromise (BEC) typically involves:",
                    options: [
                        "Hacking into the organization's email server to read all messages",
                        "Sending mass spam emails to the organization's customers",
                        "Encrypting the organization's email archive for ransom",
                        "Impersonating or compromising a business executive's email to request fraudulent wire transfers or sensitive data"
                    ],explanation: "BEC attacks impersonate executives (spoofed or compromised email accounts) to request wire transfers, payroll changes, or sensitive data from employees authorized to process those requests. The FBI's IC3 reports BEC as the most financially damaging cybercrime — over $2.9 billion in reported losses in 2023 alone. BEC succeeds because it exploits business processes and authority, not technical vulnerabilities."
                },
                {
                    question: "Dumpster diving in a security context refers to:",
                    options: [
                        "Searching through physical trash for discarded documents containing sensitive information",
                        "Scanning deleted files on a hard drive",
                        "Browsing abandoned websites for leaked credentials",
                        "Searching social media for personal information"
                    ],explanation: "Dumpster diving involves searching through physical waste — discarded documents, sticky notes, printouts, old hard drives, or storage media — for sensitive information like passwords, network diagrams, financial records, or employee data. Countermeasures: shred or cross-cut shred all sensitive documents, destroy storage media before disposal, and implement a clean desk policy."
                },
                {
                    question: "A zero-day vulnerability is dangerous because:",
                    options: [
                        "It only exists for one day before being patched",
                        "It is a flaw exploited before the vendor is aware of it or has released a patch",
                        "It only affects systems that have not been updated in zero days",
                        "It has a CVSS score of exactly 0.0"
                    ],explanation: "A zero-day vulnerability is a software flaw unknown to the vendor and for which no patch exists. 'Zero-day' means the vendor has had zero days to fix it. Zero-day exploits are extremely valuable — they are traded on dark markets and used by nation-state actors and APT groups. Defense against zero-days requires defense in depth: behavioral detection, application whitelisting, network segmentation, and threat intelligence."
                }
            ]
        });
        quiz.start();
    </script>
