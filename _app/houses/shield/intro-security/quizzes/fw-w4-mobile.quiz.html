<body>

        <a href="../index.html">&larr; Back to First Watch Hub</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 4: Mobile Security',
            description: '15 questions on MDM, remote wipe, encryption, app permissions, BYOD policies, and jailbreaking risks',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w4-mobile',
            moduleId: 'fw-w4-mobile',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Mobile Device Management (MDM) allows organizations to:",
                    options: [
                        "Only track the physical location of employee devices",
                        "Centrally manage, configure, secure, and monitor mobile devices — enforcing policies, deploying apps, and enabling remote wipe",
                        "Replace mobile antivirus software entirely",
                        "Only restrict phone call capabilities"
                    ],explanation: "MDM platforms (Microsoft Intune, VMware Workspace ONE, Jamf, MobileIron) provide comprehensive mobile device management: enforce security policies (passwords, encryption), deploy and manage applications, configure Wi-Fi and VPN profiles, monitor device compliance, enable remote wipe and remote lock, and segregate corporate data from personal data via containerization. MDM is essential for BYOD and corporate-owned device management."
                },
                {
                    question: "Remote wipe is used when:",
                    options: [
                        "An employee wants to reset their phone to factory settings for personal reasons",
                        "A device is lost or stolen, and the organization needs to erase corporate data to prevent unauthorized access",
                        "The MDM server needs to push a software update",
                        "An employee's contract is renewed"
                    ],explanation: "Remote wipe erases data on a lost/stolen device to prevent unauthorized access to corporate information. Full wipe resets the entire device to factory defaults. Selective wipe (enterprise wipe) removes only corporate data and apps while preserving personal data — this is preferred for BYOD devices. Remote wipe requires the device to have network connectivity; if the SIM is removed or the device is in airplane mode, the wipe command queues until reconnection."
                },
                {
                    question: "Jailbreaking an iOS device or rooting an Android device is a security concern because:",
                    options: [
                        "It improves the device's battery life and performance",
                        "It removes built-in security controls, allows installation of unvetted apps, and exposes the device to malware",
                        "It enables stronger encryption than the factory default",
                        "It is required to install corporate MDM profiles"
                    ],explanation: "Jailbreaking (iOS) and rooting (Android) bypass the manufacturer's security sandbox, granting root/superuser access. This disables code signing verification (allowing unvetted apps), removes sandboxing between apps, may disable automatic security updates, and exposes the device to malware that requires root privileges. MDM solutions detect jailbroken/rooted devices and can automatically block access to corporate resources."
                },
                {
                    question: "BYOD (Bring Your Own Device) policies introduce which primary security challenge?",
                    options: [
                        "Employees using devices that are too expensive for the organization",
                        "Balancing employee privacy on personal devices with the organization's need to protect corporate data",
                        "Devices connecting to the internet too frequently",
                        "Employees choosing devices with incompatible screen sizes"
                    ],explanation: "BYOD creates a tension between corporate security and employee privacy. The organization needs to protect its data (encryption, remote wipe capability, compliance monitoring) but the device belongs to the employee (personal photos, messages, browsing history). Containerization solves this by creating a separate, encrypted workspace for corporate data that can be independently managed and wiped without touching personal content."
                },
                {
                    question: "Mobile application permissions should follow which security principle?",
                    options: [
                        "Grant all requested permissions to ensure apps function correctly",
                        "Least privilege — only grant the minimum permissions the app needs to function",
                        "Deny all permissions and troubleshoot as needed",
                        "Only review permissions on first installation, never again"
                    ],explanation: "Apps should receive only the permissions necessary for their function. A flashlight app does not need access to contacts, camera, microphone, or location. Excessive permissions indicate data harvesting or malicious intent. Both Android and iOS now support granular runtime permissions — users can grant/deny individual permissions and revoke them later. Organizations should define approved permission profiles via MDM."
                },
                {
                    question: "Full-device encryption on a mobile device protects data when:",
                    options: [
                        "The device is connected to public Wi-Fi",
                        "The device is powered off or locked — data at rest is encrypted and requires the passcode/biometric to decrypt",
                        "The user is actively using the device and it is unlocked",
                        "The device is connected to a VPN"
                    ],explanation: "Full-device encryption (FDE) on mobile devices encrypts all data at rest on the storage chip. When the device is locked or powered off, the data is encrypted and inaccessible without the correct passcode, PIN, or biometric. iOS has used hardware encryption (with the Secure Enclave) since iPhone 3GS. Android mandated FDE starting with Android 6.0 and file-based encryption (FBE) with Android 7.0+."
                },
                {
                    question: "A mobile VPN is important for:",
                    options: [
                        "Increasing mobile data speed on cellular networks",
                        "Encrypting data in transit when connecting to untrusted networks like public Wi-Fi hotspots",
                        "Blocking incoming phone calls from unknown numbers",
                        "Extending battery life by reducing background data usage"
                    ],explanation: "Mobile VPNs encrypt all traffic between the device and the VPN endpoint, protecting against eavesdropping on public Wi-Fi, hotel networks, and other untrusted networks. Without a VPN, an attacker on the same network can intercept unencrypted traffic via man-in-the-middle attacks. Per-app VPN (available on iOS and Android via MDM) routes only corporate app traffic through the VPN, preserving battery and bandwidth for personal use."
                },
                {
                    question: "Sideloading apps on Android refers to:",
                    options: [
                        "Installing apps exclusively from the Google Play Store",
                        "Installing apps from sources outside the official app store by enabling 'Unknown Sources'",
                        "Downloading app updates over cellular data instead of Wi-Fi",
                        "Installing apps on an external SD card"
                    ],explanation: "Sideloading means installing APK files from sources other than Google Play — email attachments, websites, file sharing, or third-party app stores. This bypasses Google Play Protect's malware scanning and app vetting process, significantly increasing malware risk. Android requires explicitly enabling 'Install unknown apps' per source. Enterprise MDM policies should block sideloading on corporate and BYOD devices."
                },
                {
                    question: "Mobile containerization creates:",
                    options: [
                        "A physical barrier that prevents the device from being dropped",
                        "A separate, encrypted workspace on the device that isolates corporate data and apps from personal data",
                        "A duplicate of the device's data on a cloud server",
                        "A sandboxed testing environment for app developers"
                    ],explanation: "Containerization creates an encrypted, policy-controlled workspace on the mobile device. Corporate email, documents, and apps exist inside this container, completely isolated from personal apps and data. The container can be independently managed: enforced encryption, prevented copy/paste to personal apps, and selectively wiped when the employee leaves — all without touching personal photos, messages, or apps."
                },
                {
                    question: "Which mobile threat involves an attacker intercepting communications between a mobile device and a cell tower using a fake base station?",
                    options: [
                        "Evil twin Wi-Fi attack",
                        "IMSI catcher (Stingray) attack",
                        "Bluetooth bluesnarfing",
                        "SMS phishing (smishing)"
                    ],explanation: "IMSI catchers (commercially known as Stingrays) are devices that impersonate legitimate cell towers. Mobile phones connect to the strongest signal, so they connect to the IMSI catcher instead of the real tower. The attacker can then intercept calls, text messages, and data, track the device's location, and potentially inject malicious content. 4G/5G networks have improved authentication to mitigate this, but vulnerabilities remain."
                },
                {
                    question: "Mobile application whitelisting through MDM ensures that:",
                    options: [
                        "All apps from the app store are automatically approved",
                        "Only pre-approved applications can be installed on managed devices, blocking unapproved or risky apps",
                        "Users can install any app but receive a warning",
                        "Apps are automatically updated without user consent"
                    ],explanation: "MDM application whitelisting defines a list of approved apps that can be installed on managed devices. Any app not on the whitelist is blocked from installation. This prevents employees from installing games, unauthorized cloud storage (data exfiltration risk), vulnerable apps, or known-malicious apps. Combined with a managed app catalog, it provides a secure, curated app experience for corporate users."
                },
                {
                    question: "A lost device protocol should include which steps?",
                    options: [
                        "Wait 48 hours to see if the device is returned, then report it",
                        "Immediately report the loss, trigger remote lock, assess data exposure, initiate remote wipe if necessary, and revoke device certificates",
                        "Post on social media asking if anyone found the device",
                        "Only change the user's email password"
                    ],explanation: "A lost/stolen device procedure must be immediate: the user reports the loss to IT, IT triggers remote lock (prevents unauthorized access while preserving data), IT assesses what corporate data was on the device, IT initiates remote wipe if the risk is high, device certificates and tokens are revoked, and the incident is documented. The faster the response, the lower the data exposure risk. MDM makes all of these actions possible remotely."
                },
                {
                    question: "Push notifications can be a security concern because:",
                    options: [
                        "They consume too much battery power",
                        "Sensitive information displayed in lock screen notifications can be read by anyone who can see the device",
                        "They prevent the device from connecting to Wi-Fi",
                        "They only work on jailbroken devices"
                    ],explanation: "Lock screen notification previews can expose sensitive information — email subject lines, message contents, two-factor authentication codes, calendar appointments — to anyone who can see the screen. This is a confidentiality risk in public places. Mitigation: configure 'Hide sensitive notification content' on the lock screen (both iOS and Android support this), or enforce this setting via MDM policy."
                },
                {
                    question: "Geotagging in photos taken with mobile devices can expose:",
                    options: [
                        "The phone number of the device owner",
                        "The exact GPS coordinates of where the photo was taken, potentially revealing sensitive locations",
                        "The device's MAC address and IP address",
                        "The names of all contacts stored on the device"
                    ],explanation: "Geotagging embeds GPS coordinates (latitude/longitude), timestamp, and sometimes altitude in the photo's EXIF metadata. If photos are shared publicly (social media, forums), anyone can extract the geotag and determine exactly where and when the photo was taken — revealing home addresses, workplace locations, travel patterns, and secure facility locations. Mitigation: disable location services for the camera app or strip EXIF data before sharing."
                },
                {
                    question: "Corporate email on mobile devices should be protected by:",
                    options: [
                        "Only a simple 4-digit PIN",
                        "A combination of device encryption, strong passcode/biometric, containerization, and conditional access policies that verify device compliance before granting access",
                        "Only the email app's built-in password",
                        "Downloading all emails to the device for offline access without encryption"
                    ],explanation: "Corporate email protection requires multiple layers: device encryption (protects data at rest), strong authentication (passcode + biometric), containerization (isolates corporate email from personal apps), and conditional access (verifies the device meets security requirements — patched, not jailbroken, encrypted, MDM enrolled — before allowing Exchange/M365 access). Azure AD Conditional Access and Microsoft Intune enforce this for M365 environments."
                }
            ]
        });
        quiz.start();
    </script>
