    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 4: Data Destruction',
            description: '15 questions on NIST 800-88, degaussing, overwriting, shredding, SSD vs HDD sanitization, and certificates of destruction',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w4-data',
            moduleId: 'fw-w4-data',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "NIST Special Publication 800-88 provides guidelines for:",
                    options: [
                        "Media sanitization — the proper methods for destroying data on storage media",
                        "Network security configuration",
                        "Password complexity requirements for federal systems",
                        "Incident response procedures for data breaches"
                    ],explanation: "NIST SP 800-88 Rev. 1 (Guidelines for Media Sanitization) is the authoritative standard for data destruction. It defines three levels of sanitization: Clear (logical overwrite), Purge (resistant to state-of-the-art lab techniques), and Destroy (physical destruction making recovery impossible). The publication provides specific guidance for each media type (HDD, SSD, tape, optical, mobile devices) and minimum requirements for each sanitization level."
                },
                {
                    question: "Degaussing is effective for destroying data on:",
                    options: [
                        "Magnetic media such as traditional hard drives (HDDs) and magnetic tapes",
                        "Solid-state drives (SSDs) and flash memory",
                        "Optical discs (CDs, DVDs, Blu-rays)",
                        "Cloud storage services"
                    ],explanation: "Degaussing uses a powerful magnetic field to erase data by randomizing the magnetic domains on the storage media. It is effective on magnetic media: HDDs (spinning platters), magnetic tapes, and floppy disks. Degaussing is NOT effective on SSDs, flash drives, or optical media because these do not store data magnetically. After degaussing, an HDD is permanently unusable — the servo tracks are destroyed."
                },
                {
                    question: "Why is degaussing ineffective for SSDs?",
                    options: [
                        "SSDs are too small for the degaussing equipment",
                        "SSDs have built-in degaussing protection",
                        "SSDs store data as electrical charges in flash memory cells, not as magnetic patterns, so magnetic fields have no effect",
                        "Degaussing only works on devices larger than 3.5 inches"
                    ],explanation: "SSDs use NAND flash memory that stores data as electrical charges trapped in floating-gate transistors. Since there is no magnetic medium, applying a magnetic field has zero effect on the stored data. SSD sanitization requires different methods: ATA Secure Erase (firmware-level erase), cryptographic erase (destroying the encryption key), or physical destruction (shredding, disintegrating, or incinerating the chips)."
                },
                {
                    question: "Overwriting (data wiping) as a sanitization method involves:",
                    options: [
                        "Simply deleting files and emptying the Recycle Bin",
                        "Removing the drive's label and serial number",
                        "Reformatting the drive with a new file system",
                        "Writing known patterns (zeros, ones, or random data) over every addressable storage location on the media"
                    ],explanation: "Overwriting replaces all data with known patterns by writing to every addressable sector on the drive. NIST 800-88 classifies single-pass overwriting with verification as sufficient for the 'Clear' level. The DoD 5220.22-M standard historically required three passes (pattern, complement, random), but modern drives need only one verified pass. Software tools: DBAN, Eraser, nwipe. Note: overwriting may miss bad sectors, HPA, and DCO areas on HDDs."
                },
                {
                    question: "A certificate of destruction (CoD) documents:",
                    options: [
                        "The original purchase price of the destroyed equipment",
                        "The insurance claim for the destroyed equipment",
                        "The complete record of media sanitization — serial numbers, sanitization method used, date, technician, and verification results",
                        "The warranty status of the destroyed equipment"
                    ],explanation: "A certificate of destruction provides legal proof that data was properly sanitized. It typically includes: organization name, media type and serial numbers, sanitization method applied, date and time, name of the technician or vendor who performed the destruction, verification results, and supervisor approval. CoDs are required for regulatory compliance (HIPAA, PCI-DSS, GDPR) and should be retained as part of the organization's records management program."
                },
                {
                    question: "Physical shredding of hard drives is classified under which NIST 800-88 sanitization category?",
                    options: [
                        "Clear",
                        "Purge",
                        "Destroy",
                        "Archive"
                    ],explanation: "Physical destruction (shredding, disintegrating, pulverizing, incinerating, or melting) falls under the 'Destroy' category — the highest level of sanitization in NIST 800-88. It renders the media physically unusable and data recovery impossible by any known technique. Industrial shredders reduce drives to pieces smaller than 2mm. This is the only guaranteed method for highly classified data and the recommended method for SSDs when cryptographic erase is unavailable."
                },
                {
                    question: "Cryptographic erase (CE) sanitizes an SSD by:",
                    options: [
                        "Physically destroying the encryption chip on the drive",
                        "Overwriting the entire drive with encrypted random data",
                        "Reformatting the drive with an encrypted file system",
                        "Deleting the encryption key, rendering all encrypted data on the drive permanently unreadable"
                    ],explanation: "Self-encrypting drives (SEDs) encrypt all data with a media encryption key (MEK) stored on the drive. Cryptographic erase deletes the MEK — without this key, all data on the drive is cryptographically unrecoverable, even though the encrypted data physically remains on the NAND chips. CE is nearly instantaneous (it only erases a small key, not terabytes of data) and is NIST 800-88's recommended 'Purge' method for SEDs."
                },
                {
                    question: "Simply deleting files and formatting a drive does NOT securely destroy data because:",
                    options: [
                        "Deletion only removes the file system pointers — the actual data remains on the drive and can be recovered with forensic tools",
                        "The operating system prevents all forms of data deletion",
                        "Formatting encrypts the data instead of deleting it",
                        "Deletion moves data to a hidden partition"
                    ],explanation: "When you delete a file, the OS only marks the space as available — it does not overwrite the actual data. The file's content remains on the disk until it is overwritten by new data. Quick format only rebuilds the file system structure. Forensic tools (Autopsy, FTK, Recuva) can recover deleted files, even from formatted drives. This is why proper sanitization (overwrite, degauss, or destroy) is essential before disposing of any storage media."
                },
                {
                    question: "The NIST 800-88 'Clear' sanitization level protects against:",
                    options: [
                        "State-sponsored forensic recovery using electron microscopy",
                        "All possible recovery techniques including physical media analysis",
                        "Only accidental data access by the next user",
                        "Simple, non-invasive data recovery techniques such as running file recovery software"
                    ],explanation: "The 'Clear' level uses logical techniques (overwriting with a fixed pattern on all addressable locations) to protect against non-invasive recovery methods — standard file recovery software, undelete tools, and basic forensic utilities. Clear does NOT protect against advanced laboratory techniques that can read residual data patterns. Clear is appropriate for media being reused within the same security environment."
                },
                {
                    question: "For SSDs, the ATA Secure Erase command:",
                    options: [
                        "Is identical to a quick format operation",
                        "Is a firmware-level command that erases all data including hidden areas, spare blocks, and over-provisioned space",
                        "Only erases the first sector of the drive",
                        "Physically destroys the NAND flash chips"
                    ],explanation: "ATA Secure Erase is a firmware-level command built into the drive controller that erases all user data areas, including spare blocks, over-provisioned space, and areas not accessible through normal read/write commands. For SSDs, the Enhanced Secure Erase variant also resets all NAND cells to their factory state. However, effectiveness depends on the drive manufacturer's implementation — some implementations have been found to be incomplete."
                },
                {
                    question: "An organization is decommissioning servers that contained classified government data. The MINIMUM acceptable sanitization method is:",
                    options: [
                        "Clear (single-pass overwrite)",
                        "Quick format followed by reinstalling the OS",
                        "Destroy (physical destruction such as shredding or disintegration)",
                        "Purge (degaussing for HDDs)"
                    ],explanation: "For classified government data, NIST 800-88 and NSA/CSS guidelines require physical destruction (Destroy level). The media must be rendered physically unusable — shredding to particles no larger than 2mm, disintegration, incineration, or chemical dissolution. Even Purge-level methods may be insufficient for top secret data because they leave the media physically intact. The destruction must be verified and documented with a certificate of destruction."
                },
                {
                    question: "Data remanence refers to:",
                    options: [
                        "Data that is actively being transmitted across a network",
                        "Backup copies of data stored offsite",
                        "Data stored in cloud services that cannot be accessed locally",
                        "Residual data that remains on storage media after attempted deletion or sanitization"
                    ],explanation: "Data remanence is the residual representation of data that remains after attempts to erase it. On magnetic media, residual magnetic patterns may persist after overwriting. On SSDs, wear-leveling may leave old data copies in unmapped blocks. Even after a format or simple deletion, substantial data remanence exists. Proper sanitization (Clear/Purge/Destroy per NIST 800-88) addresses data remanence at increasing levels of assurance."
                },
                {
                    question: "Incineration as a data destruction method is used for:",
                    options: [
                        "Only paper documents and printed media",
                        "Any media type requiring the highest assurance of destruction — drives, tapes, optical media, and printed documents",
                        "Only magnetic tapes and floppy disks",
                        "Only defective drives that cannot be shredded"
                    ],explanation: "Industrial incineration (at temperatures exceeding 1,500F / 815C) melts and destroys all storage media types: hard drives, SSDs, tapes, optical discs, USB drives, and printed documents. It provides the highest physical assurance of data destruction. The process must be conducted by a certified destruction vendor with documented chain of custody and a certificate of destruction. Incineration is commonly used for classified and highly sensitive media."
                },
                {
                    question: "When decommissioning a leased copier or multifunction printer, the organization should:",
                    options: [
                        "Sanitize or remove the internal hard drive because modern copiers store images of every document scanned, copied, or printed",
                        "Simply return it to the leasing company without any data considerations",
                        "Only clear the paper trays and replace the toner",
                        "Reset the network settings to factory defaults"
                    ],explanation: "Modern copiers and multifunction printers contain hard drives that store digital images of every document processed — potentially containing sensitive data (medical records, financial documents, legal papers, classified information). Before returning, selling, or disposing of these devices, the internal hard drive must be sanitized (overwritten or removed and destroyed). CBS News famously demonstrated recovering sensitive documents from copier hard drives purchased at a warehouse sale."
                },
                {
                    question: "A data sanitization policy should specify:",
                    options: [
                        "Only the brand of shredder to purchase",
                        "Sanitization methods for each data classification level and media type, verification requirements, documentation requirements, and approved vendors",
                        "Only the frequency of data backups",
                        "Only which employees are allowed to delete files"
                    ],explanation: "A comprehensive data sanitization policy defines: media types covered (HDD, SSD, tape, paper, mobile), required sanitization method per data classification (public/internal/confidential/classified), verification procedures (visual inspection, read-back verification, third-party audit), documentation requirements (certificates of destruction, asset tracking), approved vendors for outsourced destruction, chain of custody procedures, and exception handling for media that cannot be sanitized."
                }
            ]
        });
        quiz.start();
    </script>
