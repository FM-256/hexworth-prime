<body>

        <a href="../index.html">&larr; Back to First Watch Hub</a>

    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 2: Wireless Security',
            description: '15 questions on wireless security protocols, 802.1X, RADIUS, and common wireless attacks',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w2-wireless',
            moduleId: 'fw-w2-wireless',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "WEP (Wired Equivalent Privacy) is considered insecure primarily because of:",
                    options: [
                        "Its short initialization vector (IV) and flawed RC4 key scheduling that allows key recovery",
                        "Its use of AES encryption which has known vulnerabilities",
                        "Its incompatibility with modern wireless access points",
                        "Its requirement for a RADIUS authentication server"
                    ],explanation: "WEP uses a 24-bit initialization vector (IV) with RC4 stream cipher. The short IV means IVs repeat frequently on busy networks, and the FMS attack (Fluhrer, Mantin, Shamir) exploits weak key scheduling to recover the WEP key from captured packets. A WEP key can be cracked in minutes with tools like aircrack-ng. WEP was deprecated in 2004 by IEEE 802.11i (WPA2)."
                },
                {
                    question: "WPA2-Enterprise differs from WPA2-Personal because it:",
                    options: [
                        "Uses 802.1X authentication with a RADIUS server to assign unique session keys per user",
                        "Uses a longer pre-shared key for better encryption",
                        "Only works on 5 GHz wireless networks",
                        "Requires WPA3-compatible hardware"
                    ],explanation: "WPA2-Enterprise uses IEEE 802.1X port-based authentication with a RADIUS server. Each user authenticates with unique credentials (username/password, certificate, or token), and the RADIUS server generates a unique Pairwise Master Key (PMK) for each session. WPA2-Personal uses a single Pre-Shared Key (PSK) shared by all users — if one person leaks the PSK, everyone is compromised."
                },
                {
                    question: "What major security improvement does WPA3 introduce over WPA2?",
                    options: [
                        "Support for 6 GHz frequency bands",
                        "Mandatory use of RADIUS servers for all connections",
                        "Simultaneous Authentication of Equals (SAE) which replaces the 4-way handshake PSK exchange",
                        "Built-in VPN functionality"
                    ],explanation: "WPA3 introduces SAE (Simultaneous Authentication of Equals), also known as Dragonfly key exchange. SAE provides forward secrecy — even if the password is later compromised, previously captured traffic cannot be decrypted. SAE also resists offline dictionary attacks against captured handshakes, which was WPA2-PSK's biggest weakness (the KRACK and PMKID attacks)."
                },
                {
                    question: "An evil twin attack works by:",
                    options: [
                        "Jamming all wireless signals in an area to cause a denial of service",
                        "Exploiting WPS PIN vulnerabilities to gain network access",
                        "Spoofing the MAC address of a wireless client",
                        "Setting up a rogue access point with the same SSID as a legitimate network to intercept client connections"
                    ],explanation: "An evil twin is a rogue access point configured with the same SSID (and sometimes the same BSSID) as a legitimate network. Unsuspecting clients connect to the stronger signal or first-available AP and send their traffic through the attacker's device. The attacker can then capture credentials, inject malicious content, or perform man-in-the-middle attacks. Tools like Fluxion automate this attack."
                },
                {
                    question: "A deauthentication attack exploits which weakness in 802.11?",
                    options: [
                        "The encryption algorithm used for data frames",
                        "The DHCP process used to assign IP addresses",
                        "The fact that 802.11 management frames (including deauth frames) are not authenticated or encrypted in WPA2",
                        "The WPS PIN exchange protocol"
                    ],explanation: "In WPA2, management frames (including deauthentication and disassociation frames) are sent unencrypted and unauthenticated. An attacker can forge deauth frames to disconnect clients from an AP, forcing them to reconnect — often to an evil twin. WPA3 and 802.11w (Protected Management Frames / PMF) address this by authenticating management frames."
                },
                {
                    question: "802.1X is a standard for:",
                    options: [
                        "Wireless encryption using AES-CCMP",
                        "Wireless frequency allocation and channel management",
                        "VPN tunnel establishment over wireless networks",
                        "Port-based network access control that authenticates devices before granting network access"
                    ],explanation: "IEEE 802.1X is a port-based network access control (PNAC) standard. It defines three roles: the supplicant (client requesting access), the authenticator (switch or AP that controls access), and the authentication server (typically RADIUS). The authenticator blocks all traffic from the supplicant until the RADIUS server validates credentials. 802.1X works on both wired and wireless networks."
                },
                {
                    question: "RADIUS (Remote Authentication Dial-In User Service) serves what primary function in wireless security?",
                    options: [
                        "Encrypting wireless traffic between the client and access point",
                        "Providing centralized authentication, authorization, and accounting (AAA) services",
                        "Managing wireless channel assignments to avoid interference",
                        "Scanning for rogue access points on the network"
                    ],explanation: "RADIUS provides centralized AAA services: Authentication (verifying user identity), Authorization (determining access level and policies), and Accounting (logging session data for auditing and billing). In wireless deployments, the access point forwards authentication requests to the RADIUS server, which validates credentials against a directory (Active Directory, LDAP) and returns accept/reject decisions."
                },
                {
                    question: "MAC address filtering on a wireless access point:",
                    options: [
                        "Is easily bypassed because MAC addresses can be spoofed with readily available tools",
                        "Provides strong security by encrypting traffic based on MAC addresses",
                        "Eliminates the need for WPA2 encryption",
                        "Prevents all forms of wireless attacks"
                    ],explanation: "MAC filtering allows or blocks devices based on their MAC address, but it provides minimal security because MAC addresses are transmitted in plaintext in 802.11 frame headers. An attacker can sniff legitimate MAC addresses with tools like airodump-ng and spoof them using macchanger or ifconfig. MAC filtering is security through obscurity, not a substitute for encryption and authentication."
                },
                {
                    question: "Hidden SSID (disabling SSID broadcast) is considered a weak security measure because:",
                    options: [
                        "It prevents all clients from connecting to the network",
                        "It is incompatible with WPA2 encryption",
                        "It causes significant performance degradation",
                        "The SSID is still transmitted in probe requests and responses, making it easily discoverable with wireless analysis tools"
                    ],explanation: "When SSID broadcast is disabled, the AP does not include the SSID in beacon frames. However, the SSID is still transmitted in probe requests (from clients seeking the network) and probe responses (from the AP). Any wireless analyzer (Wireshark, airodump-ng, Kismet) captures these frames and reveals the hidden SSID. It adds inconvenience but negligible security."
                },
                {
                    question: "WPS (Wi-Fi Protected Setup) is vulnerable because:",
                    options: [
                        "It uses WEP encryption for the setup process",
                        "It transmits the pre-shared key in cleartext",
                        "The 8-digit PIN is validated in two halves, reducing the brute-force space from 100 million to approximately 11,000 attempts",
                        "It only works with outdated wireless standards"
                    ],explanation: "WPS validates the 8-digit PIN in two separate halves (4+3 digits, plus 1 checksum digit). Instead of 10^8 (100 million) combinations, an attacker only needs about 10^4 + 10^3 = 11,000 attempts. Tools like Reaver and Bully automate this brute-force attack and can recover the WPA2 PSK in hours. Best practice is to disable WPS entirely on all access points."
                },
                {
                    question: "EAP (Extensible Authentication Protocol) in wireless networks is used to:",
                    options: [
                        "Encrypt data frames between the client and access point",
                        "Provide a framework for various authentication methods within 802.1X",
                        "Manage wireless roaming between access points",
                        "Assign IP addresses to wireless clients"
                    ],explanation: "EAP is an authentication framework (not a specific mechanism) used within 802.1X. It supports multiple authentication methods: EAP-TLS (certificate-based, most secure), PEAP (password in TLS tunnel), EAP-TTLS (similar to PEAP), and EAP-FAST (Cisco). The choice of EAP method determines the security strength of the 802.1X deployment."
                },
                {
                    question: "Which wireless attack captures the WPA2 4-way handshake to perform offline password cracking?",
                    options: [
                        "ARP spoofing attack",
                        "DNS poisoning attack",
                        "Bluetooth bluesnarfing attack",
                        "Handshake capture followed by dictionary or brute-force attack"
                    ],explanation: "An attacker uses a wireless adapter in monitor mode (with airodump-ng) to capture the WPA2 4-way handshake between a client and AP. They may send deauth frames to force reconnection. The captured handshake file is then cracked offline using tools like hashcat or aircrack-ng with wordlists or brute-force rules. This is why strong, long passphrases are critical for WPA2-PSK networks."
                },
                {
                    question: "A wireless intrusion prevention system (WIPS) protects against which threats?",
                    options: [
                        "Only denial-of-service attacks against the wired network",
                        "Rogue access points, evil twins, deauthentication attacks, and unauthorized wireless clients",
                        "Only encryption weaknesses in WPA2",
                        "Physical theft of wireless access points"
                    ],explanation: "A WIPS continuously monitors the wireless environment using dedicated sensors. It detects and can automatically mitigate: rogue APs (unauthorized access points), evil twin attacks, ad-hoc networks, deauth floods, unauthorized clients, and policy violations. Enterprise WIPS solutions from vendors like Cisco, Aruba, and Fortinet integrate with wireless controllers for automated containment."
                },
                {
                    question: "TKIP (Temporal Key Integrity Protocol) was introduced with WPA as a replacement for WEP encryption. Why was TKIP itself later replaced by AES-CCMP in WPA2?",
                    options: [
                        "TKIP still used RC4 as its underlying cipher and had known cryptographic weaknesses, while AES-CCMP provides significantly stronger encryption",
                        "TKIP was too slow for modern wireless speeds",
                        "TKIP was incompatible with 5 GHz wireless bands",
                        "TKIP required specialized hardware that was too expensive"
                    ],explanation: "TKIP was a stopgap designed to work on existing WEP hardware by adding per-packet key mixing and a message integrity check (MIC) over RC4. However, TKIP inherited RC4's fundamental weaknesses, and attacks like Beck-Tews and Ohigashi-Morii demonstrated practical exploits. WPA2 mandated AES-CCMP (Counter Mode with CBC-MAC Protocol), which uses the much stronger AES block cipher."
                },
                {
                    question: "What is the recommended action when a rogue access point is discovered on a corporate network?",
                    options: [
                        "Ignore it if it is not broadcasting an SSID",
                        "Immediately locate and disconnect the device, then investigate how it was connected and by whom",
                        "Connect to it to determine its purpose",
                        "Change the corporate Wi-Fi password"
                    ],explanation: "A rogue AP is an unauthorized access point connected to the corporate network, potentially bypassing all perimeter security controls. Immediate response: physically locate and disconnect it, identify who installed it and why, scan for any data exfiltration or lateral movement, and review access logs. Rogue APs are a critical security risk because they create an unmonitored entry point into the trusted network."
                }
            ]
        });
        quiz.start();
    </script>
