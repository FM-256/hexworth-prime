        <a href="../index.html">&larr; Back to First Watch Hub</a>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 3: Workstation Hardening',
            description: '15 questions on disabling services, patch management, application whitelisting, browser hardening, and USB restrictions',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w3-workstation',
            moduleId: 'fw-w3-workstation',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "System hardening is BEST defined as:",
                    options: [
                        "Reducing the attack surface by removing unnecessary software, services, accounts, and features, and applying secure configurations",
                        "Installing the latest version of the operating system",
                        "Adding more hardware resources to improve system performance",
                        "Enabling all available features to maximize functionality"
                    ],explanation: "System hardening systematically reduces the attack surface — every unnecessary service, port, account, and feature is a potential vulnerability. The CIS (Center for Internet Security) Benchmarks and DISA STIGs provide detailed hardening guides for every major OS and application. The goal is to leave only what is needed for the system's intended purpose, fully patched and securely configured."
                },
                {
                    question: "Why should unnecessary services and ports be disabled on a workstation?",
                    options: [
                        "Each running service and open port is a potential attack vector that increases the system's attack surface",
                        "To free up disk space for user files",
                        "To prevent users from customizing their desktop",
                        "To reduce the amount of RAM used by the system"
                    ],explanation: "Every running service listens on a port and processes input — each is a potential target for exploitation. For example, if SMBv1 is enabled but not needed, an attacker can exploit EternalBlue (the vulnerability behind WannaCry). Disabling unnecessary services and closing unused ports eliminates these attack vectors. The principle: if you do not need it, disable it."
                },
                {
                    question: "Patch management is critical because:",
                    options: [
                        "Patches always improve system performance",
                        "Unpatched systems cannot connect to the internet",
                        "Software patches fix known vulnerabilities that attackers actively exploit",
                        "Patches are required for software license compliance only"
                    ],explanation: "Patches address known vulnerabilities disclosed through CVEs (Common Vulnerabilities and Exposures). Attackers routinely scan for and exploit unpatched systems — often within hours of a patch release (n-day exploits). The WannaCry ransomware exploited MS17-010, a vulnerability that had been patched two months earlier. Organizations that had not applied the patch were devastated. Patch Tuesday (Microsoft) releases occur monthly."
                },
                {
                    question: "Application whitelisting differs from blacklisting in that whitelisting:",
                    options: [
                        "Blocks known malicious applications and allows everything else",
                        "Requires less administrative overhead than blacklisting",
                        "Is only effective against known malware signatures",
                        "Only allows pre-approved applications to run and blocks everything not on the approved list"
                    ],explanation: "Whitelisting (allow-listing) operates on a default-deny model — only explicitly approved applications can execute. This blocks all unknown and unauthorized software, including zero-day malware. Blacklisting (deny-listing) blocks known-bad applications but allows everything else, meaning new or unknown threats can run. Whitelisting is more secure but requires more administrative effort to maintain the approved application list."
                },
                {
                    question: "Browser hardening should include which of the following practices?",
                    options: [
                        "Installing as many extensions as possible for maximum functionality",
                        "Disabling automatic updates to prevent compatibility issues",
                        "Removing unnecessary extensions, enabling HTTPS-only mode, blocking pop-ups, and keeping the browser updated",
                        "Using the same browser for personal and work tasks"
                    ],explanation: "Browser hardening reduces the browser's attack surface: remove unnecessary extensions/plugins (each is potential malware), enable HTTPS-only mode, block pop-ups and redirects, disable third-party cookies, enable safe browsing/phishing protection, disable JavaScript on untrusted sites, keep the browser auto-updated, and use browser isolation for high-risk browsing. Browsers are the primary target for web-based attacks."
                },
                {
                    question: "USB port restrictions using Group Policy prevent:",
                    options: [
                        "Only USB keyboard and mouse connections",
                        "All USB devices including keyboards and mice",
                        "Only USB 3.0 devices — USB 2.0 devices are unaffected",
                        "Unauthorized USB storage devices from being connected, preventing data exfiltration and malware introduction"
                    ],explanation: "GPO settings can block USB storage devices (flash drives, external hard drives) while allowing keyboards, mice, and other approved devices. This prevents two major risks: data exfiltration (copying sensitive files to a USB drive) and malware introduction (BadUSB attacks, infected drives). Administrators can whitelist specific device IDs or classes, allowing only approved storage devices while blocking all others."
                },
                {
                    question: "A CIS Benchmark is:",
                    options: [
                        "A performance test for computer hardware",
                        "A consensus-based security configuration guide with specific settings for hardening operating systems and applications",
                        "A penetration testing framework used by ethical hackers",
                        "A data encryption standard mandated by the federal government"
                    ],explanation: "CIS (Center for Internet Security) Benchmarks are detailed, consensus-based security configuration guides developed by cybersecurity experts worldwide. They provide specific, actionable settings (with rationale) for hardening Windows, Linux, macOS, network devices, cloud platforms, databases, and applications. CIS publishes Level 1 (basic security, minimal impact) and Level 2 (advanced security, may reduce functionality) profiles."
                },
                {
                    question: "WSUS (Windows Server Update Services) helps organizations by:",
                    options: [
                        "Allowing administrators to test, approve, and deploy Windows updates centrally before distributing to workstations",
                        "Automatically installing all available updates without review",
                        "Replacing Windows Defender as the primary antivirus solution",
                        "Providing VPN connectivity for remote workstations"
                    ],explanation: "WSUS gives administrators centralized control over update distribution. Updates are downloaded from Microsoft to the WSUS server, where admins can review, test, approve, or decline them before pushing to client computers. This prevents untested updates from breaking production systems and ensures compliance. WSUS reports show which computers are missing critical patches, enabling targeted remediation."
                },
                {
                    question: "Disabling autorun and autoplay on Windows workstations prevents:",
                    options: [
                        "Users from playing audio CDs",
                        "Software installation from downloaded files",
                        "Automatic Windows updates from installing",
                        "Malware from automatically executing when removable media (USB drives, CDs) is inserted"
                    ],explanation: "Autorun (automatically executing programs on removable media) and autoplay (automatically opening content handlers) are common malware infection vectors. The Conficker worm spread partly through autorun on USB drives. Disabling both via Group Policy (NoDriveTypeAutoRun, Turn off Autoplay) prevents malicious code on USB drives or CDs from executing automatically when inserted. Users must manually choose to open content."
                },
                {
                    question: "The principle of least functionality applied to workstation configuration means:",
                    options: [
                        "Only giving the workstation the minimum hardware required",
                        "Restricting users to command-line interfaces only",
                        "Configuring the workstation to provide only the capabilities required for the user's job — removing all unnecessary applications, features, roles, and services",
                        "Limiting network bandwidth to the minimum needed"
                    ],explanation: "Least functionality extends least privilege to the system level: if a workstation is used for email and word processing, it should not have development tools, server features, remote management tools, or network utilities installed. Each unnecessary capability is an attack vector. NIST SP 800-123 and CIS Benchmarks both emphasize removing or disabling all unnecessary functionality."
                },
                {
                    question: "Host-based Intrusion Detection Systems (HIDS) on workstations monitor for:",
                    options: [
                        "Network-wide traffic patterns only",
                        "Suspicious activities on the individual host including file changes, registry modifications, and process behavior",
                        "Physical intrusion into the building",
                        "Wireless network attacks only"
                    ],explanation: "HIDS monitors activities on a single host: file integrity changes (new/modified/deleted system files), registry modifications, suspicious process behavior, log anomalies, and privilege escalation attempts. OSSEC is a popular open-source HIDS. In enterprise environments, Endpoint Detection and Response (EDR) platforms provide advanced HIDS capabilities with behavioral analysis, threat hunting, and automated response."
                },
                {
                    question: "Full-disk encryption (FDE) on a workstation protects data in which scenario?",
                    options: [
                        "When the workstation is connected to an unsecured Wi-Fi network",
                        "When a user clicks on a phishing link while the system is running",
                        "When malware is running on the powered-on system",
                        "When the workstation's physical hard drive is stolen or the laptop is lost"
                    ],explanation: "FDE protects data at rest — if the hard drive is physically removed or the device is stolen while powered off, the data is encrypted and unreadable without the key. FDE does NOT protect against attacks on a running, unlocked system (the data is decrypted in memory for the active user). BitLocker (Windows), FileVault (macOS), and LUKS (Linux) provide FDE. The key risk: FDE is useless if the device is stolen while logged in and unlocked."
                },
                {
                    question: "Software restriction policies or application control should be enforced using:",
                    options: [
                        "Verbal instructions to employees about which software to install",
                        "Technical controls such as AppLocker, Windows Defender Application Control (WDAC), or Group Policy Software Restriction Policies (SRP)",
                        "Antivirus software only",
                        "Physical locks on the USB ports"
                    ],explanation: "Technical enforcement is mandatory — administrative policies alone (verbal/written instructions) are insufficient because users make mistakes or deliberately bypass them. AppLocker (Windows Enterprise/Education), WDAC (Windows 10/11), and SRP (legacy) enforce application whitelisting at the OS level. Rules can be based on publisher certificates, file paths, or cryptographic hashes. WDAC is the successor to AppLocker with stronger enforcement."
                },
                {
                    question: "Endpoint Detection and Response (EDR) tools differ from traditional antivirus by:",
                    options: [
                        "Providing continuous monitoring, behavioral analysis, threat hunting, automated response, and forensic investigation capabilities",
                        "Using only signature-based detection",
                        "Only scanning files during manual scans",
                        "Only protecting against network-based attacks"
                    ],explanation: "EDR platforms go beyond traditional AV: continuous endpoint monitoring, behavioral analysis (detecting living-off-the-land attacks), automated response (isolating infected endpoints), threat hunting (proactive search for indicators of compromise), forensic timeline (recording process trees and file activities), and integration with SIEM/SOAR platforms. Leading EDR solutions include CrowdStrike Falcon, Microsoft Defender for Endpoint, SentinelOne, and Carbon Black."
                },
                {
                    question: "A security baseline for workstations should be:",
                    options: [
                        "Created once and never modified",
                        "Documented, tested, enforced via automation (GPO/MDM), and regularly reviewed and updated as threats evolve",
                        "Left to each user to configure based on their preferences",
                        "Applied only to servers, not workstations"
                    ],explanation: "Security baselines define the minimum security configuration standard for all workstations. They must be documented (what settings and why), tested (to verify they do not break business applications), enforced automatically (via Group Policy, MDM, or configuration management tools — not manual configuration), and regularly reviewed (at least quarterly or when new threats/vulnerabilities emerge). Manual configuration does not scale and produces inconsistent security."
                }
            ]
        });
        quiz.start();
    </script>
