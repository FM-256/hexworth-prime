<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to First Watch Hub</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 1: Logical Security',
            description: '15 questions on the CIA triad, authentication, authorization, encryption basics, firewalls, VPNs, and least privilege',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w1-logical',
            moduleId: 'fw-w1-logical',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "The CIA Triad consists of three core security principles. Which answer correctly lists all three?",
                    options: [
                        "Confidentiality, Integrity, Availability",
                        "Confidentiality, Identity, Authentication",
                        "Control, Integrity, Access",
                        "Certification, Investigation, Authorization"
                    ],explanation: "The CIA Triad is the foundational model for information security: Confidentiality (only authorized users can access data), Integrity (data is accurate and unaltered), and Availability (systems and data are accessible when needed). Every security control maps to protecting one or more of these three properties."
                },
                {
                    question: "A ransomware attack encrypts all of an organization's files and demands payment. Which CIA Triad property is MOST directly violated?",
                    options: [
                        "Confidentiality",
                        "Integrity",
                        "Availability",
                        "Non-repudiation"
                    ],explanation: "Ransomware primarily attacks availability — it denies legitimate users access to their own files and systems until the ransom is paid. While confidentiality may also be threatened if the attacker exfiltrates data before encrypting (double extortion), the primary and immediate impact is loss of availability."
                },
                {
                    question: "Which authentication factor category does a fingerprint belong to?",
                    options: [
                        "Something you know",
                        "Something you have",
                        "Something you are",
                        "Somewhere you are"
                    ],explanation: "Biometrics like fingerprints, retinal scans, and facial recognition fall under 'something you are' — inherence factors. The three primary authentication factor categories are: something you know (password, PIN), something you have (smart card, token), and something you are (biometric). Multi-factor authentication combines two or more different categories."
                },
                {
                    question: "What is the difference between authentication and authorization?",
                    options: [
                        "Authentication determines permissions; authorization verifies identity",
                        "Authentication verifies who you are; authorization determines what you are allowed to do",
                        "They are the same process with different names",
                        "Authentication is for users; authorization is for administrators"
                    ],explanation: "Authentication verifies identity (proving you are who you claim to be), while authorization determines access rights (what that verified identity is permitted to do). Authentication always comes first — you cannot authorize an unknown identity. Example: logging in with a password is authentication; the system then checking if you have permission to read a file is authorization."
                },
                {
                    question: "The principle of least privilege states that:",
                    options: [
                        "Users should have administrative access to perform any task efficiently",
                        "Users should receive only the minimum permissions necessary to perform their job functions",
                        "All users should have equal access to prevent discrimination",
                        "Privilege levels should be assigned based on seniority"
                    ],explanation: "Least privilege restricts each user, process, or system to the minimum level of access needed to perform its legitimate function. This limits the blast radius if an account is compromised — an attacker gains only what that account could access. It applies to user accounts, service accounts, applications, and processes."
                },
                {
                    question: "A stateful firewall differs from a packet-filtering firewall because it:",
                    options: [
                        "Only inspects IP addresses and port numbers",
                        "Tracks the state of active connections and makes decisions based on connection context",
                        "Operates at Layer 7 of the OSI model exclusively",
                        "Requires manual rule updates for each new connection"
                    ],explanation: "A stateful firewall maintains a state table that tracks active connections (source/destination IP, ports, sequence numbers, connection phase). It can determine if a packet belongs to an established session, allowing legitimate return traffic automatically while blocking unsolicited inbound packets. Packet-filtering firewalls examine each packet in isolation without connection context."
                },
                {
                    question: "AES-256 is an example of what type of encryption?",
                    options: [
                        "Asymmetric encryption",
                        "Symmetric encryption",
                        "Hashing algorithm",
                        "Key exchange protocol"
                    ],explanation: "AES (Advanced Encryption Standard) is a symmetric encryption algorithm — it uses the same key for both encryption and decryption. AES-256 uses a 256-bit key and is the standard for protecting classified government data (approved by NSA for TOP SECRET). Symmetric encryption is faster than asymmetric but requires secure key distribution."
                },
                {
                    question: "A VPN (Virtual Private Network) protects data in transit by:",
                    options: [
                        "Hiding the user's physical location only",
                        "Creating an encrypted tunnel between two endpoints across an untrusted network",
                        "Blocking all incoming traffic from the internet",
                        "Storing data on a remote server instead of locally"
                    ],explanation: "A VPN creates an encrypted tunnel that encapsulates traffic between two endpoints (client-to-site or site-to-site) across an untrusted network like the internet. This protects confidentiality (encryption prevents eavesdropping) and integrity (tampering is detected). Common VPN protocols include IPsec, OpenVPN, and WireGuard."
                },
                {
                    question: "Which access control model assigns permissions based on a user's job function or role within the organization?",
                    options: [
                        "Discretionary Access Control (DAC)",
                        "Mandatory Access Control (MAC)",
                        "Role-Based Access Control (RBAC)",
                        "Rule-Based Access Control"
                    ],explanation: "RBAC assigns permissions to roles (e.g., 'Help Desk Technician', 'Database Administrator') rather than individual users. Users are then assigned to roles based on their job functions. This simplifies administration — when an employee changes positions, their role assignment changes rather than individual permissions. RBAC is the most widely used access control model in enterprises."
                },
                {
                    question: "Multi-factor authentication (MFA) requires at least:",
                    options: [
                        "Two passwords from different systems",
                        "Two factors from two different categories (e.g., something you know + something you have)",
                        "A username and a password",
                        "Three forms of identification from the same category"
                    ],explanation: "MFA requires authentication factors from at least two different categories: something you know (password/PIN), something you have (token/phone), or something you are (biometric). Using two passwords is NOT MFA because both are from the same category (something you know). A common MFA example: password (know) + authenticator app code (have)."
                },
                {
                    question: "What does a firewall's implicit deny rule do?",
                    options: [
                        "Explicitly blocks traffic from known malicious IP addresses",
                        "Drops all traffic that does not match any explicitly permitted rule",
                        "Denies access to administrative interfaces",
                        "Logs but allows unmatched traffic for review"
                    ],explanation: "The implicit deny (also called 'deny all' or 'default deny') is the last rule in a firewall's rule set. It drops any traffic that was not explicitly permitted by a preceding rule. This is a fundamental security principle — if you did not specifically allow it, it is blocked. This prevents unknown or unexpected traffic from passing through."
                },
                {
                    question: "Encryption at rest protects data that is:",
                    options: [
                        "Being transmitted across a network",
                        "Stored on a hard drive, SSD, or other storage media",
                        "Currently being processed in RAM",
                        "Displayed on a user's screen"
                    ],explanation: "Encryption at rest protects data stored on physical media — hard drives, SSDs, USB drives, backup tapes, and databases. If the storage device is stolen or improperly disposed of, the data remains unreadable without the decryption key. BitLocker (Windows), FileVault (macOS), and LUKS (Linux) are common full-disk encryption tools for data at rest."
                },
                {
                    question: "Which protocol provides encryption for web traffic and is indicated by 'https://' in a URL?",
                    options: [
                        "HTTP",
                        "TLS (Transport Layer Security)",
                        "FTP",
                        "SSH"
                    ],explanation: "TLS (Transport Layer Security) encrypts web traffic between a browser and a web server. HTTPS is HTTP over TLS. When you see https:// and the padlock icon, TLS is encrypting the connection. TLS replaced the deprecated SSL (Secure Sockets Layer) protocol. TLS 1.2 and 1.3 are the current secure versions; older versions (SSL 3.0, TLS 1.0, 1.1) are deprecated due to known vulnerabilities."
                },
                {
                    question: "An organization's password policy requires a minimum of 12 characters, uppercase, lowercase, numbers, and special characters. This policy strengthens which security property?",
                    options: [
                        "Availability",
                        "Integrity",
                        "Confidentiality through stronger authentication",
                        "Non-repudiation"
                    ],explanation: "Password complexity requirements strengthen confidentiality by making passwords harder to guess or crack through brute-force and dictionary attacks. A 12-character complex password has exponentially more possible combinations than a simple 6-character password. Password policies are administrative controls that support the technical control of authentication."
                },
                {
                    question: "What is the purpose of an Access Control List (ACL) on a network device?",
                    options: [
                        "To encrypt traffic passing through the device",
                        "To define rules that permit or deny traffic based on source, destination, protocol, or port",
                        "To authenticate users before granting network access",
                        "To log all traffic for forensic analysis"
                    ],explanation: "An ACL is an ordered list of rules (permit/deny statements) that a router or firewall evaluates against each packet. Rules match on criteria like source/destination IP addresses, protocols (TCP/UDP), and port numbers. Packets are compared against rules from top to bottom — the first match determines the action. ACLs are a core mechanism for implementing network access control and traffic filtering."
                }
            ]
        });
        quiz.start();
    </script>
</body>
