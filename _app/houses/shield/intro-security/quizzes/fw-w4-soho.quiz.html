    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Week 4: SOHO Network Security',
            description: '15 questions on router hardening, WPS, UPnP, guest networks, DNS security, and IoT isolation',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'fw-w4-soho',
            moduleId: 'fw-w4-soho',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "The first step in hardening a SOHO router should be:",
                    options: [
                        "Changing the default administrator username and password",
                        "Enabling WPS for easy device setup",
                        "Disabling the firewall to improve network speed",
                        "Enabling remote management from the internet"
                    ],explanation: "Default admin credentials (admin/admin, admin/password) are publicly known for every router model. Attackers use automated tools to scan for routers with default credentials and take full control — changing DNS settings, creating port forwards, disabling security features, or installing malicious firmware. Changing default credentials is the single most important first step. Use a strong, unique password and change the default username if possible."
                },
                {
                    question: "WPS (Wi-Fi Protected Setup) should be disabled on a SOHO router because:",
                    options: [
                        "Its PIN-based authentication has a known brute-force vulnerability that can reveal the WPA2 key in hours",
                        "It causes Wi-Fi connection speeds to decrease",
                        "It is incompatible with modern devices",
                        "It uses excessive bandwidth"
                    ],explanation: "WPS has a critical design flaw: the 8-digit PIN is validated in two halves, reducing the brute-force space from 100 million to about 11,000 attempts. Tools like Reaver can crack it in 4-10 hours and recover the full WPA2 PSK. Even with lockout timers, the attack is practical. Some routers have a WPS button (push-button method) that is slightly less vulnerable, but PIN-based WPS remains exploitable. Disable WPS entirely."
                },
                {
                    question: "UPnP (Universal Plug and Play) is a security risk because:",
                    options: [
                        "It slows down network traffic significantly",
                        "It prevents devices from connecting to the network",
                        "It allows applications and devices to automatically open firewall ports without user approval, potentially exposing internal services to the internet",
                        "It only supports outdated wireless protocols"
                    ],explanation: "UPnP allows devices and applications to automatically create port forwarding rules on the router without authentication or user approval. Malware can exploit UPnP to open ports, exposing internal services (RDP, SMB, databases) to the internet. The CallStranger vulnerability (CVE-2020-12695) demonstrated large-scale UPnP exploitation. Best practice: disable UPnP and manually configure only the port forwards you actually need."
                },
                {
                    question: "A guest wireless network on a SOHO router provides security by:",
                    options: [
                        "Giving guests faster internet speeds than the main network",
                        "Encrypting guest traffic with a stronger algorithm than the main network",
                        "Automatically scanning guest devices for malware",
                        "Isolating guest devices from the main network so they cannot access shared files, printers, or other local devices"
                    ],explanation: "A guest network creates network segmentation at the consumer level. Guest devices connect to a separate SSID with its own password and are isolated from the main network — they can access the internet but cannot reach local devices (NAS, printers, smart home systems, computers). This prevents untrusted devices from scanning or attacking your internal network. Many routers also support bandwidth limiting for the guest network."
                },
                {
                    question: "Changing the default SSID on a SOHO router is recommended because:",
                    options: [
                        "It significantly improves wireless signal strength",
                        "Custom SSIDs are encrypted while defaults are not",
                        "Default SSIDs reveal the router manufacturer and model, helping attackers identify known vulnerabilities and default credentials",
                        "Changing the SSID enables WPA3 automatically"
                    ],explanation: "Default SSIDs like 'NETGEAR-5G', 'Linksys', or 'TP-Link_XXXX' immediately reveal the router brand and sometimes model. Attackers can look up default credentials, known firmware vulnerabilities, and exploit techniques for that specific model. A custom SSID (without personal information like your name or address) removes this easy reconnaissance. It does not improve encryption or signal strength but reduces information disclosure."
                },
                {
                    question: "DNS filtering on a SOHO network can block:",
                    options: [
                        "Only spam emails",
                        "Only advertisements on websites",
                        "All encrypted HTTPS traffic",
                        "Access to known malicious domains, phishing sites, malware distribution sites, and inappropriate content categories"
                    ],explanation: "DNS filtering (using services like OpenDNS, Cloudflare Gateway, Pi-hole, or NextDNS) intercepts DNS queries and blocks resolution of known malicious domains. When a device tries to connect to a phishing site or malware C2 server, the DNS filter returns a block page instead of the real IP address. This provides network-wide protection for all devices — including IoT devices that cannot run their own security software."
                },
                {
                    question: "IoT (Internet of Things) devices should be isolated on a separate network segment because:",
                    options: [
                        "IoT devices use too much bandwidth for the main network",
                        "Many IoT devices have weak security (default credentials, unpatched firmware, no encryption), and isolation prevents a compromised IoT device from attacking other network resources",
                        "IoT devices are incompatible with standard Wi-Fi encryption",
                        "IoT devices cannot connect to guest networks"
                    ],explanation: "IoT devices (smart cameras, thermostats, doorbells, bulbs, appliances) often have poor security: hardcoded credentials, infrequent firmware updates, unencrypted communications, and unnecessary open ports. The Mirai botnet compromised hundreds of thousands of IoT devices using default credentials. Isolating IoT on a separate VLAN or network segment prevents a compromised smart device from accessing computers, NAS, or other sensitive systems on the main network."
                },
                {
                    question: "SOHO router firmware should be kept updated because:",
                    options: [
                        "Updates patch critical security vulnerabilities that attackers exploit to take control of routers",
                        "Firmware updates only add new features and improve speed",
                        "Outdated firmware causes the router to stop working entirely",
                        "Firmware updates change the router's MAC address for better security"
                    ],explanation: "Router firmware vulnerabilities are actively exploited by botnets, APT groups, and cybercriminals. VPNFilter malware (attributed to Russia's Sandworm group) infected 500,000+ routers worldwide. Firmware updates patch these vulnerabilities. Many SOHO router manufacturers are slow to release patches, and many users never update. Check for updates monthly. If the manufacturer has abandoned the product (end-of-life), replace the router with a supported model."
                },
                {
                    question: "Remote management on a SOHO router should typically be:",
                    options: [
                        "Enabled by default for convenience",
                        "Enabled with the default admin password for quick troubleshooting",
                        "Enabled only on port 80 for easy access",
                        "Disabled unless specifically needed, as it exposes the router's admin interface to the internet"
                    ],explanation: "Remote management exposes the router's administrative interface to the entire internet. Attackers constantly scan for remotely accessible routers and attempt default credentials, known exploits, or brute-force attacks. If remote management is required, restrict it to specific IP addresses, use HTTPS (not HTTP), change the default port, require a strong password, and enable account lockout. Better yet: use a VPN to access your network, then manage the router locally."
                },
                {
                    question: "Enabling HTTPS for router administration instead of HTTP ensures that:",
                    options: [
                        "The router operates faster",
                        "The router's wireless signal is encrypted",
                        "Admin credentials and configuration data are encrypted in transit, preventing interception on the local network",
                        "Only one administrator can log in at a time"
                    ],explanation: "HTTP transmits all data in plaintext — if you log into your router over HTTP, your admin username and password travel across the network unencrypted. On a shared network (or if an attacker has gained access), credentials can be captured with packet sniffers like Wireshark. HTTPS encrypts the admin session with TLS. While the router's self-signed certificate will trigger a browser warning, it still provides encryption against passive eavesdropping."
                },
                {
                    question: "A SOHO router's built-in firewall typically provides:",
                    options: [
                        "Only outbound traffic filtering",
                        "Stateful packet inspection (SPI) that tracks connections and blocks unsolicited inbound traffic by default",
                        "Application-layer filtering with deep packet inspection",
                        "Intrusion prevention system (IPS) capabilities"
                    ],explanation: "Most SOHO routers include a basic stateful packet inspection (SPI) firewall. SPI tracks active connections in a state table and allows inbound traffic only if it belongs to an established outbound session (the internal device initiated the connection). Unsolicited inbound traffic is dropped by default. This provides significant protection — it is essentially NAT combined with connection tracking. However, SOHO firewalls lack advanced features like IPS, application awareness, or DPI."
                },
                {
                    question: "Port forwarding on a SOHO router should be configured with which precaution?",
                    options: [
                        "Forward all ports to the main computer for maximum connectivity",
                        "Forward ports only to IoT devices since they are more secure",
                        "Use UPnP instead of manual port forwarding for better security",
                        "Only forward the specific ports needed, to specific internal IP addresses, and ensure the destination service is patched and secured"
                    ],explanation: "Every port forward creates a hole in the firewall — traffic on that port is passed directly from the internet to an internal device. Minimize risk: forward only specific ports needed (not ranges), point to specific internal IPs (not the entire network), ensure the destination service is fully patched and properly configured, use non-standard external ports when possible, and regularly audit port forwards to remove unused ones. Never forward ports for RDP (3389) directly to the internet."
                },
                {
                    question: "DNS over HTTPS (DoH) or DNS over TLS (DoT) improves SOHO network security by:",
                    options: [
                        "Making websites load faster",
                        "Encrypting DNS queries to prevent ISPs and attackers from seeing or manipulating which domains are being resolved",
                        "Replacing the need for a VPN",
                        "Blocking all advertisements automatically"
                    ],explanation: "Traditional DNS queries are sent in plaintext — ISPs, network operators, and attackers on the path can see every domain you look up and can even manipulate responses (DNS hijacking/spoofing). DoH (DNS over HTTPS, port 443) and DoT (DNS over TLS, port 853) encrypt DNS queries between the client and the DNS resolver. This protects privacy and prevents DNS manipulation. Major resolvers (Cloudflare 1.1.1.1, Google 8.8.8.8, Quad9 9.9.9.9) support both."
                },
                {
                    question: "A SOHO network should use which wireless security protocol as a minimum?",
                    options: [
                        "WPA2-Personal (AES) at minimum, WPA3 preferred",
                        "Open network with no encryption",
                        "WEP (Wired Equivalent Privacy)",
                        "WPA with TKIP"
                    ],explanation: "WPA2-Personal with AES-CCMP encryption is the minimum acceptable wireless security for SOHO networks. WEP is trivially broken. WPA with TKIP has known weaknesses. Open networks provide no encryption. WPA3 is preferred where all devices support it — it provides forward secrecy and stronger protection against offline dictionary attacks. Many modern routers support WPA2/WPA3 transitional mode for backward compatibility."
                },
                {
                    question: "MAC address filtering, hiding the SSID, and reducing wireless power are collectively described as:",
                    options: [
                        "Strong security controls that replace the need for encryption",
                        "Security through obscurity — they add minor inconvenience but are easily bypassed and should not be relied upon as primary controls",
                        "Enterprise-grade wireless security measures",
                        "Mandatory requirements for PCI-DSS compliance"
                    ],explanation: "These measures are easily bypassed: MAC addresses can be sniffed and spoofed, hidden SSIDs appear in probe requests, and wireless signals can be captured from outside the intended range with a high-gain antenna. They add a thin layer of obscurity but provide no real security against a knowledgeable attacker. They should supplement (not replace) strong encryption (WPA2/WPA3), strong passwords, and proper network segmentation."
                }
            ]
        });
        quiz.start();
    </script>
