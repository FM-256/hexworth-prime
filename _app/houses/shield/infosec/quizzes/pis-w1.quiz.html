<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <!-- InlineQuizShuffler: defeats positional cheatability across PIS w1/w2/w3/w4 (Bridget 2026-05-09 finding). Client-graded only — DO NOT re-seed quiz_keys.json from this file's in-memory questions array; the Firestore key was seeded against pre-shuffle option order and must remain canonical. -->
    <script src="../../../../components/InlineQuizShuffler.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1: Security Fundamentals + Threats | Principles of Information Security</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #0f1628 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--blue-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--blue);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--blue);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--blue);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }

        .option.selected { border-color: var(--blue); background: rgba(59, 130, 246, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--blue);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--blue);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--blue); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(59, 130, 246, 0.15); color: var(--blue); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--blue);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--blue);
        }
        .btn-retry:hover { background: var(--blue); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Infosec Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 1: Security Fundamentals + Threats</h1>
            <p class="subtitle">CIA Triad, threat actors, attack surfaces, and foundational security concepts</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>SY0-701: 1.0, 2.0</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Infosec Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "Which component of the CIA Triad ensures that data is only accessible to authorized users?",
                opts: ["Confidentiality", "Availability", "Integrity", "Non-repudiation"],
                ans: 0,
                exp: "Confidentiality prevents unauthorized disclosure of information. Controls include encryption, access control lists, and need-to-know policies."
            },
            {
                q: "A threat actor modifies patient records in a hospital database without authorization. Which CIA Triad component is primarily violated?",
                opts: ["Integrity", "Confidentiality", "Availability", "Authentication"],
                ans: 0,
                exp: "Integrity ensures data has not been tampered with or modified without authorization. Unauthorized modification is a direct integrity violation."
            },
            {
                q: "Which type of threat actor is most likely motivated by financial gain and typically operates as part of an organized criminal syndicate?",
                opts: ["Hacktivist", "Nation-state", "Cybercriminal", "Script kiddie"],
                ans: 2,
                exp: "Cybercriminals are motivated primarily by financial gain. They often work in organized groups and conduct ransomware attacks, fraud, and data theft."
            },
            {
                q: "What term describes the combination of all potential attack vectors an attacker could use to compromise a system?",
                opts: ["Threat landscape", "Risk register", "Vulnerability window", "Attack surface"],
                ans: 3,
                exp: "The attack surface is the total set of points where an attacker can attempt to enter, extract data from, or disrupt a system. Reducing it is a core security principle."
            },
            {
                q: "A nation-state actor deploys malware that remains dormant for six months before activating. This behavior is characteristic of which threat category?",
                opts: ["Script kiddie", "Insider threat", "Advanced Persistent Threat (APT)", "Hacktivist"],
                ans: 2,
                exp: "APTs are sophisticated, long-term campaigns, often nation-state sponsored. They emphasize stealth and persistence, remaining undetected for months or years."
            },
            {
                q: "Which security principle limits a user's access rights to the minimum permissions required to perform their job function?",
                opts: ["Defense in depth", "Separation of duties", "Need to know", "Least privilege"],
                ans: 3,
                exp: "Least privilege restricts user accounts to only the permissions needed for their role, limiting the blast radius of a compromised account."
            },
            {
                q: "A CDC analyst discovers that a bioterrorism threat database is inaccessible due to a DDoS attack during an outbreak response. Which CIA component is violated?",
                opts: ["Confidentiality", "Availability", "Integrity", "Accountability"],
                ans: 1,
                exp: "Availability ensures systems are accessible when needed. A DDoS attack disrupts availability, which in critical infrastructure like public health systems can have life-safety implications."
            },
            {
                q: "What is the difference between a vulnerability and a threat?",
                opts: [
                    "A vulnerability is a weakness; a threat is a potential exploiter of that weakness",
                    "A vulnerability is an attacker; a threat is a weakness",
                    "A vulnerability and a threat are interchangeable terms",
                    "A threat is a control; a vulnerability is a risk"
                ],
                ans: 0,
                exp: "A vulnerability is a weakness in a system. A threat is any circumstance or event with the potential to exploit that vulnerability. Risk occurs when a threat exploits a vulnerability."
            },
            {
                q: "Which of the following BEST describes a zero-day vulnerability?",
                opts: [
                    "A flaw that has been publicly known for zero days",
                    "A flaw discovered during a penetration test",
                    "A bug that only exists in legacy systems",
                    "A vulnerability with no existing patch or public disclosure at the time of exploitation"
                ],
                ans: 3,
                exp: "A zero-day vulnerability is one that is unknown to the vendor or for which no patch exists. Attackers exploit it before defenders can respond."
            },
            {
                q: "An employee accesses payroll files unrelated to their role out of curiosity, causing no damage. Which threat category does this represent?",
                opts: ["External threat", "Nation-state threat", "Insider threat", "Supply chain threat"],
                ans: 2,
                exp: "Insider threats originate from people with legitimate access to systems, including employees who access unauthorized data even without malicious intent."
            },
            {
                q: "Which term describes a security strategy that employs multiple overlapping layers of controls so that if one layer fails, others remain?",
                opts: ["Least privilege", "Defense in depth", "Zero trust", "Separation of duties"],
                ans: 1,
                exp: "Defense in depth layers multiple security controls (physical, technical, administrative) so no single point of failure can compromise the entire system."
            },
            {
                q: "A security researcher receives a monetary reward from a vendor for responsibly disclosing a flaw in their software. This process is known as:",
                opts: ["Penetration testing", "Threat hunting", "Red teaming", "Bug bounty"],
                ans: 3,
                exp: "Bug bounty programs incentivize security researchers to responsibly disclose vulnerabilities to the vendor in exchange for monetary rewards or recognition."
            },
            {
                q: "Which of the following is an example of a technical control?",
                opts: ["Security awareness training", "Firewall rule blocking inbound SSH", "Acceptable use policy", "Background check for new employees"],
                ans: 1,
                exp: "Technical (logical) controls are implemented via technology, such as firewalls, encryption, and access control systems. The other options are administrative controls."
            },
            {
                q: "What does the term 'non-repudiation' mean in information security?",
                opts: [
                    "Ensuring a user cannot deny having performed an action",
                    "Ensuring data cannot be read by unauthorized parties",
                    "Preventing data from being modified in transit",
                    "Verifying the identity of a user before access"
                ],
                ans: 0,
                exp: "Non-repudiation provides proof that a specific user performed a specific action, preventing them from later denying it. Digital signatures are a key mechanism."
            },
            {
                q: "A group of hacktivists defaces a government website to protest a surveillance law. Their primary motivation is:",
                opts: ["Financial gain", "Ideology or political belief", "Espionage", "Personal vengeance"],
                ans: 1,
                exp: "Hacktivists are motivated by ideology, politics, or social causes. They typically target organizations whose actions conflict with their beliefs."
            }
        ];

        // Defeat positional memorization across PIS quizzes (Bridget 2026-05-09).
        // Mutates questions[].opts and questions[].ans in-place; safe because
        // pis-w1 is client-graded (no Firestore quiz_keys lookup at score time).
        InlineQuizShuffler.shuffleQuiz(questions);

        /* ── Quiz Engine State ──
           Standard quiz pattern used across all Principals of Information Security quizzes.
           Aligned to Security+ SY0-701 domains 1.0 (General Security Concepts) and 2.0 (Threats).
           Passing threshold: 70%. On pass, records completion via ModuleProgress. */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        /** Render the current question: number, text, progress bar, and 4 option buttons. */
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        /**
         * Handle answer selection. Locks all options, highlights correct (green)
         * and incorrect (red), shows explanation, increments score if correct.
         */
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        /** Advance to next question, or show results if this was the last. */
        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        /**
         * Display final results. Passing (>=70%) triggers ModuleProgress.completeQuiz()
         * which marks the quiz complete in localStorage and syncs to Firestore.
         */
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have a strong foundation in security fundamentals and threat concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the questions you missed before the midterm.';
            else if (pct >= 50) msg = 'Good effort. Revisit the CIA Triad and threat actor classifications and try again.';
            else msg = 'Keep studying. Review Week 1 materials on security fundamentals and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.completeQuiz('shield', 'pis-w1-quiz', score);
            }
        }

        /** Reset all state and restart from question 1. */
        function restartQuiz() {
            // Re-shuffle on retry so a student who memorized positions on attempt 1
            // gets a fresh randomization on attempt 2. Restart button is gated to
            // the results card (resultsCard.display='block' only after showResults()),
            // so this never fires mid-quiz.
            InlineQuizShuffler.shuffleQuiz(questions);
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
