<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <!-- Option shuffle (anti-positional-memorization, Bridget 2026-05-09) now inline via permShuffleQuiz: q._perm maps shuffled->original; server grading (QC-57) submits ORIGINAL indices against the canonical Firestore key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4: Auth + Governance + IR | Principles of Information Security</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #0f1628 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }

        .back-link {
            color: var(--blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--blue-dim);
        }

        .quiz-header h1 { font-size: 1.6rem; color: var(--blue); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }

        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label { font-size: 0.85rem; color: var(--blue); font-weight: 600; white-space: nowrap; }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num { font-size: 0.8rem; color: var(--blue); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }
        .option.selected { border-color: var(--blue); background: rgba(59, 130, 246, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--blue);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav { display: flex; justify-content: flex-end; }

        .next-btn {
            padding: 10px 24px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--blue);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--blue); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(59, 130, 246, 0.15); color: var(--blue); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 { color: var(--blue); font-size: 1.4rem; margin-bottom: 1rem; }

        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: var(--blue); }
        .btn-retry:hover { background: var(--blue); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(59, 130, 246, 0.04); border-left: 2px solid var(--blue); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--blue); }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Infosec Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 4: Auth + Governance + IR</h1>
            <p class="subtitle">Authentication, access control, security policies, risk management, and incident response</p>
            <div class="meta">
                <span>Week 4</span>
                <span>15 Questions</span>
                <span>SY0-701: 4.0, 5.0</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [{"q":"Multi-factor authentication (MFA) requires users to present factors from at least two of the three categories. Which answer correctly lists all three categories?","opts":["Something you know, something you have, something you are","Something you know, something you have, something you feel","Username, password, PIN","Smart card, biometric, IP address"],"exp":"The three authentication factors are: something you know (password, PIN), something you have (token, smart card), and something you are (biometric). MFA requires at least two different categories."},{"q":"Which access control model grants or denies access based on sensitivity labels assigned to subjects and objects?","opts":["Mandatory Access Control (MAC)","Role-Based Access Control (RBAC)","Discretionary Access Control (DAC)","Attribute-Based Access Control (ABAC)"],"exp":"MAC uses classification labels (e.g., Top Secret, Secret, Unclassified). Access is determined by policy, not the data owner. It is common in government and military environments."},{"q":"After a data breach at a federal health agency, the CISO initiates the incident response process. According to NIST SP 800-61, what is the correct order of IR phases?","opts":["Detection, Containment, Eradication, Recovery, Lessons Learned","Identification, Containment, Eradication, Recovery, Reporting","Preparation, Detection and Analysis, Containment, Eradication and Recovery, Post-Incident Activity","Triage, Isolation, Remediation, Reporting, Closure"],"exp":"NIST SP 800-61 defines four IR phases: Preparation; Detection and Analysis; Containment, Eradication, and Recovery; Post-Incident Activity (lessons learned). This is the authoritative framework."},{"q":"A security policy requires that no single employee can both approve and execute financial transactions. This implements which security principle?","opts":["Least privilege","Job rotation","Defense in depth","Separation of duties"],"exp":"Separation of duties (SoD) divides critical tasks between multiple people, preventing any one individual from having enough access to commit fraud or make critical errors undetected."},{"q":"What is the purpose of a Business Continuity Plan (BCP)?","opts":["To document the technical steps for restoring IT systems after an outage","To classify data assets by sensitivity level","To ensure critical business functions continue during and after a disaster","To define escalation procedures for security incidents"],"exp":"A BCP addresses how the organization continues operating during disruptions. It is broader than a Disaster Recovery Plan (DRP), which focuses specifically on IT and data restoration."},{"q":"What metric represents the maximum acceptable duration of downtime before business impact becomes critical?","opts":["RPO (Recovery Point Objective)","MTBF (Mean Time Between Failures)","MTTR (Mean Time to Repair)","RTO (Recovery Time Objective)"],"exp":"RTO is the maximum time a system or process can be down before it causes unacceptable business harm. RPO defines the maximum tolerable data loss measured in time."},{"q":"A CDC bioterrorism response team discovers ransomware on their network at 02:00. Their first priority in the Containment phase should be:","opts":["Immediately reimaging all affected systems","Isolating affected systems from the network to prevent further spread","Notifying law enforcement and paying the ransom","Conducting a root cause analysis before taking any action"],"exp":"Containment's first priority is stopping the spread. Isolating (network-disconnecting) affected systems limits lateral movement. Root cause analysis and reimaging come in later IR phases."},{"q":"Which risk treatment option accepts a risk without implementing additional controls because the cost of mitigation exceeds the potential loss?","opts":["Risk acceptance","Risk transference","Risk avoidance","Risk mitigation"],"exp":"Risk acceptance (retention) is the deliberate decision to accept a risk as-is. It is justified when the residual risk is within the organization's risk appetite and mitigation costs are disproportionate."},{"q":"An organization buys cyber liability insurance to cover losses from a breach. This is an example of which risk strategy?","opts":["Risk avoidance","Risk mitigation","Risk acceptance","Risk transference"],"exp":"Risk transference shifts financial liability to a third party, typically via insurance. The organization still bears operational risk but the financial consequences are transferred to the insurer."},{"q":"What is the purpose of a Security Information and Event Management (SIEM) system?","opts":["To provide two-factor authentication for privileged accounts","To encrypt data at rest across all endpoints","To aggregate, correlate, and analyze security log data from multiple sources for threat detection","To enforce network access policies based on device posture"],"exp":"A SIEM collects logs from firewalls, IDS, endpoints, and applications, correlates events across sources, and generates alerts for suspected security incidents, enabling centralized visibility."},{"q":"Which authentication protocol is used in Windows Active Directory environments and relies on a Key Distribution Center (KDC) for issuing tickets?","opts":["RADIUS","Kerberos","LDAP","SAML"],"exp":"Kerberos is the default authentication protocol in Windows AD. It uses a KDC to issue Ticket Granting Tickets (TGTs) and service tickets, avoiding the need to transmit passwords over the network."},{"q":"Which single sign-on (SSO) standard is commonly used for federated identity between cloud applications and enterprise IdPs?","opts":["Kerberos","NTLM","WEP","SAML 2.0"],"exp":"SAML 2.0 (Security Assertion Markup Language) enables federated SSO, allowing an enterprise Identity Provider (IdP) like Okta or Azure AD to assert a user's identity to external service providers."},{"q":"During a post-incident review, the team determines a breach was enabled by an unpatched Apache server. Implementing a monthly patch cycle is an example of:","opts":["Risk transference","Corrective control","Risk avoidance","Detective control"],"exp":"A corrective control remediates identified vulnerabilities after an incident or assessment. Patch management is a corrective and preventive control that eliminates known vulnerability exposure."},{"q":"A data classification policy assigns the label 'Restricted' to personally identifiable information (PII). Which governance framework requires this kind of classification for healthcare data in the US?","opts":["HIPAA","SOC 2","PCI-DSS","ISO 27001"],"exp":"HIPAA (Health Insurance Portability and Accountability Act) mandates the protection of Protected Health Information (PHI). It requires appropriate safeguards including data classification and access controls."},{"q":"What is the primary goal of the Lessons Learned (Post-Incident Activity) phase in incident response?","opts":["To prosecute the attacker responsible for the incident","To improve the organization's security posture and IR processes based on what occurred","To restore all affected systems to their pre-incident state","To notify affected customers of the breach"],"exp":"The lessons learned phase documents what happened, what worked, what did not, and what improvements to make. This closes the feedback loop and prevents recurrence of the same incident."}];

        // Defeat positional memorization across PIS quizzes (Bridget 2026-05-09).
        // Mutates questions[].opts and questions[].ans in-place; safe because
        // pis-w4 is client-graded (no Firestore quiz_keys lookup at score time).
        // Family-5 permutation shuffle: shuffles opts WITHOUT needing q.ans (stripped).
        // Records q._perm = shuffled position -> original index; server key stays canonical.
        function permShuffleQuiz(qs) {
            qs.forEach(function (q) {
                var idx = q.opts.map(function (_, i) { return i; });
                for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
                q.opts = idx.map(function (o) { return q.opts[o]; });
                q._perm = idx;
            });
        }
        permShuffleQuiz(questions);

        /* ── Quiz Engine State ──
           Aligned to Security+ SY0-701 domains 4.0 (Security Operations) and 5.0 (Governance, Risk, Compliance).
           Passing threshold: 70%. On pass, records completion via ModuleProgress. */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'pis-w4-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, q._perm ? q._perm[idx] : idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (typeof ca !== 'undefined' && q._perm) ca = q._perm.indexOf(ca); // original -> shuffled
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer! ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct! ' : 'Incorrect! ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered authentication, governance, and incident response concepts.';
            else if (pct >= 70) msg = 'Solid work. Review the IR phases and risk treatment strategies before the final exam.';
            else if (pct >= 50) msg = 'Good effort. Revisit MFA, access control models, and the NIST IR framework.';
            else msg = 'Keep studying. Review Week 4 materials on governance and incident response, then retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            // Record completion only on passing (70%). completeQuiz expects PERCENTAGE.
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try {
                    ModuleProgress.completeQuiz('shield', 'pis-w4-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[pis-w4] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Per-question Review Answers view. Options/ans are post-shuffle (in-place
         *  mutation at page load) so userAnswers[i] aligns with questions[i].ans. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q._perm ? q._perm.indexOf(revealedAnswers[i]) : revealedAnswers[i]; // Family-5: server reveal, mapped through this run's shuffle
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            // Re-shuffle on retry so a student who memorized positions on attempt 1
            // gets a fresh randomization on attempt 2. Restart button is gated to
            // the results card (resultsCard.display='block' only after showResults()),
            // so this never fires mid-quiz.
            permShuffleQuiz(questions);
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>

    <hex-ai-button mission-id="pis-w4" house="shield"></hex-ai-button>
