<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <!-- Option shuffle (anti-positional-memorization, Bridget 2026-05-09) now inline via permShuffleQuiz: q._perm maps shuffled->original; server grading (QC-57) submits ORIGINAL indices against the canonical Firestore key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2: Attacks + Cryptography | Principles of Information Security</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #0f1628 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--blue-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--blue);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--blue);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--blue);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }
        .option.selected { border-color: var(--blue); background: rgba(59, 130, 246, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--blue);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--blue);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--blue); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(59, 130, 246, 0.15); color: var(--blue); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 { color: var(--blue); font-size: 1.4rem; margin-bottom: 1rem; }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--blue);
        }
        .btn-retry:hover { background: var(--blue); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 1rem 1.1rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .review-q-num {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .review-mark {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.12em;
        }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 0.7rem;
            line-height: 1.5;
        }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            font-size: 0.86rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .review-opt.correct {
            background: rgba(34, 197, 94, 0.10);
            border-color: rgba(34, 197, 94, 0.45);
        }
        .review-opt.incorrect {
            background: rgba(239, 68, 68, 0.10);
            border-color: rgba(239, 68, 68, 0.45);
        }
        .review-tag {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 3px;
            font-style: italic;
            margin-left: auto;
        }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.04);
            border-left: 2px solid var(--blue);
            border-radius: 0 6px 6px 0;
        }
        .review-exp strong { color: var(--blue); }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Infosec Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 2: Attacks + Cryptography</h1>
            <p class="subtitle">Social engineering, malware, cipher fundamentals, hashing, and PKI basics</p>
            <div class="meta">
                <span>Week 2</span>
                <span>15 Questions</span>
                <span>SY0-701: 2.0, 3.0, 1.4</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [{"q":"An attacker calls a hospital's IT help desk, impersonates a physician, and convinces the technician to reset their password without verification. This is an example of:","opts":["Pretexting","Phishing","Vishing","Tailgating"],"exp":"Pretexting is fabricating a scenario (pretext) to manipulate a victim into providing access or information. Impersonating a physician to reset credentials is a classic pretexting attack."},{"q":"Which type of malware encrypts the victim's files and demands payment for the decryption key?","opts":["Ransomware","Rootkit","Spyware","Worm"],"exp":"Ransomware encrypts victim data and demands a ransom, typically in cryptocurrency, for the decryption key. It is one of the most financially damaging malware categories."},{"q":"A worm propagates across a hospital network, consuming bandwidth and crashing patient monitoring systems. Which characteristic distinguishes a worm from a virus?","opts":["Worms require user interaction to spread; viruses do not","Worms encrypt data; viruses delete data","Worms self-replicate across networks without requiring a host file; viruses attach to host files","Worms target firmware; viruses target RAM"],"exp":"Worms self-replicate and spread autonomously across networks without needing to attach to a host file. Viruses require a host file and typically require user action to trigger."},{"q":"Which symmetric encryption algorithm uses a 128, 192, or 256-bit key and is the current US federal standard?","opts":["DES","3DES","RC4","AES"],"exp":"AES (Advanced Encryption Standard) was adopted by NIST in 2001 as the federal standard. It supports 128, 192, and 256-bit key sizes and is used in TLS, disk encryption, and Wi-Fi security."},{"q":"What is the primary difference between symmetric and asymmetric encryption?","opts":["Symmetric uses two different keys; asymmetric uses one shared key","Symmetric is slower; asymmetric is faster","Symmetric uses one shared key for both encryption and decryption; asymmetric uses a public/private key pair","Symmetric is used only for hashing; asymmetric is used for key exchange"],"exp":"Symmetric encryption uses a single shared key for both encryption and decryption. Asymmetric uses a mathematically related public/private key pair -- what one key encrypts, only the other can decrypt."},{"q":"A threat actor intercepts encrypted traffic between a CDC field team and headquarters, silently reading and altering messages. This attack is known as:","opts":["Replay attack","Credential stuffing","SQL injection","Man-in-the-middle (MitM) attack"],"exp":"A Man-in-the-Middle attack positions the attacker between two communicating parties, allowing them to intercept, read, and modify traffic without the parties' knowledge."},{"q":"Which hashing algorithm produces a 256-bit digest and is widely used in TLS certificates and code signing?","opts":["MD5","SHA-256","SHA-1","RIPEMD-128"],"exp":"SHA-256 (part of the SHA-2 family) produces a 256-bit hash and is the current standard for TLS certificates and code signing. MD5 and SHA-1 are considered cryptographically broken."},{"q":"What property of a hash function ensures that two different inputs will not produce the same hash output?","opts":["Collision resistance","Salting","Pre-image resistance","Avalanche effect"],"exp":"Collision resistance means it is computationally infeasible to find two different inputs that produce the same hash. MD5 and SHA-1 fail this property and are therefore deprecated."},{"q":"An attacker gains network access by sending a crafted email with a malicious attachment to an employee. Which initial access technique is this?","opts":["Drive-by download","Brute force","Watering hole attack","Spear phishing"],"exp":"Spear phishing is a targeted phishing attack aimed at a specific individual or organization, often using personalized details to increase believability. It is the most common initial access vector."},{"q":"A rootkit is installed on a compromised server. What is the primary purpose of a rootkit?","opts":["To encrypt files for ransom","To replicate itself across the network","To conceal the attacker's presence and maintain privileged access","To capture keystrokes and send them to the attacker"],"exp":"A rootkit hides malware and attacker activity from the operating system and security tools, allowing the attacker to maintain persistent, privileged access while remaining undetected."},{"q":"Which attack technique involves submitting a large number of known plaintext-hash pairs to reverse a password hash?","opts":["Brute force attack","Rainbow table attack","Dictionary attack","Pass-the-hash attack"],"exp":"Rainbow table attacks use precomputed hash-to-plaintext mappings to rapidly reverse password hashes. Salting passwords defeats rainbow tables by making precomputation infeasible."},{"q":"What is the purpose of adding a cryptographic salt to a password before hashing?","opts":["To increase the key length of the hash","To ensure the same password always produces the same hash","To compress the hash output for faster storage","To make each hash unique even when passwords are identical, defeating precomputed table attacks"],"exp":"A salt is a random value appended to the password before hashing. It ensures that identical passwords produce different hashes, defeating rainbow table and precomputed dictionary attacks."},{"q":"A phishing email directs victims to a site that mimics the CDC's online reporting portal to steal credentials. Which social engineering principle does this exploit?","opts":["Scarcity","Authority and familiarity","Reciprocity","Consensus"],"exp":"Mimicking a trusted authority (CDC) exploits both authority (victims trust the source) and familiarity (the site looks legitimate). These are core Cialdini influence principles used in social engineering."},{"q":"Which type of attack replays a captured authentication token to gain unauthorized access without knowing the credentials?","opts":["Replay attack","Pass-the-hash","Credential stuffing","Kerberoasting"],"exp":"A replay attack captures a valid authentication token or session credential and retransmits it to impersonate the original user. Timestamps and nonces in protocols like TLS and Kerberos prevent this."},{"q":"DES (Data Encryption Standard) is considered insecure today primarily because:","opts":["It uses an asymmetric key algorithm","Its 56-bit key is too short to resist modern brute-force attacks","It relies on MD5 hashing internally","It requires a public key infrastructure to operate"],"exp":"DES uses a 56-bit key, which can be brute-forced in hours with modern hardware. It was officially deprecated and replaced by 3DES and then AES. Never use DES for any current application."}];

        // Defeat positional memorization across PIS quizzes (Bridget 2026-05-09).
        // Mutates questions[].opts and questions[].ans in-place; safe because
        // pis-w2 is client-graded (no Firestore quiz_keys lookup at score time).
        // Family-5 permutation shuffle: shuffles opts WITHOUT needing q.ans (stripped).
        // Records q._perm = shuffled position -> original index; server key stays canonical.
        function permShuffleQuiz(qs) {
            qs.forEach(function (q) {
                var idx = q.opts.map(function (_, i) { return i; });
                for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
                q.opts = idx.map(function (o) { return q.opts[o]; });
                q._perm = idx;
            });
        }
        permShuffleQuiz(questions);

        /* ── Quiz Engine State ──
           Aligned to Security+ SY0-701 domains 2.0 (Threats/Attacks) and 3.0 (Cryptography).
           Passing threshold: 70%. On pass, records completion via ModuleProgress. */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'pis-w2-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, q._perm ? q._perm[idx] : idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (typeof ca !== 'undefined' && q._perm) ca = q._perm.indexOf(ca); // original -> shuffled
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer! ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct! ' : 'Incorrect! ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have a strong command of attack techniques and cryptography fundamentals.';
            else if (pct >= 70) msg = 'Solid work. Review the crypto concepts you missed before the midterm.';
            else if (pct >= 50) msg = 'Good effort. Revisit malware types, social engineering, and symmetric vs. asymmetric encryption.';
            else msg = 'Keep studying. Review Week 2 materials on attacks and cryptography and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            // Record completion only on passing (70% threshold).
            // completeQuiz expects a PERCENTAGE, not the raw correct-count.
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try {
                    ModuleProgress.completeQuiz('shield', 'pis-w2-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[pis-w2] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /**
         * Render the per-question Review Answers view. Shows each question with
         * the student's pick, the correct answer, and the explanation.
         * Options/ans are post-shuffle (InlineQuizShuffler runs once at page load),
         * so userAnswers[i] aligns with questions[i].ans.
         */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q._perm ? q._perm.indexOf(revealedAnswers[i]) : revealedAnswers[i]; // Family-5: server reveal, mapped through this run's shuffle
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            // Re-shuffle on retry so a student who memorized positions on attempt 1
            // gets a fresh randomization on attempt 2. Restart button is gated to
            // the results card (resultsCard.display='block' only after showResults()),
            // so this never fires mid-quiz.
            permShuffleQuiz(questions);
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
