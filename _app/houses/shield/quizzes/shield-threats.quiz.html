<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threats & Attack Vectors Quiz - Shield House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(248, 113, 113, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #f87171;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fca5a5; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Shield House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Threats & Attack Vectors Quiz',
            description: '15 questions on malware, social engineering, web attacks, OSINT, and pentesting',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-threats',
            moduleId: 'shield-threats',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Which threat actor type is characterized by unlimited resources and sophisticated, persistent attacks targeting critical infrastructure?",
                    options: ["Script kiddies", "Hacktivists", "Cybercriminals", "Nation-state actors (APT)"],explanation: "Nation-state actors or Advanced Persistent Threats (APTs) have virtually unlimited resources backed by governments. They conduct sophisticated, long-term campaigns targeting critical infrastructure, intellectual property, and political targets."
                },
                {
                    question: "What distinguishes a worm from a virus?",
                    options: ["Worms are larger in file size", "Worms can self-replicate without a host file", "Worms only affect servers", "Viruses are more dangerous"],explanation: "The key distinction is that worms can self-replicate and spread across networks without needing to attach to a host file. Viruses require a host program to spread and must be executed by the user."
                },
                {
                    question: "What is the primary goal of ransomware?",
                    options: ["Steal sensitive data", "Encrypt files and demand payment", "Spy on user activity", "Create a botnet"],explanation: "Ransomware encrypts victim files (or locks the system) and demands payment (usually cryptocurrency) for the decryption key. While some variants also steal data, encryption and extortion are the primary goals."
                },
                {
                    question: "What makes fileless malware particularly difficult to detect?",
                    options: ["It's encrypted with strong algorithms", "It lives only in memory and uses legitimate system tools", "It changes its signature constantly", "It only activates at night"],explanation: "Fileless malware operates entirely in memory without writing files to disk. It often uses legitimate tools like PowerShell or WMI, making it hard to detect with traditional file-based antivirus solutions."
                },
                {
                    question: "Which psychological principle is exploited when a phishing email creates artificial time pressure?",
                    options: ["Authority", "Reciprocity", "Urgency", "Social proof"],explanation: "Urgency is the principle exploited when attackers create time pressure (e.g., 'Act now or your account will be suspended'). This prevents victims from thinking carefully and seeking verification."
                },
                {
                    question: "What is spear phishing?",
                    options: ["Phishing that uses phone calls", "Targeted phishing aimed at specific individuals", "Phishing that steals fishing industry data", "Phishing through social media"],explanation: "Spear phishing is targeted phishing that focuses on specific individuals or organizations. The attacker researches the target to craft convincing, personalized messages, unlike generic mass phishing campaigns."
                },
                {
                    question: "What is a Business Email Compromise (BEC) attack?",
                    options: ["Hacking into a company's email server", "Impersonating an executive to trick employees into transfers", "Installing malware through email attachments", "Stealing email contact lists"],explanation: "BEC attacks involve impersonating executives, vendors, or trusted parties to trick employees into making wire transfers or sharing sensitive information. They often don't use malware, relying purely on social engineering."
                },
                {
                    question: "In SQL injection, what does the input `' OR '1'='1` typically accomplish?",
                    options: ["Deletes the database", "Creates an always-true condition to bypass authentication", "Encrypts the database", "Lists all database tables"],explanation: "The payload `' OR '1'='1` creates an always-true condition in the WHERE clause. When used in login forms, this can bypass authentication because the query returns all rows, effectively logging in as the first user."
                },
                {
                    question: "What type of XSS attack stores malicious scripts in a database to be executed by other users?",
                    options: ["Reflected XSS", "Stored XSS", "DOM-based XSS", "Self-XSS"],explanation: "Stored (or Persistent) XSS stores malicious scripts in the application's database. When other users view the affected page, the script executes in their browsers. This is more dangerous than reflected XSS because it affects all users."
                },
                {
                    question: "Which defense prevents SQL injection by separating data from SQL commands?",
                    options: ["Input validation", "Parameterized queries (prepared statements)", "Output encoding", "WAF"],explanation: "Parameterized queries (prepared statements) are the most effective defense against SQL injection. They ensure user input is always treated as data, never as executable SQL commands, regardless of what the input contains."
                },
                {
                    question: "What is Google dorking?",
                    options: ["A method to hack Google accounts", "Using advanced search operators for OSINT", "A type of DDoS attack on Google", "A vulnerability in Google Chrome"],explanation: "Google dorking uses advanced search operators (site:, filetype:, inurl:, etc.) to find sensitive information indexed by Google. Attackers use this for reconnaissance to find exposed files, login pages, or vulnerable systems."
                },
                {
                    question: "Which of these is a passive reconnaissance technique?",
                    options: ["Port scanning", "WHOIS lookups", "Vulnerability scanning", "Banner grabbing"],explanation: "WHOIS lookups are passive because they query public registrar databases without any direct contact with the target. Port scanning, vulnerability scanning, and banner grabbing all involve direct interaction with the target's systems."
                },
                {
                    question: "What is the first phase of a penetration test?",
                    options: ["Scanning", "Exploitation", "Planning and scoping", "Reporting"],explanation: "Planning and scoping is the first phase, where the tester defines what systems are in scope, rules of engagement, and gets legal authorization. Testing without proper scope and authorization is illegal."
                },
                {
                    question: "What distinguishes black box testing from white box testing?",
                    options: ["Black box is done at night", "Black box tester has no prior knowledge of the target", "White box uses automated tools only", "Black box is illegal"],explanation: "In black box testing, the tester has no prior knowledge of the target (simulating an external attacker). In white box testing, the tester has full knowledge including source code and architecture. Gray box is in between."
                },
                {
                    question: "What vulnerability did Heartbleed exploit?",
                    options: ["A Windows kernel bug", "A buffer over-read in OpenSSL's heartbeat extension", "A SQL injection in web servers", "A flaw in password hashing"],explanation: "Heartbleed was a buffer over-read vulnerability in OpenSSL's TLS heartbeat extension. It allowed attackers to read server memory, potentially exposing private keys, session data, and passwords from affected servers."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
