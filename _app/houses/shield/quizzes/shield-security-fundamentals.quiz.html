<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Fundamentals Quiz | Shield House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(248, 113, 113, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #f87171;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fca5a5; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Shield House</a>
        <span class="brand"><span>&#128737;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Security Fundamentals Quiz',
            description: 'Test your knowledge of core security concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-security-fundamentals',
            moduleId: 'shield-security-fundamentals',
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Which element of the CIA Triad is primarily concerned with preventing unauthorized modification of data?",
                    options: ["Confidentiality", "Integrity", "Availability", "Authentication"],
                    correct: 1,
                    explanation: "Integrity ensures data is not modified without authorization. Confidentiality prevents disclosure, and Availability ensures access."
                },
                {
                    question: "A DDoS attack that takes a website offline primarily affects which CIA element?",
                    options: ["Confidentiality", "Integrity", "Availability", "Non-repudiation"],
                    correct: 2,
                    explanation: "Availability is affected because legitimate users cannot access the service."
                },
                {
                    question: "Encryption primarily protects which CIA element?",
                    options: ["Confidentiality", "Integrity", "Availability", "All of the above"],
                    correct: 0,
                    explanation: "Confidentiality is protected because encrypted data cannot be read without the key."
                },
                {
                    question: "A security camera monitoring a server room is classified as what type of control?",
                    options: ["Preventive Administrative", "Detective Physical", "Corrective Technical", "Preventive Physical"],
                    correct: 1,
                    explanation: "Detective Physical - cameras detect/record incidents (detective) and are physical devices."
                },
                {
                    question: "An acceptable use policy is what type of control?",
                    options: ["Preventive Administrative", "Detective Technical", "Corrective Physical", "Preventive Technical"],
                    correct: 0,
                    explanation: "Preventive Administrative - policies prevent bad behavior through rules (administrative)."
                },
                {
                    question: "Antivirus software that removes detected malware is what type of control?",
                    options: ["Preventive Technical", "Detective Technical", "Corrective Technical", "Corrective Administrative"],
                    correct: 2,
                    explanation: "Corrective Technical - removing malware corrects the problem using software (technical)."
                },
                {
                    question: "The principle of 'least privilege' means:",
                    options: ["Users get maximum access to do their jobs", "Users get minimum access needed for their jobs", "Administrators have no restrictions", "All users have equal access"],
                    correct: 1,
                    explanation: "Least Privilege grants only the minimum access necessary to perform job functions."
                },
                {
                    question: "Defense in Depth refers to:",
                    options: ["Having one very strong security control", "Multiple layers of security controls", "Deeply hidden passwords", "Physical security only"],
                    correct: 1,
                    explanation: "Defense in Depth uses multiple overlapping security controls so if one fails, others still protect."
                },
                {
                    question: "When a firewall fails, it blocks all traffic instead of allowing it. This demonstrates:",
                    options: ["Fail Open", "Fail Secure", "Defense in Depth", "Least Privilege"],
                    correct: 1,
                    explanation: "Fail Secure means the system defaults to a secure state when it fails."
                },
                {
                    question: "You discover a security vulnerability in a public website. The ethical approach is to:",
                    options: ["Exploit it to prove it works", "Report it through responsible disclosure", "Share it publicly immediately", "Ignore it"],
                    correct: 1,
                    explanation: "Responsible Disclosure involves privately reporting vulnerabilities to allow fixing before public disclosure."
                },
                {
                    question: "Which of these violates the (ISC)2 Code of Ethics?",
                    options: ["Reporting a security incident", "Protecting society and infrastructure", "Accessing systems without authorization for \"testing\"", "Acting with integrity"],
                    correct: 2,
                    explanation: "Unauthorized access is unethical regardless of intent. Always get written permission before testing."
                },
                {
                    question: "PII stands for:",
                    options: ["Private Internet Information", "Personally Identifiable Information", "Protected Internal Infrastructure", "Personal Identity Index"],
                    correct: 1,
                    explanation: "Personally Identifiable Information - data that can identify an individual (SSN, name, address, etc.)."
                },
                {
                    question: "Which role is primarily responsible for simulating attacks to test defenses?",
                    options: ["Security Analyst", "Compliance Officer", "Penetration Tester", "Security Architect"],
                    correct: 2,
                    explanation: "Penetration Testers simulate real attacks to find vulnerabilities before malicious hackers do."
                },
                {
                    question: "A SOC Analyst primarily works in:",
                    options: ["Software development", "Security monitoring and incident response", "Physical security", "Human resources"],
                    correct: 1,
                    explanation: "SOC (Security Operations Center) Analysts monitor security systems and respond to incidents."
                },
                {
                    question: "The McCumber Cube combines which three dimensions?",
                    options: ["CIA Triad, Data States, Security Measures", "People, Process, Technology", "Prevention, Detection, Correction", "Physical, Technical, Administrative"],
                    correct: 0,
                    explanation: "The McCumber Cube combines CIA goals, data states (storage, transmission, processing), and security measures."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
