<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security Quiz - Shield House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(248, 113, 113, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #f87171;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fca5a5; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Shield House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Network Security Quiz',
            description: '15 questions covering firewalls, VPNs, IDS/IPS, protocols, and wireless security',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-network-security',
            moduleId: 'shield-network-security',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "What is the primary difference between a stateful and stateless firewall?",
                    options: ["Stateless firewalls are faster", "Stateful firewalls track connection state and context", "Stateless firewalls can block DDoS attacks", "Stateful firewalls only work at Layer 7"],explanation: "Stateful firewalls maintain a state table that tracks active connections, allowing them to make decisions based on the context of the traffic (e.g., whether a packet is part of an established session). Stateless firewalls evaluate each packet in isolation."
                },
                {
                    question: "Which TCP flag combination indicates a SYN flood attack in progress?",
                    options: ["Many SYN packets without corresponding ACK responses", "Continuous FIN packets to all ports", "RST packets after every connection", "PSH and URG flags set simultaneously"],explanation: "A SYN flood attack involves sending many SYN packets (connection initiation) but never completing the three-way handshake with an ACK. This exhausts server resources holding half-open connections."
                },
                {
                    question: "What is the purpose of NAT (Network Address Translation)?",
                    options: ["Encrypt network traffic between hosts", "Translate private IP addresses to public addresses", "Balance load across multiple servers", "Cache DNS queries for faster resolution"],explanation: "NAT allows multiple devices with private IP addresses to share a single public IP address for internet access. It also provides a layer of security by hiding internal network topology."
                },
                {
                    question: "Which VPN protocol operates at Layer 3 and provides strong encryption for site-to-site connections?",
                    options: ["PPTP", "SSL VPN", "IPsec", "L2TP alone"],explanation: "IPsec operates at the Network Layer (Layer 3) and is commonly used for site-to-site VPN connections. It provides authentication, integrity, and confidentiality for IP packets."
                },
                {
                    question: "What is the security risk of VPN split tunneling?",
                    options: ["It slows down the VPN connection", "Corporate traffic may bypass security monitoring", "It uses more bandwidth", "It requires additional hardware"],explanation: "Split tunneling allows users to access both VPN-protected resources and the internet directly. This means malware or compromised sites could potentially access the corporate network through the unprotected path, bypassing security controls."
                },
                {
                    question: "What detection method can identify zero-day attacks that signature-based IDS cannot?",
                    options: ["Port scanning", "Anomaly-based detection", "Deep packet inspection", "MAC address filtering"],explanation: "Anomaly-based detection establishes a baseline of normal network behavior and alerts when deviations occur. Since it doesn't rely on known signatures, it can potentially detect novel or zero-day attacks."
                },
                {
                    question: "What is the difference between IDS and IPS?",
                    options: ["IDS is network-based, IPS is host-based", "IDS only detects threats, IPS can block them", "IPS is signature-based, IDS is anomaly-based", "There is no difference"],explanation: "An Intrusion Detection System (IDS) monitors and alerts on suspicious activity. An Intrusion Prevention System (IPS) sits inline and can actively block or prevent detected threats in real-time."
                },
                {
                    question: "Which wireless security protocol should NEVER be used due to known vulnerabilities?",
                    options: ["WPA3", "WPA2-Enterprise", "WEP", "WPA2-PSK"],explanation: "WEP (Wired Equivalent Privacy) uses weak RC4 encryption and can be cracked in minutes using freely available tools. It should never be used; WPA2 or WPA3 are the minimum acceptable standards."
                },
                {
                    question: "What advantage does WPA2-Enterprise have over WPA2-Personal (PSK)?",
                    options: ["Faster connection speeds", "Individual user authentication via RADIUS", "Stronger encryption algorithm", "Lower power consumption"],explanation: "WPA2-Enterprise uses 802.1X authentication with a RADIUS server, providing unique credentials for each user. This allows for individual accountability, easier revocation of access, and eliminates the shared password vulnerability of PSK."
                },
                {
                    question: "What is an \"Evil Twin\" attack?",
                    options: ["A type of SQL injection", "A rogue access point mimicking a legitimate network", "Two users sharing the same password", "A man-in-the-middle attack on wired networks"],explanation: "An Evil Twin attack involves setting up a rogue access point with the same SSID as a legitimate network. Victims connect to the attacker's AP, allowing the attacker to intercept traffic or launch further attacks."
                },
                {
                    question: "In the TCP three-way handshake, what is the correct sequence?",
                    options: ["ACK, SYN, SYN-ACK", "SYN, SYN-ACK, ACK", "SYN-ACK, SYN, ACK", "SYN, ACK, SYN-ACK"],explanation: "The TCP three-way handshake sequence is: 1) Client sends SYN, 2) Server responds with SYN-ACK, 3) Client sends ACK. This establishes a reliable connection before data transfer begins."
                },
                {
                    question: "What network security concept places public-facing servers in a separate network segment?",
                    options: ["VPN tunnel", "DMZ (Demilitarized Zone)", "VLAN hopping", "Port mirroring"],explanation: "A DMZ is a network segment that sits between the external (untrusted) network and internal (trusted) network. Public-facing servers like web and email servers are placed here to limit exposure if compromised."
                },
                {
                    question: "Which firewall type operates at Layer 7 and can inspect application-specific content?",
                    options: ["Packet filter firewall", "Stateful inspection firewall", "Web Application Firewall (WAF)", "Circuit-level gateway"],explanation: "A Web Application Firewall (WAF) operates at Layer 7 (Application Layer) and can inspect HTTP/HTTPS traffic content. It protects against application-specific attacks like SQL injection and XSS."
                },
                {
                    question: "What does IKE (Internet Key Exchange) accomplish in IPsec VPNs?",
                    options: ["Encrypts the actual data payload", "Establishes security associations and exchanges keys", "Routes traffic through the VPN tunnel", "Compresses data before encryption"],explanation: "IKE is the protocol used to set up IPsec VPNs. It authenticates peers, negotiates security parameters, and securely exchanges the cryptographic keys used for encrypting the VPN tunnel traffic."
                },
                {
                    question: "Which defense-in-depth layer would host-based firewalls and antivirus software belong to?",
                    options: ["Perimeter Security", "Network Security", "Host Security", "Application Security"],explanation: "Host Security is the layer that protects individual endpoints. This includes host-based firewalls, antivirus/EDR, patch management, and OS hardening. It provides protection even if perimeter controls are bypassed."
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
