<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control Quiz - Shield House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(248, 113, 113, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #f87171;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fca5a5; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Shield House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Access Control Quiz',
            description: '15 questions on authentication, authorization, Kerberos, and IAM',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'shield',
            achievement: 'shield-access-control',
            moduleId: 'shield-access-control',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                {
                    question: "Which access control model allows the resource owner to grant permissions to others?",
                    options: ["Mandatory Access Control (MAC)", "Discretionary Access Control (DAC)", "Role-Based Access Control (RBAC)", "Rule-Based Access Control"],explanation: "Discretionary Access Control (DAC) gives the resource owner discretion over who can access their resources. This is used in Windows NTFS and Unix file permissions where owners can modify permissions."
                },
                {
                    question: "In a MAC system, what determines access permissions?",
                    options: ["The resource owner's preference", "Security labels assigned by the system", "The user's role in the organization", "Time of day and location"],explanation: "Mandatory Access Control uses security labels (like Top Secret, Secret, Confidential) assigned by administrators. Users cannot change these labels - access is system-enforced based on clearance levels."
                },
                {
                    question: "Which access control model is most commonly used in enterprise environments?",
                    options: ["DAC", "MAC", "RBAC", "ABAC"],explanation: "Role-Based Access Control (RBAC) is the most common in enterprises because it maps well to organizational structures. Users are assigned roles (like 'HR Manager' or 'Developer'), and roles have permissions."
                },
                {
                    question: "What are the three factors of authentication?",
                    options: ["Username, password, and email", "Something you know, have, and are", "Public key, private key, and certificate", "Encryption, decryption, and hashing"],explanation: "The three authentication factors are: Something you know (password, PIN), Something you have (phone, smart card), and Something you are (biometrics). True MFA requires factors from different categories."
                },
                {
                    question: "In biometrics, what does FAR (False Accept Rate) measure?",
                    options: ["The rate at which authorized users are incorrectly rejected", "The rate at which unauthorized users are incorrectly accepted", "The accuracy of the biometric sensor", "The speed of biometric verification"],explanation: "FAR measures how often an unauthorized person is incorrectly accepted (a security failure). FRR (False Reject Rate) measures how often authorized users are incorrectly rejected (a usability issue)."
                },
                {
                    question: "What is the CER (Crossover Error Rate) in biometrics?",
                    options: ["The maximum error rate allowed by policy", "The point where FAR equals FRR", "The minimum detectable change in biometric data", "The calibration error of the sensor"],explanation: "CER is the point where the False Accept Rate equals the False Reject Rate. It's used to compare biometric systems - a lower CER indicates a more accurate biometric system."
                },
                {
                    question: "In Kerberos, what does the TGT (Ticket Granting Ticket) allow a user to do?",
                    options: ["Access any service directly", "Request service tickets without re-entering credentials", "Bypass the KDC entirely", "Modify other users' permissions"],explanation: "The TGT is obtained after initial authentication and allows the user to request service tickets from the TGS without re-authenticating. This enables Single Sign-On (SSO) in Active Directory environments."
                },
                {
                    question: "Why is the user's password never sent over the network in Kerberos?",
                    options: ["It's too long to transmit", "The password is used locally to decrypt the TGT", "Kerberos doesn't use passwords", "The password is hashed before transmission"],explanation: "Kerberos is designed so the password never leaves the client. The password (or its hash) is used to decrypt the TGT locally. This prevents password interception during network transmission."
                },
                {
                    question: "What is a Golden Ticket attack in Active Directory?",
                    options: ["Stealing a user's session cookie", "Forging a TGT using the krbtgt account hash", "Brute-forcing the domain admin password", "Exploiting a vulnerability in the KDC"],explanation: "A Golden Ticket attack involves forging a TGT using the krbtgt account's password hash. With this forged ticket, attackers can impersonate any user, including Domain Admins, for as long as the hash remains unchanged."
                },
                {
                    question: "What is the Principle of Least Privilege?",
                    options: ["Users should share accounts to minimize license costs", "Users should have only the minimum access needed for their job", "Administrators should have access to everything", "All access should require manager approval"],explanation: "The Principle of Least Privilege states that users, programs, and processes should have only the minimum permissions necessary to perform their tasks. This limits the damage from compromised accounts or malware."
                },
                {
                    question: "What is permission creep?",
                    options: ["Gradual accumulation of unnecessary privileges over time", "Slow response time when checking permissions", "Permissions that expire automatically", "Gradual improvement in access control policies"],explanation: "Permission creep occurs when users accumulate permissions over time as they change roles, but old permissions are never revoked. Regular access reviews help identify and remediate permission creep."
                },
                {
                    question: "What is an orphaned account?",
                    options: ["An account without a password", "An account belonging to someone who has left the organization", "A newly created account", "An account locked due to failed login attempts"],explanation: "Orphaned accounts belong to former employees, contractors, or vendors who no longer work with the organization. These accounts are a security risk if not promptly disabled during offboarding."
                },
                {
                    question: "What is the purpose of access recertification?",
                    options: ["To renew user licenses", "To periodically verify that access permissions are still appropriate", "To upgrade security certificates", "To reset all passwords"],explanation: "Access recertification (or access reviews) is a periodic process where managers verify that users still need their assigned access. It helps identify and remove stale or inappropriate permissions."
                },
                {
                    question: "Which authentication protocol uses security tokens in a federated identity model?",
                    options: ["Kerberos", "LDAP", "SAML", "NTLM"],explanation: "SAML (Security Assertion Markup Language) is commonly used for federated single sign-on. It allows an Identity Provider (IdP) to pass authentication tokens to Service Providers (SPs), enabling SSO across organizations."
                },
                {
                    question: "What is Just-In-Time (JIT) access?",
                    options: ["Immediate account creation when needed", "Temporary elevated privileges granted only when needed and for a limited time", "Real-time access monitoring", "Instant password reset capability"],explanation: "JIT access provides elevated privileges only when needed, for a specific task, and for a limited time. Instead of having permanent admin access, users request temporary privileges that automatically expire."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
