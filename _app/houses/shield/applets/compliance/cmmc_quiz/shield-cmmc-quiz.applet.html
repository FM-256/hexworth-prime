<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMC Comprehensive Quiz | Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <style>
        :root {
            --shield: #a855f7;
            --shield-dim: #a855f733;
            --shield-glow: rgba(168,85,247,0.15);
            --bg: #0a0a0f;
            --card: #111118;
            --card-border: #1e1e2a;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; line-height:1.6; }

        .app { max-width:900px; margin:0 auto; padding:1rem; }

        .back { display:inline-flex; align-items:center; gap:.4rem; color:var(--text-muted); text-decoration:none; font-size:.82rem; margin-bottom:1rem; transition:color .2s; }
        .back:hover { color:var(--shield); }

        /* Header */
        .header { background:linear-gradient(135deg, #1a1020 0%, var(--shield-glow) 100%); border:1px solid var(--shield-dim); border-radius:12px; padding:1.5rem 2rem; margin-bottom:1.5rem; position:relative; overflow:hidden; }
        .header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--shield), transparent); }
        .header-top { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
        .header-icon { font-size:2.5rem; }
        .header-title { font-size:1.6rem; font-weight:700; color:#fff; }
        .header-badge { background:var(--shield-dim); color:var(--shield); border:1px solid rgba(168,85,247,0.4); padding:3px 12px; border-radius:20px; font-size:.75rem; font-weight:600; letter-spacing:.5px; }
        .header-desc { color:var(--text-dim); font-size:.9rem; margin-top:.5rem; }

        /* Setup screen */
        .setup { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:2rem; text-align:center; }
        .setup h2 { color:#fff; font-size:1.3rem; margin-bottom:1rem; }
        .setup p { color:var(--text-dim); font-size:.9rem; margin-bottom:1.5rem; }
        .setup-stats { display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; margin-bottom:1.5rem; }
        .stat { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:.75rem 1.25rem; min-width:120px; }
        .stat-num { font-size:1.5rem; font-weight:700; color:var(--shield); }
        .stat-label { font-size:.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-top:.2rem; }

        .mode-toggle { display:flex; gap:.5rem; justify-content:center; margin-bottom:1.5rem; }
        .mode-btn { padding:.6rem 1.5rem; border-radius:8px; border:1px solid var(--card-border); background:rgba(255,255,255,.03); color:var(--text-dim); font-size:.85rem; cursor:pointer; transition:all .2s; }
        .mode-btn:hover { border-color:var(--shield-dim); color:var(--text); }
        .mode-btn.active { background:var(--shield-glow); border-color:var(--shield); color:var(--shield); font-weight:600; }

        .start-btn { padding:.75rem 3rem; border-radius:10px; border:none; background:linear-gradient(135deg, #7c3aed, #a855f7); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
        .start-btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(168,85,247,.4); }

        .prev-score { margin-top:1.25rem; font-size:.82rem; color:var(--text-muted); }
        .prev-score strong { color:var(--shield); }

        /* Timer bar */
        .timer-wrap { display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; }
        .timer-bar { flex:1; height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; }
        .timer-fill { height:100%; border-radius:3px; transition:width 1s linear; }
        .timer-fill.green { background:var(--green); }
        .timer-fill.yellow { background:var(--yellow); }
        .timer-fill.red { background:var(--red); }
        .timer-text { font-size:.82rem; font-weight:600; color:var(--text-dim); min-width:55px; text-align:right; font-variant-numeric:tabular-nums; }

        /* Progress indicator */
        .progress-row { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; }
        .progress-bar { flex:1; height:4px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--shield); border-radius:2px; transition:width .3s ease; }
        .progress-label { font-size:.78rem; color:var(--text-muted); min-width:75px; text-align:right; }

        /* Domain badge on question */
        .domain-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:.7rem; font-weight:600; letter-spacing:.5px; background:rgba(168,85,247,.1); color:var(--shield); border:1px solid var(--shield-dim); margin-bottom:.75rem; }

        /* Question card */
        .q-card { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.75rem; margin-bottom:1rem; }
        .q-num { font-size:.72rem; color:var(--shield); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:.5rem; }
        .q-text { color:var(--text); font-size:.95rem; line-height:1.6; margin-bottom:1.25rem; }
        .q-opt { display:block; width:100%; text-align:left; padding:.75rem 1rem; margin-bottom:.4rem; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cbd5e1; font-size:.87rem; cursor:pointer; transition:all .15s; line-height:1.5; }
        .q-opt:hover:not(.locked) { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.15); }
        .q-opt.selected { background:rgba(168,85,247,.08); border-color:var(--shield); color:var(--shield); }
        .q-opt.correct { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:var(--green); }
        .q-opt.wrong { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.35); color:var(--red); }
        .q-opt.reveal { border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.04); }
        .q-opt.locked { cursor:default; }
        .q-explain { display:none; margin-top:.85rem; padding:.75rem 1rem; background:rgba(168,85,247,.05); border-left:3px solid rgba(168,85,247,.4); border-radius:0 6px 6px 0; color:var(--text-dim); font-size:.83rem; line-height:1.5; }
        .q-explain.show { display:block; }

        /* Nav buttons */
        .nav-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:.5rem; }
        .nav-btn { padding:.6rem 1.5rem; border-radius:8px; border:1px solid var(--card-border); background:rgba(255,255,255,.04); color:var(--text-dim); font-size:.85rem; cursor:pointer; transition:all .2s; }
        .nav-btn:hover { border-color:var(--shield-dim); color:var(--shield); }
        .nav-btn.primary { background:var(--shield-glow); border-color:var(--shield); color:var(--shield); font-weight:600; }
        .nav-btn:disabled { opacity:.3; cursor:default; }
        .nav-btn:disabled:hover { border-color:var(--card-border); color:var(--text-dim); }

        /* Flagged indicator */
        .flag-btn { padding:.4rem .75rem; border-radius:6px; border:1px solid var(--card-border); background:transparent; color:var(--text-muted); font-size:.78rem; cursor:pointer; transition:all .2s; }
        .flag-btn:hover { border-color:var(--yellow); color:var(--yellow); }
        .flag-btn.flagged { border-color:var(--yellow); color:var(--yellow); background:rgba(234,179,8,.08); }

        /* Results */
        .results { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:2rem; text-align:center; margin-bottom:1rem; }
        .results-score { font-size:3rem; font-weight:700; color:var(--shield); }
        .results-label { color:var(--text-muted); font-size:.85rem; margin-top:.25rem; }
        .results-verdict { font-size:1.1rem; font-weight:600; margin-top:.75rem; }
        .results-verdict.pass { color:var(--green); }
        .results-verdict.fail { color:var(--red); }
        .results-bar { height:8px; background:rgba(255,255,255,.06); border-radius:4px; margin:1rem auto; max-width:400px; overflow:hidden; }
        .results-fill { height:100%; border-radius:4px; transition:width .8s ease; }
        .results-meta { font-size:.82rem; color:var(--text-muted); margin-top:.5rem; }

        /* Domain breakdown table */
        .breakdown { margin:1.5rem 0; background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:10px; overflow:hidden; text-align:left; }
        .breakdown h4 { padding:1rem 1.25rem .5rem; color:var(--shield); font-size:.85rem; text-transform:uppercase; letter-spacing:.5px; }
        .bd-table { width:100%; border-collapse:collapse; font-size:.82rem; }
        .bd-table th { background:rgba(168,85,247,.08); color:var(--shield); padding:.5rem .75rem; text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
        .bd-table td { padding:.5rem .75rem; border-bottom:1px solid rgba(255,255,255,.03); color:var(--text-dim); }
        .bd-table td:first-child { color:var(--text); font-weight:500; }
        .bd-table .pass { color:var(--green); }
        .bd-table .fail { color:var(--red); }
        .bd-bar { height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; min-width:60px; }
        .bd-bar-fill { height:100%; border-radius:3px; }
        .bd-bar-fill.pass { background:var(--green); }
        .bd-bar-fill.fail { background:var(--red); }

        .results-actions { display:flex; gap:.75rem; justify-content:center; margin-top:1.25rem; flex-wrap:wrap; }

        /* Review section */
        .review-header { font-size:1rem; font-weight:600; color:#fff; margin:1.5rem 0 1rem; display:flex; align-items:center; gap:.5rem; }
        .review-filter { display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap; }
        .rf-btn { padding:.4rem .85rem; border-radius:6px; border:1px solid var(--card-border); background:transparent; color:var(--text-muted); font-size:.78rem; cursor:pointer; transition:all .2s; }
        .rf-btn:hover { border-color:var(--shield-dim); color:var(--text); }
        .rf-btn.active { background:var(--shield-glow); border-color:var(--shield); color:var(--shield); }

        /* Question map */
        .q-map { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:1rem; }
        .q-dot { width:28px; height:28px; border-radius:6px; border:1px solid var(--card-border); background:rgba(255,255,255,.03); display:flex; align-items:center; justify-content:center; font-size:.68rem; color:var(--text-muted); cursor:pointer; transition:all .15s; }
        .q-dot:hover { border-color:var(--shield-dim); }
        .q-dot.current { border-color:var(--shield); color:var(--shield); background:var(--shield-glow); }
        .q-dot.answered { background:rgba(255,255,255,.06); color:var(--text-dim); }
        .q-dot.flagged { border-color:var(--yellow); }
        .q-dot.correct-dot { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.3); color:var(--green); }
        .q-dot.wrong-dot { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3); color:var(--red); }

        /* Responsive */
        @media (max-width:768px) {
            .app { padding:.75rem; }
            .header { padding:1rem 1.25rem; }
            .header-title { font-size:1.2rem; }
            .q-card { padding:1.25rem; }
            .setup-stats { gap:.75rem; }
            .stat { min-width:90px; padding:.5rem .75rem; }
            .stat-num { font-size:1.2rem; }
            .results-score { font-size:2.5rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function() {
    const STORAGE_KEY = 'hexworth_cmmc_comprehensive_quiz';
    const TIMER_TOTAL = 45 * 60; // 45 minutes

    const DOMAINS = {
        AC: 'Access Control', AT: 'Awareness & Training', AU: 'Audit & Accountability',
        CM: 'Configuration Management', IA: 'Identification & Authentication', IR: 'Incident Response',
        MA: 'Maintenance', MP: 'Media Protection', PE: 'Physical Protection', PS: 'Personnel Security',
        RA: 'Risk Assessment', CA: 'Security Assessment', SC: 'System & Comm Protection', SI: 'System & Info Integrity'
    };

    const QUESTIONS = [
        // ═══ ACCESS CONTROL (AC) — 4 questions ═══
        { domain:'AC', q:'A defense contractor discovers a system administrator has been using their privileged account to access social media and personal email. Which CMMC practice is violated?', opts:['AC.L2-3.1.4 Separation of Duties','AC.L2-3.1.6 Non-Privileged Account Use','AC.L2-3.1.5 Least Privilege','AC.L2-3.1.7 Privileged Function Restriction'], correct:1, explain:'AC.L2-3.1.6 requires using non-privileged accounts for nonsecurity functions. Administrators must maintain separate standard accounts for daily activities like browsing and email.' },
        { domain:'AC', q:'Your organization\'s wireless network uses WPA2-Personal with a passphrase posted in the break room. Which TWO practices need improvement?', opts:['AC.L2-3.1.16 (Wireless Authorization) and AC.L2-3.1.17 (Wireless Protection)','AC.L2-3.1.12 (Remote Access) and AC.L2-3.1.13 (Remote Access Crypto)','AC.L1-3.1.20 (External Connections) and AC.L2-3.1.21 (Portable Storage)','AC.L2-3.1.9 (Privacy Notices) and AC.L2-3.1.10 (Session Lock)'], correct:0, explain:'AC.L2-3.1.16 requires authorized wireless access (shared passphrase cannot identify individuals) and AC.L2-3.1.17 requires proper authentication and encryption. WPA2-Enterprise with RADIUS is the preferred approach.' },
        { domain:'AC', q:'After 15 minutes of inactivity, workstations lock but display the last viewed document title on the lock screen. What must change?', opts:['Reduce timeout to 5 minutes','Lock screen must use pattern-hiding displays','Disable screen savers entirely','Force manual lock before stepping away'], correct:1, explain:'AC.L2-3.1.10 requires session lock with pattern-hiding displays. No information about session content should be visible on the lock screen.' },

        // ═══ AWARENESS & TRAINING (AT) — 3 questions ═══
        { domain:'AT', q:'A system administrator completed general security awareness training 3 months ago but has not received role-specific technical training in 18 months. Is this sufficient?', opts:['Yes -- any security training satisfies the requirement','No -- sysadmins need role-based technical training specific to their duties','Yes -- current certifications substitute for training','No -- training must be completed every 6 months'], correct:1, explain:'AT.L2-3.2.2 requires personnel be trained for their specific security-related duties. General awareness training does not satisfy the role-based training requirement for technical roles like system administrators.' },
        { domain:'AT', q:'Which of these is the BEST indicator of an insider threat that employees should be trained to recognize?', opts:['Employee asking for help with a technical problem','Colleague consistently working late on project deadlines','Employee repeatedly attempting to access files outside their job scope','New hire asking about network architecture during onboarding'], correct:2, explain:'AT.L2-3.2.3 focuses on recognizing insider threat indicators. Repeatedly attempting unauthorized file access is a behavioral indicator, while the other options describe normal workplace activities.' },
        { domain:'AT', q:'After a phishing attack compromises 15% of employees, what should be the priority response regarding awareness?', opts:['Terminate all affected employees immediately','Conduct targeted retraining on phishing recognition and reporting','Block all external email permanently','Require password changes only'], correct:1, explain:'AT.L2-3.2.1 emphasizes making users aware of security risks. Targeted training addressing the specific attack vector and reinforcing reporting procedures is the most effective response after a successful phishing campaign.' },

        // ═══ AUDIT & ACCOUNTABILITY (AU) — 3 questions ═══
        { domain:'AU', q:'Your SIEM stops receiving logs from the domain controller for 4 hours before anyone notices. Which AU practice primarily failed?', opts:['AU.L2-3.3.1 System Auditing','AU.L2-3.3.4 Audit Failure Alerting','AU.L2-3.3.5 Audit Correlation','AU.L2-3.3.8 Audit Protection'], correct:1, explain:'AU.L2-3.3.4 requires alerting on audit logging process failures. A 4-hour gap in log collection indicates the failure alerting mechanism is either missing or non-functional.' },
        { domain:'AU', q:'Forensic analysts discover firewall log timestamps are 3 minutes ahead of Active Directory logs. What practice addresses this?', opts:['AU.L2-3.3.5 Audit Correlation','AU.L2-3.3.7 Authoritative Time Source','AU.L2-3.3.6 Audit Reduction & Reporting','AU.L2-3.3.1 System Auditing'], correct:1, explain:'AU.L2-3.3.7 requires synchronizing system clocks with an authoritative source (NTP). Clock drift between systems makes event correlation unreliable and complicates forensic timelines.' },
        { domain:'AU', q:'Three help desk technicians share a single "helpdesk_admin" account. Which practice is violated?', opts:['AU.L2-3.3.1 System Auditing','AU.L2-3.3.2 User Accountability','AU.L2-3.3.3 Event Review','AU.L2-3.3.9 Audit Management Protection'], correct:1, explain:'AU.L2-3.3.2 requires individual user actions be uniquely traceable. Shared accounts make it impossible to attribute specific actions to specific people, destroying accountability.' },

        // ═══ CONFIGURATION MANAGEMENT (CM) — 3 questions ═══
        { domain:'CM', q:'CM.L2-3.4.1 requires "baseline configurations." What does a proper baseline include?', opts:['Only the operating system version','Hardware, software, firmware, and documentation inventories throughout the SDLC','A list of all user accounts','Network topology diagrams only'], correct:1, explain:'A baseline configuration is a documented, agreed-upon set of specifications covering hardware, software, firmware, and their documentation. It serves as the reference point for all change control activities.' },
        { domain:'CM', q:'An employee installs an unapproved VPN application on their work laptop. Which CM practice addresses this?', opts:['CM.L2-3.4.1 System Baselining','CM.L2-3.4.8 Application Execution Policy','CM.L2-3.4.9 User-Installed Software Control','CM.L2-3.4.6 Least Functionality'], correct:2, explain:'CM.L2-3.4.9 requires organizations to control and monitor user-installed software. Standard users should not be able to install unauthorized applications, and any installations should trigger monitoring alerts.' },
        { domain:'CM', q:'What is the difference between "deny-by-exception" (blacklisting) and "deny-all, permit-by-exception" (whitelisting)?', opts:['Blacklisting allows all software except those explicitly blocked; whitelisting blocks all software except those explicitly allowed','They are the same concept with different names','Blacklisting is for networks; whitelisting is for applications','Blacklisting is stronger than whitelisting'], correct:0, explain:'CM.L2-3.4.8 allows either approach. Blacklisting permits everything except blocked items. Whitelisting blocks everything except approved items. Whitelisting is generally considered more secure as it follows a default-deny model.' },

        // ═══ IDENTIFICATION & AUTHENTICATION (IA) — 3 questions ═══
        { domain:'IA', q:'Which IA practice mandates multifactor authentication for both local and network access to privileged accounts?', opts:['IA.L1-3.5.1 Identification','IA.L2-3.5.3 Multifactor Authentication','IA.L2-3.5.7 Password Complexity','IA.L2-3.5.10 Cryptographic Passwords'], correct:1, explain:'IA.L2-3.5.3 mandates MFA for privileged accounts (local and network) and for network access to non-privileged accounts. This is one of the most impactful CMMC requirements for preventing credential-based attacks.' },
        { domain:'IA', q:'What does IA.L2-3.5.10 require regarding password storage and transmission?', opts:['Passwords must be at least 16 characters','Passwords must be changed every 30 days','Passwords must be stored and transmitted only in cryptographically protected form','Passwords must include special characters, numbers, and uppercase letters'], correct:2, explain:'IA.L2-3.5.10 requires passwords are only stored using cryptographic hashing and transmitted using encryption. Plaintext password storage or transmission is never acceptable.' },
        { domain:'IA', q:'What is a "replay-resistant authentication mechanism" as required by IA.L2-3.5.4?', opts:['A mechanism that locks accounts after failed attempts','A mechanism that prevents captured authentication data from being reused by an attacker','A mechanism that records all authentication attempts for review','A mechanism that requires answering security questions'], correct:1, explain:'Replay-resistant authentication prevents attackers from capturing and reusing valid tokens. Examples include challenge-response protocols, TOTP, and TLS mutual authentication. Without replay resistance, a captured token could be replayed to gain unauthorized access.' },

        // ═══ INCIDENT RESPONSE (IR) — 3 questions ═══
        { domain:'IR', q:'IR.L2-3.6.1 requires an "operational incident-handling capability." Which phases must it include?', opts:['Detection, response, recovery','Preparation, detection, analysis, containment, recovery, and user response','Identify, protect, detect, respond, recover','Planning, monitoring, alerting, remediation'], correct:1, explain:'The NIST incident response lifecycle requires all six phases: preparation, detection, analysis, containment, recovery, and user response activities. Skipping preparation or user response leaves critical gaps.' },
        { domain:'IR', q:'Under DFARS 252.204-7012, within how many hours must cyber incidents involving CUI be reported to the DoD?', opts:['24 hours','48 hours','72 hours','7 business days'], correct:2, explain:'DFARS 7012 requires reporting cyber incidents to the DoD within 72 hours via the DIBNet portal. This is a contractual requirement separate from CMMC, but IR practices support this capability.' },
        { domain:'IR', q:'After a ransomware incident, your team discovers the attack exploited an unpatched VPN. Which combination of domains failed?', opts:['Only IR (Incident Response)','CM (Configuration Management) and RA (Risk Assessment) in prevention; IR in response','Only SC (System Communications)','Only SI (System Integrity)'], correct:1, explain:'CM failed in patch management and change control. RA failed in vulnerability scanning and remediation prioritization. IR addresses the response. Multiple domain failures typically converge in serious incidents.' },

        // ═══ MAINTENANCE (MA) — 3 questions ═══
        { domain:'MA', q:'Before sending a server for off-site repair, what does MA.L2-3.7.3 require?', opts:['GPS tracking during transport','Sanitize all CUI from the equipment before removal','Replace it with new hardware','Encrypt the hard drive only'], correct:1, explain:'Before any equipment leaves a controlled area for maintenance, all CUI must be sanitized. This prevents exposure of sensitive data to unauthorized maintenance personnel who may not have appropriate clearances.' },
        { domain:'MA', q:'MA.L2-3.7.5 requires multifactor authentication for "nonlocal maintenance sessions." Why?', opts:['To speed up the maintenance process','Remote maintenance sessions are high-value targets with elevated privileges','To reduce maintenance personnel costs','To comply with HIPAA regulations'], correct:1, explain:'Remote maintenance sessions often require elevated privileges. An attacker hijacking such a session could gain administrative access to critical systems. MFA significantly reduces this risk.' },
        { domain:'MA', q:'A vendor connects to your network remotely to troubleshoot a firewall issue. Which MA practice governs this?', opts:['MA.L2-3.7.1 System Maintenance','MA.L2-3.7.2 Maintenance Controls','MA.L2-3.7.4 Media Inspection','MA.L2-3.7.5 Nonlocal Maintenance MFA'], correct:1, explain:'MA.L2-3.7.2 requires controls on maintenance tools and activities, including vendor remote access. This includes supervising, logging, and controlling all nonlocal maintenance and diagnostic activities.' },

        // ═══ MEDIA PROTECTION (MP) — 3 questions ═══
        { domain:'MP', q:'An unidentified USB drive is found in the parking lot. An employee plugs it into their workstation. Which MP practice was violated?', opts:['MP.L2-3.8.1 Media Protection','MP.L2-3.8.7 Removable Media','MP.L2-3.8.8 Shared Media (No Identifiable Owner)','MP.L1-3.8.3 Media Disposal'], correct:2, explain:'MP.L2-3.8.8 prohibits using portable storage devices with no identifiable owner. "USB drop" attacks are a classic social engineering technique used to deliver malware onto target networks.' },
        { domain:'MP', q:'Before disposing of a hard drive that contained FCI, what must occur?', opts:['No special requirements for FCI','Media must be sanitized or destroyed before disposal','Media must be stored for 7 years','Media must be returned to the government'], correct:1, explain:'MP.L1-3.8.3 requires sanitization or destruction of media containing FCI before disposal or reuse. This is a Level 1 (foundational) practice -- one of the 17 basic requirements.' },
        { domain:'MP', q:'CUI documents are stored on an external hard drive for transport. What protection is required?', opts:['Physical lock on the carrying case is sufficient','FIPS-validated encryption of the CUI on the portable media','Password-protecting the drive folder is sufficient','CUI cannot be transported on portable media under any circumstances'], correct:1, explain:'MP.L2-3.8.6 requires cryptographic protection (FIPS-validated) for CUI stored on digital media during transport. A folder password alone does not meet the FIPS-validated encryption requirement.' },

        // ═══ PHYSICAL PROTECTION (PE) — 2 questions ═══
        { domain:'PE', q:'PE.L1-3.10.3 is a Level 1 practice. What does it require?', opts:['Security cameras in all rooms','Escort visitors and monitor visitor activity','Biometric access controls on server rooms','24/7 guard staff at all entrances'], correct:1, explain:'Escorting and monitoring visitors is foundational (Level 1). Visitors must be accompanied in areas where FCI or CUI is accessible, and their activities must be monitored and logged.' },
        { domain:'PE', q:'With widespread remote work, PE.L2-3.10.6 requires safeguards at "alternative work sites." What does this include?', opts:['Alternative work sites are prohibited entirely','Physical security, network security, and proper CUI handling at home offices','Employees must return to the office within 30 days','Only government employees may telework with CUI'], correct:1, explain:'PE.L2-3.10.6 ensures CUI protections extend to telework locations. This includes securing the physical workspace, using encrypted connections, and following proper handling procedures -- the same principles applied at the office.' },

        // ═══ PERSONNEL SECURITY (PS) — 2 questions ═══
        { domain:'PS', q:'How many practices does the Personnel Security domain contain in CMMC 2.0?', opts:['2','4','6','9'], correct:0, explain:'PS is the smallest CMMC domain with only 2 practices: Screen Individuals (PS.L2-3.9.1) and Personnel Actions (PS.L2-3.9.2). Despite its small size, these practices are critical for insider threat prevention.' },
        { domain:'PS', q:'An employee with CUI access is terminated. PS.L2-3.9.2 requires protecting CUI during "personnel actions." What must occur?', opts:['Only revoke building access badge','Disable accounts, retrieve equipment, revoke all access, ensure CUI is not retained','Send a notification email to the team','File a police report within 72 hours'], correct:1, explain:'Comprehensive offboarding must include: disable all accounts, collect devices, revoke access to all systems, recover CUI materials, and update access control lists. This applies to terminations, transfers, and reassignments.' },

        // ═══ RISK ASSESSMENT (RA) — 3 questions ═══
        { domain:'RA', q:'RA.L2-3.11.2 requires vulnerability scanning. How often must scans be performed?', opts:['Only when a breach occurs','Periodically AND when new vulnerabilities affecting your systems are identified','Once per year during the annual assessment','Monthly on the first business day'], correct:1, explain:'Vulnerability scanning must be both periodic (regular schedule) AND reactive (when new CVEs are announced for your software). A yearly-only scan leaves 364 days of potential exposure.' },
        { domain:'RA', q:'RA.L2-3.11.3 says vulnerabilities must be "remediated in accordance with risk assessments." What does this mean?', opts:['All vulnerabilities must be patched within 24 hours','Prioritize remediation based on the risk each vulnerability poses to the organization','Only critical vulnerabilities need remediation','Document vulnerabilities but do not fix them'], correct:1, explain:'Risk-based remediation means prioritizing by exploitability, impact, and asset criticality. A critical RCE on an internet-facing CUI system takes priority over a low-severity finding on an isolated test box.' },
        { domain:'RA', q:'Your organization identifies a zero-day vulnerability in a CUI-processing application. A patch is not yet available. What does CMMC expect?', opts:['Wait for the vendor patch -- nothing else can be done','Implement compensating controls (e.g., network segmentation, additional monitoring) to mitigate the risk until a patch is available','Immediately shut down all systems using the application','Report the vulnerability to the DoD but take no other action'], correct:1, explain:'RA.L2-3.11.3 requires vulnerability remediation, but this includes compensating controls when patches are unavailable. Segmentation, enhanced monitoring, access restrictions, and disabling vulnerable features are all valid interim measures.' },

        // ═══ SECURITY ASSESSMENT (CA) — 3 questions ═══
        { domain:'CA', q:'What is the primary purpose of a System Security Plan (SSP) under CA.L2-3.12.4?', opts:['List all employees with security clearances','Describe system boundaries, how security requirements are implemented, and system interconnections','Document the cybersecurity budget','Record all past security incidents'], correct:1, explain:'The SSP is the master document for CMMC assessments. It describes the CUI environment scope, implementation details for all 110 practices, and interconnections. Assessors use it as their primary reference.' },
        { domain:'CA', q:'CA.L2-3.12.1 requires organizations to "periodically assess security controls." Why is periodic assessment important?', opts:['To generate compliance reports for management','Controls degrade over time due to changes, updates, and new threats -- periodic assessment catches drift','To track employee certifications','To meet insurance requirements'], correct:1, explain:'Security controls can become less effective due to configuration changes, software updates, personnel turnover, environment changes, or new threats. Periodic assessment identifies this "security drift" before it creates exploitable gaps.' },
        { domain:'CA', q:'CA.L2-3.12.2 requires a "plan of action" to correct deficiencies. What is a POA&M?', opts:['A disaster recovery procedure','A document tracking known security gaps, planned corrective actions, and milestones for closing them','A list of approved vendors','An incident response runbook'], correct:1, explain:'A Plan of Action & Milestones documents known gaps and tracks remediation. Under CMMC 2.0, limited POA&Ms are allowed for Level 2, but items must close within 180 days and certain critical practices cannot be deferred.' },

        // ═══ SYSTEM & COMMUNICATIONS PROTECTION (SC) — 3 questions ═══
        { domain:'SC', q:'SC.L2-3.13.11 requires "FIPS-validated cryptography" for CUI. What does FIPS-validated mean?', opts:['The algorithm was invented by NIST','The cryptographic module was tested and validated by an accredited lab under FIPS 140','The encryption uses at least 256-bit keys','The cryptography is approved by the DoD CIO'], correct:1, explain:'FIPS 140 (currently FIPS 140-3) validates cryptographic modules through accredited lab testing. Using AES-256 alone is insufficient -- the specific implementation module must be FIPS-validated.' },
        { domain:'SC', q:'What is "split tunneling" and why does SC.L2-3.13.7 prohibit it for remote access?', opts:['Splitting network cables for redundancy','Allowing a VPN-connected device to route some traffic directly to the internet, bypassing security controls','Dividing encryption keys between two parties','Running parallel firewalls for failover'], correct:1, explain:'Split tunneling lets a remote VPN user route some traffic outside the tunnel directly to the internet. An attacker could exploit the unprotected internet path to reach the device, then pivot through the VPN into the CUI network.' },
        { domain:'SC', q:'A contractor sends CUI via email without encryption. Which SC practice is violated?', opts:['SC.L2-3.13.1 Boundary Protection','SC.L2-3.13.8 CUI Transmission Confidentiality','SC.L2-3.13.7 Split Tunneling','SC.L1-3.13.5 Public-Access System Separation'], correct:1, explain:'SC.L2-3.13.8 requires cryptographic mechanisms to protect CUI during transmission. Email containing CUI must use encryption (such as S/MIME, TLS, or encrypted attachment) to protect confidentiality in transit.' },

        // ═══ SYSTEM & INFORMATION INTEGRITY (SI) — 3 questions ═══
        { domain:'SI', q:'SI.L1-3.14.2 requires "malicious code protection at appropriate locations." Why is this a Level 1 (foundational) practice?', opts:['It is the most expensive to implement','Anti-malware is the most basic protection against common threats like viruses, ransomware, and trojans','It was the first practice written for CMMC','It only applies to government-owned systems'], correct:1, explain:'Malware remains the most common attack vector. Every system handling FCI or CUI needs anti-malware at key locations: endpoints, email gateways, and web proxies. This foundational control addresses the broadest category of threats.' },
        { domain:'SI', q:'SI.L2-3.14.6 requires monitoring both inbound AND outbound traffic. Why must outbound traffic be monitored?', opts:['To track employee internet usage patterns','To detect data exfiltration, C2 beaconing, and compromised systems calling home','To optimize network bandwidth usage','Outbound monitoring is optional under CMMC'], correct:1, explain:'Monitoring only inbound traffic misses critical threats. Outbound monitoring detects stolen data (exfiltration), malware calling home (command-and-control), and compromised systems beaconing to attacker infrastructure.' },
        { domain:'SI', q:'A critical security patch for your web server was released 45 days ago but has not been applied. Which SI practice is being neglected?', opts:['SI.L2-3.14.1 Flaw Identification & Remediation','SI.L2-3.14.3 Security Alerts & Advisories','SI.L2-3.14.6 Communications Monitoring','SI.L1-3.14.4 Update Malicious Code Protection'], correct:0, explain:'SI.L2-3.14.1 requires identifying, reporting, and correcting system flaws in a timely manner. A 45-day delay on a critical patch for an internet-facing system represents a significant risk that should have been prioritized.' }
    ];

    // ─── State management ───
    function getState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    let currentQ = 0;
    let answers = {};   // { qIndex: selectedOptIndex }
    let flagged = {};   // { qIndex: true }
    let timerMode = false;
    let timerSeconds = 0;
    let timerInterval = null;
    let quizActive = false;
    let reviewMode = false;
    let reviewFilter = 'all'; // all, wrong, flagged

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }

    let questionOrder = [];

    // ─── Setup screen ───
    function renderSetup() {
        const state = getState();
        const prevScore = state.lastScore;
        const prevDate = state.lastDate;

        document.getElementById('app').innerHTML = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>
            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udcdd</span>
                    <span class="header-title">CMMC Comprehensive Assessment</span>
                    <span class="header-badge">40 QUESTIONS</span>
                </div>
                <p class="header-desc">Test your knowledge across all 14 CMMC 2.0 domains. Scenario-based questions covering Access Control, Audit & Accountability, Identification & Authentication, and more.</p>
            </div>
            <div class="setup">
                <h2>Ready to Begin?</h2>
                <p>This assessment covers all 14 domains of the CMMC 2.0 framework with practical, scenario-based questions. Questions are randomized each attempt.</p>
                <div class="setup-stats">
                    <div class="stat"><div class="stat-num">40</div><div class="stat-label">Questions</div></div>
                    <div class="stat"><div class="stat-num">14</div><div class="stat-label">Domains</div></div>
                    <div class="stat"><div class="stat-num">70%</div><div class="stat-label">Passing</div></div>
                </div>
                <p style="font-size:.85rem;color:var(--text-dim);margin-bottom:.75rem">Choose your mode:</p>
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="untimed">Untimed</button>
                    <button class="mode-btn" data-mode="timed">Timed (45 min)</button>
                </div>
                <button class="start-btn" id="startBtn">Begin Assessment</button>
                ${prevScore !== undefined ? `<div class="prev-score">Previous score: <strong>${prevScore}%</strong>${prevDate ? ' on ' + new Date(prevDate).toLocaleDateString() : ''}</div>` : ''}
            </div>
        `;

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                timerMode = btn.dataset.mode === 'timed';
            });
        });

        document.getElementById('startBtn').addEventListener('click', startQuiz);
    }

    // ─── Start quiz ───
    function startQuiz() {
        questionOrder = shuffle(Array.from({ length: QUESTIONS.length }, (_, i) => i));
        answers = {};
        flagged = {};
        currentQ = 0;
        quizActive = true;
        reviewMode = false;
        timerSeconds = TIMER_TOTAL;

        if (timerMode) {
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        renderQuestion();
    }

    function updateTimerDisplay() {
        const fill = document.querySelector('.timer-fill');
        const text = document.querySelector('.timer-text');
        if (!fill || !text) return;
        const pct = (timerSeconds / TIMER_TOTAL) * 100;
        fill.style.width = pct + '%';
        fill.className = 'timer-fill ' + (pct > 50 ? 'green' : pct > 20 ? 'yellow' : 'red');
        const m = Math.floor(timerSeconds / 60);
        const s = timerSeconds % 60;
        text.textContent = m + ':' + String(s).padStart(2, '0');
    }

    // ─── Render current question ───
    function renderQuestion() {
        const qi = questionOrder[currentQ];
        const q = QUESTIONS[qi];
        const totalQ = QUESTIONS.length;
        const answeredCount = Object.keys(answers).length;
        const pct = Math.round(answeredCount / totalQ * 100);
        const hasAnswer = answers[qi] !== undefined;

        let html = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>
            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udcdd</span>
                    <span class="header-title">CMMC Comprehensive Assessment</span>
                    <span class="header-badge">${timerMode ? 'TIMED' : 'UNTIMED'}</span>
                </div>
            </div>
        `;

        // Timer
        if (timerMode) {
            const tPct = (timerSeconds / TIMER_TOTAL) * 100;
            const cls = tPct > 50 ? 'green' : tPct > 20 ? 'yellow' : 'red';
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            html += `<div class="timer-wrap"><div class="timer-bar"><div class="timer-fill ${cls}" style="width:${tPct}%"></div></div><div class="timer-text">${m}:${String(s).padStart(2, '0')}</div></div>`;
        }

        // Progress
        html += `<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-label">${answeredCount} / ${totalQ}</div></div>`;

        // Question map
        html += '<div class="q-map">';
        for (let i = 0; i < totalQ; i++) {
            const idx = questionOrder[i];
            let cls = 'q-dot';
            if (i === currentQ) cls += ' current';
            if (answers[idx] !== undefined) cls += ' answered';
            if (flagged[idx]) cls += ' flagged';
            html += `<div class="${cls}" data-nav="${i}">${i + 1}</div>`;
        }
        html += '</div>';

        // Question
        html += `<div class="q-card">
            <div class="q-num">Question ${currentQ + 1} of ${totalQ}</div>
            <span class="domain-badge">${q.domain} -- ${DOMAINS[q.domain]}</span>
            <div class="q-text">${q.q}</div>
            ${q.opts.map((opt, oi) => {
                let cls = 'q-opt';
                if (hasAnswer) {
                    cls += ' locked';
                    if (oi === q.correct) cls += ' correct';
                    else if (oi === answers[qi] && oi !== q.correct) cls += ' wrong';
                    if (oi === q.correct && answers[qi] !== q.correct) cls += ' reveal';
                } else if (answers[qi] === oi) {
                    cls += ' selected';
                }
                return `<button class="${cls}" data-oi="${oi}" ${hasAnswer ? 'disabled' : ''}>${opt}</button>`;
            }).join('')}
            <div class="q-explain${hasAnswer ? ' show' : ''}">${q.explain}</div>
        </div>`;

        // Nav
        html += `<div class="nav-row">
            <button class="nav-btn" id="prevBtn" ${currentQ === 0 ? 'disabled' : ''}>\u2039 Previous</button>
            <button class="flag-btn${flagged[qi] ? ' flagged' : ''}" id="flagBtn">\u2691 ${flagged[qi] ? 'Flagged' : 'Flag for Review'}</button>
            ${answeredCount === totalQ ? '<button class="nav-btn primary" id="finishBtn">Finish Assessment</button>' :
            currentQ < totalQ - 1 ? '<button class="nav-btn primary" id="nextBtn">Next \u203a</button>' :
            '<button class="nav-btn" id="nextBtn" disabled>Last Question</button>'}
        </div>`;

        document.getElementById('app').innerHTML = html;

        // Bind answer clicks
        if (!hasAnswer) {
            document.querySelectorAll('.q-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    const oi = parseInt(btn.dataset.oi);
                    answers[qi] = oi;
                    renderQuestion();
                });
            });
        }

        // Bind nav
        document.getElementById('prevBtn')?.addEventListener('click', () => { currentQ--; renderQuestion(); });
        document.getElementById('nextBtn')?.addEventListener('click', () => { currentQ++; renderQuestion(); });
        document.getElementById('finishBtn')?.addEventListener('click', finishQuiz);
        document.getElementById('flagBtn')?.addEventListener('click', () => { flagged[qi] = !flagged[qi]; renderQuestion(); });

        // Question map nav
        document.querySelectorAll('.q-dot').forEach(dot => {
            dot.addEventListener('click', () => { currentQ = parseInt(dot.dataset.nav); renderQuestion(); });
        });
    }

    // ─── Finish quiz ───
    function finishQuiz() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        quizActive = false;

        // Calculate results
        const totalQ = QUESTIONS.length;
        let correctCount = 0;
        const domainStats = {};
        Object.keys(DOMAINS).forEach(d => { domainStats[d] = { total: 0, correct: 0 }; });

        QUESTIONS.forEach((q, i) => {
            domainStats[q.domain].total++;
            if (answers[i] === q.correct) {
                correctCount++;
                domainStats[q.domain].correct++;
            }
        });

        const pct = Math.round(correctCount / totalQ * 100);
        const passed = pct >= 70;

        // Save
        const state = getState();
        state.lastScore = pct;
        state.lastDate = Date.now();
        state.lastCorrect = correctCount;
        state.lastTotal = totalQ;
        state.attempts = (state.attempts || 0) + 1;
        if (!state.bestScore || pct > state.bestScore) state.bestScore = pct;
        saveState(state);

        // GameTracker
        if (typeof GameTracker !== 'undefined') {
            try {
                GameTracker.record({
                    game: 'cmmc-comprehensive-quiz',
                    score: pct,
                    maxScore: 100,
                    details: { correct: correctCount, total: totalQ, passed, timed: timerMode, domainStats }
                });
            } catch(e) {}
        }

        renderResults(correctCount, totalQ, pct, passed, domainStats);
    }

    // ─── Results screen ───
    function renderResults(correctCount, totalQ, pct, passed, domainStats) {
        let html = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>
            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udcdd</span>
                    <span class="header-title">CMMC Comprehensive Assessment</span>
                    <span class="header-badge">RESULTS</span>
                </div>
            </div>

            <div class="results">
                <div class="results-score">${pct}%</div>
                <div class="results-label">${correctCount} of ${totalQ} correct</div>
                <div class="results-verdict ${passed ? 'pass' : 'fail'}">${passed ? 'PASSED -- Well Done!' : 'Not Passed -- 70% Required'}</div>
                <div class="results-bar"><div class="results-fill" style="width:${pct}%;background:${passed ? 'var(--green)' : 'var(--red)'}"></div></div>
                <div class="results-meta">${timerMode ? 'Timed mode' : 'Untimed mode'} | ${getState().attempts || 1} attempt(s) | Best: ${getState().bestScore || pct}%</div>

                <div class="breakdown">
                    <h4>Score by Domain</h4>
                    <table class="bd-table">
                        <thead><tr><th scope="col">Domain</th><th scope="col">Score</th><th scope="col">Result</th><th scope="col">Progress</th></tr></thead>
                        <tbody>
                            ${Object.entries(domainStats).filter(([,d]) => d.total > 0).map(([code, d]) => {
                                const dp = d.total > 0 ? Math.round(d.correct / d.total * 100) : 0;
                                const dpass = dp >= 70;
                                return `<tr>
                                    <td>${code} -- ${DOMAINS[code]}</td>
                                    <td>${d.correct}/${d.total} (${dp}%)</td>
                                    <td class="${dpass ? 'pass' : 'fail'}">${dpass ? 'PASS' : 'REVIEW'}</td>
                                    <td><div class="bd-bar"><div class="bd-bar-fill ${dpass ? 'pass' : 'fail'}" style="width:${dp}%"></div></div></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="results-actions">
                    <button class="nav-btn" id="reviewBtn">\ud83d\udd0d Review Answers</button>
                    <button class="nav-btn primary" id="retakeBtn">Retake Assessment</button>
                </div>
            </div>
        `;

        document.getElementById('app').innerHTML = html;

        document.getElementById('reviewBtn').addEventListener('click', () => { reviewMode = true; reviewFilter = 'all'; renderReview(domainStats); });
        document.getElementById('retakeBtn').addEventListener('click', renderSetup);
    }

    // ─── Review screen ───
    function renderReview(domainStats) {
        const totalQ = QUESTIONS.length;
        const wrongIndices = [];
        const flaggedIndices = [];
        QUESTIONS.forEach((q, i) => {
            if (answers[i] !== q.correct) wrongIndices.push(i);
            if (flagged[i]) flaggedIndices.push(i);
        });

        let visibleIndices;
        if (reviewFilter === 'wrong') visibleIndices = wrongIndices;
        else if (reviewFilter === 'flagged') visibleIndices = flaggedIndices;
        else visibleIndices = Array.from({ length: totalQ }, (_, i) => i);

        let html = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>
            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udcdd</span>
                    <span class="header-title">CMMC Comprehensive Assessment</span>
                    <span class="header-badge">REVIEW</span>
                </div>
            </div>

            <div class="review-filter">
                <button class="rf-btn${reviewFilter === 'all' ? ' active' : ''}" data-filter="all">All (${totalQ})</button>
                <button class="rf-btn${reviewFilter === 'wrong' ? ' active' : ''}" data-filter="wrong">Wrong (${wrongIndices.length})</button>
                <button class="rf-btn${reviewFilter === 'flagged' ? ' active' : ''}" data-filter="flagged">Flagged (${flaggedIndices.length})</button>
            </div>

            <div class="q-map">
                ${Array.from({ length: totalQ }, (_, i) => {
                    const correct = answers[i] === QUESTIONS[i].correct;
                    return `<div class="q-dot ${correct ? 'correct-dot' : 'wrong-dot'}${flagged[i] ? ' flagged' : ''}" data-review="${i}">${i + 1}</div>`;
                }).join('')}
            </div>
        `;

        visibleIndices.forEach(qi => {
            const q = QUESTIONS[qi];
            const selected = answers[qi];
            const isCorrect = selected === q.correct;

            html += `<div class="q-card" id="review-q-${qi}">
                <div class="q-num">Question ${qi + 1}</div>
                <span class="domain-badge">${q.domain} -- ${DOMAINS[q.domain]}</span>
                ${flagged[qi] ? '<span class="domain-badge" style="background:rgba(234,179,8,.1);color:var(--yellow);border-color:rgba(234,179,8,.3);margin-left:.35rem">\u2691 Flagged</span>' : ''}
                <div class="q-text">${q.q}</div>
                ${q.opts.map((opt, oi) => {
                    let cls = 'q-opt locked';
                    if (oi === q.correct) cls += ' correct';
                    else if (oi === selected && oi !== q.correct) cls += ' wrong';
                    if (oi === q.correct && selected !== q.correct) cls += ' reveal';
                    return `<button class="${cls}" disabled>${opt}</button>`;
                }).join('')}
                <div class="q-explain show">${q.explain}</div>
            </div>`;
        });

        html += `<div class="nav-row">
            <button class="nav-btn primary" id="backToResults">\u2039 Back to Results</button>
            <button class="nav-btn" id="retakeBtn2">Retake Assessment</button>
        </div>`;

        document.getElementById('app').innerHTML = html;

        // Bind filter
        document.querySelectorAll('.rf-btn').forEach(btn => {
            btn.addEventListener('click', () => { reviewFilter = btn.dataset.filter; renderReview(domainStats); });
        });

        // Bind nav dots to scroll
        document.querySelectorAll('.q-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const target = document.getElementById('review-q-' + dot.dataset.review);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });

        document.getElementById('backToResults')?.addEventListener('click', () => {
            const totalQ = QUESTIONS.length;
            let correctCount = 0;
            QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) correctCount++; });
            const pct = Math.round(correctCount / totalQ * 100);
            renderResults(correctCount, totalQ, pct, pct >= 70, domainStats);
        });
        document.getElementById('retakeBtn2')?.addEventListener('click', renderSetup);
    }

    // ─── Initialize ───
    renderSetup();
})();
</script>
<script src="../../../../../components/GameTracker.js"></script>
<script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
