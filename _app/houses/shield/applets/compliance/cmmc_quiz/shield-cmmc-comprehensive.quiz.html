<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMC Comprehensive Quiz | Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <link rel="stylesheet" href="../../../../../styles/quiz-engine.css">
    <style>
        :root {
            --shield: #a855f7;
            --shield-dim: #a855f733;
            --shield-glow: rgba(168,85,247,0.15);
            --bg: #0a0a0f;
            --card: #111118;
            --card-border: #1e1e2a;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }

        .page-header { padding:15px 30px; background:rgba(0,0,0,.4); border-bottom:1px solid rgba(168,85,247,.2); display:flex; justify-content:space-between; align-items:center; }
        .page-header a { color:#a78bfa; text-decoration:none; font-size:.9rem; transition:color .2s; }
        .page-header a:hover { color:#c4b5fd; }
        .brand { font-weight:600; color:#e0e0e0; display:flex; align-items:center; gap:8px; }

        .quiz-wrapper { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:30px 20px; }
        #quiz-container { width:100%; max-width:850px; }

        /* Domain breakdown table for results */
        .domain-breakdown { margin:1.5rem 0; background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:10px; overflow:hidden; }
        .domain-breakdown h4 { padding:1rem 1.25rem .5rem; color:var(--shield); font-size:.85rem; text-transform:uppercase; letter-spacing:.5px; }
        .db-table { width:100%; border-collapse:collapse; font-size:.82rem; }
        .db-table th { background:rgba(168,85,247,.08); color:var(--shield); padding:.5rem .75rem; text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
        .db-table td { padding:.5rem .75rem; border-bottom:1px solid rgba(255,255,255,.03); color:var(--text-dim); }
        .db-table td:first-child { color:var(--text); font-weight:500; }
        .db-table .pass { color:var(--green); }
        .db-table .fail { color:var(--red); }
        .db-bar { height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; min-width:80px; }
        .db-bar-fill { height:100%; border-radius:3px; transition:width .5s ease; }
        .db-bar-fill.pass { background:var(--green); }
        .db-bar-fill.fail { background:var(--red); }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to Shield House</a>
        <span class="brand">Hexworth Prime</span>
    </header>

    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>

    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script src="../../../../../components/GameTracker.js"></script>

    <script>
    (function() {
        // 35 questions: 2-3 per domain + 5 cross-domain
        const questions = [
            // === ACCESS CONTROL (AC) - 3 questions ===
            {
                question: 'In CMMC, the Access Control (AC) domain requires organizations to "limit information system access to authorized users." Which NIST SP 800-171 requirement family does this align with?',
                options: ['3.1.x - Access Control', '3.5.x - Identification and Authentication', '3.13.x - System and Communications Protection', '3.4.x - Configuration Management'],explanation: 'The AC domain maps directly to NIST SP 800-171 Section 3.1, which covers access control requirements including authorized access, least privilege, and remote access management.',
                domain: 'AC'
            },
            {
                question: 'Which access control practice requires organizations to "separate the duties of individuals to reduce the risk of malevolent activity without collusion"?',
                options: ['AC.L2-3.1.1 Authorized Access Control', 'AC.L2-3.1.4 Separation of Duties', 'AC.L2-3.1.5 Least Privilege', 'AC.L2-3.1.7 Privileged Functions'],explanation: 'AC.L2-3.1.4 addresses Separation of Duties -- ensuring no single individual has complete control over a critical process, reducing insider threat risk.',
                domain: 'AC'
            },
            {
                question: 'What does the principle of "least privilege" require in the context of CMMC Access Control?',
                options: ['All users must have the same access level', 'Users receive only the minimum access needed to perform their duties', 'Privileged accounts must be disabled after 30 days', 'Access must be reviewed quarterly by management'],explanation: 'Least privilege (AC.L2-3.1.5) means granting users only the access permissions necessary for their role. This limits the blast radius of compromised accounts.',
                domain: 'AC'
            },

            // === AWARENESS & TRAINING (AT) - 2 questions ===
            {
                question: 'The Awareness and Training (AT) domain requires "security awareness training on recognizing and reporting potential indicators of insider threat." This practice is designated as:',
                options: ['AT.L2-3.2.1 Role-Based Risk Awareness', 'AT.L2-3.2.2 Role-Based Training', 'AT.L2-3.2.3 Insider Threat Awareness', 'AT.L1-3.2.4 General Security Awareness'],explanation: 'AT.L2-3.2.3 specifically addresses insider threat awareness training, requiring personnel to recognize behavioral indicators and know how to report suspicious activity.',
                domain: 'AT'
            },
            {
                question: 'How many practices does the Awareness and Training (AT) domain contain in CMMC 2.0?',
                options: ['2', '3', '5', '9'],explanation: 'The AT domain has 3 practices: Role-Based Risk Awareness (3.2.1), Role-Based Training (3.2.2), and Insider Threat Awareness (3.2.3). It is one of the smaller CMMC domains.',
                domain: 'AT'
            },

            // === AUDIT & ACCOUNTABILITY (AU) - 3 questions ===
            {
                question: 'Which AU practice requires organizations to "provide a system capability that compares and synchronizes internal system clocks with an authoritative source"?',
                options: ['AU.L2-3.3.5 Audit Correlation', 'AU.L2-3.3.7 Authoritative Time Source', 'AU.L2-3.3.1 System Auditing', 'AU.L2-3.3.8 Audit Protection'],explanation: 'AU.L2-3.3.7 requires time synchronization with an authoritative source (like NTP servers) so that audit timestamps are accurate and correlated across systems.',
                domain: 'AU'
            },
            {
                question: 'What is the primary purpose of "audit correlation" (AU.L2-3.3.5)?',
                options: ['To delete old audit logs automatically', 'To correlate audit review, analysis, and reporting for investigation of suspicious activity', 'To synchronize audit logs across time zones', 'To encrypt audit records in transit'],explanation: 'Audit correlation involves linking audit records from multiple sources to detect patterns, support investigations, and identify indicators of compromise across the enterprise.',
                domain: 'AU'
            },
            {
                question: 'Why must audit logging functionality be limited to "a subset of privileged users" (AU.L2-3.3.8)?',
                options: ['To reduce storage costs', 'To prevent attackers from modifying or deleting evidence of their activity', 'To comply with privacy regulations', 'To simplify the audit review process'],explanation: 'If an attacker gains access and can modify or delete audit logs, they can cover their tracks. Restricting audit management to privileged users protects forensic evidence.',
                domain: 'AU'
            },

            // === CONFIGURATION MANAGEMENT (CM) - 2 questions ===
            {
                question: 'CM.L2-3.4.1 requires organizations to "establish and maintain baseline configurations." What does a baseline configuration include?',
                options: ['Only the operating system version', 'Hardware, software, firmware, and documentation inventories throughout the system development lifecycle', 'A list of all user accounts', 'Network topology diagrams only'],explanation: 'A baseline configuration is a documented, agreed-upon set of specifications including hardware, software, firmware, and their documentation. It serves as the reference point for change control.',
                domain: 'CM'
            },
            {
                question: 'What does "deny-by-exception" (blacklisting) mean in the context of CM.L2-3.4.8?',
                options: ['Allow all software except those explicitly blocked', 'Block all software except those explicitly allowed', 'Deny access to all users by default', 'Remove all non-essential software from systems'],explanation: 'Deny-by-exception (blacklisting) allows all software to run except items on a blocklist. The alternative, deny-all/permit-by-exception (whitelisting), blocks everything except approved software. Whitelisting is generally more secure.',
                domain: 'CM'
            },

            // === IDENTIFICATION & AUTHENTICATION (IA) - 3 questions ===
            {
                question: 'Which IA practice requires "multifactor authentication for local and network access to privileged accounts"?',
                options: ['IA.L1-3.5.1 Identification', 'IA.L2-3.5.3 Multifactor Authentication', 'IA.L2-3.5.7 Password Complexity', 'IA.L2-3.5.10 Cryptographically-Protected Passwords'],explanation: 'IA.L2-3.5.3 mandates MFA for privileged accounts (both local and network) and for network access to non-privileged accounts. This is one of the most impactful CMMC requirements.',
                domain: 'IA'
            },
            {
                question: 'What does IA.L2-3.5.10 require regarding passwords?',
                options: ['Passwords must be at least 16 characters', 'Passwords must be changed every 30 days', 'Passwords must be stored and transmitted only in cryptographically protected form', 'Passwords must include special characters'],explanation: 'IA.L2-3.5.10 requires that passwords are only stored and transmitted using cryptographic protection (hashing for storage, encryption for transmission). Plaintext passwords are never acceptable.',
                domain: 'IA'
            },
            {
                question: 'What is a "replay-resistant authentication mechanism" as required by IA.L2-3.5.4?',
                options: ['A mechanism that locks out users after failed attempts', 'A mechanism that prevents captured authentication data from being reused by an attacker', 'A mechanism that records all authentication attempts', 'A mechanism that requires two passwords'],explanation: 'Replay-resistant authentication prevents attackers from capturing and replaying valid authentication tokens. Examples include challenge-response protocols, time-based one-time passwords (TOTP), and TLS mutual authentication.',
                domain: 'IA'
            },

            // === INCIDENT RESPONSE (IR) - 2 questions ===
            {
                question: 'The IR domain requires an "operational incident-handling capability." Which phases must this capability include?',
                options: ['Detection, response, recovery', 'Preparation, detection, analysis, containment, recovery, and user response', 'Identification, protection, detection, response, recovery', 'Planning, monitoring, alerting, remediation'],explanation: 'IR.L2-3.6.1 requires all six phases: preparation, detection, analysis, containment, recovery, and user response activities. This aligns with the NIST incident response lifecycle.',
                domain: 'IR'
            },
            {
                question: 'IR.L2-3.6.2 requires organizations to "track, document, and report incidents." To whom must incidents be reported?',
                options: ['Only internal IT management', 'Designated officials and/or authorities both internal and external to the organization', 'Only the Department of Defense', 'Only the affected customers'],explanation: 'Incident reporting must go to designated officials both internally (CISO, management) and externally (DoD via DIBNet, law enforcement, US-CERT). For DFARS 7012, cyber incidents involving CUI must be reported to DoD within 72 hours.',
                domain: 'IR'
            },

            // === MAINTENANCE (MA) - 2 questions ===
            {
                question: 'What does MA.L2-3.7.3 require regarding equipment removed for off-site maintenance?',
                options: ['Equipment must be tracked with GPS', 'Equipment must be sanitized of any CUI before removal', 'Equipment must be replaced with new hardware', 'Equipment must be encrypted during transport'],explanation: 'Before any equipment leaves a controlled area for maintenance, all CUI must be sanitized from it. This prevents exposure of sensitive data to unauthorized maintenance personnel.',
                domain: 'MA'
            },
            {
                question: 'MA.L2-3.7.5 requires "multifactor authentication to establish nonlocal maintenance sessions." Why is this critical?',
                options: ['To speed up the maintenance process', 'Because remote maintenance sessions are high-value targets -- an attacker gaining maintenance access could have elevated privileges', 'To reduce the number of maintenance personnel needed', 'To comply with HIPAA requirements'],explanation: 'Nonlocal (remote) maintenance sessions often require elevated privileges. Requiring MFA reduces the risk of an attacker hijacking these sessions, which could give them administrative access to systems.',
                domain: 'MA'
            },

            // === MEDIA PROTECTION (MP) - 2 questions ===
            {
                question: 'Which MP practice prohibits the use of portable storage devices "when such devices have no identifiable owner"?',
                options: ['MP.L2-3.8.1 Media Protection', 'MP.L2-3.8.7 Removable Media', 'MP.L2-3.8.8 Shared Media', 'MP.L1-3.8.3 Media Disposal'],explanation: 'MP.L2-3.8.8 addresses shared/ownerless media, prohibiting USB drives and other portable storage that cannot be attributed to a specific individual. This prevents "USB drop" attacks.',
                domain: 'MP'
            },
            {
                question: 'What is required for the disposal of media containing Federal Contract Information (FCI)?',
                options: ['No special requirements -- regular disposal is sufficient', 'Media must be sanitized or destroyed before disposal or release for reuse', 'Media must be stored for 7 years before disposal', 'Media must be returned to the government'],explanation: 'MP.L1-3.8.3 requires sanitization or destruction of media containing FCI before disposal or reuse. This is a Level 1 practice, making it one of the 17 foundational requirements.',
                domain: 'MP'
            },

            // === PERSONNEL SECURITY (PS) - 2 questions ===
            {
                question: 'How many practices does the Personnel Security (PS) domain contain?',
                options: ['2', '4', '6', '9'],explanation: 'PS is the smallest CMMC domain with only 2 practices: Screen Individuals (PS.L2-3.9.1) and Personnel Actions (PS.L2-3.9.2). Despite its small size, these practices are critical for insider threat prevention.',
                domain: 'PS'
            },
            {
                question: 'PS.L2-3.9.2 requires protection of CUI "during and after personnel actions such as terminations and transfers." What does this include?',
                options: ['Only revoking building access badges', 'Disabling accounts, retrieving equipment, revoking access, and ensuring CUI is not retained after departure', 'Sending a goodbye email to the team', 'Filing a police report'],explanation: 'Personnel actions must include comprehensive offboarding: disable accounts, collect devices, revoke all access, recover CUI materials, and update access control lists. This applies to terminations, transfers, and reassignments.',
                domain: 'PS'
            },

            // === PHYSICAL PROTECTION (PE) - 2 questions ===
            {
                question: 'PE.L1-3.10.3 is a Level 1 practice requiring organizations to:',
                options: ['Install security cameras', 'Escort visitors and monitor visitor activity', 'Implement biometric access controls', 'Maintain a clean desk policy'],explanation: 'Escorting visitors is a foundational (Level 1) physical security requirement. Visitors must be accompanied in areas where CUI or FCI is accessible, and their activities must be monitored.',
                domain: 'PE'
            },
            {
                question: 'What does PE.L2-3.10.6 require regarding "alternative work sites" (e.g., telework)?',
                options: ['Alternative work sites are prohibited', 'Safeguarding measures for CUI must be enforced at alternative work sites', 'Employees must return to the office within 30 days', 'Only government employees may work remotely'],explanation: 'With the increase in remote work, PE.L2-3.10.6 ensures that CUI protections extend to home offices and other alternative work locations. This includes physical security, network security, and proper handling procedures.',
                domain: 'PE'
            },

            // === RISK ASSESSMENT (RA) - 2 questions ===
            {
                question: 'How often must vulnerability scans be performed according to RA.L2-3.11.2?',
                options: ['Only when a breach occurs', 'Periodically and when new vulnerabilities affecting the systems are identified', 'Once per year during the annual assessment', 'Monthly on the first business day'],explanation: 'RA.L2-3.11.2 requires both periodic scans (on a regular schedule) AND reactive scans when new vulnerabilities are identified (e.g., after a CVE announcement for software you use).',
                domain: 'RA'
            },
            {
                question: 'RA.L2-3.11.3 states that vulnerabilities must be "remediated in accordance with risk assessments." What does this mean?',
                options: ['All vulnerabilities must be patched within 24 hours', 'Remediation priority should be based on the risk each vulnerability poses to the organization', 'Only critical vulnerabilities need to be fixed', 'Vulnerabilities should be documented but not necessarily fixed'],explanation: 'Risk-based remediation means prioritizing patches and fixes based on factors like exploitability, impact, and asset criticality -- not treating all vulnerabilities equally. A critical vulnerability on an internet-facing CUI system is higher priority than a low-severity finding on an isolated test system.',
                domain: 'RA'
            },

            // === SECURITY ASSESSMENT (CA) - 2 questions ===
            {
                question: 'What is the purpose of a System Security Plan (SSP) as required by CA.L2-3.12.4?',
                options: ['To list all employees with security clearances', 'To describe system boundaries, environments of operation, how security requirements are implemented, and connections to other systems', 'To document the budget for cybersecurity', 'To record all past security incidents'],explanation: 'The SSP is the master document for CMMC assessments. It describes the scope of the CUI environment, how each of the 110 practices is implemented, and how the system connects to other systems. Assessors use it as their roadmap.',
                domain: 'CA'
            },
            {
                question: 'CA.L2-3.12.3 requires "monitoring security controls on an ongoing basis." What is the purpose of continuous monitoring?',
                options: ['To generate monthly reports for management', 'To ensure the continued effectiveness of security controls between assessments', 'To track employee productivity', 'To monitor network bandwidth usage'],explanation: 'Continuous monitoring ensures that security controls remain effective over time. Controls can degrade due to configuration changes, software updates, personnel turnover, or new threats. Ongoing monitoring catches these issues before the next formal assessment.',
                domain: 'CA'
            },

            // === SYSTEM & COMMUNICATIONS PROTECTION (SC) - 2 questions ===
            {
                question: 'SC.L2-3.13.11 requires "FIPS-validated cryptography when used to protect the confidentiality of CUI." What does FIPS-validated mean?',
                options: ['The encryption algorithm was invented by NIST', 'The cryptographic module has been tested and validated by an accredited laboratory under FIPS 140', 'The encryption uses at least 256-bit keys', 'The cryptography is approved by the DoD CIO'],explanation: 'FIPS 140 (currently FIPS 140-3) is a federal standard for cryptographic modules. FIPS-validated means the specific module has been tested by an accredited lab and approved. Common examples: AES-256 in a FIPS-validated module, not just any AES implementation.',
                domain: 'SC'
            },
            {
                question: 'What is "split tunneling" and why does SC.L2-3.13.7 prohibit it?',
                options: ['Splitting network cables -- prohibited for physical security', 'Allowing a VPN-connected device to simultaneously access the internet directly, bypassing security controls -- prohibited because it creates an unmonitored path to the CUI network', 'Dividing encryption keys between two parties -- prohibited for key management', 'Running two firewalls in parallel -- prohibited to avoid configuration conflicts'],explanation: 'Split tunneling allows a remote device on VPN to also route traffic directly to the internet. This means an attacker could use the internet path to reach the device, then pivot through the VPN tunnel into the CUI network, bypassing boundary protections.',
                domain: 'SC'
            },

            // === SYSTEM & INFORMATION INTEGRITY (SI) - 2 questions ===
            {
                question: 'SI.L1-3.14.2 requires "malicious code protection at appropriate locations." This is a Level 1 practice. What makes it foundational?',
                options: ['It is the most expensive practice to implement', 'Anti-malware is the single most basic protection against common threats like viruses, ransomware, and trojans', 'It was the first practice ever written for CMMC', 'It only applies to government systems'],explanation: 'Malware protection is foundational because malware remains the most common attack vector. Every system handling FCI or CUI needs anti-malware deployed at key locations (endpoints, email gateways, web proxies).',
                domain: 'SI'
            },
            {
                question: 'SI.L2-3.14.6 requires monitoring "inbound and outbound communications traffic." Why must outbound traffic also be monitored?',
                options: ['To track employee internet usage', 'To detect data exfiltration, command-and-control communications, and compromised systems beaconing out', 'To optimize bandwidth usage', 'Outbound monitoring is optional under CMMC'],explanation: 'Monitoring only inbound traffic misses critical threats. Outbound monitoring detects data being stolen (exfiltration), malware calling home (C2 beaconing), and compromised systems communicating with attacker infrastructure.',
                domain: 'SI'
            },

            // === CROSS-DOMAIN QUESTIONS (5) ===
            {
                question: 'A contractor discovers that an employee has been emailing CUI documents to a personal email account. Which CMMC domains are most directly involved in preventing and responding to this?',
                options: ['Only Access Control (AC)', 'Access Control (AC), Audit & Accountability (AU), and Incident Response (IR)', 'Only Media Protection (MP)', 'Configuration Management (CM) and Maintenance (MA)'],explanation: 'AC controls who can access what (email, CUI repositories). AU provides the audit trail showing the unauthorized activity. IR covers the response procedure. Additionally, AT (training) and PS (personnel actions) may be involved in prevention and consequences.',
                domain: 'CROSS'
            },
            {
                question: 'An organization wants to reduce its CMMC assessment scope. Which strategy is most effective?',
                options: ['Delete all CUI before the assessment', 'Segment CUI into a dedicated enclave with clear boundaries, reducing the number of systems in scope', 'Move all operations to the cloud -- cloud systems are exempt from CMMC', 'Request a waiver from the contracting officer'],explanation: 'Network segmentation (creating a CUI enclave) is the most effective scope reduction strategy. Only systems that process, store, transmit, or protect CUI are in scope. Isolating CUI into a smaller environment dramatically reduces the number of systems that must meet all 110 requirements.',
                domain: 'CROSS'
            },
            {
                question: 'Which of the following statements about CMMC 2.0 is FALSE?',
                options: ['Level 1 requires annual self-assessment', 'Level 2 aligns with NIST SP 800-171', 'All levels require third-party assessment', 'Level 3 requires government-led assessment'],explanation: 'This is false because Level 1 requires only self-assessment (no third party). Level 2 may require C3PAO assessment depending on the contract, and Level 3 requires government-led assessment. Not all levels require third-party assessment.',
                domain: 'CROSS'
            },
            {
                question: 'A defense contractor is preparing for a CMMC Level 2 assessment. They have implemented 105 of 110 practices. They plan to document the remaining 5 gaps in a POA&M. Is this acceptable?',
                options: ['Yes -- any practice can be placed on a POA&M', 'Yes -- but the POA&M items must be closed within 180 days, and certain critical practices cannot be on a POA&M', 'No -- all 110 practices must be fully implemented at assessment time', 'No -- POA&Ms are not allowed under CMMC 2.0'],explain: 'CMMC 2.0 allows limited use of POA&Ms, but with conditions: items must be resolved within 180 days, and certain high-priority practices (like CUI encryption) cannot be deferred. The assessor and contracting officer must approve the POA&M.',
                domain: 'CROSS'
            },
            {
                question: 'Mapping CMMC to the broader cybersecurity landscape: which framework provides the OVERALL cybersecurity risk management structure that CMMC fits within?',
                options: ['NIST Cybersecurity Framework (CSF)', 'ISO 27001', 'COBIT', 'PCI DSS'],explanation: 'The NIST Cybersecurity Framework (CSF) provides the overarching risk management structure (Identify, Protect, Detect, Respond, Recover). CMMC/NIST 800-171 fits within this framework, providing specific controls primarily in the Protect and Detect functions. Many organizations use CSF as their umbrella and map CMMC requirements into it.',
                domain: 'CROSS'
            }
        ];

        // Fix: one question uses 'explain' instead of 'explanation'
        questions.forEach(q => { if (q.explain && !q.explanation) { q.explanation = q.explain; } });

        // Domain metadata for score breakdown
        const DOMAIN_META = {
            AC: { name: 'Access Control', count: 0,},
            AT: { name: 'Awareness & Training', count: 0,},
            AU: { name: 'Audit & Accountability', count: 0,},
            CM: { name: 'Configuration Management', count: 0,},
            IA: { name: 'Identification & Authentication', count: 0,},
            IR: { name: 'Incident Response', count: 0,},
            MA: { name: 'Maintenance', count: 0,},
            MP: { name: 'Media Protection', count: 0,},
            PS: { name: 'Personnel Security', count: 0,},
            PE: { name: 'Physical Protection', count: 0,},
            RA: { name: 'Risk Assessment', count: 0,},
            CA: { name: 'Security Assessment', count: 0,},
            SC: { name: 'System & Comm Protection', count: 0,},
            SI: { name: 'System & Info Integrity', count: 0,},
            CROSS: { name: 'Cross-Domain', count: 0,}
        };

        // Count questions per domain
        questions.forEach(q => { if (DOMAIN_META[q.domain]) DOMAIN_META[q.domain].count++; });

        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CMMC Comprehensive Assessment',
            description: 'Test your knowledge across all 14 CMMC domains. 35 questions covering Access Control, Audit, Configuration Management, and more.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            timeLimit: null,
            retryAllowed: true,
            theme: 'shield',
            moduleId: 'cmmc-comprehensive',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,
            questions: questions,
            onComplete: function(results) {
                // Calculate domain breakdown
                const breakdown = JSON.parse(JSON.stringify(DOMAIN_META));
                // Reset counts
                Object.keys(breakdown).forEach(k => { breakdown[k].correct = 0; });

                results.answers.forEach((a, idx) => {
                    // The quiz engine may have reordered questions, so we need to map back
                    const q = quiz.config.questions[a.questionIndex];
                    if (q && q.domain && breakdown[q.domain]) {
                        if (a.isCorrect) breakdown[q.domain].correct++;
                    }
                });

                // Record with GameTracker
                try {
                    if (typeof GameTracker !== 'undefined') {
                        GameTracker.record({
                            game: 'cmmc-comprehensive-quiz',
                            score: results.percentage,
                            maxScore: 100,
                            details: {
                                correct: results.score,
                                total: results.total,
                                passed: results.passed,
                                duration: results.duration,
                                domainBreakdown: breakdown
                            }
                        });
                    }
                } catch(e) { console.warn('GameTracker error:', e); }

                // Inject domain breakdown into results after a brief delay (QuizEngine renders results asynchronously)
                setTimeout(function() {
                    const resultsEl = document.querySelector('.quiz-results');
                    if (!resultsEl) return;

                    let tableHtml = '<div class="domain-breakdown"><h4>Score by Domain</h4><table class="db-table"><thead><tr><th scope="col">Domain</th><th scope="col">Score</th><th scope="col">Result</th><th scope="col">Progress</th></tr></thead><tbody>';

                    Object.entries(breakdown).forEach(([code, d]) => {
                        if (d.count === 0) return;
                        const pct = Math.round(d.correct / d.count * 100);
                        const pass = pct >= 70;
                        tableHtml += `<tr>
                            <td>${code} - ${d.name}</td>
                            <td>${d.correct}/${d.count} (${pct}%)</td>
                            <td class="${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'REVIEW'}</td>
                            <td><div class="db-bar"><div class="db-bar-fill ${pass ? 'pass' : 'fail'}" style="width:${pct}%"></div></div></td>
                        </tr>`;
                    });

                    tableHtml += '</tbody></table></div>';

                    // Insert before the review section if it exists, otherwise append
                    const reviewSection = resultsEl.querySelector('.results-review');
                    if (reviewSection) {
                        reviewSection.insertAdjacentHTML('beforebegin', tableHtml);
                    } else {
                        resultsEl.insertAdjacentHTML('beforeend', tableHtml);
                    }
                }, 100);
            }
        });

        quiz.start();
    })();
    </script>
