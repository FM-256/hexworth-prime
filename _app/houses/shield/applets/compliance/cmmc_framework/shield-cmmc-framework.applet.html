<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMC Framework Overview | Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <style>
        :root {
            --shield: #a855f7;
            --shield-dim: #a855f733;
            --shield-glow: rgba(168,85,247,0.15);
            --bg: #0a0a0f;
            --card: #111118;
            --card-border: #1e1e2a;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
            --purple: #a855f7;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; line-height:1.6; }

        .app { max-width:1100px; margin:0 auto; padding:1rem; }

        .back { display:inline-flex; align-items:center; gap:.4rem; color:var(--text-muted); text-decoration:none; font-size:.82rem; margin-bottom:1rem; transition:color .2s; }
        .back:hover { color:var(--shield); }

        /* Header */
        .header { background:linear-gradient(135deg, #1a1020 0%, var(--shield-glow) 100%); border:1px solid var(--shield-dim); border-radius:12px; padding:1.5rem 2rem; margin-bottom:1.5rem; position:relative; overflow:hidden; }
        .header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--shield), transparent); }
        .header-top { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
        .header-icon { font-size:2.5rem; }
        .header-title { font-size:1.6rem; font-weight:700; color:#fff; }
        .header-badge { background:var(--shield-dim); color:var(--shield); border:1px solid rgba(168,85,247,0.4); padding:3px 12px; border-radius:20px; font-size:.75rem; font-weight:600; letter-spacing:.5px; }
        .header-desc { color:var(--text-dim); font-size:.9rem; margin-top:.5rem; }

        .progress-wrap { margin-top:1rem; }
        .progress-bar { height:4px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--shield); border-radius:2px; transition:width .5s ease; }
        .progress-text { font-size:.72rem; color:var(--text-muted); margin-top:.35rem; text-align:right; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:1.5rem; background:rgba(255,255,255,.03); border-radius:10px; padding:4px; flex-wrap:wrap; }
        .tab { flex:1; padding:.65rem 1rem; border-radius:8px; border:none; background:transparent; color:var(--text-dim); font-size:.85rem; font-weight:500; cursor:pointer; transition:all .2s; min-width:90px; text-align:center; }
        .tab:hover { background:rgba(255,255,255,.06); color:var(--text); }
        .tab.active { background:var(--shield-glow); color:var(--shield); border:1px solid var(--shield-dim); }

        .panel { display:none; animation:fadeIn .3s ease; }
        .panel.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* Section */
        .section { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .section h3 { color:#fff; font-size:1.1rem; margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem; }
        .section p, .section li { color:var(--text-dim); font-size:.88rem; line-height:1.7; }
        .section ul { padding-left:1.25rem; }
        .section li { margin-bottom:.35rem; }

        /* Callout */
        .callout { display:flex; gap:1rem; align-items:flex-start; background:rgba(168,85,247,0.05); border:1px solid var(--shield-dim); border-radius:10px; padding:1.25rem; margin:1rem 0; }
        .callout-icon { font-size:1.5rem; flex-shrink:0; }
        .callout-title { font-size:.9rem; font-weight:600; color:var(--shield); margin-bottom:.35rem; }
        .callout-text { font-size:.85rem; color:var(--text-dim); line-height:1.6; }
        .callout-text strong { color:var(--text); }

        /* Timeline */
        .timeline { position:relative; padding-left:2.5rem; margin:1.5rem 0; }
        .timeline::before { content:''; position:absolute; left:1rem; top:0; bottom:0; width:2px; background:linear-gradient(to bottom, var(--shield-dim), rgba(168,85,247,0.05)); }
        .tl-item { position:relative; margin-bottom:1.5rem; }
        .tl-item::before { content:''; position:absolute; left:-1.75rem; top:.3rem; width:12px; height:12px; border-radius:50%; border:2px solid var(--shield); background:var(--bg); z-index:1; }
        .tl-item.active::before { background:var(--shield); }
        .tl-date { font-size:.75rem; color:var(--shield); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:.25rem; }
        .tl-title { color:#fff; font-size:.95rem; font-weight:600; margin-bottom:.25rem; }
        .tl-desc { color:var(--text-dim); font-size:.82rem; line-height:1.5; }

        /* Level cards */
        .level-cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:.75rem; margin:1rem 0; }
        .level-card { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.25rem; transition:all .2s; cursor:default; }
        .level-card:hover { border-color:var(--shield-dim); }
        .lc-badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:.72rem; font-weight:700; letter-spacing:.5px; margin-bottom:.5rem; }
        .lc-badge.l1 { background:rgba(34,197,94,.12); color:var(--green); border:1px solid rgba(34,197,94,.3); }
        .lc-badge.l2 { background:rgba(234,179,8,.12); color:var(--yellow); border:1px solid rgba(234,179,8,.3); }
        .lc-badge.l3 { background:rgba(168,85,247,.12); color:var(--purple); border:1px solid rgba(168,85,247,.3); }
        .lc-name { font-size:1.1rem; font-weight:700; color:#fff; margin-bottom:.35rem; }
        .lc-stat { font-size:.82rem; color:var(--text-muted); margin-bottom:.5rem; }
        .lc-desc { font-size:.82rem; color:var(--text-dim); line-height:1.5; margin-bottom:.5rem; }
        .lc-who { font-size:.78rem; color:var(--text-muted); font-style:italic; }

        /* Comparison table */
        .cmp-table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.82rem; }
        .cmp-table th { background:rgba(168,85,247,.1); color:var(--shield); padding:.65rem .75rem; text-align:left; border-bottom:1px solid var(--card-border); font-size:.75rem; text-transform:uppercase; letter-spacing:.5px; }
        .cmp-table td { padding:.65rem .75rem; border-bottom:1px solid rgba(255,255,255,.03); color:var(--text-dim); }
        .cmp-table tr:hover td { background:rgba(255,255,255,.02); }
        .cmp-table td:first-child { color:var(--text); font-weight:500; }

        /* FCI/CUI cards */
        .info-cards { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin:1rem 0; }
        .info-card { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:1rem; }
        .info-card.fci { border-left:3px solid var(--green); }
        .info-card.cui { border-left:3px solid var(--yellow); }
        .info-card-label { font-size:.85rem; font-weight:600; color:#fff; margin-bottom:.35rem; }
        .info-card-text { font-size:.8rem; color:var(--text-dim); line-height:1.5; }

        /* Assessment process steps */
        .steps { counter-reset:step; margin:1rem 0; }
        .step { display:flex; gap:1rem; align-items:flex-start; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1rem 1.25rem; margin-bottom:.5rem; }
        .step-num { counter-increment:step; flex-shrink:0; width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:var(--shield-glow); border:1px solid var(--shield-dim); border-radius:50%; font-size:.8rem; font-weight:700; color:var(--shield); }
        .step-num::before { content:counter(step); }
        .step-content h4 { color:#fff; font-size:.9rem; margin-bottom:.25rem; }
        .step-content p { color:var(--text-dim); font-size:.82rem; }

        /* Domain grid */
        .domain-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:.5rem; margin:1rem 0; }
        .domain-chip { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:.65rem .75rem; display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--text-dim); }
        .domain-chip strong { color:var(--text); font-size:.75rem; font-family:monospace; }

        /* Quiz */
        .quiz-q { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .quiz-q-num { font-size:.72rem; color:var(--shield); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:.5rem; }
        .quiz-q-text { color:var(--text); font-size:.92rem; line-height:1.5; margin-bottom:1rem; }
        .quiz-opt { display:block; width:100%; text-align:left; padding:.7rem 1rem; margin-bottom:.35rem; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cbd5e1; font-size:.85rem; cursor:pointer; transition:all .15s; line-height:1.4; }
        .quiz-opt:hover:not(.answered) { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.15); }
        .quiz-opt.correct { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:var(--green); }
        .quiz-opt.wrong { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.35); color:var(--red); }
        .quiz-opt.right-answer { border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.04); }
        .quiz-explanation { display:none; margin-top:.75rem; padding:.75rem 1rem; background:rgba(168,85,247,.05); border-left:3px solid rgba(168,85,247,.4); border-radius:0 6px 6px 0; color:var(--text-dim); font-size:.83rem; line-height:1.5; }
        .quiz-explanation.show { display:block; }

        .score-bar { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.25rem; text-align:center; margin-bottom:1rem; }
        .score-num { font-size:2rem; font-weight:700; color:var(--shield); }
        .score-label { color:var(--text-muted); font-size:.8rem; margin-top:.25rem; }
        .score-bar-visual { height:6px; background:rgba(255,255,255,.06); border-radius:3px; margin-top:.75rem; overflow:hidden; }
        .score-fill { height:100%; background:var(--shield); border-radius:3px; transition:width .5s ease; }
        .reset-btn { background:transparent; border:1px solid rgba(255,255,255,.12); color:var(--text-dim); padding:.5rem 1.5rem; border-radius:8px; cursor:pointer; font-size:.8rem; margin-top:.75rem; transition:all .2s; }
        .reset-btn:hover { border-color:rgba(168,85,247,.4); color:var(--shield); }

        /* Responsive */
        @media (max-width:768px) {
            .level-cards { grid-template-columns:1fr; }
            .info-cards { grid-template-columns:1fr; }
            .domain-grid { grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
            .app { padding:.75rem; }
            .header { padding:1rem 1.25rem; }
            .header-title { font-size:1.2rem; }
            .tab { min-width:0; font-size:.78rem; padding:.5rem .6rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function() {
    const STORAGE_KEY = 'hexworth_cmmc_framework';

    const DOMAINS = [
        { code:'AC', name:'Access Control', count:22 },
        { code:'AT', name:'Awareness & Training', count:3 },
        { code:'AU', name:'Audit & Accountability', count:9 },
        { code:'CM', name:'Configuration Management', count:9 },
        { code:'IA', name:'Identification & Authentication', count:11 },
        { code:'IR', name:'Incident Response', count:3 },
        { code:'MA', name:'Maintenance', count:6 },
        { code:'MP', name:'Media Protection', count:9 },
        { code:'PS', name:'Personnel Security', count:2 },
        { code:'PE', name:'Physical Protection', count:6 },
        { code:'RA', name:'Risk Assessment', count:3 },
        { code:'CA', name:'Security Assessment', count:4 },
        { code:'SC', name:'System & Communications Protection', count:16 },
        { code:'SI', name:'System & Information Integrity', count:7 }
    ];

    const QUIZ = [
        { q:'How many levels does the CMMC 2.0 framework define?', opts:['Two','Three','Four','Five'], correct:1, explain:'CMMC 2.0 defines three levels: Level 1 (Foundational), Level 2 (Advanced), and Level 3 (Expert). This was reduced from five levels in CMMC 1.0.' },
        { q:'Which NIST publication provides the security requirements that form the basis of CMMC Level 2?', opts:['NIST SP 800-53','NIST SP 800-171','NIST SP 800-172','NIST SP 800-37'], correct:1, explain:'CMMC Level 2 is directly aligned with the 110 security requirements in NIST SP 800-171, "Protecting CUI in Nonfederal Systems."' },
        { q:'How many practices are required for CMMC Level 1?', opts:['6','17','110','171'], correct:1, explain:'Level 1 (Foundational) requires 17 practices focused on basic safeguarding of Federal Contract Information (FCI) from FAR 52.204-21.' },
        { q:'What type of assessment is required for CMMC Level 1?', opts:['Third-party assessment by a C3PAO','Annual self-assessment','Government-led assessment','No assessment required'], correct:1, explain:'Level 1 requires an annual self-assessment. The results must be affirmed by a senior company official and uploaded to the Supplier Performance Risk System (SPRS).' },
        { q:'What does C3PAO stand for?', opts:['Certified Cybersecurity Compliance Assessment Organization','CMMC Third-Party Assessor Organization','Controlled CUI Certification and Assessment Office','Cybersecurity Capability and Compliance Assessment Organization'], correct:1, explain:'C3PAO stands for CMMC Third-Party Assessor Organization. These are accredited by the Cyber AB (formerly CMMC-AB) to conduct Level 2 assessments.' },
        { q:'Which DFARS clause requires defense contractors to implement NIST SP 800-171?', opts:['DFARS 252.204-7008','DFARS 252.204-7012','DFARS 252.204-7019','DFARS 252.204-7021'], correct:1, explain:'DFARS 252.204-7012 ("Safeguarding Covered Defense Information") has required contractors to implement NIST SP 800-171 since 2017.' },
        { q:'What type of information does CMMC Level 1 protect?', opts:['Controlled Unclassified Information (CUI)','Federal Contract Information (FCI)','Classified information','Personally Identifiable Information (PII)'], correct:1, explain:'Level 1 protects Federal Contract Information (FCI) -- information not intended for public release that is provided by or generated for the government under a contract.' },
        { q:'How many domains are in the CMMC 2.0 framework?', opts:['10','12','14','17'], correct:2, explain:'CMMC 2.0 has 14 domains, directly aligned with the 14 families in NIST SP 800-171.' },
        { q:'What is a POA&M in the context of CMMC?', opts:['Plan of Action & Milestones -- a document tracking remediation of gaps','Program Office Assessment & Management -- an oversight board','Protection of Assets & Media -- a security practice','Principle of Access & Monitoring -- an audit requirement'], correct:0, explain:'A POA&M (Plan of Action & Milestones) documents known security gaps, planned corrective actions, and milestones for closing those gaps. Under CMMC 2.0, limited use of POA&Ms is allowed for Level 2 assessments.' },
        { q:'Which level of CMMC 2.0 incorporates requirements from NIST SP 800-172?', opts:['Level 1','Level 2','Level 3','All levels'], correct:2, explain:'Level 3 (Expert) adds a subset of requirements from NIST SP 800-172, "Enhanced Security Requirements for Protecting CUI," on top of all Level 2 requirements.' }
    ];

    function getState() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
    }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function render() {
        const state = getState();
        const tabsRead = state.tabsRead || {};
        const tabCount = Object.keys(tabsRead).length;
        const quizAnswered = state.quizAnswered || {};
        const quizScore = state.quizScore || null;

        document.getElementById('app').innerHTML = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>

            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83c\udfe6</span>
                    <span class="header-title">CMMC 2.0 Framework Overview</span>
                    <span class="header-badge">CMMC 2.0</span>
                </div>
                <p class="header-desc">The Cybersecurity Maturity Model Certification (CMMC) is the Department of Defense's framework for verifying that defense contractors can adequately protect sensitive information. CMMC 2.0 streamlined the original model from five levels to three.</p>
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(tabCount/5*100)}%"></div></div>
                    <div class="progress-text">${tabCount} of 5 sections explored</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="history">\ud83d\udcc5 History</button>
                <button class="tab" data-tab="levels">\ud83d\udcca Three Levels</button>
                <button class="tab" data-tab="assessment">\ud83d\udd0d Assessment</button>
                <button class="tab" data-tab="nist">\ud83d\udccb NIST Mapping</button>
                <button class="tab" data-tab="quiz">\ud83d\udcdd Quiz</button>
            </div>

            <div id="panel-history" class="panel active"></div>
            <div id="panel-levels" class="panel"></div>
            <div id="panel-assessment" class="panel"></div>
            <div id="panel-nist" class="panel"></div>
            <div id="panel-quiz" class="panel"></div>
        `;

        renderHistory();
        renderLevels();
        renderAssessment();
        renderNist();
        renderQuiz(quizAnswered, quizScore);
        bindTabs();
    }

    function bindTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                const state = getState();
                if (!state.tabsRead) state.tabsRead = {};
                state.tabsRead[tab.dataset.tab] = true;
                saveState(state);
                document.querySelector('.progress-fill').style.width = Math.round(Object.keys(state.tabsRead).length / 5 * 100) + '%';
                document.querySelector('.progress-text').textContent = Object.keys(state.tabsRead).length + ' of 5 sections explored';
            });
        });
    }

    function renderHistory() {
        document.getElementById('panel-history').innerHTML = `
            <div class="section">
                <h3>\ud83d\udcc5 The Road to CMMC</h3>
                <p>The CMMC framework evolved over several years as the DoD sought to strengthen cybersecurity across the defense industrial base (DIB). Understanding this history helps explain why CMMC exists and how it relates to earlier requirements.</p>

                <div class="timeline">
                    <div class="tl-item">
                        <div class="tl-date">2013 -- DFARS Clause</div>
                        <div class="tl-title">DFARS 252.204-7012</div>
                        <div class="tl-desc">The DoD published a DFARS clause requiring contractors handling Covered Defense Information (CDI) to implement "adequate security." Initially referenced NIST SP 800-53, later shifted to NIST SP 800-171.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">2015 -- NIST SP 800-171</div>
                        <div class="tl-title">Protecting CUI in Nonfederal Systems</div>
                        <div class="tl-desc">NIST published SP 800-171 defining 110 security requirements for protecting CUI. This became the foundation for all subsequent contractor cybersecurity requirements.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">2017 -- DFARS Enforcement</div>
                        <div class="tl-title">Self-Attestation Era</div>
                        <div class="tl-desc">Defense contractors were required to self-attest to NIST SP 800-171 compliance. However, the honor system proved insufficient -- many contractors claimed compliance without full implementation.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">Jan 2020 -- CMMC 1.0</div>
                        <div class="tl-title">CMMC Model v1.0 Published</div>
                        <div class="tl-desc">The original CMMC model introduced 5 maturity levels (Basic through Advanced) with 171 practices. Required third-party assessment at all levels. Industry raised concerns about cost and complexity.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">Nov 2021 -- CMMC 2.0</div>
                        <div class="tl-title">CMMC 2.0 Announced</div>
                        <div class="tl-desc">The DoD streamlined CMMC to 3 levels, aligned directly with NIST standards, allowed self-assessment for Level 1, and introduced POA&Ms. Reduced burden on small businesses.</div>
                    </div>
                    <div class="tl-item active">
                        <div class="tl-date">2024-2025 -- CMMC Final Rule</div>
                        <div class="tl-title">32 CFR Part 170 Published</div>
                        <div class="tl-desc">The final CMMC rule was published in the Federal Register. Phased implementation begins, with CMMC requirements appearing in new DoD contracts over a 3-year rollout period.</div>
                    </div>
                </div>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udca1</span>
                <div>
                    <div class="callout-title">Why CMMC?</div>
                    <div class="callout-text">Chinese threat actors have exfiltrated an estimated <strong>$600 billion</strong> worth of intellectual property from the defense industrial base. The self-attestation model under DFARS was not working. CMMC adds verification through assessments -- proving contractors actually implement the security controls they claim.</div>
                </div>
            </div>

            <div class="section">
                <h3>\ud83d\udcc6 Phased Rollout & Contract Requirements</h3>
                <p>CMMC 2.0 is being implemented through a <strong>phased approach</strong> over several years to give the defense industrial base time to prepare:</p>

                <div class="timeline">
                    <div class="tl-item">
                        <div class="tl-date">Phase 1 (Year 1)</div>
                        <div class="tl-title">Self-Assessment Begins</div>
                        <div class="tl-desc">CMMC Level 1 self-assessments and select Level 2 self-assessments start appearing in new DoD contracts. Contractors must submit self-assessment results to SPRS and have a senior official affirm compliance.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">Phase 2 (Year 2)</div>
                        <div class="tl-title">C3PAO Assessments Begin</div>
                        <div class="tl-desc">Level 2 C3PAO (third-party) assessments required for contracts involving CUI with higher sensitivity. Organizations must engage an accredited C3PAO for formal assessment and certification.</div>
                    </div>
                    <div class="tl-item">
                        <div class="tl-date">Phase 3 (Year 3)</div>
                        <div class="tl-title">Level 3 Assessments Begin</div>
                        <div class="tl-desc">Government-led DIBCAC assessments for Level 3 contracts begin. These apply to contractors handling the most sensitive CUI, particularly those facing APT threats.</div>
                    </div>
                    <div class="tl-item active">
                        <div class="tl-date">Phase 4 (Full Implementation)</div>
                        <div class="tl-title">All New Contracts Include CMMC</div>
                        <div class="tl-desc">CMMC requirements appear in all applicable DoD contracts. The DFARS clause 252.204-7021 is fully implemented. Contractors without appropriate CMMC certification cannot compete for covered contracts.</div>
                    </div>
                </div>

                <div class="callout">
                    <span class="callout-icon">\u26a0\ufe0f</span>
                    <div>
                        <div class="callout-title">Start Preparing Now</div>
                        <div class="callout-text">
                            Even before CMMC appears in your contracts, <strong>DFARS 252.204-7012</strong> already requires NIST SP 800-171 implementation for all contractors handling CUI. CMMC does not create new requirements -- it adds <strong>verification</strong>. Organizations already compliant with NIST 800-171 are well-positioned for CMMC Level 2.
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderLevels() {
        document.getElementById('panel-levels').innerHTML = `
            <div class="section">
                <h3>\ud83d\udcca The Three CMMC 2.0 Levels</h3>
                <p>Each level builds on the one below it. Level 2 includes all Level 1 requirements plus additional controls. Level 3 includes everything from Level 2 plus enhanced requirements.</p>
            </div>

            <div class="level-cards">
                <div class="level-card">
                    <span class="lc-badge l1">LEVEL 1</span>
                    <div class="lc-name">Foundational</div>
                    <div class="lc-stat">17 Practices | Annual Self-Assessment</div>
                    <div class="lc-desc">Basic cyber hygiene. Protects <strong>Federal Contract Information (FCI)</strong>. Requirements come from FAR 52.204-21. Think: antivirus, password policies, physical access control.</div>
                    <div class="lc-who">Who: All DoD contractors handling FCI</div>
                </div>
                <div class="level-card">
                    <span class="lc-badge l2">LEVEL 2</span>
                    <div class="lc-name">Advanced</div>
                    <div class="lc-stat">110 Practices | Triennial C3PAO or Self-Assessment</div>
                    <div class="lc-desc">Full NIST SP 800-171 implementation. Protects <strong>Controlled Unclassified Information (CUI)</strong>. Most contracts with CUI will require a third-party C3PAO assessment.</div>
                    <div class="lc-who">Who: Contractors handling CUI</div>
                </div>
                <div class="level-card">
                    <span class="lc-badge l3">LEVEL 3</span>
                    <div class="lc-name">Expert</div>
                    <div class="lc-stat">110+ Practices | Triennial Government-Led Assessment</div>
                    <div class="lc-desc">All Level 2 requirements plus a subset of NIST SP 800-172 enhanced requirements. Protects CUI against <strong>Advanced Persistent Threats (APTs)</strong>. Government-led assessment by DCMA DIBCAC.</div>
                    <div class="lc-who">Who: Contractors handling the most sensitive CUI</div>
                </div>
            </div>

            <div class="info-cards">
                <div class="info-card fci">
                    <div class="info-card-label">Federal Contract Information (FCI)</div>
                    <div class="info-card-text">Information not intended for public release that is provided by or generated for the Government under a contract. Think: contract terms, pricing, SOWs, proposals, delivery schedules.</div>
                </div>
                <div class="info-card cui">
                    <div class="info-card-label">Controlled Unclassified Information (CUI)</div>
                    <div class="info-card-text">Government-created or possessed information that requires safeguarding per law or regulation. Think: technical drawings, test results, export-controlled data, PII, CTI.</div>
                </div>
            </div>

            <div class="callout">
                <span class="callout-icon">\u26a0\ufe0f</span>
                <div>
                    <div class="callout-title">CMMC 1.0 vs 2.0 -- Key Changes</div>
                    <div class="callout-text">
                        <strong>Levels:</strong> Reduced from 5 to 3 (removed Levels 2 and 4).<br>
                        <strong>Practices:</strong> Removed CMMC-unique practices; aligned 100% with NIST standards.<br>
                        <strong>Self-Assessment:</strong> Allowed for Level 1 (and some Level 2 contracts).<br>
                        <strong>POA&Ms:</strong> Plan of Action & Milestones now permitted (with conditions).<br>
                        <strong>Cost:</strong> Significantly reduced compliance burden for small businesses.
                    </div>
                </div>
            </div>
        `;
    }

    function renderAssessment() {
        document.getElementById('panel-assessment').innerHTML = `
            <div class="section">
                <h3>\ud83d\udd0d Assessment Process</h3>
                <p>The assessment process varies by level. Understanding the flow helps organizations plan and budget for compliance.</p>
            </div>

            <div class="section">
                <h3>Level 1: Self-Assessment</h3>
                <div class="steps">
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Scope Your Environment</h4><p>Identify all systems that process, store, or transmit FCI. This defines your assessment boundary.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Assess Against 17 Practices</h4><p>Evaluate your implementation of the 17 practices from FAR 52.204-21. Document MET/NOT MET status for each.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Calculate SPRS Score</h4><p>Upload your self-assessment results to the Supplier Performance Risk System (SPRS). Maximum score is 110.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Senior Official Affirmation</h4><p>A senior company official must affirm the accuracy of the assessment annually. This carries legal weight under the False Claims Act.</p></div></div>
                </div>
            </div>

            <div class="section">
                <h3>Level 2: C3PAO Assessment</h3>
                <div class="steps">
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Prepare SSP & POA&M</h4><p>Create a System Security Plan (SSP) documenting your CUI environment and how all 110 practices are implemented. Document gaps in a Plan of Action & Milestones (POA&M).</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Engage a C3PAO</h4><p>Select a CMMC Third-Party Assessor Organization accredited by the Cyber AB. Schedule and scope the assessment.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Assessment Execution</h4><p>Assessors review documentation, interview personnel, and examine technical artifacts. Each practice is scored as MET, NOT MET, or NOT APPLICABLE.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Conditional Certification</h4><p>If all practices are MET (or acceptable POA&Ms exist for limited NOT MET practices), a conditional or full certification is granted. Valid for 3 years.</p></div></div>
                    <div class="step"><div class="step-num"></div><div class="step-content"><h4>Continuous Monitoring</h4><p>Maintain compliance between assessments. Annual affirmations required. Material changes may trigger re-assessment.</p></div></div>
                </div>
            </div>

            <div class="section">
                <h3>Level 3: Government-Led Assessment</h3>
                <p>Level 3 assessments are conducted by the Defense Contract Management Agency's Defense Industrial Base Cybersecurity Assessment Center (<strong>DCMA DIBCAC</strong>). These assessments verify implementation of NIST SP 800-172 enhanced requirements in addition to all Level 2 controls.</p>
                <p style="margin-top:.5rem">Level 3 is reserved for programs involving the most critical CUI and is expected to apply to a relatively small number of contractors.</p>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udcb0</span>
                <div>
                    <div class="callout-title">POA&M Limits</div>
                    <div class="callout-text">
                        Under CMMC 2.0, <strong>POA&Ms are allowed but limited</strong>. A contractor may receive conditional certification with open POA&M items, but must close them within <strong>180 days</strong>. Certain critical practices (like encryption of CUI) cannot be placed on a POA&M -- they must be fully implemented at assessment time.
                    </div>
                </div>
            </div>
        `;
    }

    function renderNist() {
        const totalPractices = DOMAINS.reduce((s, d) => s + d.count, 0);
        const domainChips = DOMAINS.map(d => `
            <div class="domain-chip"><strong>${d.code}</strong> ${d.name} <span style="margin-left:auto;color:var(--text-muted);font-size:.72rem">${d.count}</span></div>
        `).join('');

        document.getElementById('panel-nist').innerHTML = `
            <div class="section">
                <h3>\ud83d\udccb NIST SP 800-171 Alignment</h3>
                <p>CMMC 2.0 Level 2 maps directly to the <strong>110 security requirements</strong> in NIST SP 800-171. The 14 CMMC domains correspond exactly to the 14 NIST SP 800-171 requirement families.</p>
                <p style="margin-top:.5rem">Total practices across all domains: <strong>${totalPractices}</strong></p>
            </div>

            <div class="section">
                <h3>The 14 Domains</h3>
                <div class="domain-grid">${domainChips}</div>
            </div>

            <div class="section">
                <h3>Framework Comparison</h3>
                <div style="overflow-x:auto">
                    <table class="cmp-table">
                        <thead>
                            <tr><th>Aspect</th><th>NIST SP 800-171</th><th>CMMC 2.0 Level 2</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>Requirements</td><td>110 security requirements</td><td>110 practices (same requirements)</td></tr>
                            <tr><td>Families/Domains</td><td>14 requirement families</td><td>14 domains (identical)</td></tr>
                            <tr><td>Verification</td><td>Self-attestation + SPRS score</td><td>C3PAO third-party assessment</td></tr>
                            <tr><td>Certification</td><td>No formal certification</td><td>Formal certification valid 3 years</td></tr>
                            <tr><td>POA&Ms</td><td>Allowed indefinitely</td><td>Must close within 180 days</td></tr>
                            <tr><td>Applicability</td><td>All contractors with CUI per DFARS 7012</td><td>Specified in new contracts via DFARS 7021</td></tr>
                            <tr><td>Scoring</td><td>SPRS score (-203 to 110)</td><td>MET / NOT MET per practice</td></tr>
                            <tr><td>Legal Weight</td><td>Contractual requirement</td><td>Certification + False Claims Act liability</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="section">
                <h3>NIST SP 800-172 (Level 3)</h3>
                <p>Level 3 adds enhanced security requirements from NIST SP 800-172, which provides supplemental guidance for protecting CUI when the threat is an <strong>Advanced Persistent Threat (APT)</strong>. Key additions include:</p>
                <ul>
                    <li><strong>Dual authorization</strong> for critical operations</li>
                    <li><strong>Threat hunting</strong> capabilities</li>
                    <li><strong>Automated response</strong> to security events</li>
                    <li><strong>Supply chain risk management</strong> controls</li>
                    <li><strong>Anomaly detection</strong> across network segments</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udca1</span>
                <div>
                    <div class="callout-title">Scoping Guidance</div>
                    <div class="callout-text">
                        Not all of your systems need to be in scope for CMMC. Only systems that <strong>process, store, or transmit CUI</strong> (and systems that provide security protections for those systems) are in the assessment boundary. Many organizations reduce their CMMC scope by segmenting CUI into an enclave.
                    </div>
                </div>
            </div>
        `;
    }

    function renderQuiz(answered, savedScore) {
        const panel = document.getElementById('panel-quiz');
        const totalQ = QUIZ.length;
        const answeredCount = Object.keys(answered).length;
        const correctCount = Object.values(answered).filter(a => a.correct).length;
        const allDone = answeredCount === totalQ;

        let html = '';
        if (allDone) {
            const pct = Math.round(correctCount / totalQ * 100);
            html += `<div class="score-bar">
                <div class="score-num">${pct}%</div>
                <div class="score-label">${correctCount} of ${totalQ} correct${pct >= 70 ? ' -- Passed!' : ' -- 70% required to pass'}</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${pct}%"></div></div>
                <button class="reset-btn" id="quizReset">Retake Quiz</button>
            </div>`;
        } else {
            html += `<div class="score-bar">
                <div class="score-num">${answeredCount} / ${totalQ}</div>
                <div class="score-label">Questions answered</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${Math.round(answeredCount/totalQ*100)}%"></div></div>
            </div>`;
        }

        QUIZ.forEach((q, i) => {
            const a = answered[i];
            html += `<div class="quiz-q" data-qi="${i}">
                <div class="quiz-q-num">Question ${i+1} of ${totalQ}</div>
                <div class="quiz-q-text">${q.q}</div>
                ${q.opts.map((opt, oi) => {
                    let cls = 'quiz-opt';
                    if (a) {
                        cls += ' answered';
                        if (oi === q.correct) cls += ' correct';
                        else if (oi === a.selected && !a.correct) cls += ' wrong';
                        if (oi === q.correct && a.selected !== q.correct) cls += ' right-answer';
                    }
                    return `<button class="${cls}" data-qi="${i}" data-oi="${oi}" ${a ? 'disabled' : ''}>${opt}</button>`;
                }).join('')}
                <div class="quiz-explanation${a ? ' show' : ''}">${q.explain}</div>
            </div>`;
        });

        panel.innerHTML = html;

        panel.querySelectorAll('.quiz-opt:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => {
                const qi = parseInt(btn.dataset.qi);
                const oi = parseInt(btn.dataset.oi);
                const q = QUIZ[qi];
                const isCorrect = oi === q.correct;
                const state = getState();
                if (!state.quizAnswered) state.quizAnswered = {};
                state.quizAnswered[qi] = { selected: oi, correct: isCorrect };
                const newCount = Object.keys(state.quizAnswered).length;
                if (newCount === totalQ) {
                    const score = Object.values(state.quizAnswered).filter(a => a.correct).length;
                    state.quizScore = Math.round(score / totalQ * 100);
                    if (typeof GameTracker !== 'undefined') {
                        try { GameTracker.record({ game:'cmmc-framework-quiz', score:state.quizScore, maxScore:100, details:{ correct:score, total:totalQ } }); } catch(e) {}
                    }
                }
                saveState(state);
                renderQuiz(state.quizAnswered, state.quizScore);
            });
        });

        const resetBtn = document.getElementById('quizReset');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const state = getState();
                state.quizAnswered = {};
                state.quizScore = null;
                saveState(state);
                renderQuiz({}, null);
            });
        }
    }

    // Mark first tab as read
    const initState = getState();
    if (!initState.tabsRead) initState.tabsRead = {};
    initState.tabsRead['history'] = true;
    saveState(initState);

    render();
})();
</script>
<script src="../../../../../components/GameTracker.js"></script>
<script src="../../../../../components/FluxCapacitor.js"></script>
