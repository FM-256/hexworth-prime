<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUI Overview | Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- Progress & Achievements -->
    <script src="../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <style>
        :root {
            --shield: #a855f7;
            --shield-dim: #a855f733;
            --shield-glow: rgba(168,85,247,0.15);
            --bg: #0a0a0f;
            --card: #111118;
            --card-border: #1e1e2a;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; line-height:1.6; }

        .app { max-width:1100px; margin:0 auto; padding:1rem; }

        /* Back link */
        .back { display:inline-flex; align-items:center; gap:.4rem; color:var(--text-muted); text-decoration:none; font-size:.82rem; margin-bottom:1rem; transition:color .2s; }
        .back:hover { color:var(--shield); }

        /* Header */
        .header { background:linear-gradient(135deg, #1a1020 0%, var(--shield-glow) 100%); border:1px solid var(--shield-dim); border-radius:12px; padding:1.5rem 2rem; margin-bottom:1.5rem; position:relative; overflow:hidden; }
        .header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--shield), transparent); }
        .header-top { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
        .header-icon { font-size:2.5rem; }
        .header-title { font-size:1.6rem; font-weight:700; color:#fff; }
        .header-badge { background:var(--shield-dim); color:var(--shield); border:1px solid rgba(168,85,247,0.4); padding:3px 12px; border-radius:20px; font-size:.75rem; font-weight:600; letter-spacing:.5px; }
        .header-desc { color:var(--text-dim); font-size:.9rem; margin-top:.5rem; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:1.5rem; background:rgba(255,255,255,.03); border-radius:10px; padding:4px; flex-wrap:wrap; }
        .tab { flex:1; padding:.65rem 1rem; border-radius:8px; border:none; background:transparent; color:var(--text-dim); font-size:.85rem; font-weight:500; cursor:pointer; transition:all .2s; min-width:100px; text-align:center; }
        .tab:hover { background:rgba(255,255,255,.06); color:var(--text); }
        .tab.active { background:var(--shield-glow); color:var(--shield); border:1px solid var(--shield-dim); }

        /* Panels */
        .panel { display:none; animation:fadeIn .3s ease; }
        .panel.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* Section */
        .section { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .section h3 { color:#fff; font-size:1.1rem; margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem; }
        .section p, .section li { color:var(--text-dim); font-size:.88rem; line-height:1.7; }
        .section ul { padding-left:1.25rem; }
        .section li { margin-bottom:.35rem; }

        /* Callout */
        .callout { display:flex; gap:1rem; align-items:flex-start; background:rgba(168,85,247,0.05); border:1px solid var(--shield-dim); border-radius:10px; padding:1.25rem; margin:1rem 0; }
        .callout-icon { font-size:1.5rem; flex-shrink:0; }
        .callout-title { font-size:.9rem; font-weight:600; color:var(--shield); margin-bottom:.35rem; }
        .callout-text { font-size:.85rem; color:var(--text-dim); line-height:1.6; }
        .callout-text strong { color:var(--text); }

        /* Category grid */
        .cat-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:.75rem; margin-top:1rem; }
        .cat-card { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:1rem; cursor:pointer; transition:all .2s; }
        .cat-card:hover { border-color:var(--shield-dim); background:var(--shield-glow); }
        .cat-card.open { border-color:var(--shield-dim); }
        .cat-card-title { font-size:.88rem; font-weight:600; color:#fff; display:flex; align-items:center; gap:.5rem; }
        .cat-card-count { font-size:.7rem; color:var(--text-muted); margin-left:auto; }
        .cat-card-body { display:none; margin-top:.75rem; padding-top:.75rem; border-top:1px solid rgba(255,255,255,.04); }
        .cat-card.open .cat-card-body { display:block; }
        .cat-card-body p { font-size:.8rem; color:var(--text-dim); margin-bottom:.35rem; }

        /* Banner builder */
        .banner-demo { background:#1a1a2a; border:1px solid var(--card-border); border-radius:8px; padding:1.5rem; margin:1rem 0; text-align:center; }
        .banner-output { font-family:monospace; font-size:1rem; font-weight:700; color:#fff; background:rgba(0,0,0,.3); padding:1rem; border-radius:6px; margin:1rem 0; letter-spacing:.5px; min-height:3rem; display:flex; align-items:center; justify-content:center; }
        .banner-controls { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; margin-top:.75rem; }
        .banner-btn { padding:6px 14px; border-radius:6px; border:1px solid var(--card-border); background:rgba(255,255,255,.04); color:var(--text-dim); font-size:.8rem; cursor:pointer; transition:all .2s; }
        .banner-btn:hover { border-color:var(--shield-dim); color:var(--shield); }
        .banner-btn.active { background:var(--shield-glow); border-color:var(--shield); color:var(--shield); }

        /* Marking examples */
        .mark-example { background:rgba(0,0,0,.2); border-left:3px solid var(--shield); padding:.75rem 1rem; border-radius:0 8px 8px 0; margin:.5rem 0; font-family:monospace; font-size:.82rem; color:var(--text); letter-spacing:.3px; }

        /* Quiz */
        .quiz-q { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .quiz-q-num { font-size:.72rem; color:var(--shield); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:.5rem; }
        .quiz-q-text { color:var(--text); font-size:.92rem; line-height:1.5; margin-bottom:1rem; }
        .quiz-opt { display:block; width:100%; text-align:left; padding:.7rem 1rem; margin-bottom:.35rem; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cbd5e1; font-size:.85rem; cursor:pointer; transition:all .15s; line-height:1.4; }
        .quiz-opt:hover:not(.answered) { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.15); }
        .quiz-opt.correct { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:var(--green); }
        .quiz-opt.wrong { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.35); color:var(--red); }
        .quiz-opt.right-answer { border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.04); }
        .quiz-explanation { display:none; margin-top:.75rem; padding:.75rem 1rem; background:rgba(168,85,247,.05); border-left:3px solid rgba(168,85,247,.4); border-radius:0 6px 6px 0; color:var(--text-dim); font-size:.83rem; line-height:1.5; }
        .quiz-explanation.show { display:block; }

        /* Score bar */
        .score-bar { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.25rem; text-align:center; margin-bottom:1rem; }
        .score-num { font-size:2rem; font-weight:700; color:var(--shield); }
        .score-label { color:var(--text-muted); font-size:.8rem; margin-top:.25rem; }
        .score-bar-visual { height:6px; background:rgba(255,255,255,.06); border-radius:3px; margin-top:.75rem; overflow:hidden; }
        .score-fill { height:100%; background:var(--shield); border-radius:3px; transition:width .5s ease; }
        .reset-btn { background:transparent; border:1px solid rgba(255,255,255,.12); color:var(--text-dim); padding:.5rem 1.5rem; border-radius:8px; cursor:pointer; font-size:.8rem; margin-top:.75rem; transition:all .2s; }
        .reset-btn:hover { border-color:rgba(168,85,247,.4); color:var(--shield); }

        /* Progress */
        .progress-wrap { margin-top:1rem; }
        .progress-bar { height:4px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--shield); border-radius:2px; transition:width .5s ease; }
        .progress-text { font-size:.72rem; color:var(--text-muted); margin-top:.35rem; text-align:right; }

        /* Responsive */
        @media (max-width:768px) {
            .cat-grid { grid-template-columns:1fr; }
            .app { padding:.75rem; }
            .header { padding:1rem 1.25rem; }
            .header-title { font-size:1.2rem; }
            .tab { min-width:0; font-size:.78rem; padding:.5rem .75rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function() {
    const STORAGE_KEY = 'hexworth_cui_overview';
    const CUI_CATEGORIES = [
        { name: 'Critical Infrastructure', icon: '/assets/images/icons/icon-lightning.webp', subcats: ['Ammonium Nitrate','Chemical-terrorism Vulnerability Information','Critical Energy Infrastructure Information','Emergency Management','General Critical Infrastructure Information','Information Systems Vulnerability Information','Physical Security','Protected Critical Infrastructure Information','SAFETY Act Information','Toxic Substances','Water Assessments'] },
        { name: 'Defense', icon: '/assets/images/icons/icon-home.webp', subcats: ['Controlled Technical Information (CTI)','DoD Critical Infrastructure Security Information','Naval Nuclear Propulsion Information','Unclassified Controlled Nuclear Information - Defense'] },
        { name: 'Export Control', icon: '/assets/images/icons/icon-package.webp', subcats: ['Export Controlled','Export Controlled Research'] },
        { name: 'Financial', icon: '/assets/images/icons/icon-money.webp', subcats: ['Bank Secrecy','Budget','Comptroller General','Consumer Complaint Information','Electronic Funds Transfer','Federal Housing Finance Non-Public Information','General Financial Information','International Financial Institutions','Mergers','Net Worth','Retirement'] },
        { name: 'Immigration', icon: '/assets/images/icons/icon-flag.webp', subcats: ['Asylee','Battered Spouse or Child','Permanent Resident Status','Status Adjustment','Temporary Protected Status','Victims of Human Trafficking','Visas'] },
        { name: 'Intelligence', icon: '/assets/images/icons/icon-detective.webp', subcats: ['Agriculture','Foreign Intelligence Surveillance Act (FISA)','FISA Business Records','General Intelligence','Geodetic Product Information','Intelligence Financial Records','Internal Data','Operations Security'] },
        { name: 'International Agreements', icon: '/assets/images/icons/icon-globe.webp', subcats: ['International Agreement Information'] },
        { name: 'Law Enforcement', icon: '/assets/images/icons/icon-flower.webp', subcats: ['Accident Investigation','Campaign Funds','Committed Person','Communications','Controlled Substances','Criminal History Records Information (CHRI)','DNA','General Law Enforcement','Informant','Investigation','Juvenile','Law Enforcement Financial Records','National Security Letter','Pen Register/Trap & Trace','Reward','Sex Crime Victim','Terrorist Screening','Whistleblower Identity'] },
        { name: 'Legal', icon: '/assets/images/icons/icon-scales.webp', subcats: ['Administrative Proceedings','Child Pornography','Child Victim/Witness','Collective Bargaining','Federal Grand Jury','Legal Privilege','Legislative Materials','Presentence Report','Prior Arrest','Protective Order','Victim','Witness Protection'] },
        { name: 'Natural & Cultural Resources', icon: '/assets/images/icons/icon-flask.webp', subcats: ['Archaeological Resources','Historic Properties','National Park System Resources'] },
        { name: 'NATO', icon: '/assets/images/icons/icon-flag.webp', subcats: ['NATO Restricted','NATO Unclassified'] },
        { name: 'Nuclear', icon: '/assets/images/icons/icon-explosion.webp', subcats: ['General Nuclear','Nuclear Recommendation Material','Nuclear Security-Related Information','Safeguards Information','Unclassified Controlled Nuclear Information - Energy'] },
        { name: 'Patent', icon: '/assets/images/icons/icon-document.webp', subcats: ['Patent Applications','Inventions','Secrecy Orders'] },
        { name: 'Privacy', icon: '/assets/images/icons/icon-padlock.webp', subcats: ['Contract Use','Death Records','General Privacy','Genetic Information','Health Information','Inspector General Protected','Military Personnel Records','Personnel Records','Student Records'] },
        { name: 'Procurement & Acquisition', icon: '/assets/images/icons/icon-notepad.webp', subcats: ['General Procurement and Acquisition','Small Business Research and Technology','Source Selection'] },
        { name: 'Proprietary Business Information', icon: '/assets/images/icons/icon-building.webp', subcats: ['Entity Registration Information','General Proprietary Business Information','Ocean Common Carrier and Marine Terminal Operator Agreements','Ocean Common Carrier Service Contracts','Proprietary Manufacturer','Proprietary Postal'] },
        { name: 'Provisional', icon: '/assets/images/icons/icon-shield.webp', subcats: ['Homeland Security Agreement Information','Homeland Security Enforcement Information','Information Systems Vulnerability Information - Homeland','International Agreement Information - Homeland','Operations Security Information','Personnel Security Information','Physical Security - Homeland','Privacy Information','Sensitive Personally Identifiable Information'] },
        { name: 'Statistical', icon: '/assets/images/icons/icon-barchart.webp', subcats: ['Investment Survey','Pesticide Producer Survey','Statistical Information','US Census'] },
        { name: 'Tax', icon: '/assets/images/icons/icon-barchart.webp', subcats: ['Federal Taxpayer Information','Tax Convention','Taxpayer Advocate Information','Written Determinations'] },
        { name: 'Transportation', icon: '/assets/images/icons/icon-redirect.webp', subcats: ['Railroad Safety Analysis Records','Sensitive Security Information'] }
    ];

    const QUIZ_QUESTIONS = [
        { q: 'What does CUI stand for?', opts: ['Controlled Unclassified Information','Classified Unprotected Intelligence','Confidential Unrestricted Information','Certified Unified Intelligence'], correct: 0, explain: 'CUI stands for Controlled Unclassified Information -- government-created or possessed information requiring safeguarding or dissemination controls.' },
        { q: 'Which organization manages the CUI program and maintains the CUI Registry?', opts: ['Department of Defense (DoD)','National Archives and Records Administration (NARA)','National Security Agency (NSA)','Cybersecurity and Infrastructure Security Agency (CISA)'], correct: 1, explain: 'NARA manages the CUI program and maintains the CUI Registry, which lists all approved CUI categories and subcategories.' },
        { q: 'What executive order established the CUI program?', opts: ['EO 12333','EO 13556','EO 13526','EO 14028'], correct: 1, explain: 'Executive Order 13556 (2010) established the CUI program to standardize how the executive branch handles unclassified information requiring protection.' },
        { q: 'What is the correct format for a CUI banner marking?', opts: ['CUI // Category // Dissemination','CONTROLLED // SP-Category / NOFORN','Both A and B are acceptable formats','Neither -- CUI does not require banner markings'], correct: 2, explain: 'Both CUI and CONTROLLED are acceptable control markings in the banner. Categories and dissemination controls are separated by double forward slashes (//).' },
        { q: 'Which marking term replaced FOUO (For Official Use Only)?', opts: ['Sensitive But Unclassified (SBU)','Controlled Unclassified Information (CUI)','Limited Official Use (LOU)','Official Use Only (OUO)'], correct: 1, explain: 'The CUI program replaced FOUO and dozens of other legacy markings with a single, standardized system under CUI.' },
        { q: 'How many CUI categories are defined in the NARA CUI Registry?', opts: ['10','14','20','Over 100 subcategories across 20 categories'], correct: 3, explain: 'The CUI Registry organizes information into 20 organizational index groupings containing over 100 specific subcategories.' },
        { q: 'What form is used to mark USB drives containing CUI?', opts: ['SF 312','SF 702','SF 903','DD 254'], correct: 2, explain: 'Standard Form 903 (SF 903) is a narrow label specifically designed for marking USB drives containing CUI.' },
        { q: 'Which of these is an authorized Limited Dissemination Control for CUI?', opts: ['EYES ONLY','TOP SECRET','NOFORN (No Foreign Dissemination)','RESTRICTED'], correct: 2, explain: 'NOFORN is one of seven authorized limited dissemination controls. Others include FED ONLY, FEDCON, NOCON, DL ONLY, REL TO, and DISPLAY ONLY.' },
        { q: 'When forwarding an email containing CUI, what must you do?', opts: ['Remove all CUI markings before forwarding','Include all original CUI markings','Convert the CUI to classified before forwarding','Only forward to .gov addresses'], correct: 1, explain: 'When forwarding CUI emails, you must include all original CUI markings. NARA also recommends ending the subject line with [Contains CUI].' },
        { q: 'What distinguishes CUI Basic from CUI Specified?', opts: ['CUI Basic is classified; CUI Specified is unclassified','CUI Basic uses standard handling; CUI Specified has additional controls from the authorizing law or regulation','CUI Basic is for contractors; CUI Specified is for government only','There is no difference -- they are interchangeable terms'], correct: 1, explain: 'CUI Basic follows the uniform set of controls in 32 CFR Part 2002. CUI Specified has additional or different handling requirements established by the authorizing law, regulation, or government-wide policy.' }
    ];

    function getState() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
    }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function render() {
        const state = getState();
        const quizScore = state.quizScore || null;
        const quizAnswered = state.quizAnswered || {};
        const tabsRead = state.tabsRead || {};
        const tabCount = Object.keys(tabsRead).length;

        document.getElementById('app').innerHTML = `
            <a class="back" href="../../../index.html">\u2039 Back to Shield House</a>

            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udcc1</span>
                    <span class="header-title">Controlled Unclassified Information (CUI)</span>
                    <span class="header-badge">COMPLIANCE</span>
                </div>
                <p class="header-desc">Understanding CUI -- what it is, how to identify it, how to mark it, and how to handle it properly. The CUI program standardizes the way the federal government handles unclassified information that requires safeguarding.</p>
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(tabCount/4*100)}%"></div></div>
                    <div class="progress-text">${tabCount} of 4 sections explored</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="what">\ud83d\udcd6 What is CUI</button>
                <button class="tab" data-tab="categories">\ud83d\uddc2 Categories</button>
                <button class="tab" data-tab="marking">\ud83c\udff7 Marking & Handling</button>
                <button class="tab" data-tab="quiz">\ud83d\udcdd Assessment</button>
            </div>

            <div id="panel-what" class="panel active"></div>
            <div id="panel-categories" class="panel"></div>
            <div id="panel-marking" class="panel"></div>
            <div id="panel-quiz" class="panel"></div>
        `;

        renderWhat();
        renderCategories();
        renderMarking();
        renderQuiz(quizAnswered, quizScore);
        bindTabs();
    }

    function bindTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                // Track tab reads
                const state = getState();
                if (!state.tabsRead) state.tabsRead = {};
                state.tabsRead[tab.dataset.tab] = true;
                saveState(state);
                document.querySelector('.progress-fill').style.width = Math.round(Object.keys(state.tabsRead).length / 4 * 100) + '%';
                document.querySelector('.progress-text').textContent = Object.keys(state.tabsRead).length + ' of 4 sections explored';
            });
        });
    }

    function renderWhat() {
        document.getElementById('panel-what').innerHTML = `
            <div class="section">
                <h3>\ud83d\udcdc Definition</h3>
                <p><strong>Controlled Unclassified Information (CUI)</strong> is information the government creates or possesses, or that an entity creates or possesses for or on behalf of the Government, that a law, regulation, or Government-wide policy requires or permits an agency to handle using safeguarding or dissemination controls.</p>
                <p style="margin-top:.75rem">CUI is <em>not</em> classified information. It sits below the classification levels (Confidential, Secret, Top Secret) but still requires protection beyond what is given to ordinary unclassified data.</p>
            </div>

            <div class="section">
                <h3>\ud83d\udcc5 History & Authority</h3>
                <ul>
                    <li><strong>Pre-2010:</strong> Dozens of ad-hoc markings existed -- FOUO, SBU, LES, SSI, PCII, and more. Each agency had its own rules, leading to confusion and inconsistency.</li>
                    <li><strong>Executive Order 13556 (Nov 2010):</strong> President Obama signed EO 13556 establishing the CUI program to replace all legacy markings with a single, government-wide system.</li>
                    <li><strong>32 CFR Part 2002 (2016):</strong> NARA published the implementing regulation, providing detailed rules for designating, safeguarding, marking, disseminating, decontrolling, and disposing of CUI.</li>
                    <li><strong>NIST SP 800-171 (2015+):</strong> Provides the security requirements for protecting CUI in nonfederal systems. Required for defense contractors via DFARS 252.204-7012.</li>
                    <li><strong>CMMC 2.0 (2021+):</strong> The Cybersecurity Maturity Model Certification was created to verify that defense contractors can adequately protect CUI.</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83c\udfe2 NARA's Role</h3>
                <p>The <strong>National Archives and Records Administration (NARA)</strong> serves as the Executive Agent for the CUI program. NARA's responsibilities include:</p>
                <ul>
                    <li>Maintaining the <strong>CUI Registry</strong> -- the authoritative source listing all approved CUI categories, subcategories, and associated marking and handling requirements</li>
                    <li>Developing policies, directives, and training materials</li>
                    <li>Approving agency CUI policies for consistency with the program</li>
                    <li>Resolving disputes between agencies about CUI designation</li>
                    <li>Monitoring agency implementation and compliance</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udca1</span>
                <div>
                    <div class="callout-title">FOUO vs CUI</div>
                    <div class="callout-text">
                        <strong>For Official Use Only (FOUO)</strong> was a legacy document designation used primarily by the DoD. It was not a classification -- it simply indicated information not appropriate for public release. The CUI program <strong>replaced FOUO</strong> along with over 100 other ad-hoc markings. If you encounter a document still marked FOUO, it should be reviewed and re-marked under the CUI framework.
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>\ud83d\udc65 Stakeholders</h3>
                <p>CUI compliance spans the entire organization:</p>
                <ul>
                    <li><strong>Board of Directors:</strong> Due diligence and governance oversight</li>
                    <li><strong>CIO / CISO:</strong> Technical safeguards and policy implementation</li>
                    <li><strong>Managers & Administrators:</strong> Workflow integration and enforcement</li>
                    <li><strong>Employees:</strong> Day-to-day handling, marking, and reporting</li>
                    <li><strong>Business Partners / Contractors:</strong> Flow-down requirements and compliance verification</li>
                </ul>
            </div>
        `;
    }

    function renderCategories() {
        const totalSubcats = CUI_CATEGORIES.reduce((s, c) => s + c.subcats.length, 0);
        const catCards = CUI_CATEGORIES.map((cat, i) => `
            <div class="cat-card" data-cat="${i}">
                <div class="cat-card-title">
                    <span>${cat.icon}</span>
                    <span>${cat.name}</span>
                    <span class="cat-card-count">${cat.subcats.length}</span>
                </div>
                <div class="cat-card-body">
                    ${cat.subcats.map(s => '<p>\u203a ' + s + '</p>').join('')}
                </div>
            </div>
        `).join('');

        document.getElementById('panel-categories').innerHTML = `
            <div class="section">
                <h3>\ud83d\uddc2 CUI Organizational Index</h3>
                <p>The CUI Registry organizes information into <strong>${CUI_CATEGORIES.length} organizational index groupings</strong> containing <strong>${totalSubcats} subcategories</strong>. Each subcategory is tied to a specific law, regulation, or government-wide policy that requires its protection.</p>
                <p style="margin-top:.5rem;color:var(--text-muted);font-size:.82rem">Click any category below to expand its subcategories.</p>
            </div>
            <div class="cat-grid">${catCards}</div>
            <div class="callout" style="margin-top:1rem">
                <span class="callout-icon">\u2139\ufe0f</span>
                <div>
                    <div class="callout-title">CUI Basic vs CUI Specified</div>
                    <div class="callout-text">Each subcategory is classified as either <strong>CUI Basic</strong> (standard handling per 32 CFR 2002) or <strong>CUI Specified</strong> (the authorizing law/regulation imposes specific handling requirements beyond the basics). When marking CUI Specified, the category marking must be prefixed with <strong>SP-</strong>.</div>
                </div>
            </div>
        `;

        // Bind category cards
        document.querySelectorAll('.cat-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('open');
            });
        });
    }

    function renderMarking() {

                    <li><strong>Category Marking(s)</strong> -- identify the specific CUI category. Multiple categories separated by single forward slash (/). CUI Specified categories prefixed with <code>SP-</code></li>

            <div class="section">
                <h3>\ud83d\udce7 Portion Marking</h3>
                <p>Agencies may require <strong>portion marking</strong> -- placing CUI designators at the beginning of individual paragraphs or sections to indicate exactly which portions contain CUI. This provides granularity to identify what specific information belongs to which CUI categories.</p>
                <div class="mark-example">(CUI) This paragraph contains Controlled Unclassified Information...</div>
                <div class="mark-example">(CUI//SP-CTI) This paragraph contains Controlled Technical Information...</div>
            </div>

            <div class="section">
                <h3>\ud83d\udcf1 Media-Specific Marking</h3>
                <ul>
                    <li><strong>Paper Documents:</strong> Banner marking at top of each page (top and bottom is best practice). Must include a CUI Designation Indicator showing the designator's agency.</li>
                    <li><strong>Email:</strong> Banner marking at top of the email body. Subject line should end with <code>[Contains CUI]</code>. Attachments should include CUI in the filename (e.g., <code>Report[CONTAINS CUI].docx</code>). All original markings must be preserved when forwarding.</li>
                    <li><strong>USB Drives:</strong> Apply SF 903 label in a manner that does not affect drive operation. Once applied, the label cannot be removed.</li>
                    <li><strong>Computer Systems:</strong> If internal storage media is not accessible, mark the outside of the computer using SF 902, SF 903, or a permanent marker.</li>
                    <li><strong>Electronic Storage Media:</strong> All removable media must carry CUI markings and be encrypted when transported outside controlled areas.</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83d\udd25 Destruction Requirements</h3>
                <p>CUI must be destroyed in a manner that makes it unreadable, indecipherable, and irrecoverable. Approved destruction methods:</p>
                <ul>
                    <li><strong>Paper:</strong> Cross-cut shredding (P-4 or higher), pulping, or incineration</li>
                    <li><strong>Digital media:</strong> Degaussing, physical destruction, or NIST SP 800-88 compliant sanitization</li>
                    <li><strong>Equipment:</strong> Remove all CUI before disposal; sanitize per NIST guidelines</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83d\udee3 Limited Dissemination Controls</h3>
                <p>The only authorized Limited Dissemination Controls are:</p>
                <ul>
                    <li><strong>NOFORN</strong> -- No Foreign Dissemination</li>
                    <li><strong>FED ONLY</strong> -- Federal Employees Only</li>
                    <li><strong>FEDCON</strong> -- Federal Employees and Contractors Only</li>
                    <li><strong>NOCON</strong> -- No Dissemination to Contractors</li>
                    <li><strong>DL ONLY</strong> -- Dissemination List Controlled</li>
                    <li><strong>REL TO [USA, list]</strong> -- Authorized for Release to Certain Nationals Only</li>
                    <li><strong>DISPLAY ONLY</strong> -- Authorized for Display Only</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83d\udd10 Storage Requirements</h3>
                <p>CUI must be stored in a manner that prevents unauthorized access:</p>
                <ul>
                    <li><strong>Physical storage:</strong> CUI documents must be stored in locked containers (filing cabinets, safes, or locked rooms) when not in active use. The area must have access controls limiting entry to authorized personnel.</li>
                    <li><strong>Digital storage:</strong> CUI at rest must be protected using FIPS-validated encryption on all systems and media. Access controls (RBAC, file permissions) must enforce need-to-know.</li>
                    <li><strong>Cloud storage:</strong> Cloud service providers must meet FedRAMP Moderate baseline (or equivalent). CUI must be encrypted both at rest and in transit within the cloud environment.</li>
                    <li><strong>Removable media:</strong> USB drives, external hard drives, and optical media containing CUI must be encrypted, physically labeled, and inventoried.</li>
                    <li><strong>Clean desk policy:</strong> CUI documents must not be left unattended on desks, printers, or in other open areas.</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83d\udce1 Transmission Requirements</h3>
                <p>CUI must be protected during transmission to prevent interception:</p>
                <ul>
                    <li><strong>Email:</strong> Encrypt using S/MIME, PGP, or TLS (mandatory TLS between mail servers). Subject lines should contain <code>[Contains CUI]</code> but should NOT include the CUI content itself in the subject.</li>
                    <li><strong>File transfers:</strong> Use SFTP, SCP, or HTTPS -- never unencrypted FTP. Verify the recipient's identity and authorization before transmitting.</li>
                    <li><strong>Fax:</strong> CUI may be faxed only if the recipient is present to receive it or the fax machine is in a controlled area. Confirm the correct fax number before sending.</li>
                    <li><strong>Voice/VoIP:</strong> Discussions of CUI should occur on encrypted communications channels. Avoid discussing CUI in public spaces or on unsecured phone lines.</li>
                    <li><strong>Physical transport:</strong> Use opaque inner and outer wrapping. Mark the inner wrapper with CUI markings; the outer wrapper should NOT reveal CUI content. Use tracked delivery services (USPS First Class, FedEx, UPS) -- never regular post.</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83e\udd1d Sharing & Dissemination</h3>
                <p>CUI may only be shared with individuals who have a lawful government purpose and need-to-know:</p>
                <ul>
                    <li><strong>Within the organization:</strong> Share only with personnel whose roles require access. Verify recipients are aware of CUI handling requirements.</li>
                    <li><strong>With contractors:</strong> Flow-down CUI requirements through contract clauses (DFARS 252.204-7012, FAR 52.204-21). Contractors must implement equivalent protections.</li>
                    <li><strong>With foreign entities:</strong> CUI marked NOFORN cannot be shared with non-U.S. persons. CUI with REL TO markings may only be shared with the specified nationalities. Always verify authorization before sharing internationally.</li>
                    <li><strong>Public release:</strong> CUI cannot be publicly released without proper authorization from the designating agency. Public disclosure of CUI may violate federal law.</li>
                </ul>
            </div>

            <div class="section">
                <h3>\ud83d\udd13 Decontrol Procedures</h3>
                <p><strong>Decontrol</strong> is the process of removing CUI status from information that no longer requires protection:</p>
                <ul>
                    <li><strong>Authority:</strong> Only the designating agency (or its successor) may authorize decontrol. Individual holders of CUI cannot unilaterally decontrol information.</li>
                    <li><strong>When decontrol applies:</strong> CUI may be decontrolled when the authorizing law, regulation, or policy no longer requires protection -- such as information that has been publicly released, declassified, or whose protection period has expired.</li>
                    <li><strong>Process:</strong> The agency notifies all known holders of the CUI that it has been decontrolled. Previous markings should be lined through (not removed) and annotated with "Decontrolled on [date] by [authority]."</li>
                    <li><strong>Automatic decontrol:</strong> Some CUI categories include automatic decontrol triggers -- such as time-based expiration, event-based triggers (contract completion), or legislative changes.</li>
                    <li><strong>After decontrol:</strong> The information becomes ordinary unclassified data. Standard protections apply, but the enhanced CUI safeguarding requirements no longer apply.</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\u26a0\ufe0f</span>
                <div>
                    <div class="callout-title">Mishandling Consequences</div>

                        Unauthorized disclosure or mishandling of CUI can result in <strong>administrative sanctions</strong> (reprimand, suspension, termination), <strong>contractual penalties</strong> (loss of contract, debarment), and <strong>civil or criminal liability</strong> depending on the authorizing law. For defense contractors, mishandling may also trigger <strong>False Claims Act</strong> liability if the organization falsely certified CUI compliance.
                    </div>
                </div>
            </div>
        `;

        // Banner builder logic
        const bannerState = { control: null, category: null, dissem: null };
        function updateBanner() {
            const parts = [];
            if (bannerState.control) parts.push(bannerState.control);
            if (bannerState.category) parts.push(bannerState.category);
            if (bannerState.dissem) parts.push(bannerState.dissem);
            document.getElementById('bannerOutput').textContent = parts.length ? parts.join(' // ') : 'Select components below';
        }

        document.querySelectorAll('.banner-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.dataset.group;
                // Toggle off if same button
                document.querySelectorAll(`.banner-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
                if (bannerState[group] === btn.dataset.val) {
                    bannerState[group] = null;
                } else {
                    bannerState[group] = btn.dataset.val;
                    btn.classList.add('active');
                }
                updateBanner();
            });
        });

        document.getElementById('bannerReset').addEventListener('click', () => {
            bannerState.control = null;
            bannerState.category = null;
            bannerState.dissem = null;
            document.querySelectorAll('.banner-btn').forEach(b => b.classList.remove('active'));
            updateBanner();
        });
    }

    function renderQuiz(answered, savedScore) {
        const panel = document.getElementById('panel-quiz');
        const totalQ = QUIZ_QUESTIONS.length;
        const answeredCount = Object.keys(answered).length;
        const correctCount = Object.values(answered).filter(a => a.correct).length;
        const allDone = answeredCount === totalQ;

        let html = '';
        if (allDone) {
            const pct = Math.round(correctCount / totalQ * 100);
            html += `<div class="score-bar">
                <div class="score-num">${pct}%</div>
                <div class="score-label">${correctCount} of ${totalQ} correct${pct >= 70 ? ' -- Passed!' : ' -- 70% required to pass'}</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${pct}%"></div></div>
                <button class="reset-btn" id="quizReset">Retake Assessment</button>
            </div>`;
        } else {
            html += `<div class="score-bar">
                <div class="score-num">${answeredCount} / ${totalQ}</div>
                <div class="score-label">Questions answered</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${Math.round(answeredCount/totalQ*100)}%"></div></div>
            </div>`;
        }

        QUIZ_QUESTIONS.forEach((q, i) => {
            const a = answered[i];
            html += `<div class="quiz-q" data-qi="${i}">
                <div class="quiz-q-num">Question ${i+1} of ${totalQ}</div>
                <div class="quiz-q-text">${q.q}</div>
                ${q.opts.map((opt, oi) => {
                    let cls = 'quiz-opt';
                    if (a) {
                        cls += ' answered';
                        if (oi === q.correct) cls += ' correct';
                        else if (oi === a.selected && !a.correct) cls += ' wrong';
                        if (oi === q.correct && a.selected !== q.correct) cls += ' right-answer';
                    }
                    return `<button class="${cls}" data-qi="${i}" data-oi="${oi}" ${a ? 'disabled' : ''}>${opt}</button>`;
                }).join('')}
                <div class="quiz-explanation${a ? ' show' : ''}">${q.explain}</div>
            </div>`;
        });

        panel.innerHTML = html;

        // Bind option clicks
        panel.querySelectorAll('.quiz-opt:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => {
                const qi = parseInt(btn.dataset.qi);
                const oi = parseInt(btn.dataset.oi);
                const q = QUIZ_QUESTIONS[qi];
                const isCorrect = oi === q.correct;

                const state = getState();
                if (!state.quizAnswered) state.quizAnswered = {};
                state.quizAnswered[qi] = { selected: oi, correct: isCorrect };

                // Check if all done
                const newCount = Object.keys(state.quizAnswered).length;
                if (newCount === totalQ) {
                    const score = Object.values(state.quizAnswered).filter(a => a.correct).length;
                    state.quizScore = Math.round(score / totalQ * 100);

                    // Track with GameTracker if available
                    if (typeof GameTracker !== 'undefined') {
                        try {
                            GameTracker.record({
                                game: 'cui-overview-quiz',
                                score: state.quizScore,
                                maxScore: 100,
                                details: { correct: score, total: totalQ }
                            });
                        } catch(e) { /* non-critical */ }
                    }
                }
                saveState(state);
                renderQuiz(state.quizAnswered, state.quizScore);
            });
        });

        // Reset button
        const resetBtn = document.getElementById('quizReset');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const state = getState();
                state.quizAnswered = {};
                state.quizScore = null;
                saveState(state);
                renderQuiz({}, null);
            });
        }
    }

    // Mark the "what" tab as read on load
    const initState = getState();
    if (!initState.tabsRead) initState.tabsRead = {};
    initState.tabsRead['what'] = true;
    saveState(initState);

    render();
})();
