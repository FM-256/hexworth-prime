<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMC Framework Overview | Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <style>
        :root {
            --shield: #a855f7;
            --shield-dim: #a855f733;
            --shield-glow: rgba(168,85,247,0.15);
            --bg: #0a0a0f;
            --card: #111118;
            --card-border: #1e1e2a;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; line-height:1.6; }

        .app { max-width:1100px; margin:0 auto; padding:1rem; }

        /* Back link */
        .back { display:inline-flex; align-items:center; gap:.4rem; color:var(--text-muted); text-decoration:none; font-size:.82rem; margin-bottom:1rem; transition:color .2s; }
        .back:hover { color:var(--shield); }

        /* Header */
        .header { background:linear-gradient(135deg, #1a1020 0%, var(--shield-glow) 100%); border:1px solid var(--shield-dim); border-radius:12px; padding:1.5rem 2rem; margin-bottom:1.5rem; position:relative; overflow:hidden; }
        .header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--shield), transparent); }
        .header-top { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
        .header-icon { font-size:2.5rem; }
        .header-title { font-size:1.6rem; font-weight:700; color:#fff; }
        .header-badge { background:var(--shield-dim); color:var(--shield); border:1px solid rgba(168,85,247,0.4); padding:3px 12px; border-radius:20px; font-size:.75rem; font-weight:600; letter-spacing:.5px; }
        .header-desc { color:var(--text-dim); font-size:.9rem; margin-top:.5rem; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:1.5rem; background:rgba(255,255,255,.03); border-radius:10px; padding:4px; flex-wrap:wrap; }
        .tab { flex:1; padding:.65rem 1rem; border-radius:8px; border:none; background:transparent; color:var(--text-dim); font-size:.85rem; font-weight:500; cursor:pointer; transition:all .2s; min-width:100px; text-align:center; }
        .tab:hover { background:rgba(255,255,255,.06); color:var(--text); }
        .tab.active { background:var(--shield-glow); color:var(--shield); border:1px solid var(--shield-dim); }

        /* Panels */
        .panel { display:none; animation:fadeIn .3s ease; }
        .panel.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* Section */
        .section { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .section h3 { color:#fff; font-size:1.1rem; margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem; }
        .section p, .section li { color:var(--text-dim); font-size:.88rem; line-height:1.7; }
        .section ul { padding-left:1.25rem; }
        .section li { margin-bottom:.35rem; }

        /* Callout */
        .callout { display:flex; gap:1rem; align-items:flex-start; background:rgba(168,85,247,0.05); border:1px solid var(--shield-dim); border-radius:10px; padding:1.25rem; margin:1rem 0; }
        .callout-icon { font-size:1.5rem; flex-shrink:0; }
        .callout-title { font-size:.9rem; font-weight:600; color:var(--shield); margin-bottom:.35rem; }
        .callout-text { font-size:.85rem; color:var(--text-dim); line-height:1.6; }
        .callout-text strong { color:var(--text); }

        /* Level cards */
        .level-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:.75rem; margin-top:1rem; }
        .level-card { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:1.25rem; transition:all .2s; }
        .level-card:hover { border-color:var(--shield-dim); }
        .level-num { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:.5rem; }
        .level-1 .level-num { color:#22c55e; }
        .level-2 .level-num { color:#eab308; }
        .level-3 .level-num { color:#ef4444; }
        .level-name { font-size:1rem; font-weight:600; color:#fff; margin-bottom:.5rem; }
        .level-detail { font-size:.82rem; color:var(--text-dim); line-height:1.6; }
        .level-detail strong { color:var(--text); }

        /* Domain grid */
        .domain-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:.75rem; margin-top:1rem; }
        .domain-card { background:rgba(255,255,255,.03); border:1px solid var(--card-border); border-radius:8px; padding:1rem 1.25rem; text-decoration:none; transition:all .2s; display:block; }
        .domain-card:hover { border-color:var(--shield); background:var(--shield-glow); transform:translateY(-2px); }
        .domain-card-code { font-size:.72rem; font-weight:700; color:var(--shield); text-transform:uppercase; letter-spacing:1px; margin-bottom:.25rem; }
        .domain-card-name { font-size:.92rem; font-weight:600; color:#fff; margin-bottom:.35rem; }
        .domain-card-meta { display:flex; align-items:center; justify-content:space-between; }
        .domain-card-count { font-size:.75rem; color:var(--text-muted); }
        .domain-card-arrow { font-size:.8rem; color:var(--text-muted); transition:color .2s; }
        .domain-card:hover .domain-card-arrow { color:var(--shield); }

        /* Assessment table */
        .assess-table { width:100%; border-collapse:collapse; margin-top:.75rem; font-size:.84rem; }
        .assess-table th { text-align:left; color:var(--shield); font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.5px; padding:.6rem .75rem; border-bottom:1px solid var(--card-border); }
        .assess-table td { padding:.6rem .75rem; color:var(--text-dim); border-bottom:1px solid rgba(255,255,255,.03); vertical-align:top; }
        .assess-table tr:hover td { background:rgba(255,255,255,.02); }

        /* Timeline */
        .timeline { margin-top:1rem; }
        .timeline-item { display:flex; gap:1rem; padding:.75rem 0; border-bottom:1px solid rgba(255,255,255,.04); }
        .timeline-item:last-child { border-bottom:none; }
        .timeline-date { min-width:80px; font-size:.78rem; font-weight:600; color:var(--shield); }
        .timeline-text { font-size:.84rem; color:var(--text-dim); line-height:1.5; }
        .timeline-text strong { color:var(--text); }

        /* Quiz */
        .quiz-q { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.5rem; margin-bottom:1rem; }
        .quiz-q-num { font-size:.72rem; color:var(--shield); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:.5rem; }
        .quiz-q-text { color:var(--text); font-size:.92rem; line-height:1.5; margin-bottom:1rem; }
        .quiz-opt { display:block; width:100%; text-align:left; padding:.7rem 1rem; margin-bottom:.35rem; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cbd5e1; font-size:.85rem; cursor:pointer; transition:all .15s; line-height:1.4; }
        .quiz-opt:hover:not(.answered) { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.15); }
        .quiz-opt.correct { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:var(--green); }
        .quiz-opt.wrong { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.35); color:var(--red); }
        .quiz-opt.right-answer { border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.04); }
        .quiz-explanation { display:none; margin-top:.75rem; padding:.75rem 1rem; background:rgba(168,85,247,.05); border-left:3px solid rgba(168,85,247,.4); border-radius:0 6px 6px 0; color:var(--text-dim); font-size:.83rem; line-height:1.5; }
        .quiz-explanation.show { display:block; }

        /* Score bar */
        .score-bar { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:1.25rem; text-align:center; margin-bottom:1rem; }
        .score-num { font-size:2rem; font-weight:700; color:var(--shield); }
        .score-label { color:var(--text-muted); font-size:.8rem; margin-top:.25rem; }
        .score-bar-visual { height:6px; background:rgba(255,255,255,.06); border-radius:3px; margin-top:.75rem; overflow:hidden; }
        .score-fill { height:100%; background:var(--shield); border-radius:3px; transition:width .5s ease; }
        .reset-btn { background:transparent; border:1px solid rgba(255,255,255,.12); color:var(--text-dim); padding:.5rem 1.5rem; border-radius:8px; cursor:pointer; font-size:.8rem; margin-top:.75rem; transition:all .2s; }
        .reset-btn:hover { border-color:rgba(168,85,247,.4); color:var(--shield); }

        /* Progress */
        .progress-wrap { margin-top:1rem; }
        .progress-bar { height:4px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--shield); border-radius:2px; transition:width .5s ease; }
        .progress-text { font-size:.72rem; color:var(--text-muted); margin-top:.35rem; text-align:right; }

        /* Responsive */
        @media (max-width:768px) {
            .domain-grid { grid-template-columns:1fr; }
            .level-grid { grid-template-columns:1fr; }
            .app { padding:.75rem; }
            .header { padding:1rem 1.25rem; }
            .header-title { font-size:1.2rem; }
            .tab { min-width:0; font-size:.78rem; padding:.5rem .75rem; }
            .assess-table { font-size:.78rem; }
            .assess-table th, .assess-table td { padding:.4rem .5rem; }
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">CMMC 2.0 Framework Overview</h1>
<div class="app" id="app"></div>

<script>
(function() {
    const STORAGE_KEY = 'hexworth_cmmc_overview';

    const CMMC_DOMAINS = [
        { code: 'AC', name: 'Access Control', practices: 22, href: '/houses/shield/applets/compliance/cmmc_access_control/shield-cmmc-ac.applet.html' },
        { code: 'AT', name: 'Awareness & Training', practices: 3, href: '/houses/shield/applets/compliance/cmmc_awareness_training/shield-cmmc-at.applet.html' },
        { code: 'AU', name: 'Audit & Accountability', practices: 9, href: '/houses/shield/applets/compliance/cmmc_audit_accountability/shield-cmmc-au.applet.html' },
        { code: 'CA', name: 'Security Assessment', practices: 4, href: '/houses/shield/applets/compliance/cmmc_security_assessment/shield-cmmc-ca.applet.html' },
        { code: 'CM', name: 'Configuration Management', practices: 9, href: '/houses/shield/applets/compliance/cmmc_config_management/shield-cmmc-cm.applet.html' },
        { code: 'IA', name: 'Identification & Authentication', practices: 11, href: '/houses/shield/applets/compliance/cmmc_identification_auth/shield-cmmc-ia.applet.html' },
        { code: 'IR', name: 'Incident Response', practices: 3, href: '/houses/shield/applets/compliance/cmmc_incident_response/shield-cmmc-ir.applet.html' },
        { code: 'MA', name: 'Maintenance', practices: 6, href: '/houses/shield/applets/compliance/cmmc_maintenance/shield-cmmc-ma.applet.html' },
        { code: 'MP', name: 'Media Protection', practices: 9, href: '/houses/shield/applets/compliance/cmmc_media_protection/shield-cmmc-mp.applet.html' },
        { code: 'PE', name: 'Physical Protection', practices: 6, href: '/houses/shield/applets/compliance/cmmc_physical_protection/shield-cmmc-pe.applet.html' },
        { code: 'PS', name: 'Personnel Security', practices: 2, href: '/houses/shield/applets/compliance/cmmc_personnel_security/shield-cmmc-ps.applet.html' },
        { code: 'RA', name: 'Risk Assessment', practices: 3, href: '/houses/shield/applets/compliance/cmmc_risk_assessment/shield-cmmc-ra.applet.html' },
        { code: 'SC', name: 'System & Communications Protection', practices: 16, href: '/houses/shield/applets/compliance/cmmc_system_comm_protection/shield-cmmc-sc.applet.html' },
        { code: 'SI', name: 'System & Information Integrity', practices: 7, href: '/houses/shield/applets/compliance/cmmc_system_info_integrity/shield-cmmc-si.applet.html' }
    ];

    const QUIZ_QUESTIONS = [
        {
            q: 'How many maturity levels does CMMC 2.0 define?',
            opts: ['2 levels', '3 levels', '5 levels', '7 levels'],
            correct: 1,
            explain: 'CMMC 2.0 simplified the original 5-level model down to 3 levels: Level 1 (Foundational), Level 2 (Advanced), and Level 3 (Expert).'
        },
        {
            q: 'How many security domains are included in the CMMC framework?',
            opts: ['10 domains', '12 domains', '14 domains', '17 domains'],
            correct: 2,
            explain: 'CMMC organizes its practices across 14 security domains, from Access Control (AC) to System & Information Integrity (SI).'
        },
        {
            q: 'Which NIST publication does CMMC Level 2 align with?',
            opts: ['NIST SP 800-53', 'NIST SP 800-171', 'NIST SP 800-88', 'NIST Cybersecurity Framework'],
            correct: 1,
            explain: 'CMMC Level 2 maps directly to the 110 security requirements in NIST SP 800-171, which governs protecting Controlled Unclassified Information (CUI) in nonfederal systems.'
        },
        {
            q: 'What type of information does CMMC Level 1 protect?',
            opts: ['Classified National Security Information', 'Controlled Unclassified Information (CUI)', 'Federal Contract Information (FCI)', 'Personally Identifiable Information (PII)'],
            correct: 2,
            explain: 'Level 1 (Foundational) focuses on protecting Federal Contract Information (FCI) -- basic information provided by or generated for the government under contract that is not intended for public release.'
        },
        {
            q: 'What type of assessment is required at CMMC Level 2 for critical programs?',
            opts: ['Self-assessment only', 'Third-party assessment (C3PAO)', 'Government-led assessment', 'No assessment required'],
            correct: 1,
            explain: 'CMMC Level 2 requires assessment by a CMMC Third-Party Assessment Organization (C3PAO). Some non-critical programs may allow self-assessment, but critical programs involving CUI require third-party verification.'
        },
        {
            q: 'What does SPRS stand for in the context of CMMC compliance?',
            opts: ['Security Practice Rating System', 'Supplier Performance Risk System', 'System Protection Readiness Score', 'Standard Policy Review Service'],
            correct: 1,
            explain: 'The Supplier Performance Risk System (SPRS) is the DoD repository where contractors submit their self-assessment scores. A score of 110 means full compliance with NIST SP 800-171; the minimum passing score is -203.'
        }
    ];

    function getState() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
    }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function render() {
        const state = getState();
        const quizAnswered = state.quizAnswered || {};
        const tabsRead = state.tabsRead || {};
        const tabCount = Object.keys(tabsRead).length;

        document.getElementById('app').innerHTML = `
            <a class="back" href="/houses/shield/index.html">\u2039 Back to Shield House</a>

            <div class="header">
                <div class="header-top">
                    <span class="header-icon">\ud83d\udee1</span>
                    <span class="header-title">CMMC 2.0 Framework Overview</span>
                    <span class="header-badge">COMPLIANCE</span>
                </div>
                <p class="header-desc">The Cybersecurity Maturity Model Certification (CMMC) -- understanding the framework that protects the defense supply chain. Explore all 14 domains, 3 maturity levels, and assessment requirements.</p>
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(tabCount/4*100)}%"></div></div>
                    <div class="progress-text">${tabCount} of 4 sections explored</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="overview">\ud83d\udcdc Overview</button>
                <button class="tab" data-tab="domains">\ud83d\uddc2 14 Domains</button>
                <button class="tab" data-tab="assessment">\ud83d\udcca Assessment</button>
                <button class="tab" data-tab="quiz">\ud83d\udcdd Quiz</button>
            </div>

            <div id="panel-overview" class="panel active"></div>
            <div id="panel-domains" class="panel"></div>
            <div id="panel-assessment" class="panel"></div>
            <div id="panel-quiz" class="panel"></div>
        `;

        renderOverview();
        renderDomains();
        renderAssessment();
        renderQuiz(quizAnswered, state.quizScore);
        bindTabs();
    }

    function bindTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                const state = getState();
                if (!state.tabsRead) state.tabsRead = {};
                state.tabsRead[tab.dataset.tab] = true;
                saveState(state);
                document.querySelector('.progress-fill').style.width = Math.round(Object.keys(state.tabsRead).length / 4 * 100) + '%';
                document.querySelector('.progress-text').textContent = Object.keys(state.tabsRead).length + ' of 4 sections explored';
            });
        });
    }

    function renderOverview() {
        document.getElementById('panel-overview').innerHTML = `
            <div class="section">
                <h2>\ud83d\udcdc What is CMMC 2.0?</h2>
                <p>The <strong>Cybersecurity Maturity Model Certification (CMMC)</strong> is a unified cybersecurity standard developed by the U.S. Department of Defense (DoD) to ensure that organizations in the defense industrial base (DIB) adequately protect sensitive government information.</p>
                <p style="margin-top:.75rem">CMMC establishes a set of cybersecurity practices and processes that defense contractors must implement and -- critically -- have <strong>verified through assessment</strong> before they can be awarded DoD contracts involving sensitive information.</p>
            </div>

            <div class="section">
                <h2>\ud83c\udfaf Purpose</h2>
                <p>CMMC exists to protect two categories of sensitive information in the defense supply chain:</p>
                <ul>
                    <li><strong>Federal Contract Information (FCI):</strong> Information provided by or generated for the government under contract, not intended for public release. Examples include contract performance data, delivery schedules, and pricing information.</li>
                    <li><strong>Controlled Unclassified Information (CUI):</strong> Government-created or -possessed information that requires safeguarding or dissemination controls consistent with applicable laws, regulations, and government-wide policies. Examples include technical drawings, engineering data, and research results.</li>
                </ul>
                <p style="margin-top:.75rem">Before CMMC, contractors self-attested to their compliance with NIST SP 800-171 -- but audits revealed widespread gaps. CMMC closes this loophole by requiring <strong>independent verification</strong> of cybersecurity maturity.</p>
            </div>

            <div class="section">
                <h2>\ud83d\udcc5 History</h2>
                <ul>
                    <li><strong>Pre-2020:</strong> The DoD relied on self-attestation under DFARS 252.204-7012, requiring contractors to implement NIST SP 800-171 controls. Compliance was inconsistent across the supply chain.</li>
                    <li><strong>CMMC 1.0 (January 2020):</strong> The DoD released CMMC version 1.0 with five maturity levels, 171 practices, and a requirement for third-party assessment at every level. Industry raised concerns about cost and complexity.</li>
                    <li><strong>CMMC 2.0 (November 2021):</strong> In response to industry feedback, the DoD streamlined the model to three levels, eliminated unique CMMC practices (aligning fully with NIST standards), and introduced self-assessment options for lower-risk programs.</li>
                    <li><strong>Final Rule (2024):</strong> The CMMC Program final rule (32 CFR Part 170) was published in the Federal Register, establishing the formal regulatory framework for implementation.</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udca1</span>
                <div>
                    <div class="callout-title">Who Needs CMMC?</div>
                    <div class="callout-text">
                        <strong>Any organization</strong> that does business with the Department of Defense -- including prime contractors, subcontractors, and suppliers at any tier -- will need CMMC certification. The specific level required depends on the sensitivity of the information handled. Even small businesses providing basic services under DoD contracts will need at minimum Level 1 certification.
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>\ud83c\udfd7 The Three Maturity Levels</h2>
                <div class="level-grid">
                    <div class="level-card level-1">
                        <div class="level-num">Level 1 -- Foundational</div>
                        <div class="level-name">Basic Cyber Hygiene</div>
                        <div class="level-detail">
                            <strong>17 practices</strong> based on FAR 52.204-21<br>
                            <strong>Assessment:</strong> Annual self-assessment<br>
                            <strong>Protects:</strong> Federal Contract Information (FCI)<br>
                            <strong>Scope:</strong> Basic safeguarding requirements -- access control, identification, media protection, physical security, system integrity, and communications protection at a foundational level.
                        </div>
                    </div>
                    <div class="level-card level-2">
                        <div class="level-num">Level 2 -- Advanced</div>
                        <div class="level-name">Good Cyber Hygiene</div>
                        <div class="level-detail">
                            <strong>110 practices</strong> aligned to NIST SP 800-171 Rev 2<br>
                            <strong>Assessment:</strong> Third-party (C3PAO) for critical programs; self-assessment for select non-critical programs<br>
                            <strong>Protects:</strong> Controlled Unclassified Information (CUI)<br>
                            <strong>Scope:</strong> Comprehensive security across all 14 domains -- the full set of NIST 800-171 requirements covering access control, audit, configuration management, incident response, and more.
                        </div>
                    </div>
                    <div class="level-card level-3">
                        <div class="level-num">Level 3 -- Expert</div>
                        <div class="level-name">Advanced / Progressive</div>
                        <div class="level-detail">
                            <strong>110+ practices</strong> (NIST SP 800-171 + select NIST SP 800-172 requirements)<br>
                            <strong>Assessment:</strong> Government-led (DIBCAC)<br>
                            <strong>Protects:</strong> CUI against Advanced Persistent Threats (APTs)<br>
                            <strong>Scope:</strong> Enhanced security for the most sensitive programs -- adds proactive measures like threat hunting, advanced incident response, and security operations to counter nation-state-level adversaries.
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>\ud83d\udd17 Key Relationships</h2>
                <ul>
                    <li><strong>NIST SP 800-171:</strong> CMMC Level 2 maps one-to-one with the 110 security requirements in NIST SP 800-171 Rev 2. If you are already compliant with 800-171, you are well-positioned for Level 2.</li>
                    <li><strong>NIST SP 800-172:</strong> CMMC Level 3 incorporates additional enhanced security requirements from 800-172, designed for protecting CUI against advanced persistent threats.</li>
                    <li><strong>FAR 52.204-21:</strong> The 15 basic safeguarding requirements in FAR clause 52.204-21 form the foundation of CMMC Level 1's 17 practices.</li>
                    <li><strong>DFARS 252.204-7012:</strong> This existing clause requires contractors handling CUI to implement NIST SP 800-171. CMMC adds the verification mechanism that DFARS lacked.</li>
                    <li><strong>FedRAMP:</strong> Cloud service providers (CSPs) used for CUI must meet FedRAMP Moderate baseline or equivalent, ensuring cloud environments meet the same rigor as on-premises systems.</li>
                </ul>
            </div>
        `;
    }

    function renderDomains() {
        const totalPractices = CMMC_DOMAINS.reduce((sum, d) => sum + d.practices, 0);
        const domainCards = CMMC_DOMAINS.map(d => `
            <a class="domain-card" href="${d.href}">
                <div class="domain-card-code">${d.code}</div>
                <div class="domain-card-name">${d.name}</div>
                <div class="domain-card-meta">
                    <span class="domain-card-count">${d.practices} practice${d.practices !== 1 ? 's' : ''}</span>
                    <span class="domain-card-arrow">\u203a</span>
                </div>
            </a>
        `).join('');

        document.getElementById('panel-domains').innerHTML = `
            <div class="section">
                <h2>\ud83d\uddc2 CMMC Security Domains</h2>
                <p>The CMMC framework organizes its security requirements into <strong>14 domains</strong> containing a total of <strong>${totalPractices} practices</strong> at Level 2. Each domain addresses a specific area of cybersecurity, from controlling who can access systems to ensuring the integrity of information.</p>
                <p style="margin-top:.5rem;color:var(--text-muted);font-size:.82rem">Click any domain to explore its practices in detail.</p>
            </div>
            <div class="domain-grid">${domainCards}</div>
            <div class="callout" style="margin-top:1rem">
                <span class="callout-icon">\u2139\ufe0f</span>
                <div>
                    <div class="callout-title">Practice Counts</div>
                    <div class="callout-text">The practice counts shown above reflect the <strong>Level 2 (110 practices)</strong> totals per domain, which align with NIST SP 800-171 Rev 2 requirements. Level 1 uses a subset of 17 practices drawn from 6 of these domains. Level 3 adds enhanced requirements from NIST SP 800-172 on top of the Level 2 baseline.</div>
                </div>
            </div>

            <div class="section">
                <h2>\ud83d\udcca Domain Distribution</h2>
                <p>Not all domains carry equal weight. Access Control (AC) alone accounts for <strong>22 of 110 practices</strong> (20%), while Personnel Security (PS) has only 2. The distribution reflects where the greatest security risks lie in protecting CUI.</p>
                <table class="assess-table">
                    <thead>
                        <tr><th scope="col">Domain</th><th scope="col">Code</th><th scope="col">Practices</th><th scope="col">Percentage</th></tr>
                    </thead>
                    <tbody>
                        ${CMMC_DOMAINS.map(d => `<tr><td>${d.name}</td><td>${d.code}</td><td>${d.practices}</td><td>${Math.round(d.practices / totalPractices * 100)}%</td></tr>`).join('')}
                        <tr style="border-top:1px solid var(--card-border)"><td><strong>Total</strong></td><td></td><td><strong>${totalPractices}</strong></td><td><strong>100%</strong></td></tr>
                    </tbody>
                </table>
            </div>
        `;
    }

    function renderAssessment() {
        document.getElementById('panel-assessment').innerHTML = `
            <div class="section">
                <h2>\ud83d\udccb Assessment Types</h2>
                <p>CMMC 2.0 defines three assessment methods, each corresponding to a maturity level:</p>
                <table class="assess-table">
                    <thead>
                        <tr><th scope="col">Level</th><th scope="col">Assessment Type</th><th scope="col">Conducted By</th><th scope="col">Frequency</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Level 1</strong></td>
                            <td>Self-assessment</td>
                            <td>Organization (internal)</td>
                            <td>Annual</td>
                        </tr>
                        <tr>
                            <td><strong>Level 2</strong></td>
                            <td>Third-party assessment (or self-assessment for non-critical)</td>
                            <td>C3PAO (CMMC Third-Party Assessment Organization) / Internal</td>
                            <td>Triennial (third-party) / Annual (self)</td>
                        </tr>
                        <tr>
                            <td><strong>Level 3</strong></td>
                            <td>Government-led assessment</td>
                            <td>DIBCAC (Defense Industrial Base Cybersecurity Assessment Center)</td>
                            <td>Triennial</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="section">
                <h2>\ud83d\udcdd Plan of Action & Milestones (POA&M)</h2>
                <p>A <strong>POA&M</strong> documents security gaps an organization has identified but not yet remediated. Under CMMC 2.0:</p>
                <ul>
                    <li>POA&Ms are permitted for <strong>Level 2</strong> assessments, allowing conditional certification while gaps are being closed</li>
                    <li>Not all practices are eligible for POA&M -- some are considered too critical to defer (e.g., multi-factor authentication, FIPS-validated encryption)</li>
                    <li>Organizations have a <strong>180-day closeout window</strong> to remediate POA&M items after conditional certification</li>
                    <li>Failure to close POA&M items within the window results in loss of certification status</li>
                    <li>Level 1 self-assessments do not use POA&Ms -- all 17 practices must be fully implemented</li>
                </ul>
            </div>

            <div class="section">
                <h2>\ud83d\udcca SPRS Score</h2>
                <p>The <strong>Supplier Performance Risk System (SPRS)</strong> score is a numerical representation of an organization's compliance with NIST SP 800-171:</p>
                <ul>
                    <li><strong>Maximum score: 110</strong> -- indicates full implementation of all 110 NIST SP 800-171 requirements</li>
                    <li><strong>Minimum possible: -203</strong> -- indicates no requirements have been implemented</li>
                    <li>Each unimplemented requirement reduces the score by 1, 3, or 5 points depending on severity</li>
                    <li>Contractors must submit their SPRS score to the DoD via the SPRS portal</li>
                    <li>The score serves as a pre-qualification indicator -- contracting officers can view scores when making award decisions</li>
                    <li>A high SPRS score does not replace CMMC certification; it supplements it</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\u26a0\ufe0f</span>
                <div>
                    <div class="callout-title">False Claims Act Risk</div>
                    <div class="callout-text">
                        Submitting an inaccurate SPRS score or falsely claiming CMMC compliance can trigger <strong>False Claims Act</strong> liability. The DoJ has already pursued cases against contractors for misrepresenting their cybersecurity posture. Ensure your self-assessment is honest and well-documented -- the consequences of fraud far outweigh the cost of remediation.
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>\ud83d\udcc6 Implementation Timeline</h2>
                <p>CMMC requirements are being phased in through DoD contract solicitations:</p>
                <div class="timeline">
                    <div class="timeline-item">
                        <div class="timeline-date">2024</div>
                        <div class="timeline-text"><strong>Final Rule Published</strong> -- 32 CFR Part 170 (CMMC Program) published in the Federal Register, establishing the regulatory framework.</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-date">2025</div>
                        <div class="timeline-text"><strong>Phase 1</strong> -- CMMC Level 1 self-assessments and Level 2 self-assessments begin appearing in select contract solicitations as a requirement.</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-date">2025-2026</div>
                        <div class="timeline-text"><strong>Phase 2</strong> -- CMMC Level 2 C3PAO assessments required in solicitations for contracts involving CUI on critical programs.</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-date">2026-2027</div>
                        <div class="timeline-text"><strong>Phase 3</strong> -- CMMC Level 3 government-led assessments begin for the highest-sensitivity programs.</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-date">2028+</div>
                        <div class="timeline-text"><strong>Full Implementation</strong> -- CMMC requirements included in all applicable DoD contracts. No waivers for non-compliance.</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>\ud83d\udcb0 Cost Considerations</h2>
                <p>CMMC compliance involves both direct and indirect costs:</p>
                <ul>
                    <li><strong>C3PAO Assessment Fees:</strong> Third-party assessments for Level 2 are estimated at $30,000-$100,000+ depending on organization size, scope, and number of assessment days required.</li>
                    <li><strong>Technology Investment:</strong> Implementing required controls may require new tools -- SIEM, MFA, encryption solutions, endpoint detection, backup systems, and secure cloud environments.</li>
                    <li><strong>Managed Security Services:</strong> Many small and mid-size contractors use Managed Service Providers (MSPs) or Managed Security Service Providers (MSSPs) to meet requirements they cannot staff internally.</li>
                    <li><strong>Staff Training:</strong> Security awareness training, role-based training, and specialized training for IT/security staff are ongoing requirements.</li>
                    <li><strong>Documentation:</strong> System Security Plans (SSP), POA&Ms, policies, and procedures all require development and maintenance by qualified personnel.</li>
                    <li><strong>Enclave Strategy:</strong> Organizations can reduce scope (and cost) by isolating CUI into a defined enclave rather than applying Level 2 controls across the entire network.</li>
                </ul>
            </div>

            <div class="callout">
                <span class="callout-icon">\ud83d\udca1</span>
                <div>
                    <div class="callout-title">Getting Started</div>
                    <div class="callout-text">
                        The most cost-effective approach is to begin with a <strong>gap analysis</strong> against NIST SP 800-171. Identify which of the 110 requirements you already meet, which have partial implementation, and which are missing entirely. This gives you an accurate SPRS score and a clear roadmap. Many organizations find they already meet 40-60% of requirements through existing IT best practices.
                    </div>
                </div>
            </div>
        `;
    }

    function renderQuiz(answered, savedScore) {
        const panel = document.getElementById('panel-quiz');
        const totalQ = QUIZ_QUESTIONS.length;
        const answeredCount = Object.keys(answered).length;
        const correctCount = Object.values(answered).filter(a => a.correct).length;
        const allDone = answeredCount === totalQ;

        let html = '';
        if (allDone) {
            const pct = Math.round(correctCount / totalQ * 100);
            html += `<div class="score-bar">
                <div class="score-num">${pct}%</div>
                <div class="score-label">${correctCount} of ${totalQ} correct${pct >= 70 ? ' -- Passed!' : ' -- 70% required to pass'}</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${pct}%"></div></div>
                <button class="reset-btn" id="quizReset">Retake Quiz</button>
            </div>`;
        } else {
            html += `<div class="score-bar">
                <div class="score-num">${answeredCount} / ${totalQ}</div>
                <div class="score-label">Questions answered</div>
                <div class="score-bar-visual"><div class="score-fill" style="width:${Math.round(answeredCount/totalQ*100)}%"></div></div>
            </div>`;
        }

        QUIZ_QUESTIONS.forEach((q, i) => {
            const a = answered[i];
            html += `<div class="quiz-q" data-qi="${i}">
                <div class="quiz-q-num">Question ${i+1} of ${totalQ}</div>
                <div class="quiz-q-text">${q.q}</div>
                ${q.opts.map((opt, oi) => {
                    let cls = 'quiz-opt';
                    if (a) {
                        cls += ' answered';
                        if (oi === q.correct) cls += ' correct';
                        else if (oi === a.selected && !a.correct) cls += ' wrong';
                        if (oi === q.correct && a.selected !== q.correct) cls += ' right-answer';
                    }
                    return `<button class="${cls}" data-qi="${i}" data-oi="${oi}" ${a ? 'disabled' : ''}>${opt}</button>`;
                }).join('')}
                <div class="quiz-explanation${a ? ' show' : ''}">${q.explain}</div>
            </div>`;
        });

        panel.innerHTML = html;

        // Bind option clicks
        panel.querySelectorAll('.quiz-opt:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => {
                const qi = parseInt(btn.dataset.qi);
                const oi = parseInt(btn.dataset.oi);
                const q = QUIZ_QUESTIONS[qi];
                const isCorrect = oi === q.correct;

                const state = getState();
                if (!state.quizAnswered) state.quizAnswered = {};
                state.quizAnswered[qi] = { selected: oi, correct: isCorrect };

                const newCount = Object.keys(state.quizAnswered).length;
                if (newCount === totalQ) {
                    const score = Object.values(state.quizAnswered).filter(a => a.correct).length;
                    state.quizScore = Math.round(score / totalQ * 100);

                    if (typeof GameTracker !== 'undefined') {
                        try {
                            GameTracker.record({
                                game: 'cmmc-overview-quiz',
                                score: state.quizScore,
                                maxScore: 100,
                                details: { correct: score, total: totalQ }
                            });
                        } catch(e) { /* non-critical */ }
                    }
                }
                saveState(state);
                renderQuiz(state.quizAnswered, state.quizScore);
            });
        });

        // Reset button
        const resetBtn = document.getElementById('quizReset');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const state = getState();
                state.quizAnswered = {};
                state.quizScore = null;
                saveState(state);
                renderQuiz({}, null);
            });
        }
    }

    // Mark the "overview" tab as read on load
    const initState = getState();
    if (!initState.tabsRead) initState.tabsRead = {};
    initState.tabsRead['overview'] = true;
    saveState(initState);

    render();
})();
</script>
