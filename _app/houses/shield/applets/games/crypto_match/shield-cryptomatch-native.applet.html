<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoMatch - Shield House</title>
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #c8c8d0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .top-bar { display: flex; align-items: center; padding: 10px 20px; background: #111118; border-bottom: 1px solid #dc143c33; }
        .back-btn { color: #dc143c; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: color .2s; }
        .back-btn:hover { color: #ff3355; }
        .top-bar h1 { flex: 1; text-align: center; font-size: 20px; color: #dc143c; letter-spacing: 1px; }

        .game-wrap { max-width: 960px; margin: 0 auto; padding: 20px; }

        /* Start */
        .start-screen { text-align: center; padding: 50px 20px; }
        .start-screen .hero { font-size: 72px; margin-bottom: 16px; }
        .start-screen h2 { color: #dc143c; font-size: 32px; margin-bottom: 8px; }
        .start-screen .sub { color: #888; font-size: 15px; margin-bottom: 12px; }
        .mode-select { display: flex; gap: 16px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
        .mode-btn { background: #13131d; border: 2px solid #1e1e2e; color: #c8c8d0; padding: 16px 24px; border-radius: 10px; cursor: pointer; transition: all .2s; text-align: center; min-width: 160px; }
        .mode-btn:hover { border-color: #dc143c55; }
        .mode-btn.active { border-color: #dc143c; background: #1a0a10; }
        .mode-btn .size { font-size: 24px; font-weight: 700; color: #dc143c; }
        .mode-btn .label { font-size: 13px; color: #888; margin-top: 4px; }
        .btn { background: #dc143c; color: #fff; border: none; padding: 12px 32px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: all .2s; }
        .btn:hover { background: #ff1a4a; transform: scale(1.03); }
        .btn:disabled { background: #333; cursor: default; transform: none; }
        .btn-outline { background: transparent; border: 2px solid #dc143c; color: #dc143c; }
        .btn-outline:hover { background: #dc143c22; }

        /* HUD */
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .hud-item { font-size: 14px; color: #888; }
        .hud-item span { color: #dc143c; font-weight: 700; }

        /* Card Grid */
        .card-grid { display: grid; gap: 12px; justify-content: center; }
        .card-grid.size-16 { grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
        .card-grid.size-24 { grid-template-columns: repeat(6, 1fr); max-width: 780px; margin: 0 auto; }

        .flip-card { perspective: 800px; height: 120px; cursor: pointer; }
        @media (max-width: 600px) { .flip-card { height: 100px; } }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-card.matched .flip-inner { transform: rotateY(180deg); }

        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 8px; text-align: center; }
        .flip-front { background: linear-gradient(135deg, #1a1a28, #13131d); border: 2px solid #2a2a3a; font-size: 32px; color: #dc143c; }
        .flip-front::after { content: '\uD83D\uDD10'; }
        .flip-back { background: #13131d; border: 2px solid #dc143c55; transform: rotateY(180deg); font-size: 12px; line-height: 1.4; color: #c8c8d0; padding: 10px; overflow: hidden; }
        .flip-back.is-term { font-size: 15px; font-weight: 600; color: #dc143c; }

        .flip-card.matched .flip-front { border-color: #22c55e; }
        .flip-card.matched .flip-back { border-color: #22c55e; background: #0a1a10; }
        .flip-card.wrong .flip-back { border-color: #ef4444; background: #1a0a0a; }

        /* Results */
        .results { text-align: center; padding: 40px 20px; }
        .results h2 { color: #dc143c; font-size: 28px; margin-bottom: 16px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 500px; margin: 20px auto; }
        .stat-box { background: #13131d; border: 1px solid #1e1e2e; border-radius: 10px; padding: 16px; }
        .stat-box .val { font-size: 28px; font-weight: 700; color: #dc143c; }
        .stat-box .label { font-size: 12px; color: #888; margin-top: 4px; }
        .badge { display: inline-block; background: #dc143c22; border: 1px solid #dc143c44; color: #dc143c; padding: 8px 20px; border-radius: 20px; font-size: 14px; margin: 16px 0; }
        .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../../../index.html" class="back-btn">&#8592; Shield House</a>
        <h1>CryptoMatch</h1>
        <div style="width:100px"></div>
    </div>

    <div class="game-wrap">
        <!-- Start Screen -->
        <div id="startScreen" class="start-screen">
            <div class="hero"><img src="/assets/images/icons/icon-padlock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
            <h2>CryptoMatch</h2>
            <p class="sub">Match cryptography terms to their definitions.<br>Flip cards, find pairs, and master the language of encryption.</p>
            <div class="mode-select">
                <div class="mode-btn active" data-size="16" onclick="Game.selectMode(16, this)">
                    <div class="size">4 x 4</div>
                    <div class="label">8 pairs &mdash; Standard</div>
                </div>
                <div class="mode-btn" data-size="24" onclick="Game.selectMode(24, this)">
                    <div class="size">6 x 4</div>
                    <div class="label">12 pairs &mdash; Challenge</div>
                </div>
            </div>
            <button class="btn" onclick="Game.start()">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div class="hud">
                <div class="hud-item">Pairs: <span id="hudPairs">0 / 8</span></div>
                <div class="hud-item">Moves: <span id="hudMoves">0</span></div>
                <div class="hud-item">Time: <span id="hudTime">0:00</span></div>
            </div>
            <div class="card-grid" id="cardGrid"></div>
        </div>

        <!-- Results -->
        <div id="resultsScreen" class="hidden results"></div>
    </div>

    <script>
    const Game = (() => {
        const PAIRS = [
            { term: 'AES', def: 'Advanced Encryption Standard \u2014 a symmetric block cipher using 128/192/256-bit keys. The gold standard for encrypting data at rest and in transit.' },
            { term: 'RSA', def: 'Asymmetric algorithm based on the difficulty of factoring large prime numbers. Used for key exchange and digital signatures.' },
            { term: 'Diffie-Hellman', def: 'Key exchange protocol that lets two parties create a shared secret over an insecure channel without ever transmitting the key.' },
            { term: 'SHA-256', def: 'Cryptographic hash function producing a 256-bit digest. Used in TLS, Bitcoin, and file integrity verification.' },
            { term: 'HMAC', def: 'Hash-based Message Authentication Code \u2014 combines a hash function with a secret key to verify both integrity and authenticity.' },
            { term: 'PKI', def: 'Public Key Infrastructure \u2014 the framework of CAs, certificates, and policies that binds public keys to identities.' },
            { term: 'Certificate Authority', def: 'Trusted entity that issues and signs digital certificates, vouching that a public key belongs to the named subject.' },
            { term: 'Digital Signature', def: 'Encrypted hash of a message created with the sender\'s private key, providing authentication, integrity, and non-repudiation.' },
            { term: 'Symmetric Key', def: 'A single shared key used for both encryption and decryption. Fast but requires secure key distribution.' },
            { term: 'Asymmetric Key', def: 'A key pair (public + private) where one encrypts and only the other decrypts. Solves the key distribution problem.' },
            { term: 'Block Cipher', def: 'Encrypts fixed-size blocks of plaintext (e.g., 128 bits). AES and DES are examples. Uses modes like CBC and GCM.' },
            { term: 'Stream Cipher', def: 'Encrypts data one bit or byte at a time using a keystream. RC4 and ChaCha20 are examples. Fast for real-time data.' },
            { term: 'Salt', def: 'Random data added to a password before hashing, ensuring identical passwords produce different hashes. Defeats rainbow tables.' },
            { term: 'Nonce', def: 'A number used once \u2014 prevents replay attacks by ensuring each cryptographic operation is unique.' },
            { term: 'Initialization Vector', def: 'Random value used with a key to start a cipher, ensuring the same plaintext encrypts differently each time. Must not repeat.' },
            { term: 'Key Exchange', def: 'The process of securely sharing cryptographic keys between parties. Diffie-Hellman and RSA key transport are common methods.' },
            { term: 'Co-Prime Numbers', def: 'Two integers whose only common factor is 1 (GCD = 1). Critical in RSA for choosing e relative to the totient.' },
            { term: 'Euler\'s Totient', def: 'Function \u03C6(n) counting integers less than n that are co-prime to n. In RSA: \u03C6(n) = (p-1)(q-1), used to compute the private key.' },
            { term: 'Elliptic Curve', def: 'Cryptography based on algebraic curves over finite fields. Provides equivalent security to RSA with much smaller key sizes (256 vs 3072 bits).' },
            { term: 'Key Derivation', def: 'Function (KDF) that transforms a password or shared secret into one or more cryptographic keys. PBKDF2, scrypt, and Argon2 are examples.' }
        ];

        let gridSize = 16;
        let cards = [];
        let flipped = [];
        let matched = 0;
        let totalPairs = 0;
        let moves = 0;
        let seconds = 0;
        let timer = null;
        let locked = false;

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function selectMode(size, el) {
            gridSize = size;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function start() {
            totalPairs = gridSize / 2;
            matched = 0;
            moves = 0;
            seconds = 0;
            flipped = [];
            locked = false;

            // Pick random subset of pairs
            const selected = shuffle(PAIRS).slice(0, totalPairs);

            // Create card array: each pair becomes a term card and a def card
            cards = [];
            selected.forEach((p, i) => {
                cards.push({ id: i, type: 'term', text: p.term, pairId: i });
                cards.push({ id: i, type: 'def', text: p.def, pairId: i });
            });
            cards = shuffle(cards);

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            renderGrid();
            startTimer();
            updateHud();
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                document.getElementById('hudTime').textContent = m + ':' + String(s).padStart(2, '0');
            }, 1000);
        }

        function renderGrid() {
            const grid = document.getElementById('cardGrid');
            grid.className = 'card-grid size-' + gridSize;
            grid.innerHTML = '';

            cards.forEach((c, idx) => {
                const card = document.createElement('div');
                card.className = 'flip-card';
                card.dataset.idx = idx;
                card.innerHTML = `
                    <div class="flip-inner">
                        <div class="flip-front"></div>
                        <div class="flip-back ${c.type === 'term' ? 'is-term' : ''}">${c.text}</div>
                    </div>
                `;
                card.addEventListener('click', () => flipCard(idx, card));
                grid.appendChild(card);
            });
        }

        function flipCard(idx, el) {
            if (locked) return;
            if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
            if (flipped.length >= 2) return;

            el.classList.add('flipped');
            flipped.push({ idx, el, card: cards[idx] });

            if (flipped.length === 2) {
                moves++;
                updateHud();
                checkMatch();
            }
        }

        function checkMatch() {
            const [a, b] = flipped;
            locked = true;

            if (a.card.pairId === b.card.pairId && a.card.type !== b.card.type) {
                // Match
                setTimeout(() => {
                    a.el.classList.add('matched');
                    b.el.classList.add('matched');
                    matched++;
                    updateHud();
                    flipped = [];
                    locked = false;

                    if (matched === totalPairs) {
                        setTimeout(showResults, 600);
                    }
                }, 500);
            } else {
                // No match
                a.el.classList.add('wrong');
                b.el.classList.add('wrong');
                setTimeout(() => {
                    a.el.classList.remove('flipped', 'wrong');
                    b.el.classList.remove('flipped', 'wrong');
                    flipped = [];
                    locked = false;
                }, 1000);
            }
        }

        function updateHud() {
            document.getElementById('hudPairs').textContent = matched + ' / ' + totalPairs;
            document.getElementById('hudMoves').textContent = moves;
        }

        function showResults() {
            clearInterval(timer);
            document.getElementById('gameScreen').classList.add('hidden');
            const res = document.getElementById('resultsScreen');
            res.classList.remove('hidden');

            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            const timeStr = m + ':' + String(s).padStart(2, '0');
            const efficiency = Math.round((totalPairs / moves) * 100);

            let badge;
            if (moves <= totalPairs + 2) badge = 'Cipher Master';
            else if (moves <= totalPairs * 2) badge = 'Cryptanalyst';
            else if (moves <= totalPairs * 3) badge = 'Code Breaker';
            else badge = 'Apprentice';

            res.innerHTML = `
                <h2>All Pairs Found!</h2>
                <div class="badge">${badge}</div>
                <div class="stat-grid">
                    <div class="stat-box"><div class="val">${totalPairs}</div><div class="label">Pairs Matched</div></div>
                    <div class="stat-box"><div class="val">${moves}</div><div class="label">Moves</div></div>
                    <div class="stat-box"><div class="val">${timeStr}</div><div class="label">Time</div></div>
                </div>
                <p style="color:#888;font-size:14px;margin:12px 0">Efficiency: ${efficiency}% &mdash; ${gridSize === 24 ? 'Challenge' : 'Standard'} mode</p>
                <div class="btn-row">
                    <button class="btn" onclick="Game.start()">Play Again</button>
                    <button class="btn btn-outline" onclick="Game.toStart()">Change Mode</button>
                    <a href="../../../index.html" class="btn btn-outline" style="text-decoration:none;display:inline-flex;align-items:center">Back to Shield</a>
                </div>
            `;

            // Save best score
            const key = 'hexworth_shield_cryptomatch';
            const existing = JSON.parse(localStorage.getItem(key) || '{}');
            const modeKey = 'best_' + gridSize;
            const prev = existing[modeKey] || { moves: 9999, time: 9999 };
            const isBetter = moves < prev.moves || (moves === prev.moves && seconds < prev.time);

            existing.completed = true;
            existing.lastPlayed = new Date().toISOString();
            existing.attempts = (existing.attempts || 0) + 1;
            if (isBetter) {
                existing[modeKey] = { moves, time: seconds, efficiency };
            }
            localStorage.setItem(key, JSON.stringify(existing));
        }

        function toStart() {
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        return { selectMode, start, toStart };
    })();
    </script>
    <script src="../../../../../components/GameTracker.js"></script>
</body>
</html>
