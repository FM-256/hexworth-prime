<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Hacking Case Study | House of Shield</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }
        .back-link {
            color: #64b5f6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
        .game-frame {
            width: 100%;
            height: calc(100vh - 100px);
            border: none;
        }
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background: #111;
            border-top: 1px solid #333;
            gap: 20px;
        }
        .complete-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
        .complete-btn.completed {
            background: #555;
            cursor: default;
        }
    </style>
    <script src="../../../../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">Ethical Hacking Case Study | House of Shield</h1>
    <div class="top-bar">
        <a href="../../../index.html" class="back-link">← Back</a>
        <span style="color: #888; font-size: 0.85rem;">Ethical Hacking Case Study</span>
    </div>
    <div style="display: flex; justify-content: center; padding: 20px; overflow: auto; flex: 1;">
        <div id="ehexam1a_hype_container" class="HYPE_document" style="position:relative;width:1024px;height:768px;overflow:hidden;">
            <script type="text/javascript" charset="utf-8" src="EH_exam_1A.hyperesources/ehexam1a_hype_generated_script.js"></script>
        </div>
    </div>
    <div class="bottom-bar">
        <button class="complete-btn" id="completeBtn" onclick="markComplete()">✓ Mark Complete</button>
    </div>
<script>
function saveProgress() {
    try {
        const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
        if (!progress.shield) progress.shield = {};
        progress.shield['ethical-hacking-case'] = {
            completed: true,
            completedAt: new Date().toISOString(),
            score: 100
        };
        localStorage.setItem('hexworth_progress', JSON.stringify(progress));
    } catch (e) {
        console.warn('[Shield] Failed to save:', e);
    }
}

function markComplete() {
            if (typeof ModuleProgress !== 'undefined') ModuleProgress.complete('shield', 'shield-ethical-hacking-case');
    saveProgress();
    // Award XP (one-time)
    if (!localStorage.getItem('game_ethcase_xp_awarded')) {
        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
        localStorage.setItem('hexworth_xp', (currentXP + 40).toString());
        localStorage.setItem('game_ethcase_xp_awarded', 'true');
        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
            FirestoreManager.addXP(null, 40, 'Ethical Hacking Case Complete'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
        }
    }
    // Award achievement
    if (typeof AchievementManager !== 'undefined') {
        AchievementManager.unlock('game_ethcase');
    }
    const btn = document.getElementById('completeBtn');
    btn.textContent = '✓ Completed!';
    btn.classList.add('completed');
    btn.disabled = true;
}

// Check if already completed
(function() {
    const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
    if (progress.shield && progress.shield['ethical-hacking-case']?.completed) {
        const btn = document.getElementById('completeBtn');
        if (btn) { btn.textContent = '✓ Completed!'; btn.classList.add('completed'); btn.disabled = true; }
    }
})();
</script>
<script src="../../../../../components/AchievementManager.js"></script>
</body>
</html>
