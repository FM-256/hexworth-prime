<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 4: Microsoft Compliance Solutions",
            description: "Test your understanding of Purview, DLP, sensitivity labels, eDiscovery, insider risk, and Azure governance",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc900-ch04-quiz",
            moduleId: "sc900-ch04-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is Microsoft Purview Compliance Manager?",
                    "options": [
                              "An antivirus tool",
                              "A dashboard that measures compliance posture with a compliance score and provides improvement actions",
                              "A network monitoring tool",
                              "A database management system"
                    ],
                    "explanation": "Compliance Manager is a dashboard within the Microsoft Purview compliance portal that provides a compliance score based on completed improvement actions. It maps controls to 300+ regulatory standards (GDPR, HIPAA, ISO 27001) and provides step-by-step remediation guidance."
          },
          {
                    "question": "What are sensitivity labels?",
                    "options": [
                              "Password strength indicators",
                              "Persistent metadata tags that can encrypt, watermark, and restrict access to documents",
                              "Network priority markers",
                              "User permission levels"
                    ],
                    "explanation": "Sensitivity labels are persistent, machine-readable metadata applied to documents and emails. They can trigger protection actions: encrypt the file, add visual markings (header, footer, watermark), and restrict access. Labels travel with the data even when shared externally."
          },
          {
                    "question": "What is the purpose of Data Loss Prevention (DLP) policies?",
                    "options": [
                              "Backing up data",
                              "Detecting and preventing accidental or intentional sharing of sensitive information",
                              "Compressing data",
                              "Indexing data for search"
                    ],
                    "explanation": "DLP policies detect sensitive information types in content across Microsoft 365 services (Exchange, SharePoint, OneDrive, Teams) and enforce protective actions: block sharing, encrypt, notify the user, or alert administrators. They prevent sensitive data from leaving the organization."
          },
          {
                    "question": "What is a DLP policy tip?",
                    "options": [
                              "A tooltip showing DLP configuration options",
                              "A real-time notification to users when they attempt to share sensitive data",
                              "An alert sent to the security team",
                              "A diagnostic log entry"
                    ],
                    "explanation": "Policy tips are real-time notifications displayed to users when they attempt an action that violates a DLP policy. They educate users in the moment without necessarily blocking them. Users may be able to override with a business justification, promoting awareness over rigid enforcement."
          },
          {
                    "question": "What is the difference between retention policies and retention labels?",
                    "options": [
                              "They are identical",
                              "Policies apply broadly to locations while labels apply to individual items",
                              "Policies are for email and labels are for files",
                              "Labels are automatic and policies are manual"
                    ],
                    "explanation": "Retention policies apply broadly to entire locations (all Exchange mailboxes, all SharePoint sites). Retention labels apply at the item level to individual documents, emails, or folders. Labels can also mark items as records, providing more granular lifecycle control."
          },
          {
                    "question": "What is eDiscovery used for?",
                    "options": [
                              "Discovering new Azure services",
                              "Identifying, collecting, and producing electronically stored information for legal proceedings",
                              "Finding security vulnerabilities",
                              "Monitoring network traffic"
                    ],
                    "explanation": "eDiscovery is the process of identifying, collecting, and producing electronically stored information (ESI) for legal proceedings, regulatory investigations, or internal audits. Microsoft Purview provides Content Search, eDiscovery Standard, and eDiscovery Premium tiers."
          },
          {
                    "question": "What does a legal hold in eDiscovery do?",
                    "options": [
                              "Locks a user account",
                              "Preserves content to prevent deletion even if retention policies would allow it",
                              "Blocks network access",
                              "Encrypts all emails"
                    ],
                    "explanation": "A legal hold preserves relevant content in place, preventing users or automated policies from deleting it. This ensures that potential evidence for legal proceedings is not destroyed. Holds can be placed on specific mailboxes, SharePoint sites, or individual custodians."
          },
          {
                    "question": "What is insider risk management in Microsoft Purview?",
                    "options": [
                              "Managing external threats",
                              "Detecting and responding to risky activities by people inside the organization",
                              "Managing insider trading regulations",
                              "Controlling physical building access"
                    ],
                    "explanation": "Insider risk management uses behavioral signals (not content inspection) to detect potentially risky activities by employees, contractors, or partners. It correlates signals like file downloads, USB copies, email patterns, and HR events to identify anomalous behavior."
          },
          {
                    "question": "What does Azure Policy do?",
                    "options": [
                              "Manages user passwords",
                              "Enforces organizational standards and assesses compliance for Azure resources",
                              "Routes network traffic",
                              "Manages DNS records"
                    ],
                    "explanation": "Azure Policy evaluates Azure resources against policy definitions and flags or prevents non-compliant configurations. Policy effects include Deny (block creation), Audit (log only), DeployIfNotExists (auto-remediate), and Modify (change properties at deployment time)."
          },
          {
                    "question": "What are the two types of Azure resource locks?",
                    "options": [
                              "Read and Write",
                              "CanNotDelete and ReadOnly",
                              "Lock and Unlock",
                              "Soft and Hard"
                    ],
                    "explanation": "CanNotDelete allows reading and modifying the resource but prevents deletion. ReadOnly allows only reading -- no modifications or deletions. Locks can be applied at the subscription, resource group, or individual resource level and inherit downward to child resources."
          },
          {
                    "question": "What is an Azure Blueprint?",
                    "options": [
                              "A network diagram",
                              "A package of ARM templates, policy assignments, and role assignments for repeatable environment deployments",
                              "A backup plan",
                              "A monitoring dashboard"
                    ],
                    "explanation": "Azure Blueprints define a repeatable set of Azure resources with governance controls. A blueprint packages ARM templates, policy assignments, role assignments, and resource groups. Blueprints are version-controlled and auditable, enabling consistent environment deployments."
          },
          {
                    "question": "What is the compliance score in Microsoft Purview?",
                    "options": [
                              "A score measuring network speed",
                              "A numerical score (0-100%) based on completed improvement actions for regulatory compliance",
                              "A password strength score",
                              "A risk score for endpoints"
                    ],
                    "explanation": "The compliance score ranges from 0% to 100% based on completed improvement actions. Microsoft-managed actions contribute to the baseline score. Customer-managed actions increase the score further. Higher score indicates better compliance with selected regulatory standards."
          },
          {
                    "question": "What are trainable classifiers in Microsoft Purview?",
                    "options": [
                              "Machine learning models trained on sample data to detect specific content types",
                              "User training modules",
                              "Classroom scheduling tools",
                              "Network classification algorithms"
                    ],
                    "explanation": "Trainable classifiers use machine learning to identify content types. Pre-trained classifiers detect resumes, source code, harassment, and threats. Custom trainable classifiers can be trained on your organization-specific data patterns to detect proprietary content categories."
          },
          {
                    "question": "What is communication compliance in Microsoft Purview?",
                    "options": [
                              "Monitoring network bandwidth",
                              "Monitoring communications for policy violations like harassment or regulatory non-compliance",
                              "Managing email server configuration",
                              "Testing communication protocols"
                    ],
                    "explanation": "Communication compliance monitors communications across email, Teams, and third-party platforms for policy violations including harassment, threats, and regulatory compliance requirements (particularly in financial services). Classifiers detect inappropriate content and reviewers assess flagged messages."
          },
          {
                    "question": "What is the purpose of management groups in Azure?",
                    "options": [
                              "Managing user accounts",
                              "Organizing subscriptions into a hierarchy for applying Policy and RBAC at scale",
                              "Managing virtual machines",
                              "Managing storage accounts"
                    ],
                    "explanation": "Management groups organize Azure subscriptions into a hierarchy. Azure Policy and RBAC assignments at the management group level inherit to all child subscriptions. This enables governance at scale across multiple subscriptions without configuring each one individually."
          }
]
        });
        quiz.start();
    </script>
