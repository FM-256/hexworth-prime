<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 2: Microsoft Entra ID",
            description: "Test your understanding of Entra ID concepts, authentication, Conditional Access, PIM, and external identities",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc900-ch02-quiz",
            moduleId: "sc900-ch02-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is a Microsoft Entra ID tenant?",
                    "options": [
                              "A virtual machine",
                              "A dedicated instance of Microsoft Entra ID representing an organization",
                              "A storage account",
                              "A network segment"
                    ],
                    "explanation": "A tenant is a dedicated, trusted instance of Microsoft Entra ID that is created automatically when an organization signs up for a Microsoft cloud service. Each tenant is distinct, separate, and has a unique tenant ID. It represents a single organization."
          },
          {
                    "question": "What is the primary difference between Microsoft Entra ID and on-premises Active Directory Domain Services?",
                    "options": [
                              "They are identical products",
                              "Entra ID uses HTTP-based protocols (SAML, OAuth, OpenID Connect) while AD DS uses Kerberos and LDAP",
                              "Entra ID is only for on-premises resources",
                              "AD DS is cloud-native"
                    ],
                    "explanation": "Microsoft Entra ID is a cloud-based identity service that uses modern HTTP-based protocols like SAML 2.0, OAuth 2.0, and OpenID Connect. AD DS uses Kerberos and LDAP. They can be synchronized via Entra Connect but are fundamentally different products."
          },
          {
                    "question": "What percentage of identity attacks does MFA block according to Microsoft?",
                    "options": [
                              "50%",
                              "75%",
                              "90%",
                              "99.9%"
                    ],
                    "explanation": "Microsoft reports that MFA blocks 99.9% of identity attacks. This makes MFA the single most effective control against credential-based attacks like password spray, credential stuffing, and phishing."
          },
          {
                    "question": "What is a FIDO2 security key?",
                    "options": [
                              "A software token on a phone",
                              "A hardware token using public-key cryptography that is phishing-resistant",
                              "A one-time password via SMS",
                              "A smart card for on-premises AD"
                    ],
                    "explanation": "FIDO2 security keys are hardware tokens that use public-key cryptography for authentication. They are phishing-resistant because the key is cryptographically bound to the origin domain -- a fake login page cannot intercept the credential."
          },
          {
                    "question": "What is Conditional Access in Microsoft Entra ID?",
                    "options": [
                              "A VPN service",
                              "The Zero Trust policy engine that evaluates signals and enforces access decisions",
                              "A type of encryption",
                              "A backup solution"
                    ],
                    "explanation": "Conditional Access is the Zero Trust policy engine for Microsoft Entra ID. It evaluates signals (user, location, device, application, risk level) and enforces access decisions: allow, block, or require additional verification like MFA."
          },
          {
                    "question": "Which Entra ID license is required for Conditional Access policies?",
                    "options": [
                              "Free",
                              "Microsoft 365 Apps",
                              "Premium P1",
                              "Premium P2"
                    ],
                    "explanation": "Conditional Access policies require Microsoft Entra ID Premium P1 licensing. P2 adds additional features like Identity Protection risk-based policies and Privileged Identity Management. The Free tier does not include Conditional Access."
          },
          {
                    "question": "What does PIM (Privileged Identity Management) provide?",
                    "options": [
                              "Permanent admin roles for all users",
                              "Just-in-time privileged access with time-limited role activation",
                              "Password management",
                              "Device management"
                    ],
                    "explanation": "PIM provides just-in-time privileged access. Users are eligible for roles but must activate them when needed. Activations expire after a set duration and can require approval and justification. This reduces the window of risk from compromised admin accounts."
          },
          {
                    "question": "What is the purpose of access reviews in Entra ID?",
                    "options": [
                              "To reset passwords",
                              "To periodically verify that users still need their current access",
                              "To create new users",
                              "To configure firewalls"
                    ],
                    "explanation": "Access reviews are periodic evaluations of who has access to what. Reviewers confirm or deny continued access for group memberships, app assignments, and role assignments. Users who are not confirmed can be automatically removed. Required for compliance audits."
          },
          {
                    "question": "What is B2B collaboration in Entra External ID?",
                    "options": [
                              "Business-to-consumer identity management",
                              "Inviting external users as guests who authenticate with their own identity provider",
                              "Backup-to-backup data replication",
                              "Browser-to-browser communication"
                    ],
                    "explanation": "B2B collaboration invites external users (partners, vendors, contractors) as guest users in your Entra ID tenant. They authenticate with their own identity provider -- you do not manage their credentials. You control what resources they can access in your tenant."
          },
          {
                    "question": "What does Microsoft Entra ID Protection detect?",
                    "options": [
                              "Network intrusions",
                              "Risky sign-ins and compromised user accounts",
                              "Malware on endpoints",
                              "Database vulnerabilities"
                    ],
                    "explanation": "Entra ID Protection detects risky sign-in attempts (impossible travel, anonymous IP, unfamiliar properties) and compromised user accounts (leaked credentials, anomalous activity). It assigns risk levels and can trigger risk-based Conditional Access policies."
          },
          {
                    "question": "What type of Entra ID group automatically adds members based on attribute rules?",
                    "options": [
                              "Security group",
                              "Distribution group",
                              "Dynamic group",
                              "Static group"
                    ],
                    "explanation": "Dynamic groups automatically add and remove members based on attribute rules (e.g., department equals Sales, jobTitle contains Manager). Membership updates automatically as user attributes change. This eliminates manual group management for large organizations."
          },
          {
                    "question": "What is single sign-on (SSO)?",
                    "options": [
                              "Signing in once and accessing all authorized applications without re-authenticating",
                              "Using the same password for all applications",
                              "Having only one application",
                              "Signing in to each application separately"
                    ],
                    "explanation": "SSO allows users to authenticate once with Microsoft Entra ID and then access all authorized applications without additional login prompts. Entra ID issues tokens that applications accept, eliminating the need for separate credentials per application."
          },
          {
                    "question": "What is entitlement management in Entra ID?",
                    "options": [
                              "Managing software licenses",
                              "Bundling resources into access packages that users can request through a self-service process",
                              "Managing encryption keys",
                              "Managing network routes"
                    ],
                    "explanation": "Entitlement management bundles resources (groups, apps, SharePoint sites) into access packages. Users request access through a self-service portal. Policies define who can request, who approves, and when access expires. This provides self-service access with governance controls."
          },
          {
                    "question": "Which Entra ID edition includes Identity Protection and PIM?",
                    "options": [
                              "Free",
                              "Microsoft 365 Apps",
                              "Premium P1",
                              "Premium P2"
                    ],
                    "explanation": "Premium P2 includes Identity Protection (risk-based Conditional Access policies) and Privileged Identity Management (just-in-time admin access with approval workflows). P1 includes Conditional Access but not the advanced risk-based and PIM features."
          },
          {
                    "question": "What authentication protocol does Microsoft Entra ID NOT use natively?",
                    "options": [
                              "SAML 2.0",
                              "OAuth 2.0",
                              "Kerberos",
                              "OpenID Connect"
                    ],
                    "explanation": "Kerberos is the authentication protocol used by on-premises Active Directory Domain Services, not by cloud-native Microsoft Entra ID. Entra ID uses SAML 2.0, OAuth 2.0, and OpenID Connect. Kerberos is only used in hybrid scenarios through Entra Domain Services or federation."
          }
]
        });
        quiz.start();
    </script>
