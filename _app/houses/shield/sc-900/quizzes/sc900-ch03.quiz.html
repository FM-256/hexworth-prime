<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to SC-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 3: Microsoft Security Solutions",
            description: "Test your understanding of Defender for Cloud, Sentinel, Defender suite, and Azure network security",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc900-ch03-quiz",
            moduleId: "sc900-ch03-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What does Microsoft Defender for Cloud provide?",
                    "options": [
                              "Email protection",
                              "Cloud Security Posture Management (CSPM) and Cloud Workload Protection (CWP)",
                              "Endpoint detection and response",
                              "DNS security"
                    ],
                    "explanation": "Defender for Cloud provides CSPM (secure score, security recommendations) in its free tier and Cloud Workload Protection through paid Defender plans for servers, storage, SQL, containers, and other workloads. It supports Azure, on-premises, AWS, and GCP."
          },
          {
                    "question": "What is the secure score in Defender for Cloud?",
                    "options": [
                              "A password strength rating",
                              "A numerical measure of your security posture based on recommendations",
                              "A network performance metric",
                              "A compliance certification"
                    ],
                    "explanation": "Secure score is a percentage (0-100%) that represents your security posture. Each recommendation you implement improves your score. Higher score means fewer exploitable misconfigurations. It helps prioritize security improvements by potential impact."
          },
          {
                    "question": "What is Microsoft Sentinel?",
                    "options": [
                              "An antivirus product",
                              "A cloud-native SIEM and SOAR solution",
                              "A VPN gateway",
                              "A load balancer"
                    ],
                    "explanation": "Microsoft Sentinel is a cloud-native Security Information and Event Management (SIEM) and Security Orchestration, Automation, and Response (SOAR) solution. It collects data at cloud scale, detects threats with analytics rules, investigates incidents, and automates response with playbooks."
          },
          {
                    "question": "What are Sentinel playbooks used for?",
                    "options": [
                              "Creating user accounts",
                              "Automating incident response workflows",
                              "Encrypting data",
                              "Managing virtual machines"
                    ],
                    "explanation": "Sentinel playbooks are automated response workflows built on Azure Logic Apps. When an incident fires, a playbook can block an IP in the firewall, disable a compromised user, create a ticket, or send a notification. They reduce mean time to respond (MTTR)."
          },
          {
                    "question": "What does Defender for Endpoint protect?",
                    "options": [
                              "Email servers",
                              "Endpoint devices (Windows, macOS, Linux, mobile)",
                              "Azure storage accounts",
                              "SQL databases"
                    ],
                    "explanation": "Defender for Endpoint is an enterprise endpoint security platform that protects Windows, macOS, Linux, Android, and iOS devices. It provides threat detection, attack surface reduction, endpoint detection and response (EDR), and automated investigation capabilities."
          },
          {
                    "question": "What are Safe Attachments in Defender for Office 365?",
                    "options": [
                              "Encrypted email attachments",
                              "Sandbox detonation of email attachments to detect malware before delivery",
                              "Compressed attachments",
                              "Digital signatures on attachments"
                    ],
                    "explanation": "Safe Attachments opens email attachments in a sandboxed virtual machine to detect malware before delivering them to the user. If the attachment is malicious, it is removed or the entire email is quarantined. This protects against zero-day malware."
          },
          {
                    "question": "What is a CASB?",
                    "options": [
                              "Cloud Access Security Broker -- provides visibility and control over cloud app usage",
                              "Certificate Authority Security Board",
                              "Cloud Application Security Backup",
                              "Centralized Authentication and Security Broker"
                    ],
                    "explanation": "A Cloud Access Security Broker (CASB) sits between users and cloud services to provide visibility, control, and data protection. Microsoft Defender for Cloud Apps is Microsoft CASB product. It discovers shadow IT, enforces session controls, and applies DLP policies across cloud applications."
          },
          {
                    "question": "What does Azure DDoS Protection Standard provide beyond the Basic tier?",
                    "options": [
                              "Basic antivirus",
                              "Adaptive tuning, real-time metrics, DDoS Rapid Response team access, and cost protection",
                              "Password management",
                              "Email filtering"
                    ],
                    "explanation": "DDoS Protection Standard adds adaptive tuning (learns your traffic patterns), real-time attack metrics, diagnostic logging, access to the DDoS Rapid Response team during active attacks, and a cost protection guarantee for resources scaled during an attack."
          },
          {
                    "question": "What is Azure Firewall?",
                    "options": [
                              "A hardware firewall appliance",
                              "A cloud-native managed network security service with stateful packet inspection",
                              "A client-side antivirus",
                              "A web browser extension"
                    ],
                    "explanation": "Azure Firewall is a cloud-native, fully managed network security service that provides stateful packet inspection, application-level filtering by FQDN, and threat intelligence-based filtering. It protects Azure virtual network resources from unauthorized traffic."
          },
          {
                    "question": "What is the purpose of Network Security Groups (NSGs)?",
                    "options": [
                              "Encrypt network traffic",
                              "Filter network traffic at the subnet or network interface level with allow/deny rules",
                              "Provide DNS resolution",
                              "Balance network load"
                    ],
                    "explanation": "NSGs are stateful packet filters that control inbound and outbound network traffic at the subnet or network interface level. Rules specify source, destination, port, protocol, and action (allow or deny). They are the basic network segmentation tool in Azure."
          },
          {
                    "question": "What does Azure Bastion provide?",
                    "options": [
                              "DDoS protection",
                              "Secure RDP and SSH access to VMs through the Azure portal without exposing public IPs",
                              "Load balancing",
                              "Content delivery"
                    ],
                    "explanation": "Azure Bastion is a PaaS service that provides secure RDP and SSH connectivity to virtual machines through the Azure portal over TLS. VMs do not need public IP addresses, and management ports (3389/22) are not exposed to the internet."
          },
          {
                    "question": "What does the Microsoft 365 Defender portal unify?",
                    "options": [
                              "Azure virtual machines",
                              "Signals from Defender for Endpoint, Office 365, Identity, and Cloud Apps into correlated incidents",
                              "Storage accounts",
                              "Database connections"
                    ],
                    "explanation": "The Microsoft 365 Defender portal correlates alerts from multiple Defender products into unified incidents. A phishing email that delivers malware and steals credentials appears as one correlated incident rather than three separate alerts from three different products."
          },
          {
                    "question": "What is Defender for Identity?",
                    "options": [
                              "A cloud-only identity service",
                              "A solution that monitors on-premises Active Directory signals to detect advanced identity threats",
                              "An email security tool",
                              "A network firewall"
                    ],
                    "explanation": "Defender for Identity uses sensors on domain controllers to monitor on-premises Active Directory signals. It detects lateral movement, compromised credentials, reconnaissance activities, and privilege escalation attempts targeting your on-premises AD environment."
          },
          {
                    "question": "What query language does Microsoft Sentinel use for analytics rules?",
                    "options": [
                              "SQL",
                              "Python",
                              "KQL (Kusto Query Language)",
                              "PowerShell"
                    ],
                    "explanation": "Microsoft Sentinel uses KQL (Kusto Query Language) for analytics rules, hunting queries, and data exploration. KQL is also used in Defender for Endpoint advanced hunting and Azure Monitor. It is the primary query language across the Microsoft security portfolio."
          },
          {
                    "question": "Which Azure Firewall feature blocks traffic to known malicious IP addresses?",
                    "options": [
                              "Application rules",
                              "Network rules",
                              "Threat intelligence filtering",
                              "NAT rules"
                    ],
                    "explanation": "Azure Firewall threat intelligence filtering uses the Microsoft threat intelligence feed to identify known malicious IP addresses and fully qualified domain names. Traffic to or from these indicators of compromise can be alerted on or denied automatically."
          }
]
        });
        quiz.start();
    </script>
