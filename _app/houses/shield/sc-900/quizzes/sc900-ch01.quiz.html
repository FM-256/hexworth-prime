        <a href="../index.html">&larr; Back to SC-900 Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: "quiz-container",
            title: "Chapter 1: Security, Compliance, and Identity Concepts",
            description: "Test your understanding of shared responsibility, Zero Trust, CIA triad, common threats, and encryption",
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: "shield",
            achievement: "sc900-ch01-quiz",
            moduleId: "sc900-ch01-quiz",
            serverGrading: true,
            houseId: "shield",
            trackProgress: true,
            questions: [
          {
                    "question": "What is the shared responsibility model in cloud security?",
                    "options": [
                              "The cloud provider is responsible for all security",
                              "Security responsibilities are divided between the cloud provider and the customer",
                              "The customer is responsible for all security",
                              "Security is handled by a third party"
                    ],
                    "explanation": "The shared responsibility model divides security responsibilities between the cloud provider (physical infrastructure, network) and the customer (data, identity, access). The exact split varies by service model (IaaS, PaaS, SaaS). In all models, the customer always owns data classification and identity management."
          },
          {
                    "question": "Which security model operates on the principle of \"never trust, always verify\"?",
                    "options": [
                              "Defense in depth",
                              "Shared responsibility",
                              "Zero Trust",
                              "Perimeter security"
                    ],
                    "explanation": "Zero Trust operates on three principles: verify explicitly, use least-privilege access, and assume breach. Unlike traditional perimeter security that trusts everything inside the network, Zero Trust verifies every request regardless of origin."
          },
          {
                    "question": "In the Zero Trust model, what does \"assume breach\" mean?",
                    "options": [
                              "Accept that breaches will happen and do nothing",
                              "Design security assuming attackers are already inside the network",
                              "Only respond after a breach occurs",
                              "Trust internal network traffic"
                    ],
                    "explanation": "Assume breach means designing your security architecture as if attackers have already penetrated your defenses. This drives practices like micro-segmentation, end-to-end encryption, continuous monitoring, and minimizing blast radius."
          },
          {
                    "question": "What are the three pillars of the CIA triad?",
                    "options": [
                              "Compliance, Identity, Authentication",
                              "Confidentiality, Integrity, Availability",
                              "Control, Investigation, Authorization",
                              "Classification, Isolation, Access"
                    ],
                    "explanation": "The CIA triad consists of Confidentiality (only authorized access), Integrity (data has not been tampered with), and Availability (systems are accessible when needed). Every security control maps to one or more of these goals."
          },
          {
                    "question": "Which type of attack tricks users into revealing credentials through deceptive emails?",
                    "options": [
                              "DDoS",
                              "Ransomware",
                              "Phishing",
                              "Brute force"
                    ],
                    "explanation": "Phishing is a social engineering attack where an attacker impersonates a trusted entity (bank, colleague, IT department) to trick users into clicking malicious links or revealing credentials. Spear phishing targets specific individuals, while whaling targets executives."
          },
          {
                    "question": "What is ransomware?",
                    "options": [
                              "Software that monitors user activity",
                              "Malware that encrypts files and demands payment for decryption",
                              "A network scanning tool",
                              "A type of firewall"
                    ],
                    "explanation": "Ransomware encrypts the victim files and demands a ransom payment (usually in cryptocurrency) for the decryption key. Defense strategies include regular backups, endpoint protection, network segmentation, and patch management. Organizations should never pay the ransom."
          },
          {
                    "question": "Which CIA pillar does a DDoS attack primarily target?",
                    "options": [
                              "Confidentiality",
                              "Integrity",
                              "Availability",
                              "Authentication"
                    ],
                    "explanation": "A Distributed Denial of Service (DDoS) attack overwhelms a service with massive traffic to make it unavailable to legitimate users. This directly targets the Availability pillar of the CIA triad. Azure DDoS Protection mitigates these attacks."
          },
          {
                    "question": "What is symmetric encryption?",
                    "options": [
                              "Uses two different keys for encryption and decryption",
                              "Uses one key for both encryption and decryption",
                              "Uses no key",
                              "Is a one-way function"
                    ],
                    "explanation": "Symmetric encryption uses a single key for both encryption and decryption. It is fast and efficient for bulk data encryption (e.g., AES-256). The challenge is securely distributing the shared key to all parties who need it."
          },
          {
                    "question": "What is the key advantage of asymmetric encryption over symmetric?",
                    "options": [
                              "It is faster",
                              "It uses smaller keys",
                              "It solves the key distribution problem",
                              "It requires less processing power"
                    ],
                    "explanation": "Asymmetric encryption uses a public-private key pair: the public key encrypts, the private key decrypts. The public key can be shared openly, solving the key distribution problem. However, it is slower than symmetric encryption and typically used for key exchange and digital signatures."
          },
          {
                    "question": "What is hashing?",
                    "options": [
                              "Reversible encryption of data",
                              "A one-way function that produces a fixed-length output from any input",
                              "A method to compress files",
                              "A type of symmetric encryption"
                    ],
                    "explanation": "Hashing is a one-way function that converts any input into a fixed-length digest (hash). It cannot be reversed. The same input always produces the same hash. Used for password storage, file integrity verification, and digital signatures. Example: SHA-256."
          },
          {
                    "question": "In the shared responsibility model for SaaS, which of the following is always the customer responsibility?",
                    "options": [
                              "Physical infrastructure",
                              "Operating system patching",
                              "Data classification and identity management",
                              "Application code"
                    ],
                    "explanation": "In the SaaS model, Microsoft manages nearly everything including the application and infrastructure. However, the customer always retains responsibility for data classification, identity and access management, device security, and account governance regardless of service model."
          },
          {
                    "question": "What does defense in depth mean?",
                    "options": [
                              "Using a single strong firewall",
                              "Layering multiple security controls so if one fails, others catch the attacker",
                              "Encrypting all data twice",
                              "Only trusting verified users"
                    ],
                    "explanation": "Defense in depth uses multiple layers of security controls (physical, identity, perimeter, network, compute, application, data). If an attacker bypasses one layer, the next layer provides protection. No single control is sufficient alone."
          },
          {
                    "question": "Which encryption method is used for verifying file integrity?",
                    "options": [
                              "Symmetric encryption",
                              "Asymmetric encryption",
                              "Hashing",
                              "Compression"
                    ],
                    "explanation": "Hashing is used to verify file integrity because any change to the file produces a completely different hash value. By comparing the hash of a received file with the expected hash, you can detect any tampering. SHA-256 is a common hashing algorithm."
          },
          {
                    "question": "What type of insider threat involves a negligent employee accidentally exposing data?",
                    "options": [
                              "Malicious insider",
                              "Unintentional insider threat",
                              "External threat",
                              "Advanced persistent threat"
                    ],
                    "explanation": "Unintentional insider threats occur when employees accidentally expose sensitive data through negligence, misconfiguration, or falling for social engineering. These are harder to prevent than malicious insiders because the user has no intent to cause harm. Microsoft Purview Insider Risk Management detects both types."
          },
          {
                    "question": "Which data state refers to data being processed in memory?",
                    "options": [
                              "Data at rest",
                              "Data in transit",
                              "Data in use",
                              "Data in storage"
                    ],
                    "explanation": "Data in use is data currently being processed in memory (RAM). It is the hardest state to protect. Azure Confidential Computing uses hardware-based Trusted Execution Environments (TEEs) to protect data in memory. Data at rest is on disk, and data in transit is moving between locations."
          }
]
        });
        quiz.start();
    </script>
