<div class="container">
  <h1>Foundations of Ethical Hacking Review</h1>
  <p class="subtitle">5 categories &middot; 25 questions &middot; Jeopardy-style board</p>
  <div id="review-root"></div>
</div>
<script src="../../../components/ReviewEngine.js"></script>
<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'Foundations of Ethical Hacking Review',
  storageKey: 'hexworth_review_feh',
  houseId: 'shield',
  categories: [
    {
      name: 'Reconnaissance',
      questions: [
        { value: 100, question: 'What type of reconnaissance involves gathering information without directly interacting with the target system?', options: ['Active reconnaissance','Passive reconnaissance','Aggressive reconnaissance','Physical reconnaissance'], correct: 1, explanation: 'Passive reconnaissance gathers publicly available information (WHOIS, social media, job postings, DNS records) without sending any traffic to the target, making it undetectable by the target organization.' },
        { value: 200, question: 'An ethical hacker uses Google to find exposed configuration files on a target website using the query "site:target.com filetype:conf". What is this technique called?', options: ['SQL injection','Social engineering','Google Dorking','DNS enumeration'], correct: 2, explanation: 'Google Dorking (Google Hacking) uses advanced search operators like site:, filetype:, inurl:, and intitle: to find sensitive information indexed by Google, including exposed files, login pages, and directory listings.' },
        { value: 300, question: 'During OSINT gathering, a penetration tester discovers that the target company uses a specific VPN vendor by analyzing job postings. Which phase of the Lockheed Martin Cyber Kill Chain does this correspond to?', options: ['Weaponization','Delivery','Reconnaissance','Exploitation'], correct: 2, explanation: 'Gathering intelligence about the target\'s technology stack through open sources like job postings falls under the Reconnaissance phase of the Cyber Kill Chain. This information helps attackers tailor their attacks to specific technologies in use.' },
        { value: 400, question: 'An ethical hacker needs to map the external attack surface of a target organization. They discover the primary domain has multiple subdomains. Which combination of tools and techniques would provide the most comprehensive subdomain enumeration?', options: ['Only using nslookup with the target domain','Running nmap against the primary IP address','Combining certificate transparency logs, DNS brute forcing, and passive DNS databases like SecurityTrails','Using traceroute to map the network path'], correct: 2, explanation: 'Comprehensive subdomain enumeration requires multiple sources: Certificate Transparency (CT) logs reveal all subdomains with issued certificates, DNS brute forcing discovers non-public subdomains, and passive DNS databases aggregate historical DNS records. This multi-source approach reveals subdomains that any single tool would miss.' },
        { value: 500, question: 'During reconnaissance of a financial institution, you discover an ASN (Autonomous System Number) associated with the target. Using BGP routing data, you identify IP ranges that WHOIS records do not explicitly associate with the target. What critical intelligence does this provide, and what OPSEC consideration applies?', options: ['The target\'s internal subnet scheme; no OPSEC concerns for passive research','Additional IP space that may host forgotten or less-protected assets; querying BGP looking glasses is passive but querying the IPs directly transitions to active reconnaissance','The ISP backbone topology; always requires written authorization','The target\'s cloud provider; this information is classified'], correct: 1, explanation: 'BGP/ASN analysis reveals IP allocations that may not appear in standard WHOIS searches, potentially exposing shadow IT, legacy infrastructure, or forgotten assets with weaker security. The OPSEC distinction is critical: querying public BGP data (looking glasses, RIPEstat) is passive, but any direct interaction with discovered IPs constitutes active reconnaissance requiring authorization.' }
      ]
    },
    {
      name: 'Scanning & Enumeration',
      questions: [
        { value: 100, question: 'What does the nmap flag -sS perform?', options: ['Full TCP connect scan','SYN stealth scan','UDP scan','Service version detection'], correct: 1, explanation: 'The -sS flag performs a TCP SYN (stealth) scan. It sends SYN packets and analyzes responses without completing the three-way handshake, making it faster and less likely to be logged than a full connect scan.' },
        { value: 200, question: 'An nmap scan shows port 445 open on a Windows target. What service typically runs on this port, and what enumeration opportunities does it present?', options: ['HTTP web server; directory brute forcing','SMB (Server Message Block); share enumeration, user listing, and OS fingerprinting','SSH; brute force authentication','SMTP; email relay testing'], correct: 1, explanation: 'Port 445 hosts SMB (Server Message Block) directly over TCP. SMB enumeration can reveal shared folders, usernames, group memberships, OS version, and domain information using tools like enum4linux, smbclient, or CrackMapExec.' },
        { value: 300, question: 'During a vulnerability scan, a tester discovers that a web server returns different HTTP response codes for valid vs. invalid usernames on the login page (200 for valid, 403 for invalid). What vulnerability class does this represent?', options: ['SQL injection','Username enumeration via differential response analysis','Cross-Site Request Forgery','Insecure Direct Object Reference'], correct: 1, explanation: 'Different HTTP response codes or message content for valid vs. invalid usernames allow attackers to enumerate valid accounts. This is a username enumeration vulnerability. Secure implementations should return identical responses regardless of whether the username exists.' },
        { value: 400, question: 'A penetration tester runs a Nessus vulnerability scan and receives hundreds of findings. Many are marked "Info" or "Low" severity. Among them is a finding for "SSL Certificate Signed Using Weak Hashing Algorithm (SHA-1)." Why might this low-severity finding have higher practical impact than its rating suggests?', options: ['SHA-1 certificates always indicate a compromised server','The finding indicates the server uses an outdated TLS configuration, suggesting a broader pattern of poor patch management and potentially more critical vulnerabilities in the same system','SHA-1 is actually a strong algorithm and the finding is incorrect','This finding only matters for public-facing websites'], correct: 1, explanation: 'While the SHA-1 certificate finding is technically low risk in isolation, it serves as a proxy indicator for organizational security maturity. Systems with outdated cryptographic configurations often have broader patch management deficiencies, making them higher-priority targets for deeper testing that may reveal more critical vulnerabilities.' },
        { value: 500, question: 'During internal network enumeration, you discover a Domain Controller with LDAP signing not enforced and NTLM authentication enabled. What specific attack chain does this configuration enable, and what makes it particularly dangerous in an Active Directory environment?', options: ['DNS spoofing leading to website defacement','LDAP relay attack: capturing NTLM authentication via Responder, relaying it to the DC via LDAP to create a new domain admin account or modify ACLs, because unsigned LDAP sessions accept relayed credentials','ARP spoofing for traffic interception only','Kerberos ticket forgery via AS-REP roasting'], correct: 1, explanation: 'Without LDAP signing enforcement, an attacker can perform NTLM relay attacks. Using tools like Responder to capture NTLM authentication and ntlmrelayx to relay credentials to the DC via unsigned LDAP, the attacker can perform privileged operations (add users to Domain Admins, modify ACLs, configure DCSync rights) without knowing any passwords. This is considered a critical AD misconfiguration.' }
      ]
    },
    {
      name: 'Exploitation',
      questions: [
        { value: 100, question: 'What is the Metasploit Framework primarily used for in ethical hacking?', options: ['Network monitoring','Vulnerability scanning only','Penetration testing and exploit development','Password management'], correct: 2, explanation: 'Metasploit is an open-source penetration testing framework that provides exploit modules, payloads, auxiliary tools, and post-exploitation capabilities. It is the most widely used framework for penetration testing.' },
        { value: 200, question: 'A penetration tester discovers a web application vulnerable to command injection. The input field passes user data directly to a system() call. Which payload would confirm remote code execution on a Linux target?', options: ['<script>alert(1)<\/script>','\'; cat /etc/passwd #','SELECT * FROM users--','../../../etc/passwd'], correct: 1, explanation: 'The payload \'; cat /etc/passwd # terminates the existing command with a semicolon, executes cat /etc/passwd to read the system password file, and comments out the remainder with #. This confirms OS command injection by returning system file contents.' },
        { value: 300, question: 'During a web application assessment, a tester discovers a Server-Side Request Forgery (SSRF) vulnerability. The application fetches URLs provided in a parameter. What is the most impactful exploitation path for this vulnerability in a cloud environment?', options: ['Using SSRF to scan internal ports only','Accessing the cloud instance metadata service (e.g., http://169.254.169.254) to retrieve IAM credentials and pivot to cloud resources','Causing a denial of service by fetching large files','Redirecting users to a phishing page'], correct: 1, explanation: 'In cloud environments (AWS, GCP, Azure), SSRF can access the instance metadata service at 169.254.169.254 to retrieve IAM role credentials, security tokens, and configuration data. These credentials can then be used to access cloud resources (S3 buckets, databases, other instances) outside the original application context.' },
        { value: 400, question: 'A tester has gained initial access to a Windows workstation through a phishing payload. The user has standard privileges. Which technique would allow escalation to SYSTEM without exploiting a kernel vulnerability?', options: ['Running net user Administrator /active:yes','Abusing a misconfigured Windows service with weak file permissions (unquoted service path or writable binary path) that runs as SYSTEM','Using Task Manager to end the antivirus process','Changing the registry to disable User Account Control'], correct: 1, explanation: 'Windows services configured with unquoted service paths or writable binary/directory permissions running as SYSTEM can be hijacked. The attacker replaces or injects into the service binary path, and when the service restarts, the malicious code executes as SYSTEM. Tools like winPEAS and PowerUp automate the discovery of these misconfigurations.' },
        { value: 500, question: 'A penetration test reveals that a target application uses a custom JWT implementation for authentication. The token header specifies "alg": "RS256". After capturing a valid token, the tester discovers the server also accepts tokens with "alg": "HS256" using the RSA public key as the HMAC secret. Explain the vulnerability and its impact.', options: ['The JWT token has expired and needs renewal','The server is vulnerable to algorithm confusion: by switching from RS256 to HS256 and signing with the public key (which is available), the attacker can forge tokens for any user because the server uses the same public key to verify HMAC signatures','This is normal behavior for JWT libraries','The public key needs to be rotated more frequently'], correct: 1, explanation: 'This is the JWT algorithm confusion (key confusion) attack. RS256 uses asymmetric crypto (private key signs, public key verifies). If the server accepts HS256, it uses the same public key as the HMAC symmetric secret. Since the public key is known, the attacker can sign arbitrary tokens with HS256 using the public key, forging sessions for any user including administrators.' }
      ]
    },
    {
      name: 'Post-Exploitation',
      questions: [
        { value: 100, question: 'After gaining initial access to a system, what is the primary goal of establishing persistence?', options: ['To improve the system performance','To maintain access to the compromised system even after reboots or password changes','To delete evidence of the initial exploitation','To immediately exfiltrate all data'], correct: 1, explanation: 'Persistence mechanisms ensure continued access to a compromised system. Without persistence, a reboot, password change, or session timeout would require re-exploitation. Common methods include scheduled tasks, registry run keys, startup scripts, and backdoor accounts.' },
        { value: 200, question: 'A penetration tester has compromised a web server and wants to move laterally to a database server on an internal network that is not directly accessible from the internet. What technique should they use?', options: ['Port scanning from the internet','Pivoting through the compromised web server using an SSH tunnel or SOCKS proxy','Sending a phishing email to the database administrator','Physically accessing the data center'], correct: 1, explanation: 'Pivoting uses the compromised web server as a relay point. By establishing an SSH tunnel or SOCKS proxy through the web server, the tester can route traffic to internal systems that are not externally accessible, effectively using the web server as a jump host.' },
        { value: 300, question: 'After compromising a domain-joined Windows workstation, a tester runs Mimikatz and extracts NTLM hashes from memory. They find the hash of a domain admin who recently logged into the machine. What attack technique allows using this hash without cracking it?', options: ['Rainbow table lookup','Pass-the-Hash attack','Brute force password guessing','Dictionary attack'], correct: 1, explanation: 'Pass-the-Hash (PtH) uses the NTLM hash directly for authentication without needing the plaintext password. Windows NTLM authentication accepts the hash as a valid credential, allowing the attacker to authenticate as the domain admin to other systems using tools like psexec, wmiexec, or CrackMapExec.' },
        { value: 400, question: 'During post-exploitation on a Linux server, the tester discovers a cron job running as root that executes a script from a world-writable directory. How should this finding be classified, and what is the proper exploitation approach?', options: ['Low risk informational finding; no action needed','Critical privilege escalation vector; replace the script content with a reverse shell payload and wait for the cron job to execute it as root','Medium risk; the cron job should be monitored for changes','High risk but unexploitable; cron jobs cannot be manipulated'], correct: 1, explanation: 'A cron job running as root that executes from a world-writable directory is a critical privilege escalation vulnerability. Any user can modify the script contents, and when cron executes it, the modified code runs with root privileges. The tester should document this, replace the script with a payload (like adding their SSH key to root\'s authorized_keys), and wait for execution.' },
        { value: 500, question: 'A penetration tester has obtained Domain Admin credentials through a Kerberoasting attack. Before concluding the engagement, they want to demonstrate the full impact of domain compromise. Which post-exploitation technique would allow them to forge Kerberos tickets for any user in the domain indefinitely, even after the compromised account password is changed?', options: ['Silver Ticket attack using a service account hash','Golden Ticket attack using the KRBTGT account hash extracted via DCSync','Pass-the-Ticket using exported TGT tickets','AS-REP roasting of all domain accounts'], correct: 1, explanation: 'A Golden Ticket attack uses the KRBTGT account hash (extracted via DCSync with Domain Admin privileges) to forge Ticket Granting Tickets for any domain user. Golden Tickets remain valid until the KRBTGT password is changed twice (to invalidate the hash), which is rarely done and often not part of incident response procedures. This demonstrates the full impact of domain compromise.' }
      ]
    },
    {
      name: 'Reporting & Ethics',
      questions: [
        { value: 100, question: 'What legal document must be in place before a penetration test begins?', options: ['A Non-Disclosure Agreement only','A Statement of Work only','A Rules of Engagement document and written authorization (scope agreement)','A press release announcing the test'], correct: 2, explanation: 'Written authorization through Rules of Engagement (RoE) and scope agreement is legally required before any penetration testing. Without explicit written permission, even well-intentioned security testing is considered unauthorized computer access under laws like the CFAA.' },
        { value: 200, question: 'During a penetration test, a tester accidentally discovers evidence that an employee is exfiltrating company data to a competitor. What is the proper course of action?', options: ['Ignore it as it is out of scope','Immediately confront the employee','Stop the test and report the finding to the designated point of contact through the established chain of communication','Post the evidence on social media to warn the public'], correct: 2, explanation: 'Discovering criminal activity during a pentest requires immediate notification through the pre-established chain of communication (usually the CISO or designated contact). The tester should document what was found, preserve evidence, and halt any testing activities that might interfere with a potential investigation.' },
        { value: 300, question: 'A penetration test report should include an executive summary and a technical findings section. What is the key difference in audience and content between these two sections?', options: ['They contain the same information in different fonts','The executive summary is for technical staff; technical findings are for management','The executive summary presents business risk and recommendations for non-technical leadership; technical findings provide detailed steps to reproduce, evidence, and remediation guidance for IT teams','The executive summary replaces the technical section for smaller engagements'], correct: 2, explanation: 'The executive summary communicates business impact, overall risk posture, and strategic recommendations to C-level leadership. The technical findings section provides security engineers with exploit details, proof-of-concept steps, screenshots, and specific remediation instructions they can action.' },
        { value: 400, question: 'A penetration tester discovers a critical zero-day vulnerability in a commercial software product used by their client. Which ethical framework should guide their disclosure approach?', options: ['Immediately publish the vulnerability on social media for maximum awareness','Keep the vulnerability secret and sell it on the dark web','Follow coordinated disclosure: notify the software vendor with a reasonable remediation timeline, work with the client on interim mitigations, and coordinate public disclosure after a patch is available','Disclose only to the client and ignore the broader impact on other users of the software'], correct: 2, explanation: 'Coordinated (responsible) disclosure balances the need to protect all users of the affected software with giving the vendor time to develop a patch. The tester notifies the vendor, provides technical details, agrees on a disclosure timeline (typically 90 days), helps the client implement interim mitigations, and coordinates public disclosure to protect the broader community.' },
        { value: 500, question: 'A pentest report rates a finding as "Critical" based on CVSS 3.1 scoring, but the client argues the vulnerable system is on an isolated network segment with no sensitive data. The client wants the rating lowered to "Low" before the report is finalized. How should the tester handle this situation while maintaining professional integrity?', options: ['Change the rating to keep the client happy','Refuse to change the report in any way','Maintain the base CVSS score with its technical severity but add environmental score adjustments and contextual analysis that reflects the network isolation as a mitigating control, clearly documenting both the inherent technical risk and the reduced effective risk in the operational context','Remove the finding entirely from the report'], correct: 2, explanation: 'Professional integrity requires that technical severity ratings remain accurate. The CVSS framework includes environmental metrics specifically for contextual adjustments. The tester should maintain the base score, apply environmental modifiers that reflect the isolation, and add narrative context explaining how compensating controls reduce effective risk. This preserves technical accuracy while acknowledging operational reality.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'Ethical Hacking Synthesis',
    question: 'A client requests a full-scope penetration test of their corporate environment. During testing, you discover that their external web application is vulnerable to a blind SQL injection that allows extraction of the backend database, which contains unencrypted credentials that are also used for domain admin accounts (credential reuse). What is the correct assessment of the overall risk chain, and which finding should receive the HIGHEST severity rating in the report?',
    options: [
      'The SQL injection is highest because it is the initial entry point',
      'The unencrypted credential storage is highest because it violates compliance requirements',
      'The credential reuse between the web application database and domain admin accounts is highest because it creates a direct path from an external-facing vulnerability to complete domain compromise',
      'All findings should receive equal Critical ratings'
    ],
    correct: 2,
    explanation: 'While each finding is significant individually, the credential reuse between the web application and domain admin accounts creates the most dangerous attack chain: an external attacker can extract credentials through SQL injection and use them to authenticate as a domain administrator, achieving complete domain compromise from the internet. This systemic risk multiplier makes the credential reuse the highest-severity finding, as it transforms a web application vulnerability into a total infrastructure compromise.'
  },
  onComplete: function(results) {
  }
});
</script>
