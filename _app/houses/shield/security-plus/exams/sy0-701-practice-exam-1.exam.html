    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CompTIA Security+ SY0-701 &mdash; Practice Exam 1',
            description: 'Full-length 90-question practice exam covering all five SY0-701 domains. Weighted to match the real exam distribution.',
            passingScore: 83,
            showFeedback: true,
            randomize: false,
            theme: 'shield',
            achievement: 'shield-sy0-701-practice-exam-1',
            moduleId: 'shield-sy0-701-practice-exam-1',
            serverGrading: true,
            houseId: 'shield',
            trackProgress: true,

            questions: [
                      {
                                "question": "A security administrator is classifying a control that prevents an attacker from accessing a server room by requiring a badge swipe. Which category and type of control does this BEST represent?",
                                "options": [
                                          "Physical, preventive",
                                          "Technical, preventive",
                                          "Administrative, detective",
                                          "Physical, corrective"
                                ],
                                "explanation": "Badge-swipe access to a server room is a physical control because it is a tangible barrier in the environment. It is preventive because it stops unauthorized access before a breach occurs."
                      },
                      {
                                "question": "An organization wants to ensure that data remains accurate and has not been tampered with during transmission. Which element of the CIA triad is MOST directly addressed?",
                                "options": [
                                          "Confidentiality",
                                          "Integrity",
                                          "Availability",
                                          "Authentication"
                                ],
                                "explanation": "Integrity ensures data has not been altered in an unauthorized way. Controls such as hashing and digital signatures protect integrity during storage and transmission."
                      },
                      {
                                "question": "A technician enables full-disk encryption on a laptop to protect data if the device is stolen. Which security concept does this PRIMARILY address?",
                                "options": [
                                          "Availability",
                                          "Non-repudiation",
                                          "Confidentiality",
                                          "Integrity"
                                ],
                                "explanation": "Full-disk encryption protects confidentiality by ensuring that stored data cannot be read by an unauthorized party who gains physical possession of the device."
                      },
                      {
                                "question": "Which cryptographic property ensures that a sender cannot later deny having sent a message?",
                                "options": [
                                          "Confidentiality",
                                          "Integrity",
                                          "Availability",
                                          "Non-repudiation"
                                ],
                                "explanation": "Non-repudiation uses mechanisms such as digital signatures to bind a transaction to a specific sender, preventing that party from credibly denying the action later."
                      },
                      {
                                "question": "A company implements a change management process that requires documented approval before any production system modification. Which security goal does this PRIMARILY support?",
                                "options": [
                                          "Accountability and integrity",
                                          "Confidentiality and availability",
                                          "Threat intelligence sharing",
                                          "Vulnerability disclosure"
                                ],
                                "explanation": "Change management enforces accountability (approved, documented changes) and protects system integrity by preventing unauthorized or unintended modifications to production environments."
                      },
                      {
                                "question": "A certificate authority (CA) issues a digital certificate that binds a public key to an entity. Which cryptographic infrastructure does this represent?",
                                "options": [
                                          "Symmetric key exchange",
                                          "Public Key Infrastructure (PKI)",
                                          "Hashed Message Authentication Code (HMAC)",
                                          "Key Derivation Function (KDF)"
                                ],
                                "explanation": "PKI is the framework of policies, roles, hardware, software, and procedures needed to create, manage, distribute, and revoke digital certificates that bind public keys to identities."
                      },
                      {
                                "question": "An administrator configures a system so that users must present something they know and something they have before logging in. This is an example of:",
                                "options": [
                                          "Single sign-on (SSO)",
                                          "Role-based access control (RBAC)",
                                          "Multi-factor authentication (MFA)",
                                          "Discretionary access control (DAC)"
                                ],
                                "explanation": "MFA requires two or more authentication factors from different categories (knowledge, possession, inherence). Combining a password (know) with a token (have) satisfies this requirement."
                      },
                      {
                                "question": "Which symmetric encryption algorithm uses a 256-bit key and is currently recommended by NIST for protecting classified information?",
                                "options": [
                                          "DES",
                                          "3DES",
                                          "RC4",
                                          "AES-256"
                                ],
                                "explanation": "AES (Advanced Encryption Standard) with a 256-bit key is the NIST-approved symmetric cipher used to protect sensitive and classified government data. DES and 3DES are legacy algorithms now considered inadequate."
                      },
                      {
                                "question": "A developer stores user passwords using a process that applies a random value unique to each user before hashing. What is this random value called?",
                                "options": [
                                          "Salt",
                                          "IV (initialization vector)",
                                          "Nonce",
                                          "Key stream"
                                ],
                                "explanation": "A salt is a random value appended to a password before hashing. Salting ensures identical passwords produce different hashes, defeating precomputed rainbow table attacks."
                      },
                      {
                                "question": "An organization uses TLS 1.3 to protect web traffic. Which security properties does TLS provide? (Select the BEST single answer.)",
                                "options": [
                                          "Integrity and availability only",
                                          "Confidentiality, integrity, and authentication",
                                          "Availability and non-repudiation only",
                                          "Confidentiality and non-repudiation only"
                                ],
                                "explanation": "TLS provides confidentiality (encryption), integrity (MAC/HMAC), and authentication (certificates verify server identity). Availability and full non-repudiation are not primary TLS properties."
                      },
                      {
                                "question": "A security team uses a framework that categorizes controls as compensating, corrective, directive, deterrent, detective, or preventive. Which standard framework organizes security controls this way?",
                                "options": [
                                          "NIST SP 800-53",
                                          "ISO 27001",
                                          "CompTIA Security+ control taxonomy",
                                          "CIS Controls v8"
                                ],
                                "explanation": "The CompTIA Security+ SY0-701 exam organizes controls using six functional types (preventive, detective, corrective, deterrent, compensating, directive) crossed with three categories (technical, managerial, operational, physical). NIST and ISO use related but different taxonomies."
                      },
                      {
                                "question": "An attacker registers a domain name that is one character different from a legitimate site to trick users into visiting the fraudulent page. This technique is called:",
                                "options": [
                                          "Pharming",
                                          "Watering hole attack",
                                          "Vishing",
                                          "Typosquatting"
                                ],
                                "explanation": "Typosquatting (URL hijacking) exploits common typing errors by registering domains similar to well-known sites. Users who mistype a URL may land on the attacker-controlled page."
                      },
                      {
                                "question": "A threat actor sends an email appearing to come from a company executive, requesting an urgent wire transfer. Which type of social engineering attack is this?",
                                "options": [
                                          "Business email compromise (BEC)",
                                          "Pretexting",
                                          "Smishing",
                                          "Credential harvesting"
                                ],
                                "explanation": "Business email compromise (BEC) involves impersonating a high-level executive or trusted partner via email to manipulate employees into transferring funds or revealing sensitive data. It typically uses pretexting as an underlying technique."
                      },
                      {
                                "question": "Which threat actor type is MOST likely to be motivated by financial gain and operates with moderate resources?",
                                "options": [
                                          "Nation-state",
                                          "Organized crime group",
                                          "Insider threat",
                                          "Hacktivist"
                                ],
                                "explanation": "Organized crime groups are primarily financially motivated and have significant but not nation-state-level resources. They often conduct ransomware campaigns, fraud, and data theft for profit."
                      },
                      {
                                "question": "Malware encrypts files on a victim machine and demands payment for the decryption key. This is BEST classified as:",
                                "options": [
                                          "Spyware",
                                          "Rootkit",
                                          "Ransomware",
                                          "Logic bomb"
                                ],
                                "explanation": "Ransomware encrypts victim data and demands a ransom for decryption. Unlike spyware (silent data theft) or rootkits (stealth persistence), ransomware is overt and immediately destructive to data access."
                      },
                      {
                                "question": "An attacker compromises a website frequently visited by the intended target organization and plants malware there. This is an example of:",
                                "options": [
                                          "Spear phishing",
                                          "Supply chain attack",
                                          "Drive-by download",
                                          "Watering hole attack"
                                ],
                                "explanation": "A watering hole attack compromises a website known to be frequented by the target. Visitors from the target organization are then infected, allowing the attacker to pivot into the organization indirectly."
                      },
                      {
                                "question": "A piece of malware hides itself within the OS kernel and intercepts system calls to conceal its presence from antivirus tools. This is BEST described as a:",
                                "options": [
                                          "Rootkit",
                                          "Trojan",
                                          "Worm",
                                          "Keylogger"
                                ],
                                "explanation": "A rootkit operates at a low level (often kernel mode) to intercept OS calls and hide the malware's processes, files, and network connections from standard detection tools."
                      },
                      {
                                "question": "During an incident investigation, a security analyst discovers code in an application that will delete the HR database if a specific employee ID is ever removed from the system. This is BEST classified as a:",
                                "options": [
                                          "Trojan",
                                          "Logic bomb",
                                          "Ransomware",
                                          "Worm"
                                ],
                                "explanation": "A logic bomb is malicious code that remains dormant until a specific trigger condition is met. In this case, the trigger is the deletion of a particular employee ID, making it a textbook logic bomb."
                      },
                      {
                                "question": "An attacker intercepts network traffic between two parties and relays messages while secretly reading and potentially altering the content. This describes a:",
                                "options": [
                                          "Replay attack",
                                          "Session hijacking",
                                          "Man-in-the-middle (MitM) attack",
                                          "Credential stuffing"
                                ],
                                "explanation": "A man-in-the-middle attack positions the attacker between two communicating parties. The attacker can eavesdrop, replay, or modify messages without either party being aware of the interception."
                      },
                      {
                                "question": "Attackers obtain a dump of username/password pairs from one breached site and attempt the same credentials on multiple other services. This attack is called:",
                                "options": [
                                          "Password spraying",
                                          "Dictionary attack",
                                          "Brute force",
                                          "Credential stuffing"
                                ],
                                "explanation": "Credential stuffing uses previously breached credential lists against other sites, exploiting password reuse. Unlike brute force, it uses real, valid credentials from other breaches rather than generating guesses."
                      },
                      {
                                "question": "A vulnerability scanner reports a finding for a buffer overflow in a web server component. The vendor has not yet released a patch. This is BEST described as a:",
                                "options": [
                                          "Zero-day vulnerability",
                                          "Known vulnerability",
                                          "False positive",
                                          "Legacy vulnerability"
                                ],
                                "explanation": "A zero-day vulnerability is one for which no vendor patch currently exists. The name refers to the zero days of protection the vendor can offer between disclosure and patch availability."
                      },
                      {
                                "question": "An attacker sends malformed SQL statements through a web application input field, gaining unauthorized access to the backend database. This is an example of:",
                                "options": [
                                          "Cross-site scripting (XSS)",
                                          "SQL injection",
                                          "Directory traversal",
                                          "Command injection"
                                ],
                                "explanation": "SQL injection inserts malicious SQL syntax into input fields that are passed unsanitized to the database. This can allow attackers to bypass authentication, extract data, or destroy records."
                      },
                      {
                                "question": "A penetration tester discovers a web application that echoes user-supplied input directly into an HTML page without sanitization, allowing the tester to inject a script that steals cookies. This is BEST described as:",
                                "options": [
                                          "Cross-site request forgery (CSRF)",
                                          "SQL injection",
                                          "Reflected cross-site scripting (XSS)",
                                          "Clickjacking"
                                ],
                                "explanation": "Reflected XSS occurs when user-supplied input is immediately returned (reflected) to the user's browser within the page response without proper escaping, allowing script execution in the victim's browser context."
                      },
                      {
                                "question": "An organization's web application allows users to access account data via a URL parameter such as `?accountId=1234`. An attacker changes the parameter to access another user's account. This vulnerability is called:",
                                "options": [
                                          "Privilege escalation",
                                          "XML injection",
                                          "Path traversal",
                                          "Insecure direct object reference (IDOR)"
                                ],
                                "explanation": "IDOR occurs when an application exposes an internal implementation object (such as a database key) in a URL or form field and does not verify that the requesting user has authorization to access that object."
                      },
                      {
                                "question": "A threat intelligence report indicates an adversary is using living-off-the-land (LotL) techniques. Which behavior BEST characterizes LotL?",
                                "options": [
                                          "Using legitimate built-in system tools to conduct malicious activity",
                                          "Deploying custom zero-day malware executables",
                                          "Exfiltrating data via encrypted tunnels to foreign IP addresses",
                                          "Installing persistent backdoor software on endpoints"
                                ],
                                "explanation": "Living-off-the-land techniques use legitimate tools already present on the system (such as PowerShell, WMI, or certutil) to carry out attacks. This makes detection harder because no new malware binaries are introduced."
                      },
                      {
                                "question": "An attacker floods a public-facing web server with UDP packets, exhausting bandwidth and preventing legitimate users from accessing the service. This is BEST classified as:",
                                "options": [
                                          "Amplification attack",
                                          "Volumetric denial-of-service (DoS)",
                                          "SYN flood",
                                          "Application-layer DoS"
                                ],
                                "explanation": "Flooding a target with UDP packets to exhaust bandwidth is a volumetric DoS attack. SYN floods and amplification attacks are specific sub-types; application-layer attacks target the protocol logic rather than raw bandwidth."
                      },
                      {
                                "question": "During a phishing simulation, 30% of employees clicked a malicious link. Which mitigation would MOST directly address the human factor revealed by this result?",
                                "options": [
                                          "Deploy an email gateway with SPF/DKIM/DMARC",
                                          "Enable multi-factor authentication",
                                          "Implement security awareness training",
                                          "Deploy endpoint detection and response (EDR)"
                                ],
                                "explanation": "Security awareness training directly addresses the human factor by educating employees to recognize and resist social engineering. Technical controls complement but cannot replace the human element when users voluntarily click links."
                      },
                      {
                                "question": "A security analyst observes unusual outbound traffic to an external IP at regular intervals, even when no users are active. This is a common indicator of:",
                                "options": [
                                          "A denial-of-service attack originating from inside",
                                          "ARP poisoning",
                                          "A port scan by an internal host",
                                          "Command-and-control (C2) beacon traffic"
                                ],
                                "explanation": "Regular periodic outbound connections to an external host are characteristic of C2 beacon traffic, where malware checks in with its command server for instructions. The regularity and timing pattern (beaconing interval) is a key IOC."
                      },
                      {
                                "question": "Which indicator of compromise (IOC) is MOST useful for detecting fileless malware that does not write executables to disk?",
                                "options": [
                                          "Registry run key modification and in-memory process anomalies",
                                          "File hash signature",
                                          "Known malicious IP address block list",
                                          "Malicious email attachment hash"
                                ],
                                "explanation": "Fileless malware resides in memory and uses registry run keys or scheduled tasks for persistence without dropping files. Behavioral IOCs such as unexpected registry modifications and anomalous in-memory process activity are necessary for detection."
                      },
                      {
                                "question": "An organization is evaluating a third-party software package. The security team discovers the vendor has embedded undocumented remote-access functionality. This is BEST described as a:",
                                "options": [
                                          "Zero-day exploit",
                                          "Supply chain attack / backdoor",
                                          "Watering hole attack",
                                          "Insider threat"
                                ],
                                "explanation": "Embedding hidden remote-access code in a software package is a supply chain attack in the form of a backdoor. The attacker compromises the software before it reaches the customer, making the vendor (or a compromised vendor process) the attack vector."
                      },
                      {
                                "question": "A security team patches a critical vulnerability on all servers within 48 hours of a CVE being published. Which metric does this BEST represent?",
                                "options": [
                                          "Mean time to detect (MTTD)",
                                          "Recovery time objective (RTO)",
                                          "Mean time to remediate (MTTR)",
                                          "Recovery point objective (RPO)"
                                ],
                                "explanation": "Mean time to remediate (MTTR) measures the average time between identifying a vulnerability or incident and completing the fix. Patching 48 hours after CVE publication is an MTTR measurement. MTTD tracks detection speed; RTO/RPO are disaster-recovery metrics."
                      },
                      {
                                "question": "An enterprise network is segmented so that the database servers sit behind an internal firewall and cannot be reached directly from the DMZ. Which security architecture concept does this BEST illustrate?",
                                "options": [
                                          "Zero trust",
                                          "Air gapping",
                                          "Least privilege",
                                          "Defense in depth"
                                ],
                                "explanation": "Defense in depth uses multiple layers of security controls so that if one layer fails, subsequent layers continue to protect assets. Placing a firewall between the DMZ and the database tier is a classic layered-defense architecture."
                      },
                      {
                                "question": "A company adopts a model where no user or device is inherently trusted, all access requests require verification, and lateral movement is assumed to be the goal of any threat. This model is called:",
                                "options": [
                                          "Zero trust architecture",
                                          "Perimeter-based security",
                                          "Defense in depth",
                                          "Micro-segmentation only"
                                ],
                                "explanation": "Zero trust architecture operates on the principle \"never trust, always verify.\" Every access request -- regardless of network location -- must be authenticated, authorized, and continuously validated before access is granted."
                      },
                      {
                                "question": "An administrator configures a firewall rule that denies all traffic by default and permits only explicitly approved ports and protocols. This is an example of:",
                                "options": [
                                          "Implicit allow",
                                          "Allowlisting / implicit deny",
                                          "Port mirroring",
                                          "Traffic shaping"
                                ],
                                "explanation": "An implicit deny (default-deny) stance rejects all traffic not explicitly permitted. Allowlisting enumerates approved traffic; everything else is blocked. This is a foundational firewall hardening practice."
                      },
                      {
                                "question": "An organization places public-facing web servers in a network zone separated from the internal corporate network by two firewalls. This zone is called a:",
                                "options": [
                                          "VLAN",
                                          "Air gap",
                                          "DMZ (demilitarized zone)",
                                          "Screened subnet with private addressing"
                                ],
                                "explanation": "A DMZ is a perimeter network segment between the external internet and the internal network, bounded by two firewalls. Public-facing services (web, email, DNS) are placed here to limit exposure if they are compromised."
                      },
                      {
                                "question": "A cloud architect uses infrastructure-as-code templates to provision identical, repeatable environments and can tear down and rebuild a server automatically if it is compromised. This aligns with which cloud security concept?",
                                "options": [
                                          "Data sovereignty",
                                          "Shared responsibility model",
                                          "Serverless architecture",
                                          "Immutable infrastructure"
                                ],
                                "explanation": "Immutable infrastructure means servers are never patched in place; instead they are replaced with freshly provisioned, known-good instances. This limits drift and removes the ability for attackers to persist on a patched host."
                      },
                      {
                                "question": "In a shared responsibility model for a SaaS application, which security task is the CUSTOMER's responsibility?",
                                "options": [
                                          "Identity and access management for application users",
                                          "Hypervisor patching",
                                          "Physical data center security",
                                          "Network infrastructure redundancy"
                                ],
                                "explanation": "In SaaS, the provider manages the physical infrastructure, hypervisor, OS, and application stack. The customer retains responsibility for managing user identities, access controls, and the data they put into the application."
                      },
                      {
                                "question": "A company wants to ensure confidential documents stored in the cloud cannot be accessed by the cloud provider's administrators. Which technology BEST addresses this concern?",
                                "options": [
                                          "Cloud access security broker (CASB)",
                                          "Customer-managed encryption keys (CMEK)",
                                          "Virtual private cloud (VPC)",
                                          "Web application firewall (WAF)"
                                ],
                                "explanation": "With customer-managed encryption keys (CMEK), the customer holds the encryption keys outside the provider's control. The provider can store the encrypted data but cannot decrypt it, preventing cloud-admin access to plaintext."
                      },
                      {
                                "question": "An organization needs to ensure that its backup data stored at a secondary site can recover operations within 4 hours and with no more than 1 hour of data loss. Which terms describe these requirements?",
                                "options": [
                                          "RTO = 1 hour, RPO = 4 hours",
                                          "RPO = 4 hours, RTO = 1 hour",
                                          "RTO = 4 hours, RPO = 1 hour",
                                          "MTTR = 4 hours, MTTD = 1 hour"
                                ],
                                "explanation": "Recovery Time Objective (RTO) is the maximum acceptable time to restore operations (4 hours here). Recovery Point Objective (RPO) is the maximum acceptable data loss window (1 hour here, meaning backups run at least hourly)."
                      },
                      {
                                "question": "A security architect recommends deploying a host-based intrusion prevention system (HIPS) on all endpoints in addition to the existing network IPS. This is an example of which principle?",
                                "options": [
                                          "Least privilege",
                                          "Separation of duties",
                                          "Zero trust",
                                          "Defense in depth"
                                ],
                                "explanation": "Adding a host-based control on top of a network-based control implements multiple defensive layers (defense in depth). If a threat evades the network IPS, the HIPS provides a second opportunity for detection and prevention."
                      },
                      {
                                "question": "An organization restricts each employee to only the permissions needed to perform their job function. Which principle does this enforce?",
                                "options": [
                                          "Least privilege",
                                          "Need to know",
                                          "Mandatory access control",
                                          "Separation of duties"
                                ],
                                "explanation": "Least privilege limits user rights to the minimum necessary to perform a job, reducing the attack surface and limiting the damage an attacker can do with a compromised account. Need-to-know is a related but narrower concept applied to classified information."
                      },
                      {
                                "question": "A company stores sensitive PII on-premises and uses a public cloud for less sensitive workloads. This deployment model is called:",
                                "options": [
                                          "Community cloud",
                                          "Hybrid cloud",
                                          "Multi-cloud",
                                          "Private cloud with cloud bursting"
                                ],
                                "explanation": "A hybrid cloud combines on-premises (private) infrastructure with public cloud services. The organization retains control of sensitive data on-premises while leveraging cloud scalability for less sensitive or non-regulated workloads."
                      },
                      {
                                "question": "An administrator places IoT sensors on a separate VLAN that has no routing to the corporate network and only allows outbound access to a specific vendor cloud endpoint. Which concept does this demonstrate?",
                                "options": [
                                          "Network Address Translation (NAT)",
                                          "Traffic shaping (QoS)",
                                          "Network segmentation and micro-segmentation",
                                          "Port-based access control (802.1X)"
                                ],
                                "explanation": "Isolating IoT devices in a dedicated VLAN with restricted routing is network segmentation (and micro-segmentation when applied at fine granularity). This limits the blast radius if an IoT device is compromised."
                      },
                      {
                                "question": "Which protocol is used to provide secure, authenticated, and encrypted remote access to network devices using TCP port 22?",
                                "options": [
                                          "Telnet",
                                          "RDP",
                                          "SFTP over FTP",
                                          "SSH (Secure Shell)"
                                ],
                                "explanation": "SSH operates on TCP port 22 and provides encrypted, authenticated remote shell access. It replaces Telnet (cleartext) and is the standard secure protocol for CLI management of network devices and servers."
                      },
                      {
                                "question": "An organization implements a solution that inspects encrypted HTTPS traffic by terminating the TLS session at a proxy, inspecting content, and re-encrypting before forwarding. This is called:",
                                "options": [
                                          "TLS forward proxy / SSL inspection",
                                          "SSL pinning",
                                          "Perfect forward secrecy (PFS)",
                                          "Certificate pinning bypass"
                                ],
                                "explanation": "TLS/SSL inspection (also called TLS interception or forward proxy decryption) terminates the inbound TLS session, inspects the decrypted traffic for threats or policy violations, then re-establishes a new TLS session to the destination."
                      },
                      {
                                "question": "A SCADA system controls industrial equipment in a power plant. The security team recommends physically isolating it from all external networks. This isolation method is called:",
                                "options": [
                                          "VLAN segmentation",
                                          "Air gapping",
                                          "Micro-segmentation",
                                          "Network access control (NAC)"
                                ],
                                "explanation": "Air gapping physically separates a system from all external networks, eliminating remote attack vectors. It is used for high-consequence systems such as industrial control systems (ICS/SCADA), nuclear, and classified networks."
                      },
                      {
                                "question": "An organization evaluates a software vendor's security practices before signing a contract. This process is called:",
                                "options": [
                                          "Penetration testing",
                                          "Security impact analysis",
                                          "Vendor due diligence / third-party risk assessment",
                                          "Configuration audit"
                                ],
                                "explanation": "Third-party risk assessment (vendor due diligence) evaluates a supplier's security posture, processes, and compliance before entrusting them with data or systems. It is a key component of supply chain risk management."
                      },
                      {
                                "question": "A security analyst receives alerts that a host is communicating with known malicious IP addresses on threat intelligence feeds. The analyst contains the host by isolating it from the network. Which phase of the incident response lifecycle is this?",
                                "options": [
                                          "Identification",
                                          "Recovery",
                                          "Eradication",
                                          "Containment"
                                ],
                                "explanation": "Containment is the phase where responders limit the damage by isolating affected systems to prevent further spread or communication. Identification precedes containment; eradication and recovery follow it."
                      },
