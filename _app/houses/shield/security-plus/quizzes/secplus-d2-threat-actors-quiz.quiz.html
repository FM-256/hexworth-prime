<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Actors & Motivations Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Threat Actors & Motivations Quiz",
            moduleId: "shield-secplus-d2-threat-actors-quiz",
            achievement: "shield-secplus-d2-threat-actors-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "A government-sponsored group breaches a defense contractor's network to steal classified weapons schematics. Which threat actor type best describes this group?",
                                "options": [
                                          "Nation-state",
                                          "Hacktivist",
                                          "Organized crime",
                                          "Unskilled attacker"
                                ],
                                "explanation": "Nation-state actors are government-sponsored groups with advanced resources and technical sophistication, commonly motivated by espionage and the theft of military or political intelligence. Hacktivists are ideologically motivated, while organized crime is primarily financially motivated."
                      },
                      {
                                "question": "An attacker uses publicly available exploit scripts downloaded from the internet to probe random targets without understanding how the tools work. This actor is best classified as:",
                                "options": [
                                          "An organized crime affiliate",
                                          "An unskilled attacker (script kiddie)",
                                          "A nation-state operative",
                                          "An insider threat"
                                ],
                                "explanation": "Unskilled attackers, sometimes called script kiddies, rely on pre-built tools or exploit code written by others and typically lack the technical depth to develop their own attacks. Their motivation is often notoriety or curiosity rather than a strategic goal."
                      },
                      {
                                "question": "An employee who disagrees with their company's environmental practices leaks internal documents to journalists to expose pollution violations. Which threat actor category applies?",
                                "options": [
                                          "Insider threat",
                                          "Organized crime",
                                          "Hacktivist",
                                          "Nation-state"
                                ],
                                "explanation": "Hacktivists are motivated by ideology, political beliefs, or social causes and use cyberattacks or data leaks to advance those beliefs. Although the individual is an employee, the primary driver here is philosophical motivation aligned with hacktivism."
                      },
                      {
                                "question": "A disgruntled database administrator abuses legitimate access credentials to copy and sell customer records before resigning. Which combination of attributes best describes this actor?",
                                "options": [
                                          "External threat, low resources, low sophistication",
                                          "Internal threat, high resources, low sophistication",
                                          "External threat, nation-state resources, espionage motivation",
                                          "Internal threat, existing access, high capability"
                                ],
                                "explanation": "Insider threats originate from within the organization and already possess legitimate access, which significantly increases their capability to cause damage without needing to bypass external controls. The administrator's technical role implies a meaningful level of sophistication."
                      },
                      {
                                "question": "A criminal syndicate encrypts a hospital's patient records and demands a $2 million ransom. Which primary motivation applies to this threat actor?",
                                "options": [
                                          "Financial",
                                          "Service disruption",
                                          "Philosophical",
                                          "Revenge"
                                ],
                                "explanation": "Organized crime groups are predominantly financially motivated; ransomware attacks targeting hospitals are a textbook example of extortion for monetary gain. Service disruption may be a side effect, but it is not the primary goal."
                      },
                      {
                                "question": "A competitor hires a third party to conduct sustained reconnaissance against a technology firm to obtain trade secrets related to a new product. The motivation is best described as:",
                                "options": [
                                          "Blackmail",
                                          "Espionage",
                                          "War",
                                          "Revenge"
                                ],
                                "explanation": "Espionage involves covert intelligence gathering for competitive, political, or military advantage. Corporate espionage specifically targets trade secrets or intellectual property to benefit a rival organization."
                      },
                      {
                                "question": "Employees at a company begin using a cloud file-sharing service that was never approved by IT. Which Security+ concept does this illustrate?",
                                "options": [
                                          "Insider threat",
                                          "Organized crime",
                                          "Shadow IT",
                                          "Supply chain attack"
                                ],
                                "explanation": "Shadow IT refers to technology systems, software, or services used within an organization without explicit IT department approval. It increases risk because those assets operate outside established security controls."
                      },
                      {
                                "question": "Which attribute most distinguishes a nation-state threat actor from an organized crime group?",
                                "options": [
                                          "Nation-state actors always operate internally, organized crime always externally",
                                          "Nation-state actors are primarily motivated by financial gain, organized crime by espionage",
                                          "Nation-state actors use only unskilled tools, organized crime uses sophisticated custom malware",
                                          "Nation-state actors typically have greater resources and government backing, with motivations including espionage and warfare"
                                ],
                                "explanation": "Nation-state actors are sponsored by governments, giving them substantial resources, proprietary tooling, and long-term operational patience. Their motivations commonly include political espionage, infrastructure disruption, and warfare, which differ from organized crime's financial focus."
                      },
                      {
                                "question": "A hacktivist group launches denial-of-service attacks against a financial institution to protest its investment in fossil fuels. The PRIMARY motivation is:",
                                "options": [
                                          "Philosophical or ideological belief",
                                          "Data exfiltration",
                                          "Financial gain",
                                          "Blackmail"
                                ],
                                "explanation": "Hacktivists are driven by ideological or philosophical causes, using cyberattacks as a form of protest or activism. Disrupting service is a tactic to draw attention to their cause, not to profit financially."
                      },
                      {
                                "question": "Which threat actor attribute refers to the level of technical knowledge, custom tooling, and operational capability an actor possesses?",
                                "options": [
                                          "Motivation",
                                          "Sophistication",
                                          "Funding source",
                                          "Attack vector"
                                ],
                                "explanation": "Sophistication describes the technical capability of a threat actor, including whether they develop custom exploits and malware or rely on off-the-shelf tools. Higher sophistication generally correlates with harder-to-detect and harder-to-attribute attacks."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
