<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance, Law & Regulation Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Compliance, Law & Regulation Quiz",
            moduleId: "shield-secplus-d5-compliance-quiz",
            achievement: "shield-secplus-d5-compliance-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A company operating in the European Union collects personal data from customers. Under GDPR, which right allows an individual to request that their personal data be permanently deleted from the organization's systems?",
                    "options": [
                        "Right to rectification",
                        "Right to be forgotten",
                        "Right to portability",
                        "Right to access"
                    ],
                    "explanation": "The right to be forgotten, also called the right to erasure under GDPR Article 17, allows data subjects to request deletion of their personal data when it is no longer necessary for the purpose it was collected or when consent is withdrawn."
                },
                {
                    "question": "An organization hires a third-party firm to independently evaluate its security controls against a defined framework and produce a formal report attesting to compliance. What type of assessment is this?",
                    "options": [
                        "External audit",
                        "Regulatory examination",
                        "Self-assessment",
                        "Internal audit"
                    ],
                    "explanation": "An external audit is conducted by an independent third party to objectively evaluate an organization's controls and compliance posture. External audits are typically required by regulators, customers, or certification bodies."
                },
                {
                    "question": "A healthcare organization fails a regulatory audit and is fined $1.2 million for not encrypting patient data at rest. Patients and partners also lose confidence in the organization's ability to protect data. Which two consequences of non-compliance are illustrated here?",
                    "options": [
                        "Data subject notification and right-to-audit failure",
                        "Loss of license and criminal prosecution",
                        "Financial sanctions and reputational damage",
                        "Attestation revocation and loss of data controller status"
                    ],
                    "explanation": "Non-compliance consequences include financial penalties such as regulatory fines and reputational damage that erodes trust with customers and partners. Both are demonstrated in this scenario."
                },
                {
                    "question": "Under GDPR, a company that processes personal data exclusively on behalf of and under the instructions of another company is classified as which role?",
                    "options": [
                        "Data subject",
                        "Data custodian",
                        "Data processor",
                        "Data controller"
                    ],
                    "explanation": "A data processor handles personal data on behalf of a data controller and only acts on the controller's instructions. The controller determines the purpose and means of processing; the processor executes those instructions."
                },
                {
                    "question": "An organization's compliance team produces a quarterly report that is shared with the board of directors summarizing the status of internal policy adherence, open findings, and remediation progress. What type of compliance reporting is this?",
                    "options": [
                        "Audit committee disclosure",
                        "External regulatory reporting",
                        "Attestation reporting",
                        "Internal compliance reporting"
                    ],
                    "explanation": "Internal compliance reporting provides leadership and stakeholders within the organization visibility into compliance status and remediation efforts. It differs from external reporting, which is submitted to regulators or third parties."
                },
                {
                    "question": "A cloud service provider submits a signed declaration to a customer confirming that its data centers meet the security control requirements specified in the contract and applicable regulations. What is this declaration called?",
                    "options": [
                        "Compliance questionnaire",
                        "Penetration test summary",
                        "Right-to-audit report",
                        "Attestation"
                    ],
                    "explanation": "An attestation is a formal signed statement by a responsible party declaring that controls or processes meet specified requirements. It is commonly used by service providers to assert compliance to customers and regulators."
                },
                {
                    "question": "An organization's legal team discovers that a new business activity will require the company to report certain types of data breaches to regulators within 72 hours of discovery. Which compliance consideration does this represent?",
                    "options": [
                        "Internal policy requirement",
                        "External legal and regulatory requirement",
                        "Industry self-regulation",
                        "Governance structure mandate"
                    ],
                    "explanation": "Mandatory breach notification timelines such as the 72-hour requirement under GDPR are imposed by external legal and regulatory authorities. Organizations must align their incident response procedures to meet these obligations."
                },
                {
                    "question": "A company loses its ability to operate as a licensed financial services firm after regulators determine it repeatedly failed to implement required cybersecurity controls. What compliance consequence does this illustrate?",
                    "options": [
                        "Loss of license",
                        "Criminal prosecution",
                        "Reputational damage",
                        "Civil litigation"
                    ],
                    "explanation": "Loss of license is a severe consequence of regulatory non-compliance in which the authority to operate in a regulated industry is revoked. This is distinct from financial fines or reputational harm, though those may also occur."
                },
                {
                    "question": "A security team performs a penetration test against its own web applications as part of an annual compliance requirement under PCI DSS. An internal team member leads the engagement. What type of assessment is this?",
                    "options": [
                        "External penetration test",
                        "Red team exercise",
                        "Regulatory examination",
                        "Internal penetration test"
                    ],
                    "explanation": "An internal penetration test is conducted by personnel within the organization or contracted to act on its behalf, as opposed to a fully independent external party. PCI DSS requires penetration testing but allows either internal or external testers meeting specific criteria."
                },
                {
                    "question": "An organization implements a continuous compliance monitoring program that automatically checks system configurations against its security baseline every 24 hours and alerts when drift is detected. What is the primary benefit of continuous monitoring over point-in-time assessments?",
                    "options": [
                        "It eliminates the need for external audits and regulatory examinations",
                        "It provides near-real-time detection of compliance deviations between audit cycles",
                        "It satisfies attestation requirements without requiring a signed declaration",
                        "It reduces the cost of penetration testing by replacing manual testing"
                    ],
                    "explanation": "Continuous monitoring detects compliance drift and security control failures as they occur rather than only at scheduled audit intervals. This reduces the window of exposure between point-in-time assessments."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
