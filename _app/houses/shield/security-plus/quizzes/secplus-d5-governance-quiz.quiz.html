<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Governance Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Security Governance Quiz",
            moduleId: "shield-secplus-d5-governance-quiz",
            achievement: "shield-secplus-d5-governance-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "A new employee receives a document before being granted network access that outlines permitted and prohibited uses of company systems, including personal use restrictions and monitoring acknowledgment. What type of policy is this?",
                                "options": [
                                          "Acceptable use policy",
                                          "Information security policy",
                                          "Change management policy",
                                          "Business continuity policy"
                                ],
                                "explanation": "An acceptable use policy (AUP) defines the rules for using organizational systems, networks, and data. Employees typically sign an AUP before receiving access to acknowledge they understand the permitted and prohibited behaviors."
                      },
                      {
                                "question": "An organization requires all passwords to be a minimum of 12 characters, contain complexity elements, and be changed every 90 days. This requirement is documented in a formal document that all staff must follow. What type of governance document is this?",
                                "options": [
                                          "Guideline",
                                          "Standard",
                                          "Procedure",
                                          "Policy"
                                ],
                                "explanation": "A standard defines specific mandatory requirements, such as minimum password length and complexity. Standards are more prescriptive than policies and provide measurable criteria for compliance."
                      },
                      {
                                "question": "A company's IT department is unsure how to handle a specific configuration for a newly deployed cloud service. They refer to a document that provides recommended best practices but does not mandate a specific approach. What type of document are they consulting?",
                                "options": [
                                          "Policy",
                                          "Standard",
                                          "Guideline",
                                          "Procedure"
                                ],
                                "explanation": "Guidelines are advisory documents that offer recommended approaches and best practices. Unlike policies and standards, guidelines are not mandatory and allow flexibility in implementation."
                      },
                      {
                                "question": "An organization is developing a document that defines the step-by-step instructions for responding to a phishing incident, including who to notify, how to isolate affected systems, and how to preserve evidence. What type of document is this?",
                                "options": [
                                          "Incident response policy",
                                          "Business continuity plan",
                                          "Information security standard",
                                          "Incident response procedure"
                                ],
                                "explanation": "A procedure provides detailed, actionable step-by-step instructions for completing a task. An incident response procedure specifies exactly what actions to take, in what order, and by whom during an incident."
                      },
                      {
                                "question": "A financial institution must comply with regulations that govern how long customer financial records must be retained and how they must be protected. These requirements come from external bodies. Which governance consideration does this represent?",
                                "options": [
                                          "Regulatory and legal external consideration",
                                          "Governance structure review",
                                          "Internal policy alignment",
                                          "Industry framework adoption"
                                ],
                                "explanation": "External considerations in governance include regulatory, legal, and industry requirements imposed on the organization by outside authorities. Financial regulations such as retention and protection mandates are external legal requirements."
                      },
                      {
                                "question": "A company appoints an individual who is responsible for the day-to-day maintenance, classification, and access controls of a specific dataset, but does not make business decisions about that data. What role does this person hold?",
                                "options": [
                                          "Data owner",
                                          "Data custodian",
                                          "Data controller",
                                          "Data processor"
                                ],
                                "explanation": "A data custodian is responsible for the technical management and maintenance of data, including access controls and backups. The data owner makes business decisions about the data, while the custodian implements those decisions."
                      },
                      {
                                "question": "Under GDPR, a company that collects personal data from EU residents and determines the purpose and means of processing that data is classified as which role?",
                                "options": [
                                          "Data processor",
                                          "Data subject",
                                          "Data controller",
                                          "Data custodian"
                                ],
                                "explanation": "A data controller determines the purpose and means of processing personal data. Under GDPR, the controller bears primary legal responsibility for ensuring compliance with data protection obligations."
                      },
                      {
                                "question": "An organization's board of directors establishes an executive-level committee that oversees cybersecurity strategy, approves security budgets, and reviews risk posture. What governance structure does this represent?",
                                "options": [
                                          "Change advisory board",
                                          "Working group",
                                          "Audit committee",
                                          "Steering committee"
                                ],
                                "explanation": "A steering committee is a governance structure composed of senior leaders who provide strategic direction for security programs. It differs from an audit committee, which focuses on compliance and financial review, and a change advisory board, which focuses on change management."
                      },
                      {
                                "question": "A software development team must follow a documented process that governs how code changes are reviewed, tested, approved, and deployed to production. Which policy type addresses this requirement?",
                                "options": [
                                          "SDLC and change management policy",
                                          "Business continuity policy",
                                          "Acceptable use policy",
                                          "Information security policy"
                                ],
                                "explanation": "An SDLC (Software Development Lifecycle) and change management policy governs how software changes are developed, tested, approved, and released. It ensures consistent and secure handling of code changes through defined stages."
                      },
                      {
                                "question": "An organization's DR plan specifies the steps for restoring operations after a disaster, while a separate policy establishes the executive authority for invoking the plan. The policy document is best described as which type?",
                                "options": [
                                          "Disaster recovery procedure",
                                          "Business continuity policy",
                                          "Risk management standard",
                                          "Incident response guideline"
                                ],
                                "explanation": "A business continuity policy establishes the organizational authority, scope, and principles for maintaining and recovering operations during and after a disruption. The DR plan and procedures are subordinate documents that implement the policy."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
