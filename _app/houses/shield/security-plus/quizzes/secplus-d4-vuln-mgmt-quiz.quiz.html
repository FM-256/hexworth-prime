<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerability & Threat Management Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Vulnerability & Threat Management Quiz",
            moduleId: "shield-secplus-d4-vuln-mgmt-quiz",
            achievement: "shield-secplus-d4-vuln-mgmt-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A security analyst receives a vulnerability scan report indicating a critical finding on a web server. After manually inspecting the server, the analyst determines the service flagged is not actually running. What type of scan result is this?",
                    "options": [
                        "True negative",
                        "False positive",
                        "False negative",
                        "True positive"
                    ],
                    "explanation": "A false positive occurs when a vulnerability scanner reports a vulnerability that does not actually exist. The analyst confirmed the flagged service is absent, so the finding is inaccurate."
                },
                {
                    "question": "An organization uses CVSS scores to prioritize remediation. A newly disclosed vulnerability has a CVSS base score of 9.8. Which factor most directly contributes to such a high base score?",
                    "options": [
                        "The vulnerability has a public proof-of-concept exploit available",
                        "The vulnerability affects a system classified as a high-value asset",
                        "The vulnerability requires no user interaction and no privileges to exploit",
                        "The vulnerability was disclosed through a responsible disclosure program"
                    ],
                    "explanation": "CVSS base scores are calculated using factors such as attack vector, attack complexity, privileges required, and user interaction. A score of 9.8 typically reflects network-accessible exploitation requiring no privileges and no user interaction."
                },
                {
                    "question": "A penetration tester discovers a critical vulnerability in a client's externally facing application during an engagement. The client's contract does not address this specific scenario. According to responsible disclosure principles, what should the tester do first?",
                    "options": [
                        "Exploit the vulnerability further to determine its full impact",
                        "Report the vulnerability to MITRE so a CVE can be assigned",
                        "Notify the client privately and give them a reasonable timeframe to remediate",
                        "Publish the vulnerability details immediately to notify the public"
                    ],
                    "explanation": "Responsible disclosure requires the researcher to notify the affected vendor or organization privately, allowing them time to patch before any public disclosure. Publishing immediately without notice is considered full disclosure, not responsible disclosure."
                },
                {
                    "question": "A vulnerability scan identifies 200 findings across a network. A security team wants to address the most critical items first using a risk-based approach. Which combination of factors should they prioritize?",
                    "options": [
                        "Number of times the vulnerability has appeared in previous scans",
                        "Oldest vulnerability age and alphabetical order of CVE identifier",
                        "Vendor patch availability regardless of asset exposure",
                        "CVSS severity score combined with the criticality of the affected asset"
                    ],
                    "explanation": "Risk-based prioritization combines the technical severity of the vulnerability (CVSS score) with the business value and exposure of the affected asset. A critical vulnerability on a low-value isolated system may rank below a medium vulnerability on a customer-facing database."
                },
                {
                    "question": "After deploying a patch, a vulnerability is still detected on the same system in the next scheduled scan. The system owner claims the patch was applied. Which validation step should the analyst perform?",
                    "options": [
                        "Remove the asset from scope for the next scan cycle",
                        "Verify the patch was applied to the correct version and confirm the system was rebooted if required",
                        "Accept the finding as a false positive since the owner confirmed patching",
                        "Increase the CVSS score for the finding and escalate to management"
                    ],
                    "explanation": "Validation after remediation requires confirming that the patch was applied to the correct software version and that any required reboots or service restarts occurred. Many patches do not take effect until the system or service is restarted."
                },
                {
                    "question": "A CVE entry has been published but the vendor states a patch will not be available for 90 days. The vulnerability allows remote unauthenticated access. Which is the most appropriate immediate response?",
                    "options": [
                        "Accept the risk and document it in the risk register until the patch is released",
                        "Notify regulators because the patch timeline exceeds the acceptable remediation window",
                        "Perform a penetration test to determine exploitability before taking action",
                        "Implement a compensating control such as a WAF rule or network segmentation to limit exposure"
                    ],
                    "explanation": "When a patch is unavailable, a compensating control reduces exposure without fully resolving the vulnerability. Network segmentation or WAF rules can block exploitation vectors while the vendor develops a permanent fix."
                },
                {
                    "question": "An organization subscribes to a commercial threat intelligence feed and also uses OSINT sources. A threat feed entry indicates a known malicious IP is actively scanning for a vulnerability that affects the company's systems. What term describes this type of proactive intelligence gathering?",
                    "options": [
                        "Threat feed consumption",
                        "Threat hunting",
                        "Penetration testing",
                        "Vulnerability validation"
                    ],
                    "explanation": "Consuming threat feeds from commercial providers and OSINT sources is classified as threat feed consumption. It provides indicators of compromise and attacker activity that organizations can use to tune defenses before exploitation occurs."
                },
                {
                    "question": "A vulnerability assessment report includes an exception for a legacy system that cannot be patched. Management has signed off on the exception. Which documentation should accompany this decision?",
                    "options": [
                        "A bug bounty agreement with the system vendor",
                        "A penetration test report proving the vulnerability is unexploitable",
                        "A CVE entry submitted to MITRE describing the system's vulnerability",
                        "A formal risk acceptance statement signed by the appropriate system owner"
                    ],
                    "explanation": "Risk acceptance exceptions require formal documentation signed by the system owner or appropriate authority. This creates an auditable record that the risk was knowingly accepted rather than overlooked."
                },
                {
                    "question": "During a black-box penetration test, the tester has no prior knowledge of the target environment. Which phase of a penetration test involves gathering information about the target using public sources before any active probing?",
                    "options": [
                        "Exploitation",
                        "Reconnaissance",
                        "Post-exploitation",
                        "Lateral movement"
                    ],
                    "explanation": "Reconnaissance is the first phase of a penetration test where the tester gathers information about the target. In a black-box engagement, this relies on OSINT and passive techniques before any active scanning begins."
                },
                {
                    "question": "A scan report shows a vulnerability with a CVE identifier that has no CVSS score assigned yet. The vulnerability was just disclosed by a researcher. What does the absence of a CVSS score indicate in this context?",
                    "options": [
                        "The vulnerability analysis is still pending and the score has not yet been published",
                        "The vendor has accepted the vulnerability and is preparing a patch",
                        "The vulnerability is not considered critical by the NVD",
                        "The vulnerability has been confirmed as a false positive"
                    ],
                    "explanation": "Newly disclosed CVEs often appear in the NVD without a CVSS score while analysis is ongoing. The score is published after NIST analysts review the technical details of the vulnerability."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
