<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../../components/FirebaseAuth.js"></script>

    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application & Injection Attacks Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Application & Injection Attacks Quiz",
            moduleId: "shield-secplus-d2-app-injection-quiz",
            achievement: "shield-secplus-d2-app-injection-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A web application constructs database queries by concatenating user-supplied input without sanitization. An attacker enters `' OR '1'='1` into a login field and bypasses authentication. This is a:",
                    "options": [
                        "Cross-site scripting (XSS) attack",
                        "Directory traversal attack",
                        "Buffer overflow attack",
                        "SQL injection attack"
                    ],
                    "explanation": "SQL injection occurs when unsanitized user input is inserted directly into SQL queries, allowing attackers to manipulate the query logic. The classic `' OR '1'='1` payload forces the WHERE clause to always evaluate as true, bypassing authentication."
                },
                {
                    "question": "An attacker injects a malicious script tag into a comment field of a blog. Every user who loads the page executes the script in their browser, which steals their session cookies. This is classified as:",
                    "options": [
                        "SQL injection",
                        "Cross-site request forgery (CSRF)",
                        "Stored (persistent) cross-site scripting (XSS)",
                        "Server-side request forgery (SSRF)"
                    ],
                    "explanation": "Stored XSS (also called persistent XSS) occurs when malicious script is permanently saved in the application's database and served to all subsequent visitors. This differs from reflected XSS, where the payload is embedded in a URL and only affects users who click that link."
                },
                {
                    "question": "A web application running as a high-privileged account receives user-supplied input for a filename, such as `../../../../etc/passwd`, and returns the contents of that system file. This vulnerability is a:",
                    "options": [
                        "Server-side request forgery (SSRF)",
                        "Directory traversal",
                        "SQL injection",
                        "Buffer overflow"
                    ],
                    "explanation": "Directory traversal attacks use `../` sequences to escape the intended directory and access files elsewhere on the server's filesystem. Proper input validation and running applications under least-privilege accounts mitigate this risk."
                },
                {
                    "question": "A process reads more data into a fixed-size memory buffer than it can hold, overwriting adjacent memory. An attacker crafts input to overwrite the return address and redirect execution to malicious shellcode. This is a:",
                    "options": [
                        "Buffer overflow attack",
                        "Race condition",
                        "Privilege escalation via misconfguration",
                        "CSRF attack"
                    ],
                    "explanation": "Buffer overflow attacks exploit the failure to validate the length of input before writing it into a fixed-size buffer. By overflowing into adjacent memory, attackers can overwrite control data such as return addresses to redirect execution flow."
                },
                {
                    "question": "A banking application checks whether a file exists (time-of-check) and then uses it (time-of-use), but an attacker swaps the file with a malicious one in the brief window between those two operations. This is called a:",
                    "options": [
                        "Replay attack",
                        "TOCTOU (time-of-check to time-of-use) race condition",
                        "Logic bomb",
                        "Buffer overflow"
                    ],
                    "explanation": "TOCTOU (time-of-check to time-of-use) is a race condition vulnerability where the state of a resource changes between a security check and its subsequent use. Attackers exploit the timing window to substitute a trusted resource with a malicious one."
                },
                {
                    "question": "An authenticated low-privileged user on a Linux system exploits a kernel vulnerability using a local exploit to gain root access. This is an example of:",
                    "options": [
                        "Directory traversal",
                        "Remote code execution",
                        "Cross-site request forgery",
                        "Privilege escalation"
                    ],
                    "explanation": "Privilege escalation occurs when a user gains more access rights than originally granted — vertically (gaining higher-level privileges such as root) or horizontally (accessing another user's resources at the same level). Kernel exploits are a common path to vertical escalation."
                },
                {
                    "question": "A victim is logged into their bank account. They visit a malicious site that loads an invisible iframe containing a funds-transfer request to the bank, which is automatically submitted using the victim's existing session cookie. This is:",
                    "options": [
                        "Clickjacking",
                        "Reflected XSS",
                        "Server-side request forgery (SSRF)",
                        "Cross-site request forgery (CSRF)"
                    ],
                    "explanation": "CSRF attacks trick an authenticated user's browser into sending forged requests to a trusted site, abusing the browser's automatic inclusion of session cookies. Anti-CSRF tokens and the SameSite cookie attribute are primary defenses."
                },
                {
                    "question": "A web application fetches a URL provided by a user. An attacker supplies an internal URL such as `http://169.254.169.254/latest/meta-data/` to access cloud instance metadata credentials. This attack is:",
                    "options": [
                        "XML injection",
                        "Cross-site request forgery (CSRF)",
                        "Server-side request forgery (SSRF)",
                        "Directory traversal"
                    ],
                    "explanation": "Server-side request forgery (SSRF) causes the server to make HTTP requests to attacker-controlled destinations, including internal services or cloud metadata endpoints. It is especially dangerous in cloud environments where metadata APIs can expose credentials."
                },
                {
                    "question": "An application passes user-supplied operating system commands to a shell function without validation. An attacker appends `; cat /etc/passwd` after a legitimate parameter to read sensitive files. This is:",
                    "options": [
                        "Command injection",
                        "SQL injection",
                        "Path traversal",
                        "Buffer overflow"
                    ],
                    "explanation": "Command injection occurs when an application passes unsanitized user input to a system shell, allowing attackers to append or inject arbitrary OS commands. Applications should use parameterized APIs rather than shell execution wherever possible."
                },
                {
                    "question": "A developer writes a web application that reflects user-supplied search terms directly back into the HTML response without encoding. An attacker crafts a URL with a script payload in the query string and sends it to victims via email. This is:",
                    "options": [
                        "Reflected (non-persistent) XSS",
                        "CSRF",
                        "DOM-based XSS",
                        "Stored XSS"
                    ],
                    "explanation": "Reflected XSS occurs when user-supplied input is immediately returned in the server's HTTP response without persistent storage. The payload is typically delivered via a crafted URL, and the victim must click the link for the attack to execute in their browser."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
