        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }

<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Governance & Asset Management Quiz",
            moduleId: "shield-secplus-d1-governance-asset-quiz",
            achievement: "shield-secplus-d1-governance-asset-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A hospital's IT team labels its electronic health record database as 'PHI - Restricted.' A marketing spreadsheet containing general campaign statistics is labeled 'Public.' Which framework concept do these labels reflect?",
                    "options": [
                        "Data classification",
                        "Asset lifecycle management",
                        "Data ownership assignment",
                        "Data stewardship"
                    ],
                    "explanation": "Data classification assigns labels to data based on its sensitivity, regulatory requirements, and potential impact if disclosed. Classifications such as Public, Internal, Confidential, Restricted, and Critical guide how data must be handled and protected."
                },
                {
                    "question": "A pharmaceutical company develops a proprietary drug synthesis process. The formula is stored in a secured vault with access limited to five senior researchers. Which data type BEST describes this information?",
                    "options": [
                        "Public data",
                        "Personally Identifiable Information (PII)",
                        "Regulated data",
                        "Trade secret"
                    ],
                    "explanation": "A trade secret is proprietary business information that derives its value from remaining confidential. The organization controls access tightly because disclosure would provide competitors with a significant commercial advantage."
                },
                {
                    "question": "A cloud service provider processes customer payment card data on behalf of a retailer. The retailer controls what data is collected and why, while the cloud provider processes it according to the retailer's instructions. Under data governance frameworks such as GDPR, what roles do the retailer and cloud provider hold respectively?",
                    "options": [
                        "The retailer is the data processor; the cloud provider is the data owner.",
                        "The retailer is the data controller; the cloud provider is the data processor.",
                        "The retailer is the data custodian; the cloud provider is the data owner.",
                        "The retailer is the data steward; the cloud provider is the data controller."
                    ],
                    "explanation": "The data controller determines the purpose and means of processing personal data. The data processor handles the data on behalf of the controller according to the controller's instructions. This distinction is foundational to GDPR and many modern privacy frameworks."
                },
                {
                    "question": "An organization's IT asset management policy requires that every hardware asset be assigned to a specific business unit and an individual responsible for its security posture. What is the individual assigned in this role called?",
                    "options": [
                        "Data processor",
                        "Data steward",
                        "Asset owner",
                        "Data custodian"
                    ],
                    "explanation": "An asset owner is the individual or team accountable for a specific asset throughout its lifecycle, including its protection, classification, and proper disposal. Assigning ownership ensures clear accountability for each asset."
                },
                {
                    "question": "A database administrator applies access controls, performs backups, and maintains the integrity of a database containing customer records. The administrator does not decide what data is collected or set retention policies. Which data role does this describe?",
                    "options": [
                        "Data steward",
                        "Data custodian",
                        "Data controller",
                        "Data owner"
                    ],
                    "explanation": "A data custodian is responsible for the day-to-day management and technical protection of data on behalf of the data owner. Custodians implement the controls and procedures defined by the owner without setting policy themselves."
                },
                {
                    "question": "A law firm classifies case files containing attorney work product and client privileged communications as the most protected tier of data, accessible only to attorneys on a given matter. Which classification label BEST fits this data?",
                    "options": [
                        "Confidential",
                        "Restricted",
                        "Public",
                        "Internal"
                    ],
                    "explanation": "Restricted (or Highly Confidential) is typically the highest classification level, applied to data whose unauthorized disclosure would cause serious harm -- such as legal privilege violations, regulatory breaches, or significant financial loss. Access is limited to a need-to-know basis."
                },
                {
                    "question": "A company's asset management policy requires that all laptops be tracked from purchase through deployment, reassignment, and final disposal. At disposal, hard drives must be cryptographically wiped or physically destroyed and documented. Which phase of the asset lifecycle does the disposal requirement address?",
                    "options": [
                        "Monitoring",
                        "Assignment",
                        "Disposal",
                        "Acquisition"
                    ],
                    "explanation": "Asset lifecycle management includes the disposal phase, which governs how assets are decommissioned in a way that prevents data leakage. Cryptographic erasure and physical destruction are approved methods for ensuring residual data cannot be recovered from decommissioned media."
                },
                {
                    "question": "A healthcare organization collects patient name, date of birth, diagnosis codes, and treatment records. A portion of this data is governed by HIPAA. Which combination of data types applies to this dataset?",
                    "options": [
                        "Public and confidential data",
                        "Financial and legal data",
                        "Trade secret and intellectual property",
                        "PII and PHI"
                    ],
                    "explanation": "Patient names and dates of birth are Personally Identifiable Information (PII), while diagnosis codes and treatment records tied to an individual constitute Protected Health Information (PHI) under HIPAA. Both types co-exist in clinical datasets."
                },
                {
                    "question": "A data governance team publishes enterprise-wide data quality standards, resolves disputes about data definitions, and ensures that business metadata is accurate and current. This team does not own the systems that store the data. Which role BEST describes their function?",
                    "options": [
                        "Data steward",
                        "Data processor",
                        "Data owner",
                        "Data custodian"
                    ],
                    "explanation": "A data steward manages the quality, definitions, and governance of data on behalf of the organization. Stewards focus on data meaning, accuracy, and appropriate use rather than technical implementation or system ownership."
                },
                {
                    "question": "An organization performs a quarterly audit by comparing its configuration management database (CMDB) against a live network scan to identify unauthorized or untracked devices. Which asset management activity does this describe?",
                    "options": [
                        "Asset monitoring",
                        "Asset disposal",
                        "Asset assignment",
                        "Asset acquisition"
                    ],
                    "explanation": "Asset monitoring involves continuously or periodically verifying that the inventory of known assets matches the actual state of the environment. Comparing the CMDB to live scans detects rogue devices, unauthorized changes, and inventory gaps."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>

</body>
</html>
