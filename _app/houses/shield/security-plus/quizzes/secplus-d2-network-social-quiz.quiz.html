<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Social Engineering Attacks Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Network & Social Engineering Attacks Quiz",
            moduleId: "shield-secplus-d2-network-social-quiz",
            achievement: "shield-secplus-d2-network-social-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "An employee receives an email appearing to come from the company's CEO requesting an urgent wire transfer to an overseas account. The CEO's display name is correct but the sending domain is slightly misspelled. This is an example of:",
                                "options": [
                                          "Business Email Compromise (BEC)",
                                          "Vishing",
                                          "Smishing",
                                          "Watering hole attack"
                                ],
                                "explanation": "Business Email Compromise (BEC) involves attackers impersonating executives or trusted parties via email to manipulate employees into transferring funds or disclosing sensitive information. Domain spoofing and lookalike domains are common BEC techniques."
                      },
                      {
                                "question": "A user receives a text message claiming their bank account is locked and asking them to click a link to verify their identity. The malicious link leads to a fake banking site. This attack is called:",
                                "options": [
                                          "Phishing",
                                          "Smishing",
                                          "Vishing",
                                          "Pharming"
                                ],
                                "explanation": "Smishing (SMS phishing) uses text messages rather than email to deceive victims into clicking malicious links or providing personal information. The attack vector is the victim's mobile phone SMS inbox."
                      },
                      {
                                "question": "An attacker calls a help desk employee, pretends to be a new IT contractor, and convinces the agent to reset a user's password. Which social engineering technique is primarily used?",
                                "options": [
                                          "Pharming",
                                          "Watering hole attack",
                                          "Pretexting",
                                          "Credential replay"
                                ],
                                "explanation": "Pretexting involves creating a fabricated scenario (a pretext) to manipulate a target into providing information or taking an action. The attacker establishes a false identity (IT contractor) to make the request appear legitimate."
                      },
                      {
                                "question": "Employees at an energy company all visit an industry news site. An attacker compromises that site with malware to infect visitors who work at the target organization. This is a:",
                                "options": [
                                          "Phishing campaign",
                                          "On-path attack",
                                          "DNS poisoning attack",
                                          "Watering hole attack"
                                ],
                                "explanation": "A watering hole attack compromises a website frequently visited by the target audience, waiting for victims to come to the attacker rather than delivering phishing directly. It is effective against well-defended organizations whose users are otherwise cautious with email."
                      },
                      {
                                "question": "A DNS server's cache is poisoned so that users attempting to reach their legitimate bank website are silently redirected to a fraudulent site without any indication in the URL bar that anything is wrong. This is best described as:",
                                "options": [
                                          "Pharming",
                                          "Smishing",
                                          "Vishing",
                                          "BEC"
                                ],
                                "explanation": "Pharming attacks redirect users from legitimate websites to malicious ones by corrupting DNS resolution — either through DNS cache poisoning or hosts file modification — without requiring the victim to click a suspicious link."
                      },
                      {
                                "question": "An attacker sends a large volume of UDP packets with spoofed source addresses to an NTP server, causing the server to flood the victim's IP with amplified responses. This is an example of:",
                                "options": [
                                          "On-path attack",
                                          "DDoS amplification/reflection attack",
                                          "DNS hijacking",
                                          "Credential replay attack"
                                ],
                                "explanation": "Amplification/reflection DDoS attacks exploit protocols like NTP, DNS, or SSDP that return larger responses than the initial request. The attacker spoofs the victim's IP as the source, causing the amplified responses to flood the victim."
                      },
                      {
                                "question": "An attacker positions themselves between a user and a Wi-Fi access point, silently reading and modifying traffic without the user's knowledge. This attack is classified as a(n):",
                                "options": [
                                          "Watering hole attack",
                                          "Replay attack",
                                          "On-path (man-in-the-middle) attack",
                                          "Evil twin attack"
                                ],
                                "explanation": "An on-path attack (formerly called man-in-the-middle) occurs when an attacker intercepts and potentially alters communications between two parties without their knowledge. This can be performed on unencrypted Wi-Fi or by ARP spoofing on a LAN."
                      },
                      {
                                "question": "A penetration tester captures a valid Kerberos ticket from the network and later uses it to authenticate as the original user without knowing their password. This technique is called a:",
                                "options": [
                                          "Downgrade attack",
                                          "Brute-force attack",
                                          "Pharming attack",
                                          "Pass-the-ticket / credential replay attack"
                                ],
                                "explanation": "Credential replay attacks (including pass-the-ticket and pass-the-hash) involve reusing captured authentication tokens or credential material to authenticate without needing the plaintext password. This highlights the importance of short-lived tokens and session management."
                      },
                      {
                                "question": "Users on a corporate wireless network report being prompted to log in to a captive portal that looks exactly like the company login page, but the access point is not managed by the company. This is most likely a(n):",
                                "options": [
                                          "Rogue AP / evil twin attack",
                                          "Deauthentication flood",
                                          "WPA2 downgrade attack",
                                          "Jamming attack"
                                ],
                                "explanation": "An evil twin is a rogue wireless access point that mimics a legitimate network's SSID and credentials portal to harvest user credentials. Attackers often use higher signal strength to force clients to associate with the rogue AP."
                      },
                      {
                                "question": "An attacker sends a crafted DNS query to an open resolver, and the resolver returns a response 50 times larger than the query to the spoofed victim IP. The characteristic that makes this possible is:",
                                "options": [
                                          "The resolver performs recursive lookups by default",
                                          "DNS responses can be significantly larger than queries, enabling traffic amplification",
                                          "DNS uses TCP exclusively for zone transfers",
                                          "DNS cache TTLs are set to zero on open resolvers"
                                ],
                                "explanation": "DNS amplification leverages the fact that DNS responses (especially those using DNSSEC or ANY record queries) can be many times larger than the request, making open resolvers useful amplifiers when the source IP is spoofed to point at a victim."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
