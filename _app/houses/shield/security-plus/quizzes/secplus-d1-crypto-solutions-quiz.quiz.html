<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Solutions Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Cryptographic Solutions Quiz",
            moduleId: "shield-secplus-d1-crypto-solutions-quiz",
            achievement: "shield-secplus-d1-crypto-solutions-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "A healthcare organization needs to allow analysts to run queries on a patient database without exposing actual Social Security Numbers. The SSNs are replaced with randomly generated tokens that map back to the originals only in a secured vault. Which technique is in use?",
                                "options": [
                                          "Tokenization",
                                          "Steganography",
                                          "Data masking",
                                          "Salting"
                                ],
                                "explanation": "Tokenization substitutes sensitive data values with non-sensitive placeholders (tokens) that have no mathematical relationship to the originals. The mapping between tokens and real values is stored in a protected token vault."
                      },
                      {
                                "question": "A security architect is designing a system where two parties must establish a shared secret key over an untrusted network without transmitting the key itself. Which mechanism addresses this requirement?",
                                "options": [
                                          "RSA key transport",
                                          "Diffie-Hellman key exchange",
                                          "AES-256 symmetric encryption",
                                          "HMAC key derivation"
                                ],
                                "explanation": "Diffie-Hellman key exchange allows two parties to derive an identical shared secret by exchanging public values over an insecure channel, without ever transmitting the secret itself. The shared secret can then be used to encrypt subsequent communications."
                      },
                      {
                                "question": "An attacker obtains a database of hashed passwords and discovers that two users with the same password have identical hash values. Which cryptographic control was NOT implemented?",
                                "options": [
                                          "Key stretching",
                                          "Digital signatures",
                                          "Salting",
                                          "Key escrow"
                                ],
                                "explanation": "A salt is a unique random value added to each password before hashing. Without salting, two identical passwords produce identical hashes, enabling attackers to use precomputed rainbow tables or spot shared passwords instantly."
                      },
                      {
                                "question": "A developer needs to verify that a configuration file has not been altered since it was published. The publisher provides a SHA-256 value alongside the file. What cryptographic function is being used, and what property does it verify?",
                                "options": [
                                          "Asymmetric encryption; confidentiality",
                                          "Symmetric encryption; availability",
                                          "Digital signature; non-repudiation",
                                          "Hashing; integrity"
                                ],
                                "explanation": "A hash function produces a fixed-length digest of arbitrary input. Because any change to the input produces a different digest, comparing the published hash to a locally computed hash verifies file integrity."
                      },
                      {
                                "question": "A company stores its private encryption keys in a dedicated hardware appliance that performs all cryptographic operations internally and never exposes key material to the host OS. Which technology does this describe?",
                                "options": [
                                          "Hardware Security Module (HSM)",
                                          "Trusted Platform Module (TPM)",
                                          "Key Management Service (KMS)",
                                          "Secure enclave"
                                ],
                                "explanation": "A Hardware Security Module (HSM) is a dedicated physical device that generates, stores, and manages cryptographic keys and performs cryptographic operations in a tamper-resistant environment where key material never leaves the device in plaintext."
                      },
                      {
                                "question": "A certificate authority issues a certificate to www.example.com. The organization later wants the same certificate to also be valid for mail.example.com and shop.example.com without purchasing additional certificates. Which certificate type should be requested?",
                                "options": [
                                          "Self-signed certificate",
                                          "Wildcard certificate",
                                          "Extended validation certificate",
                                          "Root CA certificate"
                                ],
                                "explanation": "A wildcard certificate (e.g., *.example.com) is valid for all first-level subdomains of the specified domain. It eliminates the need to purchase and manage separate certificates for each subdomain."
                      },
                      {
                                "question": "A user's laptop uses a chip soldered to the motherboard to store the full-disk encryption key and measure the integrity of the boot process before releasing the key. Which component provides this functionality?",
                                "options": [
                                          "Hardware Security Module (HSM)",
                                          "Secure enclave",
                                          "Trusted Platform Module (TPM)",
                                          "Key Management Service (KMS)"
                                ],
                                "explanation": "The Trusted Platform Module (TPM) is a chip integrated into the motherboard that provides hardware-based cryptographic functions, stores encryption keys, and performs platform integrity measurements (measured boot) before releasing secrets."
                      },
                      {
                                "question": "A financial application needs to ensure that a transaction record cannot be repudiated by the sender. The sender's identity must be provably tied to the transaction. Which cryptographic mechanism satisfies this requirement?",
                                "options": [
                                          "Symmetric encryption with AES-256",
                                          "Tokenization of the transaction amount",
                                          "HMAC using a shared secret",
                                          "Digital signature using the sender's private key"
                                ],
                                "explanation": "A digital signature is created by encrypting a hash of the message with the sender's private key. Since only the sender possesses their private key, a valid signature proves the sender's identity and provides non-repudiation."
                      },
                      {
                                "question": "An organization's certificate authority is compromised and several certificates must be immediately invalidated before their scheduled expiration. Which mechanism allows relying parties to check certificate status in real time without downloading a full revocation list?",
                                "options": [
                                          "Online Certificate Status Protocol (OCSP)",
                                          "Certificate Revocation List (CRL)",
                                          "Certificate Signing Request (CSR)",
                                          "Key escrow"
                                ],
                                "explanation": "OCSP allows a client to query a responder for the current revocation status of a specific certificate in real time. Unlike CRLs, OCSP does not require the client to download and process an entire list of revoked certificates."
                      },
                      {
                                "question": "A password management system applies PBKDF2 with 600,000 iterations before storing a user's master password hash. Which cryptographic goal do the high iteration count achieve?",
                                "options": [
                                          "Obfuscation of the key length",
                                          "Key stretching to make brute-force attacks computationally expensive",
                                          "Tokenization of the plaintext password",
                                          "Steganographic concealment of the hash"
                                ],
                                "explanation": "Key stretching algorithms such as PBKDF2, bcrypt, and Argon2 apply a hash function thousands or millions of times to increase the computational cost of each guess. This makes large-scale brute-force and dictionary attacks significantly slower."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
