    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Principles & Best Practices Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */

        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Design Principles & Best Practices Quiz",
            moduleId: "shield-secplus-d1-design-principles-quiz",
            achievement: "shield-secplus-d1-design-principles-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A company deploys firewalls at the network perimeter, intrusion detection systems on internal segments, endpoint detection and response agents on workstations, and requires MFA for all logins. Which security design principle does this architecture BEST exemplify?",
                    "options": [
                        "Least privilege",
                        "Separation of duties",
                        "Defense in depth",
                        "Zero trust"
                    ],
                    "explanation": "Defense in depth implements multiple overlapping security controls across different layers so that the failure or bypass of one control does not result in a complete compromise. The combination of perimeter, network, endpoint, and identity controls illustrates this principle."
                },
                {
                    "question": "A help desk technician is granted read-only access to the HR database solely to look up employee IDs needed for ticket resolution. Administrators deny the technician access to payroll tables. Which principle governs this access decision?",
                    "options": [
                        "Defense in depth",
                        "Least privilege",
                        "Zero trust",
                        "Secure SDLC"
                    ],
                    "explanation": "Least privilege restricts users, processes, and systems to only the access and permissions necessary to perform their defined job function. Granting read-only access to a limited subset of data satisfies this principle."
                },
                {
                    "question": "An organization redesigns its network so that every access request -- even from internal hosts -- is continuously verified against identity, device health, and context before resources are granted. Traffic is micro-segmented and no host is inherently trusted. Which architectural model does this describe?",
                    "options": [
                        "Secure SDLC",
                        "Zero trust",
                        "Honeypot deployment",
                        "Defense in depth"
                    ],
                    "explanation": "Zero trust is a security model that eliminates implicit trust based on network location. Every request is authenticated, authorized, and continuously validated regardless of whether it originates inside or outside the traditional network perimeter."
                },
                {
                    "question": "A development team performs threat modeling during the requirements phase, conducts code reviews during development, runs static analysis before build, and performs penetration testing before release. Which framework does this lifecycle represent?",
                    "options": [
                        "Secure Software Development Lifecycle (Secure SDLC)",
                        "Control plane segregation",
                        "Zero trust architecture",
                        "Defense in depth"
                    ],
                    "explanation": "A Secure SDLC integrates security activities -- including threat modeling, code review, static analysis, and penetration testing -- into each phase of the software development process to identify and remediate vulnerabilities before deployment."
                },
                {
                    "question": "A security team deploys a server that appears to be an unpatched production database and monitors it for unauthorized access attempts. No legitimate users should ever connect to this system. What is this system called, and what is its primary purpose?",
                    "options": [
                        "A honeypot used to detect and study attacker behavior",
                        "A policy enforcement point used to authorize user sessions",
                        "A jump server used to provide privileged access to internal systems",
                        "A bastion host used to harden the network perimeter"
                    ],
                    "explanation": "A honeypot is a deception resource intentionally configured to attract and detect unauthorized access. Because no legitimate traffic should reach it, any connection attempt is a strong indicator of reconnaissance or attack activity."
                },
                {
                    "question": "In a zero trust architecture, the component responsible for evaluating identity, device posture, and contextual signals before granting access is the policy decision point (PDP). The component that enforces that decision by allowing or blocking traffic is called what?",
                    "options": [
                        "Data plane",
                        "Policy enforcement point (PEP)",
                        "Control plane",
                        "Adaptive identity provider"
                    ],
                    "explanation": "The policy enforcement point (PEP) sits inline between the user or device and the resource. It receives the access decision from the policy decision point and enforces it by either granting or denying the connection."
                },
                {
                    "question": "A zero trust framework requires that user identity claims be continuously evaluated against real-time signals such as location, device compliance status, and behavioral analytics before each access decision. What term describes this dynamic identity evaluation?",
                    "options": [
                        "Implicit trust enforcement",
                        "Least privilege assignment",
                        "Separation of duties",
                        "Adaptive identity"
                    ],
                    "explanation": "Adaptive identity evaluates authentication and authorization decisions dynamically using contextual signals rather than relying on a one-time login event. Risk-based factors such as geolocation, device health, and behavioral patterns adjust the trust level in real time."
                },
                {
                    "question": "An organization separates its routing and switching infrastructure into two logical planes: one that makes forwarding decisions and one that physically moves traffic. From a zero trust perspective, which planes correspond to the policy decision function and the traffic forwarding function respectively?",
                    "options": [
                        "Data plane makes decisions; management plane forwards traffic",
                        "Data plane makes decisions; control plane forwards traffic",
                        "Management plane makes decisions; control plane forwards traffic",
                        "Control plane makes decisions; data plane forwards traffic"
                    ],
                    "explanation": "In networking and zero trust architecture, the control plane contains the logic that makes routing and policy decisions, while the data plane (forwarding plane) carries out those decisions by moving packets. Separating these planes allows policy decisions to be centralized and protected."
                },
                {
                    "question": "A company requires that all production code changes pass peer review, automated testing, and a security scan before being merged. Developers cannot push directly to the main branch. Which secure development principle does this workflow enforce?",
                    "options": [
                        "Zero trust network access",
                        "Defense in depth at the infrastructure layer",
                        "Security gates within the Secure SDLC",
                        "Honeypot-based deception technology"
                    ],
                    "explanation": "Incorporating mandatory security gates -- such as peer review, automated testing, and static analysis -- into the development workflow is a core practice of the Secure SDLC. These controls catch vulnerabilities before code reaches production."
                },
                {
                    "question": "An organization places a network of decoy files labeled 'Confidential Payroll Q4.xlsx' on file shares and alerts the security team whenever these files are opened. Which deception technique is being used?",
                    "options": [
                        "Sinkhole",
                        "Honeynet",
                        "Honeytoken",
                        "Honeypot"
                    ],
                    "explanation": "A honeytoken is a fake data object -- such as a file, credential, or database record -- designed to detect unauthorized access. Any interaction with the token is a high-fidelity alert because legitimate users have no reason to access it."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
