<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography & PKI Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Cryptography & PKI Quiz",
            moduleId: "shield-secplus-d3-crypto-pki-quiz",
            achievement: "shield-secplus-d3-crypto-pki-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A financial institution needs to encrypt large volumes of transaction data at rest as efficiently as possible using a single shared key. Which algorithm is most appropriate?",
                    "options": [
                        "SHA-256",
                        "Diffie-Hellman",
                        "AES-256",
                        "RSA-2048"
                    ],
                    "explanation": "AES (Advanced Encryption Standard) is a symmetric encryption algorithm that uses the same key for encryption and decryption. It is significantly faster than asymmetric algorithms like RSA for bulk data encryption and is the industry standard for data at rest."
                },
                {
                    "question": "A user wants to send an encrypted message to a recipient they have never communicated with before. No shared secret exists. Which approach allows secure key exchange over an untrusted network?",
                    "options": [
                        "AES-256 with a pre-shared key",
                        "Diffie-Hellman key exchange",
                        "MD5 HMAC",
                        "SHA-512 hashing of the message"
                    ],
                    "explanation": "Diffie-Hellman (DH) key exchange enables two parties to establish a shared secret over a public channel without transmitting the secret itself. This shared secret can then be used to derive a symmetric encryption key for the session."
                },
                {
                    "question": "An organization digitally signs software releases so customers can verify the software has not been tampered with and genuinely comes from the developer. Which combination of cryptographic operations accomplishes this?",
                    "options": [
                        "Hash the software, then encrypt the hash with the developer's private key",
                        "Hash the software with MD5 and publish the hash on the website",
                        "Encrypt the software with AES and share the symmetric key via email",
                        "Encrypt the software with the customer's public key"
                    ],
                    "explanation": "A digital signature is created by hashing the data and encrypting the hash with the signer's private key. Recipients verify it by decrypting the signature with the signer's public key and comparing the result to their own hash of the data, confirming both integrity and authenticity."
                },
                {
                    "question": "A user visits an HTTPS website and their browser verifies the site's certificate is valid, not expired, and signed by a trusted authority. Which PKI component is responsible for issuing and signing that certificate?",
                    "options": [
                        "Certificate Revocation List (CRL)",
                        "Certificate Authority (CA)",
                        "Registration Authority (RA) only",
                        "Online Certificate Status Protocol (OCSP) responder"
                    ],
                    "explanation": "A Certificate Authority (CA) is the PKI entity that issues, signs, and manages digital certificates. The CA's signature on a certificate allows relying parties to trust the certificate because they trust the CA's root certificate."
                },
                {
                    "question": "A certificate has been compromised before its scheduled expiration date. The CA publishes updated revocation information that browsers can check in real time via a lightweight protocol. This protocol is:",
                    "options": [
                        "LDAP",
                        "DNSSEC",
                        "Online Certificate Status Protocol (OCSP)",
                        "Certificate Revocation List (CRL)"
                    ],
                    "explanation": "OCSP allows clients to query the CA for the current revocation status of a specific certificate in real time, returning a signed response indicating whether the certificate is good, revoked, or unknown. CRLs are an alternative but are downloaded in bulk rather than queried per certificate."
                },
                {
                    "question": "A security architect needs an algorithm to verify that a 10GB database backup has not been corrupted or altered. The algorithm must produce a fixed-length output regardless of input size. The correct category of algorithm is:",
                    "options": [
                        "Asymmetric encryption",
                        "Key encapsulation",
                        "Cryptographic hashing",
                        "Symmetric encryption"
                    ],
                    "explanation": "Cryptographic hash functions such as SHA-256 or SHA-3 produce a fixed-length digest from any input size and are designed so that any change to the input produces a completely different output. They provide integrity verification but are one-way functions, not encryption."
                },
                {
                    "question": "An employee's laptop stores sensitive data encrypted with a key derived from their login password. If the employee forgets the password, the data is permanently inaccessible. An organization can avoid this data loss risk by implementing:",
                    "options": [
                        "Certificate pinning",
                        "Hashing with salt",
                        "Perfect Forward Secrecy",
                        "Key escrow"
                    ],
                    "explanation": "Key escrow involves storing a copy of the encryption key with a trusted third party or the organization's key management system so that data can be recovered if the primary key is lost. This is common in enterprise environments to prevent permanent data loss."
                },
                {
                    "question": "A TLS session is configured so that even if the server's long-term private key is later compromised, previously recorded sessions cannot be decrypted. This property is called:",
                    "options": [
                        "Certificate transparency",
                        "Non-repudiation",
                        "Key escrow",
                        "Perfect Forward Secrecy (PFS)"
                    ],
                    "explanation": "Perfect Forward Secrecy (PFS) ensures that each TLS session uses a unique ephemeral key derived via ECDHE or DHE, so that compromising the server's long-term private key at a later date does not allow decryption of past sessions."
                },
                {
                    "question": "A root CA delegates certificate issuance for a specific department to a subordinate CA. A user trusts the root CA. By which principle does the user also trust certificates issued by the subordinate CA?",
                    "options": [
                        "Key exchange via Diffie-Hellman",
                        "OCSP stapling",
                        "Certificate pinning",
                        "Chain of trust (certificate chaining)"
                    ],
                    "explanation": "The chain of trust (certificate chain) means that if a user trusts a root CA, they transitively trust any subordinate (intermediate) CA whose certificate is signed by the root, and in turn trust end-entity certificates signed by that subordinate CA."
                },
                {
                    "question": "An algorithm takes a message and a shared secret key as input and produces a fixed-length value used to verify both integrity and authenticity. This is a:",
                    "options": [
                        "Hash-based Message Authentication Code (HMAC)",
                        "Public key certificate",
                        "Symmetric cipher",
                        "Digital signature"
                    ],
                    "explanation": "HMAC combines a cryptographic hash function with a shared secret key to produce a message authentication code. Unlike a plain hash, an HMAC cannot be forged without knowledge of the secret key, providing both integrity and authentication between parties sharing the key."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
