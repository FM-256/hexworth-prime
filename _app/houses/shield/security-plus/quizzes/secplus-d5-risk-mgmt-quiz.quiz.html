<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Management Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Risk Management Quiz",
            moduleId: "shield-secplus-d5-risk-mgmt-quiz",
            achievement: "shield-secplus-d5-risk-mgmt-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "An organization calculates that a server failure has a 25% chance of occurring in any given year and would cost $80,000 per occurrence. What is the Annualized Loss Expectancy (ALE)?",
                                "options": [
                                          "$20,000",
                                          "$80,000",
                                          "$320,000",
                                          "$40,000"
                                ],
                                "explanation": "ALE is calculated as ALE = SLE x ARO. With a Single Loss Expectancy of $80,000 and an Annualized Rate of Occurrence of 0.25, the ALE equals $20,000."
                      },
                      {
                                "question": "A risk assessment team uses interviews, surveys, and expert judgment to estimate the likelihood and impact of risks without assigning specific dollar values. What type of assessment is this?",
                                "options": [
                                          "Quantitative risk assessment",
                                          "Qualitative risk assessment",
                                          "Business impact analysis",
                                          "Continuous monitoring assessment"
                                ],
                                "explanation": "Qualitative risk assessment uses descriptive scales such as high, medium, and low to evaluate risk likelihood and impact. It relies on subjective judgment rather than numerical financial calculations."
                      },
                      {
                                "question": "A company purchases a cyber liability insurance policy to offset the financial impact of a potential data breach. Which risk management strategy does this represent?",
                                "options": [
                                          "Risk avoidance",
                                          "Risk mitigation",
                                          "Risk transfer",
                                          "Risk acceptance"
                                ],
                                "explanation": "Risk transfer shifts the financial burden of a risk to a third party, typically through insurance or contractual agreements. The risk itself is not eliminated, but the organization's financial exposure is reduced."
                      },
                      {
                                "question": "An organization decides to discontinue a high-risk product line because the potential liability from a data breach outweighs the business benefit. Which risk strategy is being applied?",
                                "options": [
                                          "Risk acceptance",
                                          "Risk mitigation",
                                          "Risk transfer",
                                          "Risk avoidance"
                                ],
                                "explanation": "Risk avoidance means eliminating the activity or asset that introduces the risk. By discontinuing the product line, the organization removes the source of the risk entirely."
                      },
                      {
                                "question": "After a BIA, an organization determines it can tolerate up to 4 hours of downtime for its order processing system before significant business harm occurs. This 4-hour threshold represents which metric?",
                                "options": [
                                          "Recovery Time Objective (RTO)",
                                          "Recovery Point Objective (RPO)",
                                          "Mean Time to Repair (MTTR)",
                                          "Mean Time Between Failures (MTBF)"
                                ],
                                "explanation": "The Recovery Time Objective (RTO) is the maximum acceptable duration of downtime following a disruption. It defines how quickly a system or process must be restored to avoid unacceptable business consequences."
                      },
                      {
                                "question": "An organization performs a risk assessment at the start of a new project and then again at each project phase completion. What type of risk assessment cadence is this?",
                                "options": [
                                          "Ad-hoc assessment",
                                          "Recurring assessment",
                                          "Continuous assessment",
                                          "One-time assessment"
                                ],
                                "explanation": "A recurring risk assessment is performed at defined intervals or milestones, such as at the start and end of project phases. This differs from continuous monitoring, which occurs in real time."
                      },
                      {
                                "question": "A database suffers a corruption event that destroys 6 hours of transaction records. The last backup was taken 6 hours before the failure. This 6-hour window of data loss is measured against which metric?",
                                "options": [
                                          "RTO",
                                          "MTTR",
                                          "RPO",
                                          "MTBF"
                                ],
                                "explanation": "The Recovery Point Objective (RPO) defines the maximum acceptable amount of data loss measured in time. A 6-hour gap between the last backup and the failure represents the actual data loss compared against the organization's RPO target."
                      },
                      {
                                "question": "A risk register entry shows a specific risk with an assigned owner, likelihood rating, impact rating, current controls, and residual risk score. What is the primary purpose of maintaining a risk register?",
                                "options": [
                                          "To document the complete history of all past security incidents",
                                          "To record the results of penetration tests for executive review",
                                          "To provide a technical inventory of all vulnerabilities found in scans",
                                          "To track identified risks, their attributes, and the status of treatment actions"
                                ],
                                "explanation": "A risk register is a centralized document used to record identified risks, their likelihood and impact, current controls, residual risk, and treatment status. It enables consistent tracking and accountability for risk management decisions."
                      },
                      {
                                "question": "An organization's security policy states that no risk with a CVSS score above 9.0 may remain unmitigated for more than 30 days. This threshold represents which risk concept?",
                                "options": [
                                          "Risk threshold",
                                          "Risk tolerance",
                                          "Key Risk Indicator (KRI)",
                                          "Risk appetite"
                                ],
                                "explanation": "A risk threshold is the specific point at which a risk level triggers a mandatory response or escalation. The 30-day remediation requirement for scores above 9.0 is a defined threshold that enforces action when risk exceeds acceptable levels."
                      },
                      {
                                "question": "A CISO presents the board with a metric showing the percentage of critical vulnerabilities remediated within SLA each month. This metric is used to signal when risk levels are approaching unacceptable boundaries. What type of metric is this?",
                                "options": [
                                          "Key Performance Indicator (KPI)",
                                          "Key Risk Indicator (KRI)",
                                          "Service Level Agreement (SLA)",
                                          "Annual Loss Expectancy (ALE)"
                                ],
                                "explanation": "A Key Risk Indicator (KRI) is a forward-looking metric that signals when risk is increasing or approaching a threshold that requires management attention. It differs from a KPI, which measures operational performance."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
