<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>

    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Management Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Change Management Quiz",
            moduleId: "shield-secplus-d1-change-management-quiz",
            achievement: "shield-secplus-d1-change-management-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                      {
                                "question": "A network administrator wants to push a firmware update to all edge routers during business hours. The change management board denies the request. Which reason BEST explains the denial?",
                                "options": [
                                          "The change falls outside the approved maintenance window and poses unacceptable downtime risk.",
                                          "Firmware updates require a CAB vote of at least five members.",
                                          "The update has not been submitted to the version control repository.",
                                          "Firmware changes are automatically classified as unauthorized activities."
                                ],
                                "explanation": "Maintenance windows define the approved time frames during which changes may be applied to minimize business impact. Applying changes outside those windows violates the change management policy regardless of the merit of the update."
                      },
                      {
                                "question": "After a failed software deployment causes a production outage, the incident team restores the previous version from a stored package. Which change management element made this recovery possible?",
                                "options": [
                                          "Impact analysis",
                                          "Backout plan",
                                          "Maintenance window",
                                          "Standard operating procedure"
                                ],
                                "explanation": "A backout plan documents the steps required to reverse a change and restore the previous state if the deployment fails. Without a tested backout plan, recovery from a failed change can be slow or impossible."
                      },
                      {
                                "question": "Before a new application is deployed to production, the security team evaluates its potential effect on adjacent systems, data flows, and user access. Which change management activity does this BEST describe?",
                                "options": [
                                          "Ownership assignment",
                                          "Test result review",
                                          "Impact analysis",
                                          "Stakeholder notification"
                                ],
                                "explanation": "Impact analysis examines the potential consequences a proposed change may have on systems, processes, and people before the change is approved. It helps the change board make an informed decision about risk."
                      },
                      {
                                "question": "A legacy application running on Windows Server 2012 cannot be patched because the vendor no longer supports it. A proposed change to upgrade the OS causes the application to fail in testing. What is the PRIMARY technical concern that must be documented in the change record?",
                                "options": [
                                          "The application is missing from the asset inventory.",
                                          "The application owner did not sign the change request.",
                                          "The maintenance window was not approved by the CAB.",
                                          "The application has an undocumented dependency that prevents the OS upgrade."
                                ],
                                "explanation": "Legacy applications frequently have undocumented dependencies on specific OS versions or libraries. These dependencies must be identified and documented so that change planners can address compatibility before or instead of the upgrade."
                      },
                      {
                                "question": "A company's change management policy requires that all newly approved software titles be added to the endpoint management platform before installation is permitted. Which technical control does this policy enforce?",
                                "options": [
                                          "Allow list enforcement",
                                          "Deny list enforcement",
                                          "Version control tagging",
                                          "Service restart scheduling"
                                ],
                                "explanation": "An allow list (also called an allowlist or whitelist) permits only explicitly approved software to run. Requiring approved titles to be registered before installation ensures only vetted software executes on endpoints."
                      },
                      {
                                "question": "During a post-change review, the team discovers that a configuration update restarted a dependent microservice without notice, causing fifteen minutes of degraded performance. Which documentation artifact should have prevented this?",
                                "options": [
                                          "A completed CSR submitted to the CA",
                                          "A change record listing all required service restarts and dependencies",
                                          "An updated CRL published prior to deployment",
                                          "A versioned SOP stored in the knowledge base"
                                ],
                                "explanation": "The change record should enumerate all services that will be affected, including those requiring a restart, so that impacted teams can prepare and the outage window is accurately planned."
                      },
                      {
                                "question": "A firewall rule change is approved, implemented, and verified. The security engineer now updates the network diagram and firewall policy document. Which change management principle does this action satisfy?",
                                "options": [
                                          "Ownership",
                                          "Stakeholder communication",
                                          "Documentation",
                                          "Version control"
                                ],
                                "explanation": "Keeping documentation current after a change is implemented ensures that the recorded state of the environment matches its actual state. Accurate documentation is essential for future troubleshooting, audits, and change planning."
                      },
                      {
                                "question": "A change request is submitted to disable TLS 1.0 on all web servers. The change board asks: who is accountable if this breaks an integration with a business partner? Which change management element addresses this question?",
                                "options": [
                                          "Maintenance window",
                                          "Test results",
                                          "Backout plan",
                                          "Ownership"
                                ],
                                "explanation": "Ownership identifies the individual or team accountable for a change and its outcomes. Establishing ownership before implementation ensures that someone is responsible for addressing failures or unintended consequences."
                      },
                      {
                                "question": "An organization's change management SOP specifies that all production database changes must be tested in a staging environment and the results attached to the change ticket. A DBA submits a change ticket without test results. What should happen next?",
                                "options": [
                                          "The change should be rejected until test results are provided.",
                                          "The CAB should approve the change with a compensating control.",
                                          "The DBA should deploy the change immediately to gather production test data.",
                                          "The change should be escalated to the CISO for emergency approval."
                                ],
                                "explanation": "SOPs exist to enforce consistent, safe practices. A change that does not meet the documented requirements should not advance through the approval process until the missing artifacts are supplied."
                      },
                      {
                                "question": "A software vendor releases a critical security patch. The security team wants to deploy it immediately, but the change board requires a formal process. Which stakeholder group is MOST important to notify before scheduling the emergency change window?",
                                "options": [
                                          "The software vendor's support team",
                                          "Business unit owners of affected systems",
                                          "The certificate authority managing the code-signing certificate",
                                          "The help desk tier-1 staff"
                                ],
                                "explanation": "Business unit owners of affected systems are key stakeholders because the change directly impacts the systems they depend on. Notifying them allows them to prepare for potential disruption and coordinate their teams accordingly."
                      }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
