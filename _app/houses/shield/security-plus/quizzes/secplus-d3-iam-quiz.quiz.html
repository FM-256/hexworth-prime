<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity & Access (AAA) Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Identity & Access (AAA) Quiz",
            moduleId: "shield-secplus-d3-iam-quiz",
            achievement: "shield-secplus-d3-iam-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "A hospital assigns permissions based on job function: nurses can view and update patient records, billing staff can only view billing information, and administrators can modify all records. This access control model is:",
                    "options": [
                        "Mandatory Access Control (MAC)",
                        "Role-Based Access Control (RBAC)",
                        "Rule-Based Access Control",
                        "Discretionary Access Control (DAC)"
                    ],
                    "explanation": "Role-Based Access Control (RBAC) grants permissions based on a user's assigned role within an organization rather than individual identity. Users inherit the permissions defined for their role, simplifying administration and reducing error in environments with many users."
                },
                {
                    "question": "A classified government system labels all documents with sensitivity levels (Top Secret, Secret, Confidential) and users are granted clearances. Users cannot change or override these labels. This model is:",
                    "options": [
                        "Mandatory Access Control (MAC)",
                        "Role-Based Access Control (RBAC)",
                        "Discretionary Access Control (DAC)",
                        "Attribute-Based Access Control (ABAC)"
                    ],
                    "explanation": "Mandatory Access Control (MAC) is a non-discretionary model where the operating system or security policy enforces access based on labels and clearances. Users cannot grant access to resources on their own — the system enforces all decisions."
                },
                {
                    "question": "A cloud platform grants a user access to a resource only if they are in the Finance department, are accessing from a corporate IP address, and it is during business hours. This is an example of:",
                    "options": [
                        "Discretionary Access Control (DAC)",
                        "Role-Based Access Control (RBAC)",
                        "Mandatory Access Control (MAC)",
                        "Attribute-Based Access Control (ABAC)"
                    ],
                    "explanation": "Attribute-Based Access Control (ABAC) makes access decisions based on a combination of attributes from the user, resource, environment, and action. It is highly flexible and well-suited to dynamic or context-aware authorization requirements."
                },
                {
                    "question": "A file owner on a standard Linux system uses the `chmod` command to grant read access to a colleague. The colleague can then share that access with others at their discretion. This model is:",
                    "options": [
                        "Mandatory Access Control (MAC)",
                        "Discretionary Access Control (DAC)",
                        "Role-Based Access Control (RBAC)",
                        "Attribute-Based Access Control (ABAC)"
                    ],
                    "explanation": "Discretionary Access Control (DAC) allows the owner of a resource to control who has access to it at their own discretion. Traditional Unix/Linux file permissions are a classic example — the resource owner sets the permissions and can delegate access."
                },
                {
                    "question": "A company's VPN gateway requires users to provide their password and then approve a push notification on their registered smartphone before granting access. This is an example of:",
                    "options": [
                        "Just-in-time (JIT) provisioning",
                        "Single sign-on (SSO)",
                        "Multi-factor authentication (MFA)",
                        "Federated identity"
                    ],
                    "explanation": "Multi-factor authentication (MFA) requires users to present two or more factors from distinct categories: something you know (password), something you have (phone with push notification app), and/or something you are (biometric). Using a password plus a phone-based push combines knowledge and possession factors."
                },
                {
                    "question": "A user logs in once to a corporate portal and is automatically authenticated to email, HR systems, and collaboration tools without entering credentials again. This capability is provided by:",
                    "options": [
                        "Multi-factor authentication (MFA)",
                        "Mandatory Access Control (MAC)",
                        "Just-in-time (JIT) access provisioning",
                        "Single sign-on (SSO)"
                    ],
                    "explanation": "Single sign-on (SSO) allows a user to authenticate once and gain access to multiple applications without re-entering credentials. SSO reduces password fatigue and centralizes authentication, though it also means a compromised SSO credential can affect all integrated services."
                },
                {
                    "question": "A university allows students to log into a partner library system using their university credentials. The library system accepts the authentication assertion from the university's identity provider without requiring a separate account. This is an example of:",
                    "options": [
                        "Federated identity management",
                        "RBAC delegation",
                        "Kerberos ticketing",
                        "PAP authentication"
                    ],
                    "explanation": "Federated identity management allows identity providers (IdPs) from different organizations to establish trust relationships so that users can authenticate across organizational boundaries using their home-organization credentials. SAML and OpenID Connect are common protocols used in federation."
                },
                {
                    "question": "In the Kerberos authentication protocol, which component issues the initial Ticket-Granting Ticket (TGT) after verifying a user's credentials?",
                    "options": [
                        "Key Distribution Center (KDC)",
                        "RADIUS server",
                        "Certificate Authority (CA)",
                        "Service Ticket (ST) server"
                    ],
                    "explanation": "The Key Distribution Center (KDC) is the core of Kerberos authentication and contains both the Authentication Server (AS) and the Ticket-Granting Server (TGS). The AS verifies the user's credentials and issues the TGT, which the user then presents to the TGS to obtain service tickets."
                },
                {
                    "question": "A privileged access management (PAM) solution grants a system administrator elevated database permissions for 30 minutes to perform a specific task, after which the permissions are automatically revoked. This practice is called:",
                    "options": [
                        "Mandatory Access Control (MAC)",
                        "Just-in-time (JIT) access provisioning",
                        "Role-Based Access Control (RBAC)",
                        "Least privilege enforcement"
                    ],
                    "explanation": "Just-in-time (JIT) access provisioning grants elevated or privileged access only for the duration needed to complete a specific task, then automatically removes it. This reduces the window of exposure for privileged accounts and limits the blast radius of a compromised credential."
                },
                {
                    "question": "An organization implements a policy where no single user account has more permissions than required to perform their assigned job duties. This foundational security principle is called:",
                    "options": [
                        "Zero trust",
                        "Defense in depth",
                        "Least privilege",
                        "Separation of duties"
                    ],
                    "explanation": "The principle of least privilege states that users, processes, and systems should be granted only the minimum permissions necessary to fulfill their function. This limits the damage that can result from compromised accounts, software vulnerabilities, or insider threats."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
