<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third-Party & Vendor Risk Quiz &mdash; Hexworth Prime</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        .page-header { padding:18px 6vw; border-bottom:1px solid rgba(59,130,246,0.2); }
        .page-header a { color:#60a5fa; text-decoration:none; font-size:0.9rem; }
        .page-header a:hover { color:#93c5fd; }
        /* Full viewport width (hard platform rule). */
        .quiz-wrapper { flex:1; padding:30px 6vw; }
        #quiz-container { width:100%; max-width:none; }
    </style>
</head>
<body>
    <header class="page-header"><a href="../index.html">&larr; Back to Security+ Hub</a></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: "Third-Party & Vendor Risk Quiz",
            moduleId: "shield-secplus-d5-vendor-risk-quiz",
            achievement: "shield-secplus-d5-vendor-risk-quiz",
            passingScore: 80,
            theme: 'shield',
            houseId: 'shield',
            serverGrading: true,
            trackProgress: true,
            showFeedback: true,
            randomize: false,
            questions: [
                {
                    "question": "An organization contracts a third party to process payroll data. Before signing, the organization sends a detailed questionnaire asking about the vendor's security controls, incident response procedures, and audit history. What vendor risk management activity is this?",
                    "options": [
                        "Rules of engagement review",
                        "Supply chain analysis",
                        "Vendor security questionnaire",
                        "Right-to-audit clause negotiation"
                    ],
                    "explanation": "A vendor security questionnaire is used during vendor assessment to evaluate a third party's security posture before entering into a contract. It gathers information about controls, certifications, and incident history."
                },
                {
                    "question": "A cloud provider contract includes a clause giving the customer the ability to hire an independent auditor to review the provider's security controls and access their audit logs at any time. What contractual provision does this represent?",
                    "options": [
                        "Right-to-audit clause",
                        "Statement of Work",
                        "Master Service Agreement",
                        "Non-disclosure agreement"
                    ],
                    "explanation": "A right-to-audit clause grants the contracting organization the legal authority to examine a vendor's security controls, processes, and records. This provision is essential for maintaining oversight of third-party risk."
                },
                {
                    "question": "Two organizations agree to share data and resources for a joint project. The agreement is informal, does not carry legal enforceability, and outlines mutual intentions. What type of agreement is this?",
                    "options": [
                        "Master Service Agreement (MSA)",
                        "Non-disclosure agreement (NDA)",
                        "Memorandum of Understanding (MOU)",
                        "Business partnership agreement (BPA)"
                    ],
                    "explanation": "A Memorandum of Understanding (MOU) is a non-binding agreement that documents the mutual intentions and expectations of two parties. It establishes a cooperative relationship without the full legal enforceability of a contract."
                },
                {
                    "question": "A company engages a managed security service provider (MSSP) under a contract that defines the specific services to be delivered, performance metrics, response times, and penalties for non-performance. What type of agreement governs these terms?",
                    "options": [
                        "Service Level Agreement",
                        "Non-disclosure Agreement",
                        "Work Order",
                        "Memorandum of Agreement"
                    ],
                    "explanation": "A Service Level Agreement (SLA) defines the expected service levels, performance metrics, and consequences for non-compliance between a service provider and customer. It is the primary contract governing ongoing service delivery."
                },
                {
                    "question": "Before conducting a penetration test against a vendor's environment, the testing team and vendor agree in writing on the scope, timing, permitted techniques, and escalation procedures. What document governs these parameters?",
                    "options": [
                        "Non-disclosure agreement",
                        "Master Service Agreement",
                        "Rules of engagement",
                        "Statement of Work"
                    ],
                    "explanation": "Rules of engagement (ROE) define the boundaries, permitted activities, and procedures for a penetration test or security assessment. They protect both the testing team and the organization by establishing clear authorization and constraints."
                },
                {
                    "question": "An organization is reviewing the components used in a vendor-supplied hardware device and discovers that a circuit board subcomponent was manufactured by an entity on a government restricted list. Which third-party risk concern does this represent?",
                    "options": [
                        "Vendor monitoring failure",
                        "Supply chain risk",
                        "SLA non-compliance",
                        "Rules of engagement violation"
                    ],
                    "explanation": "Supply chain risk involves threats introduced through hardware, software, or services acquired from third parties. Restricted or untrusted manufacturers in the supply chain can introduce backdoors, counterfeit components, or malicious firmware."
                },
                {
                    "question": "A vendor provides ongoing services under a master agreement that sets the general terms and conditions. For each specific project, the parties execute a separate document detailing the deliverables, timeline, and cost. What is this project-specific document called?",
                    "options": [
                        "Business Partnership Agreement",
                        "Statement of Work",
                        "Memorandum of Understanding",
                        "Non-disclosure Agreement"
                    ],
                    "explanation": "A Statement of Work (SOW) defines the specific deliverables, scope, timeline, and costs for a particular engagement under a broader Master Service Agreement. The MSA establishes the overarching legal terms while the SOW captures the project-specific details."
                },
                {
                    "question": "After onboarding a new cloud storage vendor, the security team establishes a process to review the vendor's security scan reports, patch status, and incident disclosures on a monthly basis. What practice is this?",
                    "options": [
                        "Third-party questionnaire review",
                        "Supply chain analysis",
                        "Vendor penetration testing",
                        "Ongoing vendor monitoring"
                    ],
                    "explanation": "Ongoing vendor monitoring involves continuous or periodic review of a vendor's security posture after contract execution. It ensures that vendors maintain the security standards required by the agreement over the life of the relationship."
                },
                {
                    "question": "Two organizations plan to collaborate and need to ensure that sensitive business information shared during discussions remains confidential and is not disclosed to competitors or the public. Which agreement should they establish first?",
                    "options": [
                        "Non-disclosure Agreement",
                        "Business Partnership Agreement",
                        "Memorandum of Understanding",
                        "Service Level Agreement"
                    ],
                    "explanation": "A Non-disclosure Agreement (NDA) legally obligates parties to keep shared information confidential. It is typically one of the first agreements executed before sensitive business discussions or data sharing begins."
                },
                {
                    "question": "A company conducts a penetration test against a critical vendor's public-facing applications as part of its third-party risk program. This test is performed with the vendor's knowledge and consent. What is the primary goal of this activity in the vendor risk context?",
                    "options": [
                        "To identify vulnerabilities for the vendor to exploit in their own testing",
                        "To demonstrate compliance with SLA performance metrics",
                        "To satisfy the organization's internal audit requirements",
                        "To validate that the vendor's security controls are functioning as claimed"
                    ],
                    "explanation": "Third-party penetration testing verifies that a vendor's security controls are operating effectively rather than relying solely on the vendor's self-reported posture. It provides independent evidence of the vendor's actual security state."
                }
            ]
        });
    </script>
    <hex-ai-button house="shield"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
