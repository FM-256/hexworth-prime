<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub - Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/hexworth-mark.webp">

    <!-- Page gate: identical to every house index (sorted+; tenants bypass). Synchronous,
         before render, so it cannot depend on the async hub fetch (adversarial-review #7:
         the renderer applies ONE gate up front; all houses use 'sorted' today). -->
    <script src="/components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <style>
        :root{ --bg:#0a0c16; --panel:#12151f; --panel2:#171b28; --line:#232838;
               --cyan:#22d3ee; --violet:#8b5cf6; --text:#e9edf4; --muted:#8b95a8; --gold:#f5c451; }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ min-height:100vh; background:radial-gradient(1100px 520px at 76% -10%, #161d30 0, var(--bg) 62%);
              color:var(--text); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; line-height:1.5; }
        .wrap{ max-width:1040px; margin:0 auto; padding:40px 24px 90px; }
        .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:34px;
                 font-size:.8rem; letter-spacing:.08em; }
        .topbar a{ color:var(--muted); text-decoration:none; }
        .topbar a:hover{ color:var(--cyan); }
        .eyebrow{ font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); font-weight:700; }
        h1{ font-size:clamp(2rem,5vw,3rem); letter-spacing:-.01em; margin:6px 0 8px; text-wrap:balance; }
        .sub{ color:var(--muted); font-size:1.05rem; }
        .hub-head{ display:flex; gap:22px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:26px; }
        .hub-icon{ width:76px; height:76px; flex:0 0 auto; border:1px solid var(--line); border-radius:16px;
                   background:var(--panel); display:flex; align-items:center; justify-content:center; }
        .hub-icon img{ width:46px; height:46px; }
        .draft-banner{ margin:22px 0 0; background:rgba(245,196,81,.10); border:1px solid rgba(245,196,81,.4);
                       border-radius:12px; padding:13px 18px; color:var(--gold); font-size:.9rem; font-weight:600; }
        .section{ margin-top:40px; }
        /* Container children: cover-cartridge grid (same visual family as catalog.html) */
        .kids-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; margin-top:16px; }
        .kid-card{ display:block; border:1px solid rgba(255,255,255,.12); border-radius:12px; overflow:hidden;
                   background:rgba(255,255,255,.03); text-decoration:none; color:#e9edf4;
                   transition:border-color .2s, transform .15s; }
        .kid-card:hover{ border-color:rgba(34,211,238,.5); transform:translateY(-2px); }
        .kid-cover{ width:100%; aspect-ratio:16/10; object-fit:cover; display:block; }
        .kid-fallback{ width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center;
                       background:rgba(255,255,255,.04); }
        .kid-fallback img{ width:42px; height:42px; }
        .kid-body{ padding:12px 14px; }
        .kid-label{ font-weight:600; font-size:.98rem; }
        .kid-sub{ color:#8b95a8; font-size:.82rem; margin-top:2px; }
        .section h2{ font-size:.82rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
                     font-weight:700; display:flex; align-items:center; gap:10px; margin-bottom:16px;
                     border-bottom:1px solid var(--line); padding-bottom:10px; }
        .section h2 .count{ color:var(--cyan); }
        .items{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
        .item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
               text-decoration:none; color:var(--text); transition:border-color .2s ease, transform .15s ease; display:block; }
        .item:hover{ border-color:rgba(34,211,238,.4); transform:translateY(-2px); }
        .item .t{ font-weight:600; font-size:.98rem; }
        .item .d{ color:var(--muted); font-size:.84rem; margin-top:4px; }
        .empty{ color:var(--muted); font-size:.9rem; font-style:italic; padding:6px 2px; }
        .path{ margin-top:40px; background:linear-gradient(160deg,rgba(139,92,246,.10),var(--panel));
               border:1px solid var(--line); border-radius:14px; padding:22px 24px; }
        .path .eyebrow{ color:var(--violet); }
        .path .steps{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
        .path .steps span{ padding:7px 14px; border:1px solid var(--line); border-radius:999px; font-size:.86rem; color:#d8dfea; }
        .state{ text-align:center; padding:90px 20px; }
        .state h1{ font-size:1.8rem; }
        .state p{ color:var(--muted); margin-top:10px; }
        .state a{ color:var(--cyan); text-decoration:none; }
        .hidden{ display:none; }

        /* ══ ENVIRONMENT + CARTRIDGE TREATMENT ═════════════════════════════════════════
           PILOT, scoped by the `env-on` body class which boot() only sets for hubs listed
           in ENV_HUBS. This file is the SHARED renderer for every Firestore hub, so an
           unscoped restyle would silently re-skin all of them -- and a hub whose cover art
           is a server rack does not read correctly under a cloudscape.

           Depth is layered CSS transforms, not WebGL: the platform has a hard no-build-step
           rule, so a 3D library is a dependency decision for the operator, not something to
           slip in. Three planes of the hub's own cover art at different scale/blur/opacity
           parallax against each other, which reads as an environment while staying pure CSS
           over an asset that already ships.                                              */
        body.env-on .env{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
              background:var(--bg); }
        /* Two nested elements per plane, deliberately: the OUTER carries the JS parallax
           transform, the INNER carries the ambient keyframe drift. A CSS animation and a JS
           transform on the same element fight over the transform property and the animation
           wins, which is why the scene sat still except on pointer move. Nesting composes them. */
        body.env-on .env-layer{ position:absolute; inset:-14%; will-change:transform;
                    transition:transform .5s cubic-bezier(.22,.61,.36,1); }
        body.env-on .env-plane{ position:absolute; inset:0; background-position:center; background-size:cover;
                    background-repeat:no-repeat; will-change:transform; }
        /* DEPTH OF FIELD -- the fix for "the focus is off".
           The previous pass blurred all three planes (20/7/2px), so nothing was ever sharp and
           the scene read as mush rather than depth. A real lens puts ONE plane in focus and
           throws the rest out. Mid is the subject (the lit pedestals) and is fully sharp; far is
           background bokeh; near is an out-of-focus foreground that the eye reads as "in front
           of me". Sharpness is what creates the depth cue, not blur quantity.

           THE BLUR IS BAKED INTO THE IMAGES, not applied with filter:blur(). A CSS blur on a
           ~1900x1200 animated plane is re-rasterised every frame: measured at a flat ~83ms per
           frame (12fps on a 6x-throttled CPU) no matter what else was optimised -- median, p95
           and worst were all identical, which is the signature of a fixed per-frame cost rather
           than occasional jank. Pre-blurred bitmaps are just textures to translate. The blurred
           planes are downscaled too (far 0.5x, near 0.75x): nothing is visible through a 26px
           blur, and a smaller texture is less to composite. */
        body.env-on .env-far{ opacity:1; }                                     /* art is pre-blurred */
        body.env-on .env-mid{ filter:none; opacity:.72;                       /* FOCAL PLANE -- sharp */
                  animation:envDriftMid 34s ease-in-out infinite alternate; }
        body.env-on .env-near{ opacity:.42;                 /* foreground; art is pre-blurred */
                   animation:envDriftNear 26s ease-in-out infinite alternate;
                   -webkit-mask-image:linear-gradient(to top, #000 0 26%, transparent 62%);
                           mask-image:linear-gradient(to top, #000 0 26%, transparent 62%); }

        /* AMBIENT MOTION -- the fix for "make it alive".
           Continuous drift so the scene breathes when the student is not touching anything;
           the pointer/scroll parallax rides on top via the outer .env-layer. Each plane has a
           different duration and direction so they never resynchronise into a single sliding
           image. Durations are long and eased -- this is weather, not an animation. */
        /* TRANSLATE ONLY -- measured, not stylistic. Animating scale on a plane carrying a
           28px blur forces the browser to re-rasterise the entire layer every frame: the first
           version ran at 11.8fps with 69 dropped frames in 6s on a 6x-throttled CPU, against
           60fps on a hub without the environment. Translate is a compositor transform and is
           nearly free. The scale here also COMPOUNDED with the JS scale on the outer element,
           so every plane was being scaled twice. */
        @keyframes envDriftFar {
            from{ transform:translate3d(-1.2%, 0.6%, 0); }
            to  { transform:translate3d( 1.2%,-0.8%, 0); }
        }
        @keyframes envDriftMid {
            from{ transform:translate3d( 1.6%, 0.4%, 0); }
            to  { transform:translate3d(-1.6%,-1.0%, 0); }
        }
        @keyframes envDriftNear {
            from{ transform:translate3d(-2.4%, 1.0%, 0); }
            to  { transform:translate3d( 2.4%,-0.6%, 0); }
        }
        /* The glow breathing on its own cycle, so the light source feels alive rather than
           the whole frame pulsing in lockstep. */
        @keyframes envPulse { from{ opacity:.82; } to{ opacity:1; } }
        body.env-on .env-far{ animation:envDriftFar 46s ease-in-out infinite alternate,
                            envPulse 11s ease-in-out infinite alternate; }
        /* Legibility bed. Deliberately light: the content column carries its own scrim (below),
           so this only needs to keep contrast honest, not hide the art. */
        body.env-on .env-veil{ position:absolute; inset:0;
                   background:
                     radial-gradient(120% 80% at 50% 0%, transparent 0 46%, rgba(10,12,22,.42) 100%),
                     linear-gradient(180deg, rgba(10,12,22,.16) 0%, rgba(10,12,22,.38) 55%, rgba(10,12,22,.60) 100%); }
        /* Local scrim behind the reading column: keeps text contrast without flattening the
           whole background, which is what the full-strength veil was doing. */
        /* z-index:0 is the load-bearing half. position:relative alone does NOT establish a
           stacking context, so the ::before scrim below escaped into the root context beside
           .env and painted UNDERNEATH it -- the scrim was invisible on every load and the
           legibility it was supposed to provide never existed. Proven by Nancy with a forced
           red-background diagnostic; an ordinary screenshot could not see it, because the
           source art happens to be dark at the top. */
        body.env-on .wrap{ position:relative; z-index:0; }
        body.env-on .wrap::before{
            content:''; position:absolute; inset:-10px 0 0; z-index:-1; pointer-events:none;
            background:linear-gradient(90deg, transparent 0, rgba(8,10,18,.52) 7%, rgba(8,10,18,.58) 93%, transparent 100%);
        }
        body.env-on{ background:transparent; }

        /* ── CARTRIDGE ITEMS ──
           These read as actual cartridges now, not panels with a stripe. A real cartridge has a
           recognisable silhouette: a notched shoulder where it seats, a raised label plate, and
           ridged grip lines down the spine. Content items are MODULES and have no per-item cover
           art, so the cartridge here is carried entirely by FORM -- which is exactly what the
           locked vocabulary means by cartridge = the container, label = what identifies it.

           Everything below is borders, gradients and clip-path: no images, no extra DOM, and no
           filter/backdrop-filter, because a card grid is 50+ elements and this page already paid
           for that lesson once (blur cost 48fps). */
        body.env-on .items{ gap:16px; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); }
        body.env-on .item{
            position:relative; padding:18px 18px 18px 30px; border-radius:8px 10px 10px 8px;
            background:
                linear-gradient(90deg, rgba(255,255,255,.045) 0 3px, transparent 3px),
                linear-gradient(160deg, rgba(34,44,66,.94), rgba(14,18,30,.96));
            border:1px solid rgba(255,255,255,.13);
            border-top-color:rgba(255,255,255,.22);          /* top-lit, like moulded plastic */
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.10),
                inset 0 -2px 0 rgba(0,0,0,.35),
                0 10px 22px -12px rgba(0,0,0,.9);
            /* The NOTCH: the corner cut that makes the shape read as a cartridge at a glance. */
            clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
            transition:transform .18s cubic-bezier(.22,.61,.36,1), border-color .18s, box-shadow .18s;
        }
        /* The SPINE: grip ridges down the left edge, the way a cartridge is gripped to pull it. */
        body.env-on .item::before{
            content:''; position:absolute; left:0; top:0; bottom:0; width:12px;
            background:
                repeating-linear-gradient(180deg,
                    rgba(255,255,255,.16) 0 2px, transparent 2px 6px),
                linear-gradient(180deg, var(--cyan), rgba(139,92,246,.95));
            box-shadow:1px 0 0 rgba(0,0,0,.45), 0 0 14px rgba(34,211,238,.4);
        }
        /* The LABEL PLATE: a raised inset panel the title sits on, like a cartridge sticker. */
        body.env-on .item::after{
            content:''; position:absolute; left:22px; right:12px; top:11px; bottom:11px;
            border-radius:4px; pointer-events:none;
            border:1px solid rgba(255,255,255,.07);
            background:linear-gradient(180deg, rgba(255,255,255,.045), transparent 60%);
        }
        body.env-on .item .t, body.env-on .item .d{ position:relative; z-index:1; }
        body.env-on .item:hover{
            transform:translateY(-3px);
            border-color:rgba(34,211,238,.5); border-top-color:rgba(34,211,238,.6);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.14),
                inset 0 -2px 0 rgba(0,0,0,.35),
                0 16px 30px -12px rgba(0,0,0,.95), 0 0 26px -6px rgba(34,211,238,.4);
        }
        body.env-on .item .t{ letter-spacing:.01em; }
        /* Muted grey (#8b95a8) is mixed for a flat dark page. Over a photographic sky it measured
           3.21:1 -- failing AA -- once the scrim was softened to let the picture through. Lifted
           in env mode so legibility does not depend on hiding the art behind a heavy scrim.
           NOTE: this rule existed, and I deleted it by accident when rewriting the cartridge
           block above. The contrast probe caught it on the very next run, which is the entire
           argument for having it. */
        body.env-on .sub, body.env-on .topbar a{ color:#ccd5e2; }
        body.env-on .section h2{ border-bottom-color:rgba(255,255,255,.14); }
        body.env-on .hub-head{ border-bottom-color:rgba(255,255,255,.14); }
        body.env-on .hub-icon{ border-color:rgba(255,255,255,.16); background:rgba(16,20,32,.72); }
        body.env-on .path{ border-color:rgba(255,255,255,.12); }
        body.env-on .path .steps span{ border-color:rgba(255,255,255,.16); }
        body.env-on .kid-card{ background:rgba(16,20,32,.86); }


        /* ── BIRDS ──
           Live elements crossing the scene, so the sky has something IN it rather than just
           drifting. Pure CSS/SVG: a handful of absolutely-positioned spans, animated with
           transform only, which is the same compositor-cheap path the planes use. Deliberately
           few (5) and small -- a flock would fight the reading column for attention, and every
           extra element is another composited layer on a student laptop.
           They sit BETWEEN the far and mid planes in z-order so they read as distant. */
        body.env-on .bird{ position:absolute; width:26px; height:26px; opacity:.5;
                           will-change:transform; pointer-events:none; }
        body.env-on .bird svg{ width:100%; height:100%; display:block; }
        body.env-on .bird path{ stroke:#0d2233; stroke-width:2.2; fill:none;
                                stroke-linecap:round; stroke-linejoin:round; }
        /* Wingbeat: two path states swapped by scaling the glyph vertically. Cheaper than
           animating the path data, and at this size the eye only reads "flapping". */
        body.env-on .bird svg{ animation:birdFlap 1.1s ease-in-out infinite alternate; }
        @keyframes birdFlap{ from{ transform:scaleY(1); } to{ transform:scaleY(.55); } }
        /* Each bird crosses on its own duration/height so they never move as a rigid formation. */
        @keyframes birdCross{
            from{ transform:translate3d(-8vw, 0, 0); }
            to  { transform:translate3d(112vw, -6vh, 0); }
        }
        body.env-on .bird{ animation:birdCross linear infinite; }
        body.env-on .bird-1{ top:16%; animation-duration:54s; animation-delay:  0s; transform:scale(1.00); }
        body.env-on .bird-2{ top:21%; animation-duration:67s; animation-delay: -9s; opacity:.38; }
        body.env-on .bird-3{ top:12%; animation-duration:78s; animation-delay:-31s; opacity:.30; }
        body.env-on .bird-4{ top:26%; animation-duration:61s; animation-delay:-46s; opacity:.44; }
        body.env-on .bird-5{ top:19%; animation-duration:88s; animation-delay:-22s; opacity:.26; }

        /* Motion is decoration here; the page must be complete without it. */
        @media (prefers-reduced-motion: reduce){
            body.env-on .env-layer{ transition:none !important; transform:none !important; }
            /* animation:none is the load-bearing line. Killing the parallax transform alone
               still left the ambient drift running, which is the motion a reduced-motion user
               is actually asking not to see. They get a still scene, not a calmer one. */
            body.env-on .env-plane{ animation:none !important; }
            body.env-on .bird, body.env-on .bird svg{ animation:none !important; }
            body.env-on .bird{ display:none; }   /* a frozen bird mid-sky reads as a bug */
            body.env-on .env-far{ transform:scale(1.20); }
            body.env-on .env-mid{ transform:scale(1.08); }
            body.env-on .env-near{ transform:scale(1.04); }
            body.env-on .item{ transition:none; }
            body.env-on .item:hover{ transform:none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <a href="/" id="homeLink">&larr; Hexworth Prime</a>
            <a href="#" id="houseLink" class="hidden"></a>
        </div>
        <div id="loading" class="state"><p>Loading hub&hellip;</p></div>
        <div id="notfound" class="state hidden">
            <h1>Hub not found</h1>
            <p>This hub does not exist or is not available yet. <a href="/">Return home</a>.</p>
        </div>
        <div id="hub" class="hidden"></div>
    </div>

    <!-- Firebase (compat) + init, mirrors the podium/house Firestore boot -->
    <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <!-- FirebaseAuth is required by ObservatoryTelemetry (uid + token). Telemetry self-inits
         on DOMContentLoaded and derives its per-hub course identity from location.pathname
         (/houses/hub/<id>), which the firebase.json rewrite preserves. -->
    <script src="/components/FirebaseAuth.js"></script>
    <script src="/components/ObservatoryTelemetry.js"></script>
    <!-- Static registry: container hubs render their member hubs (parent === this id)
         as a cartridge grid. Static data only; failure to load simply means no grid. -->
    <script src="/components/HubRegistry.js"></script>
    <!-- ContentCatalog powers the container-hub content projection: typed sections are
         PROJECTED from the catalog via each child's catalogCategories, never hand-listed
         (hand-lists drift; projections cannot). -->
    <script src="/components/ContentCatalog.js"></script>

    <script>
    (function () {
        'use strict';

        // ── XSS-safe helpers (adversarial-review #4/#8: hub fields are admin-written but the
        //    BUG-023 lesson is that "trusted" fields still reach stored-XSS sinks). Every hub
        //    field is escaped/allowlisted/path-validated before it touches the DOM. We build
        //    nodes with textContent + createElement; no hub data is ever passed to innerHTML. ──
        var SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;                 // hub id / house id shape
        var ICON = /^\/assets\/images\/icons\/[A-Za-z0-9_-]+\.webp$/;   // same-origin webp only
        var INTERNAL_HREF = /^\/(?!\/)[A-Za-z0-9/_.-]*$/;      // internal path only: single leading slash, no scheme/host, no protocol-relative //

        function el(tag, text, cls) {
            var n = document.createElement(tag);
            if (cls) { n.className = cls; }
            if (text != null) { n.textContent = String(text); }  // textContent = XSS-safe
            return n;
        }
        function safeIcon(v) {
            return (typeof v === 'string' && ICON.test(v)) ? v : '/assets/images/icons/hexworth-mark.webp';
        }
        function safeHref(v) {
            return (typeof v === 'string' && INTERNAL_HREF.test(v)) ? v : null;
        }
        function num(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }

        // Null-guarded: the not-found block is removed once a hub renders successfully (see
        // renderHub's tail), so a later call must not throw on a missing node.
        function show(id) { var n = document.getElementById(id); if (n) n.classList.remove('hidden'); }
        function hide(id) { var n = document.getElementById(id); if (n) n.classList.add('hidden'); }

        function fail() { hide('loading'); hide('hub'); show('notfound'); }

        // Render one typed section (slides/labs/quizzes/exams/projects/games). Items are rendered
        // safely; v1 hubs are empty skeletons so the empty state is the common path.
        function renderSection(parent, label, items) {
            var arr = Array.isArray(items) ? items : [];
            var sec = el('div', null, 'section');
            var h = el('h2');
            h.appendChild(el('span', label));
            h.appendChild(el('span', '(' + arr.length + ')', 'count'));
            sec.appendChild(h);
            if (arr.length === 0) {
                sec.appendChild(el('div', 'No ' + label.toLowerCase() + ' yet.', 'empty'));
            } else {
                var grid = el('div', null, 'items');
                arr.forEach(function (it) {
                    if (!it || typeof it !== 'object') { return; }
                    var href = safeHref(it.href);
                    var card = document.createElement(href ? 'a' : 'div');
                    card.className = 'item';
                    if (href) { card.setAttribute('href', href); }
                    card.appendChild(el('div', it.title || it.label || 'Untitled', 't'));
                    if (it.desc || it.sublabel) { card.appendChild(el('div', it.desc || it.sublabel, 'd')); }
                    grid.appendChild(card);
                });
                sec.appendChild(grid);
            }
            parent.appendChild(sec);
        }

        function renderHub(id, data) {
            document.title = (data.label ? String(data.label) : 'Hub') + ' - Hexworth Prime';

            // House back-link (houseId slug-validated -> safe path)
            if (typeof data.houseId === 'string' && SLUG.test(data.houseId)) {
                var hl = document.getElementById('houseLink');
                hl.setAttribute('href', '/houses/' + data.houseId + '/');
                hl.textContent = 'House: ' + data.houseId + ' →';
                hl.classList.remove('hidden');
            }

            var root = document.getElementById('hub');

            // Draft banner: only an admin can read a draft (rules enforce it), so if we got here
            // with a non-published doc, the viewer is an admin previewing.
            if (data.status !== 'published') {
                root.appendChild(el('div', 'DRAFT: visible to admins only. Publish this hub to make it live.', 'draft-banner'));
            }

            var head = el('div', null, 'hub-head');
            var iconBox = el('div', null, 'hub-icon');
            var img = document.createElement('img');
            img.src = safeIcon(data.icon);
            img.alt = '';
            iconBox.appendChild(img);
            head.appendChild(iconBox);

            var meta = el('div');
            meta.appendChild(el('div', (data.catalogCode ? String(data.catalogCode) + ' · ' : '') + 'Hub', 'eyebrow'));
            meta.appendChild(el('h1', data.label || 'Untitled Hub'));
            if (data.sublabel) { meta.appendChild(el('div', data.sublabel, 'sub')); }
            head.appendChild(meta);
            root.appendChild(head);

            // Optional multi-cert path
            if (Array.isArray(data.path) && data.path.length) {
                var pathBox = el('div', null, 'path');
                pathBox.appendChild(el('div', 'Certification Path', 'eyebrow'));
                var steps = el('div', null, 'steps');
                data.path.forEach(function (p) {
                    var lbl = (p && typeof p === 'object') ? (p.label || p.id) : p;
                    steps.appendChild(el('span', lbl != null ? lbl : ''));
                });
                pathBox.appendChild(steps);
                root.appendChild(pathBox);
            }

            // ── Container children: static registry hubs whose parent is this hub. ──
            // Rendered as a cover-cartridge grid ABOVE the typed sections (Frank: "it all
            // needs to be cartridge-fied"). Cover resolution copies catalog.html's pattern
            // (URL guess + onerror icon fallback -- deliberately NOT a manifest fetch, so
            // there is one cover-resolution mechanism platform-wide). Workshop-status
            // children are excluded (quarantined hubs never surface). Depth is capped at 1
            // by the registry audit (a hub with children may not itself have a parent), so
            // no recursion. Static registry only: dynamic hubs cannot carry parent yet
            // (the admin creator has no such input).
            var kids = (window.HubRegistry && HubRegistry.all ? HubRegistry.all() : [])
                .filter(function (h) { return h && h.parent === id && h.status !== 'workshop'; })
                .sort(function (a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); });
            if (kids.length) {
                var ksec = el('div', null, 'section');
                var kh = el('h2');
                kh.appendChild(el('span', 'Hubs'));
                kh.appendChild(el('span', '(' + kids.length + ')', 'count'));
                ksec.appendChild(kh);
                var kgrid = el('div', null, 'kids-grid');
                kids.forEach(function (h) {
                    var card = el('a', null, 'kid-card');
                    var href = safeHref(h.hubHref);
                    if (href) { card.setAttribute('href', href); }   // same degrade as renderSection: no href, dead card, never href="null"
                    var cov = document.createElement('img');
                    cov.className = 'kid-cover'; cov.alt = '';
                    if (SLUG.test(h.id)) { cov.src = '/assets/images/covers/' + h.id + '.webp'; }
                    cov.onerror = function () {
                        var fb = el('div', null, 'kid-fallback');
                        var fi = document.createElement('img'); fi.src = safeIcon(h.icon); fi.alt = '';
                        fb.appendChild(fi); cov.replaceWith(fb);
                    };
                    card.appendChild(cov);
                    var body = el('div', null, 'kid-body');
                    body.appendChild(el('div', h.label || h.id, 'kid-label'));
                    if (h.sublabel) { body.appendChild(el('div', h.sublabel, 'kid-sub')); }
                    card.appendChild(body);
                    kgrid.appendChild(card);
                });
                ksec.appendChild(kgrid);
                root.appendChild(ksec);
            }

            // ── Content projection (2026-07-30, Frank: "lets fill it... thats the whole
            // point"). A container hub's typed sections are PROJECTED from ContentCatalog
            // via its children's catalogCategories (explicit per-child mapping in
            // HubRegistry, audited by hub-registry-audit section F). Hand-lists drift;
            // this cannot: new catalogued openstack content appears here with zero edits.
            // Firestore-authored sections remain additive on top (admin curation wins the
            // front of each list). Catalog fields are rendered through the SAME safe path
            // as everything else (renderSection uses textContent + safeHref only).
            var proj = { slides: [], labs: [], quizzes: [], exams: [], projects: [], games: [], other: [] };
            var cats = {};
            kids.forEach(function (h) {
                (Array.isArray(h.catalogCategories) ? h.catalogCategories : []).forEach(function (c) { cats[c] = true; });
            });
            if (Object.keys(cats).length && window.ContentCatalog && Array.isArray(ContentCatalog.MODULES)) {
                var BUCKET = { presentation: 'slides', lab: 'labs', quiz: 'quizzes', exam: 'exams',
                               project: 'projects', game: 'games', review: 'games' };
                // Projection-WIDE href de-dup (Chris block 2026-07-30): the catalog carries
                // historical duplicate entries pointing at the same file ("AWS Use Cases"
                // twice, four openstack lesson1..4 aliases). First entry wins; a shelf that
                // lists the same file twice reads as a data leak, not a curriculum.
                var projSeen = {};
                ContentCatalog.MODULES.forEach(function (m) {
                    if (!m || !cats[m.category] || m.status !== 'available') { return; }
                    var comp = (Array.isArray(m.components) && m.components[0]) || '';
                    var bucket = BUCKET[comp] || 'other';
                    // catalog hrefs are house-relative; the projection absolutizes them
                    var href = (typeof m.house === 'string' && SLUG.test(m.house) && typeof m.href === 'string')
                        ? '/houses/' + m.house + '/' + m.href : null;
                    if (href) {
                        if (projSeen[href]) { return; }
                        projSeen[href] = true;
                    }
                    proj[bucket].push({ title: m.title, desc: m.description, href: href });
                });
            }
            function merged(admin, projected) {
                // De-dup by href (Nancy): an admin-curated Firestore item that is ALSO
                // catalog content must not render twice. Curated copy wins the slot.
                var a = Array.isArray(admin) ? admin : [];
                var seen = {};
                a.forEach(function (it) { if (it && typeof it.href === 'string') seen[it.href] = true; });
                return a.concat(projected.filter(function (it) { return !(it.href && seen[it.href]); }));
            }

            // Typed content sections: admin-curated Firestore items first, projection after.
            var s = (data.sections && typeof data.sections === 'object') ? data.sections : {};
            renderSection(root, 'Slides', merged(s.slides, proj.slides));
            renderSection(root, 'Labs', merged(s.labs, proj.labs));
            renderSection(root, 'Quizzes', merged(s.quizzes, proj.quizzes));
            renderSection(root, 'Exams', merged(s.exams, proj.exams));
            renderSection(root, 'Projects', merged(s.projects, proj.projects));
            renderSection(root, 'Games', merged(s.games, proj.games));
            // Anything the six buckets cannot honestly hold (applets, tools) gets its own
            // shelf rather than being silently dropped or miscategorized.
            if (proj.other.length) { renderSection(root, 'Applets & Tools', proj.other); }

            hide('loading');
            show('hub');

            // The page carried TWO h1s: this static "Hub not found" heading and the hub label
            // built above. The not-found one is FIRST in document order, so anything reading
            // "the page's h1" (heading navigation, crawlers) saw it on a perfectly good hub
            // (taskboard #233). Remove it now that a hub has definitely rendered -- LAST, after
            // show('hub'), so a throw earlier in this function still leaves fail() a node to
            // show; show()/hide() are null-guarded for the same reason.
            var nf = document.getElementById('notfound');
            if (nf && nf.parentNode) { nf.parentNode.removeChild(nf); }
        }

        // ── Boot: parse id from /houses/hub/<id>, validate, fetch, render. ──
        // Whole body is try/catch-guarded: any synchronous throw (a malformed firebase init,
        // an unexpected DOM state) must degrade to the not-found state, never hang on the
        // loading spinner (adversarial-review #2). We do NOT decodeURIComponent the id: a
        // legitimate hub id is [a-z0-9-] and never percent-encoded, and decodeURIComponent
        // throws URIError on a stray '%' (e.g. /houses/hub/foo%), validating the raw segment
        // against SLUG both avoids that throw and removes any smuggling surface.
        // ── Environment pilot ──
        // Explicit allowlist, NOT "every hub that happens to have a cover". This file renders
        // every Firestore hub, so opting in by asset presence would re-skin all of them the
        // moment their art landed. Adding a hub here is a deliberate act.
        // Points at a BACKDROP, not the hub's cartridge cover. The first build reused the cover
        // and it could never look right: covers are 512x512 by design (gen_cover.py hardcodes
        // that resize, because a cover is the picture inside a cartridge), so filling a 1440px
        // viewport meant a MEASURED 3.7x upscale of a 24KB lossy square, force-cropped from 1:1
        // to 16:9. The "sharp" focal plane was physically incapable of being sharp. The backdrop
        // is 1920x1080, generated by _tools/covers/gen_backdrop.py and composed for the job:
        // interest at the edges, quiet centre where the reading column sits, dark top and bottom.
        var ENV_HUBS = { 'cloud-master': '/assets/images/backdrops/cloud-master.webp' };

        function mountEnvironment(id) {
            var art = Object.prototype.hasOwnProperty.call(ENV_HUBS, id) ? ENV_HUBS[id] : null;
            if (!art) { return; }
            var env = document.createElement('div');
            env.className = 'env';
            env.setAttribute('aria-hidden', 'true');   // decorative; never announced
            // TWO elements per plane, and the nesting is load-bearing:
            //   outer .env-layer  <- JS writes style.transform here (pointer/scroll parallax)
            //   inner .env-plane  <- CSS @keyframes drift lives here (ambient motion)
            // On a single element the running animation wins the transform property and the
            // parallax silently stops working. That is why the scene only moved on pointer
            // move before the drift existed, and why merging them would kill the parallax now.
            // Each plane gets its OWN pre-blurred file; only the focal mid plane uses the sharp
            // original. `art` is the base path, e.g. /assets/images/backdrops/cloud-master.webp
            var base = art.replace(/\.webp$/, '');
            var planeArt = { 'env-far': base + '-far.webp', 'env-mid': art, 'env-near': base + '-near.webp' };
            var layers = ['env-far', 'env-mid', 'env-near'].map(function (cls) {
                var outer = document.createElement('div');
                outer.className = 'env-layer';
                var plane = document.createElement('div');
                plane.className = 'env-plane ' + cls;
                plane.style.backgroundImage = 'url("' + planeArt[cls] + '")';
                outer.appendChild(plane);
                env.appendChild(outer);
                return outer;
            });
            // Birds go BETWEEN far and mid in DOM order, so they sit behind the nearer cloud
            // plane and read as distant rather than pasted on the glass.
            var flock = document.createElement('div');
            flock.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
            for (var bi = 1; bi <= 5; bi++) {
                var bird = document.createElement('span');
                bird.className = 'bird bird-' + bi;
                bird.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                    '<path d="M2 13 C 6 7, 9 7, 12 12 C 15 7, 18 7, 22 13"/></svg>';
                flock.appendChild(bird);
            }
            // Anchor to the actual mid plane, NOT env.children[1]. Indexing a live children
            // collection made the birds' depth depend on the order layers happen to be appended
            // a few lines above: reorder that array for any reason and the flock silently moves
            // to the wrong plane with nothing to catch it. Stacking here is pure DOM order --
            // there is no z-index on the planes -- so this is the whole mechanism. (Nancy)
            env.insertBefore(flock, layers[1] || null);

            var veil = document.createElement('div');
            veil.className = 'env-veil';
            env.appendChild(veil);
            document.body.appendChild(env);
            document.body.classList.add('env-on');

            // Parallax. Guarded on the media query so reduced-motion users get a still image
            // rather than a transform we merely animate less.
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
            if (reduce && reduce.matches) { return; }
            // Depth factors: far barely moves, near counter-moves. That opposition is what
            // reads as depth -- layers sliding the same way just looks like a sliding image.
            var depth = [-6, 14, -22];
            var scale = [1.18, 1.06, 1.02];
            var px = 0, py = 0, sy = 0, queued = false;
            function apply() {
                queued = false;
                for (var i = 0; i < layers.length; i++) {
                    layers[i].style.transform =
                        'scale(' + scale[i] + ') translate3d(' + (px * depth[i]) + 'px,' +
                        ((py * depth[i]) + (sy * depth[i] * 0.06)) + 'px,0)';
                }
            }
            function queue() { if (!queued) { queued = true; window.requestAnimationFrame(apply); } }
            window.addEventListener('pointermove', function (e) {
                px = (e.clientX / window.innerWidth) - 0.5;
                py = (e.clientY / window.innerHeight) - 0.5;
                queue();
            }, { passive: true });
            window.addEventListener('scroll', function () { sy = window.scrollY || 0; queue(); }, { passive: true });
        }

        function boot() {
            try {
                var m = location.pathname.match(/\/houses\/hub\/([^/]+)\/?$/);
                var id = m ? m[1] : '';
                if (!SLUG.test(id)) { return fail(); }        // no/invalid id -> not found
                if (typeof firebase === 'undefined' || !firebase.firestore) { return fail(); }
                var db = firebase.firestore();
                db.collection('hubRegistry').doc(id).get().then(function (snap) {
                    // Reached only when rules ALLOWED the read: a published hub (any viewer) or a
                    // draft an admin may preview. A non-admin's get of a draft OR a truly-missing
                    // doc is permission-denied (the rule errors on a null resource), so it lands in
                    // .catch() below, the two cases converge on the same not-found UI (no leak).
                    if (!snap.exists) { return fail(); }      // admin-only path: missing id
                    // Mount the environment only on the SUCCESS path. Mounting in boot() fired it
                    // on the URL alone, so it painted behind the "Loading hub..." spinner and
                    // would have persisted into the not-found state if this hub were ever
                    // unpublished, deleted, or hit permission-denied/offline. Decoration must not
                    // outlive the content it decorates.
                    mountEnvironment(id);
                    renderHub(id, snap.data() || {});
                }).catch(function () {
                    // Denied (non-admin draft/missing) or offline. Never leak that a draft exists.
                    fail();
                });
            } catch (e) { fail(); }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else { boot(); }
    })();
    </script>
</body>
</html>
