    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 07: Infrastructure Security',
            description: 'Network architecture, segmentation, hardening, and defense in depth',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch07-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Zero Trust architecture differs from traditional perimeter-based security primarily because it:",
                    options: [
                        "Eliminates the need for firewalls by encrypting all internal traffic",
                        "Removes the assumption that anything inside the network boundary can be trusted, requiring verification for every access request",
                        "Requires all users to use VPN access from outside the physical building",
                        "Consolidates all security controls into a single unified security platform"
                    ],explanation: "Zero Trust removes the implicit trust that traditional security placed on anything inside the network perimeter. The core principle is 'never trust, always verify' — every access request from any user, device, or service must be verified regardless of source. Traditional perimeter security trusted everything inside the firewall, allowing attackers who breached the perimeter to move laterally with minimal resistance. Zero Trust addresses this through micro-segmentation, continuous authentication, and least-privilege access enforcement."
                },
                {
                    question: "A network administrator places a 'jump box' (bastion host) in a segmented production network. What is the PRIMARY security purpose of this approach?",
                    options: [
                        "To provide a backup internet connection if the primary connection fails",
                        "To provide a controlled, monitored access point for managing systems in the segmented environment",
                        "To act as a firewall between the production network and the internet",
                        "To run vulnerability scans against production systems without affecting other network segments"
                    ],explanation: "A jump box (bastion host) is a hardened system that provides a controlled, monitored access point into a segmented environment. Administrators must authenticate to the jump box before accessing systems in the protected segment — all administrative sessions pass through this single point. This provides full session logging and monitoring of all administrative activity. The jump box spans two security zones, making it a high-value target that must itself be rigorously hardened, patched, and monitored with strong MFA authentication."
                },
                {
                    question: "Which security control type is specifically designed to DETECT an incident and capture information about it, allowing a response?",
                    options: [
                        "Preventive control",
                        "Corrective control",
                        "Detective control",
                        "Administrative control"
                    ],explanation: "Detective controls are designed to identify and document security incidents as they occur, capturing information that enables a response. Examples include IDS (Intrusion Detection Systems), SIEM alerts, audit logs, motion sensors, and alarms. Preventive controls (firewalls, training) stop incidents before they occur. Corrective controls (patching, antimalware cleanup, system restores) remediate the damage after an incident. Administrative controls (policies, procedures, training programs) use management processes to reduce risk."
                },
                {
                    question: "A security analyst observes that a recently deployed patch caused a critical application to fail. Which personnel security control is MOST designed to prevent a single administrator from making this type of unauthorized change?",
                    options: [
                        "Mandatory vacation",
                        "Cross-training",
                        "Change control with separation of duties",
                        "Background checks"
                    ],explanation: "Change control combined with separation of duties prevents a single administrator from independently making changes to production systems. Change control requires formal approval before modifications are made, and separation of duties ensures the person who implements a change is different from the person who approves it — creating a check-and-balance system. Mandatory vacation helps detect fraud by removing continuous access. Cross-training ensures backup coverage. Background checks are pre-employment controls that don't prevent post-hire unauthorized changes."
                },
                {
                    question: "Endpoint Detection and Response (EDR) differs from traditional antivirus software primarily because EDR:",
                    options: [
                        "Uses signature databases that are updated more frequently than traditional antivirus",
                        "Provides continuous monitoring of endpoint activity and automated response to advanced threats, not just signature matching",
                        "Requires no agent installation on endpoints, operating entirely at the network level",
                        "Is exclusively designed for server endpoints, not desktop or laptop computers"
                    ],explanation: "EDR provides continuous monitoring and recording of endpoint activity — process execution, network connections, file modifications, registry changes — and uses behavioral analysis and threat intelligence to detect advanced threats that evade signature-based detection. Unlike traditional antivirus that primarily compares files to known malware signatures, EDR can detect polymorphic malware, fileless attacks, and advanced persistent threats through behavioral patterns. EDR also provides automated response capabilities (isolating infected endpoints) and forensic investigation data."
                },
                {
                    question: "Sinkholing is a defensive technique that:",
                    options: [
                        "Physically isolates compromised systems from the network by cutting network cables",
                        "Redirects malicious traffic from its original destination to an analyst-controlled destination for analysis",
                        "Gradually reduces network bandwidth to suspected malicious connections until they are dropped",
                        "Creates decoy accounts to attract attackers away from legitimate user accounts"
                    ],explanation: "Sinkholing redirects traffic (typically malicious command-and-control traffic from malware-infected systems) from its original destination to an analyst-controlled server. Security researchers and defenders use sinkholing to: (1) prevent infected systems from receiving commands from attackers, (2) measure the scale of malware infections by counting how many systems try to connect to the sinkhole, and (3) analyze what commands the attacker was trying to issue. DNS sinkholing is the most common form, changing DNS responses to redirect malicious domain lookups."
                },
                {
                    question: "The principle of 'mandatory vacations' as a personnel security control is primarily intended to:",
                    options: [
                        "Improve employee morale and reduce burnout to prevent security mistakes from fatigue",
                        "Ensure all employees maintain current certifications during required training periods",
                        "Force periods of absence that allow detection of ongoing fraud or concealed unauthorized activity",
                        "Reduce the number of system accounts that need to be monitored during peak operational periods"
                    ],explanation: "Mandatory vacation policies require employees — especially those with access to financial systems, critical infrastructure, or sensitive data — to take periods of absence during which their regular access is handled by others. This forces any ongoing fraud or manipulation to surface: a fraudulent scheme that requires daily attention cannot be sustained during the employee's absence. This is why financial industry regulations (like FINRA rules) often mandate vacation periods for employees handling client funds. It's a detective control, not a morale initiative."
                },
                {
                    question: "Port security on a network switch monitors and restricts access based on which type of address?",
                    options: [
                        "IP addresses of connecting devices",
                        "MAC (hardware) addresses of connecting devices",
                        "DNS hostnames of connecting devices",
                        "Digital certificates presented by connecting devices"
                    ],explanation: "Port security is a switch-level feature that monitors the MAC (Media Access Control / hardware) addresses of devices connected to switch ports. It can be configured to allow only specific MAC addresses on each port, limiting the number of MAC addresses per port, or triggering alerts/shutdown when unauthorized MAC addresses are detected. This prevents unauthorized devices from connecting to the network at the physical access layer. Limitation: MAC addresses can be spoofed, so port security provides a layer of defense but is not a complete access control solution."
                },
                {
                    question: "Behavior-based malware detection is valuable primarily because it can identify:",
                    options: [
                        "Only malware that matches known signatures in the antivirus database",
                        "Polymorphic malware that changes its binary signature on each infection, evading hash-based detection",
                        "Malware only when it attempts to connect to known malicious IP addresses",
                        "Malware exclusively on Windows systems where behavioral monitoring agents are available"
                    ],explanation: "Behavior-based detection identifies malware by observing what it does (actions, behaviors, API calls) rather than what it looks like (file hash or signature). This is critical for detecting polymorphic malware, which modifies its own binary on each infection to avoid signature matching. A polymorphic virus may have hundreds of unique hashes, but it still exhibits the same behaviors: encrypting user files, creating persistence mechanisms, beaconing to a command-and-control server. Behavior-based detection catches these patterns regardless of the specific binary variation."
                },
                {
                    question: "An organization wants to implement network access control (NAC). What is the PRIMARY function of NAC?",
                    options: [
                        "Monitor and filter outbound web traffic from employee computers",
                        "Require devices to authenticate or meet health/posture requirements before connecting to the network",
                        "Encrypt all network traffic between endpoints using TLS tunneling",
                        "Manage and rotate network passwords on a scheduled basis"
                    ],explanation: "Network Access Control (NAC) controls which devices can connect to the network by requiring authentication, checking device health (posture assessment), and enforcing compliance before granting access. NAC can verify: is this device domain-joined? Does it have current antivirus signatures? Has the OS been patched recently? Is disk encryption enabled? Devices that fail posture checks can be quarantined to a remediation VLAN rather than given full network access. NAC addresses the threat of unauthorized or compromised devices connecting to the internal network."
                }
            ]
        });

    </script>
