    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 11: Incident Response Programs',
            description: 'IR lifecycle, incident classification, and response procedures',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch11-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "According to NIST SP 800-61, which statement BEST describes the relationship between events and security incidents?",
                    options: [
                        "Every event is a security incident requiring formal response",
                        "Not every event is an incident, but every incident contains at least one event",
                        "Security incidents are a subset of adverse events only",
                        "Events and incidents are interchangeable terms in NIST documentation"
                    ],explanation: "NIST SP 800-61 clearly establishes this hierarchy: Events are any observable occurrences. Adverse events are events with negative consequences. Security incidents are imminent threats of violation or actual violations of security policy. Therefore, not every event (or even adverse event) rises to the level of a security incident requiring formal CSIRT activation. This distinction shapes how analysts prioritize and triage the volume of events generated by monitoring systems."
                },
                {
                    question: "Which NIST SP 800-61 incident response phase is described as the foundation-building phase that occurs BEFORE an incident happens?",
                    options: [
                        "Detection and Analysis",
                        "Containment, Eradication, and Recovery",
                        "Preparation",
                        "Post-Incident Activity"
                    ],explanation: "Preparation is Phase 1 of the NIST 800-61 IR lifecycle and the only phase that occurs before an incident. It involves building the CSIRT, establishing policy and procedures, developing playbooks, training personnel, acquiring and staging equipment (forensic toolkits, response laptops), and establishing communication channels. Organizations that invest heavily in Preparation experience significantly shorter response times and less damage during actual incidents."
                },
                {
                    question: "During the Containment, Eradication, and Recovery phase, what is the MOST important activity to perform BEFORE eradicating malware from a compromised system?",
                    options: [
                        "Notify law enforcement immediately",
                        "Restore the system from a clean backup",
                        "Gather forensic evidence including memory dumps and disk images",
                        "Patch the vulnerability that was exploited"
                    ],explanation: "Evidence collection must occur before eradication because eradication destroys forensic artifacts. Volatile evidence (RAM contents, running processes, network connections) is lost when a system is rebooted or reimaged. Non-volatile evidence (disk images, log files) is lost or altered during remediation. Chain of custody documentation must be maintained. This evidence is needed for root cause analysis, legal proceedings, lessons learned, and threat intelligence. Eradicating before collecting evidence is an irreversible mistake."
                },
                {
                    question: "A CSIRT playbook is BEST described as which of the following?",
                    options: [
                        "The organization's high-level IR policy document approved by the CEO",
                        "A step-by-step response guide for a specific high-severity incident type",
                        "A general procedure manual covering all types of security incidents",
                        "A technical manual for configuring SIEM correlation rules"
                    ],explanation: "A playbook provides detailed, step-by-step guidance for responding to a specific type of incident — such as a data breach, ransomware infection, phishing attack, or web defacement. Unlike the high-level IR policy (which provides authority and scope) or general procedures (which apply broadly), playbooks are tailored to specific scenarios and include decision points, escalation criteria, notification requirements, and technical steps specific to that incident type. They translate policy into operational action."
                },
                {
                    question: "Which CSIRT member role is specifically responsible for ensuring that incident response actions comply with legal, regulatory, and policy requirements?",
                    options: [
                        "Technical Subject-Matter Expert",
                        "IT Support Staff",
                        "Legal Counsel",
                        "Public Relations Staff"
                    ],explanation: "Legal counsel is the CSIRT member responsible for ensuring all response actions comply with legal, policy, and regulatory requirements. This is critical because IR actions — evidence preservation, network monitoring, system access, law enforcement engagement, and breach notification — all have legal implications. Legal counsel must be consulted before contacting law enforcement (to understand implications), when preserving evidence for litigation, and when making public disclosures. Acting without legal review during an incident can create liability."
                },
                {
                    question: "The NIST SP 800-61 lessons-learned process occurs during which IR phase?",
                    options: [
                        "Preparation",
                        "Detection and Analysis",
                        "Containment, Eradication, and Recovery",
                        "Post-Incident Activity"
                    ],explanation: "The Lessons Learned review is a key activity in Phase 4: Post-Incident Activity. It is conducted after the incident is fully resolved. The review uses the incident timeline to evaluate how the team performed, whether procedures were adequate, what should be done differently, and what new tools or training are needed. Critically, lessons learned must be fed back into the organization's ITSM processes and Preparation activities — otherwise the review has no lasting impact. It closes the loop between an incident and future preparedness."
                },
                {
                    question: "Under NIST SP 800-61 threat classification, which category describes an attack launched using a brute-force method to overwhelm or deny a service?",
                    options: [
                        "Web",
                        "Attrition",
                        "Impersonation",
                        "External/Removable Media"
                    ],explanation: "NIST 800-61 classifies 'Attrition' as attacks that employ brute-force methods to compromise, deny, or degrade services, systems, or networks. This category includes DoS/DDoS attacks (overwhelming with traffic), brute-force password attacks, and sustained network flooding. The term 'attrition' reflects the idea of wearing down defenses through persistent, forceful attacks rather than exploiting a specific vulnerability."
                },
                {
                    question: "Why does NIST SP 800-61 recommend using out-of-band communication during an incident response?",
                    options: [
                        "To ensure all communications are encrypted with the highest available cipher",
                        "Because normal communication channels may be compromised or monitored by the attacker",
                        "To comply with legal requirements for incident documentation",
                        "Because in-band communication is too slow for real-time IR coordination"
                    ],explanation: "If an attacker has compromised the organization's email, Slack, Teams, or other internal communication systems, using those channels during IR exposes the response plan to the attacker. Out-of-band communication — personal cell phones, SMS, Signal, dedicated conference bridges on external infrastructure — ensures responders can coordinate without the attacker knowing what they are doing. This is especially critical during ransomware incidents where the attacker may be actively monitoring the compromised environment."
                },
                {
                    question: "How long must US government agencies retain all incident handling records under legal requirements?",
                    options: [
                        "1 year",
                        "2 years",
                        "3 years",
                        "5 years"
                    ],explanation: "NIST SP 800-61 specifies that US Government agencies must retain all incident handling items (logs, evidence, documentation, forensic images, communications) for 3 years due to legal requirements. Private organizations typically maintain records for 2 years, unless regulatory requirements mandate longer periods. Industry-specific regulations may require longer retention — HIPAA breaches have notification records that must be retained 6 years, and some financial regulations require even longer periods."
                },
                {
                    question: "Incident severity classification considers multiple factors. Which four dimensions does NIST SP 800-61 use to assess incident impact?",
                    options: [
                        "Financial cost, legal exposure, media coverage, and regulatory penalties",
                        "Functional impact, economic impact, recoverability effort, and information impact",
                        "Systems affected, data volume breached, attacker sophistication, and detection time",
                        "Network scope, user count affected, business unit impacted, and geographic spread"
                    ],explanation: "NIST SP 800-61 uses four impact dimensions to classify incident severity: (1) Functional Impact — the degree of operational impairment; (2) Economic Impact — financial losses to the organization; (3) Recoverability Effort — time and resources needed to return to normal; (4) Information Impact — the degree of information compromise (classified, sensitive, regulated data). These four dimensions together determine incident priority and the level of response escalation required. They are assessed at incident classification and updated as the incident evolves."
                }
            ]
        });
        quiz.start();
    </script>
