    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 10: Security Operations',
            description: 'SecOps practices, monitoring, logging, and security automation',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch10-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "A SIEM correlation rule is designed to detect compromised internal hosts communicating with known-bad external IP addresses and then automatically block the connection. What type of intelligence does the rule use to identify those bad IPs?",
                    options: [
                        "Vulnerability scan results",
                        "IP reputation lists / threat intelligence feeds",
                        "Intrusion detection signatures",
                        "DNS query logs"
                    ],explanation: "The correlation rule described uses IP reputation lists — databases of known-malicious IP addresses maintained by threat intelligence providers (commercial and open source). When an internal host attempts to connect to a known-bad IP, the rule fires. This is a common SIEM use case: pairing netflow or proxy log data with threat intelligence feeds to detect C2 communications and botnet activity."
                },
                {
                    question: "SOAR stands for Security Orchestration, Automation, and Response. Which of the following BEST describes what SOAR adds compared to a traditional SIEM?",
                    options: [
                        "Faster log ingestion and more storage capacity",
                        "The ability to automatically respond and take remediation actions without manual analyst intervention",
                        "More detailed threat intelligence correlation",
                        "Better dashboarding and reporting capabilities"
                    ],explanation: "SIEM collects, correlates, and alerts — then a human analyst takes action. SOAR goes further: it can automatically respond. When a correlation fires, a SOAR playbook can automatically isolate the affected host, create a ticket, block the IP at the firewall, enrich the alert with threat intelligence, and notify the on-call analyst — all without human intervention. This reduces Mean Time to Respond (MTTR) from hours to minutes for known incident types."
                },
                {
                    question: "DomainKeys Identified Mail (DKIM) primarily protects email receivers by ensuring what?",
                    options: [
                        "The email was not marked as spam by the sender's mail server",
                        "The message came from the claimed sending domain and was not modified in transit",
                        "The sender's IP address is listed in the recipient's approved sender list",
                        "The email was scanned for malware before delivery"
                    ],explanation: "DKIM works by having the sending organization sign the email body and selected headers with a private key. The receiving server retrieves the public key from DNS and validates the signature. This proves two things: (1) the message originated from an entity that controls the claimed domain (authenticity), and (2) the content was not modified between sending and receiving (integrity). DKIM does not prevent spam or scan for malware — those are separate controls."
                },
                {
                    question: "What is the primary characteristic that distinguishes 'double flux' DNS from 'single flux' DNS in the context of malware C2 infrastructure?",
                    options: [
                        "Double flux uses two different domain names simultaneously",
                        "Double flux also rotates the DNS name servers (NS records) in addition to the A records",
                        "Double flux operates at twice the frequency of single flux",
                        "Double flux uses both IPv4 and IPv6 records"
                    ],explanation: "Single flux continuously rotates the IP addresses (A records) associated with a domain, using short TTLs and round-robin DNS to cycle through many compromised hosts. Double flux adds another layer: it ALSO rotates the DNS name servers (NS records) for the zone, making takedown significantly harder because law enforcement must coordinate not just with the registrar but also disrupt the DNS infrastructure itself. Both techniques are used by sophisticated botnets to maintain resilience."
                },
                {
                    question: "A security analyst runs the command 'grep cysa example.txt | more'. What does the pipe symbol (|) accomplish in this command?",
                    options: [
                        "It searches both cysa and more simultaneously as two different strings",
                        "It sends the output of grep as input to the more command for paginated display",
                        "It logs the grep output to a file named 'more'",
                        "It performs a recursive grep across all subdirectories"
                    ],explanation: "The pipe symbol (|) in Unix/Linux command-line operations sends the standard output (stdout) of one command as the standard input (stdin) to the next command. In this case, grep searches for 'cysa' in example.txt and the matching lines are piped to 'more', which paginates the output — allowing the analyst to read through large results one screen at a time using the spacebar. This chaining of tools is foundational to command-line log analysis."
                },
                {
                    question: "Web Application Firewalls (WAF) are specifically designed to detect attacks matching which threat classification list by default?",
                    options: [
                        "CVE/NVD vulnerability database",
                        "OWASP Top 10",
                        "MITRE ATT&CK framework",
                        "CIS Critical Security Controls"
                    ],explanation: "WAFs operate at the application layer (Layer 7) and ship with default rulesets designed to detect attacks that match the OWASP Top 10 vulnerability categories — including SQL injection, XSS, path traversal, broken authentication, and others. This is why WAFs are considered a key compensating control for web application vulnerabilities. Unlike network firewalls that work at Layers 3-4, WAFs inspect HTTP/HTTPS request content including headers, parameters, and body."
                },
                {
                    question: "Heuristic malware analysis can detect unknown malware but has a significant drawback. What is that drawback?",
                    options: [
                        "It can only run on Windows systems",
                        "It requires an active internet connection to the malware database",
                        "It may confuse legitimate programs for malware, generating false positives",
                        "It cannot analyze packed or obfuscated malware"
                    ],explanation: "Heuristic analysis compares program structure or behavior to known malware characteristics — without requiring an exact signature match. This allows detection of unknown or polymorphic malware. The tradeoff is false positives: legitimate programs that use similar code patterns, compression, or behaviors to known malware may be incorrectly flagged. Security teams must tune heuristic thresholds and whitelist known-good applications to manage false positive rates."
                },
                {
                    question: "Proxy logs can be valuable for detecting malicious activity. Which specific indicator in proxy logs would MOST likely suggest a compromised host making C2 connections?",
                    options: [
                        "A large number of HTTP 404 errors from the proxy",
                        "Unusual or generic user-agent strings combined with regular interval connection patterns to rare external hosts",
                        "SSL certificate errors from external websites",
                        "High volume of cached content being served by the proxy"
                    ],explanation: "C2 malware often generates distinctive proxy log patterns: (1) unusual or hardcoded user-agent strings that don't match real browsers, (2) connections at regular intervals (beaconing) to rare or newly-registered domains, (3) consistent destination hosts that change over time (DGA), or (4) unusually consistent request sizes. Security analysts specifically look for combinations of these indicators because any one in isolation may be benign."
                },
                {
                    question: "Which three email authentication technologies work together to provide a comprehensive defense against email spoofing?",
                    options: [
                        "TLS, S/MIME, and PGP",
                        "SPF, DKIM, and DMARC",
                        "STARTTLS, MTA-STS, and BIMI",
                        "SMTP, IMAP, and POP3"
                    ],explanation: "SPF (verifies the sending server is authorized for the domain), DKIM (cryptographically signs the message to verify authenticity and integrity), and DMARC (uses SPF and DKIM results to enforce a policy — reject, quarantine, or none — and generates reports) form the email authentication triad. DMARC is the orchestrator: it tells receiving servers what to do when SPF or DKIM checks fail, and reports back to domain owners on authentication results. All three should be implemented together for effective anti-spoofing protection."
                },
                {
                    question: "What does SNMPv3 add to SNMP that previous versions lacked, making v1 and v2 security risks?",
                    options: [
                        "Support for IPv6 addresses",
                        "The ability to poll more devices simultaneously",
                        "Encryption, authentication, and user-level access capabilities",
                        "Faster polling intervals and real-time alerting"
                    ],explanation: "SNMPv1 and SNMPv2 transmitted community strings (essentially passwords) in plaintext and had minimal authentication — making them easily exploitable for credential theft and unauthorized access to network device configurations. SNMPv3 adds: encryption for data in transit (protecting community strings and OID data), message authentication (ensuring messages are from legitimate sources and haven't been tampered with), and user-based security model (USMS) with proper user accounts rather than shared community strings. SNMPv1/v2 should be disabled on modern networks."
                }
            ]
        });
        quiz.start();
    </script>
