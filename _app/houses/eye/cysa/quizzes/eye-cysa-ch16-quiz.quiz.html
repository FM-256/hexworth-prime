    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 16: Policy and Compliance',
            description: 'Security policies, standards, regulations, and compliance frameworks',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch16-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Which tier of the policy document hierarchy provides best-practice recommendations but does NOT require mandatory compliance?",
                    options: [
                        "Policies — approved by C-Suite executives",
                        "Standards — mandatory rules implementing the policy",
                        "Procedures — step-by-step action instructions",
                        "Guidelines — optional best-practice recommendations allowing exceptions"
                    ],explanation: "Guidelines are the only non-mandatory tier in the policy hierarchy. They provide best practices and recommendations, but compliance is optional — organizations can deviate from guidelines as circumstances require. This flexibility distinguishes them from Policies (mandatory, C-Suite approved), Standards (mandatory, lower-level approved), and Procedures (detailed, mandatory steps for specific tasks). On the exam, if asked which document is 'not required' or 'flexible,' the answer is Guidelines. Example: a guideline might recommend how to store files in cloud services — useful but not enforced."
                },
                {
                    question: "An employee wants to use a personal cloud storage service to store work files because it is more convenient than the company's approved system. The acceptable use policy prohibits this. What is the correct process if the employee has a legitimate business need?",
                    options: [
                        "The employee can proceed since convenience is a legitimate business need",
                        "The employee must submit a formal exception request including: the policy requiring exception, business justification, scope and duration, associated risks, and compensating controls — approved by the authority specified in the policy",
                        "The employee should ask their manager informally to approve the exception verbally",
                        "Guidelines allow this — only violations of standards require formal exceptions"
                    ],explanation: "Policy exceptions require a formal process, not an informal workaround. The exception request must document: which policy/standard requires deviation, the specific reason for the exception request, the scope (what exactly is permitted) and duration (how long the exception applies), the risks created by the deviation, and compensating controls that reduce those risks. The exception must be approved by the authority designated in the policy — typically the CISO or data owner, not a line manager. Undocumented, unauthorized deviations are policy violations. Formal exceptions create accountability and enable tracking of where the organization accepts additional risk."
                },
                {
                    question: "A hospital that treats patients, processes insurance claims, and contracts with a billing company is subject to HIPAA. Which parties are directly bound by HIPAA's Security Rule?",
                    options: [
                        "Only the hospital itself as the primary covered entity",
                        "The hospital (covered entity) and the billing company (business associate) — business associates handling ePHI on behalf of covered entities became directly subject to HIPAA under the 2013 Omnibus Rule",
                        "All three parties plus any vendors who supply software to the hospital",
                        "HIPAA only applies to hospitals with more than 100 beds"
                    ],explanation: "HIPAA's Security Rule applies to covered entities (healthcare providers, health plans, clearinghouses) and their business associates. A business associate is any organization that creates, receives, maintains, or transmits ePHI on behalf of a covered entity. The billing company handling patient data is a business associate directly subject to HIPAA's Security Rule — they must implement the same administrative, physical, and technical safeguards. This direct liability for BAs was established by the HITECH Act (2009) and the 2013 Omnibus Rule. Business associates must also sign Business Associate Agreements (BAAs) with covered entities."
                },
                {
                    question: "PCI DSS is best described as which type of compliance requirement?",
                    options: [
                        "A federal law passed by Congress applicable to all US businesses",
                        "A contractual obligation maintained by the payment card brands (Visa, Mastercard, etc.) through the PCI Security Standards Council — not a law, but a binding contractual requirement for any organization processing payment card transactions",
                        "A state regulation applicable only in California and New York",
                        "A voluntary framework with no consequences for non-compliance"
                    ],explanation: "PCI DSS (Payment Card Industry Data Security Standard) is a contractual obligation, not a law. It is maintained by the PCI Security Standards Council (founded by American Express, Discover, JCB, Mastercard, and Visa). Any organization that stores, processes, or transmits payment card data must comply as a condition of their merchant or service provider agreements with card brands. Non-compliance consequences include: fines from card brands, increased transaction fees, and ultimately loss of the ability to process card payments. The 12 PCI DSS requirements cover everything from firewalls to penetration testing to access controls. Validation requirements (QSA audit vs. self-assessment) depend on transaction volume."
                },
                {
                    question: "The Sarbanes-Oxley Act (SOX) primarily requires publicly traded companies to implement cybersecurity controls around which specific concern?",
                    options: [
                        "Protecting customer personally identifiable information (PII) from data breaches",
                        "Securing the IT systems that store and process financial records to protect the integrity and auditability of financial reporting",
                        "Encrypting all email communications between executives and the board of directors",
                        "Establishing a CISO position at companies with more than $1 billion in revenue"
                    ],explanation: "SOX (Sarbanes-Oxley Act, 2002) was enacted after accounting scandals (Enron, WorldCom) to restore investor confidence in financial reporting. Its IT security relevance: SOX requires publicly traded companies to maintain effective internal controls over financial reporting. Section 404 requires annual management assessment and external auditor attestation of those controls. IT controls that protect financial systems — access controls, change management, backup and recovery, audit logging — are SOX controls because they ensure financial data cannot be improperly modified or destroyed. SOX is not a general privacy or data protection law; it is specifically about the integrity and auditability of financial data."
                },
                {
                    question: "FERPA protects educational records and restricts their disclosure. Under FERPA, who is generally permitted to access a student's educational records?",
                    options: [
                        "Anyone who submits a formal public records request",
                        "Teachers with a legitimate educational interest and the student themselves; parental rights transfer to students at age 18 or upon enrollment in postsecondary education",
                        "All school employees including cafeteria staff and security personnel",
                        "Only school administrators and law enforcement with a court order"
                    ],explanation: "FERPA (Family Educational Rights and Privacy Act) grants students (and parents of minor students) the right to access their educational records and restricts disclosure to others. School officials with a 'legitimate educational interest' can access records. At age 18 or upon college enrollment, rights transfer from parents to students. Schools can share records in specific situations: other schools the student is transferring to, financial aid processing, certain research functions, accreditation, and safety emergencies. FERPA violations can result in the loss of federal funding. The key exam point: educational records are protected and disclosure is restricted — the student (or their parents) controls access."
                },
                {
                    question: "A company's security team wants to deploy an IDS (Intrusion Detection System). Which category of security control, by desired effect, does an IDS represent?",
                    options: [
                        "Preventive — it blocks attacks before they succeed",
                        "Detective — it identifies security events that have already occurred or are occurring",
                        "Corrective — it remediates the damage caused by attacks",
                        "Deterrent — it discourages attackers from attempting intrusions"
                    ],explanation: "An IDS (Intrusion Detection System) is a Detective control — it identifies security events that have occurred or are in progress, but does not prevent them. An IDS alerts on suspicious activity after (or as) it is happening. This distinguishes it from: a Firewall or IPS (Preventive — blocks traffic before it reaches the target), backup restoration (Corrective — remediates damage after an event), or warning banners (Deterrent — psychologically discourages attackers). An IPS (Intrusion Prevention System) adds Prevention to Detection by also blocking the detected traffic. On the exam: Detect = IDS, Prevent = Firewall/IPS, Correct = Backup/Patch, Deter = Locks/Warnings/Cameras."
                },
                {
                    question: "The NIST Cybersecurity Framework Implementation Tiers describe how well an organization manages cybersecurity risk. What distinguishes Tier 3 (Repeatable) from Tier 2 (Risk Informed)?",
                    options: [
                        "Tier 3 organizations have completed ISO 27001 certification; Tier 2 have not",
                        "Tier 3 organizations have formally approved, organization-wide cybersecurity risk management policies that are consistently applied; Tier 2 organizations have risk management practices approved by management but not yet established as organization-wide policy",
                        "Tier 3 organizations spend more money on security than Tier 2 organizations",
                        "Tier 2 is only for private sector; Tier 3 applies to government agencies"
                    ],explanation: "NIST CSF Tiers measure organizational cybersecurity maturity. Tier 2 (Risk Informed): management approves risk management practices, but they are not yet consistently applied organization-wide — different departments may handle security differently. Tier 3 (Repeatable): cybersecurity policies are formally documented, consistently applied across the organization, and regularly updated based on risk management processes. The key distinction is consistency and formalization — moving from 'we do this in most places' to 'we have a documented, approved, consistently enforced approach.' Tier 4 (Adaptive) adds continuous learning and external information sharing. The tiers are not sequential certifications — they describe where an organization currently operates."
                },
                {
                    question: "What is the primary distinction between a security audit and a security assessment?",
                    options: [
                        "Audits are only for external compliance; assessments are only for internal improvement",
                        "Audits are rigorous formal reviews resulting in a compliance declaration based on independent verification; assessments are less formal, usually self-initiated, and rely heavily on employee interviews rather than independent verification",
                        "Assessments cost more than audits because they require specialized third-party firms",
                        "Audits evaluate technical controls only; assessments evaluate people and process controls"
                    ],explanation: "The audit vs. assessment distinction is testable on CySA+. Audits: formal reviews (internal or external), rigorous and systematic, produce a formal compliance declaration (the auditor attests to accuracy), based on independent verification (the auditor tests, not just asks). Used for regulatory compliance (PCI DSS QSA audit, SOX audit, ISO 27001 certification). Assessments: less formal, typically self-initiated for process improvement, rely on employee interviews (their statements are treated as truth without independent verification), produce recommendations rather than compliance declarations. Penetration tests, vulnerability assessments, and security maturity assessments are all 'assessments.' Auditors cannot audit controls they implemented — independence is required."
                },
                {
                    question: "COBIT (Control Objectives for Information and Related Technologies) organizes IT governance into four domains. Which of the following correctly lists all four COBIT domains?",
                    options: [
                        "Identify, Protect, Detect, Respond, Recover",
                        "Plan and Organize, Acquire and Implement, Deliver and Support, Monitor and Evaluate",
                        "Governance, Management, Assurance, Compliance",
                        "Strategy, Architecture, Operations, Audit"
                    ],explanation: "COBIT's four domains represent the complete IT governance lifecycle: (1) Plan and Organize — strategy, architecture, organization, and IT investment decisions. (2) Acquire and Implement — selecting and building/buying solutions and integrating them into business processes. (3) Deliver and Support — operating IT services, managing security and continuity, and supporting end users. (4) Monitor and Evaluate — performance monitoring, internal controls assessment, regulatory compliance, and IT governance. COBIT is developed by ISACA and has a strong governance and audit focus — making it popular with IT auditors and GRC professionals. The 'Identify, Protect, Detect, Respond, Recover' five functions are the NIST CSF Framework Core, not COBIT."
                }
            ]
        });
        quiz.start();
    </script>
