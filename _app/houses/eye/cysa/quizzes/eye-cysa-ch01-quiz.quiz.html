    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 01: Today\'s Cybersecurity Analyst',
            description: 'CIA triad, privacy, risk assessment, threat categories, and security controls',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch01-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Which of the following best describes the CIA triad in cybersecurity?",
                    options: [
                        "A government intelligence framework used exclusively by classified agencies",
                        "A foundational model representing Confidentiality, Integrity, and Availability as the three core security objectives",
                        "A penetration testing methodology covering network, application, and physical security",
                        "A risk scoring system that assigns numerical values to threats and vulnerabilities"
                    ],explanation: "The CIA triad — Confidentiality (protect data from unauthorized access), Integrity (prevent unauthorized modification), and Availability (ensure legitimate user access) — is the foundational framework for information security. Every attack, control, and risk analysis maps back to one or more of these three properties."
                },
                {
                    question: "An organization properly secures its customer database with strong encryption and access controls, but then sells that encrypted data to marketing partners without customer consent. Which principle has been violated?",
                    options: [
                        "Integrity — the data was modified without authorization",
                        "Availability — customers cannot access their own data",
                        "Privacy — the organization used data beyond its stated collection purpose",
                        "Confidentiality — the encryption was insufficient"
                    ],explanation: "Privacy obligations extend beyond security. The organization had adequate security controls, but violated privacy by sharing PII beyond the purposes for which it was collected without consent. The GAPP principle of 'Use, retention, and disposal' states that information can only be used for the stated purpose. Having good security does not make this a security failure — it is a privacy failure."
                },
                {
                    question: "According to NIST SP 800-30, risk exists at the intersection of which two elements?",
                    options: [
                        "Threats and countermeasures",
                        "Vulnerabilities and impacts",
                        "Threats and vulnerabilities",
                        "Likelihood and severity"
                    ],explanation: "Risk occurs at the intersection of threats (external forces that may exploit a vulnerability) and vulnerabilities (internal weaknesses in devices, systems, applications, or processes). If there is a threat but no corresponding vulnerability, there is no risk. Conversely, a vulnerability with no relevant threat also presents no risk."
                },
                {
                    question: "A system administrator accidentally types the wrong command in an SOP, causing far more servers to go offline than intended — collapsing an entire cloud region. Which threat category does this represent?",
                    options: [
                        "Adversarial threat — the admin was a malicious insider",
                        "Structural threat — server hardware failed",
                        "Environmental threat — a natural disaster caused the outage",
                        "Accidental threat — an authorized person made a mistake with harmful consequences"
                    ],explanation: "This describes the AWS February 2017 US-EAST-1 outage. Accidental threats occur when someone makes a mistake that harms security — no malice is required. The technician was authorized and following an SOP, but input the command incorrectly. This is contrasted with adversarial threats (intentional), structural threats (equipment failure), and environmental threats (natural or man-made disasters)."
                },
                {
                    question: "The ALE formula is used in quantitative risk assessment. If a company estimates SLE = $50,000 and ARO = 0.25, what is the ALE?",
                    options: [
                        "$200,000",
                        "$50,250",
                        "$12,500",
                        "$5,000"
                    ],explanation: "ALE = SLE x ARO. ALE = $50,000 x 0.25 = $12,500 per year. SLE (Single Loss Expectancy) is the estimated cost of a single incident. ARO (Annual Rate of Occurrence) is how often the event happens per year — 0.25 means once every four years. ALE helps justify security investments by translating risk into annual expected dollar loss."
                },
                {
                    question: "Which risk management strategy involves changing a system's configuration or design to eliminate the risk entirely rather than reducing or transferring it?",
                    options: [
                        "Risk Acceptance",
                        "Risk Mitigation",
                        "Risk Avoidance",
                        "Risk Transference"
                    ],explanation: "Risk Avoidance changes the system configuration or business process to eliminate the risk associated with a specific vulnerability entirely. This is chosen when the risk is too high to accept and mitigation would not reduce it sufficiently. Example: discontinuing a high-risk online service rather than continuing to operate it with security controls. Risk Mitigation reduces risk to acceptable levels; it does not eliminate it."
                },
                {
                    question: "Which network security control enforces that systems accessing the network meet baseline security requirements such as patch level, firewall status, and antivirus currency, using 802.1x as its most common standard?",
                    options: [
                        "Next-Generation Firewall (NGFW)",
                        "Network Access Control (NAC)",
                        "Intrusion Prevention System (IPS)",
                        "Web Application Firewall (WAF)"
                    ],explanation: "Network Access Control (NAC) enforces two principles: (1) limit network access to authorized individuals and (2) ensure systems accessing the network meet baseline security requirements. 802.1x is the most common standard used for NAC and works for both wired and wireless networks. NAC can evaluate time of day, user role, physical location, and system health posture before granting network access."
                },
                {
                    question: "During a penetration test, a tester has completed the Discovery phase and is now actively attempting to gain unauthorized access by exploiting identified vulnerabilities and escalating privileges. Which phase is this?",
                    options: [
                        "Planning phase",
                        "Reporting phase",
                        "Execute the Attack (Exploitation) phase",
                        "Discovery phase"
                    ],explanation: "The Execute the Attack (Exploitation) phase follows Discovery. It involves gaining access by bypassing security controls, escalating privileges, browsing systems to understand the scope of access, and potentially installing additional tools. This phase may loop back to Discovery as new systems are accessed. NIST SP 800-115 defines the four phases: Planning, Discovery, Execute the Attack, and Reporting."
                },
                {
                    question: "A firewall that tracks the state of each active network connection and makes filtering decisions based on connection context (not just individual packets) is classified as which type?",
                    options: [
                        "Packet Filtering Firewall",
                        "Web Application Firewall (WAF)",
                        "Next-Generation Firewall (NGFW)",
                        "Stateful Inspection Firewall"
                    ],explanation: "Stateful Inspection firewalls maintain connection state tables, tracking the status of each active session (established, SYN_SENT, etc.). This allows them to make context-aware decisions — for example, blocking unsolicited incoming traffic that doesn't correspond to an established outbound connection. Packet filtering only examines individual packets. NGFWs add application-layer inspection and user context. WAFs specifically protect web applications against SQLi, XSS, and CSRF."
                },
                {
                    question: "Which analysis technique in malware reverse engineering executes the malware in an isolated environment to observe its system and network behavior without performing code-level analysis?",
                    options: [
                        "Static analysis",
                        "Dynamic analysis",
                        "Decompiler analysis",
                        "Signature-based analysis"
                    ],explanation: "Dynamic analysis places malware in a sandbox and observes its behavior in real-time — what files it creates, what registry keys it modifies, what network connections it makes, and what processes it spawns. No code reading is required. Automated sandbox solutions can analyze email attachments in near-real-time. Static analysis examines the code without executing it and requires decompilers for compiled languages (C/C++, Java)."
                }
            ]
        });
        quiz.start();
    </script>
