    <script src="../../../../components/ProgressSystem.js"></script>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 05: Vulnerability Scanning',
            description: 'Scanning techniques, tools, false positives, and scan configuration',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch05-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "A vulnerability scanner reports a CVSS base score of 7.8 for a missing patch on an internal file server. What severity rating does this score fall under?",
                    options: [
                        "Critical (9.0–10.0)",
                        "High (7.0–8.9)",
                        "Medium (4.0–6.9)",
                        "Low (0.1–3.9)"
                    ],explanation: "A CVSS base score of 7.8 falls in the High severity range (7.0–8.9). Critical is 9.0–10.0. Medium is 4.0–6.9. Low is 0.1–3.9. The High range typically requires patching within 2 weeks and warrants monitoring for active exploitation in the wild."
                },
                {
                    question: "In the CVSS v3.0 vector string CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N, what does 'AV:N' indicate?",
                    options: [
                        "The attack requires physical access to the target system",
                        "The vulnerability can be exploited remotely over a network",
                        "The attack complexity is None",
                        "The attack vector is narrow, limiting exposure"
                    ],explanation: "AV:N means Attack Vector: Network. The vulnerability can be exploited by an attacker who is remotely positioned — they do not need physical or adjacent-network access. Network-based attack vectors receive a score of 0.85 (the highest weight) because they dramatically increase the pool of potential attackers. AV:A (Adjacent), AV:L (Local), and AV:P (Physical) represent progressively more restricted access requirements."
                },
                {
                    question: "When calculating the CVSS Impact Sub-Score (ISS) for a vulnerability with Confidentiality=High (0.56), Integrity=None (0.00), Availability=None (0.00), what is the ISS value?",
                    options: [
                        "0.00",
                        "0.44",
                        "0.56",
                        "6.42"
                    ],explanation: "The ISS formula is: ISS = 1 - [(1 - C) x (1 - I) x (1 - A)]. Plugging in values: ISS = 1 - [(1 - 0.56) x (1 - 0.00) x (1 - 0.00)] = 1 - [0.44 x 1.00 x 1.00] = 1 - 0.44 = 0.56. The 0.56 ISS value represents High confidentiality impact with no integrity or availability impact — consistent with a vulnerability that allows information disclosure only."
                },
                {
                    question: "Which of the following BEST describes a false positive in the context of vulnerability scanning?",
                    options: [
                        "A real vulnerability that the scanner fails to detect",
                        "A vulnerability the scanner reports that does not actually exist on the target system",
                        "A vulnerability that has been patched but the scanner still reports it",
                        "An informational finding that poses no actual security risk"
                    ],explanation: "A false positive occurs when the scanner reports that a vulnerability exists, but it does not actually exist on the target system. This is distinct from a false negative (missed real vulnerability), a documented exception (known vulnerability that management has accepted), or informational findings. False positives waste analyst time and erode trust in the scanning tool. Validation steps include checking patch status, attempting controlled exploitation, and verifying system configuration."
                },
                {
                    question: "A vulnerability scanner reports an 'informational' finding that TCP port 22 (SSH) is open on a production web server. What is the appropriate analyst response?",
                    options: [
                        "Immediately escalate as a Critical finding requiring emergency remediation",
                        "Mark as a false positive and suppress from future scans",
                        "Review whether SSH access is required and whether it represents unnecessary attack surface",
                        "Document as accepted risk since SSH is encrypted and therefore not a threat"
                    ],explanation: "Informational findings are not vulnerabilities per se — they identify configurations that could assist an attacker's reconnaissance. An open SSH port on a web server should be reviewed for necessity. If SSH administration is not required from external networks, the port should be restricted to management networks only (firewall rule). If it is required, ensure password authentication is disabled (key-only), root login is disabled, and fail2ban or equivalent brute-force protection is in place. 'Not a vulnerability' does not mean 'safe to ignore.'"
                },
                {
                    question: "Which vulnerability category includes SQL injection, cross-site scripting (XSS), and directory traversal attacks?",
                    options: [
                        "Network vulnerabilities",
                        "Virtualization vulnerabilities",
                        "Web application vulnerabilities",
                        "Server and host vulnerabilities"
                    ],explanation: "SQL injection, XSS (persistent, reflected, and DOM-based), cross-site request forgery (CSRF), and directory traversal are all web application vulnerabilities. They exploit weaknesses in how web applications process user input. Server/host vulnerabilities include missing patches, buffer overflows, and privilege escalation. Network vulnerabilities include SSL/TLS issues and DNS problems. Virtualization vulnerabilities include VM escape and management interface exposure."
                },
                {
                    question: "A VM escape attack is considered the most severe virtualization vulnerability. What occurs during a VM escape?",
                    options: [
                        "An attacker gains access to another tenant's virtual machine on the same host",
                        "An attacker in a guest virtual machine breaks out to gain access to the underlying hypervisor host",
                        "A virtual machine consumes all available resources, causing a denial of service",
                        "An attacker gains remote access to the virtual machine management interface"
                    ],explanation: "VM escape occurs when an attacker who has compromised a guest virtual machine is able to break out of that VM and access the hypervisor host. Since the hypervisor controls all virtual machines on the physical host, a successful VM escape gives the attacker access to every VM on that system. The 2017 Pwn2Own competition demonstrated a successful VM escape by chaining three separate exploits together. Patching virtual host software and guest VMs is the primary mitigation."
                },
                {
                    question: "Which CVSS metric describes whether the vulnerability can be exploited without any user interaction, or whether a victim must take some action (such as clicking a link)?",
                    options: [
                        "Attack Complexity (AC)",
                        "Privileges Required (PR)",
                        "User Interaction (UI)",
                        "Scope (S)"
                    ],explanation: "User Interaction (UI) captures whether the vulnerability requires a victim user to perform some action before the attacker can exploit it. UI:None means the attacker can exploit the vulnerability without any victim participation — wormable vulnerabilities are UI:None. UI:Required means the victim must take some action (open a file, click a link, visit a website). A vulnerability requiring user interaction is generally harder to exploit at scale than one that does not."
                },
                {
                    question: "An analyst needs to reconcile scan findings with other organizational data sources. Which combination provides the most complete picture for prioritization?",
                    options: [
                        "CVSS score alone — it contains all relevant risk information",
                        "Vulnerability name and affected port only — these determine patch applicability",
                        "Scan output correlated with SIEM alerts, configuration management data, and trend analysis",
                        "The vendor advisory for the highest-severity finding only"
                    ],explanation: "Effective vulnerability management requires correlating scan output with multiple data sources: SIEM alerts (has this vulnerability been actively exploited in the environment?), configuration management (is there a compensating control? what is the asset's business function?), and trend analysis (is this a new finding or a recurring unpatched vulnerability?). CVSS alone cannot determine business risk — a Critical CVSS on a decommissioned test system may be lower priority than a Medium CVSS on a production payment processor."
                },
                {
                    question: "During a vulnerability scan, a scanner reports that a web server is running TLSv1.0. Which vulnerability category best describes this finding, and what is the remediation?",
                    options: [
                        "Server vulnerability — apply the latest OS security patch",
                        "Network vulnerability — disable TLS 1.0 and enforce TLS 1.2 minimum (prefer TLS 1.3)",
                        "Web application vulnerability — update the application source code to use HTTPS",
                        "Virtualization vulnerability — update the hypervisor firmware"
                    ],explanation: "Outdated TLS versions are a network vulnerability category. TLS 1.0 and 1.1 are deprecated due to known weaknesses (POODLE, BEAST attacks). The remediation is to configure the server to disable support for TLS 1.0 and 1.1 and require TLS 1.2 as the minimum, with TLS 1.3 preferred. Note: TLS is a protocol, not a cipher — you also need to separately audit the cipher suites configured for use with TLS. Weak ciphers (RC4, DES, 3DES) must be disabled even when using a current TLS version."
                }
            ]
        });
        quiz.start();
    </script>
