    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 09: Development Security',
            description: 'Secure SDLC, code review, OWASP, and application security',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch09-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Which SDLC phase is considered the longest phase and includes patching, updating, and daily support?",
                    options: [
                        "Testing",
                        "Design",
                        "Operations and Maintenance",
                        "Training and Transition"
                    ],explanation: "Operations and Maintenance is the longest phase of the SDLC. It encompasses all ongoing activity after the software is deployed: patching, updating, modification, regression testing, and daily support. Security during this phase includes ongoing vulnerability scanning, monitoring, and incident response for the application."
                },
                {
                    question: "The Agile SDLC model is built on four foundational values. Which of the following is NOT one of the Agile Manifesto values?",
                    options: [
                        "Individuals and interactions over processes and tools",
                        "Comprehensive documentation over working software",
                        "Customer collaboration over contract negotiation",
                        "Responding to change over following a plan"
                    ],explanation: "The Agile Manifesto values 'working software over comprehensive documentation' — the opposite of the stated option. The four Agile values are: Individuals and interactions over processes and tools; Working software over comprehensive documentation; Customer collaboration over contract negotiation; Responding to change over following a plan. Agile deliberately prioritizes working, deliverable software over exhaustive documentation."
                },
                {
                    question: "In DevSecOps, what does 'shifting left' mean?",
                    options: [
                        "Moving the security team to a different organizational reporting structure",
                        "Integrating security testing and review earlier in the development lifecycle",
                        "Shifting from a waterfall to an agile development methodology",
                        "Moving production servers to a different data center region"
                    ],explanation: "'Shift left' means moving security activities earlier in the SDLC — to the left on a traditional left-to-right lifecycle timeline. Instead of testing security only after code is written (or worse, after deployment), shift-left introduces security requirements during planning, threat modeling during design, SAST during coding, and DAST during testing. The earlier a vulnerability is found, the cheaper it is to fix — often cited as a 10x cost increase per phase."
                },
                {
                    question: "What does static code analysis specifically refer to in software security testing?",
                    options: [
                        "Testing code by executing it with known malicious input",
                        "Reviewing code manually or with automated tools without executing it",
                        "Analyzing the compiled binary using a disassembler",
                        "Stress testing the application under production-level load"
                    ],explanation: "Static analysis (SAST — Static Application Security Testing) is conducted by reviewing code — manually or with automated tools — without executing it. It is a form of white-box testing because the tester has access to the source code. Static analysis finds syntax errors, insecure function use, hardcoded credentials, and known-bad patterns. It cannot find runtime vulnerabilities that only manifest during execution (that's dynamic analysis/DAST)."
                },
                {
                    question: "Fuzzing is a software security testing technique that primarily tests an application's ability to handle which type of input?",
                    options: [
                        "Carefully crafted, valid input designed to test all normal code paths",
                        "Invalid, unexpected, or random data",
                        "Load-based input designed to overwhelm server capacity",
                        "Specific known SQL injection and XSS payloads"
                    ],explanation: "Fuzzing sends invalid, unexpected, or random data to an application to test its ability to handle data it was not designed to receive. Fuzzing is typically automated using large datasets and is used to detect input validation failures, logic errors, memory leaks, and poor error handling. AFL (American Fuzzy Lop) and libFuzzer are common fuzzing frameworks. A fuzz test that causes a crash has found a potentially exploitable vulnerability."
                },
                {
                    question: "The OWASP Top Proactive Control that addresses preventing SQL injection and cross-site scripting through output encoding is which control?",
                    options: [
                        "Validate All Inputs",
                        "Secure Database Access",
                        "Encode and Escape Data",
                        "Handle All Errors and Exceptions"
                    ],explanation: "OWASP Proactive Control C4: Encode and Escape Data ensures that attackers cannot embed code or special characters in ways that will be executed. Output encoding converts characters like <, >, ', \" and & into safe representations before rendering them. This is the primary defense against Cross-Site Scripting (XSS). Parameterized queries (C3: Secure Database Access) prevent SQL injection by separating data from code at the database layer."
                },
                {
                    question: "Which code review method involves two developers sharing a single workstation throughout the development process, providing continuous real-time review?",
                    options: [
                        "Over-the-Shoulder",
                        "Pass-Around",
                        "Pair Programming",
                        "Fagan Inspection"
                    ],explanation: "Pair Programming is an Agile development technique where two developers share one workstation — one writes code (the 'driver') while the other reviews in real time (the 'navigator'). Roles switch regularly. It provides continuous code review but is expensive since it effectively halves individual developer output. It produces higher-quality code with fewer defects, which is why it's used in high-stakes development environments."
                },
                {
                    question: "A Trusted Platform Module (TPM) provides which three major security functions?",
                    options: [
                        "Encryption, decryption, and digital signature generation",
                        "Remote attestation, binding, and sealing",
                        "Authentication, authorization, and accounting",
                        "Key generation, key distribution, and key revocation"
                    ],explanation: "The TPM provides three core functions: Remote Attestation (allowing hardware and software configurations to be verified by external parties — used in zero-trust architectures), Binding (encrypting data to a specific device or configuration), and Sealing (encrypting data AND setting conditions that must be met for decryption — e.g., certain BIOS settings must be present). These functions are the foundation of BitLocker disk encryption and Secure Boot on modern Windows systems."
                },
                {
                    question: "A Hardware Security Module (HSM) is used primarily for which purpose?",
                    options: [
                        "Monitoring network traffic for malicious activity",
                        "Storing and managing cryptographic keys and offloading cryptographic processing",
                        "Scanning compiled code for security vulnerabilities",
                        "Providing a secure execution environment for untrusted web applications"
                    ],explanation: "HSMs are external devices or plug-in cards that create, store, and manage digital keys for cryptographic functions and authentication. They offload cryptographic processing from the host system. HSMs are FIPS 140-2 (or 140-3) certified — the government standard for cryptographic module security. They are used to protect root certificate authority keys, code-signing keys, payment processing keys (in banking), and any cryptographic material that must be tamper-evident and physically secured."
                },
                {
                    question: "API security relies on several mechanisms to remain secure. Which combination represents the primary API security controls described in CySA+ materials?",
                    options: [
                        "Firewall rules, SSL/TLS, and network segmentation",
                        "Authentication, authorization, data scoping, rate limiting, input filtering, and monitoring",
                        "OAuth 2.0, JWT tokens, and API gateway deployment only",
                        "Penetration testing, code review, and bug bounty programs"
                    ],explanation: "The CySA+ text identifies API security as requiring: Authentication (verifying who is calling the API), Authorization (ensuring callers have permission to access specific endpoints and data), Data scoping (ensuring the API does not return more data than necessary — preventing over-fetching and mass assignment vulnerabilities), Rate limiting (preventing DoS and abuse), Input filtering (preventing injection attacks through API parameters), and Monitoring/logging (detecting and investigating abuse). All six controls work together — any one missing creates risk."
                }
            ]
        });
        quiz.start();
    </script>
