    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 15: Risk Management',
            description: 'Risk assessment, frameworks, business impact analysis, and risk treatment',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch15-quiz',
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "A ransomware attack encrypts all files on a server, making them inaccessible to authorized users. Which CIA triad objective is primarily violated?",
                    options: [
                        "Confidentiality — unauthorized parties read the encrypted data",
                        "Integrity — the encrypted files have been modified",
                        "Availability — legitimate users cannot access the data they need",
                        "Non-repudiation — audit logs have been destroyed"
                    ],
                    correct: 2,
                    explanation: "Ransomware primarily attacks Availability — legitimate users cannot access their files because they are encrypted. The attacker has not necessarily read (Confidentiality) or modified the content (Integrity) of the files, though modern ransomware increasingly also exfiltrates data before encrypting (a dual Confidentiality + Availability attack). Availability controls include backup strategies, redundancy, and business continuity planning. The lack of functional backups that allows ransomware to succeed is fundamentally an availability control failure."
                },
                {
                    question: "Risk is defined as occurring at the intersection of which two factors?",
                    options: [
                        "Assets and controls",
                        "Threats and vulnerabilities",
                        "Probability and impact",
                        "Exploits and patches"
                    ],
                    correct: 1,
                    explanation: "Risk = Threats + Vulnerabilities. A vulnerability without a threat actor capable or motivated to exploit it carries low risk. A sophisticated threat actor with no exploitable vulnerability in your environment also presents low risk. Risk only materializes when a threat actor can and will exploit a vulnerability. This framework guides both risk assessment (identifying where threats and vulnerabilities intersect) and control selection (either reduce vulnerabilities or limit exposure to threats). Risk Severity = Probability × Magnitude, but the fundamental concept is threat-vulnerability intersection."
                },
                {
                    question: "A hospital's MRI machine has an asset value of $500,000. A power surge that would occur once every 5 years could destroy 40% of the machine's components. What is the Annualized Loss Expectancy (ALE)?",
                    options: [
                        "$200,000",
                        "$100,000",
                        "$40,000",
                        "$20,000"
                    ],
                    correct: 2,
                    explanation: "Working the calculation: AV = $500,000. EF = 40% = 0.4. SLE = AV × EF = $500,000 × 0.4 = $200,000. ARO = once every 5 years = 0.2 (1 ÷ 5). ALE = SLE × ARO = $200,000 × 0.2 = $40,000. The ALE of $40,000 per year is the expected annualized financial impact from this specific risk. A surge protection and UPS system costing $5,000/year would be clearly justified by the ALE. A $60,000/year solution would not be justified by ALE alone (though business continuity and reputational factors might still support it)."
                },
                {
                    question: "Which data obfuscation technique replaces sensitive values with unique identifiers using a secure lookup table, allowing the original value to be retrieved by authorized parties?",
                    options: [
                        "Hashing — using SHA-256 to transform values",
                        "Tokenization — replacing values with tokens backed by a secure vault",
                        "Data masking — partially redacting visible characters",
                        "De-identification — removing all personally identifiable attributes"
                    ],
                    correct: 1,
                    explanation: "Tokenization replaces sensitive data (like credit card numbers or SSNs) with non-sensitive surrogate values (tokens) using a secure lookup table (token vault). Unlike hashing, the original value CAN be retrieved by authorized parties with vault access — making tokenization useful in payment processing where merchants need to process transactions without storing actual card numbers. The actual card number never leaves the tokenization system. PCI DSS specifically allows tokenization as a scope-reduction mechanism because the merchant's systems only see tokens, not the actual card data."
                },
                {
                    question: "An organization determines that the cost of mitigating a specific risk exceeds the potential impact of the risk materializing. Which risk treatment strategy is most appropriate?",
                    options: [
                        "Risk Transfer — purchase cyber insurance to cover the potential loss",
                        "Risk Avoidance — stop the business activity that creates the risk",
                        "Risk Acceptance — formally document and approve accepting the risk, with leadership sign-off",
                        "Risk Mitigation — implement the controls anyway as a regulatory requirement"
                    ],
                    correct: 2,
                    explanation: "Risk Acceptance is appropriate when the cost of mitigation exceeds the expected loss, or when the risk is low enough that countermeasures are not justified. However, acceptance must be formal and documented — silent acceptance (ignoring a risk without formal acknowledgment) is negligence, not risk management. The formal acceptance requires: documentation of the risk, the analysis that justifies acceptance, leadership approval from the appropriate authority, and periodic review (risks change over time and the accepted risk may need to be reassessed). Risk acceptance is a legitimate business decision when cost-benefit analysis supports it."
                },
                {
                    question: "What is the key difference between quantitative and qualitative risk assessments?",
                    options: [
                        "Quantitative assessments are conducted by external consultants; qualitative are internal",
                        "Quantitative assessments use numerical financial data (ALE, SLE, ARO) to express risk in dollar terms; qualitative assessments use subjective categorical ratings (Low/Medium/High) for risks that are difficult to quantify",
                        "Qualitative assessments are required by law; quantitative assessments are optional",
                        "Quantitative assessments only consider internal threats; qualitative considers both internal and external"
                    ],
                    correct: 1,
                    explanation: "Quantitative risk assessment uses objective numerical data: asset values, exposure factors, occurrence rates — expressed in financial terms. Result: 'This risk costs us an expected $40,000/year.' Advantages: precise, financially defensible, drives cost-benefit analysis. Limitations: requires accurate data (asset values, occurrence rates) that is often unavailable or uncertain. Qualitative risk assessment uses subjective judgment and categories: High/Medium/Low or numerical scales (1-5). Result: 'This risk is HIGH probability and HIGH impact.' Advantages: faster, usable when precise data is unavailable, accessible to non-technical stakeholders. Limitations: subjective, cannot drive precise cost-benefit analysis. Most real organizations use both."
                },
                {
                    question: "In a red team/blue team exercise, which team acts as the referee, coordinates the exercise, and arbitrates disputes?",
                    options: [
                        "Green Team — responsible for infrastructure and supporting both sides",
                        "White Team — coordinates the exercise, sets scope, monitors rules, and produces the after-action review",
                        "Purple Team — a hybrid team combining red and blue team members",
                        "Gray Team — handles the technical scoring and metrics collection"
                    ],
                    correct: 1,
                    explanation: "The White Team serves as the exercise facilitator and referee. They: set the scope and rules of engagement, coordinate the exercise timeline, arbitrate disputes about what is and is not within bounds, maintain the simulated environment, monitor for safety and legality, score the exercise based on objectives achieved, and produce the after-action debrief. The White Team's perspective is uniquely valuable — they see both what the Red Team accomplished and what the Blue Team detected, revealing gaps that neither team can fully observe from their own position. The debrief they conduct often surfaces the most actionable improvements."
                },
                {
                    question: "A company collects detailed customer behavior data for a marketing analysis project. A year later, the HR department wants to use the same data to evaluate employee performance. Is this permissible under data lifecycle principles?",
                    options: [
                        "Yes — if the data is already collected, any internal use is permissible",
                        "No — the principle of purpose limitation requires that information be used only for the purpose it was originally collected and consented to; using marketing data for HR evaluation would require new consent",
                        "Yes — internal use does not require customer consent",
                        "It depends on whether the HR use is more sensitive than the marketing use"
                    ],
                    correct: 1,
                    explanation: "Purpose limitation is a core data governance principle (codified in GDPR Article 5, referenced in HIPAA and most modern privacy frameworks): data may only be used for the purpose for which it was originally collected and to which data subjects consented. Using customer behavior data collected for marketing analytics to evaluate employee performance violates purpose limitation — customers consented to marketing use, not HR applications. This use would require either new consent from data subjects or a legal basis beyond the original consent. Privacy regulations globally are increasingly strict on purpose limitation."
                },
                {
                    question: "Network-based DLP (Data Loss Prevention) detects an employee attempting to email a spreadsheet containing customer credit card numbers to an external address. Which DLP detection mechanism most likely triggered this alert?",
                    options: [
                        "Watermarking — because the file was electronically tagged as sensitive by administrators",
                        "Pattern matching — the DLP system recognized the format of credit card numbers (16 digits, Luhn algorithm-valid) in the email attachment",
                        "User behavior analytics — because the employee sent an unusual number of emails",
                        "File type blocking — because spreadsheet files are blocked from external email"
                    ],
                    correct: 1,
                    explanation: "Pattern matching is the DLP mechanism that watches for telltale signs of sensitive information: credit card number patterns (16 digits meeting the Luhn algorithm), Social Security Number formats (XXX-XX-XXXX), driver's license patterns by state, or regular expressions matching specific sensitive data formats. Network-based DLP inspects outbound traffic for these patterns and can block, quarantine, or alert when detected. Pattern matching works on content it can see — encrypted HTTPS traffic requires SSL inspection to be effective. Watermarking requires administrators to pre-tag documents, which is not always done. Pattern matching provides automatic protection even for data that was not pre-tagged."
                },
                {
                    question: "A Business Impact Analysis (BIA) is conducted to determine which business functions are most critical. What are the two key metrics the BIA aims to establish for each function?",
                    options: [
                        "Risk Score and Control Effectiveness",
                        "Recovery Time Objective (RTO) — how long the organization can operate without the function before critical impact, and Recovery Point Objective (RPO) — the maximum acceptable data loss measured in time",
                        "Maximum Tolerable Downtime (MTD) and Minimum Business Continuity Objective (MBCO)",
                        "Probability of Failure and Cost of Restoration"
                    ],
                    correct: 1,
                    explanation: "The BIA establishes RTO and RPO as its primary outputs for each critical business function. Recovery Time Objective (RTO): the maximum time a business function can be unavailable before the impact becomes unacceptable. Example: 'Customer-facing ordering system must be restored within 4 hours or we lose significant revenue.' Recovery Point Objective (RPO): the maximum acceptable data loss measured in time. Example: 'We can afford to lose no more than 1 hour of transaction data.' These metrics directly drive backup frequency (RPO determines how often you back up), recovery infrastructure requirements (RTO determines how fast your DR systems must be), and business continuity investments. The BIA is the foundation of disaster recovery and business continuity planning."
                }
            ]
        });
        quiz.start();
    </script>
