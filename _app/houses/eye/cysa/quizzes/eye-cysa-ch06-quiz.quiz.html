    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 06: Cloud Security',
            description: 'Cloud service models, shared responsibility, and cloud-specific threats',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch06-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "An organization uses Amazon Web Services EC2 instances to run its own web application. The OS patching and application security are managed by the organization's team. Which cloud service model is this?",
                    options: [
                        "Software as a Service (SaaS)",
                        "Platform as a Service (PaaS)",
                        "Infrastructure as a Service (IaaS)",
                        "Function as a Service (FaaS)"
                    ],explanation: "This is IaaS (Infrastructure as a Service). IaaS provides raw compute, storage, and networking building blocks. The customer is responsible for the operating system, middleware, runtime, and application — including patching and security configuration. AWS EC2 is the canonical example. In PaaS, the provider manages the OS and runtime. In SaaS, the provider manages everything including the application. In FaaS, code runs in provider-managed function execution environments."
                },
                {
                    question: "Under the shared responsibility model, which layer is ALWAYS the customer's responsibility regardless of cloud service model (IaaS, PaaS, or SaaS)?",
                    options: [
                        "Operating system patching",
                        "Virtualization layer security",
                        "Customer data and access controls on that data",
                        "Physical data center security"
                    ],explanation: "The customer is always responsible for their data — regardless of service model. Data classification, encryption key management, and access control to customer data remain with the customer in all service models. Physical infrastructure and the virtualization layer are always provider responsibility. OS patching is customer responsibility in IaaS but provider responsibility in PaaS and SaaS. This distinction is one of the most commonly tested cloud security concepts."
                },
                {
                    question: "Which cloud deployment model is used when an organization requires its own cloud infrastructure exclusively, without sharing resources with other organizations?",
                    options: [
                        "Public cloud",
                        "Private cloud",
                        "Community cloud",
                        "Hybrid cloud"
                    ],explanation: "A private cloud is provisioned for the exclusive use of a single organization. It may be operated on-premises or by a third-party provider, but the infrastructure is not shared with other tenants. Private clouds provide the most control and customization but are more expensive than public cloud. Community clouds are shared among organizations with common requirements (e.g., government agencies). Hybrid clouds blend public and private environments."
                },
                {
                    question: "ScoutSuite is a cloud security auditing tool. Which of the following best describes how it collects configuration data?",
                    options: [
                        "It performs active network scanning to discover open ports and running services",
                        "It uses cloud provider APIs to retrieve configuration information and identify misconfigurations",
                        "It monitors real-time network traffic between cloud resources",
                        "It requires installation of an agent on each cloud virtual machine"
                    ],explanation: "ScoutSuite is an API-based multicloud auditing tool that retrieves configuration data from cloud providers using their native APIs (AWS, Azure, GCP, Alibaba Cloud, OCI). It does not perform active network scanning or require agent installation. It analyzes the configuration data for security misconfigurations and produces a dashboard report. This API-based approach means ScoutSuite can audit cloud accounts from any location without network adjacency to the cloud resources."
                },
                {
                    question: "An organization stores API keys for its cloud services as environment variables in its application's source code and commits this code to a public GitHub repository. What is the PRIMARY security risk?",
                    options: [
                        "Performance degradation due to environment variable overhead",
                        "Automated bots continuously scrape public repositories for exposed credentials, enabling immediate unauthorized cloud access",
                        "Environment variables are not supported by major cloud providers' authentication systems",
                        "GitHub's API rate limiting will prevent the application from using the keys"
                    ],explanation: "Storing API keys in source code and committing to public repositories is a critical vulnerability. Automated tools (GitRob, TruffleHog, git-secrets) and malicious bots continuously scan public repositories for exposed credentials — keys committed even briefly may be harvested within minutes. API keys provide the same level of access as passwords. Mitigation: use a secrets manager (AWS Secrets Manager, HashiCorp Vault), environment variables injected at runtime (not stored in code), and immediately rotate any exposed keys."
                },
                {
                    question: "A company wants to monitor employee usage of cloud services and enforce data loss prevention policies on uploads to cloud storage. Which security tool category is designed for this purpose?",
                    options: [
                        "Web Application Firewall (WAF)",
                        "Cloud Access Security Broker (CASB)",
                        "Security Information and Event Management (SIEM)",
                        "Endpoint Detection and Response (EDR)"
                    ],explanation: "A Cloud Access Security Broker (CASB) is specifically designed to act as an intermediary between cloud service users and cloud service providers. CASBs provide four key functions: visibility (what cloud services are being used, including shadow IT), compliance enforcement, data security (DLP for cloud uploads), and threat protection. A WAF protects web applications from injection and other attacks. A SIEM aggregates and correlates security logs. An EDR monitors endpoints for threats."
                },
                {
                    question: "An inline CASB differs from an API-based CASB primarily in that an inline CASB can:",
                    options: [
                        "Monitor activity in SaaS applications such as Microsoft 365",
                        "Block policy-violating requests before they reach the cloud service",
                        "Provide deeper analysis of cloud storage contents",
                        "Operate without any network or endpoint configuration changes"
                    ],explanation: "An inline CASB physically or logically sits in the connection path between the user and the cloud service, allowing it to inspect and block requests in real time before they reach the provider. This is its defining advantage over API-based CASBs, which connect to the cloud provider's API and can only detect and report violations after they occur. The tradeoff is that inline CASBs require network or endpoint configuration (proxy settings, endpoint agents), while API-based CASBs require no user device changes."
                },
                {
                    question: "Which cloud security concept involves automating infrastructure provisioning through code rather than manual configuration, and is a core element of DevOps practices?",
                    options: [
                        "Micro-segmentation",
                        "Infrastructure as Code (IaC)",
                        "Virtual Private Cloud (VPC)",
                        "Cloud Access Security Broker (CASB)"
                    ],explanation: "Infrastructure as Code (IaC) is the process of automating infrastructure provisioning, management, and deprovisioning through scripted code. Benefits include reusability, consistency, speed, and reduced configuration errors. Tools include Terraform, AWS CloudFormation, Ansible, and Pulumi. From a security perspective, IaC misconfigurations can propagate to every environment instantiated from the template — a single vulnerable template can create dozens of vulnerable systems. IaC templates should be version-controlled and security-reviewed like application code."
                },
                {
                    question: "Pacu is a cloud security framework used primarily by:",
                    options: [
                        "System administrators to automate routine AWS maintenance tasks",
                        "CISA incident response teams to recover compromised AWS environments",
                        "Penetration testers and red teams to enumerate what actions are possible within an AWS account",
                        "Cloud architects to design and document AWS network topologies"
                    ],explanation: "Pacu is an AWS exploitation framework similar to Metasploit, designed to help attackers and penetration testers determine what they can do with a given set of AWS credentials. It enumerates permissions, identifies privilege escalation paths, and can perform various post-exploitation actions. Understanding Pacu from a defensive perspective helps security teams understand what an attacker with compromised AWS credentials can accomplish and helps them harden IAM permissions to reduce the blast radius of credential compromise."
                },
                {
                    question: "Which characteristic of cloud computing enables organizations to rapidly increase computing resources during peak demand periods and release them when no longer needed, paying only for actual usage?",
                    options: [
                        "Multitenancy",
                        "Rapid elasticity and on-demand resource provisioning",
                        "Service level agreements (SLAs)",
                        "Virtual Private Cloud (VPC) isolation"
                    ],explanation: "Rapid elasticity is one of NIST's five essential cloud characteristics. It allows organizations to provision and release resources in minutes — scaling up for peak demand (e.g., Black Friday traffic, quarterly reporting) and scaling down afterward, paying only for consumed capacity. This shifts infrastructure from CapEx (buying hardware sized for peak) to OpEx (paying for actual usage). Combined with on-demand self-service, elasticity enables organizations to respond to business changes without procurement delays."
                }
            ]
        });
        quiz.start();
    </script>
