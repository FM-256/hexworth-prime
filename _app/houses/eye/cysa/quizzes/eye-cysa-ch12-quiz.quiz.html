    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 12: IOC Analysis',
            description: 'Indicators of compromise, malware analysis, and threat detection',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch12-quiz',
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Beaconing traffic is typically characterized by which behavioral pattern that makes it detectable through network analysis?",
                    options: [
                        "Large, irregular data transfers that vary significantly in size and timing",
                        "Regular interval connections from an internal host to an external destination, often HTTP/HTTPS",
                        "High-volume traffic from multiple internal sources to a single external IP",
                        "Repeated failed connection attempts with varying source ports"
                    ],
                    correct: 1,
                    explanation: "Beaconing is the periodic check-in signal that malware sends to its C2 infrastructure. The key detection characteristic is regularity — connections at consistent intervals (every N minutes or hours), regardless of user activity. This is because malware uses sleep timers between check-ins. The traffic is often HTTP or HTTPS to blend with normal web traffic. Detection uses time-series analysis in SIEM to identify the periodic pattern, even through HTTPS where content cannot be inspected."
                },
                {
                    question: "What is the key difference between Netflow monitoring and passive monitoring using a network tap?",
                    options: [
                        "Netflow captures full packet payloads; passive monitoring captures only headers",
                        "Netflow captures metadata (source, destination, volume) while passive monitoring captures complete packet content",
                        "Passive monitoring requires agent installation; Netflow does not",
                        "Netflow only works on routers; passive monitoring requires dedicated hardware"
                    ],
                    correct: 1,
                    explanation: "Netflow (and sFlow, J-Flow) captures flow metadata: source IP, destination IP, ports, protocol, byte count, and packet count. It does NOT capture packet payloads — you know who talked to whom and how much, but not what was said. Passive monitoring (tap or SPAN port) captures complete packets including payloads, enabling deep packet inspection and content analysis. Netflow is scalable for high-speed links; full packet capture generates enormous storage requirements. Both are valuable for different investigation needs."
                },
                {
                    question: "A security analyst notices that a Windows workstation is running a process named 'Isass.exe' (with a capital I instead of a lowercase L). What type of attacker technique does this BEST represent?",
                    options: [
                        "A legitimate Windows update that changed the process name",
                        "Process masquerading — using a name similar to a legitimate OS process to evade detection",
                        "A rootkit that has replaced the real lsass.exe binary",
                        "A false positive from the antivirus scanner"
                    ],
                    correct: 1,
                    explanation: "This is process masquerading (also called process spoofing or LOLbins abuse). Attackers name malicious processes with names visually similar to legitimate Windows processes — 'Isass.exe' (capital I) vs 'lsass.exe' (lowercase L), 'svch0st.exe' vs 'svchost.exe', or running legitimate process names from unexpected directories. In a proportional font, I and l look identical. Detection requires checking process path (legitimate lsass.exe only runs from C:\\Windows\\System32), parent process, and digital signature verification."
                },
                {
                    question: "MITRE ATT&CK classifies adversary behaviors into tactics and techniques. What does the 'Persistence' tactic (TA0003) specifically describe?",
                    options: [
                        "The attacker's initial method of gaining access to the network",
                        "Techniques attackers use to maintain their foothold and survive system restarts",
                        "Methods used to move laterally between systems in the network",
                        "Techniques for exfiltrating data to external infrastructure"
                    ],
                    correct: 1,
                    explanation: "The ATT&CK Persistence tactic covers techniques adversaries use to keep access to systems across restarts, changed credentials, and other interruptions that would cut off their access. Common persistence techniques include Registry Run Keys (T1547.001), Scheduled Tasks (T1053.005), creating new user accounts (T1136), installing services, and modifying startup scripts. During IR, checking for persistence mechanisms is critical — finding the initial compromise point is insufficient if persistence mechanisms remain active."
                },
                {
                    question: "User and Entity Behavior Analytics (UEBA) differs from signature-based detection in what fundamental way?",
                    options: [
                        "UEBA only analyzes network traffic while signatures analyze host activity",
                        "UEBA detects deviations from an established behavioral baseline rather than matching known-bad patterns",
                        "UEBA requires manual rule creation while signatures are automatically updated",
                        "UEBA only works for privileged accounts while signatures cover all users"
                    ],
                    correct: 1,
                    explanation: "Signature-based detection matches activity against a database of known-bad patterns — it can only detect what it has seen before. UEBA establishes a behavioral baseline for each user and entity through machine learning, then alerts on statistically significant deviations from that baseline. This enables detection of novel attack patterns, insider threats, and compromised credentials being used in atypical ways. A valid credential used at 3 AM from a foreign country matches no attack signature but clearly deviates from the user's behavioral baseline."
                },
                {
                    question: "An analyst wants to detect rogue wireless access points on the corporate network. What is the MOST effective technical method?",
                    options: [
                        "Reviewing DHCP server logs for unknown client MAC addresses",
                        "Conducting wireless surveys with RF spectrum analysis tools to identify all APs and their BSSIDs",
                        "Checking the firewall for unauthorized outbound connections",
                        "Reviewing DNS query logs for unknown hostnames"
                    ],
                    correct: 1,
                    explanation: "Wireless surveys using RF spectrum analysis tools directly detect all access points broadcasting in the physical area — including rogue APs that may not be connected to the wired network and therefore would not appear in DHCP or firewall logs. The survey captures SSID, BSSID (MAC address of the AP), channel, signal strength, and security settings. Comparing detected APs against the authorized AP inventory reveals rogue devices. Evil Twin attacks (rogue APs with the same SSID as legitimate APs) are detectable by their different BSSID."
                },
                {
                    question: "Windows Registry Run keys are significant from a security perspective because attackers use them primarily for which purpose?",
                    options: [
                        "Storing stolen credentials for offline analysis",
                        "Establishing persistence so malware survives system reboots",
                        "Hiding malware code within the registry hive to evade filesystem scanning",
                        "Modifying system privileges for privilege escalation attacks"
                    ],
                    correct: 1,
                    explanation: "Registry Run keys (HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run and HKCU equivalent) cause specified programs to execute automatically when the system starts or a user logs in. Attackers add malware paths to these keys to ensure their malware restarts after system reboots, credential changes, or other interruptions. This is one of the most commonly used Windows persistence mechanisms and is included in MITRE ATT&CK as T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys). Monitoring these keys for unauthorized entries is a key detection capability."
                },
                {
                    question: "Passive network monitoring using a network tap is described as most useful for which type of analysis?",
                    options: [
                        "Real-time threat detection and automated blocking",
                        "After-the-fact forensic analysis of historical traffic content",
                        "Active testing of network performance and bandwidth",
                        "Generating alerts based on traffic volume thresholds"
                    ],
                    correct: 1,
                    explanation: "Passive monitoring (via physical tap or SPAN/mirror port) captures complete traffic content without affecting the production traffic flow. This makes it ideal for after-the-fact forensic analysis — examining what actually happened during an incident, what data may have been exfiltrated, what protocols were used, and what commands were executed. Full packet capture creates large data volumes that are typically retained for days to weeks, unlike Netflow which can be retained much longer due to its compact metadata format."
                },
                {
                    question: "Tools like Tripwire and AIDE (Advanced Intrusion Detection Environment) are used for which security monitoring purpose?",
                    options: [
                        "Scanning network traffic for malware signatures",
                        "Detecting unauthorized changes to critical filesystem files by comparing against a cryptographic baseline",
                        "Monitoring user authentication events across multiple systems",
                        "Analyzing application logs for SQL injection attempts"
                    ],
                    correct: 1,
                    explanation: "Tripwire, AIDE, and similar file integrity monitoring (FIM) tools create cryptographic hashes (typically SHA-256) of critical system files at a known-good baseline state. They then continuously or periodically compare current file hashes against the baseline. Any change — even a single bit — in a protected file produces a different hash, triggering an alert. This detects malware that modifies system binaries, rootkits that replace OS components, and unauthorized configuration changes. The tools monitor files, permissions, ownership, and file attributes."
                },
                {
                    question: "A Domain Generation Algorithm (DGA) is used by malware to evade detection. What is the primary operational purpose of DGA in a botnet?",
                    options: [
                        "To encrypt C2 traffic so it cannot be inspected by security tools",
                        "To dynamically generate many domain names from a shared seed so compromised hosts can find active C2 infrastructure",
                        "To generate fake certificate authorities for TLS connections to C2 servers",
                        "To rotate IP addresses so the C2 server cannot be blocked by IP-based firewall rules"
                    ],
                    correct: 1,
                    explanation: "DGA malware uses a mathematical algorithm and a shared seed (often date-based) to generate hundreds or thousands of domain names. The botnet operator registers a small subset of these domains at any given time. Infected hosts use the same algorithm to generate the same list and attempt connections to each until they find an active one. This makes takedown extremely difficult — blocking known domains is ineffective because the malware generates new ones. Detection focuses on identifying the high-volume DNS queries to algorithmically similar, randomly-appearing domain names."
                }
            ]
        });
        quiz.start();
    </script>
