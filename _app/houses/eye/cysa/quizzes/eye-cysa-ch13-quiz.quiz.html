    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 13: Digital Forensics',
            description: 'Evidence handling, chain of custody, and forensic analysis',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch13-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Which principle in digital forensics requires that all investigative actions be fully documented and reproducible by an independent third-party investigator?",
                    options: [
                        "Order of Volatility",
                        "Forensic Integrity Principle — documentation and repeatability",
                        "Legal Hold",
                        "Chain of Custody"
                    ],explanation: "The foundational principle of digital forensics is that every action taken must be documented and reproducible by an independent third-party investigator. This is what separates forensic investigation from general IT troubleshooting. Documentation must be contemporaneous (written in real time), methodical, and complete. Without this principle, forensic findings cannot be challenged or verified — making them legally and professionally worthless."
                },
                {
                    question: "A forensic investigator uses a hardware write blocker before connecting a suspect drive to their workstation. What is the primary purpose of this device?",
                    options: [
                        "To speed up the imaging process by compressing data in real time",
                        "To ensure the source drive cannot be written to or have its data changed during imaging, preserving forensic integrity",
                        "To decrypt full-disk encryption before imaging begins",
                        "To verify the drive's hash value automatically after imaging completes"
                    ],explanation: "Hardware write blockers physically prevent any write operations to the source drive during forensic imaging. They intercept write commands at the hardware level, returning a write error to any software that attempts to write — while leaving the actual disk sectors completely untouched. Hardware write blockers are preferred over software variants for maximum forensic integrity and evidence admissibility. Without a write blocker, simply connecting a drive to a computer can modify file access timestamps — potentially contaminating the evidence."
                },
                {
                    question: "An analyst must capture volatile evidence from a running Windows workstation that may contain fileless malware. According to the Order of Volatility, which action should be performed first?",
                    options: [
                        "Create a forensic image of the hard drive using FTK Imager",
                        "Capture the contents of RAM using a memory acquisition tool such as DumpIt",
                        "Review Windows Event Logs to identify the malware's entry point",
                        "Pull the network cable to prevent the malware from exfiltrating data"
                    ],explanation: "The Order of Volatility requires capturing the most volatile (most easily lost) data first. RAM is the second most volatile data source (after CPU registers/cache) — it is completely lost when power is removed. Fileless malware exists only in memory and will not appear in disk imaging. RAM capture using tools like DumpIt (Windows), LiME (Linux), or FMem must be performed before disk imaging. Pulling the network cable (while stopping exfiltration) may disrupt memory state if done incorrectly, and must be balanced against evidence preservation needs."
                },
                {
                    question: "Which file carving technique uses known file signatures (such as JPEG's FF D8 FF header) to locate and extract files from raw disk data without relying on filesystem metadata?",
                    options: [
                        "Content-based carving using statistical text analysis",
                        "File structure-based carving using internal file schema",
                        "Header- and footer-based carving using file magic bytes",
                        "Metadata carving using EXIF and file attribute data"
                    ],explanation: "Header- and footer-based carving locates files by searching raw disk data for known file signatures (magic bytes). Every file format has characteristic byte sequences: JPEG images begin with FF D8 FF and end with FF D9; PDF files begin with '%PDF'; ZIP archives begin with 50 4B 03 04. Carving tools scan disk blocks for these signatures and extract everything between a matching header and footer as a recoverable file. This technique works even when the filesystem's directory entries have been deleted or overwritten, making it essential for recovering evidence from formatted or corrupted drives."
                },
                {
                    question: "A forensic analyst discovers that a suspect's workstation had CCleaner installed and run during the timeframe of the alleged incident. What is the forensic significance of this finding?",
                    options: [
                        "CCleaner is used by attackers to install rootkits — this confirms malware infection",
                        "CCleaner is an anti-forensics tool that deletes browsing history, temp files, and system artifacts useful in forensic investigations — its presence suggests evidence destruction",
                        "CCleaner creates forensic artifacts in the Windows Registry that help establish a timeline",
                        "CCleaner is a legitimate IT tool with no forensic implications"
                    ],explanation: "CCleaner and similar system cleanup utilities delete exactly the types of data that forensic investigators rely on: browser history, temporary files, recently accessed file lists (MRU lists), Windows prefetch files, and system event logs. Finding that CCleaner was run during an investigation timeframe is a significant forensic finding — it suggests deliberate destruction of evidence (or at minimum, destruction of artifacts that would help establish what occurred). Investigators document these findings as part of anti-forensics analysis. The presence and execution of anti-forensics tools is itself evidence of knowledge and intent."
                },
                {
                    question: "The Volatility Framework is a forensic tool primarily used for which purpose?",
                    options: [
                        "Creating verified forensic disk images with MD5/SHA-256 hash validation",
                        "Capturing, parsing, and analyzing RAM memory dumps to extract running processes, network connections, encryption keys, and detect rootkits",
                        "Performing network packet capture and protocol analysis similar to Wireshark",
                        "Recovering deleted files from unallocated disk space using file carving algorithms"
                    ],explanation: "Volatility is the gold standard open-source memory forensics framework. It analyzes memory dumps (acquired with tools like DumpIt, LiME, or WinPMem) to extract: running and terminated processes, active and recently closed network connections, Windows Registry hives loaded in memory, clipboard contents, encryption keys from full-disk encryption systems, injected code and rootkit artifacts, and user activity history. Volatility supports multiple operating systems (Windows, Linux, macOS) and is extensible through plugins. It is essential for investigating fileless malware and advanced threats that leave minimal disk footprint."
                },
                {
                    question: "Which forensic imaging tool is a standard Linux/Unix utility that performs bit-for-bit disk copying, and what additional argument should be used to verify the integrity of the resulting image?",
                    options: [
                        "FTK Imager; use the /verify flag after imaging completes",
                        "dd; generate MD5 and SHA-256 hashes of both the source device and the image file and compare them to confirm integrity",
                        "EnCase; the .E01 format automatically verifies integrity using built-in checksums",
                        "Autopsy; run the Hash Lookup module after importing the image"
                    ],explanation: "dd (Data Duplicator) is a standard Unix/Linux command-line tool for bit-for-bit disk copying. Syntax: dd bs=64k if=/dev/sda of=/path/to/image.img. After imaging, both the source device and the image must be hashed independently using both MD5 and SHA-256: md5sum /dev/sda and sha256sum /dev/sda vs the image file. Matching hashes prove the image is a perfect copy. Best practice requires TWO hash algorithms — MD5 alone has known collision vulnerabilities. The dc3dd variant adds built-in hashing, logging, and error handling specifically for forensic use."
                },
                {
                    question: "Why does cloud forensics present unique challenges compared to traditional endpoint forensics?",
                    options: [
                        "Cloud systems use different file systems (ext4 vs. NTFS) that require specialized tools",
                        "Cloud data is encrypted and cannot be decrypted without provider cooperation regardless of legal process",
                        "Shared-tenant models mean forensic data can be hard to obtain and often requires cloud service provider participation; chain of custody and data preservation are more difficult to maintain",
                        "Cloud providers automatically delete all logs after 24 hours, making forensic investigation impossible"
                    ],explanation: "Cloud forensics challenges are primarily structural: (1) Shared tenancy means you cannot physically isolate a server — forensic data may be co-mingled with other customers' data. (2) The cloud provider must participate in evidence collection — you cannot image a server you do not physically control. (3) Chain of custody for cloud-collected evidence is harder to maintain because the provider's collection process must be documented and trusted. (4) Log retention varies widely — some cloud providers delete logs after 7-90 days by default. The time to establish forensic access agreements is before an incident, not after, through contract negotiation."
                },
                {
                    question: "A forensic examiner is analyzing a Windows system and wants to determine all USB devices that have ever been connected to the machine, even if currently disconnected. Which tool or data source is most directly useful?",
                    options: [
                        "Windows Event Viewer System log — USB connection events are recorded there",
                        "USB Historian or Windows Registry USBSTOR key — Windows tracks USB device history including device type, serial number, and first/last connection times",
                        "The device's swap file (pagefile.sys) which logs all device interactions",
                        "Network packet capture of USB-over-network traffic"
                    ],explanation: "Windows stores USB device history in the Registry under HKLM\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR. This key records every USB storage device ever connected: device type, manufacturer, model, serial number, and connection timestamps. The Setup API logs in C:\\Windows\\INF\\setupapi.dev.log also record device installation times. USB Historian is a forensic tool that parses these registry entries and log files into a readable timeline. This data persists even after the device is disconnected and can reveal whether unauthorized removable media was used for data exfiltration — a critical finding in insider threat investigations."
                },
                {
                    question: "What must a forensic report always include, regardless of whether the investigation found evidence of wrongdoing?",
                    options: [
                        "A signed affidavit from the lead investigator and the suspect's supervisor",
                        "Goals of the investigation, targets, findings and analysis — even if findings are negative (no evidence of wrongdoing) — along with methods used and limitations encountered",
                        "A recommendation for prosecution based on the evidence discovered",
                        "Hash values of all analyzed files and a complete listing of every file on the examined drive"
                    ],explanation: "A forensic report is required at the conclusion of every investigation regardless of outcome. A negative finding — 'we found no evidence of the alleged activity' — is still a finding that must be documented. The report must include: investigation goals and scope, what systems/data were examined (targets), methods and tools used, all findings (positive and negative), and analysis of what the findings mean. The report should also document limitations: what was not examined, what evidence was unavailable, and what conclusions cannot be drawn from available evidence. Forensic reports serve as the investigative record and may be needed months or years later in legal proceedings."
                }
            ]
        });
        quiz.start();
    </script>
