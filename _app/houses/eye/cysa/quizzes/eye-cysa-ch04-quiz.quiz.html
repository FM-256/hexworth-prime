<body>

        <a href="../index.html">&larr; Back to CySA+</a>

        <div id="quiz-container"></div>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 04: Vulnerability Management Program',
            description: 'Vulnerability lifecycle, risk scoring, remediation, and compliance',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch04-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "PCI DSS section 11.2 requires external vulnerability scans to be performed by which type of entity?",
                    options: [
                        "Any qualified internal security staff member with appropriate certifications",
                        "An Approved Scanning Vendor (ASV) — an organization approved by the PCI Security Standards Council",
                        "A Big Four accounting firm providing third-party assurance",
                        "A CISA-certified government auditor"
                    ],explanation: "PCI DSS 11.2.2 requires that external vulnerability scans be performed by an Approved Scanning Vendor (ASV) — an organization qualified and approved by the PCI Security Standards Council. This requirement does not apply to internal scans, which can be performed by qualified internal personnel. The distinction between internal (can be internal) and external (must use ASV) scans is a frequent exam topic."
                },
                {
                    question: "A hospital's IT security team argues that since HIPAA doesn't explicitly mandate quarterly vulnerability scans, they don't need a formal vulnerability scanning program. Which response best addresses this reasoning?",
                    options: [
                        "The argument is correct — regulatory requirements are the only valid driver for vulnerability management programs",
                        "HIPAA does not apply to hospitals, so the team's reasoning is entirely invalid",
                        "Even without specific regulatory mandates for scanning frequency, vulnerability management is critical security practice, and organizations often mandate scanning under corporate policy",
                        "HIPAA explicitly requires monthly scanning, making the team's argument factually incorrect"
                    ],explanation: "PCI DSS and FISMA don't apply to all organizations, but vulnerability management is still critical security practice for all organizations. Organizations can — and many do — require scanning under their own corporate security policies independent of regulatory requirements. The absence of a regulatory mandate does not reduce the operational security need. Many security frameworks (ISO 27001, NIST CSF) implicitly require vulnerability assessment as part of good security practice."
                },
                {
                    question: "Which SCAP component provides a standardized numerical score from 0–10 that represents the severity of a software vulnerability, considering factors like attack vector, required privileges, and CIA impact?",
                    options: [
                        "CVE — Common Vulnerabilities and Exposures",
                        "CCE — Common Configuration Enumeration",
                        "CVSS — Common Vulnerability Scoring System",
                        "CPE — Common Platform Enumeration"
                    ],explanation: "CVSS (Common Vulnerability Scoring System) provides a standardized 0–10 numerical score representing the severity of software vulnerabilities. Scores consider: attack vector (network vs. physical), attack complexity, privileges required, user interaction required, scope, and CIA impact. A CVSS score of 10 represents maximum severity (remote, no-auth, no-interaction, full CIA impact). CVE provides identifiers; CCE standardizes configuration issues; CPE provides product naming."
                },
                {
                    question: "An organization's vulnerability scanner has a significant backlog of identified vulnerabilities. The security team must prioritize remediation but lacks resources to fix everything immediately. Which vulnerability should receive the HIGHEST priority for immediate remediation?",
                    options: [
                        "An internal-only database server with a critical CVSS score of 9.8 that requires local access to exploit",
                        "An internet-facing web server with a medium CVSS score of 6.5 that allows remote code execution with no authentication required",
                        "A development server with multiple low-severity CVSS scores averaging 3.2",
                        "An intranet file server with a high CVSS score of 8.1 requiring authenticated access to exploit"
                    ],explanation: "The internet-facing web server should receive highest priority despite having a lower CVSS score than the internal database. Vulnerability exposure (internet-facing) dramatically multiplies real-world risk compared to internal-only systems. A 6.5-scored remote code execution with no authentication on an external system is more immediately dangerous than a 9.8-scored vulnerability requiring local access on an internal-only server. Prioritization must consider all four factors: system criticality, CVSS severity, exposure (internal vs. external), and remediation difficulty."
                },
                {
                    question: "What is the primary difference between active and passive vulnerability scanning?",
                    options: [
                        "Active scanning uses commercial tools; passive scanning uses only open-source tools",
                        "Active scanning probes hosts directly and interacts with their services; passive scanning monitors network traffic without sending probes to target systems",
                        "Active scanning requires administrative credentials; passive scanning is always unauthenticated",
                        "Active scanning is performed externally; passive scanning is always performed from inside the network"
                    ],explanation: "Active vulnerability scanning directly interacts with target hosts by sending probes to identify open services and check for vulnerabilities — it is noisy, can cause service disruption, and generates logs on target systems. Passive vulnerability scanning monitors network traffic without direct interaction — it observes what hosts reveal about themselves through normal activity. Passive scanning only detects vulnerabilities reflected in traffic and cannot see internal system state without direct access. Both have value and serve as complementary approaches."
                },
                {
                    question: "An authenticated vulnerability scan differs from an unauthenticated scan primarily because it:",
                    options: [
                        "Scans from outside the organization's perimeter to simulate an external attacker",
                        "Can access the operating system, databases, and application configurations directly using provided credentials, revealing vulnerabilities invisible to unauthenticated scans",
                        "Requires physical access to each scanned system",
                        "Only tests for known CVEs without actively attempting exploitation"
                    ],explanation: "Authenticated scanning provides the scanner with read-only credentials to access the OS, databases, and applications on the target system directly. This overcomes firewall and IPS interference that might block unauthenticated scan probes. Authenticated scans reveal installed software versions, configuration settings, patch levels, local accounts, and registry settings — vulnerabilities that are invisible from the network perspective. PCI DSS requires authenticated internal scans for comprehensive results."
                },
                {
                    question: "A company's security policy requires quarterly vulnerability scans of all PCI-scoped systems. Before the next scheduled scan, a new critical vulnerability (CVSS 9.8) is publicly disclosed affecting software running on 15 PCI-scoped servers. Under FISMA and PCI DSS principles, what should the organization do?",
                    options: [
                        "Wait for the next quarterly scan since that is the scheduled cadence per policy",
                        "Conduct an emergency out-of-cycle scan targeting the affected systems immediately, since new threats require immediate assessment",
                        "Request an extension from their ASV since the vulnerability was disclosed mid-quarter",
                        "Simply apply patches without scanning since the CVE is already public knowledge"
                    ],explanation: "FISMA explicitly requires scanning 'when new threats emerge' — not just on a fixed schedule. PCI DSS requires scans 'quarterly and after significant changes.' The disclosure of a critical CVE affecting your specific systems constitutes an emerging threat. An out-of-cycle scan should target the affected systems immediately to confirm exposure and assess impact before patching. Relying solely on scheduled scans in the face of active critical disclosures is insufficient. This principle applies regardless of which regulatory framework governs the organization."
                },
                {
                    question: "Which vulnerability management best practice specifically recommends starting with a small section of network assets and expanding scope gradually to avoid overwhelming systems and administrators?",
                    options: [
                        "Implementing compensating controls before full remediation",
                        "Using passive scanning to avoid disruption",
                        "Starting small and expanding slowly when building a new vulnerability management program",
                        "Conducting risk acceptance reviews before each scan cycle"
                    ],explanation: "Best practices for new vulnerability management programs recommend starting small (a limited scope of network assets) and expanding slowly. This prevents overwhelming enterprise systems and the system administration team with an unmanageable volume of scan results and remediation tasks simultaneously. A phased approach allows teams to develop processes, calibrate scanner settings, and build remediation workflows before scaling to the full organizational scope."
                },
                {
                    question: "An organization wants to minimize their PCI DSS compliance scan scope without reducing actual security coverage. Which network design approach specifically supports this goal?",
                    options: [
                        "Implementing VLAN tagging across all switches to improve network performance",
                        "Using network segmentation to isolate PCI DSS systems from the broader organizational network, minimizing the number of systems in scope",
                        "Deploying a unified threat management (UTM) device at the network perimeter",
                        "Replacing all physical switches with software-defined networking (SDN) controllers"
                    ],explanation: "Network segmentation allows organizations to isolate PCI DSS-scoped systems from the rest of the network, dramatically reducing the number of systems that fall within the compliance scan scope. If payment card systems are properly segmented, only those systems (and the controls protecting them) need to meet full PCI DSS scanning requirements. This is explicitly recognized in PCI DSS — proper segmentation is one of the most valuable compliance scoping tools available."
                },
                {
                    question: "Which SCAP component provides standardized identifiers for security-related software flaws, allowing different tools and organizations to refer to the same vulnerability using a consistent, universally recognized name?",
                    options: [
                        "XCCDF — Extensible Configuration Checklist Description Format",
                        "OVAL — Open Vulnerability and Assessment Language",
                        "CVE — Common Vulnerabilities and Exposures",
                        "CCE — Common Configuration Enumeration"
                    ],explanation: "CVE (Common Vulnerabilities and Exposures) provides standardized names for security-related software flaws. Each CVE identifier (e.g., CVE-2021-44228 for Log4Shell) is universally recognized across all vendors, tools, and organizations. Before CVE, the same vulnerability might be described differently by different vendors, making correlation impossible. CVE enables automated matching between scanner results, threat intelligence feeds, and patch management systems. XCCDF defines checklists; OVAL defines testing procedures; CCE standardizes configuration issues."
                }
            ]
        });
        quiz.start();
    </script>
