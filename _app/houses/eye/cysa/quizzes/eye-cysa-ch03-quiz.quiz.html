    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 03: Reconnaissance and Intelligence Gathering',
            description: 'Active/passive recon, OSINT, DNS, and network mapping',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch03-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "A security consultant reviews a target organization's WHOIS records, reads their LinkedIn job postings, and searches Google for cached versions of their web pages — all without sending any packets to the organization's systems. Which type of reconnaissance is this?",
                    options: [
                        "Active reconnaissance — because it involves gathering information about the target",
                        "Passive reconnaissance — because it uses publicly available sources without direct interaction with target systems",
                        "Semi-active reconnaissance — because WHOIS queries contact a third-party server",
                        "Covert reconnaissance — because the organization cannot see the researcher's identity"
                    ],explanation: "Passive reconnaissance relies on publicly available data and cached sources without sending packets directly to the target's systems. WHOIS queries go to registrar servers (not the target). Google searches go to Google's servers (not the target). LinkedIn data is publicly available. No logs are created on the target's systems. This contrasts with active recon, which directly interacts with the target's infrastructure."
                },
                {
                    question: "An nmap scan uses the flag '-sS'. What does this scan type do?",
                    options: [
                        "Sends UDP packets to all ports and waits for ICMP port unreachable responses",
                        "Performs a full TCP connection (three-way handshake) to each target port",
                        "Sends a SYN packet and waits for a SYN-ACK, but never completes the handshake (half-open/stealth scan)",
                        "Uses ICMP echo requests to determine if the host is alive"
                    ],explanation: "The -sS flag performs a TCP SYN scan (also called a stealth scan or half-open scan). Nmap sends a SYN packet; if the port is open, the target responds with SYN-ACK; nmap then sends RST to close the connection without completing the full three-way handshake. This is faster than a full connect scan (-sT) and often evades logging, since many systems only log completed connections. The -O flag detects OS; -PO skips pinging; -sV detects service versions."
                },
                {
                    question: "Which of the following correctly describes the difference between OSSTMM and PTES?",
                    options: [
                        "OSSTMM is a government standard from NIST; PTES is a commercial framework sold by vendors",
                        "OSSTMM covers physical, human, wireless, telecom, and data network testing; PTES is a structured seven-phase penetration testing methodology",
                        "OSSTMM focuses on web application security; PTES focuses on network infrastructure testing",
                        "Both are identical frameworks — PTES is simply the updated version of OSSTMM"
                    ],explanation: "OSSTMM (Open Source Security Testing Methodology Manual) at isecom.org is a comprehensive, multi-domain framework covering physical security, human (social engineering), wireless, telecommunications, and data networks. PTES (Penetration Testing Execution Standard) at pentest-standard.org defines a seven-phase methodology: Pre-engagement, Intelligence Gathering, Threat Modeling, Vulnerability Analysis, Exploitation, Post-Exploitation, and Reporting. Both are free standards used in professional penetration testing."
                },
                {
                    question: "A security analyst uses the dig command to request a zone transfer from a misconfigured DNS server. What information could be obtained from a successful zone transfer?",
                    options: [
                        "Only the A record for the primary domain (e.g., www.company.com)",
                        "The complete DNS database for the domain — all hostnames, IP addresses, MX records, and subdomains",
                        "The WHOIS registration information for the domain owner",
                        "The firewall ACL rules protecting the DNS server"
                    ],explanation: "A DNS zone transfer (AXFR) is designed to replicate the complete DNS database between DNS servers for redundancy. If misconfigured to allow unauthorized transfers, an attacker receives the entire DNS database for the domain — all A records, MX records, CNAME records, TXT records, and subdomains. This is a significant information disclosure vulnerability. Most organizations prevent zone transfers to servers that are not authorized DNS slaves. Command: dig axfr @dns-server domain.name"
                },
                {
                    question: "Netflow data collected from a Cisco router shows an unusual pattern: a single internal IP address is generating connections to hundreds of different external hosts on port 443 over a 10-minute period. What type of reconnaissance detection analysis is being applied?",
                    options: [
                        "Signature analysis — matching against a known attack signature database",
                        "Manual analysis — a human expert reviewing raw logs",
                        "Anomaly analysis — identifying behavior that deviates from established baseline patterns",
                        "Heuristic analysis — running the suspicious process in a controlled environment"
                    ],explanation: "Anomaly analysis asks 'what is different from normal?' A single host generating connections to hundreds of external IPs in a short timeframe deviates from the established baseline for normal user behavior. This pattern suggests either an internal host conducting reconnaissance (enumerating external services) or malware using beaconing/C2 communication. Anomaly analysis is complementary to signature analysis (known bad patterns) and is essential for detecting novel attack patterns."
                },
                {
                    question: "Which tool is specifically described as a search engine for internet-connected devices and their known vulnerabilities, allowing analysts to discover exposed industrial control systems, databases, and webcams?",
                    options: [
                        "Maltego — which builds relationship maps between people and resources",
                        "theHarvester — which gathers emails, domains, and hostnames",
                        "Shodan — which indexes internet-connected devices and their service banners",
                        "Responder — which captures network authentication credentials"
                    ],explanation: "Shodan is a search engine that continuously scans the internet and indexes service banners from connected devices — web servers, databases, industrial control systems, webcams, VoIP phones, and more. Unlike Google (which indexes web content), Shodan indexes device metadata and service information. Security analysts use Shodan to identify their organization's internet-facing exposure. It has revealed exposed SCADA systems, unsecured Elasticsearch databases, and default-credential devices."
                },
                {
                    question: "During a penetration test, a tester discovers that a Word document on the company's public website contains the author name 'John Smith - IT Department' and GPS coordinates embedded in attached photos. What type of data is being described?",
                    options: [
                        "Netflow data from the organization's routers",
                        "Document metadata and EXIF data — which can reveal internal identities and physical locations",
                        "DNS zone transfer data revealing internal hostnames",
                        "DHCP log data identifying device MAC addresses"
                    ],explanation: "Document metadata (embedded in Office files, PDFs) contains author names, software versions, revision history, and organizational information. EXIF data (embedded in photos) can contain GPS coordinates, camera model, and timestamps. An attacker can use author names to target spear-phishing attacks and GPS coordinates to identify facility locations. Organizations should strip metadata and EXIF data from all files published publicly. Tools like ExifTool can inspect and remove this data."
                },
                {
                    question: "An organization wants to prevent passive reconnaissance by controlling the information available about their domain registration. Which measure specifically addresses this concern?",
                    options: [
                        "Deploying an IPS to block port scanning attempts",
                        "Using domain privacy services that substitute third-party registration information for the actual registrant's personal details",
                        "Enabling DNS zone transfers to synchronize DNS servers more securely",
                        "Implementing 802.1x NAC on all network access points"
                    ],explanation: "Domain privacy services (offered by most registrars) replace the actual registrant's name, address, phone number, and email in WHOIS records with the privacy service provider's information. This prevents attackers from using WHOIS to identify organizational leadership, office locations, and contact information for social engineering. IPS deployment addresses active recon; zone transfer configuration affects DNS enumeration; 802.1x is a network access control measure — none of these directly address WHOIS data exposure."
                },
                {
                    question: "Which Kali Linux tool passively listens for network transmissions and then actively attempts to hijack connections to gather credential information?",
                    options: [
                        "theHarvester",
                        "Maltego",
                        "Shodan",
                        "Responder"
                    ],explanation: "Responder is a Python script that operates in two modes. In passive mode, it listens for Link-Local Multicast Name Resolution (LLMNR), NetBIOS Name Service (NBT-NS), and mDNS broadcasts. When it detects a transmission, it switches to active mode and responds to the broadcast, impersonating the requested resource to capture NTLMv2 hashes or clear-text credentials. It is particularly effective in Windows environments and is commonly used during internal penetration tests for credential harvesting."
                },
                {
                    question: "A security analyst reviewing DHCP server logs at /var/log/dhcpd.log observes multiple DHCPREQUEST and DHCPACK entries for IP 10.0.2.40 associated with MAC address 08:00:27:fa:25:8e. What does this tell the analyst about host discovery?",
                    options: [
                        "The host at 10.0.2.40 is attempting a DNS zone transfer attack",
                        "The DHCP server is misconfigured and allocating the same IP multiple times",
                        "The host is alive on the network with a dynamically assigned IP, allowing correlation of IP addresses with MAC addresses for inventory purposes",
                        "The host is performing active port scanning against other network resources"
                    ],explanation: "DHCP logs are a valuable passive reconnaissance source for building host inventory. Each DHCPREQUEST/DHCPACK pair confirms a host is active on the network, provides its current IP address, and links it to a hardware MAC address. By combining DHCP logs with ARP tables and DNS records, analysts can create a comprehensive inventory of network hosts including which use dynamic addressing versus static IPs. This is entirely passive — no scanning required."
                }
            ]
        });
        quiz.start();
    </script>
