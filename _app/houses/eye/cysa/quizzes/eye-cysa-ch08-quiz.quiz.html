    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 08: IAM Security',
            description: 'Identity and access management, authentication, authorization, and MFA',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch08-quiz',
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "An attacker compromises the krbtgt account hash in an Active Directory domain. What is the most accurate description of the impact and the name of the resulting attack?",
                    options: [
                        "The attacker can only access resources on the domain controller — this is a Silver Ticket attack",
                        "The attacker can forge Ticket Granting Tickets for any user in the domain, granting unlimited access — this is a Golden Ticket attack",
                        "The attacker can steal existing Kerberos tickets from user sessions but cannot create new ones — this is a Pass-the-Ticket attack",
                        "The attacker gains access to all RADIUS authentication sessions on the network — this is a Pass-the-Key attack"
                    ],
                    correct: 1,
                    explanation: "A Golden Ticket attack occurs when an attacker compromises the krbtgt account hash — the master key for Kerberos in Active Directory. With the krbtgt hash, the attacker can forge Ticket Granting Tickets (TGTs) for ANY user account, including accounts that don't exist, for up to 10-year validity periods. This gives unlimited, persistent access to the entire domain. Remediation requires resetting the krbtgt password TWICE (to invalidate all existing tickets) and rebuilding trust. A Silver Ticket uses a service account hash (access to one service). Pass-the-Ticket reuses existing stolen tickets."
                },
                {
                    question: "A user logs in with their company Google account and is automatically granted access to Salesforce, Workday, and Slack without entering additional passwords. This is an example of:",
                    options: [
                        "Multi-Factor Authentication (MFA)",
                        "Role-Based Access Control (RBAC)",
                        "Single Sign-On (SSO) with federated identity",
                        "Mandatory Access Control (MAC)"
                    ],
                    correct: 2,
                    explanation: "Single Sign-On (SSO) allows users to authenticate once and access multiple systems without re-entering credentials. When the SSO uses an external identity provider (Google in this case), it is also federated identity — the trust boundary extends outside the organization to Google as the Identity Provider (IDP). Google authenticates the user and provides claims/assertions to each Service Provider (Salesforce, Workday, Slack) via protocols like SAML or OpenID Connect. This reduces password fatigue, decreases support tickets, and centralizes authentication logging."
                },
                {
                    question: "Which access control model uses labels to determine access, where subjects and objects are assigned labels and permissions are granted when labels match?",
                    options: [
                        "Role-Based Access Control (RBAC)",
                        "Discretionary Access Control (DAC)",
                        "Mandatory Access Control (MAC)",
                        "Attribute-Based Access Control (ABAC)"
                    ],
                    correct: 2,
                    explanation: "Mandatory Access Control (MAC) uses security labels to control access. Both subjects (users/processes) and objects (files/resources) are assigned security labels (e.g., Unclassified, Confidential, Secret, Top Secret). Access is granted only when the subject's label matches or exceeds the object's label. Users cannot change permissions — only system administrators can modify labels. SELinux implements MAC in Linux. MAC is the model used in classified government and military environments where strict access control is required regardless of user preference."
                },
                {
                    question: "An employee's user account still has access to the financial system six months after they changed roles from Finance Analyst to Marketing Coordinator. This is an example of which IAM problem?",
                    options: [
                        "Privilege creep — accumulated permissions from previous roles that were not removed when the role changed",
                        "Account spoofing — an attacker has created a duplicate account using the employee's identity",
                        "Credential stuffing — the employee is using stolen credentials from another breach",
                        "LDAP injection — an attacker is exploiting the directory service to elevate permissions"
                    ],
                    correct: 0,
                    explanation: "Privilege creep occurs when users accumulate permissions over time through role changes without having old access rights removed. An employee who moves from Finance to Marketing should have Finance system access revoked when granted Marketing access. The Principle of Least Privilege requires users to have only the minimum permissions needed for their current role. Quarterly access recertification reviews — where managers confirm that each user still requires their assigned access — are the primary control to detect and remediate privilege creep."
                },
                {
                    question: "RADIUS differs from Kerberos as an authentication protocol primarily because RADIUS:",
                    options: [
                        "Uses ticket-based authentication to provide Single Sign-On across domain services",
                        "Was designed to authenticate remote users and network device access, commonly used for VPN and wireless authentication",
                        "Operates exclusively over encrypted TLS tunnels, making it more secure than Kerberos",
                        "Authenticates machines rather than users, making it suitable for device-level network access"
                    ],
                    correct: 1,
                    explanation: "RADIUS (Remote Authentication Dial-in User Service) was designed for authenticating remote access — originally dial-up users, now VPN, wireless networks, and network device authentication. It operates in a client-server model where network devices (VPN concentrators, wireless APs) act as RADIUS clients and forward authentication requests to the RADIUS server. RADIUS uses MD5 to obscure passwords — weak by modern standards. RADIUS traffic should be tunneled in IPSec. Kerberos is designed for internal network SSO in Windows domains, using a ticket-based model where passwords never cross the network."
                },
                {
                    question: "True Multi-Factor Authentication (MFA) requires factors from how many different factor CATEGORIES, and which combination below qualifies as TRUE MFA?",
                    options: [
                        "At least two factors from the SAME category are sufficient; a password plus a PIN qualifies as MFA",
                        "At least two factors from DIFFERENT categories are required; a password (knowledge) plus a hardware token OTP (possession) qualifies as MFA",
                        "At least three factors are always required for MFA regardless of category; two factors is 2FA, not MFA",
                        "MFA requires biometrics as one factor; a password plus an OTP without biometrics is not considered MFA"
                    ],
                    correct: 1,
                    explanation: "True MFA requires at least two factors from DIFFERENT categories: knowledge (something you know), possession (something you have), biometric (something you are), location (somewhere you are). A password plus a PIN are both knowledge factors — using two of the same type does NOT qualify as MFA. A password plus a hardware token OTP is knowledge + possession = TRUE MFA. The common misconception is that any two factors constitute MFA, but the category distinction is the defining requirement. This matters because two knowledge factors can both be compromised by a single phishing attack."
                },
                {
                    question: "Which IAM concept describes the practice of ensuring that accounts are disabled and access revoked on the exact date of employee termination?",
                    options: [
                        "Separation of duties",
                        "Account provisioning",
                        "Privilege escalation control",
                        "Account termination procedures and deprovisioning"
                    ],
                    correct: 3,
                    explanation: "Account termination procedures (deprovisioning) are the formal processes executed when an employee leaves the organization. This includes: disabling all accounts (AD, SaaS apps, VPN, badge access) on or before the termination date; recovering company hardware, tokens, and badges; changing any shared credentials the employee knew; archiving data per retention policy; and revoking email access and forwarding. Delayed deprovisioning leaves open accounts that can be exploited — either by the departed employee or by attackers who discover unused credentials. Automated deprovisioning tied to HR system changes is the most reliable control."
                },
                {
                    question: "A security analyst is reviewing SIEM alerts for suspicious IAM activity. Which event should trigger an IMMEDIATE alert as highest priority?",
                    options: [
                        "A user logging in from their normal office location at 9 AM on a Monday",
                        "A user failing authentication three times before successfully logging in",
                        "A terminated user account successfully authenticating and accessing sensitive data",
                        "An administrator performing routine account provisioning for a new employee"
                    ],
                    correct: 2,
                    explanation: "A terminated user account successfully authenticating is an immediate critical alert — this should be impossible if deprovisioning procedures were followed. It indicates either (1) the account was not properly disabled during offboarding, (2) an attacker has obtained credentials of a departed employee and is using them, or (3) the terminated employee retained access. All three scenarios require immediate response: disable the account, investigate the authentication event, determine what data was accessed, and review deprovisioning procedures. Failed logins followed by success (option B) indicate possible brute-force and warrant monitoring but are lower urgency."
                },
                {
                    question: "SAML (Security Assertion Markup Language) is primarily used for:",
                    options: [
                        "Storing and retrieving user credentials from LDAP directory services",
                        "Encrypting password transmission between clients and authentication servers",
                        "Exchanging authentication and authorization data between Identity Providers and Service Providers to enable web-based SSO",
                        "Managing the rotation of API keys in cloud service environments"
                    ],
                    correct: 2,
                    explanation: "SAML is an XML-based open standard for exchanging authentication and authorization information between an Identity Provider (IDP) and a Service Provider (SP). It enables Single Sign-On for web applications: the user authenticates to the IDP, which issues a SAML assertion (an XML token) containing authentication status and user attributes. The SP validates this assertion and grants access without requiring the user to authenticate again. SAML is widely used in enterprise federation (Active Directory Federation Services), B2B integrations, and SSO for SaaS applications. SAML 2.0 is the current version; OpenID Connect/OAuth2 are modern alternatives."
                },
                {
                    question: "Privileged Access Management (PAM) best practices include which of the following recommendations for administrator accounts?",
                    options: [
                        "Administrators should use their privileged account for all daily tasks to reduce the number of accounts they need to remember",
                        "Admin passwords should be long passphrases stored in the administrator's personal password manager",
                        "Administrators should have separate accounts for administrative tasks and daily use, with admin credentials vaulted and auto-rotated, never used for email or web browsing",
                        "Admin accounts should have the same MFA requirements as standard user accounts to ensure consistent authentication policy"
                    ],
                    correct: 2,
                    explanation: "PAM best practice requires strict separation between administrative accounts and daily-use accounts. Admin accounts should: never be used for email, web browsing, or general productivity (which exposes them to phishing and malware); be vaulted in a PAM system (CyberArk, BeyondTrust, Thycotic) with automated password rotation; require additional authentication factors beyond standard MFA; use Just-In-Time (JIT) access — elevated only when needed and automatically revoked after the task; and have all sessions recorded for audit. Using admin accounts for daily work is one of the most common privilege misuse patterns that enables attackers to escalate quickly after initial compromise."
                }
            ]
        });
        quiz.start();
    </script>
