    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 02: Using Threat Intelligence',
            description: 'Threat intelligence sources, STIX/TAXII, MITRE ATT&CK, and threat actors',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch02-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "What is the primary purpose of threat intelligence in a security operations context?",
                    options: [
                        "To replace the need for security controls by predicting all attacks in advance",
                        "To provide data and information about adversaries — their motivations, capabilities, tools, and methodologies — to help prevent or limit the impact of threats",
                        "To automate the patching of all known vulnerabilities across organizational systems",
                        "To satisfy compliance requirements for security audit documentation"
                    ],explanation: "Threat intelligence is data and information about adversaries (motivations, capabilities, tools, and methodologies) that helps security professionals fully understand threats in order to prevent them or limit their impact. It is actionable — it changes what defenders do. It cannot replace security controls, and while it supports compliance efforts, that is not its primary purpose."
                },
                {
                    question: "A threat intelligence feed reports that a specific threat actor is actively exploiting CVE-2024-1234 against healthcare organizations using a particular malware family. This intelligence is assessed as PROBABLE. What does this confidence level indicate in the ThreatConnect framework?",
                    options: [
                        "The intelligence has been confirmed through independent sources or direct analysis (90–100 range)",
                        "The assessment relies on logical inference but does not directly confirm the threat (70–89 range)",
                        "The information partially agrees with the analysis but is not confirmed (50–69 range)",
                        "The assessment has been confirmed as inaccurate or incorrect (score of 1)"
                    ],explanation: "In ThreatConnect's confidence scoring framework, 'Probable' (70–89) relies on logical inference but does not directly confirm the threat through independent sources or direct analysis. 'Confirmed' (90–100) requires independent verification or direct analysis. 'Possible' (50–69) has some agreement but is unconfirmed. 'Discredited' (1) means the assessment is confirmed false."
                },
                {
                    question: "Which standard is specifically designed to transport STIX-formatted threat intelligence between organizations at the application layer via HTTPS?",
                    options: [
                        "OpenIOC",
                        "TAXII (Trusted Automated Exchange of Indicator Information)",
                        "MISP (Malware Information Sharing Platform)",
                        "CVE (Common Vulnerabilities and Exposures)"
                    ],explanation: "TAXII (Trusted Automated Exchange of Indicator Information) is the companion to STIX that defines how cyberthreat information is communicated at the application layer via HTTPS. STIX is the language/format for describing threat intelligence; TAXII is the delivery mechanism. OpenIOC is a separate XML-based IOC framework. MISP is an implementation platform, not a standard."
                },
                {
                    question: "An organization's STIX data includes objects describing a threat actor, their malware, the attack patterns they use, and indicators of compromise. These are linked through relationship objects. Which standard does this describe?",
                    options: [
                        "TAXII — which defines transport of threat data",
                        "OpenIOC — which describes low-level forensic artifacts",
                        "STIX — Structured Threat Information Expression with 12 domain objects connected by relationships",
                        "OVAL — which defines configuration testing procedures"
                    ],explanation: "STIX (Structured Threat Information Expression) defines 12 domain objects including attack patterns, identity, malware, threat actors, tools, campaigns, and more. Objects are related to each other through relationship or sighting objects. STIX was originally XML-based and sponsored by the U.S. Department of Homeland Security. TAXII handles transport; OpenIOC handles specific forensic artifacts; OVAL handles configuration testing."
                },
                {
                    question: "Which of the following best describes the role of Information Sharing and Analysis Centers (ISACs)?",
                    options: [
                        "Government agencies that mandate threat intelligence sharing requirements for private sector companies",
                        "Sector-specific organizations where critical infrastructure owners share threat intelligence on a trust model, operating 24/7",
                        "Commercial threat intelligence vendors that sell proprietary feeds to enterprise customers",
                        "NIST working groups that develop threat intelligence exchange standards"
                    ],explanation: "ISACs are sector-specific organizations established to enable trusted sharing of threat information between critical infrastructure owners and operators within the same industry sector. They operate on a trust model, allow in-depth sharing of both physical and cyber threat information, and operate 24/7 providing incident response and threat analysis support. There are 25 ISACs. Three tested on CySA+: H-ISAC (healthcare), FS-ISAC (financial services), A-ISAC (aviation)."
                },
                {
                    question: "The MITRE ATT&CK framework covers which aspect of adversary activity that makes it valuable for defensive planning?",
                    options: [
                        "Only the initial access phase — how attackers first breach the perimeter",
                        "The complete threat lifecycle from initial access through execution, persistence, privilege escalation, lateral movement, and exfiltration",
                        "Only post-exploitation activity occurring after an attacker has established persistence",
                        "Physical security attacks on facilities and hardware tampering"
                    ],explanation: "MITRE ATT&CK (Adversarial Tactics, Techniques, and Common Knowledge) is the most comprehensive freely available database of adversary techniques. It covers the complete attack lifecycle: initial access, execution, persistence, privilege escalation, defense evasion, credential access, discovery, lateral movement, collection, exfiltration, and impact. Each tactic contains multiple specific techniques with real-world examples, making it directly actionable for detection and defense planning."
                },
                {
                    question: "Which threat actor category is characterized by hacking as a means to advance political or social causes, with targets chosen for ideological or symbolic value rather than financial gain?",
                    options: [
                        "Nation-State Actors — government-sponsored groups with country-level resources",
                        "Organized Crime — criminal enterprises focused on financial gain",
                        "Hacktivists — range from individuals to groups like Anonymous",
                        "Insider Threats — authorized users who abuse their access"
                    ],explanation: "Hacktivists use hacking as a means to a political or philosophical end. They range from individual actors to organized groups like Anonymous. Tactics include website defacement, DDoS attacks, and data leaks (doxing). Targets are chosen for ideological or symbolic value. This contrasts with nation-state actors (espionage/sabotage), organized crime (financial gain), and insider threats (access-based attacks by trusted individuals)."
                },
                {
                    question: "In the Diamond Model of Intrusion Analysis, which four elements form the vertices of the diamond?",
                    options: [
                        "Threat, Vulnerability, Impact, and Likelihood",
                        "Planning, Execution, Persistence, and Exfiltration",
                        "Adversary, Capability, Infrastructure, and Victim",
                        "Reconnaissance, Weaponization, Delivery, and Exploitation"
                    ],explanation: "The Diamond Model describes how an adversary deploys a capability via infrastructure to target a victim. The four vertices are: Adversary, Capability, Infrastructure, and Victim. Following the edges between vertices (and meta-features like timestamps, phase, result, direction) allows analysts to discover more about an intrusion by understanding the relationships between these elements. Activity threads order events in sequence."
                },
                {
                    question: "During the intelligence lifecycle, after data has been collected from multiple sources in different formats, what is the next step?",
                    options: [
                        "Dissemination — immediately distribute raw data to all stakeholders",
                        "Requirements Gathering — return to the beginning and redefine collection needs",
                        "Data Processing and Analysis — normalize formats, analyze for meaning, and convert to actionable intelligence",
                        "Feedback — gather stakeholder input on data quality"
                    ],explanation: "After Data Collection, the next step is Data Processing and Analysis. Raw data arrives in different formats and must be normalized, processed, and analyzed before it can be used. The output of analysis feeds into automated systems or written reports for dissemination. The complete lifecycle is: Requirements Gathering → Data Collection → Processing and Analysis → Intelligence Dissemination → Feedback (which improves future requirements)."
                },
                {
                    question: "Which threat hunting activity involves understanding who might be a threat, why they are a threat, and what their typical TTPs (Tactics, Techniques, and Procedures) are before actively hunting?",
                    options: [
                        "Reducing the attack surface area",
                        "Improving detection capabilities",
                        "Profiling threat actors and activities",
                        "Bundling critical assets into protection zones"
                    ],explanation: "Profiling threat actors and activities ensures that threat hunters have considered who may be a threat, why they would target the organization, and what their typical TTPs are. This knowledge grounds hypothesis formation in realistic adversary behavior rather than theoretical scenarios. Without actor profiling, hunting becomes unfocused. The CySA+ exam outline specifically mentions executable process analysis as a hunting tactic within the broader threat hunting tactics step."
                }
            ]
        });
        quiz.start();
    </script>
