    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 14: Incident Response',
            description: 'Containment, eradication, recovery, and lessons learned',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'eye-cysa-ch14-quiz',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "An incident has been identified on a Windows server. The IR team wants to contain the threat without powering off the system. Which containment action best balances evidence preservation with stopping further spread?",
                    options: [
                        "Immediately run a full antivirus scan on the affected server",
                        "Disconnect the server from the network while leaving it powered on, preserving volatile memory for forensic capture before eradication",
                        "Power off the server immediately to prevent further data exfiltration",
                        "Change the server's firewall rules to block all inbound traffic while allowing outbound"
                    ],explanation: "Network isolation (disconnecting from the network while keeping the system powered on) is the preferred containment action. Powering off destroys RAM contents — including running processes, active network connections, decryption keys, and potentially the malware itself if it is fileless. Keeping the system powered while isolated preserves volatile evidence for forensic capture while stopping the attacker's network access. After isolation, volatile evidence should be captured (memory dump, running processes, network state) before the system is fully powered down for disk imaging."
                },
                {
                    question: "What distinguishes network segmentation as a containment strategy from isolation?",
                    options: [
                        "Segmentation is a reactive emergency measure; isolation is planned in advance",
                        "Segmentation proactively limits lateral movement between network zones; isolation is a reactive measure applied during an active incident to remove a specific system from network access",
                        "Isolation uses hardware disconnection; segmentation uses firewall rules",
                        "Segmentation applies only to wireless networks; isolation applies to wired connections"
                    ],explanation: "Network segmentation is a proactive architectural strategy — dividing a network into security zones (VLANs, subnets separated by firewalls) so that a compromise in one zone cannot freely spread to others. Organizations with mature segmentation can often contain an incident naturally within the compromised zone. Isolation is a reactive containment measure applied during an active incident — disconnecting or quarantining a specific compromised system. Both concepts appear on the exam: segmentation prevents spread; isolation stops spread after it has begun."
                },
                {
                    question: "During an incident, an IR team member asks whether they should try to identify the attacker. According to best practices, when is attacker attribution a priority?",
                    options: [
                        "Always — attribution is legally required for all security incidents under federal law",
                        "Attribution is generally deprioritized for IR teams focused on business recovery; it is prioritized when law enforcement is involved or when a compelling business reason exists (e.g., understanding a targeted APT's intent)",
                        "Attacker attribution should always be completed before containment begins",
                        "Attribution is only relevant for incidents involving nation-state actors"
                    ],explanation: "Attacker attribution is difficult, expensive, and often unnecessary for business recovery. Attackers use TOR, compromised infrastructure, false flags, and multi-hop proxies — attribution can consume months and still produce uncertain results. IR teams should focus on containment and recovery. Law enforcement has a different mandate (they need attribution for prosecution) and should lead attribution efforts when involved. The exception: organizations facing targeted advanced persistent threats may need to understand adversary intent and capabilities to design effective defenses — but even then, attribution is secondary to containment."
                },
                {
                    question: "What does 'eradication' mean in the context of incident response, and what should be done before rebuilding a compromised system?",
                    options: [
                        "Eradication means notifying all affected users via email about the security incident",
                        "Eradication means completely removing all attacker artifacts and persistence mechanisms; before rebuilding, the root cause of the incident must be understood so the rebuilt system is hardened against the same attack vector",
                        "Eradication means applying the most recent security patches to the compromised system without rebuilding",
                        "Eradication means documenting what happened and submitting a regulatory notification"
                    ],explanation: "Eradication is the complete removal of all attacker artifacts: malware, backdoors, rogue accounts, modified files, scheduled tasks, registry run keys, WMI subscriptions, and any other persistence mechanisms. Simply removing detected malware is insufficient — sophisticated attackers establish multiple persistence mechanisms. Rebuilding from known-good media is often more reliable than attempting to surgically clean a compromised system. Critically: before rebuilding, the root cause must be understood. Rebuilding without closing the original vulnerability means the attacker can simply compromise the rebuilt system again using the same technique."
                },
                {
                    question: "An organization must sanitize hard drives from a decommissioned healthcare system containing ePHI. The drives will be reused by an external vendor. Which sanitization method is most appropriate?",
                    options: [
                        "Clear — overwrite with zeros once using the operating system",
                        "Purge — using degaussing, certified multi-pass overwrite, or cryptographic erase, rendering data recovery infeasible with current techniques",
                        "Quick Format — reinitializing the file allocation table is sufficient for external reuse",
                        "Destroy — shredding the drives is the only acceptable option for any healthcare data"
                    ],explanation: "Purge is the appropriate method for drives being released outside the organization's security boundary. Purging renders data recovery infeasible using current techniques — degaussing destroys the magnetic domains on HDDs, multi-pass overwriting (NIST SP 800-88 recommends 1 pass for modern drives) meets the standard, and cryptographic erase (destroying the encryption key when using self-encrypting drives) is an efficient purge method. Clear (simple overwrite) is appropriate for internal reuse but not external release. Destroy renders the media unusable — appropriate for highest-sensitivity data (classified, critical IP) but unnecessary and wasteful if Purge meets the security requirement. For SSDs, verify cryptographic erase or use destroy, as multi-pass overwrite may not reach all flash cells."
                },
                {
                    question: "After eradication, which validation step is most important before returning a compromised server to production?",
                    options: [
                        "Verify that the server's antivirus definitions are up to date",
                        "Confirm that only authorized user accounts exist, permissions are correct, logging is operational, and a fresh vulnerability scan shows no high-severity findings",
                        "Restore the server from the most recent backup, regardless of when the compromise occurred",
                        "Require the system owner to sign a document accepting responsibility for the server's security"
                    ],explanation: "Validation after eradication must systematically confirm the attacker's foothold has been completely removed. Four key validation checks: (1) Account audit — only authorized accounts exist; compare to your identity management system. (2) Permission review — authorized accounts have only appropriate permissions; attackers commonly escalate privileges on legitimate accounts. (3) Logging verification — all systems are logging correctly and forwarding to SIEM; attackers often disable logging. (4) Vulnerability scan — confirms no new open ports or services, and existing vulnerabilities have been remediated. A failed validation means returning to eradication — never skip this phase."
                },
                {
                    question: "What is the key distinction between the 'recovery' phase and a full system redesign?",
                    options: [
                        "Recovery requires purchasing new hardware; redesign uses existing equipment",
                        "Recovery is targeted restoration of affected systems to normal operation within the defined scope; it is not an opportunity for full network redesign, new equipment purchases, or unlimited scope expansion",
                        "Recovery includes redesigning the security architecture to prevent future incidents",
                        "Recovery and redesign are the same phase — they occur simultaneously after an incident"
                    ],explanation: "Recovery is scoped and focused: restore the affected systems to operational status using the approved IR plan. Common mistakes during recovery include scope creep (using the incident as justification to redesign the entire network), equipment replacement (buying new hardware for systems that just needed reimaging), or extended timelines due to gold-plating the restoration. What recovery is NOT: a complete network redesign, a full hardware refresh, or an architecture overhaul. Those activities may be appropriate follow-on work captured in lessons learned and change management, but they are not part of recovery. Recovery must be timely — extended outages have direct business impact."
                },
                {
                    question: "The change control process is referenced in post-incident activities. Why is change control closure important after an incident response?",
                    options: [
                        "Change control closure ensures attackers cannot return using the same vulnerability",
                        "Emergency changes made during IR bypass normal change management; post-incident, all emergency changes must be formally documented in the change management system and network diagrams and scan profiles updated to reflect the current environment",
                        "Change control closure triggers automatic notification to cyber insurance carriers",
                        "Change control is not relevant during incident response — documentation occurs only after full recovery"
                    ],explanation: "During active IR, an Emergency Change Management Board typically authorizes rapid changes outside the normal change control process — firewall rule modifications, account changes, service restarts, temporary network reconfigurations. After the incident, every emergency change must be formally documented and closed in the change management system. This is critical because: undocumented emergency changes become unknown configuration drift that causes future incidents and failed audits. Network diagrams, firewall rule sets, vulnerability scan profiles, and asset inventories must all be updated to accurately reflect the post-incident environment. Undocumented changes are tomorrow's mystery failures."
                },
                {
                    question: "What is the primary purpose of a 'lessons learned' meeting after an incident, and when should it be conducted?",
                    options: [
                        "Assign blame to the individuals responsible for the security failure, as close to the incident as possible",
                        "Document the details, root cause, and solution in a fact-finding (not blame-assigning) session; conducted as close to incident closure as possible while memories are fresh; outputs feed into updated procedures, detection rules, and resource requests",
                        "Satisfy regulatory reporting requirements for notifying authorities about the breach",
                        "Lessons learned should wait at least 90 days after the incident to ensure all facts are available"
                    ],explanation: "Lessons learned is a fact-finding exercise, not a blame session. Its purpose is organizational improvement — understanding what happened, why, and how to prevent recurrence. It should be conducted as soon as possible after incident closure: memories fade quickly, and the urgency of the incident motivates genuine participation. The output must be actionable: updated IR playbooks, new SIEM detection rules, patching priority changes, training gaps identified, and resource requests justified by the incident cost. Organizations that treat lessons learned as a checkbox produce reports that collect dust. Organizations that act on them actually improve their security posture."
                },
                {
                    question: "What must a post-incident final report include, and why is it important beyond the immediate incident?",
                    options: [
                        "A final report is only required for incidents that result in data breach notification",
                        "Every incident requires a final report including: timeline of events, root cause, evidence locations, containment/eradication/recovery actions with rationale, estimated organizational impact, validation results, and lessons learned — it serves as institutional memory and potential legal documentation",
                        "A final report must be filed with federal authorities within 72 hours of incident closure",
                        "The final report is only internal; it should never be shared with external parties including legal counsel"
                    ],explanation: "The final report is mandatory for every incident regardless of severity. Its value extends far beyond the immediate incident: (1) Institutional memory — new IR team members can understand past incidents and avoid repeating mistakes. (2) Legal documentation — if civil litigation or regulatory enforcement actions occur months later, the report is evidence of reasonable response. (3) Management communication — executives read the report to understand business impact and approve recommended improvements. (4) Audit evidence — auditors and regulators may request incident documentation. Required elements: complete timeline with timestamps, root cause analysis, full evidence inventory, all actions taken with rationale, financial and operational impact estimate, validation results, and specific lessons learned with recommended changes."
                }
            ]
        });
        quiz.start();
    </script>
