<script>
ReviewEngine.init({
  containerId: 'review-container',
  title: 'CySA+ Comprehensive Review',
  storageKey: 'hexworth_cysa_review',
  houseId: 'eye',

  categories: [

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 1 — Analyst & Intel (Ch 1-2)
    // Covers: threat intelligence lifecycle, CTI types, STIX/TAXII,
    //         SOC tiers, intelligence-driven defense, threat modeling
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Analyst & Intel',
      questions: [
        {
          value: 200,
          question: 'Which tier of the SOC hierarchy handles advanced threat hunting, malware reverse engineering, and custom tool development that Tier 1 and 2 analysts escalate incidents to?',
          options: ['Tier 0 — automated SOAR responses', 'Tier 1 — L1 analysts using SIEM dashboards', 'Tier 3 — senior analysts and threat hunters who handle the most complex incidents', 'Tier 4 — executive leadership who review weekly reports'],
          correct: 2,
          explanation: 'Tier 3 SOC analysts are the most skilled level: they handle incidents that Tier 1 and 2 escalate, perform proactive threat hunting to find adversaries who evaded detection, conduct malware reverse engineering, develop custom detection rules, and build new tooling. Tier 1 monitors dashboards and triages alerts. Tier 2 investigates confirmed incidents. Tier 3 hunts, engineers, and leads complex IR.'
        },
        {
          value: 400,
          question: 'A threat intelligence analyst wants to share structured threat data (indicators of compromise, TTPs) with partner organizations in an automated, machine-readable format. Which two standards are designed to work together for this purpose?',
          options: ['YARA and Snort — signature formats for malware and network detection', 'STIX (Structured Threat Information eXpression) for data format and TAXII (Trusted Automated eXchange of Indicator Information) for the transport protocol', 'OpenIOC and Maltego — indicator formats and link analysis tools', 'CVE and CVSS — vulnerability identification and scoring standards'],
          correct: 1,
          explanation: 'STIX defines a standardized XML/JSON format for expressing threat intelligence — including indicators (IP addresses, file hashes, domains), TTPs, threat actors, campaigns, and relationships between them. TAXII provides the protocol and API for sharing STIX data between organizations and threat intelligence platforms. Together they enable automated, bidirectional sharing of machine-readable threat data. ISAC member organizations use STIX/TAXII for sector-specific threat sharing.'
        },
        {
          value: 600,
          question: 'Which category of threat intelligence focuses on specific tactics, techniques, and procedures (TTPs) used by threat actors in their operations, as classified in the MITRE ATT&CK framework?',
          options: ['Strategic intelligence — high-level assessments for executive decision makers', 'Operational intelligence — specific details about planned or ongoing attacks', 'Tactical intelligence — TTPs, malware samples, and technical details about how threat actors operate', 'Technical intelligence — specific IOCs like IP addresses and file hashes'],
          correct: 2,
          explanation: 'Threat intelligence is categorized by abstraction level: Strategic (high-level trends, geopolitical context — for CISOs/executives), Operational (active campaign details, threat actor objectives — for security managers), Tactical (TTPs, malware behavior, attack patterns from MITRE ATT&CK — for security engineers and analysts), Technical (specific IOCs like IP addresses, hashes, domains — for L1/L2 SOC). The CySA+ focuses most on tactical and technical intelligence because that is what analysts actually use.'
        },
        {
          value: 800,
          question: 'A threat hunt hypothesis states: "The adversary is using living-off-the-land binaries (LOLBins) to execute malicious code without dropping executables to disk." Which data source would MOST effectively support this hunt?',
          options: ['Network flow data (NetFlow/IPFIX) showing external connection volumes', 'Endpoint process execution logs capturing parent/child process relationships and command-line arguments for trusted Windows binaries', 'Firewall deny logs showing blocked connections to known malicious IPs', 'Antivirus scan logs from the previous 30 days'],
          correct: 1,
          explanation: 'LOLBin attacks use legitimate Windows binaries (wscript.exe, mshta.exe, regsvr32.exe, certutil.exe, PowerShell) in unexpected ways — no malware files are dropped. Detection requires endpoint telemetry capturing process execution with full command-line arguments. A hunt for LOLBins would look for: unexpected parent processes (word.exe spawning cmd.exe), unusual command-line arguments in trusted binaries (certutil.exe -urlcache -split -f), and network connections from normally non-networked binaries. Network flow data and AV logs are ineffective against fileless techniques.'
        },
        {
          value: 1000,
          question: 'The Diamond Model of intrusion analysis maps four elements of every cyberattack. An analyst discovers a nation-state group targeting defense contractors using a zero-day in widely deployed VPN software. Correctly map all four Diamond Model elements to this scenario.',
          options: ['Adversary: defense contractors; Capability: VPN software; Infrastructure: zero-day; Victim: nation-state', 'Adversary: nation-state group; Capability: zero-day exploit; Infrastructure: VPN software deployment; Victim: defense contractors', 'Adversary: VPN vendor; Capability: nation-state group; Infrastructure: defense contractors; Victim: zero-day', 'The Diamond Model only applies to financially motivated threat actors, not nation-states'],
          correct: 1,
          explanation: 'The Diamond Model has four nodes: Adversary (who is conducting the attack — nation-state group), Capability (what they use to attack — zero-day exploit targeting the VPN vulnerability), Infrastructure (how they deliver or stage the attack — the compromised VPN software instances, C2 servers, staging infrastructure), Victim (who is targeted — defense contractors). The model also includes six meta-features that further characterize the attack. Understanding this structure allows analysts to pivot from any known node to discover the others — for example, mapping all victims sharing the same infrastructure reveals campaign scope.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 2 — Recon & Vulnerability Management (Ch 3-5)
    // Covers: OSINT, active recon, vulnerability scanning, CVSS,
    //         remediation prioritization, threat modeling
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Recon & Vuln Mgmt',
      questions: [
        {
          value: 200,
          question: 'A vulnerability scanner reports a finding with a CVSS Base Score of 9.8 (Critical). What two factors most influence whether this vulnerability should be patched immediately versus scheduled for the next maintenance window?',
          options: ['The scanner vendor and the age of the vulnerability disclosure', 'Network exploitability (is the vulnerable service internet-exposed?) and asset criticality (what is the business value of the affected system?)', 'The number of CVEs assigned to the same software version', 'Whether the CTO has approved an emergency patching procedure this quarter'],
          correct: 1,
          explanation: 'CVSS score alone is insufficient for patching prioritization. Two critical contextual factors: (1) Exploitability context — a CVSS 9.8 in an internet-facing service is critical; the same score on an air-gapped internal development server is lower priority. (2) Asset criticality — a CVSS 7.5 on a payment processing server outranks a CVSS 9.8 on a test lab machine. Modern vulnerability management frameworks (like SSVC — Stakeholder-Specific Vulnerability Categorization) explicitly combine CVE severity with exploitation status (is there a working exploit in the wild?), asset exposure, and asset value.'
        },
        {
          value: 400,
          question: 'An Nmap scan returns: "Host: 10.0.1.50 Status: Up — 443/tcp open ssl/http nginx." What additional Nmap scan technique would identify the web framework version running behind nginx to assess known vulnerabilities?',
          options: ['nmap -sP 10.0.1.50 (ping scan)', 'nmap -sV --script=http-server-header,http-title,http-generator 10.0.1.50 (version detection with HTTP enumeration scripts)', 'nmap -sS 10.0.1.50 (SYN stealth scan)', 'nmap -O 10.0.1.50 (OS fingerprinting only)'],
          correct: 1,
          explanation: 'Version detection (-sV) tells Nmap to probe open ports to identify the service and version. Combining it with HTTP scripts from the Nmap Scripting Engine (NSE) allows fingerprinting of the web application stack — http-server-header (captures the Server header), http-title (page title may reveal application type), http-generator (HTML meta tag often reveals CMS like WordPress/Drupal). Additionally, nmap --script=http-enum performs directory enumeration. This information feeds directly into vulnerability lookup against NVD/CVE databases for the identified versions.'
        },
        {
          value: 600,
          question: 'A penetration tester performs a credentialed vulnerability scan (with valid domain credentials) and an uncredentialed scan of the same Windows host. The credentialed scan finds 47 vulnerabilities; the uncredentialed scan finds 12. What explains this difference?',
          options: ['The uncredentialed scan used a different scanner tool', 'Credentialed scans authenticate to the host and examine installed software, registry, and patch levels directly — finding vulnerabilities regardless of network exposure. Uncredentialed scans can only identify vulnerabilities detectable through network probing of exposed services', 'Credentialed scans check different CVEs than uncredentialed scans', 'The extra 35 vulnerabilities are false positives introduced by the authentication process'],
          correct: 1,
          explanation: 'Credentialed scanning authenticates to the target (typically with domain admin or local admin credentials) and directly inspects the host: installed software versions, Windows registry, patch history via WMI, and configuration settings. This finds all installed software CVEs regardless of whether they are network-exposed. Uncredentialed scanning probes the network-facing attack surface only — it sees open ports and service banners. An unpatched Java version used only locally would appear in credentialed but not uncredentialed results. For accurate vulnerability posture, credentialed scans are essential. Uncredentialed scans approximate what an external attacker sees.'
        },
        {
          value: 800,
          question: 'A security analyst is reviewing OSINT for a client. They find that the client company\'s IT director\'s LinkedIn profile lists every software product the company uses. What specific threat does this OSINT finding represent?',
          options: ['This is not a security concern — LinkedIn is a professional network', 'This represents technology stack enumeration — an attacker can correlate listed products with known CVEs, reducing reconnaissance time from days to hours and enabling targeted exploitation without any active scanning', 'This is a compliance violation under GDPR because employee data is being shared publicly', 'LinkedIn profiles are encrypted, so this data cannot be accessed by threat actors'],
          correct: 1,
          explanation: 'Technology stack enumeration through LinkedIn is a documented reconnaissance technique. Attackers search LinkedIn profiles of IT staff to identify: software versions ("Cisco ASA 9.x admin"), vendors ("we use Palo Alto Networks"), and internal tools. This narrows CVE research to known vulnerable versions of software confirmed to be in use. Combined with job postings (which often list specific technologies), attackers can identify exploitable vulnerabilities before a single packet is sent to the target. OSINT findings should be reported as attack surface findings with recommendations (LinkedIn security awareness training, vague technology descriptions in profiles).'
        },
        {
          value: 1000,
          question: 'A healthcare organization discovers a critical vulnerability in their FDA-regulated medical device (infusion pump software) that allows remote unauthenticated command execution. The vendor has no patch available. What risk management approach is required, and what compensating controls are appropriate while awaiting a patch?',
          options: ['Immediately power off all infusion pumps to prevent exploitation', 'Accept the risk without controls — medical device software cannot be changed without FDA re-certification', 'Implement compensating controls including: network segmentation isolating medical devices to a dedicated VLAN with restricted access, disabling unnecessary network services if possible, enhanced monitoring for anomalous device behavior, coordinating with the vendor and FDA, and creating a formal risk exception document approved by clinical leadership and the CISO', 'Perform manual penetration testing on the medical devices to confirm exploitability'],
          correct: 2,
          explanation: 'Medical device vulnerabilities require a specialized approach balancing patient safety, regulatory requirements, and security. The correct approach: (1) Network segmentation — isolate medical devices on a dedicated VLAN, limiting blast radius if exploited. (2) Disable unnecessary services — if the attack vector is an unneeded network service, disable it (without breaking clinical function). (3) Enhanced monitoring — log all network connections to/from medical devices, alert on anomalies. (4) Vendor coordination — maintain communication with the vendor on patch timelines and interim guidance. (5) FDA notification — for certain device classes, FDA must be notified of cybersecurity vulnerabilities. (6) Formal risk exception — document the unpatched risk, compensating controls, and executive/clinical sign-off. Powering off devices endangers patients. Uncontrolled acceptance without compensating controls is negligent.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 3 — Cloud & Infrastructure Security (Ch 6-7)
    // Covers: cloud shared responsibility, CASB, container security,
    //         zero trust, network security controls, microsegmentation
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Cloud & Infrastructure',
      questions: [
        {
          value: 200,
          question: 'In the cloud shared responsibility model for IaaS (Infrastructure as a Service), which security responsibilities remain with the customer?',
          options: ['The cloud provider handles all security — customers have no responsibilities', 'Customer is responsible for: OS patching, application code, identity and access management, data encryption, network security group configuration, and application-level logging. The provider secures the underlying physical infrastructure and hypervisor layer', 'Customer only manages data; all other security is the provider\'s responsibility', 'Customer responsibility ends at the network perimeter; the cloud handles all internal security'],
          correct: 1,
          explanation: 'The shared responsibility model divides security duties: IaaS — Provider secures physical data centers, hardware, and hypervisor. Customer secures the OS, applications, network controls (security groups/NACLs), identity (IAM), and data. PaaS — Customer secures applications and data (the provider handles OS/runtime). SaaS — Customer secures only data and access (the provider handles everything else). A common mistake is assuming the cloud provider secures the OS on EC2/Azure VM instances — it does not. Unpatched VMs in IaaS are the customer\'s responsibility and a leading cause of cloud breaches.'
        },
        {
          value: 400,
          question: 'What is a Cloud Access Security Broker (CASB) and which security capability does it provide that is impossible to achieve with traditional perimeter firewalls?',
          options: ['A CASB is a firewall appliance deployed in cloud provider data centers', 'A CASB is a security policy enforcement point between cloud users and cloud services — it provides visibility and control over sanctioned and unsanctioned ("shadow IT") cloud application usage, including DLP enforcement over data uploaded to cloud services that traverse encrypted HTTPS connections', 'A CASB replaces the organization\'s need for an SSL/TLS inspection proxy', 'A CASB performs vulnerability scanning of IaaS virtual machines in real time'],
          correct: 1,
          explanation: 'Traditional perimeter firewalls cannot inspect HTTPS traffic to cloud services (like Box, Dropbox, Salesforce) because it is encrypted. CASBs provide: (1) Visibility — discover all cloud services in use, including unauthorized shadow IT. (2) Control — enforce policies (block upload of sensitive files to personal Dropbox but allow to corporate Box). (3) DLP — inspect content in cloud uploads for sensitive data patterns. (4) Compliance — enforce regulatory requirements for data stored in cloud apps. CASBs operate in three modes: API-based (inspects data at rest in sanctioned apps), inline proxy (intercepts traffic in real-time), and log-based discovery (analyzes firewall logs for cloud service usage).'
        },
        {
          value: 600,
          question: 'A Kubernetes pod is discovered running with the --privileged flag. Why is this a critical security finding, and what is the appropriate remediation?',
          options: ['The --privileged flag enables performance optimizations and has no security implications', 'A privileged container bypasses all container isolation — it has access to the host kernel, devices, and filesystem as root. An attacker who escapes the container gains complete host control. Remediation: remove the --privileged flag, use security contexts with specific required capabilities only (principle of least privilege)', 'The --privileged flag only affects network access within the pod', 'Privileged pods are a Kubernetes best practice for production workloads'],
          correct: 1,
          explanation: 'Container security relies on isolation from the host. The --privileged flag completely disables this isolation — the container process has the same capabilities as root on the host OS, including access to host devices, ability to load kernel modules, and full host filesystem access. Container escape attacks targeting privileged containers give attackers complete control over the underlying host (and potentially the entire Kubernetes node). Proper remediation: (1) Remove --privileged. (2) Use securityContext to grant only specific capabilities needed (e.g., NET_BIND_SERVICE for a web server). (3) Enable Pod Security Standards (PSS) to prevent privileged pods in namespaces. (4) Use read-only root filesystems where possible.'
        },
        {
          value: 800,
          question: 'Zero Trust Architecture (ZTA) replaces the traditional network perimeter security model. What is the core principle of Zero Trust, and which three pillars implement it?',
          options: ['Zero Trust means blocking all external traffic by default, allowing only VPN-authenticated sessions', '"Never trust, always verify" — implemented through: identity verification (strong authentication for every access request regardless of network location), device health verification (endpoint compliance checks), and least-privilege access (minimal permissions granted per session based on context)', 'Zero Trust requires replacing all firewalls with next-generation firewalls from a single vendor', 'Zero Trust only applies to cloud environments — on-premises networks still use traditional perimeter security'],
          correct: 1,
          explanation: 'Zero Trust abandons the assumption that anything inside the network perimeter is trustworthy. Core principle: "Never trust, always verify." Three pillars: (1) Identity — every user must authenticate, even from "inside" the network; use MFA and continuous authentication. (2) Device — assess device health and compliance before granting access; managed devices with current patches and AV get full access, unmanaged devices get limited access. (3) Network/Access — microsegmentation limits lateral movement; users access only specific resources needed for their role, not the entire network. NIST SP 800-207 documents the ZTA reference architecture. Google BeyondCorp is the pioneering real-world implementation.'
        },
        {
          value: 1000,
          question: 'A security review of an AWS environment finds: S3 bucket with public read access containing customer data, EC2 instances with overly permissive IAM roles (full S3:* permissions), no CloudTrail logging in 3 regions, and security groups allowing SSH from 0.0.0.0/0. Which remediation sequence represents the correct risk prioritization?',
          options: ['Fix CloudTrail logging first — visibility before remediation', 'Fix S3 public access first — it is an active data exposure; then restrict IAM roles to least privilege; then enable CloudTrail in all regions; then restrict SSH security groups to specific management IP ranges', 'Fix SSH exposure first as internet-facing attack surface is highest risk', 'Address all findings simultaneously in a scheduled maintenance window'],
          correct: 1,
          explanation: 'Risk-based prioritization: (1) S3 public access — active data breach in progress; customer data is publicly readable right now. This is the highest-impact, zero-click exploitable finding. Immediate: enable S3 Block Public Access at account level. (2) IAM roles (S3:*) — over-permissive roles mean a compromised EC2 instance can access all S3 buckets. Immediate: apply least-privilege IAM policies. (3) CloudTrail logging — without logs in 3 regions, you are blind to activity there. Enable immediately to support the investigation. (4) SSH 0.0.0.0/0 — high risk for brute-force but requires active attack; restrict to management IP ranges or replace with SSM Session Manager (no inbound ports required). Order: active data exposure > privilege escalation path > visibility gap > attack surface reduction.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 4 — IAM & Secure Development (Ch 8-9)
    // Covers: identity attacks, Kerberos abuse, MFA, OAuth/SAML,
    //         secure coding, SAST/DAST, OWASP, SCA, CI/CD security
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'IAM & Dev Security',
      questions: [
        {
          value: 200,
          question: 'An attacker obtains the NTLM hash of an admin account and uses it to authenticate to network services without knowing the plaintext password. What attack technique is this?',
          options: ['Kerberoasting — cracking service account passwords offline', 'Pass-the-Hash (PtH) — using a captured NTLM hash to authenticate without cracking the underlying password', 'Golden Ticket — forging Kerberos tickets using the KRBTGT hash', 'Credential Stuffing — using breached credentials from other websites'],
          correct: 1,
          explanation: 'Pass-the-Hash abuses the NTLM authentication protocol\'s design: authentication proves you have the hash, not the plaintext password. Attackers extract NTLM hashes from LSASS memory (using Mimikatz) or from SAM/NTDS.dit databases and use them directly in authentication. Defenses: (1) Enable Credential Guard to isolate LSASS in a VBS container. (2) Use Windows Defender Remote Credential Guard for RDP. (3) Disable NTLM where possible (enforce Kerberos). (4) Implement PAM/tiered admin model to prevent hash reuse across tiers. Note: Kerberoasting targets service account passwords (offline cracking of TGS tickets); PtH uses hashes directly.'
        },
        {
          value: 400,
          question: 'A developer commits an AWS access key to a public GitHub repository. The key is rotated 20 minutes after discovery. Why is key rotation alone potentially insufficient to fully remediate this incident?',
          options: ['GitHub automatically removes security credentials from public repositories', 'Automated scanning tools (GitGuardian, TruffleHog) can find and cache credentials within seconds of commit. The 20-minute window may have allowed attackers to clone the repo, extract the key, and use it to: enumerate resources, create additional IAM users with long-lived credentials, or exfiltrate data. Full remediation requires investigating CloudTrail logs for all API calls made with the exposed key during the exposure window', 'AWS automatically detects and blocks exposed access keys', 'Key rotation invalidates all historical API calls made with the old key'],
          correct: 1,
          explanation: 'Secret rotation is necessary but not sufficient. The investigation must include: (1) CloudTrail analysis — every API call made with the exposed key during the exposure window. Look for: CreateUser, AttachUserPolicy, PutUserPolicy, CreateAccessKey (attackers creating persistence), ListBuckets, GetObject (data enumeration/exfiltration). (2) New IAM entity creation — did the attacker create backdoor accounts? (3) Unusual cross-region activity — were resources created in rarely-used regions? (4) S3 data access logs — were buckets read during the exposure? GitGuardian can detect secrets within seconds of commit. The 20-minute window is an eternity for automated exploitation tools.'
        },
        {
          value: 600,
          question: 'A web application authentication flaw allows an attacker to craft a malicious SAML assertion and authenticate as any user without valid credentials. What vulnerability class does this represent?',
          options: ['SQL Injection — malicious data in authentication fields', 'SAML Signature Wrapping (XSW) attack — manipulating SAML XML to bypass signature validation by adding a forged assertion alongside a legitimately signed element', 'Cross-Site Request Forgery (CSRF) — unauthorized actions on behalf of an authenticated user', 'Open Redirect — redirecting authentication callbacks to attacker-controlled servers'],
          correct: 1,
          explanation: 'SAML Signature Wrapping (also called XML Signature Wrapping) attacks exploit flaws in how SAML libraries validate signatures. The attack inserts a forged assertion into the SAML response XML structure such that: the signature validator checks a legitimate (but benign) element, while the application reads the forged element as the authorized identity claim. Effectively, the signature is technically valid but covers different content than what the application acts on. Defense: use a well-maintained SAML library, validate the assertion content against the signature binding explicitly, and audit SAML library versions for known XSW vulnerabilities.'
        },
        {
          value: 800,
          question: 'A security review of a CI/CD pipeline finds that the build server has read/write access to all production deployment credentials and that any developer can modify the build scripts. What specific attack scenario does this configuration enable?',
          options: ['Developers could accidentally break the build pipeline', 'Build pipeline compromise — a malicious or compromised developer could modify build scripts to inject malicious code into production artifacts, steal all production credentials stored in the CI/CD system, or deploy backdoored software to production at scale', 'The CI/CD pipeline prevents developers from deploying directly to production', 'This is a normal CI/CD configuration that poses no security risk'],
          correct: 1,
          explanation: 'CI/CD pipeline security is a critical attack surface. The described configuration creates a supply chain attack vector: (1) Any developer (or an attacker who compromises a developer account) can modify build scripts. (2) Malicious build steps could: exfiltrate all secrets stored in the CI/CD platform, inject backdoors into compiled binaries or Docker images, modify test results to hide malicious code from quality gates. (3) The pipeline has access to production deployment credentials, so a compromised build server = compromised production. Remediations: code review requirements for build script changes, secrets management (Vault, AWS Secrets Manager — not CI/CD environment variables), separation of duties, signed artifacts, and SBOM (Software Bill of Materials) for supply chain visibility.'
        },
        {
          value: 1000,
          question: 'DAST (Dynamic Application Security Testing) is performed against a running web application and finds an authenticated stored XSS vulnerability in a user profile field. Walk through the complete attack chain this vulnerability enables against other users of the application.',
          options: ['Stored XSS only affects the user who stored the malicious content — it cannot impact others', 'Attack chain: (1) Attacker stores malicious JavaScript in the vulnerable profile field (e.g., \\x3cscript\\x3e...malicious code...\\x3c/script\\x3e). (2) When any other authenticated user views the attacker\'s profile, their browser executes the JavaScript in the context of the application. (3) The JavaScript can: steal the victim\'s session cookie (document.cookie), perform actions as the victim (CSRF-like), redirect to phishing pages, keylog form inputs, or exfiltrate DOM content including CSRF tokens. This is a wormable attack if the profile field appears on pages other users visit routinely', 'DAST findings are theoretical only — exploit chains cannot be demonstrated without source code', 'Stored XSS is a medium severity finding that only affects UI rendering'],
          correct: 1,
          explanation: 'Stored (Persistent) XSS is a high-severity finding because the payload executes for every user who views the infected content — no interaction required from the attacker after initial injection. The attack chain: (1) Store malicious JS payload. (2) Victim loads the page, browser executes attacker\'s script with victim\'s session context. (3) JavaScript can do anything the user\'s browser can do: steal HttpOnly=false cookies (document.cookie), make authenticated API calls as the victim, access localStorage/sessionStorage for tokens, capture keystrokes in forms. Remediation: output encoding (HTML entity encode all user-supplied content before rendering), Content Security Policy (CSP) to restrict script execution, HttpOnly and Secure cookie flags, and WAF rules for common XSS payloads.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 5 — SOC Operations & Incident Response (Ch 10-12)
    // Covers: SIEM, log analysis, detection engineering, malware analysis,
    //         IR lifecycle, playbooks, communication, tabletop exercises
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'SOC & Incident Response',
      questions: [
        {
          value: 200,
          question: 'A SOC analyst sees a SIEM alert: "Windows Scheduled Task created via schtasks.exe by non-administrator user on a server." Why is this alert high priority?',
          options: ['Scheduled tasks are always created by administrators; non-admin creation is impossible', 'Scheduled tasks are a T1053 MITRE ATT&CK persistence technique — a non-administrator creating a scheduled task on a server is highly anomalous and likely indicates either privilege escalation success or a compromised admin account. It warrants immediate investigation', 'This alert is a false positive — Windows Update creates tasks for all users', 'Scheduled task creation is a normal user activity that should be removed from the SIEM ruleset'],
          correct: 1,
          explanation: 'Scheduled task creation for persistence is documented in MITRE ATT&CK T1053. Legitimate scheduled tasks on servers are created during application installation (typically by an admin/system account during setup) — not by interactive non-administrator users during business hours. This alert pattern indicates: (1) A user has escalated their privileges to admin level (which should be investigated immediately), or (2) A compromised user account is being used by an attacker to establish persistence. Investigation: check Event ID 4698 (task created), examine the task\'s action (what program it runs), review the user account\'s recent authentication events, and escalate to Tier 2/3.'
        },
        {
