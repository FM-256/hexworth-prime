<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Feed the Troll - Eye House Game - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes ambientPulse {
            0%, 100% { text-shadow: 0 0 8px rgba(99, 102, 241, 0.4); }
            50% { text-shadow: 0 0 18px rgba(139, 92, 246, 0.7); }
        }

        @keyframes subtleBorderGlow {
            0%, 100% { border-color: rgba(192, 132, 252, 0.5); box-shadow: 0 0 30px rgba(192, 132, 252, 0.2); }
            50% { border-color: rgba(192, 132, 252, 0.8); box-shadow: 0 0 40px rgba(192, 132, 252, 0.35); }
        }

        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23 0%, #1a0a2e 50%, #0d0d20 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CRT Scanline overlay for terminal feel */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(99, 102, 241, 0.015) 50%,
                rgba(0, 0, 0, 0.015) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            animation: scanlineMove 8s linear infinite;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, rgba(16, 16, 32, 0.97) 0%, rgba(26, 15, 46, 0.97) 50%, rgba(16, 16, 32, 0.97) 100%);
            border: 2px solid rgba(192, 132, 252, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.3), 0 0 60px rgba(99, 102, 241, 0.1);
            overflow: hidden;
            animation: subtleBorderGlow 5s ease-in-out infinite;
        }

        .game-header {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 40%, #a855f7 70%, #6366f1 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c084fc;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .game-header h1 {
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff, #e9d5ff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.6));
        }

        .game-header .subtitle {
            color: #e9d5ff;
            margin-top: 8px;
            font-size: 0.9em;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.4);
        }

        .status-bar {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.9) 0%, rgba(20, 15, 40, 0.9) 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(192, 132, 252, 0.4);
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: inset 0 -1px 15px rgba(99, 102, 241, 0.05);
        }

        .timer {
            font-size: 1.5em;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(10, 10, 30, 0.6));
            min-width: 120px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .timer.normal { color: #10b981; border: 2px solid #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        .timer.warning { color: #f59e0b; border: 2px solid #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .timer.critical {
            color: #ef4444;
            border: 2px solid #ef4444;
            animation: pulse 0.5s infinite;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-indicators {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85em;
        }

        .indicator {
            padding: 4px 10px;
            border-radius: 3px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(10, 10, 30, 0.5));
            border: 1px solid #666;
            transition: all 0.3s ease;
        }

        .indicator:hover {
            transform: translateY(-1px);
        }

        .indicator.active {
            border-color: #c084fc;
            color: #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
            animation: ambientPulse 3s ease-in-out infinite;
        }

        .output-area {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(10, 5, 20, 0.5) 100%);
            font-size: 0.95em;
            line-height: 1.6;
        }

        .output-area::-webkit-scrollbar {
            width: 10px;
        }

        .output-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .output-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7c3aed, #6366f1);
            border-radius: 5px;
        }

        .output-line {
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .system-msg { color: #a855f7; text-shadow: 0 0 8px rgba(168, 85, 247, 0.2); }
        .error-msg { color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.2); }
        .success-msg { color: #10b981; text-shadow: 0 0 8px rgba(16, 185, 129, 0.2); }
        .warning-msg { color: #f59e0b; }
        .alert-msg {
            color: #ef4444;
            font-weight: bold;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            padding: 5px;
            border-left: 3px solid #ef4444;
        }
        .intel-msg {
            color: #06b6d4;
            font-style: italic;
            text-shadow: 0 0 6px rgba(6, 182, 212, 0.15);
        }
        .command-msg { color: #e0e0e0; }
        .hint-msg {
            color: #fbbf24;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            padding: 5px;
            border-left: 3px solid #fbbf24;
        }

        .input-area {
            padding: 20px;
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(15, 10, 35, 0.95) 100%);
            border-top: 2px solid rgba(192, 132, 252, 0.6);
            box-shadow: inset 0 2px 15px rgba(99, 102, 241, 0.08);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt {
            color: #c084fc;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.4);
        }

        #commandInput {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(10, 5, 25, 0.7));
            border: 2px solid #7c3aed;
            color: #e0e0e0;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        #commandInput:focus {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
        }

        #commandInput:disabled {
            opacity: 0.5;
            cursor: not-permitted;
        }

        .achievement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(192, 132, 252, 0.5), 0 0 40px rgba(99, 102, 241, 0.2);
            animation: slideIn 0.5s ease-out;
            z-index: 1000;
            max-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .achievement-popup h3 {
            margin-bottom: 5px;
            font-size: 1.1em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .achievement-popup p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .ending-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease-in;
            backdrop-filter: blur(4px);
        }

        .ending-content {
            background: linear-gradient(145deg, #1a0a2e 0%, #0f0f23 40%, #1a0a2e 100%);
            border: 3px solid rgba(192, 132, 252, 0.6);
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 50px rgba(192, 132, 252, 0.4), 0 0 100px rgba(99, 102, 241, 0.15);
        }

        .ending-content h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c084fc, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.5));
        }

        .ending-content p {
            color: #e0e0e0;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .ending-stats {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(15, 10, 30, 0.6));
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid rgba(124, 58, 237, 0.5);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
        }

        .ending-stats h3 {
            color: #a855f7;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .stat-line {
            margin: 8px 0;
            color: #e0e0e0;
            transition: all 0.3s ease;
        }

        .stat-line:hover {
            color: #c084fc;
            transform: translateX(3px);
        }

        .restart-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .restart-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.6);
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.5em;
            }

            .output-area {
                height: 350px;
                font-size: 0.85em;
            }

            .status-bar {
                font-size: 0.85em;
            }

            .ending-content {
                padding: 30px 20px;
            }

            .ending-content h2 {
                font-size: 1.8em;
            }
        }
        .back-link { position:fixed; top:12px; left:20px; color:#6366f1; text-decoration:none; font-size:14px; cursor:pointer; z-index:10000; transition:all 0.3s ease; font-family:monospace; }
        .back-link:hover { color:#a78bfa; text-shadow: 0 0 12px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; Back to Eye House</a>
    <div class="game-container">
        <div class="game-header">
            <h1>Don't Feed the Troll</h1>
            <div class="subtitle">Eye House - Threat Intelligence Emergency Response</div>
        </div>

        <div class="status-bar">
            <div class="timer normal" id="timer">180s</div>
            <div class="status-indicators">
                <div class="indicator" id="ind-evidence">Evidence: No</div>
                <div class="indicator" id="ind-reported">Reported: No</div>
                <div class="indicator" id="ind-protected">Protected: No</div>
                <div class="indicator" id="ind-breadcrumbs">Breadcrumbs: 0/5</div>
            </div>
        </div>

        <div class="output-area" id="output"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <span class="prompt">OSINT&gt;</span>
                <input type="text" id="commandInput" autocomplete="off" autofocus>
            </div>
        </div>
    </div>

    <script>
        // IIFE Game Engine Pattern
        (function() {
            'use strict';

            // Game state
            const state = {
                timeRemaining: 180,
                gameActive: true,
                sourceIdentified: false,
                postsReported: false,
                ceoProtected: false,
                leakerFound: false,
                evidenceCollected: false,
                lawEnforcementContacted: false,
                mediaContained: false,
                socialScraped: false,
                darkWebMonitored: false,
                breadcrumbsFollowed: 0,
                vpnTraced: false,
                insiderTrapped: false,
                forumSearched: false,
                profileChecked: false,
                metadataChecked: false,
                employeeSearched: false,
                honeypotSet: false,
                fedTheTroll: false,
                drankCoffee: false,
                triedToHackBack: false,
                twitterRemoved: false,
                buzzfeedKilled: false,
                startTime: null,
                ending: null,
                timerInterval: null,
                eventsFired: {
                    e15: false,
                    e35: false,
                    e55: false,
                    e80: false,
                    e100: false,
                    e110: false,
                    e140: false,
                    e165: false
                }
            };

            // DOM elements
            const output = document.getElementById('output');
            const input = document.getElementById('commandInput');
            const timer = document.getElementById('timer');
            const indEvidence = document.getElementById('ind-evidence');
            const indReported = document.getElementById('ind-reported');
            const indProtected = document.getElementById('ind-protected');
            const indBreadcrumbs = document.getElementById('ind-breadcrumbs');

            // Achievement tracking
            let achievements = loadAchievements();

            function loadAchievements() {
                try {
                    const saved = localStorage.getItem('hexworth_donttroll_achievements');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveAchievements() {
                try {
                    localStorage.setItem('hexworth_donttroll_achievements', JSON.stringify(achievements));
                } catch (e) {
                    console.error('Failed to save achievements:', e);
                }
            }

            function unlockAchievement(id, name, description) {
                if (!achievements[id]) {
                    achievements[id] = { name, description, timestamp: Date.now() };
                    saveAchievements();
                    showAchievementPopup(name, description);
                    return true;
                }
                return false;
            }

            function showAchievementPopup(name, description) {
                const popup = document.createElement('div');
                popup.className = 'achievement-popup';
                popup.innerHTML = `
                    <h3><img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Achievement Unlocked!</h3>
                    <p><strong>${name}</strong></p>
                    <p>${description}</p>
                `;
                document.body.appendChild(popup);
                setTimeout(() => popup.remove(), 4000);
            }

            // Output functions
            function print(message, className = 'command-msg') {
                const line = document.createElement('div');
                line.className = `output-line ${className}`;
                line.textContent = message;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            function printSystem(message) { print(message, 'system-msg'); }
            function printError(message) { print(message, 'error-msg'); }
            function printSuccess(message) { print(message, 'success-msg'); }
            function printWarning(message) { print(message, 'warning-msg'); }
            function printAlert(message) { print(message, 'alert-msg'); }
            function printIntel(message) { print(message, 'intel-msg'); }
            function printHint(message) { print(message, 'hint-msg'); }

            // Update UI
            function updateUI() {
                // Timer
                const minutes = Math.floor(state.timeRemaining / 60);
                const seconds = state.timeRemaining % 60;
                timer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (state.timeRemaining > 60) {
                    timer.className = 'timer normal';
                } else if (state.timeRemaining > 30) {
                    timer.className = 'timer warning';
                } else {
                    timer.className = 'timer critical';
                }

                // Indicators
                indEvidence.textContent = `Evidence: ${state.evidenceCollected ? 'Yes' : 'No'}`;
                indEvidence.className = state.evidenceCollected ? 'indicator active' : 'indicator';

                indReported.textContent = `Reported: ${state.postsReported ? 'Yes' : 'No'}`;
                indReported.className = state.postsReported ? 'indicator active' : 'indicator';

                indProtected.textContent = `Protected: ${state.ceoProtected ? 'Yes' : 'No'}`;
                indProtected.className = state.ceoProtected ? 'indicator active' : 'indicator';

                indBreadcrumbs.textContent = `Breadcrumbs: ${state.breadcrumbsFollowed}/5`;
                indBreadcrumbs.className = state.breadcrumbsFollowed === 5 ? 'indicator active' : 'indicator';
            }

            // Timer and events
            function startTimer() {
                state.startTime = Date.now();
                state.timerInterval = setInterval(() => {
                    if (!state.gameActive) {
                        clearInterval(state.timerInterval);
                        return;
                    }

                    state.timeRemaining--;
                    updateUI();

                    // Timed events
                    checkTimedEvents();

                    if (state.timeRemaining <= 0) {
                        endGame('timeout');
                    }
                }, 1000);
            }

            function checkTimedEvents() {
                const elapsed = 180 - state.timeRemaining;

                if (elapsed >= 15 && !state.eventsFired.e15) {
                    state.eventsFired.e15 = true;
                    printAlert("[DARKWEB] New post: 'CFO's financial records coming next. #ChaosGoblins'");
                }

                if (elapsed >= 35 && !state.eventsFired.e35) {
                    state.eventsFired.e35 = true;
                    if (!state.postsReported) {
                        printAlert("[ALERT] Twitter account @ChaosGoblin42 just posted CEO's home photo. 47 retweets already.");
                    } else {
                        state.twitterRemoved = true;
                        printSuccess("[ALERT] Twitter removed the @ChaosGoblin42 post due to your early report. Nice work.");
                    }
                }

                if (elapsed >= 55 && !state.eventsFired.e55) {
                    state.eventsFired.e55 = true;
                    if (!state.mediaContained) {
                        printAlert("[CRITICAL] BuzzFeed reporter DM'd your PR team: 'Can you comment on the data leak?'");
                    } else {
                        state.buzzfeedKilled = true;
                        printSuccess("[MEDIA] BuzzFeed agreed to hold the story thanks to your early PR coordination.");
                    }
                }

                if (elapsed >= 80 && !state.eventsFired.e80) {
                    state.eventsFired.e80 = true;
                    printAlert("[CRITICAL] Reddit thread about the dox has 500 upvotes and climbing.");
                }

                if (elapsed >= 100 && !state.eventsFired.e100) {
                    state.eventsFired.e100 = true;
                    if (state.honeypotSet && !state.insiderTrapped) {
                        state.insiderTrapped = true;
                        state.leakerFound = true;
                        state.breadcrumbsFollowed = Math.max(state.breadcrumbsFollowed, 5);
                        printAlert("[HONEYPOT TRIGGERED]");
                        printSuccess(">>> CANARY DOCUMENT ACCESSED <<<");
                        printIntel("Internal user 'jmitchell@corp.local' (IT Director James Mitchell) accessed the honeypot file.");
                        printIntel("IP: 10.0.42.117 (Corporate VPN, authenticated session)");
                        printIntel("Device fingerprint matches Mitchell's issued laptop.");
                        printSuccess("THE INSIDER HAS BEEN IDENTIFIED. The call was coming from inside the house.");
                        unlockAchievement('insider_caught', 'Inside Job', 'Caught the insider with a honeypot');
                        unlockAchievement('conspiracy_board', 'Beautiful Mind', 'Followed all 5 breadcrumbs to the insider');
                    }
                }

                if (elapsed >= 110 && !state.eventsFired.e110) {
                    state.eventsFired.e110 = true;
                    printAlert("[CRITICAL] Full employee database sample posted as 'proof' of upcoming dump.");
                }

                if (elapsed >= 140 && !state.eventsFired.e140) {
                    state.eventsFired.e140 = true;
                    printAlert("[CRITICAL] News headline: 'Major Corp CEO Doxed by Hacktivist Group' - it's going viral.");
                }

                if (elapsed >= 165 && !state.eventsFired.e165) {
                    state.eventsFired.e165 = true;
                    printAlert("[CRITICAL] Data dump countdown on darkweb forum: '60 SECONDS UNTIL FULL RELEASE'");
                }
            }

            // Command processing
            function processCommand(cmd) {
                const command = cmd.trim().toLowerCase();

                if (!command) return;

                print(`OSINT> ${cmd}`, 'command-msg');

                // Help and meta commands
                if (command === 'help' || command === '?') {
                    printSystem("=== OSINT THREAT INTELLIGENCE COMMANDS ===");
                    printSystem("INVESTIGATION: search forum/darkweb, whois [user], profile [user], screenshot/archive");
                    printSystem("ANALYSIS: check-metadata/exif, reverse-image, email-headers, trace-vpn");
                    printSystem("RESPONSE: report-posts/takedown, notify-security, contact-fbi, contact-legal, contact-pr");
                    printSystem("MONITORING: check-twitter/reddit, monitor-dump, social media");
                    printSystem("ADVANCED: set-honeypot, search-employee, cross-reference, dns-lookup, wayback");
                    printSystem("TOOLS: shodan, maltego");
                    printSystem("OTHER: help, hint, look, inventory, coffee");
                    return;
                }

                if (command === 'hint' || command === 'hints') {
                    if (!state.forumSearched) {
                        printHint("HINT: Start by searching the forum to see what's been posted.");
                    } else if (!state.evidenceCollected) {
                        printHint("HINT: Document everything. Screenshot and archive posts before they're deleted.");
                    } else if (!state.profileChecked) {
                        printHint("HINT: Profile the threat actor. Who is ChaosGoblin_42?");
                    } else if (!state.metadataChecked) {
                        printHint("HINT: Metadata is your friend. Check EXIF data, analyze headers, look for digital breadcrumbs.");
                    } else if (!state.ceoProtected) {
                        printHint("HINT: Physical security matters too. Notify the security team to protect executives.");
                    } else if (!state.honeypotSet) {
                        printHint("HINT: If there's an insider, how could you catch them in the act? Think canary traps...");
                    } else {
                        printHint("HINT: Follow proper incident response procedures: Detect, Collect, Analyze, Attribute, Contain, Report.");
                    }
                    return;
                }

                if (command === 'look' || command === 'examine') {
                    printSystem("Your threat intel workstation: 4 monitors displaying dark web forums, social media feeds, VirusTotal, and a Maltego graph.");
                    printSystem("A corkboard on the wall has printouts connected with red string like a conspiracy theorist.");

                    return;
                }

                if (command === 'inventory' || command === 'i') {
                    printSystem("You have: OSINT framework access, caffeine dependency, a burner phone, and existential dread.");
                    return;
                }

                if (command === 'coffee') {
                    printSystem("The threat intel team runs on espresso and paranoia. You're all stocked up on both.");
                    if (!state.drankCoffee) {
                        state.drankCoffee = true;
                        unlockAchievement('coffee_analyst', 'Caffeinated Analyst', 'Drink coffee during investigation');
                    }
                    return;
                }

                if (command === 'panic') {
                    printWarning("You briefly consider a career in farming. The tomatoes wouldn't dox you.");
                    state.timeRemaining = Math.max(0, state.timeRemaining - 10);
                    updateUI();
                    return;
                }

                // Investigation commands
                if (command === 'search forum' || command === 'search darkweb') {
                    if (!state.forumSearched) {
                        state.forumSearched = true;
                        unlockAchievement('first_search', 'Digital Footprint', 'Search the forum first');
                    }
                    printSystem("Scanning dark web forum 'ChaosNet'...");
                    printAlert(">>> 3 ACTIVE DOXING POSTS FOUND <<<");
                    printIntel("Post 1: CEO John Davidson - Home address: 2847 Maple Grove Ln, phone: 555-0147, kid's school: Riverside Academy");
                    printIntel("Post 2: CFO Sarah Chen - Personal email, SSN (partially redacted), tax documents");
                    printIntel("Post 3: CTO Marcus Williams - Home security camera footage, daily routine timeline");
                    printIntel("Posted by: ChaosGoblin_42");
                    printIntel("Timestamp: 2 hours 14 minutes ago");
                    printIntel("Thread title: 'Corporate Scum Exposed - Data Dump in 180 minutes'");
                    state.sourceIdentified = true;
                    state.darkWebMonitored = true;
                    return;
                }

                if (command.includes('whois') || command.includes('profile')) {
                    if (!state.forumSearched) {
                        printError("You need to identify a user first. Try searching the forum.");
                        return;
                    }
                    if (!state.profileChecked) {
                        state.profileChecked = true;
                        state.breadcrumbsFollowed++;
                        updateUI();
                    }
                    printSystem("Profiling user: ChaosGoblin_42");
                    printIntel("Account created: 2 hours 31 minutes ago");
                    printIntel("Posts: 3 (all in CEO dox thread)");
                    printIntel("Connection: TOR exit node (anonymous)");
                    printIntel("Previous posts: None");
                    printWarning("ANOMALY DETECTED:");
                    printIntel("Post #2 metadata shows timezone: GMT-5 (YOUR company's timezone, not typical for Tor)");
                    printIntel("Post timing: During business hours (10:42 AM local)");
                    printIntel("Language patterns: Professional writing style, corporate jargon usage");
                    printHint("This doesn't look like a typical hacktivist...");
                    return;
                }

                if (command === 'screenshot' || command === 'archive') {
                    if (!state.forumSearched) {
                        printError("Search the forum first to find posts to archive.");
                        return;
                    }
                    if (!state.evidenceCollected) {
                        printSuccess("Capturing screenshots and archiving posts...");
                        printSuccess("Evidence package created: dox_incident_20260209_evidence.zip");
                        printSuccess("Includes: Full page screenshots, HTML archives, JSON metadata dumps");
                        printSuccess("Hash: SHA256:8f3a9b2c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0");
                        state.evidenceCollected = true;
                        updateUI();

                        if (!state.profileChecked && !state.metadataChecked) {
                            unlockAchievement('evidence_pro', 'Evidence Collector', 'Screenshot/archive before anything else');
                        }
                    } else {
                        printSuccess("Evidence already collected and secured.");
                    }
                    return;
                }

                if (command === 'reverse-image' || command === 'image search') {
                    if (!state.profileChecked) {
                        printError("You need to profile the user first to find their profile picture.");
                        return;
                    }
                    state.breadcrumbsFollowed = Math.max(state.breadcrumbsFollowed, 2);
                    updateUI();
                    printSystem("Running reverse image search on ChaosGoblin_42's profile picture...");
                    printIntel("Image match: Stock photo from 'Anonymous Hacker' collection (shutterstock.com)");
                    printIntel("Used on 247 other sites");
                    printWarning("EXIF DATA FOUND:");
                    printIntel("Camera: None (digitally created)");
                    printIntel("Software: Adobe Photoshop CC 2024");
                    printIntel("License holder: Corporate license #CC-2024-8847");
                    printIntel("Registered to: [YOUR COMPANY NAME] - IT Department");
                    printAlert("The editing software is licensed to YOUR company. This is an inside job.");
                    return;
                }

                if (command === 'check-metadata' || command === 'exif') {
                    if (!state.forumSearched) {
                        printError("Search for leaked documents first.");
                        return;
                    }
                    if (!state.metadataChecked) {
                        state.metadataChecked = true;
                        state.breadcrumbsFollowed = Math.max(state.breadcrumbsFollowed, 3);
                        updateUI();
                        unlockAchievement('metadata_hunter', 'Metadata Hunter', 'Check EXIF/metadata on leaked docs');
                    }
                    printSystem("Analyzing metadata on leaked documents...");
                    printIntel("Document: CEO_personal_info.pdf");
                    printIntel("Created: 2026-02-08 14:23:17");
                    printIntel("Author: jmitchell");
                    printIntel("Application: Microsoft Word 2024");
                    printWarning("INTERNAL WATERMARK DETECTED:");
                    printIntel("Document contains invisible tracking dots");
                    printIntel("Watermark ID: EMP-2847");
                    printIntel("Traces to: IT Department workstation");
                    printIntel("Last accessed by: jmitchell@corp.local");
                    printAlert("The documents came from an internal employee account: jmitchell");
                    return;
                }

                if (command === 'search-employee' || command === 'cross-reference') {
                    if (!state.metadataChecked && state.breadcrumbsFollowed < 3) {
                        printError("You need more evidence first. Check metadata and analyze the threat actor's profile.");
                        return;
                    }
                    if (!state.employeeSearched) {
                        state.employeeSearched = true;
                        state.breadcrumbsFollowed = Math.max(state.breadcrumbsFollowed, 4);
                        state.leakerFound = true;
                        updateUI();
                    }
                    printSystem("Cross-referencing evidence with employee database...");
                    printIntel("Employee match: James Mitchell");
                    printIntel("Position: IT Director");
                    printIntel("Tenure: 8 years");
                    printIntel("Access level: ADMIN (full access to executive records)");
                    printIntel("Recent activity: Unusual VPN logins at odd hours, accessed CEO personnel files 47 times in past week");
                    printWarning("HR FLAGS:");
                    printIntel("Passed over for CTO promotion 3 months ago (position given to Marcus Williams)");
                    printIntel("Recent negative performance review");
                    printIntel("Submitted resignation letter yesterday, rescinded this morning");
                    printAlert("James Mitchell fits the profile. He has motive, means, and opportunity.");
                    return;
                }

                if (command === 'report-posts' || command === 'takedown' || command === 'flag') {
                    if (!state.forumSearched) {
                        printError("Search the forum first to identify posts to report.");
                        return;
                    }
                    if (!state.postsReported) {
                        printSystem("Submitting takedown requests...");
                        printSuccess("Contacted forum administrators (likely won't respond - it's a dark web forum)");
                        printSuccess("Filed FBI IC3 complaint with post URLs");
                        printSuccess("Submitted DMCA takedown for leaked copyrighted documents");
                        printSuccess("Flagged Twitter account @ChaosGoblin42 for doxxing/harassment");
                        printSuccess("Reported to Reddit admins for personal information policy violation");
                        state.postsReported = true;
                        updateUI();
                    } else {
                        printSuccess("Takedown requests already submitted and being processed.");
                    }
                    return;
                }

                if (command === 'notify-security' || command === 'call security') {
                    if (!state.ceoProtected) {
                        printSystem("Contacting corporate physical security team...");
                        printSuccess("Security dispatched to CEO residence: 24/7 detail assigned");
                        printSuccess("CFO and CTO notified, personal security protocols activated");
                        printSuccess("Executive families relocated to secure locations");
                        printSuccess("Home security systems upgraded, local law enforcement alerted");
                        state.ceoProtected = true;
                        updateUI();
                    } else {
                        printSuccess("Executives are already under physical security protection.");
                    }
                    return;
                }

                if (command === 'contact-fbi' || command === 'call fbi' || command === 'law enforcement') {
                    if (!state.lawEnforcementContacted) {
                        printSystem("Contacting FBI Cyber Division...");
                        printSuccess("Connected to FBI Internet Crime Complaint Center (IC3)");
                        printSuccess("Case assigned to Special Agent Rodriguez - Cyber Crimes Unit");
                        printSuccess("Evidence package transmitted via secure channel");
                        printSuccess("FBI will coordinate with forum hosting providers and ISPs");
                        if (state.leakerFound) {
                            printSuccess("FBI authorized to interview James Mitchell. Warrant being prepared.");
                        }
                        state.lawEnforcementContacted = true;
                    } else {
                        printSuccess("FBI is already working the case.");
                    }
                    return;
                }

                if (command === 'contact-legal' || command === 'call legal') {
                    printSystem("Conferencing with Legal Department...");
                    printSuccess("Legal team briefed on situation");
                    printSuccess("Preparing cease-and-desist letters");
                    printSuccess("Evaluating civil litigation options against threat actors");
                    if (state.leakerFound) {
                        printSuccess("Legal authorizing termination procedures for James Mitchell");
                        printSuccess("Preparing criminal referral for corporate espionage charges");
                    }
                    return;
                }

                if (command === 'contact-pr' || command === 'media') {
                    if (!state.mediaContained) {
                        printSystem("Emergency meeting with PR and Communications team...");
                        printSuccess("Crisis communications plan activated");
                        printSuccess("Media talking points prepared: 'We are aware of false information...'");
                        printSuccess("Proactive outreach to tech journalists to provide context");
                        printSuccess("Social media monitoring team deployed");
                        printSuccess("Prepared to issue public statement if needed");
                        state.mediaContained = true;
                        updateUI();
                    } else {
                        printSuccess("PR team is already managing media relations.");
                    }
                    return;
                }

                if (command === 'check-twitter' || command === 'check-reddit' || command === 'social media') {
                    if (!state.socialScraped) {
                        state.socialScraped = true;
                    }
                    printSystem("Scraping social media for threat actor activity...");
                    printIntel("Twitter: @ChaosGoblin42 (47 followers, created today)");
                    printIntel("Reddit: u/ChaosGoblin_42 (1 post karma, account age: 3 hours)");
                    printIntel("Pattern: Coordinated posting across platforms at same timestamps");
                    printIntel("Amplification: Several bot accounts retweeting/upvoting content");
                    printIntel("Hashtags: #ChaosGoblins #CorporateGreed #DataDump");
                    if (state.twitterRemoved) {
                        printSuccess("Twitter has removed the @ChaosGoblin42 account for TOS violations.");
                    }
                    return;
                }

                if (command === 'monitor-dump' || command === 'watch darkweb') {
                    printSystem("Monitoring dark web file sharing sites for data dump...");
                    printIntel("Scanning: AnonFiles, Mega.nz, Pastebin, various .onion sites");
                    if (state.timeRemaining > 30) {
                        printIntel("No data dump detected yet. Threat actor claims it will drop in " + state.timeRemaining + " seconds.");
                    } else {
                        printWarning("Dump countdown is active. Time is critical.");
                    }
                    return;
                }

                if (command === 'set-honeypot' || command === 'honeypot' || command === 'canary') {
                    if (state.honeypotSet) {
                        printSuccess("Honeypot already deployed. Waiting for the insider to take the bait...");
                        return;
                    }
                    printSystem("Deploying canary document trap...");
                    printSuccess("Created fake document: 'Executive_Compensation_2026_CONFIDENTIAL.xlsx'");
                    printSuccess("Embedded unique tracking beacon in document");
                    printSuccess("Planted in shared drive with elevated privileges logged");
                    printSuccess("Document will phone home when opened, revealing IP and device info");
                    printSuccess("Honeypot armed. If there's an insider, they won't be able to resist this bait.");
                    state.honeypotSet = true;
                    return;
                }

                if (command === 'trace-vpn' || command === 'trace ip') {
                    if (!state.profileChecked) {
                        printError("Profile the threat actor first to get connection information.");
                        return;
                    }
                    if (!state.vpnTraced) {
                        state.vpnTraced = true;
                    }
                    printSystem("Attempting to trace connection through Tor network...");
                    printIntel("TOR exit node: 185.220.101.47 (Netherlands)");
                    printIntel("Previous hops: Obfuscated (standard Tor behavior)");
                    printWarning("Direct IP trace is impossible through Tor.");
                    printIntel("HOWEVER: Timing analysis shows connection originated from same city as corporate HQ");
                    printIntel("Network latency patterns consistent with corporate VPN tunnel → Tor");
                    printHint("Someone is using the corporate VPN to connect to Tor. Check internal logs.");
                    return;
                }

                if (command === 'email-headers' || command === 'analyze-headers') {
                    printSystem("Analyzing email headers from threat notification...");
                    printIntel("From: chaosnetadmin@protonmail.com");
                    printIntel("Received: from smtp.protonmail.ch");
                    printIntel("X-Originating-IP: [Hidden by ProtonMail]");
                    printIntel("Message-ID: <20260209.104217@protonmail.com>");
                    printWarning("Email headers are scrubbed by ProtonMail. Limited intel available.");
                    return;
                }

                if (command === 'dns-lookup') {
                    printSystem("Performing DNS lookups on related infrastructure...");
                    printIntel("chaosnet.onion: Tor hidden service (no traditional DNS)");
                    printIntel("TOR network nodes: Various global locations");
                    printIntel("No direct DNS intelligence available for .onion domains.");
                    return;
                }

                if (command === 'wayback' || command === 'archive.org') {
                    printSystem("Checking Wayback Machine for historical posts by ChaosGoblin_42...");
                    printIntel("Account is only 2 hours old. No historical data available.");
                    printIntel("This is a brand new sockpuppet account created specifically for this attack.");
                    return;
                }

                if (command === 'shodan') {
                    printSystem("Searching Shodan for infrastructure intelligence...");
                    printIntel("TOR exit nodes: 1,247 results (standard Tor network)");
                    printIntel("No unique infrastructure identified for ChaosGoblin_42");
                    printIntel("This is consistent with a one-off attack using standard anonymity tools.");
                    return;
                }

                if (command === 'maltego') {
                    printError("You'd love to use Maltego right now but the license expired last Tuesday.");
                    printSystem("IT Budget Request Status: PENDING");
                    printSystem("Finance Department Response: 'We'll review it next quarter.'");
                    printSystem("This is why we can't have nice things.");
                    return;
                }

                // "Wrong" commands
                if (command === 'hack back' || command === 'attack') {
                    printError("That's ILLEGAL. You're the good guys. Probably.");
                    printError("Use OSINT, not exploits. The FBI is watching. So is HR.");
                    if (!state.triedToHackBack) {
                        state.triedToHackBack = true;
                        unlockAchievement('wrong_approach', 'Wrong Approach', 'Try to hack back');
                    }
                    return;
                }

                if (command === 'feed troll' || command === 'respond to post' || command === 'reply') {
                    printError("NEVER engage threat actors directly! You just gave them attention.");
                    printError("They post faster now. This is why it's called 'Don't Feed the Troll'.");
                    state.timeRemaining = Math.max(0, state.timeRemaining - 10);
                    updateUI();
                    if (!state.fedTheTroll) {
                        state.fedTheTroll = true;
                        unlockAchievement('fed_the_troll', 'Fed the Troll', 'Respond to the threat actor directly');
                    }
                    return;
                }

                if (command === 'dox them back') {
                    printError("Tempting, but career-ending. And illegal. And unethical.");
                    printError("Use proper channels. Be better than them.");
                    return;
                }

                if (command === 'google it') {
                    printSystem("Google... is actually useful here. That's literally OSINT.");
                    printSystem("But you need to be more specific. What are you googling?");
                    return;
                }

                if (command === 'tweet about it') {
                    printError("OPSEC! Do NOT broadcast an active investigation!");
                    printError("You just tipped off the threat actor. They're covering their tracks now.");
                    state.timeRemaining = Math.max(0, state.timeRemaining - 15);
                    updateUI();
                    return;
                }

                if (command === 'tell ceo') {
                    printWarning("The CEO is panicking enough. Route through proper channels.");
                    printSystem("Your CISO exists for a reason. Don't skip the chain of command.");
                    return;
                }

                if (command === 'burn everything') {
                    printError("That's evidence destruction. Hard no.");
                    printError("Spoliation of evidence is a crime. Talk to Legal first.");
                    return;
                }

                if (command === 'cry') {
                    printSystem("Valid emotional response. But save it for after the incident.");
                    printSystem("You can process trauma later. Right now, executives are in danger.");
                    return;
                }

                // Unknown command
                printError(`Unknown command: ${cmd}`);
                printSystem("Type 'help' for available commands.");
            }

            function endGame(reason) {
                state.gameActive = false;
                clearInterval(state.timerInterval);
                input.disabled = true;

                let endingTitle = '';
                let endingMessage = '';
                let endingClass = '';

                const elapsed = 180 - state.timeRemaining;

                // Check win conditions
                const basicWin = (state.postsReported || state.sourceIdentified) &&
                                 state.ceoProtected &&
                                 state.evidenceCollected;

                const fullContainment = basicWin &&
                                       state.lawEnforcementContacted &&
                                       state.mediaContained &&
                                       state.postsReported;

                const byTheBook = state.forumSearched &&
                                 state.evidenceCollected &&
                                 state.profileChecked &&
                                 state.postsReported &&
                                 state.ceoProtected &&
                                 state.lawEnforcementContacted;

                if (reason === 'timeout') {
                    endingTitle = 'DATA DUMP RELEASED';
                    endingClass = 'error-msg';
                    endingMessage = `The timer hit zero. The full data dump went live.\n\nThousands of employee records, executive personal information, and confidential documents are now spreading across the internet like wildfire.\n\nThe media is having a field day. Your stock price is cratering. The CEO is on CNN doing damage control.\n\nYou needed to be faster. In threat intelligence, seconds matter.`;

                    if (!state.forumSearched && !state.postsReported && !state.ceoProtected && !state.evidenceCollected && !state.socialScraped) {
                        unlockAchievement('frozen', 'Frozen', 'Do nothing until time runs out');
                    }
                    state.ending = 'failure';
                } else if (basicWin) {
                    if (state.leakerFound && state.insiderTrapped) {
                        endingTitle = 'INSIDER THREAT NEUTRALIZED';
                        endingClass = 'success-msg';
                        endingMessage = `You didn't just stop the data dump - you caught the mole.\n\nJames Mitchell, the IT Director, has been arrested by the FBI. The honeypot trap was genius. He couldn't resist accessing that "confidential compensation" file.\n\nTurns out he was planning to leak the data, get hired by a competitor, and claim he was a "whistleblower." Classic corporate espionage.\n\nThe posts were taken down, executives are safe, and the insider is facing federal charges.\n\nThe CISO just approved your budget request for Maltego. You earned it.`;
                    } else if (fullContainment) {
                        endingTitle = 'FULL CONTAINMENT ACHIEVED';
                        endingClass = 'success-msg';
                        endingMessage = `You executed a textbook threat response.\n\nPosts reported and taken down. Evidence collected and preserved. Executives under protection. FBI investigating. Media contained.\n\nThe data dump was prevented. BuzzFeed killed the story. Twitter removed the accounts.\n\nYou followed the intelligence cycle perfectly: Detect, Collect, Analyze, Attribute, Contain, Report.\n\nThe threat actor (probably an insider) is still out there, but you bought the company time to hunt them down properly.`;

                        unlockAchievement('full_containment', 'Full Containment', 'Report + protect + evidence + law enforcement + media');
                    } else {
                        endingTitle = 'CRISIS CONTAINED';
                        endingClass = 'success-msg';
                        endingMessage = `You did it. The worst was prevented.\n\nExecutives are safe. Evidence is preserved. The posts are being taken down.\n\nSome data leaked to the public, but you limited the damage. It could have been catastrophic.\n\nThe FBI is investigating. The insider (if there is one) is spooked and lying low.\n\nYou lived up to the Eye House motto: "We see what others miss."`;
                    }

                    if (elapsed < 25) {
                        unlockAchievement('speed_run', 'Speed Run', 'Contain in under 25 seconds');
                    }

                    if (byTheBook) {
                        unlockAchievement('by_the_book', 'Intelligence Cycle', 'Follow full OSINT methodology');
                    }

                    state.ending = 'success';
                } else {
                    endingTitle = 'PARTIAL FAILURE';
                    endingClass = 'warning-msg';
                    endingMessage = `You stopped the worst of it, but there were gaps in your response.\n\n`;

                    if (!state.evidenceCollected) {
                        endingMessage += `You failed to properly document evidence. Without screenshots and archives, the legal case is weak.\n\n`;
                    }
                    if (!state.ceoProtected) {
                        endingMessage += `You didn't notify physical security. Executives are vulnerable to real-world threats.\n\n`;
                    }
                    if (!state.postsReported && !state.sourceIdentified) {
                        endingMessage += `You never identified or reported the threat source. The posts are still live.\n\n`;
                    }

                    endingMessage += `Threat intelligence is about covering all bases. You can't afford to miss steps.`;
                    state.ending = 'partial';
                }

                // Platform integration
                if (typeof AchievementSystem !== 'undefined') {
                    if (state.ending === 'success') {
                        AchievementSystem.unlockGameAchievement('troll', 'win');
                    }
                    if (byTheBook) {
                        AchievementSystem.unlockGameAchievement('troll', 'by_the_book');
                    }
                    if (elapsed < 25 && basicWin) {
                        AchievementSystem.unlockGameAchievement('troll', 'speed');
                    }
                    if (Object.keys(achievements).length >= 12) {
                        AchievementSystem.unlockGameAchievement('troll', 'all');
                    }
                }

                // Award XP (one-time)
                if (state.ending === 'success') {
                    if (!localStorage.getItem('game_troll_xp_awarded')) {
                        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                        localStorage.setItem('game_troll_xp_awarded', 'true');
                        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                            const uid = localStorage.getItem('hexworth_uid');
                            if (uid) FirestoreManager.addXP(uid, 50, 'Don\'t Feed the Troll Complete');
                        }
                    }
                    if (typeof AchievementManager !== 'undefined') {
                        AchievementManager.unlock('game_troll');
                    }
                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    GameTracker.record('troll', {
                        result: state.ending || 'unknown',
                        timeElapsed: 180 - state.timeRemaining,
                        commandsUsed: 0,
                        achievementsEarned: Object.keys(achievements).length,
                        achievementsTotal: Object.keys(achievements).length
                    });
                }

                showEndingScreen(endingTitle, endingMessage, endingClass);
            }

            function showEndingScreen(title, message, className) {
                const endingScreen = document.createElement('div');
                endingScreen.className = 'ending-screen';

                const elapsed = 180 - state.timeRemaining;
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;

                const achievementCount = Object.keys(achievements).length;

                endingScreen.innerHTML = `
                    <div class="ending-content">
                        <h2 class="${className}">${title}</h2>
                        <p>${message.split('\n').join('</p><p>')}</p>

                        <div class="ending-stats">
                            <h3>INCIDENT REPORT</h3>
                            <div class="stat-line">Time Elapsed: ${minutes}:${seconds.toString().padStart(2, '0')}</div>
                            <div class="stat-line">Evidence Collected: ${state.evidenceCollected ? 'YES' : 'NO'}</div>
                            <div class="stat-line">Posts Reported: ${state.postsReported ? 'YES' : 'NO'}</div>
                            <div class="stat-line">Executives Protected: ${state.ceoProtected ? 'YES' : 'NO'}</div>
                            <div class="stat-line">FBI Contacted: ${state.lawEnforcementContacted ? 'YES' : 'NO'}</div>
                            <div class="stat-line">Media Contained: ${state.mediaContained ? 'YES' : 'NO'}</div>
                            <div class="stat-line">Insider Found: ${state.leakerFound ? 'YES' : 'NO'}</div>
                            <div class="stat-line">Breadcrumbs Followed: ${state.breadcrumbsFollowed}/5</div>
                            <div class="stat-line">Achievements Unlocked: ${achievementCount}/12</div>
                        </div>

                        <button class="restart-btn" onclick="location.reload()">Run Another Investigation</button>
                    </div>
                `;

                document.body.appendChild(endingScreen);
            }

            // Input handling
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && state.gameActive) {
                    const command = input.value;
                    processCommand(command);
                    input.value = '';

                    // Check win condition after each command
                    const basicWin = (state.postsReported || state.sourceIdentified) &&
                                     state.ceoProtected &&
                                     state.evidenceCollected;

                    if (basicWin && state.gameActive) {
                        endGame('win');
                    }
                }
            });

            // Initialize game
            function initGame() {
                printAlert("=== THREAT INTELLIGENCE EMERGENCY ===");
                printAlert("PRIORITY: CRITICAL");
                print("");
                printSystem("A notorious hacktivist group called 'Chaos Goblins' just posted your company's CEO's home address, phone number, and kid's school on a dark web forum.");
                print("");
                printWarning("They're doxing the entire C-suite and threatening a data dump in 3 minutes.");
                print("");
                printSystem("Your mission: Use OSINT techniques to track down the leak source, get posts taken down, coordinate with law enforcement, and protect the executives - all before the dump goes live and hits mainstream media.");
                print("");
                printHint("The twist: The leaker might be INSIDE the company. Every OSINT trail you follow could reveal more...");
                print("");
                printSystem("Type 'help' for available commands. Type 'hint' if you need guidance.");
                printSystem("The clock is ticking. Good luck, analyst.");
                print("");

                updateUI();
                startTimer();
            }

            // Start game
            initGame();
        })();
    </script>
