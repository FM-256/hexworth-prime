            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * 0.1;

            rainNoise.buffer = buffer;
            rainNoise.loop = true;

            filter.type = 'lowpass';
            filter.frequency.value = 800;

            const rainGain = audioContext.createGain();
            rainGain.gain.value = 0.15;

            rainNoise.connect(filter);
            filter.connect(rainGain);
            rainGain.connect(masterGain);
            rainNoise.start();

        function showMainMenu() {
            gameState.scene = 'main_menu';
            print('');
            print('forensics$ _', 'accent');
            print('');

            const commands = [
                { text: 'EXAMINE EVIDENCE', action: showEvidenceMenu },
                { text: 'INTERVIEW SUSPECTS', action: showInterviewMenu },
                { text: 'REVIEW CASE FILE', action: reviewCaseFile },
                { text: 'PRESENT FINDINGS', action: presentFindings }
            ];

            commands.forEach(cmd => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = cmd.text;
                btn.onclick = cmd.action;
                terminal.appendChild(btn);
            });

            terminal.appendChild(document.createElement('br'));
            terminal.scrollTop = terminal.scrollHeight;
        }

        function showEvidenceMenu() {
            print('');
            printDivider();
            print('EVIDENCE SOURCES AVAILABLE:', 'evidence');
            print('');

            const evidenceSources = [
                { key: 'disk', label: '[1] Disk Image - CEO Workstation' },
                { key: 'ram', label: '[2] RAM Dump - Memory Snapshot' },
                { key: 'emails', label: '[3] Email Server Logs' },
                { key: 'pcap', label: '[4] Network Packet Capture' },
                { key: 'phone', label: '[5] Phone Records (Subpoena)' },
                { key: 'camera', label: '[6] Security Camera Metadata' }
            ];

            evidenceSources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = source.label;
                if (gameState.evidence[source.key]) {
                    btn.textContent += ' ✓';
                    btn.disabled = true;
                }
                btn.onclick = () => examineEvidence(source.key);
                terminal.appendChild(btn);
            });

            const backBtn = document.createElement('button');
            backBtn.className = 'choice-button accent';
            backBtn.textContent = '← BACK';
            backBtn.onclick = () => {
                print('');
                showMainMenu();
            };
            terminal.appendChild(backBtn);

            terminal.appendChild(document.createElement('br'));
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function examineEvidence(key) {
            playCameraShutter();
            const evidence = evidenceData[key];

            print('');
            printDivider();
            print(evidence.title, 'evidence');
            printASCII(evidence.ascii);
            printDivider();
            print('');

            for (let clue of evidence.clues) {
                print(clue);
                await sleep(100);
            }

            print('');
            printDivider();

            if (!gameState.evidence[key]) {
                playEureka();
                await sleep(300);
                print('KEY EVIDENCE FOUND:', 'accent');
                print('► ' + evidence.keyEvidence, 'evidence');
                gameState.caseFile.push(evidence.keyEvidence);
                gameState.evidence[key] = true;
                print('');
                print(`[Evidence added to case file: ${gameState.caseFile.length}/5]`, 'accent');
            }

            printDivider();

            const continueBtn = document.createElement('button');
            continueBtn.className = 'choice-button accent';
            continueBtn.textContent = 'CONTINUE';
            continueBtn.onclick = () => {
                print('');
                showMainMenu();
            };
            terminal.appendChild(continueBtn);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function showInterviewMenu() {
            print('');
            printDivider();
            print('SUSPECTS AVAILABLE FOR QUESTIONING:', 'warning');
            print('');

            const suspectList = [
                { key: 'cfo', label: 'Jessica Sterling (CFO)' },
                { key: 'assistant', label: 'Tom Rivera (Executive Assistant)' },
                { key: 'sysadmin', label: 'Derek Walsh (System Administrator)' },
                { key: 'competitor', label: 'Marcus Chen (TechRival VP)' }
            ];

            suspectList.forEach(suspect => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = suspect.label;
                if (gameState.interviews[suspect.key]) {
                    btn.textContent += ' ✓';
                }
                btn.onclick = () => interviewSuspect(suspect.key);
                terminal.appendChild(btn);
            });

            const backBtn = document.createElement('button');
            backBtn.className = 'choice-button accent';
            backBtn.textContent = '← BACK';
            backBtn.onclick = () => {
                print('');
                showMainMenu();
            };
            terminal.appendChild(backBtn);

            terminal.appendChild(document.createElement('br'));
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function interviewSuspect(key) {
            playTypewriter();
            const suspect = suspects[key];

            print('');
            printDivider();
            print('INTERVIEWING: ' + suspect.name, 'warning');
            printDivider();
            print('');

            printASCII(`
        ┌─────────────────────────────────────┐
        │  Interrogation Room B              │
        │  Recording: ACTIVE                 │
        │  Legal Counsel: ${key === 'competitor' ? 'PRESENT' : 'WAIVED '}       │
        └─────────────────────────────────────┘
            `);

            print('');
            print('SELECT YOUR QUESTION:', 'accent');
            print('');

            suspect.questions.forEach((qa, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = `Q${index + 1}: ${qa.q}`;
                btn.onclick = async () => {
                    clearInterviewButtons();
                    print('');
                    print('YOU: ' + qa.q, 'accent');
                    await sleep(800);
                    playTypewriter();
                    print(suspect.name.toUpperCase() + ': ' + qa.a, 'warning');

                    if (qa.a.includes('lawyer') || qa.a.includes('nervous')) {
                        playDramaticChord();
                    }

                    await sleep(1500);
                    print('');

                    if (!gameState.interviews[key]) {
                        print('[Interview notes added to case file]', 'accent');
                        gameState.interviews[key] = true;
                    }

                    const continueBtn = document.createElement('button');
                    continueBtn.className = 'choice-button accent';
                    continueBtn.textContent = 'CONTINUE INTERVIEW';
                    continueBtn.onclick = () => interviewSuspect(key);
                    terminal.appendChild(continueBtn);

                    const backBtn = document.createElement('button');
                    backBtn.className = 'choice-button';
                    backBtn.textContent = '← END INTERVIEW';
                    backBtn.onclick = () => {
                        print('');
                        showMainMenu();
                    };
                    terminal.appendChild(backBtn);

                    terminal.scrollTop = terminal.scrollHeight;
                };
                terminal.appendChild(btn);
            });

            const backBtn = document.createElement('button');
            backBtn.className = 'choice-button accent';
            backBtn.textContent = '← BACK';
            backBtn.onclick = () => {
                print('');
                showInterviewMenu();
            };
            terminal.appendChild(backBtn);

            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearInterviewButtons() {
            const buttons = terminal.querySelectorAll('.choice-button');
            buttons.forEach(btn => btn.remove());
        }

        function reviewCaseFile() {
            print('');
            printDivider();
            print('CASE FILE - EVIDENCE COLLECTED:', 'evidence');
            printDivider();
            print('');

            if (gameState.caseFile.length === 0) {
                print('No evidence collected yet.', 'error');
            } else {
                gameState.caseFile.forEach((item, index) => {
                    const caseDiv = document.createElement('div');
                    caseDiv.className = 'case-file';
                    caseDiv.innerHTML = `<strong>[${index + 1}]</strong> ${item}`;
                    terminal.appendChild(caseDiv);
                });
            }

            print('');
            printDivider();
            print(`EVIDENCE STRENGTH: ${gameState.caseFile.length}/5 (Minimum required for prosecution)`, 'accent');
            printDivider();

            const backBtn = document.createElement('button');
            backBtn.className = 'choice-button accent';
            backBtn.textContent = '← BACK';
            backBtn.onclick = () => {
                print('');
                showMainMenu();
            };
            terminal.appendChild(backBtn);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function presentFindings() {
            if (gameState.caseFile.length < 3) {
                print('');
                printDivider();
                print('INSUFFICIENT EVIDENCE', 'error');
                print('You need at least 3 pieces of evidence before presenting your case.', 'error');
                printDivider();

                const backBtn = document.createElement('button');
                backBtn.className = 'choice-button accent';
                backBtn.textContent = '← BACK';
                backBtn.onclick = () => {
                    print('');
                    showMainMenu();
                };
                terminal.appendChild(backBtn);
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            print('');
            printDivider();
            print('FINAL CONFRONTATION', 'accent');
            printDivider();
            print('');

            await typeText("You walk into the conference room. The fluorescent lights hum.", 'accent');
            await typeText("Four faces look up. One of them planted the evidence.", 'accent');
            await typeText("Time to lay out the truth.", 'accent');
            print('');
            printDivider();
            print('WHO DO YOU ACCUSE?', 'warning');
            print('');

            const accuseList = [
                { key: 'cfo', label: 'Jessica Sterling (CFO)' },
                { key: 'assistant', label: 'Tom Rivera (Executive Assistant)' },
                { key: 'sysadmin', label: 'Derek Walsh (System Administrator)' },
                { key: 'competitor', label: 'Marcus Chen (TechRival VP)' }
            ];

            accuseList.forEach(suspect => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = 'ACCUSE: ' + suspect.label;
                btn.onclick = () => resolveCase(suspect.key);
                terminal.appendChild(btn);
            });

            terminal.scrollTop = terminal.scrollHeight;
        }

        async function resolveCase(accused) {
            clearInterviewButtons();
            print('');
            printDivider();

            const correctSuspect = 'cfo';
            const hasAllEvidence = gameState.caseFile.length >= 5;
            const result = accused === correctSuspect ? (hasAllEvidence ? 'perfect' : 'partial') : 'wrong';
            if (typeof GameTracker !== 'undefined') GameTracker.record('grep_noir', { score: gameState.caseFile.length, result: result });
            // High score persistence (score = evidence pieces collected; perfect = 5)
            const prevBest = parseInt(localStorage.getItem('game_grepnoir_best') || '0');
            if (gameState.caseFile.length > prevBest) localStorage.setItem('game_grepnoir_best', gameState.caseFile.length.toString());

            if (accused === correctSuspect && hasAllEvidence) {
                // PERFECT ENDING
                playEureka();
                await sleep(500);

                print('YOU WIN - PERFECT CASE', 'accent');
                printDivider();
                print('');

                printASCII(`
            ╔════════════════════════════════════════╗
            ║     CASE CLOSED - PERFECT SOLVE        ║
            ║                                        ║
            ║   Justice Served | CEO Cleared        ║
            ║   Culprit Arrested | Evidence Intact  ║
            ╚════════════════════════════════════════╝
                `);

                await typeText("You lay out each piece of evidence, one by one.", 'accent');
                await typeText("The laptop MAC address. The spoofed emails. The deleted camera footage.", 'accent');
                await typeText("The $2M wire transfer from TechRival's Marcus Chen.", 'accent');
                print('');
                await typeText("Jessica Sterling's face goes pale. She stands, but federal agents", 'accent');
                await typeText("are already moving. The handcuffs click shut with finality.", 'accent');
                print('');
                await typeText('"It was supposed to be perfect," she whispers.', 'warning');
                print('');
                await typeText("You light a cigarette. In this business, nothing ever is.", 'accent');
                print('');
                printDivider();
                print('ACHIEVEMENTS UNLOCKED:', 'evidence');
                print('► Perfect Detective - Found all evidence', 'evidence');
                print('► Digital Sherlock - Identified correct suspect', 'evidence');
                print('► Case Closed - Justice served', 'evidence');

                awardXP();

            } else if (accused === correctSuspect && !hasAllEvidence) {
                // PARTIAL VICTORY
                playDramaticChord();
                await sleep(500);

                print('PARTIAL VICTORY - CASE WEAKENED', 'warning');
                printDivider();
                print('');

                await typeText("You accuse Jessica Sterling, and you're right.", 'warning');
                await typeText("But without all the evidence, her lawyers tear your case apart.", 'warning');
                print('');
                await typeText("She walks on a technicality. The CEO is cleared, but the real", 'warning');
                await typeText("criminal escapes justice. You got the truth, but lost the conviction.", 'warning');
                print('');
                await typeText("In the rain-soaked streets outside, you light a cigarette.", 'accent');
                await typeText("Sometimes knowing isn't enough.", 'accent');
                print('');
                printDivider();
                print('Try again with more evidence for the perfect solve.', 'accent');

            } else {
                // WRONG SUSPECT
                playDramaticChord();
                await sleep(500);

                print('GAME OVER - WRONG SUSPECT', 'error');
                printDivider();
                print('');

                await typeText(`You accuse ${suspects[accused].name}, and the room goes silent.`, 'error');
                await typeText("Then the CEO's lawyer stands up, shaking his head.", 'error');
                print('');
                await typeText('"Insufficient evidence. Wrongful accusation. This investigation is over."', 'error');
                print('');
                await typeText("Jessica Sterling smirks as she leaves the room.", 'warning');
                await typeText("The real criminal walks free. The CEO still faces charges.", 'warning');
                await typeText("You failed.", 'error');
                print('');
                await typeText("Outside, the rain keeps falling. It always does.", 'accent');
            }

            print('');
            printDivider();

            const restartBtn = document.createElement('button');
            restartBtn.className = 'choice-button accent';
            restartBtn.textContent = 'RESTART INVESTIGATION';
            restartBtn.onclick = () => {
                terminal.innerHTML = '<a class="back-link" href="../index.html">← Back to Eye House</a>';
                resetGame();
                startGame();
            };
            terminal.appendChild(restartBtn);

            const exitBtn = document.createElement('button');
            exitBtn.className = 'choice-button';
            exitBtn.textContent = 'EXIT TO EYE HOUSE';
            exitBtn.onclick = () => window.location.href = '../index.html';
            terminal.appendChild(exitBtn);

            terminal.scrollTop = terminal.scrollHeight;
        }

        function resetGame() {
            gameState.scene = 'intro';
            gameState.caseFile = [];
            gameState.evidence = {
                disk: false,
                ram: false,
                emails: false,
                pcap: false,
                phone: false,
                camera: false
            };
            gameState.interviews = {
                cfo: false,
                assistant: false,
                sysadmin: false,
                competitor: false
            };
        }

        // ============================================
        // XP & ACHIEVEMENTS
        // ============================================
        function awardXP() {
            if (localStorage.getItem('game_grep_xp_awarded')) return;
            localStorage.setItem('game_grep_xp_awarded', 'true');
            let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
            xp += 50;
            localStorage.setItem('hexworth_xp', xp.toString());
            if (window.FirestoreManager) {
                const uid = localStorage.getItem('hexworth_uid');
                if (uid) FirestoreManager.addXP(uid, 50, 'grep -rn');
            }
            if (window.AchievementManager) AchievementManager.unlock('game_grep');

            print('');
            print('+50 XP AWARDED', 'accent');
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        startGame();
    </script>
