<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../cyberops-theme.css">
    <title>Week 2 Evaluation - CyberOps Security Monitoring</title>
    
</head>
<body>
    <div class="container">
        <nav class="co-breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span class="sep">/</span>
            <a href="../../../index.html">CyberOps</a>
            <span class="sep">/</span>
            <a href="index.html">Week 2</a>
            <span class="sep">/</span>
            <span>Evaluation</span>
        </nav>

        <div class="co-intro">
            <span class="co-badge"><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> ASSESSMENT</span>
            <div class="icon"><img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
            <h1>Week 2 Evaluation</h1>
            <p class="subtitle">Security Monitoring Knowledge Assessment</p>
        </div>

        <div class="co-panel">
            <h2>Assessment Information</h2>
            <div class="co-exam-info">
                <div class="co-exam-stat">
                    <div class="value">15</div>
                    <div class="label">Questions</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">80%</div>
                    <div class="label">Pass Threshold</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">∞</div>
                    <div class="label">Time Limit</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">1</div>
                    <div class="label">Attempt</div>
                </div>
            </div>
        </div>

        <div class="co-progress-bar">
            <div class="co-progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <p id="progressText" style="text-align: center; color: #64748b; margin-bottom: 20px;">Question 1 of 15</p>

        <div id="quizContainer"></div>

        <div class="co-results" id="resultsCard">
            <h2>Assessment Complete!</h2>
            <div class="co-score-pct" id="scoreDisplay">0%</div>
            <p class="co-result-msg" id="resultsMessage"></p>

            <div class="co-breakdown">
                <div class="co-breakdown-item">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="co-breakdown-item">
                    <div class="number" id="incorrectCount">0</div>
                    <div class="label">Incorrect</div>
                </div>
                <div class="co-breakdown-item">
                    <div class="number" id="timeSpent">0:00</div>
                    <div class="label">Time Spent</div>
                </div>
            </div>

            <button class="co-btn co-btn-primary" onclick="window.location.href='index.html'">Return to Week 2</button>
        </div>

        <div class="co-footer">
            <a href="index.html">← Back to Week 2</a>
            <span id="submitSection">
                <button class="co-btn co-btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit Assessment</button>
            </span>
        </div>
    </div>

    <script>
        // Answers validated server-side via gradeQuiz() Cloud Function (QC-21)
        const QUIZ_ID = 'cyberops-week2';

        const questions = [
            // NSM Data Types
            {
                category: "NSM Data Types",
                question: "Which type of NSM data provides the MOST detail for forensic analysis but requires the MOST storage?",
                options: ["Alert data", "Statistical data", "Session data", "Full packet capture"]
            },
            // Data Visibility Challenges
            {
                category: "Data Visibility",
                question: "Which technology creates a visibility blind spot by encrypting DNS queries?",
                options: ["HTTPS", "DoH (DNS over HTTPS)", "VPN", "SSL/TLS"]
            },
            // Firewall Data
            {
                category: "Firewall Analysis",
                question: "In firewall logs, what does a high number of DROP entries from a single source IP targeting port 22 indicate?",
                options: ["Normal traffic", "SSH brute force attack", "Web server scan", "DNS tunneling"]
            },
            // tcpdump/NetFlow
            {
                category: "Traffic Analysis",
                question: "Which tool would you use to capture packet payloads for malware analysis?",
                options: ["NetFlow", "tcpdump/Wireshark", "SNMP", "Syslog"]
            },
            // Content Filtering
            {
                category: "Content Filtering",
                question: "A proxy log shows multiple users accessing newly registered domains with random characters. What should you suspect?",
                options: ["Normal browsing", "Malware C2 communication", "Social media usage", "Video streaming"]
            },
            // App Visibility
            {
                category: "Application Control",
                question: "What technology allows NGFWs to identify applications even when they use non-standard ports?",
                options: ["IP filtering", "Deep Packet Inspection (DPI)", "MAC filtering", "DNS filtering"]
            },
            // Network Attacks
            {
                category: "Network Attacks",
                question: "Which attack exhausts server resources by initiating TCP connections without completing the handshake?",
                options: ["UDP flood", "SYN flood", "DNS amplification", "Smurf attack"]
            },
            // Network Attacks 2
            {
                category: "Network Attacks",
                question: "A switch reports 'duplicate IP detected' for your gateway. What attack is likely occurring?",
                options: ["DNS spoofing", "ARP spoofing", "IP spoofing", "MAC flooding"]
            },
            // Web Attacks
            {
                category: "Web Attacks",
                question: "Which attack type would you detect by finding ' OR '1'='1 in web server logs?",
                options: ["XSS", "SQL Injection", "CSRF", "Command Injection"]
            },
            // Web Attacks 2
            {
                category: "Web Attacks",
                question: "Which HTTP header helps prevent XSS attacks by controlling which scripts can execute?",
                options: ["X-Frame-Options", "Content-Security-Policy", "X-XSS-Protection", "Strict-Transport-Security"]
            },
            // Evasion
            {
                category: "Evasion Techniques",
                question: "An attacker uses certutil.exe to download malware. This technique is called:",
                options: ["Process injection", "Living off the Land (LOLBins)", "Rootkit installation", "Fileless malware"]
            },
            // Evasion 2
            {
                category: "Evasion Techniques",
                question: "Which encoding would transform 'malware.exe' to 'bWFsd2FyZS5leGU='?",
                options: ["URL encoding", "Hex encoding", "Base64 encoding", "ROT13"]
            },
            // Linux Servers
            {
                category: "Linux Security",
                question: "Which command lists all services currently running on a Linux system?",
                options: ["ps aux", "systemctl list-units --type=service --state=running", "netstat -tulpn", "top"]
            },
            // Linux Servers 2
            {
                category: "Linux Security",
                question: "You find an unknown process listening on port 4444. What should you investigate first?",
                options: ["Ignore it - probably normal", "Delete the process immediately", "Identify the process with ss -tulnp and investigate", "Reboot the server"]
            },
            // Attack Surface
            {
                category: "Attack Surface",
                question: "In the vulnerability lifecycle, what comes AFTER vulnerability discovery but BEFORE remediation?",
                options: ["Exploitation", "Assessment and Prioritization", "Verification", "Patch deployment"]
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let startTime = Date.now();
        let submitted = false;

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = questions.map((q, i) => `
                <div class="co-question-card" id="question${i}" style="${i > 0 ? 'display: none;' : ''}">
                    <div class="co-question-header">
                        <span class="co-question-number">Question ${i + 1} of ${questions.length}</span>
                        <span class="co-question-topic">${q.category}</span>
                    </div>
                    <div class="co-question-text">${q.question}</div>
                    <div class="co-options">
                        ${q.options.map((opt, j) => `
                            <div class="co-option" onclick="selectAnswer(${i}, ${j})" data-option="${j}">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="co-explanation" id="feedback${i}"></div>
                    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                        <button class="co-btn co-btn-primary" onclick="prevQuestion()" ${i === 0 ? 'disabled' : ''} style="background: #334155;">← Previous</button>
                        <button class="co-btn co-btn-primary" onclick="nextQuestion()" ${i === questions.length - 1 ? 'style="display:none"' : ''}>Next →</button>
                    </div>
                </div>
            `).join('');
        }

        function selectAnswer(qIndex, optIndex) {
            if (submitted) return;

            answers[qIndex] = optIndex;

            // Update UI
            const card = document.getElementById(`question${qIndex}`);
            card.querySelectorAll('.co-option').forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optIndex) opt.classList.add('selected');
            });
            card.classList.add('answered');

            // Enable submit if all answered
            const allAnswered = answers.every(a => a !== null);
            document.getElementById('submitBtn').disabled = !allAnswered;

            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                document.getElementById(`question${currentQuestion}`).style.display = 'none';
                currentQuestion++;
                document.getElementById(`question${currentQuestion}`).style.display = 'block';
                updateProgress();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                document.getElementById(`question${currentQuestion}`).style.display = 'none';
                currentQuestion--;
                document.getElementById(`question${currentQuestion}`).style.display = 'block';
                updateProgress();
            }
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            const percent = (answered / questions.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${answered} of ${questions.length} questions answered`;
        }

        async function submitQuiz() {
            if (!confirm('Are you sure you want to submit? You cannot change answers after submission.')) return;

            submitted = true;

            // Build answer map from recorded answers
            const answerMap = {};
            questions.forEach((q, i) => {
                if (answers[i] !== null) {
                    answerMap[String(i)] = answers[i];
                }
            });

            let score = 0, percentage = 0, passed = false;
            try {
                if (typeof FirebaseAuth !== 'undefined') {
                    await FirebaseAuth.waitForAuth();
                    const response = await FirebaseAuth.callFunction('gradeQuiz', {
                        quizId: QUIZ_ID, answers: answerMap
                    });
                    score = response.data.score;
                    percentage = response.data.percentage;
                    passed = response.data.passed;
                }
            } catch (e) { console.warn('Server grading failed:', e.message); }

            // Disable all options
            questions.forEach((q, i) => {
                const card = document.getElementById(`question${i}`);
                const options = card.querySelectorAll('.co-option');
                options.forEach(opt => opt.classList.add('disabled'));
                card.style.display = 'block';
            });

            // Calculate time spent
            const timeSpent = Math.round((Date.now() - startTime) / 1000);
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;

            // Display results
            document.getElementById('scoreDisplay').textContent = percentage + '%';
            document.getElementById('scoreDisplay').className = 'score-display ' + (passed ? 'pass' : 'fail');
            document.getElementById('correctCount').textContent = score;
            document.getElementById('incorrectCount').textContent = questions.length - score;
            document.getElementById('timeSpent').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('resultsMessage').textContent = passed
                ? '<img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Congratulations! You passed the Week 2 Assessment.'
                : '<img src="/assets/images/icons/icon-books.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> You need 80% to pass. Review the material and try again.';

            document.getElementById('resultsCard').classList.add('show');
            document.getElementById('submitSection').style.display = 'none';

            // Save completion
            if (passed) {
                localStorage.setItem('cyberops_week2_evaluation', 'completed');
                if (typeof CompletionStamp !== 'undefined') {
                    CompletionStamp.mark('eye-cyberops-week2-eval', percentage);
                }
            }

            // Scroll to results
            document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize
        renderQuiz();
    </script>
    <script src="../../../../../components/CompletionStamp.js"></script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
