<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../cyberops-theme.css">
    <title>Week 5 Evaluation - CyberOps IR & Forensics</title>
    
</head>
<body>
    <div class="container">
        <nav class="co-breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span class="sep">/</span>
            <a href="../../../modules/cyberops/index.html">CyberOps</a>
            <span class="sep">/</span>
            <a href="index.html">Week 5</a>
            <span class="sep">/</span>
            <span>Evaluation</span>
        </nav>

        <div class="co-intro">
            <span class="co-badge"><img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> ASSESSMENT</span>
            <div class="icon"><img src="/assets/images/icons/icon-magnifier.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
            <h1>Week 5 Evaluation</h1>
            <p class="subtitle">Incident Response & Forensics Fundamentals</p>
        </div>

        <div class="co-panel">
            <h2>Assessment Information</h2>
            <div class="co-exam-info">
                <div class="co-exam-stat">
                    <div class="value">15</div>
                    <div class="label">Questions</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">80%</div>
                    <div class="label">Passing Score</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value" id="currentScore">0</div>
                    <div class="label">Your Score</div>
                </div>
            </div>
            <div class="co-progress-bar">
                <div class="co-progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be populated by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="co-btn co-btn-primary" id="submitBtn" onclick="submitEvaluation()" disabled>Submit Evaluation</button>
        </div>

        <div class="co-results" id="resultsCard">
            <h2>Evaluation Complete!</h2>
            <div class="co-score-pct" id="finalScore">0%</div>
            <p class="co-result-msg" id="resultsMessage"></p>
            <button class="co-btn co-btn-primary" onclick="location.reload()">Retake Evaluation</button>
            <a href="index.html" class="co-btn co-btn-secondary">← Back to Week 5</a>
        </div>
    </div>

    <script>
        // Answers validated server-side via gradeQuiz() Cloud Function (QC-21)
        const QUIZ_ID = 'cyberops-week5';

        const questions = [
            {
                id: 1,
                category: "NIST 800-86",
                question: "What are the four phases of the NIST forensic process?",
                options: [
                    "Identify, Protect, Detect, Respond",
                    "Collection, Examination, Analysis, Reporting",
                    "Preparation, Detection, Containment, Recovery",
                    "Plan, Do, Check, Act"
                ]
            },
            {
                id: 2,
                category: "Evidence Handling",
                question: "According to the order of volatility, which evidence should be collected FIRST?",
                options: [
                    "Hard drive contents",
                    "RAM and network connections",
                    "Log files",
                    "Registry hives"
                ]
            },
            {
                id: 3,
                category: "Policy Management",
                question: "What is the correct hierarchy of security documentation from highest to lowest?",
                options: [
                    "Procedures > Policies > Standards > Guidelines",
                    "Policies > Standards > Procedures > Guidelines",
                    "Guidelines > Standards > Policies > Procedures",
                    "Standards > Policies > Guidelines > Procedures"
                ]
            },
            {
                id: 4,
                category: "SOC Metrics",
                question: "What does MTTD measure in SOC operations?",
                options: [
                    "Time from detection to containment",
                    "Time from breach to detection",
                    "Time from alert to closure",
                    "Time from request to response"
                ]
            },
            {
                id: 5,
                category: "Protected Data",
                question: "Which regulation requires breach notification within 72 hours?",
                options: [
                    "HIPAA",
                    "PCI DSS",
                    "GDPR",
                    "SOX"
                ]
            },
            {
                id: 6,
                category: "Forensic Evidence",
                question: "What Windows artifact records evidence of program execution?",
                options: [
                    "Event Viewer only",
                    "hosts file",
                    "Prefetch files",
                    "Desktop shortcuts"
                ]
            },
            {
                id: 7,
                category: "Network Profiling",
                question: "What is the primary purpose of server profiling?",
                options: [
                    "To create marketing materials",
                    "To establish baselines for anomaly detection",
                    "To document systems for compliance audits only",
                    "To replace firewall rules"
                ]
            },
            {
                id: 8,
                category: "Incident Response",
                question: "What are the NIST incident response lifecycle phases?",
                options: [
                    "Identify, Protect, Detect, Respond",
                    "Preparation, Detection & Analysis, Containment/Eradication/Recovery, Post-Incident",
                    "Plan, Do, Check, Act",
                    "Collection, Examination, Analysis, Reporting"
                ]
            },
            {
                id: 9,
                category: "SOC Operations",
                question: "Which SOC tier is primarily responsible for proactive threat hunting?",
                options: [
                    "Tier 1",
                    "Tier 2",
                    "Tier 3",
                    "SOC Manager"
                ]
            },
            {
                id: 10,
                category: "Data Classification",
                question: "A DLP alert shows credit card numbers appearing in application logs. What priority is this?",
                options: [
                    "Low - logs are internal",
                    "Medium - needs investigation",
                    "Critical - PCI data should never be in logs",
                    "Informational - expected behavior"
                ]
            },
            {
                id: 11,
                category: "Evidence Handling",
                question: "Why should hash values be calculated during evidence collection?",
                options: [
                    "To encrypt the evidence",
                    "To compress the evidence for storage",
                    "To prove the evidence hasn't been modified",
                    "To identify the file type"
                ]
            },
            {
                id: 12,
                category: "Incident Response",
                question: "What is 'short-term containment' in incident response?",
                options: [
                    "Permanent fix for the vulnerability",
                    "Immediate action to stop incident spread (e.g., network isolation)",
                    "Filing a police report",
                    "Notifying affected customers"
                ]
            },
            {
                id: 13,
                category: "SOC Metrics",
                question: "What is 'dwell time' in cybersecurity?",
                options: [
                    "Time an analyst spends on each alert",
                    "Time an attacker remains undetected in a network",
                    "Time between security patches",
                    "Time to restore a system from backup"
                ]
            },
            {
                id: 14,
                category: "Policy Management",
                question: "Why should SOC analysts maintain a policy exception list?",
                options: [
                    "To avoid false positive alerts on approved deviations",
                    "To help attackers bypass security controls",
                    "To automatically close all policy alerts",
                    "To create new policies on their own"
                ]
            },
            {
                id: 15,
                category: "Forensic Evidence",
                question: "What should a Tier 1 SOC analyst do when suspecting a compromised system?",
                options: [
                    "Immediately reboot the system to clear malware",
                    "Delete suspicious files to prevent spread",
                    "Run antivirus scan on the live system",
                    "Document findings and escalate without touching the system"
                ]
            }
        ];

        let answered = 0;
        let userSelections = {}; // Track selections by question id

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="co-question-card" id="q${q.id}">
                        <div class="co-question-header">
                            <span class="co-question-number">Question ${idx + 1}</span>
                            <span class="co-question-topic">${q.category}</span>
                        </div>
                        <p class="co-question-text">${q.question}</p>
                        <div class="co-options">
                            ${q.options.map((opt, i) => `
                                <div class="co-option" onclick="selectOption(${q.id}, ${i})" data-question="${q.id}" data-option="${i}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="co-explanation" id="feedback${q.id}"></div>
                    </div>
                `;
            });
        }

        function selectOption(questionId, optionIndex) {
            const card = document.getElementById(`q${questionId}`);
            if (card.classList.contains('locked')) return;

            const options = card.querySelectorAll('.co-option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optionIndex) opt.classList.add('selected');
            });

            if (!card.classList.contains('answered')) {
                card.classList.add('answered');
                answered++;
            }

            userSelections[questionId] = optionIndex;

            const feedback = document.getElementById(`feedback${questionId}`);
            feedback.textContent = 'Answer recorded.';
            feedback.classList.add('show');

            updateProgress();

            if (answered === questions.length) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function updateProgress() {
            const percent = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentScore').textContent = answered + '/' + questions.length;
        }

        async function submitEvaluation() {
            // Build answer map from recorded answers (0-based index)
            const answerMap = {};
            questions.forEach((q, i) => {
                if (userSelections[q.id] !== undefined) {
                    answerMap[String(i)] = userSelections[q.id];
                }
            });

            let score = 0, percentage = 0, passed = false;
            try {
                if (typeof FirebaseAuth !== 'undefined') {
                    await FirebaseAuth.waitForAuth();
                    const response = await FirebaseAuth.callFunction('gradeQuiz', {
                        quizId: QUIZ_ID, answers: answerMap
                    });
                    score = response.data.score;
                    percentage = response.data.percentage;
                    passed = response.data.passed;
                }
            } catch (e) { console.warn('Server grading failed:', e.message); }

            // Lock all questions
            questions.forEach(q => {
                const card = document.getElementById(`q${q.id}`);
                card.classList.add('locked');
                card.querySelectorAll('.co-option').forEach(opt => opt.classList.add('disabled'));
            });

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const finalScore = document.getElementById('finalScore');
            finalScore.textContent = percentage + '%';
            finalScore.classList.add(passed ? 'pass' : 'fail');

            document.getElementById('resultsMessage').textContent = passed
                ? `Congratulations! You passed with ${score}/${questions.length} correct answers. You've demonstrated solid understanding of incident response and forensics fundamentals.`
                : `You scored ${score}/${questions.length}. You need 80% to pass. Review the material and try again.`;

            if (passed) {
                localStorage.setItem('cyberops_week5_evaluation', 'passed');
                if (typeof CompletionStamp !== 'undefined') {
                    CompletionStamp.mark('eye-cyberops-week5-eval', percentage);
                }
            }
        }

        renderQuestions();
    </script>
    <script src="../../../../../components/CompletionStamp.js"></script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
