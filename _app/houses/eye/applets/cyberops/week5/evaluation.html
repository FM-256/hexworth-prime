<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 Evaluation - CyberOps IR & Forensics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #64748b;
        }
        .breadcrumb a { color: #06b6d4; text-decoration: none; }

        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid #06b6d4;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .eval-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .icon { font-size: 3em; margin-bottom: 15px; }
        h1 { color: #06b6d4; font-size: 2em; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; }

        .info-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .info-box h3 { color: #06b6d4; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
        .info-item { text-align: center; }
        .info-item .value { font-size: 1.5em; color: #06b6d4; font-weight: bold; }
        .info-item .label { font-size: 0.85em; color: #64748b; }

        .progress-bar { height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #8b5cf6); transition: width 0.5s; }

        .question-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .question-card.answered { border-color: #06b6d4; }
        .question-card.correct { border-color: #22c55e; }
        .question-card.incorrect { border-color: #ef4444; }

        .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .question-number { background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; }
        .question-category { font-size: 0.8em; color: #64748b; }
        .question-text { font-size: 1.1em; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 15px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover:not(.disabled) { border-color: #06b6d4; }
        .option.selected { border-color: #06b6d4; background: rgba(6, 182, 212, 0.1); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .option.disabled { cursor: default; opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #22c55e; }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .results-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid #8b5cf6;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            display: none;
        }
        .results-card.show { display: block; }
        .score-display { font-size: 4em; color: #06b6d4; font-weight: bold; margin: 20px 0; }
        .score-display.pass { color: #22c55e; }
        .score-display.fail { color: #ef4444; }
        .results-message { font-size: 1.2em; margin-bottom: 20px; }

        .back-link { display: inline-block; margin-top: 20px; color: #06b6d4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span>/</span>
            <a href="../../../modules/cyberops/index.html">CyberOps</a>
            <span>/</span>
            <a href="index.html">Week 5</a>
            <span>/</span>
            <span>Evaluation</span>
        </nav>

        <header>
            <span class="eval-badge">📝 ASSESSMENT</span>
            <div class="icon">🔍🛡️</div>
            <h1>Week 5 Evaluation</h1>
            <p class="subtitle">Incident Response & Forensics Fundamentals</p>
        </header>

        <div class="info-box">
            <h3>Assessment Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="value">15</div>
                    <div class="label">Questions</div>
                </div>
                <div class="info-item">
                    <div class="value">80%</div>
                    <div class="label">Passing Score</div>
                </div>
                <div class="info-item">
                    <div class="value" id="currentScore">0</div>
                    <div class="label">Your Score</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be populated by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" id="submitBtn" onclick="submitEvaluation()" disabled>Submit Evaluation</button>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Evaluation Complete!</h2>
            <div class="score-display" id="finalScore">0%</div>
            <p class="results-message" id="resultsMessage"></p>
            <button class="btn" onclick="location.reload()">Retake Evaluation</button>
            <a href="index.html" class="back-link">← Back to Week 5</a>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                category: "NIST 800-86",
                question: "What are the four phases of the NIST forensic process?",
                options: [
                    "Identify, Protect, Detect, Respond",
                    "Collection, Examination, Analysis, Reporting",
                    "Preparation, Detection, Containment, Recovery",
                    "Plan, Do, Check, Act"
                ],
                correct: 1,
                feedback: "NIST SP 800-86 defines four phases: Collection, Examination, Analysis, and Reporting."
            },
            {
                id: 2,
                category: "Evidence Handling",
                question: "According to the order of volatility, which evidence should be collected FIRST?",
                options: [
                    "Hard drive contents",
                    "RAM and network connections",
                    "Log files",
                    "Registry hives"
                ],
                correct: 1,
                feedback: "RAM and active network connections are the most volatile and should be collected first before they're lost."
            },
            {
                id: 3,
                category: "Policy Management",
                question: "What is the correct hierarchy of security documentation from highest to lowest?",
                options: [
                    "Procedures > Policies > Standards > Guidelines",
                    "Policies > Standards > Procedures > Guidelines",
                    "Guidelines > Standards > Policies > Procedures",
                    "Standards > Policies > Guidelines > Procedures"
                ],
                correct: 1,
                feedback: "Policies are high-level statements, followed by mandatory standards, detailed procedures, and recommended guidelines."
            },
            {
                id: 4,
                category: "SOC Metrics",
                question: "What does MTTD measure in SOC operations?",
                options: [
                    "Time from detection to containment",
                    "Time from breach to detection",
                    "Time from alert to closure",
                    "Time from request to response"
                ],
                correct: 1,
                feedback: "Mean Time to Detect (MTTD) measures how long it takes to detect a breach from when it first occurred."
            },
            {
                id: 5,
                category: "Protected Data",
                question: "Which regulation requires breach notification within 72 hours?",
                options: [
                    "HIPAA",
                    "PCI DSS",
                    "GDPR",
                    "SOX"
                ],
                correct: 2,
                feedback: "GDPR requires organizations to notify supervisory authorities within 72 hours of becoming aware of a data breach."
            },
            {
                id: 6,
                category: "Forensic Evidence",
                question: "What Windows artifact records evidence of program execution?",
                options: [
                    "Event Viewer only",
                    "hosts file",
                    "Prefetch files",
                    "Desktop shortcuts"
                ],
                correct: 2,
                feedback: "Prefetch files in C:\\Windows\\Prefetch record evidence of executed programs with timestamps."
            },
            {
                id: 7,
                category: "Network Profiling",
                question: "What is the primary purpose of server profiling?",
                options: [
                    "To create marketing materials",
                    "To establish baselines for anomaly detection",
                    "To document systems for compliance audits only",
                    "To replace firewall rules"
                ],
                correct: 1,
                feedback: "Server profiling establishes what's 'normal' so deviations (anomalies) can be detected."
            },
            {
                id: 8,
                category: "Incident Response",
                question: "What are the NIST incident response lifecycle phases?",
                options: [
                    "Identify, Protect, Detect, Respond",
                    "Preparation, Detection & Analysis, Containment/Eradication/Recovery, Post-Incident",
                    "Plan, Do, Check, Act",
                    "Collection, Examination, Analysis, Reporting"
                ],
                correct: 1,
                feedback: "NIST defines four IR phases: Preparation, Detection & Analysis, Containment/Eradication/Recovery, and Post-Incident Activity."
            },
            {
                id: 9,
                category: "SOC Operations",
                question: "Which SOC tier is primarily responsible for proactive threat hunting?",
                options: [
                    "Tier 1",
                    "Tier 2",
                    "Tier 3",
                    "SOC Manager"
                ],
                correct: 2,
                feedback: "Tier 3 analysts (Threat Hunters) conduct proactive hunting and lead complex investigations."
            },
            {
                id: 10,
                category: "Data Classification",
                question: "A DLP alert shows credit card numbers appearing in application logs. What priority is this?",
                options: [
                    "Low - logs are internal",
                    "Medium - needs investigation",
                    "Critical - PCI data should never be in logs",
                    "Informational - expected behavior"
                ],
                correct: 2,
                feedback: "Credit card numbers in logs is a PCI DSS violation - cardholder data should never be logged in plain text."
            },
            {
                id: 11,
                category: "Evidence Handling",
                question: "Why should hash values be calculated during evidence collection?",
                options: [
                    "To encrypt the evidence",
                    "To compress the evidence for storage",
                    "To prove the evidence hasn't been modified",
                    "To identify the file type"
                ],
                correct: 2,
                feedback: "Hash values provide integrity verification - matching hashes prove evidence hasn't been altered."
            },
            {
                id: 12,
                category: "Incident Response",
                question: "What is 'short-term containment' in incident response?",
                options: [
                    "Permanent fix for the vulnerability",
                    "Immediate action to stop incident spread (e.g., network isolation)",
                    "Filing a police report",
                    "Notifying affected customers"
                ],
                correct: 1,
                feedback: "Short-term containment is immediate action like network isolation to stop an incident from spreading."
            },
            {
                id: 13,
                category: "SOC Metrics",
                question: "What is 'dwell time' in cybersecurity?",
                options: [
                    "Time an analyst spends on each alert",
                    "Time an attacker remains undetected in a network",
                    "Time between security patches",
                    "Time to restore a system from backup"
                ],
                correct: 1,
                feedback: "Dwell time is how long an attacker is present before detection. Industry average exceeds 200 days!"
            },
            {
                id: 14,
                category: "Policy Management",
                question: "Why should SOC analysts maintain a policy exception list?",
                options: [
                    "To avoid false positive alerts on approved deviations",
                    "To help attackers bypass security controls",
                    "To automatically close all policy alerts",
                    "To create new policies on their own"
                ],
                correct: 0,
                feedback: "Exception lists prevent false positives - some users/systems have approved policy deviations."
            },
            {
                id: 15,
                category: "Forensic Evidence",
                question: "What should a Tier 1 SOC analyst do when suspecting a compromised system?",
                options: [
                    "Immediately reboot the system to clear malware",
                    "Delete suspicious files to prevent spread",
                    "Run antivirus scan on the live system",
                    "Document findings and escalate without touching the system"
                ],
                correct: 3,
                feedback: "Tier 1 should document observations but NOT touch the system - each action can destroy evidence."
            }
        ];

        let answered = 0;
        let correct = 0;

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="question-card" id="q${q.id}">
                        <div class="question-header">
                            <span class="question-number">Question ${idx + 1}</span>
                            <span class="question-category">${q.category}</span>
                        </div>
                        <p class="question-text">${q.question}</p>
                        <div class="options">
                            ${q.options.map((opt, i) => `
                                <div class="option" onclick="selectOption(${q.id}, ${i})" data-question="${q.id}" data-option="${i}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="feedback" id="feedback${q.id}"></div>
                    </div>
                `;
            });
        }

        function selectOption(questionId, optionIndex) {
            const card = document.getElementById(`q${questionId}`);
            if (card.classList.contains('answered')) return;

            const options = card.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optionIndex) opt.classList.add('selected');
            });

            card.classList.add('answered');
            answered++;

            const question = questions.find(q => q.id === questionId);
            const isCorrect = optionIndex === question.correct;

            if (isCorrect) {
                correct++;
                options[optionIndex].classList.add('correct');
                card.classList.add('correct');
            } else {
                options[optionIndex].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                card.classList.add('incorrect');
            }

            const feedback = document.getElementById(`feedback${questionId}`);
            feedback.textContent = question.feedback;
            feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');

            options.forEach(opt => opt.classList.add('disabled'));

            updateProgress();

            if (answered === questions.length) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function updateProgress() {
            const percent = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentScore').textContent = correct + '/' + answered;
        }

        function submitEvaluation() {
            const percent = Math.round((correct / questions.length) * 100);
            const passed = percent >= 80;

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.querySelector('.info-box').style.display = 'none';

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const finalScore = document.getElementById('finalScore');
            finalScore.textContent = percent + '%';
            finalScore.classList.add(passed ? 'pass' : 'fail');

            document.getElementById('resultsMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers. You've demonstrated solid understanding of incident response and forensics fundamentals.`
                : `You scored ${correct}/${questions.length}. You need 80% to pass. Review the material and try again.`;

            if (passed) {
                localStorage.setItem('cyberops_week5_evaluation', 'passed');
            }
        }

        renderQuestions();
    </script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
