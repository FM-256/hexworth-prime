<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../cyberops-theme.css">
    <title>Week 6 Evaluation - CyberOps Cryptography</title>
    
</head>
<body>
    <div class="container">
        <nav class="co-breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span class="sep">/</span>
            <a href="../../../modules/cyberops/index.html">CyberOps</a>
            <span class="sep">/</span>
            <a href="index.html">Week 6</a>
            <span class="sep">/</span>
            <span>Evaluation</span>
        </nav>

        <div class="co-intro">
            <span class="co-badge"><img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> ASSESSMENT</span>
            <div class="icon"><img src="/assets/images/icons/icon-padlock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"><img src="/assets/images/icons/icon-key.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
            <h1>Week 6 Evaluation</h1>
            <p class="subtitle">Cryptography Fundamentals</p>
        </div>

        <div class="co-panel">
            <h2>Assessment Information</h2>
            <div class="co-exam-info">
                <div class="co-exam-stat">
                    <div class="value">10</div>
                    <div class="label">Questions</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">70%</div>
                    <div class="label">Passing Score</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value" id="currentScore">0</div>
                    <div class="label">Your Score</div>
                </div>
            </div>
            <div class="co-progress-bar">
                <div class="co-progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be populated by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="co-btn co-btn-primary" id="submitBtn" onclick="submitEvaluation()" disabled>Submit Evaluation</button>
        </div>

        <div class="co-results" id="resultsCard">
            <h2>Evaluation Complete!</h2>
            <div class="co-score-pct" id="finalScore">0%</div>
            <p class="co-result-msg" id="resultsMessage"></p>
            <button class="co-btn co-btn-primary" onclick="location.reload()">Retake Evaluation</button>
            <a href="index.html" class="co-btn co-btn-secondary">← Back to Week 6</a>
        </div>
    </div>

    <script>
        // Answers validated server-side via gradeQuiz() Cloud Function (QC-21)
        const QUIZ_ID = 'cyberops-week6';

        const questions = [
            {
                id: 1,
                category: "Hashing",
                question: "Why is MD5 no longer recommended for cryptographic purposes?",
                options: [
                    "It's too slow for modern systems",
                    "Collision attacks have been demonstrated",
                    "It only produces 64-bit hashes",
                    "It requires too much memory"
                ]
            },
            {
                id: 2,
                category: "Symmetric Encryption",
                question: "What is the key size of AES-256?",
                options: [
                    "128 bits",
                    "192 bits",
                    "256 bits",
                    "512 bits"
                ]
            },
            {
                id: 3,
                category: "Asymmetric Encryption",
                question: "In RSA encryption, which key is used to encrypt data that only the recipient can decrypt?",
                options: [
                    "Private key",
                    "Public key",
                    "Session key",
                    "Master key"
                ]
            },
            {
                id: 4,
                category: "Digital Signatures",
                question: "What cryptographic properties does a digital signature provide?",
                options: [
                    "Confidentiality only",
                    "Authentication, integrity, and non-repudiation",
                    "Encryption and compression",
                    "Speed and efficiency"
                ]
            },
            {
                id: 5,
                category: "Certificates",
                question: "What is the purpose of a Certificate Authority (CA)?",
                options: [
                    "To encrypt all network traffic",
                    "To issue and vouch for the authenticity of digital certificates",
                    "To store passwords securely",
                    "To generate encryption keys"
                ]
            },
            {
                id: 6,
                category: "TLS/SSL",
                question: "During a TLS handshake, what is established?",
                options: [
                    "Permanent encryption keys stored on disk",
                    "Session keys for symmetric encryption",
                    "Certificate revocation lists",
                    "Firewall rules"
                ]
            },
            {
                id: 7,
                category: "VPN",
                question: "What is the primary difference between IPsec and SSL/TLS VPNs?",
                options: [
                    "IPsec works at network layer, SSL/TLS at application layer",
                    "IPsec is always faster than SSL/TLS",
                    "SSL/TLS requires special hardware",
                    "IPsec can't encrypt data"
                ]
            },
            {
                id: 8,
                category: "Hashing",
                question: "What is a 'salt' in password hashing?",
                options: [
                    "A chemical used to corrode hard drives",
                    "Random data added to passwords before hashing to prevent rainbow table attacks",
                    "A compression algorithm",
                    "The final hash output"
                ]
            },
            {
                id: 9,
                category: "Asymmetric Encryption",
                question: "Why is asymmetric encryption not typically used to encrypt large amounts of data?",
                options: [
                    "It's illegal in most countries",
                    "It's computationally expensive and slow",
                    "It can't handle files over 1KB",
                    "It requires internet connectivity"
                ]
            },
            {
                id: 10,
                category: "Wireshark Analysis",
                question: "To decrypt TLS traffic in Wireshark, what do you need?",
                options: [
                    "The victim's password",
                    "Access to the certificate authority",
                    "The session keys or pre-master secret",
                    "Only the server's public key"
                ]
            }
        ];

        let answered = 0;
        let userSelections = {}; // Track selections by question id

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="co-question-card" id="q${q.id}">
                        <div class="co-question-header">
                            <span class="co-question-number">Question ${idx + 1}</span>
                            <span class="co-question-topic">${q.category}</span>
                        </div>
                        <p class="co-question-text">${q.question}</p>
                        <div class="co-options">
                            ${q.options.map((opt, i) => `
                                <div class="co-option" onclick="selectOption(${q.id}, ${i})" data-question="${q.id}" data-option="${i}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="co-explanation" id="feedback${q.id}"></div>
                    </div>
                `;
            });
        }

        function selectOption(questionId, optionIndex) {
            const card = document.getElementById(`q${questionId}`);
            if (card.classList.contains('locked')) return;

            const options = card.querySelectorAll('.co-option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optionIndex) opt.classList.add('selected');
            });

            if (!card.classList.contains('answered')) {
                card.classList.add('answered');
                answered++;
            }

            userSelections[questionId] = optionIndex;

            const feedback = document.getElementById(`feedback${questionId}`);
            feedback.textContent = 'Answer recorded.';
            feedback.classList.add('show');

            updateProgress();

            if (answered === questions.length) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function updateProgress() {
            const percent = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentScore').textContent = answered + '/' + questions.length;
        }

        async function submitEvaluation() {
            // Build answer map from recorded answers (0-based index)
            const answerMap = {};
            questions.forEach((q, i) => {
                if (userSelections[q.id] !== undefined) {
                    answerMap[String(i)] = userSelections[q.id];
                }
            });

            let score = 0, percentage = 0, passed = false;
            try {
                if (typeof FirebaseAuth !== 'undefined') {
                    await FirebaseAuth.waitForAuth();
                    const response = await FirebaseAuth.callFunction('gradeQuiz', {
                        quizId: QUIZ_ID, answers: answerMap
                    });
                    score = response.data.score;
                    percentage = response.data.percentage;
                    passed = response.data.passed;
                }
            } catch (e) { console.warn('Server grading failed:', e.message); }

            // Lock all questions
            questions.forEach(q => {
                const card = document.getElementById(`q${q.id}`);
                card.classList.add('locked');
                card.querySelectorAll('.co-option').forEach(opt => opt.classList.add('disabled'));
            });

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const finalScore = document.getElementById('finalScore');
            finalScore.textContent = percentage + '%';
            finalScore.classList.add(passed ? 'pass' : 'fail');

            document.getElementById('resultsMessage').textContent = passed
                ? `Congratulations! You passed with ${score}/${questions.length} correct answers. You've demonstrated solid understanding of cryptography fundamentals.`
                : `You scored ${score}/${questions.length}. You need 70% to pass. Review the material and try again.`;

            if (passed) {
                localStorage.setItem('cyberops_week6_evaluation', 'passed');
                if (typeof CompletionStamp !== 'undefined') {
                    CompletionStamp.mark('eye-cyberops-week6-eval', percentage);
                }
            }
        }

        renderQuestions();
    </script>
    <script src="../../../../../components/CompletionStamp.js"></script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
