<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../cyberops-theme.css">
    <title>Week 7 Evaluation - CyberOps Incident Response</title>
    
</head>
<body>
    <div class="container">
        <nav class="co-breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span class="sep">/</span>
            <a href="../../../modules/cyberops/index.html">CyberOps</a>
            <span class="sep">/</span>
            <a href="index.html">Week 7</a>
            <span class="sep">/</span>
            <span>Evaluation</span>
        </nav>

        <div class="co-intro">
            <span class="co-badge"><img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> ASSESSMENT</span>
            <div class="icon"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"><img src="/assets/images/icons/icon-microscope.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
            <h1>Week 7 Evaluation</h1>
            <p class="subtitle">Incident Response Capstone</p>
        </div>

        <div class="co-panel">
            <h2>Assessment Information</h2>
            <div class="co-exam-info">
                <div class="co-exam-stat">
                    <div class="value">10</div>
                    <div class="label">Questions</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value">70%</div>
                    <div class="label">Passing Score</div>
                </div>
                <div class="co-exam-stat">
                    <div class="value" id="currentScore">0</div>
                    <div class="label">Your Score</div>
                </div>
            </div>
            <div class="co-progress-bar">
                <div class="co-progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be populated by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="co-btn co-btn-primary" id="submitBtn" onclick="submitEvaluation()" disabled>Submit Evaluation</button>
        </div>

        <div class="co-results" id="resultsCard">
            <h2>Evaluation Complete!</h2>
            <div class="co-score-pct" id="finalScore">0%</div>
            <p class="co-result-msg" id="resultsMessage"></p>
            <button class="co-btn co-btn-primary" onclick="location.reload()">Retake Evaluation</button>
            <a href="index.html" class="co-btn co-btn-secondary">← Back to Week 7</a>
        </div>
    </div>

    <script>
        // Answers validated server-side via gradeQuiz() Cloud Function (QC-21)
        const QUIZ_ID = 'cyberops-week7';

        const questions = [
            {
                id: 1,
                category: "Snort IDS",
                question: "What does the 'content' keyword in a Snort rule specify?",
                options: [
                    "The type of packet (TCP/UDP)",
                    "The payload data to match",
                    "The source IP address",
                    "The alert priority level"
                ]
            },
            {
                id: 2,
                category: "PCAP Forensics",
                question: "When analyzing a PCAP file, what indicates data exfiltration?",
                options: [
                    "Large outbound data transfers to unknown external IPs",
                    "Normal DNS queries",
                    "Inbound HTTP requests",
                    "ICMP ping responses"
                ]
            },
            {
                id: 3,
                category: "MITRE ATT&CK",
                question: "What MITRE ATT&CK tactic does 'lateral movement' fall under?",
                options: [
                    "Initial Access",
                    "Persistence",
                    "Lateral Movement (it's a tactic)",
                    "Exfiltration"
                ]
            },
            {
                id: 4,
                category: "Incident Handling",
                question: "What should happen FIRST during the containment phase?",
                options: [
                    "Delete all malware files",
                    "Reboot affected systems",
                    "Isolate affected systems to prevent spread",
                    "Interview all employees"
                ]
            },
            {
                id: 5,
                category: "Log Correlation",
                question: "Why is time synchronization critical in log correlation?",
                options: [
                    "To save disk space",
                    "To build accurate attack timelines across multiple sources",
                    "To improve log compression",
                    "To reduce false positives"
                ]
            },
            {
                id: 6,
                category: "Memory Forensics",
                question: "What tool is commonly used for analyzing Windows memory dumps?",
                options: [
                    "Wireshark",
                    "Volatility",
                    "Nmap",
                    "Burp Suite"
                ]
            },
            {
                id: 7,
                category: "Network Forensics",
                question: "What technique do attackers use to move between systems in a compromised network?",
                options: [
                    "Port scanning",
                    "Lateral movement",
                    "SQL injection",
                    "Social engineering"
                ]
            },
            {
                id: 8,
                category: "Chain of Custody",
                question: "Why must digital evidence maintain a documented chain of custody?",
                options: [
                    "To ensure legal admissibility in court",
                    "To compress the evidence",
                    "To make it easier to search",
                    "To automatically detect malware"
                ]
            },
            {
                id: 9,
                category: "Threat Actor Profiling",
                question: "What does TTP stand for in threat intelligence?",
                options: [
                    "Time To Patch",
                    "Tactics, Techniques, and Procedures",
                    "Threat Transmission Protocol",
                    "Target, Track, Prosecute"
                ]
            },
            {
                id: 10,
                category: "Incident Handling",
                question: "What is the purpose of the 'Lessons Learned' phase in incident response?",
                options: [
                    "To punish employees for mistakes",
                    "To improve future incident response capabilities",
                    "To delete all incident records",
                    "To restore backups"
                ]
            }
        ];

        let answered = 0;
        let userSelections = {}; // Track selections by question id

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="co-question-card" id="q${q.id}">
                        <div class="co-question-header">
                            <span class="co-question-number">Question ${idx + 1}</span>
                            <span class="co-question-topic">${q.category}</span>
                        </div>
                        <p class="co-question-text">${q.question}</p>
                        <div class="co-options">
                            ${q.options.map((opt, i) => `
                                <div class="co-option" onclick="selectOption(${q.id}, ${i})" data-question="${q.id}" data-option="${i}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="co-explanation" id="feedback${q.id}"></div>
                    </div>
                `;
            });
        }

        function selectOption(questionId, optionIndex) {
            const card = document.getElementById(`q${questionId}`);
            if (card.classList.contains('locked')) return;

            const options = card.querySelectorAll('.co-option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optionIndex) opt.classList.add('selected');
            });

            if (!card.classList.contains('answered')) {
                card.classList.add('answered');
                answered++;
            }

            userSelections[questionId] = optionIndex;

            const feedback = document.getElementById(`feedback${questionId}`);
            feedback.textContent = 'Answer recorded.';
            feedback.classList.add('show');

            updateProgress();

            if (answered === questions.length) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function updateProgress() {
            const percent = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentScore').textContent = answered + '/' + questions.length;
        }

        async function submitEvaluation() {
            // Build answer map from recorded answers (0-based index)
            const answerMap = {};
            questions.forEach((q, i) => {
                if (userSelections[q.id] !== undefined) {
                    answerMap[String(i)] = userSelections[q.id];
                }
            });

            let score = 0, percentage = 0, passed = false;
            try {
                if (typeof FirebaseAuth !== 'undefined') {
                    await FirebaseAuth.waitForAuth();
                    const response = await FirebaseAuth.callFunction('gradeQuiz', {
                        quizId: QUIZ_ID, answers: answerMap
                    });
                    score = response.data.score;
                    percentage = response.data.percentage;
                    passed = response.data.passed;
                }
            } catch (e) { console.warn('Server grading failed:', e.message); }

            // Lock all questions
            questions.forEach(q => {
                const card = document.getElementById(`q${q.id}`);
                card.classList.add('locked');
                card.querySelectorAll('.co-option').forEach(opt => opt.classList.add('disabled'));
            });

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const finalScore = document.getElementById('finalScore');
            finalScore.textContent = percentage + '%';
            finalScore.classList.add(passed ? 'pass' : 'fail');

            document.getElementById('resultsMessage').textContent = passed
                ? `Congratulations! You passed with ${score}/${questions.length} correct answers. You've demonstrated excellent incident response capabilities.`
                : `You scored ${score}/${questions.length}. You need 70% to pass. Review the capstone labs and try again.`;

            if (passed) {
                localStorage.setItem('cyberops_week7_evaluation', 'passed');
                if (typeof CompletionStamp !== 'undefined') {
                    CompletionStamp.mark('eye-cyberops-week7-eval', percentage);
                }
            }
        }

        renderQuestions();
    </script>
    <script src="../../../../../components/CompletionStamp.js"></script>
</body>
</html>
