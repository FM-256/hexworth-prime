<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Evaluation - CyberOps Incident Response</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #64748b;
        }
        .breadcrumb a { color: #06b6d4; text-decoration: none; }

        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid #06b6d4;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .eval-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .icon { font-size: 3em; margin-bottom: 15px; }
        h1 { color: #06b6d4; font-size: 2em; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; }

        .info-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .info-box h3 { color: #06b6d4; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
        .info-item { text-align: center; }
        .info-item .value { font-size: 1.5em; color: #06b6d4; font-weight: bold; }
        .info-item .label { font-size: 0.85em; color: #64748b; }

        .progress-bar { height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #8b5cf6); transition: width 0.5s; }

        .question-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .question-card.answered { border-color: #06b6d4; }
        .question-card.correct { border-color: #22c55e; }
        .question-card.incorrect { border-color: #ef4444; }

        .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .question-number { background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; }
        .question-category { font-size: 0.8em; color: #64748b; }
        .question-text { font-size: 1.1em; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 15px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover:not(.disabled) { border-color: #06b6d4; }
        .option.selected { border-color: #06b6d4; background: rgba(6, 182, 212, 0.1); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .option.disabled { cursor: default; opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #22c55e; }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .results-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid #8b5cf6;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            display: none;
        }
        .results-card.show { display: block; }
        .score-display { font-size: 4em; color: #06b6d4; font-weight: bold; margin: 20px 0; }
        .score-display.pass { color: #22c55e; }
        .score-display.fail { color: #ef4444; }
        .results-message { font-size: 1.2em; margin-bottom: 20px; }

        .back-link { display: inline-block; margin-top: 20px; color: #06b6d4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <a href="../../../index.html">House of Eye</a>
            <span>/</span>
            <a href="../../../modules/cyberops/index.html">CyberOps</a>
            <span>/</span>
            <a href="index.html">Week 7</a>
            <span>/</span>
            <span>Evaluation</span>
        </nav>

        <header>
            <span class="eval-badge">📝 ASSESSMENT</span>
            <div class="icon">🚨🔬</div>
            <h1>Week 7 Evaluation</h1>
            <p class="subtitle">Incident Response Capstone</p>
        </header>

        <div class="info-box">
            <h3>Assessment Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="value">10</div>
                    <div class="label">Questions</div>
                </div>
                <div class="info-item">
                    <div class="value">70%</div>
                    <div class="label">Passing Score</div>
                </div>
                <div class="info-item">
                    <div class="value" id="currentScore">0</div>
                    <div class="label">Your Score</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be populated by JavaScript -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" id="submitBtn" onclick="submitEvaluation()" disabled>Submit Evaluation</button>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Evaluation Complete!</h2>
            <div class="score-display" id="finalScore">0%</div>
            <p class="results-message" id="resultsMessage"></p>
            <button class="btn" onclick="location.reload()">Retake Evaluation</button>
            <a href="index.html" class="back-link">← Back to Week 7</a>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                category: "Snort IDS",
                question: "What does the 'content' keyword in a Snort rule specify?",
                options: [
                    "The type of packet (TCP/UDP)",
                    "The payload data to match",
                    "The source IP address",
                    "The alert priority level"
                ],
                correct: 1,
                feedback: "The 'content' keyword specifies payload data patterns to match, like content:\"GET /admin\"."
            },
            {
                id: 2,
                category: "PCAP Forensics",
                question: "When analyzing a PCAP file, what indicates data exfiltration?",
                options: [
                    "Large outbound data transfers to unknown external IPs",
                    "Normal DNS queries",
                    "Inbound HTTP requests",
                    "ICMP ping responses"
                ],
                correct: 0,
                feedback: "Unusually large outbound transfers, especially to unknown IPs or unusual ports, suggest data exfiltration."
            },
            {
                id: 3,
                category: "MITRE ATT&CK",
                question: "What MITRE ATT&CK tactic does 'lateral movement' fall under?",
                options: [
                    "Initial Access",
                    "Persistence",
                    "Lateral Movement (it's a tactic)",
                    "Exfiltration"
                ],
                correct: 2,
                feedback: "Lateral Movement is one of the 14 tactics in the MITRE ATT&CK framework, describing how attackers move through networks."
            },
            {
                id: 4,
                category: "Incident Handling",
                question: "What should happen FIRST during the containment phase?",
                options: [
                    "Delete all malware files",
                    "Reboot affected systems",
                    "Isolate affected systems to prevent spread",
                    "Interview all employees"
                ],
                correct: 2,
                feedback: "Short-term containment involves isolating affected systems to prevent the incident from spreading."
            },
            {
                id: 5,
                category: "Log Correlation",
                question: "Why is time synchronization critical in log correlation?",
                options: [
                    "To save disk space",
                    "To build accurate attack timelines across multiple sources",
                    "To improve log compression",
                    "To reduce false positives"
                ],
                correct: 1,
                feedback: "Accurate timestamps (via NTP) are essential for correlating events across multiple systems and building attack timelines."
            },
            {
                id: 6,
                category: "Memory Forensics",
                question: "What tool is commonly used for analyzing Windows memory dumps?",
                options: [
                    "Wireshark",
                    "Volatility",
                    "Nmap",
                    "Burp Suite"
                ],
                correct: 1,
                feedback: "Volatility is the industry-standard open-source framework for memory forensics analysis."
            },
            {
                id: 7,
                category: "Network Forensics",
                question: "What technique do attackers use to move between systems in a compromised network?",
                options: [
                    "Port scanning",
                    "Lateral movement",
                    "SQL injection",
                    "Social engineering"
                ],
                correct: 1,
                feedback: "Lateral movement is the technique of pivoting from one compromised system to others in the network."
            },
            {
                id: 8,
                category: "Chain of Custody",
                question: "Why must digital evidence maintain a documented chain of custody?",
                options: [
                    "To ensure legal admissibility in court",
                    "To compress the evidence",
                    "To make it easier to search",
                    "To automatically detect malware"
                ],
                correct: 0,
                feedback: "Chain of custody documentation proves evidence wasn't tampered with, making it legally admissible."
            },
            {
                id: 9,
                category: "Threat Actor Profiling",
                question: "What does TTP stand for in threat intelligence?",
                options: [
                    "Time To Patch",
                    "Tactics, Techniques, and Procedures",
                    "Threat Transmission Protocol",
                    "Target, Track, Prosecute"
                ],
                correct: 1,
                feedback: "TTPs (Tactics, Techniques, and Procedures) describe how threat actors operate and are tracked in frameworks like MITRE ATT&CK."
            },
            {
                id: 10,
                category: "Incident Handling",
                question: "What is the purpose of the 'Lessons Learned' phase in incident response?",
                options: [
                    "To punish employees for mistakes",
                    "To improve future incident response capabilities",
                    "To delete all incident records",
                    "To restore backups"
                ],
                correct: 1,
                feedback: "Post-incident review identifies improvements for detection, response processes, and security controls."
            }
        ];

        let answered = 0;
        let correct = 0;

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `
                    <div class="question-card" id="q${q.id}">
                        <div class="question-header">
                            <span class="question-number">Question ${idx + 1}</span>
                            <span class="question-category">${q.category}</span>
                        </div>
                        <p class="question-text">${q.question}</p>
                        <div class="options">
                            ${q.options.map((opt, i) => `
                                <div class="option" onclick="selectOption(${q.id}, ${i})" data-question="${q.id}" data-option="${i}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="feedback" id="feedback${q.id}"></div>
                    </div>
                `;
            });
        }

        function selectOption(questionId, optionIndex) {
            const card = document.getElementById(`q${questionId}`);
            if (card.classList.contains('answered')) return;

            const options = card.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === optionIndex) opt.classList.add('selected');
            });

            card.classList.add('answered');
            answered++;

            const question = questions.find(q => q.id === questionId);
            const isCorrect = optionIndex === question.correct;

            if (isCorrect) {
                correct++;
                options[optionIndex].classList.add('correct');
                card.classList.add('correct');
            } else {
                options[optionIndex].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                card.classList.add('incorrect');
            }

            const feedback = document.getElementById(`feedback${questionId}`);
            feedback.textContent = question.feedback;
            feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');

            options.forEach(opt => opt.classList.add('disabled'));

            updateProgress();

            if (answered === questions.length) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function updateProgress() {
            const percent = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentScore').textContent = correct + '/' + answered;
        }

        function submitEvaluation() {
            const percent = Math.round((correct / questions.length) * 100);
            const passed = percent >= 70;

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.querySelector('.info-box').style.display = 'none';

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const finalScore = document.getElementById('finalScore');
            finalScore.textContent = percent + '%';
            finalScore.classList.add(passed ? 'pass' : 'fail');

            document.getElementById('resultsMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers. You've demonstrated excellent incident response capabilities.`
                : `You scored ${correct}/${questions.length}. You need 70% to pass. Review the capstone labs and try again.`;

            if (passed) {
                localStorage.setItem('cyberops_week7_evaluation', 'passed');
                if (typeof CompletionStamp !== 'undefined') {
                    CompletionStamp.mark('eye-cyberops-week7-eval', percent);
                }
            }
        }

        renderQuestions();
    </script>
    <script src="../../../../../components/CompletionStamp.js"></script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
