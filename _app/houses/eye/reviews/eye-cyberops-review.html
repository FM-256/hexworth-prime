<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'CyberOps Review',
  storageKey: 'hexworth_review_cyberops',
  houseId: 'eye',
  categories: [
    {
      name: 'SOC Operations',
      questions: [
        { value: 100, question: 'What does SOC stand for in cybersecurity operations?', options: ['System Operations Center','Security Operations Center','Secure Oversight Committee','Server Operations Console'], correct: 1, explanation: 'A Security Operations Center (SOC) is a centralized facility where a team of security analysts monitors, detects, investigates, and responds to cyber threats 24/7.' },
        { value: 200, question: 'In a typical SOC structure, which tier is responsible for initial alert triage and escalation?', options: ['Tier 3 - Threat Hunter','Tier 2 - Incident Responder','Tier 1 - Alert Analyst','SOC Manager'], correct: 2, explanation: 'Tier 1 analysts perform initial triage of security alerts, determine if they are true or false positives, and escalate confirmed incidents to Tier 2 for deeper investigation.' },
        { value: 300, question: 'A SOC analyst notices that the same alert has been triggered 500 times in the last hour from a single internal host scanning sequential ports. How should this be classified?', options: ['False positive from a vulnerability scanner','Confirmed reconnaissance activity requiring escalation','Normal network behavior','A misconfigured firewall rule'], correct: 1, explanation: 'Sequential port scanning from an internal host is a strong indicator of reconnaissance activity, potentially from a compromised host. This should be escalated to Tier 2 for investigation, after confirming it is not an authorized vulnerability scan.' },
        { value: 400, question: 'Which SOC metric measures the average time from when a security incident is detected to when the SOC team begins active investigation?', options: ['Mean Time to Detect (MTTD)','Mean Time to Respond (MTTR)','Mean Time to Acknowledge (MTTA)','Mean Time to Contain (MTTC)'], correct: 2, explanation: 'Mean Time to Acknowledge (MTTA) measures the gap between alert generation and the start of active investigation. MTTD measures detection time, MTTR measures full response/resolution time, and MTTC measures containment time.' },
        { value: 500, question: 'A SOC team is building a detection use case for lateral movement via Pass-the-Hash attacks. Which combination of data sources and detection logic provides the highest fidelity detection?', options: ['Firewall logs monitoring for unusual port usage between workstations','Windows Security Event ID 4624 Type 3 logins with NTLM authentication where the source is a workstation, correlated with anomalous SMB traffic patterns','Antivirus alerts for Mimikatz signatures on endpoints','NetFlow data showing increased east-west traffic volumes'], correct: 1, explanation: 'Pass-the-Hash manifests as Type 3 (network) logons using NTLM authentication where the source is a workstation rather than a server. Correlating these events with anomalous SMB traffic patterns provides high-fidelity detection while accounting for the NTLM hash-based authentication mechanism.' }
      ]
    },
    {
      name: 'Incident Response',
      questions: [
        { value: 100, question: 'According to the NIST Incident Response framework, what are the four phases of incident response?', options: ['Detect, Analyze, Contain, Recover','Preparation, Detection & Analysis, Containment Eradication & Recovery, Post-Incident Activity','Identify, Protect, Detect, Respond','Plan, Respond, Investigate, Close'], correct: 1, explanation: 'The NIST SP 800-61 framework defines four phases: Preparation; Detection and Analysis; Containment, Eradication, and Recovery; and Post-Incident Activity (lessons learned).' },
        { value: 200, question: 'During an active ransomware incident, what is the FIRST containment action a responder should take?', options: ['Pay the ransom immediately','Reboot all affected systems','Isolate affected systems from the network','Format and reimage all workstations'], correct: 2, explanation: 'Network isolation prevents the ransomware from spreading to other systems. Rebooting may trigger additional encryption, and reimaging destroys forensic evidence. Payment is never recommended as a first action.' },
        { value: 300, question: 'An incident responder needs to preserve evidence from a compromised Linux server. Which order of volatility is correct from most to least volatile?', options: ['Disk > Memory > Network connections > Running processes','Running processes > Network connections > Memory > Disk','Memory > Running processes > Network connections > Disk','CPU registers > Memory > Network state > Disk'], correct: 3, explanation: 'The order of volatility from most to least volatile is: CPU registers/cache, memory (RAM), network state/connections, running processes, disk storage, removable media, and printouts. Evidence should be collected starting with the most volatile.' },
        { value: 400, question: 'A company experiences a data breach. The IR team discovers that the attacker maintained persistence through a scheduled task that executes a PowerShell download cradle. After removing the scheduled task, what critical eradication step is often missed?', options: ['Changing the wallpaper to indicate a clean system','Checking for additional persistence mechanisms such as registry run keys, WMI event subscriptions, and startup folder entries','Rebooting the server to clear memory','Notifying the attacker that they have been discovered'], correct: 1, explanation: 'Sophisticated attackers typically establish multiple persistence mechanisms. Removing only the discovered one leaves the attacker with backup access. A thorough eradication phase checks all common persistence locations: registry run keys, WMI subscriptions, services, startup folders, and DLL hijacking paths.' },
        { value: 500, question: 'During post-incident analysis of a supply chain compromise, the IR team discovers that the initial access was through a trojanized software update that passed hash verification because the vendor signing key was compromised. What systemic improvement addresses this class of attack?', options: ['Blocking all software updates from external vendors','Implementing application allowlisting based on file hash only','Deploying a zero-trust architecture with runtime behavioral analysis, independent build verification, and software bill of materials (SBOM) validation','Increasing the frequency of vulnerability scans'], correct: 2, explanation: 'Supply chain attacks bypass traditional hash and signature verification because the compromised package is signed with legitimate keys. A defense-in-depth approach requires runtime behavioral analysis to detect anomalous post-update activity, independent build verification to detect tampering, and SBOM validation for dependency integrity.' }
      ]
    },
    {
      name: 'Log Analysis',
      questions: [
        { value: 100, question: 'Which Windows Event Log channel contains security-related events such as logon attempts and object access?', options: ['System','Application','Security','Setup'], correct: 2, explanation: 'The Windows Security event log records security-relevant events including authentication attempts (Event ID 4624/4625), privilege use, object access, and policy changes.' },
        { value: 200, question: 'A SIEM alert fires on multiple failed SSH login attempts from a single IP address to several servers. Which log source would provide the most detail about these attempts on a Linux system?', options: ['/var/log/syslog only','/var/log/auth.log or /var/log/secure','/var/log/kern.log','/var/log/boot.log'], correct: 1, explanation: 'On Debian-based systems, /var/log/auth.log captures authentication events. On RHEL-based systems, /var/log/secure serves the same purpose. Both record SSH login attempts including the source IP, username, and authentication method.' },
        { value: 300, question: 'An analyst reviewing web server access logs notices the following pattern in multiple requests: /search?q=1\' OR \'1\'=\'1. What type of attack does this indicate?', options: ['Cross-Site Scripting (XSS)','SQL Injection','Directory Traversal','Command Injection'], correct: 1, explanation: 'The pattern 1\' OR \'1\'=\'1 is a classic SQL injection attempt. The attacker is trying to manipulate the SQL query by injecting a condition that always evaluates to true, potentially bypassing authentication or extracting data.' },
        { value: 400, question: 'A syslog server receives logs from 200 devices but timestamps are inconsistent, making event correlation unreliable. Some logs show events happening in the future. What infrastructure component resolves this?', options: ['A log aggregation proxy that rewrites timestamps','NTP (Network Time Protocol) synchronization across all devices','A SIEM with auto-correction for time skew','Increasing the syslog buffer size on the server'], correct: 1, explanation: 'NTP synchronization ensures all network devices maintain accurate, consistent time. Without NTP, each device\'s clock drifts independently, making cross-device event correlation unreliable or impossible. This is a fundamental requirement for any logging infrastructure.' },
        { value: 500, question: 'An analyst identifies a pattern in DNS query logs: a compromised host is making thousands of DNS TXT record queries to random-looking subdomains of a single external domain, with encoded data in the subdomain labels. What technique is this, and what is the primary challenge in detecting it at scale?', options: ['DNS amplification attack; challenge is volume of traffic','DNS tunneling for data exfiltration; challenge is distinguishing it from legitimate DNS traffic like CDN lookups and DNSBL queries','DNS cache poisoning; challenge is encrypted DNS responses','DNS rebinding; challenge is tracking ephemeral domain bindings'], correct: 1, explanation: 'DNS tunneling encodes data in subdomain labels of DNS queries to exfiltrate data or establish C2 channels. Detection at scale is challenging because legitimate services also generate high volumes of DNS queries with encoded subdomains (CDNs, anti-spam DNSBL lookups, cloud services). Effective detection requires statistical analysis of query entropy, label length distribution, and query frequency per domain.' }
      ]
    },
    {
      name: 'Threat Intelligence',
      questions: [
        { value: 100, question: 'What is an Indicator of Compromise (IoC)?', options: ['A vulnerability rating score','An artifact or piece of evidence that indicates a system may have been breached','A firewall rule that blocks malicious traffic','A security policy document'], correct: 1, explanation: 'Indicators of Compromise (IoCs) are forensic artifacts such as file hashes, IP addresses, domain names, or registry keys that indicate potential malicious activity on a system or network.' },
        { value: 200, question: 'Which threat intelligence sharing standard uses JSON format and defines objects like "attack-pattern," "malware," and "threat-actor"?', options: ['OpenIOC','TAXII','STIX','CVE'], correct: 2, explanation: 'STIX (Structured Threat Information Expression) is a standardized language using JSON to describe cyber threat information including threat actors, campaigns, attack patterns, malware, and relationships between them.' },
        { value: 300, question: 'An analyst receives a threat intelligence report containing a list of file hashes associated with a new ransomware variant. At which level of the Pyramid of Pain does this indicator sit, and why might it be insufficient as a sole detection mechanism?', options: ['Top of the pyramid (TTPs); very difficult for attackers to change','Bottom of the pyramid (Hash Values); trivially changed by recompiling with minor modifications','Middle of the pyramid (Domain Names); requires infrastructure changes','Middle of the pyramid (Network Artifacts); moderately difficult to modify'], correct: 1, explanation: 'Hash values sit at the bottom of David Bianco\'s Pyramid of Pain because attackers can trivially change them by modifying a single byte, recompiling, or using polymorphic techniques. While useful for known-sample detection, they provide no protection against variants.' },
        { value: 400, question: 'A threat intelligence team maps a recent attack to the MITRE ATT&CK framework and identifies the techniques as T1566.001 (Spearphishing Attachment), T1059.001 (PowerShell), and T1048.003 (Exfiltration Over Unencrypted Non-C2 Protocol). What tactical advantage does this mapping provide to the defending SOC?', options: ['It allows the SOC to predict the exact time of the next attack','It enables the SOC to build specific detection rules targeting each technique and identify gaps in their detection coverage','It automatically blocks all future attacks using these techniques','It replaces the need for endpoint detection and response tools'], correct: 1, explanation: 'MITRE ATT&CK mapping transforms raw threat intelligence into actionable detection engineering. The SOC can build specific detection rules for each technique (e.g., monitoring for macro-launched PowerShell, DNS exfiltration patterns) and identify coverage gaps in their current detection capabilities.' },
        { value: 500, question: 'An APT group known for targeting defense contractors has been attributed to a nation-state actor. Intelligence suggests they are shifting from spearphishing to supply chain compromise via trojanized development tools. Which intelligence-driven defensive strategy best addresses this evolving threat?', options: ['Block all emails from external senders to prevent phishing','Deploy threat hunting operations focused on developer workstation behavioral baselines, software build pipeline integrity monitoring, and runtime analysis of development tool updates','Increase the frequency of penetration testing engagements','Add the APT group IP addresses to the firewall blocklist'], correct: 1, explanation: 'As the threat actor shifts TTPs from phishing to supply chain compromise, static indicators become less useful. Proactive threat hunting focused on developer environments, build pipeline integrity (comparing build artifacts against expected baselines), and behavioral analysis of development tools provides detection capability against this evolving methodology.' }
      ]
    },
    {
      name: 'Security Monitoring',
      questions: [
        { value: 100, question: 'What type of security tool combines log management, event correlation, and real-time alerting into a single platform?', options: ['IDS','Firewall','SIEM','Antivirus'], correct: 2, explanation: 'A Security Information and Event Management (SIEM) system collects and aggregates log data from across the infrastructure, correlates events using rules and analytics, and generates alerts for potential security incidents.' },
        { value: 200, question: 'An IDS generates an alert for a SQL injection attack, but investigation reveals the traffic was from an authorized vulnerability scanner. What is this type of alert called?', options: ['True positive','True negative','False positive','False negative'], correct: 2, explanation: 'A false positive occurs when the detection system correctly identifies the traffic pattern as matching an attack signature but the activity is actually benign or authorized. Tuning rules to account for known scanners reduces false positives.' },
        { value: 300, question: 'A network-based IDS is deployed in a span/mirror port configuration but is missing traffic from certain VLANs. What is the most likely cause?', options: ['The IDS sensor NIC is in promiscuous mode','The span port is only configured to mirror specific VLANs, not all VLANs carrying relevant traffic','The IDS does not support the network protocol in use','The IDS needs a firmware update'], correct: 1, explanation: 'SPAN/mirror port configurations must explicitly specify which VLANs or interfaces to mirror. If certain VLANs are not included in the SPAN session configuration, traffic from those VLANs will not be forwarded to the IDS sensor.' },
        { value: 400, question: 'An organization implements NetFlow collection for security monitoring. Compared to full packet capture (PCAP), what is the primary trade-off?', options: ['NetFlow provides more detail than PCAP but uses more storage','NetFlow provides metadata (source, destination, ports, byte counts, timing) but lacks payload content, reducing storage needs while limiting deep packet inspection capability','NetFlow is only available on Cisco equipment','NetFlow and PCAP provide identical information'], correct: 1, explanation: 'NetFlow records flow metadata (5-tuple, timestamps, byte/packet counts) without capturing packet payloads. This dramatically reduces storage requirements and is excellent for traffic pattern analysis, but cannot be used for content inspection, signature matching on payload, or session reconstruction.' },
        { value: 500, question: 'A large enterprise SOC processes 50,000 alerts per day with only 15 analysts. After analysis, 98% of alerts are false positives. What combination of strategies would most effectively reduce alert fatigue while maintaining detection capability?', options: ['Hire more analysts to handle the volume','Disable all but the highest-severity detection rules','Implement SOAR playbooks for automated triage, deploy machine learning-based alert scoring and grouping, and conduct regular detection rule tuning based on false positive feedback loops','Switch from signature-based to anomaly-based detection only'], correct: 2, explanation: 'Alert fatigue is addressed through a multi-pronged approach: SOAR automates repetitive triage tasks, ML-based scoring prioritizes alerts by likelihood of being true positives, alert grouping clusters related alerts into single incidents, and feedback-driven rule tuning eliminates persistent false positive sources while preserving detection coverage.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'CyberOps Synthesis',
    question: 'A SOC analyst observes the following chain of events: (1) A user receives a phishing email with a macro-enabled document, (2) Sysmon Event ID 1 shows winword.exe spawning cmd.exe, (3) cmd.exe launches a base64-encoded PowerShell command, (4) The PowerShell process establishes a connection to an external IP on port 443, (5) Hours later, large volumes of DNS TXT queries are observed from the same host. Mapping this to the Cyber Kill Chain, which phase is represented by step 5?',
    options: [
      'Reconnaissance',
      'Weaponization',
      'Command and Control',
      'Actions on Objectives (Exfiltration)'
    ],
    correct: 3,
    explanation: 'Step 5 represents Actions on Objectives, specifically data exfiltration via DNS tunneling. The preceding steps map to Delivery (phishing email), Exploitation (macro execution), Installation (PowerShell payload), and C2 (HTTPS callback). The DNS TXT queries with encoded data indicate the attacker is exfiltrating stolen data using DNS as a covert channel.'
  },
  onComplete: function(results) {
  }
});
</script>
