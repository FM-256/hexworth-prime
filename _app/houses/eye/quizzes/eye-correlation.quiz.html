<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Correlation Quiz - Eye House - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b2e 0%, #2d2145 50%, #1e1b2e 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #c084fc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #d8b4fe; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Eye House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Log Correlation Quiz',
            description: 'Test Your Security Event Correlation Knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'log-correlation',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "What is the primary purpose of log correlation in security analysis?",
                    options: [
                        "To reduce the total number of logs stored in the SIEM",
                        "To link related events from multiple sources to detect patterns and attacks",
                        "To automatically delete duplicate log entries",
                        "To convert all logs to the same format"
                    ],explanation: "Log correlation is the process of analyzing and linking related events from multiple log sources to identify patterns, detect security incidents, and reconstruct attack timelines. Single events often lack context, but when correlated with related events, they reveal the complete picture of an attack."
                },
                {
                    question: "Which correlation rule syntax would best detect a successful brute force attack?",
                    options: [
                        "IF (failed_login) THEN alert",
                        "IF COUNT(failed_login) > 5 WHERE source_ip = SAME FOLLOWED BY successful_login WHERE source_ip = SAME WITHIN 10 minutes",
                        "IF successful_login THEN check for failed_logins",
                        "IF COUNT(any_login) > 100 THEN alert"
                    ],explanation: "A successful brute force detection requires: COUNT threshold (multiple failed attempts >5), Same source (all from the same IP address), Sequential logic (failures FOLLOWED BY success), and Time window (within a reasonable timeframe like 10 minutes). This rule captures the complete attack pattern: many failures leading to eventual success."
                },
                {
                    question: "You're investigating lateral movement. Which log sources should you correlate to track an attacker's movement across systems?",
                    options: [
                        "Only authentication logs",
                        "Only network firewall logs",
                        "Authentication logs, network logs, endpoint EDR logs, and process execution logs",
                        "Only email gateway logs"
                    ],explanation: "Detecting lateral movement requires multi-source correlation: Authentication logs show login attempts and successes on different systems, Network logs reveal connections between systems (SMB, RDP, SSH), Endpoint EDR logs show process execution and post-compromise activities, and Process execution logs identify tools used for lateral movement (PsExec, WMI, PowerShell remoting)."
                },
                {
                    question: "What is the most appropriate correlation time window for detecting a rapid brute force attack?",
                    options: [
                        "1 second",
                        "5-10 minutes",
                        "24 hours",
                        "7 days"
                    ],explanation: "5-10 minutes is optimal because it catches fast automated attacks (seconds to minutes), catches slower manual attempts (up to 10 minutes), and avoids false positives from legitimate user behavior over hours/days. Different attacks need different windows - APT campaigns might require days/weeks, while DDoS detection needs seconds."
                },
                {
                    question: "In MITRE ATT&CK kill chain mapping, which tactic comes immediately after \"Initial Access\"?",
                    options: [
                        "Impact",
                        "Execution",
                        "Lateral Movement",
                        "Exfiltration"
                    ],explanation: "After Initial Access, Execution is next because the attacker has gained entry but needs to run code. Execution enables all subsequent tactics. Example: Phishing email (Initial Access) then User runs malicious attachment (Execution). The full order is: Reconnaissance, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, C2, Exfiltration, Impact."
                },
                {
                    question: "You notice a user's data transfer volume is 295 standard deviations above their baseline. What does this indicate?",
                    options: [
                        "Normal activity - users' behavior varies",
                        "Statistically impossible for legitimate activity - investigate immediately",
                        "The user is probably downloading a large software update",
                        "Your baseline calculation is incorrect"
                    ],explanation: "295 standard deviations is statistically impossible for legitimate activity. At 3 standard deviations, 99.7% of normal data falls within range. At 6 standard deviations, it's 1 in 506 million events. At 295 standard deviations, this is definitively anomalous. Real-world example: User baseline of 35 MB/day with 8 MB std dev, but today transferred 2,400 MB. Calculation: (2400-35)/8 = 295 standard deviations. Conclusion: Data exfiltration attack in progress."
                },
                {
                    question: "What is the main challenge when correlating logs from systems in different time zones?",
                    options: [
                        "Different log formats",
                        "Events appear out of chronological order without time normalization",
                        "Different languages in log messages",
                        "Incompatible log storage systems"
                    ],explanation: "Time zone differences break chronological correlation. Without normalization, events from different zones appear out of order, making attack reconstruction impossible. Best practices: Always normalize to UTC before correlation, ensure all systems use NTP for time synchronization, store original timezone information for reporting, and account for clock drift."
                },
                {
                    question: "Which correlation technique would be most effective for tracking an insider threat where an employee is stealing data before leaving the company?",
                    options: [
                        "IP-based correlation only",
                        "User-based correlation with baseline deviation detection",
                        "Time-based correlation only",
                        "Session-based correlation only"
                    ],explanation: "Insider threats require user-centric analysis because insiders use legitimate credentials from legitimate IPs. The suspicious activity is deviation from normal behavior. You need to track all user activities across systems and compare current behavior against historical baseline. Key indicators: increased file downloads, accessing files never accessed before, email forwarding to personal accounts, USB device connections, and off-hours activity."
                },
                {
                    question: "When building a timeline for incident response, what is the most critical first step?",
                    options: [
                        "Immediately block all suspicious IPs",
                        "Normalize all timestamps to a common timezone (UTC)",
                        "Delete duplicate log entries",
                        "Focus only on the most recent logs"
                    ],explanation: "Time normalization must be the first step in timeline reconstruction. Without it, events from different time zones appear in wrong order, making the attack narrative nonsensical. The process is: (1) Time Normalization - convert all timestamps to UTC, (2) Event Collection - gather relevant logs, (3) Event Sequencing - sort chronologically, (4) Gap Analysis - identify missing events, (5) Narrative Construction - build attack story."
                },
                {
                    question: "A correlation rule generates too many false positives. What is the BEST way to reduce false positives while maintaining detection capability?",
                    options: [
                        "Disable the correlation rule completely",
                        "Add more specific conditions and context (whitelist trusted IPs, increase thresholds, add AND conditions)",
                        "Increase the alert threshold to maximum value",
                        "Ignore all alerts from this rule"
                    ],explanation: "Effective rule tuning requires balance. Strategies include: adding whitelists to exclude known-good IPs/users, increasing thresholds to require more evidence, adding more AND conditions to require multiple indicators, incorporating context like threat intel and GeoIP, and adjusting time windows. Disabling rules creates blind spots, setting thresholds too high misses real attacks, and ignoring alerts defeats the purpose of monitoring."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
