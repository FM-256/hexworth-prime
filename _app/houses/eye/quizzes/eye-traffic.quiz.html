<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Eye House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Network Traffic Analysis Quiz',
            description: 'Test Your Packet Analysis Knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'network-traffic',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "Which Wireshark display filter would show only HTTP POST requests containing the string \"password\"?",
                    options: [
                        "http.request.method == POST && http contains \"password\"",
                        "http.method == \"POST\" and contains \"password\"",
                        "tcp.port == 80 && data contains \"password\"",
                        "http.post && string == \"password\""
                    ],explanation: "The proper Wireshark filter syntax is: http.request.method == POST && http contains \"password\". http.request.method == POST filters for POST requests (note: no quotes around POST), http contains \"password\" searches the HTTP payload for the string, and && is the logical AND operator in Wireshark display filters."
                },
                {
                    question: "You observe the following TCP flags in sequential packets from the same source: SYN, SYN, SYN, SYN to different destination ports. What type of scan is this?",
                    options: [
                        "TCP Connect scan (full three-way handshake)",
                        "TCP SYN scan (half-open scan)",
                        "TCP FIN scan (stealth scan)",
                        "TCP NULL scan (no flags set)"
                    ],explanation: "Multiple SYN packets to different ports indicates a TCP SYN scan (half-open scan). SYN scans send only SYN packets to probe ports. If port is open: target responds with SYN-ACK, scanner sends RST (doesn't complete handshake). If port is closed: target responds with RST. This is the most common scanning technique (default in Nmap)."
                },
                {
                    question: "A DNS query for \"aG93ZHlwYXJ0bmVy.c2VjcmV0ZGF0YQ.exfil.evil.com\" is detected. What attack technique does this likely represent?",
                    options: [
                        "DNS cache poisoning",
                        "DNS amplification DDoS",
                        "DNS tunneling / data exfiltration",
                        "DNS hijacking"
                    ],explanation: "This is DNS tunneling - using DNS queries to exfiltrate data. The subdomain contains base64-encoded data. Attackers encode data in subdomain labels to bypass firewalls. Long, random-looking subdomains are a key indicator. DNS is often allowed outbound, making it attractive for exfiltration. Detection indicators: Query length > 50 characters, high entropy/randomness in subdomains, unusual DNS record types (TXT, NULL), and high volume of queries to same base domain."
                },
                {
                    question: "What is the primary advantage of NetFlow over full packet capture (PCAP) for long-term network monitoring?",
                    options: [
                        "NetFlow provides complete payload inspection",
                        "NetFlow is significantly smaller (1-2% of PCAP size), enabling longer retention",
                        "NetFlow can decrypt TLS traffic",
                        "NetFlow captures more detailed protocol information than PCAP"
                    ],explanation: "NetFlow's primary advantage is storage efficiency - it's only 1-2% the size of full packet capture. NetFlow captures metadata (IPs, ports, byte/packet counts, timestamps) while PCAP captures everything (headers + payloads). 1 Gbps link = ~450 GB/hour of PCAP vs ~4.5 GB/hour of NetFlow. This enables 30-90 day retention vs 7-14 days for PCAP. Tradeoff: NetFlow lacks payload data."
                },
                {
                    question: "You observe connections from 192.168.1.50 to the following IPs on port 445 within 30 seconds: .51, .52, .53, .54, .55 (all in sequential order). What threat activity does this indicate?",
                    options: [
                        "Normal file sharing activity",
                        "SMB lateral movement / worm propagation",
                        "DNS resolution",
                        "DHCP address assignment"
                    ],explanation: "This pattern indicates SMB lateral movement or worm propagation. Port 445 is SMB (Server Message Block) - Windows file sharing protocol. Sequential IPs indicate scanning/connecting to multiple hosts in order. Rapid timing (5 hosts in 30 seconds) is automated, not manual. This is how ransomware like WannaCry and NotPetya spread across networks."
                },
                {
                    question: "What is a JA3 fingerprint used for in network traffic analysis?",
                    options: [
                        "Identifying users based on their browsing patterns",
                        "Fingerprinting TLS clients to identify applications/malware despite encryption",
                        "Decrypting HTTPS traffic",
                        "Measuring network latency"
                    ],explanation: "JA3 creates a fingerprint of TLS/SSL client behavior to identify applications even when traffic is encrypted. It works by hashing TLS client hello parameters (version, ciphers, extensions, curves), resulting in a unique MD5 hash that identifies the client application. Different apps (Chrome, malware, Metasploit) have different TLS fingerprints. Security uses: Detect known malware families, identify unauthorized applications (Tor, proxies, hacking tools), and hunt for anomalous TLS clients."
                },
                {
                    question: "A workstation generates HTTP requests with the User-Agent \"python-requests/2.28.0\" to multiple external IPs. What does this likely indicate?",
                    options: [
                        "Normal web browsing activity",
                        "Automated script/malware activity (Python-based tool or C2)",
                        "Mobile device synchronization",
                        "Printer configuration"
                    ],explanation: "The \"python-requests/2.28.0\" User-Agent indicates automated Python script activity, likely malicious. python-requests is a Python HTTP library used by scripts, not browsers. Normal users browse with Chrome, Firefox, Edge, Safari user-agents. Workstations shouldn't run automated Python scripts unless it's a developer machine. Possible scenarios: Malware beacon, data exfiltration script, reconnaissance/scanning tool, or compromised system running attacker's Python payload."
                },
                {
                    question: "In Wireshark, you want to follow a TCP stream to reconstruct an HTTP conversation. What is the correct method?",
                    options: [
                        "Statistics \u2192 Protocol Hierarchy",
                        "Right-click packet \u2192 Follow \u2192 TCP Stream",
                        "File \u2192 Export Objects \u2192 HTTP",
                        "Edit \u2192 Find Packet"
                    ],explanation: "To reconstruct a TCP conversation: Right-click any packet in the stream, then Follow, then TCP Stream. Wireshark reassembles all packets in that TCP conversation, shows client and server data in a readable format, and color-codes client (red) vs server (blue) data. Essential for reading cleartext protocols (HTTP, FTP, Telnet, SMTP)."
                },
                {
                    question: "You detect regular traffic from 10.0.5.25 to 198.51.100.77:8443 every 60 seconds with consistent 128-byte payload sizes. What type of malicious activity does this pattern suggest?",
                    options: [
                        "DDoS attack",
                        "C2 beaconing",
                        "SQL injection",
                        "ARP spoofing"
                    ],explanation: "Regular intervals + consistent payload size = classic C2 beaconing pattern. Beaconing is when malware checks in with command server at regular intervals. 60-second interval is extremely consistent timing (not human behavior). 128 bytes is a fixed size suggesting automated heartbeat/status update. Port 8443 is a non-standard HTTPS port often used by malware to evade detection. Response: Isolate 10.0.5.25, block 198.51.100.77, investigate for malware."
                },
                {
                    question: "Which of the following is the MOST reliable Indicator of Compromise (IOC) for long-term threat detection?",
                    options: [
                        "IP address (e.g., 203.0.113.45)",
                        "File hash (e.g., MD5: d41d8cd98f00b204e9800998ecf8427e)",
                        "Network behavioral pattern (e.g., beaconing every 60 seconds)",
                        "Domain name (e.g., malware.evil.com)"
                    ],explanation: "Behavioral patterns are the most reliable long-term IOCs because they're hardest for attackers to change. IOC Pyramid (from least to most reliable): IP addresses (worst - easily changed via proxies), Domain names (easily rotated via DGA), File hashes (single byte change = new hash), Behavioral patterns (best - beaconing intervals, protocol abuse, lateral movement techniques are inherent to how malware operates). Best practice: Use multiple IOC types in layers, with emphasis on behavioral analytics and TTPs."
                }
            ]
        });
        quiz.start();
    </script>
