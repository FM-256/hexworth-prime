    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b2e 0%, #2d2145 50%, #1e1b2e 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #c084fc;

            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #d8b4fe; }
        .brand {

            gap: 8px;
        }

            flex: 1;

        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Eye House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Threat Hunting Quiz',
            description: 'Test Your Proactive Security Knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'eye',
            moduleId: 'threat-hunting',
            serverGrading: true,
            houseId: 'eye',
            trackProgress: true,

            questions: [
                {
                    question: "What is the primary difference between threat hunting and traditional detection?",
                    options: [
                        "Threat hunting uses better tools than detection systems",
                        "Threat hunting is proactive and hypothesis-driven, while detection is reactive and rule-based",
                        "Threat hunting only looks for known threats, detection finds unknown threats",
                        "Threat hunting replaces the need for SIEM and IDS systems"
                    ],explanation: "Threat hunting is proactive and hypothesis-driven \u2014 hunters actively search for threats based on theories about adversary behavior. Traditional detection is reactive and rule-based \u2014 it triggers alerts when known patterns match. Hunting complements detection (doesn't replace it). Hunters often find sophisticated threats that evade automated systems, then operationalize findings into new detection rules."
                },
                {
                    question: "A hunting hypothesis should follow which structure?",
                    options: [
                        "WHO-WHAT-WHEN-WHERE",
                        "IF-AND-THEN-WHERE",
                        "THREAT-VULNERABILITY-IMPACT",
                        "COLLECT-ANALYZE-REPORT"
                    ],explanation: "The IF-AND-THEN-WHERE framework creates testable hunting hypotheses: IF (adversary behavior or technique), AND (environmental condition or opportunity), THEN (observable indicator or artifact), WHERE (specific data source or location). Example: IF an attacker has initial access AND wants persistence THEN they may create scheduled tasks WHERE we see Event ID 4698."
                },
                {
                    question: "In the context of MITRE ATT&CK, what is the relationship between tactics and techniques?",
                    options: [
                        "Tactics are specific tools, techniques are general methods",
                        "Tactics are the \"why\" (adversary goals), techniques are the \"how\" (methods to achieve goals)",
                        "Tactics are defensive measures, techniques are offensive actions",
                        "They are synonyms and can be used interchangeably"
                    ],explanation: "Tactics represent the adversary's objective (the \"why\"): Persistence, Credential Access, Lateral Movement, etc. Techniques represent the methods to achieve those objectives (the \"how\"): Scheduled Tasks (T1053), LSASS Memory Dumping (T1003.001), PsExec (T1021.002). For hunters: Select a tactic (e.g., Persistence), then hunt for all techniques within that tactic to achieve comprehensive coverage."
                },
                {
                    question: "What is the primary purpose of \"stack counting\" in threat hunting?",
                    options: [
                        "To count the number of alerts in the SIEM",
                        "To identify rare or unusual occurrences by frequency analysis",
                        "To organize threat intelligence into categories",
                        "To measure the performance of security tools"
                    ],explanation: "Stack counting is a fundamental hunting technique: count occurrences of items (process names, network connections, etc.) and investigate the outliers. In large environments, legitimate processes occur frequently. Malware, attacker tools, and exploitation artifacts are statistically rare. Example: If 9,990 systems run \"explorer.exe\" but 10 systems run \"exp1orer.exe\" (typosquatting), those 10 are suspicious outliers."
                },
                {
                    question: "Which characteristic is MOST indicative of C2 beaconing?",
                    options: [
                        "High volume of data transfer",
                        "Connections to well-known cloud providers",
                        "Perfectly periodic connection intervals with consistent packet sizes",
                        "Use of HTTPS encryption"
                    ],explanation: "C2 beacons exhibit perfect periodicity (every 60s, 300s, 600s) and consistent packet sizes. Malware \"phones home\" at regular intervals to check for commands. Normal user traffic is irregular in both timing and size \u2014 humans don't browse with mathematical precision. Detection approach: Calculate time deltas between connections, look for low standard deviation in intervals and packet sizes."
                },
                {
                    question: "When hunting for LSASS memory access (credential dumping), which processes accessing lsass.exe are MOST suspicious?",
                    options: [
                        "svchost.exe, wininit.exe, csrss.exe",
                        "powershell.exe, cmd.exe, rundll32.exe",
                        "explorer.exe, taskmgr.exe",
                        "All process access to LSASS is equally suspicious"
                    ],explanation: "Legitimate Windows system processes (svchost, wininit, csrss) routinely access LSASS with limited permissions. This is normal. PowerShell, cmd.exe, rundll32.exe accessing LSASS \u2014 especially with memory-read permissions (0x1410, 0x1FFFFF) \u2014 is highly suspicious. These are \"Living off the Land\" (LOLBin) techniques used by Mimikatz and other credential dumpers. Hunt for: Unusual processes + high-privilege access rights to lsass.exe (Sysmon Event ID 10)."
                },
                {
                    question: "What does \"operationalizing\" a hunt finding mean?",
                    options: [
                        "Writing a detailed report for management",
                        "Converting manual hunt queries into automated detection rules",
                        "Archiving hunt results for compliance",
                        "Sharing findings on social media"
                    ],explanation: "Operationalizing means converting successful manual hunts into automated detection rules that run continuously in your SIEM/EDR. The hunting flywheel: Hunt \u2192 Find Threats \u2192 Create Detections \u2192 Free Up Hunting Time \u2192 Hunt More Advanced Threats \u2192 Improve Detections \u2192 Repeat. Each hunt strengthens defenses."
                },
                {
                    question: "In data-driven hunting, what is \"long-tail analysis\"?",
                    options: [
                        "Analyzing data over extended time periods (months or years)",
                        "Focusing on the rare, one-off events that make up the \"tail\" of frequency distribution",
                        "Following the chain of events from initial access to exfiltration",
                        "Analyzing network packet trailers"
                    ],explanation: "In any large dataset, a small number of items account for the majority of occurrences (the \"head\"), while thousands of unique items appear rarely (the \"tail\"). Long-tail analysis focuses on these rare events. In the top 100 processes, you'll find normal business applications. In the bottom 5% (items with count < 5), you'll find attacker tools, custom malware, and exploitation artifacts. Strategy: Sort by frequency ascending, investigate items with count = 1 or very low counts."
                },
                {
                    question: "Why are Tactics, Techniques, and Procedures (TTPs) more valuable than Indicators of Compromise (IOCs) for hunting?",
                    options: [
                        "TTPs are easier to collect than IOCs",
                        "TTPs describe adversary behavior which is harder to change than specific indicators",
                        "IOCs are only useful for network traffic, not endpoints",
                        "TTPs provide real-time alerts while IOCs are historical"
                    ],explanation: "IOCs (file hashes, IP addresses, domains) are easily changed by attackers. A single character modification produces a different hash. TTPs describe how adversaries operate \u2014 their techniques and procedures. These are harder to change because they require retooling, retraining, and operational shifts. Example: If you hunt for a specific malware hash (IOC), you find only that exact sample. If you hunt for the TTP (scheduled task persistence with encoded PowerShell), you catch variants, custom tools, and future campaigns."
                },
                {
                    question: "A hunt finds no malicious activity. What should the hunter conclude?",
                    options: [
                        "The hunt was a failure and wasted time",
                        "The hypothesis was wrong and should be discarded",
                        "The hunt validated defenses and provided assurance; document findings and methodology",
                        "The data sources were insufficient and should be ignored"
                    ],explanation: "A hunt finding no threats is still valuable. It provides: Validation (confirms your defenses are working against this TTP), Assurance (demonstrates proactive security posture to stakeholders), Documentation (creates a record of what was investigated and ruled out), Learning (improves hunting methodology for future investigations), and Gap Identification (may reveal telemetry gaps to address). Professional hunters document all hunts, regardless of outcome."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
