<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: Software Ethics and IT Impact | Ethics in IT</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #ff00ff;
            --cyan-dim: rgba(255, 0, 255, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--cyan); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--cyan); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 { color: var(--cyan); font-size: 1.4rem; margin-bottom: 1rem; }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 1rem 1.1rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .review-q-num {
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em;
            color: var(--text-muted); margin-bottom: 0.4rem;
            display: flex; align-items: center; gap: 8px;
        }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt {
            padding: 8px 12px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px;
            font-size: 0.86rem; color: var(--text);
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp {
            font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;
            padding: 8px 12px; background: rgba(6, 182, 212, 0.04);
            border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0;
        }
        .review-exp strong { color: var(--cyan); }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Ethics in IT Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 3 Quiz: Software Ethics and IT Impact</h1>
            <p class="subtitle">Ethical decisions in software development and the broader societal impact of IT (Ch. 7-8)</p>
            <div class="meta">
                <span>Chapters 7-8</span>
                <span>10 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 10</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* ── Quiz Engine: Ethics in IT -- Week 3: Software Ethics and IT Impact ──
           Covers Ch. 7 (Ethical Decisions in Software Development) and
           Ch. 8 (The Impact of IT on Society).
           10 questions. Passing threshold: 70% (7/10). */
        /* shuffled-2026-04-28 */
        var questions = [{"q":"A QA engineer discovers a known defect in a medical device's firmware that could cause incorrect dosage calculations in rare conditions. The release date is one week away and fixing the bug would delay it by three months. The project manager pressures the team to ship. The engineer should:","opts":["Disclose the defect to the FDA before the release date without informing management","Escalate the concern formally in writing and refuse to certify the release until the safety-critical defect is resolved","Document the defect and ship on schedule, noting the risk in the post-release backlog","Calculate the statistical probability of the defect occurring and defer only if the probability exceeds 1%"],"exp":"Safety-critical software defects that can harm users cannot be resolved by probability calculations or release pressure. The engineer has a professional and ethical obligation to formally escalate the concern. In regulated industries, shipping with a known safety defect may also be illegal."},{"q":"The concept of 'software liability' in IT ethics concerns which ongoing debate?","opts":["Whether software patents should be enforceable against independent developers","Whether developers and companies should be legally responsible for harm caused by defective software","Whether software companies should be taxed on the revenue generated by their products","Whether open-source contributors owe warranty obligations to users of their code"],"exp":"Software liability asks whether the software industry should be held to the same standards of product liability as manufacturers of physical goods. Currently, EULAs routinely disclaim all warranties. Critics argue this creates a race to the bottom on software quality and safety."},{"q":"A team is building a predictive hiring algorithm to screen resumes. Internal testing shows it performs with 85% accuracy overall but rejects candidates from historically underrepresented groups at twice the rate of other groups. The ethically correct response is:","opts":["Halt deployment, audit the training data for bias, and redesign the model before use in consequential decisions","Deploy the system because an 85% accuracy rate exceeds the human recruiter benchmark","Deploy with a human override option for any candidate who requests a manual review","Disclose the disparity rate in the product's technical documentation and proceed"],"exp":"Disparate impact -- where a neutral-seeming system produces unequal outcomes for protected groups -- is a recognized form of discrimination. An 85% accuracy rate that achieves that score partly by systematically disadvantaging a group is not ethically acceptable. The training data and model must be audited."},{"q":"The digital divide refers to which social concern?","opts":["The growing complexity of systems that makes them inaccessible to non-expert users","The difference in software quality between open-source and proprietary systems","The gap in security posture between large enterprises and small businesses","Unequal access to technology, internet connectivity, and digital literacy across socioeconomic and geographic groups"],"exp":"The digital divide describes the unequal distribution of access to information technology, including hardware, broadband internet, and the skills to use them effectively. It amplifies existing social and economic inequalities when essential services and opportunities move online."},{"q":"A software team knowingly ships with outdated open-source dependencies containing publicly disclosed, unpatched vulnerabilities. Six months later, attackers exploit one of those vulnerabilities to breach customer data. From a software ethics standpoint, the team:","opts":["Bears no ethical responsibility because the vulnerability existed in third-party code","Bears partial responsibility for failing to exercise due diligence in managing known supply-chain risks","Is only ethically responsible if a patch was available at the time of shipping","Bears no responsibility because the attackers are the proximate cause of harm"],"exp":"Using dependencies with known, unpatched vulnerabilities is a failure of due diligence. While the attackers are the direct cause of harm, the team's negligence created the exploitable condition. Software ethics holds developers responsible for the foreseeable consequences of known, addressable risks."},{"q":"Automation in the workplace raises a central ethical question about whose responsibility it is to address displacement of workers. Which position best reflects the 'stakeholder ethics' perspective?","opts":["Market forces alone should determine the pace and scope of workforce automation","Only governments bear responsibility through unemployment insurance and retraining programs","Companies, governments, and workers share responsibility for managing the human consequences of automation","Workers displaced by automation have sole responsibility for retraining themselves"],"exp":"Stakeholder ethics recognizes that corporations have obligations to all parties affected by their decisions, not just shareholders. A company that automates away thousands of jobs has an ethical stake in the welfare of affected workers, even when no legal obligation exists."},{"q":"A developer is asked to build a feature that allows an app to access the user's location continuously in the background, even when the app is not in use. The business justification is advertising personalization. The most ethical design approach is:","opts":["Refuse to build it, as the data collection purpose does not justify the privacy intrusion","Implement it only if the app's privacy policy is updated before the next release cycle","Implement it with the ability for users to opt out in settings, buried two levels deep in the menu","Implement the feature as requested because location data is a legitimate business asset"],"exp":"Continuous background location tracking for advertising is a disproportionate privacy intrusion relative to the purpose. The principle of data minimization holds that only data necessary for a stated, legitimate purpose should be collected. Advertising personalization does not meet that bar for continuous background location access."},{"q":"Artificial intelligence systems used in criminal sentencing (such as COMPAS) have been criticized for producing racially biased risk scores. The primary ethical objection is:","opts":["Risk scores reduce the burden on defense attorneys to argue for lighter sentences","AI cannot consider the emotional context of a case the way a human judge can","AI systems are too expensive to maintain for use in public institutions","Judges should not rely on tools they cannot fully explain or audit when making liberty-affecting decisions"],"exp":"The core objection to opaque AI in criminal sentencing is accountability and due process: defendants have a right to understand and challenge the basis for decisions that affect their liberty. A black-box score that may encode racial bias and cannot be inspected violates fundamental principles of fair justice."},{"q":"When a software company issues a silent update that changes product functionality users relied upon -- without any notification -- this primarily violates which principle?","opts":["The principle of data integrity, because the update may alter stored user data","The principle of least privilege, because the update may expand the application's system access","The principle of informed consent and transparency, because users were not notified of changes affecting their use","The principle of availability, because the update may introduce downtime"],"exp":"Silent changes to product behavior undermine user trust and informed consent. Users who adopt a product based on its capabilities have a reasonable expectation that significant changes will be communicated. The ethical obligation to be transparent applies to product changes as well as data practices."},{"q":"The concept of 'technoethics' as described by the Reynolds textbook argues that:","opts":["Only licensed engineers should be permitted to make ethical judgments about technology systems","Technology is inherently neutral and ethical concerns belong to the humans who deploy it, not the technology itself","The pace of technological change makes traditional ethical frameworks obsolete","Ethics must be embedded into the design, development, and governance of technology systems from the outset"],"exp":"Technoethics holds that technology is not neutral -- design decisions encode values, and those values have consequences. Ethical reasoning must be integrated throughout the lifecycle of technology development, not applied retroactively after harm occurs."}];

        /* ── Quiz Engine State ──
           10 questions covering Ch. 7-8 (Software Ethics, IT Impact).
           Passing threshold: 70% (7/10). */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question — used by Review Answers

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'eth-w3-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Excellent. You can apply ethical frameworks to real software and societal impact questions.';
            else if (pct >= 70) msg = 'Good work. Review any missed questions and you are well prepared for the final.';
            else if (pct >= 50) msg = 'Keep at it. Focus on the software lifecycle ethics cases and the AI bias questions.';
            else msg = 'Revisit Ch. 7-8 with attention to the case studies. The final will go deeper on these topics.';
            document.getElementById('scoreMsg').textContent = msg;

            // completeQuiz expects a PERCENTAGE (not raw correct-count); using
            // `score` here would fail the internal `score >= passingScore` check.
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try {
                    ModuleProgress.completeQuiz('divergent', 'eth-w3-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[eth-w3] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render per-question Review Answers — student pick vs correct + explanation. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer • correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
