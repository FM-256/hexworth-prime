<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Quiz: Ethics Fundamentals | Ethics in IT</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #ff00ff;
            --cyan-dim: rgba(255, 0, 255, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(255, 0, 255, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 1rem 1.1rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .review-q-num {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .review-mark {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.12em;
        }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 0.7rem;
            line-height: 1.5;
        }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            font-size: 0.86rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .review-opt.correct {
            background: rgba(34, 197, 94, 0.10);
            border-color: rgba(34, 197, 94, 0.45);
        }
        .review-opt.incorrect {
            background: rgba(239, 68, 68, 0.10);
            border-color: rgba(239, 68, 68, 0.45);
        }
        .review-tag {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 3px;
            font-style: italic;
            margin-left: auto;
        }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 8px 12px;
            background: rgba(6, 182, 212, 0.04);
            border-left: 2px solid var(--cyan);
            border-radius: 0 6px 6px 0;
        }
        .review-exp strong { color: var(--cyan); }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Ethics in IT Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 1 Quiz: Ethics Fundamentals</h1>
            <p class="subtitle">Ethical frameworks, professional conduct, and cybersecurity ethics (Ch. 1-3)</p>
            <div class="meta">
                <span>Chapters 1-3</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* ── Quiz Engine: Ethics in IT -- Week 1: Ethics Fundamentals ──
           Covers Ch. 1 (Overview of Ethics), Ch. 2 (Ethics for IT Professionals),
           Ch. 3 (Cyberattacks and Cybersecurity Ethics).
           Questions test ethical reasoning, framework application, and professional
           standards -- no code or commands. Scenario-based questions reference
           cases from the Reynolds textbook.
           Passing threshold: 70%. On pass, records via ModuleProgress. */
        /* shuffled-2026-04-28 */
        var questions = [{"q":"The utilitarian ethical framework judges the morality of an action primarily by which criterion?","opts":["Whether the action reflects the actor's virtuous character","Whether the action follows a universal moral rule","The rights the action either protects or violates","The consequences the action produces for the greatest number of people"],"exp":"Utilitarianism, associated with Bentham and Mill, evaluates actions by their outcomes -- an action is ethical if it produces the greatest good for the greatest number."},{"q":"A software developer discovers a backdoor in a client's system planted by a former employee. She is bound by a nondisclosure agreement. What does a virtue ethics framework suggest she should do?","opts":["Follow the organization's written policy, whatever it says","Stay silent because the NDA creates a legal obligation that overrides moral concerns","Disclose because a person of honest and courageous character would act to protect others","Calculate the utility of disclosure versus silence before deciding"],"exp":"Virtue ethics asks what a person of good character would do. Honesty and courage are core virtues; disclosing a security threat aligns with virtuous professional conduct regardless of contractual pressure."},{"q":"Kant's categorical imperative requires that an ethical action must be justifiable as what?","opts":["A universal law that all rational agents could act upon simultaneously","The action producing the least harm to the most vulnerable party","The action a reasonable person would take under identical circumstances","An action approved by the professional body governing the field"],"exp":"Kant's categorical imperative states: act only according to principles you could will to be universal laws. If an action cannot be universalized without contradiction, it is unethical."},{"q":"Which of the following best describes a 'morally wrong but legally permissible' scenario in the IT context?","opts":["A developer releases a patch without authorization from the security team","A sysadmin accesses a production database without a change management ticket","A company collects and sells user behavioral data that users consented to via a lengthy terms-of-service agreement","A contractor exceeds authorized access to a client's network"],"exp":"Consent buried in a long ToS may be legally valid but is widely considered ethically problematic because it exploits asymmetric information. This is a classic example of the gap between legal compliance and ethical conduct."},{"q":"The ACM Code of Ethics states that computing professionals should contribute to society and human well-being. When an IT professional's employer instructs them to deploy a system that will likely harm users, the code recommends the professional should:","opts":["Resign immediately without raising the issue internally","Express concern through legitimate channels and, if unresolved, consider refusing or leaving","Implement the system but document personal objections in writing","Comply, because employer obligations supersede professional codes"],"exp":"The ACM Code of Ethics acknowledges that professionals must sometimes refuse harmful directives. It recommends escalating concerns through legitimate channels before refusing, and ultimately choosing professional integrity over compliance."},{"q":"Social contract theory, as applied to IT ethics, suggests that technology companies derive legitimacy from:","opts":["An implicit agreement with society to provide benefits in exchange for trust and data","Compliance with applicable national and international laws","The voluntary acceptance of their services by individual users","Their ability to generate profit and sustain employment"],"exp":"Social contract theory holds that companies operating in public life hold power by consent of society. In exchange for user data, access, and trust, they owe social obligations including privacy protection and honest dealing."},{"q":"A penetration tester at a security firm is asked by a client to test their competitor's systems 'to gather competitive intelligence.' The tester should:","opts":["Decline because authorization from the target, not a third party, is required","Perform a passive reconnaissance only, since active exploitation crosses a legal line","Proceed if the client provides written authorization","Consult the firm's legal team and proceed if they approve"],"exp":"Penetration testing requires explicit written authorization from the owner of the target system. A client cannot grant permission to attack systems they do not own. Proceeding would constitute unauthorized access under the CFAA."},{"q":"The principle of 'informed consent' in IT ethics requires that users:","opts":["Have the technical knowledge to evaluate all possible uses of their data","Be given meaningful, understandable information about data use before agreeing","Acknowledge a privacy policy has been posted on the company's website","Opt in through any mechanism the service provider chooses"],"exp":"Genuine informed consent requires comprehensible disclosure of what data is collected, how it will be used, and who it will be shared with -- before the user agrees. Burying terms in dense legalese does not meet the ethical standard."},{"q":"In 2016, Volkswagen engineers programmed diesel vehicles to detect EPA emissions tests and alter engine performance to pass. From a deontological perspective, this was unethical primarily because:","opts":["Engineers used their professional skills to deceive regulators and the public","The environmental harm caused exceeded the financial benefit to VW shareholders","The engineers violated their employment contracts by acting outside authorized scope","The fraud was eventually detected, making it a failed consequentialist calculation"],"exp":"Deontological ethics focuses on the intrinsic nature of the act, not the outcome. Deliberately programming deception violates the duty of honesty; it is wrong regardless of whether it was discovered."},{"q":"A company suffers a ransomware attack that encrypts patient health records. The attackers demand payment within 48 hours. Under a strict utilitarian analysis, which factor is MOST relevant to the pay-or-not decision?","opts":["Whether the IT staff have the technical ability to restore from backup","Whether paying maximizes overall welfare by restoring data versus the harm of funding criminal activity","Whether paying ransom violates HIPAA regulations","Whether the organization's cyber insurance policy covers the ransom payment"],"exp":"Utilitarianism centers analysis on consequences for all affected parties. The relevant calculation weighs harm to patients from prolonged data loss against the harm of financing future ransomware attacks -- a genuine utilitarian tension with no easy answer."},{"q":"Which distinction best separates a 'hacker' from a 'cracker' in the classical security ethics literature?","opts":["Hackers attack infrastructure; crackers target individual users","The terms are interchangeable and the distinction has no ethical significance","Hackers use physical access; crackers operate remotely","Hackers are motivated by curiosity and learning; crackers breach systems with malicious intent"],"exp":"In academic and security community usage, 'hacker' originally referred to creative problem-solvers motivated by curiosity. 'Cracker' referred to those who breached systems with harmful intent. The media conflation of the two terms has ethical consequences for how the field is perceived."},{"q":"An IT manager learns that a team member is browsing personal social media for several hours daily using company equipment on company time. The employee's performance meets all targets. The most ethically defensible response is to:","opts":["Immediately terminate employment for misuse of company resources","Install keylogging software to document the behavior before taking any action","Ignore the behavior entirely because performance metrics are the only relevant measure","Have a direct conversation with the employee about acceptable use policy and expectations"],"exp":"A direct conversation respects the employee's dignity, clarifies expectations, and gives them the opportunity to adjust behavior. Covert surveillance before raising the issue directly raises its own ethical problems regarding trust and proportionality."},{"q":"Aristotle's concept of eudaimonia, as applied to professional ethics, suggests that an IT professional's career should be oriented toward:","opts":["Accumulating credentials that demonstrate technical competence","Maximizing compensation and advancement opportunities","Achieving human flourishing through the exercise of practical wisdom and virtue","Fulfilling contractual obligations to clients and employers"],"exp":"Eudaimonia translates roughly as flourishing or the good life. Aristotle argued it is achieved through the consistent exercise of virtue and practical wisdom (phronesis). Applied to IT, it points toward a career built on integrity, growth, and genuine service."},{"q":"The concept of 'gray hat' hacking describes a practitioner who:","opts":["Works for a government agency conducting authorized offensive operations","Performs penetration testing under contract but keeps the findings private","Conducts security research using both legal and illegal techniques interchangeably","Finds and discloses vulnerabilities without permission but without malicious intent"],"exp":"Gray hat hackers occupy an ethically ambiguous space: they may break into systems without authorization, but their purpose is to expose vulnerabilities rather than exploit them for personal gain. The ethical debate centers on whether good intent justifies unauthorized access."},{"q":"A systems administrator is instructed to implement monitoring software that logs all employee emails without the employees' knowledge. The administrator complies. Which ethical framework most clearly condemns this decision?","opts":["Consequentialism, because the probability of catching misconduct is low","Virtue ethics, because a trustworthy person would refuse to enable covert surveillance","Social contract theory, because employees implicitly accepted monitoring by accepting employment","Utilitarianism, because the loss of employee goodwill outweighs any security benefit"],"exp":"Virtue ethics holds that a person of integrity would not facilitate deceptive surveillance. The administrator who complies without raising the ethical concern fails the virtue standard regardless of the employer's legal authority to monitor."}];

        /* ── Quiz Engine State ──
           15 ethics questions covering Ch. 1-3.
           Passing threshold: 70% (11/15).
           On pass, records via ModuleProgress for hub progress bar and
           instructor dashboard visibility. */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        /** Render the current question, progress bar, and four option buttons. */
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        /**
         * Handle answer selection. Locks options, highlights correct and incorrect,
         * shows explanation, increments score if correct.
         */
        var QUIZ_ID = 'eth-w1-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        /** Advance to the next question or show results on the last. */
        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        /**
         * Display final results. Passing (>=70%) calls ModuleProgress.completeQuiz
         * for hub progress bar and instructor sync.
         * Score tiers: >=90% outstanding, >=70% solid, >=50% needs review, <50% keep studying.
         */
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You can reason through ethical frameworks with precision.';
            else if (pct >= 70) msg = 'Solid. You understand the core frameworks. Review any questions you missed before the midterm.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the Week 1 readings and work through the case studies again.';
            else msg = 'Keep studying. Re-read Ch. 1-3 and focus on how each framework approaches the same dilemma differently.';
            document.getElementById('scoreMsg').textContent = msg;

            // Record completion only on passing (70% threshold).
            // NOTE: completeQuiz expects a PERCENTAGE, not the raw correct-count.
            // Pre-fix bug: passed `score` (e.g. 12 of 15) which fails the inner
            // `score >= passingScore` check (12 < 70) → completion never recorded.
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try {
                    ModuleProgress.completeQuiz('divergent', 'eth-w1-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[eth-w1] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /**
         * Render the per-question Review Answers view. Shows each question with
         * the student's pick, the correct answer, and the explanation.
         */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer • correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        /** Return from the review view back to the score card. */
        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        /** Reset all state and restart from question 1. Does not clear previous completion. */
        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
