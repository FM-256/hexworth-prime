<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Quiz: NIST 800-53 | Cybersecurity Policy</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #16101c;
            --bg-option: #1a1222;
            --primary: #ff00ff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --cyan: #00ffff;
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --text-dim: #5a4460;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #120a18 50%, #1a0e24 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cybersecurity Policy Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 4 Quiz: NIST 800-53</h1>
            <p class="subtitle">20 control families, baselines, tailoring, overlays, 800-53A assessment, ISCM, FISMA</p>
            <div class="meta">
                <span>Week 4</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Policy Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz Engine: Cybersecurity Policy -- Week 4: NIST 800-53 --
           Topics: 20 control families, baselines, tailoring, overlays,
           800-53A assessment, ISCM, FISMA.
           Passing threshold: 70% (11/15). */
        var questions = [
            {
                q: "NIST SP 800-53 Rev. 5 organizes security and privacy controls into how many control families?",
                opts: [
                    "14 control families",
                    "20 control families",
                    "18 control families",
                    "26 control families"
                ],
                ans: 1,
                exp: "NIST 800-53 Rev. 5 contains 20 control families, including the new Supply Chain Risk Management (SR) and Personally Identifiable Information Processing (PT) families added in this revision."
            },
            {
                q: "The Access Control (AC) family in NIST 800-53 addresses:",
                opts: [
                    "Physical perimeter security and facility access badges",
                    "Employee background checks and personnel screening",
                    "Policies and mechanisms for controlling logical access to information systems and data",
                    "Incident response procedures and forensic analysis"
                ],
                ans: 2,
                exp: "The AC family covers logical access control policies and mechanisms including account management, access enforcement, separation of duties, least privilege, session controls, and remote access."
            },
            {
                q: "Control baselines in NIST 800-53 are defined for which three impact levels?",
                opts: [
                    "Basic, Standard, and Advanced",
                    "Low, Moderate, and High",
                    "Tier 1, Tier 2, and Tier 3",
                    "Restricted, Confidential, and Secret"
                ],
                ans: 1,
                exp: "Control baselines are defined for Low, Moderate, and High impact levels as categorized by FIPS 199. Each baseline specifies a starting set of controls appropriate for the system's impact level."
            },
            {
                q: "Tailoring a control baseline involves:",
                opts: [
                    "Adjusting the baseline controls to align with the organization's specific risk environment, mission, and operational needs",
                    "Implementing all controls exactly as written without any modifications",
                    "Removing all controls that require technical implementation",
                    "Adding controls from a higher baseline without justification"
                ],
                ans: 0,
                exp: "Tailoring allows organizations to customize baseline controls by scoping, selecting compensating controls, assigning parameter values, and supplementing with additional controls based on their specific risk context and operational requirements."
            },
            {
                q: "An overlay in the NIST 800-53 context is:",
                opts: [
                    "A specification of security controls, control enhancements, and supplemental guidance tailored for a specific community, technology, or use case",
                    "A graphical user interface for managing security controls",
                    "A network monitoring tool that operates above the application layer",
                    "A backup copy of the control baseline stored in a separate location"
                ],
                ans: 0,
                exp: "Overlays provide community-specific or technology-specific tailoring guidance that can be applied on top of control baselines. Examples include overlays for cloud computing, privacy, or specific mission types."
            },
            {
                q: "NIST SP 800-53A provides guidance for:",
                opts: [
                    "Selecting security controls for information systems",
                    "Categorizing information systems by impact level",
                    "Assessing the effectiveness of security and privacy controls through examination, interview, and testing",
                    "Managing the authorization process for federal systems"
                ],
                ans: 2,
                exp: "SP 800-53A (Assessing Security and Privacy Controls) provides procedures for assessing control effectiveness using three methods: examine (review documentation), interview (discuss with personnel), and test (exercise mechanisms)."
            },
            {
                q: "Information Security Continuous Monitoring (ISCM) as defined by NIST involves:",
                opts: [
                    "Running vulnerability scans once per year before the annual audit",
                    "Maintaining ongoing awareness of the security status, vulnerabilities, and threats to support risk management decisions",
                    "Monitoring employee internet usage for policy violations",
                    "Performing penetration tests whenever a new system is deployed"
                ],
                ans: 1,
                exp: "ISCM (NIST SP 800-137) maintains ongoing awareness of information security, vulnerabilities, and threats through automated tools, metrics, and analysis to support organizational risk management decisions in near-real-time."
            },
            {
                q: "Under FISMA, federal agencies must complete the security authorization process, which results in an:",
                opts: [
                    "Annual Security Review (ASR)",
                    "Certification of Compliance (CoC)",
                    "Security Baseline Assessment (SBA)",
                    "Authority to Operate (ATO)"
                ],
                ans: 3,
                exp: "The Risk Management Framework process culminates in an Authority to Operate (ATO), a formal decision by an authorizing official that a system's residual risk is acceptable and operations are approved."
            },
            {
                q: "The System and Information Integrity (SI) control family includes controls for:",
                opts: [
                    "Managing user accounts and password complexity requirements",
                    "Physical access control and environmental protection",
                    "Security awareness training and role-based education",
                    "Flaw remediation, malicious code protection, and system monitoring"
                ],
                ans: 3,
                exp: "The SI family addresses flaw remediation (patching), malicious code protection (antimalware), information handling, software and firmware integrity, spam protection, and system monitoring."
            },
            {
                q: "NIST 800-53 Rev. 5 made a significant change by:",
                opts: [
                    "Integrating privacy controls alongside security controls and making the catalog applicable to all types of systems",
                    "Eliminating all privacy controls and deferring to GDPR",
                    "Making the controls applicable only to cloud-based systems",
                    "Reducing the number of control families from 26 to 14"
                ],
                ans: 0,
                exp: "Rev. 5 integrated privacy controls into the catalog alongside security controls, removed the federal-only scope to make controls applicable to any organization, and added the PT and SR families."
            },
            {
                q: "The Contingency Planning (CP) control family in 800-53 addresses:",
                opts: [
                    "Preparation for, response to, and recovery from system disruptions to ensure availability",
                    "Human resources policies for employee termination and transfer",
                    "Cryptographic key management and certificate lifecycle",
                    "Media sanitization and disposal procedures"
                ],
                ans: 0,
                exp: "The CP family covers contingency plan development, testing, training, alternate processing sites, system backup, and recovery. It ensures organizations can maintain essential functions during and after disruptions."
            },
            {
                q: "A Plan of Action and Milestones (POA&M) is used to:",
                opts: [
                    "Document the system architecture and network topology",
                    "List all authorized users and their access privileges",
                    "Track identified security weaknesses, planned remediation actions, and target completion dates",
                    "Record the results of annual employee performance reviews"
                ],
                ans: 2,
                exp: "A POA&M documents known security weaknesses, specifies the remediation actions planned, assigns responsible parties, and sets milestone dates for completion. It is a key artifact in the FISMA authorization process."
            },
            {
                q: "The Risk Assessment (RA) control family requires organizations to:",
                opts: [
                    "Purchase cyber insurance policies to cover all identified risks",
                    "Implement biometric authentication for all system access",
                    "Deploy intrusion detection systems on every network segment",
                    "Conduct security categorization, risk assessments, and vulnerability monitoring"
                ],
                ans: 3,
                exp: "The RA family requires security categorization (per FIPS 199), risk assessments, vulnerability monitoring and scanning, and privacy impact assessments to systematically identify and evaluate risks."
            },
            {
                q: "Control enhancements in NIST 800-53 provide:",
                opts: [
                    "Simplified versions of controls for small organizations",
                    "Alternative controls that replace the base control entirely",
                    "Additional functionality or specificity to a base control for higher-impact systems or specific threats",
                    "Cost estimates for implementing each control"
                ],
                ans: 2,
                exp: "Control enhancements add functionality, specificity, or rigor to base controls. Higher-impact baselines include more enhancements. For example, AC-2 (Account Management) has enhancements for automated management, role-based schemes, and more."
            },
            {
                q: "FISMA requires agencies to report their cybersecurity posture to which entity?",
                opts: [
                    "The Department of Defense Cyber Command",
                    "The Office of Management and Budget (OMB) and Congress",
                    "The National Security Agency (NSA)",
                    "The Federal Communications Commission (FCC)"
                ],
                ans: 1,
                exp: "FISMA requires federal agencies to report their information security status to OMB, which in turn reports to Congress. CISA and OMB jointly oversee FISMA implementation and monitor agency compliance."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a thorough understanding of NIST 800-53 controls, baselines, and the FISMA process.';
            else if (pct >= 70) msg = 'Solid. Review any missed questions on control families, tailoring, and assessment methods.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the 20 control families, baselines, and the RMF process.';
            else msg = 'Keep studying. Focus on the control family structure, baselines, and how 800-53A assessment works.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.completeQuiz('divergent', 'csp-w4-nist-800-53-quiz', score);
            }
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
