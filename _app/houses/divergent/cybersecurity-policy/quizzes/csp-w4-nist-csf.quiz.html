<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Quiz: NIST CSF | Cybersecurity Policy</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #16101c;
            --bg-option: #1a1222;
            --primary: #ff00ff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --cyan: #00ffff;
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --text-dim: #5a4460;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #120a18 50%, #1a0e24 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cybersecurity Policy Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 4 Quiz: NIST Cybersecurity Framework</h1>
            <p class="subtitle">6 CSF functions, Govern function, profiles, tiers, subcategories, CSF 2.0 changes</p>
            <div class="meta">
                <span>Week 4</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz Engine: Cybersecurity Policy -- Week 4: NIST CSF --
           Topics: 6 CSF functions, Govern function, profiles, tiers,
           subcategories, CSF 2.0 changes.
           Passing threshold: 70% (11/15). */
        var questions = [{"q":"NIST CSF 2.0 expanded the framework from five to six functions. The new function added in CSF 2.0 is:","opts":["Audit","Comply","Govern","Assess"],"exp":"CSF 2.0 added the Govern (GV) function, which addresses cybersecurity risk management strategy, expectations, and policy. It sits at the center of the framework, informing all other five functions."},{"q":"The six functions of NIST CSF 2.0 in their correct order are:","opts":["Govern, Identify, Protect, Detect, Respond, Recover","Identify, Protect, Detect, Respond, Recover, Govern","Assess, Protect, Monitor, Detect, Respond, Recover","Plan, Implement, Monitor, Detect, Respond, Improve"],"exp":"CSF 2.0 places Govern at the center with five operational functions: Identify, Protect, Detect, Respond, and Recover. Govern informs and integrates with all other functions."},{"q":"The Identify function of NIST CSF focuses on:","opts":["Implementing safeguards to ensure delivery of critical services","Detecting the occurrence of cybersecurity events in a timely manner","Developing the organizational understanding to manage cybersecurity risk to systems, people, assets, and data","Taking action regarding a detected cybersecurity incident"],"exp":"The Identify function develops organizational understanding of cybersecurity risk management for systems, assets, data, and capabilities. It includes asset management, risk assessment, and supply chain risk management."},{"q":"CSF Implementation Tiers describe:","opts":["The specific technical controls an organization must implement","The degree to which an organization's cybersecurity risk management practices exhibit the characteristics defined in the framework","The certification levels required by federal regulators","The order in which the six functions should be implemented"],"exp":"CSF Tiers (1-4: Partial, Risk Informed, Repeatable, Adaptive) describe the degree of rigor and sophistication in an organization's cybersecurity risk management practices. They are not maturity levels or required benchmarks."},{"q":"A CSF Organizational Profile is used to:","opts":["List all employees with cybersecurity responsibilities","Document the network topology and system architecture","Provide a financial accounting of cybersecurity expenditures","Describe an organization's current or target cybersecurity posture in terms of CSF outcomes"],"exp":"CSF Profiles describe an organization's current cybersecurity posture (Current Profile) and desired target state (Target Profile) using the framework's categories and subcategories. Gap analysis between profiles drives improvement priorities."},{"q":"The Protect function of NIST CSF includes which category?","opts":["Identity Management, Authentication, and Access Control","Incident Response Planning","Recovery Planning","Anomalies and Events Detection"],"exp":"The Protect function includes categories for Identity Management/Authentication/Access Control, Awareness and Training, Data Security, Platform Security, and Technology Infrastructure Resilience."},{"q":"In CSF 2.0, the Govern function includes which of the following categories?","opts":["Anomalies and Events, Continuous Monitoring","Organizational Context, Risk Management Strategy, Cybersecurity Supply Chain Risk Management","Response Planning, Communications, Mitigation","Asset Management, Business Environment, Risk Assessment"],"exp":"The Govern function includes categories for Organizational Context, Risk Management Strategy, Roles/Responsibilities/Authorities, Policy, Oversight, and Cybersecurity Supply Chain Risk Management."},{"q":"CSF Tier 4 (Adaptive) organizations are characterized by:","opts":["Having no formal cybersecurity risk management practices","Managing cybersecurity risk on an ad-hoc, reactive basis","Using lessons learned and predictive indicators to continuously improve and adapt cybersecurity practices","Having approved policies but inconsistent implementation across the organization"],"exp":"Tier 4 (Adaptive) organizations use lessons learned, predictive indicators, and real-time information to continuously adapt and improve their cybersecurity practices. Risk management is integrated into organizational culture."},{"q":"A key change in CSF 2.0 compared to CSF 1.1 is that CSF 2.0:","opts":["Eliminated the concept of Implementation Tiers","Expanded the scope to explicitly apply to all organizations, not just critical infrastructure","Made the framework mandatory for all US organizations","Removed the Recover function as unnecessary"],"exp":"CSF 1.1 was designed primarily for critical infrastructure. CSF 2.0 explicitly broadened scope to all organizations regardless of size, sector, or maturity level, recognizing that cybersecurity risk is universal."},{"q":"The Detect function of NIST CSF is primarily concerned with:","opts":["Developing and implementing safeguards to limit the impact of a potential event","Maintaining plans for resilience and restoring capabilities impaired by an incident","Developing and implementing activities to identify the occurrence of a cybersecurity event","Establishing policies and procedures for cybersecurity governance"],"exp":"The Detect function enables timely discovery of cybersecurity events through continuous monitoring, anomaly detection, and adverse event analysis. It bridges Protect (prevention) and Respond (action)."},{"q":"CSF subcategories provide:","opts":["Mandatory regulatory requirements that all organizations must meet","Step-by-step implementation procedures for each control","Vendor-specific product recommendations for each category","Outcome-driven statements that divide categories into specific results of technical or management activities"],"exp":"Subcategories are outcome-driven statements that provide more specific results within each category. They are not prescriptive requirements but outcomes that can be achieved through various means appropriate to the organization."},{"q":"The Respond function of NIST CSF includes activities for:","opts":["Incident management, analysis, reporting, and mitigation of cybersecurity incidents","Asset discovery, vulnerability scanning, and configuration management","Access control, encryption, and network segmentation","Business continuity planning and disaster recovery testing"],"exp":"The Respond function covers incident management, analysis, incident reporting and communication, and mitigation activities. It ensures the organization can effectively contain and manage detected cybersecurity incidents."},{"q":"CSF Community Profiles, introduced in CSF 2.0, are designed to:","opts":["Provide baseline CSF outcomes tailored to specific sectors, threats, or use cases that organizations can adopt and customize","Replace organizational profiles for small businesses","Serve as mandatory compliance checklists for government contractors","Define minimum security standards for cloud service providers"],"exp":"Community Profiles are sector-specific or use-case-specific baseline profiles created by communities of interest. Organizations can use them as starting points and customize them for their specific needs."},{"q":"An organization at CSF Tier 1 (Partial) is characterized by:","opts":["Fully integrated and adaptive cybersecurity risk management practices","Risk-informed practices that are approved by management but may not be organization-wide","Repeatable and formally documented risk management processes","Cybersecurity risk management that is ad hoc, with limited awareness of organizational risk"],"exp":"Tier 1 (Partial) describes organizations where cybersecurity risk management is ad hoc, reactive, and performed on an irregular basis with limited awareness of cybersecurity risk at the organizational level."},{"q":"The Recover function of NIST CSF addresses:","opts":["Identifying which assets are most critical to the organization","Maintaining plans for resilience and timely restoration of capabilities or services impaired during an incident","Implementing access controls and authentication mechanisms","Monitoring systems for unauthorized access and anomalous behavior"],"exp":"The Recover function supports timely recovery to normal operations after a cybersecurity incident. It includes recovery planning, improvements based on lessons learned, and communications during recovery."}];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'csp-w4-nist-csf-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a thorough understanding of NIST CSF 2.0 and its components.';
            else if (pct >= 70) msg = 'Solid. Review any missed questions on the six functions, tiers, and profiles.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the CSF functions and CSF 2.0 changes.';
            else msg = 'Keep studying. Focus on the six functions, implementation tiers, and profiles.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w4-nist-csf-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w4-nist-csf-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
