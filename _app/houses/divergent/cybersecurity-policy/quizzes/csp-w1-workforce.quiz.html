<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Quiz: Cybersecurity Workforce | The Domino Effect</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;
            --bg-option: #1a0f1e;
            --primary: #ff00ff;
            --cyan: #00ffff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 0, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a060d 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--cyan); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; The Domino Effect Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 1 Quiz: Cybersecurity Workforce</h1>
            <p class="subtitle">Workforce gap, NICE Framework, work roles, certifications, career paths, and diversity</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz: Cybersecurity Workforce --
           ISC2 workforce gap, NICE Framework, work roles, certifications,
           CyberSeek, career paths, diversity.
           15 questions, 70% pass threshold. */
        var questions = [{"q":"According to the ISC2 Cybersecurity Workforce Study, the global cybersecurity workforce gap is best described as:","opts":["A shortage of millions of skilled professionals needed to adequately defend organizations","A surplus of qualified professionals that is driving down salaries","A gap that exists only in developing countries and not in North America or Europe","A temporary shortage caused by the COVID-19 pandemic that has since been resolved"],"exp":"The ISC2 workforce study consistently reports a global gap of millions of cybersecurity professionals. The 2023 study estimated a gap of approximately 4 million workers worldwide, with the gap growing year over year despite increased hiring."},{"q":"The NICE Workforce Framework for Cybersecurity (NIST SP 800-181r1) organizes cybersecurity work into which hierarchical structure?","opts":["Categories, Specialty Areas, and Work Roles","Domains, Subdomains, and Controls","Tiers, Functions, and Profiles","Phases, Gates, and Deliverables"],"exp":"The NICE Framework organizes cybersecurity work into seven Categories (e.g., Protect and Defend, Investigate), which contain Specialty Areas (e.g., Incident Response, Digital Forensics), which contain specific Work Roles (e.g., Cyber Defense Incident Responder)."},{"q":"A NICE Framework 'Work Role' is defined by a combination of:","opts":["Knowledge, Skills, and Abilities (KSAs) along with associated Tasks","Salary ranges and geographic locations","Vendor certifications and years of experience","Educational degree requirements and security clearance levels"],"exp":"Each Work Role in the NICE Framework is described by the Knowledge (what you know), Skills (what you can do), Abilities (how you apply knowledge and skills), and Tasks (specific work activities) required. This KSA+Task model provides a common language for workforce development."},{"q":"Which of the following certifications is widely recognized as an entry-level cybersecurity credential that does not require prior work experience?","opts":["CISSP (Certified Information Systems Security Professional)","CISM (Certified Information Security Manager)","CompTIA Security+","OSCP (Offensive Security Certified Professional)"],"exp":"CompTIA Security+ is vendor-neutral, DoD 8570/8140 approved, and has no mandatory experience requirement. CISSP requires five years of experience, CISM requires five years in information security management, and OSCP requires significant hands-on penetration testing skill."},{"q":"CyberSeek is an interactive tool that provides:","opts":["Real-time data on cybersecurity job demand, supply, and career pathways across the United States","Automated vulnerability scanning for enterprise networks","A database of known cyber threat actors and their associated malware","Free online cybersecurity training courses for career changers"],"exp":"CyberSeek (cyberseek.org) is a project funded by NICE, CompTIA, and Lightcast that provides interactive heat maps of cybersecurity job supply and demand, career pathway visualizations, and workforce analytics. It helps students, career changers, and employers understand the labor market."},{"q":"The CISSP certification, offered by ISC2, is positioned for which career level?","opts":["Entry-level security analysts with less than one year of experience","Exclusively for chief information security officers (CISOs)","Mid-career to senior security professionals with at least five years of experience","Students currently enrolled in cybersecurity degree programs"],"exp":"CISSP is designed for experienced security practitioners, managers, and executives. It requires five years of cumulative paid work experience in two or more of its eight domains (or four years with a qualifying degree). It is widely considered a gold-standard credential for mid-career and senior professionals."},{"q":"According to workforce research, which factor most significantly contributes to the cybersecurity skills gap?","opts":["Excessive regulation that discourages employers from hiring","Declining interest in technology careers among younger generations","A combination of rapid threat evolution, insufficient training pipelines, and high burnout driving attrition","Overreliance on artificial intelligence that has replaced the need for human analysts"],"exp":"The gap is driven by multiple factors: threats evolving faster than education can keep up, insufficient training pipelines at colleges and boot camps, high burnout and turnover rates, and unrealistic job requirements that exclude qualified candidates. No single factor explains the shortage."},{"q":"The NICE Framework category 'Protect and Defend' includes work roles focused on:","opts":["Developing offensive cyber capabilities for military operations","Writing legislation and regulatory policy for cybersecurity compliance","Identifying, analyzing, and mitigating threats to internal IT systems and networks","Conducting covert intelligence gathering on foreign adversaries"],"exp":"Protect and Defend encompasses roles like Cyber Defense Analyst, Cyber Defense Incident Responder, and Vulnerability Assessment Analyst. These roles focus on monitoring, detecting, analyzing, and responding to threats targeting the organization's networks and systems."},{"q":"Diversity in the cybersecurity workforce is important because:","opts":["It is a legal requirement for all cybersecurity employers under federal law","International regulations require cybersecurity teams to match the demographics of their customer base","Homogeneous teams are statistically more likely to be targeted by insider threats","Diverse teams bring varied perspectives that improve threat detection, problem-solving, and resilience"],"exp":"Research consistently shows that diverse teams outperform homogeneous ones in complex problem-solving. In cybersecurity, varied backgrounds, experiences, and perspectives improve threat anticipation, creative defense strategies, and organizational resilience. The field historically underrepresents women, minorities, and non-traditional backgrounds."},{"q":"A typical entry-level cybersecurity career path begins with which type of role?","opts":["Chief Information Security Officer (CISO)","Independent cybersecurity consultant","Penetration Tester at a Fortune 500 company","Security Operations Center (SOC) Analyst or Help Desk with security focus"],"exp":"Most cybersecurity careers begin in foundational roles: SOC Analyst (Tier 1), IT support with security responsibilities, or junior security analyst positions. These roles build hands-on experience with monitoring tools, incident triage, and security fundamentals before advancing to specialized or leadership positions."},{"q":"The NICE Framework was developed primarily by which organization?","opts":["The National Security Agency (NSA)","The SANS Institute","The International Information System Security Certification Consortium (ISC2)","The National Institute of Standards and Technology (NIST)"],"exp":"NIST developed the NICE Workforce Framework (SP 800-181, revised as SP 800-181r1) through the National Initiative for Cybersecurity Education. While many organizations contributed, NIST is the primary author and maintainer of the framework."},{"q":"Which of the following is an example of a 'Specialty Area' within the NICE Framework's 'Investigate' category?","opts":["Software Development","Digital Forensics","Network Services","Customer Service and Technical Support"],"exp":"The Investigate category includes specialty areas like Digital Forensics and Cyber Investigation. Digital Forensics involves collecting, processing, preserving, analyzing, and presenting computer-related evidence in support of network vulnerability mitigation and criminal, fraud, or law enforcement investigations."},{"q":"DoD Directive 8140 (replacing 8570) requires that personnel performing cybersecurity functions in the Department of Defense must:","opts":["Hold a minimum of a master's degree in cybersecurity or computer science","Be certified in accordance with approved qualification requirements for their specific work role","Complete a two-year internship at a national laboratory before being assigned to a cybersecurity role","Maintain active Top Secret/SCI clearance regardless of their specific role"],"exp":"DoD 8140 (and its predecessor 8570) requires DoD cybersecurity workforce members to obtain and maintain certifications appropriate to their assigned work role. Approved certifications include CompTIA Security+, CISSP, CEH, and others mapped to specific NICE Framework work roles."},{"q":"The concept of 'upskilling' in cybersecurity refers to:","opts":["Replacing human security analysts with automated systems","Training existing IT professionals to develop cybersecurity skills, helping fill the workforce gap from within","Hiring exclusively from four-year university cybersecurity programs","Outsourcing security operations to managed security service providers"],"exp":"Upskilling trains existing IT staff -- system administrators, network engineers, help desk technicians -- in cybersecurity skills. This approach leverages existing institutional knowledge and is a key strategy for closing the workforce gap, as many cybersecurity skills build on foundational IT competencies."},{"q":"CyberSeek's career pathway tool shows that a Cybersecurity Analyst can advance to which of the following roles?","opts":["Only to a CISO position, with no intermediate steps","Cybersecurity Consultant, Penetration Tester, or Cybersecurity Engineer, among others","Exclusively to management roles outside of technical cybersecurity","Only to roles that require a PhD in computer science"],"exp":"CyberSeek maps multiple career pathways from a Cybersecurity Analyst role, including lateral moves to Penetration Tester or Consultant, upward moves to Cybersecurity Engineer or Architect, and management tracks to Security Manager or CISO. The field offers diverse advancement options."}];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'csp-w1-workforce-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You understand the cybersecurity workforce landscape and career pathways.';
            else if (pct >= 70) msg = 'Solid. Review the NICE Framework structure and certification landscape for anything you missed.';
            else if (pct >= 50) msg = 'Getting there. Revisit the workforce gap data and NICE Framework hierarchy.';
            else msg = 'Keep studying. Understanding the workforce landscape is essential for career planning.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w1-workforce-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w1-workforce-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
