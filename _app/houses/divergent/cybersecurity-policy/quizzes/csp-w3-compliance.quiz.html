<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: Compliance Frameworks | Cybersecurity Policy</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #16101c;
            --bg-option: #1a1222;
            --primary: #ff00ff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --cyan: #00ffff;
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --text-dim: #5a4460;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #120a18 50%, #1a0e24 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cybersecurity Policy Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 3 Quiz: Compliance Frameworks</h1>
            <p class="subtitle">PCI DSS, SOC 2, FedRAMP, HITRUST, audit process, GRC, continuous compliance</p>
            <div class="meta">
                <span>Week 3</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz Engine: Cybersecurity Policy -- Week 3: Compliance Frameworks --
           Topics: PCI DSS, SOC 2, FedRAMP, HITRUST, audit process, GRC,
           continuous compliance.
           Passing threshold: 70% (11/15). */
        var questions = [
            {
                q: "PCI DSS applies to any organization that:",
                opts: [
                    "Operates a website with more than 10,000 monthly visitors",
                    "Accepts payments only through third-party processors",
                    "Stores, processes, or transmits cardholder data",
                    "Is publicly traded on a US stock exchange"
                ],
                ans: 2,
                exp: "PCI DSS applies to all entities that store, process, or transmit cardholder data, regardless of size or transaction volume. The level of validation required varies by merchant level."
            },
            {
                q: "PCI DSS version 4.0 introduced a new validation approach alongside the traditional defined approach. What is it called?",
                opts: [
                    "The risk-based approach",
                    "The customized approach",
                    "The continuous monitoring approach",
                    "The compensating controls approach"
                ],
                ans: 1,
                exp: "PCI DSS v4.0 introduced the customized approach, which allows organizations to meet security objectives using controls that differ from the defined requirements, provided they demonstrate the control meets the stated objective."
            },
            {
                q: "A SOC 2 Type II report differs from a SOC 2 Type I report in that Type II:",
                opts: [
                    "Evaluates the design AND operating effectiveness of controls over a period of time",
                    "Covers all five Trust Services Criteria instead of a subset",
                    "Is performed by an internal audit team rather than an external CPA firm",
                    "Is required by law while Type I is voluntary"
                ],
                ans: 0,
                exp: "SOC 2 Type I evaluates the design of controls at a point in time. Type II evaluates both the design and operating effectiveness of controls over a specified period (typically 6-12 months), providing greater assurance."
            },
            {
                q: "The five Trust Services Criteria used in SOC 2 audits are:",
                opts: [
                    "Confidentiality, Integrity, Availability, Authentication, Non-repudiation",
                    "Security, Availability, Processing Integrity, Confidentiality, Privacy",
                    "Governance, Risk, Compliance, Monitoring, Reporting",
                    "Access Control, Encryption, Logging, Incident Response, Recovery"
                ],
                ans: 1,
                exp: "SOC 2 is based on the AICPA Trust Services Criteria: Security (common criteria, always included), Availability, Processing Integrity, Confidentiality, and Privacy. Organizations choose which criteria apply."
            },
            {
                q: "FedRAMP authorization uses a tiered impact level system based on:",
                opts: [
                    "FIPS 199 impact levels: Low, Moderate, and High",
                    "The cloud service provider's annual revenue",
                    "The number of federal agencies using the service",
                    "The geographic location of the data center"
                ],
                ans: 0,
                exp: "FedRAMP categorizes cloud services using FIPS 199 impact levels (Low, Moderate, High) based on the potential impact of a breach on confidentiality, integrity, and availability of federal information."
            },
            {
                q: "HITRUST CSF is significant in healthcare compliance because it:",
                opts: [
                    "Replaces HIPAA as the primary healthcare privacy regulation",
                    "Integrates multiple frameworks including HIPAA, NIST, ISO, and PCI into a single certifiable framework",
                    "Is the only framework accepted by the HHS Office for Civil Rights",
                    "Applies exclusively to electronic health record (EHR) vendors"
                ],
                ans: 1,
                exp: "HITRUST CSF harmonizes requirements from HIPAA, NIST, ISO 27001, PCI DSS, and other frameworks into a single, certifiable security framework widely adopted in healthcare for demonstrating due diligence."
            },
            {
                q: "In the GRC (Governance, Risk, Compliance) model, the 'Risk' component is responsible for:",
                opts: [
                    "Setting the strategic direction and oversight structure for the organization",
                    "Ensuring adherence to laws, regulations, and internal policies",
                    "Identifying, assessing, and mitigating threats that could affect organizational objectives",
                    "Conducting annual financial audits and reporting to shareholders"
                ],
                ans: 2,
                exp: "In GRC, Risk management focuses on identifying, assessing, and treating risks that could prevent the organization from achieving its objectives. Governance sets direction; Compliance ensures adherence to requirements."
            },
            {
                q: "A Qualified Security Assessor (QSA) in the PCI DSS ecosystem is:",
                opts: [
                    "An internal employee certified to perform self-assessments",
                    "A government auditor assigned by the FTC to inspect payment processors",
                    "An automated scanning tool approved for network vulnerability assessments",
                    "A company certified by the PCI Security Standards Council to perform on-site PCI DSS assessments"
                ],
                ans: 3,
                exp: "A QSA is a company (and its individual assessors) certified by the PCI SSC to validate an entity's adherence to PCI DSS through on-site assessments. They produce Reports on Compliance (ROCs)."
            },
            {
                q: "Continuous compliance differs from point-in-time compliance in that it:",
                opts: [
                    "Requires a new audit every month rather than annually",
                    "Uses ongoing monitoring, automated controls, and real-time evidence collection to maintain compliance posture",
                    "Eliminates the need for external auditors entirely",
                    "Only applies to cloud-native organizations"
                ],
                ans: 1,
                exp: "Continuous compliance shifts from periodic audit snapshots to ongoing monitoring with automated evidence collection, continuous control testing, and real-time dashboards that maintain and demonstrate compliance between formal audits."
            },
            {
                q: "FedRAMP's Joint Authorization Board (JAB) consists of representatives from which three agencies?",
                opts: [
                    "FBI, NSA, and CISA",
                    "NIST, OMB, and GAO",
                    "DoD, DHS, and GSA",
                    "CIA, DoE, and Treasury"
                ],
                ans: 2,
                exp: "The JAB is the primary FedRAMP governance body, consisting of the CIOs from the Department of Defense (DoD), Department of Homeland Security (DHS), and General Services Administration (GSA)."
            },
            {
                q: "During a compliance audit, 'evidence of due diligence' most commonly includes:",
                opts: [
                    "A statement from the CEO affirming the organization's commitment to security",
                    "Insurance certificates covering the maximum possible breach liability",
                    "Employee satisfaction surveys demonstrating a positive security culture",
                    "Documented policies, training records, risk assessments, control testing results, and remediation tracking"
                ],
                ans: 3,
                exp: "Due diligence evidence includes documented policies, completed risk assessments, training records, control test results, audit logs, and tracked remediation of identified gaps -- demonstrating the organization actively manages its compliance obligations."
            },
            {
                q: "PCI DSS Requirement 3 focuses specifically on:",
                opts: [
                    "Maintaining a vulnerability management program",
                    "Implementing strong access control measures",
                    "Protecting stored account data",
                    "Building and maintaining a secure network"
                ],
                ans: 2,
                exp: "PCI DSS Requirement 3 addresses the protection of stored account data, including encryption, masking, hashing, and truncation of cardholder data, as well as key management procedures."
            },
            {
                q: "A SOC 2 audit report is intended primarily for which audience?",
                opts: [
                    "The service organization's customers, prospects, and their auditors under NDA",
                    "The general public and media",
                    "Federal regulatory agencies only",
                    "The service organization's internal development team"
                ],
                ans: 0,
                exp: "SOC 2 reports are restricted-use reports shared with customers, prospective customers, and their auditors, typically under NDA. They are not public documents like SOC 3 reports."
            },
            {
                q: "An organization seeking FedRAMP authorization through the agency path must:",
                opts: [
                    "Work with a specific federal agency sponsor that will issue an Authority to Operate (ATO)",
                    "Obtain approval from the JAB before any agency can sponsor them",
                    "Complete a self-assessment using the FedRAMP readiness checklist",
                    "Achieve ISO 27001 certification as a prerequisite"
                ],
                ans: 0,
                exp: "The agency authorization path requires a federal agency to sponsor the cloud service provider, review the security package prepared by a 3PAO, and issue an Agency ATO that can then be leveraged by other agencies."
            },
            {
                q: "The primary purpose of a GRC platform in an organization is to:",
                opts: [
                    "Replace the security operations center with automated threat detection",
                    "Generate penetration testing reports for external auditors",
                    "Serve as the organization's primary SIEM for log aggregation",
                    "Provide an integrated view of governance activities, risk posture, and compliance status across the enterprise"
                ],
                ans: 3,
                exp: "GRC platforms integrate governance, risk management, and compliance activities into a unified system, providing visibility into policy management, risk registers, control effectiveness, audit tracking, and compliance status across the enterprise."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;  // remember pick for the Review Answers view

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a thorough understanding of compliance frameworks and audit processes.';
            else if (pct >= 70) msg = 'Solid. Review any missed questions on PCI DSS, SOC 2, and FedRAMP specifics.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the compliance frameworks and GRC concepts.';
            else msg = 'Keep studying. Focus on how PCI DSS, SOC 2, FedRAMP, and HITRUST differ in scope and purpose.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w3-compliance-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w3-compliance-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
