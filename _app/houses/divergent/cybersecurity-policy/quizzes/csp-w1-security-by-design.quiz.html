<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Quiz: Security by Design | The Domino Effect</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;
            --bg-option: #1a0f1e;
            --primary: #ff00ff;
            --cyan: #00ffff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 0, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a060d 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--cyan); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; The Domino Effect Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 1 Quiz: Security by Design</h1>
            <p class="subtitle">Saltzer & Schroeder, SSDLC, STRIDE, Privacy by Design, DevSecOps, SBOM, NIST SSDF</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Course Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz: Security by Design --
           Saltzer & Schroeder principles, SSDLC, STRIDE, Privacy by Design,
           DevSecOps, SBOM, NIST SSDF.
           15 questions, 70% pass threshold. */
        var questions = [
            {
                q: "Saltzer and Schroeder's principle of 'economy of mechanism' states that security designs should be:",
                opts: [
                    "As simple and small as possible to reduce the likelihood of flaws",
                    "Cost-effective relative to the value of the assets they protect",
                    "Economically scalable across multiple deployment environments",
                    "Designed to minimize the number of security personnel required"
                ],
                ans: 0,
                exp: "Economy of mechanism means keeping security designs simple. Complex systems have more potential for flaws, are harder to analyze, and more difficult to verify. Simple mechanisms are easier to inspect, test, and trust."
            },
            {
                q: "The Saltzer and Schroeder principle of 'fail-safe defaults' means that:",
                opts: [
                    "Access decisions should be based on permission rather than exclusion -- deny by default",
                    "Systems should revert to a safe operational state after a hardware failure",
                    "Default passwords should be randomly generated during installation",
                    "Backup systems should activate automatically when primary systems fail"
                ],
                ans: 0,
                exp: "Fail-safe defaults mean that the default condition is lack of access. A subject must be explicitly granted permission rather than being excluded from a list. If an access control mechanism fails, it should fail closed (deny access) rather than fail open."
            },
            {
                q: "In the Secure Software Development Lifecycle (SSDLC), security requirements are ideally introduced at which phase?",
                opts: [
                    "Testing, where vulnerabilities are identified through scanning",
                    "Deployment, where hardening is applied to production systems",
                    "Requirements gathering, so security is built in from the start",
                    "Maintenance, where patches address discovered vulnerabilities"
                ],
                ans: 2,
                exp: "The SSDLC integrates security at every phase, but it begins at requirements gathering. Defining security requirements early -- authentication needs, data classification, compliance constraints -- is far cheaper and more effective than retrofitting security after development."
            },
            {
                q: "In the STRIDE threat model, the 'S' stands for Spoofing. What does spoofing refer to in this context?",
                opts: [
                    "Flooding a service with traffic to make it unavailable",
                    "Modifying data in transit without authorization",
                    "Pretending to be something or someone other than yourself",
                    "Gaining higher privileges than originally granted"
                ],
                ans: 2,
                exp: "Spoofing in STRIDE refers to impersonating another user, process, or system. Examples include IP spoofing, email spoofing, and session hijacking. The countermeasure is strong authentication to verify identity claims."
            },
            {
                q: "Which STRIDE category maps to the CIA triad element of integrity?",
                opts: [
                    "Spoofing",
                    "Denial of Service",
                    "Repudiation",
                    "Tampering"
                ],
                ans: 3,
                exp: "Tampering in STRIDE refers to unauthorized modification of data, which directly threatens integrity. Controls like hashing, digital signatures, message authentication codes (MACs), and access controls defend against tampering."
            },
            {
                q: "Ann Cavoukian's Privacy by Design framework includes seven foundational principles. Which of the following is one of those principles?",
                opts: [
                    "Privacy should be embedded into the design as a default setting, not as an add-on",
                    "Privacy protections should be applied only when users explicitly request them",
                    "Organizations should collect as much data as possible and filter it later",
                    "Privacy is a competitive disadvantage that must be balanced against revenue"
                ],
                ans: 0,
                exp: "Privacy by Design states that privacy should be the default setting -- personal data is automatically protected in any system. Users should not have to take action to protect their privacy. Other principles include proactive not reactive measures, full lifecycle protection, and transparency."
            },
            {
                q: "DevSecOps differs from traditional security practices by:",
                opts: [
                    "Eliminating the need for dedicated security teams",
                    "Deferring all security testing to a final gate before production deployment",
                    "Integrating automated security testing throughout the CI/CD pipeline so security is continuous",
                    "Replacing manual code review with AI-generated security assessments"
                ],
                ans: 2,
                exp: "DevSecOps shifts security left by integrating automated security testing (SAST, DAST, SCA, container scanning) throughout the development pipeline. Security is a shared responsibility of development, security, and operations teams -- not a final checkpoint before release."
            },
            {
                q: "A Software Bill of Materials (SBOM) provides:",
                opts: [
                    "A cost estimate for all software licenses used in a project",
                    "A security certification that the software has passed penetration testing",
                    "A list of all developers who contributed code to the project",
                    "A comprehensive inventory of all components, libraries, and dependencies in a software product"
                ],
                ans: 3,
                exp: "An SBOM is a nested inventory of all components in a software product -- open source libraries, commercial components, and their versions. It enables organizations to quickly identify whether they are affected by a newly discovered vulnerability in any component, as demonstrated by the Log4Shell crisis."
            },
            {
                q: "NIST's Secure Software Development Framework (SSDF) is organized around four practice groups. Which of the following is one of them?",
                opts: [
                    "Prepare the Organization (PO)",
                    "Deploy the Software (DS)",
                    "Monetize the Software (MS)",
                    "Scale the Infrastructure (SI)"
                ],
                ans: 0,
                exp: "The NIST SSDF (SP 800-218) defines four practice groups: Prepare the Organization (PO), Protect the Software (PS), Produce Well-Secured Software (PW), and Respond to Vulnerabilities (RV). Each group contains specific practices and tasks for secure software development."
            },
            {
                q: "The Saltzer and Schroeder principle of 'complete mediation' requires that:",
                opts: [
                    "All disputes between users and administrators are resolved through a formal mediation process",
                    "All security incidents must be fully investigated before the system is restored",
                    "All network traffic must pass through a centralized firewall",
                    "Every access to every resource must be checked against the access control mechanism -- no caching of previous decisions"
                ],
                ans: 3,
                exp: "Complete mediation means that every access to every object must be checked for authority. There should be no shortcuts or cached permissions. This prevents TOCTOU (time-of-check-to-time-of-use) vulnerabilities where permissions may have changed since the last check."
            },
            {
                q: "In STRIDE, 'Elevation of Privilege' refers to:",
                opts: [
                    "A user gaining administrative access through authorized role-based access control",
                    "An attacker gaining capabilities beyond what they are authorized to have",
                    "An organization increasing the security clearance level of an employee",
                    "A system automatically escalating alerts from low to high severity"
                ],
                ans: 1,
                exp: "Elevation of Privilege means an attacker gains higher access rights than authorized -- for example, a regular user exploiting a vulnerability to gain root/admin access. Buffer overflows, misconfigurations, and unpatched privilege escalation vulnerabilities are common attack vectors."
            },
            {
                q: "The 'open design' principle from Saltzer and Schroeder states that:",
                opts: [
                    "All security-relevant source code must be released as open source",
                    "The security of a mechanism should not depend on the secrecy of its design -- only on the secrecy of keys or passwords",
                    "Security designs should be open to public comment during a formal review period",
                    "Organizations should publish their incident response plans publicly"
                ],
                ans: 1,
                exp: "Open design (also known as Kerckhoffs' principle in cryptography) means security should not rely on obscurity. The design can be public; only specific secrets (keys, passwords) need to remain confidential. This allows broad peer review and eliminates single points of failure based on hidden designs."
            },
            {
                q: "Static Application Security Testing (SAST) in a DevSecOps pipeline analyzes:",
                opts: [
                    "Running applications by sending crafted HTTP requests to find vulnerabilities",
                    "Source code or compiled binaries without executing the application to find security flaws",
                    "Network traffic between microservices to detect anomalous communication patterns",
                    "Container images to verify they comply with CIS benchmarks"
                ],
                ans: 1,
                exp: "SAST (also called white-box testing) analyzes source code, bytecode, or binaries without executing the program. It can detect issues like SQL injection, XSS, buffer overflows, and hardcoded credentials early in development. DAST, by contrast, tests the running application from the outside."
            },
            {
                q: "The STRIDE threat category 'Denial of Service' maps to which CIA triad element?",
                opts: [
                    "Confidentiality",
                    "Integrity",
                    "Availability",
                    "Authentication"
                ],
                ans: 2,
                exp: "Denial of Service attacks target availability by overwhelming resources, crashing services, or otherwise preventing legitimate users from accessing systems. STRIDE maps each threat category to a security property: DoS directly threatens availability."
            },
            {
                q: "Executive Order 14028 (May 2021) on Improving the Nation's Cybersecurity required federal software suppliers to:",
                opts: [
                    "Open-source all software sold to the federal government",
                    "Provide SBOMs and attest to secure development practices aligned with the NIST SSDF",
                    "Obtain FedRAMP certification for all on-premises software installations",
                    "Replace all legacy software with cloud-native alternatives within two years"
                ],
                ans: 1,
                exp: "EO 14028 directed NIST to develop guidelines for secure software development (leading to the SSDF) and required software suppliers to the federal government to provide SBOMs and self-attest to following secure development practices. This elevated SBOM from a niche concept to a federal requirement."
            }
        ];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You understand how to build security in from the ground up.';
            else if (pct >= 70) msg = 'Solid. Review any design principles or frameworks you missed.';
            else if (pct >= 50) msg = 'Getting there. Revisit the Saltzer & Schroeder principles and STRIDE model.';
            else msg = 'Keep studying. Security by design is foundational -- re-read the material carefully.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.completeQuiz('divergent', 'csp-w1-security-by-design-quiz', score);
            }
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
