<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Quiz: Security Programs | The Domino Effect</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;
            --bg-option: #1a0f1e;
            --primary: #ff00ff;
            --cyan: #00ffff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 0, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a060d 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--cyan); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; The Domino Effect Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 2 Quiz: Security Programs</h1>
            <p class="subtitle">Program components, maturity models, SOC operations, vulnerability management, third-party risk, KPIs</p>
            <div class="meta">
                <span>Week 2</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz: Security Programs --
           Program components, maturity models, SOC, vulnerability management,
           third-party risk, KPIs, budget.
           15 questions, 70% pass threshold. */
        var questions = [{"q":"A comprehensive information security program typically includes all of the following EXCEPT:","opts":["Policies, standards, and procedures","Risk management and incident response capabilities","A guarantee that zero security incidents will occur","Security awareness training and vulnerability management"],"exp":"No security program can guarantee zero incidents. A mature program includes governance (policies, standards), risk management, technical controls, incident response, training, and continuous improvement. The goal is to reduce risk to an acceptable level, detect incidents quickly, and respond effectively."},{"q":"A security maturity model helps organizations by:","opts":["Providing a framework to assess the current state of security practices and plan a roadmap for improvement","Automatically fixing all security vulnerabilities discovered during scanning","Replacing the need for security policies and procedures","Guaranteeing compliance with all applicable regulatory requirements"],"exp":"Maturity models (like CMMI, C2M2, or NIST CSF tiers) provide a structured way to evaluate where an organization's security capabilities currently stand and define incremental steps for improvement. They typically range from ad hoc/reactive to optimized/proactive levels."},{"q":"A Security Operations Center (SOC) is primarily responsible for:","opts":["Continuous monitoring, detection, analysis, and response to security events and incidents","Developing new software applications for the organization","Managing the organization's financial accounting systems","Conducting annual compliance audits for regulatory bodies"],"exp":"The SOC is the centralized function responsible for monitoring the organization's security posture 24/7. SOC analysts use SIEM tools, EDR platforms, and threat intelligence to detect, triage, investigate, and respond to security events. SOC tiers (1/2/3) provide escalating levels of analysis expertise."},{"q":"In a typical SOC staffing model, a Tier 1 analyst is primarily responsible for:","opts":["Developing custom threat detection rules and performing advanced malware reverse engineering","Making strategic decisions about the organization's overall security architecture","Monitoring security alerts, performing initial triage, and escalating confirmed incidents","Conducting penetration tests and red team exercises against production systems"],"exp":"Tier 1 SOC analysts are the front line: they monitor dashboards and alerts, perform initial triage to determine if an alert is a true positive or false positive, document findings, and escalate confirmed incidents to Tier 2 for deeper investigation. They handle the highest volume of alerts."},{"q":"Vulnerability management is a continuous process that includes:","opts":["Running a single vulnerability scan once per year and filing the report","Only patching critical vulnerabilities rated CVSS 10.0","Discovery, scanning, assessment, prioritization, remediation, and verification of security vulnerabilities across the environment","Purchasing cyber insurance to cover the cost of exploited vulnerabilities"],"exp":"Vulnerability management is a lifecycle: discover assets, scan for vulnerabilities, assess and prioritize based on risk (CVSS score, exploitability, asset criticality), remediate (patch, mitigate, or accept), and verify the fix. This cycle repeats continuously as new vulnerabilities are disclosed daily."},{"q":"Third-party risk management (TPRM) is important because:","opts":["Third-party vendors never experience security breaches","Regulations prohibit organizations from using any third-party services","Organizations inherit risk from vendors, partners, and suppliers who access their data or systems","Third-party software is always more secure than internally developed software"],"exp":"Organizations extend their attack surface through every vendor, partner, and supplier connection. The Target breach (via HVAC vendor), SolarWinds supply chain attack, and Kaseya incident all demonstrate that third-party risk is real. TPRM includes vendor assessments, contractual security requirements, and ongoing monitoring."},{"q":"Mean Time to Detect (MTTD) as a security KPI measures:","opts":["The average time between system failures","The average time to deploy a security patch after it is released by the vendor","The average time to fully restore systems after a disaster","The average time from when a security incident occurs to when it is detected by the organization"],"exp":"MTTD measures detection speed -- how long threats remain undetected in the environment. A lower MTTD means faster detection. Industry studies show the average MTTD for data breaches can be over 200 days, during which attackers operate freely. Reducing MTTD is a primary SOC objective."},{"q":"Mean Time to Respond (MTTR) as a security KPI measures:","opts":["The average time from incident detection to containment and resolution","The average time for a user to report a phishing email to the security team","The average time between consecutive penetration tests","The average time to complete the annual security audit"],"exp":"MTTR measures response efficiency -- from detection to containment and recovery. A lower MTTR reduces the damage an attacker can cause. It is driven by the quality of incident response procedures, automation capabilities, team training, and playbook maturity."},{"q":"A security policy differs from a security standard in that:","opts":["A policy provides high-level, management-approved statements of intent and direction, while a standard defines specific mandatory requirements for implementation","A policy contains detailed technical configurations, while a standard provides general guidance","Policies are optional guidelines, while standards are legally binding regulations","There is no meaningful difference; the terms are interchangeable"],"exp":"Policies are high-level documents approved by senior management that state the organization's position on security (e.g., 'All data must be encrypted in transit'). Standards specify how to implement the policy (e.g., 'TLS 1.2 or higher must be used for all encrypted connections'). Procedures then detail the step-by-step process."},{"q":"The Common Vulnerability Scoring System (CVSS) is used to:","opts":["Track the number of security incidents per quarter","Rank security vendors by the quality of their products","Determine the total cost of a security breach for insurance purposes","Assign a numerical severity score (0.0-10.0) to security vulnerabilities based on their characteristics"],"exp":"CVSS provides a standardized method for scoring vulnerability severity on a 0.0-10.0 scale. It considers base metrics (attack vector, complexity, impact), temporal metrics (exploit maturity, patch availability), and environmental metrics (asset importance). Scores are: Low (0.1-3.9), Medium (4.0-6.9), High (7.0-8.9), Critical (9.0-10.0)."},{"q":"A vendor risk assessment typically evaluates:","opts":["Only the vendor's financial stability and market share","The vendor's marketing materials and customer testimonials","Only whether the vendor's products are cheaper than competitors","The vendor's security controls, compliance certifications, incident response capabilities, and data handling practices"],"exp":"Vendor risk assessments evaluate the security posture of third parties who will access organizational data or systems. They examine security controls (SOC 2 reports, ISO 27001 certification), data protection practices, incident response plans, business continuity capabilities, and regulatory compliance alignment."},{"q":"Security program budget justification to executive leadership is most effective when it:","opts":["Uses only technical jargon and vulnerability counts without business context","Frames security investments in terms of risk reduction, business enablement, and potential loss avoidance in dollar terms","Compares the organization's security spending to the average across all industries","Guarantees that security spending will prevent all future breaches"],"exp":"Executives think in terms of business risk and ROI. Effective security budget justification translates technical risks into business impact -- potential revenue loss, regulatory fines, reputational damage, operational disruption -- and shows how investments reduce those risks. Quantitative risk analysis (ALE, SLE, ARO) provides the financial framework."},{"q":"A Security Information and Event Management (SIEM) system provides value by:","opts":["Replacing the need for firewalls, IDS, and endpoint protection","Aggregating and correlating log data from multiple sources to identify patterns indicative of security incidents","Automatically patching all vulnerable systems across the network","Encrypting all data at rest and in transit across the organization"],"exp":"A SIEM collects, normalizes, and correlates log data from firewalls, servers, endpoints, applications, and other sources. Correlation rules and analytics identify patterns that may indicate attacks -- such as multiple failed logins followed by a successful login from an unusual location. The SIEM is the primary tool used by SOC analysts."},{"q":"The concept of 'acceptable risk' in a security program means:","opts":["The organization has zero tolerance for any security risk","The level of residual risk that management has deliberately chosen to accept after implementing controls, based on cost-benefit analysis","Any risk that has not yet been exploited by an attacker","Risks that are covered by the organization's cyber insurance policy"],"exp":"Acceptable risk (or risk appetite) is the level of risk that an organization's leadership deliberately decides to tolerate. Not all risks can or should be mitigated -- some are too expensive to address relative to their likelihood and impact. Risk acceptance must be a conscious, documented management decision, not a default of inaction."},{"q":"Patch management as a component of vulnerability management is challenging because:","opts":["Software vendors never release security patches","Patches must be tested for compatibility and business impact before deployment, creating a window of exposure","Patches are only available for open-source software, not commercial products","Regulatory frameworks prohibit patching production systems more than once per year"],"exp":"While patching is essential, it cannot always be immediate. Patches must be tested for compatibility with existing applications and configurations, scheduled during maintenance windows to minimize business disruption, and coordinated across diverse environments. This testing creates a window of exposure between patch release and deployment."}];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'csp-w2-programs-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You understand how security programs are built, measured, and managed.';
            else if (pct >= 70) msg = 'Solid. Review the program components and KPIs you missed.';
            else if (pct >= 50) msg = 'Getting there. Revisit the SOC tiers, maturity models, and vulnerability management lifecycle.';
            else msg = 'Keep studying. Security program management is a critical policy topic for the course.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w2-programs-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w2-programs-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
