<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Quiz: Origins of Cybersecurity | The Domino Effect</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;
            --bg-option: #1a0f1e;
            --primary: #ff00ff;
            --cyan: #00ffff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 0, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a060d 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }

        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; The Domino Effect Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 1 Quiz: Origins of Cybersecurity</h1>
            <p class="subtitle">Landmark incidents, breaches, and the events that shaped modern cybersecurity</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz: Origins of Cybersecurity --
           Landmark incidents from Morris Worm to Colonial Pipeline.
           15 questions, 70% pass threshold. */
        var questions = [{"q":"The Morris Worm (1988) is significant in cybersecurity history primarily because it:","opts":["Demonstrated that a self-replicating program could unintentionally cripple large portions of the Internet","Was the first virus to target Microsoft Windows systems","Led directly to the creation of the Department of Homeland Security","Was the first cyberattack attributed to a nation-state actor"],"exp":"Robert Tappan Morris released the worm in 1988 as an experiment, but a coding error caused it to replicate aggressively. It infected roughly 10% of the 60,000 computers connected to the Internet, demonstrating the fragility of networked systems and leading to the creation of CERT/CC."},{"q":"The Computer Fraud and Abuse Act (CFAA) of 1986 was enacted primarily to address:","opts":["Copyright infringement through digital file sharing","Mandatory breach notification requirements for corporations","The use of encryption by private citizens","Unauthorized access to computer systems and data theft"],"exp":"The CFAA was the first major U.S. federal law specifically targeting computer crime. It criminalized unauthorized access to protected computer systems and has been amended multiple times since to address evolving threats."},{"q":"The Melissa virus (1999) spread primarily through which mechanism?","opts":["Infected USB drives distributed at technology conferences","Exploitation of a buffer overflow vulnerability in Windows NT","Drive-by downloads from compromised web servers","Email attachments that, when opened, mass-mailed themselves to the first 50 contacts in the victim's Outlook address book"],"exp":"Melissa was a macro virus embedded in a Word document. When opened, it hijacked Microsoft Outlook and emailed itself to the first 50 contacts in the victim's address book, causing massive email server overloads worldwide."},{"q":"The ILOVEYOU worm (2000) caused an estimated         var current0 billion in damages. What social engineering technique made it so effective?","opts":["It masqueraded as a critical Windows security update","It impersonated messages from the victim's IT department","It used fear tactics claiming the recipient's bank account had been compromised","It arrived as an email with a love letter subject line that exploited human curiosity and trust"],"exp":"The ILOVEYOU worm arrived with the subject line 'ILOVEYOU' and an attachment called 'LOVE-LETTER-FOR-YOU.TXT.vbs.' It exploited basic human curiosity and emotion, making it one of the most successful social engineering attacks in history."},{"q":"Stuxnet, discovered in 2010, was groundbreaking because it:","opts":["Was the first malware to successfully demand a cryptocurrency ransom","Was the first known cyberweapon designed to cause physical damage to industrial control systems","Exploited a single zero-day vulnerability in Microsoft Windows","Targeted consumer banking systems across multiple countries simultaneously"],"exp":"Stuxnet targeted Siemens SCADA systems controlling uranium enrichment centrifuges at Iran's Natanz facility. It used four zero-day exploits and was designed to cause centrifuges to spin out of control while reporting normal operations -- the first known cyberweapon causing physical destruction."},{"q":"The 2013 Target data breach compromised approximately 40 million credit and debit card records. The initial attack vector was:","opts":["A compromised third-party HVAC vendor's network credentials","A spear-phishing email sent directly to Target's CIO","An unpatched vulnerability in Target's point-of-sale software","An insider threat from a disgruntled Target IT employee"],"exp":"Attackers first compromised Fazio Mechanical Services, an HVAC vendor with network access to Target. They used stolen credentials to pivot into Target's network, then deployed RAM-scraping malware on POS terminals. This breach highlighted the critical risk of third-party vendor access."},{"q":"The 2017 Equifax breach exposed sensitive personal data of approximately how many people?","opts":["14 million","50 million","147 million","500 million"],"exp":"The Equifax breach affected approximately 147 million people -- nearly half the U.S. population. It was caused by a failure to patch a known Apache Struts vulnerability (CVE-2017-5638) that had a patch available two months before the breach."},{"q":"WannaCry (2017) was a ransomware attack that spread globally within hours. Which leaked NSA exploit did it leverage?","opts":["Heartbleed","Shellshock","EternalBlue","BlueKeep"],"exp":"WannaCry used EternalBlue, an SMB exploit developed by the NSA and leaked by the Shadow Brokers group. Despite Microsoft releasing a patch (MS17-010) months earlier, hundreds of thousands of unpatched systems were compromised worldwide, including the UK's National Health Service."},{"q":"The SolarWinds supply chain attack (discovered December 2020) compromised organizations by:","opts":["Injecting malicious code into SolarWinds Orion software updates that were distributed to approximately 18,000 customers","Exploiting a zero-day in Microsoft Exchange Server to access SolarWinds customer email","Compromising SolarWinds employee VPN credentials through a phishing campaign","Deploying ransomware across SolarWinds data centers to exfiltrate customer data"],"exp":"Attackers (attributed to Russian intelligence, APT29/Cozy Bear) inserted a backdoor called SUNBURST into SolarWinds Orion software updates. Approximately 18,000 organizations installed the trojanized update, including multiple U.S. government agencies. This demonstrated the devastating potential of supply chain attacks."},{"q":"The Colonial Pipeline ransomware attack (May 2021) resulted in:","opts":["A permanent shutdown of the largest U.S. fuel pipeline","A six-day pipeline shutdown causing fuel shortages across the U.S. East Coast","The first successful attack against a nuclear power facility in the United States","Compromise of military fuel supply lines supporting NATO operations"],"exp":"The DarkSide ransomware group attacked Colonial Pipeline, which supplies roughly 45% of fuel to the U.S. East Coast. The company shut down operations for six days, causing widespread fuel shortages and panic buying. Colonial paid a $4.4 million ransom, though the DOJ later recovered most of it."},{"q":"What was the primary lesson from the 2014 Sony Pictures hack attributed to North Korea?","opts":["Entertainment companies are immune to nation-state attacks","Geopolitical motivations can drive destructive cyberattacks against private companies","Data encryption alone is sufficient to prevent data breaches","Nation-states only target government and military systems"],"exp":"North Korea's Lazarus Group attacked Sony Pictures in retaliation for the film 'The Interview.' The attack destroyed data, leaked unreleased films and private emails, and demonstrated that nation-states will target private companies for political reasons -- not just espionage or financial gain."},{"q":"The Heartbleed vulnerability (2014) affected which widely-used open-source software?","opts":["Apache HTTP Server","OpenSSL","Linux kernel","WordPress"],"exp":"Heartbleed (CVE-2014-0160) was a critical buffer over-read bug in OpenSSL's implementation of the TLS heartbeat extension. It allowed attackers to read up to 64KB of server memory per request, potentially exposing private keys, passwords, and session tokens from an estimated 17% of all secure web servers."},{"q":"The NotPetya attack (2017), which caused over         var current0 billion in global damages, initially spread through:","opts":["A compromised update mechanism in Ukrainian tax accounting software called M.E.Doc","Phishing emails targeting multinational corporations","Exploitation of the Heartbleed vulnerability in OpenSSL","Infected removable media distributed to government offices"],"exp":"NotPetya was disguised as ransomware but was actually a wiper designed to destroy data. It initially spread through a compromised update to M.E.Doc, widely used Ukrainian tax software. It then propagated using EternalBlue and credential harvesting, devastating companies like Maersk, Merck, and FedEx."},{"q":"The creation of CERT/CC (Computer Emergency Response Team Coordination Center) in 1988 was a direct response to which event?","opts":["The first documented phishing attack","The passage of the Computer Fraud and Abuse Act","The Morris Worm incident","The discovery of the first computer virus in the wild"],"exp":"CERT/CC was established at Carnegie Mellon University in November 1988 as a direct response to the Morris Worm. DARPA funded its creation to provide a centralized coordination point for internet security incidents, establishing the model for incident response teams worldwide."},{"q":"The 2020 Twitter hack that compromised high-profile accounts (Obama, Musk, Gates) to promote a Bitcoin scam was carried out primarily through:","opts":["Exploitation of a zero-day vulnerability in Twitter's API","A sophisticated malware campaign targeting Twitter's server infrastructure","Social engineering of Twitter employees to gain access to internal admin tools","A brute-force attack against weak passwords on verified accounts"],"exp":"A group of young hackers used phone-based social engineering (vishing) to manipulate Twitter employees into providing access to internal administrative tools. They then took over 130 high-profile accounts. The incident demonstrated that even major tech companies are vulnerable to social engineering targeting employees."}];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'csp-w1-origins-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { r = (r && r.data) ? r.data : r;
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a strong grasp of the incidents that shaped modern cybersecurity.';
            else if (pct >= 70) msg = 'Solid. Review any incidents you missed -- understanding the timeline matters for policy context.';
            else if (pct >= 50) msg = 'Getting there. Revisit the Week 1 readings on landmark breaches and their consequences.';
            else msg = 'Keep studying. Re-read the origins material and focus on what each incident taught the industry.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w1-origins-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w1-origins-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
