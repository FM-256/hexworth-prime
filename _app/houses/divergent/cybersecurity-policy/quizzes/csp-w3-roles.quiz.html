<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: Cybersecurity Roles | Cybersecurity Policy</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #16101c;
            --bg-option: #1a1222;
            --primary: #ff00ff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --cyan: #00ffff;
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --text-dim: #5a4460;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #120a18 50%, #1a0e24 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cybersecurity Policy Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 3 Quiz: Cybersecurity Roles</h1>
            <p class="subtitle">CISO, CIO, SOC roles, GRC roles, ISACs, CISA, public-private partnerships, career paths</p>
            <div class="meta">
                <span>Week 3</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz Engine: Cybersecurity Policy -- Week 3: Cybersecurity Roles --
           Topics: CISO, CIO, SOC roles, GRC roles, ISACs, CISA,
           public-private partnerships, career paths.
           Passing threshold: 70% (11/15). */
        var questions = [
            {
                q: "The CISO's primary responsibility within an organization is to:",
                opts: [
                    "Develop and execute the organization's information security strategy and program",
                    "Manage the IT help desk and end-user support operations",
                    "Approve all IT procurement decisions and vendor contracts",
                    "Write the source code for security tools used by the SOC"
                ],
                ans: 0,
                exp: "The Chief Information Security Officer (CISO) is responsible for establishing and maintaining the enterprise information security strategy, program, and policies to protect information assets and technologies."
            },
            {
                q: "In most enterprise reporting structures, the CISO ideally reports to:",
                opts: [
                    "The CIO, because security is a subset of IT operations",
                    "The CFO, because security budgets are financial decisions",
                    "The General Counsel, because security is primarily a legal matter",
                    "The CEO or Board directly, to ensure security independence from IT operations"
                ],
                ans: 3,
                exp: "Best practice recommends the CISO report to the CEO or Board to maintain independence from IT operations. When the CISO reports to the CIO, conflicts of interest can arise between operational speed and security rigor."
            },
            {
                q: "A SOC Tier 1 analyst is primarily responsible for:",
                opts: [
                    "Developing custom threat intelligence and hunting for advanced persistent threats",
                    "Designing the SOC architecture and selecting SIEM platforms",
                    "Monitoring alerts, performing initial triage, and escalating confirmed incidents",
                    "Conducting forensic investigations and writing incident reports for law enforcement"
                ],
                ans: 2,
                exp: "SOC Tier 1 analysts are the first line of defense. They monitor security alerts, perform initial triage to determine if alerts are true positives, and escalate confirmed incidents to Tier 2 for deeper investigation."
            },
            {
                q: "The CIO's role differs from the CISO's role in that the CIO primarily focuses on:",
                opts: [
                    "Protecting the organization from cyber threats and managing vulnerability programs",
                    "Conducting penetration tests and red team exercises",
                    "Managing the security operations center and incident response",
                    "Aligning IT strategy and infrastructure with business objectives to drive organizational value"
                ],
                ans: 3,
                exp: "The CIO is responsible for the overall IT strategy, infrastructure, and service delivery aligned with business goals. The CISO focuses specifically on information security. These roles complement each other but serve different functions."
            },
            {
                q: "Information Sharing and Analysis Centers (ISACs) serve the cybersecurity community by:",
                opts: [
                    "Providing sector-specific threat intelligence sharing and coordination among member organizations",
                    "Issuing mandatory compliance directives that member organizations must follow",
                    "Conducting offensive cyber operations against threat actors on behalf of their members",
                    "Replacing federal agencies as the primary incident response authority"
                ],
                ans: 0,
                exp: "ISACs are sector-specific organizations (Financial Services ISAC, Health ISAC, etc.) that facilitate threat intelligence sharing, best practices, and coordination among member organizations within a critical infrastructure sector."
            },
            {
                q: "CISA (Cybersecurity and Infrastructure Security Agency) operates under which federal department?",
                opts: [
                    "Department of Defense",
                    "Department of Justice",
                    "Department of Homeland Security",
                    "Department of Commerce"
                ],
                ans: 2,
                exp: "CISA was established in 2018 as an agency within the Department of Homeland Security. It serves as the national coordinator for critical infrastructure security and resilience."
            },
            {
                q: "A GRC analyst's day-to-day responsibilities typically include:",
                opts: [
                    "Mapping controls to regulatory requirements, tracking audit findings, and managing risk registers",
                    "Writing firewall rules and configuring intrusion detection systems",
                    "Performing malware reverse engineering and threat hunting",
                    "Managing network infrastructure and server patching schedules"
                ],
                ans: 0,
                exp: "GRC analysts focus on governance, risk, and compliance activities: mapping controls to frameworks, tracking compliance status, managing risk registers, supporting audits, and ensuring regulatory requirements are met."
            },
            {
                q: "A SOC Tier 3 analyst (or threat hunter) differs from Tier 1 and Tier 2 analysts because they:",
                opts: [
                    "Proactively search for threats that have evaded automated detection using hypothesis-driven investigation",
                    "Only respond to alerts generated by automated systems",
                    "Handle password resets and user access requests",
                    "Focus exclusively on writing compliance reports for management"
                ],
                ans: 0,
                exp: "Tier 3 analysts and threat hunters proactively search for undetected threats using hypothesis-driven hunting, advanced analytics, and deep knowledge of attacker TTPs, rather than waiting for automated alerts."
            },
            {
                q: "Public-private partnerships in cybersecurity are important because:",
                opts: [
                    "Private companies are legally required to share all threat data with the government",
                    "Critical infrastructure is largely owned by the private sector, making collaboration essential for national security",
                    "Government agencies lack the authority to respond to cyber incidents without private sector approval",
                    "Private companies fund all government cybersecurity programs"
                ],
                ans: 1,
                exp: "Approximately 85% of US critical infrastructure is owned and operated by the private sector. Effective cybersecurity requires collaboration between government (intelligence, policy) and private sector (infrastructure operations, innovation)."
            },
            {
                q: "The NICE Cybersecurity Workforce Framework (NIST SP 800-181) organizes cybersecurity work into:",
                opts: [
                    "Three certification levels: entry, intermediate, and expert",
                    "A single career ladder from analyst to CISO with mandatory time-in-grade requirements",
                    "Work roles defined by tasks, knowledge, and skills that describe cybersecurity work",
                    "Vendor-specific certification paths aligned to major security product lines"
                ],
                ans: 2,
                exp: "The NICE Framework (SP 800-181) defines cybersecurity work roles using tasks, knowledge, and skills (TKS) statements. It provides a common taxonomy for describing cybersecurity work across sectors."
            },
            {
                q: "An Incident Response Manager in a SOC is responsible for:",
                opts: [
                    "Monitoring SIEM dashboards for new alerts during their shift",
                    "Coordinating the overall incident response process, managing communication, and ensuring containment and recovery",
                    "Conducting vulnerability scans on a weekly schedule",
                    "Writing the organization's acceptable use policy"
                ],
                ans: 1,
                exp: "The Incident Response Manager coordinates the IR lifecycle: detection, containment, eradication, recovery, and lessons learned. They manage team resources, stakeholder communication, and ensure the response plan is followed."
            },
            {
                q: "A Chief Privacy Officer (CPO) differs from a CISO in that the CPO primarily focuses on:",
                opts: [
                    "Technical security controls and vulnerability management",
                    "Managing the security operations center and threat intelligence",
                    "Ensuring the organization's data practices comply with privacy laws and protect individual privacy rights",
                    "Overseeing physical security and facility access control"
                ],
                ans: 2,
                exp: "The CPO focuses on privacy compliance, data protection rights, and ensuring organizational data practices align with privacy regulations like GDPR and CCPA. The CISO focuses on security controls protecting information assets."
            },
            {
                q: "The Financial Services ISAC (FS-ISAC) is notable because it:",
                opts: [
                    "Regulates all banking cybersecurity standards in the United States",
                    "Is one of the oldest and most mature ISACs, facilitating rapid threat intelligence sharing across the global financial sector",
                    "Is a government agency that conducts audits of financial institutions",
                    "Only serves banks with assets exceeding $10 billion"
                ],
                ans: 1,
                exp: "FS-ISAC, established in 1999, is one of the most mature ISACs. It serves the global financial sector with real-time threat intelligence sharing, exercises, and coordination among thousands of member institutions of all sizes."
            },
            {
                q: "CISA's 'Shields Up' campaign is an example of:",
                opts: [
                    "A classified intelligence program for defense contractors",
                    "A public advisory urging organizations to strengthen cyber defenses during periods of heightened threat",
                    "A mandatory compliance requirement for federal agencies",
                    "An annual cybersecurity certification exam for federal employees"
                ],
                ans: 1,
                exp: "Shields Up is a CISA public awareness campaign that provides actionable guidance for organizations to strengthen their cybersecurity posture during periods of elevated geopolitical or cyber threat, such as during the Russia-Ukraine conflict."
            },
            {
                q: "A cybersecurity career path from entry-level to executive typically follows which progression?",
                opts: [
                    "Help desk, network admin, cloud architect, CEO",
                    "Programmer, database admin, project manager, CTO",
                    "Compliance auditor, financial analyst, risk officer, CFO",
                    "SOC analyst, senior analyst or engineer, security manager, director of security, CISO"
                ],
                ans: 3,
                exp: "A common cybersecurity career progression moves from SOC analyst (Tier 1) through senior analyst/engineer roles, into security management, then director-level positions, and ultimately to CISO for those pursuing the executive track."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;  // remember pick for the Review Answers view

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You understand cybersecurity organizational structures and career pathways well.';
            else if (pct >= 70) msg = 'Solid. Review any missed questions on SOC tiers, CISO responsibilities, and ISACs.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the roles, reporting structures, and partnership models.';
            else msg = 'Keep studying. Focus on how cybersecurity roles fit within organizational governance.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w3-roles-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w3-roles-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
