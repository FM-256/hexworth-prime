<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Quiz: Threat Landscape | The Domino Effect</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;
            --bg-option: #1a0f1e;
            --primary: #ff00ff;
            --cyan: #00ffff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 0, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a060d 50%, #110828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--cyan); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; The Domino Effect Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 2 Quiz: Threat Landscape</h1>
            <p class="subtitle">Malware types, DDoS, APTs, supply chain attacks, zero-days, RaaS, IoT threats, STIX/TAXII</p>
            <div class="meta">
                <span>Week 2</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz: Threat Landscape --
           Malware types, DDoS, APTs, supply chain attacks, zero-days,
           RaaS, IoT threats, STIX/TAXII.
           15 questions, 70% pass threshold. */
        var questions = [
            {
                q: "What distinguishes a worm from a virus?",
                opts: [
                    "A worm self-replicates and spreads without requiring a host file or user action",
                    "A worm requires user interaction to spread, while a virus does not",
                    "A worm only affects mobile devices, while a virus only affects desktop computers",
                    "A worm encrypts files for ransom, while a virus deletes them permanently"
                ],
                ans: 0,
                exp: "Worms are self-replicating malware that spread independently across networks without needing to attach to a host program or require user interaction. Viruses, by contrast, need a host file and typically require the user to execute the infected file to propagate."
            },
            {
                q: "Ransomware as a Service (RaaS) has transformed the threat landscape by:",
                opts: [
                    "Lowering the technical barrier to entry so that affiliates with minimal skills can launch ransomware campaigns",
                    "Making ransomware attacks exclusive to nation-state actors",
                    "Eliminating the need for cryptocurrency in ransom payments",
                    "Ensuring that all ransomware attacks are now decryptable by law enforcement"
                ],
                ans: 0,
                exp: "RaaS operates on an affiliate model: developers create and maintain the ransomware platform while affiliates (who may lack technical skills) deploy it against targets in exchange for a percentage of the ransom. Groups like LockBit, BlackCat/ALPHV, and REvil have used this model to scale operations dramatically."
            },
            {
                q: "A Distributed Denial of Service (DDoS) attack works by:",
                opts: [
                    "Encrypting a target's data and demanding payment for the decryption key",
                    "Intercepting and modifying network traffic between two communicating parties",
                    "Overwhelming a target's resources with traffic from many compromised systems (a botnet) to make it unavailable",
                    "Exploiting a vulnerability in the target's authentication system to gain admin access"
                ],
                ans: 2,
                exp: "DDoS attacks use a botnet -- a network of compromised devices -- to flood the target with more traffic than it can handle, exhausting bandwidth, CPU, memory, or connection state tables. Common types include volumetric (bandwidth flooding), protocol (SYN floods), and application layer (HTTP floods) attacks."
            },
            {
                q: "An Advanced Persistent Threat (APT) is characterized by:",
                opts: [
                    "A prolonged, targeted campaign by well-resourced actors (often nation-states) seeking strategic objectives",
                    "A single automated scan that exploits known vulnerabilities across thousands of targets",
                    "A one-time phishing attack that targets random email addresses",
                    "A script kiddie using publicly available exploit kits against unpatched systems"
                ],
                ans: 0,
                exp: "APTs are sophisticated, long-term campaigns conducted by well-funded threat actors (often nation-states or state-sponsored groups). They use advanced techniques, maintain persistent access, and pursue strategic objectives like espionage, intellectual property theft, or infrastructure disruption -- not quick financial gain."
            },
            {
                q: "A supply chain attack targets:",
                opts: [
                    "Trusted third-party software, services, or vendors to compromise their downstream customers",
                    "The physical supply chain of hardware components during shipping",
                    "The network connections between a company's regional offices",
                    "Employee personal devices used for remote work"
                ],
                ans: 0,
                exp: "Supply chain attacks compromise trusted software updates, third-party libraries, or vendor access to reach the ultimate target. SolarWinds (SUNBURST), Kaseya, and the 3CX compromise are prominent examples. These attacks exploit the trust relationship between organizations and their suppliers."
            },
            {
                q: "A zero-day vulnerability is dangerous because:",
                opts: [
                    "It was discovered zero days ago and has already been patched by the vendor",
                    "It only affects systems that have not been updated in the last zero days",
                    "It is known to attackers but has no available patch, leaving defenders with zero days of protection",
                    "It can only be exploited once before becoming ineffective"
                ],
                ans: 2,
                exp: "A zero-day is a vulnerability that is unknown to the vendor or for which no patch exists. The term refers to the fact that defenders have had zero days to address it. Zero-days are highly valuable in the exploit market because there is no defense other than general mitigations like behavioral detection."
            },
            {
                q: "A trojan horse in cybersecurity refers to:",
                opts: [
                    "A type of encryption algorithm that hides data within other data",
                    "A network scanning tool used by penetration testers",
                    "Malware disguised as legitimate software that performs malicious functions once installed",
                    "A hardware implant placed on a network switch to intercept traffic"
                ],
                ans: 2,
                exp: "Named after the Greek myth, a trojan is malware that disguises itself as useful or legitimate software to trick users into installing it. Unlike viruses or worms, trojans do not self-replicate. Common types include banking trojans, remote access trojans (RATs), and dropper trojans that install other malware."
            },
            {
                q: "IoT devices present unique security challenges primarily because:",
                opts: [
                    "They use quantum encryption that is incompatible with existing security tools",
                    "International law prohibits scanning or patching IoT devices after deployment",
                    "They operate exclusively on cellular networks that cannot be monitored",
                    "Many ship with default credentials, lack update mechanisms, and have limited compute resources for security controls"
                ],
                ans: 3,
                exp: "IoT devices often ship with default or hardcoded passwords, run outdated firmware with no auto-update capability, lack the CPU/memory for robust security controls, and have long lifespans without vendor support. The Mirai botnet demonstrated the risk by compromising millions of IoT devices with default credentials."
            },
            {
                q: "STIX (Structured Threat Information eXpression) is:",
                opts: [
                    "A programming language for writing intrusion detection system rules",
                    "A commercial threat intelligence platform operated by the Department of Homeland Security",
                    "A government classification system for categorizing the severity of cyberattacks",
                    "A standardized language for representing and sharing cyber threat intelligence in a machine-readable format"
                ],
                ans: 3,
                exp: "STIX is an open standard (maintained by OASIS) that defines a structured format for sharing threat intelligence -- including indicators of compromise (IOCs), threat actors, campaigns, attack patterns, and relationships between them. It enables automated sharing and correlation of threat data across organizations."
            },
            {
                q: "TAXII (Trusted Automated eXchange of Indicator Information) is best described as:",
                opts: [
                    "A malware analysis sandbox that detonates suspicious files in an isolated environment",
                    "An incident response framework developed by the European Union",
                    "A tax reporting requirement for organizations that pay cryptocurrency ransoms",
                    "The transport protocol and services used to exchange STIX-formatted threat intelligence between systems"
                ],
                ans: 3,
                exp: "TAXII defines the transport mechanisms (collections, channels, API services) for exchanging STIX-formatted threat intelligence. Together, STIX and TAXII form the backbone of automated threat intelligence sharing, enabling organizations to consume and share IOCs, threat actor profiles, and vulnerability information at machine speed."
            },
            {
                q: "Fileless malware is particularly difficult to detect because:",
                opts: [
                    "It only infects systems that are not connected to the internet",
                    "It operates entirely in memory and leverages legitimate system tools, leaving minimal traces on disk",
                    "It encrypts itself with a unique key for each infection",
                    "It disguises itself as a Windows device driver that loads before the operating system"
                ],
                ans: 1,
                exp: "Fileless malware lives in memory and uses legitimate tools like PowerShell, WMI, or .NET to execute malicious actions. Since it does not write traditional files to disk, it evades signature-based antivirus and leaves minimal forensic artifacts. Detection requires memory analysis and behavioral monitoring."
            },
            {
                q: "A rootkit's primary purpose is to:",
                opts: [
                    "Encrypt files and demand a ransom for decryption",
                    "Flood a target with network traffic to cause a denial of service",
                    "Hide the presence of malware or unauthorized access by modifying the operating system at a deep level",
                    "Harvest cryptocurrency by using the victim's CPU and GPU resources"
                ],
                ans: 2,
                exp: "Rootkits operate at the kernel, bootloader, or firmware level to conceal malicious activity from the operating system, security tools, and administrators. They can hide processes, files, registry keys, and network connections, making detection extremely difficult. Some rootkits survive OS reinstallation by persisting in firmware."
            },
            {
                q: "A logic bomb is a type of malware that:",
                opts: [
                    "Spreads automatically across networks by exploiting SMB vulnerabilities",
                    "Activates its payload only when a specific condition is met, such as a date, event, or trigger",
                    "Uses artificial intelligence to adapt its behavior based on the target environment",
                    "Targets logic circuits in programmable logic controllers (PLCs) in industrial environments"
                ],
                ans: 1,
                exp: "Logic bombs are malicious code embedded in a system that remains dormant until a predefined condition triggers it -- a specific date, a user logging in, a file being deleted, or an employee being terminated from the HR system. They are often planted by insiders with legitimate access."
            },
            {
                q: "Cryptojacking refers to:",
                opts: [
                    "Stealing cryptocurrency from exchange wallets through credential theft",
                    "The unauthorized use of a victim's computing resources to mine cryptocurrency",
                    "Encrypting a victim's files and demanding cryptocurrency as ransom",
                    "Using stolen credentials to access cryptocurrency trading platforms"
                ],
                ans: 1,
                exp: "Cryptojacking hijacks CPU/GPU resources on compromised systems or through malicious browser scripts to mine cryptocurrency (typically Monero) for the attacker. Victims experience degraded performance and increased energy costs. It is often delivered through compromised websites, malicious ads, or trojanized software."
            },
            {
                q: "The Mirai botnet (2016) was significant because it:",
                opts: [
                    "Was the first botnet to exclusively target enterprise servers running Linux",
                    "Demonstrated the massive scale of DDoS attacks possible by compromising hundreds of thousands of IoT devices with default credentials",
                    "Used quantum computing to break encryption on targeted financial institutions",
                    "Was operated by a nation-state to disrupt critical infrastructure in the United States"
                ],
                ans: 1,
                exp: "Mirai scanned the internet for IoT devices (cameras, routers, DVRs) using a table of 62 common default username/password pairs. It built a botnet of over 300,000 devices and launched record-breaking DDoS attacks, including one against Dyn DNS that disrupted access to Twitter, Netflix, Reddit, and other major sites."
            }
        ];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;  // remember pick for the Review Answers view

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a thorough understanding of the modern threat landscape.';
            else if (pct >= 70) msg = 'Solid. Review the threat categories you missed -- knowing your enemy is half the battle.';
            else if (pct >= 50) msg = 'Getting there. Revisit the malware taxonomy and threat actor categories.';
            else msg = 'Keep studying. Understanding threats is essential for building effective security policy.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w2-threats-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w2-threats-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
