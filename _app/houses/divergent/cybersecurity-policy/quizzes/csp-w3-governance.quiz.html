<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: Governance Frameworks | Cybersecurity Policy</title>
    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #16101c;
            --bg-option: #1a1222;
            --primary: #ff00ff;
            --primary-dim: rgba(255, 0, 255, 0.15);
            --cyan: #00ffff;
            --text: #ede0f0;
            --text-muted: #9a82a0;
            --text-dim: #5a4460;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #120a18 50%, #1a0e24 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }

        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.4) !important;
            color: var(--primary);
        }
        .btn-retry:hover { background: var(--primary); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cybersecurity Policy Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 3 Quiz: Governance Frameworks</h1>
            <p class="subtitle">COBIT 2019, ISO 27001, ISMS, PDCA, policy hierarchy, governance structures, risk appetite</p>
            <div class="meta">
                <span>Week 3</span>
                <span>15 Questions</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Policy Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Quiz Engine: Cybersecurity Policy -- Week 3: Governance Frameworks --
           Topics: COBIT 2019, ISO 27001, ISMS, PDCA, policy hierarchy,
           governance structures, risk appetite.
           Passing threshold: 70% (11/15). */
        var questions = [
            {
                q: "COBIT 2019 is built around a core principle that distinguishes governance from management. Which statement best captures that distinction?",
                opts: [
                    "Governance handles day-to-day security operations; management sets long-term strategic direction",
                    "Governance is performed by the CISO; management is performed by the board of directors",
                    "Governance sets direction and monitors performance; management plans, builds, runs, and monitors operations",
                    "Governance applies only to IT departments; management applies to the entire organization"
                ],
                ans: 2,
                exp: "COBIT 2019 explicitly separates governance (evaluate, direct, monitor) from management (plan, build, run, monitor). The board governs; executives and staff manage."
            },
            {
                q: "In the ISO 27001 standard, an Information Security Management System (ISMS) is defined as:",
                opts: [
                    "A set of policies, procedures, and controls systematically managing an organization's information security risks",
                    "A software platform that automates vulnerability scanning and patch management",
                    "A government certification program required for handling classified data",
                    "A technical architecture specification for network segmentation and access control"
                ],
                ans: 0,
                exp: "ISO 27001 defines an ISMS as a systematic approach encompassing people, processes, and technology to manage information security risks through policies, procedures, and controls."
            },
            {
                q: "The Plan-Do-Check-Act (PDCA) cycle applied to an ISMS places risk assessment and treatment planning in which phase?",
                opts: [
                    "Plan -- because risk assessment informs the design of controls before implementation",
                    "Do -- because risk assessment is an operational activity",
                    "Check -- because risk assessment evaluates the current state",
                    "Act -- because risk findings drive corrective actions"
                ],
                ans: 0,
                exp: "In PDCA, the Plan phase identifies risks and designs appropriate controls. Do implements them, Check monitors and measures, and Act drives improvements based on findings."
            },
            {
                q: "An organization's policy hierarchy typically follows which top-down order?",
                opts: [
                    "Standards, Guidelines, Policies, Procedures",
                    "Policies, Standards, Procedures, Guidelines",
                    "Guidelines, Policies, Procedures, Standards",
                    "Procedures, Standards, Guidelines, Policies"
                ],
                ans: 1,
                exp: "The standard policy hierarchy flows: Policies (high-level mandates from leadership), Standards (specific mandatory requirements), Procedures (step-by-step instructions), and Guidelines (recommended best practices)."
            },
            {
                q: "Which COBIT 2019 design factor directly addresses how much risk the enterprise is willing to accept in pursuit of its objectives?",
                opts: [
                    "Enterprise strategy",
                    "IT-related goals",
                    "Risk profile",
                    "Threat landscape"
                ],
                ans: 2,
                exp: "COBIT 2019 uses design factors to tailor the governance system. The risk profile design factor captures the organization's risk appetite and current risk exposure to calibrate governance intensity."
            },
            {
                q: "ISO 27001 Annex A controls are organized into how many control themes in the 2022 revision?",
                opts: [
                    "14 control domains",
                    "6 themes aligned with NIST CSF functions",
                    "20 control families matching NIST 800-53",
                    "4 themes: Organizational, People, Physical, Technological"
                ],
                ans: 3,
                exp: "The 2022 revision of ISO 27001 restructured Annex A from 14 domains into 4 themes: Organizational, People, Physical, and Technological controls, with 93 total controls."
            },
            {
                q: "Risk appetite is best described as:",
                opts: [
                    "The total monetary loss an organization can absorb before insolvency",
                    "The probability that a specific threat will exploit a given vulnerability",
                    "The residual risk remaining after all controls have been implemented",
                    "The amount and type of risk an organization is willing to pursue or retain to achieve its objectives"
                ],
                ans: 3,
                exp: "Risk appetite is the broad level of risk an organization is willing to accept in pursuit of its strategic objectives. It is set by the board and guides all downstream risk decisions."
            },
            {
                q: "In COBIT 2019, the governance objective EDM01 focuses on:",
                opts: [
                    "Ensuring resource optimization across IT investments",
                    "Ensured governance framework setting and maintenance",
                    "Managing security incidents and continuity planning",
                    "Monitoring compliance with external regulations"
                ],
                ans: 1,
                exp: "EDM01 (Ensured Governance Framework Setting and Maintenance) establishes the governance structure, principles, and processes that guide the enterprise's IT governance system."
            },
            {
                q: "A cybersecurity policy that states 'All remote access must use multi-factor authentication' is an example of which level in the policy hierarchy?",
                opts: [
                    "Policy -- it is a high-level strategic directive",
                    "Standard -- it specifies a mandatory technical requirement",
                    "Procedure -- it describes step-by-step implementation",
                    "Guideline -- it recommends but does not mandate a practice"
                ],
                ans: 1,
                exp: "This is a standard: it specifies a mandatory, measurable requirement (MFA for remote access). A policy would state the broader goal; a procedure would detail how to configure MFA."
            },
            {
                q: "The 'Check' phase of PDCA in an ISMS context primarily involves:",
                opts: [
                    "Deploying new security tools and training staff",
                    "Drafting the information security policy and defining the ISMS scope",
                    "Implementing corrective actions based on audit findings",
                    "Monitoring, measuring, and auditing the ISMS to evaluate control effectiveness"
                ],
                ans: 3,
                exp: "Check is the evaluation phase: internal audits, management reviews, performance metrics, and monitoring determine whether the ISMS is performing as intended."
            },
            {
                q: "Which governance body is ultimately accountable for cybersecurity risk in a publicly traded company?",
                opts: [
                    "The Chief Information Security Officer (CISO)",
                    "The Board of Directors",
                    "The IT Security Operations Center (SOC)",
                    "The Chief Technology Officer (CTO)"
                ],
                ans: 1,
                exp: "Ultimate accountability for enterprise risk, including cybersecurity risk, rests with the Board of Directors. The CISO and CTO execute the board's risk directives but do not bear ultimate governance accountability."
            },
            {
                q: "COBIT 2019 replaced the single process maturity model from COBIT 5 with what capability-based system?",
                opts: [
                    "A COBIT Performance Management (CPM) system using capability levels 0-5 based on ISO/IEC 33000",
                    "A five-level CMMI-based maturity model",
                    "A binary pass/fail certification model aligned with ISO 27001",
                    "A three-tier rating of Basic, Intermediate, and Advanced"
                ],
                ans: 0,
                exp: "COBIT 2019 uses a capability model based on ISO/IEC 33000 (which superseded ISO 15504) with levels 0-5 (Incomplete through Optimizing) to assess process capability, replacing the simpler COBIT 5 maturity approach."
            },
            {
                q: "ISO 27001 requires that the ISMS scope definition must consider:",
                opts: [
                    "Only the IT department's assets and personnel",
                    "Exclusively the assets listed in the organization's most recent penetration test report",
                    "Internal and external issues, interested party requirements, and interfaces with activities not in scope",
                    "Only systems that process personally identifiable information"
                ],
                ans: 2,
                exp: "ISO 27001 clause 4 requires the ISMS scope to account for internal/external context, requirements of interested parties, and the boundaries and interfaces with out-of-scope activities."
            },
            {
                q: "Risk tolerance differs from risk appetite in that risk tolerance:",
                opts: [
                    "Is set by the board while risk appetite is set by operational managers",
                    "Applies only to financial risks while risk appetite covers all risk types",
                    "Defines the acceptable variation from the risk appetite for specific objectives or risk categories",
                    "Is a qualitative measure while risk appetite is always quantitative"
                ],
                ans: 2,
                exp: "Risk tolerance specifies the acceptable range of variation around the risk appetite for specific objectives. Risk appetite is the broad strategic statement; tolerance is the operational boundary."
            },
            {
                q: "An organization completing an ISO 27001 certification audit must demonstrate that its ISMS achieves which of the following?",
                opts: [
                    "Continual improvement through the PDCA cycle with documented evidence of risk treatment decisions",
                    "Zero security incidents during the audit period",
                    "Implementation of every Annex A control without exception",
                    "Alignment with NIST 800-53 control baselines at the moderate impact level"
                ],
                ans: 0,
                exp: "ISO 27001 certification requires demonstrating a functioning ISMS with continual improvement, not zero incidents or implementation of every control. A Statement of Applicability documents which controls apply and which are excluded with justification."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have a strong grasp of IT governance frameworks and structures.';
            else if (pct >= 70) msg = 'Solid. Review any missed questions on COBIT 2019 and ISO 27001 concepts.';
            else if (pct >= 50) msg = 'You are getting there. Revisit the governance and ISMS material before moving on.';
            else msg = 'Keep studying. Focus on the COBIT 2019 principles, ISO 27001 PDCA cycle, and policy hierarchy.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.completeQuiz('divergent', 'csp-w3-governance-quiz', score);
            }
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
