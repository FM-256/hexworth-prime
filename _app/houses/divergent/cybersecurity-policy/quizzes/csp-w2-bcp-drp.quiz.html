    <style>
        :root {
            --bg: #0d0810;
            --bg-card: #120b14;

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }

        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }

        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }

        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }

        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--cyan); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(255, 0, 255, 0.4); background: rgba(255, 0, 255, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(255, 0, 255, 0.08); }

        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(255, 0, 255, 0.15); color: var(--primary); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }

                @media (max-width: 640px) {

        }

    <script>
        /* -- Quiz: BCP & Disaster Recovery --
           BCP vs DRP, BIA, RTO/RPO/MTD, DR sites, 3-2-1 backup,
           IR lifecycle, testing types.
           15 questions, 70% pass threshold. */
        var questions = [
            {
                q: "What is the primary difference between a Business Continuity Plan (BCP) and a Disaster Recovery Plan (DRP)?",
                opts: [
                    "BCP addresses maintaining overall business operations during and after a disruption, while DRP focuses specifically on restoring IT systems and data",
                    "BCP is only for natural disasters, while DRP covers cyberattacks",
                    "DRP is a broader plan that includes BCP as a subset",
                    "BCP is developed by the IT department, while DRP is developed by human resources"
                ],
                ans: 0,
                exp: "BCP is the broader plan that addresses how the entire organization will continue operating during a disruption -- including people, processes, facilities, and communications. DRP is a subset of BCP that focuses specifically on restoring IT infrastructure, systems, and data after a disaster."
            },
            {
                q: "A Business Impact Analysis (BIA) is conducted to:",
                opts: [
                    "Determine which business functions are critical and quantify the impact of their disruption over time",
                    "Identify all known vulnerabilities in the organization's network infrastructure",
                    "Calculate the total cost of ownership for the organization's IT assets",
                    "Evaluate the performance of the incident response team during simulated exercises"
                ],
                ans: 0,
                exp: "The BIA identifies critical business functions, quantifies the financial and operational impact of their disruption, and establishes recovery priorities. It produces key metrics including MTD, RTO, and RPO for each function, which drive the design of BCP and DRP strategies."
            },
            {
                q: "Recovery Time Objective (RTO) defines:",
                opts: [
                    "The maximum acceptable duration for restoring a business function after a disruption",
                    "The maximum amount of data loss measured in time that is acceptable to the organization",
                    "The total time required to complete a full system backup",
                    "The time interval between scheduled disaster recovery tests"
                ],
                ans: 0,
                exp: "RTO is the maximum acceptable time to restore a business function or system after a disruption. If a system has a 4-hour RTO, it must be restored within 4 hours of going down. RTO drives decisions about recovery strategies, redundancy, and DR site selection."
            },
            {
                q: "Recovery Point Objective (RPO) defines:",
                opts: [
                    "The maximum acceptable time to restore operations after a disaster",
                    "The point in the recovery process where normal operations can resume",
                    "The total number of recovery points stored in the backup system",
                    "The maximum acceptable amount of data loss measured as a time interval -- how far back in time you can afford to lose data"
                ],
                ans: 3,
                exp: "RPO determines the maximum tolerable data loss. An RPO of 1 hour means the organization can tolerate losing up to 1 hour of data. This drives backup frequency -- an RPO of 1 hour requires backups at least every hour. Near-zero RPO requires real-time replication."
            },
            {
                q: "Maximum Tolerable Downtime (MTD) represents:",
                opts: [
                    "The longest time that a critical function can be unavailable before the organization faces unacceptable consequences",
                    "The average time between system failures calculated over a one-year period",
                    "The maximum number of concurrent users a system can support before performance degrades",
                    "The longest acceptable time for a help desk ticket to remain unresolved"
                ],
                ans: 0,
                exp: "MTD (also called Maximum Tolerable Period of Disruption, MTPD) is the absolute maximum time a business function can be down before the organization suffers irreversible harm -- financial failure, regulatory penalties, or loss of life. MTD must be greater than RTO; RTO is the target, MTD is the hard limit."
            },
            {
                q: "A hot site disaster recovery facility provides:",
                opts: [
                    "An empty building shell with power and cooling but no IT equipment",
                    "A mobile computing trailer that can be deployed to any location within 48 hours",
                    "A facility with pre-installed hardware but no current data, requiring data restoration from backups",
                    "A fully equipped facility with real-time data replication that can take over operations within minutes to hours"
                ],
                ans: 3,
                exp: "A hot site is the most expensive and fastest DR option. It maintains duplicate hardware, software, and real-time or near-real-time data replication. Failover can occur within minutes to hours. It provides the lowest RTO and RPO but requires significant ongoing investment."
            },
            {
                q: "A cold site disaster recovery facility provides:",
                opts: [
                    "A facility with pre-installed servers, storage, and network infrastructure, but no current data",
                    "A fully operational duplicate of the primary data center with live data",
                    "A basic facility (power, cooling, connectivity) that requires hardware to be procured, installed, and configured before use",
                    "A virtual cloud environment that scales automatically during a disaster"
                ],
                ans: 2,
                exp: "A cold site is the least expensive DR option. It provides a physical space with basic utilities (power, HVAC, network connectivity) but no pre-installed IT equipment. Hardware must be procured, installed, configured, and data restored from backups, resulting in recovery times of days to weeks."
            },
            {
                q: "The 3-2-1 backup rule states that you should maintain:",
                opts: [
                    "3 types of encryption, 2 authentication factors, and 1 firewall",
                    "3 recovery sites, 2 backup administrators, and 1 incident commander",
                    "3 daily backups, 2 weekly backups, and 1 monthly backup",
                    "3 copies of data, on 2 different media types, with 1 copy stored offsite"
                ],
                ans: 3,
                exp: "The 3-2-1 rule is a proven backup strategy: keep 3 total copies of your data (1 primary + 2 backups), store them on 2 different types of media (disk + tape, or disk + cloud), and keep 1 copy offsite (or in the cloud). This protects against hardware failure, site destruction, and ransomware."
            },
            {
                q: "The NIST Incident Response lifecycle consists of four phases. Which is the correct order?",
                opts: [
                    "Detection, Containment, Eradication, Recovery",
                    "Preparation, Detection and Analysis, Containment/Eradication/Recovery, Post-Incident Activity",
                    "Assessment, Response, Remediation, Closure",
                    "Identification, Protection, Detection, Response"
                ],
                ans: 1,
                exp: "NIST SP 800-61r2 defines four phases: (1) Preparation -- building capabilities before incidents occur, (2) Detection and Analysis -- identifying and investigating incidents, (3) Containment, Eradication, and Recovery -- stopping the attack, removing the threat, restoring systems, (4) Post-Incident Activity -- lessons learned and process improvement."
            },
            {
                q: "A tabletop exercise for disaster recovery testing involves:",
                opts: [
                    "Actually shutting down production systems and failing over to the DR site",
                    "A discussion-based walkthrough where key stakeholders talk through a disaster scenario and their planned responses",
                    "Running automated scripts that simulate hardware failures across the network",
                    "Hiring a red team to conduct a surprise simulated attack on the organization"
                ],
                ans: 1,
                exp: "Tabletop exercises are low-cost, discussion-based simulations where participants walk through a disaster scenario step by step. They identify gaps in plans, unclear roles, and communication breakdowns without any disruption to production systems. They are typically the first type of test conducted for new or updated plans."
            },
            {
                q: "A warm site disaster recovery facility is best described as:",
                opts: [
                    "A site that mirrors the primary data center with real-time data synchronization",
                    "A site with hardware and software pre-installed but requiring data restoration from recent backups before becoming operational",
                    "A mobile facility that can be transported to the disaster location",
                    "A site that only provides power and cooling with no pre-installed equipment"
                ],
                ans: 1,
                exp: "A warm site is a middle-ground DR option between hot and cold. It has pre-installed hardware and software infrastructure but does not maintain real-time data. Data must be restored from recent backups. Recovery time is typically hours to days, making it less expensive than a hot site but faster than a cold site."
            },
            {
                q: "During the 'Containment' phase of incident response, the primary objective is to:",
                opts: [
                    "Identify the root cause of the incident and document all findings for legal proceedings",
                    "Limit the scope and magnitude of the incident to prevent further damage while preserving evidence",
                    "Restore all affected systems to their pre-incident state as quickly as possible",
                    "Notify all regulatory bodies and affected individuals about the data breach"
                ],
                ans: 1,
                exp: "Containment focuses on stopping the spread of the incident and limiting damage. Short-term containment isolates affected systems (network segmentation, account disabling), while long-term containment implements temporary fixes to allow business operations. Evidence preservation is critical during containment for forensic analysis."
            },
            {
                q: "A full interruption test of a disaster recovery plan involves:",
                opts: [
                    "Reviewing the DRP document for completeness and accuracy without any operational testing",
                    "Conducting a parallel test where both primary and DR sites run simultaneously",
                    "Actually shutting down primary operations and processing work at the DR site to validate full recovery capability",
                    "Sending a survey to all employees to assess their awareness of DR procedures"
                ],
                ans: 2,
                exp: "A full interruption test is the most rigorous and riskiest type of DR test. Primary operations are actually halted and processing is transferred to the DR site. It provides the most realistic validation but carries the risk of extended downtime if the test fails. Most organizations reserve this for mature, well-tested plans."
            },
            {
                q: "The 'Post-Incident Activity' (Lessons Learned) phase of incident response is important because it:",
                opts: [
                    "Determines the criminal penalties for the attackers who caused the incident",
                    "Calculates the insurance payout the organization will receive for the incident",
                    "Identifies what worked, what failed, and what improvements are needed to prevent recurrence and improve future response",
                    "Provides the marketing team with information to issue a public statement"
                ],
                ans: 2,
                exp: "Post-incident activity reviews the entire incident and response to identify root causes, document what worked and what did not, update detection signatures and response procedures, and improve organizational resilience. Without this phase, organizations are likely to repeat the same mistakes in future incidents."
            },
            {
                q: "An incremental backup strategy captures:",
                opts: [
                    "All data on the system regardless of whether it has changed since the last backup",
                    "Only the data that has changed since the last full backup",
                    "Only the data that has changed since the last backup of any type (full or incremental)",
                    "A compressed copy of the entire operating system and all installed applications"
                ],
                ans: 2,
                exp: "Incremental backups capture only the data that has changed since the last backup of any type. This makes each incremental backup smaller and faster. However, restoration requires the last full backup plus every subsequent incremental backup in sequence, making recovery slower and more complex than differential backups."
            }
        ];

                var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];  // index of option picked by user, per question

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;  // remember pick for the Review Answers view

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You understand how organizations plan for and recover from disruptions.';
            else if (pct >= 70) msg = 'Solid. Review the recovery metrics (RTO/RPO/MTD) and DR site types you missed.';
            else if (pct >= 50) msg = 'Getting there. Revisit the BCP/DRP fundamentals and NIST IR lifecycle.';
            else msg = 'Keep studying. Business continuity and disaster recovery are core policy topics.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                // Record completion only on passing (70%). completeQuiz expects PERCENTAGE, not raw count.
                try {
                    ModuleProgress.completeQuiz('divergent', 'csp-w2-bcp-drp-quiz', pct, { returnToDashboard: false });
                } catch (e) {
                    console.warn('[csp-w2-bcp-drp-quiz] ModuleProgress.completeQuiz failed:', e);
                }
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
