    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-final',
            scenario: {

                title: 'Operation Iron Veil',
                subtitle: 'A coordinated nation-state cyber campaign strikes a NATO member during election week. Power grids fail, hospitals are ransomed, government secrets leak, and disinformation floods social media. You are the National Cybersecurity Advisor. 45 million citizens are counting on you.',

                briefing: 'The Republic of Valdania -- population 45 million, GDP $800 billion, NATO member since 2009, EU accession candidate since 2023 -- has never faced a serious cyberattack. Its cybersecurity posture reflects this: 200 trained cybersecurity professionals across all government agencies, legacy SCADA systems in critical infrastructure with no security architecture, a national CERT that exists on paper but has never handled a real incident, and a draft cybersecurity strategy that has been "under review" in parliament for three years. You were appointed National Cybersecurity Advisor six months ago after a distinguished career in the private sector. Your mandate was to modernize. You have barely begun. It is Monday of election week. The presidential election is Saturday. Intelligence services have detected reconnaissance activity against the power grid SCADA systems -- unusual scanning patterns from IP ranges associated with Valdania\'s hostile neighbor to the east, the Karelian Federation. Simultaneously, the government\'s cloud email provider reports suspicious access from Karelian military IP ranges. Social media platforms flag coordinated inauthentic behavior targeting both presidential candidates. You are alone in your office at 22:00 when the first alert hits your phone. The next seven days will determine whether Valdania survives as a functioning democracy -- or becomes the next cautionary tale in the textbooks, alongside Estonia 2007, Georgia 2008, and Ukraine 2015.',

                intelCards: [
                    { dimension: 'technical', label: 'Attack Surface', value: 'Power grid SCADA (3 regions, 1970s-era), government cloud email, 14 hospital networks, election infrastructure, classified defense networks' },
                    { dimension: 'technical', label: 'Workforce', value: '200 cybersecurity professionals nationwide -- 120 government, 50 military, 30 private sector on retainer' },
                    { dimension: 'financial', label: 'Economic Exposure', value: '$800B GDP, $2B+ daily economic activity dependent on power grid, $500M in foreign direct investment under review' },
                    { dimension: 'financial', label: 'Ransomware Demand', value: '4 hospitals ransomed at $10M each -- $40M total, demanded in cryptocurrency' },
                    { dimension: 'regulatory', label: 'International Obligations', value: 'NATO member (Article 5), EU NIS2 Directive (applicant must demonstrate compliance), Budapest Convention signatory' },
                    { dimension: 'reputational', label: 'Election Integrity', value: 'Presidential election in 6 days, 15% projected turnout drop, deepfake video of PM circulating' },
                    { dimension: 'political', label: 'Geopolitical Context', value: 'Hostile neighbor (Karelian Federation) opposes Valdania\'s EU accession, NATO Article 5 threshold untested for cyber' },
                    { dimension: 'legislative', label: 'Legal Gaps', value: 'No national cybersecurity law, no mandatory incident reporting, no legal framework for offensive cyber operations' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'political', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Multi-vector nation-state attack across all critical infrastructure sectors simultaneously. Power grid SCADA systems from the 1970s had zero security architecture -- no network segmentation, no monitoring, default credentials still in place. The government cloud email compromise was a supply chain attack through a trusted vendor. Hospital ransomware exploited unpatched systems with flat networks. Election infrastructure ran on the same government network as compromised email. The kill chain was textbook: reconnaissance, weaponization, delivery via supply chain, exploitation of legacy systems, installation of persistent backdoors, command and control via encrypted channels, and actions on objectives across all targets simultaneously. With only 200 cybersecurity professionals for 45 million people, the nation had no capacity to detect, contain, or respond at scale.',
                        metric: '5 sectors hit simultaneously | 1970s SCADA with 0 security controls | 200 defenders for 45M people | Full kill chain executed'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Total economic impact estimated at $2.3 billion. Power outage affecting 2 million people for 72+ hours disrupted all commercial activity in three regions. Hospital ransomware shut down 4 major facilities, diverting patients and cancelling 800+ scheduled procedures. Government operations paralyzed for a week. Foreign direct investment reviews frozen -- three multinational companies paused $500M in planned investment pending stability assessment. Tourism sector (8% of GDP) saw immediate 30% cancellation spike. Credit rating agencies placed Valdania on negative watch.',
                        metric: '$2.3B total economic impact | 2M without power 72h | $500M FDI frozen | Credit rating negative watch'
                    },
                    regulatory: {
                        severity: 3,
                        timing: 'long',
                        description: 'Valdania\'s EU accession application requires demonstration of NIS2 Directive compliance -- the attack exposed that Valdania has none of the required critical infrastructure protection measures. NATO\'s Cooperative Cyber Defence Centre of Excellence (CCDCOE) assessment found Valdania\'s cyber defense capabilities at Tier 0 on their maturity model. The Budapest Convention on Cybercrime, which Valdania signed, requires mutual legal assistance capabilities that Valdania cannot currently provide. The EU accession timeline, previously estimated at 2027, is now uncertain.',
                        metric: 'NIS2 compliance: 0% | NATO CCDCOE maturity: Tier 0 | Budapest Convention obligations unmet | EU accession delayed'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'Election integrity is the foundational reputational concern. A deepfake video of the Prime Minister making inflammatory statements circulated to 3 million citizens before platforms could remove it. International election observers questioned whether conditions exist for a free and fair election. Foreign media framed Valdania as a failed state unable to protect its own democratic processes. The "200 cybersecurity professionals for 45 million people" statistic became a viral talking point illustrating national unpreparedness. Allied nations publicly expressed concern about Valdania\'s resilience.',
                        metric: '3M citizens exposed to deepfake | International observers questioning election | "Failed state" media framing'
                    },
                    political: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'The attack during election week created an unprecedented political crisis. The sitting government faced accusations of negligence for the cybersecurity posture. The opposition demanded election postponement. NATO allies debated whether a cyberattack meets the Article 5 threshold -- the Tallinn Manual says it can, but no precedent exists. The Karelian Federation\'s denial, combined with a counter-disinformation campaign claiming Valdania staged the attack to delay elections, split public opinion. Domestic hawks demanded military retaliation. Doves demanded diplomatic engagement. The public demanded someone take charge.',
                        metric: 'Election legitimacy questioned | Article 5 threshold debate | Attribution contested | Public divided on response'
                    },
                    legislative: {
                        severity: 4,
                        timing: 'long',
                        description: 'The attack exposed that Valdania has virtually no cyber legislation. No mandatory incident reporting for critical infrastructure operators. No legal authority for offensive cyber operations. No data protection law aligned with GDPR (required for EU accession). No legal framework for emergency cyber powers. No whistleblower protections for cybersecurity researchers. The draft cybersecurity strategy stalled in parliament for three years must now be completely rewritten to address the post-attack reality. International treaty obligations under NATO and Budapest Convention require legislative implementation that does not exist.',
                        metric: '0 cyber laws on the books | No incident reporting mandate | No offensive cyber authority | EU accession requires GDPR alignment'
                    }
                },

                /* ==============================================================
                   TIMESTEP 1: Day -3 (Monday) -- "The Warning Signs"
                   W1 Origins (Estonia/Georgia/Ukraine parallels), W1 Concepts (kill chain recon phase),
                   W2 Threats (APT recon, supply chain indicators), W3 Roles (intel services, CERT)
                   ============================================================== */
                timesteps: [
                    {
                        timeLabel: 'Day -3 (Monday) -- The Warning Signs',
                        situation: 'Your phone buzzes at 22:00. Three alerts in rapid succession. First: the military intelligence directorate reports unusual network scanning against power grid SCADA systems -- the source IP ranges are associated with Karelian Federation military cyber units. The scanning patterns match the reconnaissance phase of a kill chain. Second: the government\'s cloud email provider (a European company, GovCloud EU) reports suspicious access to cabinet-level email accounts from IP addresses geolocated to Karelian military facilities. The provider cannot confirm whether data was exfiltrated yet. Third: social media monitoring flags a 400% spike in coordinated inauthentic behavior -- bot networks are amplifying divisive content about both presidential candidates. The patterns match known Karelian information operations templates documented by the EU East StratCom Task Force. This is the playbook you studied in your training: Estonia 2007 started with DDoS and information operations. Georgia 2008 paired cyber with kinetic military action. Ukraine 2015 started with SCADA reconnaissance weeks before the power grid attack. The question is not whether an attack is coming. The question is what you do in the next 72 hours before it hits.',
                        evidence: [
                            { text: 'Military intelligence: SCADA scanning from Karelian military IP ranges -- kill chain reconnaissance phase', reliability: 'high' },
                            { text: 'GovCloud EU: suspicious cabinet email access from Karelian military IPs -- exfiltration unconfirmed', reliability: 'medium' },
                            { text: 'Social media: 400% spike in coordinated inauthentic behavior matching Karelian IO templates', reliability: 'high' },
                            { text: 'EU East StratCom assessment: patterns consistent with pre-attack information preparation of the battlespace', reliability: 'medium' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Raise the national cyber threat level to CRITICAL, activate the national CERT, brief the Prime Minister and National Security Council, and notify NATO CCDCOE through established channels -- treat this as a pre-attack warning consistent with Estonia 2007 and Ukraine 2015 patterns',
                                score: 3,
                                optimal: true,
                                flags: { nato_alerted: true, cert_activated: true, threat_raised: true },
                                consequence: 'Correct. The reconnaissance patterns, combined with the election timing and the historical precedents of Estonia (2007), Georgia (2008), and Ukraine (2015), make this a textbook pre-attack indicator. Raising the threat level activates emergency protocols and puts all critical infrastructure operators on alert. Activating the CERT -- even though it has never handled a real incident -- begins the mobilization process. Notifying NATO CCDCOE through official channels is critical because NATO has standing offers of cyber defense assistance that take 48-72 hours to deploy. Those 72 hours matter. The Prime Minister must know because political decisions during the attack will require pre-briefed context.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Early CERT activation and CI operator alerts enabled basic hardening measures before the main attack.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Pre-briefed PM and NSC enabled faster political decision-making when the attack hit.' },
                                    reputational: { severityDelta: 0, description: 'NATO notification demonstrated alliance integration. Allies noted the professional early warning.' }
                                }
                            },
                            {
                                text: 'Launch a quiet investigation -- task military intelligence to confirm the scanning attribution, have the CERT monitor without alerting CI operators, and keep this at the advisor level until evidence is conclusive',
                                score: 1,
                                optimal: false,
                                flags: { quiet_investigation: true },
                                consequence: 'The instinct to gather more evidence before escalating is understandable but dangerous in this context. Ukraine\'s power grid operators had warning signs weeks before the December 2015 attack -- the delay in raising alarms meant defensive measures were not in place when the attack executed. A "quiet investigation" with 200 cybersecurity professionals who have never handled a real incident means the investigation will be slow, and CI operators who could be hardening their systems are kept in the dark. The 72-hour window before the likely attack is being spent on confirmation rather than preparation.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'CI operators received no advance warning. When the attack hit, SCADA systems were in their default vulnerable state.' },
                                    political: { severityDelta: 1, description: 'PM and NSC were blindsided when the attack hit. The advisor\'s decision to keep them uninformed became a political liability.' },
                                    reputational: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Dismiss the alerts as routine pre-election noise -- hostile nations always increase cyber activity around elections, and escalating based on scanning and bot activity risks a diplomatic incident with the Karelian Federation that could overshadow the election itself',
                                score: 0,
                                optimal: false,
                                flags: { threat_dismissed: true },
                                consequence: 'This is the answer that gets people killed. Estonia\'s government initially dismissed the 2007 DDoS as "protest activity." Ukraine\'s grid operators in 2015 saw reconnaissance but treated it as routine scanning. In both cases, the dismissal cost critical preparation time. SCADA scanning from military IP ranges is not "routine noise" -- it is the targeting phase of a military cyber operation. Bot network amplification at 400% baseline is not normal election interference -- it is information preparation of the battlespace. Dismissing these indicators when the historical playbook is this clear represents a fundamental failure to apply the lessons of W1 Origins.',
                                modifiers: {
                                    technical: { severityDelta: 2, description: 'Zero preparation. Every system was in its default vulnerable state. The attack achieved complete tactical surprise.' },
                                    political: { severityDelta: 2, description: 'The advisor who dismissed the warnings became the face of the failure. Career-ending decision.' },
                                    reputational: { severityDelta: 1, description: 'International investigation revealed the dismissed warnings. "They knew and did nothing" became the headline.' }
                                }
                            }
                        ]
                    },

                    /* ==============================================================
                       TIMESTEP 2: Day 0 (Thursday) -- "The Strike"
                       W1 Concepts (CIA triad violation), W1 Security by Design (SCADA failures),
                       W2 Threats (APT, supply chain, ransomware, DDoS, disinfo simultaneously),
                       W3 Laws (Tallinn Manual, Article 5)
                       ============================================================== */
                    {
                        timeLabel: 'Day 0 (Thursday) -- The Strike',
                        situation: 'At 03:00, the attack begins. Power grid SCADA systems in three regions are compromised simultaneously -- 2 million people lose electricity. The attack methodology is sophisticated: the attackers did not just disrupt the grid, they overwrote firmware on industrial control systems, making recovery require physical replacement of components. Government email is fully compromised -- classified cabinet communications about defense posture and EU accession strategy have been exfiltrated and are appearing on leak sites. Four major hospitals are hit with ransomware, demanding $10M each in cryptocurrency. Surgeries are cancelled. ICU monitoring systems are offline. Patients in critical condition must be transferred. A deepfake video of the Prime Minister apparently calling for "armed resistance against foreign interference" goes viral -- 3 million views in 2 hours before platforms can respond. The election is in 48 hours. Every pillar of the CIA triad is under simultaneous attack: confidentiality (government secrets leaked), integrity (deepfake undermining trust in information), availability (power grid, hospitals, government systems offline). Your 200 cybersecurity professionals are facing a multi-front nation-state operation designed to overwhelm exactly this kind of small defending force.',
                        evidence: [
                            { text: 'Power grid: 3 regions offline, ICS firmware overwritten -- recovery requires physical component replacement', reliability: 'high' },
                            { text: 'Government email: classified cabinet comms on leak sites, supply chain vector through GovCloud EU', reliability: 'high' },
                            { text: '4 hospitals ransomed: surgeries cancelled, ICU monitoring offline, patient transfers underway', reliability: 'high' },
                            { text: 'Deepfake of PM: 3M views in 2 hours, content calls for "armed resistance" -- platforms slow to remove', reliability: 'high' },
                            { text: 'Attribution: 75% confidence Karelian military cyber unit based on TTPs, infrastructure, and timing', reliability: 'medium' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,

                        variants: [
                            {
                                condition: { nato_alerted: true },
                                situation: 'At 03:00, the attack begins. Power grid SCADA in three regions compromised -- 2 million without power, ICS firmware overwritten requiring physical replacement. Government email fully compromised via supply chain -- classified cabinet comms appearing on leak sites. Four hospitals ransomed at $10M each -- surgeries cancelled, ICU systems offline. Deepfake of PM goes viral -- 3M views in 2 hours. But your early NATO notification is paying dividends: NATO CCDCOE has pre-positioned a Rapid Reaction Team of 30 elite cyber defenders who arrive within 6 hours. Estonia, which survived its own 2007 attack, sends its national CERT team with firsthand experience in exactly this type of operation. The EU Agency for Cybersecurity (ENISA) activates its crisis coordination mechanism. You are not alone -- but the attack is still overwhelming.'
                            },
                            {
                                condition: { quiet_investigation: true },
                                situation: 'At 03:00, the attack begins -- and your quiet investigation has yielded nothing actionable. Power grid SCADA in three regions compromised -- 2 million without power, ICS firmware overwritten. Government email fully compromised. Four hospitals ransomed. Deepfake of PM viral. Your military intelligence team was still tracing the reconnaissance when the main attack launched. The CERT, never activated, is scrambling to stand up operations from zero. CI operators who could have hardened their systems in the 72-hour window had no warning. NATO has not been notified -- you must now request emergency assistance through crisis channels, which adds 24-48 hours of diplomatic process before help arrives. The PM is furious that they were not briefed.'
                            },
                            {
                                condition: { threat_dismissed: true },
                                situation: 'At 03:00, the attack begins -- and Valdania is caught completely flat-footed. Power grid SCADA in three regions compromised simultaneously -- 2 million people lose power with ICS firmware overwritten. Government email fully compromised via supply chain. Four hospitals ransomed. Deepfake of PM goes viral. No one was prepared. No warnings were issued. No systems were hardened. No allies were notified. The CERT has never been activated and personnel cannot be reached at 03:00 on a Thursday. The PM learns about the attack from a television news alert, not from you. NATO learns from media reports, not from official channels. The 72-hour warning window you dismissed is now the most consequential intelligence failure in Valdanian history. You will be asked to explain this decision under oath.'
                            }
                        ],

                        decisions: [
                            {
                                text: 'Invoke national emergency powers, request NATO Article 5 consultation -- not full invocation but consultation under Article 4 first -- and establish a unified national crisis command integrating military, civilian, and international responders',
                                score: 3,
                                optimal: true,
                                flags: { emergency_declared: true, article4_invoked: true },
                                consequence: 'Precisely correct, and the distinction between Article 4 (consultation) and Article 5 (collective defense) is crucial. The Tallinn Manual 2.0, the most authoritative legal analysis of international law applied to cyber operations, establishes that cyber operations can reach the threshold of an "armed attack" under Article 5, but the threshold requires effects equivalent to a kinetic attack -- casualties, significant physical damage, or severe economic disruption. This attack is approaching that threshold but has not clearly crossed it yet. Article 4 consultation allows NATO to assess collectively, share intelligence, and prepare a coordinated response without the political and legal implications of an Article 5 declaration. The unified crisis command is essential because your 200 professionals cannot operate as separate fiefdoms across military, CERT, and civilian agencies.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Article 4 consultation demonstrated alliance solidarity without overplaying the hand. NATO allies rallied support through established mechanisms.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'Unified crisis command prevented the 200 defenders from being fragmented across agencies. Coordinated defense multiplied effective capacity.' },
                                    regulatory: { severityDelta: 0, description: 'Emergency powers provided legal authority for emergency cyber measures that peacetime law did not cover.' }
                                }
                            },
                            {
                                text: 'Invoke Article 5 immediately -- this is an armed attack on a NATO member state that has disabled critical infrastructure, threatened lives in hospitals, and attempted to subvert democratic elections',
                                score: 1,
                                optimal: false,
                                flags: { article5_invoked: true },
                                consequence: 'While the attack is severe, premature Article 5 invocation creates more problems than it solves. First, attribution is at 75% confidence -- Article 5 invocation against a named adversary without near-certain attribution risks a diplomatic catastrophe if the attribution is wrong or unprovable. Second, Article 5 requires consensus among all NATO members, and several allies will hesitate without higher confidence attribution. A failed Article 5 vote would be a devastating signal of alliance fracture -- exactly what the Karelian Federation wants. Third, the Tallinn Manual establishes that the "armed attack" threshold for cyber requires effects equivalent to kinetic force. While this attack is severe, no one has died yet. Article 4 consultation first, Article 5 in reserve.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Premature Article 5 invocation divided NATO allies. Three members publicly questioned the threshold, creating visible alliance discord.' },
                                    reputational: { severityDelta: 0, description: 'International media debated whether Valdania overreacted, shifting focus from the attack to the response.' },
                                    regulatory: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Maintain normal governance -- declare no emergency, handle this through existing government channels, and avoid any action that could be seen as escalatory toward the Karelian Federation',
                                score: 0,
                                optimal: false,
                                flags: { normal_governance: true },
                                consequence: 'Two million people are without power. Four hospitals are offline. Classified government communications are on leak sites. A deepfake video is inciting violence. The election is in 48 hours. "Normal governance" does not exist anymore -- the situation has overwhelmed normal channels. This is the cybersecurity equivalent of refusing to declare a natural disaster while buildings are still collapsing. Your existing government channels were built for peacetime operations and have no framework for coordinating a response to simultaneous attacks across five sectors. Without emergency powers, you lack the legal authority to commandeer private sector resources, compel CI operator cooperation, or redirect military assets to civilian defense.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Without emergency coordination, the 200 defenders operated independently across agencies. Response was fragmented and slow.' },
                                    political: { severityDelta: 1, description: 'Parliament demanded to know why emergency powers were not invoked. The opposition called for a vote of no confidence.' },
                                    reputational: { severityDelta: 1, description: 'International observers noted the inadequate governmental response. "Valdania\'s government was missing in action" -- Reuters.' }
                                }
                            }
                        ]
                    },

                    /* ==============================================================
                       TIMESTEP 3: Day 1 (Friday) -- "Triage"
                       W1 Workforce (NICE framework, 200 vs need), W3 Roles (CERT, ISAC, military cyber, intl partners),
                       W2 Programs (building program from crisis), W4 Sovereignty (accepting foreign help)
                       ============================================================== */
                    {
                        timeLabel: 'Day 1 (Friday) -- Triage',
                        situation: 'The sun rises on a nation in crisis. Power is still out in three regions. Hospitals are operating on generator backup with 48 hours of fuel. The election is tomorrow. You have 200 cybersecurity professionals and must decide how to allocate them across five critical sectors: hospitals (lives at immediate risk), power grid (2M affected, economic paralysis), government networks (classified data still being exfiltrated), election infrastructure (democracy itself at stake), and military defense networks (national security, possible kinetic escalation). International help is available but comes with sovereignty trade-offs. NATO CCDCOE offers a 30-person rapid reaction team with full access to classified NATO threat intelligence -- but they require unfettered access to Valdanian government networks, which means foreign military personnel inside your classified systems. The EU\'s ENISA offers technical assistance for CI protection -- but their assessment will feed directly into your EU accession evaluation, and any findings of negligence will be documented. Five Eyes intelligence partners offer signals intelligence on Karelian military communications -- but the intelligence-sharing agreement requires Valdania to share its own classified network architecture in return. CrowdStrike and Mandiant offer incident response teams at commercial rates -- $50,000/day each, no sovereignty strings attached, but no classified intelligence sharing either.',
                        evidence: [
                            { text: 'Hospital generator fuel: 48 hours remaining -- ICU patients and ventilator-dependent patients at mortal risk', reliability: 'high' },
                            { text: 'NATO CCDCOE: 30 elite defenders available in 6 hours, require full network access to classified systems', reliability: 'high' },
                            { text: 'ENISA: CI protection assistance available, assessment feeds EU accession evaluation', reliability: 'high' },
                            { text: 'Five Eyes: SIGINT on Karelian military comms available, requires reciprocal architecture sharing', reliability: 'medium' },
                            { text: 'Private sector (CrowdStrike/Mandiant): IR teams at $50K/day, no sovereignty implications', reliability: 'high' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,

                        variants: [
                            {
                                condition: { nato_alerted: true, emergency_declared: true },
                                situation: 'Day 1 triage -- but your preparation is paying off. The NATO CCDCOE rapid reaction team arrived 4 hours after the attack began because you pre-notified them Monday. Estonia\'s CERT team is already embedded with your national CERT sharing their 2007 playbook. The unified crisis command you established is functioning. You still have only 200 Valdanian professionals, but the 30 NATO specialists are already triaging the government network compromise. The critical decision now: how do you allocate your 200 people across hospitals, power grid, election infrastructure, and military networks -- and do you accept the deeper international assistance (ENISA, Five Eyes, private sector) that comes with sovereignty trade-offs? Hospital generators have 48 hours of fuel. The election is tomorrow.'
                            },
                            {
                                condition: { quiet_investigation: true },
                                situation: 'Day 1 triage -- and you are starting from behind. NATO assistance is still 24-48 hours away because you used crisis channels instead of pre-notification. Your national CERT, never activated before Thursday, is overwhelmed and disorganized. The 200 professionals are operating without unified command and several are freelancing -- the military cyber unit refuses to take direction from a civilian CERT and is focused exclusively on defense networks. A turf war is consuming 20% of your already inadequate workforce. International offers of help are arriving, but the sovereignty trade-offs remain. Hospital generators have 48 hours of fuel. The election is tomorrow.'
                            },
                            {
                                condition: { threat_dismissed: true },
                                situation: 'Day 1 triage -- and the situation is catastrophic. NATO was never notified and emergency assistance is 48-72 hours away at best. Your CERT is non-functional -- half the personnel could not be reached on Thursday night and are only now arriving. The 200 professionals are in complete disarray with no command structure, no playbook, and no coordination. Three of them have already resigned, citing impossible working conditions. The military cyber unit has gone autonomous, answering only to the defense minister. International assistance offers are flooding in but you have no mechanism to coordinate them. Hospital generators have 48 hours of fuel. The election is tomorrow. You are losing.'
                            }
                        ],

                        decisions: [
                            {
                                text: 'Accept all international assistance (NATO CCDCOE, ENISA, Five Eyes, and private sector IR teams), prioritize hospitals first (lives over systems), allocate 80 Valdanian professionals to hospitals and power grid, 60 to election infrastructure, 40 to government networks, and let NATO/private teams lead on military defense networks',
                                score: 3,
                                optimal: true,
                                flags: { accepted_international_help: true, prioritized_hospitals: true },
                                consequence: 'This is the correct triage. Lives first, democracy second, everything else third. The NICE Framework categorizes cybersecurity work into seven categories (Securely Provision, Operate and Maintain, Oversee and Govern, Protect and Defend, Analyze, Collect and Operate, Investigate). With only 200 professionals, you cannot cover all categories across all sectors -- you must specialize and supplement. Accepting international help is not a sovereignty failure; it is the definition of alliance membership. NATO exists precisely for this scenario. ENISA\'s assessment will document your response capabilities honestly -- and a strong crisis response despite limited resources is a better EU accession story than refusing help to hide weaknesses. The sovereignty "cost" of sharing network architecture with Five Eyes partners is trivial compared to the sovereignty cost of losing your democratic election to a foreign adversary.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Combined Valdanian + international force achieved 80% sector coverage. Hospital systems restored within 36 hours.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'International community praised Valdania\'s alliance-first approach. EU accession evaluation noted effective crisis coordination.' },
                                    financial: { severityDelta: 0, description: 'Private sector IR costs ($100K/day) were significant but dwarfed by the economic cost of extended outages.' }
                                }
                            },
                            {
                                text: 'Accept NATO and private sector help only (reject ENISA and Five Eyes to protect sovereignty), prioritize election infrastructure above all else -- the election is tomorrow and democracy is non-negotiable -- allocate 100 professionals to election systems with remaining split across other sectors',
                                score: 2,
                                optimal: false,
                                flags: { prioritized_elections: true, limited_international_help: true },
                                consequence: 'Prioritizing the election is understandable but allocating half your workforce to one sector while hospitals have 48 hours of generator fuel is a life-threatening miscalculation. Election infrastructure is critical for democracy, but ICU patients on ventilators will die if hospital power is not restored. The Hippocratic principle applies to national security too: first, do no harm. Rejecting ENISA and Five Eyes assistance to "protect sovereignty" is a false economy -- you are trading real defensive capability for an abstract principle while your nation is under active attack. Sovereignty means nothing if the attack succeeds because you refused help.',
                                modifiers: {
