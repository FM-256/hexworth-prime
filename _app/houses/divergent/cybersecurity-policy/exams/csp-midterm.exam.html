    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-midterm',
            scenario: {

                title: 'Operation Midnight Cascade',
                subtitle: 'A nation-state APT compromises a Fortune 500 healthcare conglomerate through a supply chain attack. 8 million patient records and classified DoD health data are at stake. All six impact dimensions are in play.',

                briefing: 'Meridian Health Systems (NYSE: MHS) is a Fortune 500 healthcare conglomerate operating 3 hospitals and 50 clinics, managing 8 million patient records, and processing $2 billion in annual insurance claims. Critically, Meridian also holds a classified Department of Defense subcontract for military health records worth $200 million per year. At 02:14 EST, the Security Operations Center detects anomalous outbound data transfers to a known command-and-control IP address. Simultaneously, ransomware notes appear on three hospital systems. SCADA systems managing building HVAC, oxygen delivery, and backup power are offline. Initial forensic triage suggests this is not opportunistic ransomware -- the C2 IP is associated with a nation-state APT group attributed to a near-peer adversary. The CISO position has been vacant for 6 months. The Business Continuity Plan has not been tested in 3 years. You are the interim crisis lead. Meridian\'s patients, shareholders, employees, and national security are in your hands.',

                intelCards: [
                    { dimension: 'technical', label: 'Attack Vector', value: 'Supply chain compromise via trojanized EHR vendor update -- 4-month dwell time suspected' },
                    { dimension: 'technical', label: 'Systems Affected', value: '3 hospital networks, 50 clinic systems, SCADA (HVAC, O2, backup power), EHR database' },
                    { dimension: 'financial', label: 'Market Cap', value: 'NYSE: MHS -- $18B market cap, $2B annual claims processing' },
                    { dimension: 'financial', label: 'DoD Contract', value: '$200M/year classified subcontract for military health records' },
                    { dimension: 'regulatory', label: 'Regulatory Exposure', value: 'HIPAA (8M records), FISMA (DoD data), SEC (publicly traded), PCI DSS ($2B claims)' },
                    { dimension: 'reputational', label: 'Patient Impact', value: '8M patients across 3 hospitals and 50 clinics -- trust is the product' },
                    { dimension: 'political', label: 'National Security', value: 'Classified DoD health records compromised -- near-peer adversary attribution' },
                    { dimension: 'legislative', label: 'Governance Gap', value: 'No CISO for 6 months, BCP untested 3 years, CIO suppressing audit findings' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'political', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Nation-state APT achieved full domain compromise through a supply chain attack on the EHR vendor. The trojanized update installed a persistent backdoor with a 4-month dwell time. The CFO\'s credentials -- reused across systems with no MFA -- provided domain admin escalation. All three pillars of the CIA triad are violated: Confidentiality (8M records exfiltrated), Integrity (backdoor in EHR system means data integrity is unknown), Availability (ransomware + SCADA offline). The vacant CISO position meant no one was accountable for the security posture that enabled this attack chain.',
                        metric: '4-month dwell | 8M records exfiltrated | CIA triad fully compromised | Supply chain vector'
                    },
                    financial: {
                        severity: 5,
                        timing: 'medium',
                        description: 'Total estimated breach cost: $1.2 billion. This includes incident response and forensics ($50M), regulatory fines across HIPAA/SEC/state AGs ($200M+), class action settlements ($300M+), DoD contract loss ($200M/year recurring), stock decline ($4B+ market cap loss at 22% drop), credit monitoring for 8M patients ($80M), system rebuild and security transformation ($200M), and increased cyber insurance premiums for a decade. For context, the Anthem breach (78.8M records, 2015) cost $350M in settlements alone.',
                        metric: '$1.2B total estimated | $200M/yr DoD contract at risk | 22% stock decline | $200M+ regulatory fines'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'Regulatory exposure spans four distinct frameworks. HIPAA: HHS Office for Civil Rights (OCR) investigation for the 8M-record breach, with penalties up to $1.9M per violation category per year. SEC: investigation into whether the breach was disclosed to investors in a timely manner and whether the CIO\'s suppression of audit findings constitutes securities fraud. FTC: Section 5 inquiry into unfair/deceptive practices regarding data protection promises. State AGs: multi-state coalition led by California (CCPA applies to CA residents in the dataset) pursuing civil enforcement.',
                        metric: 'HHS OCR + SEC + FTC + 50-state AG coalition | HIPAA + FISMA + PCI DSS + CCPA exposure'
                    },
                    reputational: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Healthcare data is the most sensitive category of personal information. 8 million patients now face identity theft, insurance fraud, and medical identity theft (where attackers use stolen records to obtain prescription drugs or file false claims). The DoD connection makes this a national security story, not just a healthcare story. Media coverage will be sustained and intense. The CIO\'s suppression of audit findings, when revealed, transforms the narrative from "sophisticated attack" to "negligent governance."',
                        metric: '8M patients exposed | National security angle | Suppressed audits = negligence narrative'
                    },
                    political: {
                        severity: 4,
                        timing: 'short',
                        description: 'The DoD subcontract compromise triggers national security review by DCSA (Defense Counterintelligence and Security Agency). Congressional committees with healthcare and defense jurisdiction will hold hearings. The nation-state attribution makes this a geopolitical incident, not just a corporate breach. The vacant CISO position becomes a political talking point about corporate responsibility for critical infrastructure protection.',
                        metric: 'DCSA security clearance review | Congressional hearings | Geopolitical incident | CISO vacancy as talking point'
                    },
                    legislative: {
                        severity: 4,
                        timing: 'long',
                        description: 'This breach accelerates multiple legislative initiatives: mandatory CISO reporting to boards (existing SEC rules proved insufficient), supply chain security requirements for healthcare vendors, federal breach notification standardization (replacing the current patchwork of state laws), and enhanced penalties for suppressing audit findings. The combination of healthcare, defense, and corporate governance failures provides ammunition for comprehensive cybersecurity legislation.',
                        metric: 'Mandatory CISO board reporting | Supply chain security mandates | Federal notification standardization'
                    }
                },

                /* ==============================================================
                   TIMESTEP 1: Hour 0 -- "The Alarm"
                   ============================================================== */
                timesteps: [
                    {
                        timeLabel: 'Hour 0 -- The Alarm',
                        situation: 'The SOC analyst on the overnight shift detects anomalous outbound data transfers to a known command-and-control IP flagged by your threat intelligence feed. Before the analyst can complete triage, ransomware notes appear simultaneously on systems across all three hospitals. SCADA systems managing building HVAC, medical oxygen delivery, and backup power generators go offline. The ransomware variant is identified as a tool associated with a nation-state APT group, not a typical criminal operation. On the CFO\'s laptop, forensic artifacts show credential dumping tools -- suggesting the CFO\'s account was used for lateral movement. The EHR vendor\'s patch log shows a suspicious update pushed 4 months ago that no one flagged. You have no CISO. Your BCP is 3 years stale. The board does not yet know.',
                        evidence: [
                            { text: 'C2 IP flagged by threat intel feed -- nation-state APT attribution', reliability: 'high' },
                            { text: 'Ransomware variant identified as APT-linked (not criminal RaaS)', reliability: 'medium' },
                            { text: 'CFO laptop: credential dump artifacts, domain admin token cached', reliability: 'high' },
                            { text: 'EHR vendor patch log: suspicious update 4 months ago (unverified)', reliability: 'low' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Isolate affected network segments immediately, preserve forensic evidence on isolated systems, and call the FBI Cyber Division -- this is a national security incident, not just ransomware',
                                score: 3,
                                optimal: true,
                                flags: { fbi_called: true, network_isolated: true },
                                consequence: 'Correct prioritization. Network isolation stops active exfiltration while preserving evidence (unlike a full shutdown which destroys volatile memory). Calling the FBI immediately is critical because the nation-state attribution and DoD data make this a national security matter. The FBI can provide classified threat intelligence, coordinate with NSA/CISA, and potentially identify the specific APT group\'s TTPs. Early FBI engagement also establishes a cooperative relationship that helps during the regulatory storm ahead.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Network isolation stopped active exfiltration. Forensic evidence preserved for attribution and remediation.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Early FBI engagement demonstrated seriousness and enabled classified threat briefings for the DoD contracting officer.' },
                                    regulatory: { severityDelta: 0, description: 'FBI coordination established a cooperative posture that benefited later regulatory interactions.' }
                                }
                            },
                            {
                                text: 'Keep systems running to preserve evidence while the SOC investigates the full scope -- we need to understand what we are dealing with before we act',
                                score: 1,
                                optimal: false,
                                flags: { systems_running: true },
                                consequence: 'Keeping compromised systems running to "preserve evidence" is a common but dangerous mistake. While volatile memory evidence is valuable, the active C2 connection means the attackers can continue exfiltrating data, deploy additional payloads, or wipe their tracks. Every minute the systems remain connected, the breach grows. Proper forensic preservation means isolating systems (which preserves memory state) -- not leaving them connected to attacker infrastructure.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Continued C2 connection allowed additional exfiltration of 200K records during the investigation delay.' },
                                    regulatory: { severityDelta: 1, description: 'Failure to contain a known active breach increases regulatory liability -- OCR considers containment speed in penalty calculations.' },
                                    reputational: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Shut down ALL systems including clinical operations -- full blackout to guarantee containment, then bring systems back one at a time after forensic clearance',
                                score: 2,
                                optimal: false,
                                flags: { full_blackout: true, clinical_down: true },
                                consequence: 'A full shutdown stops the attack but at enormous cost. Clinical systems going offline means electronic health records, medication dispensing systems, lab systems, and imaging are unavailable. Patients requiring immediate care must be diverted to other hospitals. SCADA was already offline, but shutting down remaining clinical systems converts a cybersecurity incident into a patient safety emergency. The correct approach is surgical isolation of network segments -- not a scorched-earth shutdown that harms patients.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Patient diversions and clinical shutdown generated immediate media coverage and public fear.' },
                                    financial: { severityDelta: 1, description: 'Full clinical shutdown cost an estimated $15M in diverted procedures, cancelled surgeries, and emergency transfers.' },
                                    political: { severityDelta: 1, description: 'Three patients diverted during the blackout became the lead story on national news.' }
                                }
                            }
                        ]
                    },

                    /* ==============================================================
                       TIMESTEP 2: Day 1 -- "The Scope"
                       ============================================================== */
                    {
                        timeLabel: 'Day 1 -- The Scope',
                        situation: 'Forensic analysis confirms the worst-case scenario. The EHR vendor supply chain compromise is confirmed -- a trojanized update installed a backdoor 4 months ago. During that dwell time, the attackers exfiltrated 8 million patient records including Social Security numbers, medical histories, insurance information, and prescription data. They also accessed the classified DoD military health records system. The CFO\'s compromised credential had domain administrator privileges -- no multi-factor authentication was required, and the password was reused from a personal account breached in a previous unrelated incident. These are textbook Security by Design failures. The HIPAA 60-day breach notification clock has started. Your legal team reminds you that HIPAA requires notification to HHS, affected individuals, and media within 60 days for breaches affecting 500+ individuals -- not 72 hours (that is GDPR, not HIPAA).',
                        evidence: [
                            { text: 'Supply chain vector confirmed -- trojanized EHR update, 4-month dwell', reliability: 'high' },
                            { text: '8M patient records exfiltrated including SSN, medical history, Rx data', reliability: 'high' },
                            { text: 'DoD classified health records accessed -- scope of military data loss being assessed', reliability: 'high' },
                            { text: 'CFO credential: no MFA, reused password from previous personal breach', reliability: 'high' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,

                        variants: [
                            {
                                condition: { fbi_called: true },
                                situation: 'Forensic analysis confirms the worst-case scenario. The EHR vendor supply chain compromise is confirmed -- a trojanized update installed a backdoor 4 months ago. During that dwell time, the attackers exfiltrated 8 million patient records and accessed classified DoD military health records. The CFO\'s credential had domain admin with no MFA -- password reused from a personal breach. The FBI Cyber Division has provided a classified threat brief: this is a known APT group that has been targeting defense healthcare contractors across NATO allies for 18 months. They share Indicators of Compromise (IOCs) that help your IR team identify three additional backdoors the initial scan missed. The FBI also confirms the data was exfiltrated to infrastructure in a non-extradition country. HIPAA\'s 60-day notification clock has started.'
                            },
                            {
                                condition: { systems_running: true },
                                situation: 'Forensic analysis confirms the worst-case scenario -- and it just got worse. The EHR vendor supply chain compromise is confirmed with a 4-month dwell time. But because systems remained connected during your investigation, an additional 200,000 records were exfiltrated in the 6 hours before you finally isolated the network. The attackers also deployed a second-stage payload that corrupted backup integrity checksums, making recovery validation harder. The CFO\'s credential had domain admin with no MFA. The total is now 8.2 million records compromised, including DoD classified health data. HIPAA\'s 60-day notification clock has started.'
                            },
                            {
                                condition: { full_blackout: true },
                                situation: 'Forensic analysis confirms the worst-case scenario. The EHR vendor supply chain compromise is confirmed with a 4-month dwell time. 8 million patient records and DoD classified health data were exfiltrated. The CFO\'s credential had domain admin with no MFA. Meanwhile, the full clinical shutdown has created a parallel crisis: 3 patients were diverted to neighboring hospitals during the blackout, and one -- an 82-year-old cardiac patient -- experienced complications during transfer. Local media is leading with "Hospital Cyber Attack Forces Patient Evacuations." The ambulance diversion story is spreading nationally. HIPAA\'s 60-day notification clock has started.'
                            }
                        ],

                        decisions: [
                            {
                                text: 'Notify HHS, all 50 state Attorneys General, and all 8 million affected patients immediately -- full transparency from day one',
                                score: 2,
                                optimal: false,
                                flags: { early_disclosure: true },
                                consequence: 'Transparency is admirable, but premature notification creates problems. On Day 1, you do not yet know the full scope -- which specific records were accessed, whether the DoD data was actually exfiltrated or just accessed, or whether the attackers still have persistence. Incomplete notifications must be corrected later, creating confusion and undermining credibility. HIPAA provides 60 days for exactly this reason -- to allow thorough investigation before notification.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Early transparency was appreciated by some, but incomplete information created confusion and required corrections.' },
                                    regulatory: { severityDelta: 0, description: 'Early notification was noted positively but incomplete scope required amended filings.' },
                                    financial: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Follow the HIPAA timeline -- notify HHS within 60 days as required, use the time to complete forensic investigation and understand the full scope before making notifications',
                                score: 3,
                                optimal: true,
                                flags: { hipaa_compliant: true },
                                consequence: 'Correct. HIPAA provides a 60-day window (not 72 hours -- that is GDPR) specifically because accurate notification requires thorough investigation. You need to determine exactly which records were accessed, confirm the DoD data scope, identify all attack vectors for remediation, and prepare accurate notification letters. Using the full timeline responsibly is not "delay" -- it is due diligence. The key word is "without unreasonable delay" and up to 60 days.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Proper HIPAA timeline compliance with thorough investigation demonstrated regulatory maturity.' },
                                    reputational: { severityDelta: 0, description: 'Notification timing followed legal requirements. No criticism for timeline adherence.' },
                                    financial: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Contact the EHR vendor first -- they introduced the backdoor through their compromised update, so this is their breach to disclose, not ours',
                                score: 0,
                                optimal: false,
                                flags: { blamed_vendor: true },
                                consequence: 'Legally and strategically wrong. Under HIPAA, Meridian is the Covered Entity responsible for protecting patient data. The EHR vendor is a Business Associate -- their compromise does not transfer Meridian\'s notification obligations. Attempting to shift blame to the vendor before investigating your own failures (no MFA, shared passwords, vacant CISO, untested BCP) will backfire spectacularly when those failures become public. And they will become public.',
                                modifiers: {
                                    reputational: { severityDelta: 2, description: 'Vendor publicly denied responsibility and released emails showing Meridian ignored their security advisories. Devastating.' },
                                    regulatory: { severityDelta: 1, description: 'HHS OCR noted that attempting to deflect Covered Entity obligations to a Business Associate demonstrates fundamental HIPAA misunderstanding.' },
                                    political: { severityDelta: 1, description: 'Congressional investigators obtained the vendor\'s emails showing Meridian was warned about security gaps months before the breach.' }
                                }
                            },
                            {
                                text: 'Engage outside legal counsel immediately to manage all notifications under attorney-client privilege and prepare for litigation',
                                score: 2,
                                optimal: false,
                                flags: { counsel_engaged: true },
                                consequence: 'Engaging outside counsel is a reasonable step, and attorney-client privilege can protect certain internal communications during the investigation. However, privilege does not override regulatory disclosure obligations -- HHS OCR, SEC, and state AGs can compel production of factual findings. Leading with legal strategy rather than investigation and notification signals a defensive posture that regulators notice. Counsel should advise the process, not control it.',
                                modifiers: {
                                    regulatory: { severityDelta: 0, description: 'Privilege protected some communications, but OCR demanded production of the suppressed audit reports regardless.' },
                                    financial: { severityDelta: 0, description: 'Outside counsel costs: $800/hour, estimated $20M+ in legal fees over the lifecycle of the incident.' },
                                    legislative: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Coordinate with the FBI on notification timing -- they advise delaying public disclosure to avoid tipping off the APT group while the investigation is active, while still meeting HIPAA\'s 60-day requirement',
                                score: 3,
                                optimal: true,
                                requires: { fbi_called: true },
                                flags: { fbi_coordinated: true, hipaa_compliant: true },
                                consequence: 'Excellent. When the FBI is involved in a national security investigation, they may request a temporary delay in public notification to protect intelligence sources and methods, and to avoid alerting the APT group that they have been detected. This is explicitly contemplated in HIPAA -- law enforcement can request a delay of up to 30 days (or longer with a court order). You still meet the 60-day requirement. This coordination also gives the FBI time to work with NSA and allied intelligence services to attribute the attack and potentially disrupt the APT group\'s infrastructure.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'FBI coordination enabled intelligence-sharing with DoD and allied services, strengthening the national security response.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'FBI-requested delay was legally proper under HIPAA law enforcement exception. OCR acknowledged compliance.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'FBI-shared IOCs identified three additional backdoors, enabling more complete remediation.' }
                                }
                            }
                        ]
                    },

                    /* ==============================================================
                       TIMESTEP 3: Week 1 -- "The Board Learns"
                       ============================================================== */
                    {
                        timeLabel: 'Week 1 -- The Board Learns',
                        situation: 'An emergency board meeting has been called. During the meeting, a bombshell: the board discovers that the CIO had suppressed three consecutive quarterly audit findings. Those audits flagged the exact vulnerabilities that enabled this breach -- the lack of MFA on privileged accounts, the unpatched EHR system, the untested BCP, and the vacant CISO position. The CIO argued each quarter that "the risk was acceptable" and that security spending would hurt margins. The board never saw the audit reports. Meanwhile, the stock is down 22% on breach news. The DoD contracting officer has called to inform Meridian that a security clearance review has been initiated under DCSA procedures -- the $200M/year contract is at risk. The acting CISO is the SOC team lead who was promoted 48 hours ago -- they have no governance experience and are visibly overwhelmed presenting to the board.',
                        evidence: [
                            { text: 'CIO suppressed 3 consecutive audit findings flagging MFA, patching, BCP, CISO gaps', reliability: 'high' },
                            { text: 'NYSE: MHS stock down 22% -- $4B+ market cap loss', reliability: 'high' },
                            { text: 'DCSA security clearance review initiated -- $200M/year DoD contract at risk', reliability: 'high' },
                            { text: 'Acting CISO (former SOC lead) has no governance or board experience', reliability: 'high' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 1,

                        variants: [
                            {
                                condition: { blamed_vendor: true },
                                situation: 'The emergency board meeting becomes a disaster within minutes. Before the CIO\'s suppressed audits are even discussed, the EHR vendor has issued a public statement denying responsibility for the breach -- and they have released Meridian\'s internal emails. Those emails show that the vendor sent three security advisories over the past year warning about vulnerabilities in their update mechanism, and Meridian\'s IT team acknowledged receipt but never implemented the recommended mitigations. The vendor\'s statement reads: "We are disappointed that Meridian Health Systems chose to blame our company rather than address the security failings we repeatedly warned them about." The board is furious. The stock drops another 8% on the vendor\'s statement. The CIO\'s suppressed audits are now the second-worst revelation of the day.'
                            },
                            {
                                condition: { fbi_coordinated: true },
                                situation: 'The emergency board meeting is grim but structured. The FBI has provided cleared talking points that the board can use, and an FBI liaison offers to brief the DoD contracting officer on the national security dimensions of the attack -- framing Meridian as a victim of a sophisticated nation-state campaign rather than a negligent organization. This does not erase Meridian\'s governance failures, but it provides important context. The board then learns the real bombshell: the CIO suppressed three consecutive quarterly audit findings that flagged the exact vulnerabilities exploited in the breach. Stock is down 22%. DCSA has initiated a security clearance review.'
                            }
                        ],

                        decisions: [
                            {
                                text: 'CEO takes personal responsibility before the board, terminates the CIO immediately, announces a comprehensive governance overhaul including a new board-level cybersecurity committee, and commits to hiring a permanent CISO within 60 days',
                                score: 3,
                                optimal: true,
                                flags: { cio_fired: true, ceo_accountable: true },
                                consequence: 'The only credible response. The CIO\'s suppression of audit findings is not a difference of opinion -- it is a governance failure that directly enabled the breach. Termination sends an unambiguous signal to regulators, investors, and the public. The CEO taking personal responsibility (without resigning) demonstrates that accountability flows upward. The board-level cybersecurity committee ensures this can never be buried again. The 60-day CISO hire commitment is aggressive but necessary.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Decisive CEO accountability and CIO termination signaled genuine governance reform. Media coverage shifted from "negligent" to "responding."' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'SEC and HHS OCR noted the swift governance response positively in their investigation notes.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Congressional investigators acknowledged that the CEO\'s immediate accountability was uncommon and credible.' }
                                }
                            },
                            {
                                text: 'Blame the EHR vendor publicly -- they are the ones who introduced the backdoor through their compromised supply chain, and Meridian was the victim of a sophisticated nation-state attack',
                                score: 0,
                                optimal: false,
                                flags: { public_blame: true },
                                consequence: 'The vendor did introduce the backdoor, but Meridian\'s own failures -- no MFA, reused passwords, suppressed audits, no CISO, untested BCP -- are what allowed the attackers to escalate from the initial foothold to full domain compromise. Publicly blaming the vendor when your own CIO was suppressing audit findings is an indefensible position. When the suppressed audits become public (and they will), this blame-shifting will be the defining image of Meridian\'s response. The vendor will countersue.',
                                modifiers: {
                                    reputational: { severityDelta: 2, description: 'Public blame-shifting while suppressed audits existed destroyed all credibility. Media coverage became uniformly hostile.' },
                                    financial: { severityDelta: 1, description: 'Vendor countersued for defamation. Legal costs escalated. Investor confidence collapsed further.' },
                                    legislative: { severityDelta: 1, description: 'Congressional investigators used Meridian as the case study for why mandatory CISO board reporting is needed.' }
                                }
                            },
                            {
                                text: 'Hire a Big Four consulting firm to conduct an independent investigation before making any public statements or personnel decisions -- let the facts guide the response',
                                score: 2,
                                optimal: false,
                                flags: { independent_review: true },
                                consequence: 'An independent investigation is a reasonable component of the response, but making it the entire response at this stage is too slow. The CIO\'s suppression of audit findings is already a known fact -- it does not require an independent investigation to confirm. Investors, regulators, and the public expect immediate accountability for documented governance failures. The independent review should happen in parallel with decisive action, not as a substitute for it.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Independent review provided credibility but the delayed accountability was perceived as corporate stalling.' },
                                    regulatory: { severityDelta: 0, description: 'Regulators appreciated the independent review but expected faster governance action on the suppressed audits.' },
                                    financial: { severityDelta: 0, description: 'Big Four engagement: $15-25M fee. Valuable but not a substitute for leadership accountability.' }
                                }
                            }
                        ]
                    },

                    /* ==============================================================
                       TIMESTEP 4: Week 4 -- "The Regulatory Storm"
                       ============================================================== */
                    {
                        timeLabel: 'Week 4 -- The Regulatory Storm',
                        situation: 'The regulatory apparatus has fully engaged. HHS Office for Civil Rights (OCR) -- the agency that enforces HIPAA, not the FTC -- has opened a formal investigation into the breach. The FTC has opened a separate Section 5 inquiry into whether Meridian\'s privacy promises to patients constituted unfair or deceptive practices. The SEC is probing whether the breach was disclosed to investors in a timely manner and whether the CIO\'s suppression of audit findings constitutes securities fraud. A coalition of 38 state Attorneys General, led by California (whose CCPA applies to CA residents in the 8M-record dataset), has opened a coordinated investigation. DCSA has confirmed that the classified DoD health data was compromised, and the $200M/year contract is suspended pending security review. PCI DSS compliance is also under review for the $2B claims processing operation, though PCI DSS is an industry standard, not a government regulation -- a distinction that matters for your legal strategy.',
                        evidence: [
                            { text: 'HHS OCR formal HIPAA investigation opened -- the correct enforcement body (not FTC) for HIPAA', reliability: 'high' },
                            { text: 'SEC probing investor disclosure timeline and CIO audit suppression as potential securities fraud', reliability: 'high' },
                            { text: '38-state AG coalition led by California -- CCPA applies to CA residents in the dataset', reliability: 'high' },
                            { text: 'DoD contract ($200M/year) suspended -- DCSA confirmed classified data compromise', reliability: 'high' }
                        ],
                        timerSeconds: 0,
                        timeoutDefault: 2,

                        variants: [
