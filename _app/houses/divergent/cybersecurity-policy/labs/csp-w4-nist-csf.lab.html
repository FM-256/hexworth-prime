        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #ede0f0; line-height: 1.6; padding: 20px;
        }
        .de-top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,0,255,0.1);
        }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn {
            text-decoration: none; color: #ff00ff; font-size: 0.75rem;
            padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2);
            border-radius: 6px; transition: all 0.2s;
        }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 14 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w4-nist-csf-lab',
            scenario: {
                title: 'Framework Zero',
                subtitle: 'A state government agency must implement NIST CSF from scratch after a ransomware catastrophe.',
                briefing: 'Three weeks ago, a ransomware attack shut down the state Department of Motor Vehicles, leaving 4.2 million residents unable to renew licenses, register vehicles, or obtain IDs. The governor has issued Executive Order 2025-17 mandating NIST Cybersecurity Framework implementation across all state agencies within 12 months. The problem: there is no formal cybersecurity framework in place, no dedicated CISO, and the IT department is a patchwork of 23 independently managed agency networks. The current state is Tier 1 (Partial) across every function. The legislature has allocated $8M for the initiative but the governor wants visible progress by the 6-month mark for the election cycle. You have been hired as the state\'s first CISO to make this happen.',

                intelCards: [
                    { dimension: 'technical', label: 'Current State', value: 'Tier 1 (Partial) — 23 agency networks, no unified SOC, no IR plan' },
                    { dimension: 'financial', label: 'Budget', value: '$8M legislative allocation — must show ROI at 6-month review' },
                    { dimension: 'political', label: 'Governor\'s Mandate', value: 'Executive Order 2025-17 — 12-month deadline, 6-month checkpoint' },
                    { dimension: 'regulatory', label: 'Compliance Gap', value: 'CJIS, HIPAA, IRS Pub 1075, state privacy laws — all partially non-compliant' },
                    { dimension: 'political', label: 'Election Cycle', value: 'Governor faces re-election in 14 months — cybersecurity is now a campaign issue' }
                ],

                activeDimensions: ['technical', 'financial', 'political', 'regulatory'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: '23 agency networks with no centralized visibility. No unified asset inventory. Patch management is agency-by-agency with no enforcement. Average time-to-patch for critical CVEs is 127 days. No SOC, no SIEM, no IR plan. Endpoint protection varies from enterprise EDR to consumer antivirus.',
                        metric: '23 siloed networks | 127-day avg patch time | No SOC/SIEM | No IR plan'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: '$8M sounds significant but is insufficient for 23 agencies. The DMV ransomware incident cost $14M in recovery and lost productivity. Insurance premiums doubled at renewal. Federal funding for CJIS and HIPAA compliance is at risk if audit failures continue.',
                        metric: '$8M budget vs 23 agencies | $14M ransomware cost | Federal funding at risk'
                    },
                    political: {
                        severity: 4,
                        timing: 'short',
                        description: 'The governor staked political capital on EO 2025-17. The opposition party is framing cybersecurity failures as incompetence. Agency directors resist centralized control — they view the CISO role as an intrusion on their autonomy. The DMV director publicly blamed "underfunding."',
                        metric: 'Governor re-election in 14 months | Agency resistance | Opposition framing'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Multiple federal compliance mandates are partially unmet. CJIS audit found 14 findings across law enforcement agencies. HIPAA risk assessment for Health & Human Services was last done in 2019. IRS Pub 1075 safeguards for tax data have 9 open findings. A coordinated federal audit would be devastating.',
                        metric: '14 CJIS findings | HIPAA assessment 6 years stale | 9 IRS Pub 1075 gaps'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Month 0 — Current State Assessment',
                        situation: 'You have 30 days to complete a current state assessment across all 23 agencies. Your team is you, two borrowed IT analysts, and a contractor. Agency directors are suspicious — several have refused to provide network diagrams citing "operational security." The governor\'s chief of staff wants a preliminary briefing in 2 weeks. You have discovered that 6 agencies share a single Active Directory forest with no segmentation, 4 agencies have no backup strategy, and the state email system has no MFA.',
                        evidence: [
                            { text: '6 agencies share unsegmented Active Directory forest', reliability: 'high' },
                            { text: '4 agencies have no backup/recovery capability', reliability: 'high' },
                            { text: 'State email (12,000 accounts) has no MFA enabled', reliability: 'high' },
                            { text: '3 agency directors refuse to share network documentation', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Invoke the Executive Order to compel cooperation, conduct rapid automated discovery scans, and deliver a honest Tier 1 assessment to the governor',
                                score: 3,
                                optimal: true,
                                consequence: 'Using the EO authority establishes the CISO role immediately. Automated discovery reveals the true scope: 47,000 endpoints, 340 servers, 23 different patch management approaches. The honest Tier 1 assessment alarms the governor but earns trust. He asks for a realistic implementation plan, not a rosy one.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Governor valued honesty over optimism. Trust established early. Agency directors complied after EO enforcement.' },
                                    technical: { severityDelta: 0, description: 'Full asset inventory completed. True scope identified: worse than expected but now quantified.' }
                                }
                            },
                            {
                                text: 'Build relationships first — meet individually with each agency director before asserting authority',
                                score: 1,
                                optimal: false,
                                consequence: 'Relationship-building is important but 23 individual meetings over 30 days leaves no time for actual assessment. Three directors stonewalled you in meetings. The governor\'s 2-week briefing arrives and you have anecdotal observations instead of data. The chief of staff is unimpressed.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Governor\'s office perceived slow start as lack of urgency. Opposition leaked "new CISO doing meet-and-greets while systems are vulnerable."' },
                                    technical: { severityDelta: 0, description: 'No systematic assessment completed. True scope still unknown.' }
                                }
                            },
                            {
                                text: 'Focus assessment on the 6 agencies sharing the AD forest — that is the biggest risk, fix it first',
                                score: 2,
                                optimal: false,
                                consequence: 'Correct risk prioritization but incomplete scope. While you focus on the AD forest (a real critical issue), the 4 agencies with no backups get hit with a different ransomware variant. You have to explain to the governor why you were not aware of the backup gaps across the other 17 agencies.',
                                modifiers: {
                                    technical: { severityDelta: -1, description: 'AD forest segmentation planning began. But blind spots in remaining 17 agencies created new exposure.' },
                                    political: { severityDelta: 1, description: 'Second incident in agencies outside assessment scope undermined confidence in the approach.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 3 — Target Profile and Gap Analysis',
                        situation: 'Assessment is complete. The results are sobering: Tier 1 across all 6 CSF functions (Govern, Identify, Protect, Detect, Respond, Recover). You need to build a target profile (Tier 2 minimum by month 12) and conduct gap analysis. The gap analysis reveals 187 individual gaps. Budget math: $8M across 187 gaps = $42,780 per gap — clearly insufficient for many items. You must prioritize. The governor wants to announce "quick wins" at the 6-month press conference. Meanwhile, a state employee clicked a phishing link that was stopped only because the new email filtering you quietly deployed in Month 1 caught it.',
                        evidence: [
                            { text: 'Tier 1 across all 6 CSF functions confirmed by assessment', reliability: 'high' },
                            { text: '187 gaps identified in gap analysis', reliability: 'high' },
                            { text: 'Email filter caught phishing attempt — would have succeeded without it', reliability: 'high' },
                            { text: 'Governor wants "quick wins" for 6-month press conference', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Prioritize Detect and Respond functions (deploy SIEM + IR plan) — you cannot protect what you cannot see or respond to',
                                score: 3,
                                optimal: true,
                                consequence: 'Strategic prioritization. SIEM deployment across the shared AD forest gives centralized visibility for the first time. IR plan means the next incident gets a coordinated response instead of chaos. These are foundational capabilities that support all other improvements. The phishing catch becomes the "quick win" story for the governor.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'SIEM provided first-ever centralized visibility. IR plan tested successfully against a real phishing incident. Detection capability jumped from Tier 1 to Tier 2.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Phishing catch story played well in media. Governor had a concrete win to announce.' }
                                }
                            },
                            {
                                text: 'Spread the budget evenly across all 6 functions to show "progress on every front"',
                                score: 0,
                                optimal: false,
                                consequence: 'Spreading $8M across 187 gaps achieves nothing meaningful. You move from Tier 1 to "Tier 1 with paperwork" in every function. No capability actually improves. The governor\'s press conference has no concrete wins — just a chart showing partial progress everywhere and completion nowhere.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'No function reached Tier 2. Resources too thin across 187 gaps. Incremental improvements insufficient to stop real attacks.' },
                                    political: { severityDelta: 1, description: 'Governor\'s press conference lacked compelling narrative. Opposition called it "a million-dollar PowerPoint."' },
                                    financial: { severityDelta: 1, description: 'Budget consumed with no measurable capability gain. Legislature skeptical of future funding requests.' }
                                }
                            },
                            {
                                text: 'Focus entirely on Protect function — deploy MFA, patch management, and endpoint protection statewide',
                                score: 2,
                                optimal: false,
                                consequence: 'Protection improvements are necessary but without Detect and Respond you are building walls while blind. MFA deployment across 12,000 accounts is a visible win. Centralized patch management is valuable. But when the next incident comes (and it will), you still have no SOC, no SIEM, and no IR plan. You are better at preventing attacks but no better at detecting or responding to the ones that get through.',
                                modifiers: {
                                    technical: { severityDelta: -1, description: 'MFA reduced phishing risk significantly. Patch management improved. But no detection capability means blind spots persist.' },
                                    political: { severityDelta: 0, description: 'MFA rollout was a visible win. But security experts questioned the lack of detection investment.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 — Implementation: Which Functions Get Priority?',
                        situation: 'You are at the 6-month checkpoint. The governor\'s press conference is tomorrow. Your SIEM is operational but generating 14,000 alerts/day with a 94% false positive rate — the team is drowning. MFA rollout is at 67% (resistance from 8 agencies citing "workflow disruption"). A state senator has introduced a bill to codify the EO into law with additional requirements including mandatory cyber insurance and biannual penetration testing. The legislature\'s fiscal analysis says your $8M is insufficient and recommends $22M over 3 years. Meanwhile, your IR plan was tested when a contractor laptop was stolen containing unencrypted PII for 12,000 Medicaid recipients.',
                        evidence: [
                            { text: 'SIEM generating 14,000 alerts/day — 94% false positive rate', reliability: 'high' },
                            { text: 'MFA at 67% deployment — 8 agencies resisting', reliability: 'high' },
                            { text: 'Contractor laptop stolen with 12,000 Medicaid PII records (unencrypted)', reliability: 'high' },
                            { text: 'Legislative bill proposes $22M/3yr with mandatory pen testing', reliability: 'medium' }
                        ],
                        contradicts: true,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Use the laptop incident to demonstrate IR plan working, brief governor on honest progress with tuning roadmap for SIEM, support the legislative bill',
                                score: 3,
                                optimal: true,
                                consequence: 'Turning the laptop incident into a process success story is masterful framing. The IR plan caught, contained, and reported the incident in 4 hours — a capability that did not exist 6 months ago. The governor presents "from zero to coordinated response in 6 months." Supporting the legislative bill secures long-term funding beyond the EO.',
                                modifiers: {
                                    political: { severityDelta: -2, mitigated: true, description: 'Governor\'s press conference was a success. Laptop incident framed as proof the framework works. Legislative bill gained bipartisan support.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Legislative bill progressing toward $22M/3yr. Long-term funding pathway established.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'HIPAA breach notification for laptop incident was timely and well-documented. HHS acknowledged the improved IR capability.' }
                                }
                            },
                            {
                                text: 'Suppress the laptop incident report until after the press conference to avoid bad optics',
                                score: 0,
                                optimal: false,
                                consequence: 'Concealing a PII breach involving Medicaid data violates HIPAA breach notification requirements (60-day deadline, but concealment is a separate violation). When it surfaces — and it will — the cover-up is worse than the breach. The governor feels blindsided. Your credibility as CISO is destroyed.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'HIPAA breach notification violation. HHS OCR opened investigation. Federal funding for Medicaid IT jeopardized.' },
                                    political: { severityDelta: 2, description: 'Governor blindsided by breach cover-up. CISO termination demanded by opposition party. Trust destroyed.' },
                                    reputational: { severityDelta: 1, description: 'Cover-up narrative dominated the news cycle, overshadowing 6 months of legitimate progress.' }
                                }
                            },
                            {
                                text: 'Request the press conference be postponed — we are not ready to show results',
                                score: 1,
                                optimal: false,
                                consequence: 'Postponing the governor\'s press conference is politically untenable. You have real results (IR plan, SIEM operational, MFA at 67%) but lack confidence to present them. The governor\'s office schedules it anyway without your input. The narrative is now controlled by the communications team, not the CISO.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'CISO sidelined from communications. Governor\'s staff controlled the narrative with less technical accuracy.' },
                                    technical: { severityDelta: 0, description: 'Technical progress continued but the CISO lost influence over strategic messaging.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 12 — Governor\'s Review: Did You Reach Tier 2?',
                        situation: 'The 12-month deadline has arrived. The governor\'s office is conducting a formal review. Your scorecard: Govern (Tier 2 — CISO role established, policies written), Identify (Tier 2 — asset inventory complete, risk assessments done), Protect (Tier 1.5 — MFA at 89%, patching improved but not universal), Detect (Tier 2 — SIEM tuned down to 800 alerts/day at 23% false positive rate), Respond (Tier 2 — IR plan tested 3 times), Recover (Tier 1.5 — backup strategy in place for 19 of 23 agencies). The legislative bill passed — $22M over 3 years starting next fiscal year. But the opposition is demanding an independent audit.',
                        evidence: [
                            { text: 'Tier 2 achieved in Govern, Identify, Detect, Respond (4 of 6 functions)', reliability: 'high' },
                            { text: 'Protect and Recover at Tier 1.5 — not yet Tier 2', reliability: 'high' },
                            { text: '$22M/3yr bill signed into law', reliability: 'high' },
                            { text: 'Opposition demanding independent third-party audit', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Welcome the independent audit — present the honest Tier 2 scorecard with a clear roadmap for the remaining Tier 1.5 functions',
                                score: 3,
                                optimal: true,
                                consequence: 'Confidence in transparency. The independent audit confirms your self-assessment is accurate (auditors find Detect is actually closer to Tier 2.5 given the SIEM maturity). The roadmap for Protect and Recover is funded by the new legislative allocation. The governor uses the audit as validation. The opposition\'s demand backfired — the audit proved progress.',
                                modifiers: {
                                    political: { severityDelta: -2, mitigated: true, description: 'Independent audit validated progress. Opposition audit demand backfired. Governor positioned as effective cybersecurity leader.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Audit findings shared with federal partners. CJIS findings reduced from 14 to 3. HIPAA risk assessment current.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'Independent validation of Tier 2 in 4 functions. Clear funded roadmap for remaining gaps.' }
                                }
                            },
                            {
                                text: 'Push back on the audit — we already self-assessed and an external audit will slow momentum',
                                score: 0,
                                optimal: false,
                                consequence: 'Resisting independent validation looks like you have something to hide. The opposition amplifies the narrative: "If they really reached Tier 2, why refuse verification?" The governor\'s office distances itself from the CISO position. The $22M funding is now under scrutiny before the first dollar is spent.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'Audit refusal became a political liability. Governor distanced from the CISO. Funding scrutiny increased.' },
                                    financial: { severityDelta: 1, description: '$22M allocation under legislative review. Appropriations committee requested justification hearings.' }
                                }
                            },
                            {
                                text: 'Inflate the scorecard to show Tier 2 across all 6 functions — close enough is close enough',
                                score: 0,
                                optimal: false,
                                consequence: 'Falsifying the maturity assessment is a career-ending decision. When the independent audit (which the opposition will demand regardless) reveals Protect and Recover are actually Tier 1.5, the discrepancy destroys credibility. The entire 12-month effort is reframed as dishonest. Federal partners lose trust.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'Falsified self-assessment discovered by subsequent audit. Federal compliance partnerships jeopardized.' },
                                    political: { severityDelta: 2, description: 'Dishonest reporting became the story instead of genuine progress. CISO forced to resign.' },
                                    financial: { severityDelta: 1, description: '$22M allocation frozen pending investigation into assessment accuracy.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
