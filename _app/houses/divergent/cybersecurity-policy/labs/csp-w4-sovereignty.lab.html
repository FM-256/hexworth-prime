<body>
    <div class="de-top-bar">

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w4-sovereignty-lab',
            scenario: {
                title: 'Digital Iron Curtain',
                subtitle: 'Data localization laws in the EU, China, and Russia collide. Your global cloud architecture must adapt or die.',
                briefing: 'Meridian Cloud Systems, a major US-headquartered cloud services provider, operates data centers in 14 countries and serves enterprise customers in the EU, China, and Russia. Annual revenue: $8.2B globally, with $2B from the EU, $1.3B from China, and $400M from Russia. New data localization laws are converging: China\'s Cybersecurity Law (CSL) and Data Security Law (DSL) require local data storage AND government source code review of "critical information infrastructure" providers. Russia\'s Federal Law No. 242-FZ mandates all Russian citizen personal data be stored and processed on servers physically located in Russia. The EU\'s GDPR enforcement has intensified post-Schrems II, with Data Protection Commissions (DPCs) challenging Standard Contractual Clauses (SCCs) for US transfers. All three deadlines fall within the same fiscal year. Building local data centers in each jurisdiction costs approximately $500M. Exiting all three markets means $3.7B annual revenue loss. You are the Chief Strategy Officer tasked with recommending the path forward.',

                intelCards: [
                    { dimension: 'financial', label: 'Revenue at Risk', value: '$3.7B annually — EU ($2B), China ($1.3B), Russia ($400M)' },
                    { dimension: 'regulatory', label: 'China CSL/DSL', value: 'Local storage + source code review for critical infrastructure providers' },
                    { dimension: 'regulatory', label: 'Russia 242-FZ', value: 'All Russian citizen PII must reside on Russian-located servers' },
                    { dimension: 'legislative', label: 'EU Post-Schrems II', value: 'DPCs challenging SCCs for US transfers — adequacy decision uncertain' },
                    { dimension: 'political', label: 'Geopolitical Context', value: 'US-China tech decoupling accelerating. Russia sanctions expanding. EU digital sovereignty push.' }
                ],

                activeDimensions: ['financial', 'regulatory', 'political', 'legislative', 'reputational'],

                cascadeBaseline: {
                    financial: {
                        severity: 5,
                        timing: 'medium',
                        description: '$3.7B in annual revenue across three jurisdictions at risk simultaneously. Data center construction in each jurisdiction costs $150-200M per facility (minimum 3 facilities needed). Total capital expenditure of $500M+ with 18-24 month build time. Market exit means revenue replacement is impossible in the short term.',
                        metric: '$3.7B revenue at risk | $500M+ capex for local DCs | 18-24 month build time'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'Three incompatible regulatory regimes with hard deadlines. China demands source code access that could expose US government customer implementations. Russia requires data residency that conflicts with US sanctions compliance. EU GDPR challenges make any US data transfer legally uncertain. Non-compliance penalties: China (up to 5% global revenue), EU (up to 4% global revenue), Russia (service blocked by Roskomnadzor).',
                        metric: 'China: 5% global revenue | EU: 4% global revenue | Russia: service blocking'
                    },
                    political: {
                        severity: 4,
                        timing: 'short',
                        description: 'US government pressure not to comply with China source code review (potential intelligence exposure). EU Commission pushing for digital sovereignty as political agenda. Russian compliance may trigger US sanctions scrutiny. Congressional committee investigating US tech company compliance with adversary-nation data laws.',
                        metric: 'US intel concerns re: China | EU sovereignty politics | Russia sanctions risk | Congressional scrutiny'
                    },
                    legislative: {
                        severity: 4,
                        timing: 'long',
                        description: 'The EU-US Data Privacy Framework is under review and could be invalidated (Schrems III). China is drafting additional regulations for cross-border data transfers. US Congress is debating RESTRICT Act provisions that could prohibit certain data arrangements with adversary nations. The regulatory landscape is not static — it is actively deteriorating.',
                        metric: 'Schrems III risk | China draft regulations | US RESTRICT Act | Accelerating fragmentation'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'medium',
                        description: 'Enterprise customers choosing Meridian expect global coverage. Market exit from any major jurisdiction signals inability to compete globally. Compliance with China source code review raises concerns among US government and defense customers. Any approach has reputational trade-offs with different customer segments.',
                        metric: 'Global coverage promise | US gov customer concerns | Enterprise confidence'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Q1 — New Laws Take Effect Simultaneously',
                        situation: 'All three regulatory regimes are now active. China\'s Cyberspace Administration (CAC) has sent a formal notice requiring Meridian to register as a "critical information infrastructure operator" and submit to source code review within 180 days. Russia\'s Roskomnadzor has issued a 90-day compliance notice for data localization. The Irish DPC (your EU lead supervisory authority) has opened an inquiry into your US data transfers under GDPR. Your legal team estimates total compliance across all three jurisdictions requires: $500M in data center construction, 200+ engineers, 18-24 months, and fundamental architecture changes. The board wants a strategic recommendation in 2 weeks.',
                        evidence: [
                            { text: 'China CAC: 180-day deadline for source code review registration', reliability: 'high' },
                            { text: 'Russia Roskomnadzor: 90-day data localization compliance notice', reliability: 'high' },
                            { text: 'Irish DPC: formal inquiry into US data transfers opened', reliability: 'high' },
                            { text: 'Legal estimate: $500M, 200 engineers, 18-24 months for full compliance', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Recommend a tiered strategy: EU first (largest revenue, legal workarounds exist), exit Russia (smallest revenue, sanctions risk), negotiate China timeline (source code review is the hardest problem)',
                                score: 3,
                                optimal: true,
                                consequence: 'Strategically sound. EU revenue ($2B) justifies immediate investment in EU-local processing with strengthened SCCs and binding corporate rules. Russia exit ($400M) is defensible given sanctions complexity and protects against US regulatory exposure. China negotiation buys time for the hardest decision. The board approves the phased approach.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'EU investment prioritized ($2B revenue protected). Russia exit limited to $400M loss. China timeline extended for strategic planning.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Russia exit aligned with US sanctions posture. EU investment showed commitment to digital sovereignty. China negotiation avoided immediate confrontation.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'EU DPC engagement showed good faith. Russia exit eliminated sanctions conflict. China timeline negotiated to 12 months.' }
                                }
                            },
                            {
                                text: 'Build local data centers in all three jurisdictions — $500M to protect $3.7B in revenue is a 7.4x ROI',
                                score: 1,
                                optimal: false,
                                consequence: 'The ROI math is correct in isolation but ignores the China source code review problem. Building a Chinese data center AND submitting source code exposes your entire platform architecture to a nation-state adversary. US government customers will leave. CFIUS may investigate. The $500M investment in Russia is at risk of sanctions-related asset seizure. Financial logic without geopolitical context is incomplete.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'US Congressional committee opened investigation into source code transfer to China. US government customers began exit planning. CFIUS review initiated.' },
                                    financial: { severityDelta: 1, description: '$500M capex committed but US government contracts ($1.8B) at risk due to China compliance. Net negative expected.' },
                                    reputational: { severityDelta: 1, description: 'Enterprise customers questioned security of platform after China source code disclosure. US DoD issued advisory.' }
                                }
                            },
                            {
                                text: 'Exit all three markets and focus on US, UK, and Five Eyes nations where regulations are aligned',
                                score: 1,
                                optimal: false,
                                consequence: 'Retreating from $3.7B in revenue is a devastating strategic signal. Competitors immediately move to capture your enterprise customers in those markets. Your stock drops 22% on the announcement. Institutional investors question whether management can navigate regulatory complexity. However, your remaining business is geopolitically simpler.',
                                modifiers: {
                                    financial: { severityDelta: 2, description: '$3.7B revenue loss announced. Stock dropped 22%. Market cap destroyed $12B in value. Competitors gained immediate market share.' },
                                    reputational: { severityDelta: 1, description: 'Enterprise customers questioned global viability. "If they cannot operate in the EU, can they operate anywhere?" became the narrative.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'US government appreciated the clean posture. Five Eyes alignment simplified compliance.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q2 — Compliance Deadline: China Demands Source Code Review',
                        situation: 'China\'s 180-day deadline for source code review registration is approaching. The CAC has clarified: the review covers all source code deployed on Chinese infrastructure, including cryptographic implementations, authentication systems, and data processing pipelines. Your CISO warns that this would expose proprietary algorithms also used in your US government cloud. The US Department of Commerce has informally warned US tech companies that source code transfers to China may trigger export control violations under EAR. Your China country manager reports that 3 of your top 5 Chinese enterprise customers have been visited by CAC officials asking about your compliance timeline.',
                        evidence: [
                            { text: 'CAC scope: all deployed source code including crypto and auth systems', reliability: 'high' },
                            { text: 'US Commerce Dept: informal warning about EAR export control implications', reliability: 'high' },
                            { text: '3 of 5 top Chinese customers visited by CAC officials', reliability: 'high' },
                            { text: 'CISO: China-reviewed code overlaps with US gov cloud architecture by 73%', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Create a China-specific codebase — fork the platform, strip US gov-specific components, and submit the sanitized version for review',
                                score: 3,
                                optimal: true,
                                consequence: 'The only viable path that preserves both markets. Engineering cost is significant ($40M+) but it creates a defensible position: China gets a genuine working codebase that does not contain US government implementation details. Export control counsel confirms the sanitized fork does not trigger EAR restrictions. The 73% overlap becomes 0% after the fork. China Country Manager can show compliance progress to CAC.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: '$40M engineering cost for China fork. But preserves $1.3B China revenue and protects $1.8B US gov revenue. Net positive.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Sanitized codebase satisfied CAC review scope. Export control counsel cleared the fork. US Commerce Dept satisfied with separation.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'US government satisfied with code isolation. China accepted the forked codebase. Clean separation narrative.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Enterprise customers in both markets satisfied. Architecture isolation became a competitive advantage.' }
                                }
                            },
                            {
                                text: 'Submit the full production codebase for Chinese review — our IP protections and NDAs are sufficient',
                                score: 0,
                                optimal: false,
                                consequence: 'NDAs with a sovereign government are unenforceable. The CAC review team has broad authority to retain and analyze the code. Your US government customers learn their cloud platform code has been reviewed by Chinese state officials. DoD immediately begins migration planning. Congressional investigation escalates. The $1.8B US government business is now at risk to save $1.3B Chinese business.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'US DoD issued emergency migration order. Congressional hearing scheduled. CFIUS investigation opened. Export control violation referral.' },
                                    financial: { severityDelta: 2, description: '$1.8B US gov revenue at immediate risk. DoD contract suspension probable. Stock dropped on Congressional hearing announcement.' },
                                    reputational: { severityDelta: 2, description: '"Cloud provider gave US gov code to China" became headline. Brand destroyed in government and defense sector.' }
                                }
                            },
                            {
                                text: 'Exit China entirely before the review deadline — $1.3B loss is better than the source code risk',
                                score: 2,
                                optimal: false,
                                consequence: 'Strategically defensible but financially painful. $1.3B annual revenue loss. Chinese enterprise customers transition to Alibaba Cloud and Tencent Cloud within 6 months. Re-entry to China market is effectively impossible after a public exit. However, US government customers are reassured. Your remaining $6.9B business has a cleaner risk profile.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: '$1.3B China revenue lost permanently. Market re-entry barriers too high. Competitors captured enterprise accounts within 2 quarters.' },
                                    political: { severityDelta: -2, mitigated: true, description: 'US government viewed exit positively. Congressional scrutiny resolved. Clean compliance posture.' },
                                    reputational: { severityDelta: 0, description: 'Mixed reaction: US customers reassured, global customers questioned whether Meridian could operate internationally.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q3 — EU DPC Challenges Adequacy of US Data Transfers',
                        situation: 'The Irish DPC has issued a preliminary decision: Meridian\'s US data transfers under Standard Contractual Clauses are insufficient given US surveillance laws (FISA 702). You have 60 days to demonstrate supplementary measures or cease EU-US data transfers. This mirrors the Schrems II reasoning that invalidated Privacy Shield. Your EU data center in Frankfurt is operational but 40% of data processing still routes through US infrastructure for analytics and ML workloads. The EU-US Data Privacy Framework (the post-Privacy Shield agreement) is being challenged in EU courts — a "Schrems III" case. Your EU enterprise customers (banks, telecoms, government agencies) are demanding contractual guarantees that their data never touches US servers.',
                        evidence: [
                            { text: 'Irish DPC: 60-day deadline to demonstrate supplementary measures or cease transfers', reliability: 'high' },
                            { text: '40% of EU data processing still routes through US infrastructure', reliability: 'high' },
                            { text: 'Schrems III case filed challenging EU-US Data Privacy Framework', reliability: 'high' },
                            { text: 'Top 3 EU enterprise customers demanding no-US-transfer contractual guarantees', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Accelerate full EU data processing localization — move analytics and ML workloads to Frankfurt, implement encryption where EU keys never leave EU jurisdiction',
                                score: 3,
                                optimal: true,
                                consequence: 'The correct long-term investment. Moving analytics/ML to Frankfurt eliminates the transfer dependency. EU-managed encryption keys (customer-controlled HSMs in EU) create a technical safeguard the DPC can accept. Cost: $80M in infrastructure and re-architecture. Timeline: 6 months for full migration. But it future-proofs against Schrems III regardless of outcome. Enterprise customers sign multi-year renewals.',
                                modifiers: {
                                    regulatory: { severityDelta: -2, mitigated: true, description: 'DPC accepted supplementary measures. EU data processing fully localized. Customer-controlled encryption keys satisfied adequacy requirements.' },
                                    financial: { severityDelta: -1, mitigated: true, description: '$80M investment protected $2B EU revenue. Enterprise customers signed 3-year renewals with data residency guarantees.' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Architecture future-proofed against Schrems III outcome. No dependency on EU-US adequacy decisions.' }
                                }
                            },
                            {
                                text: 'Rely on the EU-US Data Privacy Framework — it is the official adequacy mechanism and should withstand legal challenge',
                                score: 0,
                                optimal: false,
                                consequence: 'Privacy Shield was the official adequacy mechanism too — Schrems II killed it. The Data Privacy Framework has the same structural vulnerability (FISA 702 has not changed). Betting $2B in EU revenue on a legal framework that has already been invalidated once is not risk management. When Schrems III succeeds (and privacy advocates are confident it will), you are back to square one with no technical alternative ready.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'DPC rejected Data Privacy Framework reliance as sole safeguard. Enforcement action initiated. 60-day transfer cessation order issued.' },
                                    financial: { severityDelta: 1, description: 'EU enterprise customers began transition to EU-native providers. $2B revenue base eroding.' },
                                    legislative: { severityDelta: 1, description: 'Schrems III proceedings advanced. No technical fallback position. Legal dependency on framework that may be invalidated.' }
                                }
                            },
                            {
                                text: 'Challenge the DPC decision legally — the 60-day timeline is unreasonable and the supplementary measures standard is vague',
                                score: 1,
                                optimal: false,
                                consequence: 'Legal challenge buys time (12-18 months in EU courts) but signals adversarial posture to the DPC. Other EU DPCs take note — your French, German, and Italian operations now face coordinated scrutiny. Enterprise customers do not wait for court outcomes — they need contractual certainty now. Three major EU banks begin vendor replacement evaluation.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'DPC escalated to EDPB for coordinated enforcement. Multiple EU authorities opened parallel inquiries.' },
                                    financial: { severityDelta: 1, description: 'EU enterprise customers began RFPs for EU-native alternatives. Revenue at risk increased from $2B to immediate threat.' },
                                    reputational: { severityDelta: 1, description: 'EU market positioning damaged. "US company fights EU privacy law" narrative played poorly with enterprise buyers.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q4 — Strategic Restructure Decision: Global vs Regional Architecture',
                        situation: 'The board demands a final strategic architecture decision. The past 9 months have demonstrated that a single global cloud platform cannot satisfy divergent sovereignty requirements. Your options have crystallized: (A) Restructure into independent regional entities — Meridian EU (EU-incorporated, EU-controlled), Meridian Asia (for non-China markets), and Meridian US (US + Five Eyes). Each entity operates independently with no cross-border data flows. Cost: $200M restructure + ongoing duplicate operations. (B) Maintain global architecture with jurisdiction-specific compliance layers (your current approach). (C) Acquire a European cloud company to establish an EU-native presence while maintaining the US platform separately.',
                        evidence: [
                            { text: 'Board mandate: final architecture decision required this quarter', reliability: 'high' },
                            { text: 'Option A: regional entities — $200M restructure, eliminates cross-border risk', reliability: 'medium' },
                            { text: 'Option B: global + compliance layers — current approach, incrementally expanding', reliability: 'high' },
                            { text: 'Option C: EU acquisition target identified — $800M valuation, 15M EU users, profitable', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Restructure into independent regional entities with shared IP licensing but no cross-border data flows — accept the operational duplication cost',
                                score: 3,
                                optimal: true,
                                consequence: 'The hardest decision but the most future-proof. Independent regional entities eliminate cross-border data transfer risk entirely. EU entity satisfies GDPR/DPC concerns structurally. IP licensing preserves competitive advantage without data exposure. Operational cost increases 15% but regulatory risk drops to near-zero. This is the model Microsoft, Google, and Amazon are all moving toward. First-mover advantage in "sovereignty by design" becomes a competitive differentiator.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: '$200M restructure + 15% operating cost increase. But $3.3B revenue preserved (excluding Russia exit). Regulatory risk premium in valuation eliminated.' },
                                    regulatory: { severityDelta: -2, mitigated: true, description: 'Regional entities satisfy all jurisdictional requirements structurally. No dependence on adequacy frameworks or SCCs.' },
                                    legislative: { severityDelta: -2, mitigated: true, description: 'Architecture immune to Schrems III, future data localization laws, and evolving sovereignty requirements. Future-proofed.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: '"Sovereignty by design" became a marketing differentiator. Enterprise customers valued structural compliance over legal workarounds.' }
                                }
                            },
                            {
                                text: 'Acquire the EU cloud company ($800M) to establish EU-native presence while maintaining global US platform',
                                score: 2,
                                optimal: false,
                                consequence: 'Acquisition solves the EU problem but creates integration complexity. The acquired company has a different tech stack, different culture, and different customer base. Integration takes 2-3 years. During integration, you are running two parallel platforms with data residency boundaries. It does not solve the China or future jurisdiction problems. Shareholders question the premium when organic build (Frankfurt DC) is already underway.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: '$800M acquisition premium. Integration costs estimated at $150M over 3 years. EU revenue protected but at higher cost than organic.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'EU-native entity satisfied DPC requirements. But integration data flows created new transfer risks during migration.' },
                                    reputational: { severityDelta: 0, description: 'Market viewed acquisition as reactive rather than strategic. Competitors positioned organic solutions as more coherent.' }
                                }
                            },
                            {
                                text: 'Maintain global architecture with compliance layers — the legal frameworks will stabilize and the current approach is working',
                                score: 0,
                                optimal: false,
                                consequence: 'The legal frameworks are not stabilizing — they are fragmenting. Schrems III is advancing. India, Brazil, and Indonesia are drafting their own data localization laws. Your compliance layer approach works today but requires continuous legal renegotiation in every jurisdiction. Every new law is a new crisis. Enterprise customers see this: your contracts have more legal caveats than technical specifications. The market is moving toward structural sovereignty and you are still patching.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Compliance layer approach challenged by 3 additional jurisdictions within 12 months. Continuous firefighting consumed legal budget.' },
                                    legislative: { severityDelta: 2, description: 'India, Brazil, Indonesia laws created 3 new compliance deadlines. Approach fundamentally unscalable.' },
                                    financial: { severityDelta: 1, description: 'Legal and compliance costs growing 40% year-over-year. Enterprise customers demanded structural guarantees, not legal opinions.' },
                                    reputational: { severityDelta: 1, description: 'Competitors with regional architectures won enterprise deals on compliance simplicity. Meridian perceived as legacy approach.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
