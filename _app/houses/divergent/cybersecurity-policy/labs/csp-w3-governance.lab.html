        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }

<body>
<h1 class="visually-hidden">The Audit Storm</h1>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 09 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>
    <div id="domino-root"></div>
    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w3-governance-lab',
            scenario: {
                title: 'The Audit Storm',
                subtitle: 'A publicly traded fintech company faces governance meltdown when a SOC 2 Type II audit exposes 14 critical control failures.',
                briefing: 'NovaPay Financial, a publicly traded fintech company processing $8.2 billion annually, has just received the results of its SOC 2 Type II audit. The external auditor has identified 14 critical control failures spanning access management, change control, incident response, and encryption key management. The auditor is preparing to issue a qualified opinion -- a red flag that will be visible to every customer, partner, and regulator who requests the report. The CISO reports to the CIO, not to the board. The board has no cybersecurity committee and has never received a security briefing. Three major enterprise customers have SOC 2 report review clauses in their contracts. You are the newly hired VP of Risk, reporting directly to the CEO. Navigate governance reform under audit pressure before the qualified opinion destroys customer confidence.',

                intelCards: [
                    { dimension: 'financial', label: 'Market Cap', value: '$2.1B (NYSE: NPAY) -- stock up 40% YTD on growth story' },
                    { dimension: 'regulatory', label: 'Audit Status', value: '14 critical control failures -- qualified opinion imminent' },
                    { dimension: 'reputational', label: 'Customer Exposure', value: '3 enterprise clients with SOC 2 review clauses ($340M ARR)' },
                    { dimension: 'political', label: 'Governance Gap', value: 'CISO reports to CIO -- no board cybersecurity committee exists' },
                    { dimension: 'financial', label: 'Remediation Estimate', value: '$4.7M for immediate fixes + $12M for governance restructure' },
                    { dimension: 'regulatory', label: 'Regulatory Context', value: 'OCC and state financial regulators monitor fintech SOC 2 reports' }
                ],

                activeDimensions: ['financial', 'regulatory', 'reputational', 'political'],

                cascadeBaseline: {
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'A qualified SOC 2 opinion triggered contract review clauses for three enterprise customers representing $340M in ARR. Stock dropped 18% on disclosure. Remediation costs reached $16.7M including emergency consulting, tool deployment, and governance restructuring. Board D&O insurance premiums increased 60%.',
                        metric: '$340M ARR at risk | 18% stock decline | $16.7M remediation cost'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'The OCC issued a Matter Requiring Attention (MRA) after reviewing the qualified SOC 2 report. State financial regulators in three states opened inquiries. The SEC Division of Corporation Finance sent a comment letter questioning whether the control failures constituted a material weakness requiring 10-K disclosure under Sarbanes-Oxley Section 404.',
                        metric: 'OCC MRA issued | 3 state inquiries | SEC comment letter on SOX 404 materiality'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'short',
                        description: 'Enterprise customers received the qualified SOC 2 report and escalated to their CISOs. Two customers invoked audit rights clauses for independent security assessments. Industry press covered the qualified opinion as a cautionary tale. Competitor sales teams used it in competitive pitches.',
                        metric: '2 customer audit-right invocations | negative industry coverage | competitive displacement risk'
                    },
                    political: {
                        severity: 3,
                        timing: 'medium',
                        description: 'The board faced shareholder pressure to explain why no cybersecurity committee existed at a fintech company. Proxy advisory firms flagged the governance gap in their next report. The CIO resisted restructuring that would move the CISO out of the CIO reporting line, creating an internal power struggle.',
                        metric: 'Proxy advisory flag | shareholder questions | CIO resistance to restructure'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Week 0 -- Audit Findings Delivered',
                        situation: 'The lead auditor has presented the 14 critical findings in a closed-door session with you, the CIO, and the CFO. The auditor states that unless at least 8 of the 14 findings show documented remediation plans within 30 days, a qualified opinion will be issued. The CIO argues that the findings are "overblown" and wants to challenge the auditor\'s methodology. The CFO is panicking about the stock price impact. The CEO is traveling and unreachable until tomorrow. The CISO has not been invited to this meeting because the CIO considers audit findings "his domain."',
                        evidence: [
                            { text: 'SOC 2 audit identified 14 critical control failures across 4 trust service criteria', reliability: 'high' },
                            { text: 'CIO claims 6 of 14 findings are "interpretation differences" not real failures', reliability: 'low' },
                            { text: 'Auditor confirmed qualified opinion threshold: 30-day remediation plan required', reliability: 'high' },
                            { text: 'CISO was excluded from audit findings meeting by CIO directive', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Insist the CISO be brought into the meeting immediately and begin triaging all 14 findings by severity',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct move. The CISO is the subject matter expert on these controls. Excluding them is itself a governance failure. Triage by severity allows the team to focus remediation on the most critical findings first. The CIO is irritated but the CFO supports your decision.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Including the CISO in triage produced a credible remediation plan that satisfied the auditor\'s 30-day threshold.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Early challenge to the CIO\'s gatekeeper behavior set the tone for governance reform.' }
                                }
                            },
                            {
                                text: 'Support the CIO\'s plan to challenge the auditor\'s methodology on the 6 disputed findings',
                                score: 1,
                                optimal: false,
                                consequence: 'Challenging the auditor wastes two weeks. The auditor stands by their findings with documentation. The CIO\'s "interpretation differences" argument collapses under scrutiny. You have now lost half your remediation window fighting instead of fixing.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Two weeks wasted on auditor disputes reduced remediation time. Auditor noted the adversarial response.' },
                                    financial: { severityDelta: 1, description: 'Delay in remediation extended the timeline, increasing consulting costs and customer exposure.' }
                                }
                            },
                            {
                                text: 'Wait for the CEO to return tomorrow and let them decide the approach',
                                score: 0,
                                optimal: false,
                                consequence: 'Every day matters when you have a 30-day window. Waiting for the CEO signals indecision. The CIO uses the gap to begin lobbying the CEO to challenge the auditor. The CFO leaks concern to the board, creating panic without a plan.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Leadership vacuum allowed the CIO to control the narrative with the CEO.' },
                                    regulatory: { severityDelta: 1, description: 'Lost day with no action plan. Auditor noted delayed response in their working papers.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 -- Board Emergency Session',
                        situation: 'The CEO has called an emergency board meeting after you briefed them on the audit findings. This is the first time the board has received a cybersecurity briefing. The CIO is presenting the situation as "routine audit findings that are being addressed." You have prepared a separate briefing showing the governance gaps -- no cybersecurity committee, CISO buried under the CIO, no board-level risk oversight for technology. The board chair asks you directly: "Is our governance structure adequate for a publicly traded fintech company?"',
                        evidence: [
                            { text: 'Board has never received a cybersecurity briefing in company history', reliability: 'high' },
                            { text: 'CIO\'s presentation downplays findings as "routine adjustments"', reliability: 'high' },
                            { text: 'Proxy advisory firm Institutional Shareholder Services is reviewing governance for next report', reliability: 'medium' },
                            { text: 'Two board members have cybersecurity experience from prior roles', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Present the full governance gap analysis honestly -- recommend a cybersecurity committee and CISO reporting line change',
                                score: 3,
                                optimal: true,
                                consequence: 'The board appreciates the candor. The two members with cybersecurity experience validate your analysis. The board votes to form a cybersecurity committee and directs a governance restructure review. The CIO is visibly angry but cannot oppose a board directive.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Honest board briefing established credibility and accelerated governance reform.' },
                                    regulatory: { severityDelta: -1, description: 'Board-directed governance reform demonstrated proactive response to OCC and SEC.' }
                                }
                            },
                            {
                                text: 'Soften the message -- acknowledge gaps exist but frame them as evolutionary improvements rather than critical failures',
                                score: 1,
                                optimal: false,
                                consequence: 'The board takes moderate action -- forms an advisory group but delays structural changes. When the OCC MRA arrives two weeks later, the board realizes they were given a sanitized picture. Trust in management erodes.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Board felt misled when OCC MRA revealed severity. Internal trust damaged.' },
                                    reputational: { severityDelta: 1, description: 'Delayed governance response was visible to enterprise customers during audit-right reviews.' }
                                }
                            },
                            {
                                text: 'Defer to the CIO\'s presentation and support the "routine adjustments" narrative',
                                score: 0,
                                optimal: false,
                                consequence: 'You have now participated in misleading the board of a publicly traded company. When the qualified opinion drops and regulators engage, the board will learn they were kept in the dark. Your credibility -- and potentially your career -- is finished.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Board was not informed of material control weaknesses. SEC comment letter cited inadequate board disclosure.' },
                                    financial: { severityDelta: 1, description: 'Delayed board action extended market exposure. When the truth emerged, the stock drop was worse.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 2 -- Remediation and Governance Restructure',
                        situation: 'The board has authorized a governance restructure. The new cybersecurity committee has held its first meeting. 9 of 14 audit findings have documented remediation plans. But the CIO is actively undermining the CISO reporting line change, arguing it will "create confusion" and "slow down IT operations." The CISO has come to you privately and said they are considering resigning because the CIO is retaliating by excluding them from IT leadership meetings. Meanwhile, the auditor has agreed to extend the review period by 30 days if remediation progress continues.',
                        evidence: [
                            { text: '9 of 14 findings have documented remediation plans', reliability: 'high' },
                            { text: 'CISO reports CIO retaliation -- excluded from IT leadership meetings', reliability: 'high' },
                            { text: 'Auditor granted 30-day extension based on remediation progress', reliability: 'high' },
                            { text: 'CIO lobbying board members individually to keep CISO reporting structure', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Escalate the CIO\'s retaliation to the board cybersecurity committee with documentation',
                                score: 3,
                                optimal: true,
                                consequence: 'The cybersecurity committee takes the retaliation seriously. They direct HR to investigate. The CISO reporting line change is accelerated. The CIO receives a formal warning. The CISO decides to stay. This is governance working as designed.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Board committee intervention resolved the CIO-CISO power struggle through proper governance channels.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Retaining the CISO provided continuity during remediation, reassuring enterprise customers.' }
                                }
                            },
                            {
                                text: 'Try to mediate between the CIO and CISO privately without involving the board',
                                score: 1,
                                optimal: false,
                                consequence: 'Private mediation fails. The CIO is entrenched. The CISO resigns two weeks later. Hiring a replacement CISO during an active remediation creates a dangerous gap. Enterprise customers notice the CISO departure and escalate their concerns.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'CISO resignation during remediation alarmed enterprise customers.' },
                                    regulatory: { severityDelta: 1, description: 'CISO departure during active OCC MRA response raised regulatory concern about organizational stability.' }
                                }
                            },
                            {
                                text: 'Focus entirely on the technical remediation -- the org chart issues can wait until after the re-audit',
                                score: 0,
                                optimal: false,
                                consequence: 'Technical fixes without governance reform is treating symptoms, not the disease. The auditor specifically cited the CISO reporting structure as a governance control failure. Ignoring it means that finding remains open. The re-audit will flag it again.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Governance control failure remained open at re-audit. Auditor cited lack of structural change.' },
                                    political: { severityDelta: 1, description: 'Board cybersecurity committee questioned why their directive on reporting lines was not implemented.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 -- Re-Audit',
                        situation: 'The re-audit is underway. 12 of 14 original findings are now remediated. The CISO now reports to the CEO with a dotted line to the board cybersecurity committee. The two remaining findings involve legacy system encryption that requires a platform migration (12-month timeline). The auditor must decide: issue an unqualified opinion with a management letter noting the two open items, or issue a qualified opinion. Your enterprise customers are waiting for the updated SOC 2 report. The OCC is monitoring your response to their MRA.',
                        evidence: [
                            { text: '12 of 14 findings remediated with evidence', reliability: 'high' },
                            { text: '2 findings require legacy platform migration (12-month plan documented)', reliability: 'high' },
                            { text: 'Enterprise customers have contractual deadline for updated SOC 2 report', reliability: 'high' },
                            { text: 'Auditor is weighing unqualified opinion with management letter vs. qualified opinion', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Present the auditor with a detailed 12-month migration plan, board-approved budget, and compensating controls for the 2 open findings',
                                score: 3,
                                optimal: true,
                                consequence: 'The auditor accepts the compensating controls and documented migration plan. They issue an unqualified opinion with a management letter noting the two items. Enterprise customers are satisfied. The OCC closes the MRA with a follow-up review in 12 months. The stock begins recovering.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Unqualified opinion issued. OCC MRA closed with 12-month follow-up. SEC comment letter resolved.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Enterprise customers retained. Stock recovered 12% on unqualified opinion news.' }
                                }
                            },
                            {
                                text: 'Ask the auditor to delay the report by 90 days to remediate the last 2 findings',
                                score: 1,
                                optimal: false,
                                consequence: 'The auditor cannot delay indefinitely -- the reporting period has boundaries. Enterprise customers hit their contractual deadline without a report, triggering escalation clauses. One customer issues a formal RFP for alternative providers. The delay signals ongoing instability.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Enterprise customer contractual deadlines missed. One customer began evaluating alternatives.' },
                                    financial: { severityDelta: 1, description: 'Customer churn risk materialized. $85M ARR customer issued competitive RFP.' }
                                }
                            },
                            {
                                text: 'Accept the qualified opinion on the 2 remaining items and commit to clearing them in the next audit cycle',
                                score: 1,
                                optimal: false,
                                consequence: 'A qualified opinion -- even on just 2 items -- triggers the same contractual review clauses as the original. Enterprise customers cannot distinguish between "mostly fixed" and "still failing." The OCC keeps the MRA open. You fought for 6 months to end up with the same result.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Qualified opinion kept OCC MRA open. Regulatory burden continued.' },
                                    reputational: { severityDelta: 1, description: 'Second consecutive qualified opinion -- customers questioned long-term viability.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>

    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
