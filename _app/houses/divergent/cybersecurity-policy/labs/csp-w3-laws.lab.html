    <title>The GDPR Hammer | CIS2208</title>
    <link rel="stylesheet" href="../../../../components/DominoEngine.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%); font-family: 'Courier New', Courier, monospace; color: #ede0f0; line-height: 1.6; padding: 20px; }
        .de-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,255,0.1); }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn { text-decoration: none; color: #ff00ff; font-size: 0.75rem; padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2); border-radius: 6px; transition: all 0.2s; }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 10 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>
    <div id="domino-root"></div>
    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w3-laws-lab',
            scenario: {
                title: 'The GDPR Hammer',
                subtitle: 'A US SaaS company discovers it has been processing EU personal data without valid legal basis since Schrems II.',
                briefing: 'CloudMetric Analytics, a US-based SaaS company with $300M in annual revenue, provides business intelligence tools to 2 million EU customers. After the CJEU invalidated Privacy Shield in the Schrems II decision (July 2020), CloudMetric\'s legal team determined that Standard Contractual Clauses (SCCs) could serve as the replacement transfer mechanism. However, they never completed the required Transfer Impact Assessment (TIA) or implemented the supplementary measures the EDPB guidance demanded. Now, a German data subject has submitted a DSAR (Data Subject Access Request) under GDPR Article 15. The company cannot locate all instances of this user\'s data across its 14 microservices, 3 analytics pipelines, and 2 third-party sub-processors. The user has complained to the Irish Data Protection Commission (DPC), CloudMetric\'s lead supervisory authority. The DPC has opened a formal investigation. The potential fine is 4% of global revenue -- $12 million.',

                intelCards: [
                    { dimension: 'financial', label: 'Revenue Exposure', value: '$300M global revenue -- 4% fine ceiling = $12M' },
                    { dimension: 'regulatory', label: 'Investigation', value: 'Irish DPC formal investigation opened under GDPR Art. 60' },
                    { dimension: 'reputational', label: 'EU Customer Base', value: '2M EU data subjects across 28 countries' },
                    { dimension: 'legislative', label: 'Legal Basis Gap', value: 'No valid transfer mechanism since Privacy Shield invalidation (2020)' },
                    { dimension: 'financial', label: 'Data Mapping Gap', value: 'User data spread across 14 microservices + 2 sub-processors -- no unified map' },
                    { dimension: 'regulatory', label: 'DSAR Failure', value: 'Cannot fulfill Art. 15 request -- 30-day deadline already exceeded' }
                ],

                activeDimensions: ['financial', 'regulatory', 'reputational', 'legislative'],

                cascadeBaseline: {
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'The DPC imposed a preliminary fine of $8.2M (2.7% of global revenue) plus a separate $1.5M fine for the DSAR failure. Legal costs reached $3.4M for EU counsel, forensic data mapping, and technical remediation. Two EU enterprise customers paused contract renewals pending compliance certification, putting $45M in ARR at risk.',
                        metric: '$8.2M preliminary fine | $1.5M DSAR fine | $3.4M legal costs | $45M ARR at risk'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'The DPC investigation expanded beyond the original DSAR complaint. Cross-border regulatory cooperation under GDPR Article 60 triggered Concerned Supervisory Authority (CSA) input from Germany\'s BfDI and France\'s CNIL. The investigation uncovered that CloudMetric had no Data Protection Officer despite processing data of 2M EU subjects at scale -- an independent GDPR violation. The company was placed under a processing suspension order for new EU data until compliance was demonstrated.',
                        metric: 'DPC investigation expanded | 3 supervisory authorities involved | processing suspension order'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'short',
                        description: 'The DPC published its preliminary decision, which is standard practice for significant cases. EU tech press covered the story extensively. Privacy advocacy group noyb (founded by Max Schrems) cited CloudMetric as an example of US companies treating GDPR as optional. EU competitors used the case in sales pitches. US enterprise customers began asking about CloudMetric\'s data protection posture for the first time.',
                        metric: 'noyb public citation | EU competitor exploitation | US customer concern spillover'
                    },
                    legislative: {
                        severity: 3,
                        timing: 'long',
                        description: 'The case became part of the broader EU-US data transfer policy debate. European Parliament members cited CloudMetric during discussions about the adequacy of the EU-US Data Privacy Framework (the Privacy Shield replacement). The case contributed to pressure for stricter enforcement of supplementary measures requirements under SCCs.',
                        metric: 'EP debate citation | DPF adequacy review pressure | SCC enforcement precedent'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Month 0 -- DSAR Reveals Data Mapping Gaps',
                        situation: 'The DSAR from the German data subject arrived 35 days ago. GDPR Article 12 requires response within 30 days (extendable to 90 with justification, but you did not notify the data subject of the extension). Your engineering team has located user data in 8 of 14 microservices but cannot confirm whether data exists in the remaining 6 or in sub-processor systems. The data subject has now filed a complaint with the DPC. Your legal team is split: one attorney says to respond with what you have, another says an incomplete response is worse than a late complete response.',
                        evidence: [
                            { text: 'DSAR response deadline exceeded by 5 days with no extension notice sent', reliability: 'high' },
                            { text: 'Data located in 8 of 14 microservices -- 6 systems unconfirmed', reliability: 'high' },
                            { text: 'DPC complaint filed by data subject citing non-response', reliability: 'high' },
                            { text: 'Sub-processor contracts lack DSAR cooperation clauses', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Send the data subject a partial response with what you have, acknowledge the gaps, commit to a complete response within 14 days, and proactively notify the DPC of the situation',
                                score: 3,
                                optimal: true,
                                consequence: 'Transparency with both the data subject and the DPC demonstrates good faith. The partial response satisfies some of the Article 15 obligations. Proactive DPC notification is noted positively in the investigation file. It does not eliminate liability but it influences the severity of enforcement.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Proactive DPC notification and partial DSAR response demonstrated good faith. Investigation scope was not expanded on initial review.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Good-faith response reduced the DSAR-specific fine from preliminary $1.5M to $800K.' }
                                }
                            },
                            {
                                text: 'Wait until you have complete data from all 14 systems before responding -- accuracy matters more than speed',
                                score: 1,
                                optimal: false,
                                consequence: 'Legally defensible reasoning but practically disastrous. The DPC complaint is already filed. Every additional day of non-response is documented. When the complete response finally arrives 3 weeks later, the DPC notes 56 days of non-compliance. The data subject has already gone to the press.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: '56-day DSAR non-compliance period became a standalone violation. DPC cited systematic DSAR process failure.' },
                                    reputational: { severityDelta: 1, description: 'Data subject contacted noyb. Story was published before CloudMetric could respond.' }
                                }
                            },
                            {
                                text: 'Invoke the Article 12 extension retroactively and buy time to complete the full data mapping',
                                score: 0,
                                optimal: false,
                                consequence: 'You cannot retroactively invoke an extension that must be communicated within the original 30-day window. The DPC immediately identifies this as a procedural violation. Your legal team looks incompetent. The DPC flags potential systematic non-compliance with DSAR procedures across all 2M data subjects.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Retroactive extension attempt flagged as procedural violation. DPC expanded investigation to systemic DSAR compliance.' },
                                    legislative: { severityDelta: 1, description: 'Case cited in EDPB guidance update on DSAR response requirements as negative example.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 1 -- DPC Investigation Notice',
                        situation: 'The DPC has formally notified CloudMetric of a cross-border investigation under GDPR Article 60. The scope has expanded beyond the DSAR to include the legal basis for EU-US data transfers. The DPC\'s technical team is requesting documentation of your Transfer Impact Assessment, supplementary measures, and SCC implementation. You do not have a completed TIA. Your SCCs are the old 2010 version (the EU Commission\'s 2021 updated SCCs have a transition deadline that has passed). The DPC has also asked whether you have appointed a Data Protection Officer -- you have not, despite processing data of 2M EU subjects.',
                        evidence: [
                            { text: 'DPC investigation scope: DSAR compliance + transfer mechanism + DPO requirement', reliability: 'high' },
                            { text: 'No Transfer Impact Assessment exists', reliability: 'high' },
                            { text: 'SCCs are outdated 2010 version -- 2021 transition deadline has passed', reliability: 'high' },
                            { text: 'No Data Protection Officer appointed despite Article 37 threshold met', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Immediately appoint an interim DPO, commission a TIA, begin SCC migration to 2021 version, and submit a comprehensive remediation timeline to the DPC',
                                score: 3,
                                optimal: true,
                                consequence: 'This is the only defensible response. The DPC records your remediation actions in the investigation file. The interim DPO provides a point of contact for the investigation. The TIA commission demonstrates you are taking transfer compliance seriously. None of this eliminates past violations, but it influences enforcement severity.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Comprehensive remediation response influenced DPC to reduce fine from 4% ceiling. DPO appointment satisfied Article 37.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Proactive remediation reduced preliminary fine from $12M ceiling to $8.2M. EU enterprise customers noted remediation commitment.' }
                                }
                            },
                            {
                                text: 'Engage EU counsel to argue that your existing measures are substantially equivalent to SCCs and a TIA is not technically required for your processing activities',
                                score: 1,
                                optimal: false,
                                consequence: 'Creative legal argument but it contradicts settled EDPB guidance. The DPC has seen this approach before from US companies and is not persuaded. Two months of legal back-and-forth delays remediation while the meter runs on violations. The DPC notes the adversarial posture.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Adversarial legal posture noted by DPC. Investigation timeline extended. Fine calculated without mitigating factors.' },
                                    legislative: { severityDelta: 1, description: 'DPC cited the case as example of US companies challenging established EDPB transfer guidance.' }
                                }
                            },
                            {
                                text: 'Begin migrating all EU customer data to an EU-based data center to eliminate the transfer issue entirely',
                                score: 2,
                                optimal: false,
                                consequence: 'Strategically sound long-term but does not address the current investigation. Data localization takes 6-12 months minimum. The DPC is investigating past and current violations, not future architecture plans. You still need a DPO, a TIA, and updated SCCs during the migration period.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: 'EU data center migration costs $4.2M but addresses root cause long-term.' },
                                    regulatory: { severityDelta: 0, description: 'DPC acknowledged the migration plan but required immediate interim measures for current transfers.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 4 -- Preliminary Fine Calculation',
                        situation: 'The DPC has completed its preliminary investigation and shared its draft decision with the Concerned Supervisory Authorities (Germany\'s BfDI and France\'s CNIL) under Article 60. The preliminary fine is $8.2M for the transfer violation plus $1.5M for the DSAR failure -- total $9.7M. The BfDI has objected that the fine is too low given CloudMetric processes data of citizens across all 27 EU member states. The CNIL has submitted that a processing suspension should accompany the fine. CloudMetric\'s board is meeting to decide the response strategy. Your EU enterprise customers are asking for a timeline on compliance certification.',
                        evidence: [
                            { text: 'Preliminary fine: $9.7M ($8.2M transfer + $1.5M DSAR)', reliability: 'high' },
                            { text: 'BfDI objection: fine too low -- requesting increase to 3.5% of revenue ($10.5M)', reliability: 'high' },
                            { text: 'CNIL requesting processing suspension for new EU data intake', reliability: 'high' },
                            { text: 'Article 65 dispute resolution at EDPB possible if CSAs cannot agree', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Accept the DPC\'s preliminary fine calculation and negotiate on the processing suspension -- offer accelerated remediation milestones as alternative to suspension',
                                score: 3,
                                optimal: true,
                                consequence: 'Accepting the fine removes the risk of EDPB dispute resolution under Article 65, which historically increases fines. Negotiating against the suspension with concrete remediation milestones is pragmatic. The DPC prefers compliance over punishment. Your accelerated timeline is accepted as an alternative to full suspension.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Fine accepted at $9.7M. Processing suspension replaced with monitored remediation milestones. EDPB referral avoided.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Certainty of $9.7M fine allowed financial planning. Avoiding suspension preserved EU revenue stream.' }
                                }
                            },
                            {
                                text: 'Challenge the fine through the DPC\'s administrative review process and argue it is disproportionate',
                                score: 1,
                                optimal: false,
                                consequence: 'Challenging triggers the Article 65 dispute resolution mechanism at the EDPB. The BfDI and CNIL have already argued the fine is too low. The EDPB binding decision increases the fine to $10.5M and adds the processing suspension. You spent $1.2M on legal fees to increase your own fine.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'EDPB binding decision increased fine and added processing suspension. Challenge backfired.' },
                                    financial: { severityDelta: 1, description: 'Fine increased to $10.5M plus $1.2M in legal costs. Processing suspension caused EU customer churn.' }
                                }
                            },
                            {
                                text: 'Announce immediate exit from the EU market to avoid the fine and processing restrictions',
                                score: 0,
                                optimal: false,
                                consequence: 'GDPR enforcement does not stop because you leave the market. The fine applies to the period of non-compliance. Exiting the EU abandons 2M customers and $180M in EU revenue. Competitors immediately target your customer base. The board is furious at the revenue destruction.',
                                modifiers: {
                                    financial: { severityDelta: 2, description: 'EU market exit destroyed $180M in revenue. Fine still applied retroactively. Competitor capture was immediate.' },
                                    reputational: { severityDelta: 1, description: 'EU market exit was covered as "US company flees GDPR" -- damaged brand globally.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 8 -- Settlement Negotiation and Compliance Program',
                        situation: 'The fine has been finalized. CloudMetric has paid the penalty and is implementing its compliance program. The DPO is in place. The TIA is complete. New SCCs are signed with all sub-processors. Data mapping across all 14 microservices is 90% complete. The DPC has offered to issue a public statement acknowledging CloudMetric\'s remediation efforts -- unusual, but intended to incentivize other US companies to comply. However, accepting the public statement means the case becomes a high-profile precedent. Your EU data center migration is on track for completion in 4 months.',
                        evidence: [
                            { text: 'Fine paid. Compliance program 90% implemented.', reliability: 'high' },
                            { text: 'DPC offering public acknowledgment of remediation -- would create visible precedent', reliability: 'high' },
                            { text: 'EU data center migration at 60% -- 4 months to completion', reliability: 'high' },
                            { text: 'Three US competitors now citing your case as reason to avoid EU market', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Accept the DPC\'s public acknowledgment and use it as a competitive differentiator -- "first US SaaS company with DPC-verified GDPR compliance"',
                                score: 3,
                                optimal: true,
                                consequence: 'Turning a regulatory crisis into a market advantage. The DPC statement becomes a trust signal for EU enterprise customers. While competitors avoid EU compliance, CloudMetric leans in. EU enterprise pipeline increases 30% in the next quarter. The case becomes a model for US-EU data compliance.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'DPC public acknowledgment transformed reputation from violator to compliance leader.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'EU enterprise pipeline increased 30%. Compliance investment became competitive moat.' }
                                }
                            },
                            {
                                text: 'Decline the public statement -- keep a low profile and avoid becoming a precedent case',
                                score: 1,
                                optimal: false,
                                consequence: 'Understandable caution but a missed opportunity. The case is already public through the DPC investigation. Without the positive statement, the only public narrative is the fine and the violations. Competitors continue using the case against you with no counterweight.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Public narrative remained focused on violations without remediation acknowledgment.' },
                                    financial: { severityDelta: 0, description: 'No competitive benefit captured from compliance investment. Cost remained pure loss.' }
                                }
                            },
                            {
                                text: 'Accept the statement but lobby the DPC to keep specific technical details of the violations confidential',
                                score: 1,
                                optimal: false,
                                consequence: 'The DPC cannot selectively redact an already-published preliminary decision. Requesting confidentiality after public proceedings appears evasive. The DPC withdraws the acknowledgment offer. You get neither the positive statement nor the confidentiality.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Confidentiality request frustrated the DPC. Acknowledgment offer withdrawn. Relationship damaged for future interactions.' },
                                    reputational: { severityDelta: 0, description: 'No public acknowledgment issued. Violation narrative persisted unchallenged.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
