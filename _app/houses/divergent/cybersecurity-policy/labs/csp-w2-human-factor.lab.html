</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 06 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w2-human-factor-lab',
            scenario: {
                title: 'The Inside Job',
                subtitle: 'A disgruntled senior DBA exports 100 million customer records before resigning. The company\'s DLP was disabled 3 months ago.',
                briefing: 'A major technology company with 100 million registered users has suffered a catastrophic insider threat event. A senior database administrator with 8 years of tenure and full production database access exported the entire customer database -- names, emails, hashed passwords, payment tokens, and physical addresses -- to an external drive during their final two weeks of employment. The company\'s Data Loss Prevention (DLP) system had been disabled 3 months earlier during a "temporary" infrastructure migration and was never re-enabled. The DBA resigned, and the exfiltration was only discovered when the security team conducted a routine access audit 5 days after their departure. The stolen data is now being advertised on a dark web marketplace. You are the company\'s Director of Information Security, and the dominoes are falling.',

                intelCards: [
                    { dimension: 'technical', label: 'Data Exported', value: '100M records -- PII, hashed passwords, partial payment tokens' },
                    { dimension: 'technical', label: 'DLP Status', value: 'Disabled 3 months ago during migration -- never re-enabled' },
                    { dimension: 'financial', label: 'Company Valuation', value: '$12B market cap, preparing Series F fundraise' },
                    { dimension: 'regulatory', label: 'Jurisdiction', value: 'Headquartered in California -- CCPA applies to all 100M users' },
                    { dimension: 'reputational', label: 'Market Position', value: 'Consumer-facing platform -- trust is core value proposition' },
                    { dimension: 'legislative', label: 'Current Landscape', value: 'CCPA enforcement ramping up, state AGs increasingly aggressive' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'Full customer database exfiltrated by a privileged insider. DLP controls that would have detected the transfer were disabled. Access controls relied on trust rather than least-privilege enforcement. No behavioral analytics flagged the bulk export. The technical failure is compounded by the 3-month DLP gap -- a control that existed on paper but not in practice.',
                        metric: '100M records | DLP disabled 3 months | No behavioral detection | Full privileged access'
                    },
                    financial: {
                        severity: 5,
                        timing: 'medium',
                        description: 'CCPA statutory damages of $100-$750 per consumer per incident. With 100M affected users, theoretical maximum exposure is $7.5-$75 billion. Realistic class action settlement range is $350M-$500M. Series F fundraise suspended indefinitely. Customer churn projected at 15-25% in the first quarter. Forensic investigation and remediation costs exceed $20M.',
                        metric: 'CCPA: $100-$750/person statutory damages | $350-500M settlement range | Series F suspended'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'California Attorney General opens formal investigation under CCPA. The disabled DLP system is particularly damaging -- CCPA requires "reasonable security procedures." A control that was disabled for 3 months and never re-enabled is strong evidence of unreasonable security. Additional investigations from FTC (deceptive practices if privacy policy promised DLP) and potentially EU data protection authorities for any EU nationals in the dataset.',
                        metric: 'CA AG investigation | CCPA "reasonable security" failure | FTC deceptive practices probe'
                    },
                    reputational: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Consumer trust destroyed. The narrative is devastating: a company trusted with 100M users\' data disabled its own security controls and didn\'t notice a departing employee walking out with the entire database. Media coverage frames this as gross negligence rather than sophisticated attack. Competitor marketing teams exploit the breach.',
                        metric: 'Trust collapse | "Disabled their own security" narrative | Competitor exploitation'
                    },
                    legislative: {
                        severity: 3,
                        timing: 'long',
                        description: 'The incident adds fuel to ongoing debates about strengthening CCPA into CPRA (California Privacy Rights Act) and federal privacy legislation. Specifically, it strengthens arguments for mandatory insider threat programs, DLP requirements, and privileged access management standards in privacy law.',
                        metric: 'CPRA acceleration | Insider threat program mandates | Privileged access legislation'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Day 0 -- Anomalous Data Transfer Detected Post-Resignation',
                        situation: 'The routine access audit reveals that the departed DBA executed a series of massive database exports during their final 10 days of employment. The transfers totaled 2.3 TB of data moved to an external USB device. Investigation confirms the DLP system has been disabled since a migration 3 months ago -- the "temporary" disable was never reversed. The DBA\'s access was never revoked during their notice period, and no enhanced monitoring was placed on their account despite their resignation.',
                        evidence: [
                            { text: 'Database audit logs confirm 2.3 TB export over 10 days', reliability: 'high' },
                            { text: 'DLP agent confirmed disabled across all endpoints since January', reliability: 'high' },
                            { text: 'DBA had unchanged root-level database access throughout notice period', reliability: 'high' },
                            { text: 'HR records show DBA filed internal grievance 2 months ago (denied)', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Immediately re-enable DLP, revoke all former employee access, engage forensics, and preserve all logs for law enforcement',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct triage. Closing the DLP gap prevents any additional exfiltration by other insiders. Revoking access and preserving logs creates the evidentiary chain needed for both criminal prosecution and civil litigation. Forensic preservation is critical -- without it, the company cannot prove what was and was not accessed.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Rapid containment and evidence preservation enabled effective response.' },
                                    regulatory: { severityDelta: 0, description: 'Evidence preservation demonstrated good faith response despite the DLP lapse.' }
                                }
                            },
                            {
                                text: 'Contact the former employee directly to negotiate return of the data before involving law enforcement',
                                score: 0,
                                optimal: false,
                                consequence: 'Contacting the suspect directly is a critical mistake. It alerts them to the investigation, gives them time to destroy evidence or distribute the data more widely, and may constitute obstruction if law enforcement later investigates. Any statements made in direct contact could compromise a future prosecution. This is a job for law enforcement and legal counsel, not internal negotiation.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Alert to the suspect enabled them to distribute data to additional dark web forums.' },
                                    regulatory: { severityDelta: 1, description: 'Direct contact without law enforcement involvement perceived as attempted coverup by AG investigators.' }
                                }
                            },
                            {
                                text: 'Focus on determining what data was taken before taking any other action',
                                score: 1,
                                optimal: false,
                                consequence: 'While scope assessment is important, it should not delay containment. The DLP system is still disabled, other employees still have the same level of access, and the former employee may be actively selling the data right now. Containment and investigation must happen in parallel, not sequentially.',
                                modifiers: {
                                    technical: { severityDelta: 0, description: 'Delayed containment left other potential exfiltration paths open.' },
                                    financial: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Immediately notify all 100M users that their data may be compromised',
                                score: 1,
                                optimal: false,
                                consequence: 'Premature mass notification without scope confirmation creates panic, overwhelms support channels, and may disclose information that helps the adversary. CCPA requires notification "in the most expedient time possible and without unreasonable delay" -- but a few days for scoping is not unreasonable. Sending 100M notifications before you know what was taken is irresponsible.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Premature notification created confusion but some consumers appreciated the speed.' },
                                    financial: { severityDelta: 1, description: 'Mass notification triggered immediate customer churn before remediation plan was ready.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 3 -- Dark Web Listing Discovered',
                        situation: 'Your threat intelligence team discovers a listing on a prominent dark web marketplace offering "100M user records from [your company]" for 25 Bitcoin (approximately $1.2M). A sample of 10,000 records has been posted as proof, and your team confirms the data is authentic by matching it against your production database. The listing was posted 48 hours ago and already has 3 verified buyers. Law enforcement (FBI Cyber Division) has been engaged. The former DBA is now a criminal suspect.',
                        evidence: [
                            { text: 'Dark web listing verified -- sample data matches production DB', reliability: 'high' },
                            { text: '3 confirmed buyers have already purchased copies of the dataset', reliability: 'high' },
                            { text: 'FBI Cyber Division has opened investigation, warrant pending', reliability: 'high' },
                            { text: 'Former DBA appears to be using Tor -- location unknown', reliability: 'low' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Begin CCPA-compliant breach notification to all affected users, engage crisis communications firm, and force password resets across the platform',
                                score: 3,
                                optimal: true,
                                consequence: 'With confirmed data exposure on the dark web, notification can no longer wait. CCPA requires specific content in breach notifications (what happened, what data, what you are doing, what consumers can do). Forced password resets mitigate credential stuffing. A crisis communications firm helps control the narrative before it controls you.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Timely, CCPA-compliant notification demonstrated reasonable response despite the initial failure.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Proactive notification before media broke the story gave the company some control over the narrative.' }
                                }
                            },
                            {
                                text: 'Work with the dark web marketplace to take down the listing before notifying anyone',
                                score: 0,
                                optimal: false,
                                consequence: 'Dark web takedowns are ineffective -- the data has already been purchased by multiple buyers and will be reposted on other forums. This approach delays notification while providing zero actual risk reduction. Regulators will view this as an attempt to avoid disclosure rather than a legitimate security action.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Attempted takedown instead of notification perceived as delay tactic by regulators.' },
                                    reputational: { severityDelta: 1, description: 'When notification finally came, it appeared the company tried to hide the breach.' }
                                }
                            },
                            {
                                text: 'Notify only the 10,000 users whose records appeared in the proof sample -- the rest may not be at risk',
                                score: 1,
                                optimal: false,
                                consequence: 'The entire database was exfiltrated. The sample is just a proof-of-concept -- all 100M records are compromised. Selective notification of the sample would be both legally insufficient under CCPA (which requires notification of all affected consumers) and factually misleading. When the full scope is revealed later, this partial notification becomes evidence of bad faith.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Partial notification violated CCPA requirements and demonstrated bad faith.' },
                                    financial: { severityDelta: 1, description: 'Subsequent full disclosure after partial notification doubled the reputational damage and legal exposure.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 -- Media Coverage + AG Investigation',
                        situation: 'Major news outlets are running the story. The disabled DLP system has leaked to the press -- a source (possibly a current employee) told reporters that the security team had flagged the DLP gap twice but was overruled by engineering leadership who cited "migration timeline pressure." The California Attorney General has opened a formal CCPA investigation. A class action law firm has filed on behalf of affected consumers. Your board of directors is demanding answers.',
                        evidence: [
                            { text: 'Internal emails show security team flagged DLP gap twice -- overruled', reliability: 'high' },
                            { text: 'California AG formal CCPA investigation opened', reliability: 'high' },
                            { text: 'Class action filed in Northern District of California', reliability: 'high' },
                            { text: 'Employee NPS score dropped 40 points -- internal morale crisis', reliability: 'medium' }
                        ],
                        contradicts: false,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Full transparency: acknowledge the DLP gap, accept responsibility, publish a detailed incident timeline, and announce a comprehensive insider threat program',
                                score: 3,
                                optimal: true,
                                consequence: 'When internal documents have already leaked, attempting to control the narrative with spin is futile. Full transparency, while painful, is the only strategy that preserves any credibility. Publishing a detailed timeline shows accountability. Announcing concrete remediation (not just promises) gives regulators, customers, and employees a reason to believe the company can recover.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Radical transparency converted some critics into cautious supporters of the company\'s recovery.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'AG investigators noted the company\'s transparent cooperation as a mitigating factor.' }
                                }
                            },
                            {
                                text: 'Frame the incident as a criminal act by a rogue employee -- the company is the victim',
                                score: 1,
                                optimal: false,
                                consequence: 'While the DBA is a criminal, the company disabled its own DLP controls and failed to monitor a departing privileged user. The "we are the victim" narrative collapses under scrutiny. Internal emails proving the security team was overruled destroy any claim of reasonable security practices. The AG investigation focuses on the company\'s failures, not just the DBA\'s crime.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Victim framing contradicted by internal evidence, increasing AG skepticism of company cooperation.' },
                                    reputational: { severityDelta: 1, description: 'Media and consumers rejected the victim narrative given the disabled DLP evidence.' }
                                }
                            },
                            {
                                text: 'Fire the engineering leadership who overruled the security team and announce executive accountability',
                                score: 2,
                                optimal: false,
                                consequence: 'Accountability is important, but scapegoating individuals without addressing systemic failures is insufficient. The real failure is organizational -- a culture where engineering velocity overrode security controls, a process that allowed DLP to stay disabled for 3 months, and a lack of privileged access monitoring. Firing individuals without systemic reform is performative.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Executive firings seen as necessary but insufficient without systemic reform.' },
                                    legislative: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 3 -- Class Action + Policy Overhaul',
                        situation: 'The class action has been consolidated in federal court with 23 million registered plaintiffs. The California AG is negotiating a consent decree. The FBI has arrested the former DBA. Your company\'s board has formed a special committee to review the entire security program. Insurance coverage is disputed -- the carrier argues the disabled DLP system constitutes gross negligence, which is excluded from the cyber insurance policy. The board wants a security program overhaul plan.',
                        evidence: [
                            { text: '23M plaintiffs in consolidated class action', reliability: 'high' },
                            { text: 'Former DBA arrested -- facing federal charges (CFAA + identity theft)', reliability: 'high' },
                            { text: 'Cyber insurance carrier denying coverage citing gross negligence exclusion', reliability: 'high' },
                            { text: 'CA AG proposing consent decree with $200M penalty + 10-year monitoring', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Accept the AG consent decree, implement a comprehensive insider threat program with privileged access management, behavioral analytics, and mandatory DLP, and fund a $50M consumer remediation fund',
                                score: 3,
                                optimal: true,
                                consequence: 'Accepting the consent decree provides certainty and demonstrates cooperation. The comprehensive security overhaul addresses root causes rather than symptoms. Privileged access management (PAM) ensures no single administrator can export the entire database. Behavioral analytics would have flagged the bulk export pattern. The consumer fund signals commitment to making affected users whole.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Consent decree provided cost certainty; security investments reassured investors long-term.' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Company\'s comprehensive remediation became a model cited in insider threat legislation discussions.' }
                                }
                            },
                            {
                                text: 'Fight the consent decree in court -- $200M is excessive for a single insider\'s criminal actions',
                                score: 0,
                                optimal: false,
                                consequence: 'Litigation prolongs the crisis and generates years of negative headlines. Discovery will surface more damaging internal communications. The disabled DLP argument is devastating in court -- it is not a sophisticated attack that evaded controls, it is a control that was deliberately turned off. Judges and juries have little sympathy for companies that disabled their own security.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Prolonged litigation increased total costs well beyond the original $200M consent decree.' },
                                    regulatory: { severityDelta: 1, description: 'Fighting the AG converted a cooperative investigation into an adversarial prosecution.' }
                                }
                            },
                            {
                                text: 'Negotiate a smaller penalty by arguing the DBA\'s criminal actions were the proximate cause, not the company\'s security posture',
                                score: 1,
                                optimal: false,
                                consequence: 'The proximate cause argument fails because CCPA does not require a sophisticated attack -- it requires the company to maintain "reasonable security." Disabling DLP for 3 months, not monitoring privileged users during notice periods, and ignoring security team warnings are all evidence of unreasonable security. The DBA\'s crime was enabled by the company\'s failures.',
                                modifiers: {
                                    regulatory: { severityDelta: 0, description: 'AG rejected the proximate cause argument; focused on company\'s duty of reasonable security.' },
                                    reputational: { severityDelta: 1, description: 'Attempting to deflect blame to the criminal further eroded public trust.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>

</body>
