    <title>Operation Shadow Supply | CIS2208</title>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #ede0f0; line-height: 1.6; padding: 20px;
        }
        .de-top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,0,255,0.1);
        }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn {
            text-decoration: none; color: #ff00ff; font-size: 0.75rem;
            padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2);
            border-radius: 6px; transition: all 0.2s;
        }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 05 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w2-threats-lab',
            scenario: {
                title: 'Operation Shadow Supply',
                subtitle: 'A SolarWinds-style supply chain attack compromises 18,000 organizations. Trace the cascade from technical discovery through national security implications.',
                briefing: 'A widely-used IT network management platform, deployed by approximately 18,000 organizations including Fortune 500 companies, the US Treasury, Department of Homeland Security, and the Department of Energy, has been compromised. Threat actors inserted a backdoor into the software build process, and a trojanized update (disguised as a routine patch) has been distributing malware to customers for approximately 9 months before discovery. The attack was not found by any government agency or the vendor itself -- it was uncovered by a private cybersecurity firm investigating its own breach. You are a senior policy analyst at the Cybersecurity and Infrastructure Security Agency (CISA). The dominoes are falling.',

                intelCards: [
                    { dimension: 'technical', label: 'Attack Vector', value: 'Trojanized software update via compromised CI/CD build pipeline' },
                    { dimension: 'technical', label: 'Dwell Time', value: '~9 months of undetected distribution to 18,000 organizations' },
                    { dimension: 'financial', label: 'Vendor Revenue', value: '$1B+ annual revenue, publicly traded (NYSE)' },
                    { dimension: 'regulatory', label: 'Agencies Affected', value: 'Treasury, DHS, DOE, Commerce, State Department (confirmed)' },
                    { dimension: 'political', label: 'Attribution', value: 'Intelligence community assessing Russian SVR (foreign intelligence service)' },
                    { dimension: 'legislative', label: 'Disclosure Rules', value: 'No federal mandatory incident reporting law exists yet' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'political', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Backdoor embedded in signed, legitimate software updates distributed to 18,000 organizations over 9 months. The SUNBURST malware used sophisticated DNS beaconing and blended into normal Orion traffic. Traditional perimeter and endpoint defenses were blind because the malicious code was delivered through a trusted, signed update channel.',
                        metric: '18,000 orgs received trojanized update | 9-month dwell | Signed code bypassed all defenses'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'The vendor lost over 40% of its market capitalization within weeks. Remediation costs across the federal government alone exceeded $100M. Private sector customers faced incident response costs ranging from $500K to $5M per organization. The vendor spent $40M+ on remediation and rebuilding its build infrastructure from scratch.',
                        metric: '40% stock decline | $100M+ federal remediation | $40M vendor rebuild cost'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'CISA issued Emergency Directive 21-01 requiring all federal agencies to disconnect affected products immediately. SEC opened an investigation into the vendor\'s disclosure timeline and whether customers were properly notified. The incident exposed the absence of mandatory supply chain security requirements for federal contractors.',
                        metric: 'CISA Emergency Directive 21-01 | SEC investigation | Federal contractor security gaps exposed'
                    },
                    political: {
                        severity: 5,
                        timing: 'short',
                        description: 'Attribution to Russian SVR made this a national security crisis. Congressional hearings convened across multiple committees. The SolarWinds CEO, FireEye CEO, and Microsoft president all testified. The incident became a defining moment in US-Russia cyber relations and exposed gaps in federal cyber defense posture.',
                        metric: 'Senate Intelligence + Homeland Security hearings | Russian SVR attribution | National security crisis'
                    },
                    legislative: {
                        severity: 5,
                        timing: 'long',
                        description: 'Directly catalyzed Executive Order 14028 (Improving the Nation\'s Cybersecurity), mandating software bill of materials (SBOM), zero trust architecture for federal agencies, and incident reporting requirements. Contributed to the passage of the Cyber Incident Reporting for Critical Infrastructure Act (CIRCIA) in 2022.',
                        metric: 'EO 14028 (May 2021) | SBOM mandate | CIRCIA (2022) | Zero trust federal mandate'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Month 0 -- FireEye Discovers Its Own Breach',
                        situation: 'A leading cybersecurity firm discovers that its own Red Team assessment tools have been stolen by a sophisticated adversary. During the investigation, they trace the intrusion vector to a trojanized update from an IT management platform used by thousands of organizations. The compromised update has been in circulation for at least 9 months. No government agency detected this. As a CISA analyst, you are among the first government officials briefed.',
                        evidence: [
                            { text: 'FireEye Red Team tools confirmed exfiltrated', reliability: 'high' },
                            { text: 'Trojanized DLL identified in signed software update', reliability: 'high' },
                            { text: 'DNS beaconing to avsvmcloud[.]com domain confirmed', reliability: 'high' },
                            { text: 'Estimated 18,000 organizations installed the compromised update', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Issue an emergency directive ordering all federal agencies to immediately disconnect the affected product from their networks',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct response. CISA Emergency Directive 21-01 is issued within 48 hours of notification. While disconnecting a widely-used management tool causes operational disruption, the active backdoor in federal networks demands immediate containment. This is exactly what CISA did in the real incident.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Rapid disconnection limited further lateral movement within federal networks.' },
                                    regulatory: { severityDelta: -1, description: 'Emergency Directive demonstrated CISA\'s operational capability and justified expanded authorities.' }
                                }
                            },
                            {
                                text: 'Begin quiet coordination with the vendor and intelligence community before any public action',
                                score: 1,
                                optimal: false,
                                consequence: 'While coordination is important, every hour of delay means active backdoors remain operational in federal networks. The adversary may detect the investigation and accelerate data exfiltration or cover their tracks. FireEye is preparing its own public disclosure.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Delayed containment allowed continued adversary access to federal networks.' },
                                    political: { severityDelta: 1, description: 'Delay in government response perceived as failure to protect national security.' }
                                }
                            },
                            {
                                text: 'Wait for full scope assessment before taking action -- we need to know exactly which agencies are compromised',
                                score: 0,
                                optimal: false,
                                consequence: 'Catastrophic delay. A full scope assessment of 18,000 organizations will take weeks or months. Meanwhile, a foreign intelligence service has active backdoors in Treasury, DHS, DOE, and other critical agencies. Waiting for perfect information in an active national security crisis is a failure of incident command.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Extended adversary dwell time in federal networks during assessment period.' },
                                    political: { severityDelta: 2, description: 'Congressional leaders furious that government waited while foreign intelligence had active access.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 1 -- Supply Chain Vector Identified',
                        situation: 'The trojanized update has been definitively traced to the vendor\'s build environment. The attacker compromised the CI/CD pipeline and injected malicious code that was compiled into the official, digitally signed software release. This means every organization that installed the update received a legitimate-looking, vendor-signed backdoor. The affected product is the primary network monitoring tool for many federal agencies. Intelligence community is converging on Russian SVR attribution.',
                        evidence: [
                            { text: 'Build server compromise confirmed -- CI/CD pipeline was the vector', reliability: 'high' },
                            { text: 'Malicious code was present in official signed builds', reliability: 'high' },
                            { text: 'NSA and FBI assess Russian SVR with high confidence', reliability: 'high' },
                            { text: 'Secondary payloads (TEARDROP, RAINDROP) found on select targets', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Establish a Unified Coordination Group (UCG) with FBI, NSA, ODNI, and CISA to manage the cross-government response',
                                score: 3,
                                optimal: true,
                                consequence: 'A UCG is the correct mechanism for a cyber incident of this scale. It coordinates intelligence sharing, attribution, remediation, and communication across government. This is exactly what was stood up in the real incident and became a template for future responses.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'UCG demonstrated coordinated government response, reducing perception of chaos.' },
                                    regulatory: { severityDelta: 0, description: 'UCG framework provided clear authority lines for emergency directives.' }
                                }
                            },
                            {
                                text: 'Publicly name Russia as the attacker immediately to deter further operations',
                                score: 1,
                                optimal: false,
                                consequence: 'Premature public attribution before the intelligence community has completed its assessment undermines the attribution process. Russia denies involvement. Without a coordinated, evidence-backed attribution statement, the claim lacks the weight needed for diplomatic consequences. It also tips off the adversary about what investigators know.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Premature attribution without IC consensus undermined the diplomatic response.' },
                                    legislative: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Focus exclusively on remediating federal networks -- private sector is not our responsibility',
                                score: 1,
                                optimal: false,
                                consequence: 'While federal network remediation is critical, the supply chain compromise affects 18,000 organizations including critical infrastructure operators. CISA\'s mandate includes critical infrastructure protection. Ignoring the private sector dimension leaves thousands of organizations exposed and misses the opportunity to coordinate the national response.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Failure to coordinate private sector response left critical infrastructure exposed.' },
                                    legislative: { severityDelta: 1, description: 'Gap in government-private sector coordination became a primary legislative focus.' }
                                }
                            },
                            {
                                text: 'Impose immediate sanctions on Russia and expel diplomats',
                                score: 0,
                                optimal: false,
                                consequence: 'Sanctions at this stage are premature -- the intelligence assessment is incomplete, remediation has barely begun, and unilateral action without allied coordination weakens the diplomatic impact. When sanctions were eventually imposed in April 2021, they were coordinated with allies and paired with specific technical attribution.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Premature sanctions without allied coordination weakened the diplomatic response.' },
                                    financial: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 1 -- Government Agencies Confirmed Affected',
                        situation: 'Investigation confirms that the US Treasury Department, Department of Commerce (NTIA), Department of Homeland Security, the State Department, and parts of the Department of Energy (including NNSA, which oversees the nuclear weapons stockpile) all installed the compromised update. The adversary had access to email systems containing sensitive (but unclassified) communications. Congressional leaders from both parties are demanding briefings. The vendor\'s stock has dropped 40% and major customers are canceling contracts.',
                        evidence: [
                            { text: 'Treasury, Commerce, DHS, State, DOE/NNSA confirmed affected', reliability: 'high' },
                            { text: 'Email systems accessed -- sensitive but unclassified communications exposed', reliability: 'high' },
                            { text: 'No evidence of classified network compromise', reliability: 'medium' },
                            { text: 'Vendor reports active customer cancellations and lawsuits pending', reliability: 'high' }
                        ],
                        contradicts: false,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Provide full classified briefings to Congressional leadership and prepare for public hearings',
                                score: 3,
                                optimal: true,
                                consequence: 'Transparency with Congress is essential for maintaining democratic oversight of national security incidents. Classified briefings allow full context sharing while public hearings signal accountability. This approach builds the political support needed for the legislative reforms that will follow.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Congressional engagement built bipartisan support for cybersecurity reform.' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Early Congressional engagement shaped productive legislative response rather than reactive punishment.' }
                                }
                            },
                            {
                                text: 'Downplay the severity to avoid public panic -- emphasize no classified networks were compromised',
                                score: 0,
                                optimal: false,
                                consequence: 'Minimizing a nation-state compromise of multiple cabinet-level agencies is guaranteed to backfire. When the full scope eventually leaks (and it will), the coverup becomes the story. Sensitive unclassified communications from Treasury and the nuclear weapons agency being read by Russian intelligence is severe regardless of classification level.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'Attempted minimization destroyed credibility when full scope was revealed.' },
                                    reputational: { severityDelta: 1, description: 'Government credibility undermined by perceived dishonesty.' }
                                }
                            },
                            {
                                text: 'Recommend that all federal agencies transition away from the vendor immediately and permanently',
                                score: 1,
                                optimal: false,
                                consequence: 'While emotionally satisfying, ripping out a deeply embedded network monitoring tool across the federal government without a replacement creates a monitoring blind spot. Agencies need visibility into their networks more than ever during an active incident. The vendor, once cleaned, is not inherently less secure than alternatives -- the real issue is build pipeline security across all vendors.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Removing monitoring tools during active incident created visibility gaps.' },
                                    financial: { severityDelta: 1, description: 'Emergency procurement of replacement tools cost hundreds of millions with no security guarantee.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 -- CISA Emergency Directive + Congressional Response',
                        situation: 'The incident response is maturing. CISA has issued multiple supplemental directives. The intelligence community has formally attributed the attack to Russian SVR. Congressional hearings have concluded with bipartisan agreement that systemic changes are needed. The White House is drafting an executive order on cybersecurity. Key proposals include: mandatory software bill of materials (SBOM), zero trust architecture requirements for federal agencies, and mandatory incident reporting for critical infrastructure operators.',
                        evidence: [
                            { text: 'Formal IC attribution: Russian SVR (APT29/Cozy Bear)', reliability: 'high' },
                            { text: 'White House drafting Executive Order on cybersecurity', reliability: 'high' },
                            { text: 'Bipartisan support for mandatory incident reporting legislation', reliability: 'high' },
                            { text: 'Vendor has rebuilt entire build infrastructure from scratch', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Advocate for comprehensive executive order mandating SBOM, zero trust, and incident reporting -- use this crisis as the catalyst for systemic reform',
                                score: 3,
                                optimal: true,
                                consequence: 'This is exactly what happened. Executive Order 14028 (May 2021) became the most significant federal cybersecurity policy action in a decade. It mandated SBOM for software sold to the government, required zero trust architecture implementation, and established incident reporting requirements. Crises create reform windows -- this one was used effectively.',
                                modifiers: {
                                    legislative: { severityDelta: -1, mitigated: true, description: 'EO 14028 and CIRCIA represented meaningful systemic reform born from the crisis.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'SBOM and zero trust mandates addressed the root cause of blind trust in supply chains.' }
                                }
                            },
                            {
                                text: 'Focus narrowly on sanctions against Russia -- the primary response should be diplomatic/punitive',
                                score: 1,
                                optimal: false,
                                consequence: 'Sanctions alone do not address the systemic vulnerabilities that enabled the attack. Russia (and other adversaries) will continue exploiting supply chain weaknesses regardless of sanctions. Without defensive reforms, the next supply chain attack is a matter of when, not if. Sanctions were imposed (April 2021) but they were one component of a multi-pronged response, not the whole answer.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Sanctions-only approach left systemic supply chain vulnerabilities unaddressed.' },
                                    legislative: { severityDelta: 1, description: 'Missing the legislative window meant reforms were delayed or weakened.' }
                                }
                            },
                            {
                                text: 'Recommend incremental improvements to existing frameworks rather than sweeping new mandates',
                                score: 1,
                                optimal: false,
                                consequence: 'Incrementalism after a crisis of this magnitude signals that the government has not learned the lesson. The existing frameworks failed to prevent 9 months of undetected foreign intelligence access to cabinet-level agencies. Incremental patches to a fundamentally broken trust model will not prevent the next supply chain compromise.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Incremental response perceived as inadequate given the severity of the breach.' },
                                    legislative: { severityDelta: 1, description: 'Failure to seize the reform moment meant weaker long-term policy outcomes.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
