    <style>

        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }

</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 07 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w2-bcp-drp-lab',
            scenario: {
                title: 'Dark Grid',
                subtitle: 'Colonial Pipeline-style ransomware hits a regional power utility serving 4 million customers. SCADA systems are offline. The clock is ticking.',
                briefing: 'Meridian Power, a regional electric utility serving 4 million customers across three states, has been hit with ransomware. The attack encrypted both IT systems (billing, email, customer portal) and, critically, penetrated the IT/OT boundary to impact operational technology systems. SCADA (Supervisory Control and Data Acquisition) systems controlling power distribution are offline. Automated load balancing is non-functional. Manual overrides are keeping power flowing to hospitals and critical infrastructure, but residential and commercial customers in two service zones are experiencing rolling blackouts. The attackers, a ransomware-as-a-service group operating from Eastern Europe, are demanding $4.4 million in Bitcoin with a 7-day deadline. After 7 days, the ransom doubles. After 14 days, they threaten to release stolen operational data. You are the utility\'s Chief Information Security Officer. 4 million people are counting on you.',

                intelCards: [
                    { dimension: 'technical', label: 'Systems Encrypted', value: 'IT (billing, email, portal) + OT (SCADA load balancing, distribution automation)' },
                    { dimension: 'technical', label: 'Backup Status', value: 'IT backups exist (48h old), OT backups untested for 14 months' },
                    { dimension: 'financial', label: 'Ransom Demand', value: '$4.4M Bitcoin (doubles after 7 days)' },
                    { dimension: 'regulatory', label: 'Oversight', value: 'NERC CIP, state PUC, FERC -- mandatory reliability standards' },
                    { dimension: 'political', label: 'Service Area', value: '4M customers across 3 states including state capital' },
                    { dimension: 'legislative', label: 'Pipeline Precedent', value: 'Colonial Pipeline ($4.4M ransom, 2021) set public expectations' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'political', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'IT and OT systems simultaneously encrypted. SCADA control of power distribution is non-functional. Manual overrides maintaining critical loads only. The IT/OT boundary failure is the critical lesson -- the attacker pivoted from a phishing email on the corporate network to the operational technology environment because network segmentation was inadequate. OT backups exist but have not been tested in 14 months.',
                        metric: 'IT + OT encrypted | SCADA offline | Manual overrides only | OT backups untested 14 months'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Direct costs include ransom (if paid), incident response ($5-8M), system rebuild, lost revenue during outage, and regulatory fines. Indirect costs include customer compensation, infrastructure hardening, and increased insurance premiums. Colonial Pipeline ultimately paid $4.4M but recovered $2.3M through DOJ seizure. Total incident cost for a utility of this size: estimated $50-80M.',
                        metric: '$4.4M ransom | $5-8M IR costs | $50-80M total estimated | Revenue loss during outage'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'NERC CIP (Critical Infrastructure Protection) standards mandate specific cybersecurity controls for bulk electric systems. The IT/OT boundary failure likely violates CIP-005 (Electronic Security Perimeters) and CIP-007 (System Security Management). NERC can impose fines up to $1M per violation per day. State public utility commissions will open investigations into whether the utility met its reliability obligations.',
                        metric: 'NERC CIP violations (005, 007) | $1M/day/violation | 3 state PUC investigations | FERC oversight'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'Rolling blackouts affecting 4 million customers generate immediate, visceral public anger. Unlike a data breach where impact is abstract, loss of electric power is tangible -- food spoils, medical equipment fails, businesses close. If the ransom is paid, the narrative becomes "utility pays criminals with ratepayer money." If not paid, the narrative is "utility chose pride over power restoration."',
                        metric: '4M customers in blackouts | Either-way narrative trap | Tangible physical impact'
                    },
                    political: {
                        severity: 5,
                        timing: 'short',
                        description: 'Three state governors are receiving constituent complaints. The state capital is in the service area -- legislators are personally affected. Congressional delegation demands federal assistance. The incident becomes a talking point in the ongoing debate about critical infrastructure cybersecurity. Both political parties use it to advance different policy agendas.',
                        metric: '3 governors engaged | State capital affected | Congressional delegation involved'
                    },
                    legislative: {
                        severity: 4,
                        timing: 'long',
                        description: 'The incident accelerates existing legislative efforts to strengthen critical infrastructure cybersecurity requirements. Proposals include mandatory OT security standards, required IT/OT segmentation audits, incident reporting mandates, and ransom payment disclosure requirements. The Colonial Pipeline precedent (EO 14028, CIRCIA) provides the template, but utilities face even stricter scrutiny given their direct public safety impact.',
                        metric: 'OT security mandates | IT/OT segmentation audits | Ransom disclosure requirements'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Hour 0 -- Ransomware Discovered, OT Offline',
                        situation: 'At 2:47 AM, the NOC detects mass encryption across IT systems. By 3:15 AM, operators confirm SCADA systems are unresponsive. Automated load balancing has failed, and two distribution zones are experiencing blackouts. Emergency manual overrides are keeping power flowing to hospitals, water treatment facilities, and 911 centers. The ransomware note demands $4.4M in Bitcoin. Your IT backups are 48 hours old. Your OT backups have not been tested in 14 months. You have a skeleton overnight crew of 12 operators managing manual overrides. Dawn (and peak load) is 4 hours away.',
                        evidence: [
                            { text: 'IT systems encrypted -- ransom note confirmed (DarkSide variant)', reliability: 'high' },
                            { text: 'SCADA systems unresponsive -- manual overrides engaged', reliability: 'high' },
                            { text: 'Two distribution zones in blackout (est. 800K customers)', reliability: 'high' },
                            { text: 'OT backups exist but last test was 14 months ago', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Activate the incident response plan: isolate IT/OT networks, call in mutual aid crews, notify CISA and FBI, and begin OT backup validation',
                                score: 3,
                                optimal: true,
                                consequence: 'Textbook response. Network isolation prevents further spread. Mutual aid from neighboring utilities provides additional operators for manual control. CISA provides technical assistance for critical infrastructure incidents. FBI begins the criminal investigation. Starting OT backup validation now means you will know within hours whether recovery from backups is viable -- critical for the ransom decision.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Network isolation and early backup validation accelerated recovery timeline.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Proactive federal engagement demonstrated the utility was taking the crisis seriously.' }
                                }
                            },
                            {
                                text: 'Begin negotiating with the attackers immediately to reduce the ransom and get decryption keys as fast as possible',
                                score: 1,
                                optimal: false,
                                consequence: 'Jumping straight to negotiation without understanding your recovery options is premature. You do not yet know if your backups work, which means you do not have leverage in the negotiation. Ransomware negotiators (which you should hire through your IR retainer) need time to establish communication channels and assess the attacker group\'s reliability. Rushing signals desperation.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Rushed negotiation resulted in a higher payment with no guarantee of full decryption.' },
                                    reputational: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Pay the $4.4M ransom immediately -- every hour of blackout puts lives at risk',
                                score: 0,
                                optimal: false,
                                consequence: 'Immediate payment without any due diligence is the worst option. You have no guarantee the decryption keys will work. You have not validated whether backups can restore systems faster. You have not engaged law enforcement, which may be able to recover funds (as DOJ did with Colonial Pipeline). Paying immediately also makes you a prime target for re-attack -- groups that pay quickly are hit again.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Immediate payment with no negotiation or FBI engagement meant funds were unrecoverable.' },
                                    political: { severityDelta: 1, description: 'Paying ransom with ratepayer funds without exploring alternatives drew intense political criticism.' },
                                    legislative: { severityDelta: 1, description: 'Immediate payment strengthened arguments for ransom payment bans in critical infrastructure.' }
                                }
                            },
                            {
                                text: 'Shut down the entire grid to prevent any further damage -- full blackout is safer than partial',
                                score: 0,
                                optimal: false,
                                consequence: 'A full intentional blackout for 4 million customers would cause catastrophic harm. Hospitals on generator backup have limited fuel. Water treatment stops. Traffic signals go dark. Cell towers lose power after battery backup expires. The manual overrides are working -- critical loads are being served. A full shutdown converts a managed crisis into a catastrophe.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Full shutdown caused a cold-start problem -- restoring a dead grid takes days, not hours.' },
                                    reputational: { severityDelta: 2, description: 'Intentional full blackout was perceived as panic-driven incompetence.' },
                                    political: { severityDelta: 2, description: 'Governors demanded CISO resignation after intentional full blackout.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 1 -- Ransom Demand, FBI Contact Decision',
                        situation: 'It is now 24 hours into the incident. IT backups have been validated and IT system restoration has begun (estimated 3-5 days). OT backup validation reveals a critical problem: the 14-month-old backups are from a previous SCADA software version and cannot be restored to the current hardware without significant reconfiguration (estimated 10-14 days). Manual operations are holding but operator fatigue is becoming a factor. Mutual aid crews from two neighboring utilities have arrived. FBI has identified the ransomware group and reports they have a 78% decryption success rate (meaning 22% of victims who pay do not get working keys). Media is now covering the blackouts.',
                        evidence: [
                            { text: 'IT backups valid -- restoration in progress (3-5 day ETA)', reliability: 'high' },
                            { text: 'OT backups incompatible with current hardware -- 10-14 day rebuild', reliability: 'high' },
                            { text: 'FBI: ransomware group has 78% decryption success rate', reliability: 'high' },
                            { text: 'Operator fatigue risk increasing -- 12h manual shift rotations', reliability: 'medium' }
                        ],
                        contradicts: true,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Begin parallel tracks: hire a ransomware negotiator to engage the attackers while simultaneously pursuing OT rebuild from scratch -- maintain both options',
                                score: 3,
                                optimal: true,
                                consequence: 'The dual-track approach is optimal. Negotiation buys time and provides an option if the rebuild stalls. The rebuild provides leverage in negotiation (you have an alternative). FBI coordination may enable fund recovery if payment becomes necessary. Colonial Pipeline used this exact approach -- they paid the ransom but DOJ later recovered $2.3M of the $4.4M.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Dual-track approach enabled negotiated lower payment while maintaining rebuild option.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'Parallel rebuild and negotiation minimized total restoration time.' }
                                }
                            },
                            {
                                text: 'Refuse to pay on principle and commit fully to the 10-14 day OT rebuild',
                                score: 1,
                                optimal: false,
                                consequence: 'Principled, but 10-14 more days of rolling blackouts for 4 million customers has severe consequences. People with medical equipment, small businesses, food supply chains -- all are impacted. Operator fatigue during manual operations increases the risk of a safety incident. The principle of not paying is correct in theory, but the public safety calculus is different for critical infrastructure.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Extended blackouts while refusing to explore all options drew public fury.' },
                                    political: { severityDelta: 1, description: 'Governors publicly demanded the utility "do whatever it takes" to restore power.' }
                                }
                            },
                            {
                                text: 'Pay the full $4.4M ransom now -- the 22% failure rate is acceptable given the stakes',
                                score: 1,
                                optimal: false,
                                consequence: 'Paying full price without negotiation leaves money on the table. Ransomware groups expect negotiation -- the $4.4M demand is their opening position. Without a negotiator, you also miss the opportunity for FBI to set up fund tracing. And a 22% chance of getting nothing for $4.4M is a significant risk that should be mitigated through parallel rebuild.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Full payment without negotiation resulted in $2M+ overpayment vs. negotiated outcomes.' },
                                    legislative: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 5 -- Partial Restoration vs Payment Deadline',
                        situation: 'IT systems are 80% restored from backups. Customer billing and communication systems are back online. However, OT/SCADA restoration is only 20% complete and the rebuild team estimates 8 more days. The ransomware group has reduced their demand to $2.8M through negotiation, but the deadline is midnight tonight -- after which the price doubles and they threaten to release stolen operational data (network diagrams, SCADA configurations, physical plant locations). FBI reports they have established fund tracing capability if payment is made to the identified wallet. Two of the three affected governors have called for a public emergency declaration.',
                        evidence: [
                            { text: 'IT restoration 80% -- billing/comms restored', reliability: 'high' },
                            { text: 'OT/SCADA 20% -- 8 more days estimated', reliability: 'high' },
                            { text: 'Negotiated ransom: $2.8M -- deadline midnight tonight', reliability: 'high' },
                            { text: 'FBI has fund tracing capability on the target wallet', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Pay the negotiated $2.8M with FBI fund tracing active, continue the OT rebuild in parallel, and use the decryption keys to accelerate SCADA restoration',
                                score: 3,
                                optimal: true,
                                consequence: 'This is the pragmatic choice when public safety is at stake. The negotiated price is 36% below the original demand. FBI fund tracing provides a chance of recovery (DOJ recovered 63.7 BTC of Colonial Pipeline\'s 75 BTC payment). The decryption keys, combined with the ongoing rebuild, provide the fastest path to full OT restoration. Continuing the rebuild ensures you have a fallback if decryption fails.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Decryption keys + parallel rebuild achieved full OT restoration in 4 days instead of 8.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'FBI fund tracing recovered $1.8M of the $2.8M payment within 6 weeks.' }
                                }
                            },
                            {
                                text: 'Refuse payment and accept 8 more days of degraded operations -- the rebuild is working',
                                score: 1,
                                optimal: false,
                                consequence: 'The rebuild is working, but 8 more days of rolling blackouts and manual operations carries compounding risks. Operator errors during manual control have already caused two minor voltage fluctuations. The stolen operational data (network diagrams, SCADA configs, physical plant locations) being released publicly creates new security risks for years to come.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Extended outage and data leak of operational diagrams compounded the crisis.' },
                                    technical: { severityDelta: 1, description: 'Released SCADA configurations and network diagrams created ongoing security exposure.' }
                                }
                            },
                            {
                                text: 'Ask the state governors to declare a state of emergency and authorize National Guard cyber assistance',
                                score: 2,
                                optimal: false,
                                consequence: 'A state of emergency declaration is appropriate for public safety measures (shelters, generator distribution) but the National Guard\'s cyber capabilities are limited compared to private sector IR firms and CISA. This does not solve the core technical problem and the political optics of a military response to a ransomware attack are complicated. It also does not address the midnight ransom deadline.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'Emergency declaration was appropriate but did not accelerate technical restoration.' },
                                    reputational: { severityDelta: 0, description: 'Military involvement created mixed public reaction -- reassurance vs. alarm.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 4 -- CISA After-Action Review + Congressional Inquiry',
                        situation: 'Power has been fully restored for 2 weeks. The combined approach of decryption keys and manual rebuild achieved full OT restoration. CISA has completed its technical after-action review and the findings are damning: inadequate IT/OT network segmentation, untested OT backups, no OT-specific incident response plan, and the SCADA systems were running software 3 versions behind with known vulnerabilities. Three Congressional committees are holding hearings. NERC has opened a formal investigation into CIP compliance. All three state PUCs are reviewing the utility\'s rate structure to fund required security improvements.',
                        evidence: [
                            { text: 'CISA after-action: 4 critical findings (segmentation, backups, IR plan, patching)', reliability: 'high' },
                            { text: 'NERC CIP formal investigation opened -- potential fines $1M/day/violation', reliability: 'high' },
                            { text: '3 state PUCs reviewing rate cases for security investment', reliability: 'high' },
                            { text: 'Congressional hearings scheduled -- CISO subpoenaed to testify', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Accept all CISA findings, present a comprehensive OT security remediation plan with timelines and costs, cooperate fully with NERC, and testify transparently before Congress',
                                score: 3,
                                optimal: true,
                                consequence: 'Full acceptance of findings and transparent cooperation is the only path that leads to recovery. The remediation plan becomes the roadmap for rate case filings with state PUCs (customers will fund security improvements through rates). NERC cooperation may result in reduced penalties. Congressional testimony shapes future legislation -- honesty about what failed and what must change makes you a credible voice in the policy debate.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Full cooperation with NERC resulted in a settlement with reduced fines and a compliance monitor.' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Transparent Congressional testimony positioned the utility as a reform advocate, not a villain.' }
                                }
                            },
                            {
                                text: 'Challenge CISA\'s findings as unrealistic for a utility of this size and budget -- the standards are aspirational, not achievable',
                                score: 0,
                                optimal: false,
                                consequence: 'Challenging CISA after a major infrastructure incident that caused blackouts for 4 million customers is tone-deaf. The findings are factual, not aspirational -- IT/OT segmentation, backup testing, and patching are baseline requirements, not advanced capabilities. This defense alienates regulators, enrages legislators, and guarantees maximum NERC penalties.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'Challenging findings converted cooperative investigation into adversarial enforcement.' },
                                    political: { severityDelta: 1, description: 'Congressional members cited the utility\'s defiance as evidence of industry-wide complacency.' }
                                }
                            },
                            {
                                text: 'Propose that the federal government should fund critical infrastructure cybersecurity -- utilities cannot bear these costs alone',
                                score: 2,
                                optimal: false,
                                consequence: 'There is a legitimate policy argument that critical infrastructure cybersecurity is a shared national security responsibility. However, leading with this argument immediately after your utility failed to test OT backups for 14 months sounds like deflection. The better sequence is: accept responsibility first, fix your own failures, then advocate for federal funding as a longer-term policy position.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'Federal funding argument had merit but timing undermined credibility.' },
                                    financial: { severityDelta: 0, description: 'Federal funding eventually materialized (IIJA cybersecurity grants) but not in time to help this utility.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
