    <title>Incident Timeline: The Equifax Domino | CIS2208</title>
    <link rel="stylesheet" href="../../../../components/DominoEngine.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #ede0f0; line-height: 1.6; padding: 20px;
        }
        .de-top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,0,255,0.1);
        }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn {
            text-decoration: none; color: #ff00ff; font-size: 0.75rem;
            padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2);
            border-radius: 6px; transition: all 0.2s;
        }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 01 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w1-origins-lab',
            scenario: {
                title: 'The Equifax Domino',
                subtitle: 'September 2017 — 147 million Americans exposed. Trace the cascade.',
                briefing: 'Equifax, one of the three major US credit reporting agencies, has disclosed a massive data breach. Attackers exploited a known Apache Struts vulnerability (CVE-2017-5638) that had a patch available for two months before the breach began. The stolen data includes names, Social Security numbers, birth dates, addresses, and some driver\'s license numbers of approximately 147 million consumers. You are a cybersecurity policy analyst tasked with predicting and responding to the cascading impacts of this incident across all dimensions.',

                intelCards: [
                    { dimension: 'technical', label: 'Attack Vector', value: 'Apache Struts CVE-2017-5638 (unpatched for 78 days)' },
                    { dimension: 'technical', label: 'Data Exposed', value: '147.9 million consumer records (SSN, DOB, addresses)' },
                    { dimension: 'financial', label: 'Company Revenue', value: '$3.1 billion annually (pre-breach)' },
                    { dimension: 'regulatory', label: 'Regulatory Landscape', value: 'FTC, CFPB, state AGs, SEC, UK ICO, Canadian OPC' },
                    { dimension: 'reputational', label: 'Market Position', value: '1 of 3 major US credit bureaus — consumers cannot opt out' },
                    { dimension: 'political', label: 'Political Climate', value: 'Growing bipartisan concern over data broker accountability' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'political', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Total compromise of consumer PII database. 147.9M records exfiltrated over 78 days through unpatched Apache Struts vulnerability. Internal detection systems failed — breach discovered by external notification.',
                        metric: '147.9M records | 76-day dwell time | CVE patch available 2 months prior'
                    },
                    financial: {
                        severity: 5,
                        timing: 'medium',
                        description: 'Direct costs exceeded $1.4 billion including settlements, remediation, credit monitoring, and legal fees. Stock price dropped 35% within a week of disclosure. CEO, CIO, and CISO all departed.',
                        metric: '$1.4B+ total cost | 35% stock drop | up to $700M FTC/CFPB/state settlement'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'FTC filed complaint. $575M consent decree with FTC, CFPB, and 50 states (up to $700M if consumer restitution fully claimed) — largest data breach settlement in history at the time. 50 state AGs filed suit. UK ICO fined 500K GBP (max under pre-GDPR law). SEC investigated insider trading by executives.',
                        metric: 'up to $700M FTC/CFPB/state settlement | 50 state AG actions | SEC insider trading probe'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'Consumer trust collapsed but recovery was forced by market structure — consumers cannot choose to leave the credit bureau system. Breach response website was itself criticized for security flaws. CEO testified before Congress.',
                        metric: 'Congressional testimony | Response site mocked | Forced consumer relationship'
                    },
                    political: {
                        severity: 4,
                        timing: 'short',
                        description: 'Multiple Congressional hearings across Senate and House committees. Bipartisan outrage at data broker industry. Executives called to testify. Became a defining example in policy debates about corporate cybersecurity responsibility.',
                        metric: '4 Congressional hearings | CEO testimony | Bipartisan action'
                    },
                    legislative: {
                        severity: 4,
                        timing: 'long',
                        description: 'Accelerated passage of state breach notification laws. Contributed to momentum for CCPA in California. Renewed calls for federal data privacy legislation. Influenced SEC cybersecurity disclosure rules adopted in 2023.',
                        metric: 'CCPA catalyst | SEC disclosure rules (2023) | Federal privacy debate accelerated'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Hour 0 — Breach Discovered',
                        situation: 'Your security team has confirmed the breach is real. Apache Struts was unpatched despite a CVE alert 78 days ago. The vulnerability scanning team says they ran a scan but it did not flag the Struts installation. You have not yet determined the full scope of exposed data. The CEO wants a status update in 30 minutes.',
                        evidence: [
                            { text: 'CVE-2017-5638 confirmed exploited', reliability: 'high' },
                            { text: 'Scan logs show Struts was excluded from scope', reliability: 'high' },
                            { text: 'Estimated 50-100M records potentially exposed', reliability: 'medium' },
                            { text: 'No evidence of ongoing exfiltration', reliability: 'low' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Immediately notify the public and begin credit monitoring setup',
                                score: 1,
                                optimal: false,
                                consequence: 'Premature disclosure without understanding scope. Media reports conflicting numbers. Regulators criticize incomplete information. But consumers appreciate the transparency.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Early notification earned some regulatory goodwill despite incomplete scope.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Consumers valued early transparency, softening reputational damage.' }
                                }
                            },
                            {
                                text: 'Contain the vulnerability, begin forensic investigation, prepare disclosure plan',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct approach. Patch applied immediately. Forensic team engaged. Legal counsel drafts regulatory notifications. Scope determination begins. This follows NIST incident response best practices.',
                                modifiers: {
                                    technical: { severityDelta: 0, description: 'Containment was swift. Forensics began immediately.' },
                                    regulatory: { severityDelta: 0, description: 'Proper incident response process followed. Regulators noted due diligence.' }
                                }
                            },
                            {
                                text: 'Wait for more information before taking any action — we need complete data first',
                                score: 0,
                                optimal: false,
                                consequence: 'Delay costs critical hours. The breach may still be active. Every hour of inaction means more records potentially exposed. Regulators will later cite this delay as negligence.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Delayed containment allowed additional exfiltration.' },
                                    regulatory: { severityDelta: 1, description: 'Delayed response cited as evidence of negligence in regulatory proceedings.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 3 — Scope Confirmed',
                        situation: 'Forensic analysis confirms 147.9 million consumer records were accessed including SSNs, birth dates, and addresses. Legal counsel informs you that 48 states have breach notification laws with varying timelines (30-90 days). The board of directors demands a meeting. Three senior executives sold stock in the days between breach discovery and this confirmation.',
                        evidence: [
                            { text: '147.9M records confirmed via database log analysis', reliability: 'high' },
                            { text: 'Executive stock sales flagged by compliance', reliability: 'high' },
                            { text: 'Rumor: a journalist has been tipped off', reliability: 'medium' },
                            { text: 'Legal says GDPR may apply to EU nationals in dataset', reliability: 'medium' }
                        ],
                        contradicts: true,
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Disclose immediately to all regulators and the public simultaneously',
                                score: 3,
                                optimal: true,
                                consequence: 'Speed matters in breach response. While the notification format is imperfect, rapid disclosure is valued by regulators and the public. Coordinating perfect notifications while sitting on 147M exposed records is a losing trade.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Rapid notification noted by regulators, though format was imperfect.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'Politicians acknowledged the company moved quickly once scope was confirmed.' }
                                }
                            },
                            {
                                text: 'Immediately report the executive stock sales to the SEC and begin internal investigation',
                                score: 3,
                                optimal: true,
                                consequence: 'Self-reporting insider trading demonstrates governance integrity. SEC values voluntary disclosure. This separates the breach response from the insider trading issue and shows the board takes governance seriously.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'SEC self-referral demonstrated governance integrity.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Proactive SEC engagement reduced regulatory financial penalties.' }
                                }
                            },
                            {
                                text: 'Coordinate with legal to prepare state-by-state notifications meeting each jurisdiction\'s requirements',
                                score: 2,
                                optimal: false,
                                consequence: 'Legally correct but slow. While you prepare 48 different notifications, the journalist breaks the story. You lose control of the narrative. The delay is interpreted as concealment.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Delayed disclosure interpreted as concealment by media.' },
                                    political: { severityDelta: 1, description: 'Congressional members cited notification delay in hearings.' }
                                }
                            },
                            {
                                text: 'Focus on launching a consumer remediation website before any public statement',
                                score: 1,
                                optimal: false,
                                consequence: 'The website launches with its own security issues — ironic given the breach. Technical shortcuts in the remediation site become their own news story. Good intent, terrible execution under time pressure.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Remediation website security flaws became a second story.' },
                                    technical: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 — Public Fallout',
                        situation: 'The breach is now public. Congressional hearings are being scheduled. The FTC and CFPB have opened formal investigations. Your stock is down 35%. Consumer groups are demanding free credit freezes (not just monitoring). Three class action lawsuits have been filed. The CEO is preparing testimony for the Senate Banking Committee.',
                        evidence: [
                            { text: 'FTC formal investigation opened', reliability: 'high' },
                            { text: '23 class action lawsuits filed', reliability: 'high' },
                            { text: 'Stock down 35% from pre-disclosure', reliability: 'high' },
                            { text: 'Senator Warren calling for CEO resignation', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'CEO takes full personal responsibility in Congressional testimony',
                                score: 3,
                                optimal: true,
                                consequence: 'Accountability matters. The CEO\'s willingness to accept blame rather than deflect to IT or vendors signals organizational maturity. It doesn\'t prevent penalties but it shapes the narrative toward "failure with accountability" rather than "failure with evasion."',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'CEO accountability reduced political pressure for punitive legislation.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Personal accountability softened public anger marginally.' }
                                }
                            },
                            {
                                text: 'Blame the IT department for failing to patch and announce the CISO has been fired',
                                score: 0,
                                optimal: false,
                                consequence: 'Scapegoating the CISO for a systemic governance failure is transparent. Cybersecurity professionals publicly criticize the move. Congressional members ask why the board didn\'t ensure patching was prioritized. The blame game backfires.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Scapegoating intensified Congressional scrutiny of board governance.' },
                                    reputational: { severityDelta: 1, description: 'Industry backlash against blame-shifting worsened reputation.' }
                                }
                            },
                            {
                                text: 'Announce a comprehensive security transformation program with specific commitments and timelines',
                                score: 2,
                                optimal: false,
                                consequence: 'Forward-looking but perceived as too little too late without first addressing accountability. Regulators note the commitments but focus on what failed. It helps long-term recovery but doesn\'t address the immediate political firestorm.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Security investment commitments reassured investors long-term.' },
                                    legislative: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 — Regulatory Reckoning',
                        situation: 'The FTC has proposed a $700M settlement. Multiple state AGs have joined a consolidated action. The UK ICO has issued its own fine. Your new CISO has completed a full security assessment revealing 12 additional critical vulnerabilities. Consumer advocacy groups are lobbying Congress for a federal data privacy law using your breach as Exhibit A.',
                        evidence: [
                            { text: 'up to $700M FTC/CFPB/state settlement proposed', reliability: 'high' },
                            { text: '12 additional critical vulns found by new CISO', reliability: 'high' },
                            { text: 'California legislature drafting CCPA with Equifax as cited example', reliability: 'high' },
                            { text: 'Consumer groups organized national "Freeze Your Credit" campaign', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Accept the FTC settlement and commit to 20 years of security audits',
                                score: 3,
                                optimal: true,
                                consequence: 'Accepting accountability and a long-term oversight commitment sends a signal to regulators and legislators that enforcement works. It reduces uncertainty for shareholders and allows the company to begin recovery. The 20-year audit term becomes a template for future settlements.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: '$700M settlement was substantial but provided certainty. Stock began recovering.' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Settlement demonstrated enforcement works, slightly reducing urgency for new legislation.' }
                                }
                            },
                            {
                                text: 'Fight the settlement in court — the fine is disproportionate',
                                score: 0,
                                optimal: false,
                                consequence: 'Litigation prolongs the story for years. Discovery reveals more damaging internal communications. Legal costs mount. Regulators become adversarial rather than collaborative. The stock languishes under uncertainty.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Prolonged litigation increased total costs and market uncertainty.' },
                                    political: { severityDelta: 1, description: 'Fighting the settlement enraged legislators — cited as evidence companies cannot self-regulate.' },
                                    legislative: { severityDelta: 1, description: 'Resistance to settlement accelerated calls for stricter mandatory legislation.' }
                                }
                            },
                            {
                                text: 'Negotiate the settlement down and redirect savings into consumer remediation',
                                score: 2,
                                optimal: false,
                                consequence: 'A reasonable business strategy, but the optics of negotiating down a penalty for losing 147M consumers\' SSNs is terrible. Media frames it as "Equifax haggles over the price of your identity." Consumer groups amplify the narrative.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Negotiating the fine perceived as prioritizing profit over consumers.' },
                                    regulatory: { severityDelta: 0 }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="csp-w1-origins" house="divergent"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
