<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calculated Risk | CIS2208</title>
    <link rel="stylesheet" href="../../../../components/DominoEngine.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #ede0f0; line-height: 1.6; padding: 20px;
        }
        .de-top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,0,255,0.1);
        }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn {
            text-decoration: none; color: #ff00ff; font-size: 0.75rem;
            padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2);
            border-radius: 6px; transition: all 0.2s;
        }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 13 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w4-risk-management-lab',
            scenario: {
                title: 'The Calculated Risk',
                subtitle: 'A cloud-native fintech startup faces a $20M vulnerability during peak season. Every option costs money.',
                briefing: 'NovaPay, a cloud-native fintech startup processing $5M/week in transactions, has identified a critical remote code execution vulnerability in their payment processing API during a routine penetration test. The vulnerability (CVE-2025-41823) allows unauthenticated access to transaction records and could enable fund diversion. Patching requires a full API rebuild that will take 2 weeks of downtime during Q4 peak season. The Annual Loss Expectancy (ALE) calculation shows 15% annual probability of exploitation with a $20M Single Loss Expectancy. As the risk management lead, you must apply quantitative risk analysis to decide: patch now ($10M certain revenue loss), defer with compensating controls ($2M cost, reduces probability to 5%), or accept the risk and monitor.',

                intelCards: [
                    { dimension: 'technical', label: 'Vulnerability', value: 'CVE-2025-41823 — RCE in payment API (CVSS 9.8)' },
                    { dimension: 'financial', label: 'Weekly Revenue', value: '$5M/week — Q4 peak season (14 weeks)' },
                    { dimension: 'financial', label: 'ALE Calculation', value: 'ARO 0.15 x SLE $20M = ALE $3M/year' },
                    { dimension: 'regulatory', label: 'Compliance', value: 'PCI DSS Level 1 — annual ROC due in 60 days' },
                    { dimension: 'reputational', label: 'Market Position', value: 'Series B startup — 340K active users, 2 competitors eyeing market' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational'],

                cascadeBaseline: {
                    technical: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'Critical RCE vulnerability in payment API allows unauthenticated access to transaction data. CVSS 9.8 with public proof-of-concept available. The API architecture lacks segmentation, meaning a single exploit compromises the entire payment pipeline.',
                        metric: 'CVSS 9.8 | Public PoC available | No API segmentation'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Direct costs range from $2M (compensating controls) to $10M (full downtime) to $20M+ (successful exploit). Investor confidence shaken regardless of path chosen. Series C fundraising timeline pushed back 6 months.',
                        metric: '$2M-$20M direct exposure | Series C delayed 6 months | Q4 revenue at risk'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'PCI DSS Level 1 ROC due in 60 days. A known unpatched critical vulnerability during assessment means automatic failure. QSA has already been notified of the engagement. Failure to remediate could trigger PCI Council notification to card brands.',
                        metric: 'PCI ROC due 60 days | QSA engaged | Card brand notification risk'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'medium',
                        description: 'NovaPay built its brand on security-first fintech. Competitors are watching. A breach would destroy the startup narrative. Even extended downtime during peak season drives customers to competitors who never come back.',
                        metric: '340K active users | 2 competitors poised | Brand built on security'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Week 0 — Risk Identified, ALE Calculated',
                        situation: 'Your penetration tester has confirmed CVE-2025-41823 is exploitable in your production environment. The CVSS score is 9.8 (Critical). A public proof-of-concept was posted to GitHub 48 hours ago. Your CTO has calculated three options: (A) full patch requiring 2-week downtime costing $10M in lost revenue, (B) compensating controls (WAF rules + API rate limiting + enhanced monitoring) costing $2M that reduce exploit probability from 15% to 5%, or (C) accept the risk and document it. Your PCI QSA engagement starts in 60 days.',
                        evidence: [
                            { text: 'CVE-2025-41823 confirmed exploitable in production', reliability: 'high' },
                            { text: 'Public PoC on GitHub — 48 hours old, 230 stars', reliability: 'high' },
                            { text: 'Threat intel: no active exploitation campaigns observed yet', reliability: 'medium' },
                            { text: 'CTO estimates 2-week patch window (optimistic)', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Deploy compensating controls immediately ($2M) while planning full patch for post-peak season',
                                score: 3,
                                optimal: true,
                                consequence: 'Textbook risk mitigation. Reduces ALE from $3M to $1M (ARO 0.05 x SLE $20M). WAF rules block known attack patterns. API rate limiting constrains automated exploitation. Enhanced monitoring provides early warning. Cost-justified: $2M spend to reduce $3M ALE. Full patch scheduled for January.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Compensating controls reduced attack surface. WAF blocked known PoC patterns. Monitoring detected 3 probe attempts.' },
                                    financial: { severityDelta: -1, mitigated: true, description: '$2M investment preserved $5M/week revenue stream. ALE reduced from $3M to $1M. Investors saw disciplined risk management.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Documented compensating controls with risk acceptance rationale. QSA accepted the approach with conditions for full remediation timeline.' }
                                }
                            },
                            {
                                text: 'Begin emergency patch immediately — take the $10M revenue hit to eliminate the risk entirely',
                                score: 2,
                                optimal: false,
                                consequence: 'Risk elimination is noble but the math does not support it. You are spending $10M (certain) to avoid a $3M ALE (expected). The board questions whether this was a business decision or a panic response. However, the vulnerability IS eliminated and your PCI assessment will pass cleanly.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'Vulnerability fully eliminated. Clean architecture deployed.' },
                                    financial: { severityDelta: 1, description: '$10M certain loss to avoid $3M expected loss. Investors questioned risk quantification skills.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Full remediation before QSA engagement. Clean PCI ROC.' }
                                }
                            },
                            {
                                text: 'Accept the risk — document it in the risk register and increase monitoring',
                                score: 0,
                                optimal: false,
                                consequence: 'Risk acceptance of a CVSS 9.8 with a public PoC is indefensible. The risk register entry does not transfer liability. Your PCI QSA will cite this as a critical finding. If exploited, the documented decision to accept becomes Exhibit A in litigation.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'No technical mitigation applied. Attack surface unchanged.' },
                                    regulatory: { severityDelta: 2, description: 'PCI QSA will flag unmitigated critical vulnerability. Risk acceptance of CVSS 9.8 inconsistent with PCI DSS Requirement 6.' },
                                    reputational: { severityDelta: 1, description: 'If breached, documented risk acceptance destroys "security-first" brand narrative.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 — Board Presentation and Budget Decision',
                        situation: 'The board wants a formal risk presentation. Your threat intelligence feed now shows the CVE is being actively scanned for in the wild — not targeted at you specifically, but automated scanners are probing for the vulnerable endpoint pattern. The CFO wants to understand the quantitative basis for your recommendation. Two board members with financial backgrounds are skeptical of the ALE methodology. Your largest enterprise client (12% of revenue) has sent a security questionnaire asking about your patch management timeline for this specific CVE.',
                        evidence: [
                            { text: 'Shodan shows 14,000 scans for vulnerable endpoint pattern in past week', reliability: 'high' },
                            { text: 'Enterprise client (12% revenue) requesting CVE remediation timeline', reliability: 'high' },
                            { text: 'CFO prepared alternative analysis showing higher ARO based on scan volume', reliability: 'medium' },
                            { text: 'Competitor announced "zero-downtime patching" capability in marketing', reliability: 'low' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Present quantitative risk analysis with updated ARO reflecting active scanning, recommend accelerated full patch',
                                score: 3,
                                optimal: true,
                                consequence: 'Revised ALE with higher ARO (now 25% given active scanning) changes the math: ALE = 0.25 x $20M = $5M. This makes the $10M patch cost closer to justified and the $2M compensating controls even more clearly the right interim step. The board appreciates the data-driven approach and approves the accelerated timeline.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Board approved expedited budget. Updated ARO justified the investment. Enterprise client retained.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Enterprise client satisfied with transparent remediation timeline. Competitor marketing dismissed as vaporware.' }
                                }
                            },
                            {
                                text: 'Downplay the scanning activity to avoid alarming the board — present original ALE numbers',
                                score: 0,
                                optimal: false,
                                consequence: 'Withholding material risk information from the board is a governance failure. When the board later learns scanning activity was 14,000 probes/week, trust in the CISO collapses. The enterprise client gets a non-answer and begins evaluating competitors.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Enterprise client began competitor evaluation due to evasive response. 12% revenue at risk.' },
                                    reputational: { severityDelta: 1, description: 'Board trust in security leadership damaged. Transparency failure worse than the vulnerability itself.' }
                                }
                            },
                            {
                                text: 'Focus the board presentation entirely on compliance deadlines rather than risk quantification',
                                score: 1,
                                optimal: false,
                                consequence: 'Compliance-driven arguments get budget approved but miss the point. The board sees security as a checkbox exercise rather than a business risk function. Future security investments will be harder to justify. The right answer was approved for the wrong reason.',
                                modifiers: {
                                    regulatory: { severityDelta: 0 },
                                    financial: { severityDelta: 0, description: 'Budget approved but security positioned as cost center rather than risk management function.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 2 — Controls Deployed or Risk Accepted',
                        situation: 'Two months have passed. Your WAF is detecting and blocking an average of 47 exploit attempts per day targeting CVE-2025-41823. The compensating controls are holding but the volume is increasing. A fintech competitor suffered a breach through the same CVE last week — it is now front-page news. Your PCI QSA assessment begins in 2 weeks. The CTO reports the full patch can be deployed during a 3-day maintenance window over the holiday weekend (reducing downtime from 14 days to 3 days using a blue-green deployment strategy developed over the past 6 weeks).',
                        evidence: [
                            { text: 'WAF blocking 47 exploit attempts/day (trending upward)', reliability: 'high' },
                            { text: 'Competitor breached via same CVE — front-page news', reliability: 'high' },
                            { text: 'CTO: blue-green deployment reduces downtime to 3 days', reliability: 'medium' },
                            { text: 'PCI QSA assessment begins in 14 days', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Execute the 3-day blue-green deployment over the holiday weekend — patch before PCI assessment',
                                score: 3,
                                optimal: true,
                                consequence: 'The engineering investment paid off. Blue-green deployment reduces revenue impact from $10M to $2.1M (3 days at ~$714K/day). Vulnerability eliminated before QSA arrives. The competitor breach gave you cover — customers understand maintenance windows. Clean PCI ROC achieved.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'Full patch deployed. Blue-green strategy preserved rollback capability. Zero data loss.' },
                                    financial: { severityDelta: -1, mitigated: true, description: '3-day downtime vs 14-day original estimate. Revenue impact reduced by 78%.' },
                                    regulatory: { severityDelta: -2, mitigated: true, description: 'Vulnerability remediated before QSA assessment. Clean PCI ROC.' }
                                }
                            },
                            {
                                text: 'Maintain compensating controls through PCI assessment — patch after the holiday rush ends',
                                score: 1,
                                optimal: false,
                                consequence: 'The QSA finds the unpatched CVE during assessment. Compensating controls are documented but the QSA requires a firm remediation date and issues a conditional pass. The competitor breach means your insurance carrier is now asking questions. Every additional day of exposure compounds the risk.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'QSA issued conditional ROC with remediation deadline. Card brands notified of condition.' },
                                    financial: { severityDelta: 0, description: 'Revenue preserved but insurance premiums increased 40% at next renewal.' }
                                }
                            },
                            {
                                text: 'Accelerate to full 14-day downtime patch immediately — the competitor breach changed everything',
                                score: 1,
                                optimal: false,
                                consequence: 'Panic-driven decision making. The 3-day blue-green option exists but was not considered. You take 14 days of downtime ($10M loss) when 3 days ($2.1M) was available. The board questions whether the security team communicates with engineering.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'Vulnerability eliminated but at unnecessary cost.' },
                                    financial: { severityDelta: 1, description: '$10M revenue loss when $2.1M option was available. Board questions cost management.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 8 — The Exploit Attempt',
                        situation: 'A sophisticated threat actor targets NovaPay with a modified exploit for CVE-2025-41823. The attack uses a novel bypass technique not covered by the original PoC. Your SOC detects the attempt at 2:47 AM. The outcome depends entirely on your earlier decisions: if you patched, the exploit fails against the new code. If you relied on compensating controls only, the novel bypass technique may evade your WAF rules. The threat actor is also targeting three other fintech companies simultaneously.',
                        evidence: [
                            { text: 'SOC alert: exploit attempt at 02:47 using modified CVE-2025-41823 payload', reliability: 'high' },
                            { text: 'Novel WAF bypass technique — not in original PoC', reliability: 'high' },
                            { text: 'Same threat actor hitting 3 other fintech targets simultaneously', reliability: 'medium' },
                            { text: 'FBI Cyber Division has been tracking this group for 6 months', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Activate incident response plan, isolate affected systems, coordinate with FBI Cyber Division',
                                score: 3,
                                optimal: true,
                                consequence: 'Textbook incident response. If you patched, the exploit failed and this is a detection success story. If you only had compensating controls, isolation limits blast radius while FBI coordination provides threat intelligence. Either way, your IR plan worked because you had one.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Incident response plan executed correctly. Isolation prevented lateral movement. FBI provided IOCs for additional hunting.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Documented IR response with law enforcement coordination. Regulators viewed response favorably.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Proactive FBI coordination positioned NovaPay as responsible actor. Industry peers shared praise.' }
                                }
                            },
                            {
                                text: 'Shut down all payment processing immediately until the threat is fully characterized',
                                score: 1,
                                optimal: false,
                                consequence: 'Nuclear option. If the exploit already failed (because you patched), you just took unnecessary downtime. If compensating controls held, same result. Total shutdown signals panic rather than preparedness. Customers see "payment processing unavailable" during business hours.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Unnecessary downtime cost $714K/day. Customers migrated transactions to competitors.' },
                                    reputational: { severityDelta: 1, description: 'Public-facing outage during business hours. Customers questioned platform reliability.' }
                                }
                            },
                            {
                                text: 'Monitor the attack passively to gather intelligence before taking defensive action',
                                score: 0,
                                optimal: false,
                                consequence: 'Passive monitoring of an active exploit against a payment system is negligent. If your compensating controls have a gap (and the novel bypass suggests they might), every minute of observation is a minute of potential data exfiltration. PCI DSS requires immediate containment of confirmed threats.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Delayed response allowed deeper reconnaissance. If controls had gaps, exfiltration window expanded.' },
                                    regulatory: { severityDelta: 1, description: 'Delayed containment of confirmed attack violates PCI DSS IR requirements.' },
                                    financial: { severityDelta: 1, description: 'If any data was exfiltrated during observation period, breach notification costs apply.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
