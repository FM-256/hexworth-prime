<body>
<h1 class="visually-hidden">The FedRAMP Gauntlet</h1>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 15 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w4-nist-800-53-lab',
            scenario: {
                title: 'The FedRAMP Gauntlet',
                subtitle: '47 control gaps. 90 days. A $50M DoD contract on the line.',
                briefing: 'Cloudbridge Federal, a cloud services company pursuing FedRAMP Moderate authorization, has received preliminary findings from their Third-Party Assessment Organization (3PAO). Of 325 required NIST 800-53 Rev 5 controls at the Moderate baseline, 47 have gaps ranging from missing documentation to fully unimplemented controls. The authorization deadline is 90 days away, tied to a $50M/year DoD contract that was awarded contingent on achieving FedRAMP Moderate ATO. The JAB (Joint Authorization Board) reviewers have a reputation for rigor — they reject 60% of initial submissions. Every gap that reaches the JAB review as a POA&M (Plan of Action and Milestones) weakens the package. Your 3PAO assessor privately told you: "More than 10 open POA&Ms and the JAB will send it back." You have a team of 12, a $3M remediation budget, and the CEO\'s job is on the line.',

                intelCards: [
                    { dimension: 'technical', label: '3PAO Findings', value: '47 of 325 controls have gaps — 8 critical, 19 high, 20 moderate' },
                    { dimension: 'financial', label: 'Contract Value', value: '$50M/year DoD contract contingent on FedRAMP Moderate ATO' },
                    { dimension: 'regulatory', label: 'Authorization Body', value: 'JAB review — 60% first-submission rejection rate' },
                    { dimension: 'political', label: 'Stakeholders', value: 'DoD program office, CEO, board, 3PAO, JAB reviewers' },
                    { dimension: 'financial', label: 'Remediation Budget', value: '$3M available, team of 12 engineers, 90-day sprint' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'political'],

                cascadeBaseline: {
                    technical: {
                        severity: 4,
                        timing: 'immediate',
                        description: '47 control gaps span 12 of 20 control families. Critical gaps include AC-2 (Account Management lacks automated deprovisioning), AU-6 (Audit Review has no automated correlation), IR-4 (Incident Handling has no automated response capability), and SC-7 (Boundary Protection lacks application-layer filtering). Many "moderate" gaps are documentation-only but still require evidence artifacts.',
                        metric: '47 gaps | 12 control families | 8 critical | 19 high | 20 moderate'
                    },
                    financial: {
                        severity: 5,
                        timing: 'short',
                        description: '$50M/year contract is the company\'s largest deal and represents 40% of projected revenue. Loss of the contract triggers a covenant default on the $20M credit facility. The company has 8 months of runway without the DoD revenue. Three competing cloud providers are FedRAMP authorized and waiting.',
                        metric: '$50M/year (40% revenue) | $20M credit facility covenant | 8 months runway without contract'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'medium',
                        description: 'FedRAMP JAB review is binary: authorize or deny. POA&Ms are accepted but too many signal systemic governance weakness. The 3PAO must attest to remediation evidence. A denial delays resubmission by 6-12 months. The DoD program office can grant a provisional waiver but has never done so for a new provider.',
                        metric: 'JAB binary decision | >10 POA&Ms = likely rejection | 6-12 month resubmission delay'
                    },
                    political: {
                        severity: 3,
                        timing: 'short',
                        description: 'The DoD program office championed Cloudbridge\'s selection over incumbent providers. Their credibility is tied to your success. The CEO promised the board FedRAMP authorization by Q3. Three board members have expressed concern about execution risk. The 3PAO has a professional reputation to protect — they will not sign off on inadequate evidence.',
                        metric: 'DoD sponsor credibility at stake | CEO promised board Q3 ATO | 3PAO reputation risk'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Day 0 — 3PAO Preliminary Findings: 47 Gaps',
                        situation: 'The 3PAO has delivered their preliminary findings. You have the full list of 47 gaps categorized by severity and control family. Your team has 90 days. The 8 critical gaps require engineering work (code changes, infrastructure modifications). The 19 high gaps are a mix of technical implementation and missing documentation. The 20 moderate gaps are mostly documentation, policy, and procedure gaps. Your 3PAO assessor says evidence must be in the repository 14 days before submission for their final review. That gives you 76 working days.',
                        evidence: [
                            { text: '8 critical gaps: AC-2, AU-6, CM-6, IA-5, IR-4, RA-5, SC-7, SI-4 (all require engineering)', reliability: 'high' },
                            { text: '19 high gaps: mix of implementation + documentation', reliability: 'high' },
                            { text: '20 moderate gaps: mostly documentation and procedure', reliability: 'high' },
                            { text: '3PAO evidence submission deadline: Day 76 (14-day review window)', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Triage by fix complexity: parallel-track critical (engineering) and moderate (documentation) simultaneously, attack high gaps in Week 3-6',
                                score: 3,
                                optimal: true,
                                consequence: 'Optimal resource allocation. Engineers start on the 8 critical gaps immediately (longest lead time). Technical writers and GRC analysts tackle the 20 documentation gaps in parallel (quickest wins). High gaps get attention in weeks 3-6 when some critical fixes are in testing. This maximizes throughput across the 76-day window.',
                                modifiers: {
                                    technical: { severityDelta: -1, description: 'Parallel tracking maximized engineering throughput. Critical gaps got full 76 days. Documentation gaps closed quickly, freeing GRC staff for high gaps.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Triage approach aligned with 3PAO expectations. Early documentation wins showed momentum.' }
                                }
                            },
                            {
                                text: 'Focus all 12 engineers on the 8 critical gaps first — those are the ones that will sink us',
                                score: 1,
                                optimal: false,
                                consequence: 'Putting all 12 engineers on 8 gaps creates contention — most critical controls cannot be parallelized across multiple engineers. Meanwhile, 20 easy documentation wins sit untouched for weeks. The 3PAO sees no progress on 39 of 47 gaps for the first month. Your DoD sponsor starts getting nervous calls.',
                                modifiers: {
                                    technical: { severityDelta: 0, description: 'Critical gaps received attention but engineering bottleneck limited parallel progress. Documentation backlog grew.' },
                                    political: { severityDelta: 1, description: 'DoD sponsor alarmed by lack of visible progress on majority of gaps. Weekly status reports showed 39 gaps unchanged.' }
                                }
                            },
                            {
                                text: 'Start with the 20 moderate documentation gaps to show quick progress and build momentum',
                                score: 1,
                                optimal: false,
                                consequence: 'Quick wins look good on a dashboard but the 8 critical gaps need the most engineering time. By the time you pivot to critical gaps in Week 4, you have lost 25% of your engineering runway. SC-7 (Boundary Protection) alone requires 6 weeks of implementation. You are now racing the clock on the hardest problems.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Critical gap remediation compressed into 52 days instead of 76. SC-7 implementation rushed with insufficient testing.' },
                                    regulatory: { severityDelta: 0, description: 'Dashboard showed progress but 3PAO focused on critical gaps, not documentation counts.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 — Triage and Remediation Plan',
                        situation: 'Two weeks in. Your team has closed 11 of 20 moderate gaps (documentation). Two critical gaps (AC-2 and IA-5) are in development with working prototypes. But SC-7 (Boundary Protection) is proving harder than expected — your cloud architecture requires a fundamental redesign of the network layer to implement application-layer filtering. The vendor for your WAF solution says deployment takes 4-6 weeks. The CEO has called an emergency board meeting to discuss "FedRAMP execution risk." Your 3PAO assessor flagged that your RA-5 (Vulnerability Scanning) gap requires not just a scanner but 90 days of scan history — meaning the clock started when you deployed the scanner, not when you close the gap.',
                        evidence: [
                            { text: '11 of 20 moderate gaps closed (documentation complete)', reliability: 'high' },
                            { text: 'AC-2 and IA-5 prototypes working in dev environment', reliability: 'high' },
                            { text: 'SC-7 requires WAF — vendor says 4-6 weeks to deploy', reliability: 'medium' },
                            { text: 'RA-5 requires 90 days scan history — mathematical impossibility if scanner not deployed by Day 0', reliability: 'high' }
                        ],
                        contradicts: true,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Deploy vulnerability scanner TODAY for RA-5 history, fast-track WAF for SC-7 with vendor support, convert RA-5 to POA&M with scan history as evidence of progress',
                                score: 3,
                                optimal: true,
                                consequence: 'Pragmatic decision. RA-5 cannot be fully remediated (need 90 days of history, only 76 remain) but deploying the scanner immediately and writing a POA&M with milestone dates shows the JAB you identified the constraint and have a plan. WAF fast-tracking with vendor professional services compresses SC-7 to 3 weeks. You are converting one impossible gap into a well-documented POA&M.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Scanner deployed Day 14. WAF deployment compressed to 3 weeks with vendor PS. RA-5 POA&M was strongest in the package.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'JAB appreciated honest RA-5 POA&M over fabricated compliance. Scanner history growing daily provided evidence of commitment.' },
                                    financial: { severityDelta: 0, description: 'Vendor professional services added $180K to budget but saved 3 weeks on SC-7 timeline.' }
                                }
                            },
                            {
                                text: 'Tell the CEO the RA-5 90-day requirement makes the deadline impossible — we need to renegotiate the timeline with DoD',
                                score: 1,
                                optimal: false,
                                consequence: 'One control gap does not make the entire timeline impossible — it makes ONE control a POA&M. The CEO calls the DoD program office in a panic, which triggers a formal review of the contract timeline. The DoD sponsor, who championed your company, is now defending the selection against procurement officers who want to rebid the contract.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'DoD sponsor blindsided by renegotiation request. Procurement office opened formal review. Competing providers lobbied for rebid.' },
                                    financial: { severityDelta: 1, description: 'Contract rebid risk materialized. Board demanded CEO explain why timeline was not validated earlier.' }
                                }
                            },
                            {
                                text: 'Backdate the vulnerability scanner deployment to Day 0 — configure it to show 90 days of history',
                                score: 0,
                                optimal: false,
                                consequence: 'Falsifying federal compliance evidence is a felony under 18 U.S.C. 1001 (false statements to federal agencies). The 3PAO will verify scanner deployment timestamps against cloud provider audit logs. If discovered (and it will be), the company faces debarment from all federal contracts, criminal referral, and immediate contract termination. This is not a risk management decision — it is a crime.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'Evidence fabrication in federal compliance process. Criminal exposure under 18 U.S.C. 1001. Debarment risk.' },
                                    financial: { severityDelta: 2, description: 'Discovery means loss of all federal business, not just this contract. Company-ending scenario.' },
                                    political: { severityDelta: 1, description: '3PAO would be obligated to report suspected fraud to FedRAMP PMO. DoD sponsor career-ending.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 8 — Re-assessment Checkpoint: 30 Closed, 17 Remaining',
                        situation: 'Your 3PAO has conducted a mid-sprint check. Results: 30 of 47 gaps closed with verified evidence. 17 remain. Of those 17: 3 are critical (SC-7 WAF deployment is in production but not fully tuned, SI-4 automated monitoring needs correlation rules, CM-6 configuration baselines need enforcement evidence), 6 are high (implementation complete but evidence insufficient), and 8 are moderate (documentation gaps your GRC team can close this week). The 3PAO says 5-7 of the remaining 17 can realistically be closed in the final 2 weeks. That leaves 10-12 as POA&Ms. Your 3PAO privately warns: "The JAB has been rejecting packages with more than 10 POA&Ms."',
                        evidence: [
                            { text: '30 of 47 gaps closed with verified evidence', reliability: 'high' },
                            { text: '17 remaining: 3 critical, 6 high, 8 moderate', reliability: 'high' },
                            { text: '3PAO estimates 5-7 more closable in 2 weeks', reliability: 'medium' },
                            { text: 'JAB informal threshold: >10 POA&Ms = likely rejection', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Close the 8 moderate gaps this week, sprint on the 6 high gaps with evidence remediation, write bulletproof POA&Ms for the 3 critical gaps',
                                score: 3,
                                optimal: true,
                                consequence: 'Mathematically optimized. 8 moderate closed this week = 38 total. If you close 4-5 of the 6 high gaps with better evidence = 42-43 total. 4-5 POA&Ms (3 critical + 1-2 high) is well under the JAB threshold. The 3 critical POA&Ms have clear timelines, partial implementation evidence, and milestone tracking. The package is clean.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: '42 of 47 gaps closed. 5 POA&Ms with strong remediation evidence. SC-7 WAF functional, tuning on documented timeline.' },
                                    regulatory: { severityDelta: -2, mitigated: true, description: '5 POA&Ms well under JAB threshold. Each POA&M had partial implementation evidence. Package was strongest 3PAO had submitted that quarter.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'DoD sponsor briefed on strong package. CEO board update turned positive. 3PAO confident in submission.' }
                                }
                            },
                            {
                                text: 'Throw all resources at the 3 critical gaps — if we can close those, the rest are just POA&Ms',
                                score: 1,
                                optimal: false,
                                consequence: 'Misreading the JAB calculus. Closing 3 critical gaps is ideal but ignoring 8 easy moderate gaps and 6 fixable high gaps means 14 POA&Ms — well over the threshold. The JAB does not weight POA&Ms by severity alone; volume signals systemic governance weakness. You could close 2 of 3 criticals and still get rejected on POA&M count.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: '14 POA&Ms in submission. JAB flagged systemic governance concerns. Package returned for remediation.' },
                                    political: { severityDelta: 1, description: 'DoD sponsor unable to defend package with 14 POA&Ms. Delay triggered contract timeline review.' }
                                }
                            },
                            {
                                text: 'Request a 30-day extension from the 3PAO and DoD to close everything properly',
                                score: 1,
                                optimal: false,
                                consequence: 'The 3PAO cannot unilaterally extend the JAB review slot — it was scheduled 6 months ago. The DoD contract has a hard deadline. Requesting an extension signals you cannot execute. The DoD program office has no mechanism for a 30-day extension; any delay is a minimum 6-month rescheduling of the JAB review slot.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Extension request revealed unfamiliarity with JAB scheduling. DoD sponsor questioned execution capability.' },
                                    financial: { severityDelta: 1, description: '6-month minimum delay. Contract milestone payments frozen. Competing providers began FedRAMP applications for the same workload.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 90 — Authorization Decision: JAB Review',
                        situation: 'The package is submitted. The JAB review panel has 3 members from DHS, DoD, and GSA. They have reviewed your System Security Plan, 3PAO assessment report, and POA&M documentation. The panel has 4 questions: (1) Why was RA-5 vulnerability scanning not in place before the assessment began? (2) What is the compensating control for SC-7 application-layer filtering until WAF tuning is complete? (3) How do you ensure CM-6 configuration baselines are enforced, not just documented? (4) What is your continuous monitoring strategy post-authorization? Your answers will determine the authorization outcome.',
                        evidence: [
                            { text: 'JAB panel: DHS, DoD, GSA representatives', reliability: 'high' },
                            { text: '4 questions focused on critical POA&Ms and continuous monitoring', reliability: 'high' },
                            { text: 'Your 3PAO provided a "recommend authorize with conditions" assessment', reliability: 'high' },
                            { text: 'Two competing providers received ATO in the past 90 days', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Answer each question with specific technical detail, dates, and evidence — demonstrate you understand the control intent, not just the requirement text',
                                score: 3,
                                optimal: true,
                                consequence: 'The JAB panel appreciates operational maturity. You explain RA-5 was a planning oversight with a documented root cause analysis and process change to prevent recurrence. SC-7 compensating control (network segmentation + IDS) is documented with WAF completion date. CM-6 uses automated enforcement via infrastructure-as-code with drift detection. ConMon strategy includes monthly vulnerability scans, quarterly assessments, and annual full re-authorization. The panel grants ATO with conditions.',
                                modifiers: {
                                    regulatory: { severityDelta: -2, mitigated: true, description: 'FedRAMP Moderate ATO granted with conditions. POA&M milestones accepted. Annual re-authorization scheduled.' },
                                    financial: { severityDelta: -2, mitigated: true, description: '$50M DoD contract activated. First milestone payment released. Company runway extended from 8 months to indefinite.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'DoD sponsor validated. CEO delivered board commitment. Company positioned for additional federal contracts.' }
                                }
                            },
                            {
                                text: 'Provide high-level strategic answers — the JAB wants to know you have a vision, not get lost in technical details',
                                score: 1,
                                optimal: false,
                                consequence: 'The JAB is technical. They ask follow-up questions your high-level answers cannot address. "What is your compensating control?" is not answered by "We are committed to defense in depth." The panel defers the decision pending a supplemental briefing — a polite way of saying your package needs work. The 30-day deferral triggers a contract milestone review.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'JAB deferred decision pending supplemental briefing. 30-day additional review period.' },
                                    political: { severityDelta: 1, description: 'DoD sponsor had to request contract milestone extension. Board briefing turned contentious.' },
                                    financial: { severityDelta: 0, description: '30-day deferral — milestone payment delayed but contract not yet at risk.' }
                                }
                            },
                            {
                                text: 'Defer technical questions to your 3PAO — they assessed the controls, they should defend them',
                                score: 0,
                                optimal: false,
                                consequence: 'The 3PAO assessed your controls; they do not defend your operational decisions. Deferring to your assessor signals you do not understand your own security posture. The JAB panel has seen this pattern before — it indicates the CSP outsourced compliance without internalizing security. Package denied. Resubmission in 6-12 months.',
                                modifiers: {
                                    regulatory: { severityDelta: 2, description: 'JAB denied authorization. Pattern of outsourced compliance without operational understanding. 6-12 month resubmission timeline.' },
                                    financial: { severityDelta: 2, description: 'Contract terminated for failure to achieve ATO. $50M revenue lost. Credit facility covenant triggered.' },
                                    political: { severityDelta: 2, description: 'DoD sponsor embarrassed. CEO termination demanded by board. Company reputation in federal market destroyed.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
