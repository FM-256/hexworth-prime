<body>
<h1 class="visually-hidden">The Rushed Launch</h1>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 03 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w1-security-by-design-lab',
            scenario: {
                title: 'The Rushed Launch',
                subtitle: 'A patient portal, a skipped threat model, and a researcher with a Twitter following.',
                briefing: 'VitalSync Health Technologies, a Series B health-tech startup with $28M in funding and 18 months of runway remaining, is seven days from launching its flagship patient portal. The portal allows 340,000 patients across 12 hospital partners to access medical records, schedule appointments, and message providers. The development team of 22 engineers shipped 47 features in 9 months but skipped threat modeling entirely -- the CTO called it "waterfall thinking." The only security assessment was a single penetration test performed two days ago by a contracted firm. That pentest found a critical IDOR (Insecure Direct Object Reference) vulnerability in the patient records API: any authenticated user can access any other patient\'s complete medical history by changing a patient ID parameter. Before the development team can patch it, a security researcher named @HealthSecWatch (84,000 followers) independently discovers the same vulnerability through the public beta and DMs the company. The researcher gives VitalSync 72 hours to respond before going public. The company burns $2M per month and the next funding round depends on the launch going as planned.',

                intelCards: [
                    { dimension: 'technical', label: 'Vulnerability', value: 'Critical IDOR in /api/v1/patients/{id}/records -- no authorization check' },
                    { dimension: 'technical', label: 'Architecture Debt', value: 'No SSDLC, no threat model, no SAST/DAST, single pentest 2 days pre-launch' },
                    { dimension: 'financial', label: 'Burn Rate', value: '$2M/month, 18 months runway, Series C contingent on launch metrics' },
                    { dimension: 'regulatory', label: 'HIPAA Exposure', value: '340K patient records, 12 hospital partners, covered entity by BAA' },
                    { dimension: 'reputational', label: 'Researcher', value: '@HealthSecWatch -- 84K followers, 72-hour disclosure deadline' },
                    { dimension: 'legislative', label: 'State Laws', value: 'Operating in 6 states with health data breach notification statutes' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'legislative'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'The IDOR vulnerability exposes every patient record in the system to any authenticated user. This is OWASP Top 10 A01:2021 (Broken Access Control) -- the most common and critical web application vulnerability class. The absence of any SSDLC means this is likely not the only vulnerability; it is the one that was found. No threat model means the attack surface is unmapped.',
                        metric: '340K patient records exposed | OWASP A01 | Zero threat modeling | Unknown additional vulns'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'HIPAA breach penalties range from $100 to $50,000 per violation (per record), with annual maximums of $1.5M per violation category. A 340K record breach could trigger penalties in the tens of millions. Series C funding is contingent on launch success -- any delay threatens the company\'s survival. The 12 hospital partners have SLAs with penalty clauses for delayed go-live.',
                        metric: '$2M/month burn | HIPAA fines up to $1.5M per category | Series C at risk | Hospital SLA penalties'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'HIPAA Security Rule (45 CFR 164.312) requires access controls that restrict ePHI access to authorized persons. An IDOR that exposes all patient records to any authenticated user is a textbook violation. HHS Office for Civil Rights (OCR) investigates all breaches affecting 500+ individuals. The 12 hospital partners are covered entities whose BAAs make VitalSync a business associate with direct HIPAA liability.',
                        metric: 'HIPAA Security Rule violation | OCR investigation threshold met | 12 BAAs at risk | 6-state notification required'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'A public disclosure by a researcher with 84K followers in the health security community will be amplified by mainstream tech press within hours. Health data breaches generate disproportionate media attention because of the sensitivity of the data. The 12 hospital partners will face questions from their patients and boards.',
                        metric: '84K follower researcher | 72-hour deadline | 12 hospital partners exposed | Health data = max sensitivity'
                    },
                    legislative: {
                        severity: 3,
                        timing: 'long',
                        description: 'Operating across 6 states means 6 different health data breach notification statutes with varying timelines and requirements. Several states (California, Washington, New York) have enhanced health data privacy laws beyond HIPAA. A high-profile health data breach could accelerate state-level health privacy legislation, similar to how the Anthem breach (2015) drove several state law changes.',
                        metric: '6 state notification laws | Enhanced CA/WA/NY statutes | Potential legislative catalyst'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Day -7 -- Vulnerability Discovered',
                        situation: 'It is 9 AM on a Monday. The pentest report arrived Friday night and the IDOR finding is rated Critical. The researcher\'s DM arrived at 7 AM this morning, giving you 72 hours. Your CTO says the IDOR fix is "a 4-hour patch" but your only security engineer (hired 3 months ago) says the authorization model is fundamentally broken -- every API endpoint lacks proper access controls, not just the patient records endpoint. Fixing one endpoint leaves dozens of others exposed. The launch event is scheduled for next Monday with press invitations already sent to 14 health-tech journalists. Your 12 hospital partners have already begun patient onboarding communications.',
                        evidence: [
                            { text: 'Pentest report: Critical IDOR in patient records API', reliability: 'high' },
                            { text: 'Security engineer: "Authorization is broken everywhere, not just this endpoint"', reliability: 'high' },
                            { text: 'Researcher @HealthSecWatch DM: 72-hour responsible disclosure deadline', reliability: 'high' },
                            { text: 'CTO estimate: "4-hour fix for the specific endpoint"', reliability: 'low' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Delay the launch 4-6 weeks. Implement a proper authorization framework across all API endpoints. Engage the researcher transparently.',
                                score: 3,
                                optimal: true,
                                consequence: 'The hardest but only correct answer. A 4-6 week delay costs $2-3M in burn and risks the hospital SLAs, but launching a patient portal with broken authorization across every endpoint is a HIPAA violation waiting to happen. The MedStar Health breach (2016) showed what happens when healthcare systems launch with unresolved vulnerabilities. Engaging the researcher buys goodwill and may delay public disclosure.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'Full authorization framework rebuild addressed root cause, not just the reported symptom.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Researcher engagement converted potential adversary into an acknowledged contributor.' },
                                    financial: { severityDelta: 1, description: 'Launch delay burned $2-3M and triggered hospital SLA penalty negotiations.' }
                                }
                            },
                            {
                                text: 'Patch only the reported IDOR endpoint. Launch on schedule. Plan a broader security sprint for v1.1.',
                                score: 1,
                                optimal: false,
                                consequence: 'You fixed the one vulnerability the researcher found while leaving dozens of identical flaws live. This is the healthcare equivalent of the Therac-25 approach -- fixing the reported bug without understanding the systemic design flaw. When the next IDOR is found post-launch (and it will be, because the authorization model is broken), it will be a live breach with real patient data, not a beta finding.',
                                modifiers: {
                                    technical: { severityDelta: 0, description: 'One endpoint patched but broken authorization model remained across all other endpoints.' },
                                    regulatory: { severityDelta: 1, description: 'Launching with known systemic authorization flaws constitutes willful HIPAA negligence.' }
                                }
                            },
                            {
                                text: 'Ignore the researcher. Patch the IDOR. Launch on schedule. If they go public, deny the beta had real patient data.',
                                score: 0,
                                optimal: false,
                                consequence: 'Ignoring a responsible disclosure researcher with 84K followers guarantees hostile public disclosure. Denying the beta had real data when hospital partners already began patient onboarding is a provably false statement. This is the Theranos playbook -- deny, deflect, and hope no one checks. The researcher will check, the journalists will verify, and your hospital partners will confirm patient data was live.',
                                modifiers: {
                                    reputational: { severityDelta: 2, description: 'Hostile disclosure + provably false denial created a two-cycle media firestorm.' },
                                    regulatory: { severityDelta: 1, description: 'False statements about patient data exposure triggered OCR investigation for willful neglect.' },
                                    legislative: { severityDelta: 1, description: 'Case cited in state legislative hearings as example of startup health-tech accountability gap.' }
                                }
                            },
                            {
                                text: 'Offer the researcher a $50K bug bounty to buy time. Patch the IDOR and launch two weeks late.',
                                score: 2,
                                optimal: false,
                                consequence: 'The bug bounty offer is reasonable but two weeks is not enough time to fix a systemic authorization model problem. The researcher may accept the bounty and delay disclosure, giving you breathing room. But launching with a partially fixed system means the next vulnerability discovery will be in production with live patient data. You are trading a 72-hour crisis for a 60-day time bomb.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Bug bounty offer showed good faith. Researcher delayed disclosure.' },
                                    technical: { severityDelta: 0, description: 'Two-week delay was insufficient to address systemic authorization flaws.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 0 -- Launch Decision',
                        situation: 'It is launch day (or what was supposed to be launch day). Regardless of your earlier decision, the board is demanding an update. Your lead investor (who put in $12M of the $28M Series B) is on a call with your CEO right now. The investor says: "If you do not launch this week, we will not participate in the Series C and we will exercise our board seats to replace the CEO." Meanwhile, your security engineer has discovered that the patient records database has no encryption at rest -- a separate HIPAA Security Rule violation (45 CFR 164.312(a)(2)(iv)). The engineer estimates 8 weeks to implement database encryption properly. The CTO wants to "just turn on TDE" (Transparent Data Encryption) overnight, which the security engineer says is "better than nothing but not a real fix."',
                        contradicts: true,
                        evidence: [
                            { text: 'Lead investor threatening CEO replacement if launch is delayed', reliability: 'high' },
                            { text: 'Database encryption at rest is absent -- HIPAA 164.312(a)(2)(iv)', reliability: 'high' },
                            { text: 'TDE can be enabled overnight as a stopgap', reliability: 'medium' },
                            { text: 'Security engineer says proper encryption needs 8 weeks', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 0,
                        decisions: [
                            {
                                text: 'Launch this week with TDE enabled and the IDOR patched. Accept the residual risk. Plan a full security sprint for Q2.',
                                score: 0,
                                optimal: false,
                                consequence: 'You are launching a patient portal with known systemic authorization flaws and a TDE band-aid on a database that needs proper encryption architecture. This is the exact scenario that created the Premera Blue Cross breach (2014) -- launching healthcare systems with known security debt and promising to fix it later. "Later" never comes because launch creates a moving target. OCR will view launching with documented, unresolved HIPAA violations as willful neglect -- the highest penalty tier ($50K per violation).',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Launching with documented HIPAA violations constituted willful neglect -- highest penalty tier.' },
                                    technical: { severityDelta: 1, description: 'Stopgap TDE + unresolved auth flaws created a false sense of security.' }
                                }
                            },
                            {
                                text: 'Present the board with a risk-quantified analysis: launch risk vs. delay risk. Recommend a 6-week delay with TDE as an interim measure and full auth rebuild.',
                                score: 3,
                                optimal: true,
                                consequence: 'The only way to counter investor pressure is with data. Quantify: HIPAA willful neglect fines ($50K per record, 340K records = theoretical maximum of $17B, practical exposure $5-50M). Compare to 6-week delay cost ($3M burn + SLA penalties). Risk-adjusted, the delay is cheaper by orders of magnitude. The Anthem CISO used this exact approach in 2016 to get board approval for a $260M security overhaul. TDE as an interim measure shows pragmatism.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Risk-quantified analysis convinced the board. Lead investor accepted delay after seeing HIPAA exposure numbers.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Documented risk analysis and delay decision demonstrated due diligence to OCR.' }
                                }
                            },
                            {
                                text: 'Resign. The board is forcing a launch that will violate HIPAA and endanger 340K patients. Document everything and notify OCR.',
                                score: 1,
                                optimal: false,
                                consequence: 'Principled but premature. You have not yet exhausted your options -- presenting risk-quantified data to the board, escalating to the general counsel, or engaging external legal advice. Resignation without attempting to change the outcome abandons the 340K patients you are trying to protect. However, if the board overrides a documented risk recommendation, resignation with OCR notification becomes the ethical obligation.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'Personal reputation preserved but patients lost their advocate.' },
                                    regulatory: { severityDelta: 0, description: 'OCR notification was appropriate but premature without exhausting internal options.' }
                                }
                            },
                            {
                                text: 'Launch a "limited availability" version -- only 2 of the 12 hospitals, with the authorization fix and TDE applied. Full rollout in 6 weeks after the security rebuild.',
                                score: 2,
                                optimal: false,
                                consequence: 'A reasonable compromise that reduces blast radius. Two hospitals means roughly 57K patients at reduced (not eliminated) risk. It gives the investor a launch milestone, gives you time for the full auth rebuild, and limits HIPAA exposure. The downside: 10 hospitals have already communicated launch dates to patients, and the partial rollout creates confusion. But this is the T-Mobile approach from 2021 -- phased rollback after discovering issues.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: 'Partial launch satisfied investor milestone but complicated hospital partner relationships.' },
                                    technical: { severityDelta: -1, mitigated: true, description: 'Reduced blast radius to 57K patients. Full rebuild timeline preserved.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 -- Researcher Goes Public',
                        situation: 'The 72-hour deadline has passed. @HealthSecWatch publishes a detailed thread on Twitter/X with screenshots of the IDOR vulnerability, noting that VitalSync\'s patient portal exposes complete medical records. The thread goes viral: 2.3M views in 24 hours. Ars Technica, WIRED, and KrebsOnSecurity all pick up the story. Three of your 12 hospital partners issue public statements distancing themselves from VitalSync. The other 9 are in emergency board meetings. A health-tech competitor tweets: "This is why we built our platform with security-by-design from day one." Your stock of 340K pre-registered patients begins receiving calls from journalists asking if their data was exposed.',
                        evidence: [
                            { text: 'Researcher thread: 2.3M views, screenshots of IDOR exploitation', reliability: 'high' },
                            { text: '3 hospital partners issued public distancing statements', reliability: 'high' },
                            { text: 'KrebsOnSecurity article links vulnerability to skipped threat modeling', reliability: 'high' },
                            { text: 'Competitor using the incident for marketing', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Issue a transparent public statement: acknowledge the vulnerability, detail your remediation timeline, and credit the researcher',
                                score: 3,
                                optimal: true,
                                consequence: 'Transparency after disclosure is the only viable strategy. Crediting the researcher follows responsible disclosure norms and earns goodwill from the security community. Detailing remediation shows competence. The Cloudflare model (2017, 2023) demonstrates that transparent, technically detailed incident responses actually build long-term trust. Your hospital partners need specific language they can use with their patients and boards.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Transparent response with researcher credit shifted narrative from "negligent startup" to "company that fixed it right."' },
                                    legislative: { severityDelta: -1, mitigated: true, description: 'Public transparency reduced legislative pressure. Cited as example of disclosure norms working.' }
                                }
                            },
                            {
                                text: 'Issue a statement minimizing the vulnerability: "No patient data was accessed" and threaten the researcher with CFAA action',
                                score: 0,
                                optimal: false,
                                consequence: 'Threatening a responsible disclosure researcher with CFAA (Computer Fraud and Abuse Act) action is the single fastest way to unite the entire security community, press, and legislature against your company. This is the exact playbook that destroyed Medical Informatics Engineering\'s reputation in 2015. The security community has a long memory and a very loud megaphone. KrebsOnSecurity will write a follow-up about the legal threat that gets 10x the views of the original disclosure.',
                                modifiers: {
                                    reputational: { severityDelta: 2, description: 'CFAA threat against researcher united the security community, press, and legislators against VitalSync.' },
                                    legislative: { severityDelta: 1, description: 'CFAA threat cited in Congressional hearings about researcher protection legislation.' }
                                }
                            },
                            {
                                text: 'Go silent. No public statement. Let the legal team handle everything through formal channels.',
                                score: 1,
                                optimal: false,
                                consequence: 'Silence in a viral moment is interpreted as guilt. Your hospital partners cannot respond to their patients without guidance from you. The narrative is now entirely controlled by the researcher, journalists, and your competitor. The Marriott breach (2018) showed that slow communication allows speculation to fill the void -- and speculation is always worse than reality.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Silence allowed competitors and journalists to control the narrative entirely.' },
                                    regulatory: { severityDelta: 0, description: 'Silence did not violate notification laws but signaled poor governance to regulators.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 2 -- FDA/HHS Inquiry',
                        situation: 'HHS Office for Civil Rights (OCR) has opened a formal compliance review. Because the patient portal integrates with clinical decision support tools, the FDA\'s Digital Health Center of Excellence has also sent an inquiry letter asking whether VitalSync\'s software qualifies as a medical device under the 21st Century Cures Act. If it does, the IDOR vulnerability may constitute a medical device safety issue -- not just a privacy breach. Four hospital partners have terminated their BAAs. Your remaining 8 partners are demanding a third-party security assessment (at your expense) before they will continue. The Series C is dead; your board is exploring a pivot or acqui-hire. Your security engineer has completed the authorization framework rebuild and TDE implementation.',
                        evidence: [
                            { text: 'OCR formal compliance review opened -- willful neglect under investigation', reliability: 'high' },
                            { text: 'FDA inquiry: potential medical device classification of clinical tools', reliability: 'high' },
                            { text: '4 of 12 hospital partners terminated BAAs', reliability: 'high' },
                            { text: 'Security rebuild complete -- auth framework + TDE + SAST/DAST pipeline', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Cooperate fully with both OCR and FDA. Provide complete documentation of the vulnerability, your remediation, and your new SSDLC. Offer the rebuilt system for independent verification.',
                                score: 3,
                                optimal: true,
                                consequence: 'Full cooperation with federal regulators is non-negotiable when they open formal reviews. Your completed security rebuild is your strongest asset -- it demonstrates that you identified the root cause (no SSDLC, no threat model) and addressed it systemically, not just symptomatically. The independent verification offer is critical: it tells regulators and hospital partners that you trust your own work enough to subject it to scrutiny. The FDA inquiry is actually an opportunity -- if your clinical tools are medical devices, the rebuilt security framework positions you for compliance.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'OCR noted full cooperation and systemic remediation. Penalty reduced to corrective action plan tier.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Independent verification convinced remaining 8 hospital partners to continue. Acqui-hire offers improved.' }
                                }
                            },
                            {
                                text: 'Argue that the vulnerability was in a beta system, no real patient data was breached, and the regulatory inquiry is premature',
                                score: 0,
                                optimal: false,
                                consequence: 'Hospital partners had already begun patient onboarding -- the "beta" had real patient data. This argument collapses under the first document request. OCR investigators are experienced with companies that reframe breaches as non-events. The VA Health breach (2006) and HealthCare.gov launch (2013) both showed that federal health regulators do not accept "it was still in beta" as a defense when real patient data was involved.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'OCR viewed the "beta" argument as misrepresentation. Investigation escalated to willful neglect tier.' },
                                    reputational: { severityDelta: 1, description: 'Hospital partners cited the "beta" defense as evidence of untrustworthiness.' }
                                }
                            },
                            {
                                text: 'Shut down the patient portal permanently, return remaining investor funds, and wind down the company',
                                score: 1,
                                optimal: false,
                                consequence: 'Surrendering may seem like the only option, but the 8 remaining hospital partners and their patients need the portal. Shutting down abandons patients mid-transition and creates its own disruption. A more responsible path is cooperating with regulators while exploring acqui-hire or restructuring. The regulatory obligations do not disappear when the company shuts down -- OCR can pursue enforcement against dissolved entities.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: 'Wind-down preserved some investor capital but destroyed all enterprise value.' },
                                    regulatory: { severityDelta: 0, description: 'Wind-down did not resolve OCR review. Enforcement continued against officers.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
