<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 12 // DominoEngine</span>

    <div id="domino-root"></div>
    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w3-roles-lab',
            scenario: {
                title: 'The CISO Dilemma',
                subtitle: 'A hospital CISO discovers that the CIO has been suppressing audit findings from the board for 2 years -- while ransomware groups target healthcare.',
                briefing: 'You are the CISO of MedVista Health System, a regional hospital network operating 8 hospitals and 45 outpatient clinics across three states. You report to the CIO, Dr. Marcus Webb, who reports to the CEO and presents quarterly to the board of directors. While preparing for an upcoming HIPAA risk assessment, you discovered that Dr. Webb has been systematically editing your quarterly security reports before presenting them to the board. Over the past 2 years, he has removed 23 critical findings including: unpatched medical device networks, expired SSL certificates on patient portal infrastructure, an EOL Active Directory forest, and failed penetration test results. The edited reports show a "green" security posture. The actual posture is "red." You have the original reports and the edited versions as evidence. Meanwhile, the FBI has issued a private industry notification (PIN) that the Hive ransomware group is actively targeting regional healthcare systems matching MedVista\'s profile. If ransomware hits and those suppressed findings are discovered, HIPAA fines could reach $1.5M per violation category. If you report to the board, you go over the CIO\'s head. If you stay silent, you become complicit.',

                intelCards: [
                    { dimension: 'technical', label: 'Suppressed Findings', value: '23 critical security findings hidden from board over 2 years' },
                    { dimension: 'financial', label: 'HIPAA Exposure', value: '$1.5M per violation category if breach occurs with known unpatched systems' },
                    { dimension: 'regulatory', label: 'HIPAA Risk', value: 'Knowing concealment of risks from governing body = willful neglect (highest penalty tier)' },
                    { dimension: 'political', label: 'Power Dynamic', value: 'CISO reports to CIO -- going to board means bypassing direct supervisor' },
                    { dimension: 'reputational', label: 'Ransomware Threat', value: 'FBI PIN: Hive ransomware actively targeting regional healthcare systems' },
                    { dimension: 'technical', label: 'Patient Safety', value: 'Unpatched medical devices on flat network -- potential patient safety risk if compromised' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'political', 'reputational'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'medium',
                        description: 'The suppressed findings represented genuine critical vulnerabilities. The unpatched medical device network had 340 devices running Windows XP Embedded with no segmentation from clinical systems. The EOL Active Directory forest used NTLM authentication vulnerable to pass-the-hash attacks. These were not theoretical risks -- they were the exact attack surface that ransomware groups exploit in healthcare.',
                        metric: '340 unpatched medical devices | EOL Active Directory | expired SSL certs | failed pen test findings'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'HIPAA penalty exposure for willful neglect (knowing about risks and concealing them from governance) carries the highest fine tier: $50,000-$1.5M per violation category, with no annual cap. With 23 suppressed findings across multiple HIPAA Security Rule categories, OCR could assess penalties exceeding $10M. If a ransomware attack occurs, breach response costs for an 8-hospital system typically exceed $20M.',
                        metric: '$10M+ HIPAA fine exposure | $20M+ breach response if ransomware hits | D&O liability for board'
                    },
                    regulatory: {
                        severity: 5,
                        timing: 'short',
                        description: 'HHS Office for Civil Rights (OCR) treats knowing concealment of security risks from governing bodies as willful neglect under HIPAA. The board has fiduciary duty to oversee risk. If OCR discovers the suppressed reports during an investigation, the penalty tier automatically escalates to the maximum. Additionally, Joint Commission accreditation requires accurate reporting of security posture to hospital leadership.',
                        metric: 'HIPAA willful neglect tier | Joint Commission accreditation risk | OCR escalation certainty'
                    },
                    political: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'The CIO has 15 years of tenure and strong relationships with 4 of 7 board members. The CISO has been in role for 3 years. Going to the board means navigating a power imbalance where the CIO can frame the CISO as insubordinate, alarmist, or politically motivated. The CEO hired the CIO and may perceive board escalation as a reflection on their own oversight.',
                        metric: 'CIO: 15 years tenure, 4/7 board allies | CISO: 3 years, no board relationships | CEO loyalty to CIO'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'long',
                        description: 'If a ransomware attack succeeds and the suppressed findings become public (through OCR investigation, litigation discovery, or media leaks), MedVista\'s reputation as a trusted healthcare provider is destroyed. Patient trust is the foundation of healthcare revenue. Community hospitals live or die on reputation. If the suppression never becomes public, reputational impact is contained.',
                        metric: 'Patient trust destruction if breach occurs | community hospital reputation dependency | media scrutiny in healthcare breaches'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Week 0 -- CISO Discovers Suppressed Findings',
                        situation: 'You have just compared your original quarterly reports with the versions the CIO presented to the board. The edits are systematic: every critical and high finding was either removed or downgraded to "medium" or "informational." The CIO\'s motivation is clear from email threads you\'ve found -- he has been protecting his IT budget from board-directed security spending that would compete with his digital transformation initiative. You have copies of the original reports, the edited versions, and the email threads. The FBI PIN about Hive ransomware targeting healthcare arrived yesterday. Your next quarterly report is due to the CIO in 2 weeks.',
                        evidence: [
                            { text: '23 critical findings systematically removed from 8 quarterly board reports over 2 years', reliability: 'high' },
                            { text: 'CIO email thread: "Remove the pen test results -- the board will panic and cut my DX budget"', reliability: 'high' },
                            { text: 'FBI PIN: Hive ransomware actively targeting regional healthcare with MedVista\'s profile', reliability: 'high' },
                            { text: 'Next quarterly report due to CIO in 2 weeks', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Secure all evidence (original reports, edited versions, email threads), consult with legal counsel confidentially, and prepare a board communication plan',
                                score: 3,
                                optimal: true,
                                consequence: 'This is the professional and legally sound first step. Securing evidence protects against tampering. Legal counsel can advise on whistleblower protections under Sarbanes-Oxley (if publicly traded) or state whistleblower statutes. A communication plan ensures the board receives the information in a structured way rather than as an emotional escalation.',
                                modifiers: {
                                    political: { severityDelta: -1, description: 'Legal counsel involvement professionalized the escalation. Evidence was properly preserved and chain of custody documented.' },
                                    regulatory: { severityDelta: -1, description: 'Documented evidence chain and legal counsel engagement demonstrated the CISO acted with due diligence.' }
                                }
                            },
                            {
                                text: 'Confront the CIO directly with the evidence and demand he present the unedited reports to the board',
                                score: 1,
                                optimal: false,
                                consequence: 'The CIO is a 15-year veteran with board relationships. Confronted privately, he has time to prepare a counter-narrative, destroy evidence, or preemptively frame you as a problem employee. He tells you the edits were "editorial judgment" and that you are "overstepping." He begins documenting performance concerns about you.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'CIO began building a termination case against the CISO. Performance improvement plan drafted. Evidence potentially compromised.' },
                                    regulatory: { severityDelta: 1, description: 'CIO had time to modify or destroy email evidence. Weakened the eventual case for board and regulators.' }
                                }
                            },
                            {
                                text: 'Stay quiet for now -- submit your honest report to the CIO in 2 weeks and see if he edits it again',
                                score: 0,
                                optimal: false,
                                consequence: 'Every day of silence with an active ransomware threat and known unpatched systems is a day you are complicit in the concealment. If Hive hits MedVista in the next 2 weeks, you knew about the vulnerabilities AND the suppressed reports and did nothing. OCR will treat you as a participant in the willful neglect, not a victim of it.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Two-week delay with known active threat. If a breach occurred during this period, CISO would share willful neglect liability.' },
                                    technical: { severityDelta: 1, description: 'No emergency patching or segmentation initiated. Medical devices remained exposed for 2 additional weeks.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 2 -- Decision to Report or Not',
                        situation: 'Legal counsel has confirmed that your state has whistleblower protection for healthcare employees who report compliance concerns to governing bodies. They advise that you have both a legal right and, under HIPAA, arguably a professional obligation to ensure the board receives accurate security information for risk oversight. The board chair has a monthly lunch with the CEO next week. Legal counsel says you could request a private meeting with the board chair, or you could submit a written report directly to the full board. The CIO has just sent you his "feedback" on your draft quarterly report -- he wants you to remove the FBI PIN reference and downgrade 4 findings.',
                        evidence: [
                            { text: 'Legal counsel confirms state whistleblower protection applies', reliability: 'high' },
                            { text: 'CIO requested removal of FBI PIN reference and downgrade of 4 findings from current report', reliability: 'high' },
                            { text: 'Board chair has monthly lunch with CEO next week', reliability: 'high' },
                            { text: 'Hive ransomware has hit 3 regional healthcare systems in the past 30 days', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Request a confidential meeting with the board chair -- present the evidence of suppressed findings and the current FBI threat intelligence',
                                score: 3,
                                optimal: true,
                                consequence: 'The board chair is the right entry point. A private meeting allows the chair to absorb the information, consult with other board members, and determine the appropriate board response -- all before the CIO can mount a defense. The chair is initially skeptical but the side-by-side comparison of original and edited reports is undeniable. The chair thanks you and calls an executive session.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Board chair managed the disclosure process. CISO was protected as the messenger. CIO could not preemptively frame the narrative.' },
                                    regulatory: { severityDelta: -1, description: 'Board received accurate risk information. Fiduciary duty restored. HIPAA governance requirement satisfied.' }
                                }
                            },
                            {
                                text: 'Send the unedited report directly to the full board with a cover memo explaining the 2-year suppression pattern',
                                score: 2,
                                optimal: false,
                                consequence: 'The information reaches the board, which is the right outcome. But the method creates chaos. 7 board members receive explosive information simultaneously with no context or guidance. Some panic. Some call the CIO. The CIO is blindsided and goes into full damage control mode, calling board allies and framing you as disgruntled. The board meeting becomes adversarial rather than fact-finding.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Unmanaged board disclosure created adversarial dynamics. CIO allies rallied. Board was split rather than unified.' },
                                    regulatory: { severityDelta: 0, description: 'Board received the information -- HIPAA governance obligation met. But the adversarial process delayed action.' }
                                }
                            },
                            {
                                text: 'Refuse the CIO\'s edits but do not escalate to the board -- submit the honest report through the normal CIO channel',
                                score: 1,
                                optimal: false,
                                consequence: 'The CIO simply does not forward your unedited report to the board. He submits his own version, as he has done 8 times before. You have changed nothing except alerting the CIO that you are aware of the edits. He now knows you are a threat and begins planning your removal. The board remains uninformed.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'CIO accelerated plans to terminate CISO. Board remained uninformed. Power dynamic worsened.' },
                                    technical: { severityDelta: 1, description: 'No emergency remediation authorized. Board did not learn about the FBI threat or the unpatched medical devices.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 1 -- Board Response and CIO Retaliation',
                        situation: 'The board has held an executive session. The evidence of suppressed findings is clear. The board has placed the CIO on administrative leave pending investigation. However, the CIO\'s allies on the board (2 of 7 members) are pushing back, arguing the CISO "went around the chain of command" and "created a crisis where there wasn\'t one." The CEO is conflicted -- he hired the CIO and feels personally responsible. The CIO, through his attorney, has sent a letter threatening wrongful termination action and claiming the report edits were within his authority as a senior executive. Meanwhile, the 23 critical findings are now visible to the full board for the first time. The board wants to know: what is the actual risk and what will it cost to fix?',
                        evidence: [
                            { text: 'CIO placed on administrative leave -- attorney threatening wrongful termination', reliability: 'high' },
                            { text: '2 of 7 board members sympathetic to CIO -- arguing CISO was insubordinate', reliability: 'high' },
                            { text: 'Board requesting full risk assessment and remediation cost estimate', reliability: 'high' },
                            { text: 'Hive ransomware hit a 6-hospital system in neighboring state last week -- 3 weeks of downtime', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Present a prioritized remediation plan to the board: emergency actions (30 days), critical fixes (90 days), and full remediation (12 months) -- with costs and risk reduction metrics for each phase',
                                score: 3,
                                optimal: true,
                                consequence: 'The board needs actionable information, not more politics. A phased plan with clear priorities shows leadership. Emergency actions (medical device segmentation, AD migration, SSL renewal) can begin immediately with board authorization. The neighboring hospital ransomware incident makes the urgency tangible. The board authorizes $4.2M in emergency spending.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Emergency medical device segmentation began within 48 hours of board authorization. Critical attack surface reduced by 60% in 30 days.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Board-authorized $4.2M emergency spend prevented estimated $20M+ ransomware response cost. Insurance carrier noted proactive remediation.' }
                                }
                            },
                            {
                                text: 'Focus on defending your decision to escalate -- present the legal analysis of HIPAA obligations and whistleblower protections to counter the CIO\'s allies',
                                score: 1,
                                optimal: false,
                                consequence: 'You are fighting the wrong battle. The board already took action -- the CIO is on leave. Two dissenting board members will not reverse that. What the board needs now is a path forward on the actual security risks. Spending board meeting time on political defense while 340 medical devices sit unpatched is a misallocation of the board\'s attention.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'Legal defense was sound but unnecessary. Board had already acted. Time spent on politics was time not spent on remediation.' },
                                    technical: { severityDelta: 1, description: 'Remediation delayed while CISO focused on political positioning. Medical devices remained unpatched for additional weeks.' }
                                }
                            },
                            {
                                text: 'Recommend hiring an external CISO consulting firm to conduct an independent assessment and present findings to the board',
                                score: 1,
                                optimal: false,
                                consequence: 'An independent assessment has merit for credibility, but it takes 4-6 weeks. You already know what the vulnerabilities are -- you wrote the original reports. Delaying remediation for an external validation that will tell the board what you already told them is an abdication of your role during a crisis. The Hive group is not waiting for your consultant\'s report.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Six-week delay for external assessment. During that window, no emergency remediation was authorized.' },
                                    financial: { severityDelta: 0, description: 'External assessment added $380K in consulting costs without changing the remediation requirements.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 4 -- Ransomware Hits',
                        situation: 'Despite emergency remediation efforts, Hive ransomware has penetrated MedVista through a phishing email to a clinical administrator. The malware spread through the partially-remediated network. The medical device network was segmented (your 30-day emergency action worked), so patient monitoring systems are unaffected. But the EOL Active Directory -- which was on the 90-day remediation plan -- was the lateral movement path. The ransomware encrypted 60% of administrative systems across 5 of 8 hospitals. ED systems are on backup procedures. The ransom demand is $4.5M in Bitcoin. OCR has been notified. Media is covering the story. The board wants to know: were the suppressed findings relevant to this attack?',
                        evidence: [
                            { text: 'Hive ransomware encrypted 60% of admin systems across 5 hospitals', reliability: 'high' },
                            { text: 'Medical device network was segmented -- patient monitoring unaffected', reliability: 'high' },
                            { text: 'EOL Active Directory (suppressed finding #7) was the lateral movement path', reliability: 'high' },
                            { text: 'FBI confirming Hive infrastructure and negotiation contact', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Activate the incident response plan, document that suppressed findings directly enabled the attack, and provide the board with a factual timeline showing which remediated controls held and which unremediated ones failed',
                                score: 3,
                                optimal: true,
                                consequence: 'The factual timeline is devastating and vindicating. The medical device segmentation (your 30-day emergency action) held -- patient safety was preserved. The EOL AD (90-day plan, not yet complete) was the attack path. The suppressed findings are directly causal. This documentation will be critical for OCR, the board\'s D&O insurance claim, and the inevitable litigation. The board now fully understands what the 2-year suppression cost.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Documented timeline showed OCR that the CISO identified and escalated the risks. HIPAA willful neglect liability shifted to the CIO. CISO\'s proactive remediation noted as mitigating factor.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Medical device segmentation prevented patient safety incident -- avoided the most catastrophic financial exposure. D&O insurance claim strengthened by documented CIO suppression.' }
                                }
                            },
                            {
                                text: 'Focus entirely on incident response and system recovery -- the blame question can wait until the crisis is over',
                                score: 2,
                                optimal: false,
                                consequence: 'Incident response is critical and should be the operational priority. But the board\'s question about suppressed findings is not about blame -- it is about understanding liability exposure, insurance claims, and regulatory posture. OCR will ask the same question within days. Having the answer ready is not political -- it is responsible governance.',
                                modifiers: {
                                    regulatory: { severityDelta: 0, description: 'OCR investigation began before the timeline was prepared. Initial response appeared less organized.' },
                                    political: { severityDelta: 0, description: 'Board question went unanswered during the critical early hours. Some members filled the vacuum with speculation.' }
                                }
                            },
                            {
                                text: 'Recommend paying the $4.5M ransom to restore operations quickly and minimize patient care disruption',
                                score: 0,
                                optimal: false,
                                consequence: 'The FBI strongly advises against paying ransoms -- it funds criminal operations and does not guarantee data recovery. OFAC sanctions may apply to Hive-affiliated wallets. Paying the ransom without exploring recovery options or consulting the FBI is premature and potentially illegal. Insurance carriers may deny claims if the ransom was paid without their involvement.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: '$4.5M ransom paid without insurance carrier coordination. Carrier disputed the claim. OFAC review initiated.' },
                                    regulatory: { severityDelta: 1, description: 'Ransom payment without FBI coordination noted by OCR. OFAC sanctions review added regulatory complexity.' },
                                    reputational: { severityDelta: 1, description: 'Media reported ransom payment. Public perception: hospital funded criminals rather than investing in security.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
