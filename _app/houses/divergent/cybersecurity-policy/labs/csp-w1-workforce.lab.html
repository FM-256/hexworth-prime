    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w1-workforce-lab',
            scenario: {
                title: 'The Talent Exodus',
                subtitle: 'When your SOC team leaves for FAANG and the adversary does not wait.',
                briefing: 'Sentinel Defense Systems, a mid-tier government defense contractor with $380M in annual revenue and 1,200 employees, holds contracts with DoD, DHS, and three intelligence community agencies. All work requires TS/SCI clearances. Over the past six months, 14 of 35 SOC analysts (40%) have resigned to accept positions at Google, Amazon, Microsoft, and CrowdStrike -- all offering 1.8-2.2x salary with full remote work and no clearance maintenance burden. The remaining 21 analysts are working mandatory 12-hour shifts to cover 24/7 operations. Alert fatigue is severe: the SOC processes 47,000 alerts per day with a 23% false positive rate, and the team is triaging only Tier 1 alerts. Tier 2 and Tier 3 investigations have a 14-day backlog. Three analysts have filed burnout-related HR complaints. Meanwhile, NSA Cybersecurity Advisory 2024-0847 has identified APT41 (Double Dragon -- a Chinese state-sponsored group) actively probing defense industrial base networks matching Sentinel\'s profile. The CISO must act before the next analyst resignation letter hits their desk.',

                intelCards: [
                    { dimension: 'technical', label: 'SOC Capacity', value: '21 of 35 analysts remain, 12-hr mandatory shifts, 14-day Tier 2/3 backlog' },
                    { dimension: 'technical', label: 'Threat Landscape', value: 'APT41 actively probing DIB networks, NSA advisory 2024-0847' },
                    { dimension: 'financial', label: 'Salary Gap', value: 'Sentinel avg $125K vs FAANG $225-275K for equivalent cleared analysts' },
                    { dimension: 'financial', label: 'Contract Revenue', value: '$380M annual, 60% from contracts requiring 24/7 SOC compliance' },
                    { dimension: 'political', label: 'Clearance Pipeline', value: 'TS/SCI takes 12-18 months to process, cleared talent pool shrinking 8% annually' },
                    { dimension: 'reputational', label: 'CMMC Status', value: 'CMMC Level 3 certification audit scheduled in 9 months' }
                ],

                activeDimensions: ['technical', 'financial', 'political', 'reputational'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'A 40% SOC reduction while a state-sponsored APT is actively probing the network is a critical security posture failure. The 14-day Tier 2/3 backlog means that any successful intrusion may not be detected for weeks. Alert fatigue at current volumes (47K/day with 21 analysts) means the team is functionally blind to sophisticated attacks that mimic normal traffic. APT41 is known for patience -- they will wait for exactly this kind of defensive gap.',
                        metric: '40% SOC reduction | 47K alerts/day | 14-day investigation backlog | APT41 active probing'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Defense contracts requiring 24/7 SOC operations represent $228M (60%) of annual revenue. If SOC staffing falls below contractual minimums, Sentinel faces contract default penalties, potential termination for convenience, and disqualification from future bids. Retention bonuses sufficient to match FAANG offers would cost $2.1M annually for the remaining 21 analysts -- a 0.55% revenue impact that pales against the $228M at risk.',
                        metric: '$228M in SOC-dependent contracts | $2.1M retention cost | $100K+ per new cleared hire (with 12-18mo delay)'
                    },
                    political: {
                        severity: 4,
                        timing: 'short',
                        description: 'The cleared workforce shortage is a national security issue, not just a Sentinel problem. DCSA reported 200,000+ clearance investigation backlog in 2023. When cleared analysts leave for commercial sector, those clearances lapse and the investment is lost. Congressional committees are scrutinizing DIB workforce readiness. A successful APT intrusion at a defense contractor with known staffing gaps would trigger DCSA investigation, potential CAGE code suspension, and Congressional attention.',
                        metric: '200K+ national clearance backlog | DCSA scrutiny | CAGE code risk | Congressional oversight'
                    },
                    reputational: {
                        severity: 3,
                        timing: 'medium',
                        description: 'In the defense contracting world, reputation is measured by past performance ratings and contract award history. A security incident caused by staffing gaps would damage CPARs (Contractor Performance Assessment Ratings), affecting future bid competitiveness for 3-5 years. The upcoming CMMC Level 3 audit in 9 months requires demonstrable 24/7 monitoring capability. Failing CMMC means losing eligibility for CUI-handling contracts.',
                        metric: 'CPARs at risk for 3-5 years | CMMC Level 3 audit in 9 months | CUI contract eligibility'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Month 0 -- Exodus Identified',
                        situation: 'HR has compiled the exit data: 14 analysts resigned in 6 months, all citing compensation and work-life balance. The average departing analyst had 4.2 years of experience and a TS/SCI clearance that took 14 months to obtain. Replacing each analyst costs an estimated $120K in recruiting, training, and clearance processing -- and new hires will not be operational for 12-18 months due to clearance timelines. Your DCSA FSO (Facility Security Officer) warns that if SOC staffing drops below 18 analysts, you will be in technical violation of your NIST 800-171 continuous monitoring requirements, which are contractual obligations on 7 of your 12 active contracts.',
                        evidence: [
                            { text: 'Exit interviews: 14 of 14 cited comp gap and mandatory overtime', reliability: 'high' },
                            { text: 'DCSA FSO: below 18 analysts = NIST 800-171 monitoring violation', reliability: 'high' },
                            { text: 'HR: 3 more analysts actively interviewing at FAANG (confirmed by reference checks received)', reliability: 'high' },
                            { text: 'Recruiting pipeline: 2 candidates in process, both 8-10 months from cleared and operational', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Implement immediate retention bonuses ($40K/year) for all 21 remaining analysts. Restructure shifts to eliminate mandatory overtime. Begin SOAR platform evaluation.',
                                score: 3,
                                optimal: true,
                                consequence: 'The right multi-pronged approach. $40K retention bonuses ($840K total) are a fraction of the $228M in SOC-dependent contracts at risk. Eliminating mandatory overtime addresses the burnout that exit interviews identified as the #2 factor after compensation. SOAR (Security Orchestration, Automation, and Response) platforms can automate 60-70% of Tier 1 alert triage, reducing the human workload immediately. This mirrors the Booz Allen Hamilton retention strategy from 2022 when they faced a similar cleared analyst exodus.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Retention bonuses stabilized the team. SOAR evaluation began reducing alert burden within 60 days.' },
                                    financial: { severityDelta: 0, description: '$840K retention cost is 0.37% of SOC-dependent contract revenue -- an exceptional ROI.' }
                                }
                            },
                            {
                                text: 'Contract with an MSSP (Managed Security Services Provider) to supplement SOC coverage immediately while recruiting replacements.',
                                score: 2,
                                optimal: false,
                                consequence: 'MSSPs can fill gaps fast, but defense contractor SOCs handling classified environments cannot simply outsource to any MSSP. The MSSP must hold equivalent facility clearances, their analysts need TS/SCI, and the data cannot leave your SCIF (Sensitive Compartmented Information Facility). The pool of MSSPs meeting these requirements is tiny -- Leidos, SAIC, Perspecta -- and their rates for cleared analysts are $280-350/hour. You are also adding a supply chain risk that your contracting officers will scrutinize.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'MSSP engagement raised supply chain concerns with DCSA. Additional vetting required.' },
                                    financial: { severityDelta: 1, description: 'Cleared MSSP rates ($280-350/hr) were 3x internal analyst costs. $4.2M annual spend for equivalent coverage.' }
                                }
                            },
                            {
                                text: 'Lower hiring standards -- accept Secret clearance holders and upgrade them to TS/SCI, reduce experience requirements from 3 years to 1 year.',
                                score: 1,
                                optimal: false,
                                consequence: 'Diluting your talent bar while APT41 is probing your network is dangerous. Secret-to-TS/SCI upgrades take 6-12 months. Junior analysts with 1 year of experience cannot perform Tier 2/3 investigations on state-sponsored threats. The 2015 OPM breach investigation revealed that personnel security shortcuts in the cleared workforce create systemic vulnerabilities. Your experienced analysts will see the hiring bar drop and interpret it as another reason to leave.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Junior analysts missed APT41 indicators that experienced analysts would have caught.' },
                                    reputational: { severityDelta: 0, description: 'Existing analysts viewed lowered standards as devaluation of their expertise. Two more resigned.' }
                                }
                            },
                            {
                                text: 'Present the situation to the DoD contracting officer and request a contract modification reducing the SOC staffing requirement temporarily.',
                                score: 1,
                                optimal: false,
                                consequence: 'Transparency with the contracting officer is appropriate, but requesting reduced security requirements during an active APT campaign is a non-starter. The CO will interpret this as a contractor who cannot meet their obligations. This goes on your CPARs. It may trigger a DCSA vulnerability assessment. The 2017 Reality Winner incident showed that DoD takes contractor security posture gaps as potential insider threat indicators, not just staffing problems.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'CO flagged the request in CPARs. Sentinel rated "marginal" on security posture for the evaluation period.' },
                                    political: { severityDelta: 1, description: 'DCSA initiated an unscheduled vulnerability assessment based on the CO notification.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 3 -- APT Probe Detected',
                        situation: 'At 3:22 AM on a Tuesday, a Tier 1 analyst working a solo overnight shift (your staffing does not support double coverage anymore) notices an anomalous DNS query pattern to a known APT41 C2 domain. The query originated from a workstation in the Classified Programs Division. The analyst escalates, but the Tier 2 queue is 11 days backed up. By the time a senior analyst reviews it 36 hours later, they discover the probe has been running for approximately 3 weeks -- hidden in the 14-day investigation backlog. The APT has not yet achieved persistence or exfiltrated data (the probe is in the reconnaissance phase), but they have mapped your internal network topology, identified key servers, and enumerated Active Directory. You have a narrow window before they move to exploitation.',
                        contradicts: true,
                        evidence: [
                            { text: 'APT41 C2 beacon confirmed via threat intel correlation', reliability: 'high' },
                            { text: 'Probe active for ~3 weeks, hidden in Tier 2 backlog', reliability: 'high' },
                            { text: 'No persistence mechanisms detected yet -- still in recon phase', reliability: 'medium' },
                            { text: 'AD enumeration detected -- attacker has network topology map', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Activate your incident response plan. Isolate the compromised workstation. Reset all AD credentials. Notify DCSA and CISA per DFARS 252.204-7012 (72-hour requirement). Pull all available analysts onto 24/7 IR coverage.',
                                score: 3,
                                optimal: true,
                                consequence: 'By the book and correct. DFARS 252.204-7012 requires reporting cyber incidents to DCSA within 72 hours. CISA can provide APT41-specific threat hunting support through their Hunt and Incident Response Team (HIRT). Isolating the workstation while the APT is still in recon (before persistence) gives you the best chance of a clean containment. Resetting all AD credentials neutralizes the enumeration advantage. Yes, the credential reset disrupts operations for 24-48 hours, but APT41 with your AD map is an existential threat.',
                                modifiers: {
                                    technical: { severityDelta: -2, mitigated: true, description: 'Early containment during recon phase prevented exploitation. CISA HIRT provided APT41-specific IOCs for deep sweep.' },
                                    political: { severityDelta: -1, mitigated: true, description: 'DFARS-compliant 72-hour notification demonstrated contractor responsibility. DCSA commended rapid response.' }
                                }
                            },
                            {
                                text: 'Monitor the APT probe silently to gather intelligence on their TTPs (tactics, techniques, and procedures) before taking action.',
                                score: 1,
                                optimal: false,
                                consequence: 'Tempting from a threat intelligence perspective, but catastrophically risky with a skeleton crew SOC. APT41 is a Tier 1 adversary -- they will detect your monitoring if your analysts make a single mistake, and they will accelerate to exploitation. You do not have the staffing depth for a sustained counterintelligence operation. The SolarWinds defenders (FireEye/Mandiant) who successfully monitored COZY BEAR had 200+ analysts. You have 21, working 12-hour shifts, with a 14-day backlog. This is a capability mismatch.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'APT41 detected the monitoring and accelerated. Exploitation began within 72 hours of the decision to watch.' },
                                    reputational: { severityDelta: 1, description: 'DCSA investigation revealed the decision to monitor rather than contain. Cited as reckless with classified systems.' }
                                }
                            },
                            {
                                text: 'Shut down the Classified Programs Division network segment entirely until a full threat hunt is completed.',
                                score: 2,
                                optimal: false,
                                consequence: 'Aggressive containment that stops the APT cold but has massive operational impact. The Classified Programs Division handles 4 active contracts worth $95M annually. A full shutdown of unknown duration triggers contract delivery delays, milestone payment deferrals, and potential termination for default on time-sensitive deliverables. A more surgical approach (isolate the compromised workstation + AD reset + CISA support) achieves containment without shutting down the entire division.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Full shutdown stopped the APT but was disproportionate to the recon-phase threat.' },
                                    financial: { severityDelta: 1, description: '$95M in contract deliverables delayed. Two contracts entered cure notice period.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 -- IG Audit of Security Posture',
                        situation: 'The DoD Inspector General has initiated a security posture audit of Sentinel Defense Systems, triggered by the APT incident report and the upcoming CMMC Level 3 certification timeline. The IG audit team has requested: (1) SOC staffing records for the past 12 months, (2) incident response timelines for all security events, (3) evidence of continuous monitoring per NIST 800-171, and (4) your CMMC readiness assessment. Your staffing records will show the 40% reduction. Your IR timelines will show the 14-day backlog that allowed the APT probe to run for 3 weeks. Your continuous monitoring evidence will show gaps during the understaffed period. The CMMC assessment will show 3 of 110 practices not fully implemented. The IG audit results will be shared with all contracting officers holding active Sentinel contracts.',
                        evidence: [
                            { text: 'DoD IG audit initiated -- full documentation request received', reliability: 'high' },
                            { text: 'Staffing records show 40% SOC reduction over 6-month period', reliability: 'high' },
                            { text: 'IR timeline shows 3-week APT detection delay due to backlog', reliability: 'high' },
                            { text: 'CMMC pre-assessment: 107 of 110 practices implemented', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Full transparency with the IG: provide all records, present your remediation actions (retention bonuses, SOAR deployment, CISA partnership), and demonstrate that the gaps have been closed.',
                                score: 3,
                                optimal: true,
                                consequence: 'The IG will find everything anyway -- they have subpoena power and access to DCSA records. Proactive transparency with a remediation narrative is the only strategy. Your story is: "We identified a workforce crisis, took immediate action (retention, automation, federal partnerships), contained an APT probe during the recon phase, and have closed the gaps." This is dramatically stronger than the IG discovering the gaps through their own investigation. The 2020 Raytheon IG audit showed that contractors who self-reported and demonstrated remediation received corrective action plans rather than contract terminations.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'IG report noted proactive remediation. CPARs reflected "satisfactory" with "contractor-identified improvement plan."' },
                                    political: { severityDelta: -1, mitigated: true, description: 'DCSA used Sentinel as a case study in effective workforce crisis management for the DIB sector.' }
                                }
                            },
                            {
                                text: 'Provide the minimum required documentation and challenge the IG\'s authority to audit staffing decisions as "proprietary business operations."',
                                score: 0,
                                optimal: false,
                                consequence: 'The IG has statutory authority to audit any aspect of contractor performance on federal contracts. Challenging their authority signals obstruction and guarantees an adversarial audit. The IG team will escalate, request broader access, and extend the audit timeline. Your contracting officers will be notified of the non-cooperation. The 2018 DCSA enforcement action against a contractor who challenged audit authority resulted in CAGE code suspension and $12M in contract terminations.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'IG escalated the audit to a full compliance investigation. CAGE code placed under review.' },
                                    reputational: { severityDelta: 1, description: 'Non-cooperation noted in IG report. All active contracting officers received the finding.' }
                                }
                            },
                            {
                                text: 'Request a 90-day delay to "prepare comprehensive documentation" and use the time to close the remaining 3 CMMC gaps before the audit.',
                                score: 1,
                                optimal: false,
                                consequence: 'A 90-day delay request after an APT incident will be interpreted as an attempt to clean up evidence. The IG audit timeline is not negotiable when triggered by a security incident. The 3 remaining CMMC gaps should be addressed regardless of the audit, but trying to game the timing undermines your credibility. The IG has seen this pattern hundreds of times from contractors trying to paper over deficiencies.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Delay request interpreted as obstruction. IG accelerated the audit timeline.' },
                                    reputational: { severityDelta: 0, description: 'Contracting officers noted the delay request but reserved judgment pending audit results.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
