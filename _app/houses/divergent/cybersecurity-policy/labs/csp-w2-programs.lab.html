<body>
<h1 class="visually-hidden">Budget Zero</h1>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 08 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w2-programs-lab',
            scenario: {
                title: 'Budget Zero',
                subtitle: 'The board slashes security by 60% after a "quiet year." Six months later, ransomware hits. Navigate budget constraints, risk acceptance, and post-incident accountability.',
                briefing: 'Pinnacle Manufacturing, a mid-size manufacturer with 3,200 employees and $800M in annual revenue, has had its cybersecurity budget cut from $500K to $200K by the board of directors following a "quiet year" with no reported security incidents. The CFO argued that the $500K spend was "insurance we are not using" and the board agreed by a 7-2 vote. The CISO (you) must now restructure the entire security program to operate at 40% of its previous budget. Critical decisions must be made about which controls to keep, which to cut, and how to document the risk being accepted by the board. Six months later, a ransomware attack exploits one of the gaps created by the cuts. The board demands to know why security failed. The tension between budget authority, risk acceptance documentation, and operational accountability is the core of this scenario.',

                intelCards: [
                    { dimension: 'technical', label: 'Previous Controls', value: 'EDR, SIEM, vulnerability scanning, annual pen test, security awareness training, IR retainer' },
                    { dimension: 'technical', label: 'New Budget', value: '$200K (down from $500K) -- 60% reduction effective immediately' },
                    { dimension: 'financial', label: 'Company Revenue', value: '$800M annual revenue, 12% profit margin' },
                    { dimension: 'regulatory', label: 'Compliance', value: 'SOC 2 Type II (customer requirement), cyber insurance policy with control requirements' },
                    { dimension: 'reputational', label: 'Customer Base', value: 'Defense contractor supply chain (DFARS/CMMC requirements apply)' },
                    { dimension: 'political', label: 'Board Dynamics', value: 'CFO-led cost reduction initiative, 7-2 vote to cut, CEO abstained' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational', 'political'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'medium',
                        description: 'The ransomware entered through a phishing email that would have been caught by the security awareness training program (cut in Q1). It exploited an unpatched vulnerability that would have been identified by the vulnerability scanning service (cut in Q1). The SIEM that would have detected lateral movement was downgraded to a free tier with 24-hour log retention (insufficient for detection). EDR was maintained but the attacker used living-off-the-land techniques that required SIEM correlation to detect.',
                        metric: 'Phishing entry (training cut) | Unpatched vuln (scanning cut) | SIEM blind (downgraded) | 72h dwell time'
                    },
                    financial: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Ransomware encrypted production systems including ERP, CAD/CAM, and the MES (Manufacturing Execution System). Manufacturing halted for 11 days. Revenue loss estimated at $24M. Ransom demand of $3.2M. IR costs of $2M (no retainer -- had to engage at breach rates). Cyber insurance claim disputed because controls required by the policy (vulnerability scanning, SIEM) had been cut. Total estimated cost: $35-45M -- 70-90x the $300K budget "savings."',
                        metric: '11-day production halt | $24M revenue loss | $3.2M ransom | $2M IR | Insurance disputed | $35-45M total'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'SOC 2 Type II audit will fail -- controls that were in scope (SIEM monitoring, vulnerability management, security training) were removed or degraded. Losing SOC 2 means losing defense contractor customers who require it. DFARS/CMMC requirements for defense supply chain participation are also at risk. The gap between the last SOC 2 audit (which passed) and current state constitutes a material misrepresentation to customers relying on that certification.',
                        metric: 'SOC 2 failure guaranteed | DFARS/CMMC at risk | Material misrepresentation to customers'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'short',
                        description: 'Defense contractor customers learn that a manufacturer in their supply chain was hit by ransomware and had voluntarily degraded its security controls. In a post-SolarWinds world, supply chain security is a board-level concern for defense primes. Customer audits are requested immediately. The 11-day production halt already disrupted delivery schedules.',
                        metric: 'Defense supply chain trust lost | Customer audit demands | 11-day delivery disruption'
                    },
                    political: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Internal politics explode. The two board members who voted against the cut are vindicated. The CFO who championed the reduction faces calls for resignation. The CISO\'s risk acceptance documentation (or lack thereof) becomes the central question. If the CISO documented the risks and the board accepted them, the board bears responsibility. If the CISO did not document the risks clearly, the CISO bears operational responsibility.',
                        metric: 'Board divided 7-2 (now 2-7) | CFO accountability | CISO documentation under scrutiny'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Q1 -- Budget Cut Announced, Program Restructure',
                        situation: 'The board has approved the 60% budget reduction effective immediately. Your current $500K annual spend covers: EDR platform ($85K), SIEM with 90-day retention ($110K), vulnerability scanning service ($45K), annual penetration test ($35K), security awareness training ($30K), incident response retainer ($40K), two part-time security analysts ($120K), and miscellaneous (patching tools, threat intel feeds, conferences: $35K). You now have $200K. What do you keep? How do you document what you are cutting? This decision will define everything that follows.',
                        evidence: [
                            { text: 'Board vote was 7-2 in favor of cut -- CEO abstained', reliability: 'high' },
                            { text: 'CFO cited "zero incidents in 18 months" as justification', reliability: 'high' },
                            { text: 'Cyber insurance policy requires EDR, SIEM monitoring, and vuln scanning', reliability: 'high' },
                            { text: 'Three defense customers require SOC 2 Type II certification', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Keep EDR and one analyst ($205K). Cut SIEM, scanning, pen test, training, and IR retainer. Write a formal risk acceptance memo to the board documenting every cut and its consequences.',
                                score: 3,
                                optimal: true,
                                consequence: 'The formal risk acceptance memo is the critical action here. It documents that the board was informed of the specific risks created by each cut, the potential consequences, and that the board accepted those risks by proceeding with the budget reduction. This memo becomes the single most important document in the post-incident accountability discussion. EDR is the highest-ROI control to retain. Losing everything else is painful but the documentation protects the organization\'s ability to learn from this.',
                                modifiers: {
                                    political: { severityDelta: -2, mitigated: true, description: 'Risk acceptance memo clearly established that the board, not the CISO, owned the risk decision.' },
                                    regulatory: { severityDelta: 0, description: 'Controls were still cut, but documented risk acceptance showed governance process existed.' }
                                }
                            },
                            {
                                text: 'Keep EDR ($85K) and downgraded SIEM ($40K free tier + $15K integration). Cut pen test, training, IR retainer, and one analyst. No formal risk documentation -- the board made the decision.',
                                score: 1,
                                optimal: false,
                                consequence: 'Keeping both EDR and some SIEM capability is technically better than EDR alone, but without formal risk documentation, the CISO becomes the scapegoat when things go wrong. The board will claim they approved a budget reduction, not specific control eliminations. Without documentation, the CISO has no evidence that the board understood what they were authorizing.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Without risk acceptance documentation, the CISO bore full blame for the post-incident failures.' },
                                    technical: { severityDelta: 0, description: 'Downgraded SIEM provided minimal detection capability but 24h retention was insufficient.' }
                                }
                            },
                            {
                                text: 'Refuse to implement the cuts -- tell the board you cannot operate a security program at $200K and threaten to resign',
                                score: 2,
                                optimal: false,
                                consequence: 'There is a legitimate argument that a CISO should resign rather than operate an indefensible program. However, resignation without documentation means the next CISO inherits the same impossible budget with no context. If you resign, write the risk acceptance memo first so it is on record. The board will hire someone willing to work with $200K, and that person may not document the risks.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'Resignation was principled but left the organization worse off -- the replacement did not document risks.' },
                                    technical: { severityDelta: 1, description: 'Successor CISO made different (worse) cuts without the institutional knowledge.' }
                                }
                            },
                            {
                                text: 'Spread the $200K thinly across all existing services at reduced capacity -- keep everything at a lower tier',
                                score: 0,
                                optimal: false,
                                consequence: 'This is the worst approach. A SIEM with 24h retention catches nothing. A pen test with half the scope misses the critical vulnerabilities. Security awareness training once a year instead of monthly loses all behavioral change. You end up with the illusion of security -- enough to pass a checkbox audit but none of the actual detection or prevention capability. Every control is present on paper and useless in practice.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Every control was degraded to the point of uselessness -- checkbox security with no real capability.' },
                                    regulatory: { severityDelta: 1, description: 'Degraded controls that looked compliant on paper but failed in practice worsened regulatory findings.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q2 -- First Controls Decommissioned, Risk Acceptance Signed',
                        situation: 'The budget restructure is complete. Vulnerability scanning, the annual pen test, security awareness training, and the IR retainer have all been cut. The risk acceptance memo (if written) has been presented to the board. Two board members who voted against the cut formally dissented and requested their objections be recorded in board minutes. The cyber insurance renewal is coming up -- the carrier will audit current controls. Meanwhile, a new zero-day vulnerability (CVE-2025-XXXX) affecting your ERP system is published. Without vulnerability scanning, your team did not detect it. Without the IR retainer, you have no pre-negotiated rates for emergency response.',
                        evidence: [
                            { text: 'Vulnerability scanning service terminated -- no active scanning in place', reliability: 'high' },
                            { text: 'New critical ERP zero-day published (CVE-2025-XXXX)', reliability: 'high' },
                            { text: 'Cyber insurance renewal audit in 45 days -- carrier requires vuln scanning', reliability: 'high' },
                            { text: 'Two board members formally recorded dissent in minutes', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Manually patch the ERP zero-day immediately, write an addendum to the risk memo covering the insurance gap, and notify the carrier proactively about the changed controls',
                                score: 3,
                                optimal: true,
                                consequence: 'Manual patching addresses the immediate threat. The insurance carrier notification is critical -- if you fail to disclose that required controls have been removed, any future claim will be denied for material misrepresentation, not just the policy exclusion. Proactive notification gives the carrier the option to adjust terms or premiums rather than discovering the gap during a claim.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Proactive carrier notification preserved some insurance coverage with adjusted terms and higher premium.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Documented insurance gap and board notification strengthened the governance trail.' }
                                }
                            },
                            {
                                text: 'Patch the ERP system but do not notify the insurance carrier -- let the renewal audit play out naturally',
                                score: 1,
                                optimal: false,
                                consequence: 'Failing to proactively disclose material changes to your security posture to your insurance carrier is a serious mistake. If a claim is filed later, the carrier will investigate, discover the controls were removed months before renewal, and argue that the policy was obtained through misrepresentation. This could void the entire policy, not just the specific claim.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Insurance claim denied -- carrier cited failure to disclose material control changes.' },
                                    regulatory: { severityDelta: 0 }
                                }
                            },
                            {
                                text: 'Use the ERP zero-day as evidence to request an emergency budget increase from the board',
                                score: 2,
                                optimal: false,
                                consequence: 'Using the zero-day to argue for budget restoration is logical but unlikely to succeed immediately. The board just cut the budget 90 days ago -- reversing course this quickly would require the CFO to admit they were wrong. The emergency request should be made, but it should not delay patching the zero-day or addressing the insurance gap. If you wait for budget approval before acting, the vulnerability window stays open.',
                                modifiers: {
                                    political: { severityDelta: 0, description: 'Budget increase request was tabled -- CFO argued one zero-day does not justify reversing the cut.' },
                                    technical: { severityDelta: 1, description: 'Waiting for budget approval delayed patching, extending the vulnerability window.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q3 -- Ransomware Hits, Skeleton Crew Response',
                        situation: 'Six months after the budget cut, a ransomware attack hits Pinnacle Manufacturing. The attack vector: a phishing email that bypassed the remaining email gateway (the security awareness training that would have taught employees to recognize it was cut). The ransomware exploited an unpatched vulnerability in a secondary system (the scanning service that would have found it was cut). The SIEM (if retained at free tier) had 24 hours of logs -- insufficient to trace the full attack chain. Your single remaining analyst is overwhelmed. You have no IR retainer -- emergency engagement rates are 3x the retainer rate. Manufacturing is down. ERP is encrypted. The ransom demand is $3.2M.',
                        evidence: [
                            { text: 'Phishing email opened by finance clerk -- no security training in 6 months', reliability: 'high' },
                            { text: 'Unpatched secondary system used for lateral movement', reliability: 'high' },
                            { text: 'Manufacturing halted -- ERP, CAD/CAM, MES all encrypted', reliability: 'high' },
                            { text: 'No IR retainer -- emergency engagement quoted at $750/hr/consultant', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Engage IR firm at emergency rates, activate business continuity plan for manual manufacturing operations, notify the board immediately with reference to the risk acceptance memo',
                                score: 3,
                                optimal: true,
                                consequence: 'The emergency IR engagement is expensive ($750/hr vs $350/hr retainer rate) but necessary. Manual manufacturing operations limit revenue loss. Most critically, referencing the risk acceptance memo immediately reframes the conversation: this is not "security failed" -- this is "the documented risk the board accepted has materialized." The memo transforms the post-incident narrative from blame to accountability.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Risk acceptance memo shifted accountability to the board decision, not operational failure.' },
                                    financial: { severityDelta: 0, description: 'Emergency IR rates cost 2x more but response was faster than self-led recovery.' }
                                }
                            },
                            {
                                text: 'Try to handle the incident internally with the one remaining analyst to avoid the emergency IR costs',
                                score: 0,
                                optimal: false,
                                consequence: 'A single analyst cannot manage a full-scale ransomware incident affecting production systems. Containment, forensics, negotiation, system rebuild, and business continuity require a team. Attempting internal response extends the outage, increases data loss, and risks evidence destruction. The $750/hr IR cost seems high until you compare it to $24M in lost production.',
                                modifiers: {
                                    technical: { severityDelta: 2, description: 'Under-resourced internal response extended outage from 11 days to 23 days.' },
                                    financial: { severityDelta: 2, description: 'Extended outage doubled the revenue loss -- "saving" on IR cost 50x more in production losses.' }
                                }
                            },
                            {
                                text: 'Pay the $3.2M ransom immediately to get manufacturing back online -- every day of downtime costs $2.2M in revenue',
                                score: 1,
                                optimal: false,
                                consequence: 'The revenue pressure is real, but paying without IR support means no forensics (the attacker may still be in the network), no negotiation (the demand is their opening position), and no assurance the decryption keys will work. Paying the ransom and then getting re-encrypted because you did not eradicate the attacker is the worst possible financial outcome.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Ransom paid without eradication -- attacker re-encrypted systems 2 weeks later.' },
                                    technical: { severityDelta: 1, description: 'No forensics meant the attacker maintained persistence and struck again.' }
                                }
                            },
                            {
                                text: 'Blame the board for the budget cut and refuse to manage the incident until funding is restored',
                                score: 0,
                                optimal: false,
                                consequence: 'Refusing to manage an active incident is a dereliction of duty regardless of the budget situation. The CISO\'s responsibility is to respond to the crisis with available resources while escalating the resource gap through proper channels. Refusing to act during a crisis is grounds for immediate termination and potentially personal liability.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'CISO fired for insubordination during crisis -- lost all credibility including the risk documentation argument.' },
                                    reputational: { severityDelta: 1, description: 'Internal chaos during incident response leaked to customers and media.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Q4 -- Board Inquiry, Regulatory Review, Program Rebuild',
                        situation: 'Manufacturing has resumed after 11 days of downtime. Total cost of the incident is estimated at $35-45M (revenue loss, ransom/IR costs, customer penalties, remediation). The board has formed a special committee to investigate. The cyber insurance claim has been filed but the carrier is disputing coverage, citing the removed controls. SOC 2 audit is due in 60 days and will fail. Three defense customers have issued "cure notices" requiring security remediation within 90 days or contract termination. The CISO has been asked to present to the special committee.',
                        evidence: [
                            { text: 'Total incident cost: $35-45M (vs $300K annual budget "savings")', reliability: 'high' },
                            { text: 'Insurance claim disputed -- carrier cites removed controls', reliability: 'high' },
                            { text: 'SOC 2 audit will fail -- 3 defense customers issued cure notices', reliability: 'high' },
                            { text: 'Board special committee convened -- CISO presentation scheduled', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Present the full timeline to the special committee: budget cut decision, risk acceptance memo, specific controls removed, attack chain showing which cuts enabled the breach, and a costed rebuilding plan at $750K (above original budget)',
                                score: 3,
                                optimal: true,
                                consequence: 'The data-driven presentation connects every dollar cut to a specific control removed to a specific failure in the attack chain. $30K in training cuts enabled the phishing entry. $45K in scanning cuts left the vulnerability unpatched. $40K in IR retainer cuts tripled the response cost. The $300K "savings" generated $35-45M in losses -- a 100-150x negative ROI. The risk acceptance memo proves the board was warned. This presentation becomes the most powerful argument for security investment the company has ever seen.',
                                modifiers: {
                                    political: { severityDelta: -1, mitigated: true, description: 'Data-driven presentation established clear cause-and-effect, enabling constructive reform rather than blame.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Board approved $750K security budget -- 50% above original, with CISO reporting directly to the board.' }
                                }
                            },
                            {
                                text: 'Resign before the presentation -- the situation is unrecoverable and the board will use you as a scapegoat regardless',
                                score: 0,
                                optimal: false,
                                consequence: 'Resigning before presenting the evidence means the risk acceptance memo may never be formally entered into the board record. The board narrative becomes "the CISO failed and fled" rather than "the board cut the budget and the documented risk materialized." Every piece of evidence you gathered, every warning you issued, becomes orphaned without someone to present it in context.',
                                modifiers: {
                                    political: { severityDelta: 2, description: 'CISO resignation was spun as admission of failure -- board avoided accountability entirely.' },
                                    regulatory: { severityDelta: 1, description: 'Without CISO testimony, regulators lacked context for the budget cut and focused entirely on control failures.' }
                                }
                            },
                            {
                                text: 'Present a rebuilding plan but avoid directly blaming the board for the budget cut -- focus on the future, not the past',
                                score: 1,
                                optimal: false,
                                consequence: 'While forward-looking leadership is generally admirable, this is the one moment where the causal chain must be stated clearly. If the CISO does not connect the budget cut to the breach, the lesson is lost. The board members who voted for the cut will conclude that security failures happen regardless of budget, and the next cut will come even faster. Without accountability, there is no learning.',
                                modifiers: {
                                    political: { severityDelta: 1, description: 'Without clear accountability, the board did not internalize the budget-security causal chain.' },
                                    financial: { severityDelta: 0, description: 'Rebuilding plan approved but at original $500K -- board saw no reason to increase beyond prior level.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>
