    <title>The PCI Breach | CIS2208</title>
    <link rel="stylesheet" href="../../../../components/DominoEngine.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%); font-family: 'Courier New', Courier, monospace; color: #ede0f0; line-height: 1.6; padding: 20px; }
        .de-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,255,0.1); }
        .de-top-label { font-size: 0.65rem; color: #5a4460; letter-spacing: 0.15em; text-transform: uppercase; }
        .de-back-btn { text-decoration: none; color: #ff00ff; font-size: 0.75rem; padding: 6px 14px; border: 1px solid rgba(255,0,255,0.2); border-radius: 6px; transition: all 0.2s; }
        .de-back-btn:hover { background: rgba(255,0,255,0.08); border-color: #ff00ff; }
    </style>
</head>
<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 11 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>
    <div id="domino-root"></div>
    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w3-compliance-lab',
            scenario: {
                title: 'The PCI Breach',
                subtitle: '5 million card numbers stolen from a restaurant chain that passed its PCI DSS Level 1 audit 6 months ago.',
                briefing: 'GrillNation Holdings operates 1,200 restaurants across 38 states, processing 50 million credit card transactions per year. Six months ago, they completed a PCI DSS Level 1 assessment with a full Report on Compliance (ROC) from their Qualified Security Assessor (QSA), CyberTrust Assessments. The ROC confirmed full compliance across all 12 PCI DSS requirements. Today, Visa\'s fraud detection team has notified GrillNation that a common point of purchase (CPP) analysis links 5 million compromised card numbers to their point-of-sale systems. A PCI Forensic Investigator (PFI) has been engaged. Initial findings suggest the POS environment was not properly segmented from the corporate network -- a control the QSA certified as compliant. The card brands are demanding answers. The QSA\'s reputation is on the line. GrillNation faces potential fines of $5-25 per compromised card ($25M-$125M), plus the cost of card reissuance, forensic investigation, and brand damage. You are the interim CISO brought in to manage the crisis.',

                intelCards: [
                    { dimension: 'technical', label: 'Attack Vector', value: 'POS malware via unsegmented corporate-to-POS network path' },
                    { dimension: 'financial', label: 'Card Exposure', value: '5M card numbers -- potential fines $25M-$125M ($5-25/card)' },
                    { dimension: 'regulatory', label: 'PCI Status', value: 'Level 1 ROC issued 6 months ago -- now under forensic review' },
                    { dimension: 'reputational', label: 'Restaurant Count', value: '1,200 locations in 38 states -- 50M transactions/year' },
                    { dimension: 'technical', label: 'Segmentation Failure', value: 'Corporate-to-POS flat network -- QSA certified this as compliant' },
                    { dimension: 'financial', label: 'Card Reissuance', value: 'Issuing banks estimating $15M in card replacement costs -- will seek recovery' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'POS malware (RAM scraper variant) had been active for 4 months before detection. The malware entered through a compromised vendor VPN that connected to the flat corporate network, which had direct Layer 2 adjacency to the POS VLAN. The QSA had documented the network as "segmented" based on a network diagram that was outdated by 18 months -- the actual network had been flattened during a cost-cutting infrastructure consolidation that was never reported to the QSA.',
                        metric: '4-month dwell time | 1,200 POS terminals compromised | RAM scraper on flat network'
                    },
                    financial: {
                        severity: 5,
                        timing: 'medium',
                        description: 'Card brand fines totaled $67M ($13.40/card average). Issuing bank card reissuance recovery claims added $15M. PFI investigation cost $2.8M. Emergency network segmentation across 1,200 locations: $8.4M. Legal fees for QSA liability action: $3.2M. Total direct cost: $96.4M. Stock dropped 28% on disclosure. Two franchisee groups filed suit.',
                        metric: '$67M card brand fines | $15M reissuance | $8.4M remediation | $96.4M total'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'The PCI Council opened a review of CyberTrust Assessments\' QSA certification. Visa and Mastercard placed GrillNation in their highest-risk merchant monitoring program. State attorneys general in 12 states opened investigations under breach notification and consumer protection statutes. The FTC initiated an inquiry into whether GrillNation\'s public statements about security (including referencing the PCI compliance) constituted deceptive trade practices.',
                        metric: 'QSA certification review | 12 state AG investigations | FTC deceptive practices inquiry'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'National media coverage focused on the irony of a "fully compliant" company suffering a massive breach. The story became a case study in the debate about whether PCI DSS compliance equals security. Consumer trust in the brand dropped measurably. Franchise owners reported 15% same-store sales decline in the month following disclosure. "Compliance is not security" became the headline of every industry conference for the next 12 months.',
                        metric: '15% same-store sales decline | national media cycle | "compliance != security" narrative'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Day 0 -- Card Brand Fraud Alerts',
                        situation: 'Visa\'s fraud team has called your payment processing contact with a CPP alert linking 5 million compromised cards to GrillNation POS terminals. They are giving you 24 hours to engage a PCI Forensic Investigator (PFI) from their approved list. Your IT team is insisting the breach is impossible because "we passed PCI." The CEO wants to issue a statement that the company is PCI compliant and this must be a mistake. Your payment processor is threatening to increase your transaction fees to the highest risk tier effective immediately.',
                        evidence: [
                            { text: 'Visa CPP analysis links 5M cards to GrillNation terminals with high confidence', reliability: 'high' },
                            { text: 'IT team claims PCI compliance makes a POS breach impossible', reliability: 'low' },
                            { text: 'Payment processor threatening immediate risk tier escalation', reliability: 'high' },
                            { text: 'CEO wants to publicly cite PCI compliance certificate', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Engage a PFI immediately, advise the CEO against citing the PCI certificate, and begin preserving forensic evidence across all POS systems',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct on all counts. The PFI engagement satisfies Visa\'s 24-hour requirement. Advising against citing PCI compliance avoids a statement that will age terribly once the segmentation failure is revealed. Evidence preservation protects your legal position. The IT team is upset but the adults are in the room now.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'Timely PFI engagement and evidence preservation demonstrated compliance with card brand incident response requirements.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Avoiding the "we are PCI compliant" public statement prevented the worst optics when the truth emerged.' }
                                }
                            },
                            {
                                text: 'Contact the QSA (CyberTrust) first to validate the PCI compliance status before engaging a PFI',
                                score: 1,
                                optimal: false,
                                consequence: 'The QSA has a conflict of interest -- they certified the compliance that may have been wrong. Contacting them first wastes 12 hours while they review their own work defensively. You miss the PFI engagement window. Visa escalates. The QSA\'s lawyers tell them to stop communicating with you directly.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Delayed PFI engagement violated card brand incident response timelines. Visa placed GrillNation in immediate non-compliance status.' },
                                    technical: { severityDelta: 1, description: 'Evidence preservation delayed by 12 hours. Some POS systems were rebooted by IT staff during the gap, potentially destroying volatile evidence.' }
                                }
                            },
                            {
                                text: 'Let the CEO issue the PCI compliance statement while you quietly investigate internally',
                                score: 0,
                                optimal: false,
                                consequence: 'The CEO publicly states the company is PCI compliant and the fraud alert must be an error. When the PFI report later reveals the segmentation failure that the QSA missed, the CEO\'s statement becomes evidence of either incompetence or deception. The FTC opens a deceptive practices inquiry. Class action attorneys cite the statement in their complaints.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'CEO\'s "we are compliant" statement became the lead paragraph in every breach story. Devastating when contradicted by PFI findings.' },
                                    regulatory: { severityDelta: 1, description: 'Public compliance claim while breach was active contributed to FTC deceptive practices inquiry.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 1 -- Forensic Investigation',
                        situation: 'The PFI has completed the initial assessment. Findings are damning: the corporate network and POS network share the same VLAN -- there is no segmentation. The network diagram the QSA used for the ROC was 18 months out of date. IT consolidated the networks during a cost-cutting initiative 14 months ago and never updated the documentation or informed the QSA. The POS malware has been active for 4 months. The PFI estimates 5.2 million unique card numbers were exfiltrated. Your legal team is asking whether to pursue the QSA for the failed assessment or keep that option quiet to maintain the relationship.',
                        evidence: [
                            { text: 'PFI confirms flat network -- zero segmentation between corporate and POS', reliability: 'high' },
                            { text: 'Network consolidation 14 months ago removed segmentation -- never reported to QSA', reliability: 'high' },
                            { text: 'QSA used 18-month-old network diagram for ROC assessment', reliability: 'high' },
                            { text: 'POS malware active for 4 months -- 5.2M cards confirmed', reliability: 'high' }
                        ],
                        contradicts: true,
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Preserve all QSA communications, notify the PCI Council of the assessment discrepancy, and retain separate counsel for the QSA liability question',
                                score: 3,
                                optimal: true,
                                consequence: 'This protects all legal options. Notifying the PCI Council about the QSA discrepancy is the right move -- the Council needs to know if a QSA is certifying based on outdated documentation. Separate counsel ensures the QSA liability analysis does not conflict with the breach response. The PCI Council begins its own QSA review.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, description: 'PCI Council QSA review demonstrated GrillNation was also a victim of assessment failure. Card brands adjusted fine calculations.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'QSA liability action eventually recovered $14M of the $67M in card brand fines.' }
                                }
                            },
                            {
                                text: 'Focus entirely on remediation -- begin emergency network segmentation across all 1,200 locations immediately',
                                score: 2,
                                optimal: false,
                                consequence: 'Remediation is critical but ignoring the QSA accountability question means leaving money on the table. The QSA assessed a network that was not segmented and certified it as compliant -- that is a professional failure with financial consequences. Emergency segmentation begins, which is good, but you have no legal position on QSA recovery.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Emergency segmentation began immediately. POS network isolated within 72 hours.' },
                                    financial: { severityDelta: 1, description: 'No QSA liability action filed within the statute window. $14M recovery opportunity lost.' }
                                }
                            },
                            {
                                text: 'Blame the IT team for the undocumented network consolidation and fire the IT director publicly',
                                score: 0,
                                optimal: false,
                                consequence: 'Scapegoating the IT director ignores the systemic governance failure. The QSA had a duty to validate the network diagram, not just accept it. The IT director hires an employment attorney. The IT team\'s morale collapses during the most critical remediation period. Key engineers with POS system knowledge resign.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'IT staff attrition during remediation caused emergency segmentation to take 3x longer.' },
                                    reputational: { severityDelta: 1, description: 'Former IT director gave interviews about cost-cutting culture that prioritized savings over security.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 1 -- PCI Council Response and QSA Review',
                        situation: 'The PCI Council has opened a formal review of CyberTrust Assessments\' QSA status. Visa and Mastercard have jointly notified GrillNation of preliminary fines: $67M based on $13.40/card. Issuing banks are demanding $15M in card reissuance costs. 12 state attorneys general have opened investigations. Your new network segmentation is 60% deployed across locations. The QSA (CyberTrust) has retained counsel and is publicly stating that GrillNation failed to disclose the network consolidation and that the QSA relied on representations from GrillNation\'s IT team.',
                        evidence: [
                            { text: 'Card brand fines: $67M preliminary ($13.40/card x 5M)', reliability: 'high' },
                            { text: 'QSA publicly blaming GrillNation for non-disclosure of network changes', reliability: 'high' },
                            { text: 'PCI Council QSA review underway -- outcome in 90 days', reliability: 'high' },
                            { text: '12 state AG investigations opened under breach notification statutes', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Negotiate card brand fines by presenting the QSA assessment failure evidence, cooperate fully with state AGs, and complete the network segmentation on an accelerated timeline',
                                score: 3,
                                optimal: true,
                                consequence: 'The card brands acknowledge the QSA assessment failure as a mitigating factor and reduce the preliminary fine by 15%. Full AG cooperation across all 12 states leads to a consolidated investigation that is more efficient. Accelerated segmentation demonstrates commitment. The multi-front response shows maturity.',
                                modifiers: {
                                    financial: { severityDelta: -1, mitigated: true, description: 'Card brand fines reduced 15% based on QSA assessment failure evidence. AG cooperation avoided punitive state-level penalties.' },
                                    regulatory: { severityDelta: -1, description: 'Consolidated AG response and full cooperation resulted in consent decree rather than litigation. PCI Council noted GrillNation\'s remediation pace.' }
                                }
                            },
                            {
                                text: 'Fight the card brand fines -- $67M is disproportionate and the QSA should bear the majority of liability',
                                score: 1,
                                optimal: false,
                                consequence: 'The card brand fine structure is contractual, not negotiable through litigation. GrillNation signed the merchant agreement. QSA liability is a separate civil matter. Fighting the fines delays resolution, keeps the company in the highest risk tier, and prevents the payment processor from reducing transaction fees. The board is now questioning your strategy.',
                                modifiers: {
                                    financial: { severityDelta: 1, description: 'Fighting card brand fines extended highest-risk tier classification for 9 additional months. Transaction fee premium cost $4.2M.' },
                                    regulatory: { severityDelta: 1, description: 'Adversarial posture with card brands delayed return to compliant merchant status.' }
                                }
                            },
                            {
                                text: 'Pivot to a completely new QSA firm and rush a new PCI assessment to prove current compliance',
                                score: 1,
                                optimal: false,
                                consequence: 'A new ROC while remediation is still in progress is premature and may produce another failed assessment. The PCI Council advises against assessment during active remediation. If the new QSA finds additional issues, it makes the situation worse. Card brands want to see completed remediation, not a rushed re-assessment.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Premature re-assessment attempt flagged by PCI Council as contrary to guidance. New QSA found 3 additional issues mid-remediation.' },
                                    reputational: { severityDelta: 0 }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 6 -- Re-Certification and Brand Rebuild',
                        situation: 'Network segmentation is complete across all 1,200 locations. The PCI Council has downgraded CyberTrust Assessments\' QSA certification to probationary status. Your new QSA (a Big 4 firm) has completed a fresh Level 1 ROC -- you are compliant. Card brand fines have been finalized at $57M after the QSA mitigation factor. The state AG consolidated investigation is in settlement discussions. Franchise owners are demanding a brand recovery plan. Same-store sales are still down 12%. The question now: how do you rebuild?',
                        evidence: [
                            { text: 'New Level 1 ROC issued -- full compliance confirmed by Big 4 QSA', reliability: 'high' },
                            { text: 'Card brand fines finalized at $57M (reduced from $67M)', reliability: 'high' },
                            { text: 'CyberTrust QSA certification downgraded to probationary', reliability: 'high' },
                            { text: 'Same-store sales still down 12% -- franchise owners organizing', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 1,
                        decisions: [
                            {
                                text: 'Launch a transparent security program -- publish the remediation summary, commit to continuous compliance monitoring (not just annual assessment), and fund a franchise owner security communication program',
                                score: 3,
                                optimal: true,
                                consequence: 'Transparency after crisis builds trust faster than silence. Publishing the remediation summary (without exposing vulnerabilities) demonstrates accountability. Continuous monitoring signals that "compliance is not security" lesson was learned. Franchise owners become security ambassadors rather than critics. Same-store sales begin recovering.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Transparent security program rebuilt consumer trust. Same-store sales recovered to -4% within 3 months. Industry cited GrillNation as a positive post-breach model.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Franchise owner confidence restored. No franchise defections. Brand recovery accelerated by transparency.' }
                                }
                            },
                            {
                                text: 'Keep a low profile -- the breach news cycle has passed. Focus on operations and let time heal the brand',
                                score: 1,
                                optimal: false,
                                consequence: 'Time does heal, but slowly and incompletely without active effort. Franchise owners feel abandoned. The "compliance is not security" narrative about GrillNation continues at industry conferences without counterpoint. Competitors position themselves as the secure alternative. Recovery takes 18 months instead of 6.',
                                modifiers: {
                                    reputational: { severityDelta: 0, description: 'No active brand recovery. Negative narrative persisted unchallenged for 18 months.' },
                                    financial: { severityDelta: 0, description: 'Slow recovery. 3 franchise groups exited. Same-store sales took 18 months to return to baseline.' }
                                }
                            },
                            {
                                text: 'Sue CyberTrust Assessments publicly for the failed ROC and use the lawsuit to redirect blame',
                                score: 1,
                                optimal: false,
                                consequence: 'The QSA liability action has merit and was already filed by separate counsel. Making it a public campaign is different -- it looks like blame-shifting. The PCI Council notes that GrillNation\'s own IT team failed to report the network consolidation. The public lawsuit generates a new media cycle that reminds consumers of the breach. Counterproductive.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Public lawsuit campaign reignited breach media coverage. Consumers reminded of the incident. "Both sides at fault" narrative hurt GrillNation more than CyberTrust.' },
                                    financial: { severityDelta: 0, description: 'QSA liability action proceeds regardless of publicity. No financial benefit from making it a PR campaign.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>

    <hex-ai-button mission-id="csp-w3-compliance" house="divergent"></hex-ai-button>

</body>
</html>
