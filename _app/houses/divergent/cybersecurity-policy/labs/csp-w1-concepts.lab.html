        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0810 0%, #0a060d 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #ede0f0; line-height: 1.6; padding: 20px;

            display: flex; justify-content: space-between; align-items: center;

<body>
    <div class="de-top-bar">
        <span class="de-top-label">CIS2208 // Lab 02 // DominoEngine</span>
        <a href="../index.html" class="de-back-btn">Back to Course</a>
    </div>

    <div id="domino-root"></div>

    <script src="../../../../components/DominoEngine.js"></script>
    <script>
        DominoEngine.init({
            containerId: 'domino-root',
            moduleId: 'csp-w1-concepts-lab',
            scenario: {
                title: 'The Zero Trust Breach',
                subtitle: 'A flat network, shared passwords, no MFA. Then one phishing email changed everything.',
                briefing: 'Meridian Financial Services, a mid-size firm managing $4.2 billion in assets for 180,000 clients, operates a completely flat network with no segmentation. All 340 employees share a single domain admin password rotated quarterly. MFA was "on the roadmap" but never implemented. At 2:47 AM, an attacker who phished a junior accounts receivable clerk four hours earlier has escalated to domain admin and is moving laterally across every subnet. The SOC consists of two analysts who only work business hours. By the time anyone notices, the attacker has touched the core banking middleware, the client PII database, and the disaster recovery backups. The CIA triad is violated across all three pillars: confidentiality (client SSNs and account numbers exfiltrated), integrity (transaction logs tampered with to cover tracks), and availability (backup encryption keys changed). You are the newly hired CISO, three weeks into the job.',

                intelCards: [
                    { dimension: 'technical', label: 'Network Architecture', value: 'Flat Layer 2 network, no VLANs, no segmentation, single AD domain' },
                    { dimension: 'technical', label: 'Authentication', value: 'Shared domain admin password, no MFA, NTLM hashes cached everywhere' },
                    { dimension: 'financial', label: 'AUM Exposure', value: '$4.2B in client assets, 180K client accounts at risk' },
                    { dimension: 'financial', label: 'Estimated Incident Cost', value: 'Similar breaches: $150-$350 per record (Ponemon 2024)' },
                    { dimension: 'regulatory', label: 'GLBA Status', value: 'Safeguards Rule requires written infosec program (16 CFR 314)' },
                    { dimension: 'reputational', label: 'Market Position', value: 'Regional firm competing against national banks on trust and personal service' }
                ],

                activeDimensions: ['technical', 'financial', 'regulatory', 'reputational'],

                cascadeBaseline: {
                    technical: {
                        severity: 5,
                        timing: 'immediate',
                        description: 'Total network compromise. Flat architecture allowed unrestricted lateral movement from a single phished endpoint to domain admin in under 4 hours. No segmentation meant every system was reachable. Shared admin credentials meant one hash dump gave access to everything. The attacker modified DR backups, threatening recovery capability.',
                        metric: '340 endpoints exposed | 4-hour escalation | DR backups compromised | All 3 CIA pillars violated'
                    },
                    financial: {
                        severity: 4,
                        timing: 'medium',
                        description: 'Breach notification costs for 180K clients, forensic investigation ($2-5M), legal fees, regulatory fines, credit monitoring services, and potential class action settlements. Client attrition in financial services averages 5-7% post-breach. Zero trust architecture rebuild estimated at $3-8M over 18 months.',
                        metric: '$27-63M estimated total cost | 5-7% client attrition | $3-8M architecture rebuild'
                    },
                    regulatory: {
                        severity: 4,
                        timing: 'short',
                        description: 'GLBA Safeguards Rule (16 CFR 314) requires financial institutions to develop, implement, and maintain a comprehensive information security program. The flat network with shared passwords demonstrates a fundamental failure to meet safeguard requirements. State financial regulators and the FTC will investigate. SEC may investigate if public filings misrepresented security posture.',
                        metric: 'GLBA Safeguards Rule violation | FTC investigation | State AG actions | Potential SEC inquiry'
                    },
                    reputational: {
                        severity: 4,
                        timing: 'immediate',
                        description: 'A financial services firm that cannot protect client SSNs and account numbers faces existential reputational damage. Unlike Equifax, clients can easily move their accounts to competitors. Regional firms depend on trust as their primary differentiator against national banks.',
                        metric: '180K clients can leave immediately | Trust is the core value proposition | Competitors will recruit'
                    }
                },

                timesteps: [
                    {
                        timeLabel: 'Hour 0 -- Discovery',
                        situation: 'A security alert from your EDR tool (one of the few modern tools in place) fires at 6:15 AM when the first SOC analyst arrives. The alert shows NTLM relay activity across 47 hosts overnight. Quick triage reveals: the attacker has domain admin, has accessed the client PII database (180K records with SSNs), has tampered with transaction audit logs, and has changed encryption keys on your DR backup system. Your flat network means you cannot isolate the attacker without taking the entire network offline -- which would halt all trading and client operations.',
                        evidence: [
                            { text: 'EDR alerts: NTLM relay on 47 hosts between 2:47-6:00 AM', reliability: 'high' },
                            { text: 'Client PII database accessed at 3:22 AM (SQL audit log)', reliability: 'high' },
                            { text: 'DR backup encryption keys changed at 4:58 AM', reliability: 'high' },
                            { text: 'No evidence of data exfiltration yet (but no DLP in place to confirm)', reliability: 'low' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Take the entire network offline immediately -- stop all operations until containment is verified',
                                score: 3,
                                optimal: true,
                                consequence: 'Painful but correct. With a flat network, partial isolation is impossible. Every minute the attacker has access, more data is at risk. The business loses a day of operations ($180K revenue), but you stop the bleeding. This is what the 2023 MGM Resorts team wished they had done faster.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Full shutdown contained the breach. No additional exfiltration after 6:20 AM.' },
                                    financial: { severityDelta: 0, description: 'One day of lost operations ($180K) is significant but contained the total cost.' }
                                }
                            },
                            {
                                text: 'Reset the domain admin password and force all users to re-authenticate while keeping operations running',
                                score: 1,
                                optimal: false,
                                consequence: 'Password reset without understanding persistence mechanisms is security theater. The attacker likely has Golden Ticket (Kerberos TGT) access, backdoor accounts, or scheduled tasks. You announce to the attacker that you know they are there, and they accelerate exfiltration. This happened at SolarWinds -- the attackers had multiple persistence mechanisms beyond the initial vector.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Attacker detected the reset and activated secondary persistence. Exfiltration accelerated.' },
                                    reputational: { severityDelta: 0, description: 'Operations continued but the breach expanded.' }
                                }
                            },
                            {
                                text: 'Focus on protecting the client-facing trading systems only -- let the SOC monitor the rest',
                                score: 0,
                                optimal: false,
                                consequence: 'You cannot segment what was never segmented. Attempting to protect specific systems on a flat network is like closing one door in a house with no walls. The two-person SOC is already overwhelmed. The attacker pivots to systems you deprioritized and exfiltrates everything.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Partial protection on a flat network failed. Attacker moved to unmonitored systems.' },
                                    regulatory: { severityDelta: 1, description: 'Regulators cited the selective protection as evidence of negligent prioritization.' }
                                }
                            },
                            {
                                text: 'Call in a third-party IR firm before taking any containment action -- you need expert guidance',
                                score: 1,
                                optimal: false,
                                consequence: 'Sound instinct but wrong timing. IR firms take 4-12 hours to mobilize. While you wait for cavalry, the attacker continues operating with domain admin on your flat network. NIST 800-61 is clear: containment precedes detailed analysis. You can call the IR firm AND take the network down.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: '8-hour IR mobilization delay allowed continued attacker activity.' },
                                    financial: { severityDelta: 0, description: 'IR firm engagement was necessary but the delay increased scope.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Day 1 -- Scope Assessment',
                        situation: 'The IR firm is onsite. Forensic analysis confirms: 180,000 client records (SSNs, account numbers, balances) were exfiltrated to an external server via DNS tunneling (your firewall had no DNS inspection). Transaction logs for the past 90 days have been tampered with -- integrity is compromised. The attacker used the shared domain admin password (which was "Meridian2024!" -- found on a sticky note during the physical assessment). Your GLBA-mandated written information security program is a 4-page document from 2019 that has never been updated.',
                        contradicts: true,
                        evidence: [
                            { text: 'DNS tunneling confirmed -- 2.3GB exfiltrated to C2 server', reliability: 'high' },
                            { text: 'Shared admin password found on sticky note in server room', reliability: 'high' },
                            { text: 'GLBA security program document last updated 2019', reliability: 'high' },
                            { text: 'Attacker may have planted ransomware not yet detonated', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 3,
                        decisions: [
                            {
                                text: 'Notify all 180K clients, all state regulators, and the FTC simultaneously within 24 hours',
                                score: 2,
                                optimal: false,
                                consequence: 'Fast disclosure is good, but without a remediation plan you are telling 180,000 people "your SSN is stolen and we have no idea what to do about it." The notification should include concrete steps: credit monitoring enrollment, dedicated call center, account review options. Speed without substance creates panic.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Rapid notification met GLBA timelines and earned some regulatory credit.' },
                                    reputational: { severityDelta: 0, description: 'Fast but incomplete notification created client confusion.' }
                                }
                            },
                            {
                                text: 'Prepare a coordinated disclosure: client notification with credit monitoring, regulator briefing with remediation plan, and board communication -- target 72-hour delivery',
                                score: 3,
                                optimal: true,
                                consequence: 'Correct approach. 72 hours is within most state notification windows and allows time to set up a call center, contract credit monitoring for all 180K clients, prepare a regulatory submission that includes root cause and remediation timeline, and brief the board with accurate information. This mirrors the Capital One 2019 response playbook, which regulators cited as a model.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Coordinated disclosure with remediation plan met regulatory expectations.' },
                                    reputational: { severityDelta: -1, mitigated: true, description: 'Comprehensive notification with concrete remediation reduced client panic.' }
                                }
                            },
                            {
                                text: 'Hold all notification until the forensic investigation is complete (estimated 3-4 weeks) to ensure accuracy',
                                score: 0,
                                optimal: false,
                                consequence: 'Most state breach notification laws require disclosure within 30-60 days, and several require "without unreasonable delay." Waiting 3-4 weeks to begin the notification process risks violating every timeline. When Uber did this in 2016, their CISO went to prison. The cover-up is always worse than the crime.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Delayed notification violated multiple state statutes and GLBA requirements.' },
                                    financial: { severityDelta: 1, description: 'Notification delay increased regulatory penalties and class action exposure.' }
                                }
                            },
                            {
                                text: 'Notify only the clients whose records were confirmed exfiltrated and delay the rest',
                                score: 1,
                                optimal: false,
                                consequence: 'With transaction log integrity compromised, you cannot be certain which records were and were not accessed. Selective notification based on incomplete forensics will backfire when the full scope is later revealed. The Anthem breach (2015) taught this lesson -- initial estimates of 37M grew to 78.8M, requiring a second embarrassing disclosure round.',
                                modifiers: {
                                    reputational: { severityDelta: 1, description: 'Partial notification required a second round when full scope emerged, doubling the media cycle.' },
                                    regulatory: { severityDelta: 0, description: 'Regulators noted the attempt to limit scope but questioned the methodology.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Week 1 -- Remediation',
                        situation: 'Notifications are out. Client calls are flooding the helpline at 3x projected volume. 12% of clients have already requested account transfers to competitors. Your IR firm presents two remediation options: (A) patch the flat network incrementally while keeping operations running, or (B) design a zero trust architecture from scratch, which requires 2-3 weeks of reduced capacity. The board is pressuring you to "get back to normal" as fast as possible. Meanwhile, the tampered transaction logs mean your compliance team cannot certify the accuracy of any financial reports for Q3.',
                        evidence: [
                            { text: '12% client attrition in first 5 days (21,600 accounts)', reliability: 'high' },
                            { text: 'Q3 financial reports cannot be certified -- audit implications', reliability: 'high' },
                            { text: 'IR firm: incremental patching leaves residual risk of 60-70%', reliability: 'medium' },
                            { text: 'Insurance carrier hinting at coverage denial due to "lack of basic controls"', reliability: 'medium' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 0,
                        decisions: [
                            {
                                text: 'Choose the incremental patch approach to restore operations fast and address zero trust later',
                                score: 0,
                                optimal: false,
                                consequence: 'This is how you get breached twice. The IR firm said 60-70% residual risk for a reason -- the flat network architecture is the vulnerability. Patching individual systems on a fundamentally broken architecture is like putting new locks on a door that has no walls around it. The 2021 Colonial Pipeline incident showed what happens when you resume operations on compromised infrastructure.',
                                modifiers: {
                                    technical: { severityDelta: 1, description: 'Incremental patching left the flat architecture intact. A second incident occurred within 90 days.' },
                                    financial: { severityDelta: 1, description: 'Second incident doubled remediation costs and triggered insurance policy cancellation.' }
                                }
                            },
                            {
                                text: 'Implement zero trust architecture rebuild: network segmentation, MFA everywhere, least-privilege access, and microsegmentation of client data',
                                score: 3,
                                optimal: true,
                                consequence: 'The right long-term decision. Two to three weeks of reduced capacity is painful but survivable. The zero trust rebuild addresses the root cause: no network boundary should be trusted, every access request must be verified, and lateral movement must be architecturally impossible. This follows NIST SP 800-207 (Zero Trust Architecture) and demonstrates to regulators that you are addressing root causes, not symptoms.',
                                modifiers: {
                                    technical: { severityDelta: -1, mitigated: true, description: 'Zero trust architecture eliminated the flat network vulnerability. Lateral movement became architecturally impossible.' },
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'Regulators credited the zero trust rebuild as evidence of genuine remediation commitment.' }
                                }
                            },
                            {
                                text: 'Hire a second IR firm for a competing opinion -- the 2-3 week downtime estimate seems excessive',
                                score: 1,
                                optimal: false,
                                consequence: 'Seeking a second opinion during active incident response wastes critical time. The second firm will need 3-5 days just to ramp up on the environment. Meanwhile, you are operating on a compromised flat network. This is a decision-avoidance pattern that regulators and insurers recognize and penalize.',
                                modifiers: {
                                    technical: { severityDelta: 0, description: 'No containment progress during second opinion phase.' },
                                    financial: { severityDelta: 0, description: 'Second IR firm engagement added $500K in duplicate analysis costs.' }
                                }
                            }
                        ]
                    },
                    {
                        timeLabel: 'Month 3 -- Architecture Rebuild',
                        situation: 'Your zero trust rebuild is underway. Network segmentation is 60% complete. MFA is deployed for all privileged accounts. But the FTC has opened a formal investigation citing your 2019 GLBA security program as evidence of "systemic negligence." Your cyber insurance carrier has denied the claim ($5M policy) citing failure to maintain "reasonable security measures" -- specifically the shared admin password. The state financial regulator is considering revoking your operating license. Two institutional clients representing $800M AUM are threatening to leave unless you can demonstrate SOC 2 Type II compliance within 12 months.',
                        evidence: [
                            { text: 'FTC investigation formal notice received -- citing 16 CFR 314', reliability: 'high' },
                            { text: 'Cyber insurance claim denied -- $5M policy voided', reliability: 'high' },
                            { text: 'State regulator considering license revocation hearing', reliability: 'high' },
                            { text: 'Two institutional clients ($800M AUM) demanding SOC 2 Type II within 12 months', reliability: 'high' }
                        ],
                        timerSeconds: 45,
                        timeoutDefault: 2,
                        decisions: [
                            {
                                text: 'Accept the FTC investigation findings, cooperate fully, and propose a consent decree with a 10-year security audit commitment',
                                score: 3,
                                optimal: true,
                                consequence: 'Cooperation with regulators is the only viable path. Fighting the FTC with a 2019 security program and a shared admin password as evidence is unwinnable. A consent decree with long-term audit commitments (similar to the Equifax model) demonstrates accountability and gives regulators a framework to monitor your progress. It also provides institutional clients with third-party verification of your security posture.',
                                modifiers: {
                                    regulatory: { severityDelta: -1, mitigated: true, description: 'FTC cooperation and consent decree reduced penalty severity and prevented license revocation.' },
                                    financial: { severityDelta: -1, mitigated: true, description: 'Consent decree provided certainty for investors and institutional clients. $800M AUM retained.' }
                                }
                            },
                            {
                                text: 'Challenge the insurance denial in court -- the policy language on "reasonable security" is ambiguous',
                                score: 1,
                                optimal: false,
                                consequence: 'Insurance litigation takes 18-36 months. The shared admin password on a sticky note will be exhibit A for the carrier. Courts have increasingly sided with insurers when basic controls like MFA were absent -- see the Cottage Health (2015) and Columbia Casualty cases. Meanwhile, you are paying remediation costs out of pocket.',
                                modifiers: {
                                    financial: { severityDelta: 0, description: 'Insurance litigation added legal costs without near-term recovery.' },
                                    reputational: { severityDelta: 0, description: 'Insurance fight became a distraction from the trust rebuilding effort.' }
                                }
                            },
                            {
                                text: 'Focus entirely on the SOC 2 Type II certification to retain institutional clients -- the regulatory issues can wait',
                                score: 1,
                                optimal: false,
                                consequence: 'SOC 2 is important but regulators will not wait for your certification timeline. Ignoring the FTC investigation risks a default judgment with maximum penalties. You must run compliance and remediation in parallel -- prioritizing one at the expense of the other creates gaps that compound. The Target breach showed that a company can lose its CEO over regulatory mismanagement even after technical remediation is underway.',
                                modifiers: {
                                    regulatory: { severityDelta: 1, description: 'Delayed FTC response escalated to enforcement action with higher penalties.' },
                                    financial: { severityDelta: 0, description: 'SOC 2 progress reassured institutional clients but did not address the regulatory threat.' }
                                }
                            },
                            {
                                text: 'Hire a new CEO and CISO with public breach-recovery track records to signal a clean break',
                                score: 2,
                                optimal: false,
                                consequence: 'Leadership change signals accountability, which helps with regulators and clients. But new leadership without architectural change is a press release, not a solution. The right answer includes leadership change AND the consent decree AND the architecture rebuild. Doing only this is the Equifax playbook without the follow-through.',
                                modifiers: {
                                    reputational: { severityDelta: -1, mitigated: true, description: 'New leadership with breach-recovery experience rebuilt client confidence.' },
                                    regulatory: { severityDelta: 0, description: 'Regulators noted leadership change but focused on systemic controls, not personnel.' }
                                }
                            }
                        ]
                    }
                ]
            }
        });
    </script>

</body>
