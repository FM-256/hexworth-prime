<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Quiz: Cyberethics &amp; Security Professional Foundations | CIS2253</title>
    <style>
        :root { --bg: #090910; --bg-card: #12121e; --bg-option: #161625; --cyan: #ff00ff; --cyan-dim: rgba(255, 0, 255, 0.15); --text: #e2e8f0; --text-muted: #8892a8; --success: #22c55e; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #110828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--cyan); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--cyan-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--cyan); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; min-width: 110px; }
        .progress-track { flex: 1; height: 6px; background: var(--bg-option); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), #ff66ff); width: 0%; transition: width 0.3s ease; }
        .score-label { font-size: 0.78rem; color: var(--cyan); white-space: nowrap; min-width: 70px; text-align: right; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.78rem; color: var(--cyan); letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.05rem; color: var(--text); margin-bottom: 1.5rem; line-height: 1.55; }
        .options { display: flex; flex-direction: column; gap: 0.5rem; }
        .option { display: flex; gap: 12px; padding: 0.85rem 1rem; background: var(--bg-option); border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; align-items: flex-start; }
        .option:hover:not(.disabled) { border-color: var(--cyan-dim); background: rgba(255, 0, 255, 0.05); }
        .option.disabled { cursor: default; }
        .option.correct { background: rgba(34, 197, 94, 0.15); border-color: var(--success); }
        .option.incorrect { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); }
        .option-letter { font-weight: 700; color: var(--cyan); min-width: 22px; }
        .option.correct .option-letter { color: var(--success); }
        .option.incorrect .option-letter { color: var(--danger); }
        .option span:last-child { font-size: 0.92rem; color: var(--text); line-height: 1.5; }
        .feedback { margin-top: 1.25rem; padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.88rem; line-height: 1.55; display: none; }
        .feedback.checking { display: block; background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.35); color: #cbd5e1; }
        .feedback.correct { background: rgba(34, 197, 94, 0.10); border: 1px solid rgba(34, 197, 94, 0.3); color: #6ee7b7; display: block; }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; display: block; }
        .quiz-nav { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
        .next-btn { padding: 0.75rem 2rem; background: var(--cyan); color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover:not(:disabled) { background: #ff44ff; transform: translateY(-1px); }
        .next-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .results-card { display: none; background: var(--bg-card); border-radius: 14px; padding: 2.5rem; border: 1px solid var(--cyan-dim); text-align: center; }
        .results-card h2 { color: var(--cyan); font-size: 1.5rem; margin-bottom: 1rem; }
        .score-big { font-size: 2.5rem; font-weight: 700; color: var(--success); margin: 1rem 0; }
        .score-big.mid { color: #fbbf24; }
        .score-big.low { color: var(--danger); }
        .score-msg { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-retry, .btn-hub { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--cyan); }
        .btn-retry:hover { background: var(--cyan); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* Review Answers view */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&larr; Cybersecurity Ethics Hub</a></div>
        <div class="quiz-header">
            <h1>Week 1 Quiz</h1>
            <p class="subtitle">Cyberethics overview, security professional role, NIST CSF anchor (CSE-01, CSE-02, CSE-03)</p>
            <div class="meta">
                <span>10 Questions</span>
                <span>70% to Pass</span>
                <span>Multiple attempts</span>
            </div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 10</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>
    <script>
        var questions = [{"q":"In Lawrence Lessig's four modalities of regulation, which modality dominates behavior in cyberspace?","opts":["Law","Norms","Market","Code (architecture)"],"exp":"Lessig argues that in cyberspace, code (architecture) regulates conduct as effectively as -- often more effectively than -- statutes. Engineers writing the rules makes engineering an inherently ethical activity."},{"q":"A platform requires real names for accounts. Under Lessig's framework, this is best characterized as which modality acting on speech?","opts":["Law -- because government statutes require it","Norms -- because users socially expect it","Code -- the architecture of the system enforces it","Market -- competition determines it"],"exp":"The technical requirement built into the platform IS the regulation -- code, not law. The product manager who chose the policy made a constitutional decision; the engineer enforced it."},{"q":"Which ethical framework is most directly invoked when a security professional argues 'we must disclose this vulnerability because users have a right to know what threatens them, regardless of consequences'?","opts":["Utilitarianism","Deontology (Kantian)","Virtue ethics","Contractualism"],"exp":"Deontology focuses on duty and the dignity of persons regardless of outcomes. The 'right to know' framing emphasizes a duty owed to users -- the deontological lens. Note that other deontological readings (duty to not enable harm) might point the other way; reasonable Kantians can split."},{"q":"What is 'trust asymmetry' as the term is used in this course?","opts":["When an organization trusts its security team less than it trusts its sales team","The structural condition that the security professional sees risks the organization cannot","The gap between what users trust the platform with and what the platform actually does","The disparity in trust between government and private sector cybersecurity coordination"],"exp":"Trust asymmetry is the security profession's defining structural condition: the practitioner sees vulnerabilities, breaches, and weaknesses the org has no other way to see. Codes of ethics exist because of this asymmetry."},{"q":"Which professional code is specifically built for incident response work and explicitly prohibits hack-back as an operational rule?","opts":["ASIS Code","ISACA Code of Professional Ethics","GIAC Code of Ethics","Ethics FIRST (FIRST.org)"],"exp":"Ethics FIRST is the FIRST.org code targeting incident response and security operations. Its 'do not hack back' position is operational rather than aspirational, distinguishing it from the broader codes."},{"q":"All four security professional codes (ASIS, ISACA, GIAC, Ethics FIRST) explicitly converge on which principle?","opts":["Use of specific encryption technologies","Public-interest service","Mandatory bug bounty participation","Annual continuing education hours"],"exp":"Public-interest service is the only line every code states explicitly. When practitioners say 'I have to do X for the company,' the codes have no category for that -- they have categories for client, peer, self, and public."},{"q":"The NIST Cybersecurity Framework is best described as:","opts":["A federally mandated checklist of security controls","A certification program for security professionals","A voluntary risk-based common vocabulary for managing cybersecurity","A maturity model that ranks organizations from 1 to 5"],"exp":"CSF is voluntary and risk-based. It is not a checklist (control frameworks like 800-53 do that), not a certification, and not a maturity model. It provides a shared language for cybersecurity risk."},{"q":"Which CSF subcategory is the structural foundation that every later cybersecurity decision presupposes?","opts":["PR.AC-7 -- authentication commensurate with risk","ID.BE-3 -- priorities for organizational mission established and communicated","DE.AE-3 -- event data collected and correlated","RS.MI-2 -- incidents mitigated"],"exp":"ID.BE-3 (priorities for mission, objectives, and activities are established and communicated) is the foundation. Without it, every later cybersecurity decision is arbitrary because there's no basis for ranking what matters."},{"q":"Which four CSF subcategories does CIS2253 explicitly map to per the syllabus?","opts":["ID.AM, ID.RA, PR.AC, PR.DS","ID.BE, ID.GV, PR.AT, PR.IP","DE.AE, DE.CM, RS.RP, RC.RP","ID.GV, PR.AC, DE.CM, RS.IM"],"exp":"The syllabus explicitly maps CIS2253 to ID.BE (Business Environment), ID.GV (Governance), PR.AT (Awareness/Training), and PR.IP (Information Protection processes). Every weekly checkpoint comes back to these four."},{"q":"A security professional discovers their employer is selling user data in ways that violate privacy norms but are technically permitted by the terms of service. Internal escalation has been ignored. Per the codes' priority hierarchy, what does the professional owe?","opts":["Continued silence -- the ToS makes it legal, so it is also ethical","Resignation without further action -- the obligation ends with leaving","Public-interest duty above employer obligations -- proportional disclosure becomes appropriate when internal channels fail","Whatever the professional's manager decides -- chain of command resolves the issue"],"exp":"All four codes prioritize public welfare over employer obligations when they conflict. The professional decision tree: exhaust internal channels (done), document, verify harm is significant, choose proportional response. Disclosure is the codes' answer when internal fails."}];
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];
        var revealedAnswers = {}; // server-revealed correct index per question (Family-5)
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }
        var QUIZ_ID = 'cse-w1-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct. ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }
        function nextQuestion() {
            current++;
            if (current >= TOTAL) { showResults(); return; }
            loadQuestion();
        }
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have command of the Week 1 vocabulary.';
            else if (pct >= 70) msg = 'Solid pass. Review any questions you missed before the midterm.';
            else if (pct >= 50) msg = 'Close. Re-walk CSE-01 through CSE-03 and try again.';
            else msg = 'Keep studying. The Week 1 modules are the foundation for everything that follows.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try { ModuleProgress.completeQuiz('divergent', 'cse-w1-quiz', pct, { returnToDashboard: false }); }
                catch (e) { console.warn('[cse-w1-quiz] ModuleProgress.completeQuiz failed:', e); }
            }
        }
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;
                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }
        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }
        loadQuestion();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;

    <hex-ai-button mission-id="cse-w1" house="divergent"></hex-ai-button>

</body>
</html>
