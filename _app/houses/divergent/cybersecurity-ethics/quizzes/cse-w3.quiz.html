<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/ModuleProgress.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: CIS2253</title>
    <style>
        :root { --bg: #090910; --bg-card: #12121e; --bg-option: #161625; --cyan: #ff00ff; --cyan-dim: rgba(255, 0, 255, 0.15); --text: #e2e8f0; --text-muted: #8892a8; --success: #22c55e; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #110828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--cyan); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #ff88ff; transform: translateX(-5px); }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--cyan-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--cyan); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; min-width: 110px; }
        .progress-track { flex: 1; height: 6px; background: var(--bg-option); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), #ff66ff); width: 0%; transition: width 0.3s ease; }
        .score-label { font-size: 0.78rem; color: var(--cyan); white-space: nowrap; min-width: 70px; text-align: right; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.78rem; color: var(--cyan); letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.05rem; color: var(--text); margin-bottom: 1.5rem; line-height: 1.55; }
        .options { display: flex; flex-direction: column; gap: 0.5rem; }
        .option { display: flex; gap: 12px; padding: 0.85rem 1rem; background: var(--bg-option); border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; align-items: flex-start; }
        .option:hover:not(.disabled) { border-color: var(--cyan-dim); background: rgba(255, 0, 255, 0.05); }
        .option.disabled { cursor: default; }
        .option.correct { background: rgba(34, 197, 94, 0.15); border-color: var(--success); }
        .option.incorrect { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); }
        .option-letter { font-weight: 700; color: var(--cyan); min-width: 22px; }
        .option.correct .option-letter { color: var(--success); }
        .option.incorrect .option-letter { color: var(--danger); }
        .option span:last-child { font-size: 0.92rem; color: var(--text); line-height: 1.5; }
        .feedback { margin-top: 1.25rem; padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.88rem; line-height: 1.55; display: none; }
        .feedback.correct { background: rgba(34, 197, 94, 0.10); border: 1px solid rgba(34, 197, 94, 0.3); color: #6ee7b7; display: block; }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; display: block; }
        .quiz-nav { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
        .next-btn { padding: 0.75rem 2rem; background: var(--cyan); color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover:not(:disabled) { background: #ff44ff; transform: translateY(-1px); }
        .next-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .results-card { display: none; background: var(--bg-card); border-radius: 14px; padding: 2.5rem; border: 1px solid var(--cyan-dim); text-align: center; }
        .results-card h2 { color: var(--cyan); font-size: 1.5rem; margin-bottom: 1rem; }
        .score-big { font-size: 2.5rem; font-weight: 700; color: var(--success); margin: 1rem 0; }
        .score-big.mid { color: #fbbf24; }
        .score-big.low { color: var(--danger); }
        .score-msg { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-retry, .btn-hub { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.4) !important; color: var(--cyan); }
        .btn-retry:hover { background: var(--cyan); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* Review Answers view */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(0, 255, 255, 0.04); border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--cyan); }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&larr; Cybersecurity Ethics Hub</a></div>
        <div class="quiz-header">
            <h1>Week 3 Quiz</h1>
            <p class="subtitle">Privacy rights and cybersecurity as moral obligation (CSE-07, CSE-08)</p>
            <div class="meta">
                <span>10 Questions</span>
                <span>70% to Pass</span>
                <span>Multiple attempts</span>
            </div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 10</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>
    <script>
        var questions = [
            {
                "q": "The 'reasonable expectation of privacy' test originates from which case?",
                "opts": [
                    "Carpenter v. United States (2018)",
                    "Smith v. Maryland (1979)",
                    "Katz v. United States (1967)",
                    "Riley v. California (2014)"
                ],
                "ans": 2,
                "exp": "Katz v. United States (1967) established the two-prong reasonable expectation test: subjective (the individual expects privacy) AND objective (society finds the expectation reasonable). It is the foundation for Fourth Amendment privacy analysis in the digital age."
            },
            {
                "q": "Carpenter v. United States (2018) is significant because it:",
                "opts": [
                    "Eliminated the third-party doctrine entirely",
                    "Held that historical cell-site location information requires a warrant, declining to extend the third-party doctrine to comprehensive location histories",
                    "Established that all cloud data is constitutionally protected",
                    "Required search warrants for any data shared with third parties"
                ],
                "ans": 1,
                "exp": "Carpenter declined to extend the third-party doctrine (Smith 1979, Miller 1976) to historical CSLI. The Court signaled that digital data's pervasive, automatic, detailed nature can defeat the 'voluntarily shared' framing. Subsequent litigation continues to test the boundaries."
            },
            {
                "q": "Which US privacy statute applies specifically to children under 13?",
                "opts": [
                    "FERPA",
                    "GLBA",
                    "HIPAA",
                    "COPPA"
                ],
                "ans": 3,
                "exp": "COPPA (Children's Online Privacy Protection Act) governs data collection from children under 13, requires parental consent, and shapes user-onboarding flows and age-gating systems."
            },
            {
                "q": "Under GDPR, the breach notification window for notifying the supervisory authority is:",
                "opts": [
                    "24 hours",
                    "48 hours",
                    "72 hours",
                    "10 business days"
                ],
                "ans": 2,
                "exp": "GDPR requires notification to the supervisory authority within 72 hours of becoming aware of a personal-data breach (with limited 'delay justified' exceptions). Notification of affected individuals is 'without undue delay' when high risk to rights and freedoms exists."
            },
            {
                "q": "Helen Nissenbaum's 'contextual integrity' framework holds that a privacy violation occurs when:",
                "opts": [
                    "Data is exposed to anyone outside its original storage location",
                    "Information flows in ways that violate the norms of the context in which it was originally shared",
                    "Personal data is collected without explicit written consent",
                    "Encryption fails on data in transit"
                ],
                "ans": 1,
                "exp": "Nissenbaum (Privacy in Context, 2010) reframes privacy as appropriate flow, not secrecy. A public Instagram photo used by an insurer for underwriting is a contextual-integrity violation -- the data was shared in a social context, repurposed in an underwriting context."
            },
            {
                "q": "Schrems II (CJEU, July 2020) had what major effect on cross-border data transfer?",
                "opts": [
                    "Validated the EU-US Privacy Shield as a permanent transfer mechanism",
                    "Invalidated the EU-US Privacy Shield, requiring SCCs with supplementary measures",
                    "Required all EU citizen data to remain in the EU",
                    "Established the EU as the sole authority for global cross-border data transfers"
                ],
                "ans": 1,
                "exp": "Schrems II (Case C-311/18) invalidated Privacy Shield on grounds that US surveillance authorities did not provide protections equivalent to EU standards. SCCs survived but with new supplementary measures requirements. The EU-US Data Privacy Framework (2023) was negotiated as a successor and is now in force, though it faces ongoing challenges."
            },
            {
                "q": "Which cybercrime actor category is hardest to detect because they begin with authorized access?",
                "opts": [
                    "Opportunistic / script kiddie",
                    "Hacktivist",
                    "Insider",
                    "Nation-state / APT"
                ],
                "ans": 2,
                "exp": "Insiders -- authorized users who exceed authority or exfiltrate data -- are typically the hardest to detect because their initial access is legitimate. Detection requires behavioral analytics, separation of duties, and least-privilege controls."
            },
            {
                "q": "The 'attribution problem' in cybersecurity ethics is significant because it:",
                "opts": [
                    "Means most cyberattacks are technically unsolvable",
                    "Makes most offensive responses (hack-back, retaliation) ethically problematic since you may harm innocents",
                    "Prevents prosecution of any cybercrime actor",
                    "Requires every defender to publicly disclose breach details"
                ],
                "ans": 1,
                "exp": "Attribution is uncertain because infrastructure is rented, tooling is shared, and tradecraft overlaps. Hack-back, retaliation, and 'active defense' all assume you know who you are responding to. Attribution uncertainty is the central ethical reason most offensive responses are problematic, not a footnote."
            },
            {
                "q": "Why do major incident-response codes (Ethics FIRST in particular) explicitly prohibit 'hack-back'?",
                "opts": [
                    "Hack-back is always technically infeasible",
                    "Attribution is unreliable, escalation risk is severe, infrastructure is shared with innocents, and private actors lack warrant authority",
                    "Hack-back is illegal in all jurisdictions worldwide",
                    "Hack-back violates platform terms of service"
                ],
                "ans": 1,
                "exp": "The professional consensus combines technical, legal, and ethical reasons: attribution uncertainty (might harm innocents), escalation risk, shared infrastructure (collateral damage), and lack of warrant authority. The DOJ has consistently advised against it under existing CFAA."
            },
            {
                "q": "Spinello's three obligations of the 'defender's ethics' are:",
                "opts": [
                    "Compliance, documentation, certification",
                    "Proportionality, honesty, care",
                    "Detection, response, recovery",
                    "Confidentiality, integrity, availability"
                ],
                "ans": 1,
                "exp": "Spinello's defender's ethics: proportionality (controls scaled to threat and asset), honesty (internal escalation, external disclosure, honest representation), and care (continuous diligence). The recurring failure modes of this course's prior cases each map to violations of one of the three."
            }
        ];
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }
            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }
            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;
            if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
        }
        function nextQuestion() {
            current++;
            if (current >= TOTAL) { showResults(); return; }
            loadQuestion();
        }
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Outstanding. You have command of the Week 3 vocabulary.';
            else if (pct >= 70) msg = 'Solid pass. Review any questions you missed before the midterm.';
            else if (pct >= 50) msg = 'Close. Re-walk this week\'s modules and try again.';
            else msg = 'Keep studying. Re-read the modules and try again.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                try { ModuleProgress.completeQuiz('divergent', 'cse-w3-quiz', pct, { returnToDashboard: false }); }
                catch (e) { console.warn('[cse-w3-quiz] ModuleProgress.completeQuiz failed:', e); }
            }
        }
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;
                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }
        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }
        loadQuestion();
    </script>

</body>
