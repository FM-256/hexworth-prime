<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Anger the Printer - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #e67e22;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(230, 126, 34, 0.3);
        }

        h1 {
            color: #e67e22;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(230, 126, 34, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(230, 126, 34, 0.5); }
            to { text-shadow: 0 0 20px rgba(230, 126, 34, 0.8); }
        }

        .subtitle {
            text-align: center;
            color: #f39c12;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .game-header {
            background: rgba(230, 126, 34, 0.1);
            border: 1px solid #e67e22;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
        }

        .stat-label {
            color: #999;
            font-size: 0.9em;
        }

        .stat-value {
            color: #00ff00;
            font-size: 1.2em;
            font-weight: bold;
        }

        .timer {
            font-size: 2em;
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            margin-bottom: 20px;
            border: 2px solid #2ecc71;
            transition: all 0.3s ease;
        }

        .timer.warning {
            border-color: #f39c12;
            color: #f39c12;
            animation: pulse 1s ease-in-out infinite;
        }

        .timer.critical {
            border-color: #e74c3c;
            color: #e74c3c;
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .output {
            background: #000;
            border: 2px solid #e67e22;
            border-radius: 5px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .output::-webkit-scrollbar {
            width: 10px;
        }

        .output::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .output::-webkit-scrollbar-thumb {
            background: #e67e22;
            border-radius: 5px;
        }

        .line {
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .system {
            color: #3498db;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }

        .success {
            color: #2ecc71;
            font-weight: bold;
        }

        .warning {
            color: #f39c12;
        }

        .printer-msg {
            color: #e67e22;
            font-weight: bold;
            font-style: italic;
        }

        .achievement {
            color: #9b59b6;
            font-weight: bold;
            animation: achievementPop 0.5s ease-out;
        }

        @keyframes achievementPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .prompt {
            color: #e67e22;
            font-size: 1.1em;
            font-weight: bold;
        }

        input {
            flex: 1;
            background: #000;
            border: 2px solid #e67e22;
            color: #00ff00;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border-radius: 5px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            background: #e67e22;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .achievements {
            background: rgba(155, 89, 182, 0.1);
            border: 1px solid #9b59b6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
        }

        .achievements h3 {
            color: #9b59b6;
            margin-bottom: 10px;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }

        .achievement-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            transition: all 0.3s ease;
        }

        .achievement-item.unlocked {
            border-color: #9b59b6;
            background: rgba(155, 89, 182, 0.2);
        }

        .achievement-item.unlocked .achievement-icon {
            opacity: 1;
        }

        .achievement-icon {
            font-size: 1.5em;
            opacity: 0.3;
            margin-right: 8px;
        }

        .achievement-name {
            color: #9b59b6;
            font-weight: bold;
        }

        .achievement-desc {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 3px solid #e67e22;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            animation: modalSlideIn 0.5s ease-out;
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            color: #e67e22;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #00ff00;
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .modal-content .final-time {
            color: #f39c12;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .output {
                height: 300px;
                font-size: 0.85em;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖨️ DON'T ANGER THE PRINTER 🖨️</h1>
        <div class="subtitle">A Forge House IT Support Survival Horror Experience</div>

        <div class="game-header">
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Print Queue</div>
                    <div class="stat-value" id="queueSize">847</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Printer Status</div>
                    <div class="stat-value" id="printerStatus">ANGRY</div>
                </div>
                <div class="stat">
                    <div class="stat-label">CEO Mood</div>
                    <div class="stat-value" id="ceoMood">IRRITATED</div>
                </div>
            </div>
            <div class="timer" id="timer">03:00</div>
        </div>

        <div class="output" id="output"></div>

        <div class="input-container">
            <span class="prompt">IT-SUPPORT&gt;</span>
            <input type="text" id="commandInput" placeholder="Type your command..." autofocus>
        </div>

        <div class="button-group">
            <button onclick="Game.restart()">🔄 Restart</button>
            <button onclick="Game.showHelp()">❓ Help</button>
            <button onclick="Game.showHint()">💡 Hint</button>
        </div>

        <div class="achievements">
            <h3>🏆 Achievements (<span id="achievementCount">0</span>/12)</h3>
            <div class="achievement-grid" id="achievementGrid"></div>
        </div>
    </div>

    <div class="modal" id="endModal">
        <div class="modal-content">
            <h2 id="endTitle">GAME OVER</h2>
            <p id="endMessage"></p>
            <div class="final-time" id="finalTime"></div>
            <div class="button-group" style="justify-content: center;">
                <button onclick="Game.closeModal()">Continue</button>
                <button onclick="Game.restart()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        // Main game wrapped in IIFE to avoid global scope pollution
        const Game = (function() {
            'use strict';

            // Game state
            const state = {
                // Printer fixes
                printerCleared: false,
                jamFixed: false,
                tonerFixed: false,
                driverUpdated: false,
                networkFixed: false,
                spoolerRestarted: false,
                faxDisabled: false,
                firmwareReset: false,
                testPagePrinted: false,
                ceoReportPrinted: false,
                hackerFound: false,
                usbChecked: false,
                snmpSecured: false,

                // Troubleshooting methodology tracking
                identified: false,
                isolated: false,
                diagnosed: false,
                repaired: false,
                tested: false,
                documented: false,

                // Game state
                timeLeft: 180,
                gameActive: true,
                queueSize: 847,
                printerMood: 'HOSTILE',
                ceoMood: 'IRRITATED',

                // Events fired
                events: {
                    faxFired: false,
                    mobyDickFired: false,
                    assistantPanicFired: false,
                    boardArrivingFired: false,
                    stickyNoteFired: false,
                    boardStartingFired: false,
                    mobyCallFired: false
                },

                // Fun tracking
                kickedPrinter: false,
                talkedToPrinter: false,
                triedCoffee: false,
                triedOfficeSpace: false,
                checkedInventory: false,
                panicCount: 0,

                // Achievements
                achievements: new Set()
            };

            // Achievement definitions
            const achievementDefs = {
                first_look: {
                    icon: '👁️',
                    name: 'Diagnostics First',
                    desc: 'Check printer status before doing anything'
                },
                queue_master: {
                    icon: '🗑️',
                    name: 'Queue Master',
                    desc: 'Clear that massive print queue'
                },
                by_the_book: {
                    icon: '📚',
                    name: 'CompTIA Certified',
                    desc: 'Follow full A+ troubleshooting methodology'
                },
                speed_run: {
                    icon: '⚡',
                    name: 'Speed Run',
                    desc: 'Fix and print in under 30 seconds'
                },
                full_fix: {
                    icon: '🔧',
                    name: 'The Printer Whisperer',
                    desc: 'Complete all major repairs'
                },
                percussive: {
                    icon: '👊',
                    name: 'Percussive Maintenance',
                    desc: 'Try to kick/hit the printer'
                },
                frozen: {
                    icon: '❄️',
                    name: 'Frozen',
                    desc: 'Do nothing until time runs out'
                },
                coffee_break: {
                    icon: '☕',
                    name: 'Coffee Break',
                    desc: 'Try to drink coffee'
                },
                found_hacker: {
                    icon: '🔍',
                    name: 'Security Analyst',
                    desc: 'Discover the SNMP hack and USB drive'
                },
                office_space: {
                    icon: '⚾',
                    name: 'Office Space',
                    desc: 'Reference the legendary movie'
                },
                talked_to_it: {
                    icon: '💬',
                    name: 'Printer Whisperer',
                    desc: 'Actually talk to the printer'
                },
                board_hero: {
                    icon: '🦸',
                    name: 'Board Room Hero',
                    desc: 'Print the CEO\'s report before deadline'
                }
            };

            // DOM elements
            let output, commandInput, timer, queueSize, printerStatus, ceoMood;
            let timerInterval;

            // Initialize the game
            function init() {
                output = document.getElementById('output');
                commandInput = document.getElementById('commandInput');
                timer = document.getElementById('timer');
                queueSize = document.getElementById('queueSize');
                printerStatus = document.getElementById('printerStatus');
                ceoMood = document.getElementById('ceoMood');

                loadAchievements();
                renderAchievements();
                setupEventListeners();
                startGame();
            }

            function setupEventListeners() {
                commandInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && state.gameActive) {
                        const command = this.value.trim();
                        if (command) {
                            processCommand(command);
                            this.value = '';
                        }
                    }
                });
            }

            function startGame() {
                state.timeLeft = 180;
                state.gameActive = true;
                clearOutput();

                printLine('='.repeat(70), 'system');
                printLine('INCIDENT TICKET #4729 - PRIORITY: CRITICAL', 'error');
                printLine('='.repeat(70), 'system');
                printLine('');
                printLine('Subject: EXECUTIVE PRINTER EMERGENCY', 'warning');
                printLine('From: C-Suite Executive Assistant (crying)', 'system');
                printLine('Location: Executive Floor, HP LaserJet 4200', 'system');
                printLine('');
                printLine('The CEO\'s printer has achieved SENTIENCE. Or close to it.', 'warning');
                printLine('');
                printLine('Current symptoms:', 'system');
                printLine('  • Printing random Wikipedia articles', '');
                printLine('  • Jamming on purpose when CEO tries to print', '');
                printLine('  • Faxed Q4 earnings to a pizza restaurant', '');
                printLine('  • Print queue: 847 jobs and GROWING', '');
                printLine('  • Toner is BOTH empty AND leaking', '');
                printLine('  • LCD displays: "I AM BECOME PRINTER, DESTROYER OF FORESTS"', 'printer-msg');
                printLine('');
                printLine('MISSION:', 'error');
                printLine('The CEO needs 50 copies of the quarterly report for the board meeting.', 'warning');
                printLine('Board meeting starts in 3 MINUTES.', 'error');
                printLine('This is the ONLY color laser on the executive floor.', 'warning');
                printLine('(Thanks, CFO budget cuts)', 'system');
                printLine('');
                printLine('Good luck. You\'re going to need it.', 'system');
                printLine('');
                printLine('Type "help" for commands, "look" to examine the printer.', 'system');
                printLine('='.repeat(70), 'system');
                printLine('');

                startTimer();
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);

                timerInterval = setInterval(() => {
                    if (!state.gameActive) {
                        clearInterval(timerInterval);
                        return;
                    }

                    state.timeLeft--;
                    updateTimer();
                    checkTimedEvents();

                    if (state.timeLeft <= 0) {
                        gameOver('timeout');
                    }
                }, 1000);
            }

            function updateTimer() {
                const minutes = Math.floor(state.timeLeft / 60);
                const seconds = state.timeLeft % 60;
                timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                // Update timer styling
                timer.classList.remove('warning', 'critical');
                if (state.timeLeft <= 30) {
                    timer.classList.add('critical');
                } else if (state.timeLeft <= 60) {
                    timer.classList.add('warning');
                }
            }

            function checkTimedEvents() {
                const elapsed = 180 - state.timeLeft;

                // Queue growth
                if (elapsed === 12 && !state.events.queueGrowth1) {
                    state.events.queueGrowth1 = true;
                    if (!state.printerCleared) {
                        state.queueSize = 892;
                        updateStats();
                        printLine('[PRINTER] LCD: "PRINT QUEUE: 892 JOBS. I AM UNSTOPPABLE."', 'printer-msg');
                    }
                }

                // Fax event
                if (elapsed === 30 && !state.events.faxFired && !state.faxDisabled) {
                    state.events.faxFired = true;
                    printLine('[FAX] ⚠️  Outgoing fax detected: Q4 Earnings Report sent to 555-PIZZA.', 'error');
                    printLine('       (You hear a distant phone ringing at Papa John\'s)', 'system');
                }

                // Assistant panic
                if (elapsed === 50 && !state.events.assistantPanicFired) {
                    state.events.assistantPanicFired = true;
                    state.ceoMood = 'ANGRY';
                    updateStats();
                    printLine('[ALERT] CEO\'s assistant: "He needs those copies in TEN MINUTES or I\'m fired!"', 'warning');
                    printLine('        (You hear sobbing through the phone)', 'system');
                }

                // Moby Dick
                if (elapsed === 75 && !state.events.mobyDickFired && !state.printerCleared && !state.jamFixed) {
                    state.events.mobyDickFired = true;
                    state.queueSize = 1774; // 847 + 927 pages
                    updateStats();
                    printLine('[PRINTER] The printer is now printing the ENTIRE text of Moby Dick.', 'error');
                    printLine('          Page 1 of 927. The output tray overflows with whaling adventures.', 'printer-msg');
                    printLine('          LCD: "CALL ME ISHMAEL. AND FIX ME."', 'printer-msg');
                }

                // Board arriving
                if (elapsed === 100 && !state.events.boardArrivingFired) {
                    state.events.boardArrivingFired = true;
                    state.ceoMood = 'FURIOUS';
                    updateStats();
                    printLine('[CRITICAL] Board members arriving. You see them through the glass wall.', 'error');
                    printLine('           "Where are the quarterly reports?"', 'warning');
                }

                // Sticky note
                if (elapsed === 130 && !state.events.stickyNoteFired) {
                    state.events.stickyNoteFired = true;
                    printLine('[CRITICAL] The CEO just hand-wrote "FIX THE PRINTER" on a sticky note', 'error');
                    printLine('           and placed it on your monitor. In all caps. With a frowny face.', 'error');
                }

                // Board meeting starting
                if (elapsed === 155 && !state.events.boardStartingFired) {
                    state.events.boardStartingFired = true;
                    state.ceoMood = 'HOMICIDAL';
                    updateStats();
                    printLine('[CRITICAL] Board meeting starting WITHOUT reports.', 'error');
                    printLine('           CEO giving you The Look through the glass wall.', 'error');
                    printLine('           You know The Look. It\'s bad.', 'system');
                }

                // Moby Call
                if (elapsed === 170 && !state.events.mobyCallFired) {
                    state.events.mobyCallFired = true;
                    printLine('[PRINTER] LCD: "CALL DICK\'S LAST RESORT: 1-800-MOBY."', 'printer-msg');
                    printLine('          The printer is mocking you now.', 'system');
                }
            }

            function processCommand(input) {
                const cmd = input.toLowerCase().trim();
                printLine(`IT-SUPPORT> ${input}`, 'system');

                // First command achievement check
                if (state.achievements.size === 0 &&
                    (cmd.includes('check') || cmd.includes('status') || cmd.includes('look'))) {
                    if (cmd.includes('printer') || cmd === 'status' || cmd === 'look' || cmd === 'look at printer') {
                        unlockAchievement('first_look');
                    }
                }

                // Command routing
                if (cmd === 'help' || cmd === '?') {
                    showHelp();
                }
                else if (cmd === 'hint' || cmd === 'hints') {
                    showHint();
                }
                else if (cmd === 'look' || cmd === 'examine' || cmd === 'look around') {
                    lookAtScene();
                }
                else if (cmd.includes('check printer') || cmd === 'status' || cmd === 'look at printer' || cmd === 'printer status') {
                    checkPrinter();
                }
                else if (cmd.includes('inventory') || cmd === 'i') {
                    showInventory();
                }
                else if (cmd.includes('clear queue') || cmd.includes('cancel all') || cmd.includes('purge queue')) {
                    clearQueue();
                }
                else if (cmd.includes('open tray') || cmd.includes('check tray') || cmd === 'paper jam' || cmd === 'check jam') {
                    checkJam();
                }
                else if (cmd.includes('fix jam') || cmd.includes('remove jam') || cmd.includes('pull paper') || cmd.includes('clear jam')) {
                    fixJam();
                }
                else if (cmd.includes('replace toner') || cmd.includes('new toner') || cmd === 'toner' || cmd.includes('fix toner')) {
                    replaceToner();
                }
                else if (cmd.includes('restart spooler') || cmd.includes('net stop spooler') || cmd === 'services.msc' || cmd.includes('spooler')) {
                    restartSpooler();
                }
                else if (cmd.includes('update driver') || cmd.includes('install driver') || cmd === 'driver' || cmd.includes('reinstall driver')) {
                    updateDriver();
                }
                else if (cmd === 'ipconfig' || cmd.includes('ping printer') || cmd.includes('check network') || cmd.includes('network status')) {
                    checkNetwork();
                }
                else if (cmd.includes('fix ip') || cmd.includes('set ip') || cmd.includes('network config') || cmd.includes('configure network')) {
                    fixNetwork();
                }
                else if (cmd.includes('disable fax') || cmd.includes('fax off') || cmd.includes('turn off fax')) {
                    disableFax();
                }
                else if (cmd.includes('factory reset') || cmd.includes('reset printer') || cmd.includes('reset firmware')) {
                    factoryReset();
                }
                else if (cmd.includes('check snmp') || cmd === 'snmp') {
                    checkSNMP();
                }
                else if (cmd.includes('fix snmp') || cmd.includes('secure snmp') || cmd.includes('disable snmp')) {
                    fixSNMP();
                }
                else if (cmd.includes('firmware update') || cmd.includes('update firmware')) {
                    updateFirmware();
                }
                else if (cmd.includes('print test') || cmd === 'test page' || cmd.includes('test print')) {
                    printTest();
                }
                else if (cmd.includes('print report') || cmd.includes('print quarterly') || cmd.includes('print ceo report') || cmd.includes('print 50')) {
                    printReport();
                }
                else if (cmd === 'lpstat' || cmd === 'lpq' || cmd.includes('queue status')) {
                    checkQueueStatus();
                }
                else if (cmd.includes('check usb') || cmd === 'usb') {
                    checkUSB();
                }
                else if (cmd.includes('check logs') || cmd.includes('event viewer') || cmd.includes('logs')) {
                    checkLogs();
                }
                else if (cmd.includes('device manager') || cmd === 'devmgmt.msc') {
                    openDeviceManager();
                }
                else if (cmd.includes('check web') || cmd.includes('web admin') || cmd.includes('web interface')) {
                    checkWebInterface();
                }
                // Fun commands
                else if (cmd === 'panic') {
                    panic();
                }
                else if (cmd === 'coffee' || cmd.includes('drink coffee')) {
                    drinkCoffee();
                }
                else if (cmd.includes('kick') || cmd.includes('hit') || cmd.includes('punch')) {
                    kickPrinter();
                }
                else if (cmd.includes('office space') || cmd.includes('baseball bat') || cmd.includes('bat')) {
                    officeSpace();
                }
                else if (cmd.includes('buy new') || cmd.includes('replace printer')) {
                    buyNewPrinter();
                }
                else if (cmd.includes('turn it off and on') || cmd.includes('reboot') || cmd.includes('restart it')) {
                    rebootPrinter();
                }
                else if (cmd.includes('call hp') || cmd.includes('hp support') || cmd.includes('tech support')) {
                    callHP();
                }
                else if (cmd.includes('unplug')) {
                    unplugPrinter();
                }
                else if (cmd.includes('throw') || cmd.includes('window')) {
                    throwWindow();
                }
                else if (cmd === 'pray') {
                    pray();
                }
                else if (cmd.includes('talk to') || cmd.includes('speak to') || cmd.includes('ask printer')) {
                    talkToPrinter();
                }
                else {
                    printLine('Unknown command. Type "help" for available commands.', 'error');
                }

                // Check win conditions after each command
                checkWinCondition();
            }

                    state.networkFixed && state.snmpSecured && state.faxDisabled &&
                    state.ceoReportPrinted) {
                    unlockAchievement('full_fix');

                }

            function gameOver(reason) {
                state.gameActive = false;
                clearInterval(timerInterval);
                commandInput.disabled = true;

                const modal = document.getElementById('endModal');
                const title = document.getElementById('endTitle');
                const message = document.getElementById('endMessage');
                const finalTime = document.getElementById('finalTime');

                let titleText = '';
                let messageText = '';
                let timeText = '';

                if (reason === 'success') {
                    titleText = '🎉 MISSION ACCOMPLISHED! 🎉';
                    messageText = 'You tamed the beast! The CEO has his quarterly reports. ' +
                                'The board meeting is saved. The executive assistant is crying tears of joy. ' +
                                'And the printer? Well, it\'s printing like it was supposed to all along. ' +
                                'The LCD displays "READY" with what you swear is a hint of respect. ' +
                                'You are a HERO. CompTIA would be proud.';

                    const elapsed = 180 - state.timeLeft;
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    timeText = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;

                    // Platform integration
                    if (typeof AchievementSystem !== 'undefined') {
                        AchievementSystem.unlockGameAchievement('printer', 'win');

                        if (state.achievements.has('by_the_book')) {
                            AchievementSystem.unlockGameAchievement('printer', 'by_the_book');
                        }
                        if (state.achievements.has('speed_run')) {
                            AchievementSystem.unlockGameAchievement('printer', 'speed');
                        }
                        if (state.achievements.size >= 12) {
                            AchievementSystem.unlockGameAchievement('printer', 'all');
                        }
                    }

                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    GameTracker.record('printer', {
                        result: reason || 'unknown',
                        timeElapsed: 180 - state.timeLeft,
                        commandsUsed: 0,
                        achievementsEarned: state.achievements.size,
                        achievementsTotal: state.achievements.size
                    });
                }

                if (reason === 'timeout') {
                    titleText = '⏰ TIME\'S UP! ⏰';

                    if (!state.jamFixed && !state.tonerFixed) {
                        messageText = 'The board meeting has started. The CEO has no reports. ' +
                                    'He\'s explaining to the board why he doesn\'t have numbers. ' +
                                    'They\'re not happy. He\'s not happy. The printer? Still jammed and laughing. ' +
                                    'LCD: "BETTER LUCK NEXT TIME. 😈" Your phone rings. It\'s HR. This won\'t be fun.';
                    } else if (!state.ceoReportPrinted) {
                        messageText = 'You fixed some issues, but didn\'t get the reports printed in time. ' +
                                    'The CEO is improvising his presentation with handwritten notes. ' +
                                    'The board looks confused. Your performance review is going to be... interesting.';
                    } else {
                        messageText = 'How did this happen? The report is printed but time ran out? ' +
                                    'The fabric of space-time is confused.';
                    }

                    unlockAchievement('frozen');
                }

                title.textContent = titleText;
                message.textContent = messageText;
                finalTime.textContent = timeText;

                modal.classList.add('active');

                saveAchievements();
            }

            function closeModal() {
                document.getElementById('endModal').classList.remove('active');
            }

            function restart() {
                closeModal();

                // Reset game state but keep achievements
                const savedAchievements = new Set(state.achievements);

                Object.assign(state, {
                    printerCleared: false,
                    jamFixed: false,
                    tonerFixed: false,
                    driverUpdated: false,
                    networkFixed: false,
                    spoolerRestarted: false,
                    faxDisabled: false,
                    firmwareReset: false,
                    testPagePrinted: false,
                    ceoReportPrinted: false,
                    hackerFound: false,
                    usbChecked: false,
                    snmpSecured: false,
                    identified: false,
                    isolated: false,
                    diagnosed: false,
                    repaired: false,
                    tested: false,
                    documented: false,
                    timeLeft: 180,
                    gameActive: true,
                    queueSize: 847,
                    printerMood: 'HOSTILE',
                    ceoMood: 'IRRITATED',
                    events: {
                        faxFired: false,
                        mobyDickFired: false,
                        assistantPanicFired: false,
                        boardArrivingFired: false,
                        stickyNoteFired: false,
                        boardStartingFired: false,
                        mobyCallFired: false
                    },
                    kickedPrinter: false,
                    talkedToPrinter: false,
                    triedCoffee: false,
                    triedOfficeSpace: false,
                    checkedInventory: false,
                    panicCount: 0,
                    achievements: savedAchievements
                });

                commandInput.disabled = false;
                commandInput.focus();
                updateStats();
                startGame();
            }

            // UI updates
            function updateStats() {
                queueSize.textContent = state.queueSize;
                printerStatus.textContent = state.printerMood;
                ceoMood.textContent = state.ceoMood;
            }

            function printLine(text, className = '') {
                const line = document.createElement('div');
                line.className = 'line ' + className;
                line.textContent = text;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            function clearOutput() {
                output.innerHTML = '';
            }

            // Achievement system
            function unlockAchievement(id) {
                if (state.achievements.has(id)) return;

                state.achievements.add(id);
                const achievement = achievementDefs[id];

                printLine('', '');
                printLine('🏆 ACHIEVEMENT UNLOCKED: ' + achievement.name, 'achievement');
                printLine('   ' + achievement.desc, 'achievement');
                printLine('', '');

                renderAchievements();
                saveAchievements();
            }

            function renderAchievements() {
                const grid = document.getElementById('achievementGrid');
                grid.innerHTML = '';

                let count = 0;

                for (const [id, achievement] of Object.entries(achievementDefs)) {
                    const unlocked = state.achievements.has(id);
                    if (unlocked) count++;

                    const item = document.createElement('div');
                    item.className = 'achievement-item' + (unlocked ? ' unlocked' : '');

                    item.innerHTML = `
                        <span class="achievement-icon">${achievement.icon}</span>
                        <span class="achievement-name">${achievement.name}</span>
                        <div class="achievement-desc">${achievement.desc}</div>
                    `;

                    grid.appendChild(item);
                }

                document.getElementById('achievementCount').textContent = count;
            }

            function saveAchievements() {
                try {
                    localStorage.setItem('hexworth_dontangerprinter_achievements',
                                       JSON.stringify([...state.achievements]));
                } catch (e) {
                    console.error('Failed to save achievements:', e);
                }
            }

            function loadAchievements() {
                try {
                    const saved = localStorage.getItem('hexworth_dontangerprinter_achievements');
                    if (saved) {
                        state.achievements = new Set(JSON.parse(saved));
                    }
                } catch (e) {
                    console.error('Failed to load achievements:', e);
                }
            }

            // Public API
            return {
                init,
                restart,
                showHelp,
                showHint,
                closeModal
            };
        })();

        // Initialize game when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', Game.init);
        } else {
            Game.init();
        }
    </script>
