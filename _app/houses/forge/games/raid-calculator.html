<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAID Calculator - Forge House Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: #f97316;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #f97316;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(249, 115, 22, 0.1);
            border: 2px solid #f97316;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #f97316;
            font-size: 2em;
            font-weight: bold;
        }

        .scenario-box {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.05) 0%, rgba(10, 10, 10, 0.8) 100%);
            border: 2px solid #f97316;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .scenario-title {
            color: #f97316;
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scenario-description {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .disk-array {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin: 30px 0;
            max-width: 800px;
        }

        .disk {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 3px solid #444;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            position: relative;
            transition: all 0.3s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .disk-label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 5px;
        }

        .disk-size {
            font-size: 1.2em;
            color: #f97316;
            font-weight: bold;
        }

        .disk-stripes {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 10px;
        }

        .stripe {
            height: 8px;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .disk.failed {
            border-color: #dc2626;
            opacity: 0.6;
        }

        .disk.failed::after {
            content: '✕';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            color: #dc2626;
            font-weight: bold;
            animation: crackAppear 0.5s;
        }

        @keyframes crackAppear {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2) rotate(180deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        .raid-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .raid-option {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 3px solid #444;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .raid-option:hover {
            border-color: #f97316;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(249, 115, 22, 0.3);
        }

        .raid-option.selected {
            border-color: #f97316;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2) 0%, #2a2a2a 100%);
        }

        .raid-option.correct {
            border-color: #22c55e;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, #2a2a2a 100%);
        }

        .raid-option.incorrect {
            border-color: #dc2626;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2) 0%, #2a2a2a 100%);
        }

        .raid-label {
            font-size: 1.3em;
            color: #f97316;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .raid-mini-diagram {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin-top: 10px;
            height: 40px;
        }

        .mini-disk {
            width: 15px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .mini-stripe {
            flex: 1;
            border-radius: 1px;
        }

        .question-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .question-text {
            font-size: 1.2em;
            color: #f97316;
            margin-bottom: 15px;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .answer-option {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .answer-option:hover {
            border-color: #f97316;
            background: #2a2a2a;
        }

        .answer-option.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.2);
        }

        .answer-option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .answer-option.incorrect {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.2);
        }

        .capacity-chart {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .capacity-bar {
            height: 40px;
            background: #1a1a1a;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin: 10px 0;
        }

        .capacity-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: bold;
            transition: width 0.5s;
        }

        .capacity-usable {
            background: #22c55e;
        }

        .capacity-parity {
            background: #f97316;
        }

        .capacity-mirror {
            background: #3b82f6;
        }

        .capacity-legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .btn {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(249, 115, 22, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-container {
            text-align: center;
            margin: 30px 0;
        }

        .feedback {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid;
        }

        .feedback.correct {
            border-color: #22c55e;
            color: #22c55e;
        }

        .feedback.incorrect {
            border-color: #dc2626;
            color: #dc2626;
        }

        .feedback-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .completion-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen h2 {
            color: #f97316;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 4em;
            color: #f97316;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(249, 115, 22, 0.5);
        }

        .performance-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .performance-card {
            background: rgba(249, 115, 22, 0.1);
            border: 2px solid #f97316;
            border-radius: 10px;
            padding: 20px;
        }

        .performance-value {
            font-size: 2em;
            color: #f97316;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .game-header {
                flex-direction: column;
            }

            .stat-value {
                font-size: 1.5em;
            }

            .disk-array {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 10px;
            }

            .raid-selector {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 5px rgba(249, 115, 22, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(249, 115, 22, 0.8);
            }
        }

        .pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="#" onclick="history.back(); return false;" class="back-link">← Back</a>

        <header>
            <h1>🔥 RAID Calculator Challenge</h1>
            <p class="subtitle">Master Storage Array Configuration | Forge House</p>
        </header>

        <div class="game-header">
            <div class="stat-box">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="roundDisplay">1/10</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="scoreDisplay">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="correctDisplay">0/0</div>
            </div>
        </div>

        <div id="gameArea">
            <!-- Game content will be inserted here -->
        </div>

        <div id="completionScreen" class="completion-screen hidden">
            <h2>🎉 Challenge Complete!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size: 1.3em; margin-bottom: 30px;">RAID Configuration Mastery Achieved</p>

            <div class="performance-summary">
                <div class="performance-card">
                    <div class="stat-label">Questions Answered</div>
                    <div class="performance-value" id="totalAnswered">0</div>
                </div>
                <div class="performance-card">
                    <div class="stat-label">Correct Answers</div>
                    <div class="performance-value" id="totalCorrect">0</div>
                </div>
                <div class="performance-card">
                    <div class="stat-label">Accuracy</div>
                    <div class="performance-value" id="accuracy">0%</div>
                </div>
                <div class="performance-card">
                    <div class="stat-label">XP Earned</div>
                    <div class="performance-value">+50</div>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>

    <script>
        // Game State
        let currentRound = 0;
        let score = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        let currentQuestionIndex = 0;
        let roundAnswers = [];

        // RAID Level Definitions
        const raidLevels = {
            '0': {
                name: 'RAID 0',
                description: 'Striping - Maximum performance, no redundancy',
                minDisks: 2,
                usableCapacity: (diskCount, diskSize) => diskCount * diskSize,
                faultTolerance: 0,
                colors: ['#3b82f6', '#6366f1', '#8b5cf6', '#a855f7']

            '1': {
                name: 'RAID 1',
                description: 'Mirroring - 100% redundancy',

                usableCapacity: (diskCount, diskSize) => diskSize,

                colors: ['#22c55e', '#22c55e', '#10b981', '#10b981']
            },
            '5': {
                name: 'RAID 5',
                description: 'Striping with distributed parity',
                minDisks: 3,
                usableCapacity: (diskCount, diskSize) => (diskCount - 1) * diskSize,
                faultTolerance: 1,
                colors: ['#3b82f6', '#6366f1', '#f97316', '#3b82f6']
            },
            '6': {
                name: 'RAID 6',
                description: 'Striping with double parity',
                minDisks: 4,
                usableCapacity: (diskCount, diskSize) => (diskCount - 2) * diskSize,
                faultTolerance: 2,
                colors: ['#3b82f6', '#6366f1', '#f97316', '#f97316']
            },
            '10': {
                name: 'RAID 10',
                description: 'Mirrored stripes - Speed + redundancy',
                minDisks: 4,
                usableCapacity: (diskCount, diskSize) => (diskCount / 2) * diskSize,
                faultTolerance: 'Variable',
                colors: ['#22c55e', '#22c55e', '#10b981', '#10b981']
            },
            'JBOD': {
                name: 'JBOD',

        const rounds = [

            {

                diskCount: 12,
                diskSize: 1,
                diskUnit: 'TB',
                requirements: ["OS tier: RAID 1 (2 disks)", "Data tier: RAID 5 (4 disks)", "Backup tier: RAID 6 (6 disks)"],
                questions: [
                    {
                        type: 'calculation',
                        text: 'What is the usable capacity for the OS tier (RAID 1, 2×1TB)?',
                        options: ['2TB', '1TB', '0.5TB', '1.5TB'],
                        correct: '1TB'
                    },
                    {
                        type: 'calculation',
                        text: 'What is the usable capacity for the Data tier (RAID 5, 4×1TB)?',
                        options: ['4TB', '3TB', '2TB', '1TB'],
                        correct: '3TB'
                    },
                    {
                        type: 'calculation',
                        text: 'What is the usable capacity for the Backup tier (RAID 6, 6×1TB)?',
                        options: ['6TB', '5TB', '4TB', '3TB'],
                        correct: '4TB'
                    }
                ],
                correctRaid: '6'
            }
        ];

        // Initialize game
        function initGame() {
            currentRound = 0;
            score = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            startRound();
        }

        // Start a new round
        function startRound() {
            if (currentRound >= rounds.length) {
                endGame();
                return;
            }

            const round = rounds[currentRound];
            currentQuestionIndex = 0;
            roundAnswers = [];

            updateHeader();
            renderRound(round);
        }

        // Update header stats
        function updateHeader() {
            document.getElementById('roundDisplay').textContent = `${currentRound + 1}/10`;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('correctDisplay').textContent = `${correctAnswers}/${totalQuestions}`;
        }

        // Render current round
        function renderRound(round) {
            const gameArea = document.getElementById('gameArea');

            let html = `
                <div class="scenario-box">
                    <div class="scenario-title">
                        <span>Round ${currentRound + 1}: ${round.title}</span>
                    </div>
                    <div class="scenario-description">${round.description}</div>

                    <div style="margin: 20px 0;">
                        <strong style="color: #f97316;">Requirements:</strong>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            ${round.requirements.map(req => `<li>${req}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="disk-array" id="diskArray"></div>

                    <div id="questionContainer"></div>
                </div>
            `;

            gameArea.innerHTML = html;
            renderDiskArray(round);
            renderCurrentQuestion(round);
        }

        // Render disk array visualization
        function renderDiskArray(round) {
            const container = document.getElementById('diskArray');
            const colors = raidLevels[round.correctRaid].colors;

            let html = '';
            for (let i = 0; i < round.diskCount; i++) {
                const failed = round.failedDisks && round.failedDisks.includes(i) ? 'failed' : '';
                html += `
                    <div class="disk ${failed}">
                        <div class="disk-label">Disk ${i + 1}</div>
                        <div class="disk-size">${round.diskSize}${round.diskUnit}</div>
                        <div class="disk-stripes" id="stripes-${i}">
                            ${generateStripes(colors, i, round.correctRaid)}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Generate stripe visualization
        function generateStripes(colors, diskIndex, raidLevel) {
            let html = '';
            const stripeCount = 4;

            for (let i = 0; i < stripeCount; i++) {
                let color;
                if (raidLevel === '0') {
                    // RAID 0: alternating stripes
                    color = colors[i % colors.length];
                } else if (raidLevel === '1') {
                    // RAID 1: matching pairs
                    color = colors[diskIndex % 2 === 0 ? 0 : 1];
                } else if (raidLevel === '5') {
                    // RAID 5: distributed parity
                    color = (diskIndex + i) % 4 === 3 ? colors[2] : colors[i % 2];
                } else if (raidLevel === '6') {
                    // RAID 6: double parity
                    const isParity = (diskIndex + i) % 4 >= 2;
                    color = isParity ? colors[2] : colors[i % 2];
                } else if (raidLevel === '10') {
                    // RAID 10: mirrored pairs
                    color = colors[diskIndex % 2 === 0 ? 0 : 1];
                } else {
                    color = colors[diskIndex % colors.length];
                }

                html += `<div class="stripe" style="background: ${color};"></div>`;
            }

            return html;
        }

        // Render current question
        function renderCurrentQuestion(round) {
            const container = document.getElementById('questionContainer');
            const question = round.questions[currentQuestionIndex];

            let html = `
                <div class="question-box">
                    <div class="question-text">
                        Question ${currentQuestionIndex + 1}/${round.questions.length}: ${question.text}
                    </div>
            `;

            if (question.type === 'raid') {
                html += '<div class="raid-selector">';
                question.options.forEach(option => {
                    const raidKey = option.replace('RAID ', '');
                    const raid = raidLevels[raidKey];
                    html += `
                        <div class="raid-option" onclick="selectRaidAnswer('${option}')">
                            <div class="raid-label">${option}</div>
                            <div style="font-size: 0.9em; color: #888; margin: 10px 0;">${raid.description}</div>
                            <div class="raid-mini-diagram">
                                ${generateMiniDiagram(raidKey)}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<div class="answer-options">';
                question.options.forEach(option => {
                    html += `
                        <div class="answer-option" onclick="selectAnswer('${option}')">
                            ${option}
                        </div>
                    `;
                });
                html += '</div>';
            }

            html += `
                    <div id="feedback"></div>
                    <div class="btn-container">
                        <button class="btn" id="submitBtn" onclick="submitAnswer()" disabled>Submit Answer</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Generate mini RAID diagram
        function generateMiniDiagram(raidLevel) {
            const colors = raidLevels[raidLevel].colors;
            const diskCount = Math.min(4, raidLevels[raidLevel].minDisks);
            let html = '';

            for (let i = 0; i < diskCount; i++) {
                html += '<div class="mini-disk">';
                for (let j = 0; j < 3; j++) {
                    let color;
                    if (raidLevel === '0') {
                        color = colors[j % colors.length];
                    } else if (raidLevel === '1') {
                        color = colors[i % 2];
                    } else if (raidLevel === '5') {
                        color = (i + j) % 4 === 3 ? colors[2] : colors[j % 2];
                    } else if (raidLevel === '6') {
                        color = (i + j) % 4 >= 2 ? colors[2] : colors[j % 2];
                    } else if (raidLevel === '10') {
                        color = colors[i % 2];
                    } else {
                        color = colors[i % colors.length];
                    }
                    html += `<div class="mini-stripe" style="background: ${color};"></div>`;
                }
                html += '</div>';
            }

            return html;
        }

        // Select RAID answer
        let selectedAnswer = null;

        function selectRaidAnswer(answer) {
            selectedAnswer = answer;
            document.querySelectorAll('.raid-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.target.closest('.raid-option').classList.add('selected');
            document.getElementById('submitBtn').disabled = false;
        }

        // Select regular answer
        function selectAnswer(answer) {
            selectedAnswer = answer;
            document.querySelectorAll('.answer-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.target.classList.add('selected');
            document.getElementById('submitBtn').disabled = false;
        }

        // Submit answer
        function submitAnswer() {
            if (!selectedAnswer) return;

            const round = rounds[currentRound];
            const question = round.questions[currentQuestionIndex];
            const isCorrect = selectedAnswer === question.correct;

            totalQuestions++;
            if (isCorrect) {
                correctAnswers++;
                score += 100 * (currentRound + 1);
            }

            roundAnswers.push(isCorrect);

            // Disable all options after answering
            document.querySelectorAll('.raid-option, .answer-option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });

            showFeedback(isCorrect, question.correct);

            // Update button
            document.getElementById('submitBtn').textContent =
                currentQuestionIndex < round.questions.length - 1 ? 'Next Question' : 'Complete Round';
            document.getElementById('submitBtn').onclick = nextQuestion;
        }

        // Show feedback
        function showFeedback(isCorrect, correctAnswer) {
            const feedback = document.getElementById('feedback');
            const round = rounds[currentRound];

            // Find the selected option via its 'selected' class
            const selectedEl = document.querySelector('.raid-option.selected, .answer-option.selected');

            // Highlight correct/incorrect
            if (isCorrect) {
                if (selectedEl) selectedEl.classList.add('correct');
            } else {
                if (selectedEl) selectedEl.classList.add('incorrect');
                // Highlight correct answer
                const options = document.querySelectorAll('.raid-option, .answer-option');
                options.forEach(opt => {
                    if (opt.textContent.includes(correctAnswer)) {
                        opt.classList.add('correct');
                    }
                });
            }

            let html = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
            `;

            if (!isCorrect) {
                html += `<div>The correct answer is: <strong>${correctAnswer}</strong></div>`;
            }

            // Show calculation breakdown for capacity questions
            if (currentQuestionIndex === 1 && round.questions[1].type === 'calculation') {
                const raid = raidLevels[round.correctRaid];
                const usable = raid.usableCapacity(round.diskCount, round.diskSize);
                html += `
                    <div style="margin-top: 15px;">
                        <strong>Capacity Breakdown:</strong><br>
                        Total raw capacity: ${round.diskCount} × ${round.diskSize}${round.diskUnit} = ${round.diskCount * round.diskSize}${round.diskUnit}<br>
                        Usable capacity (${raid.name}): ${usable}${round.diskUnit}<br>
                        Overhead: ${round.diskCount * round.diskSize - usable}${round.diskUnit}
                    </div>
                `;
            }

            html += '</div>';
            feedback.innerHTML = html;

            updateHeader();
        }

        // Next question
        function nextQuestion() {
            const round = rounds[currentRound];
            currentQuestionIndex++;

            if (currentQuestionIndex >= round.questions.length) {
                // Round complete, move to next
                currentRound++;
                selectedAnswer = null;
                setTimeout(startRound, 1000);
            } else {
                // Next question in same round
                selectedAnswer = null;
                renderCurrentQuestion(round);
            }
        }

        // End game
        function endGame() {
            document.getElementById('gameArea').classList.add('hidden');
            const completionScreen = document.getElementById('completionScreen');
            completionScreen.classList.remove('hidden');

            document.getElementById('finalScore').textContent = score;
            document.getElementById('totalAnswered').textContent = totalQuestions;
            document.getElementById('totalCorrect').textContent = correctAnswers;
            document.getElementById('accuracy').textContent =
                Math.round((correctAnswers / totalQuestions) * 100) + '%';

            // Award XP
            if (!localStorage.getItem('game_raid_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_raid_xp_awarded', 'true');

                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    const uid = localStorage.getItem('hexworth_uid');
                    if (uid) FirestoreManager.addXP(uid, 50, 'RAID Calculator Complete');
                }
            }

            // Unlock achievement
            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_raid');
            }

            // Track game completion
            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('raid', { score: score, total: totalQuestions });
            }
        }

        // Start the game on load
        initGame();
    </script>
</body>
</html>
