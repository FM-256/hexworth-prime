<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../../../../components/AccessGuard.js"></script>
<script>AccessGuard.require('sorted');</script>
<script src="../../../../components/AchievementManager.js"></script>
<script src="../../../../components/ModuleProgress.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage Configurator | The Server Room | The Forge</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh;line-height:1.6}
.lab-container{max-width:900px;margin:0 auto;padding:1.5rem}
.lab-header{text-align:center;margin-bottom:2rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1) 0%,rgba(245,158,11,0.05) 100%);border-radius:16px;border:1px solid rgba(251,191,36,0.3)}
.lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.lab-subtitle{color:#9ca3af;font-size:.95rem}
.score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:1rem;font-size:.9rem;color:#fbbf24}
.score-bar .score-num{font-weight:700;font-size:1.3rem}
.progress-track{width:200px;height:6px;background:rgba(251,191,36,0.15);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:#fbbf24;transition:width .4s ease;border-radius:3px}
.question-card{background:rgba(30,30,40,0.6);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem;transition:all .3s ease}
.question-card.correct{border-color:#22c55e;background:rgba(34,197,94,0.08)}
.question-card.incorrect{border-color:#ef4444;background:rgba(239,68,68,0.08)}
.question-card.disabled{opacity:.7;pointer-events:none}
.q-number{font-size:.75rem;color:#fbbf24;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem}
.q-desc{font-size:1rem;color:#f1f5f9;margin-bottom:1rem;line-height:1.5}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.option-btn{padding:.6rem 1rem;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);border-radius:8px;color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s ease;text-align:left}
.option-btn:hover{border-color:rgba(251,191,36,0.5);background:rgba(251,191,36,0.12)}
.option-btn.correct-answer{border-color:#22c55e;background:rgba(34,197,94,0.15);color:#22c55e}
.option-btn.wrong-answer{border-color:#ef4444;background:rgba(239,68,68,0.1);color:#ef4444}
.feedback{margin-top:.8rem;padding:.6rem;border-radius:6px;font-size:.85rem;display:none}
.feedback.show{display:block}
.feedback.correct-fb{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac}
.feedback.incorrect-fb{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,0.15)}
.nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;font-weight:500;border:1px solid rgba(251,191,36,0.3);color:#fbbf24;background:rgba(251,191,36,0.08)}
.nav-btn:hover{background:rgba(251,191,36,0.15)}
.reset-btn{padding:.5rem 1rem;border-radius:6px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);color:#ef4444;cursor:pointer;font-size:.82rem}
#complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;font-size:.9rem;cursor:pointer;margin:1rem auto}
#complete-btn:hover{background:#4ade80}
@media(max-width:600px){.options{grid-template-columns:1fr}}</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Storage Configurator -- The Server Room</h1>
<div class="lab-container">
<div class="lab-header">
<div class="lab-title">Storage Configurator</div>
<div class="lab-subtitle">Select disk type, file system, RAID, and permissions for each scenario. 8 scenarios.</div>
<div class="score-bar"><span>Score: <span class="score-num" id="score">0</span> / 8</span>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<button class="reset-btn" onclick="resetLab()">Reset</button></div></div>
<div id="questions"></div>
<div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
<nav class="nav-buttons"><a href="../index.html" class="nav-btn">Back to The Server Room</a></nav>
</div>
<script>
const QUESTIONS=[{"desc": "New server boot volume, 4 TB disk, UEFI firmware.", "answer": "GPT + NTFS", "opts": ["GPT + NTFS", "MBR + NTFS", "GPT + ReFS", "MBR + ReFS"]}, {"desc": "Hyper-V host storing VHDX files. Data integrity and fast VHD creation matter.", "answer": "ReFS on Storage Spaces Mirror", "opts": ["ReFS on Storage Spaces Mirror", "NTFS on basic disk", "ReFS on basic disk", "NTFS on Storage Spaces Simple"]}, {"desc": "File server needing NTFS permissions, EFS encryption, and deduplication.", "answer": "NTFS with deduplication", "opts": ["NTFS with deduplication", "ReFS with dedup", "NTFS without dedup", "ReFS with EFS"]}, {"desc": "Archive server: max capacity from 8 drives, survive 1 disk failure.", "answer": "Storage Spaces Parity", "opts": ["Storage Spaces Parity", "Storage Spaces Mirror", "Storage Spaces Simple", "Storage Spaces Mirror (3-way)"]}, {"desc": "Database server: fastest storage with redundancy, 4 NVMe drives.", "answer": "Storage Spaces Mirror (two-way)", "opts": ["Storage Spaces Mirror (two-way)", "Storage Spaces Parity", "Storage Spaces Simple", "Single NVMe"]}, {"desc": "Branch offices need unified UNC path regardless of which server hosts data.", "answer": "DFS Namespaces + Replication", "opts": ["DFS Namespaces + Replication", "Standard SMB shares", "iSCSI target", "Storage Spaces Direct"]}, {"desc": "Failover cluster needs shared block storage over Ethernet. No SAN.", "answer": "iSCSI Target Server", "opts": ["iSCSI Target Server", "SMB file share", "DFS Replication", "Storage Spaces Simple"]}, {"desc": "Users consuming too much space. Enforce 5 GB limit per user folder.", "answer": "FSRM hard quota", "opts": ["FSRM hard quota", "NTFS compression", "ReFS quotas", "Deduplication"]}];
let score=0,answered=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuestions(){const c=document.getElementById('questions');c.innerHTML='';QUESTIONS.forEach((q,i)=>{const opts=shuffle([...q.opts]);const d=document.createElement('div');d.className='question-card';d.id='q'+i;d.innerHTML='<div class="q-number">Question '+(i+1)+' of 8</div><div class="q-desc">'+q.desc+'</div><div class="options">'+opts.map(o=>'<button class="option-btn" onclick="checkAnswer('+i+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="fb'+i+'"></div>';c.appendChild(d);});}
function checkAnswer(idx,btn){const card=document.getElementById('q'+idx);if(card.classList.contains('disabled'))return;card.classList.add('disabled');answered++;const correct=QUESTIONS[idx].answer;const fb=document.getElementById('fb'+idx);const buttons=card.querySelectorAll('.option-btn');buttons.forEach(b=>{if(b.textContent===correct)b.classList.add('correct-answer');});if(btn.textContent===correct){score++;card.classList.add('correct');fb.className='feedback show correct-fb';fb.textContent='Correct!';}else{btn.classList.add('wrong-answer');card.classList.add('incorrect');fb.className='feedback show incorrect-fb';fb.textContent='Incorrect. The answer is: '+correct;}document.getElementById('score').textContent=score;document.getElementById('progressFill').style.width=(answered/8*100)+'%';if(answered===8&&score>=6)document.getElementById('complete-btn').style.display='block';}
function resetLab(){score=0;answered=0;document.getElementById('score').textContent='0';document.getElementById('progressFill').style.width='0%';document.getElementById('complete-btn').style.display='none';buildQuestions();}
function completeModule(){if(typeof ModuleProgress!=='undefined')ModuleProgress.complete('forge','sr-w2-storage-lab',{returnUrl:'../index.html'});}
buildQuestions();
</script></body></html>
