<style>:root{--bg:#0a0e1a;--bg-card:#0f1625;--bg-option:#141d2e;--primary:#fbbf24;--primary-dim:rgba(251,191,36,0.15);--accent:#f59e0b;--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--border:rgba(255,255,255,0.08)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg) 0%,#0c1220 50%,#0e1828 100%);color:var(--text);min-height:100vh;line-height:1.6}.quiz-container{max-width:800px;margin:0 auto;padding:2rem}.nav-links{display:flex;gap:1.5rem;margin-bottom:1.5rem}.back-link{color:var(--primary);text-decoration:none;font-size:.9rem}.quiz-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--primary-dim)}.quiz-header h1{font-size:1.6rem;color:var(--primary);margin-bottom:.5rem}.quiz-header .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}.quiz-header .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem}.quiz-header .meta span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted)}.progress-bar-wrap{background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px}.progress-label{font-size:.85rem;color:var(--text-muted);white-space:nowrap}.progress-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .4s ease;width:0%}.score-label{font-size:.85rem;color:var(--primary);font-weight:600;white-space:nowrap}.question-card{background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem}.question-num{font-size:.8rem;color:var(--primary);font-weight:600;letter-spacing:.5px;margin-bottom:.75rem}.question-text{font-size:1.15rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}.option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem}.option:hover{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.05)}.option.correct{border-color:var(--success);background:rgba(34,197,94,0.1)}.option.incorrect{border-color:var(--danger);background:rgba(239,68,68,0.08)}.option.disabled{pointer-events:none;opacity:.7}.option.correct.disabled,.option.incorrect.disabled{opacity:1}.option-letter{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:.85rem;color:var(--primary);flex-shrink:0}.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}.option.incorrect .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}.feedback{padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:.9rem;line-height:1.6;display:none}.feedback.correct{display:block;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);color:#86efac}.feedback.incorrect{display:block;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}.quiz-nav{display:flex;justify-content:flex-end}.next-btn{padding:10px 24px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4);color:var(--primary);border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}.next-btn:hover{background:var(--primary);color:#1a1a2e}.next-btn:disabled{opacity:.3;cursor:not-allowed}.results-card{display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border)}.results-card h2{color:var(--primary);font-size:1.4rem;margin-bottom:1rem}.score-big{font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:.5rem}.score-big.low{color:var(--danger)}.score-big.mid{color:var(--primary)}.score-msg{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}.results-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.results-btns a,.results-btns button{padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;border:none}.btn-retry{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4)!important;color:var(--primary)}.btn-hub{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4)!important;color:var(--accent)}@media(max-width:640px){.quiz-container{padding:1rem}.question-card{padding:1.25rem}.quiz-header h1{font-size:1.3rem}}</style>

<body>
<div class="quiz-container">
<div class="nav-links"><a href="../index.html" class="back-link">&#8592; The Server Room Hub</a></div>
<div class="quiz-header"><h1>Quiz: Virtualization (Hyper-V)</h1><p class="subtitle">Hypervisors, VM config, switches, migration, replication</p>
<div class="meta"><span>Week 2</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS1328C</span></div></div>
<div class="progress-bar-wrap"><span class="progress-label" id="progressLabel">Question 1 of 15</span>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<span class="score-label" id="scoreLabel">Score: 0</span></div>
<div class="question-card" id="questionCard"><div class="question-num" id="questionNum">QUESTION 1</div>
<div class="question-text" id="questionText"></div><div class="options" id="optionsEl"></div>
<div class="feedback" id="feedback"></div>
<div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div></div>
<div class="results-card" id="resultsCard"><h2>Quiz Complete</h2><div class="score-big" id="finalScore"></div>
<p class="score-msg" id="scoreMsg"></p><div class="results-btns">
<button class="btn-retry" onclick="restartQuiz()">Try Again</button>
<a href="../index.html" class="btn-hub">Back to The Server Room</a></div></div></div>
<script>
var questions=[
            {
                        "q": "Hyper-V is which hypervisor type?",
                        "opts": [
                                    "Type 2",
                                    "Type 1",
                                    "Type 3",
                                    "Software emulator"
                        ],
                        "ans": 1,
                        "exp": "Type 1 bare-metal hypervisor running directly on hardware."
            },
            {
                        "q": "Gen 2 VMs boot with:",
                        "opts": [
                                    "BIOS",
                                    "UEFI + Secure Boot",
                                    "Both",
                                    "PXE only"
                        ],
                        "ans": 1,
                        "exp": "Gen 2 uses UEFI firmware with Secure Boot support."
            },
            {
                        "q": "Private virtual switch allows:",
                        "opts": [
                                    "VMs + host + physical",
                                    "VMs + host only",
                                    "VMs only (isolated)",
                                    "Physical network only"
                        ],
                        "ans": 2,
                        "exp": "Private switches: VM-to-VM only. No host or physical access."
            },
            {
                        "q": "Dynamic Memory allows:",
                        "opts": [
                                    "Sharing RAM",
                                    "Auto-adjust between min/max",
                                    "Unlimited RAM",
                                    "Overcommit without limits"
                        ],
                        "ans": 1,
                        "exp": "Dynamic Memory adjusts each VM's RAM between configured min and max."
            },
            {
                        "q": "VHDX max size?",
                        "opts": [
                                    "2 TB",
                                    "16 TB",
                                    "64 TB",
                                    "128 TB"
                        ],
                        "ans": 2,
                        "exp": "VHDX supports up to 64 TB per virtual disk."
            },
            {
                        "q": "Production checkpoints use:",
                        "opts": [
                                    "Memory capture",
                                    "VSS",
                                    "Full disk clone",
                                    "Freeze only"
                        ],
                        "ans": 1,
                        "exp": "VSS creates application-consistent snapshots without memory capture."
            },
            {
                        "q": "Live migration provides:",
                        "opts": [
                                    "Minutes of downtime",
                                    "Zero downtime",
                                    "Full restart",
                                    "30 sec downtime"
                        ],
                        "ans": 1,
                        "exp": "Sub-second pause during memory transfer."
            },
            {
                        "q": "Replica intervals?",
                        "opts": [
                                    "Real-time only",
                                    "30s, 5m, 15m",
                                    "1 hour min",
                                    "24 hours"
                        ],
                        "ans": 1,
                        "exp": "Hyper-V Replica: 30 seconds, 5 minutes, or 15 minutes."
            },
            {
                        "q": "Shielded VMs in which edition?",
                        "opts": [
                                    "Standard",
                                    "Datacenter only",
                                    "All",
                                    "Essentials"
                        ],
                        "ans": 1,
                        "exp": "Shielded VMs with Host Guardian Service are Datacenter-only."
            },
            {
                        "q": "Disable which integration service on DCs syncing externally?",
                        "opts": [
                                    "Heartbeat",
                                    "Data Exchange",
                                    "Time Sync",
                                    "Shutdown"
                        ],
                        "ans": 2,
                        "exp": "DCs should sync to external NTP, not Hyper-V host time."
            },
            {
                        "q": "Enable nested virtualization:",
                        "opts": [
                                    "Enable-NestedVM",
                                    "Set-VMProcessor -ExposeVirtualizationExtensions $true",
                                    "Enable-HyperV -Nested",
                                    "Set-VMFirmware -Nested"
                        ],
                        "ans": 1,
                        "exp": "ExposeVirtualizationExtensions must be $true."
            },
            {
                        "q": "External switch binds to:",
                        "opts": [
                                    "No NIC",
                                    "Physical NIC",
                                    "Virtual NIC only",
                                    "Loopback"
                        ],
                        "ans": 1,
                        "exp": "External binds to a physical NIC for physical network access."
            },
            {
                        "q": "Storage migration moves:",
                        "opts": [
                                    "VM disks while running",
                                    "Only stopped VMs",
                                    "Hypervisor",
                                    "VM clones"
                        ],
                        "ans": 0,
                        "exp": "Storage migration moves VHDX files while VM continues running."
            },
            {
                        "q": "Create new VM command:",
                        "opts": [
                                    "Add-VM",
                                    "Create-VM",
                                    "New-VM",
                                    "Install-VM"
                        ],
                        "ans": 2,
                        "exp": "New-VM creates a new virtual machine."
            },
            {
                        "q": "CPU weight determines:",
                        "opts": [
                                    "Max vCPUs",
                                    "Priority when contended",
                                    "Clock speed",
                                    "Host core usage"
                        ],
                        "ans": 1,
                        "exp": "Higher weight = more CPU when multiple VMs compete."
            }
];
var current=0,score=0,answered=false,TOTAL=questions.length;
function loadQuestion(){var q=questions[current];document.getElementById('questionNum').textContent='QUESTION '+(current+1);document.getElementById('progressLabel').textContent='Question '+(current+1)+' of '+TOTAL;document.getElementById('progressFill').style.width=((current+1)/TOTAL*100)+'%';document.getElementById('questionText').innerHTML=q.q;var html='',letters=['A','B','C','D'];for(var i=0;i<q.opts.length;i++)html+='<div class="option" onclick="selectAnswer('+i+')"><span class="option-letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></div>';document.getElementById('optionsEl').innerHTML=html;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;answered=false;}
function selectAnswer(idx){if(answered)return;answered=true;var q=questions[current],opts=document.querySelectorAll('.option');for(var i=0;i<opts.length;i++){opts[i].classList.add('disabled');if(i===q.ans)opts[i].classList.add('correct');else if(i===idx)opts[i].classList.add('incorrect');}var fb=document.getElementById('feedback');if(idx===q.ans){score++;fb.className='feedback correct';fb.textContent='Correct! '+q.exp;}else{fb.className='feedback incorrect';fb.textContent='Incorrect. '+q.exp;}document.getElementById('scoreLabel').textContent='Score: '+score;document.getElementById('nextBtn').disabled=false;if(current===TOTAL-1)document.getElementById('nextBtn').textContent='See Results';}
function nextQuestion(){current++;if(current>=TOTAL){showResults();return;}loadQuestion();}
function showResults(){document.getElementById('questionCard').style.display='none';document.querySelector('.progress-bar-wrap').style.display='none';var rc=document.getElementById('resultsCard');rc.style.display='block';var pct=Math.round((score/TOTAL)*100),sb=document.getElementById('finalScore');sb.textContent=score+'/'+TOTAL+' ('+pct+'%)';if(pct>=80)sb.className='score-big';else if(pct>=70)sb.className='score-big mid';else sb.className='score-big low';var msg='';if(pct>=90)msg='Excellent! Strong mastery.';else if(pct>=70)msg='Good work -- you passed.';else if(pct>=50)msg='Close. Revisit the presentation.';else msg='More study needed.';document.getElementById('scoreMsg').textContent=msg;if(pct>=70&&typeof ModuleProgress!=='undefined')ModuleProgress.completeQuiz('forge','sr-w2-virtual-quiz',score);}
function restartQuiz(){current=0;score=0;answered=false;document.getElementById('scoreLabel').textContent='Score: 0';document.getElementById('questionCard').style.display='';document.querySelector('.progress-bar-wrap').style.display='';document.getElementById('resultsCard').style.display='none';document.getElementById('nextBtn').textContent='Next Question';loadQuestion();}
loadQuestion();
</script></body></html>
