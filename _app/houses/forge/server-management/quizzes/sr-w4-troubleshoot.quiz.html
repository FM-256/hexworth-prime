<style>:root{--bg:#0a0e1a;--bg-card:#0f1625;--bg-option:#141d2e;--primary:#fbbf24;--primary-dim:rgba(251,191,36,0.15);--accent:#f59e0b;--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--border:rgba(255,255,255,0.08)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg) 0%,#0c1220 50%,#0e1828 100%);color:var(--text);min-height:100vh;line-height:1.6}.quiz-container{max-width:800px;margin:0 auto;padding:2rem}.nav-links{display:flex;gap:1.5rem;margin-bottom:1.5rem}.back-link{color:var(--primary);text-decoration:none;font-size:.9rem}.quiz-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--primary-dim)}.quiz-header h1{font-size:1.6rem;color:var(--primary);margin-bottom:.5rem}.quiz-header .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}.quiz-header .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem}.quiz-header .meta span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted)}.progress-bar-wrap{background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px}.progress-label{font-size:.85rem;color:var(--text-muted);white-space:nowrap}.progress-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .4s ease;width:0%}.score-label{font-size:.85rem;color:var(--primary);font-weight:600;white-space:nowrap}.question-card{background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem}.question-num{font-size:.8rem;color:var(--primary);font-weight:600;letter-spacing:.5px;margin-bottom:.75rem}.question-text{font-size:1.15rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}.option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem}.option:hover{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.05)}.option.correct{border-color:var(--success);background:rgba(34,197,94,0.1)}.option.incorrect{border-color:var(--danger);background:rgba(239,68,68,0.08)}.option.disabled{pointer-events:none;opacity:.7}.option.correct.disabled,.option.incorrect.disabled{opacity:1}.option-letter{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:.85rem;color:var(--primary);flex-shrink:0}.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}.option.incorrect .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}.feedback{padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:.9rem;line-height:1.6;display:none}.feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct{display:block;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);color:#86efac}.feedback.incorrect{display:block;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}.quiz-nav{display:flex;justify-content:flex-end}.next-btn{padding:10px 24px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4);color:var(--primary);border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}.next-btn:hover{background:var(--primary);color:#1a1a2e}.next-btn:disabled{opacity:.3;cursor:not-allowed}.results-card{display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border)}.results-card h2{color:var(--primary);font-size:1.4rem;margin-bottom:1rem}.score-big{font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:.5rem}.score-big.low{color:var(--danger)}.score-big.mid{color:var(--primary)}.score-msg{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}.results-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.results-btns a,.results-btns button{padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;border:none}.btn-retry{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4)!important;color:var(--primary)}.btn-hub{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4)!important;color:var(--accent)}@media(max-width:640px){.quiz-container{padding:1rem}.question-card{padding:1.25rem}.quiz-header h1{font-size:1.3rem}}.review-q{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem;text-align:left}.review-q-num{font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--text-muted);margin-bottom:.4rem;display:flex;align-items:center;gap:8px}.review-mark{font-size:.68rem;padding:2px 8px;border-radius:3px;letter-spacing:.12em}.review-mark.right{background:rgba(34,197,94,0.18);color:#6ee7b7}.review-mark.wrong{background:rgba(239,68,68,0.18);color:#fca5a5}.review-q-text{font-size:.95rem;color:var(--text);margin-bottom:.7rem;line-height:1.5}.review-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:.7rem}.review-opt{padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:6px;font-size:.86rem;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.review-opt.correct{background:rgba(34,197,94,0.10);border-color:rgba(34,197,94,0.45)}.review-opt.incorrect{background:rgba(239,68,68,0.10);border-color:rgba(239,68,68,0.45)}.review-tag{font-size:.7rem;padding:2px 7px;border-radius:3px;font-style:italic;margin-left:auto}.review-tag.right-tag{background:rgba(34,197,94,0.20);color:#6ee7b7}.review-tag.wrong-tag{background:rgba(239,68,68,0.20);color:#fca5a5}.review-exp{font-size:.85rem;color:var(--text-muted);line-height:1.5;padding:8px 12px;background:rgba(251,191,36,0.04);border-left:2px solid var(--primary);border-radius:0 6px 6px 0}.review-exp strong{color:var(--primary)}</style>

<body>
<div class="quiz-container">
<div class="nav-links"><a href="../index.html" class="back-link">&#8592; The Server Room Hub</a></div>
<div class="quiz-header"><h1>Quiz: Troubleshooting and Documentation</h1><p class="subtitle">Boot failures, BSOD, performance, runbooks, change management</p>
<div class="meta"><span>Week 4</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS1328C</span></div></div>
<div class="progress-bar-wrap"><span class="progress-label" id="progressLabel">Question 1 of 15</span>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<span class="score-label" id="scoreLabel">Score: 0</span></div>
<div class="question-card" id="questionCard"><div class="question-num" id="questionNum">QUESTION 1</div>
<div class="question-text" id="questionText"></div><div class="options" id="optionsEl"></div>
<div class="feedback" id="feedback"></div>
<div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div></div>
<div class="results-card" id="resultsCard"><h2>Quiz Complete</h2><div class="score-big" id="finalScore"></div>
<p class="score-msg" id="scoreMsg"></p><div class="results-btns">
<button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
<a href="../index.html" class="btn-hub">Return to Hub</a></div></div>
<div class="results-card" id="reviewCard" style="display:none;"><h2>Review Your Answers</h2><div id="reviewBody"></div><div class="results-btns"><button class="btn-retry" onclick="backToScore()">Back to Score</button><a href="../index.html" class="btn-hub">Return to Hub</a></div></div></div>
<script>
var questions=[{"q":"First troubleshooting step:","opts":["Test theory","Identify the problem","Document","Implement"],"exp":"Step 1: Identify the problem -- gather symptoms, changes, scope."},{"q":"KERNEL_DATA_INPAGE_ERROR indicates:","opts":["CPU overheat","Disk read failure","Low RAM","Network issue"],"exp":"Windows could not read a page from disk. Check disk health."},{"q":"Rebuild BCD command:","opts":["sfc /scannow","bootrec /rebuildbcd","chkdsk /r","diskpart clean"],"exp":"bootrec /rebuildbcd scans for and rebuilds the boot configuration."},{"q":"Event ID 7036:","opts":["Failed logon","Service state change","Disk failure","Shutdown"],"exp":"Records service transitions between running and stopped."},{"q":"Server at 100% CPU -- first step:","opts":["Add cores","Check which process is consuming CPU","Reboot","Replace CPU"],"exp":"Identify the consuming process before taking action."},{"q":"Runbook purpose:","opts":["Marketing","Step-by-step incident response procedures","Onboarding","Financial"],"exp":"Runbooks ensure consistent response regardless of who is on call."},{"q":"Every change needs:","opts":["Marketing plan","Rollback plan","Social media post","Budget increase"],"exp":"Rollback plans are mandatory for every change."},{"q":"Safe Mode loads:","opts":["All drivers","Essential drivers/services only","No drivers","Network only"],"exp":"Minimal drivers for troubleshooting third-party issues."},{"q":"Test-NetConnection tests:","opts":["DNS zones","TCP connectivity to a port","AD replication","Disk performance"],"exp":"Test-NetConnection -ComputerName host -Port N tests TCP."},{"q":"CAB stands for:","opts":["Computer Automated Backup","Change Advisory Board","Config Audit Bureau","Cluster Availability Baseline"],"exp":"CAB reviews and approves changes before implementation."},{"q":"Memory dumps analyzed with:","opts":["Task Manager","WinDbg","PerfMon","Event Viewer"],"exp":"WinDbg + !analyze -v identifies the faulting module."},{"q":"netstat -ano shows:","opts":["Connections, ports, PIDs","DNS cache","Routing only","NIC drivers"],"exp":"Active connections, listening ports, and owning process IDs."},{"q":"Network docs should include:","opts":["IP addresses only","Physical/logical diagrams, IP schemes, inventory","Marketing","User passwords"],"exp":"Comprehensive topology, IP plans, VLANs, firewall rules."},{"q":"Service error 1067 -- first check:","opts":["Dependencies and app logs","Network cable","Disk space","Windows Update"],"exp":"Error 1067 means process terminated. Check dependencies first."},{"q":"Auto Repair loop after update:","opts":["Wait forever","Boot WinRE, uninstall last update","Replace motherboard","Reinstall all apps"],"exp":"WinRE > Troubleshoot > Uninstall Updates removes the bad patch."}];
var current=0,score=0,answered=false,TOTAL=questions.length,userAnswers=[]; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)
function loadQuestion(){var q=questions[current];document.getElementById('questionNum').textContent='QUESTION '+(current+1);document.getElementById('progressLabel').textContent='Question '+(current+1)+' of '+TOTAL;document.getElementById('progressFill').style.width=((current+1)/TOTAL*100)+'%';document.getElementById('questionText').innerHTML=q.q;var html='',letters=['A','B','C','D'];for(var i=0;i<q.opts.length;i++)html+='<div class="option" onclick="selectAnswer('+i+')"><span class="option-letter">'+letters[i]+'</span><span>'+q.opts[i]+'</span></div>';document.getElementById('optionsEl').innerHTML=html;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;answered=false;}
var QUIZ_ID = 'sr-w4-troubleshoot-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { r = (r && r.data) ? r.data : r;
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer! ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct! ' : 'Incorrect! ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }
function nextQuestion(){current++;if(current>=TOTAL){showResults();return;}loadQuestion();}
function showResults(){document.getElementById('questionCard').style.display='none';document.querySelector('.progress-bar-wrap').style.display='none';var rc=document.getElementById('resultsCard');rc.style.display='block';var pct=Math.round((score/TOTAL)*100),sb=document.getElementById('finalScore');sb.textContent=score+'/'+TOTAL+' ('+pct+'%)';if(pct>=80)sb.className='score-big';else if(pct>=70)sb.className='score-big mid';else sb.className='score-big low';var msg='';if(pct>=90)msg='Excellent! Strong mastery.';else if(pct>=70)msg='Good work -- you passed.';else if(pct>=50)msg='Close. Revisit the presentation.';else msg='More study needed.';document.getElementById('scoreMsg').textContent=msg;if(pct>=70&&typeof ModuleProgress!=='undefined'){try{ModuleProgress.completeQuiz('forge','sr-w4-troubleshoot-quiz',pct,{returnToDashboard:false});}catch(e){console.warn('[sr-w4-troubleshoot-quiz] ModuleProgress.completeQuiz failed:',e);}}}
function restartQuiz(){current=0;score=0;answered=false;document.getElementById('scoreLabel').textContent='Score: 0';document.getElementById('questionCard').style.display='';document.querySelector('.progress-bar-wrap').style.display='';document.getElementById('resultsCard').style.display='none';document.getElementById('nextBtn').textContent='Next Question';loadQuestion();}
function showReviewAnswers(){document.getElementById('resultsCard').style.display='none';var rc=document.getElementById('reviewCard');rc.style.display='block';window.scrollTo({top:0,behavior:'smooth'});var letters=['A','B','C','D'],html='';for(var i=0;i<questions.length;i++){var q=questions[i],picked=userAnswers[i],correct=revealedAnswers[i],isRight=picked===correct;html+='<div class="review-q"><div class="review-q-num">Q'+(i+1)+' '+(isRight?'<span class="review-mark right">CORRECT</span>':'<span class="review-mark wrong">INCORRECT</span>')+'</div><div class="review-q-text">'+q.q+'</div><div class="review-opts">';for(var j=0;j<q.opts.length;j++){var cls='review-opt';if(j===correct)cls+=' correct';if(j===picked&&picked!==correct)cls+=' incorrect';html+='<div class="'+cls+'"><span class="option-letter">'+letters[j]+'</span> '+q.opts[j];if(j===picked&&j===correct)html+=' <span class="review-tag right-tag">your answer &bull; correct</span>';else if(j===picked)html+=' <span class="review-tag wrong-tag">your answer</span>';else if(j===correct)html+=' <span class="review-tag right-tag">correct answer</span>';html+='</div>';}html+='</div>';if(q.exp)html+='<div class="review-exp"><strong>Why:</strong> '+q.exp+'</div>';html+='</div>';}document.getElementById('reviewBody').innerHTML=html;}
function backToScore(){document.getElementById('reviewCard').style.display='none';document.getElementById('resultsCard').style.display='block';}
loadQuestion();
</script>

</body></html>
