  categories: [

    // ═══════════════════════════════════════════════════════════════════════
    // CATEGORY 1: Apps & Updates (M07)

    {

            'General Availability Channel (Semi-Annual)',
            'Windows Insider Preview Channel',
            'Rapid Deployment Channel'
          ],
          correct: 1,
          explanation: 'The General Availability Channel (formerly Semi-Annual Channel) releases feature updates approximately twice per year. LTSC is designed for specialized systems (kiosks, medical devices) that require long-term stability and only receives security updates for up to 10 years — it cannot install Microsoft Store apps by default.'
        },
        {
          value: 200,
          question: 'A technician needs to deploy a legacy .MSI application to 50 workstations without user interaction. Which msiexec switch combination achieves a silent install with no UI?',
          options: [
            'msiexec /i app.msi /quiet /norestart',
            'msiexec /x app.msi /silent',
            'msiexec /a app.msi /passive',
            'msiexec /install app.msi /s'
          ],
          correct: 0,
          explanation: 'msiexec /i installs the package, /quiet suppresses all UI (no dialogs, no progress bar), and /norestart prevents an automatic reboot. The /passive flag shows a minimal progress bar but still some UI. /x is for uninstall, and /a performs an administrative install to a network share.'
        },
        {
          value: 300,
          question: 'A developer wants to install an MSIX app package on a Windows 10 Pro machine that was NOT downloaded from the Microsoft Store. The installation fails with a trust error. What must be enabled first?',
          options: [
            'Windows Subsystem for Linux',
            'Developer Mode or a trusted sideloading policy',
            'Hyper-V virtualization',
            'Windows Sandbox'
          ],
          correct: 1,
          explanation: 'Sideloading MSIX/AppX packages (installing outside the Store) requires either Developer Mode (Settings > Update & Security > For Developers) or a Group Policy that enables sideloading. The package\'s signing certificate must also be trusted on the device. Without this, Windows blocks the install to protect against unsigned code.'
        },
        {
          value: 400,
          question: 'Your organization uses WSUS to manage updates. Users report that large Windows updates are saturating the WAN link between branch offices and HQ. Which Windows 10 feature should you configure to allow branch PCs to share update content with each other over the LAN?',
          options: [
            'Windows Update for Business (WUfB) deferral rings',
            'Delivery Optimization in LAN mode (peering)',
            'BranchCache in Hosted Cache mode',
            'Background Intelligent Transfer Service (BITS) throttling'

          correct: 1,
          explanation: 'Delivery Optimization (DO) is the built-in P2P update distribution feature in Windows 10/11. When set to LAN mode, PCs on the same subnet share downloaded update content with each other, dramatically reducing WAN traffic. BranchCache also helps but requires a server component. WUfB controls timing, not bandwidth. BITS throttling slows downloads but doesn\'t eliminate the WAN traffic.'
        },
        {
          value: 500,
          question: 'A financial institution runs Windows 10 LTSC 2019 on trading terminals. The IT team wants to add a feature update to get a newer OS capability. What is the correct approach?',
          options: [
            'Run Windows Update and select the feature update manually',
            'Use Windows Update for Business to enroll in the Semi-Annual Channel',
            'Deploy a new LTSC baseline image — LTSC machines cannot receive feature updates in-place',
            'Enable the Windows Insider Program for the device'
          ],
          correct: 2,
          explanation: 'LTSC is a static release — it does NOT receive feature updates through Windows Update. To move to a newer LTSC version (e.g., LTSC 2019 to LTSC 2021), you must deploy a new image or perform an in-place upgrade using installation media. This is by design: LTSC is for environments that require a frozen, stable OS with no feature churn. This is a common exam gotcha distinguishing LTSC from GA Channel.'
        }

    // ═══════════════════════════════════════════════════════════════════════
    // CATEGORY 2: Threat Protection (M08)
    // Topics: malware types, Defender AV, BitLocker/TPM, Windows Firewall,
    //         ASR, SmartScreen
    // ═══════════════════════════════════════════════════════════════════════
    {
      name: 'Threat Protection',
      questions: [
        {
          value: 100,
          question: 'Which type of malware encrypts user files and demands payment for the decryption key?',
          options: [
            'Rootkit',
            'Worm',
            'Ransomware',
            'Trojan'
          ],
          correct: 2,
          explanation: 'Ransomware encrypts victim files (documents, images, databases) and presents a ransom demand for the decryption key. Notable examples include WannaCry and NotPetya. A rootkit hides malware at the OS/kernel level. A worm self-replicates across networks. A trojan disguises itself as legitimate software but doesn\'t encrypt files by itself.'
        },
        {
          value: 200,
          question: 'BitLocker is enabled on a laptop using TPM 1.2. The IT department applies a firmware (BIOS/UEFI) update overnight. What will happen when the user tries to boot the next morning?',
          options: [
            'The system boots normally — BitLocker only triggers on disk changes',
            'BitLocker enters recovery mode and prompts for the 48-digit recovery key',
            'Windows automatically disables BitLocker before firmware updates',
            'The system will BSOD with INACCESSIBLE_BOOT_DEVICE'
          ],
          correct: 1,
          explanation: 'The TPM measures the pre-boot environment (BIOS version, boot order, Secure Boot state) and stores these measurements as PCR (Platform Configuration Register) values. A BIOS/firmware update changes these measurements, causing the TPM to detect a "changed environment" and withhold the decryption key — triggering BitLocker Recovery Mode. This is expected, correct behavior. Always suspend BitLocker (not disable) before applying firmware updates to avoid this.'
        },
        {
          value: 300,
          question: 'A user downloads an executable from the internet. Windows SmartScreen blocks it with a warning. The file is known to be safe (internally developed tool). What is the correct way for an administrator to allow it to run?',
          options: [
            'Disable SmartScreen entirely in Windows Security',
            'Right-click the file, open Properties, and click Unblock on the General tab',
            'Add the file to the Windows Firewall exclusion list',
            'Run the file from an elevated Command Prompt'
          ],
          correct: 1,
          explanation: 'Files downloaded from the internet receive an Alternate Data Stream (ADS) tag called Zone.Identifier marking them as "Internet Zone." SmartScreen uses this tag. The fix is to right-click > Properties > General tab > click the "Unblock" checkbox. This removes the ADS tag. Disabling SmartScreen removes protection for all files. Firewall exclusions control network traffic, not file execution. Running as admin doesn\'t remove the zone tag.'
        },
        {
          value: 400,
          question: 'Which Windows Defender feature uses rules to block specific behaviors commonly used in malware attacks — such as Office applications spawning child processes or scripts launching executables — regardless of whether antivirus signatures exist for the threat?',
          options: [
            'Windows Defender Firewall with Advanced Security',
            'Attack Surface Reduction (ASR) rules',
            'Microsoft Defender SmartScreen',
            'Controlled Folder Access'
          ],
          correct: 1,
          explanation: 'Attack Surface Reduction (ASR) rules are behavior-based controls that block attack techniques at the process/behavior level, not signature level. Example rules: "Block Office applications from creating child processes," "Block execution of potentially obfuscated scripts," "Block Win32 API calls from Office macros." This stops zero-day attacks and living-off-the-land techniques that have no AV signature yet. ASR requires Microsoft Defender AV to be the active antivirus.'
        },
        {
          value: 500,
          question: 'A Windows 10 laptop has BitLocker enabled with TPM + PIN. A user reports that after adding RAM (a hardware change), BitLocker entered recovery mode. However, RAM changes should NOT affect TPM PCR values. What is the most likely actual cause of the recovery trigger?',
          options: [
            'The RAM upgrade changed the UEFI boot order measured in PCR[4]',
            'The technician accidentally changed the Secure Boot configuration or BIOS settings while installing RAM, altering measured PCR values',
            'BitLocker always triggers recovery after any hardware modification',
            'The additional RAM exceeded the TPM memory allocation limit'
          ],
          correct: 1,
          explanation: 'RAM itself is not measured by the TPM, so RAM changes alone should not trigger BitLocker recovery. The most likely cause is that the technician inadvertently changed BIOS/UEFI settings (boot order, Secure Boot, CSM/Legacy mode) while accessing the system to install the RAM. Any change to measured PCR values — including BIOS configuration, Secure Boot state, or boot path — will cause recovery. This scenario tests understanding of WHAT the TPM actually measures vs. what it does not.'
        }
      ]
    },

    // ═══════════════════════════════════════════════════════════════════════
    // CATEGORY 3: Support Environment (M09)
    // Topics: troubleshooting methodology, Windows architecture (kernel/user
    //         mode, boot sequence), Event Viewer, Performance Monitor,
    //         Reliability Monitor, WinRE, System Restore, Safe Mode
    // ═══════════════════════════════════════════════════════════════════════
    {
      name: 'Support Environment',
      questions: [
        {
          value: 100,
          question: 'According to the CompTIA/Microsoft troubleshooting methodology, what is the FIRST step when a user reports a problem?',
          options: [
            'Establish a theory of probable cause',
            'Identify the problem by gathering information and questioning the user',
            'Test the theory to determine cause',
            'Implement the solution and verify full system functionality'
          ],
          correct: 1,
          explanation: 'The official CompTIA 6-step troubleshooting methodology always begins with "Identify the problem" — gather information, ask the user what changed, replicate the issue, and document symptoms. Jumping to theories before understanding the problem leads to wasted effort. The full order is: 1) Identify, 2) Establish theory, 3) Test theory, 4) Plan of action, 5) Implement, 6) Document.'
        },
        {
          value: 200,
          question: 'A Windows 10 system boots but runs extremely slowly. You want to check which processes are consuming the most CPU over a 10-minute period and save that data as a log. Which tool is best suited for this?',
          options: [
            'Task Manager (Performance tab)',
            'Resource Monitor',
            'Performance Monitor (perfmon) with a Data Collector Set',
            'Reliability Monitor'
          ],
          correct: 2,
          explanation: 'Performance Monitor (perfmon.exe) with a Data Collector Set is the correct tool for sustained, logged performance data. You configure counters (CPU, memory, disk I/O), set a duration, and it saves results as .blg or .csv files for later analysis. Task Manager and Resource Monitor show real-time snapshots but don\'t save historical logs. Reliability Monitor shows stability history (crashes, installs) but not performance metrics.'
        },
        {
          value: 300,
          question: 'A user\'s Windows 10 PC shows a critical error in Event Viewer under Windows Logs > System. The Event ID is 41, Source: Kernel-Power. What does this typically indicate?',
          options: [
            'A Windows Update failed to install',
            'The system shut down unexpectedly without a clean shutdown (e.g., power loss or BSOD)',
            'A driver failed to load during startup',
            'The Windows license has expired'
          ],
          correct: 1,
          explanation: 'Event ID 41, Source Kernel-Power is the "Unexpected Shutdown" event. It logs whenever Windows restarts or powers off without completing a normal shutdown sequence — meaning the system lost power, experienced a BSOD, or was hard-reset. This is a critical first clue during BSOD or random restart investigations. It\'s written on the NEXT boot, capturing the fact that the previous session ended abnormally.'
        },
        {
          value: 400,
          question: 'A technician boots a Windows 10 PC into Safe Mode with Networking to troubleshoot a suspected driver issue. In Safe Mode, which type of drivers are loaded?',
          options: [
            'All drivers, including third-party drivers, but with networking disabled',
            'Only Microsoft-signed drivers; third-party drivers are blocked',
            'Only a minimal set of essential drivers (keyboard, mouse, display, storage) needed to start Windows',
            'No drivers are loaded — Safe Mode uses the Windows PE environment'
          ],
          correct: 2,
          explanation: 'Safe Mode loads only the minimum set of drivers required for Windows to start: basic display (VGA 800x600), keyboard, mouse, and essential storage drivers. Third-party drivers — including GPU drivers, audio, network (in plain Safe Mode), and most hardware drivers — are NOT loaded. This isolation helps confirm whether a third-party driver is causing instability. "Safe Mode with Networking" adds the minimal network drivers on top of this baseline.'
        },
        {
          value: 500,
          question: 'You need to access Windows Recovery Environment (WinRE) on a machine that will not boot into Windows at all and has no installation media available. Assuming WinRE is intact on the drive, which method allows you to access it?',
          options: [
            'Press F8 during POST to access the legacy recovery menu',
            'Force three consecutive failed boots — Windows automatically boots into WinRE after repeated failures',
            'Boot from a USB drive with Windows 10 media and select Repair your computer',
            'Both B and C are valid methods'
          ],
          correct: 3,
          explanation: 'Both methods work. Modern Windows 10/11 detects consecutive failed boots (typically 2-3) and automatically boots into WinRE — this is the Automatic Repair / Startup Repair trigger. You can also boot from Windows installation media (USB/DVD) and select "Repair your computer" to access WinRE tools: Startup Repair, System Restore, Command Prompt, System Image Recovery, and Go back. Note: F8 does NOT work by default on UEFI systems due to fast boot — it was a legacy BIOS feature.'
        }
      ]
    },

    // ═══════════════════════════════════════════════════════════════════════
    // CATEGORY 4: Troubleshoot OS & Apps (M10)
    // Topics: Previous Versions/VSS, Recycle Bin recovery, app compatibility
    //         mode, Program Compatibility Troubleshooter, bootrec, bcdedit,
    //         sc config syntax, DISM/SFC order
    // ═══════════════════════════════════════════════════════════════════════
    {
      name: 'Troubleshoot OS & Apps',
      questions: [
        {
          value: 100,
          question: 'A user accidentally deleted an important Word document. It is not in the Recycle Bin. Shadow copies are enabled. Which feature allows recovery of a previous version of the file directly from File Explorer?',
          options: [
            'OneDrive Version History',
            'Previous Versions (Volume Shadow Copy Service)',
            'Windows Backup and Restore (Windows 7)',
            'File History'
          ],
          correct: 1,
          explanation: 'Right-clicking a folder in File Explorer and selecting "Previous Versions" exposes snapshots created by the Volume Shadow Copy Service (VSS). Users can browse and restore individual files from shadow copies without admin tools. File History is a separate backup feature that requires a configured backup destination. OneDrive requires the file to have been synced. This "Previous Versions" tab is powered by VSS snapshots created by System Restore and automated scheduled tasks.'
        },
        {
          value: 200,
          question: 'A technician needs to configure a Windows service called "wuauserv" to start automatically using the command line. Which command is syntactically correct?',
          options: [
            'sc config wuauserv start=auto',
            'sc config wuauserv start =auto',
            'sc config wuauserv start= auto',
            'sc config wuauserv /start:auto'
          ],
          correct: 2,
          explanation: 'This is one of the most commonly tested syntax gotchas: sc config requires a SPACE AFTER the equals sign, NOT before it. The correct syntax is: sc config wuauserv start= auto (space after =, before the value). "start=auto" with no space will fail. "start =auto" (space before =) will also fail. This trips up candidates who expect standard "key=value" syntax. The same rule applies to other sc config parameters like type= and obj=.'
        },
        {
          value: 300,
          question: 'A Windows 10 user runs a legacy application written for Windows XP. The application installs but crashes on launch. What is the FIRST tool to try to make the application run correctly?',
          options: [
            'Run the application as Administrator',
            'Use the Program Compatibility Troubleshooter or manually set Compatibility Mode to Windows XP SP3',
            'Reinstall the application using msiexec /a',
            'Enable Windows Subsystem for Linux'
          ],
          correct: 1,
          explanation: 'The Program Compatibility Troubleshooter (right-click the .exe > Troubleshoot compatibility) automatically tests different compatibility settings and applies the best ones. You can also manually set Compatibility Mode (right-click > Properties > Compatibility tab > "Run this program in compatibility mode for: Windows XP SP3"). This adjusts the Windows API version reported to the application. Running as admin may help separately if the app needs elevated access, but compatibility mode addresses the "XP-era API" problem first.'
        },
        {
          value: 400,
          question: 'After a failed Windows Update, a PC will not boot. You access WinRE Command Prompt and need to repair the Master Boot Record. Which bootrec command specifically rewrites the MBR code without touching the partition table?',
          options: [
            'bootrec /fixboot',
            'bootrec /rebuildbcd',
            'bootrec /fixmbr',
            'bootrec /scanos'
          ],
          correct: 2,
          explanation: 'bootrec /fixmbr writes a new MBR (Master Boot Record) code to the system partition while preserving the existing partition table — the safest first step. bootrec /fixboot writes a new boot sector to the system partition (fixes the VBR/Volume Boot Record, not the MBR). bootrec /rebuildbcd scans all disks for Windows installations and rebuilds the Boot Configuration Data store. bootrec /scanos just lists detected Windows installations. Order for maximum repair: /fixmbr > /fixboot > /rebuildbcd.'
        },
        {
          value: 500,
          question: 'A user reports that sfc /scannow finds corrupt system files but cannot repair them, reporting "Windows Resource Protection found corrupt files but was unable to fix some of them." What is the CORRECT next step?',
          options: [
            'Run sfc /scannow again — it will succeed on the second attempt',
            'Run DISM /Online /Cleanup-Image /RestoreHealth first to repair the component store, then run sfc /scannow again',
            'Run chkdsk /f /r to fix disk errors, then reinstall Windows',
            'Boot into Safe Mode and run sfc /scannow from there'
          ],
          correct: 1,
          explanation: 'This is a critical exam sequence: DISM before SFC. When SFC cannot repair files, it means the source files in the Windows Component Store (WinSxS) are themselves corrupt. DISM /Online /Cleanup-Image /RestoreHealth contacts Windows Update to download good copies of the component store files. Once DISM completes successfully, sfc /scannow can now find correct source files to repair the OS. Running SFC again without DISM will produce the same failure. The full correct sequence is: 1) DISM /RestoreHealth, 2) sfc /scannow, 3) reboot.'
        }
      ]
    },

    // ═══════════════════════════════════════════════════════════════════════
    // CATEGORY 5: Troubleshoot HW & Drivers (M11)
    // Topics: Device Manager error codes (1,10,22,28,31,43), driver rollback,
    //         BSOD stop codes, mdsched.exe, chkdsk, peripheral troubleshooting
    // ═══════════════════════════════════════════════════════════════════════
    {
      name: 'HW & Drivers',
      questions: [
        {
          value: 100,
          question: 'In Device Manager, a device shows a yellow exclamation mark with "Code 28." What does this error code indicate?',
          options: [
            'The device has been disabled by an administrator',
            'The device is not working properly and has reported a problem to Windows',
            'The drivers for this device are not installed',
            'Windows stopped the device because it reported problems'
          ],
          correct: 2,
          explanation: 'Device Manager Code 28 = "The drivers for this device are not installed." This means Windows recognizes the hardware exists (it shows up in Device Manager) but has no driver loaded for it. The fix is to install the appropriate driver. Compare with Code 43 = "The device has reported a problem" (driver IS installed but the device or driver has an error). Code 22 = device is disabled. Code 10 = device cannot start. Code 1 = device is not configured correctly.'
        },
        {
          value: 200,
          question: 'After installing a new display driver update, a user\'s monitor displays a distorted image and the system is unstable. What is the fastest way to revert to the previously working driver?',
          options: [
            'Uninstall the driver in Device Manager and reinstall Windows',
            'Open Device Manager, right-click the display adapter, select Properties > Driver tab, and click Roll Back Driver',
            'Use System Restore to revert to a restore point from before the driver install',
            'Download the old driver manually from the vendor website'
          ],
          correct: 1,
          explanation: 'Driver Rollback (Device Manager > device Properties > Driver tab > Roll Back Driver) is the fastest targeted solution — it reinstates the previous driver version immediately without affecting other system settings. The Roll Back button is grayed out if no previous driver version is stored. System Restore is a valid second option but reverts all system changes since the restore point, not just the driver. Manual download works but is slower.'
        },
        {
          value: 300,
          question: 'A Windows 10 PC crashes with a BSOD stop code: IRQL_NOT_LESS_OR_EQUAL. What is the most common cause of this stop code?',
          options: [
            'A failing hard drive with bad sectors',
            'A driver or software attempted to access memory at an invalid IRQL (Interrupt Request Level), typically a faulty or incompatible driver',
            'Windows Update corrupted a system file',
            'The CPU is overheating and throttling performance'
          ],
          correct: 1,
          explanation: 'IRQL_NOT_LESS_OR_EQUAL (0x0000000A) occurs when a kernel-mode driver or process attempts to access pageable memory at a process IRQL that is too high — meaning it tried to access memory that required waiting (paging) from a context where waiting is not allowed. This is almost always caused by a faulty third-party driver (NIC, antivirus, storage controller drivers are common culprits). The minidump file (.dmp) in C:\\Windows\\Minidump identifies the offending driver. Action: update/rollback/uninstall the suspect driver.'
        },
        {
          value: 400,
          question: 'A user reports that their PC randomly freezes and they suspect bad RAM. Which built-in Windows tool should you use to test the system memory, and how is it accessed?',
          options: [
            'chkdsk /r — this tests both disk and RAM',
            'Windows Memory Diagnostic (mdsched.exe) — run it to schedule a memory test on next reboot',
            'Performance Monitor with the Memory counter set — it will flag errors in real-time',
            'Device Manager > Memory > Run Diagnostic'
          ],
          correct: 1,
          explanation: 'Windows Memory Diagnostic (mdsched.exe) is the built-in RAM testing tool. Run it, choose "Restart now and check for problems," and it tests RAM during the reboot phase using multiple test passes (BASIC, STANDARD, EXTENDED). Results appear in Event Viewer > Windows Logs > System after Windows restarts, with source "MemoryDiagnostics-Results." chkdsk tests disk integrity, not RAM. Performance Monitor monitors RAM usage, not hardware errors.'
        },
        {
          value: 500,
          question: 'A workstation BSODs with PAGE_FAULT_IN_NONPAGED_AREA after a recent driver install. You boot into Safe Mode and the system is stable. Analysis of the minidump file points to a third-party storage controller driver (storcntrl.sys). The vendor has not released an updated driver yet. What is the BEST course of action?',
          options: [
            'Disable the storage controller in Device Manager permanently',
            'Roll back the storage controller driver to the previous version, or uninstall it and let Windows install the default Microsoft driver',
            'Run sfc /scannow to repair the corrupt driver file',
            'Enable Driver Verifier to generate more detailed crash dumps, then reboot into normal mode'
          ],
          correct: 1,
          explanation: 'PAGE_FAULT_IN_NONPAGED_AREA (0x00000050) means a driver requested a page of memory that was not in the non-paged pool — most commonly a driver bug or memory corruption. The minidump identifies storcntrl.sys as the cause. Since the system is stable in Safe Mode (which does not load third-party drivers), the fix is clear: roll back the driver (Device Manager > Roll Back Driver) or uninstall it and allow Windows to install its built-in generic driver. Running SFC won\'t fix a vendor driver bug. Driver Verifier would help analyze but would cause more BSODs in production. Permanently disabling the controller would lose access to storage.'
        }
      ]
    }
  ],

  // ─────────────────────────────────────────────────────────────────────────
  // FINAL JEOPARDY
  // Category: MD-100 Troubleshooting Synthesis
  // Scenario spanning M07-M11: failed update + driver rollback + BitLocker
  //   recovery + app repair — requires integrated knowledge
  // ─────────────────────────────────────────────────────────────────────────
  finalJeopardy: {
    category: 'MD-100 Troubleshooting Synthesis',
    question: 'A corporate laptop running Windows 10 Pro has the following symptoms after IT pushed a Windows Update overnight: (1) The machine boots to a BitLocker recovery screen. (2) After entering the recovery key, Windows loads but shows a blue screen (KERNEL_DATA_INPAGE_ERROR) within 5 minutes. (3) Rebooting into Safe Mode is stable. (4) A Device Manager check shows the NVMe storage controller has Code 43 after the update. (5) The primary business application crashes on launch citing a missing DLL. Considering all symptoms together, what is the CORRECT sequence of remediation steps?',
    options: [
      'Run sfc /scannow > reinstall the business app > roll back the NVMe driver > suspend BitLocker',
      'Roll back or uninstall the NVMe storage controller driver > run DISM /RestoreHealth then sfc /scannow > repair/reinstall the business app > suspend BitLocker before the next update cycle',
      'Restore from a system image backup — these combined failures require a full rebuild',
      'Run chkdsk /f /r > rebuild BCD with bootrec /rebuildbcd > re-enter the BitLocker key > reinstall Windows Update'
