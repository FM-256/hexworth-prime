<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'MD-100 Midterm Review',
  storageKey: 'hexworth_review_md100_midterm',
  houseId: 'forge',

  // ─────────────────────────────────────────────────────────────────
  // CATEGORIES  (M01 – M06, 5 questions each, 100-500 points)
  // ─────────────────────────────────────────────────────────────────
  categories: [

    // ══════════════════════════════════════════════════════
    // M01 – Installing Windows
    // ══════════════════════════════════════════════════════
    {
      name: 'Installing Windows',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Windows 10 edition is the MINIMUM required to join a domain managed by Active Directory Domain Services?',
          options: [
            'Windows 10 Home',
            'Windows 10 Pro',
            'Windows 10 S Mode',
            'Windows 10 Education'
          ],
          correct: 1,
          explanation: 'Windows 10 Home cannot join an AD domain. Pro (and above) includes domain join, Group Policy, BitLocker, and Hyper-V capabilities. Home is consumer-only. S Mode restricts app installation to the Microsoft Store and cannot join a domain until switched out of S Mode.'
        },

        // $200
        {
          value: 200,
          question: 'What is the minimum RAM requirement for a 64-bit Windows 10 installation?',
          options: [
            '512 MB',
            '1 GB',
            '2 GB',
            '4 GB'
          ],
          correct: 2,
          explanation: 'Microsoft\'s official minimum hardware requirements for 64-bit Windows 10 are: 2 GB RAM, 1 GHz processor, 20 GB storage, and a DirectX 9 graphics card. The 32-bit version only requires 1 GB, which is a common exam gotcha. Real-world deployments need far more, but the exam tests the official minimums.'
        },

        // $300
        {
          value: 300,
          question: 'A technician needs to migrate user settings and data from 50 Windows 7 machines to new Windows 10 PCs. The old machines will be wiped. Which tool is purpose-built for this scenario?',
          options: [
            'Windows Easy Transfer',
            'User State Migration Tool (USMT)',
            'File History',
            'Windows Deployment Services (WDS)'
          ],
          correct: 1,
          explanation: 'USMT (scanstate.exe + loadstate.exe) is the enterprise tool for large-scale user profile migrations. Windows Easy Transfer was retired after Windows 8.1 and does not run on Windows 10. File History backs up libraries, not full profiles. WDS deploys OS images over the network but does not migrate user state.'
        },

        // $400
        {
          value: 400,
          question: 'A company wants to deploy pre-configured Windows 10 images over the network using PXE boot with no physical media. Which deployment technology provides this capability?',
          options: [
            'Microsoft Deployment Toolkit (MDT) standalone',
            'Windows Deployment Services (WDS)',
            'Windows Autopilot',
            'USMT with /ue switch'
          ],
          correct: 1,
          explanation: 'WDS is a server role that serves WIM images to PXE-booting clients over the network. MDT enhances WDS deployments with task sequences but requires WDS for PXE. Autopilot is a cloud-based provisioning service that configures devices that already have Windows installed; it does not image machines via PXE. USMT is a migration tool, not a deployment tool.'
        },

        // $500
        {
          value: 500,
          question: 'During a Windows 10 deployment using USMT, a technician runs: scanstate \\\\server\\store /i:migapp.xml /i:miguser.xml /ue:*\\* /ui:CORP\\jsmith. What does the /ue and /ui combination accomplish?',
          options: [
            'Excludes all users, then includes only CORP\\jsmith — migrating only that one account',
            'Updates all user profiles and ignores the jsmith account',
            'Uninstalls applications for all users except jsmith',
            'Encrypts the migration store and unlocks it for jsmith'
          ],
          correct: 0,
          explanation: '/ue:*\\* excludes ALL users from migration. /ui:CORP\\jsmith then re-includes domain user jsmith. The order of processing means the include overrides the exclude for that specific account. This is the correct enterprise pattern when you only want to migrate specific user accounts rather than all profiles on a machine — common when shared workstations have many local accounts.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M02 – Authentication & Authorization
    // ══════════════════════════════════════════════════════
    {
      name: 'Auth & Authorization',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which built-in local group grants members the ability to install software and modify system settings without being a full local Administrator?',
          options: [
            'Power Users',
            'Backup Operators',
            'Remote Desktop Users',
            'Network Configuration Operators'
          ],
          correct: 0,
          explanation: 'The Power Users group is a legacy group that, on modern Windows, has no additional privileges beyond standard users by default. However, on the MD-100 exam it is still tested as the group that historically provided elevated (but not full admin) capabilities such as software installation. The other groups have specific narrow purposes: Backup Operators can bypass file security for backup tasks; Remote Desktop Users allows RDP logins; Network Configuration Operators can modify network settings.'
        },

        // $200
        {
          value: 200,
          question: 'A user wants to sign in to a Windows 10 PC using a biometric fingerprint scan. Which Windows 10 feature provides this capability?',
          options: [
            'Microsoft Passport',
            'Windows Hello',
            'Credential Guard',
            'Virtual Smart Card'
          ],
          correct: 1,
          explanation: 'Windows Hello provides PIN, facial recognition, and fingerprint (biometric) sign-in to Windows 10. It uses asymmetric key cryptography — the private key never leaves the device (stored in TPM). Microsoft Passport was the original name that was unified under the Windows Hello umbrella. Credential Guard protects derived credentials in a virtualization-based security container. Virtual Smart Cards emulate physical smart cards using the TPM.'
        },

        // $300
        {
          value: 300,
          question: 'A standard user double-clicks an application installer. A UAC prompt appears asking for an administrator username and password. Which UAC behavior is configured?',
          options: [
            'Elevate without prompting',
            'Prompt for credentials on the secure desktop',
            'Prompt for consent on the secure desktop',
            'Notify only when apps try to make changes'
          ],
          correct: 1,
          explanation: '"Prompt for credentials on the secure desktop" is the UAC behavior for standard users — the system switches to the secure desktop and demands admin credentials (username + password). "Prompt for consent" only shows a Yes/No dialog and is used for admins running in Admin Approval Mode. "Elevate without prompting" is the most permissive and dangerous setting, silently elevating. "Notify only when apps try to make changes" is the default slider level.'
        },

        // $400
        {
          value: 400,
          question: 'A company policy requires that local Administrator account passwords on all Windows 10 workstations be unique, rotated automatically, and stored securely in Active Directory. Which Microsoft solution implements this?',
          options: [
            'Windows Hello for Business',
            'Credential Guard',
            'Local Administrator Password Solution (LAPS)',
            'Account Lockout Policy'
          ],
          correct: 2,
          explanation: 'LAPS (Local Administrator Password Solution) is a free Microsoft tool that integrates with Active Directory to automatically manage local Administrator passwords. Each machine gets a unique, randomly generated password that is rotated on a schedule and stored as a confidential attribute on the AD computer object. Only authorized users/groups can read the password from AD. This eliminates the "pass-the-hash" risk from shared local admin passwords across all workstations.'
        },

        // $500
        {
          value: 500,
          question: 'A technician runs "net user localadmin /active:yes" but after logging off, the local admin account is disabled again on next reboot. Group Policy is re-applying a setting. Where in Group Policy is this setting most likely configured?',
          options: [
            'Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options',
            'User Configuration > Administrative Templates > System > Logon',
            'Computer Configuration > Preferences > Control Panel Settings > Local Users and Groups',
            'Computer Configuration > Administrative Templates > Windows Components > Credential Manager'
          ],
          correct: 2,
          explanation: 'Group Policy Preferences (GPP) > Local Users and Groups allows administrators to create, update, or delete local user accounts and group memberships. A GPP item configured with "Update" action on the built-in Administrator account will re-apply its configured state (e.g., disabled) at each Group Policy refresh cycle. GPP items under Computer Configuration take effect at startup and every ~90 minutes by default, overriding manual changes made with net user.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M03 – Post-Install Configuration
    // ══════════════════════════════════════════════════════
    {
      name: 'Post-Install Config',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which registry hive contains per-user settings and is loaded when a user logs on?',
          options: [
            'HKEY_LOCAL_MACHINE (HKLM)',
            'HKEY_CURRENT_USER (HKCU)',
            'HKEY_CLASSES_ROOT (HKCR)',
            'HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet'
          ],
          correct: 1,
          explanation: 'HKCU is a virtual hive that maps to HKEY_USERS\\<SID> for the currently logged-in user. It stores user-specific settings like desktop wallpaper, screensaver, and application preferences. HKLM stores machine-wide settings that apply to all users. HKCR is a merged view of HKLM\\SOFTWARE\\Classes and HKCU\\SOFTWARE\\Classes for file associations. The CurrentControlSet subkey stores active hardware and driver configuration.'
        },

        // $200
        {
          value: 200,
          question: 'A driver needs to be removed from a Windows 10 system and prevented from being automatically reinstalled by Windows Update. Which command-line approach accomplishes this?',
          options: [
            'devmgmt.msc > Uninstall Device',
            'pnputil /delete-driver oem5.inf /uninstall /force',
            'dism /online /remove-driver /driver:oem5.inf',
            'sfc /scannow /exclude:drivers'
          ],
          correct: 1,
          explanation: 'pnputil /delete-driver with the /uninstall flag removes the driver package from the driver store AND uninstalls it from any devices currently using it. /force bypasses the "driver in use" check. Simply uninstalling via Device Manager leaves the package in the driver store and Windows Update can reinstall it. DISM /remove-driver works against offline images, not a live OS. sfc /scannow repairs system files and has no driver exclusion functionality.'
        },

        // $300
        {
          value: 300,
          question: 'A user complains that their laptop battery drains unusually fast. You want to configure the system to turn off the display after 5 minutes and sleep after 15 minutes when on battery, but never sleep when plugged in. Where is the correct location to make these changes?',
          options: [
            'Task Manager > Performance tab',
            'Settings > System > Power & Sleep',
            'Control Panel > Power Options > Change plan settings > Change advanced power settings',
            'Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Power'
          ],
          correct: 1,
          explanation: 'Settings > System > Power & Sleep provides a clean interface to set screen timeout and sleep timers independently for battery and plugged-in modes. The Control Panel Power Options path also works and offers more granular advanced settings, but Settings > System > Power & Sleep is the modern path and sufficient for this scenario. Directly editing the registry power keys is unsupported and risky. Task Manager Performance shows current CPU/power status but provides no configuration.'
        },

        // $400
        {
          value: 400,
          question: 'A local Group Policy setting configured in gpedit.msc is not taking effect. The technician runs "gpupdate /force" and then "gpresult /r". The policy appears under "Denied GPOs" with reason "Inaccessible." What is the most likely cause?',
          options: [
            'The policy was configured under User Configuration but the user is not logged in',
            'The local GPO was overridden by a domain GPO with higher precedence',
            'The SYSVOL folder on the domain controller is corrupted',
            'gpedit.msc is only available on Windows 10 Enterprise'
          ],
          correct: 1,
          explanation: 'In AD environments, GPO precedence is LSDOU: Local, Site, Domain, OU — later in the list wins. A domain-level GPO overrides local GPO settings when they conflict. The "Inaccessible" or "Denied" reason in gpresult typically means a higher-precedence GPO is blocking the local policy. Local GPOs are effectively the weakest link in the chain. "Inaccessible" specifically can also mean the GPO path cannot be reached, but in a domain scenario conflicting domain policy is the most testable answer.'
        },

        // $500
        {
          value: 500,
          question: 'A technician needs to change a service named "wuauserv" to start automatically using the command line. Which command has the correct syntax?',
          options: [
            'sc config wuauserv start=auto',
            'sc config wuauserv start =auto',
            'sc config wuauserv /start:auto',
            'net config wuauserv start=auto'
          ],
          correct: 0,
          explanation: 'The correct sc config syntax is: sc config [service name] [param]=[value] — with NO space before the equals sign, and NO space after the equals sign between the parameter and value keywords. The parameter is "start" and the value is "auto". A common gotcha: sc requires a SPACE between the command and the service name (sc config wuauserv) but the param=value pair uses equals with no surrounding spaces. Option B adds a wrong space before the equals. Options C and D use incorrect flag syntax or the wrong command entirely.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M04 – Networking
    // ══════════════════════════════════════════════════════
    {
      name: 'Networking',
      questions: [

        // $100
        {
          value: 100,
          question: 'A Windows 10 workstation displays the IP address 169.254.45.12. What does this indicate?',
          options: [
            'The machine is configured with a static IP in the APIPA range',
            'The DHCP server was unreachable and Windows assigned an Automatic Private IP Address (APIPA)',
            'The machine is part of a zero-configuration IPv6 network',
            'The DNS server failed to resolve the hostname'
          ],
          correct: 1,
          explanation: '169.254.0.0/16 is the APIPA (Automatic Private IP Addressing) range, defined by RFC 3927. When a Windows machine is set to DHCP but cannot reach a DHCP server, it self-assigns an address in this range. APIPA addresses allow local subnet communication but provide no default gateway, so internet access fails. This is a critical troubleshooting indicator — if you see 169.254.x.x, start by checking the DHCP server, network cable, and switch port. It is never a manually assigned address on a healthy machine.'
        },

        // $200
        {
          value: 200,
          question: 'Which IPv6 address type is equivalent to IPv4 private addresses and is ONLY routable within the local network segment (not even within the organization)?',
          options: [
            'Global Unicast (2000::/3)',
            'Unique Local (FC00::/7)',
            'Link-Local (FE80::/10)',
            'Multicast (FF00::/8)'
          ],
          correct: 2,
          explanation: 'Link-Local addresses (FE80::/10) are automatically assigned to every IPv6 interface and are only valid on the local link — they cannot be routed, not even within an organization. They are used for neighbor discovery and auto-configuration. Global Unicast addresses are the IPv6 equivalent of public IPs. Unique Local (FC00::/7) are the IPv6 equivalent of RFC 1918 private addresses — routable within an organization but not on the internet. Multicast replaces IPv4 broadcast.'
        },

        // $300
        {
          value: 300,
          question: 'A remote worker connects to the corporate VPN from a hotel with highly restrictive firewall rules. The hotel blocks all ports except 443/TCP. Which VPN protocol will successfully traverse this firewall?',
          options: [
            'L2TP/IPsec (uses UDP 1701, 500, 4500)',
            'IKEv2/IPsec (uses UDP 500 and 4500)',
            'SSTP (Secure Socket Tunneling Protocol)',
            'PPTP (uses TCP 1723 and GRE protocol 47)'
          ],
          correct: 2,
          explanation: 'SSTP (Secure Socket Tunneling Protocol) tunnels PPP traffic inside an SSL/TLS session on TCP port 443 — the same port as HTTPS. Since virtually every firewall allows outbound 443/TCP, SSTP traverses the most restrictive environments. L2TP/IPsec and IKEv2 use UDP ports that are commonly blocked. PPTP requires TCP 1723 and GRE (IP protocol 47) which many firewalls drop. On the MD-100 exam: IKEv2 = best performance and reconnect support (MOBIKE); SSTP = best firewall traversal; PPTP = insecure, legacy only.'
        },

        // $400
        {
          value: 400,
          question: 'A technician wants to allow a help desk colleague to remotely view and control a Windows 10 workstation without the colleague needing to be a domain admin or having RDP credentials. The end user is present and must approve the session. Which tool is designed for this scenario?',
          options: [
            'Remote Desktop Protocol (RDP) via mstsc.exe',
            'Microsoft Remote Assistance (MSRA) via Easy Connect or invitation file',
            'Windows Admin Center',
            'PowerShell Remoting (Enter-PSSession)'
          ],
          correct: 1,
          explanation: 'Microsoft Remote Assistance (msra.exe / Quick Assist) is designed for the "helper + end user present" scenario. The user can create an invitation file or use Easy Connect to share a code with the helper. The helper requests control, the user approves. RDP requires credentials and gives the helper a full independent session — the user is logged off. Windows Admin Center is a server management tool. PowerShell remoting provides CLI-only remote administration, not desktop viewing.'
        },

        // $500
        {
          value: 500,
          question: 'A Windows 10 PC is configured with IP 192.168.10.50/24, gateway 192.168.10.1, DNS 192.168.10.10. The user can ping 192.168.10.1 and 8.8.8.8 successfully, but cannot browse websites by name. Which command should be run FIRST to diagnose the issue?',
          options: [
            'ipconfig /flushdns',
            'nslookup hexworth.com 192.168.10.10',
            'netstat -an',
            'tracert 8.8.8.8'
          ],
          correct: 1,
          explanation: 'The symptoms perfectly isolate a DNS resolution problem: IP connectivity is confirmed (ping to gateway and 8.8.8.8 both succeed), but name resolution fails (cannot browse by hostname). nslookup hexworth.com 192.168.10.10 tests the configured DNS server (192.168.10.10) directly. If nslookup fails, the DNS server is the issue. If it succeeds, the problem is in the browser or DNS cache. ipconfig /flushdns clears the local cache but does not test the DNS server itself. netstat shows active connections. tracert tests routing, which is already confirmed working.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M05 – Storage
    // ══════════════════════════════════════════════════════
    {
      name: 'Storage',
      questions: [

        // $100
        {
          value: 100,
          question: 'A technician is partitioning a new 4 TB hard drive. The drive is initialized as MBR. The user wants to create 5 primary partitions. What is the problem?',
          options: [
            'MBR supports a maximum of 4 primary partitions',
            'MBR drives cannot exceed 2 TB in total capacity',
            'Both A and B are problems with this scenario',
            'MBR supports unlimited partitions but requires a special boot sector'
          ],
          correct: 2,
          explanation: 'MBR has TWO critical limitations: (1) Maximum of 4 primary partitions — to have more, one must be an extended partition containing logical drives. (2) Maximum addressable disk size of 2 TB due to 32-bit LBA addressing. A 4 TB drive on MBR will have the space beyond 2 TB inaccessible. The solution is to convert to GPT, which supports up to 128 primary partitions and 18 exabytes (18 EB) of addressable space. Both limitations apply, making option C correct.'
        },

        // $200
        {
          value: 200,
          question: 'Which file system should be used for a USB flash drive that needs to store files larger than 4 GB AND be readable by both Windows and macOS without third-party software?',
          options: [
            'NTFS',
            'FAT32',
            'exFAT',
            'ReFS'
          ],
          correct: 2,
          explanation: 'exFAT (Extended FAT) is designed specifically for removable media. It supports files larger than 4 GB (FAT32\'s limitation) and is natively readable/writable on both Windows (XP SP2+) and macOS (10.6.5+) and Linux. FAT32 caps individual files at 4 GB. NTFS is natively read-write on Windows but macOS only reads NTFS by default (write requires third-party tools). ReFS is a server-grade resilient file system not supported on removable media and not compatible with macOS.'
        },

        // $300
        {
          value: 300,
          question: 'A Windows 10 system has two physical disks. A technician creates a spanned volume across both disks in Disk Management. The user later reports that one disk failed. What is the outcome?',
          options: [
            'Data on the failed disk is lost but data on the healthy disk is intact',
            'All data on the spanned volume is lost regardless of which disk failed',
            'The volume automatically rebuilds from the redundant copy on the surviving disk',
            'Windows automatically moves all data to the surviving disk before the failure is detected'
          ],
          correct: 1,
          explanation: 'A spanned volume (also called JBOD — Just a Bunch Of Disks) combines space from multiple disks into a single volume with NO redundancy. Data is written sequentially — it fills Disk 1 before moving to Disk 2. If either disk fails, the entire volume is lost because file system metadata and data may span both physical drives. Spanned volumes are about capacity, not resilience. For redundancy, use a mirrored volume (RAID-1). This is a critical exam gotcha: spanned ≠ redundant.'
        },

        // $400
        {
          value: 400,
          question: 'A technician wants to create a Storage Space with three physical drives that can tolerate one drive failure while still providing additional read performance compared to a simple mirror. Which resiliency type should be selected?',
          options: [
            'Simple (no resiliency)',
            'Two-way mirror',
            'Three-way mirror',
            'Parity'
          ],
          correct: 2,
          explanation: 'A three-way mirror (Storage Spaces) keeps three copies of each piece of data across three disks. It can survive two simultaneous drive failures and provides excellent read performance because Windows can read from any of the three copies. A two-way mirror requires only two drives but can only survive one failure with no read performance boost. Parity (similar to RAID-5) provides one-disk-failure tolerance with good capacity efficiency but slower write performance due to parity calculation. Simple provides no redundancy.'
        },

        // $500
        {
          value: 500,
          question: 'A technician runs chkdsk C: /f /r and receives the error: "Chkdsk cannot run because the volume is in use by another process. Would you like to schedule it to be checked the next time the system restarts?" The technician selects Y. What is the technical reason chkdsk cannot run interactively on drive C:?',
          options: [
            'chkdsk /r requires Safe Mode to scan the system drive',
            'The C: volume is the active system volume mounted by the OS; chkdsk requires exclusive access and must run during the pre-boot phase via autochk.exe',
            'Windows Defender is locking the drive and must be disabled first',
            'The /f and /r flags conflict and cannot be used simultaneously'
          ],
          correct: 1,
          explanation: 'chkdsk requires exclusive write access to the volume to repair errors (/f) and recover readable information from bad sectors (/r). The C: system drive is actively mounted by the running Windows kernel, so exclusive access is impossible while the OS is running. When you confirm the schedule, Windows writes a registry entry (HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\BootExecute) that triggers autochk.exe during the next boot before the OS mounts the volume. Non-system drives can be dismounted interactively, which is why chkdsk /f works immediately on D: or E:.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M06 – Data Access & Usage
    // ══════════════════════════════════════════════════════
    {
      name: 'Data Access & Usage',
      questions: [

        // $100
        {
          value: 100,
          question: 'What is the administrative share that provides remote access to the root of the C: drive on a Windows machine?',
          options: [
            'C$',
            'ADMIN$',
            'IPC$',
            'PRINT$'
          ],
          correct: 0,
          explanation: 'C$ is the default administrative share for the root of drive C:. Windows automatically creates a [DriveLetter]$ share for every fixed drive. ADMIN$ maps to the Windows installation directory (e.g., C:\\Windows) and is used by tools like PsExec and remote management. IPC$ (Inter-Process Communication) is used for named pipe connections in remote administration. PRINT$ shares printer drivers. Administrative shares (ending in $) are hidden and only accessible to local Administrators.'
        },

        // $200
        {
          value: 200,
          question: 'A file has the following NTFS permissions: Group "Sales" has Read access, user "jsmith" (who is a member of Sales) has a Deny Write permission explicitly set. What access does jsmith have to this file?',
          options: [
            'Read only, because Deny overrides all Allow permissions',
            'Read and Write, because explicit user permissions override group permissions',
            'No access at all, because a Deny on any permission revokes all access',
            'Write only, because jsmith\'s explicit permission takes priority'
          ],
          correct: 0,
          explanation: 'NTFS permission precedence: Explicit Deny > Explicit Allow > Inherited permissions. jsmith has an explicit Deny Write. The Sales group provides Read (Allow). The Deny Write is not a Deny All — it only denies the Write permission. jsmith retains the Read permission from the Sales group membership. The result is Read-only access. A common misconception is that Deny overrides ALL permissions — it only denies the specific permission that is denied. A Deny Full Control would result in no access at all.'
        },

        // $300
        {
          value: 300,
          question: 'A user accesses a shared folder over the network. The NTFS permissions on the folder grant the user Modify. The share permissions grant the user Read. What is the user\'s effective access when connecting over the network?',
          options: [
            'Modify — NTFS always takes precedence over share permissions',
            'Read — the most restrictive of the two permission sets applies when accessing over the network',
            'Full Control — network access combines both permission sets',
            'Modify — share permissions only apply to local access'
