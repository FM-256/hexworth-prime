    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 11 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 11',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m11',
            moduleId: 'md100-m11',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'What is Windows driver signing, and what happens on 64-bit Windows 10 if you try to install an unsigned kernel-mode driver?',
                    options: [
                        'Driver signing is optional on 64-bit Windows; unsigned drivers install with a warning prompt',
                        'Driver signing cryptographically verifies a driver\'s publisher identity and integrity; 64-bit Windows 10 enforces mandatory driver signing - unsigned kernel-mode drivers are blocked from loading by default',
                        'Driver signing only applies to network and storage drivers; other driver types are unsigned by default',
                        'Unsigned drivers are allowed on 64-bit Windows but require the user to log in as the built-in Administrator account'
                    ],
                    correct: 1,
                    explanation: 'Windows 10 64-bit enforces Driver Signature Enforcement (DSE), which requires all kernel-mode drivers to be digitally signed by a trusted certificate authority. This prevents malicious or unstable unsigned code from running in kernel mode. If you attempt to install an unsigned kernel-mode driver, Windows will refuse to load it. Test-signing mode (bcdedit /set testsigning on) can be enabled for development purposes, but this weakens system security. 32-bit Windows allows disabling signing enforcement, which is one security advantage of the 64-bit platform.'
                },
                {
                    question: 'Device Manager shows a yellow exclamation mark on a network adapter with the message "This device cannot find enough free resources that it can use. (Code 12)." What does this error code indicate?',
                    options: [
                        'The driver files are corrupted and need to be reinstalled',
                        'Windows cannot assign the IRQ, I/O port, or memory range the device needs because another device is using those resources',
                        'The device has been disabled in Device Manager by a policy',
                        'The device requires a newer version of Windows to function'
                    ],
                    correct: 1,
                    explanation: 'Device Manager Code 12 means Windows cannot assign sufficient or non-conflicting hardware resources (IRQ, DMA, I/O port address, or memory range) to the device. This was more common with legacy ISA devices but can still occur with PCIe devices in constrained resource environments. Resolution often involves updating BIOS/UEFI, adjusting resource assignments manually, or removing conflicting devices. This is different from Code 10 (device failed to start) or Code 43 (device stopped working - often a driver-reported error).'
                },
                {
                    question: 'A USB device worked yesterday but today Device Manager shows Code 43. The device works on another computer. What does Code 43 mean and what should the technician try first?',
                    options: [
                        'Code 43 means the device driver is not digitally signed - install a signed driver',
                        'Code 43 means the driver reported an unspecified failure to Windows; try uninstalling the device from Device Manager and letting Windows re-detect it, then try a fresh driver install',
                        'Code 43 means the USB port has failed and the motherboard needs replacement',
                        'Code 43 means the device firmware is outdated; update the firmware first'
                    ],
                    correct: 1,
                    explanation: 'Device Manager Code 43 (Windows has stopped this device because it has reported problems) is a generic code indicating the device driver itself reported a failure condition to Windows. Because the device works on another machine, the hardware is likely fine. First steps: right-click the device in Device Manager → Uninstall device (check "Delete the driver software for this device"), then physically remove/reconnect the device to trigger fresh detection and driver installation. Also try different USB ports. Code 43 on USB devices can also be caused by power delivery issues on the USB controller.'
                },
                {
                    question: 'Device Manager shows Code 28 on a newly installed device. Which action resolves this?',
                    options: [
                        'Restart the computer - Code 28 resolves on its own after a reboot',
                        'Install the correct driver - Code 28 means "The drivers for this device are not installed"',
                        'Replace the hardware - Code 28 indicates physical damage',
                        'Disable and re-enable the device in Device Manager'
                    ],
                    correct: 1,
                    explanation: 'Code 28 ("The drivers for this device are not installed") means Windows found the hardware but could not find a suitable driver for it in its driver store. The solution is to obtain and install the correct driver from the manufacturer\'s website or Windows Update. Code 1 (device is not configured correctly) also relates to driver/configuration issues, while Code 28 specifically means no driver is installed at all. This commonly occurs with niche or newly released hardware that lacks an inbox Windows driver.'
                },
                {
                    question: 'A user updated their display driver and now experiences screen flickering. The technician wants to restore the previous driver version without using System Restore. What is the correct procedure?',
                    options: [
                        'Reinstall Windows to get the original OEM driver',
                        'Device Manager → right-click device → Properties → Driver tab → Roll Back Driver',
                        'Delete the driver from C:\\Windows\\System32\\drivers and restart',
                        'Run "sfc /scannow" to restore the previous driver files'
                    ],
                    correct: 1,
                    explanation: 'The Roll Back Driver option in Device Manager reverts to the previously installed driver version. It is available only if a previous driver was installed and Windows retained a copy. This is the fastest and safest way to recover from a bad driver update without affecting any other system settings. If Roll Back Driver is greyed out, it means there is no previous driver version saved. In that case, you would need to manually download and install an older driver version or use System Restore if a restore point was created.'
                },
                {
                    question: 'An administrator needs to inject a third-party network driver into the Windows driver store on a fleet of machines using a script, before the device is even connected. Which command-line tool is used?',
                    options: [
                        'devcon.exe',
                        'pnputil.exe /add-driver',
                        'drvload.exe',
                        'sc.exe install'
                    ],
                    correct: 1,
                    explanation: 'pnputil.exe (Plug and Play Utility) is the Windows built-in tool for managing the driver store. "pnputil /add-driver driver.inf /install" imports a driver package into the driver store, making it available for automatic installation when the matching device is connected. The /subdirs switch can be used to import an entire folder of driver packages. This is the modern replacement for the older devcon.exe approach and is available natively without additional downloads.'
                },
                {
                    question: 'A system crashes intermittently with different BSOD stop codes. A technician suspects a driver is causing memory corruption but cannot identify which one. Which tool deliberately stresses-tests drivers to force the faulty one to reveal itself?',
                    options: [
                        'Performance Monitor with driver counters',
                        'Driver Verifier (verifier.exe)',
                        'Windows Memory Diagnostic (mdsched.exe)',
                        'Process Monitor (procmon.exe)'
                    ],
                    correct: 1,
                    explanation: 'Driver Verifier (verifier.exe) applies extra validation checks to selected drivers, including memory allocation checks, pool tag verification, deadlock detection, and IRQL verification. A driver that passes under normal conditions often fails immediately under Driver Verifier\'s stress testing, producing a BSOD with a more descriptive error that identifies the offending driver. Important caveat: Driver Verifier significantly impacts performance and can cause frequent BSODs - it should only be used in a controlled diagnostic session, not on production systems. Always enable it with a reboot plan.'
                },
                {
                    question: 'A user reports random system crashes with varying BSOD stop codes. The technician wants to test whether faulty RAM is the cause. Which Windows built-in tool performs a memory diagnostic test?',
                    options: [
                        'Reliability Monitor',
                        'Windows Memory Diagnostic (mdsched.exe)',
                        'Resource Monitor → Memory tab',
                        'Task Manager → Performance → Memory'
                    ],
                    correct: 1,
                    explanation: 'Windows Memory Diagnostic (mdsched.exe) schedules a comprehensive RAM test that runs on the next reboot (before Windows loads) in a standalone test environment. It performs multiple test passes including MATS+, INVC, SCHCKR patterns to detect various types of memory faults. After the test completes and Windows boots, results are shown in Action Center and logged to Event Viewer (Event ID 1201 in the System log). For more thorough testing, the free open-source tool MemTest86 (bootable USB) is preferred as it can run extended overnight tests.'
                },
                {
                    question: 'A Windows 10 machine displays the stop code IRQL_NOT_LESS_OR_EQUAL. What does this specific stop code indicate about the nature of the crash?',
                    options: [
                        'The system ran out of physical RAM and could not allocate more virtual memory',
                        'A driver or kernel component attempted to access memory at an invalid IRQL (Interrupt Request Level), typically meaning a driver tried to access paged memory while running at a raised IRQL',
                        'The system drive is failing and cannot be read',
                        'A critical Windows system process was terminated unexpectedly'
                    ],
                    correct: 1,
                    explanation: 'IRQL_NOT_LESS_OR_EQUAL (0x0000000A) occurs when kernel-mode code accesses memory at an IRQL higher than allowed. Specifically, paged memory (which can be swapped to disk) may not be accessed at IRQL DISPATCH_LEVEL or higher because disk I/O requires waiting, which is not allowed at high IRQL. This almost always indicates a buggy driver that is violating memory access rules. The BSOD dump typically names the offending driver module. CRITICAL_PROCESS_DIED is a different code indicating a Windows core process crashed.'
                },
                {
                    question: 'A workstation shows KERNEL_DATA_INPAGE_ERROR BSODs, especially during disk-intensive tasks. What are the two most likely root causes?',
                    options: [
                        'Too many user accounts logged in simultaneously, or corrupted user profile',
                        'Failing hard drive (bad sectors or I/O errors) or faulty RAM causing data corruption when reading page file data',
                        'Overclocked CPU, or corrupted Windows activation status',
                        'Outdated BIOS firmware, or disabled Secure Boot'
                    ],
                    correct: 1,
                    explanation: 'KERNEL_DATA_INPAGE_ERROR (0x0000007A) occurs when Windows cannot read data from the page file (virtual memory on disk) or from the swap file into RAM. The two primary causes are: (1) a failing hard drive with bad sectors or read errors (check with chkdsk /r and S.M.A.R.T. tools), and (2) faulty RAM that corrupts data during the memory write process. The error code embedded in the BSOD dump (parameter 1 of 0xC0000185 indicates an I/O error, for example) helps distinguish between the two. Test both RAM and disk when diagnosing this stop code.'
                },
                {
                    question: 'A Windows 10 machine displays CRITICAL_PROCESS_DIED immediately after login. Which specific type of process triggers this stop code?',
                    options: [
                        'Any process using more than 2GB of RAM',
                        'A Windows critical system process (such as csrss.exe, lsass.exe, or wininit.exe) that has terminated unexpectedly',
                        'Any third-party application that crashes at startup',
                        'A service marked as critical in services.msc that fails to start'
                    ],
                    correct: 1,
                    explanation: 'CRITICAL_PROCESS_DIED (0x000000EF) triggers when a process that Windows has marked as critical to system operation terminates. These are core Windows processes like csrss.exe (Client/Server Runtime Subsystem), lsass.exe (Local Security Authority), smss.exe (Session Manager), and wininit.exe. If any of these stop unexpectedly, Windows has no viable recovery path and must crash to prevent undefined behavior. Malware sometimes targets these process names, and corrupted system files (repair with SFC/DISM) can also cause this. Regular user-mode application crashes do NOT trigger this stop code.'
                },
                {
                    question: 'After a BSOD, where are minidump files stored by default, and what tool is used to analyze them to identify the responsible driver?',
                    options: [
                        'C:\\Windows\\Logs\\BSOD; analyzed with Event Viewer',
                        'C:\\Windows\\Minidump; analyzed with WinDbg (Windows Debugger) or WhoCrashed',
                        'C:\\Users\\Public\\CrashDumps; analyzed with Resource Monitor',
                        'C:\\Windows\\System32\\Dumps; analyzed with Process Monitor'
                    ],
                    correct: 1,
                    explanation: 'Windows stores minidump files in C:\\Windows\\Minidump (small memory dumps are default). Full memory dumps go to C:\\Windows\\MEMORY.DMP. The professional analysis tool is WinDbg (Windows Debugger) from Microsoft\'s Debugging Tools for Windows, which can load symbol files and identify the crashing module with the !analyze -v command. For less technical users, tools like WhoCrashed or BlueScreenView parse minidump files and present the likely responsible driver in a user-friendly interface without needing to understand WinDbg syntax.'
                },
                {
                    question: 'A technician needs a comprehensive report of a system\'s hardware, installed drivers, and Windows version to send to a vendor for support. Which tool generates this detailed system information report?',
                    options: [
                        'dxdiag - exports full system and DirectX information to a text file',
                        'msinfo32 - provides comprehensive hardware, driver, and software environment information exportable as an .nfo or .txt file',
                        'winver - displays the Windows version in a pop-up window',
                        'Device Manager - can export a full driver list to a text file'
                    ],
                    correct: 1,
                    explanation: 'System Information (msinfo32.exe) provides a comprehensive view of hardware resources, components (display, sound, input, network, storage, ports), the software environment (running tasks, loaded modules, startup programs, services), and internet settings. It can be exported to .nfo (System Information file) or .txt format via File → Export. dxdiag specifically focuses on DirectX-related diagnostics (display, sound, input for gaming/multimedia) and is less comprehensive for general hardware reporting.'
                },
                {
                    question: 'A computer emits a pattern of beep codes during POST but does not display anything on screen. The BIOS is from AMI (American Megatrends). Three short beeps indicate which common hardware problem?',
                    options: [
                        'CPU failure',
                        'Base memory (conventional memory) read/write test failure - typically a RAM problem',
                        'Video card failure',
                        'Hard drive not detected'
                    ],
                    correct: 1,
                    explanation: 'POST (Power-On Self-Test) beep codes communicate hardware errors before video is initialized. For AMI BIOS, beep code patterns vary by version, but three short beeps commonly indicates a base memory failure (64KB RAM test failure). Because video is not yet initialized, the only output channel is the speaker. Beep code meanings differ between BIOS manufacturers (AMI, Award/Phoenix, Dell, etc.) - always reference the specific BIOS manufacturer documentation. Video card failures typically produce long beeps. No beeps with no video often indicates CPU or motherboard failure.'
                },
                {
                    question: 'Device Manager shows Code 31 (This device is not working properly because Windows cannot load the drivers required for this device) on a previously working device after a Windows update. Which two actions should be tried in order?',
                    options: [
                        'Reinstall Windows, then reinstall the device driver',
                        'First: roll back the driver using Device Manager → Driver tab → Roll Back Driver. Second (if rollback unavailable): uninstall the device and driver, then reinstall using the manufacturer\'s latest driver',
                        'First: run SFC /scannow. Second: run DISM /RestoreHealth. Then restart.',
                        'First: disable the device. Second: re-enable the device after 30 seconds'
                    ],
                    correct: 1,
                    explanation: 'Code 31 means the driver cannot be loaded, which after a Windows update often means the update installed a newer inbox driver that conflicts with or replaces the previously working driver. The first logical action is to use Roll Back Driver to revert to the working state. If no previous driver is saved (rollback greyed out), the second step is to fully uninstall the device (right-click → Uninstall device, check "Delete the driver software"), download the latest driver from the manufacturer\'s website, and perform a clean installation. This sequence - rollback first, clean install second - addresses both update regression and driver corruption scenarios.'
                }
            ]
        });
        quiz.start();
    </script>
