<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-100 Course</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 08 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 08',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m08',
            moduleId: 'md100-m08',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A user downloads what appears to be a legitimate free video converter. After installation, the application creates a hidden backdoor allowing remote access. This is the definition of which malware type?',
                    options: [
                        'Worm',
                        'Trojan Horse',
                        'Rootkit',
                        'Spyware'
                    ],
                    correct: 1,
                    explanation: 'A Trojan Horse disguises itself as legitimate or useful software while performing malicious actions in the background. Unlike viruses and worms, Trojans do not self-replicate. The defining characteristic is deception - the user willingly installs the software without knowing it carries a malicious payload. This is the most common delivery mechanism for backdoors and RATs (Remote Access Trojans).'
                },
                {
                    question: 'A hospital\'s file server has all patient records encrypted and a ransom demand appears on screen. The malware has also spread to other systems on the network without any user interaction on those machines. What combination of malware behaviors is present?',
                    options: [
                        'Virus + Spyware',
                        'Ransomware + Worm behavior',
                        'Rootkit + Adware',
                        'Trojan + Keylogger'
                    ],
                    correct: 1,
                    explanation: 'Ransomware encrypts files and demands payment for the decryption key - this is the core behavior visible in this scenario. The self-propagation to other systems without user interaction is characteristic of a worm. Modern ransomware strains like WannaCry and NotPetya combine ransomware encryption with worm-like lateral movement capabilities, making them particularly destructive in network environments.'
                },
                {
                    question: 'A rootkit has been detected on a Windows 10 system. What makes rootkits particularly difficult to detect and remove compared to other malware?',
                    options: [
                        'Rootkits are encrypted, making antivirus scanning impossible',
                        'Rootkits operate at the kernel or boot level, hiding their presence from the OS and security tools running on that OS',
                        'Rootkits are stored entirely in RAM and leave no disk traces',
                        'Rootkits disable Windows Defender automatically upon installation'
                    ],
                    correct: 1,
                    explanation: 'Rootkits achieve persistence and stealth by operating at the kernel or boot sector level, below the visibility of the operating system. Because they intercept OS calls, they can hide files, processes, and registry entries from security tools that run within that same OS. Effective removal often requires booting from external media (WinPE or Linux live USB) and scanning the drive from outside the infected OS environment.'
                },
                {
                    question: 'Microsoft Defender Antivirus is configured with cloud-delivered protection enabled. A new, unknown file is encountered that does not match any local signature. What happens?',
                    options: [
                        'The file is automatically quarantined without any cloud analysis',
                        'The file is allowed to execute and reported to Microsoft after the fact',
                        'The file is sent to Microsoft\'s cloud for rapid analysis; if deemed suspicious it is blocked even before a signature update is pushed',
                        'Cloud protection only affects downloads from the internet, not local files'
                    ],
                    correct: 2,
                    explanation: 'Cloud-delivered protection (formerly MAPS - Microsoft Active Protection Service) allows Defender to submit suspicious file metadata to Microsoft\'s cloud for real-time analysis. This enables near-instant threat intelligence against zero-day malware, providing protection faster than traditional signature update cycles which may take hours. The cloud response can block threats in milliseconds, long before a definition update is released.'
                },
                {
                    question: 'What is the difference between a Quick Scan and a Full Scan in Microsoft Defender Antivirus?',
                    options: [
                        'Quick Scan checks the Windows folder only; Full Scan checks all drives',
                        'Quick Scan examines locations where malware commonly hides (memory, startup, common system paths); Full Scan checks all files on all local drives',
                        'Quick Scan runs in the background; Full Scan pauses all user activity',
                        'Full Scan requires administrative privileges; Quick Scan does not'
                    ],
                    correct: 1,
                    explanation: 'Quick Scan focuses on high-risk areas where malware typically resides: running processes, RAM, system registry startup locations, and common malware drop zones. It is fast (minutes) and catches most active infections. Full Scan examines every file on every local disk, takes significantly longer (potentially hours), and is used when a more thorough check is required or when an infection is suspected in non-standard locations.'
                },
                {
                    question: 'A laptop with BitLocker enabled is stolen. The thief removes the hard drive and installs it in another computer to try to read the data. What prevents them from reading the encrypted data?',
                    options: [
                        'The drive requires a Windows login before data is readable',
                        'BitLocker encryption keys are sealed by the TPM to the original hardware; without the correct TPM and boot measurements, the volume key cannot be unsealed',
                        'The drive automatically formats itself when connected to a different motherboard',
                        'BitLocker requires an internet connection to authenticate, which fails on the new machine'
                    ],
                    correct: 1,
                    explanation: 'The TPM (Trusted Platform Module) seals the BitLocker volume encryption key (VMK) to the specific hardware platform. During decryption, the TPM validates that the boot environment matches the expected measurements (BIOS/UEFI settings, boot configuration). When the drive is moved to different hardware with a different TPM, the key cannot be unsealed and the data remains encrypted and unreadable - this is BitLocker\'s primary threat mitigation against offline attacks.'
                },
                {
                    question: 'A user enables BitLocker on their Windows 10 Pro laptop. A few months later, they update the BIOS firmware. After the update, BitLocker prompts for a recovery key. Why?',
                    options: [
                        'BitLocker keys expire every 90 days by default',
                        'The BIOS update changed the PCR (Platform Configuration Register) measurements that the TPM uses to validate the boot environment, triggering BitLocker recovery mode',
                        'BitLocker detected a virus during the BIOS update and locked the drive',
                        'Windows Update cleared the BitLocker PIN during the upgrade process'
                    ],
                    correct: 1,
                    explanation: 'BitLocker uses the TPM to store PCR (Platform Configuration Register) measurements that reflect the boot environment at the time of encryption. A BIOS/UEFI firmware update changes these measurements. When the measurements no longer match what was sealed, the TPM will not release the encryption key, and BitLocker falls back to recovery key entry. This is expected behavior and confirms BitLocker is working correctly - always ensure recovery keys are backed up before making firmware changes.'
                },
                {
                    question: 'A user wants to encrypt a USB flash drive using BitLocker so the data is protected if the drive is lost. Which BitLocker feature handles removable drives?',
                    options: [
                        'BitLocker System Drive Encryption',
                        'BitLocker To Go',
                        'EFS (Encrypting File System)',
                        'BitLocker Recovery Mode'
                    ],
                    correct: 1,
                    explanation: 'BitLocker To Go is the BitLocker variant designed for removable storage devices (USB drives, external hard drives, SD cards). Encrypted drives can be read on other Windows systems by entering the password or recovery key. This is distinct from BitLocker drive encryption which is used for system and fixed data drives. BitLocker To Go is available in Windows 10 Pro and above.'
                },
                {
                    question: 'A Windows 10 laptop connects to a coffee shop Wi-Fi. Which Windows Defender Firewall profile automatically applies, and what is its default inbound stance?',
                    options: [
                        'Domain profile - blocks all inbound and outbound connections',
                        'Private profile - allows all inbound connections from trusted devices',
                        'Public profile - blocks all inbound connections that are not explicitly permitted',
                        'Guest profile - allows all connections with logging enabled'
                    ],
                    correct: 2,
                    explanation: 'Windows Defender Firewall uses three network profiles: Domain (joined to a domain), Private (home or trusted networks), and Public (untrusted networks like coffee shops). The Public profile applies most restrictive settings by default, blocking all unsolicited inbound connections. When you connect to a new network, Windows asks you to designate it - choosing "Public" or not marking it as Private/Domain applies the Public profile automatically.'
                },
                {
                    question: 'An administrator needs to create a firewall rule that allows inbound TCP traffic on port 8443 only from the subnet 192.168.10.0/24. Where is this granular rule created?',
                    options: [
                        'Windows Defender Firewall basic settings page in the Control Panel',
                        'Windows Defender Firewall with Advanced Security (wf.msc)',
                        'Network and Sharing Center → Change adapter settings',
                        'Settings → Network & Internet → Status'
                    ],
                    correct: 1,
                    explanation: 'Windows Defender Firewall with Advanced Security (wf.msc) provides the full rule editor allowing granular configuration: specific ports, protocols, IP address ranges, network profiles, and local/remote address scopes. The basic Firewall settings page in Control Panel only allows enabling/disabling the firewall and managing simple allow/block for programs, not port-level rules with scope restrictions.'
                },
                {
                    question: 'Attack Surface Reduction (ASR) rules in Microsoft Defender are designed to block which specific category of threats?',
                    options: [
                        'Network-based attacks targeting open ports',
                        'Malicious behaviors commonly used by malware, such as Office macros spawning child processes or script obfuscation techniques',
                        'Phishing emails before they reach the user\'s inbox',
                        'Hardware-level firmware attacks targeting the BIOS'
                    ],
                    correct: 1,
                    explanation: 'ASR rules target specific techniques malware commonly uses to gain a foothold, including: Office applications spawning executable child processes, script execution from downloaded content, credential theft from LSASS, and abuse of WMI/PowerShell. Each rule is independently configurable in Audit, Block, or Warn mode. ASR rules require Windows Defender real-time protection to be active and work at the behavioral layer rather than signature matching.'
                },
                {
                    question: 'A user tries to run a newly downloaded executable. Windows SmartScreen displays a warning saying the app is "unrecognized." This warning does NOT necessarily mean the application is malicious. What actually triggers this warning?',
                    options: [
                        'The file is not digitally signed by any publisher',
                        'The file\'s reputation score (based on download count and age) is below Microsoft\'s threshold, meaning very few users have run it',
                        'The file contains code patterns that match known malware signatures',
                        'The file was downloaded from a site that is on Microsoft\'s blocklist'
                    ],
                    correct: 1,
                    explanation: 'SmartScreen uses a reputation-based system. An "unrecognized app" warning means the file hash has been seen by very few users (low prevalence), not necessarily that it is malicious. Newly released legitimate software triggers this until it accumulates enough download history. In contrast, a "malicious" warning indicates a positive match against a known threat. Administrators can configure SmartScreen behavior via Group Policy, and developers can establish reputation by signing their applications with a code-signing certificate.'
                },
                {
                    question: 'Which Windows 10 security feature provides ASLR, DEP, and heap integrity checks to protect processes from memory-based exploits, and is configured under Windows Security → App & browser control?',
                    options: [
                        'Windows Defender Application Guard',
                        'Exploit Protection',
                        'Credential Guard',
                        'Core Isolation'
                    ],
                    correct: 1,
                    explanation: 'Exploit Protection (formerly EMET - Enhanced Mitigation Experience Toolkit) provides per-process and system-wide exploit mitigations including Address Space Layout Randomization (ASLR), Data Execution Prevention (DEP), Control Flow Guard (CFG), and heap integrity. Settings can be exported as XML and deployed via Group Policy. Windows Defender Application Guard is a separate feature that runs Microsoft Edge in a Hyper-V container to isolate untrusted browsing.'
                },
                {
                    question: 'A Windows 10 Home laptop supports Device Encryption but NOT BitLocker. What is the key difference between Device Encryption and BitLocker?',
                    options: [
                        'Device Encryption uses AES-128; BitLocker uses AES-256',
                        'Device Encryption automatically enables with a Microsoft account and encrypts the system drive only; BitLocker offers full management including recovery key options, data drives, and removable drives',
                        'Device Encryption requires a TPM; BitLocker does not require a TPM',
                        'Device Encryption is a cloud-based encryption service; BitLocker encrypts locally'
                    ],
                    correct: 1,
                    explanation: 'Device Encryption is a simplified version available on Windows 10 Home that auto-enables when you sign in with a Microsoft account, backing the recovery key to your Microsoft account. It lacks the management features of BitLocker: no control over cipher strength, no pre-boot PIN/USB key options, no Group Policy management, and no support for data volumes or BitLocker To Go. Both use AES encryption under the hood. BitLocker is the enterprise-grade full-control version available on Pro and above.'
                },
                {
                    question: 'Windows Defender Application Guard (WDAG) for Microsoft Edge protects against which specific threat vector?',
                    options: [
                        'Malware delivered through email attachments in Outlook',
                        'Drive-by malware and exploits encountered when browsing untrusted websites, by running the browser session in an isolated Hyper-V container',
                        'Malicious USB devices inserting themselves as HID keyboards',
                        'Ransomware encrypting files in the user\'s Documents folder'
                    ],
                    correct: 1,
                    explanation: 'WDAG runs Microsoft Edge in a lightweight, hardware-isolated Hyper-V container (a "container" at the virtualization level). Even if a malicious website successfully exploits the browser, the malware is contained within this virtual environment and cannot access the host OS, files, credentials, or network. This is particularly useful for protecting against zero-day browser exploits on untrusted networks or websites. WDAG requires Windows 10 Enterprise or Pro with Hyper-V capability.'
                }
            ]
        });
        quiz.start();
    </script>
