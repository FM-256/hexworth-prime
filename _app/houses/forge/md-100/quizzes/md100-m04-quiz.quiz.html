<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 04: Networking - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .page-header { padding: 14px 28px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(234,88,12,0.25); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #ea580c; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        .quiz-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 48px; }
        .quiz-container { width: 100%; max-width: 820px; }

        .quiz-header { background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 24px; }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        .question-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(234,88,12,0.15); border-radius: 10px; padding: 22px; margin-bottom: 16px; transition: border-color 0.2s; }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; cursor: pointer; transition: all 0.18s ease; text-align: left; color: #d1d5db; font-size: 0.9rem; line-height: 1.4; }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; background: rgba(255,255,255,0.1); border-radius: 50%; font-size: 0.75rem; font-weight: 700; color: #9ca3af; }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        .explanation { display: none; margin-top: 12px; padding: 12px 14px; background: rgba(249,115,22,0.08); border-left: 3px solid #ea580c; border-radius: 0 6px 6px 0; font-size: 0.875rem; color: #d1d5db; line-height: 1.55; }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 28px; border-radius: 7px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid rgba(234,88,12,0.35); color: #fb923c; }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        .results-card { display: none; background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 16px; }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        .nav-buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(234,88,12,0.15); }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Networking Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 04 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m04-networking.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
const QUIZ_ID = 'hexworth_md100_m04';

const questions = [
    {
        id: 1,
        topic: 'IPv4 Configuration',
        question: 'A Windows 10 machine displays the IP address 169.254.88.14. What does this indicate?',
        options: [
            'The machine has been assigned a valid static IP',
            'DHCP was unreachable and APIPA self-assigned an address',
            'The machine is connected to an IPv6-only network',
            'A proxy server is intercepting network traffic'
        ],
        correct: 1,
        explanation: 'The 169.254.0.0/16 range is the Automatic Private IP Addressing (APIPA) range. Windows assigns an address from this range when it cannot reach a DHCP server. An APIPA address means the machine can communicate with other APIPA hosts on the local link but cannot reach the internet or other subnets.'
    },
    {
        id: 2,
        topic: 'IPv6',
        question: 'Which IPv6 address type is equivalent to a private (RFC 1918) IPv4 address and is not routed on the public internet?',
        options: [
            'Link-local (fe80::/10)',
            'Unique-local (fc00::/7)',
            'Global unicast (2000::/3)',
            'Multicast (ff00::/8)'
        ],
        correct: 1,
        explanation: 'Unique-local addresses (fc00::/7, commonly fd00::/8) are the IPv6 equivalent of RFC 1918 private addresses - they are routable within an organization but not on the public internet. Link-local (fe80::/10) addresses are not routable beyond the local link. Global unicast addresses are publicly routable.'
    },
    {
        id: 3,
        topic: 'Diagnostic Tools',
        question: 'A user can ping a server by IP address but cannot access it by hostname. Which tool would BEST diagnose this problem?',
        options: [
            'ping with the -t flag',
            'tracert to the server IP',
            'nslookup for the hostname',
            'netstat -an'
        ],
        correct: 2,
        explanation: 'The ability to ping by IP but not by name points to a DNS resolution failure. nslookup directly queries DNS servers and shows whether the hostname resolves correctly and which DNS server responded. tracert tests routing. netstat shows active connections. ping -t runs continuously but does not diagnose name resolution.'
    },
    {
        id: 4,
        topic: 'Hosts File',
        question: 'EXAM TIP: An administrator adds an entry to the hosts file mapping "intranet.company.com" to 192.168.1.100. The DNS server has a different IP for that name. Which resolution is used?',
        options: [
            'DNS, because it is the authoritative source',
            'The hosts file entry, because it takes precedence over DNS',
            'Both are used and the fastest response wins',
            'The hosts file is only used when DNS is unavailable'
        ],
        correct: 1,
        explanation: 'The Windows name resolution order is: hosts file first, then DNS cache, then DNS server query. The hosts file always wins over DNS. This is why malware often modifies the hosts file to redirect users from legitimate sites - and why admins use it for quick local overrides without DNS changes.'
    },
    {
        id: 5,
        topic: 'DNS Troubleshooting',
        question: 'A user reports that a website that was updated 30 minutes ago still shows old content. The IT admin confirms the DNS record changed 2 hours ago. What is the most likely cause?',
        options: [
            'The DNS server is down',
            'The client\'s DNS cache contains the old record and TTL has not expired',
            'The web server has not updated its IP address',
            'The user needs to clear their browser history'
        ],
        correct: 1,
        explanation: 'DNS records are cached on client machines based on the record\'s TTL (Time To Live). Even after the DNS server is updated, clients may keep serving the old cached value until TTL expires. Run "ipconfig /flushdns" to clear the local DNS resolver cache and force a fresh lookup.'
    },
    {
        id: 6,
        topic: 'Wi-Fi Security',
        question: 'A wireless network uses WPA2-Personal. What type of encryption does WPA2 use for data protection?',
        options: [
            'RC4 (stream cipher)',
            'TKIP (Temporal Key Integrity Protocol)',
            'AES-CCMP (Counter Mode with CBC-MAC Protocol)',
            'DES (Data Encryption Standard)'
        ],
        correct: 2,
        explanation: 'WPA2 mandates AES-CCMP as its encryption protocol. TKIP was the encryption used by WPA (the predecessor) and is considered insecure. RC4 was used in the original WEP, which is completely broken. WPA3 uses SAE (Simultaneous Authentication of Equals) with AES-GCMP. If you see WPA2, think AES-CCMP.'
    },
    {
        id: 7,
        topic: 'VPN Protocols',
        question: 'Which Windows VPN protocol uses SSL/TLS over port 443 and is considered the most firewall-friendly because it traverses almost any network restriction?',
        options: [
            'PPTP (Point-to-Point Tunneling Protocol)',
            'L2TP/IPsec',
            'SSTP (Secure Socket Tunneling Protocol)',
            'IKEv2 (Internet Key Exchange version 2)'
        ],
        correct: 2,
        explanation: 'SSTP tunnels PPP traffic over HTTPS (port 443), making it work through firewalls and proxies that block other VPN ports. PPTP uses port 1723 (easily blocked and known insecure). L2TP/IPsec uses ports 500/4500 (often blocked). IKEv2 is fast and mobile-friendly but also uses ports 500/4500.'
    },
    {
        id: 8,
        topic: 'Remote Desktop',
        question: 'Which Windows 10 editions support incoming Remote Desktop connections (as an RDP server host)?',
        options: [
            'All editions including Home',
            'Pro, Enterprise, and Education only',
            'Enterprise and Education only',
            'Pro only'
        ],
        correct: 1,
        explanation: 'Windows 10 Home cannot accept incoming RDP connections (act as an RDP server). Pro, Enterprise, and Education editions include the Remote Desktop Host feature. All editions can use the Remote Desktop client to connect TO other machines. This is a common exam gotcha - Home can initiate RDP but cannot receive it.'
    },
    {
        id: 9,
        topic: 'Network Profiles',
        question: 'A technician connects a Windows 10 laptop to a corporate office network. Windows prompts whether this is a public or private network. Choosing "Private" enables which additional feature?',
        options: [
            'More restrictive firewall rules blocking all inbound traffic',
            'Network discovery and file/printer sharing by default',
            'Automatic VPN connection to the corporate network',
            'Disables Windows Firewall entirely for the network'
        ],
        correct: 1,
        explanation: 'Setting a network profile to Private enables network discovery and file/printer sharing features, treating other machines on the network as trusted. Public profile disables discovery/sharing, appropriate for untrusted networks like coffee shops. Domain profile applies when the machine is domain-joined and managed by Group Policy.'
    },
    {
        id: 10,
        topic: 'PowerShell Remoting',
        question: 'Which PowerShell command establishes an interactive remote session with a computer named SERVER01?',
        options: [
            'Connect-PSSession -ComputerName SERVER01',
            'Enter-PSSession -ComputerName SERVER01',
            'New-PSSession SERVER01',
            'Invoke-Command -ComputerName SERVER01'
        ],
        correct: 1,
        explanation: 'Enter-PSSession creates an interactive 1-to-1 remote shell session. New-PSSession creates a session object for reuse. Invoke-Command runs a scriptblock remotely and returns results but is not interactive. Connect-PSSession reconnects to a disconnected session. Enter-PSSession is the RDP-equivalent for PowerShell remoting.'
    },
    {
        id: 11,
        topic: 'Diagnostic Tools',
        question: 'Which command displays all active TCP/IP connections, listening ports, and associated process IDs on a Windows machine?',
        options: [
            'ipconfig /all',
            'netstat -ano',
            'nslookup -type=all',
            'tracert localhost'
        ],
        correct: 1,
        explanation: 'netstat -ano shows all active connections and listening ports (-a), with numerics instead of names (-n), and the owning process ID (-o). The PID can be cross-referenced in Task Manager to identify which application is using a port. This is essential for detecting unauthorized network listeners.'
    },
    {
        id: 12,
        topic: 'IPv4 Configuration',
        question: 'A static IP configuration shows: IP 192.168.10.50, Subnet Mask 255.255.255.0, Default Gateway 192.168.10.1. The user cannot reach external websites but CAN ping the default gateway. What is the MOST likely cause?',
        options: [
            'Incorrect subnet mask',
            'Missing or incorrect DNS server address',
            'IP address conflict with another device',
            'The default gateway is offline'
        ],
        correct: 1,
        explanation: 'Pinging the gateway confirms local network connectivity is working and the IP/mask/gateway are correct. Being unable to reach external websites despite gateway connectivity points to missing DNS resolution. Without DNS server entries in the IP configuration, hostnames cannot be resolved. Add the correct DNS server IP to fix the issue.'
    },
    {
        id: 13,
        topic: 'Proxy Settings',
        question: 'An organization uses a web proxy that requires authentication. A user can browse most sites but certain applications fail to connect. Where in Windows 10 would the administrator configure system-wide proxy settings?',
        options: [
            'Windows Defender Firewall exceptions',
            'Settings > Network & Internet > Proxy',
            'Internet Explorer > Internet Options > Connections',
            'Both B and C can configure system-wide proxy settings'
        ],
        correct: 3,
        explanation: 'System-wide proxy settings in Windows 10 are configured through either Settings > Network & Internet > Proxy (modern UI) or Internet Options > Connections tab (legacy, stored in WinINet). Both write to the same registry keys. Some applications use the system proxy; others (like Firefox) have their own proxy settings. WinHTTP proxy is separate and configured via "netsh winhttp set proxy".'
    },
    {
        id: 14,
        topic: 'VPN Protocols',
        question: 'EXAM TIP: PPTP is considered insecure and should not be used. Which vulnerability makes PPTP fundamentally broken?',
        options: [
            'It does not support encryption',
            'MS-CHAPv2 authentication is cryptographically weak and easily cracked',
            'It uses port 80 which is monitored',
            'It cannot traverse NAT devices'
        ],
        correct: 1,
        explanation: 'PPTP\'s security depends on MS-CHAPv2 for authentication, which has been definitively broken - tools exist to crack MS-CHAPv2 hashes within hours. A 2012 DefCon presentation demonstrated complete PPTP compromise. Even when PPTP uses MPPE encryption, the underlying authentication weakness makes the entire tunnel compromisable.'
    },
    {
        id: 15,
        topic: 'Diagnostic Tools',
        question: 'A user reports intermittent connectivity to a remote server. Which tool would help identify WHERE in the network path packets are being dropped?',
        options: [
            'ping (continuous with -t)',
            'tracert (trace route)',
            'nslookup',
            'ipconfig /renew'
        ],
        correct: 1,
        explanation: 'tracert (traceroute) sends packets with incrementing TTL values to map each hop along the path to the destination. By comparing round-trip times and identifying where timeouts or high latency begin, administrators can pinpoint which router or network segment is dropping or delaying packets. ping only confirms end-to-end reachability without showing intermediate hops.'
    }
];

const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;
        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
    updateSubmitButton();
}

function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));
    questions[qIdx].options.forEach((_, oi) => {
        document.getElementById('opt-' + qIdx + '-' + oi).className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');
    updateProgress();
    updateSubmitButton();
}

function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const pct = Math.round((answered / questions.length) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + questions.length + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSubmitButton() {
    document.getElementById('submit-btn').disabled = Object.keys(state.answers).length < questions.length;
}

function submitQuiz() {
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) btn.classList.add('correct');
            else if (oi === chosen && !isCorrect) btn.classList.add('incorrect');
        });
        document.getElementById('explanation-' + idx).classList.add('visible');
    });
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';
    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');
    document.getElementById('results-message').textContent = passed
        ? 'Solid networking knowledge. The troubleshooting methodology and VPN protocol distinctions are especially important in real-world scenarios. Keep this sharp.'
        : 'Networking requires knowing both the "what" and "why." Focus on APIPA behavior, DNS resolution order, VPN protocol strengths/weaknesses, and the netstat command output. Retake after review.';
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

renderQuestions();
</script>

</body>
</html>
