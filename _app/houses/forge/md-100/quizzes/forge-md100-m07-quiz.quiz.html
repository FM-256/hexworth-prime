<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 07 Quiz - Forge House</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-100 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 07 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 07',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m07',
            moduleId: 'md100-m07',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A technician needs to deploy a UWP app to 50 Windows 10 Pro workstations without requiring individual Microsoft accounts on each machine. Which solution is designed for this scenario?',
                    options: [
                        'Windows Software Center',
                        'Microsoft Store for Business',
                        'Windows Deployment Services (WDS)',
                        'Group Policy Software Installation'
                    ],
                    correct: 1,
                    explanation: 'Microsoft Store for Business allows organizations to acquire, manage, and distribute apps to their devices without requiring personal Microsoft accounts. It provides a private store experience and supports volume licensing for apps. This is the intended enterprise solution for deploying Store apps at scale.'
                },
                {
                    question: 'What is the key difference between an MSI package and an MSIX package?',
                    options: [
                        'MSI supports 64-bit applications; MSIX only supports 32-bit',
                        'MSIX runs in a container, keeping installations isolated from the OS; MSI writes directly to the registry and file system',
                        'MSIX requires a domain-joined machine; MSI does not',
                        'MSI packages cannot be deployed via Group Policy; MSIX can'
                    ],
                    correct: 1,
                    explanation: 'MSIX is a modern packaging format that runs applications in a lightweight container, preventing registry and file system pollution. This makes installation and uninstallation cleaner and more reliable than legacy MSI packages, which write directly to the Windows registry and system directories. MSIX also supports automatic updates and dependency management.'
                },
                {
                    question: 'An enterprise wants to install an internally developed UWP app that is NOT published to the Microsoft Store. Which Windows feature must be enabled first?',
                    options: [
                        'Windows Sandbox',
                        'Hyper-V',
                        'Sideloading (or Developer Mode)',
                        'Windows Subsystem for Linux'
                    ],
                    correct: 2,
                    explanation: 'Sideloading allows installing app packages (APPX or MSIX) that are not sourced from the Microsoft Store. On Windows 10 version 2004 and later, sideloading is enabled by default. On older builds, it must be explicitly enabled via Settings or Group Policy. Developer Mode is a superset that also enables sideloading.'
                },
                {
                    question: 'Which PowerShell cmdlet is used to install an AppX package on a Windows 10 device?',
                    options: [
                        'Install-Package',
                        'Add-AppxPackage',
                        'Install-AppxPackage',
                        'New-AppxPackage'
                    ],
                    correct: 1,
                    explanation: 'Add-AppxPackage is the correct PowerShell cmdlet for installing APPX and MSIX packages. It supports parameters such as -Path (for local files) and -DependencyPath (for dependency packages). Install-Package works with NuGet/PSGallery providers but not app packages.'
                },
                {
                    question: 'A company runs a legacy internal web application that only works in Internet Explorer. The company has migrated to Microsoft Edge (Chromium). What is the correct solution to continue using this application without reinstalling IE?',
                    options: [
                        'Install the IE Tab Chrome extension in Edge',
                        'Enable IE mode in Microsoft Edge via enterprise policy or edge://settings/defaultBrowser',
                        'Downgrade to a pre-Chromium version of Edge',
                        'Use Windows Compatibility Center to emulate IE'
                    ],
                    correct: 1,
                    explanation: 'IE mode in Microsoft Edge uses the Trident (MSHTML) rendering engine to load specific sites that require Internet Explorer compatibility, while all other sites use the Chromium engine. It can be configured per-site via the Enterprise Mode Site List or directly in Edge settings. This eliminates the need to maintain a separate IE installation for legacy apps.'
                },
                {
                    question: 'Which file format and tool is used by IT administrators to configure Microsoft Edge browser policies across an organization?',
                    options: [
                        'Registry .reg files applied manually to each workstation',
                        'Administrative Templates (ADMX files) deployed via Group Policy',
                        'Edge configuration stored in %AppData%\\Microsoft\\Edge\\config.json',
                        'Microsoft Endpoint Manager device profiles only'
                    ],
                    correct: 1,
                    explanation: 'Microsoft publishes ADMX administrative template files for Edge that can be loaded into Group Policy Management. These templates expose hundreds of configurable Edge settings as Group Policy Objects (GPOs), allowing administrators to enforce browser policies such as homepage, security settings, and allowed extensions across all domain-joined machines.'
                },
                {
                    question: 'What is the fundamental difference between a Feature Update and a Quality Update in Windows as a Service?',
                    options: [
                        'Feature Updates are free; Quality Updates require a license upgrade',
                        'Feature Updates add new OS capabilities and increment the version number; Quality Updates deliver security patches and bug fixes without changing the version',
                        'Quality Updates require a restart; Feature Updates do not',
                        'Feature Updates are delivered monthly; Quality Updates are delivered twice per year'
                    ],
                    correct: 1,
                    explanation: 'Feature Updates (released roughly annually) introduce new Windows features and capabilities, incrementing the build version (e.g., 21H2 to 22H2). Quality Updates are delivered monthly on Patch Tuesday and include security patches, bug fixes, and reliability improvements. Quality Updates do not change the Windows feature set or version number.'
                },
                {
                    question: 'An organization wants to test Windows feature updates on a small group of users before rolling them out broadly. Which servicing channel should the pilot group be assigned to?',
                    options: [
                        'Long-Term Servicing Channel (LTSC)',
                        'General Availability Channel, with a short deferral period',
                        'Windows Insider Program (Release Preview Channel)',
                        'Semi-Annual Enterprise Channel (deferred 180+ days)'
                    ],
                    correct: 2,
                    explanation: 'The Windows Insider Program\'s Release Preview Channel receives updates shortly before they are released broadly, making it ideal for pilot testing. For production environments, IT administrators typically use the General Availability Channel with deferral policies to delay updates after initial release validation. LTSC is designed for fixed-function devices and does not receive feature updates on the regular cadence.'
                },
                {
                    question: 'Which Windows Update infrastructure component allows an organization to approve, test, and selectively deploy updates to client machines from an internal server rather than directly from Microsoft?',
                    options: [
                        'Windows Autopilot',
                        'Windows Server Update Services (WSUS)',
                        'Microsoft Update Catalog',
                        'Delivery Optimization'
                    ],
                    correct: 1,
                    explanation: 'WSUS (Windows Server Update Services) is a free Windows Server role that downloads updates from Microsoft Update and caches them locally. Administrators can approve or decline specific updates, target them to specific computer groups, and create approval deadlines. This gives IT full control over the update deployment process in on-premises environments.'
                },
                {
                    question: 'A network administrator notices that Windows update traffic is consuming significant WAN bandwidth across multiple branch offices. Which built-in Windows 10 feature can reduce this by allowing devices to share update files with each other on the local network?',
                    options: [
                        'BranchCache',
                        'Windows Delivery Optimization',
                        'BITS (Background Intelligent Transfer Service)',
                        'Windows Update for Business'
                    ],
                    correct: 1,
                    explanation: 'Delivery Optimization is a peer-to-peer content distribution feature built into Windows 10 that allows devices to download update packages from other devices on the local network (and optionally from the internet) instead of always downloading from Microsoft servers. This significantly reduces WAN bandwidth consumption. BranchCache is a separate, older caching technology that also reduces branch bandwidth but operates differently.'
                },
                {
                    question: 'A Windows 10 machine repeatedly fails to install a specific cumulative update. After running the Windows Update Troubleshooter, the issue persists. What is the correct next step to manually clear the update cache?',
                    options: [
                        'Delete all files in C:\\Windows\\Temp',
                        'Stop the wuauserv and bits services, delete contents of C:\\Windows\\SoftwareDistribution\\Download, then restart the services',
                        'Run "dism /online /cleanup-image /restorehealth" then reboot',
                        'Disable and re-enable Windows Update in Services.msc'
                    ],
                    correct: 1,
                    explanation: 'The Windows Update download cache is stored in C:\\Windows\\SoftwareDistribution\\Download. To safely clear it, you must first stop the Windows Update service (wuauserv) and Background Intelligent Transfer Service (bits) to release file locks, delete the contents of the Download folder, then restart both services. Windows will re-download the needed update files on the next check. DISM /restorehealth addresses component store corruption, which is a different issue.'
                },
                {
                    question: 'Which type of application package is the NATIVE format used by the Microsoft Store for Universal Windows Platform (UWP) apps?',
                    options: [
                        '.msi',
                        '.exe',
                        '.appx / .msix',
                        '.cab'
                    ],
                    correct: 2,
                    explanation: 'UWP apps distributed through the Microsoft Store use the .appx (older) or .msix (modern) package format. These packages are signed, sandboxed, and managed by Windows. Traditional Win32 desktop applications use .exe or .msi installers, and while these can also be listed in the Store (via the Desktop Bridge / MSIX), they are not native UWP packages.'
                },
                {
                    question: 'Which edition of Windows 10 is specifically designed for specialized systems (ATMs, medical devices, point-of-sale terminals) that need a stable, unchanging OS and should NOT receive semi-annual feature updates?',
                    options: [
                        'Windows 10 Enterprise',
                        'Windows 10 Pro for Workstations',
                        'Windows 10 Long-Term Servicing Channel (LTSC)',
                        'Windows 10 S Mode'
                    ],
                    correct: 2,
                    explanation: 'Windows 10 LTSC (Long-Term Servicing Channel) is designed for fixed-function devices that require maximum stability. It receives security and quality updates for 10 years but does not receive feature updates. It also excludes many consumer apps (Microsoft Edge legacy, Store, Cortana) to reduce the attack surface. It should NOT be deployed on general-purpose business workstations.'
                },
                {
                    question: 'After a failed Windows update, a technician runs "DISM /Online /Cleanup-Image /ScanHealth" and finds component store corruption. What is the correct DISM command to attempt a repair?',
                    options: [
                        'DISM /Online /Cleanup-Image /FixErrors',
                        'DISM /Online /Cleanup-Image /RestoreHealth',
                        'DISM /Online /SFC /Repair',
                        'DISM /Online /Cleanup-Image /CheckHealth'
                    ],
                    correct: 1,
                    explanation: 'DISM /Online /Cleanup-Image /RestoreHealth attempts to repair a corrupted Windows component store by downloading replacement files from Windows Update (or a source specified with /Source). CheckHealth and ScanHealth are read-only diagnostic commands that check for, but do not fix, corruption. /FixErrors is not a valid DISM parameter.'
                },
                {
                    question: 'How long does Microsoft typically support each Windows 10 General Availability Channel (semi-annual) feature update for Home and Pro editions?',
                    options: [
                        '6 months',
                        '18 months',
                        '36 months',
                        '10 years'
                    ],
                    correct: 1,
                    explanation: 'Each Windows 10 feature update for Home and Pro editions receives 18 months of servicing (security and quality updates). Enterprise and Education editions receive 30 months of support for the same release. After end of servicing, devices must upgrade to a newer feature update to continue receiving patches. LTSC editions receive 10 years of support but are a separate product.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
