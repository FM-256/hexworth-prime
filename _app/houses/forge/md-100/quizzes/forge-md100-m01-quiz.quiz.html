<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 01 Quiz - Forge House</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-100 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 01 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 01',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m01',
            moduleId: 'md100-m01',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,
            nextModule: {
                title: 'Module 02: Configure Authorization & Authentication',
                href: 'md-100/presentations/forge-md100-m02-auth-authorization.presentation.html'
            },
            returnLabel: 'Back to MD-100 Course',

            questions: [
                {
                    question: 'A small business owner needs domain join and BitLocker but wants to minimize licensing cost. Which Windows 10 edition is the MINIMUM that meets both requirements?',
                    options: [
                        'Windows 10 Home',
                        'Windows 10 Pro',
                        'Windows 10 Enterprise',
                        'Windows 10 Education'
                    ]
                },
                {
                    question: 'What is the minimum RAM required for a 64-bit installation of Windows 10 according to Microsoft\'s official specification?',
                    options: [
                        '512 MB',
                        '1 GB',
                        '2 GB',
                        '4 GB'
                    ]
                },
                {
                    question: 'What minimum storage space does Microsoft require for a Windows 10 installation?',
                    options: [
                        '16 GB',
                        '20 GB',
                        '32 GB',
                        '64 GB'
                    ]
                },
                {
                    question: 'A technician needs to deploy Windows 10 to 200 identical workstations with a pre-configured application baseline. Which deployment method is MOST efficient?',
                    options: [
                        'Interactive clean install from USB on each machine',
                        'In-place upgrade from Windows 7 on each machine',
                        'Image-based deployment using MDT or SCCM',
                        'Windows Update push via Group Policy'
                    ]
                },
                {
                    question: 'EXAM TIP: A user is running Windows 7 Home Premium and wants to upgrade to Windows 10. Which statement about in-place upgrades is TRUE?',
                    options: [
                        'In-place upgrades from Windows 7 to Windows 10 preserve all apps and settings',
                        'In-place upgrades from Windows 7 to Windows 10 are not supported; a clean install is required',
                        'Only Windows 7 Professional can upgrade in-place to Windows 10',
                        'In-place upgrades require the same or higher edition (Home to Home, Pro to Pro)'
                    ]
                },
                {
                    question: 'Which Microsoft tool is used to migrate user state data (profiles, documents, settings) when performing side-by-side PC migrations?',
                    options: [
                        'Windows Easy Transfer',
                        'USMT (User State Migration Tool)',
                        'DISM (Deployment Image Servicing and Management)',
                        'WDS (Windows Deployment Services)'
                    ]
                },
                {
                    question: 'Windows Deployment Services (WDS) requires which server role to distribute installation images over the network?',
                    options: [
                        'DHCP only',
                        'DNS only',
                        'Both DHCP and DNS',
                        'DHCP is required; DNS is optional'
                    ]
                },
                {
                    question: 'Which Microsoft deployment solution is cloud-based and requires NO on-premises infrastructure for device provisioning?',
                    options: [
                        'MDT (Microsoft Deployment Toolkit)',
                        'SCCM (System Center Configuration Manager)',
                        'Windows Autopilot',
                        'WDS (Windows Deployment Services)'
                    ]
                },
                {
                    question: 'A technician is installing Windows 10 on a new 3 TB hard drive and the system uses UEFI firmware. Which partition table format must be used?',
                    options: [
                        'MBR, because MBR supports drives up to 4 TB',
                        'GPT, because UEFI requires GPT for bootable drives',
                        'MBR, because Windows 10 only supports MBR',
                        'Either MBR or GPT; the choice does not matter with UEFI'
                    ]
                },
                {
                    question: 'EXAM TIP: Which security feature is ONLY available on UEFI systems and helps prevent unauthorized operating systems from loading during boot?',
                    options: [
                        'BitLocker',
                        'Secure Boot',
                        'TPM (Trusted Platform Module)',
                        'Windows Defender'
                    ]
                },
                {
                    question: 'What is the primary purpose of the Windows Assessment and Deployment Kit (ADK)?',
                    options: [
                        'To run compatibility tests on applications before migration',
                        'To provide tools for customizing, assessing, and deploying Windows images',
                        'To monitor system performance in production environments',
                        'To manage Windows updates across an enterprise'
                    ]
                },
                {
                    question: 'A deployment engineer needs to add drivers to a Windows image file (.wim) before deploying it to machines. Which tool should they use?',
                    options: [
                        'Device Manager',
                        'DISM (Deployment Image Servicing and Management)',
                        'Windows Update',
                        'PnPutil'
                    ]
                },
                {
                    question: 'During a clean Windows 10 installation on a GPT disk with UEFI, which partition is created first and is required to boot the system?',
                    options: [
                        'Recovery partition',
                        'Windows (OS) partition',
                        'EFI System Partition (ESP)',
                        'Microsoft Reserved Partition (MSR)'
                    ]
                },
                {
                    question: 'A Windows 10 installation fails with error code 0xC1900101. This code family typically indicates which category of problem?',
                    options: [
                        'Network connectivity failure during download',
                        'Driver compatibility issue',
                        'Insufficient disk space',
                        'Corrupt installation media'
                    ]
                },
                {
                    question: 'Which Windows 10 edition is specifically designed for large enterprises and includes features like DirectAccess, AppLocker, and Credential Guard as standard inclusions?',
                    options: [
                        'Windows 10 Pro',
                        'Windows 10 Pro for Workstations',
                        'Windows 10 Enterprise',
                        'Windows 10 Education'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
