<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 03: Post-Installation Settings - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .page-header {
            padding: 14px 28px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(234,88,12,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a { color: #ea580c; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        .quiz-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 48px; }
        .quiz-container { width: 100%; max-width: 820px; }

        .quiz-header {
            background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        .question-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(234,88,12,0.15); border-radius: 10px; padding: 22px; margin-bottom: 16px; transition: border-color 0.2s; }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; cursor: pointer; transition: all 0.18s ease; text-align: left; color: #d1d5db; font-size: 0.9rem; line-height: 1.4; }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; background: rgba(255,255,255,0.1); border-radius: 50%; font-size: 0.75rem; font-weight: 700; color: #9ca3af; }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        .explanation { display: none; margin-top: 12px; padding: 12px 14px; background: rgba(249,115,22,0.08); border-left: 3px solid #ea580c; border-radius: 0 6px 6px 0; font-size: 0.875rem; color: #d1d5db; line-height: 1.55; }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 28px; border-radius: 7px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid rgba(234,88,12,0.35); color: #fb923c; }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        .results-card { display: none; background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 16px; }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        .nav-buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(234,88,12,0.15); }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Post-Installation Settings Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 03 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m03-config.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
const QUIZ_ID = 'hexworth_md100_m03';

const questions = [
    {
        id: 1,
        topic: 'Settings vs Control Panel',
        question: 'Which interface is Microsoft\'s primary configuration UI in Windows 10 and is designed to eventually replace Control Panel?',
        options: [
            'Microsoft Management Console (MMC)',
            'The Settings app (ms-settings:)',
            'Control Panel',
            'Computer Management'
        ],
        correct: 1,
        explanation: 'Microsoft is progressively migrating configuration options to the Settings app (Win+I) and intends for it to replace Control Panel over time. Many Settings app pages redirect to Control Panel for features not yet migrated, but Settings is the modern primary interface tested on MD-100.'
    },
    {
        id: 2,
        topic: 'Display Settings',
        question: 'A user connects an external 4K monitor and notices Windows renders all text and icons at tiny scale. Which setting corrects this without changing resolution?',
        options: [
            'Screen resolution (lower it to 1920x1080)',
            'Display scaling / DPI scaling (increase to 125% or 150%)',
            'Refresh rate (change to 60 Hz)',
            'Color calibration'
        ],
        correct: 1,
        explanation: 'Display scaling (DPI scaling) adjusts the size of text, apps, and other items without changing the native resolution. Setting a higher percentage (125%, 150%, 200%) makes content larger while preserving the sharpness of the high-resolution display. Reducing resolution would make things larger but blurry.'
    },
    {
        id: 3,
        topic: 'Power Settings',
        question: 'Which power plan is recommended for a desktop workstation that must deliver maximum performance at all times regardless of power consumption?',
        options: [
            'Balanced',
            'Power saver',
            'High performance',
            'Ultimate performance'
        ],
        correct: 3,
        explanation: 'Ultimate Performance (available on Pro/Enterprise) is designed for workstations and eliminates micro-latency from power saving features entirely. High Performance is also valid for performance, but Ultimate Performance goes further. Balanced is the default; Power Saver maximizes battery life at the cost of performance.'
    },
    {
        id: 4,
        topic: 'Registry Editor',
        question: 'Which registry hive contains hardware configuration data and is rebuilt each time Windows boots from data gathered during startup?',
        options: [
            'HKEY_LOCAL_MACHINE\\SOFTWARE',
            'HKEY_CURRENT_USER',
            'HKEY_LOCAL_MACHINE\\HARDWARE',
            'HKEY_LOCAL_MACHINE\\SYSTEM'
        ],
        correct: 2,
        explanation: 'HKLM\\HARDWARE is a volatile hive that is built in memory during each boot by the kernel and hardware detection process. It is not stored on disk as a file. HKLM\\SOFTWARE stores installed software configuration; HKLM\\SYSTEM stores driver and service configuration; HKCU stores the current user\'s settings.'
    },
    {
        id: 5,
        topic: 'Registry Editor',
        question: 'EXAM TIP: An administrator needs to apply a registry change that affects all users who log on to the machine, including new users not yet created. Which hive should be modified?',
        options: [
            'HKEY_CURRENT_USER (HKCU)',
            'HKEY_USERS\\.DEFAULT',
            'HKEY_LOCAL_MACHINE (HKLM)',
            'HKEY_CLASSES_ROOT (HKCR)'
        ],
        correct: 1,
        explanation: 'HKEY_USERS\\.DEFAULT serves as the template for new user profiles. Changes here are copied to HKCU for each new user when their profile is first created. HKLM applies machine-wide settings regardless of user; HKCU applies only to the currently logged-in user. HKCR maps file extension associations.'
    },
    {
        id: 6,
        topic: 'Group Policy',
        question: 'Which command opens the Local Group Policy Editor, and on which Windows 10 editions is it available?',
        options: [
            'gpmc.msc - available on all editions',
            'gpedit.msc - available on Pro, Enterprise, and Education (not Home)',
            'gpedit.msc - available on all editions including Home',
            'secpol.msc - this is the Group Policy Editor'
        ],
        correct: 1,
        explanation: 'gpedit.msc opens the Local Group Policy Object Editor and is available on Windows 10 Pro, Enterprise, and Education. Windows 10 Home does not include gpedit.msc. gpmc.msc is the Group Policy Management Console for domain environments and requires Remote Server Administration Tools. secpol.msc is the Local Security Policy subset of Group Policy.'
    },
    {
        id: 7,
        topic: 'Group Policy',
        question: 'Group Policy settings are applied in which order, from first applied to last applied (last write wins)?',
        options: [
            'Site, Domain, OU, Local',
            'Local, Site, Domain, OU',
            'OU, Domain, Site, Local',
            'Domain, Local, OU, Site'
        ],
        correct: 1,
        explanation: 'Group Policy is applied in LSDOU order: Local first, then Site, then Domain, then Organizational Unit (most specific OU last). Since later-applied settings overwrite earlier ones, OU settings have the highest precedence. This is a critical exam concept - remember the acronym LSDOU.'
    },
    {
        id: 8,
        topic: 'MMC Snap-ins',
        question: 'An administrator wants to create a single management console with Device Manager, Disk Management, and Event Viewer combined. Which tool enables this?',
        options: [
            'Task Manager',
            'Computer Management (compmgmt.msc) - it includes all three by default',
            'Microsoft Management Console (mmc.exe) with custom snap-ins',
            'Windows Admin Center'
        ],
        correct: 2,
        explanation: 'mmc.exe is the empty MMC shell that allows administrators to add any available snap-ins and save the custom console as a .msc file. This creates a tailored management tool. Computer Management already includes those snap-ins but cannot be fully customized. Windows Admin Center is a separate web-based tool.'
    },
    {
        id: 9,
        topic: 'Device Manager',
        question: 'A device in Device Manager shows a yellow exclamation mark (!). What does this indicate?',
        options: [
            'The device is disabled by the administrator',
            'The device has a driver or configuration problem',
            'The device is working normally but has a firmware update available',
            'The device requires a reboot to complete installation'
        ],
        correct: 1,
        explanation: 'A yellow exclamation mark indicates the device has a problem - typically a missing, corrupted, or incompatible driver. A downward arrow indicates a disabled device. A question mark indicates an unknown device with no driver. The Properties dialog and error code provide specific troubleshooting guidance.'
    },
    {
        id: 10,
        topic: 'Driver Management',
        question: 'After updating a graphics driver, a user experiences display corruption and crashes. What is the FASTEST recovery method without reinstalling Windows?',
        options: [
            'Use System Restore to roll back to before the driver update',
            'Use Driver Rollback in Device Manager Properties',
            'Download and reinstall the previous driver version from the manufacturer',
            'Boot into Safe Mode and delete the driver files manually'
        ],
        correct: 1,
        explanation: 'Driver Rollback (Device Manager > Device Properties > Driver tab > Roll Back Driver) instantly reverts to the previously installed driver version. It is the fastest in-OS recovery. System Restore works but takes longer and reverts more than just the driver. Manual download is slower. Safe Mode deletion is a last resort.'
    },
    {
        id: 11,
        topic: 'Driver Signing',
        question: 'EXAM TIP: Windows 10 64-bit requires all kernel-mode drivers to be digitally signed. What happens when an unsigned driver is detected during installation?',
        options: [
            'Windows silently blocks the driver with no notification',
            'Windows installs it with a security warning in the Event Log',
            'Windows blocks installation; the driver cannot be loaded',
            'Windows prompts the user to choose between installing or blocking'
        ],
        correct: 2,
        explanation: 'Windows 10 64-bit enforces mandatory kernel-mode code signing (KMCS). Unsigned kernel-mode drivers will not load - the system blocks them. Administrators can temporarily disable this enforcement via boot options (disable driver signature enforcement) for testing, but it is off by default for security.'
    },
    {
        id: 12,
        topic: 'Environment Variables',
        question: 'Which environment variable contains the path to the current user\'s profile directory (e.g., C:\\Users\\jsmith)?',
        options: [
            '%SYSTEMROOT%',
            '%USERPROFILE%',
            '%APPDATA%',
            '%HOMEPATH%'
        ],
        correct: 1,
        explanation: '%USERPROFILE% points to the root of the current user\'s profile folder (e.g., C:\\Users\\jsmith). %APPDATA% points to the roaming AppData subfolder (C:\\Users\\jsmith\\AppData\\Roaming). %HOMEPATH% gives just the path portion without drive letter (\\Users\\jsmith). %SYSTEMROOT% is the Windows directory (C:\\Windows).'
    },
    {
        id: 13,
        topic: 'Printer Management',
        question: 'A network printer is shared from a Windows 10 workstation. Users on other machines connect to it via \\\\WORKSTATION\\PrinterName. Which service must be running on the host machine for this to work?',
        options: [
            'Print Spooler',
            'Server service',
            'Both Print Spooler and Server service',
            'TCP/IP Print Server'
        ],
        correct: 2,
        explanation: 'Both services are required: the Print Spooler manages print jobs and the printer queue, while the Server service (lanmanserver) enables file and printer sharing over the network via SMB. If either is stopped, network printing fails. TCP/IP Print Server (lpr/lpd) is for Unix-style printing, not Windows shares.'
    },
    {
        id: 14,
        topic: 'Region Settings',
        question: 'A user changes the Windows 10 Region settings to a different country but some applications still display the old date/time format. What is the likely cause?',
        options: [
            'The application has its own locale settings independent of Windows',
            'The user must also change the System Locale setting and restart',
            'Region changes require a full reinstallation to take effect',
            'The user changed Date/Time but not Region in Settings'
        ],
        correct: 0,
        explanation: 'Many applications cache locale data or have their own internationalization settings that do not automatically follow Windows region changes. The user must restart the application or adjust its internal locale settings. The System Locale (language for non-Unicode programs) is a separate setting in Region > Administrative that also requires a restart to take effect.'
    },
    {
        id: 15,
        topic: 'Group Policy',
        question: 'After modifying a Local Group Policy setting, an administrator needs to force immediate application without waiting for the next refresh cycle. Which command should they run?',
        options: [
            'gpupdate',
            'gpupdate /force',
            'gpresult /force',
            'secedit /refreshpolicy'
        ],
        correct: 1,
        explanation: 'gpupdate /force reapplies all Group Policy settings regardless of whether they have changed, forcing an immediate refresh. Plain "gpupdate" only applies changed settings. gpresult is a reporting tool (not an update command). secedit /refreshpolicy was the older Windows XP equivalent, replaced by gpupdate in modern Windows.'
    }
];

const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;
        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
    updateSubmitButton();
}

function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));
    questions[qIdx].options.forEach((_, oi) => {
        document.getElementById('opt-' + qIdx + '-' + oi).className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');
    updateProgress();
    updateSubmitButton();
}

function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const pct = Math.round((answered / questions.length) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + questions.length + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSubmitButton() {
    document.getElementById('submit-btn').disabled = Object.keys(state.answers).length < questions.length;
}

function submitQuiz() {
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) btn.classList.add('correct');
            else if (oi === chosen && !isCorrect) btn.classList.add('incorrect');
        });
        document.getElementById('explanation-' + idx).classList.add('visible');
    });
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';
    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');
    document.getElementById('results-message').textContent = passed
        ? 'Well done. Post-installation configuration covers a wide surface area - Settings, Registry, Group Policy, and drivers. Review any missed topics before the exam.'
        : 'This module is broad. Focus on LSDOU Group Policy order, registry hive functions, and driver signing requirements. These are high-frequency exam topics.';
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

renderQuestions();
</script>

</body>
</html>
