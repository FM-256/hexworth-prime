    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 09 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 09',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m09',
            moduleId: 'md100-m09',
            houseId: 'forge',
            trackProgress: true,
            nextModule: {
                title: 'Module 10: Troubleshoot OS & Apps',
                href: 'md-100/presentations/forge-md100-m10-troubleshoot-os-apps.presentation.html'
            },
            returnLabel: 'Back to MD-100 Course',

            questions: [
                {
                    question: 'A user reports their computer makes a clicking noise and files are disappearing. Following proper troubleshooting methodology, what is the FIRST action a technician should take?',
                    options: [
                        'Immediately replace the hard drive',
                        'Identify the problem by gathering information from the user and documenting symptoms',
                        'Run chkdsk /r on the drive',
                        'Back up the user\'s data'
                    ],
                    correct: 1,
                    explanation: 'The first step in CompTIA\'s troubleshooting methodology is to identify the problem - gather information, question users about recent changes, and document the symptoms. While backup is critically important (and should happen early), you must first understand the problem before taking action. Replacing hardware before diagnosis wastes resources and may not solve the root cause if it is a software or filesystem issue rather than hardware failure.'
                },
                {
                    question: 'After establishing a theory of probable cause and testing it, the theory is confirmed. What is the correct NEXT step in the CompTIA troubleshooting model?',
                    options: [
                        'Document findings, actions, and outcomes',
                        'Establish a plan of action to resolve the problem and implement the solution',
                        'Verify full system functionality and implement preventive measures',
                        'Identify the problem again to confirm accuracy'
                    ],
                    correct: 1,
                    explanation: 'The CompTIA troubleshooting steps in order are: (1) Identify the problem, (2) Establish a theory of probable cause, (3) Test the theory, (4) Establish a plan of action and implement the solution, (5) Verify full functionality and implement preventive measures, (6) Document everything. After confirming a theory, the next step is to create a plan and implement the fix - not yet to verify or document.'
                },
                {
                    question: 'A poorly written driver causes a BSOD (kernel panic). Why does a faulty driver in kernel mode cause system-wide failure rather than just crashing its own process?',
                    options: [
                        'Drivers run in user mode and can crash the OS because they bypass security checks',
                        'Kernel mode code runs with full hardware access and no memory protection boundaries; a crash or memory corruption in kernel mode has no safety net and takes down the entire OS',
                        'The Windows kernel automatically shuts down when any driver encounters an error',
                        'Drivers are isolated in separate virtual machines that when crashed pull down the host'
                    ],
                    correct: 1,
                    explanation: 'Windows runs in two privilege levels: User mode (Ring 3) and Kernel mode (Ring 0). Kernel mode code - including device drivers - has unrestricted access to hardware and system memory. There are no hardware-enforced protection boundaries within kernel mode. A driver that corrupts kernel memory, causes an unhandled exception, or enters an infinite loop at this level crashes the entire operating system because there is no higher authority to catch and isolate the failure.'
                },
                {
                    question: 'A user\'s application stores per-user settings that should NOT affect other users of the same machine. In which registry hive are these settings stored?',
                    options: [
                        'HKEY_LOCAL_MACHINE (HKLM)',
                        'HKEY_CURRENT_USER (HKCU)',
                        'HKEY_CLASSES_ROOT (HKCR)',
                        'HKEY_LOCAL_MACHINE\\SOFTWARE'
                    ],
                    correct: 1,
                    explanation: 'HKEY_CURRENT_USER (HKCU) contains the registry settings for the currently logged-in user and is loaded from each user\'s NTUSER.DAT hive file stored in their profile folder. Settings here affect only that user. HKEY_LOCAL_MACHINE (HKLM) stores machine-wide settings that apply to all users. HKEY_CLASSES_ROOT is a merged view of HKLM\\SOFTWARE\\Classes and HKCU\\SOFTWARE\\Classes used for file association and COM object registration.'
                },
                {
                    question: 'Which registry hive stores hardware configuration, installed drivers, and machine-wide security policies that persist across ALL user logins?',
                    options: [
                        'HKEY_CURRENT_USER',
                        'HKEY_USERS',
                        'HKEY_LOCAL_MACHINE',
                        'HKEY_CURRENT_CONFIG'
                    ],
                    correct: 2,
                    explanation: 'HKEY_LOCAL_MACHINE (HKLM) contains the machine\'s hardware configuration (HARDWARE subkey), installed software (SOFTWARE subkey), security policies (SECURITY subkey), and SAM database (SAM subkey). These settings are global to the computer and apply regardless of which user is logged in. HKEY_CURRENT_CONFIG is a shortcut view into HKLM\\SYSTEM\\CurrentControlSet\\Hardware Profiles\\Current for current hardware profile settings.'
                },
                {
                    question: 'On a UEFI-based Windows 10 system, what is the correct sequence of events from power-on to the Windows desktop loading?',
                    options: [
                        'POST → BIOS → MBR → NTLDR → winload.exe → Windows kernel',
                        'POST → UEFI firmware → Boot Manager (bootmgfw.efi) → winload.efi → Windows kernel → logon',
                        'POST → UEFI firmware → winload.exe → Boot Manager → Windows kernel → logon',
                        'UEFI firmware → POST → Boot Manager → NTLDR → Windows kernel → logon'
                    ],
                    correct: 1,
                    explanation: 'On UEFI systems: POST validates hardware, then UEFI firmware reads the EFI System Partition and loads the Windows Boot Manager (bootmgfw.efi). Boot Manager reads the Boot Configuration Data (BCD) store, then loads winload.efi which initializes the Windows kernel (ntoskrnl.exe), HAL, and boot drivers. The system then proceeds to session initialization and the logon screen. Legacy BIOS systems use MBR → bootmgr → winload.exe (no .efi extension).'
                },
                {
                    question: 'A server has been rebooting unexpectedly. A technician wants to check for critical OS errors that occurred just before each reboot. Which Event Viewer log and event level is most relevant?',
                    options: [
                        'Application log, Warning level events',
                        'System log, Critical and Error level events',
                        'Security log, Audit Failure events',
                        'Setup log, Information level events'
                    ],
                    correct: 1,
                    explanation: 'The System log records events related to Windows components, services, and drivers. Critical and Error level events indicate significant failures. An unexpected reboot triggered by a kernel error will create a Critical event in the System log, often with a BugCheck event (Event ID 1001) that records the BSOD stop code. The Application log captures application-level errors, and the Security log records authentication and audit events, neither of which directly shows kernel crashes.'
                },
                {
                    question: 'Which Windows tool provides a visual timeline of system stability with a reliability score (1-10), correlating application failures, hardware errors, and Windows failures with specific dates?',
                    options: [
                        'Performance Monitor',
                        'Resource Monitor',
                        'Reliability Monitor',
                        'Task Manager'
                    ],
                    correct: 2,
                    explanation: 'Reliability Monitor (perfmon /rel or search "View reliability history") presents a day-by-day stability index graph and categorizes events into: Application failures (red X), Windows failures (red X), Miscellaneous failures, Warnings, and Information events. This makes it easy to correlate a stability drop with a specific software installation or update. It is particularly useful for spotting patterns that Event Viewer shows in isolation but Reliability Monitor ties to the timeline.'
                },
                {
                    question: 'A user reports their computer is very slow. Task Manager shows 85% CPU usage but you need to identify exactly which process is causing disk I/O bottlenecks. Which tool provides this per-process disk activity breakdown?',
                    options: [
                        'Task Manager → Performance tab',
                        'Resource Monitor → Disk tab',
                        'Performance Monitor → System counters',
                        'Event Viewer → System log'
                    ],
                    correct: 1,
                    explanation: 'Resource Monitor (resmon.exe) provides real-time, per-process details for CPU, Memory, Disk, and Network. The Disk tab shows exactly which processes are performing read/write operations, how many bytes per second, and which files they are accessing. Task Manager shows aggregate disk usage but not the granular per-file detail. Performance Monitor uses data collector sets for longer-term trending but is more complex to configure for real-time diagnosis.'
                },
                {
                    question: 'A technician wants to capture CPU, memory, and disk performance metrics over 4 hours while a performance issue is being reported by end users, then review the data later. Which Performance Monitor feature accomplishes this?',
                    options: [
                        'Real-time counter view in Performance Monitor',
                        'Data Collector Set (DCS) configured to log specific counters to a file',
                        'Reliability Monitor with extended logging enabled',
                        'Task Manager performance history export'
                    ],
                    correct: 1,
                    explanation: 'Data Collector Sets (DCS) in Performance Monitor allow you to define which counters to collect (CPU, memory, disk, network), set a schedule or duration, and log the data to a BLG (binary log) file for later analysis. This is the professional approach for capturing performance data over extended periods. The real-time Performance Monitor view cannot be saved as a historical log. Task Manager has no export feature for performance history.'
                },
                {
                    question: 'A user installed a new application yesterday that is now causing Windows to crash. The user has no backups. System Restore is enabled. What does System Restore ACTUALLY restore, and what does it leave unchanged?',
                    options: [
                        'Restores all files including documents and photos to the previous date; nothing is left unchanged',
                        'Restores system files, the registry, and installed programs to the restore point state; personal files (Documents, Desktop, Downloads) are NOT affected',
                        'Only restores the Windows registry; all other files remain at their current state',
                        'Restores Windows to factory default state, removing all installed applications and user files'
                    ],
                    correct: 1,
                    explanation: 'System Restore uses Volume Shadow Copy to capture system files, the Windows registry, driver files, and installed program state. It does NOT touch personal files in user profile folders (Documents, Pictures, Desktop, Downloads, etc.). This is a critical distinction - it reverses software/driver changes without data loss. It is not a substitute for file backup. After restoring, the problematic application will be removed but user-created files remain intact.'
                },
                {
                    question: 'A Windows 10 PC is experiencing persistent instability. The user wants to reinstall Windows but keep their personal files. Which option in "Reset this PC" accomplishes this?',
                    options: [
                        'Remove everything - removes apps, settings, and files',
                        'Keep my files - removes apps and settings but retains personal files',
                        'Restore factory settings - returns to OEM configuration with all original software',
                        'Cloud download - downloads a fresh Windows image from Microsoft servers'
                    ],
                    correct: 1,
                    explanation: '"Keep my files" reinstalls Windows from scratch, removing all installed applications and reverting settings to defaults, but preserves files in user profile folders (Documents, Pictures, Desktop, etc.). "Remove everything" is a full wipe suitable for device decommissioning. "Cloud download" (available in newer Windows 10 builds) is an option for where to get the Windows image, not a separate mode - it can be combined with either Keep my files or Remove everything.'
                },
                {
                    question: 'What is the difference between "Safe Mode" and "Safe Mode with Networking"?',
                    options: [
                        'Safe Mode with Networking enables Wi-Fi but disables Ethernet; standard Safe Mode disables both',
                        'Safe Mode loads minimal drivers only; Safe Mode with Networking also loads the network stack and drivers, enabling internet and network access for downloading tools or drivers',
                        'Safe Mode with Networking enables all third-party drivers but limits startup programs',
                        'There is no functional difference; the names are interchangeable in modern Windows'
                    ],
                    correct: 1,
                    explanation: 'Both Safe Mode variants load only minimal Windows components and skip third-party startup programs. The key difference is that Safe Mode with Networking additionally loads network drivers (NIC, TCP/IP stack, etc.), enabling internet access. This is useful when you need to download drivers, connect to remote tools, or access network shares while troubleshooting. Standard Safe Mode is more isolated, which can be useful when diagnosing network-related crashes.'
                },
                {
                    question: 'A Windows 10 machine fails to boot into Windows after three consecutive failed boot attempts. Windows automatically boots into an environment that allows access to Startup Repair, Command Prompt, and Reset this PC. What is this environment called?',
                    options: [
                        'Windows Safe Mode',
                        'Windows Recovery Environment (WinRE)',
                        'Windows Preinstallation Environment (WinPE)',
                        'System Configuration (msconfig) diagnostic startup'
                    ],
                    correct: 1,
                    explanation: 'Windows Recovery Environment (WinRE) is a lightweight recovery OS based on WinPE that automatically launches after repeated boot failures. It provides tools including Startup Repair (automatically fixes common boot issues), System Restore, Reset this PC, Command Prompt, and System Image Recovery. WinRE is stored in a hidden recovery partition on the drive. WinPE is a more general preinstallation environment used by IT for deployment and is not the same as WinRE.'
                },
                {
                    question: 'A technician suspects a process named "svchost.exe" is consuming unusual CPU. Task Manager shows many svchost.exe instances. How can the technician determine which Windows service is inside a specific svchost.exe instance?',
                    options: [
                        'svchost.exe instances cannot be inspected - each runs a single anonymous service',
                        'Right-click the svchost.exe process in Task Manager → "Go to Services" to see which services are grouped under that instance',
                        'Check the Security log in Event Viewer for service name associations',
                        'Run "net start" in the command prompt to list all services and their PIDs'
                    ],
                    correct: 1,
                    explanation: 'svchost.exe (Service Host) is a generic Windows process that hosts multiple Windows services in a shared process to reduce resource overhead. Right-clicking a svchost.exe instance in Task Manager and selecting "Go to Services" highlights all the services running within that specific process instance. You can also run "tasklist /svc" in the command prompt to list all svchost.exe instances with their associated service names. In Windows 10 (with sufficient RAM), many services run in their own dedicated svchost.exe for better isolation.'
                }
            ]
        });
        quiz.start();
    </script>
