<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-100 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 05 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 05',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m05',
            moduleId: 'md100-m05',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,
            nextModule: {
                title: 'Module 06: Configure Data Access & Usage',
                href: 'md-100/presentations/forge-md100-m06-data-access.presentation.html'
            },
            returnLabel: 'Back to MD-100 Course',

            questions: [
                {
                    question: 'EXAM TIP: What is the maximum number of primary partitions on a Basic MBR disk?',
                    options: [
                        '2',
                        '3',
                        '4',
                        '128'
                    ],explanation: 'MBR disks support a maximum of 4 primary partitions. To work around this limit, one partition can be an Extended partition containing multiple logical drives. GPT disks support up to 128 partitions with no extended/logical partition distinction. Dynamic disks do not have this 4-partition limit either.'
                },
                {
                    question: 'What is the maximum volume size supported by MBR partitioning with a 512-byte sector size?',
                    options: [
                        '1 TB',
                        '2 TB',
                        '4 TB',
                        '16 TB'
                    ],explanation: 'MBR uses 32-bit sector addressing with 512-byte sectors, giving a maximum addressable size of approximately 2 TB (2^32 x 512 bytes). Drives larger than 2 TB require GPT partitioning. This limitation is the primary technical reason GPT was developed as the successor to MBR.'
                },
                {
                    question: 'A dynamic disk volume spans multiple physical disks to create one large logical volume with no redundancy or performance improvement. Which volume type is this?',
                    options: [
                        'Simple volume',
                        'Spanned volume',
                        'Striped volume (RAID-0)',
                        'Mirrored volume (RAID-1)'
                    ],explanation: 'A spanned volume extends across multiple disks sequentially - the first disk is filled before data moves to the next. There is no performance gain and no redundancy; losing any disk in the span loses all data. A striped volume (RAID-0) writes across disks simultaneously for performance but also has no redundancy.'
                },
                {
                    question: 'Which dynamic disk volume type improves read/write performance by writing data simultaneously across multiple disks but provides NO fault tolerance?',
                    options: [
                        'Simple volume',
                        'Spanned volume',
                        'Striped volume (RAID-0)',
                        'Mirrored volume (RAID-1)'
                    ],explanation: 'RAID-0 (striped volume) splits data into stripes written simultaneously across two or more disks, improving throughput. However, if any disk fails, ALL data is lost - it has zero redundancy. RAID-1 (mirrored) duplicates data for fault tolerance but does not improve write performance.'
                },
                {
                    question: 'EXAM TIP: A user wants to copy a 10 GB video file to a USB flash drive but receives an error that the file is too large. The drive is formatted as FAT32. What is the FAT32 file size limit?',
                    options: [
                        '2 GB',
                        '4 GB',
                        '8 GB',
                        'No limit'
                    ],explanation: 'FAT32 has a maximum individual file size of 4 GB (specifically 4 GB minus 1 byte, due to 32-bit file size fields). A 10 GB file exceeds this limit. The solution is to format the drive as exFAT (supports files up to 16 EB) or NTFS (also supports very large files). exFAT is generally preferred for removable drives due to cross-platform compatibility.'
                },
                {
                    question: 'Which file system is designed for flash drives and memory cards, supports large files, but does NOT include journaling or file-level permissions?',
                    options: [
                        'NTFS',
                        'FAT32',
                        'exFAT',
                        'ReFS'
                    ],explanation: 'exFAT (Extended FAT) was designed by Microsoft for removable media. It supports large files (beyond FAT32\'s 4 GB limit) and large volumes, and is compatible with Windows, macOS, and Linux. It does not have NTFS permissions or journaling, making it lightweight and appropriate for flash storage.'
                },
                {
                    question: 'A user sets up Storage Spaces with a two-way mirror resiliency. How many physical drives are the minimum required?',
                    options: [
                        '1',
                        '2',
                        '3',
                        '4'
                    ],explanation: 'Two-way mirror (equivalent to RAID-1) requires a minimum of 2 physical drives - it writes two copies of all data. Three-way mirror requires 5 drives minimum. Parity (similar to RAID-5) requires 3 drives minimum. Storage Spaces manages these automatically through the Storage Pool abstraction.'
                },
                {
                    question: 'Which Storage Spaces resiliency type uses parity information spread across drives to survive one disk failure while being more storage-efficient than mirroring?',
                    options: [
                        'Two-way mirror',
                        'Three-way mirror',
                        'Simple (no resiliency)',
                        'Parity'
                    ],explanation: 'Storage Spaces Parity is similar to RAID-5 - it stores parity data across drives so the pool survives a single disk failure. It is more storage-efficient than mirroring (e.g., 3 drives give ~2/3 usable space vs 1/2 for two-way mirror) but has slower write performance due to parity calculations.'
                },
                {
                    question: 'What is the difference between Disk Cleanup and Storage Sense in Windows 10?',
                    options: [
                        'Disk Cleanup removes files from all users; Storage Sense only removes files for the current user',
                        'Storage Sense can run automatically on a schedule; Disk Cleanup is manual only',
                        'Storage Sense removes system files; Disk Cleanup only removes personal files',
                        'They are identical tools; Storage Sense is just the newer UI for the same functionality'
                    ],explanation: 'Storage Sense (Settings > System > Storage) can be configured to run automatically when disk space is low or on a schedule, automatically cleaning temporary files, Recycle Bin, and Downloads. Disk Cleanup (cleanmgr.exe) is the traditional manual tool. Storage Sense is the modern replacement; Disk Cleanup may be deprecated in future Windows versions.'
                },
                {
                    question: 'A technician needs to check a system drive for file system errors and repair them. The drive is in use and cannot be locked. What happens when "chkdsk C: /f" is run?',
                    options: [
                        'chkdsk runs immediately in read-only mode',
                        'chkdsk fails with an error and cannot proceed',
                        'chkdsk schedules itself to run at the next system restart',
                        'chkdsk forces the drive offline and runs immediately'
                    ],explanation: 'When chkdsk /f cannot lock the volume because it is in use (such as the system drive C:), it asks if you want to schedule it for the next restart. On reboot, chkdsk runs before Windows loads so the drive is not locked. This is the expected behavior on active system volumes.'
                },
                {
                    question: 'Disk quotas in Windows 10 are configured per-user on NTFS volumes. What happens when a user reaches their disk quota limit?',
                    options: [
                        'Windows automatically compresses their files to make room',
                        'The user cannot save any more files to that volume until space is freed',
                        'An email alert is sent to the administrator automatically',
                        'Windows moves older files to the Recycle Bin to free space'
                    ],explanation: 'When a user hits their hard quota limit on an NTFS volume, Windows returns an "out of disk space" error - the user cannot write additional data until they delete files to fall below the limit. A warning threshold can also be configured to alert before the hard limit is reached. Alerts appear in Event Viewer; automatic email requires additional configuration.'
                },
                {
                    question: 'Why should you NOT run traditional defragmentation on a Solid State Drive (SSD)?',
                    options: [
                        'SSDs are too fast for defragmentation to provide any benefit',
                        'Defragmentation causes unnecessary write cycles that reduce SSD lifespan without improving performance',
                        'SSDs cannot be defragmented by Windows - it will throw an error',
                        'Defragmentation reformats the drive, erasing all data'
                    ],explanation: 'SSDs have no mechanical read heads, so file fragmentation does not cause performance degradation as it does on HDDs. Running defragmentation generates large numbers of write operations across the SSD, consuming limited write cycles (P/E cycles) and reducing the drive\'s lifespan without benefit. Windows 10 automatically detects SSDs and runs TRIM instead of defragmentation.'
                },
                {
                    question: 'Which diskpart command sequence correctly creates and formats a new partition on Disk 1?',
                    options: [
                        'select disk 1 > create partition primary > format fs=ntfs quick > assign',
                        'select disk 1 > new partition > format ntfs > mount',
                        'partition disk 1 primary > format quick ntfs > letter=D',
                        'disk select 1 > create part > format ntfs > assign letter'
                    ],explanation: 'The correct diskpart sequence is: select disk [n], create partition primary (or extended/logical), format fs=ntfs quick (or fs=fat32), assign (to auto-assign a drive letter) or assign letter=[x]. diskpart commands must be in this order: select, create, format, then assign. The syntax is strict - wrong order or keywords will fail.'
                },
                {
                    question: 'EXAM TIP: A technician is setting up a dual-boot system with both Windows 10 and Linux. Which file system for the shared data partition provides the best cross-OS compatibility?',
                    options: [
                        'NTFS, because both Windows and Linux support it natively',
                        'exFAT, because both Windows and Linux can read/write it',
                        'FAT32, because it is universally supported but has the 4 GB file limit',
                        'ReFS, because it is the most modern Microsoft file system'
                    ],explanation: 'exFAT offers the best balance for cross-platform use: no 4 GB file size limit (unlike FAT32), native read/write support in modern Linux kernels (since kernel 5.4) and macOS, and good performance. NTFS has limited Linux write support (historically via ntfs-3g). ReFS is Windows-only. For a shared partition, exFAT is the practical modern choice.'
                },
                {
                    question: 'A new 2 TB hard drive shows as "Unallocated" in Disk Management. Before creating a partition, what initialization step is required if you want to use GPT?',
                    options: [
                        'No initialization needed; GPT is applied automatically during partitioning',
                        'Right-click the disk header and select "Initialize Disk", then choose GPT',
                        'Convert the disk from Basic to Dynamic first',
                        'Run "diskpart clean" to prepare the disk for GPT'
                    ],explanation: 'A brand new disk shows as "Not Initialized" in Disk Management. Right-clicking the disk header and selecting "Initialize Disk" presents a choice between MBR and GPT. GPT is recommended for all modern installations, especially for drives over 2 TB. Without initialization, you cannot create partitions on the disk.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
