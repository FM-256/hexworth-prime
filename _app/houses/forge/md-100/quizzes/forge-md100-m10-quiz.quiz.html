<body>

        <a href="../../index.html">&larr; Back to Forge House</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-100 Module 10 Quiz',
            description: 'Microsoft 365 Certified: Modern Desktop - Module 10',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md100-m10',
            moduleId: 'md100-m10',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'File History is enabled on a Windows 10 machine saving to a network share. A user accidentally deletes a document from their Desktop. How does the user recover the previous version of the file?',
                    options: [
                        'Right-click the Recycle Bin → Restore previous versions',
                        'Open File History (Control Panel → File History → Restore personal files) and navigate to the file\'s backup date',
                        'Run "winfr C: D: /regular" to recover deleted files',
                        'Use DISM /Online /RestoreHealth to recover deleted user files'
                    ],
                    correct: 1,
                    explanation: 'File History continuously backs up files in libraries, Desktop, Contacts, and Favorites to a designated drive. To restore, open Control Panel → File History → Restore personal files (or search "Restore your files with File History"). You can browse the file history timeline and restore any previous version. The Windows File Recovery (winfr) tool is for recovering files from drives without a backup, using raw disk scanning.'
                },
                {
                    question: 'A user right-clicks a folder and does not see the "Restore previous versions" option. What is the most likely reason?',
                    options: [
                        'The user does not have administrative privileges',
                        'System Protection (Volume Shadow Copy) is not enabled for that drive, or no restore points have been created yet',
                        'The folder is on an NTFS drive; only FAT32 drives support previous versions',
                        'Previous Versions only works for files, not folders'
                    ],
                    correct: 1,
                    explanation: 'Previous Versions uses shadow copies created by the Volume Shadow Copy Service (VSS) when System Protection is enabled. If System Protection is disabled for a drive (or was never enabled), no shadow copies exist and the Previous Versions tab will be empty or the option will not appear. System Protection is enabled by default for the system drive (C:) but must be manually enabled for other drives. File History is a separate feature from Previous Versions/shadow copies.'
                },
                {
                    question: 'A user accidentally formatted a USB drive and lost several files. There is no backup. Which Windows 10 command-line tool can attempt to recover the files from the formatted drive?',
                    options: [
                        'sfc /scannow',
                        'winfr',
                        'chkdsk /r',
                        'diskpart'
                    ],
                    correct: 1,
                    explanation: 'Windows File Recovery (winfr.exe) is a Microsoft tool (available from the Microsoft Store for Windows 10 version 2004+) that uses two modes: Default mode (for recently deleted files on NTFS) and Segment/Signature mode (for heavily damaged or formatted drives). Example usage: "winfr D: E:\\Recovery /n *.docx". It searches raw disk sectors for file signatures and recovers what it finds. Success rate depends on how much data has been overwritten since deletion/format.'
                },
                {
                    question: 'A legacy application designed for Windows XP fails to run on Windows 10. The error indicates it requires administrator privileges but also fails even when run as administrator. What should the technician try FIRST?',
                    options: [
                        'Reinstall Windows 10 in XP compatibility mode',
                        'Right-click the executable → Properties → Compatibility tab → Run this program in compatibility mode for Windows XP',
                        'Downgrade the PC to Windows XP',
                        'Disable User Account Control (UAC) system-wide'
                    ],
                    correct: 1,
                    explanation: 'Compatibility Mode changes how Windows presents the OS environment to the application - it reports an older Windows version, adjusts visual theme APIs, and modifies some behavioral API responses. This resolves many failures caused by apps checking for specific OS version numbers. You can also run as administrator, disable display scaling on high DPI, and reduce color depth from this same tab. Disabling UAC system-wide is a security risk and should never be a first-line fix.'
                },
                {
                    question: 'A user installs a new application and immediately gets an error: "MSVCP140.dll was not found." What is the correct fix?',
                    options: [
                        'Reinstall Windows 10',
                        'Copy the DLL manually from another computer',
                        'Install the Microsoft Visual C++ 2015-2022 Redistributable package',
                        'Run sfc /scannow to restore the missing system file'
                    ],
                    correct: 2,
                    explanation: 'MSVCP140.dll is part of the Microsoft Visual C++ 2015 Redistributable runtime. Many applications built with Visual Studio require this runtime to be installed separately. The correct fix is to download and install the appropriate Visual C++ Redistributable from Microsoft (matching the architecture - x86 or x64 - of the application). Manually copying DLLs is error-prone and can create version conflicts. SFC only repairs Windows system files, not third-party redistributable DLLs.'
                },
                {
                    question: 'A Windows 10 machine displays "BOOTMGR is missing" on startup. Which bootrec command specifically repairs or rebuilds the Windows Boot Manager?',
                    options: [
                        'bootrec /fixmbr',
                        'bootrec /fixboot',
                        'bootrec /rebuildbcd',
                        'bootrec /scanos'
                    ],
                    correct: 1,
                    explanation: 'bootrec /fixboot writes a new boot sector to the system partition, which is where the Windows Boot Manager resides. bootrec /fixmbr repairs the Master Boot Record on the disk but does not address the boot sector on the partition. bootrec /rebuildbcd scans for Windows installations and rebuilds the Boot Configuration Data (BCD) store - useful when the BCD is corrupt or missing but not when the boot sector itself is damaged. These commands are run from WinRE Command Prompt.'
                },
                {
                    question: 'A technician runs "bootrec /rebuildbcd" but receives "Total identified Windows installations: 0." What does this indicate and what is a possible next step?',
                    options: [
                        'Windows is not installed on this machine; install Windows before running bootrec',
                        'The Windows installation directory cannot be found, possibly due to partition table corruption or a non-standard install path - advanced repair using bcdedit or disk imaging tools may be needed',
                        'The bootrec command failed; re-run it with elevated privileges',
                        'Windows is installed on a GPT disk; bootrec does not support GPT and cannot rebuild the BCD'
                    ],
                    correct: 1,
                    explanation: 'bootrec /rebuildbcd scans available disks for Windows installations. "0 identified" means it cannot locate a Windows installation, which can indicate: a corrupt partition table, the Windows partition is not recognized/accessible, BitLocker is locking the drive, or the Windows directory is in an unexpected location. Next steps include using bcdedit /import or manually adding an entry with bcdedit /create, or using Startup Repair from WinRE which automates these advanced steps. bootrec fully supports GPT disks on UEFI systems.'
                },
                {
                    question: 'Windows Startup Repair runs automatically but fails to fix the boot problem, stating "Startup Repair cannot repair this computer automatically." What information can be found to help diagnose the failure further?',
                    options: [
                        'The Startup Repair log is unavailable after a failed repair attempt',
                        'Click "View advanced options for system recovery and support" or check the log at X:\\Windows\\System32\\LogFiles\\Srt\\SrtTrail.txt from WinRE Command Prompt',
                        'Startup Repair stores its log only on Microsoft\'s servers and requires internet access to retrieve',
                        'Check Device Manager after booting into Safe Mode for the error code'
                    ],
                    correct: 1,
                    explanation: 'When Startup Repair fails, it displays a link to view the repair log. From WinRE Command Prompt, the detailed diagnostic log is located at C:\\Windows\\System32\\LogFiles\\Srt\\SrtTrail.txt (the drive letter may be X: in the recovery environment). This log shows exactly what Startup Repair checked and why it could not automatically fix the problem, providing specific file names or boot configuration elements that require manual repair.'
                },
                {
                    question: 'A critical Windows service is set to "Automatic" startup but has stopped. A technician wants to configure it to automatically restart up to 3 times if it fails again. Where is this configured?',
                    options: [
                        'Task Scheduler → Create Basic Task',
                        'services.msc → right-click service → Properties → Recovery tab',
                        'Group Policy → Computer Configuration → Windows Settings → System Services',
                        'Registry Editor → HKLM\\SYSTEM\\CurrentControlSet\\Services\\[ServiceName]'
                    ],
                    correct: 1,
                    explanation: 'The Recovery tab in a service\'s Properties (services.msc) allows configuring automatic responses to service failures. You can set first, second, and subsequent failure actions: Take No Action, Restart the Service, Run a Program, or Restart the Computer. You can also set a reset counter (after how many days the failure count resets to zero). This is the standard, GUI-accessible way to configure service recovery behavior. The same can be done via sc.exe failure command for scripting.'
                },
                {
                    question: 'A technician needs to change a service named "Spooler" from Manual to Automatic startup via the command line for scripting purposes. Which sc.exe command accomplishes this?',
                    options: [
                        'sc config Spooler start= auto',
                        'sc set Spooler startup=automatic',
                        'sc modify Spooler -starttype auto',
                        'net config Spooler /startup:auto'
                    ],
                    correct: 0,
                    explanation: 'The sc.exe config command modifies service configuration. The syntax is "sc config [ServiceName] [parameter]= [value]". Note the critical gotcha: there must be a space AFTER the equals sign (start= auto, not start=auto). Valid startup type values are: auto, demand (manual), disabled, delayed-auto. The net command can start/stop services but cannot change their startup type. This is a common exam question specifically because of the space-after-equals syntax.'
                },
                {
                    question: 'A technician runs "sfc /scannow" and receives "Windows Resource Protection found corrupt files but was unable to fix some of them." What should be run next and why?',
                    options: [
                        'Run sfc /scannow again immediately - it will fix remaining files on the second pass',
                        'Run DISM /Online /Cleanup-Image /RestoreHealth first to repair the component store, then run sfc /scannow again',
                        'Reinstall Windows - SFC failure means the installation is beyond repair',
                        'Run chkdsk /f to fix file system errors that are blocking SFC repairs'
                    ],
                    correct: 1,
                    explanation: 'SFC repairs corrupt system files by replacing them with cached copies from the Windows component store (WinSxS folder). If the component store itself is corrupt, SFC cannot source good replacement files and will fail. DISM /RestoreHealth repairs the component store by downloading replacement files from Windows Update. Once the component store is healthy, re-running SFC will have a good source to repair from. This SFC-fails-then-DISM-then-SFC sequence is the standard two-stage repair procedure.'
                },
                {
                    question: 'A Windows 10 machine has suffered catastrophic OS corruption. A system image backup was created last week using Windows Backup. The machine boots into WinRE. Which recovery option restores the entire system from the image?',
                    options: [
                        'Reset this PC → Keep my files',
                        'System Image Recovery (under Advanced Options → System Image Recovery)',
                        'Startup Repair will automatically detect and restore from the system image',
                        'Restore previous Windows version'
                    ],
                    correct: 1,
                    explanation: 'System Image Recovery (accessible from WinRE → Troubleshoot → Advanced options → System Image Recovery) restores the entire drive from a system image backup created with the "Backup and Restore (Windows 7)" feature or Windows Server Backup. It overwrites the current drive content entirely with the image content. This is a bare-metal recovery scenario. "Reset this PC" is a reinstall option, not a restore from backup - it does not use a system image.'
                },
                {
                    question: 'A Windows 10 PC was working fine until a power outage during a Windows update. Now it loops between WinRE and failed boot attempts. Startup Repair has failed. The BCD is intact. What is the likely cause and correct command to attempt repair?',
                    options: [
                        'Corrupt MBR - run bootrec /fixmbr',
                        'Corrupt or partially applied Windows update files in the component store - run DISM /Online /Cleanup-Image /RestoreHealth from WinPE',
                        'Virus infection - run Windows Defender from the command line',
                        'Corrupt user profile - run netplwiz to rebuild the profile'
                    ],
                    correct: 1,
                    explanation: 'A power outage during a Windows update frequently results in a partially applied update with corrupt component store entries. Since the system cannot boot, DISM must be run offline (from WinRE/WinPE Command Prompt). The command requires specifying the Windows installation path: "DISM /Image:C:\\ /Cleanup-Image /RestoreHealth /Source:C:\\Windows\\WinSxS". If the local source is also corrupt, a repair source (installation media) must be specified with the /Source:wim: path. SFC can then be run offline as well: "sfc /scannow /offbootdir=C:\\ /offwindir=C:\\Windows".'
                },
                {
                    question: 'A .NET application displays ".NET Framework initialization error: Unable to find a version of the runtime to run this application." The app requires .NET Framework 3.5. Why might this fail on a clean Windows 10 install?',
                    options: [
                        '.NET Framework is not compatible with Windows 10; only .NET Core runs on Windows 10',
                        '.NET Framework 3.5 is not installed by default on Windows 10; it must be enabled as an optional Windows feature (it includes .NET 2.0 and 3.0)',
                        '.NET Framework 3.5 requires a paid license separate from the Windows license',
                        '.NET Framework 3.5 can only be installed on Windows 10 Pro, not Home'
                    ],
                    correct: 1,
                    explanation: '.NET Framework 3.5 (which includes .NET 2.0 and 3.0) is an optional Windows feature not enabled by default in Windows 10. It can be enabled via: Settings → Apps → Optional features → Add a feature, or Control Panel → Programs → Turn Windows features on or off, or via DISM: "dism /online /enable-feature /featurename:NetFx3". The installation requires access to Windows Update or installation media as a source. .NET 4.x versions come pre-installed with Windows 10.'
                },
                {
                    question: 'What is a critical operational difference between File History and Volume Shadow Copy / Previous Versions that an IT pro must understand?',
                    options: [
                        'File History only backs up system files; Previous Versions only backs up user files',
                        'File History requires an external or network drive destination and runs continuously; Previous Versions uses shadow copies stored ON the same volume and is created automatically with restore points',
                        'File History stores full backups; Previous Versions stores incremental backups only',
                        'They are two names for the same feature and behave identically'
                    ],
                    correct: 1,
                    explanation: 'This distinction is exam-critical. File History requires a separate drive (external USB or network share) as its destination and was designed as the user-focused file backup solution in Windows 8+. Volume Shadow Copy / Previous Versions stores shadow copies directly on the source volume in reserved hidden storage (controlled by the VSS Shadow Storage allocation). File History is therefore resilient to drive failure (data is on a separate physical location), while shadow copies are lost if the source drive fails or is formatted. Both can restore previous file versions but from different mechanisms.'
                }
            ]
        });
        quiz.start();
    </script>
