    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'A+ Core 2: Chapters 19-22',
            description: 'Documentation, Incident Response & Professional Conduct',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-aplus-core2-ch19-22',
            moduleId: 'aplus-core2-ch19-22',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'Which of the following is a best practice when implementing documentation in support systems?',
                    options: [
                        'Only document major system changes',
                        'Use ticketing systems to track issues',
                        'Avoid documenting user information for privacy reasons',
                        'Keep all documentation in a single shared file'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Use ticketing systems to track issues'
                },
                {
                    question: 'When following the chain of custody for incident response, it\'s only necessary to document who obtained the evidence, not who controlled it throughout the process.',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is False.'
                },
                {
                    question: 'Which of the following is considered appropriate professional behavior in a technical support role?',
                    options: [
                        'Texting while interacting with customers',
                        'Taking personal calls during customer interactions',
                        'Maintaining confidentiality',
                        'Discussing personal opinions about customer issues'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Maintaining confidentiality'
                },
                {
                    question: 'In incident response, the ________ refers to the sequence in which evidence should be collected based on how quickly it might be lost or changed.',
                    options: [
                        'order of volatility',
                        'chain of custody',
                        'forensic analysis',
                        'risk assessment'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is: "order of volatility"'
                },
                {
                    question: 'Which of the following is a key component of change management best practices?',
                    options: [
                        'Implementing changes without documentation',
                        'Having a rollback plan',
                        'Avoiding business process documentation',
                        'Making changes during peak business hours'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Having a rollback plan'
                },
                {
                    question: 'When responding to a security incident, which of the following approaches involves actively looking for security incidents?',
                    options: [
                        'Passive response',
                        'Active response',
                        'Proactive response',
                        'Reactive response'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Active response'
                },
                {
                    question: 'When dealing with a difficult customer, it is better to validate someone\'s feelings rather than react to them.',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is True.'
                },
                {
                    question: 'Which of the following is considered regulated data that requires special handling?',
                    options: [
                        'Public company information',
                        'Personal government-issued information',
                        'Open-source licensed software',
                        'Public website content'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Personal government-issued information'
                },
                {
                    question: 'After recovering from an incident, a(n) ________ meeting should be held to review all documents and findings related to the incident.',
                    options: [
                        'hot wash',
                        'chain of custody',
                        'forensic analysis',
                        'risk assessment'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is: "hot wash"'
                },
                {
                    question: 'Which of the following remote access technologies is mentioned in the CompTIA A+ study materials?',
                    options: [
                        'SSH',
                        'RDP',
                        'FTP',
                        'HTTP'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: RDP'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
