    <script>
        HouseRenderer.init({
            houseId: 'forge',
            icon: '⚒️',
            title: 'Forge',
            fullTitle: 'House of the Forge',
            domain: 'Hardware & Systems',
            description: 'Build and configure the physical and virtual machines that power our digital world. Master hardware components, operating systems, and system administration from the metal up.',
            certBadges: ['A+ Core 1', 'A+ Core 2'],
            paths: [
                { id: 'comptia-aplus-core1', icon: '🔧', name: 'Hardware Essentials', cert: 'CompTIA A+ Core 1', href: 'applets/comptia-aplus/core-1/index.html' },
                { id: 'comptia-aplus-core2', icon: '💻', name: 'Operating Systems', cert: 'CompTIA A+ Core 2', href: 'applets/comptia-aplus/core-2/index.html' }
            ],
            modules: SAMPLE_MODULES,
            categories: CATEGORIES
        });

        // Update certification path progress rings from localStorage
        function updatePathProgress() {
            const pathCards = document.querySelectorAll('.path-card');
            const circumference = 126;

            // Core 1: 12 chapters (ch01-ch12), key: aplus-core1-progress
            const core1Progress = JSON.parse(localStorage.getItem('aplus-core1-progress') || '{}');
            let core1Completed = 0;
            for (let i = 1; i <= 12; i++) {
                const key = 'ch' + String(i).padStart(2, '0');
                if (core1Progress[key] && core1Progress[key].completed) core1Completed++;
            }
            const core1Pct = Math.round((core1Completed / 12) * 100);

            // Core 2: 12 chapters (ch13-ch24), key: aplus-core2-progress
            const core2Progress = JSON.parse(localStorage.getItem('aplus-core2-progress') || '{}');
            let core2Completed = 0;
            for (let i = 13; i <= 24; i++) {
                const key = 'ch' + i;
                if (core2Progress[key] && core2Progress[key].completed) core2Completed++;
            }
            const core2Pct = Math.round((core2Completed / 12) * 100);

            // Apply to path cards (Core 1 is first, Core 2 is second)
            [core1Pct, core2Pct].forEach((pct, idx) => {
                if (pathCards[idx]) {
                    const fill = pathCards[idx].querySelector('.path-progress-fill');
                    const text = pathCards[idx].querySelector('.path-progress-text');
                    if (fill) fill.style.strokeDashoffset = circumference - (circumference * pct / 100);
                    if (text) text.textContent = pct + '%';
                }
            });
        }

        updatePathProgress();
    </script>
