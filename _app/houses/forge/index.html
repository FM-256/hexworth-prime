    <script>
        const SAMPLE_MODULES = ContentCatalog.getHouseModules('forge');

        HouseRenderer.init({
            houseId: 'forge',
            emblem: '/assets/images/emblems/forge.webp',
            icon: '⚒️',
            title: 'Forge',
            fullTitle: 'House of the Forge',
            domain: 'Hardware & Systems',
            description: 'Build and configure the physical and virtual machines that power our digital world. Master hardware components, operating systems, and system administration from the metal up.',
            certBadges: ['A+ Core 1', 'A+ Core 2', 'MD-100', 'MD-101'],
            searchPlaceholder: 'Search hardware modules... (CPU, RAM, BIOS, troubleshooting)',
            paths: [
                { id: 'comptia-aplus-core1', icon: '<img src="/assets/images/categories/aplus-core1.webp" alt="Hardware Essentials" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Hardware Essentials', cert: 'CompTIA A+ Core 1', href: 'applets/comptia-aplus/core-1/index.html' },
                { id: 'comptia-aplus-core2', icon: '<img src="/assets/images/categories/aplus-core2.webp" alt="Operating Systems" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Operating Systems', cert: 'CompTIA A+ Core 2', href: 'applets/comptia-aplus/core-2/index.html' },
                { id: 'md-100', icon: '<img src="/assets/images/categories/md-100.webp" alt="Windows Client" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Windows Client', cert: 'MD-100', href: 'md-100/index.html' },
                { id: 'md-101', icon: '<img src="/assets/images/categories/windows-os.webp" alt="Modern Desktops" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Modern Desktops', cert: 'MD-101', href: 'md-101/index.html' }
            ],
            modules: SAMPLE_MODULES,
            categories: CATEGORIES
        });

        // Update certification path progress rings from localStorage
        function updatePathProgress() {
            const pathCards = document.querySelectorAll('.path-card');
            const circumference = 126;

            // Core 1: 12 chapters (ch01-ch12), key: aplus-core1-progress
            const core1Progress = JSON.parse(localStorage.getItem('aplus-core1-progress') || '{}');
            let core1Completed = 0;
            for (let i = 1; i <= 12; i++) {
                const key = 'ch' + String(i).padStart(2, '0');
                if (core1Progress[key] && core1Progress[key].completed) core1Completed++;
            }
            const core1Pct = Math.round((core1Completed / 12) * 100);

            // Core 2: 12 chapters (ch13-ch24)
            // Check both legacy key and hexworth_progress.forge (new system)
            const core2Legacy = JSON.parse(localStorage.getItem('aplus-core2-progress') || '{}');
            const hwProgress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
            const forgeProgress = hwProgress.forge || {};
            let core2Completed = 0;
            for (let i = 13; i <= 24; i++) {
                const legacyKey = 'ch' + i;
                const newKey = 'core2-ch' + i + '-index';
                const quizKey = 'core2-ch' + i + '-quiz';
                if ((core2Legacy[legacyKey] && core2Legacy[legacyKey].completed) ||
                    (forgeProgress[newKey] && forgeProgress[newKey].completed) ||
                    (forgeProgress[quizKey] && forgeProgress[quizKey].completed)) {
                    core2Completed++;
                }
            }
            const core2Pct = Math.round((core2Completed / 12) * 100);

            // MD-100: 11 modules × 3 activities (presentation + lab + quiz) = 33 total
            let md100Completed = 0;
            const md100ModuleIds = [
                'forge-md100-m01', 'forge-md100-m02', 'forge-md100-m03',
                'forge-md100-m04', 'forge-md100-m05', 'forge-md100-m06',
                'forge-md100-m07', 'forge-md100-m08', 'forge-md100-m09',
                'forge-md100-m10', 'forge-md100-m11'
            ];
            md100ModuleIds.forEach((id, idx) => {
                try {
                    const pp = localStorage.getItem('hexworth_progress_' + id);
                    if (pp && JSON.parse(pp).completed) md100Completed++;
                } catch(e) {}
                try {
                    const lp = localStorage.getItem('hexworth_progress_' + id + '-lab');
                    if (lp && JSON.parse(lp).completed) md100Completed++;
                } catch(e) {}
                const num = String(idx + 1).padStart(2, '0');
                if (localStorage.getItem('hexworth_md100_m' + num + '_quiz_score') !== null) md100Completed++;
            });
            const md100Pct = Math.round((md100Completed / 33) * 100);

            // MD-101: 9 modules × 3 activities (presentation + lab + quiz) = 27 total
            let md101Completed = 0;
            const md101ModuleIds = [
                'forge-md101-m01', 'forge-md101-m02', 'forge-md101-m03',
                'forge-md101-m04', 'forge-md101-m05', 'forge-md101-m06',
                'forge-md101-m07', 'forge-md101-m08', 'forge-md101-m09'
            ];
            md101ModuleIds.forEach((id, idx) => {
                try {
                    const pp = localStorage.getItem('hexworth_progress_' + id);
                    if (pp && JSON.parse(pp).completed) md101Completed++;
                } catch(e) {}
                try {
                    const lp = localStorage.getItem('hexworth_progress_' + id + '-lab');
                    if (lp && JSON.parse(lp).completed) md101Completed++;
                } catch(e) {}
                const num = String(idx + 1).padStart(2, '0');
                if (localStorage.getItem('hexworth_md101_m' + num + '_quiz_score') !== null) md101Completed++;
            });
            const md101Pct = Math.round((md101Completed / 27) * 100);

            // Apply to path cards (Core 1, Core 2, MD-100, MD-101)
            [core1Pct, core2Pct, md100Pct, md101Pct].forEach((pct, idx) => {
                if (pathCards[idx]) {
                    const fill = pathCards[idx].querySelector('.path-progress-fill');
                    const text = pathCards[idx].querySelector('.path-progress-text');
                    if (fill) fill.style.strokeDashoffset = circumference - (circumference * pct / 100);
                    if (text) text.textContent = pct + '%';
                }
            });
        }

        updatePathProgress();
    </script>
