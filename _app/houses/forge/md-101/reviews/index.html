<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <title>MD-101 Reviews - House of the Forge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a12;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ccc;
        }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); border: 0;
        }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.15);
            background: rgba(10, 10, 18, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn {
            color: #9a8a4a;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-radius: 4px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: #f59e0b;
            border-color: #f59e0b;
            background: rgba(255,255,255,0.03);
        }
        .page-title { font-size: 1rem; color: #9a8a4a; letter-spacing: 0.1em; }
        .count { font-size: 0.75rem; color: #666; letter-spacing: 0.1em; }
        .content-list {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .content-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            color: #bbb;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .content-link:hover {
            color: #f59e0b;
            background: rgba(255,255,255,0.03);
            border-color: rgba(245, 158, 11, 0.15);
        }
        .link-icon {
            font-size: 0.7rem;
            color: #9a8a4a;
            font-family: monospace;
            min-width: 32px;
        }
        .link-title { font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1 class="visually-hidden">MD-101 Reviews</h1>
    <div class="header">
        <div class="header-left">
            <a href="../" class="back-btn">MD-101</a>
            <span class="page-title">MD-101 Reviews</span>
        </div>
        <span class="count">3 items</span>
    </div>
    <div class="content-list">
            <a href="forge-md101-comprehensive-review.html" class="content-link">
                <span class="link-title">MD-101 Comprehensive Review</span>
            </a>
            <a href="forge-md101-final-review.html" class="content-link">
                <span class="link-title">MD-101 Final Review</span>
            </a>
            <a href="forge-md101-midterm-review.html" class="content-link">
                <span class="link-title">MD-101 Midterm Review</span>
            </a>
    </div>
</body>
</html>
