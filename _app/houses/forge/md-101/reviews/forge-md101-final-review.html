  categories: [

    // ══════════════════════════════════════════════════════
    // M06 – Security Management
    // ══════════════════════════════════════════════════════
    {
      name: 'Security Management',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Windows feature encrypts entire volumes to protect data at rest, requiring either a TPM chip or a USB startup key?',
          options: [
            'Encrypting File System (EFS)',
            'BitLocker Drive Encryption',
            'Windows Information Protection (WIP)',
            'Microsoft Defender Antivirus'
          ],
          correct: 1,
          explanation: 'BitLocker Drive Encryption provides full-volume encryption for Windows drives. It typically uses TPM 2.0 to store encryption keys securely, but can also be configured with a USB startup key or password if TPM is unavailable (requires Group Policy change). EFS encrypts individual files/folders, not entire volumes. WIP protects corporate data from leaking to personal apps but does not encrypt the entire drive. Defender is antimalware, not encryption.'
        },

        // $200
        {
          value: 200,
          question: 'An administrator wants to enforce BitLocker encryption on all Intune-managed Windows 10 devices. Where in Intune should this be configured?',
          options: [
            'Device compliance policy',
            'App protection policy',
            'Endpoint security > Disk encryption policy',
            'Device enrollment restrictions'
          ],
          correct: 2,
          explanation: 'BitLocker enforcement through Intune is configured via Endpoint Security > Disk encryption policies. This allows administrators to configure: encryption method (XTS-AES 256-bit), require encryption of OS and fixed drives, configure recovery key backup to Azure AD, and set startup authentication requirements. A compliance policy can CHECK whether BitLocker is enabled (and mark the device non-compliant if not), but it does not ENFORCE or ENABLE BitLocker. App protection policies manage app-level data protection. Enrollment restrictions control which devices can enroll.'
        },

        // $300
        {
          value: 300,
          question: 'A company deploys Windows Information Protection (WIP) to prevent corporate data leakage. An employee copies text from a WIP-protected corporate document and tries to paste it into a personal Gmail compose window in Chrome. What happens with WIP set to "Block" enforcement level?',
          options: [
            'The paste succeeds but is logged for audit',
            'The paste is blocked entirely — WIP prevents corporate data from being transferred to unmanaged/personal apps',
            'The user receives a warning but can override and paste',
            'WIP only protects files on disk, not clipboard operations'
          ],
          correct: 1,
          explanation: 'WIP at "Block" enforcement level completely prevents corporate data from being transferred to unmanaged applications or personal contexts. Clipboard operations (copy/paste), file saves, and sharing between protected (corporate) and unprotected (personal) boundaries are blocked. WIP enforcement levels are: Block (hard stop), Override (user warned, can proceed, action logged), Silent (allowed, action logged), and Off (disabled). At "Override" level, the paste would show a warning dialog. At "Silent" level, it would succeed but be logged. WIP classifies apps as "allowed" (corporate) or "exempt" — Chrome accessing Gmail would be unmanaged/personal.'
        },

        // $400
        {
          value: 400,
          question: 'An administrator configures Attack Surface Reduction (ASR) rules via Intune to block Office applications from creating child processes. A user reports that a critical macro-enabled Excel workbook that launches a helper .exe no longer works. How should the administrator handle this without disabling the ASR rule entirely?',
          options: [
            'Disable the ASR rule for the entire organization',
            'Configure a per-rule exclusion for the specific helper .exe file path or hash in the ASR policy',
            'Move the user to a group that is excluded from all security policies',
            'Convert the ASR rule to Audit mode, which disables enforcement globally while still logging'
          ],
          correct: 1,
          explanation: 'ASR rules support per-rule exclusions that allow specific files or paths to bypass a particular rule while maintaining protection for everything else. The administrator should add the helper .exe path (or its file hash for stronger specificity) to the exclusion list for the "Block Office applications from creating child processes" rule. This surgically resolves the compatibility issue without weakening security posture. Disabling the rule entirely removes protection from all Office-launched child processes. Excluding the user from all security policies is overly broad and dangerous. Audit mode logs but does not block — useful for testing but not a production solution for this issue.'
        },

        // $500
        {
          value: 500,
          question: 'A security team is implementing Microsoft Defender for Endpoint (MDE) integrated with Intune. They want to achieve the following: devices with a HIGH risk score are immediately blocked from accessing corporate resources, devices with MEDIUM risk are given 72 hours to remediate, and devices with LOW risk maintain full access. Which combination of Intune and MDE features implements this graduated response?',
          options: [
            'Three separate Conditional Access policies with different risk level conditions',
            'Intune device compliance policy with machine risk level set to "Medium" + compliance action schedule: mark noncompliant immediately for High, 72-hour grace period for Medium + Conditional Access requiring compliance',
            'MDE automated investigation and response (AIR) handles all remediation without Intune involvement',
            'Configure three ASR rules — one for each risk level with different enforcement modes'
          ],
          correct: 1,
          explanation: 'The integration works as follows: MDE evaluates each device and assigns a machine risk level (Clear, Low, Medium, High). This risk level feeds into Intune compliance policies through the Microsoft Defender for Endpoint connector. The compliance policy is configured with the maximum allowed risk level and actions for noncompliance with different schedules: "Mark noncompliant immediately" for High risk (instant block via Conditional Access), and "Mark noncompliant after 72 hours" for Medium risk (grace period for remediation). A Conditional Access policy requiring device compliance then enforces access control. Low risk devices remain compliant and maintain access. This creates the graduated response: immediate block for High, grace period for Medium, full access for Low. ASR rules reduce attack surface but do not control resource access based on risk scores.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M07 – Traditional Deployment
    // ══════════════════════════════════════════════════════
    {
      name: 'Traditional Deployment',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Microsoft tool provides task sequences for automated operating system deployment, including application installation, driver injection, and domain join steps?',
          options: [
            'Windows Deployment Services (WDS)',
            'Microsoft Deployment Toolkit (MDT)',
            'Windows Autopilot',
            'System Preparation Tool (Sysprep)'
          ],
          correct: 1,
          explanation: 'Microsoft Deployment Toolkit (MDT) provides a unified framework for OS deployment using task sequences — step-by-step automated workflows that can partition disks, apply OS images, inject drivers, install applications, configure settings, and join domains. MDT uses WDS for PXE network boot but adds the task sequence automation layer. WDS alone can serve WIM images via PXE but lacks task sequence capability. Autopilot is cloud-based provisioning, not traditional imaging. Sysprep generalizes an image by removing unique identifiers but does not deploy it.'
        },

        // $200
        {
          value: 200,
          question: 'What is the purpose of running Sysprep with the /generalize switch before capturing a Windows image?',
          options: [
            'It activates Windows with a volume license key',
            'It removes machine-specific information (SID, computer name, hardware drivers) so the image can be deployed to different hardware',
            'It compresses the image to reduce file size',
            'It converts the image from WIM to VHD format'
          ],
          correct: 1,
          explanation: 'Sysprep /generalize removes all unique system information from the Windows installation: the machine SID (Security Identifier), computer name, hardware-specific drivers, and activation state. This makes the image hardware-independent so it can be captured and deployed to different machines without SID conflicts. Without generalizing, deploying the same image to multiple machines creates duplicate SIDs on the network — causing authentication issues, domain trust problems, and software licensing conflicts. Sysprep /oobe also resets the Out-of-Box Experience so users see the initial setup screens.'
        },

        // $300
        {
          value: 300,
          question: 'An organization needs to migrate user profiles from 500 Windows 7 machines to new Windows 10 hardware. Which USMT commands and sequence correctly perform a full migration?',
          options: [
            'loadstate on old machine, then scanstate on new machine',
            'scanstate on old machine to capture profile data to a migration store, then loadstate on new machine to restore the profile data',
            'robocopy the user profile folders, then run loadstate to register them',
            'scanstate on both machines simultaneously to merge profiles'
          ],
          correct: 1,
          explanation: 'USMT uses two commands: scanstate.exe runs on the SOURCE machine to capture user accounts, documents, app settings, and OS settings into a migration store (local folder, network share, or hard-link). loadstate.exe runs on the DESTINATION machine to restore the captured data from the migration store. The order is always: scanstate (capture) THEN loadstate (restore). USMT supports migration XML files (miguser.xml for user files, migapp.xml for application settings) to control exactly what is captured. For 500 machines, USMT is typically automated through MDT or SCCM task sequences.'
        },

        // $400
        {
          value: 400,
          question: 'An IT team is choosing between a wipe-and-load deployment and an in-place upgrade for 1,000 machines running Windows 7 Pro to Windows 10 Pro. The machines have diverse hardware, many locally installed legacy LOB apps, and users have heavily customized profiles. Which approach preserves applications and user settings with the LEAST administrative effort?',
          options: [
            'Wipe-and-load with MDT — reinstall everything from scratch using a standardized image',
            'In-place upgrade using Windows 10 setup.exe — the upgrade preserves installed apps, user data, and most settings automatically',
            'Wipe-and-load with USMT — capture profiles, wipe, deploy new image, restore profiles',
            'Side-by-side migration — deploy Windows 10 to new hardware, use USMT to migrate profiles'
          ],
          correct: 1,
          explanation: 'An in-place upgrade (running Windows 10 setup.exe on the existing Windows 7 installation) preserves installed applications, user accounts, user data, and most system settings automatically. This requires the LEAST administrative effort because there is no need to recapture profiles, reinstall apps, or reconfigure settings. The upgrade process is: verify compatibility > download Windows 10 media > run setup.exe > select "Keep personal files and apps" > upgrade completes. Wipe-and-load (options A and C) requires reinstalling all applications and either rebuilding or USMT-migrating profiles — significantly more work for 1,000 machines with diverse LOB apps. However, in-place upgrade may not work if the hardware is incompatible with Windows 10 or if the existing OS is severely corrupted.'
        },

        // $500
        {
          value: 500,
          question: 'A ConfigMgr administrator creates an OS deployment task sequence that uses PXE boot. The sequence includes: partition disk, apply OS image, apply driver package, domain join, install apps, and capture user state (USMT). During deployment of machine #47, the task sequence fails at "Apply Driver Package" with error 0x80070002 (file not found). The machine has a new NIC model not in the driver package. However, the machine successfully PXE booted, meaning the NIC worked during WinPE. Why does the driver error occur AFTER PXE boot succeeds?',
          options: [
            'PXE boot uses the BIOS NIC driver, but Windows requires a different OS-level driver — WinPE has its own driver set separate from the full OS deployment',
            'The NIC failed between PXE boot and driver injection',
            'ConfigMgr requires a separate driver package for each hardware model and the catch-all package is not supported',
            'PXE boot does not use network drivers — it uses direct hardware access'
          ],
          correct: 0,
          explanation: 'WinPE (Windows Preinstallation Environment) has its own set of drivers that are loaded during the PXE boot phase. These WinPE drivers enable basic hardware access (NIC, storage controller, display) for the deployment process. However, when the task sequence applies the full Windows OS and injects drivers via "Apply Driver Package," it uses a separate driver repository intended for the production OS. If the production driver package does not contain a driver for the new NIC model, the apply step fails — even though WinPE\'s driver worked during PXE boot. The fix is to add the new NIC driver to both the WinPE boot image (for PXE) AND the driver package (for the full OS). This WinPE vs. full OS driver distinction is a critical deployment troubleshooting concept.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M08 – Modern Deployment
    // ══════════════════════════════════════════════════════
    {
      name: 'Modern Deployment',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Windows deployment technology allows a new device to be shipped directly from the manufacturer to the end user, where it auto-configures with company settings upon first internet connection?',
          options: [
            'Microsoft Deployment Toolkit (MDT)',
            'Windows Deployment Services (WDS)',
            'Windows Autopilot',
            'System Center Configuration Manager OSD'
          ],
          correct: 2,
          explanation: 'Windows Autopilot is a cloud-based deployment technology that eliminates the need for custom OS images. New devices are registered in the Autopilot service by their hardware hash (typically by the OEM/reseller). When the end user powers on the device and connects to the internet, Autopilot identifies the device, applies the organization\'s deployment profile (Azure AD Join, Intune enrollment, branding), and provisions it with all required apps and policies. MDT, WDS, and SCCM OSD are traditional on-premises deployment tools requiring network infrastructure and physical/virtual imaging.'
        },

        // $200
        {
          value: 200,
          question: 'What is the key difference between Autopilot user-driven mode and Autopilot self-deploying mode?',
          options: [
            'User-driven requires internet; self-deploying works offline',
            'User-driven requires user authentication during OOBE; self-deploying provisions the device without any user interaction using TPM attestation',
            'Self-deploying is faster because it skips all policy application',
            'User-driven is for Windows 10; self-deploying is only for Windows 11'
          ],
          correct: 1,
          explanation: 'User-driven mode requires a user to sign in with their Azure AD credentials during the Out-of-Box Experience (OOBE). The device is Azure AD Joined and associated with that user. Self-deploying mode requires NO user interaction — the device uses TPM 2.0 attestation to prove its identity to Azure AD, enrolls in Intune, and applies device-targeted policies automatically. Self-deploying is ideal for shared devices, kiosks, and digital signage where no specific user will be the primary owner. Both modes require internet connectivity. Both support ESP (Enrollment Status Page). Both work on Windows 10 and 11.'
        },

        // $300
        {
          value: 300,
          question: 'An organization uses Autopilot white-glove (now called "pre-provisioning") to prepare devices before shipping to remote employees. What does the IT technician do during the pre-provisioning phase?',
          options: [
            'Manually installs all applications and configures settings',
            'Presses Windows key five times at the OOBE screen to trigger pre-provisioning, which downloads and applies device-targeted policies and apps; the device is then resealed for the end user',
            'Creates a custom Windows image and deploys it via USB',
            'Enrolls the device in SCCM and runs a task sequence'
          ],
          correct: 1,
          explanation: 'Autopilot pre-provisioning (formerly white-glove) allows IT to complete the device-phase setup before the user receives the device. The technician: (1) powers on the device, (2) at the OOBE network connection screen, presses the Windows key five times to open the pre-provisioning screen, (3) clicks "Provision" to trigger device ESP which downloads and installs device-targeted apps, certificates, and policies, (4) once complete, the device is resealed (shut down). When the end user powers on the device, they only need to complete the user-phase setup (sign in, user-targeted apps install via user ESP). This significantly reduces the end user\'s wait time since the heavy device provisioning was already completed by IT.'
        },

        // $400
        {
          value: 400,
          question: 'A company creates a Windows provisioning package using Windows Configuration Designer to configure Wi-Fi, domain join, and certificate installation. How is this package deployed to devices?',
          options: [
            'It can only be deployed through Intune',
            'The .ppkg file is placed on a USB drive and applied during OOBE, or distributed via email/network share and double-clicked on an already-configured device',
            'It requires a PXE server to deliver the package over the network',
            'Provisioning packages can only be created by Microsoft partners'
          ],
          correct: 1,
          explanation: 'Provisioning packages (.ppkg files) created with Windows Configuration Designer (WCD) are versatile deployment tools. They can be applied: (1) during OOBE — insert USB with .ppkg, Windows detects and applies it automatically, (2) via Settings > Accounts > Access work or school > Add or remove a provisioning package, (3) by double-clicking the .ppkg file on a running system, or (4) via email/network share distribution. Provisioning packages can configure: Wi-Fi, VPN, certificates, domain join, local accounts, policies, and app installation. They do NOT require Intune, PXE, or any server infrastructure — making them ideal for small-scale deployments or environments without cloud management.'
        },

        // $500
        {
          value: 500,
          question: 'A multinational organization is deploying 5,000 new laptops across 30 countries. Some countries have limited internet bandwidth. The company uses Autopilot with ESP configured to install 8 required Win32 apps (total ~4 GB). Remote employees in low-bandwidth regions report that Autopilot consistently times out during ESP. The ESP timeout is set to 60 minutes. Which combination of strategies would BEST resolve this without abandoning Autopilot?',
          options: [
            'Increase ESP timeout to 240 minutes and hope the download completes',
            'Use Autopilot pre-provisioning at regional IT hubs (install apps on corporate LAN before shipping), enable Delivery Optimization peer-to-peer for offices with multiple devices, and reduce required apps to critical-only during ESP while deploying non-critical apps post-ESP as "Available"',
            'Switch to MDT/WDS at each regional office',
            'Remove all apps from ESP and deploy everything manually after the user logs in'
          ],
          correct: 1,
          explanation: 'This multi-pronged approach addresses the bandwidth constraint: (1) Pre-provisioning at regional IT hubs means device-targeted apps download on the corporate LAN (fast), and only user-targeted apps download at the user\'s location. (2) Delivery Optimization configures devices in the same office to peer-share downloaded content, reducing WAN bandwidth usage dramatically when multiple devices provision simultaneously. (3) Reducing ESP-required apps to only critical security/productivity apps minimizes the mandatory download during ESP. Non-critical apps are assigned as "Available" in Company Portal for user-initiated download later, or assigned as "Required" but NOT tracked by ESP (they install in background after desktop access). Simply increasing timeout does not solve bandwidth limitations. MDT/WDS requires infrastructure in 30 countries. Removing all apps defeats the purpose of managed deployment.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M09 – Update Management
    // ══════════════════════════════════════════════════════
    {
      name: 'Update Management',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which cloud-based service allows administrators to manage Windows 10 update deployments using deferral policies and update rings without requiring an on-premises WSUS server?',
          options: [
            'Windows Server Update Services (WSUS)',
            'Windows Update for Business (WUfB)',
            'System Center Configuration Manager (SCCM)',
            'Microsoft Update Catalog'
          ],
          correct: 1,
          explanation: 'Windows Update for Business (WUfB) is a cloud-native update management service that uses policies (configurable via Intune or Group Policy) to control when and how Windows updates are delivered. WUfB does not require on-premises WSUS infrastructure — devices download updates directly from Windows Update/Microsoft CDN or via Delivery Optimization peers. WSUS is the on-premises update server. SCCM provides the most granular control but requires on-premises infrastructure. Microsoft Update Catalog is a website for manually downloading individual updates.'
        },

        // $200
        {
          value: 200,
          question: 'An administrator configures a WUfB update ring with a quality update deferral of 7 days. Microsoft releases a security update on Patch Tuesday (second Tuesday). When will devices in this ring receive the update?',
          options: [
            'Immediately on Patch Tuesday',
            '7 calendar days after the update is released — the following Tuesday',
            '7 business days after release',
            'The update is permanently blocked for 7 days then automatically installed'
          ],
          correct: 1,
          explanation: 'Quality update deferral periods in WUfB are measured in calendar days from the update release date. A 7-day deferral means the device will not be offered the update until 7 days after Microsoft publishes it. If the update releases on a Tuesday (Patch Tuesday), the device receives it the following Tuesday. This gives IT teams time to monitor for issues reported by early adopters in rings with shorter deferrals. The update is not permanently blocked — it is delayed. After the deferral period, the update is offered and subject to the configured deadline (if set) for automatic installation.'
        },

        // $300
        {
          value: 300,
          question: 'An organization creates three update rings in Intune: "Pilot" (0-day deferral, 50 devices), "Broad" (7-day deferral, 2,000 devices), and "Critical" (14-day deferral, 500 mission-critical servers). A critical security vulnerability is discovered and Microsoft releases an out-of-band emergency patch. How can the administrator expedite deployment to all rings immediately?',
          options: [
            'Delete all three rings and recreate them with 0-day deferrals',
            'Use the "Expedite" feature in Windows Update for Business to push the specific quality update immediately, bypassing deferral settings',
            'Manually download the patch from Microsoft Update Catalog and deploy via SCCM',
            'Wait for each ring\'s deferral period to expire naturally'
          ],
          correct: 1,
          explanation: 'WUfB Expedite (available in Intune) allows administrators to push a specific quality update to devices immediately, bypassing their configured deferral periods. This is designed exactly for zero-day or critical emergency patches. The expedited update is offered to devices within hours regardless of their ring\'s deferral setting. The original ring configurations remain intact — only the specific expedited update bypasses deferrals. Deleting and recreating rings is destructive and affects all future updates. Using SCCM requires on-premises infrastructure the organization may not have. Waiting for natural deferral expiration defeats the purpose of emergency patching.'
        },

        // $400
        {
          value: 400,
          question: 'An administrator configures a WUfB update ring with: Feature update deferral = 60 days, Quality update deferral = 7 days, Deadline = 3 days after deferral, Grace period = 2 days. A quality update is released on Day 0. On which day is the device FORCED to restart to complete installation?',
          options: [
            'Day 7 — immediately when the deferral expires',
            'Day 10 — deferral (7) + deadline (3) after which the device is forced to restart',
            'Day 12 — deferral (7) + deadline (3) + grace period (2) for the forced restart',
            'Day 14 — deferral (7) + quality deadline default (7)'
          ],
          correct: 2,
          explanation: 'The timeline is: Days 0-6: Update is deferred (not offered). Day 7: Deferral expires, update is offered and begins downloading/installing. Days 7-9: Deadline countdown (3 days). The user can schedule the restart or dismiss notifications. Day 10: Deadline reached. The device will auto-restart outside of active hours. If the user is actively using the device during active hours, the grace period begins. Days 10-11: Grace period (2 days). The user has 2 additional days to restart on their own. Day 12: Grace period expires. The device forces a restart regardless of user activity or active hours. The grace period specifically protects users who were actively working when the deadline hit — it provides a final buffer before forced compliance.'
        },

        // $500
        {
          value: 500,
          question: 'A large enterprise uses Desktop Analytics (now integrated into Intune) to plan a Windows 10 feature update rollout. Desktop Analytics identifies that a critical LOB application "FinanceApp.exe" has a compatibility risk status of "Attention needed" for the target Windows version. The app is installed on 800 devices. The administrator sets the app\'s upgrade decision to "Ready" after internal testing confirms compatibility. What does Desktop Analytics use to make its initial compatibility assessment, and what happens to the 800 devices in the deployment plan?',
          options: [
            'Desktop Analytics uses AI-generated synthetic test results; devices are automatically updated regardless of assessment',
            'Desktop Analytics analyzes diagnostic data (telemetry) from millions of devices that have already upgraded, cross-referencing the app\'s behavior on the new OS version. After the administrator marks it "Ready," the 800 devices move from the "attention needed" bucket to the deployment-ready pool and proceed according to the deployment plan waves',
            'Desktop Analytics tests the app in a sandbox VM on each device before approving the update',
            'Desktop Analytics only flags Microsoft first-party apps — third-party apps are always marked as compatible'
          ],
          correct: 1,
          explanation: 'Desktop Analytics leverages Windows diagnostic data (telemetry) collected from hundreds of millions of Windows devices worldwide. When devices with the same app have already upgraded to the target Windows version, Desktop Analytics analyzes whether those devices experienced crashes, hangs, or compatibility issues with the app post-upgrade. This real-world telemetry informs the compatibility assessment: "Low risk" (the app works fine on upgraded devices), "Attention needed" (some issues detected or insufficient data), or "Unable to assess" (not enough telemetry data). When the administrator tests internally and sets the upgrade decision to "Ready," the 800 devices are cleared for deployment and move into the appropriate deployment wave. Desktop Analytics does not run sandbox VMs or synthetic tests — it relies on crowdsourced real-world diagnostic data from the Windows ecosystem.'
        }

      ]
    }

  ],

  // ─────────────────────────────────────────────────────────────────
  // FINAL JEOPARDY — MD-101 Final Synthesis
  // ─────────────────────────────────────────────────────────────────
  finalJeopardy: {
    category: 'MD-101 Final Synthesis',
    question: 'A global manufacturing company needs to upgrade 3,000 factory floor Windows 7 workstations to Windows 10 while maintaining 24/7 production. Constraints: (1) factory machines are air-gapped (no internet), (2) each machine runs a custom CNC control application that must be preserved, (3) user profiles contain 10 years of calibration data, (4) after upgrade, machines need BitLocker encryption, and (5) future Windows 10 updates must be tested on 20 pilot machines before reaching production floors. Design the deployment and update strategy.',
    options: [
      'In-place upgrade using Windows 10 setup.exe from USB media to preserve the CNC app and user data + USMT as backup for calibration profiles + Post-upgrade: enable BitLocker via local GPO (no domain/cloud needed for air-gapped) + Deploy a local WSUS server on the factory network for update management with two computer groups (Pilot and Production) with different approval timelines',
      'Windows Autopilot for all 3,000 machines + Intune compliance policy for BitLocker + WUfB update rings',
      'Wipe-and-load with MDT via PXE + reinstall CNC app + enable BitLocker via Intune + Windows Update direct from Microsoft',
      'In-place upgrade + BitLocker via Intune + WUfB update rings for pilot/production separation'
