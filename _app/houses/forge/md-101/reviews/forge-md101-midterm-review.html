<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'MD-101 Midterm Review',
  storageKey: 'hexworth_review_md101_midterm',
  houseId: 'forge',

  // ─────────────────────────────────────────────────────────────────
  // CATEGORIES  (M01 – M05, 5 questions each, 100-500 points)
  // ─────────────────────────────────────────────────────────────────
  categories: [

    // ══════════════════════════════════════════════════════
    // M01 – Modern Management
    // ══════════════════════════════════════════════════════
    {
      name: 'Modern Management',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Microsoft cloud service provides mobile device management (MDM) and mobile application management (MAM) capabilities for enrolling and managing endpoints?',
          options: [
            'Azure Active Directory',
            'Microsoft Intune',
            'Microsoft Defender for Endpoint',
            'System Center Configuration Manager'
          ],
          correct: 1,
          explanation: 'Microsoft Intune (now part of Microsoft Endpoint Manager) is the cloud-based MDM/MAM service. Azure AD provides identity and access management but does not manage device configurations or deploy apps. Defender for Endpoint is a security solution for threat detection. SCCM (ConfigMgr) is the on-premises management tool that can co-manage with Intune but is not itself a cloud service.'
        },

        // $200
        {
          value: 200,
          question: 'A company wants to manage Windows 10 devices using both SCCM and Intune simultaneously, gradually shifting workloads to the cloud. What is this management approach called?',
          options: [
            'Hybrid Azure AD Join',
            'Co-management',
            'Cloud-only management',
            'Federated management'
          ],
          correct: 1,
          explanation: 'Co-management allows organizations to concurrently manage Windows 10/11 devices with both Configuration Manager (SCCM) and Microsoft Intune. Specific workloads (compliance, resource access, Windows Update, etc.) can be individually toggled between SCCM and Intune as the slider. Hybrid Azure AD Join is an identity state, not a management approach. Cloud-only means Intune without SCCM. Federated management is not a Microsoft term for this scenario.'
        },

        // $300
        {
          value: 300,
          question: 'An organization is planning its device lifecycle. During which phase would you configure compliance policies and deploy applications to devices after they have been enrolled in Intune?',
          options: [
            'Procurement phase',
            'Deployment phase',
            'Management phase',
            'Retirement phase'
          ],
          correct: 2,
          explanation: 'The device lifecycle in modern management consists of: Procurement (purchase/acquire), Deployment (enroll and provision), Management (configure policies, deploy apps, ensure compliance, push updates), and Retirement (wipe/reset/decommission). Configuring compliance policies and deploying applications are ongoing management activities that happen after the initial deployment/enrollment is complete. The deployment phase focuses on getting the device enrolled and initially configured.'
        },

        // $400
        {
          value: 400,
          question: 'A company currently manages 5,000 Windows 10 devices with SCCM. They enable co-management and want to move the "Compliance Policies" workload to Intune while keeping "Client Apps" managed by SCCM. Which statement about this configuration is correct?',
          options: [
            'This is impossible — all workloads must move together',
            'Compliance will be evaluated by Intune while SCCM continues to deploy Win32 apps through the Software Center',
            'Moving compliance to Intune automatically moves all workloads to Intune',
            'SCCM can no longer communicate with these devices once any workload moves to Intune'
          ],
          correct: 1,
          explanation: 'Co-management allows granular workload switching. Each workload slider (compliance policies, device configuration, resource access policies, endpoint protection, client apps, Office Click-to-Run apps, Windows Update policies) can be independently set to SCCM or Intune. Moving compliance to Intune means Intune evaluates device compliance for Conditional Access, while SCCM\'s Software Center continues handling application deployment. The SCCM agent remains installed and functional for its assigned workloads.'
        },

        // $500
        {
          value: 500,
          question: 'An enterprise architect is designing a transition from traditional on-premises management to modern cloud management. They have 10,000 devices: some domain-joined with SCCM, some BYOD, and some new devices never domain-joined. Which enrollment strategy correctly addresses ALL three device types?',
          options: [
            'Azure AD Join for all devices, then enroll in Intune via auto-enrollment',
            'Existing domain devices: enable co-management via SCCM with Hybrid Azure AD Join; BYOD: Intune MAM-only policies (no enrollment); New devices: Azure AD Join with Intune auto-enrollment',
            'Enroll all devices in SCCM first, then migrate to Intune using the co-management slider',
            'Use Windows Autopilot for all device types including BYOD'
          ],
          correct: 1,
          explanation: 'This scenario requires different strategies per device type. Existing domain-joined SCCM devices use Hybrid Azure AD Join (maintaining on-prem AD membership while registering in Azure AD) and enable co-management to gradually shift workloads. BYOD devices should NOT be fully enrolled (users resist MDM control of personal devices) — MAM-only policies protect corporate data in managed apps without enrolling the device. New corporate devices get Azure AD Joined directly with Intune auto-enrollment for full cloud management from day one. Autopilot only works for corporate-owned devices with Windows pre-installed, not BYOD.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M02 – Device Enrollment
    // ══════════════════════════════════════════════════════
    {
      name: 'Device Enrollment',
      questions: [

        // $100
        {
          value: 100,
          question: 'What is the difference between an Azure AD Joined device and an Azure AD Registered device?',
          options: [
            'There is no difference — they are the same thing',
            'Azure AD Joined devices are corporate-owned and fully managed; Azure AD Registered devices are personal/BYOD with limited management',
            'Azure AD Registered devices have more management capabilities than Azure AD Joined',
            'Azure AD Joined requires on-premises Active Directory'
          ],
          correct: 1,
          explanation: 'Azure AD Join is for corporate-owned devices — the device identity is fully in Azure AD, users sign in with their organizational account, and the device can be fully managed by Intune. Azure AD Registration (Workplace Join) is for BYOD/personal devices — the device retains its local/personal identity, users add a work account, and only limited management (MAM policies) can be applied without full MDM enrollment. Azure AD Join does NOT require on-premises AD — that is Hybrid Azure AD Join.'
        },

        // $200
        {
          value: 200,
          question: 'An IT administrator wants all Windows 10 devices that join Azure AD to be automatically enrolled in Intune without manual user action. Which feature must be configured?',
          options: [
            'Windows Autopilot',
            'MDM Auto-enrollment via Azure AD Premium',
            'Device Enrollment Manager (DEM) account',
            'Enrollment Status Page (ESP)'
          ],
          correct: 1,
          explanation: 'MDM Auto-enrollment is configured in Azure AD > Mobility (MDM and MAM) settings. When the MDM user scope is set to "All" or a specific group, any user who Azure AD Joins a device automatically triggers Intune enrollment. This requires Azure AD Premium P1 or P2 licenses. Autopilot automates the OOBE experience but relies on auto-enrollment underneath. A DEM account is a special service account for bulk enrollment. The ESP controls what users see during enrollment but does not trigger enrollment itself.'
        },

        // $300
        {
          value: 300,
          question: 'A hospital needs to deploy 200 shared tablets in patient rooms. Individual users should NOT sign in — the devices should be locked to a single kiosk app. Which Intune enrollment method is most appropriate?',
          options: [
            'User-driven enrollment with Azure AD Join',
            'Device Enrollment Manager (DEM) account',
            'Windows Autopilot user-driven mode',
            'Bulk enrollment with a provisioning package'
          ],
          correct: 1,
          explanation: 'A Device Enrollment Manager (DEM) account is a special Intune service account that can enroll up to 1,000 devices. DEM is ideal for shared, kiosk, or userless devices because enrollment is tied to the DEM account rather than individual users. Bulk enrollment via provisioning packages is also viable but requires creating/distributing USB packages. User-driven enrollment and Autopilot user-driven mode both require individual user sign-in, which contradicts the kiosk requirement. After DEM enrollment, a kiosk configuration profile locks the device to the designated app.'
        },

        // $400
        {
          value: 400,
          question: 'During Windows Autopilot deployment, a user powers on a new laptop and sees a branded company login page with the organization\'s logo. After signing in, the device spends 30 minutes installing apps and applying policies before showing the desktop. Which Autopilot component controls the "wait for apps and policies" behavior?',
          options: [
            'Autopilot deployment profile',
            'Azure AD dynamic device group',
            'Enrollment Status Page (ESP)',
            'Device configuration profile'
          ],
          correct: 2,
          explanation: 'The Enrollment Status Page (ESP) is the component that blocks the user from accessing the desktop until specified apps, policies, and certificates are installed. ESP shows a progress screen with phases: "Device preparation," "Device setup," and "Account setup." Without ESP, users would reach the desktop before critical security policies and LOB apps are fully deployed, potentially creating a window of non-compliance. The Autopilot deployment profile controls OOBE customization (branding, EULA skip, privacy settings). Dynamic groups auto-assign devices to groups based on attributes.'
        },

        // $500
        {
          value: 500,
          question: 'An organization configures Autopilot with the following: Deployment mode = Self-deploying, ESP = enabled with a 60-minute timeout, and a required Win32 app assigned to the device group. A new device powers on, connects to Wi-Fi, and begins provisioning. 45 minutes in, the ESP shows "Identifying" and then fails with error 0x800705B4. The device has a TPM 2.0 chip. What is the most likely cause?',
          options: [
            'Self-deploying mode requires a wired Ethernet connection and cannot use Wi-Fi',
            'The TPM failed device attestation — self-deploying mode requires TPM 2.0 device attestation which can fail if the TPM firmware is outdated or the device is not registered in the Autopilot service',
            'The Win32 app installer exceeded the ESP timeout of 60 minutes',
            'Self-deploying mode does not support ESP and the two features conflict'
          ],
          correct: 1,
          explanation: 'Self-deploying mode uses TPM 2.0 device attestation to establish device identity without any user interaction. Error 0x800705B4 is a timeout error that commonly occurs when TPM attestation fails. This can happen if: (1) the TPM firmware is outdated and incompatible with Azure AD device attestation, (2) the device hardware hash was not properly registered in the Autopilot service, or (3) network issues prevented the TPM from reaching the Azure attestation service. Self-deploying mode DOES support both Wi-Fi and Ethernet. The ESP is fully compatible with self-deploying mode. The app installation had not yet started — the failure occurred during the "Identifying" (device attestation) phase, before any apps deploy.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M03 – Device Profiles
    // ══════════════════════════════════════════════════════
    {
      name: 'Device Profiles',
      questions: [

        // $100
        {
          value: 100,
          question: 'In Microsoft Intune, what is a device configuration profile used for?',
          options: [
            'Enrolling devices into Intune management',
            'Configuring device settings such as Wi-Fi, VPN, email, and restrictions',
            'Deploying applications to devices',
            'Creating user accounts in Azure AD'
          ],
          correct: 1,
          explanation: 'Device configuration profiles in Intune allow administrators to configure and enforce settings on managed devices. These profiles cover a wide range of settings including Wi-Fi, VPN, email, certificates, device restrictions (camera, screenshots, etc.), endpoint protection, kiosk mode, and more. Device enrollment is handled by enrollment profiles/methods. Application deployment uses app assignment policies. User account creation is done in Azure AD, not through device profiles.'
        },

        // $200
        {
          value: 200,
          question: 'An administrator creates an Intune device configuration profile to restrict the camera on corporate devices. The profile is assigned to a group called "Corporate Devices." A user reports their camera still works. What should the administrator check FIRST?',
          options: [
            'Whether the device has been restarted since the profile was assigned',
            'Whether the device is a member of the "Corporate Devices" group and has synced with Intune',
            'Whether the user has local administrator rights',
            'Whether the camera driver is up to date'
          ],
          correct: 1,
          explanation: 'The most common reason a configuration profile does not apply is that the device is not in the targeted group or has not synced to receive the policy. Administrators should verify: (1) the device is a member of "Corporate Devices" (check Azure AD group membership), (2) the device has synced with Intune recently (Intune > Devices > device name > check last check-in time), and (3) the profile shows as "Succeeded" on the device\'s profile status. A restart is rarely needed for restriction policies. Local admin rights do not override MDM-enforced restrictions. The camera driver is irrelevant to MDM policy enforcement.'
        },

        // $300
        {
          value: 300,
          question: 'An organization wants to run a custom PowerShell script on all Intune-managed Windows 10 devices to configure a registry key that is not available through standard configuration profiles. How can this be accomplished?',
          options: [
            'PowerShell scripts cannot be deployed through Intune',
            'Upload the .ps1 script in Intune > Devices > Scripts, configure execution policy and run context, and assign to a device group',
            'Convert the PowerShell script to a .bat file and deploy as a Win32 app',
            'Use a device configuration profile with the "Custom" template and an OMA-URI setting'
          ],
          correct: 1,
          explanation: 'Intune natively supports deploying PowerShell scripts to Windows 10/11 devices. In the Endpoint Manager admin center, navigate to Devices > Scripts > Add > Windows 10 and later. You upload the .ps1 file and configure: run the script in 64-bit or 32-bit host, run as the signed-in user or as SYSTEM, enforce script signature checking or not, and retry behavior. Scripts are executed by the Intune Management Extension (IME) agent on the device. While OMA-URI custom profiles work for some CSP settings, they cannot execute arbitrary PowerShell. Converting to .bat is unnecessary since native PS1 support exists.'
        },

        // $400
        {
          value: 400,
          question: 'Two Intune device configuration profiles target the same device. Profile A (assigned to "All Devices") sets the minimum password length to 6. Profile B (assigned to "Finance Devices") sets the minimum password length to 12. The device is in both groups. What happens?',
          options: [
            'Profile B wins because it is more specific',
            'Profile A wins because "All Devices" has higher priority',
            'The device reports a conflict and neither setting is enforced — the user sees the default',
            'Intune merges the settings and applies the more restrictive value (12)'
          ],
          correct: 2,
          explanation: 'When two Intune profiles target the same device with conflicting values for the same setting, Intune reports a conflict. The conflicting setting is NOT enforced on the device, and the device falls back to the OS default or the last successfully applied value. This is different from Group Policy where "last writer wins." In Intune, conflicts must be resolved by the administrator — either by removing the conflicting profile, adjusting group membership, or using the same value in both profiles. The conflict appears in the device\'s configuration profile status in the Endpoint Manager console as an error state.'
        },

        // $500
        {
          value: 500,
          question: 'An administrator needs to deploy a Wi-Fi profile to 500 devices. The Wi-Fi network uses WPA2-Enterprise with PEAP-MSCHAPv2 authentication and a certificate from the corporate CA. The administrator creates the Wi-Fi profile but users report they cannot connect. The certificate is not trusted on the devices. What is the correct order of profile deployment to resolve this?',
          options: [
            'Deploy Wi-Fi profile first, then the root CA certificate — the certificate will be pulled automatically',
            'Deploy a Trusted Certificate profile (root CA cert) first, then deploy a SCEP/PKCS certificate profile, then deploy the Wi-Fi profile that references the certificate profile',
            'Deploy the Wi-Fi profile with the certificate embedded directly in the XML payload',
            'Use a PowerShell script to install the certificate, then deploy the Wi-Fi profile separately'
          ],
          correct: 1,
          explanation: 'For enterprise Wi-Fi with certificate-based authentication, the deployment order is critical: (1) Deploy a Trusted Certificate profile containing the root CA certificate so devices trust the authentication server. (2) Deploy a SCEP or PKCS certificate profile so each device receives a client certificate for authentication — this profile references the Trusted Certificate profile. (3) Deploy the Wi-Fi profile configured for WPA2-Enterprise/PEAP, referencing the certificate profile from step 2. If the Wi-Fi profile deploys before the certificates, the device cannot validate the RADIUS server\'s certificate or present its own client cert, causing connection failures. This dependency chain is a key exam concept.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M04 – App Management
    // ══════════════════════════════════════════════════════
    {
      name: 'App Management',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Intune app type would you use to deploy a traditional desktop application packaged as an .exe or .msi installer?',
          options: [
            'Microsoft Store app',
            'Web link',
            'Win32 app (wrapped in .intunewin format)',
            'Line-of-business (LOB) app — .appx only'
          ],
          correct: 2,
          explanation: 'Win32 apps in Intune require the application to be packaged into the .intunewin format using the Microsoft Win32 Content Prep Tool (IntuneWinAppUtil.exe). This wrapper enables Intune to deploy traditional .exe and .msi installers with full control over install/uninstall commands, detection rules, requirements, and dependencies. Microsoft Store apps are deployed differently via the store integration. Web links create shortcuts to URLs. LOB apps in Intune support .msi, .appx, and .appxbundle — but for complex .exe installers with custom switches, Win32 app wrapping is the correct approach.'
        },

        // $200
        {
          value: 200,
          question: 'An administrator deploys a Win32 app via Intune with the assignment type set to "Required." What does this mean for targeted devices?',
          options: [
            'Users must manually approve the installation from Company Portal',
            'The app is automatically installed on all targeted devices without user interaction',
            'The app appears in the Company Portal but is not installed until the user clicks Install',
            'The app is only installed if the device is compliant'
          ],
          correct: 1,
          explanation: '"Required" assignment means the app is automatically pushed to all devices/users in the targeted group — no user interaction needed. The Intune Management Extension downloads and silently installs the app in the background. "Available" assignment makes the app appear in the Company Portal for optional user-initiated installation. "Uninstall" assignment removes the app from targeted devices. Compliance status does not block Required app installations (though Conditional Access can block device access if non-compliant, the app install itself still attempts).'
        },

        // $300
        {
          value: 300,
          question: 'A company wants to protect corporate data in Microsoft Outlook on employees\' personal Android phones WITHOUT enrolling the devices in MDM. Which Intune feature enables this?',
          options: [
            'Device configuration profile with email settings',
            'Conditional Access policy requiring device enrollment',
            'App Protection Policy (MAM without enrollment)',
            'Device compliance policy'
          ],
          correct: 2,
          explanation: 'App Protection Policies (also called MAM policies) can protect corporate data within managed apps WITHOUT requiring device enrollment. For personal Android phones, a MAM policy on Outlook can enforce: PIN to open the app, block copy/paste to unmanaged apps, encrypt app data, require minimum OS version, and selectively wipe corporate data — all without touching personal data or requiring MDM enrollment. This is the "MAM-WE" (MAM Without Enrollment) model. Device configuration profiles and compliance policies require MDM enrollment. Conditional Access requiring enrollment would force enrollment, contradicting the requirement.'
        },

        // $400
        {
          value: 400,
          question: 'An administrator creates a Win32 app deployment in Intune. The app installs successfully, but Intune still reports it as "Not installed." What is the most likely issue?',
          options: [
            'The device has not synced with Intune since installation',
            'The detection rule is misconfigured — Intune cannot verify the app is installed',
            'The app requires a reboot before Intune can detect it',
            'Win32 apps cannot report installation status to Intune'
          ],
          correct: 1,
          explanation: 'Detection rules are how Intune verifies whether an app is installed on a device. If the detection rule is misconfigured (wrong file path, wrong registry key, wrong MSI product code, or wrong version comparison), Intune will not detect the installed app and will report "Not installed" or repeatedly attempt reinstallation. Detection rules can check: (1) MSI product code, (2) file/folder existence with optional version check, or (3) registry key/value existence. The most common mistake is specifying the wrong path or using a 32-bit registry path when the app installs to 64-bit (or vice versa). This is a critical troubleshooting skill for the exam.'
        },

        // $500
        {
          value: 500,
          question: 'A healthcare company deploys a LOB medical records app via Intune as a Required Win32 app. The app has three dependencies: .NET Framework 4.8, a SQL LocalDB runtime, and a custom certificate. The app also has a supersedence relationship — it replaces version 2.0 which is currently installed on 300 devices. Describe the correct behavior when this deployment reaches a device with v2.0 installed.',
          options: [
            'Intune installs the new app alongside v2.0, creating two versions on the device',
            'Intune first installs all three dependencies in order, then uninstalls v2.0, then installs the new version — supersedence with uninstall behavior removes the old version before installing the replacement',
            'The administrator must manually uninstall v2.0 from all 300 devices before the new version can deploy',
            'Intune skips the device because it detects an existing version and marks it as "Already installed"'
          ],
          correct: 1,
          explanation: 'Win32 app supersedence in Intune automates version upgrades. When configured: (1) Intune evaluates and installs any dependencies first (.NET, SQL LocalDB, certificate) in the specified dependency chain order. (2) The supersedence relationship with "Uninstall previous version" behavior triggers removal of v2.0 using its defined uninstall command. (3) The new version is then installed. If supersedence is configured with "Update" behavior instead, Intune installs the new version directly (relying on the installer to handle the upgrade). Dependencies are always processed before the main app. This dependency + supersedence chain is fully automated — no manual intervention needed on the 300 devices.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // M05 – Auth & Compliance
    // ══════════════════════════════════════════════════════
    {
      name: 'Auth & Compliance',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which Azure AD feature requires users to complete additional verification (such as a phone call, text message, or authenticator app notification) beyond just a password when signing in?',
          options: [
            'Single Sign-On (SSO)',
            'Multi-Factor Authentication (MFA)',
            'Self-Service Password Reset (SSPR)',
            'Passwordless authentication'
          ],
          correct: 1,
          explanation: 'Multi-Factor Authentication (MFA) requires two or more verification methods from different categories: something you know (password), something you have (phone, hardware key), or something you are (biometric). Azure AD MFA can be enforced via Conditional Access policies, per-user MFA settings, or Security Defaults. SSO reduces sign-in prompts by sharing tokens across apps. SSPR allows users to reset their own passwords. Passwordless authentication eliminates the password entirely (using FIDO2 keys, Windows Hello, or Authenticator app).'
        },

        // $200
        {
          value: 200,
          question: 'An organization wants to block access to corporate email from devices running Android versions older than 11. Which Intune feature should they use?',
          options: [
            'App Protection Policy',
            'Device compliance policy',
            'Device configuration profile',
            'Enrollment restrictions'
          ],
          correct: 1,
          explanation: 'A device compliance policy evaluates whether a device meets organizational security requirements — such as minimum OS version, encryption enabled, not jailbroken/rooted, and more. When combined with a Conditional Access policy that requires device compliance, non-compliant devices (Android < 11) are blocked from accessing corporate resources like email. App Protection Policies protect data within apps but do not block resource access based on OS version. Configuration profiles push settings but do not evaluate compliance. Enrollment restrictions can block enrollment of certain OS versions but do not block access for already-enrolled devices.'
        },

        // $300
        {
          value: 300,
          question: 'A Conditional Access policy is configured with: Assignments = All Users, Cloud Apps = Exchange Online, Conditions = Device platform = iOS, Grant = Require device to be marked as compliant. A user with a compliant iPhone tries to access Exchange. A user with a non-compliant iPad tries to access Exchange. What happens to each?',
          options: [
            'Both are blocked — Conditional Access blocks all iOS devices',
            'iPhone user gets access; iPad user is blocked until the device becomes compliant',
            'Both get access — compliance is only checked at enrollment',
            'iPhone user gets access; iPad user gets access but with limited functionality'
          ],
          correct: 1,
          explanation: 'Conditional Access evaluates in real-time at every sign-in. The policy says: for iOS devices accessing Exchange Online, the device MUST be marked compliant. The compliant iPhone satisfies the grant control and is allowed access. The non-compliant iPad fails the compliance check and is blocked — the user receives a message directing them to make the device compliant (enroll in Intune, update settings, etc.). Compliance is continuously evaluated, not just at enrollment. There is no "limited functionality" mode — it is binary: grant or block (with optional "require app protection policy" as an alternative grant control).'
        },

        // $400
        {
          value: 400,
          question: 'An administrator configures a compliance policy with a "Mark device noncompliant" action for the rule "Minimum OS version = 10.0.19041." The action has a schedule of "3 days after noncompliance." What happens during those 3 days?',
          options: [
            'The device is immediately marked noncompliant and blocked from all resources',
            'The device is in a grace period — it is technically noncompliant but Conditional Access treats it as compliant for 3 days, giving the user time to update',
            'The device is noncompliant but the user receives no notification for 3 days',
            'The compliance policy is not evaluated for 3 days after assignment'
          ],
          correct: 1,
          explanation: 'Compliance policies support actions for noncompliance with configurable schedules. Setting "Mark device noncompliant" to "3 days" creates a grace period. During this time: the device is flagged as "In grace period" (not yet noncompliant), the user receives email notifications (if configured), and Conditional Access continues to grant access. After 3 days, the device is officially marked noncompliant, and Conditional Access policies that require compliance will block access. Additional actions can be stacked: send email notification (day 0), push notification (day 1), mark noncompliant (day 3), remotely retire device (day 7). This graduated enforcement gives users time to remediate.'
        },

        // $500
