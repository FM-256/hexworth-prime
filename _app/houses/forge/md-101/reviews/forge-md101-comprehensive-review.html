          value: 100,
          question: 'Which Azure AD join type maintains the device\'s membership in both on-premises Active Directory AND Azure AD simultaneously?',
          options: [
            'Azure AD Joined',
            'Azure AD Registered',

            'Workplace Joined'

          correct: 2,
          explanation: 'Hybrid Azure AD Join is a dual-identity state where the device remains joined to the on-premises AD domain while ALSO being registered in Azure AD. This enables the device to authenticate to both on-premises resources (file shares, printers, legacy apps using Kerberos/NTLM) and cloud resources (Microsoft 365, Conditional Access). Azure AD Join is cloud-only (no on-premises AD). Azure AD Registered (Workplace Join) adds a work account to a personal device without domain membership. Hybrid Azure AD Join is essential for organizations transitioning from on-premises to cloud management.'
        },

        // $200
        {
          value: 200,
          question: 'An organization enables Security Defaults in Azure AD. Which authentication behavior is automatically enforced for ALL users?',
          options: [
            'Passwordless authentication only',
            'All users must register for and use MFA; legacy authentication protocols are blocked',
            'Single Sign-On to all cloud applications',
            'Smart card authentication required for administrators only'
          ],
          correct: 1,
          explanation: 'Security Defaults is a free baseline security feature in Azure AD that enforces: (1) all users must register for Azure AD MFA within 14 days, (2) administrators are always prompted for MFA, (3) all users are prompted for MFA when necessary (risk-based), and (4) legacy authentication protocols (IMAP, POP3, SMTP basic auth, older Office clients) are blocked because they cannot perform MFA. Security Defaults is ideal for organizations without Azure AD Premium (which provides Conditional Access). However, Security Defaults and Conditional Access are mutually exclusive — enabling Conditional Access requires disabling Security Defaults.'
        },

        // $300
        {
          value: 300,
          question: 'A user attempts to enroll their personal Android device in Intune but receives an error: "Device type is not allowed." What is the most likely cause?',
          options: [
            'The device does not have a Google account configured',
            'An Intune enrollment restriction is configured to block personal Android devices or the specific Android version',
            'The user does not have an Intune license assigned',
            'Android devices cannot be enrolled in Intune'
          ],
          correct: 1,
          explanation: 'Enrollment restrictions in Intune allow administrators to control which devices can enroll based on: device platform (iOS, Android, Windows, macOS), OS version (minimum/maximum), personally owned vs. corporate-owned, and manufacturer. The "Device type is not allowed" error specifically indicates an enrollment restriction policy is blocking the device. Common configurations: block personal devices, block Android versions below a minimum, or limit the number of devices per user. While an Intune license is required, missing licenses produce a different error. Android is fully supported in Intune. Google account is needed for Android Enterprise but would show a different error.'
        },

        // $400
        {
          value: 400,
          question: 'An organization requires that ONLY compliant, Intune-managed devices can access SharePoint Online. A contractor with an unmanaged laptop needs temporary SharePoint access for a 2-week project. How can the administrator grant access without compromising the compliance requirement?',
          options: [
            'Disable the Conditional Access policy for 2 weeks',
            'Create a Conditional Access policy exception using a named group for contractors that requires app protection policy instead of device compliance, combined with SharePoint session controls limiting download/print',
            'Give the contractor a corporate-managed device for the 2-week period',
            'Share files via email attachments instead of SharePoint access'

          correct: 1,
          explanation: 'Conditional Access supports sophisticated policy design: (1) Create a security group for contractors. (2) Create a Conditional Access policy targeting the contractor group + SharePoint that grants access when an app protection policy is applied (MAM without enrollment). (3) Apply session controls via Conditional Access App Control (MCAS/Defender for Cloud Apps integration) to prevent download, print, and copy of sensitive documents — the contractor can view and edit in the browser but cannot exfiltrate data to the unmanaged device. (4) The original policy requiring device compliance excludes the contractor group. This provides secure, time-bounded access. Disabling the policy creates a security gap for all users. Providing a managed device may not be feasible for a 2-week engagement. Email attachments bypass DLP controls and audit logging.'

        // $500
        {
          value: 500,
          question: 'An enterprise has three Azure AD Conditional Access policies active: Policy A: "All Users" + "All Cloud Apps" + Grant: "Require MFA." Policy B: "All Users" + "All Cloud Apps" + Device Platforms: "iOS, Android" + Grant: "Require approved client app." Policy C: "All Users" + "Exchange Online" + Grant: "Require device compliance" with session control: "Sign-in frequency = 1 hour." A user with a compliant Windows 10 laptop opens Outlook desktop to access Exchange Online. Which policies apply and what is the user experience?',
          options: [
            'Only Policy A applies — the user completes MFA and gets access',
            'Policies A and C apply — the user must complete MFA AND have a compliant device; the session expires after 1 hour requiring re-authentication. Policy B does not apply because Windows is not iOS/Android',
            'All three policies apply — the user needs MFA, approved client app, and device compliance',
            'Only Policy C applies because it is the most specific to Exchange Online'
          ],
          correct: 1,
          explanation: 'Conditional Access policy evaluation: Policy A matches (all users + all apps + no platform filter = matches Windows). Grant: MFA required. Policy B: conditions include device platform = iOS, Android. Windows is NOT in this list, so Policy B does NOT match. Policy C matches (all users + Exchange Online). Grant: device compliance required. Session control: 1-hour sign-in frequency. Result: Policies A and C both apply. Their grant controls combine with AND logic: the user must satisfy MFA AND device compliance. Additionally, the session control from Policy C forces re-authentication every hour. With a compliant Windows laptop, the user completes MFA at sign-in, the compliance check passes automatically (device is already compliant), and Outlook will prompt for re-authentication every 60 minutes. Policy B is irrelevant because the platform condition excludes Windows — demonstrating how platform conditions act as filters that limit policy scope.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // Device Configuration (profiles, settings, PowerShell)
    // ══════════════════════════════════════════════════════
    {
      name: 'Device Configuration',
      questions: [

        // $100
        {
          value: 100,
          question: 'In Intune, what is the difference between a "Device configuration profile" and a "Device compliance policy"?',
          options: [
            'They are the same thing with different names',
            'Configuration profiles PUSH settings to devices; compliance policies EVALUATE whether devices meet requirements',
            'Compliance policies push settings; configuration profiles evaluate compliance',
            'Configuration profiles are for Windows only; compliance policies work on all platforms'
          ],
          correct: 1,
          explanation: 'This is a fundamental Intune distinction. Configuration profiles actively PUSH and ENFORCE settings on devices — Wi-Fi, VPN, email, restrictions, certificates, kiosk mode, etc. They CONFIGURE the device. Compliance policies EVALUATE the current state of a device against defined rules — minimum OS version, encryption enabled, password complexity, not jailbroken, etc. Compliance policies do not change settings; they assess and report whether the device meets requirements. The compliance status is then used by Conditional Access to grant or block resource access. Both work across all supported platforms (Windows, iOS, Android, macOS).'
        },

        // $200
        {
          value: 200,
          question: 'An administrator needs to configure a setting that is not available in any standard Intune configuration profile template. The setting is available as an OMA-URI in the Windows CSP documentation. How should this be deployed?',
          options: [
            'It cannot be deployed through Intune — use Group Policy instead',
            'Create a custom device configuration profile and specify the OMA-URI path, data type, and value',
            'Submit a feature request to Microsoft and wait for the next Intune update',
            'Use a PowerShell script to set the registry key directly'
          ],
          correct: 1,
          explanation: 'Intune supports custom configuration profiles that use OMA-URI (Open Mobile Alliance - Uniform Resource Identifier) to configure settings from the Windows Configuration Service Provider (CSP) documentation. The administrator creates a custom profile and specifies: the OMA-URI path (e.g., ./Device/Vendor/MSFT/Policy/Config/...), the data type (String, Integer, Boolean, Base64, etc.), and the value. This provides access to hundreds of CSP settings beyond what the standard templates expose. While PowerShell scripts work for registry changes, OMA-URI is the proper MDM approach for settings that have a CSP. Many Windows GPO settings have CSP equivalents documented by Microsoft.'
        },

        // $300
        {
          value: 300,
          question: 'An Intune-managed device has three configuration profiles assigned: Profile 1 (highest priority) configures Wi-Fi. Profile 2 (medium priority) configures VPN and sets wallpaper. Profile 3 (lowest priority) configures Wi-Fi and sets wallpaper. Which settings are applied to the device?',
          options: [
            'Only Profile 1 applies because it has the highest priority',
            'Wi-Fi from Profile 1, VPN from Profile 2, wallpaper from Profile 2 (highest priority that configures each unique setting wins)',
            'All settings from all profiles merge without conflict',
            'Wi-Fi from Profile 1, VPN from Profile 2, wallpaper from Profile 3'
          ],
          correct: 1,
          explanation: 'Intune evaluates configuration profiles per-setting, not per-profile. Non-conflicting settings from all profiles merge: VPN from Profile 2 applies (only profile configuring VPN). For conflicting settings: Wi-Fi is configured by both Profile 1 and 3 — Profile 1 wins due to higher priority. Wallpaper is configured by Profile 2 and 3 — Profile 2 wins due to higher priority. Result: Wi-Fi (Profile 1), VPN (Profile 2), wallpaper (Profile 2). This per-setting evaluation means profiles do not entirely override each other — they merge with priority-based conflict resolution. This is different from Windows Group Policy where the entire GPO with highest precedence can override others.'
        },

        // $400
        {
          value: 400,
          question: 'An administrator deploys a PowerShell script via Intune that runs in the SYSTEM context to configure a registry key under HKCU. The script deploys successfully but the registry change does not appear under the logged-in user\'s HKCU. Why?',
          options: [
            'PowerShell scripts cannot modify the registry through Intune',
            'Scripts running as SYSTEM modify HKCU for the SYSTEM account (S-1-5-18), not the logged-in user. The administrator should change the script to run in the user context, or modify the registry under HKU\\<user-SID> instead',
            'The Intune Management Extension blocks registry modifications',
            'HKCU is read-only on Intune-managed devices'
          ],
          correct: 1,
          explanation: 'When a process runs as SYSTEM, HKCU maps to the SYSTEM account\'s registry hive (HKU\\S-1-5-18), NOT the logged-in user\'s hive. This is a classic mistake. The fix is either: (1) Change the Intune script setting to "Run this script using the logged-on credentials" (user context), so HKCU maps to the correct user. (2) If SYSTEM context is required for other reasons, use the HKU (HKEY_USERS) hive with the logged-in user\'s SID: query the SID, then write to HKU\\<SID>\\... instead of HKCU. (3) Use a scheduled task that runs as the logged-in user to make the change. This SYSTEM vs. user context distinction applies to all Windows automation, not just Intune.'
        },

        // $500
        {
          value: 500,
          question: 'An organization manages 10,000 Windows 10 devices with Intune. They need to configure 150+ settings covering security baselines, application restrictions, and corporate policies. The admin creates 25 configuration profiles. After deployment, 40% of devices report profile conflicts in the Intune dashboard, and helpdesk tickets spike. What is the root cause and how should the administrator redesign the profile strategy?',
          options: [
            'Intune has a maximum of 20 profiles per device — reduce to 20 profiles',
            'Too many profiles targeting overlapping device groups with conflicting settings. The redesign should: consolidate profiles by function (not by group), use consistent device groups, audit for overlapping settings using the Intune settings catalog, and leverage security baselines as a single comprehensive profile instead of configuring security settings across multiple profiles',
            'The Intune Management Extension cannot handle more than 10 profiles',
            'Each profile should target individual devices instead of groups'
          ],
          correct: 1,
          explanation: 'The 40% conflict rate indicates overlapping profiles configuring the same settings with different values on the same devices. Common anti-patterns: (1) creating profiles per department that overlap when users are in multiple groups, (2) configuring the same setting in both a custom profile and a security baseline, (3) having legacy profiles and new profiles that conflict. The redesign strategy: Use Intune Security Baselines as a single comprehensive security profile (reduces multiple security profiles to one). Organize remaining profiles by FUNCTION (Wi-Fi, VPN, Email, Restrictions) not by department/group. Use the Settings Catalog to audit which settings are configured across all profiles. Ensure device groups are mutually exclusive OR profiles assigned to overlapping groups do not configure the same settings. Use the "per-setting wins" model to advantage by layering profiles intentionally. Intune has no hard limit on profile count per device — conflicts are the issue, not quantity.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // Application Lifecycle (deployment, protection, management)
    // ══════════════════════════════════════════════════════
    {
      name: 'Application Lifecycle',
      questions: [

        // $100
        {
          value: 100,
          question: 'What is the purpose of the Microsoft Win32 Content Prep Tool (IntuneWinAppUtil.exe)?',
          options: [
            'It compiles Win32 applications from source code',
            'It packages Win32 application installers (.exe/.msi) into the .intunewin format required for Intune deployment',
            'It tests application compatibility with Windows 10',
            'It converts Win32 apps to UWP format'
          ],
          correct: 1,
          explanation: 'The Win32 Content Prep Tool (IntuneWinAppUtil.exe) is a command-line utility that wraps traditional Win32 application installers into the .intunewin format. This wrapper is required because Intune\'s Win32 app management infrastructure needs a standardized package format to handle upload, content distribution, and installation tracking. The tool takes three inputs: the source folder containing the installer, the setup file name, and the output folder. It creates an encrypted, compressed .intunewin file that is then uploaded to Intune. The tool does NOT modify the installer, compile code, test compatibility, or convert app formats.'
        },

        // $200
        {
          value: 200,
          question: 'An administrator deploys Microsoft 365 Apps via Intune to 500 devices. Which deployment method does Intune use for Microsoft 365 Apps specifically?',
          options: [
            'Win32 app wrapping with .intunewin',
            'Built-in Microsoft 365 Apps for Windows 10 app type with XML configuration',
            'Microsoft Store for Business integration',
            'Manual installation via Company Portal'
          ],
          correct: 1,
          explanation: 'Intune has a dedicated "Microsoft 365 Apps for Windows 10 and later" app type that provides a streamlined deployment experience. The administrator selects which Office apps to include (Word, Excel, PowerPoint, etc.), the update channel (Current, Monthly Enterprise, Semi-Annual Enterprise), the architecture (32/64-bit), and additional settings. Intune generates the Office Deployment Tool XML configuration automatically. This is different from Win32 app wrapping — the Office Click-to-Run installer is handled natively by Intune. The Microsoft Store for Business is being deprecated. While users CAN install from Company Portal if assigned as "Available," the recommended approach is "Required" for automated deployment.'
        },

        // $300
        {
          value: 300,
          question: 'An App Protection Policy (MAM) is configured for Microsoft Outlook on iOS with: "Prevent backup to iCloud" = Yes, "Restrict cut/copy/paste to managed apps" = Yes, "Require PIN for access" = Yes. A user with this policy copies a customer email address from Outlook. Into which app can the user paste it?',
          options: [
            'Any app — clipboard restrictions only apply to file transfers',
            'Only into other MAM-managed apps (e.g., managed Word, Teams, Edge) — pasting into personal apps like iMessage or Notes is blocked',
            'Only back into Outlook itself',
            'Into any Microsoft app regardless of management status'
          ],
          correct: 1,
          explanation: 'The "Restrict cut/copy/paste to managed apps" policy creates a data boundary between managed (corporate) and unmanaged (personal) apps. When a user copies content from Outlook (managed), they can paste into other apps that also have the organization\'s App Protection Policy applied — such as managed Word, Excel, Teams, OneNote, or Edge. Pasting into unmanaged personal apps (iMessage, Notes, personal Gmail, WhatsApp) is blocked. This prevents corporate data leakage to personal app ecosystems. The restriction works at the iOS clipboard level — the managed app SDK intercepts paste operations and checks the target app\'s management status. The user CAN still paste into any managed app, not just Outlook.'
        },

        // $400
        {
          value: 400,
          question: 'An administrator deploys a Win32 app with a detection rule checking for file "C:\\Program Files\\AppX\\app.exe" with version >= 3.0.0. The app installs to "C:\\Program Files (x86)\\AppX\\app.exe" (32-bit path). Intune reports the app as "Not installed" and keeps retrying installation. What is happening and how should this be fixed?',
          options: [
            'The app version is below 3.0.0 — update the app installer',
            'The detection rule checks the 64-bit Program Files path, but the app installed to the 32-bit Program Files (x86) path. The detection rule should be updated to check "C:\\Program Files (x86)\\AppX\\app.exe" and enable the "32-bit app on 64-bit client" checkbox',
            'Win32 apps cannot use file-based detection rules',
            'The Intune Management Extension needs to be reinstalled'
          ],
          correct: 1,
          explanation: 'This is one of the most common Win32 app deployment troubleshooting scenarios. The detection rule specifies "C:\\Program Files\\AppX\\app.exe" (64-bit path), but the 32-bit app installs to "C:\\Program Files (x86)\\AppX\\app.exe". Since the file does not exist at the detection path, Intune concludes the app is not installed and queues another installation attempt — creating an endless install loop. The fix: (1) Update the file path to the correct (x86) location, AND (2) check the "Associate this as a 32-bit app on 64-bit clients" checkbox in the detection rule. This checkbox tells the Intune Management Extension to redirect registry lookups from the 64-bit to 32-bit registry view (HKLM\\SOFTWARE\\WOW6432Node). Always verify the actual installation path before creating detection rules.'
        },

        // $500
        {
          value: 500,
          question: 'A hospital deploys a critical medical records application via Intune with the following dependency chain: Root CA Certificate > Intermediate CA Certificate > Client Certificate (SCEP) > VPN Profile > Win32 Medical App. During deployment, 30% of devices fail at the VPN Profile step with "Certificate not found." The SCEP certificate profile shows as "Pending" on these devices. The SCEP connector is healthy and the NDES server is reachable. What is the most likely cause and resolution?',
          options: [
            'The VPN profile was deployed before the SCEP certificate was issued — there is a race condition where the dependency chain does not guarantee sequential completion',
            'The NDES server certificate expired',
            'The devices do not have TPM chips for certificate storage',
            'Win32 apps cannot depend on certificate profiles'
          ],
          correct: 0,
          explanation: 'Intune dependency chains define an installation ORDER but do not guarantee that each step has fully COMPLETED before the next begins. Certificate issuance via SCEP is asynchronous: the device sends a Certificate Signing Request (CSR), the SCEP connector processes it through the CA, and the signed certificate is delivered back. This process can take minutes. If the VPN profile evaluates before the SCEP certificate arrives, it cannot find the referenced client certificate and fails. Resolution: (1) Configure retry logic in the VPN profile deployment. (2) Ensure the SCEP certificate profile has sufficient time to complete — review SCEP connector performance, CA issuance latency, and network connectivity to NDES. (3) Consider deploying the VPN profile with a longer retry interval or using the Enrollment Status Page to ensure certificates are installed before proceeding. (4) Check for CRL (Certificate Revocation List) distribution point accessibility. This async certificate issuance race condition is a real-world deployment challenge that the exam tests indirectly through troubleshooting scenarios.'
        }

      ]
    },

    // ══════════════════════════════════════════════════════
    // Threat Protection (BitLocker, Defender, WIP, ASR)
    // ══════════════════════════════════════════════════════
    {
      name: 'Threat Protection',
      questions: [

        // $100
        {
          value: 100,
          question: 'Which component of Microsoft Defender for Endpoint provides endpoint detection and response (EDR) capabilities for investigating security incidents?',
          options: [
            'Microsoft Defender Antivirus',
            'Microsoft Defender for Endpoint (EDR)',
            'Windows Firewall with Advanced Security',
            'Attack Surface Reduction rules'
          ],
          correct: 1,
          explanation: 'Microsoft Defender for Endpoint (MDE) includes EDR capabilities that provide: real-time monitoring of endpoint behavior, advanced threat hunting with KQL queries, incident investigation timelines, automated investigation and response (AIR), and threat analytics. Defender Antivirus is the anti-malware engine that prevents and removes malware but does not provide investigation/hunting capabilities. Windows Firewall controls network traffic. ASR rules reduce attack vectors proactively but do not investigate incidents. MDE EDR is the investigation and response layer that sits above prevention.'
        },

        // $200
        {
          value: 200,
          question: 'A user loses their BitLocker-encrypted laptop. The IT team wants to ensure the data remains protected. The BitLocker recovery key was backed up to Azure AD. Which statement about data protection in this scenario is correct?',
          options: [
            'The data is only protected if the laptop was powered off — data is accessible if the laptop was in sleep mode',
            'BitLocker full-volume encryption protects data at rest. Without the correct authentication (TPM + PIN, recovery key, or user password), the encrypted volume cannot be unlocked. The recovery key in Azure AD allows IT to recover data if needed but does not help an attacker without Azure AD access',
            'The finder can bypass BitLocker by removing the hard drive and connecting it to another PC',
            'BitLocker protection is disabled when the device is offline'
          ],
          correct: 1,
          explanation: 'BitLocker encrypts the entire volume using AES (128 or 256-bit). The encryption key is sealed in the TPM (Trusted Platform Module) and released only when the correct boot integrity measurements are confirmed. A finder cannot: boot into Windows without the TPM-verified boot chain, remove the drive and read it on another PC (the encryption key is sealed to the original TPM), or bypass the encryption without the recovery key. The recovery key backed up to Azure AD allows the organization to recover data if needed (e.g., TPM failure, motherboard replacement). The data is protected at rest regardless of power state — BitLocker encrypts the physical disk sectors. If the laptop was in sleep mode with BitLocker + PIN, the PIN would be required at resume.'
        },

        // $300
        {
          value: 300,
          question: 'An administrator enables the ASR rule "Block credential stealing from the Windows local security authority subsystem (lsass.exe)" in Audit mode. After reviewing logs for 2 weeks, they see only the legitimate backup agent triggering the rule. What is the recommended next step?',
          options: [
            'Keep it in Audit mode permanently to avoid breaking the backup agent',
            'Switch the rule to Block mode and add an exclusion for the legitimate backup agent process, then monitor for additional audit events',
            'Disable the rule because it has false positives',
            'Uninstall the backup agent to eliminate the conflict'
          ],
          correct: 1,
          explanation: 'The recommended ASR deployment approach is: (1) Audit mode for 1-2 weeks to identify legitimate applications that trigger the rule (false positives). (2) Create exclusions for known-good processes identified during audit. (3) Switch to Block mode with exclusions in place. (4) Continue monitoring for new audit events (new applications or behaviors). The backup agent triggering the rule is expected — backup software legitimately accesses lsass.exe for credential-related operations. Adding a targeted exclusion allows the backup agent to function while blocking actual credential theft attacks (Mimikatz, credential dumpers). Staying in Audit mode indefinitely provides no protection. Disabling the rule removes important credential theft protection. Uninstalling the backup agent is not a viable solution.'
        },

        // $400
        {
          value: 400,
          question: 'A security baseline deployed via Intune configures BitLocker with: OS drive encryption = XTS-AES 256-bit, Startup authentication = TPM + PIN, Recovery key backup to Azure AD = Required. A new batch of laptops fails to enable BitLocker, reporting "Compatible TPM cannot be found." The laptops have TPM 2.0 chips visible in tpm.msc with status "Ready for use." What is the likely cause?',
          options: [
            'TPM 2.0 is not compatible with BitLocker',
            'The TPM + PIN startup authentication requires the TPM to be in a specific state. The most likely cause is that UEFI Secure Boot is disabled or CSM (legacy BIOS compatibility) mode is enabled, which prevents BitLocker from using the TPM for pre-boot authentication',
            'XTS-AES 256-bit encryption is not supported on TPM 2.0',
            'BitLocker cannot be deployed via Intune — it requires Group Policy'
          ],
          correct: 1,
          explanation: 'BitLocker with TPM requires UEFI firmware with Secure Boot enabled. If Compatibility Support Module (CSM) mode is enabled (legacy BIOS boot), the TPM cannot participate in the BitLocker pre-boot authentication chain because the measured boot process relies on UEFI boot measurements stored in TPM PCR (Platform Configuration Register) values. Even though tpm.msc shows "Ready for use," BitLocker\'s specific requirements for TPM-based startup authentication are not met in CSM/legacy mode. The fix: enter UEFI/BIOS settings, disable CSM, enable Secure Boot, and ensure the boot mode is UEFI (not legacy). TPM 2.0 fully supports BitLocker and XTS-AES 256. Intune can absolutely deploy BitLocker via endpoint security policies.'
        },

        // $500
        {
          value: 500,
          question: 'An organization implements a layered defense strategy using Intune and Microsoft Defender. Layer 1: ASR rules block Office macro child processes and credential theft. Layer 2: Defender Antivirus with cloud-delivered protection and automatic sample submission. Layer 3: Defender for Endpoint EDR with automated investigation. Layer 4: Conditional Access requiring device risk level "Clear or Low." A user receives a phishing email with a macro-enabled Word document that, when opened, executes PowerShell to download and run Mimikatz for credential harvesting, then uses stolen credentials to laterally move to SharePoint. At which layer(s) is the attack stopped and what is the kill chain?',
          options: [
            'Layer 1 stops the attack — ASR blocks the Office macro from spawning PowerShell (child process), preventing the entire kill chain before any payload downloads',
            'Layer 2 stops the attack — Defender Antivirus detects Mimikatz',
            'Layer 3 stops the attack — EDR detects the lateral movement to SharePoint',
            'Layer 4 stops the attack — Conditional Access blocks SharePoint access from the compromised device'
