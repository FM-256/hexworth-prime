    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 07 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 07',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m07',
            moduleId: 'md101-m07',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'An organization with 5,000 Windows 7 devices is planning a migration to Windows 10. Before beginning the deployment, the IT team needs to assess application compatibility across all devices. Which Microsoft tool provides cloud-based analytics to evaluate deployment readiness at scale?',
                    options: [
                        'Windows Server Update Services (WSUS)',
                        'Desktop Analytics',
                        'System Center Configuration Manager standalone',
                        'Windows Assessment and Deployment Kit (ADK)'
                    ],explanation: 'Desktop Analytics is a cloud-based service that integrates with Configuration Manager to provide intelligent insights about the update readiness of Windows devices. It inventories applications running across the organization, identifies compatibility issues, and suggests pilot groups for phased deployment. Desktop Analytics replaced the Upgrade Readiness solution and provides data-driven recommendations rather than requiring manual compatibility testing of every application.'
                },
                {
                    question: 'When using Desktop Analytics to plan a Windows 10 deployment, the tool categorizes applications by risk level. An application is marked as "Attention needed." What does this classification mean?',
                    options: [
                        'The application is fully compatible and requires no action',
                        'The application has known compatibility issues that need to be reviewed and resolved before deployment to those devices',
                        'The application has been deprecated by Microsoft and must be uninstalled',
                        'The application requires a license renewal before migration'
                    ],explanation: 'In Desktop Analytics, "Attention needed" means the application has potential compatibility risks identified through Microsoft\'s app compatibility database or diagnostic data. The IT team must review these applications, test them in a pilot environment, and determine if they need updates, configuration changes, or replacements before including those devices in the deployment plan. Other categories include "Ready for upgrade" (no issues detected) and "Insufficient data" (not enough telemetry to assess).'
                },
                {
                    question: 'Desktop Analytics recommends creating a pilot deployment group before a broad rollout. How does it determine which devices to include in the pilot group?',
                    options: [
                        'It randomly selects 10% of all devices',
                        'It selects devices that collectively cover the maximum number of applications, drivers, and hardware configurations to provide representative validation',
                        'It only includes devices from the IT department',
                        'It selects the newest devices with the fastest hardware'
                    ],explanation: 'Desktop Analytics uses an intelligent algorithm to create a pilot group that maximizes coverage of your application estate. The goal is to include the fewest devices that still test the broadest range of installed applications, add-ins, drivers, and hardware models. This ensures that compatibility issues are discovered in the pilot phase rather than during the broad deployment, reducing risk while keeping the pilot group manageable in size.'
                },
                {
                    question: 'A technician is performing a Windows 10 migration and needs to preserve user profiles, application settings, and files. Which User State Migration Tool (USMT) commands are used in the correct migration workflow order?',
                    options: [
                        'loadstate.exe first to backup, then scanstate.exe to restore',
                        'scanstate.exe to capture user state from the source, then loadstate.exe to restore it on the target',
                        'usmt-capture.exe followed by usmt-restore.exe',
                        'robocopy to backup profiles, then xcopy to restore'
                    ],explanation: 'USMT uses two primary commands: ScanState.exe captures (exports) the user state data - profiles, documents, desktop settings, application settings - from the source computer and stores it in a migration store. LoadState.exe then restores (imports) that data onto the target computer or new OS installation. The migration store can be a network share, USB drive, or local hard-link store. USMT is the enterprise-grade user migration tool, far more capable than Windows Easy Transfer.'
                },
                {
                    question: 'An IT team is performing an in-place upgrade from Windows 7 to Windows 10 on 200 machines. They want to use USMT with a hard-link migration store to save time and network bandwidth. What is the key advantage of a hard-link migration store?',
                    options: [
                        'It compresses user data to reduce storage requirements',
                        'It stores user state data on the same volume without duplicating files, making the capture and restore nearly instantaneous',
                        'It encrypts the migration data with BitLocker automatically',
                        'It enables migration data to be stored on a USB drive'
                    ],explanation: 'A hard-link migration store keeps user data in place on the same volume using NTFS hard links rather than physically copying files. Since no data is actually moved or duplicated, the ScanState and LoadState operations are extremely fast and require virtually no additional disk space. This is only possible for wipe-and-load scenarios on the same machine (in-place migrations). For computer-to-computer migrations, you must use a network share or removable media store instead.'
                },
                {
                    question: 'A USMT migration needs to exclude specific file types (.mp3 and .mp4 files) from the user state capture to save storage space. How is this customization accomplished?',
                    options: [
                        'By passing command-line switches to ScanState.exe that list excluded extensions',
                        'By modifying or creating custom XML migration files that define exclude rules for those file types',
                        'By deleting those files before running ScanState',
                        'USMT cannot filter by file type; all files must be migrated'
                    ],explanation: 'USMT is highly customizable through XML configuration files. The default MigUser.xml and MigApp.xml files define what to capture, but administrators can create custom XML files with <exclude> rules to filter specific file types, folders, or registry keys. For example, adding an unconditional exclude pattern for *.mp3 and *.mp4 in a custom XML file and referencing it with the /i switch in ScanState.exe will exclude those files from the migration store.'
                },
                {
                    question: 'The Microsoft Deployment Toolkit (MDT) uses a "deployment share" as its central repository. What does the deployment share contain?',
                    options: [
                        'Only Windows operating system image files (WIM)',
                        'Operating system files, applications, drivers, packages (updates), and task sequences that automate the deployment process',
                        'Only the boot images needed for PXE deployment',
                        'A database of user credentials for domain joining'
                    ],explanation: 'The MDT deployment share is a comprehensive repository containing everything needed for automated deployments: OS images (WIM files), application installers and silent install scripts, device drivers organized by model, Windows updates and packages, and task sequences that orchestrate the entire deployment workflow. The deployment share also generates boot images (LiteTouchPE) that can be used for PXE boot or burned to USB/DVD media to initiate the deployment.'
                },
                {
                    question: 'A technician creates an MDT task sequence for deploying Windows 10 Enterprise. During deployment, the task sequence needs to install specific drivers based on the hardware model of each target machine. Which MDT feature handles this automatically?',
                    options: [
                        'Manual driver installation after OS deployment',
                        'Driver injection using the "Inject Drivers" task sequence step with drivers organized by make/model in the Out-of-Box Drivers folder',
                        'Windows Update automatically installs all drivers after first boot',
                        'The technician must create separate task sequences for each hardware model'
                    ],explanation: 'MDT supports automatic driver injection during OS deployment. Drivers are imported into the Out-of-Box Drivers node in the deployment share and organized into folders by manufacturer and model. The "Inject Drivers" step in the task sequence can use selection profiles to match the correct driver package to the target hardware based on WMI queries (make, model). This eliminates the need for separate images or task sequences per hardware model.'
                },
                {
                    question: 'An organization uses Microsoft Endpoint Configuration Manager (MECM/SCCM) for OS deployment. The administrator creates an OS deployment task sequence and needs to make it available to target computers. What is the correct process?',
                    options: [
                        'Email the task sequence file to each target computer',
                        'Deploy the task sequence to a device collection, then boot target devices to PXE or boot media to receive the deployment',
                        'Copy the task sequence to a USB drive and run it locally',
                        'Share the task sequence on a public file server for download'
                    ],explanation: 'In Configuration Manager, task sequences are deployed (advertised) to device collections - logical groups of computers based on queries or direct membership. Target devices then receive the deployment through PXE boot (network), boot media (USB/DVD), or Software Center (for in-place upgrades). The task sequence references content (OS images, drivers, applications) stored on distribution points, which are Configuration Manager site system roles that host content for client downloads.'
                },
                {
                    question: 'What is the primary advantage of using Configuration Manager over MDT alone for large-scale OS deployments?',
                    options: [
                        'Configuration Manager is free while MDT requires a license',
                        'Configuration Manager provides centralized management, scalable infrastructure with distribution points, reporting, inventory, and ongoing device management beyond just deployment',
                        'Configuration Manager does not require any network infrastructure',
                        'Configuration Manager can only deploy Windows Server, not Windows 10'
                    ],explanation: 'While MDT is a free toolkit excellent for smaller environments, Configuration Manager is an enterprise platform that adds centralized management console, scalable content distribution through distribution points, hardware and software inventory, compliance reporting, role-based administration, and ongoing device management (software updates, compliance settings, endpoint protection). MDT handles deployment; Configuration Manager handles the entire device lifecycle. Many organizations integrate MDT task sequences into Configuration Manager for the best of both worlds.'
                },
                {
                    question: 'An organization decides to perform an in-place upgrade from Windows 7 to Windows 10 on 500 desktop computers rather than a wipe-and-load deployment. What is the primary advantage of choosing an in-place upgrade?',
                    options: [
                        'In-place upgrades are faster because they skip hardware compatibility checks',
                        'In-place upgrades preserve existing applications, settings, and user data, significantly reducing migration effort and user downtime',
                        'In-place upgrades do not require any Windows 10 license',
                        'In-place upgrades allow upgrading directly from Windows XP'
                    ],explanation: 'In-place upgrade is the recommended Microsoft migration path because it preserves the existing user state: installed applications, user profiles, desktop settings, and data files all carry over to Windows 10. This eliminates the need for separate backup/restore steps (USMT), application reinstallation, and user reconfiguration. The Windows 10 setup process runs compatibility checks, migrates the existing environment, and rolls back automatically if the upgrade fails. Supported upgrade paths include Windows 7, 8, and 8.1 to Windows 10.'
                },
                {
                    question: 'During an in-place upgrade from Windows 7 to Windows 10, the upgrade process fails and automatically rolls back to Windows 7. Where should the technician look first to determine the cause of the failure?',
                    options: [
                        'Windows Event Viewer > Application log',
                        'The SetupDiag tool output and the setup log files in $WINDOWS.~BT\\Sources\\Panther (specifically setupact.log and setuperr.log)',
                        'The BIOS firmware update history',
                        'The Windows Update history in Control Panel'
                    ],explanation: 'When an in-place upgrade fails, the setup engine writes detailed logs to $WINDOWS.~BT\\Sources\\Panther. The key files are setupact.log (all actions taken) and setuperr.log (errors encountered). Microsoft\'s SetupDiag tool can automatically parse these logs and identify the specific failure reason (incompatible driver, insufficient disk space, blocking application, etc.). Common failure causes include incompatible antivirus software, outdated drivers, insufficient disk space, and unsupported hardware.'
                },
                {
                    question: 'Before deploying Windows 10 across the organization, the IT team needs to ensure all hardware meets the minimum system requirements. Which of the following is NOT a minimum hardware requirement for Windows 10?',
                    options: [
                        '1 GHz or faster processor',
                        '2 GB RAM for 64-bit',
                        '64 GB of available storage',
                        '8 GB RAM for 64-bit'
                    ],explanation: 'The minimum hardware requirements for Windows 10 (64-bit) are: 1 GHz or faster processor with 2 or more cores, 2 GB RAM, 64 GB storage, UEFI firmware with Secure Boot capability, TPM version 2.0, and a DirectX 12 compatible graphics card. 8 GB RAM is not a minimum requirement - 2 GB is sufficient for 64-bit Windows 10 (1 GB for 32-bit). However, Microsoft recommends more than the minimums for acceptable performance, especially with modern workloads.'
                },
                {
                    question: 'An administrator wants to fully automate an MDT deployment so that technicians do not need to answer any prompts during installation. Which file must be configured to suppress all wizard pages during Lite Touch deployment?',
                    options: [
                        'Unattend.xml only',
                        'CustomSettings.ini (along with Bootstrap.ini for network credentials), which populates task sequence variables and skips wizard pages',
                        'Setup.exe configuration switches',
                        'AutoPilot.json provisioning profile'
                    ],explanation: 'MDT Lite Touch deployments are controlled by two primary configuration files: Bootstrap.ini (provides initial network connection settings and credentials to connect to the deployment share) and CustomSettings.ini (defines all deployment variables such as computer name, domain join credentials, time zone, locale, and skip rules for wizard pages). By setting SkipWizard=YES or individual Skip properties (SkipComputerName, SkipDomainMembership, etc.) and providing the corresponding values, the deployment becomes fully automated - zero touch within the LTI framework.'
                },
                {
                    question: 'An administrator integrates MDT with Configuration Manager to leverage MDT task sequence templates. What additional capabilities do MDT-integrated task sequences provide over native Configuration Manager task sequences?',
                    options: [
                        'MDT integration adds PXE boot capability that Configuration Manager lacks',
                        'MDT integration adds user-driven installation wizard, USMT integration steps, validation checks, and Gather steps that simplify task sequence creation',
                        'MDT integration replaces Configuration Manager\'s distribution point system',
                        'MDT integration is only needed for Linux deployments'
                    ],explanation: 'When MDT is integrated with Configuration Manager, the task sequence templates gain additional steps and capabilities: the MDT User Driven Installation (UDI) wizard for customizable deployment prompts, built-in USMT capture/restore steps, system validation checks (RAM, disk space, processor speed), the Gather step for collecting device properties, and pre-built task sequence templates for common scenarios (standard client deployment, replace computer, refresh). These reduce the complexity of building task sequences from scratch in Configuration Manager.'
                }
            ]
        });
        quiz.start();
    </script>
