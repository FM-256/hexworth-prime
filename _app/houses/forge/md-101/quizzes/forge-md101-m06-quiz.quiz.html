    <script>
        // MD-101 Module 6: Managing Security
        const STORAGE_KEY_ANSWERS = 'hexworth_md101_m06_quiz_answers';
        const STORAGE_KEY_SCORE   = 'hexworth_md101_m06_quiz_score';

        const questions = [
            {
                id: 1,
                topic: 'Device Data Protection',
                question: 'A company wants to ensure that corporate data on employee laptops remains protected even if a device is lost or stolen. Which combination of technologies provides both at-rest encryption and the ability to remotely wipe corporate data from the device?',
                options: [
                    'EFS and Windows Defender Firewall',
                    'BitLocker for at-rest encryption and Microsoft Intune for remote wipe capabilities',
                    'NTFS permissions and VPN',
                    'Windows Information Protection and WSUS'
                ],
                correct: 1,
                explanation: 'BitLocker provides full-volume encryption protecting data at rest - if the drive is physically removed from the device, it remains unreadable. Microsoft Intune (part of Endpoint Manager) enables remote wipe capabilities, allowing administrators to selectively remove corporate data or perform a full device wipe when a device is reported lost or stolen. Together they cover both the offline attack vector and the remote remediation scenario.'
            },
            {
                id: 2,
                topic: 'BitLocker',
                question: 'An organization is deploying BitLocker across all Windows 10 Enterprise laptops using Microsoft Endpoint Manager. They want encryption to happen silently without user interaction. Which prerequisite must be met on the hardware for silent BitLocker enablement?',
                options: [
                    'The device must have at least 8 GB of RAM',
                    'The device must have a TPM 2.0 chip and UEFI firmware with Secure Boot enabled',
                    'The device must be running Windows 10 Home or above',
                    'The device must be connected to the corporate network via Ethernet'
                ],
                correct: 1,
                explanation: 'Silent BitLocker enablement through Intune requires TPM 2.0 (to store the encryption keys without user PIN input), UEFI firmware (not legacy BIOS), and Secure Boot enabled. Without TPM 2.0, the system would require a startup PIN or USB key, making the deployment non-silent. These hardware requirements ensure the encryption key can be securely sealed by the TPM and automatically released during a trusted boot sequence.'
            },
            {
                id: 3,
                topic: 'BitLocker',
                question: 'A user calls the help desk because their BitLocker-encrypted laptop is displaying a recovery key screen after a motherboard replacement. The recovery key is stored in Azure AD. How does the administrator retrieve it?',
                options: [
                    'Run manage-bde -unlock from a command prompt on the locked device',
                    'Navigate to Azure AD > Devices > find the device > BitLocker keys, and provide the recovery key matching the Key ID displayed on the recovery screen',
                    'Reset the user\'s password in Azure AD to automatically unlock BitLocker',
                    'Disable BitLocker remotely through the Intune portal'
                ],
                correct: 1,
                explanation: 'When BitLocker recovery keys are escrowed to Azure AD, administrators can retrieve them by navigating to the device record in Azure AD. The recovery screen on the locked device displays a Key ID (first 8 characters) that must match the stored key. This is the standard recovery workflow for Azure AD-joined devices. The motherboard replacement changed the TPM, which invalidated the sealed encryption keys, triggering the recovery prompt - this is expected and correct behavior.'
            },
            {
                id: 4,
                topic: 'BitLocker',
                question: 'An IT administrator configures a BitLocker policy in Intune that requires XTS-AES 256-bit encryption for operating system drives. A group of older devices in the organization only support AES-CBC 128-bit. What happens when the policy is applied to these devices?',
                options: [
                    'The devices automatically upgrade to XTS-AES 256-bit',
                    'BitLocker enables with AES-CBC 128-bit as a fallback',
                    'The policy fails to apply on those devices, and they report as non-compliant in Intune',
                    'The devices are automatically unenrolled from Intune'
                ],
                correct: 2,
                explanation: 'When a BitLocker policy specifies an encryption algorithm that the hardware cannot support, the policy will fail to apply. The devices will report as non-compliant in the Intune portal. Intune does not silently downgrade the encryption standard - it enforces what is configured. Administrators must create a separate policy with compatible settings for older hardware, or exclude those devices from the policy and assign an appropriate one.'
            },
            {
                id: 5,
                topic: 'Microsoft Defender for Endpoint',
                question: 'Microsoft Defender for Endpoint detects suspicious PowerShell activity on a workstation that appears to be fileless malware executing entirely in memory. Which Defender for Endpoint capability specifically addresses this type of threat?',
                options: [
                    'Firewall rule enforcement',
                    'Endpoint Detection and Response (EDR) with behavioral analysis and memory scanning',
                    'Windows Update management',
                    'Application compatibility assessment'
                ],
                correct: 1,
                explanation: 'Endpoint Detection and Response (EDR) in Defender for Endpoint uses behavioral sensors, cloud security analytics, and threat intelligence to detect fileless malware that operates entirely in memory. Unlike traditional signature-based antivirus, EDR monitors process behaviors, script execution patterns, and memory operations. It can detect malicious PowerShell commands, reflective DLL injection, and other in-memory attack techniques that leave no files on disk.'
            },
            {
                id: 6,
                topic: 'Microsoft Defender for Endpoint',
                question: 'An organization has onboarded devices to Microsoft Defender for Endpoint. The security team wants to proactively search for indicators of compromise across all endpoints. Which feature allows them to write custom queries to hunt for threats?',
                options: [
                    'Windows Event Viewer',
                    'Advanced Hunting using Kusto Query Language (KQL)',
                    'Performance Monitor counters',
                    'Group Policy Management Console'
                ],
                correct: 1,
                explanation: 'Advanced Hunting in Microsoft Defender for Endpoint provides a query-based threat hunting tool using Kusto Query Language (KQL). Security analysts can write custom queries against up to 30 days of raw telemetry data to find indicators of compromise, suspicious behaviors, or anomalies across all onboarded endpoints. This proactive approach enables detection of threats that automated alerts might miss, such as subtle lateral movement or data staging activities.'
            },
            {
                id: 7,
                topic: 'Microsoft Defender for Endpoint',
                question: 'The security team notices that a compromised device in their network is communicating with a known command-and-control server. Using Defender for Endpoint, they want to immediately stop the threat from spreading. Which response action should they take first?',
                options: [
                    'Run a Quick Scan on the device',
                    'Isolate the device from the network while maintaining the Defender for Endpoint management channel',
                    'Uninstall Microsoft Defender from the device',
                    'Change the user\'s password in Active Directory'
                ],
                correct: 1,
                explanation: 'Network isolation in Defender for Endpoint immediately disconnects the device from the network, preventing lateral movement and C2 communication, while preserving the Defender for Endpoint cloud management channel. This allows the security team to continue investigating and remediating the device remotely. This is the critical first response action - containment before remediation. Password changes may also be necessary but do not stop active network-based threats.'
            },
            {
                id: 8,
                topic: 'Windows Information Protection',
                question: 'A company deploys Windows Information Protection (WIP) in "Silent" mode through Intune. An employee copies corporate data from a managed app and pastes it into a personal email client. What happens?',
                options: [
                    'The paste operation is blocked and the user sees an error message',
                    'WIP logs the action but allows the paste to complete without notifying the user',
                    'The data is automatically encrypted before being pasted',
                    'The personal email client is automatically enrolled as a managed app'
                ],
                correct: 1,
                explanation: 'WIP in Silent mode (also called "Allow overrides") logs inappropriate data sharing actions without blocking them or notifying the user. This mode is typically used during initial deployment to understand data flow patterns before enforcing stricter policies. The alternative modes are: Block (prevents the action entirely), Override (warns the user but allows them to proceed with logging), and Off. Silent mode helps organizations audit their data flows before enforcement to avoid disrupting productivity.'
            },
            {
                id: 9,
                topic: 'Windows Information Protection',
                question: 'When configuring Windows Information Protection policies in Intune, an administrator must define "protected apps" and "corporate identity." What does the corporate identity field specify?',
                options: [
                    'The administrator\'s user principal name',
                    'The primary internet domain(s) owned by the organization (e.g., contoso.com) used to identify corporate data',
                    'The Azure AD tenant ID in GUID format',
                    'The IP address range of the corporate network'
                ],
                correct: 1,
                explanation: 'The corporate identity in WIP is your primary corporate domain (e.g., contoso.com). WIP uses this domain to identify and tag data as corporate. When data originates from or is associated with this domain, WIP applies protection policies to it. Protected apps are the applications authorized to access this corporate data. Network boundaries (IP ranges, cloud resources) can be additionally configured to define where corporate data resides, but the corporate identity domain is the foundational identifier.'
            },
            {
                id: 10,
                topic: 'Attack Surface Reduction',
                question: 'An administrator wants to prevent Office applications from creating child processes, a common technique used by macro-based malware. Which security feature should they configure?',
                options: [
                    'Windows Defender Firewall outbound rules',
                    'Attack Surface Reduction (ASR) rules deployed via Intune or Group Policy',
                    'AppLocker executable rules',
                    'User Account Control (UAC) settings'
                ],
                correct: 1,
                explanation: 'Attack Surface Reduction (ASR) rules include a specific rule to "Block Office applications from creating child processes." This directly prevents the common attack pattern where a malicious macro in Word or Excel launches PowerShell, cmd.exe, or other processes to download and execute malware. ASR rules can be deployed through Microsoft Intune, Group Policy, or PowerShell, and can be set to Audit mode first to assess impact before enforcing Block mode.'
            },
            {
                id: 11,
                topic: 'Attack Surface Reduction',
                question: 'Before enforcing Attack Surface Reduction rules in Block mode across the organization, the security team wants to evaluate which rules would trigger without actually blocking anything. Which ASR mode should they use?',
                options: [
                    'Disabled mode',
                    'Audit mode - rules are evaluated and events are logged but actions are not blocked',
                    'Warn mode - users are blocked but can click through the warning',
                    'Test mode - rules only apply to the administrator\'s device'
                ],
                correct: 1,
                explanation: 'Audit mode evaluates ASR rules and generates events in the Windows event log (and Defender for Endpoint if onboarded) without actually blocking the actions. This allows security teams to analyze how many legitimate business processes would be impacted before switching to Block or Warn mode. This phased approach prevents productivity disruptions. Audit events appear in Event Viewer under Microsoft-Windows-Windows Defender/Operational with Event ID 1121 and 1122.'
            },
            {
                id: 12,
                topic: 'Microsoft Defender for Endpoint',
                question: 'An organization wants to assess their security posture and identify configuration weaknesses across all managed endpoints. Which Defender for Endpoint feature provides security recommendations based on current device configurations?',
                options: [
                    'Windows Update for Business',
                    'Threat and Vulnerability Management (TVM)',
                    'Network Protection',
                    'Controlled Folder Access'
                ],
                correct: 1,
                explanation: 'Threat and Vulnerability Management (TVM) in Defender for Endpoint continuously assesses endpoints to discover vulnerabilities and misconfigurations. It provides prioritized security recommendations based on real-time threat intelligence, organizational exposure, and device value. TVM helps security teams identify unpatched software, insecure configurations, and missing security controls across the endpoint estate, and it integrates with Intune to deploy remediation actions.'
            },
            {
                id: 13,
                topic: 'Device Data Protection',
                question: 'A company\'s compliance policy requires that all corporate laptops must be encrypted before accessing corporate resources. In Intune, how is this requirement enforced?',
                options: [
                    'By creating a firewall rule that blocks unencrypted devices',
                    'By creating a compliance policy that requires BitLocker encryption, then linking it to a Conditional Access policy that blocks non-compliant devices',
                    'By configuring a VPN that only accepts encrypted devices',
                    'By deploying a PowerShell script that checks encryption status hourly'
                ],
                correct: 1,
                explanation: 'The standard approach is a two-part configuration: First, an Intune compliance policy defines the encryption requirement (BitLocker must be enabled). Second, an Azure AD Conditional Access policy uses device compliance as a grant condition, blocking access to corporate resources (Exchange Online, SharePoint, etc.) for devices that are not compliant. This creates a zero-trust posture where only encrypted, compliant devices can access organizational data.'
            },
            {
                id: 14,
                topic: 'Windows Information Protection',
                question: 'An employee saves a corporate document to their personal USB drive. The organization has WIP configured in "Block" mode with USB drives classified as non-corporate storage. What is the expected behavior?',
                options: [
                    'The file is saved but automatically decrypted on the USB drive',
                    'The save operation is blocked entirely, and the user receives a notification that the action is not allowed',
                    'The file is saved to the USB drive but encrypted with the corporate EFS key',
                    'WIP prompts the user for manager approval before allowing the save'
                ],
                correct: 1,
                explanation: 'In Block mode (also called "Hide overrides"), WIP prevents the movement of corporate-tagged data to non-corporate locations entirely. The user sees a notification explaining the action is blocked by organizational policy. This is the most restrictive WIP enforcement level and is appropriate for organizations handling highly sensitive data. Unlike Override mode where users can acknowledge and proceed, Block mode provides no bypass option for end users.'
            },
            {
                id: 15,
                topic: 'Attack Surface Reduction',
                question: 'A security administrator wants to protect against credential theft by preventing processes from reading the memory of the LSASS (Local Security Authority Subsystem Service) process. Which security approach directly addresses this?',
                options: [
                    'Enabling Windows Defender Firewall on all profiles',
                    'Configuring the ASR rule "Block credential stealing from the Windows local security authority subsystem" combined with enabling Credential Guard',
                    'Setting a stronger password policy in Group Policy',
                    'Enabling BitLocker with a pre-boot PIN'
                ],
                correct: 1,
                explanation: 'The ASR rule specifically designed to block LSASS memory access prevents tools like Mimikatz from reading credentials from the LSASS process. Credential Guard provides an additional layer by using virtualization-based security (VBS) to isolate LSASS secrets in a protected container that even kernel-level exploits cannot access. Together they provide defense-in-depth against credential theft - ASR blocks the process access attempt while Credential Guard protects the secrets even if the block is somehow bypassed.'
            }
        ];

        let userAnswers = {};
        let submitted   = false;

        function loadState() {
            try {
                const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
                const savedScore   = localStorage.getItem(STORAGE_KEY_SCORE);
                if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
                if (savedScore && savedAnswers) submitted = true;
            } catch (e) { /* start fresh */ }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
        }

        function updateProgress() {
            const answered = Object.keys(userAnswers).length;
            const total    = questions.length;
            const pct      = Math.round((answered / total) * 100);

            document.getElementById('progressText').textContent = `${answered} of ${total} answered`;
            document.getElementById('progressPct').textContent  = `${pct}%`;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('submitBtn').disabled = (answered < total || submitted);
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'question-card' + (userAnswers[q.id] !== undefined ? ' answered' : '');
                card.id = `q-card-${q.id}`;

                const selectedIdx = userAnswers[q.id];

                const optionsHtml = q.options.map((opt, i) => {
                    let cls = 'option';
                    if (submitted) {
                        cls += ' disabled';
                        if (i === q.correct)        cls += ' correct';
                        else if (i === selectedIdx) cls += ' incorrect';
                    } else {
                        if (i === selectedIdx) cls += ' selected';
                    }
                    return `<div class="${cls}" data-qid="${q.id}" data-idx="${i}" onclick="selectAnswer(${q.id}, ${i})">${opt}</div>`;
                }).join('');

                const explShow = submitted ? ' show' : '';

                card.innerHTML = `
                    <div class="question-num">Question ${idx + 1} of ${questions.length} &nbsp;&bull;&nbsp; ${q.topic}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="explanation${explShow}">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectAnswer(qId, idx) {
            if (submitted) return;
            userAnswers[qId] = idx;
            saveState();
            updateProgress();

            const card = document.getElementById(`q-card-${qId}`);
            card.classList.add('answered');
            card.querySelectorAll('.option').forEach((el, i) => {
                el.classList.remove('selected');
                if (i === idx) el.classList.add('selected');
            });
        }

        function submitQuiz() {
            if (Object.keys(userAnswers).length < questions.length) return;
            submitted = true;
            document.getElementById('submitBtn').disabled = true;

            let correct = 0;
            questions.forEach(q => { if (userAnswers[q.id] === q.correct) correct++; });

            const pct  = Math.round((correct / questions.length) * 100);
            const pass = pct >= 70;

            localStorage.setItem(STORAGE_KEY_SCORE, JSON.stringify({ score: correct, total: questions.length, pct, pass }));

            const resultsCard  = document.getElementById('resultsCard');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const scoreDetail  = document.getElementById('scoreDetail');
            const resultBadge  = document.getElementById('resultBadge');

            scoreDisplay.textContent = pct + '%';
            scoreDisplay.className   = 'score-display ' + (pass ? 'pass' : 'fail');
            scoreDetail.textContent  = `You answered ${correct} of ${questions.length} questions correctly.`;
            resultBadge.textContent  = pass ? 'PASSED' : 'NOT PASSED';
            resultBadge.className    = 'result-badge ' + (pass ? 'pass' : 'fail');
            resultsCard.classList.add('show');

            renderQuestions();
            resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function retakeQuiz() {
            localStorage.removeItem(STORAGE_KEY_ANSWERS);
            localStorage.removeItem(STORAGE_KEY_SCORE);
            userAnswers = {};
            submitted   = false;

            document.getElementById('resultsCard').classList.remove('show');
            document.getElementById('submitBtn').disabled = true;
            renderQuestions();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadState();
        renderQuestions();
        updateProgress();

        if (submitted) {
            const savedScore = localStorage.getItem(STORAGE_KEY_SCORE);
            if (savedScore) {
                const { score: correct, total, pct, pass } = JSON.parse(savedScore);
                const resultsCard  = document.getElementById('resultsCard');
                const scoreDisplay = document.getElementById('scoreDisplay');
                const scoreDetail  = document.getElementById('scoreDetail');
                const resultBadge  = document.getElementById('resultBadge');

                scoreDisplay.textContent = pct + '%';
                scoreDisplay.className   = 'score-display ' + (pass ? 'pass' : 'fail');
                scoreDetail.textContent  = `You answered ${correct} of ${total} questions correctly.`;
                resultBadge.textContent  = pass ? 'PASSED' : 'NOT PASSED';
                resultBadge.className    = 'result-badge ' + (pass ? 'pass' : 'fail');
                resultsCard.classList.add('show');
                document.getElementById('submitBtn').disabled = true;
            }
        }
    </script>
