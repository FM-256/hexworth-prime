<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-101 Module 02 Quiz - Forge House</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-101 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 02 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 02',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m02',
            moduleId: 'md101-m02',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A company purchases new Windows 11 laptops for employees. These devices will only be managed through Azure AD and Intune with no on-premises AD infrastructure. Which Azure AD join type should be configured during device setup?',
                    options: [
                        'Azure AD registered',
                        'Azure AD joined',
                        'Hybrid Azure AD joined',
                        'On-premises domain joined'
                    ],explanation: 'Azure AD joined is the correct choice for corporate-owned devices in a cloud-only environment (no on-premises AD). The device gets a full identity in Azure AD and can be managed entirely through Intune. Azure AD registered is for personal BYOD devices. Hybrid join requires on-premises AD.'
                },
                {
                    question: 'EXAM TIP: What is the key distinguishing characteristic of an Azure AD registered device compared to an Azure AD joined device?',
                    options: [
                        'Azure AD registered devices can receive Group Policy Objects',
                        'Azure AD registered devices are typically personal/BYOD devices that sign in with a personal account and register a workplace account alongside it',
                        'Azure AD registered devices receive full device management from Intune',
                        'Azure AD registered devices must be running Windows 10 or later'
                    ],explanation: 'Azure AD registered devices are personal (BYOD) devices where the user signs in with their personal account (local or Microsoft) and adds a work or school account for resource access. The organization gets limited management. Azure AD joined devices sign in directly with the organizational account and receive full management.'
                },
                {
                    question: 'An IT administrator needs to enroll a single Windows device into Intune for testing. The device is already Azure AD joined. What is the simplest enrollment method?',
                    options: [
                        'Use Windows Autopilot',
                        'Navigate to Settings > Accounts > Access work or school and connect to the organization',
                        'Run a PowerShell bulk enrollment script',
                        'Create a Device Enrollment Manager account'
                    ],explanation: 'For a single device that is already Azure AD joined, the simplest method is manual enrollment through Settings > Accounts > Access work or school. This connects the device to the organization and triggers Intune enrollment. Autopilot and bulk methods are designed for large-scale deployments.'
                },
                {
                    question: 'An organization wants Windows devices to automatically enroll in Intune when users join them to Azure AD. Which configuration enables this?',
                    options: [
                        'Configure a Device Enrollment Manager account',
                        'Enable MDM auto-enrollment in Azure AD and set the MDM user scope',
                        'Deploy a Group Policy to push the Intune client agent',
                        'Configure Windows Autopilot deployment profiles'
                    ],explanation: 'MDM auto-enrollment is configured in Azure AD under Mobility (MDM and MAM). When the MDM user scope is set to Some or All, devices automatically enroll in Intune when they are Azure AD joined. This is the most seamless enrollment experience for cloud-managed environments.'
                },
                {
                    question: 'A company with existing on-premises Active Directory and SCCM wants to enable auto-enrollment into Intune for their hybrid Azure AD joined devices. Which mechanism can trigger this auto-enrollment?',
                    options: [
                        'A scheduled task configured via Group Policy',
                        'Manual enrollment by each user through the Company Portal',
                        'Windows Autopilot reset',
                        'SCCM client push installation'
                    ],explanation: 'For hybrid Azure AD joined devices, auto-enrollment into Intune can be triggered via a Group Policy that creates a scheduled task. The GPO setting is found under Computer Configuration > Administrative Templates > Windows Components > MDM > Enable automatic MDM enrollment using default Azure AD credentials.'
                },
                {
                    question: 'What information must be collected from devices BEFORE they can be registered for Windows Autopilot?',
                    options: [
                        'The device MAC address and IP address',
                        'The hardware hash (device ID), serial number, and optionally the manufacturer and model',
                        'The BitLocker recovery key and TPM owner password',
                        'The Windows product key and activation status'
                    ],explanation: 'Windows Autopilot registration requires the hardware hash (a unique device identifier), serial number, and optionally the manufacturer and model. This data is typically collected using a PowerShell script (Get-WindowsAutopilotInfo) or provided by the hardware vendor as a CSV file.'
                },
                {
                    question: 'EXAM TIP: Which Windows Autopilot deployment mode configures the device for the organization without requiring the end user to go through any setup screens, and is typically used for shared devices or kiosks?',
                    options: [
                        'User-driven mode',
                        'Self-deploying mode',
                        'Pre-provisioning (White Glove)',
                        'Autopilot Reset'
                    ],explanation: 'Self-deploying mode completes setup without any user interaction, making it ideal for shared devices, kiosks, or digital signage. User-driven mode requires the user to sign in. Pre-provisioning (White Glove) allows IT to pre-configure before handing to the user. Autopilot Reset repurposes an existing device.'
                },
                {
                    question: 'A company wants IT technicians to pre-configure Autopilot devices with apps and policies in a staging area before shipping them to end users, who then complete the final setup by signing in. Which Autopilot mode supports this?',
                    options: [
                        'User-driven mode',
                        'Self-deploying mode',
                        'Pre-provisioning (White Glove)',
                        'Autopilot Reset'
                    ],explanation: 'Pre-provisioning (formerly White Glove) splits the deployment into two phases: a technician phase where IT pre-installs apps, drivers, and policies at a staging facility, and a user phase where the end user signs in and completes personalization. This ensures the device is ready to use quickly when the user receives it.'
                },
                {
                    question: 'An IT department needs a single account that can enroll up to 1,000 devices in Intune for a kiosk deployment. None of these devices will be assigned to individual users. Which feature should they use?',
                    options: [
                        'Windows Autopilot self-deploying mode',
                        'Device Enrollment Manager (DEM) account',
                        'Bulk enrollment with a provisioning package',
                        'MDM auto-enrollment via GPO'
                    ],explanation: 'A Device Enrollment Manager (DEM) account is a special Intune account that can enroll up to 1,000 devices. DEM is designed for scenarios where devices are not associated with individual users, such as kiosks or shared devices. The DEM user enrolls devices on behalf of the organization.'
                },
                {
                    question: 'Which of the following is a limitation of Device Enrollment Manager (DEM) accounts?',
                    options: [
                        'DEM accounts cannot enroll Windows devices',
                        'Devices enrolled through DEM cannot use Windows Autopilot or self-deploying mode',
                        'DEM accounts can only enroll a maximum of 50 devices',
                        'DEM requires Azure AD Premium P2 licensing'
                    ],explanation: 'DEM-enrolled devices cannot use Windows Autopilot and do not support user affinity (user-device association). This is by design since DEM is intended for shared/userless devices. DEM supports up to 1,000 devices per account and works with Windows, iOS, and Android.'
                },
                {
                    question: 'An administrator needs to enroll 50 Windows devices into Intune quickly using a USB drive, without requiring each user to sign in individually. Which tool creates the provisioning package for this?',
                    options: [
                        'Microsoft Deployment Toolkit (MDT)',
                        'Windows Configuration Designer (WCD)',
                        'System Center Configuration Manager (SCCM)',
                        'Azure AD Connect'
                    ],explanation: 'Windows Configuration Designer (WCD) creates provisioning packages (.ppkg files) that can be applied via USB drive to bulk enroll Windows devices into Azure AD and Intune. The package contains enrollment credentials and configuration, eliminating the need for individual user sign-in during enrollment.'
                },
                {
                    question: 'An organization wants to prevent personal Android devices from enrolling in Intune while still allowing corporate-owned Android devices. Which Intune feature should be configured?',
                    options: [
                        'Conditional Access policies',
                        'Device enrollment restrictions (device type restrictions)',
                        'MAM without enrollment',
                        'Azure AD device settings'
                    ],explanation: 'Device enrollment restrictions in Intune allow administrators to block or allow enrollment based on device platform, OS version, manufacturer, and ownership type (personal vs. corporate). Setting a device type restriction to block personally owned Android devices achieves this requirement.'
                },
                {
                    question: 'EXAM TIP: What is the maximum number of devices a single user can enroll in Intune by default, and where is this limit configured?',
                    options: [
                        '5 devices, configured in Azure AD device settings',
                        '15 devices, configured in Intune device limit restrictions',
                        '10 devices, configured in Intune device limit restrictions',
                        'Unlimited devices by default, configured in Azure AD'
                    ],explanation: 'By default, Intune allows each user to enroll up to 15 devices. This is configured through device limit restrictions in the Intune admin center under Devices > Enrollment restrictions. Administrators can lower this limit or set different limits for different groups of users.'
                },
                {
                    question: 'After devices are enrolled in Intune, an administrator wants to automatically organize them into dynamic groups based on department (e.g., Finance, Engineering, HR). Which Intune feature helps with this initial categorization?',
                    options: [
                        'Compliance policies',
                        'Device categories and dynamic Azure AD groups',
                        'Configuration profiles',
                        'Enrollment status page'
                    ],explanation: 'Device categories in Intune allow users or admins to select a category during enrollment. These categories can then be used as criteria for dynamic Azure AD device groups, which automatically organize devices into groups for targeted policy and app deployment.'
                },
                {
                    question: 'During Windows Autopilot enrollment, a user sees a screen showing the progress of policy and application installations before reaching the desktop. What is this screen called?',
                    options: [
                        'Windows Out-of-Box Experience (OOBE)',
                        'Enrollment Status Page (ESP)',
                        'Device compliance check',
                        'Conditional access evaluation'
                    ],explanation: 'The Enrollment Status Page (ESP) shows real-time progress during device enrollment, displaying the status of device preparation, device setup, and account setup phases. It can be configured to block the user from using the device until all required policies and applications are installed, ensuring the device is fully configured before first use.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
