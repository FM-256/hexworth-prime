    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {

        /* ── Page header ── */

            padding: 14px 28px;

            border-bottom: 1px solid rgba(234,88,12,0.25);

        .page-header a {

        .quiz-wrapper {
            flex: 1;
            display: flex;

            justify-content: center;
            padding: 32px 20px 48px;

        .quiz-container { width: 100%; max-width: 820px; }

        /* ── Quiz header card ── */
        .quiz-header {
            background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;

            margin-bottom: 24px;

        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        /* ── Progress bar ── */
        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        /* ── Question cards ── */

        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        /* ── Options ── */
        .options { display: flex; flex-direction: column; gap: 9px; }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            color: #d1d5db;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; min-width: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            color: #9ca3af;
        }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        /* ── Explanation ── */
        .explanation {

        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        /* ── Submit / Results ── */
        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn {
            display: inline-flex;
            align-items: center;

        .btn-primary {

        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.07);

        }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        /* ── Results card ── */
        .results-card {
            display: none;

        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge {
            display: inline-block;

        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        /* ── Nav buttons ── */

<script>
/* ── Quiz data ── */
const QUIZ_ID = 'hexworth_md101_m05_quiz';

const questions = [
    {
        id: 1,
        topic: 'Windows Hello for Business',
        question: 'An organization wants to eliminate password-based authentication for their Windows devices. Users should authenticate using facial recognition or fingerprint tied to their device. Which technology enables this?',
        options: [
            'Smart card authentication',
            'Windows Hello for Business',
            'FIDO2 security keys',
            'Certificate-based authentication'
        ],
        correct: 1,
        explanation: 'Windows Hello for Business replaces passwords with strong two-factor authentication on Windows devices using biometrics (facial recognition, fingerprint) or a PIN. The credentials are tied to the device and backed by a cryptographic key pair, making them resistant to phishing, replay, and credential theft attacks.'
    },
    {
        id: 2,
        topic: 'Windows Hello for Business',
        question: 'EXAM TIP: What is the relationship between a Windows Hello PIN and a traditional password from a security perspective?',
        options: [
            'A PIN is less secure because it is shorter than a password',
            'A PIN is equivalent to a password since both are knowledge factors',
            'A PIN is more secure because it is tied to a specific device and backed by the TPM, while a password can be used from any device',
            'A PIN and password provide identical security levels'
        ],
        correct: 2,
        explanation: 'A Windows Hello PIN is device-specific and backed by the TPM (Trusted Platform Module). Even if intercepted, the PIN is useless on another device. A compromised password can be used from any device to access accounts. The PIN never leaves the device and is not transmitted to the authentication server, making it inherently more secure than a network-transmitted password.'
    },
    {
        id: 3,
        topic: 'FIDO2 Security Keys',
        question: 'A user frequently works from shared computers in a library and needs passwordless authentication to Azure AD resources. Which authentication method works best across multiple devices without biometric hardware?',
        options: [
            'Windows Hello for Business with facial recognition',
            'FIDO2 security key',
            'SMS-based one-time password',
            'Windows Hello PIN'
        ],
        correct: 1,
        explanation: 'FIDO2 security keys are external hardware authenticators (USB, NFC, or Bluetooth) that enable passwordless sign-in to Azure AD. They work across different devices without requiring biometric hardware on the computer. The user plugs in or taps their key and uses a PIN or biometric on the key itself to authenticate.'
    },
    {
        id: 4,
        topic: 'Multi-Factor Authentication',
        question: 'Which of the following represents a TRUE multi-factor authentication combination?',
        options: [
            'Password + security question (both are something you know)',
            'Fingerprint + facial recognition (both are something you are)',
            'Password + Microsoft Authenticator push notification (something you know + something you have)',
            'Two different passwords (both are something you know)'
        ],
        correct: 2,
        explanation: 'True MFA requires factors from at least two different categories: something you know (password, PIN), something you have (phone, security key, smart card), and something you are (biometrics). A password (knowledge) combined with an Authenticator push (possession of the phone) uses two different factor categories.'
    },
    {
        id: 5,
        topic: 'Conditional Access',
        question: 'EXAM TIP: An organization wants to require MFA only when users sign in from outside the corporate network. All other sign-ins should use single sign-on. Which Azure AD feature implements this policy?',
        options: [
            'Azure AD Identity Protection',
            'Conditional Access with named locations',
            'Azure AD Privileged Identity Management',
            'Intune device compliance'
        ],
        correct: 1,
        explanation: 'Conditional Access policies can use named locations (defined by IP ranges or countries) as conditions. By creating a named location for the corporate network and a conditional access policy that requires MFA when the user is NOT on a trusted location, the organization achieves location-based MFA enforcement while allowing seamless SSO from the office.'
    },
    {
        id: 6,
        topic: 'Conditional Access',
        question: 'A conditional access policy has the following configuration: Users = All users, Cloud apps = Office 365, Conditions = Any device platform, Grant = Require device to be marked as compliant. What happens when a user with a non-compliant device tries to access Outlook Online?',
        options: [
            'The user is allowed access but receives a warning',
            'The user is blocked from accessing Outlook Online until their device becomes compliant',
            'The user is prompted for MFA instead',
            'The policy is ignored because it applies to all users'
        ],
        correct: 1,
        explanation: 'When a conditional access policy requires the device to be marked as compliant, any user with a non-compliant device is blocked from accessing the targeted cloud apps. The user must remediate the compliance issues on their device (or use a compliant device) before access is granted. This is the "Grant" control in conditional access.'
    },
    {
        id: 7,
        topic: 'Conditional Access Components',
        question: 'Which three components make up a conditional access policy?',
        options: [
            'Users, Devices, Applications',
            'Assignments (who/what/when), Conditions (where/how), Access controls (grant/session)',
            'Authentication, Authorization, Accounting',
            'Identity, Compliance, Protection'
        ],
        correct: 1,
        explanation: 'Conditional access policies consist of: Assignments (which users/groups and which cloud apps/actions), Conditions (sign-in risk, device platform, location, client apps), and Access controls split into Grant controls (block, require MFA, require compliant device) and Session controls (app-enforced restrictions, sign-in frequency).'
    },
    {
        id: 8,
        topic: 'Compliance Policies',
        question: 'An Intune administrator creates a compliance policy that requires Windows devices to have BitLocker enabled, a minimum OS version of 22H2, and a password of at least 8 characters. A device meets two of three requirements. What is the device compliance status?',
        options: [
            'Partially compliant',
            'Non-compliant',
            'Compliant with warnings',
            'Compliant because it meets the majority of requirements'
        ],
        correct: 1,
        explanation: 'Compliance policies use an AND logic: a device must meet ALL configured requirements to be marked as compliant. Failing even one requirement results in a non-compliant status. There is no partial compliance in Intune. The device is either fully compliant or non-compliant.'
    },
    {
        id: 9,
        topic: 'Compliance Policy Settings',
        question: 'Which of the following is a valid compliance policy setting category in Intune for Windows devices?',
        options: [
            'Application deployment status',
            'Device health (BitLocker, Secure Boot, code integrity)',
            'Network connectivity speed',
            'User productivity metrics'
        ],
        correct: 1,
        explanation: 'Device health is a compliance policy category that checks for BitLocker encryption, Secure Boot status, and code integrity. Other categories include Device Properties (OS version), System Security (password requirements, encryption), and Microsoft Defender for Endpoint (machine risk score). Intune does not evaluate network speed or user productivity.'
    },
    {
        id: 10,
        topic: 'Non-Compliance Actions',
        question: 'EXAM TIP: An administrator configures a compliance policy with the action "Mark device non-compliant" with a grace period of 3 days. What happens during those 3 days?',
        options: [
            'The device is immediately blocked from all resources',
            'The device is in a grace period state where the user is notified but the device is not yet marked non-compliant',
            'The compliance policy is not evaluated for 3 days',
            'The device is automatically wiped after 3 days'
        ],
        correct: 1,
        explanation: 'A grace period gives users time to remediate compliance issues before the device is officially marked non-compliant. During the grace period, the device is in an "In grace period" state. The user receives notifications about the non-compliance but is not blocked by conditional access policies that require compliant devices. After the grace period expires, the device is marked non-compliant.'
    },
    {
        id: 11,
        topic: 'Non-Compliance Actions',
        question: 'Which of the following are valid actions for non-compliance in Intune? (Select the most complete answer)',
        options: [
            'Mark device non-compliant only',
            'Mark device non-compliant, send email notification, remotely lock device, and retire device',
            'Block internet access and disable the device account',
            'Automatically reinstall the operating system'
        ],
        correct: 1,
        explanation: 'Intune supports multiple actions for non-compliant devices: mark the device non-compliant (required, can have grace period), send email notifications to the user, send push notifications, remotely lock the device, and retire (remove management data from) the device. Each action can have its own schedule/delay. Intune cannot block internet access or reinstall the OS as compliance actions.'
    },
    {
        id: 12,
        topic: 'Device Health Attestation',
        question: 'What is Device Health Attestation (DHA) and what role does it play in compliance evaluation?',
        options: [
            'DHA is a manual health check performed by IT technicians',
            'DHA uses the TPM and a cloud service to cryptographically verify the boot-time security state of a device, including Secure Boot, BitLocker, and Early Launch Anti-Malware (ELAM) status',
            'DHA scans for malware and reports findings to Intune',
            'DHA checks whether Windows updates are installed'
        ],
        correct: 1,
        explanation: 'Device Health Attestation uses the TPM chip to measure boot-time components and sends these measurements to the Microsoft Health Attestation Service in the cloud. The service verifies that Secure Boot, BitLocker, ELAM (Early Launch Anti-Malware), and other boot integrity components were in a healthy state. These results can be used in Intune compliance policies.'
    },
    {
        id: 13,
        topic: 'Microsoft Defender Integration',
        question: 'An organization uses Microsoft Defender for Endpoint and wants to block devices with a high threat level from accessing corporate resources. Which two Intune features work together to achieve this?',
        options: [
            'App protection policies and conditional access',
            'Compliance policies (with machine risk level) and conditional access (require compliant device)',
            'Device configuration profiles and enrollment restrictions',
            'Windows Update policies and device health attestation'
        ],
        correct: 1,
        explanation: 'First, a compliance policy is configured to evaluate the Microsoft Defender for Endpoint machine risk level (clear, low, medium, high). If the risk level exceeds the allowed threshold, the device is marked non-compliant. Then, a conditional access policy requires devices to be compliant before accessing cloud resources. Together, high-risk devices are automatically blocked.'
    },
    {
        id: 14,
        topic: 'Passwordless Authentication',
        question: 'An organization wants to implement a passwordless authentication strategy. Which combination represents Microsoft-recommended passwordless methods?',
        options: [
            'SMS codes, email OTP, and security questions',
            'Windows Hello for Business, FIDO2 security keys, and Microsoft Authenticator phone sign-in',
            'Smart cards, RSA tokens, and password managers',
            'Kerberos tickets, NTLM hashes, and certificate-based authentication'
        ],
        correct: 1,
        explanation: 'Microsoft recommends three passwordless authentication methods for Azure AD: Windows Hello for Business (biometrics/PIN on Windows devices), FIDO2 security keys (hardware authenticators), and Microsoft Authenticator phone sign-in (number matching or biometric on the phone). These methods eliminate passwords while providing strong, phishing-resistant authentication.'
    },
    {
        id: 15,
        topic: 'Compliance + Conditional Access',
        question: 'EXAM TIP: What is the correct order of evaluation when a user attempts to access a cloud resource protected by both compliance policies and conditional access?',
        options: [
            'Conditional access evaluates first, then compliance is checked',
            'User authenticates, Intune evaluates the device compliance status, conditional access checks if the device is compliant, then grants or blocks access',
            'The device compliance and conditional access are evaluated simultaneously with no dependency',
            'Compliance policies only apply after access is granted'
        ],
        correct: 1,
        explanation: 'The flow is: (1) User authenticates to Azure AD, (2) Intune continuously evaluates device compliance status based on configured policies, (3) Conditional access checks the device compliance state as a grant condition, (4) Access is granted if the device is compliant or blocked if it is not. Compliance evaluation by Intune happens independently and continuously, while conditional access checks the result at sign-in time.'
    }
];

/* ── State ── */
const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

/* ── Render questions ── */
function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;

        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    updateProgress();
    updateSubmitButton();
}

/* ── Select an answer ── */
function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));

    // Update UI for this question
    const letters = ['A', 'B', 'C', 'D'];
    questions[qIdx].options.forEach((_, oi) => {
        const btn = document.getElementById('opt-' + qIdx + '-' + oi);
        btn.className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');

    updateProgress();
    updateSubmitButton();
}

/* ── Update progress bar ── */
function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const total = questions.length;
    const pct = Math.round((answered / total) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + total + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

/* ── Enable submit when all answered ── */
function updateSubmitButton() {
    const answered = Object.keys(state.answers).length;
    document.getElementById('submit-btn').disabled = answered < questions.length;
}

/* ── Submit quiz ── */
function submitQuiz() {
    state.submitted = true;
    let correct = 0;

    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;

        // Color code options
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) {
                btn.classList.add('correct');
            } else if (oi === chosen && !isCorrect) {
                btn.classList.add('incorrect');
            }
        });

        // Show explanation
        document.getElementById('explanation-' + idx).classList.add('visible');
    });

    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;

    // Save score
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));

    // Award XP and completion stamp
    if (passed && typeof ModuleProgress !== 'undefined') {
        ModuleProgress.completeQuiz('forge', 'forge-md101-m05-quiz', pct, {
            returnToDashboard: false,
            passingScore: 70
        });
    }

    // Show results
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';

    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');

    document.getElementById('results-message').textContent = passed
        ? 'Solid work. You have demonstrated understanding of authentication methods, conditional access, compliance policies, and device health attestation in a modern management environment.'
        : 'Keep pushing. Review the explanations for missed questions, focus on conditional access policy components and compliance policy evaluation flow, and retake when ready. 70% is the threshold.';

    // Swap submit for retake
    const actionsDiv = document.querySelector('.quiz-actions');
    actionsDiv.innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';

    // Scroll to results
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Retake ── */
function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Sanitize user-facing text ── */
function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

/* ── Init ── */
renderQuestions();
</script>
