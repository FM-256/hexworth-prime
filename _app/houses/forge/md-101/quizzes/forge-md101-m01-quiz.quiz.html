<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-101 Module 01 Quiz - Forge House</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-101 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 01 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 01',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m01',
            moduleId: 'md101-m01',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'An organization is planning its enterprise desktop strategy. Which phase of the desktop lifecycle involves creating a standardized image, configuring policies, and packaging applications before any devices reach end users?',
                    options: [
                        'Planning',
                        'Purchasing',
                        'Deployment',
                        'Operations'
                    ],explanation: 'The Deployment phase covers building images, configuring policies, packaging applications, and delivering configured devices to users. Planning defines requirements, Purchasing handles procurement, and Operations covers ongoing maintenance and support after deployment.'
                },
                {
                    question: 'EXAM TIP: Which statement BEST describes the key difference between traditional management and modern management of enterprise desktops?',
                    options: [
                        'Traditional management uses the cloud; modern management uses on-premises servers',
                        'Traditional management relies on on-premises tools like Group Policy and SCCM; modern management uses cloud-based services like Intune and Azure AD',
                        'Modern management only works with Windows devices; traditional management supports all platforms',
                        'Traditional management requires Azure AD; modern management requires Active Directory'
                    ],explanation: 'Traditional management depends on on-premises infrastructure like Active Directory, Group Policy, and SCCM. Modern management shifts to cloud-based tools like Microsoft Intune and Azure AD, enabling management of devices from anywhere without requiring corporate network connectivity.'
                },
                {
                    question: 'A remote employee purchases a new laptop and needs to access corporate resources. The company uses Azure AD exclusively with no on-premises AD. Which Azure AD join type should be configured?',
                    options: [
                        'Azure AD registered',
                        'Azure AD joined',
                        'Hybrid Azure AD joined',
                        'Domain joined via VPN'
                    ],explanation: 'Azure AD joined is used when there is no on-premises AD and the device is corporate-owned. This gives the device a full identity in Azure AD for SSO and policy management. Azure AD registered is for BYOD personal devices. Hybrid Azure AD join requires on-premises AD, which this scenario does not have.'
                },
                {
                    question: 'An employee wants to use their personal iPhone to access corporate email and Teams. The organization wants to apply some policies without fully managing the device. Which Azure AD join type is appropriate?',
                    options: [
                        'Azure AD joined',
                        'Azure AD registered',
                        'Hybrid Azure AD joined',
                        'On-premises domain joined'
                    ],explanation: 'Azure AD registered is designed for BYOD (Bring Your Own Device) scenarios. It registers the personal device with Azure AD and allows conditional access and limited policy enforcement without giving the organization full control over the device. Azure AD joined is for corporate-owned devices.'
                },
                {
                    question: 'A large enterprise currently uses on-premises Active Directory with Group Policy but wants to begin managing devices through Intune while maintaining existing domain join. Which approach supports this transition?',
                    options: [
                        'Azure AD registered',
                        'Azure AD joined with no domain membership',
                        'Hybrid Azure AD joined',
                        'Disconnecting from on-premises AD entirely'
                    ],explanation: 'Hybrid Azure AD join allows devices to be joined to both on-premises Active Directory and Azure AD simultaneously. This is the recommended transitional approach for enterprises migrating from traditional to modern management, as it preserves existing GPO infrastructure while enabling cloud-based management through Intune.'
                },
                {
                    question: 'Which of the following is NOT a capability of Microsoft Intune?',
                    options: [
                        'Mobile Device Management (MDM)',
                        'Mobile Application Management (MAM)',
                        'On-premises file server management',
                        'Device compliance policy enforcement'
                    ],explanation: 'Microsoft Intune is a cloud-based endpoint management service that provides MDM, MAM, compliance policy enforcement, and configuration profiles. It does not manage on-premises file servers; that remains the domain of traditional tools like Windows Admin Center or System Center.'
                },
                {
                    question: 'EXAM TIP: A company needs Microsoft Intune, Azure AD Premium P1, and Office applications for 500 knowledge workers. Which is the MINIMUM Microsoft 365 license tier that includes all three?',
                    options: [
                        'Microsoft 365 F3 (Frontline)',
                        'Microsoft 365 E3',
                        'Microsoft 365 E5',
                        'Microsoft 365 Business Basic'
                    ],explanation: 'Microsoft 365 E3 includes Intune, Azure AD Premium P1, and the full Office suite for knowledge workers. F3 is for frontline workers with limited Office access. E5 adds advanced security and compliance features beyond what is needed here. Business Basic does not include desktop Office apps.'
                },
                {
                    question: 'Which Microsoft 365 license tier includes Azure AD Premium P2, Microsoft Defender for Endpoint Plan 2, and advanced eDiscovery?',
                    options: [
                        'Microsoft 365 E1',
                        'Microsoft 365 E3',
                        'Microsoft 365 E5',
                        'Microsoft 365 F3'
                    ],explanation: 'Microsoft 365 E5 is the premium tier that includes Azure AD Premium P2 (with Privileged Identity Management and Identity Protection), Microsoft Defender for Endpoint Plan 2, advanced eDiscovery, and other advanced security and compliance features not found in E3 or below.'
                },
                {
                    question: 'An organization uses SCCM to manage 10,000 Windows devices and wants to gradually shift management workloads to Intune. What is this approach called?',
                    options: [
                        'Cloud migration',
                        'Co-management',
                        'Azure AD join',
                        'Device enrollment'
                    ],explanation: 'Co-management allows organizations to manage Windows devices with both SCCM (Configuration Manager) and Microsoft Intune simultaneously. Specific workloads like compliance policies, resource access, or Windows Update can be individually shifted from SCCM to Intune over time, providing a gradual migration path.'
                },
                {
                    question: 'In a co-management configuration, which workload determines whether compliance policies are evaluated by SCCM or Intune?',
                    options: [
                        'The workload slider for Compliance Policies in the co-management properties',
                        'The Azure AD join type of the device',
                        'The version of Windows installed on the device',
                        'The SCCM client version'
                    ],explanation: 'Co-management uses workload sliders in the co-management configuration properties within SCCM. Each workload (compliance policies, resource access profiles, Windows Update, endpoint protection, device configuration, Office Click-to-Run, client apps) can be individually pointed to either SCCM or Intune using these sliders.'
                },
                {
                    question: 'A company wants to provide persistent, dedicated Cloud PCs to remote workers where each user gets their own virtual Windows desktop that retains their settings between sessions. Which solution is MOST appropriate?',
                    options: [
                        'Azure Virtual Desktop with pooled host pools',
                        'Windows 365 Cloud PC',
                        'Remote Desktop Services on-premises',
                        'Microsoft Teams with screen sharing'
                    ],explanation: 'Windows 365 provides persistent, dedicated Cloud PCs assigned to individual users. Each user gets a personal Windows desktop in the cloud that retains their settings, apps, and data across sessions. Azure Virtual Desktop pooled host pools are shared and non-persistent by default.'
                },
                {
                    question: 'Which scenario is BEST suited for Azure Virtual Desktop (AVD) rather than Windows 365?',
                    options: [
                        'A single remote worker who needs a persistent personal desktop',
                        'A call center with 200 agents who all use the same standardized application set and do not need personalization',
                        'A small business with 5 employees who each need their own Cloud PC',
                        'An executive who wants a dedicated Windows desktop in the cloud'
                    ],explanation: 'Azure Virtual Desktop excels in multi-session, pooled scenarios where many users share host pool resources and run the same applications. A call center with standardized workloads is ideal for AVD pooled host pools with Windows multi-session. Windows 365 is better for individual, persistent desktops.'
                },
                {
                    question: 'Which of the following is a key advantage of modern management over traditional management for a workforce with many remote employees?',
                    options: [
                        'Devices must be on the corporate network to receive policy updates',
                        'Group Policy Objects provide more granular control than Intune profiles',
                        'Devices can be managed over the internet without VPN or corporate network connectivity',
                        'SCCM provides faster application deployment than Intune'
                    ],explanation: 'A primary advantage of modern management is that cloud-based tools like Intune manage devices over the internet. Remote employees receive policies, configuration profiles, and application deployments without needing VPN connectivity or being on the corporate network. Traditional tools like Group Policy and SCCM require network connectivity to on-premises servers.'
                },
                {
                    question: 'An organization is evaluating endpoint management solutions. They need to manage Windows, macOS, iOS, and Android devices from a single console. Which solution provides this cross-platform management capability?',
                    options: [
                        'Active Directory Group Policy',
                        'System Center Configuration Manager (SCCM) alone',
                        'Microsoft Intune',
                        'Windows Server Update Services (WSUS)'
                    ],explanation: 'Microsoft Intune natively supports cross-platform management of Windows, macOS, iOS, iPadOS, Android, and Linux devices from a single cloud-based console. Group Policy only manages Windows domain-joined devices. SCCM primarily manages Windows. WSUS only handles Windows updates.'
                },
                {
                    question: 'EXAM TIP: Which deployment model allows a user to unbox a new Windows device, connect to the internet, sign in with corporate credentials, and have the device automatically configured with all required policies and applications without IT physically touching the device?',
                    options: [
                        'Windows Deployment Services (WDS)',
                        'Microsoft Deployment Toolkit (MDT)',
                        'Windows Autopilot',
                        'USB-based imaging with DISM'
                    ],explanation: 'Windows Autopilot is a zero-touch deployment service where devices are pre-registered in Azure AD. When a user unboxes the device and connects to the internet, Autopilot automatically enrolls it in Intune, applies configuration profiles, and installs required applications. No IT hands-on or custom imaging is needed.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
