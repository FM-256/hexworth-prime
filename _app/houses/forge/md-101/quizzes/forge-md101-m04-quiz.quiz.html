<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>MD-101 Module 04: Application Management - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        /* ── Page header ── */
        .page-header {
            padding: 14px 28px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(234,88,12,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #ea580c;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        /* ── Quiz wrapper ── */
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .quiz-container { width: 100%; max-width: 820px; }

        /* ── Quiz header card ── */
        .quiz-header {
            background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        /* ── Progress bar ── */
        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        /* ── Question cards ── */
        .question-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(234,88,12,0.15);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        /* ── Options ── */
        .options { display: flex; flex-direction: column; gap: 9px; }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            color: #d1d5db;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; min-width: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            color: #9ca3af;
        }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        /* ── Explanation ── */
        .explanation {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(249,115,22,0.08);
            border-left: 3px solid #ea580c;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
            color: #d1d5db;
            line-height: 1.55;
        }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        /* ── Submit / Results ── */
        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 28px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(234,88,12,0.35);
            color: #fb923c;
        }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        /* ── Results card ── */
        .results-card {
            display: none;
            background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        /* ── Nav buttons ── */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(234,88,12,0.15);
        }
    </style>
</head>

<main class="quiz-wrapper">

        <nav class="nav-buttons">

<script>
/* ── Quiz data ── */
const QUIZ_ID = 'hexworth_md101_m04_quiz';

const questions = [
    {
        id: 1,
        topic: 'Application Lifecycle',
        question: 'In the application lifecycle managed through Intune, what is the correct order of phases?',
        options: [
            'Deploy, Add, Configure, Protect, Retire',
            'Add, Deploy, Configure, Protect, Retire',
            'Configure, Add, Deploy, Retire, Protect',
            'Add, Configure, Deploy, Protect, Retire'
        ],
        correct: 1,
        explanation: 'The Intune application lifecycle follows: Add (upload or link the app to Intune), Deploy (assign to users or devices), Configure (app configuration policies), Protect (app protection policies), and Retire (remove or uninstall when no longer needed). Each phase builds on the previous one.'
    },
    {
        id: 2,
        topic: 'Intune App Types',
        question: 'An administrator needs to deploy a traditional desktop application (setup.exe) to managed Windows devices through Intune. Which app type should be used?',
        options: [
            'Microsoft Store app',
            'Line-of-business (LOB) app',
            'Win32 app',
            'Web link'
        ],
        correct: 2,
        explanation: 'Win32 apps in Intune are used to deploy traditional desktop applications (.exe, .msi) to Windows devices. The application must first be converted to .intunewin format using the IntuneWinAppUtil tool. LOB apps in Intune are typically for .msi, .appx, or .appxbundle files. Win32 provides the most flexibility with detection rules, requirements, and dependencies.'
    },
    {
        id: 3,
        topic: 'Win32 App Preparation',
        question: 'EXAM TIP: Before uploading a Win32 application to Intune, what must be done to the application installation files?',
        options: [
            'Convert them to an .appx package',
            'Digitally sign them with a code signing certificate',
            'Package them into .intunewin format using the Microsoft Win32 Content Prep Tool (IntuneWinAppUtil.exe)',
            'Compress them into a .zip file and upload directly'
        ],
        correct: 2,
        explanation: 'Win32 apps must be converted to .intunewin format using the Microsoft Win32 Content Prep Tool (IntuneWinAppUtil.exe). This tool packages the installation files, compresses them, and encrypts them for upload to Intune. The tool requires the source folder path, setup file name, and output folder as parameters.'
    },
    {
        id: 4,
        topic: 'App Assignment Types',
        question: 'An IT department wants to make a productivity app available in the Company Portal for users to install if they choose, but not force it on everyone. Which assignment type should be used?',
        options: [
            'Required',
            'Available for enrolled devices',
            'Uninstall',
            'Available with or without enrollment'
        ],
        correct: 1,
        explanation: 'The "Available for enrolled devices" assignment type makes the app appear in the Company Portal for users to optionally install. "Required" forces automatic installation on all targeted devices. "Uninstall" removes the app. "Available with or without enrollment" makes apps available through the Company Portal even on unenrolled devices (MAM-only scenario).'
    },
    {
        id: 5,
        topic: 'App Assignment Types',
        question: 'A company mandates that all devices in the Finance department must have a specific encryption tool installed automatically without user intervention. Which Intune app assignment type achieves this?',
        options: [
            'Available for enrolled devices',
            'Required',
            'Available with or without enrollment',
            'Optional'
        ],
        correct: 1,
        explanation: 'The "Required" assignment type automatically installs the application on all targeted devices without user interaction. The app is installed silently in the background based on the assignment schedule. This is appropriate for mandatory business applications that must be present on all devices in a specific group.'
    },
    {
        id: 6,
        topic: 'MAM vs MDM',
        question: 'EXAM TIP: An employee uses their personal smartphone for work email. The organization wants to protect corporate data in Outlook and Teams without managing the entire device. Which approach should be used?',
        options: [
            'Full MDM enrollment of the personal device',
            'Mobile Application Management (MAM) without device enrollment',
            'Conditional access to block personal devices entirely',
            'Deploy a VPN profile to the personal device'
        ],
        correct: 1,
        explanation: 'MAM without enrollment (also called MAM-WE) applies app protection policies to specific applications without requiring full device enrollment. This protects corporate data within managed apps (like Outlook and Teams) while leaving the rest of the personal device untouched. The user retains privacy for personal apps and data.'
    },
    {
        id: 7,
        topic: 'App Protection Policies',
        question: 'An administrator creates an app protection policy that prevents users from copying text from the Outlook app and pasting it into personal apps like WhatsApp. Which app protection policy setting category controls this?',
        options: [
            'Access requirements',
            'Data protection (data transfer)',
            'Conditional launch',
            'Health checks'
        ],
        correct: 1,
        explanation: 'Data protection settings in app protection policies control how data moves in and out of managed apps. Settings include restricting cut/copy/paste between managed and unmanaged apps, preventing Save As to personal storage, blocking screen capture, and controlling data transfer to other apps. This creates a container around corporate data within the app.'
    },
    {
        id: 8,
        topic: 'App Protection Policies',
        question: 'An app protection policy is configured to require a PIN when opening a managed app and to require the device to not be jailbroken. Which two policy setting categories are being used?',
        options: [
            'Data protection and Access requirements',
            'Access requirements and Conditional launch',
            'Data protection and Conditional launch',
            'Access requirements and Health checks'
        ],
        correct: 1,
        explanation: 'The PIN requirement is an Access requirement setting, which controls how users authenticate to access the managed app. The jailbreak/root detection is a Conditional launch setting, which evaluates device conditions and can block access or wipe data if conditions are not met (e.g., jailbroken device, minimum OS version, max threat level).'
    },
    {
        id: 9,
        topic: 'App Configuration Policies',
        question: 'An organization uses a third-party mobile app that requires a server URL and API key to be pre-configured. How can these settings be automatically pushed to the app on managed devices?',
        options: [
            'Email the settings to users and ask them to configure manually',
            'Deploy an app configuration policy in Intune',
            'Include the settings in a compliance policy',
            'Use a device configuration profile'
        ],
        correct: 1,
        explanation: 'App configuration policies in Intune push configuration key-value pairs to applications, pre-populating settings like server URLs, API keys, default configurations, and other app-specific parameters. This eliminates the need for users to manually configure applications and ensures consistent settings across all devices.'
    },
    {
        id: 10,
        topic: 'Microsoft 365 Apps Deployment',
        question: 'An administrator needs to deploy Microsoft 365 Apps (formerly Office 365 ProPlus) to 500 managed Windows devices through Intune. Which app type in Intune is specifically designed for this?',
        options: [
            'Win32 app with Office setup.exe',
            'Microsoft 365 Apps for Windows 10 and later (built-in app type)',
            'LOB app with Office .msi installer',
            'Microsoft Store app'
        ],
        correct: 1,
        explanation: 'Intune has a built-in app type specifically for Microsoft 365 Apps deployment. This provides a guided configuration experience where administrators select which Office apps to include, the update channel, architecture (32/64-bit), and other settings. The apps are downloaded directly from the Office CDN to the device, not packaged through Intune.'
    },
    {
        id: 11,
        topic: 'Microsoft Store Apps',
        question: 'EXAM TIP: Which of the following is a benefit of deploying apps from the Microsoft Store for Business through Intune compared to traditional Win32 deployment?',
        options: [
            'Store apps require IntuneWinAppUtil for packaging',
            'Store apps automatically update through the Microsoft Store without admin intervention',
            'Store apps can only be deployed as Required assignments',
            'Store apps support complex installation scripts'
        ],
        correct: 1,
        explanation: 'Microsoft Store apps automatically update through the Store, reducing administrative overhead for patch management. They also run in a sandboxed environment, install cleanly without legacy installer issues, and can be deployed without packaging. However, they may have limited functionality compared to traditional Win32 desktop applications.'
    },
    {
        id: 12,
        topic: 'Win32 App Detection Rules',
        question: 'After deploying a Win32 app through Intune, the admin needs to verify the app was installed successfully on target devices. Which mechanism does Intune use to confirm installation?',
        options: [
            'The user confirms installation via email',
            'Detection rules (MSI product code, file/folder existence, or registry key)',
            'Compliance policy evaluation',
            'Conditional access check'
        ],
        correct: 1,
        explanation: 'Detection rules tell Intune how to verify that a Win32 app is installed on a device. Three types exist: MSI detection (checks for MSI product code), File detection (checks for a specific file or folder), and Registry detection (checks for a registry key/value). If the detection rule is satisfied, Intune reports the app as installed.'
    },
    {
        id: 13,
        topic: 'Win32 App Requirements',
        question: 'An administrator deploys a Win32 app that should only install on devices running Windows 10 version 21H2 or later with at least 8 GB of RAM. Where are these conditions configured in Intune?',
        options: [
            'Detection rules',
            'Requirement rules',
            'Supersedence settings',
            'Assignment filters'
        ],
        correct: 1,
        explanation: 'Requirement rules define the minimum conditions a device must meet before the Win32 app is installed. These include OS architecture, minimum OS version, disk space, and physical memory. Custom requirement rules can also use scripts. If requirements are not met, the app is not installed and Intune reports it as not applicable.'
    },
    {
        id: 14,
        topic: 'App Supersedence',
        question: 'An organization currently has version 2.0 of a line-of-business app deployed and wants to replace it with version 3.0 on all devices. Which Win32 app feature in Intune handles this transition?',
        options: [
            'App dependencies',
            'App supersedence',
            'App uninstall assignment',
            'App detection rules'
        ],
        correct: 1,
        explanation: 'App supersedence in Intune allows a newer version of an app to replace an older version. When configured, Intune automatically uninstalls the old version and installs the new version. This differs from dependencies, which install prerequisite apps alongside the main app. Supersedence simplifies version management across the device fleet.'
    },
    {
        id: 15,
        topic: 'App Dependencies',
        question: 'A Win32 application requires the .NET Framework 4.8 runtime to be installed before it can function. How should this prerequisite relationship be configured in Intune?',
        options: [
            'Create a compliance policy requiring .NET Framework',
            'Configure .NET Framework 4.8 as an app dependency for the Win32 app',
            'Deploy both apps as Required and hope they install in the correct order',
            'Include .NET Framework in a device configuration profile'
        ],
        correct: 1,
        explanation: 'App dependencies in Intune define prerequisite applications that must be installed before the dependent app. When configured, Intune automatically installs the dependency (.NET Framework 4.8) before installing the main application. This ensures the correct installation order and prevents app failures due to missing prerequisites.'
    }
];

/* ── State ── */
const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

/* ── Render questions ── */
function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;

        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    updateProgress();
    updateSubmitButton();
}

/* ── Select an answer ── */
function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));

    // Update UI for this question
    const letters = ['A', 'B', 'C', 'D'];
    questions[qIdx].options.forEach((_, oi) => {
        const btn = document.getElementById('opt-' + qIdx + '-' + oi);
        btn.className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');

    updateProgress();
    updateSubmitButton();
}

/* ── Update progress bar ── */
function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const total = questions.length;
    const pct = Math.round((answered / total) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + total + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

/* ── Enable submit when all answered ── */
function updateSubmitButton() {
    const answered = Object.keys(state.answers).length;
    document.getElementById('submit-btn').disabled = answered < questions.length;
}

/* ── Submit quiz ── */
function submitQuiz() {
    state.submitted = true;
    let correct = 0;

    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;

        // Color code options
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) {
                btn.classList.add('correct');
            } else if (oi === chosen && !isCorrect) {
                btn.classList.add('incorrect');
            }
        });

        // Show explanation
        document.getElementById('explanation-' + idx).classList.add('visible');
    });

    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;

    // Save score
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));

    // Show results
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';

    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');

    document.getElementById('results-message').textContent = passed
        ? 'Solid work. You have demonstrated understanding of Intune application management including Win32 app deployment, MAM policies, and app protection strategies.'
        : 'Keep pushing. Review the explanations for missed questions, focus on the differences between MAM and MDM, app assignment types, and Win32 app packaging, and retake when ready. 70% is the threshold.';

    // Swap submit for retake
    const actionsDiv = document.querySelector('.quiz-actions');
    actionsDiv.innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';

    // Scroll to results
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Retake ── */
function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Sanitize user-facing text ── */
function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

/* ── Init ── */
renderQuestions();
</script>
