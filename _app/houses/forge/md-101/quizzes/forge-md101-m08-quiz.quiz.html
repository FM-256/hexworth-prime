        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-101 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 08 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 08',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m08',
            moduleId: 'md101-m08',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A company purchases 500 new laptops from an OEM vendor and wants employees to unbox them at home and have them automatically configured with corporate settings, apps, and policies. Which technology enables this zero-touch deployment experience?',
                    options: [
                        'Microsoft Deployment Toolkit (MDT)',
                        'Windows Autopilot with Azure AD and Intune',
                        'Windows Server Update Services (WSUS)',
                        'System Center Configuration Manager PXE boot'
                    ],explanation: 'Windows Autopilot enables a cloud-driven deployment experience where new devices are pre-registered with their hardware IDs. When an employee powers on the device and connects to the internet, Autopilot automatically enrolls it in Azure AD, applies Intune policies, installs required applications, and configures settings - all without IT touching the device. The OEM can register hardware IDs directly, eliminating the need for custom imaging infrastructure entirely.'
                },
                {
                    question: 'Before Windows Autopilot can provision a new device, the device must be registered in the Autopilot service. What piece of hardware information uniquely identifies each device for registration?',
                    options: [
                        'The device\'s MAC address',
                        'The hardware hash (a combination of hardware attributes including the device serial number, disk serial, TPM EK, and other identifiers)',
                        'The Windows product key',
                        'The device\'s IP address at first boot'
                    ],explanation: 'The hardware hash is a unique identifier computed from multiple hardware attributes of the device: motherboard serial number, disk serial number, MAC address, TPM endorsement key, and other hardware identifiers. This hash is registered in the Autopilot service (via CSV upload, OEM registration, or partner registration). When the device connects to the internet during OOBE, it sends its hardware hash to the Autopilot service, which matches it and delivers the assigned deployment profile.'
                },
                {
                    question: 'An IT administrator creates a Windows Autopilot deployment profile and wants to hide the license terms, privacy settings, and local administrator account creation pages during the Out-of-Box Experience. Which profile settings control this?',
                    options: [
                        'These pages cannot be hidden and must always be displayed',
                        'The OOBE customization settings in the Autopilot deployment profile allow hiding specific setup pages including EULA, privacy, and account options',
                        'A custom Unattend.xml must be deployed alongside the Autopilot profile',
                        'These settings are controlled by Windows Update policies'
                    ],explanation: 'Autopilot deployment profiles include OOBE customization options that control the user experience during setup. Administrators can hide: the End User License Agreement (EULA), privacy settings page, change account options, and the local admin account creation. The profile can also set the default language/region, automatically apply a device name template, and control whether the user sees the standard or streamlined Azure AD sign-in experience. This creates a clean, branded setup experience.'
                },
                {
                    question: 'A company is deploying kiosk devices in retail locations that will not be assigned to any specific user. Which Windows Autopilot deployment mode should they use, and what is its key requirement?',
                    options: [
                        'User-driven mode with shared device configuration',
                        'Self-deploying mode, which requires TPM 2.0 for device attestation since no user credentials are provided during setup',
                        'White glove mode with a temporary user account',
                        'Hybrid Azure AD join mode with a service account'
                    ],explanation: 'Self-deploying mode is designed for devices that are not associated with a specific user: kiosks, digital signage, shared workstations. The device automatically joins Azure AD and enrolls in Intune without any user interaction. Because there is no user authentication to validate the device identity, TPM 2.0 is strictly required to perform device attestation - proving the device is genuine and authorized. The TPM provides the cryptographic proof of identity that replaces user credentials in this scenario.'
                },
                {
                    question: 'During a self-deploying mode Autopilot deployment, the device fails with an error indicating TPM attestation failed. What is the most likely cause?',
                    options: [
                        'The device has insufficient RAM',
                        'The device has TPM 1.2 instead of TPM 2.0, or the TPM firmware needs to be updated to support device attestation',
                        'The user entered incorrect credentials',
                        'The device is not connected to a wired Ethernet connection'
                    ],explanation: 'Self-deploying mode has a strict requirement for TPM 2.0 because it relies on TPM attestation to cryptographically prove device identity without user credentials. TPM 1.2 does not support the attestation protocol required. Additionally, some TPM 2.0 chips may have firmware issues that prevent successful attestation. The fix is to verify TPM version in the BIOS (must be 2.0), update TPM firmware if available, and ensure the TPM is enabled and not in a reduced functionality state.'
                },
                {
                    question: 'An organization wants IT staff to pre-provision laptops in a staging area before shipping them to remote employees, so the employee experience is as fast as possible. Which Autopilot feature supports this pre-provisioning workflow?',
                    options: [
                        'Autopilot Reset',
                        'Windows Autopilot for pre-provisioned deployment (formerly White Glove), where a technician completes the device-phase provisioning before the user receives the device',
                        'Dynamic provisioning with a provisioning package',
                        'In-place upgrade using Configuration Manager'
                    ],explanation: 'Pre-provisioned deployment (formerly White Glove) splits the Autopilot process into two phases. In the technician phase, IT staff boots the device, presses Windows key 5 times to enter provisioning mode, and the device joins Azure AD, enrolls in Intune, and installs device-targeted apps and policies. The device is then resealed. When the employee receives it and signs in, only the user-specific phase runs (user-targeted apps and policies), which is significantly faster since the heavy lifting was already done.'
                },
                {
                    question: 'During the technician phase of a pre-provisioned (White Glove) Autopilot deployment, a green screen appears indicating provisioning completed successfully. If the technician sees a red screen instead, what does this indicate?',
                    options: [
                        'The device needs to be restarted to apply updates',
                        'The technician phase failed - the device was unable to complete Azure AD join, Intune enrollment, or required app/policy installation within the allowed timeframe',
                        'The device successfully provisioned but is waiting for user credentials',
                        'The device license has expired and needs renewal'
                    ],explanation: 'The color-coded status screen during White Glove provisioning provides immediate feedback: Green means the technician phase completed successfully and the device can be resealed for the end user. Red indicates failure - common causes include network connectivity issues preventing Azure AD join, Intune enrollment failures, required applications failing to install, or the process exceeding the timeout period. The technician should review the diagnostic logs (press Shift+F10 for command prompt) to identify the specific failure before retrying.'
                },
                {
                    question: 'An organization wants to transform retail Windows 10 Pro devices into Windows 10 Enterprise and join them to Azure AD using a simple USB-based method. Which dynamic provisioning approach accomplishes this?',
                    options: [
                        'Windows Autopilot self-deploying mode',
                        'A provisioning package (.ppkg) created with Windows Configuration Designer that includes edition upgrade and Azure AD bulk enrollment tokens',
                        'Manual upgrade through Windows Settings > Activation',
                        'Group Policy applied at the domain controller'
                    ],explanation: 'Windows Configuration Designer (formerly Windows ICD) creates provisioning packages (.ppkg files) that can be applied via USB during OOBE or after setup. These packages can perform edition upgrades (Pro to Enterprise), configure Azure AD enrollment with bulk enrollment tokens, install certificates, configure Wi-Fi profiles, and apply other settings. This is particularly useful for scenarios where devices are purchased from retail (not through an OEM partner) and cannot be pre-registered for Autopilot.'
                },
                {
                    question: 'A company has Microsoft 365 E3 licenses assigned to users. Their devices currently run Windows 10 Pro. How can they upgrade these devices to Windows 10 Enterprise without reimaging or entering product keys?',
                    options: [
                        'Download and install a separate Windows 10 Enterprise ISO',
                        'Windows 10 Subscription Activation automatically upgrades Pro to Enterprise when a licensed user signs in, with no reboot or key entry required',
                        'Purchase separate Windows 10 Enterprise volume license keys',
                        'Run the DISM /Set-Edition command on each device'
                    ],explanation: 'Subscription Activation is a seamless, license-based upgrade path. When a user with a Microsoft 365 E3/E5 or Windows 10/11 Enterprise E3/E5 license signs into a Windows 10 Pro device joined to Azure AD, the device automatically steps up to Windows 10 Enterprise. No product keys, no reimaging, no reboot required. If the license is removed or the user signs into a different device, the original device gracefully falls back to Windows 10 Pro after the grace period. This makes Enterprise edition management purely license-driven.'
                },
                {
                    question: 'An employee with a Windows 10 Enterprise Subscription Activation leaves the company and their Microsoft 365 E5 license is revoked. What happens to the Windows 10 Enterprise installation on their former device?',
                    options: [
                        'The device is immediately wiped and reset to factory settings',
                        'The device remains on Enterprise permanently',
                        'After a grace period (up to 90 days), the device automatically steps down from Enterprise to Windows 10 Pro without data loss',
                        'The device becomes unusable and displays an activation error'
                    ],explanation: 'Subscription Activation provides a graceful fallback mechanism. When the Enterprise license is removed (user leaves, license reassigned), the device enters a grace period of up to 90 days. After this period, the device automatically reverts to Windows 10 Pro. No data is lost, no applications are removed - only Enterprise-exclusive features become unavailable. This makes it safe for organizations to manage Enterprise licensing dynamically without worrying about breaking devices when licenses are reassigned.'
                },
                {
                    question: 'An administrator needs to configure Autopilot so that new devices are automatically named with a prefix "CORP-" followed by the device serial number. Where is this naming template configured?',
                    options: [
                        'In the Azure AD device settings page',
                        'In the Autopilot deployment profile under the device name template setting, using variables like %SERIAL%',
                        'In the Intune device compliance policy',
                        'In the Windows Configuration Designer provisioning package'
                    ],explanation: 'Autopilot deployment profiles include a device name template option that supports variables. The %SERIAL% variable inserts the device serial number, and %RAND:x% generates random digits. For example, "CORP-%SERIAL%" would create names like "CORP-5CG1234ABC". The computer name is limited to 15 characters (NetBIOS limit), so the prefix and variable combination must not exceed this. The device is named automatically during the Autopilot process, enforcing consistent naming conventions without manual intervention.'
                },
                {
                    question: 'A company wants to repurpose existing Windows 10 devices and redeploy them to new employees using Autopilot. The devices need to be wiped and reconfigured. Which Autopilot feature handles device redeployment?',
                    options: [
                        'Autopilot self-deploying mode only works on new devices',
                        'Autopilot Reset, which can be triggered locally or remotely from Intune to wipe the device and reapply the Autopilot profile',
                        'The device must be manually reimaged with a USB boot drive',
                        'Unregister the device from Autopilot and register it again'
                    ],explanation: 'Autopilot Reset restores a device to a business-ready state without requiring reimaging. It removes user files, apps, and settings while preserving the Azure AD join, Intune enrollment, and network connectivity. A remote Autopilot Reset can be triggered from the Intune portal, allowing IT to reprovision devices without physical access. A local reset can be triggered at the login screen. This is ideal for device reassignment scenarios, shared device turnover, and break-fix situations.'
                },
                {
                    question: 'An organization uses Azure AD bulk enrollment tokens in a provisioning package for enrolling devices into Intune. What is a key limitation of bulk enrollment compared to standard Autopilot enrollment?',
                    options: [
                        'Bulk enrollment does not support Wi-Fi configuration',
                        'Devices enrolled via bulk enrollment tokens are initially enrolled as shared devices without user affinity, meaning they are not associated with a specific primary user until a user signs in',
                        'Bulk enrollment requires each device to have TPM 2.0',
                        'Bulk enrollment is limited to 10 devices per token'
                    ],explanation: 'Bulk enrollment using provisioning packages enrolls devices into Intune without associating them to a specific user during the enrollment process. The device appears in Intune without a primary user (no user affinity). User-targeted policies and apps will not apply until a user signs in and primary user affinity is established. In contrast, Autopilot user-driven mode establishes user affinity during the OOBE process when the user authenticates, immediately enabling user-targeted configurations.'
                },
                {
                    question: 'An organization has both on-premises Active Directory and Azure AD. They want Autopilot-deployed devices to appear in both directories. Which Autopilot join type supports this, and what additional infrastructure is required?',
                    options: [
                        'Azure AD join - no additional infrastructure needed',
                        'Hybrid Azure AD join, which requires an on-premises domain controller accessible during deployment and the Intune Connector for Active Directory installed on a domain-joined server',
                        'On-premises AD join only, configured through Group Policy',
                        'Workplace join with automatic AD replication'
                    ],explanation: 'Hybrid Azure AD join in Autopilot creates the device object in both on-premises Active Directory and Azure AD. This requires the Intune Connector for Active Directory, which is a service installed on an on-premises domain-joined server that creates computer objects in AD on behalf of Autopilot. The device must have line-of-sight to a domain controller during deployment (via VPN or being on the corporate network). This is common in organizations transitioning from on-premises AD to cloud management that still need on-premises AD for legacy applications and Group Policy.'
                },
                {
                    question: 'During an Autopilot deployment, the Enrollment Status Page (ESP) shows the device installation progress. An administrator configures the ESP to block device use until all required apps are installed. A critical LOB app fails to install. What happens?',
                    options: [
                        'The ESP is bypassed and the user can access the desktop normally',
                        'The device is stuck on the ESP with an error, and the administrator can configure whether the user can retry, reset the device, or continue with limited functionality',
                        'The device automatically rolls back to the previous Windows version',
                        'Intune automatically retries the installation indefinitely'
                    ],explanation: 'The Enrollment Status Page (ESP) is a gating mechanism that controls when users can access the desktop. When configured to block usage until required apps are installed, a failed app installation will halt the process and display an error. Administrators can configure ESP behavior on failure: allow the user to retry the installation, allow them to reset the device (triggering Autopilot again), or allow them to continue to the desktop despite the failure. This ensures critical applications are present before the user starts working, while providing recovery options when installations fail.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
