<html lang="en">

    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;

        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;

            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {

        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-101 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 09 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 09',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m09',
            moduleId: 'md101-m09',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'Microsoft releases two types of updates for Windows 10: feature updates and quality updates. A feature update is released that moves a device from version 21H1 to 21H2. How does a feature update differ from a quality update?',
                    options: [
                        'Feature updates only contain security patches; quality updates add new functionality',
                        'Feature updates add new features and capabilities with a full OS upgrade (requiring longer install time), while quality updates are cumulative monthly patches containing security fixes and bug fixes',
                        'Feature updates are optional; quality updates are mandatory and cannot be deferred',
                        'There is no difference; Microsoft uses the terms interchangeably'
                    ],explanation: 'Feature updates (released annually) are essentially OS upgrades that add new capabilities, change the UI, and update the Windows build number. They require significant download size and install time. Quality updates (released monthly on Patch Tuesday) are cumulative patches containing security fixes, reliability improvements, and bug fixes. They are smaller and faster to install. Understanding this distinction is critical for planning update strategies - feature updates need more testing and deferral time than quality updates.'
                },
                {
                    question: 'An organization wants to delay receiving Windows 10 feature updates for 180 days after release to allow time for compatibility testing, while still receiving monthly security updates promptly. Which servicing approach supports this?',
                    options: [
                        'Long-Term Servicing Channel (LTSC)',
                        'Windows Update for Business (WUfB) with deferral policies that independently control feature update and quality update deferral periods',
                        'Disconnecting from the internet and manually installing updates',
                        'Using only Windows Server Update Services without any deferral configuration'
                    ],explanation: 'Windows Update for Business allows granular deferral policies where feature updates and quality updates are controlled independently. Feature updates can be deferred up to 365 days, and quality updates up to 30 days. This enables the scenario where security patches (quality updates) are applied quickly (0-7 day deferral) while feature updates are held back (90-180 days) for thorough compatibility testing. Deferral policies are configured via Group Policy, Intune, or MDM.'
                },
                {
                    question: 'A hospital deploys specialized medical imaging workstations running Windows 10 that must remain extremely stable and cannot receive feature updates. The software vendor certifies only specific Windows builds. Which Windows 10 servicing channel is appropriate?',
                    options: [
                        'General Availability Channel with 365-day deferral',
                        'Long-Term Servicing Channel (LTSC), which only receives security and reliability updates without feature updates for up to 10 years',
                        'Windows Insider Program - Release Preview ring',
                        'Semi-Annual Channel with manual update approval'
                    ],explanation: 'The Long-Term Servicing Channel (LTSC) is designed for specialized, mission-critical devices that require maximum stability: medical equipment, ATMs, industrial control systems, and point-of-sale terminals. LTSC receives only quality updates (security and reliability) - no feature updates, no new features, no UI changes. Each LTSC release is supported for 10 years (5 years mainstream + 5 years extended). LTSC does not include Microsoft Edge, Microsoft Store, or Cortana. It is NOT recommended for general-purpose desktops.'
                },
                {
                    question: 'An IT administrator configures Windows Update for Business deferral policies through Intune. They set a feature update deferral of 90 days and a quality update deferral of 7 days. A new feature update is released on March 1st. When will the device receive it?',
                    options: [
                        'Immediately on March 1st',
                        'Approximately May 30th (90 days after the release date), assuming the device checks for updates and has connectivity',
                        'The device will never receive it because deferrals block updates permanently',
                        'On the next Patch Tuesday after March 1st'
                    ],explanation: 'WUfB deferral periods count from the release date of the update, not from when the policy is applied. With a 90-day feature update deferral, the update becomes available to the device approximately 90 days after Microsoft publishes it. The device will then download and install it during its next update cycle. This gives the organization a 90-day window to test compatibility. Quality updates with a 7-day deferral would arrive approximately 7 days after each Patch Tuesday release.'
                },
                {
                    question: 'An organization implements a phased deployment strategy using update rings. They create three rings: Pilot (IT staff, 0-day deferral), Early Adopters (volunteer users, 14-day deferral), and Broad (all remaining devices, 30-day deferral). What is the primary purpose of this ring-based approach?',
                    options: [
                        'To ensure all devices receive updates simultaneously for consistency',
                        'To validate updates progressively - issues are caught in smaller groups before the update reaches the majority of the organization, reducing risk',
                        'To save internet bandwidth by staggering downloads',
                        'To comply with Microsoft licensing requirements for update distribution'
                    ],explanation: 'Update rings create a phased validation pipeline. The Pilot ring (IT staff) receives updates first and tests them in a real environment. If issues emerge, deployment is paused before reaching the broader organization. The Early Adopters ring provides a second validation layer with a wider variety of hardware and applications. Only after both rings confirm stability does the Broad ring receive the update. This progressive rollout minimizes the blast radius of problematic updates while maintaining a reasonable patching cadence.'
                },
                {
                    question: 'An administrator wants to pause all Windows updates for a group of devices because a recently released quality update is causing blue screens on specific hardware models. Using WUfB, how long can updates be paused?',
                    options: [
                        'Updates can be paused indefinitely',
                        'Quality updates can be paused for up to 35 days, after which the device must update before it can be paused again',
                        'Updates cannot be paused; only deferred',
                        'Updates can be paused for up to 365 days'
                    ],explanation: 'Windows Update for Business includes a pause feature that temporarily stops updates from being offered to devices. Quality updates can be paused for up to 35 days, and feature updates can be paused for up to 35 days. After the pause period expires, the device must install all available updates before it can be paused again. This prevents devices from becoming perpetually unpatched. The pause is an emergency measure for known-bad updates, not a long-term deferral strategy.'
                },
                {
                    question: 'An organization uses Windows Server Update Services (WSUS) to manage updates in their on-premises environment. What is the primary advantage of WSUS over allowing devices to download updates directly from Microsoft?',
                    options: [
                        'WSUS provides faster download speeds than Microsoft\'s CDN',
                        'WSUS gives administrators granular control to approve, decline, or target specific updates to specific computer groups, and reduces internet bandwidth by downloading updates once and distributing them locally',
                        'WSUS automatically tests updates for compatibility before approval',
                        'WSUS is the only way to receive security updates for Windows 10'
                    ],explanation: 'WSUS provides centralized update management: administrators approve or decline individual updates, target updates to specific computer groups (servers, workstations, test machines), and generate compliance reports. Updates are downloaded once from Microsoft to the WSUS server and then distributed to clients over the local network, significantly reducing internet bandwidth consumption. However, WSUS does NOT automatically test updates for compatibility - that remains the administrator\'s responsibility through test groups and phased deployment.'
                },
                {
                    question: 'A WSUS administrator notices that client computers are not reporting their update status to the WSUS server. The WSUS console shows many computers with a "Not yet reported" status. What is the most common cause?',
                    options: [
                        'The WSUS server needs more RAM',
                        'The client-side Group Policy settings pointing computers to the WSUS server (Specify intranet Microsoft update service location) are misconfigured or not applied',
                        'Windows Defender Firewall is blocking all outbound traffic',
                        'The WSUS database has been corrupted and needs repair'
                    ],explanation: 'The most common reason for clients not reporting to WSUS is incorrect or missing Group Policy configuration. The key policy "Specify intranet Microsoft update service location" must be configured with the correct WSUS server URL (http://servername:8530 for HTTP or https://servername:8531 for HTTPS). Additionally, the "Configure Automatic Updates" policy must be enabled. Run gpresult /r on a client to verify the policies are applying, and wuauclt /detectnow /reportnow to force immediate detection and reporting.'
                },
                {
                    question: 'An organization with multiple branch offices connected by slow WAN links wants to minimize update download bandwidth across those links. Which Windows 10 feature enables devices to share already-downloaded update content with other devices on the same local network?',
                    options: [
                        'BranchCache',
                        'Delivery Optimization with peer-to-peer mode configured for LAN-only sharing (Download Mode 1)',
                        'Background Intelligent Transfer Service (BITS) throttling',
                        'Windows Update proxy settings'
                    ],explanation: 'Delivery Optimization (DO) enables peer-to-peer content sharing for Windows updates, Store apps, and MSIX packages. Download Mode 1 (LAN) allows devices on the same local subnet to share downloaded update bytes with each other, so only one device needs to download from the internet or WSUS. Download Mode 2 (Group) extends this to defined groups across subnets. Download Mode 3 (Internet) enables sharing with any device on the internet. For branch offices with slow WAN links, Mode 1 or 2 dramatically reduces WAN traffic since updates are shared locally.'
                },
                {
                    question: 'An organization uses Intune to manage WUfB policies. The administrator configures a feature update deferral of 60 days but also sets a feature update target version of "21H2." A new version 22H2 is released. What happens on managed devices?',
                    options: [
                        'Devices update to 22H2 after 60 days',
                        'Devices remain on or update to version 21H2 only - the target version setting pins devices to the specified version regardless of the deferral period',
                        'The deferral and target version conflict, so no updates are applied',
                        'Devices update to both 21H2 and 22H2 simultaneously'
                    ],explanation: 'When a target version is specified in WUfB policy, it overrides the normal feature update behavior. The device will only accept feature updates up to and including the specified version. Even when newer versions like 22H2 become available, devices will stay on 21H2 until the administrator changes the target version. This is useful for organizations that want to standardize on a specific Windows 10 version across their fleet while still receiving quality updates. The deferral period applies only when moving to the target version, not beyond it.'
                },
                {
                    question: 'Management wants a dashboard showing the update compliance status across all Windows 10 devices in the organization - how many devices are up-to-date, how many are missing updates, and which updates are failing. Which Microsoft solution provides this cloud-based reporting?',
                    options: [
                        'Windows Event Viewer on each device',
                        'Update Compliance (part of Windows Analytics / Microsoft Endpoint Manager), which uses diagnostic data to provide cloud-based update compliance reporting',
                        'WSUS reporting only (requires on-premises infrastructure)',
                        'Azure Active Directory device health reports'
                    ],explanation: 'Update Compliance is a cloud-based solution that uses Windows diagnostic data (telemetry) to provide comprehensive update compliance reporting. It shows: which devices are up-to-date vs. behind on updates, which updates are failing and why, Delivery Optimization bandwidth savings, and Windows Defender antivirus status. It works with WUfB, WSUS, and even unmanaged devices. The data appears in an Azure Log Analytics workspace and can be visualized through pre-built dashboards or custom KQL queries.'
                },
                {
                    question: 'Microsoft announces that a Windows 10 version has reached end of servicing. The organization still has 200 devices running this version. What are the consequences of remaining on an end-of-serviced version?',
                    options: [
                        'The devices will stop functioning and display an upgrade notice',
                        'The devices will continue to work but will no longer receive monthly security updates, leaving them vulnerable to newly discovered exploits',
                        'Microsoft will automatically upgrade the devices to the latest version',
                        'The devices will lose their Windows activation and require a new license'
                    ],explanation: 'When a Windows 10 version reaches end of servicing, Microsoft stops providing monthly quality updates (security patches, bug fixes) for that version. The OS continues to function normally, but newly discovered vulnerabilities will not be patched, creating an expanding security risk over time. The organization must upgrade to a currently serviced version to resume receiving security updates. Microsoft provides at least 18 months of servicing for each feature update (30 months for Enterprise LTSC releases).'
                },
                {
                    question: 'An organization wants to prevent Windows 10 devices from automatically restarting during business hours (8 AM to 6 PM) after installing updates. Which WUfB policy setting controls this behavior?',
                    options: [
                        'Disable automatic updates entirely',
                        'Configure Active Hours (set to 8 AM - 6 PM) so that Windows will not automatically restart the device during this protected window',
                        'Set updates to download-only mode with no installation',
                        'Configure Maintenance Window in Group Policy to exclude business hours'
                    ],explanation: 'Active Hours defines a time range (up to 18 hours) during which the device will not automatically restart to complete update installation. Setting Active Hours to 8 AM - 6 PM ensures updates can install and restart outside those hours. If Active Hours is not set, Windows uses Intelligent Active Hours, which learns the user\'s usage patterns and automatically adjusts. Administrators can configure Active Hours via Group Policy, Intune, or MDM. This balances security patching with user productivity by allowing updates to complete during off-hours.'
                },
                {
                    question: 'An IT team uses Desktop Analytics to monitor the health of a Windows 10 feature update rollout. After deploying the update to the pilot ring, Desktop Analytics reports that a specific application is crashing frequently on updated devices. What action does Desktop Analytics recommend?',
                    options: [
                        'Ignore the issue and continue the broad deployment',
                        'Desktop Analytics flags the application as having a regression, provides crash diagnostic data, and recommends pausing the rollout until the issue is resolved or the app is updated',
                        'Automatically uninstall the problematic application from all devices',
                        'Revert all pilot devices to the previous Windows version'
                    ],explanation: 'Desktop Analytics continuously monitors deployed updates for health regressions - increases in application crashes, driver failures, or system instability compared to pre-update baselines. When a regression is detected, it flags the specific application and provides diagnostic data (crash codes, affected device count, impacted user percentage). The recommended action is to pause the broader rollout, investigate the root cause (application bug, compatibility issue, driver conflict), resolve it (app update, driver update, compatibility fix), and then resume deployment.'
                },
                {
                    question: 'An administrator creates an update ring in Intune with the following settings: Feature update deferral = 90 days, Quality update deferral = 7 days, Uninstall window = 10 days. A quality update installed 8 days ago is causing issues on several devices. Can the administrator uninstall this update using the uninstall window?',
                    options: [
                        'Yes - 8 days is within the 10-day uninstall window, so the quality update can be rolled back through Intune',
                        'No - the uninstall window only applies to feature updates, not quality updates',
                        'No - updates cannot be uninstalled once installed',
                        'Yes, but only if the device is physically accessible to the IT team'
                    ],explanation: 'The uninstall window in WUfB update rings applies to both feature updates and quality updates. With a 10-day uninstall window configured, any update installed within the last 10 days can be rolled back. Since the quality update was installed 8 days ago (within the 10-day window), the administrator can trigger an uninstall through Intune. After the uninstall window expires, the update can no longer be automatically removed through this mechanism. This provides a critical safety net for problematic updates that make it past the deferral period.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
