<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-101 Module 03 Quiz - Forge House</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(251, 146, 60, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #fb923c;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #fdba74; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MD-101 Course</a>
        <span class="brand"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'MD-101 Module 03 Quiz',
            description: 'Microsoft 365 Certified: Endpoint Administrator - Module 03',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-md101-m03',
            moduleId: 'md101-m03',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'An administrator wants to restrict Windows devices from accessing the camera and Bluetooth. Which Intune feature should be used?',
                    options: [
                        'Compliance policy',
                        'Device configuration profile with device restrictions template',
                        'App protection policy',
                        'Conditional access policy'
                    ],explanation: 'Device configuration profiles with the device restrictions template allow administrators to control hardware features like camera, Bluetooth, screen capture, and more. Compliance policies check whether a device meets requirements but do not enforce restrictions. App protection policies protect app data, and conditional access controls resource access based on conditions.'
                },
                {
                    question: 'EXAM TIP: An organization needs to deploy Wi-Fi settings to all managed Windows laptops so they automatically connect to the corporate wireless network. Which configuration profile type should be created in Intune?',
                    options: [
                        'Device restrictions profile',
                        'Wi-Fi profile',
                        'VPN profile',
                        'Email profile'
                    ],explanation: 'A Wi-Fi configuration profile deploys wireless network settings including SSID, security type, authentication method, and certificates to managed devices. Once deployed, devices automatically connect to the configured network without users needing to manually enter credentials or network details.'
                },
                {
                    question: 'A company wants remote workers to automatically establish a secure tunnel to the corporate network whenever they access internal resources. Which Intune profile type enables this?',
                    options: [
                        'Wi-Fi profile',
                        'VPN profile with per-app VPN or always-on configuration',
                        'Email profile',
                        'Trusted certificate profile'
                    ],explanation: 'VPN profiles in Intune can be configured with per-app VPN (only specific apps trigger the VPN) or always-on VPN (connection is maintained automatically). This ensures remote workers have secure tunneled access to internal resources without manually initiating the VPN connection each time.'
                },
                {
                    question: 'Before deploying Wi-Fi and VPN profiles that use certificate-based authentication, which certificate profile must be deployed to devices FIRST?',
                    options: [
                        'SCEP certificate profile',
                        'PKCS certificate profile',
                        'Trusted certificate profile (root CA)',
                        'Client authentication certificate'
                    ],explanation: 'The trusted certificate profile deploys the root CA certificate to devices first, establishing the chain of trust. Without the root CA installed, devices cannot validate certificates issued by SCEP or PKCS profiles. The deployment order must be: trusted root CA certificate first, then SCEP or PKCS enrollment profiles.'
                },
                {
                    question: 'EXAM TIP: What is the key difference between SCEP and PKCS certificate deployment in Intune?',
                    options: [
                        'SCEP certificates are manually installed; PKCS certificates are automatic',
                        'SCEP generates the private key on the device and uses a challenge for enrollment; PKCS generates the key pair on the server and delivers both to the device',
                        'SCEP only works with Windows; PKCS works with all platforms',
                        'SCEP requires Azure AD Premium; PKCS does not'
                    ],explanation: 'With SCEP (Simple Certificate Enrollment Protocol), the device generates its own private key and sends a certificate signing request with a challenge to the CA. With PKCS (Public Key Cryptography Standards), the server generates the key pair and delivers the certificate with private key to the device. SCEP is considered more secure because the private key never leaves the device.'
                },
                {
                    question: 'An Intune administrator wants to configure settings equivalent to Group Policy settings for managed devices, such as disabling the Windows Store or configuring Internet Explorer settings. Which Intune feature provides this?',
                    options: [
                        'Custom OMA-URI profiles',
                        'Administrative Templates (ADMX-backed policies)',
                        'Endpoint security profiles',
                        'PowerShell scripts'
                    ],explanation: 'Administrative Templates in Intune provide ADMX-backed policy settings that are equivalent to Group Policy. They expose thousands of settings for Windows components, Office, Edge, and other Microsoft products in a familiar format. This is the recommended approach for migrating GPO settings to Intune.'
                },
                {
                    question: 'An administrator needs to configure a Windows device setting that is not available in any built-in Intune configuration profile template. Which approach should be used?',
                    options: [
                        'Create a compliance policy for the setting',
                        'Create a custom profile using OMA-URI settings',
                        'Wait for Microsoft to add the setting to a built-in template',
                        'Use Azure AD device settings'
                    ],explanation: 'Custom profiles using OMA-URI (Open Mobile Alliance Uniform Resource Identifier) allow administrators to configure any device setting that has a corresponding CSP (Configuration Service Provider) path, even if it is not exposed in a built-in template. This provides access to the full range of Windows MDM settings.'
                },
                {
                    question: 'A retail company needs to configure Windows tablets as point-of-sale terminals that run only a single application in full-screen mode. Which Intune profile type should be used?',
                    options: [
                        'Device restrictions profile',
                        'Kiosk profile (single-app kiosk)',
                        'App configuration profile',
                        'Edition upgrade profile'
                    ],explanation: 'Kiosk profiles in Intune can configure single-app kiosk mode, which locks the device to run only one specified application in full-screen. This is ideal for point-of-sale terminals, digital signage, or any scenario where the device should only run one application. Multi-app kiosk mode is also available for more complex scenarios.'
                },
                {
                    question: 'An organization purchased Windows 10 Pro devices but now needs to upgrade them to Windows 10 Enterprise for advanced security features. How can this be accomplished through Intune without reimaging?',
                    options: [
                        'Deploy a Windows 10 Enterprise image via Autopilot',
                        'Create an edition upgrade configuration profile with the Enterprise product key or license file',
                        'Manually enter the new product key on each device',
                        'Reinstall Windows from USB media'
                    ],explanation: 'The edition upgrade profile in Intune allows seamless upgrades between Windows editions (e.g., Pro to Enterprise) by deploying a new product key or license file. The upgrade happens in place without reinstalling Windows, preserving all user data, applications, and settings.'
                },
                {
                    question: 'A user logs into multiple shared Windows computers in an office and expects their desktop wallpaper, browser favorites, and application settings to follow them to each machine. Which user profile type supports this in an on-premises AD environment?',
                    options: [
                        'Local user profile',
                        'Roaming user profile',
                        'Mandatory user profile',
                        'Temporary user profile'
                    ],explanation: 'Roaming user profiles store user settings on a network share and synchronize them to any domain-joined computer the user logs into. Changes made on one machine are saved back to the server and available on the next machine. Local profiles stay on one machine, mandatory profiles are read-only, and temporary profiles are discarded at logoff.'
                },
                {
                    question: 'EXAM TIP: A training lab has 30 computers that should always present the same desktop environment regardless of which student logs in. Any changes students make should be discarded at logoff. Which profile type achieves this?',
                    options: [
                        'Local user profile',
                        'Roaming user profile',
                        'Mandatory user profile',
                        'Enterprise State Roaming profile'
                    ],explanation: 'Mandatory user profiles are read-only roaming profiles. They load the same preconfigured profile for every user (or designated users), and any changes are discarded when the user logs off. This is achieved by renaming NTUSER.DAT to NTUSER.MAN. This ensures a consistent, standardized desktop environment.'
                },
                {
                    question: 'An organization uses both Office 2019 and several line-of-business applications. They want application settings (but not the entire user profile) to roam between Windows devices on their on-premises network. Which Microsoft technology is designed for this?',
                    options: [
                        'Roaming user profiles',
                        'User Experience Virtualization (UE-V)',
                        'Folder Redirection',
                        'OneDrive sync'
                    ],explanation: 'User Experience Virtualization (UE-V) captures and roams application-specific settings between devices without synchronizing the entire user profile. UE-V uses settings location templates to define which application settings to capture. This is more granular than roaming profiles and avoids issues with profile bloat.'
                },
                {
                    question: 'A company that uses Azure AD wants user settings and application data to roam across Windows devices without on-premises infrastructure. Which cloud-based solution provides this?',
                    options: [
                        'UE-V (User Experience Virtualization)',
                        'Enterprise State Roaming (ESR)',
                        'Roaming user profiles via DFS',
                        'OneDrive Known Folder Move'
                    ],explanation: 'Enterprise State Roaming (ESR) is a cloud-based settings synchronization feature in Azure AD. It syncs Windows settings, application settings, and credentials across Azure AD joined or registered devices without requiring any on-premises infrastructure. ESR requires Azure AD Premium licensing.'
                },
                {
                    question: 'An administrator needs to run a custom PowerShell script on all managed Windows devices to configure a setting that cannot be addressed through configuration profiles. How should this be deployed?',
                    options: [
                        'Email the script to all users and ask them to run it',
                        'Upload the script to Intune under Devices > Scripts and assign it to a device group',
                        'Deploy the script as a Win32 app package',
                        'Configure the script in a compliance policy'
                    ],explanation: 'Intune allows administrators to upload PowerShell scripts and assign them to device or user groups. Scripts are downloaded and executed by the Intune Management Extension on Windows devices. This is the proper mechanism for running custom scripts, with options for execution context (user or system), script signing requirements, and execution frequency.'
                },
                {
                    question: 'Two Intune configuration profiles are assigned to the same device and both configure the camera setting, but one enables it and the other disables it. What happens?',
                    options: [
                        'The most recently created profile wins',
                        'The profile assigned to the user group takes priority over the device group',
                        'Intune reports a conflict and the setting reverts to the device default (not configured)',
                        'The most restrictive setting is always applied'
                    ],explanation: 'When two configuration profiles contain conflicting settings for the same device, Intune reports an error or conflict status. The conflicting setting is not applied and typically reverts to the device default or not-configured state. Administrators should review profile assignments to resolve conflicts. Unlike Group Policy, Intune does not automatically apply the most restrictive setting.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
