<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Troubleshooting Lab | CompTIA A+ Lab</title>
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #e0e0e0;
            padding: 20px;
        }

        .lab-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .lab-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .lab-header h1 {
            font-size: 2rem;
            color: #3498db;
            margin-bottom: 10px;
        }

        .lab-header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Progress Bar */
        .progress-container {
            background: #2a2a4a;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-title {
            color: #3498db;
            font-weight: 600;
        }

        .progress-score {
            color: #4ade80;
        }

        .progress-bar {
            background: #1a1a2e;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        /* Main Content */
        .display-area {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .display-area {
                grid-template-columns: 1fr;
            }
        }

        /* Monitor Display */
        .monitor-panel {
            background: #2a2a4a;
            border-radius: 15px;
            padding: 25px;
        }

        .monitor-frame {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .monitor-bezel {
            background: #333;
            border-radius: 8px;
            padding: 10px;
            border: 3px solid #222;
        }

        .monitor-screen {
            background: #000;
            width: 100%;
            height: 280px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monitor-stand {
            width: 60px;
            height: 20px;
            background: #333;
            margin: 10px auto 0;
            border-radius: 0 0 5px 5px;
        }

        .monitor-base {
            width: 100px;
            height: 10px;
            background: #333;
            margin: 0 auto;
            border-radius: 5px;
        }

        /* Screen Content for Different Symptoms */
        .screen-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Normal screen */
        .screen-normal {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-normal::after {
            content: 'Desktop';
            color: #fff;
            font-size: 1.2rem;
            padding-left: 1.4em;
            background: url(/assets/images/icons/icon-desktop.webp) left center/1.1em 1.1em no-repeat;
        }

        /* No display */
        .screen-no-display {
            background: #000;
        }

        /* Dim display */
        .screen-dim {
            background: linear-gradient(135deg, #1a2a3a 0%, #0f1a24 50%, #0a1015 100%);
            opacity: 0.3;
        }

        .screen-dim::after {
            content: 'Desktop';
            color: #333;
            font-size: 1.2rem;
            padding-left: 1.4em;
            background: url(/assets/images/icons/icon-desktop.webp) left center/1.1em 1.1em no-repeat;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Dead pixels */
        .screen-dead-pixels {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
        }

        .dead-pixel {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
        }

        /* Stuck pixels (colored) */
        .stuck-pixel {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        /* Flickering */
        .screen-flicker {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
            animation: flicker 0.5s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Burn-in */
        .screen-burn-in {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
        }

        .burn-in-ghost {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.15);
            font-family: monospace;
        }

        /* Lines/artifacts */
        .screen-lines {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
        }

        .vertical-line {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: #ff0000;
        }

        .horizontal-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #ff0000;
        }

        /* Color distortion */
        .screen-color-distort {
            background: linear-gradient(135deg, #90d94a 0%, #7abd35 50%, #6aa32d 100%);
        }

        /* Overscan */
        .screen-overscan {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 50%, #2d6aa3 100%);
            transform: scale(1.15);
        }

        /* No signal */
        .screen-no-signal {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .no-signal-text {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .no-signal-search {
            font-size: 0.8rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Diagnosis Panel */
        .diagnosis-panel {
            background: #2a2a4a;
            border-radius: 15px;
            padding: 25px;
        }

        .diagnosis-panel h3 {
            color: #3498db;
            margin-bottom: 20px;
            text-align: center;
        }

        .symptom-card {
            background: #1a1a2e;
            border: 2px solid #3a3a6a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .symptom-card h4 {
            color: #e74c3c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .symptom-card p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Answer Options */
        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .answer-btn {
            background: #2a2a4a;
            border: 2px solid #3a3a6a;
            border-radius: 10px;
            padding: 15px;
            color: #e0e0e0;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .answer-btn:hover:not(:disabled) {
            background: #3a3a6a;
            border-color: #3498db;
        }

        .answer-btn.correct {
            background: #4ade80;
            border-color: #4ade80;
            color: #1a1a2e;
        }

        .answer-btn.incorrect {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Feedback */
        .feedback-box {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            border: 2px solid #4ade80;
        }

        .feedback-box.incorrect {
            border: 2px solid #e74c3c;
        }

        .feedback-box h4 {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-box.correct h4 {
            color: #4ade80;
        }

        .feedback-box.incorrect h4 {
            color: #e74c3c;
        }

        .feedback-box p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Exam Tip */
        .exam-tip {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            color: #fff;
            display: none;
        }

        .exam-tip.show {
            display: block;
        }

        .exam-tip h4 {
            margin-bottom: 8px;
        }

        .exam-tip p {
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Next Button */
        .next-btn {
            display: none;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        /* Results */
        .results-section {
            background: #2a2a4a;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-top: 25px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .result-title.success {
            color: #4ade80;
        }

        .result-message {
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .result-btn:hover {
            transform: scale(1.05);
        }

        .result-btn.primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #fff;
            font-weight: 600;
        }

        .result-btn.secondary {
            background: #3a3a6a;
            color: #e0e0e0;
        }

    </style>
</head>
<body>
    <div class="lab-container">
        <a href="../chapters/ch09-laptops/index.html" class="back-link">&larr; Back to Chapter 9: Laptops</a>

        <div class="lab-header">
            <h1>Display Troubleshooting Lab</h1>
            <p>Identify display symptoms and determine the correct fix</p>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Scenarios Completed</span>
                <span class="progress-score"><span id="correct-count">0</span> / <span id="total-count">8</span></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Main Display Area -->
        <div class="display-area" id="display-area">
            <!-- Monitor Panel -->
            <div class="monitor-panel">
                <div class="monitor-frame">
                    <div class="monitor-bezel">
                        <div class="monitor-screen" id="monitor-screen">
                            <div class="screen-content screen-normal" id="screen-content"></div>
                        </div>
                    </div>
                    <div class="monitor-stand"></div>
                    <div class="monitor-base"></div>
                </div>
            </div>

            <!-- Diagnosis Panel -->
            <div class="diagnosis-panel">
                <h2>Diagnose the Issue</h2>

                <div class="symptom-card">
                    <h3><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> <span id="symptom-title">Symptom</span></h3>
                    <p id="symptom-description">Loading scenario...</p>
                </div>

                <div class="answer-options" id="answer-options">
                    <!-- Options populated dynamically -->
                </div>

                <div class="feedback-box" id="feedback-box">
                    <h4><span id="feedback-icon"></span> <span id="feedback-title"></span></h4>
                    <p id="feedback-text"></p>
                </div>

                <div class="exam-tip" id="exam-tip">
                    <h4><img src="/assets/images/icons/icon-notepad.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"> Exam Tip</h4>
                    <p id="exam-tip-text"></p>
                </div>

                <button class="next-btn" id="next-btn" onclick="nextScenario()">Next Scenario →</button>
            </div>
        </div>

        <!-- Results -->
        <div class="results-section" id="results-section">
            <div class="result-icon" id="result-icon"><img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
            <h2 class="result-title success" id="result-title">Lab Complete!</h2>
            <p class="result-message" id="result-message">
                You've completed the display troubleshooting scenarios.
            </p>
            <div class="result-buttons">
                <button class="result-btn secondary" onclick="resetLab()">Try Again</button>
                <a href="../chapters/ch09-laptops/index.html" class="result-btn primary" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">Return to Chapter</a>
            </div>
        </div>
    </div>

    <script>
        const scenarios = [
            {
                id: 1,
                title: 'No Display Output',
                description: 'The laptop powers on (lights and fans work) but the screen remains completely black. No image at all appears on the display.',
                screenClass: 'screen-no-display',
                screenHTML: '',
                options: [
                    { text: 'Replace the LCD panel', correct: false },
                    { text: 'Check display cable connection / toggle Fn+display key', correct: true },
                    { text: 'Replace the motherboard', correct: false },
                    { text: 'Update display drivers', correct: false }
                ],
                feedback: 'First check if output is going to external display (Fn+display toggle). If external works, the issue is the LCD/cable. If neither works, check display cable connection inside the laptop.',
                examTip: 'Always test with an EXTERNAL monitor first! If external works but internal doesn\'t = LCD or internal cable. If neither works = GPU or motherboard issue.'
            },
            {
                id: 2,
                title: 'Dim Display',
                description: 'The display shows an image but it\'s extremely dim - you can barely see the desktop. The image is visible if you shine a flashlight on the screen.',
                screenClass: 'screen-dim',
                screenHTML: '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#222;font-size:0.9rem;"><img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Desktop (barely visible)</div>',
                options: [
                    { text: 'Replace the LCD panel', correct: false },
                    { text: 'Check brightness settings / replace backlight or inverter', correct: true },
                    { text: 'Update Windows', correct: false },
                    { text: 'Replace video card', correct: false }
                ],
                feedback: 'If the image is visible with a flashlight (the "flashlight test"), the LCD itself is working but the backlight has failed. On older laptops, this means the CCFL backlight or inverter. LED backlights rarely fail but can.',
                examTip: 'The FLASHLIGHT TEST is key! Image visible with flashlight = backlight/inverter failure. On older laptops with CCFL, the INVERTER is often the culprit. Modern LED backlights are more reliable.'
            },
            {
                id: 3,
                title: 'Dead Pixels',
                description: 'Several small black dots appear on the screen that don\'t change regardless of what\'s displayed. They\'re always in the same positions.',
                screenClass: 'screen-dead-pixels',
                screenHTML: '<div class="dead-pixel" style="top:40px;left:80px;"></div><div class="dead-pixel" style="top:120px;left:200px;"></div><div class="dead-pixel" style="top:180px;left:150px;"></div><div class="dead-pixel" style="top:80px;left:300px;"></div>',
                options: [
                    { text: 'Run pixel recovery software', correct: false },
                    { text: 'Replace the LCD panel (if under warranty or excessive)', correct: true },
                    { text: 'Update graphics drivers', correct: false },
                    { text: 'Adjust color calibration', correct: false }
                ],
                feedback: 'Dead pixels are permanently off transistors in the LCD. They cannot be fixed by software. Manufacturers have different policies - some allow a few dead pixels before warranty replacement.',
                examTip: 'DEAD pixels = always black (transistor failed OFF). STUCK pixels = always one color (transistor failed ON). Stuck pixels sometimes can be fixed with rapid color cycling, dead pixels cannot.'
            },
            {
                id: 4,
                title: 'Stuck Pixels (Colored)',
                description: 'Three small bright red/green dots appear on the screen. They stay the same color no matter what\'s displayed.',
                screenClass: 'screen-dead-pixels',
                screenHTML: '<div class="stuck-pixel" style="top:60px;left:100px;background:#ff0000;"></div><div class="stuck-pixel" style="top:140px;left:220px;background:#00ff00;"></div><div class="stuck-pixel" style="top:100px;left:320px;background:#ff0000;"></div>',
                options: [
                    { text: 'Try pixel recovery/stimulation software first', correct: true },
                    { text: 'Immediately replace the display', correct: false },
                    { text: 'Reinstall Windows', correct: false },
                    { text: 'Replace the video cable', correct: false }
                ],
                feedback: 'Stuck pixels (always showing one color) can sometimes be fixed by rapidly cycling colors to "unstick" the transistor. Tools like JScreenFix or UDPixel may help. If software fails, replacement is needed.',
                examTip: 'STUCK pixels show a COLOR (red, green, blue) = transistor stuck ON. Try pixel recovery software FIRST before replacing. Dead pixels (black) cannot be recovered.'
            },
            {
                id: 5,
                title: 'Screen Flickering',
                description: 'The display image rapidly flickers - brightness varies noticeably. The flickering is constant and makes the screen hard to look at.',
                screenClass: 'screen-flicker',
                screenHTML: '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:1rem;"><img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Desktop</div>',
                options: [
                    { text: 'Adjust refresh rate / check display cable / replace inverter', correct: true },
                    { text: 'Replace the hard drive', correct: false },
                    { text: 'Update BIOS', correct: false },
                    { text: 'Replace RAM', correct: false }
                ],
                feedback: 'Flickering can be caused by: incorrect refresh rate setting, loose display cable, failing inverter/backlight, or incompatible drivers. Check settings first, then physical connections.',
                examTip: 'Flickering causes: 1) Wrong refresh rate (software fix), 2) Loose cable (reseat), 3) Failing inverter on CCFL displays, 4) Bad drivers. Always check software settings before hardware replacement!'
            },
            {
                id: 6,
                title: 'Image Burn-In',
                description: 'A faint "ghost" image of a previous screen (taskbar, icons) remains visible even when displaying different content. Most noticeable on solid backgrounds.',
                screenClass: 'screen-burn-in',
                screenHTML: '<div class="burn-in-ghost">File Edit View Help<br>━━━━━━━━━━━━<br><img src="/assets/images/icons/icon-folder.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Documents<br><img src="/assets/images/icons/icon-folder.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Downloads<br><img src="/assets/images/icons/icon-folder.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Pictures</div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:1rem;"><img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Desktop</div>',
                options: [
                    { text: 'Update display drivers', correct: false },
                    { text: 'Replace the display panel (permanent damage)', correct: true },
                    { text: 'Adjust contrast settings', correct: false },
                    { text: 'Run disk cleanup', correct: false }
                ],
                feedback: 'Burn-in occurs when static images are displayed for too long, causing permanent phosphor/OLED degradation. It\'s irreversible on affected areas. Prevention: use screensavers, auto-hide taskbar, avoid static images.',
                examTip: 'Burn-in is PERMANENT display damage, especially on OLED/plasma. LCD can have "image persistence" which may fade. OLED burn-in does NOT fade. Prevention is key - use screensavers!'
            },
            {
                id: 7,
                title: 'Vertical/Horizontal Lines',
                description: 'Thin colored lines run vertically down the screen. The lines are always in the same position and appear on all content.',
                screenClass: 'screen-lines',
                screenHTML: '<div class="vertical-line" style="left:80px;"></div><div class="vertical-line" style="left:250px;background:#00ff00;"></div><div class="horizontal-line" style="top:150px;background:#0000ff;"></div>',
                options: [
                    { text: 'Adjust display resolution', correct: false },
                    { text: 'Check/replace display cable or LCD panel', correct: true },
                    { text: 'Install new graphics drivers', correct: false },
                    { text: 'Replace the battery', correct: false }
                ],
                feedback: 'Permanent lines usually indicate physical damage - either to the LCD panel itself or the ribbon cable connecting it. A loose cable may cause intermittent lines. Try reseating the cable first.',
                examTip: 'Lines in FIXED positions = hardware issue (cable or LCD). Lines that move or change = likely driver/GPU issue. Test with external monitor to isolate the problem!'
            },
            {
                id: 8,
                title: 'No Signal Message',
                description: 'The monitor displays "No Signal" or "Check Video Cable" message, then goes to sleep. The computer appears to be running normally.',
                screenClass: 'screen-no-signal',
                screenHTML: '<div class="no-signal-text"><img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> No Signal</div><div class="no-signal-search">Searching for input...</div>',
                options: [
                    { text: 'Replace the monitor', correct: false },
                    { text: 'Check cable connection / try different port / check input source', correct: true },
                    { text: 'Reinstall Windows', correct: false },
                    { text: 'Replace the power supply', correct: false }
                ],
                feedback: '"No Signal" means the monitor is working but not receiving video data. Check: cable securely connected, correct input selected on monitor, try different cable/port. The monitor itself is usually fine.',
                examTip: '"No Signal" = MONITOR IS WORKING but not getting data. This is different from a blank screen (monitor not working). Check cables, ports, and input source selection first!'
            }
        ];

        let currentScenario = 0;
        let correctAnswers = 0;

        function initLab() {
            document.getElementById('total-count').textContent = scenarios.length;
            loadScenario(0);
        }

        function loadScenario(index) {
            currentScenario = index;
            const scenario = scenarios[index];

            // Update symptom info
            document.getElementById('symptom-title').textContent = scenario.title;
            document.getElementById('symptom-description').textContent = scenario.description;

            // Update screen display
            const screenContent = document.getElementById('screen-content');
            screenContent.className = 'screen-content ' + scenario.screenClass;
            screenContent.innerHTML = scenario.screenHTML;

            // Build answer options
            const optionsContainer = document.getElementById('answer-options');
            optionsContainer.innerHTML = scenario.options.map((opt, i) =>
                `<button class="answer-btn" onclick="selectAnswer(${i}, ${opt.correct})">${opt.text}</button>`
            ).join('');

            // Hide feedback and exam tip
            document.getElementById('feedback-box').classList.remove('show');
            document.getElementById('feedback-box').classList.remove('correct');
            document.getElementById('feedback-box').classList.remove('incorrect');
            document.getElementById('exam-tip').classList.remove('show');
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectAnswer(index, isCorrect) {
            const scenario = scenarios[currentScenario];
            const buttons = document.querySelectorAll('.answer-btn');

            // Disable all buttons and show correct/incorrect
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === index) {
                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
                if (scenario.options[i].correct && !isCorrect) {
                    btn.classList.add('correct');
                }
            });

            // Show feedback
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('show');
            feedbackBox.classList.add(isCorrect ? 'correct' : 'incorrect');

            document.getElementById('feedback-icon').innerHTML = isCorrect ? '<img src="/assets/images/icons/icon-checkbox.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">' : '<img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
            document.getElementById('feedback-title').textContent = isCorrect ? 'Correct!' : 'Not Quite';
            document.getElementById('feedback-text').textContent = scenario.feedback;

            // Show exam tip
            document.getElementById('exam-tip-text').textContent = scenario.examTip;
            document.getElementById('exam-tip').classList.add('show');

            // Update score
            if (isCorrect) {
                correctAnswers++;
                document.getElementById('correct-count').textContent = correctAnswers;
            }

            // Update progress
            document.getElementById('progress-fill').style.width =
                `${((currentScenario + 1) / scenarios.length) * 100}%`;

            // Show next button
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextScenario() {
            if (currentScenario < scenarios.length - 1) {
                loadScenario(currentScenario + 1);
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('display-area').style.display = 'none';
            document.getElementById('results-section').classList.add('show');

            const percentage = Math.round((correctAnswers / scenarios.length) * 100);

            if (percentage >= 70) {
                document.getElementById('result-icon').innerHTML = '<img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                document.getElementById('result-title').textContent = 'Display Expert!';
                document.getElementById('result-title').className = 'result-title success';
                document.getElementById('result-message').textContent =
                    `You diagnosed ${correctAnswers} of ${scenarios.length} display issues correctly (${percentage}%). Excellent troubleshooting skills!`;
                if (typeof ModuleProgress !== 'undefined') {
                    ModuleProgress.complete('forge', 'forge-display-troubleshoot', { returnUrl: '../index.html' });
                }
            } else {
                document.getElementById('result-icon').innerHTML = '<img src="/assets/images/icons/icon-books.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                document.getElementById('result-title').textContent = 'Keep Practicing';
                document.getElementById('result-title').className = 'result-title';
                document.getElementById('result-title').style.color = '#f39c12';
                document.getElementById('result-message').textContent =
                    `You diagnosed ${correctAnswers} of ${scenarios.length} display issues correctly (${percentage}%). Review the chapter and try again!`;
            }
        }

        function resetLab() {
            currentScenario = 0;
            correctAnswers = 0;

            document.getElementById('correct-count').textContent = '0';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('display-area').style.display = 'grid';
            document.getElementById('results-section').classList.remove('show');

            loadScenario(0);
        }

        // Initialize
        initLab();
    </script>
</body>
</html>
