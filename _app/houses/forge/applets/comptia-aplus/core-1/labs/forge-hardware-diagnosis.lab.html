<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Diagnosis Simulator | CompTIA A+ Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .lab-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lab-header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .lab-header h1 {
            font-size: 1.8rem;
            color: #10b981;
            margin-bottom: 8px;
        }

        .lab-header p {
            color: #888;
            font-size: 0.95rem;
        }

        /* Component Quick Reference */
        .component-reference {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .comp-ref-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .comp-ref-card .icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .comp-ref-card .name {
            font-size: 0.75rem;
            color: #888;
        }

        /* Progress */
        .progress-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Case View */
        .case-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .case-header h2 {
            color: #10b981;
            font-size: 1.2rem;
        }

        .case-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-easy { background: #22c55e; color: #000; }
        .badge-medium { background: #f97316; color: #000; }
        .badge-hard { background: #ef4444; color: #fff; }

        /* System Display */
        .system-display {
            background: #0a0a15;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .display-header h4 {
            color: #10b981;
            font-size: 0.9rem;
        }

        .power-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .power-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
        }

        .power-light.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .power-light.off { background: #333; }
        .power-light.blinking { animation: blink 1s infinite; }

        @keyframes blink {
            0%, 100% { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
            50% { background: #333; box-shadow: none; }
        }

        /* Symptoms Display */
        .symptoms-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .symptom-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #ef4444;
        }

        .symptom-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .symptom-text {
            flex: 1;
        }

        .symptom-text .title {
            color: #fff;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .symptom-text .detail {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Beep Code Display */
        .beep-display {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }

        .beep-display h5 {
            color: #ef4444;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .beep-pattern {
            font-family: 'Consolas', monospace;
            font-size: 1.5rem;
            letter-spacing: 8px;
            color: #fff;
        }

        .beep-pattern .short { color: #f97316; }
        .beep-pattern .long { color: #ef4444; }

        /* Error Message Display */
        .error-display {
            background: #000;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Consolas', monospace;
        }

        .error-display.bsod {
            background: #0078d7;
            color: #fff;
        }

        .error-display.bios {
            background: #000;
            color: #aaa;
        }

        .error-title {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .error-code {
            font-size: 1.2rem;
            color: #fff;
        }

        /* Component Selection */
        .diagnosis-section {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .diagnosis-section h3 {
            color: #10b981;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .component-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .component-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .component-option:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .component-option.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
        }

        .component-option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .component-option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .comp-icon {
            font-size: 1.8rem;
        }

        .comp-name {
            font-size: 0.95rem;
            color: #fff;
        }

        /* Explanation */
        .explanation-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-box.correct-exp {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .explanation-box.incorrect-exp {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .explanation-box h4 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .explanation-box.correct-exp h4 { color: #22c55e; }
        .explanation-box.incorrect-exp h4 { color: #ef4444; }

        .explanation-box p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .diagnostic-tip {
            background: rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            padding: 10px 15px;
            border-radius: 0 6px 6px 0;
            margin-top: 10px;
        }

        .diagnostic-tip strong {
            color: #10b981;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #0a0a0f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #10b981;
            color: #10b981;
        }

        .btn-secondary:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Panel */
        .results-panel {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-panel.show {
            display: block;
        }

        .results-score {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .results-score.passed { color: #22c55e; }
        .results-score.failed { color: #ef4444; }

        .results-message {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .results-details {
            color: #888;
            margin-bottom: 25px;
        }

        /* Navigation Dots */
        .case-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #444;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-dot.current {
            background: #10b981;
            border-color: #10b981;
        }

        .nav-dot.answered {
            background: #22c55e;
            border-color: #22c55e;
        }

        .nav-dot.wrong {
            background: #ef4444;
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="lab-container">
        <a href="../chapters/ch11-troubleshooting/index.html" class="back-link">&larr; Back to Chapter 11</a>

        <header class="lab-header">
            <h1>Hardware Diagnosis Simulator</h1>
            <p>Identify failing components based on symptoms, beep codes, and error messages</p>
        </header>

        <!-- Component Quick Reference -->
        <div class="component-reference">
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">CPU</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">RAM</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-joystick.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">GPU</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">Storage</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-lightning.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">PSU</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-plug.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">Motherboard</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></div>
                <div class="name">Monitor</div>
            </div>
            <div class="comp-ref-card">
                <div class="icon"><img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                <div class="name">Cooling</div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span id="progressLabel">Case 1 of 10</span>
                <span id="scoreLabel">Score: 0/0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
        </div>

        <!-- Case Navigation -->
        <div class="case-nav" id="caseNav">
            <!-- Generated by JavaScript -->
        </div>

        <!-- Case Panel -->
        <div class="case-panel" id="casePanel">
            <!-- Generated by JavaScript -->
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons" id="actionButtons">
            <button class="btn btn-primary" onclick="submitDiagnosis()" id="submitBtn" disabled>Submit Diagnosis</button>
            <button class="btn btn-primary" onclick="nextCase()" id="nextBtn" style="display: none;">Next Case</button>
        </div>

        <!-- Results Panel -->
        <div class="results-panel" id="resultsPanel">
            <div class="results-score" id="resultsScore">0%</div>
            <div class="results-message" id="resultsMessage">Lab Complete!</div>
            <div class="results-details" id="resultsDetails"></div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="reviewCases()">Review Cases</button>
                <button class="btn btn-primary" onclick="retakeLab()">Retake Lab</button>
            </div>
        </div>
    </div>

    <script>
        // Hardware Diagnosis Cases
        const cases = [
            {
                id: 1,
                title: "No Display, Beeping",
                difficulty: "easy",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "No video output", detail: "Monitor shows 'No Signal' but fans are spinning and power LED is on." },
                    { icon: '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Continuous beeping", detail: "System produces a pattern of beeps shortly after power on." }
                ],
                beepCode: { pattern: "● ● ●", description: "Three short beeps" },
                errorMessage: null,
                components: ["RAM", "GPU", "PSU", "Monitor"],
                correct: "RAM",
                explanation: "Three short beeps is a common BIOS code indicating RAM failure. The system POSTs but can't proceed without working memory. The GPU can cause no display but typically doesn't produce this beep pattern.",
                tip: "Beep codes are standardized POST (Power-On Self-Test) alerts. Short beeps often indicate RAM issues. Try reseating or replacing RAM modules."
            },
            {
                id: 2,
                title: "Random Shutdowns",
                difficulty: "medium",
                powerStatus: "blinking",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-plug.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Sudden shutdowns", detail: "Computer turns off without warning during intensive tasks like gaming or video editing." },
                    { icon: '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Heat detected", detail: "Case feels very hot to the touch, especially near the CPU area." },
                    { icon: '<img src="/assets/images/icons/icon-stopwatch.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Timing pattern", detail: "Shutdowns occur 10-15 minutes after starting heavy workloads." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["CPU", "RAM", "PSU", "Cooling"],
                correct: "Cooling",
                explanation: "The timing pattern (shutdowns during intensive tasks after 10-15 minutes) combined with the heat symptom indicates thermal throttling followed by emergency shutdown. The CPU is overheating due to cooling system failure.",
                tip: "Thermal shutdowns are a protective measure. Check CPU fan, thermal paste, and case airflow. Use monitoring software to track temperatures."
            },
            {
                id: 3,
                title: "Blue Screen Errors",
                difficulty: "medium",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-diamond.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Frequent BSODs", detail: "Blue screen errors occur randomly, sometimes minutes apart, sometimes hours." },
                    { icon: '<img src="/assets/images/icons/icon-joystick.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Random error codes", detail: "Different stop codes each time: MEMORY_MANAGEMENT, IRQL_NOT_LESS_OR_EQUAL, PAGE_FAULT_IN_NONPAGED_AREA" }
                ],
                beepCode: null,
                errorMessage: { type: "bsod", title: "Your PC ran into a problem", code: "MEMORY_MANAGEMENT" },
                components: ["RAM", "Storage", "Motherboard", "GPU"],
                correct: "RAM",
                explanation: "Multiple different BSOD error codes, especially MEMORY_MANAGEMENT and PAGE_FAULT errors, strongly indicate failing RAM. If it were storage, you'd see more consistent errors related to disk access.",
                tip: "Run Windows Memory Diagnostic or MemTest86 to confirm. Try testing RAM sticks individually to identify the faulty module."
            },
            {
                id: 4,
                title: "Clicking Hard Drive",
                difficulty: "easy",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Clicking sounds", detail: "Repetitive clicking or grinding noise coming from inside the computer case." },
                    { icon: '<img src="/assets/images/icons/icon-snake.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Extreme slowness", detail: "System takes 5+ minutes to boot, programs freeze frequently." },
                    { icon: '<img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "File access errors", detail: "'File or directory is corrupted' errors when opening documents." }
                ],
                beepCode: null,
                errorMessage: { type: "bios", title: "S.M.A.R.T. Status BAD", code: "Backup and Replace" },
                components: ["Storage", "RAM", "Motherboard", "PSU"],
                correct: "Storage",
                explanation: "Clicking sounds from a hard drive indicate mechanical failure - the read/write heads are failing. This is the 'click of death'. Combined with S.M.A.R.T. warnings and file errors, this is definitely storage failure.",
                tip: "CRITICAL: Back up data immediately! Clicking HDDs can fail completely at any moment. Replace with SSD for better reliability."
            },
            {
                id: 5,
                title: "Burning Smell",
                difficulty: "easy",
                powerStatus: "off",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-explosion.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Burning/electrical smell", detail: "Strong burning odor detected when computer was powered on." },
                    { icon: '<img src="/assets/images/icons/icon-lightning.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Sudden power loss", detail: "Computer immediately shut off and won't turn back on." },
                    { icon: '<img src="/assets/images/icons/icon-explosion.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Visible signs", detail: "Slight smoke/vapor observed coming from the back of the case." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["PSU", "Motherboard", "CPU", "GPU"],
                correct: "PSU",
                explanation: "Burning smell and smoke from a computer almost always indicates PSU failure. Power supplies handle high voltages and can catastrophically fail. The location (back of case) confirms PSU as the source.",
                tip: "SAFETY FIRST: Unplug immediately! Do not attempt to power on. PSU failures can damage other components. Replace with quality PSU of appropriate wattage."
            },
            {
                id: 6,
                title: "No POST, No Display",
                difficulty: "hard",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-target.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "No display at all", detail: "Monitor stays black, no BIOS/UEFI logo appears." },
                    { icon: '<img src="/assets/images/icons/icon-checkbox.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Fans running", detail: "All fans spin, power LED is on, but no beeps at all." },
                    { icon: '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Complete silence", detail: "No beep codes, no hard drive activity light, no keyboard lights." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["CPU", "Motherboard", "RAM", "GPU"],
                correct: "CPU",
                explanation: "No beeps with power suggests the system isn't even reaching POST. When the CPU fails or isn't seated properly, the motherboard can't execute any code, including beep routines. RAM issues usually produce beeps.",
                tip: "Check CPU seating, bent pins, and thermal paste application. Verify CPU is compatible with motherboard. No POST and no beeps often points to CPU or motherboard."
            },
            {
                id: 7,
                title: "Garbled Display",
                difficulty: "medium",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-globe.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Artifacts on screen", detail: "Random colored lines, blocks, and visual corruption on display." },
                    { icon: '<img src="/assets/images/icons/icon-explosion.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Crashes in games", detail: "System crashes specifically when running 3D applications or games." },
                    { icon: '<img src="/assets/images/icons/icon-picture.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Distorted images", detail: "Desktop and windows display correctly until graphics-intensive tasks begin." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["GPU", "Monitor", "RAM", "Motherboard"],
                correct: "GPU",
                explanation: "Visual artifacts during 3D rendering and gaming are classic GPU failure symptoms. The fact that desktop works fine but 3D causes issues points specifically to the graphics processing unit, not the monitor or cable.",
                tip: "Test with a different GPU if available. Check GPU temperatures and fan operation. Artifacts often indicate failing VRAM or GPU die."
            },
            {
                id: 8,
                title: "Intermittent Boot",
                difficulty: "hard",
                powerStatus: "blinking",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-joystick.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Random boot success", detail: "Sometimes boots normally, sometimes nothing happens. Unpredictable." },
                    { icon: '<img src="/assets/images/icons/icon-plug.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Power button unreliable", detail: "Multiple presses required to start, sometimes works first try." },
                    { icon: '<img src="/assets/images/icons/icon-clock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Gets worse over time", detail: "Issue has progressed from occasional to frequent over several weeks." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["PSU", "Motherboard", "RAM", "Storage"],
                correct: "PSU",
                explanation: "Intermittent boot issues that progressively worsen often indicate a failing PSU with degrading capacitors. The power supply can't consistently deliver stable power, causing random boot failures.",
                tip: "PSU issues are often intermittent before complete failure. Test with a known-good PSU or use a PSU tester. Check capacitors for bulging."
            },
            {
                id: 9,
                title: "POST Code Display",
                difficulty: "hard",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-numbers.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Stuck POST code", detail: "Motherboard LED display shows code '00' or 'FF' and won't progress." },
                    { icon: '<img src="/assets/images/icons/icon-refresh.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Boot loop", detail: "System attempts to start, fails, restarts automatically, repeating indefinitely." },
                    { icon: '<img src="/assets/images/icons/icon-package.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "New build", detail: "This is a newly assembled system that has never successfully booted." }
                ],
                beepCode: { pattern: "▬ ▬ ▬", description: "Three long beeps" },
                errorMessage: null,
                components: ["RAM", "CPU", "Motherboard", "GPU"],
                correct: "RAM",
                explanation: "POST code 00 or FF typically means 'no CPU or RAM detected'. On a new build with three long beeps, RAM is the most common culprit - often not fully seated. Three long beeps commonly indicates memory issues.",
                tip: "For new builds: reseat RAM firmly until clips click. Ensure RAM is in correct slots per motherboard manual. Try single stick in first slot."
            },
            {
                id: 10,
                title: "Display Works, Then Dies",
                difficulty: "medium",
                powerStatus: "on",
                symptoms: [
                    { icon: '<img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Initial display okay", detail: "BIOS and Windows logo appear normally during boot sequence." },
                    { icon: "■", title: "Goes black after login", detail: "Screen goes black a few seconds after reaching Windows desktop." },
                    { icon: '<img src="/assets/images/icons/icon-mouse.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',  title: "Cursor visible", detail: "Mouse cursor is visible and moves on the black screen." }
                ],
                beepCode: null,
                errorMessage: null,
                components: ["GPU", "Monitor", "Storage", "Motherboard"],
                correct: "GPU",
                explanation: "Display working during boot but failing after Windows loads indicates a GPU driver issue or GPU failure at higher resolutions/refresh rates. The cursor appearing proves the GPU is partially working but failing under full driver load.",
                tip: "Boot to Safe Mode to bypass GPU drivers. Try DDU to clean install drivers. If issue persists in Safe Mode, hardware GPU failure is likely."
            }
        ];

        // State
        let currentCase = 0;
        let userAnswers = new Array(cases.length).fill(null);
        let answeredCases = new Set();

        // Initialize
        function init() {
            renderCaseNav();
            loadCase(0);
        }

        function renderCaseNav() {
            const container = document.getElementById('caseNav');
            container.innerHTML = cases.map((_, i) =>
                `<div class="nav-dot ${i === 0 ? 'current' : ''}" onclick="goToCase(${i})"></div>`
            ).join('');
        }

        function updateCaseNav() {
            document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                dot.classList.remove('current', 'answered', 'wrong');
                if (i === currentCase) dot.classList.add('current');
                if (userAnswers[i] !== null) {
                    dot.classList.add(userAnswers[i] === cases[i].correct ? 'answered' : 'wrong');
                }
            });
        }

        function loadCase(index) {
            currentCase = index;
            const caseData = cases[index];

            // Update progress
            document.getElementById('progressLabel').textContent = `Case ${index + 1} of ${cases.length}`;
            document.getElementById('progressFill').style.width = `${((index + 1) / cases.length) * 100}%`;

            const correct = userAnswers.filter((a, i) => a === cases[i].correct).length;
            const answered = answeredCases.size;
            document.getElementById('scoreLabel').textContent = `Score: ${correct}/${answered}`;

            // Render case
            const panel = document.getElementById('casePanel');
            let beepHtml = '';
            if (caseData.beepCode) {
                beepHtml = `
                    <div class="beep-display">
                        <h5><img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> BIOS Beep Code Detected</h5>
                        <div class="beep-pattern">${caseData.beepCode.pattern}</div>
                        <p style="color: #aaa; font-size: 0.85rem; margin-top: 8px;">${caseData.beepCode.description}</p>
                    </div>
                `;
            }

            let errorHtml = '';
            if (caseData.errorMessage) {
                errorHtml = `
                    <div class="error-display ${caseData.errorMessage.type}">
                        <div class="error-title">${caseData.errorMessage.title}</div>
                        <div class="error-code">${caseData.errorMessage.code}</div>
                    </div>
                `;
            }

            panel.innerHTML = `
                <div class="case-header">
                    <h2>Case ${index + 1}: ${caseData.title}</h2>
                    <span class="case-badge badge-${caseData.difficulty}">${caseData.difficulty.toUpperCase()}</span>
                </div>

                <div class="system-display">
                    <div class="display-header">
                        <h4><img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> System Status</h4>
                        <div class="power-indicator">
                            <div class="power-light ${caseData.powerStatus}"></div>
                            <span>Power ${caseData.powerStatus === 'off' ? 'OFF' : (caseData.powerStatus === 'blinking' ? 'Unstable' : 'ON')}</span>
                        </div>
                    </div>

                    <div class="symptoms-list">
                        ${caseData.symptoms.map(s => `
                            <div class="symptom-item">
                                <span class="symptom-icon">${s.icon}</span>
                                <div class="symptom-text">
                                    <div class="title">${s.title}</div>
                                    <div class="detail">${s.detail}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${beepHtml}
                    ${errorHtml}
                </div>

                <div class="diagnosis-section">
                    <h3><img src="/assets/images/icons/icon-magnifier.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Which component is most likely failing?</h3>
                    <div class="component-options">
                        ${caseData.components.map(comp => `
                            <div class="component-option ${userAnswers[index] === comp ? 'selected' : ''}"
                                 onclick="selectComponent('${comp}')" data-component="${comp}">
                                <span class="comp-icon">${getComponentIcon(comp)}</span>
                                <span class="comp-name">${comp}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="explanation-box" id="explanationBox">
                    <h4 id="explanationTitle">Diagnosis Result</h4>
                    <p>${caseData.explanation}</p>
                    <div class="diagnostic-tip">
                        <strong>Diagnostic Tip:</strong> ${caseData.tip}
                    </div>
                </div>
            `;

            // Update buttons
            const isAnswered = answeredCases.has(index);
            document.getElementById('submitBtn').style.display = isAnswered ? 'none' : 'inline-block';
            document.getElementById('submitBtn').disabled = userAnswers[index] === null;

            if (isAnswered) {
                showExplanation();
                const isLast = index === cases.length - 1;
                const allAnswered = answeredCases.size === cases.length;
                document.getElementById('nextBtn').textContent = (isLast && allAnswered) ? 'View Results' : 'Next Case';
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                document.getElementById('nextBtn').style.display = 'none';
            }

            updateCaseNav();
        }

        function getComponentIcon(component) {
            const icons = {
                'CPU': '<img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'RAM': '<img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'GPU': '<img src="/assets/images/icons/icon-joystick.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'Storage': '<img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'PSU': '<img src="/assets/images/icons/icon-lightning.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'Motherboard': '<img src="/assets/images/icons/icon-plug.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'Monitor': '<img src="/assets/images/icons/icon-desktop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">',
                'Cooling': '<img src="/assets/images/icons/icon-signal.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">'
            };
            return icons[component] || '<img src="/assets/images/icons/icon-magnifier.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
        }

        function selectComponent(component) {
            if (answeredCases.has(currentCase)) return;

            userAnswers[currentCase] = component;

            document.querySelectorAll('.component-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.dataset.component === component) {
                    opt.classList.add('selected');
                }
            });

            document.getElementById('submitBtn').disabled = false;
        }

        function submitDiagnosis() {
            if (userAnswers[currentCase] === null) return;

            answeredCases.add(currentCase);
            showExplanation();

            // Update buttons
            document.getElementById('submitBtn').style.display = 'none';
            const isLast = currentCase === cases.length - 1;
            const allAnswered = answeredCases.size === cases.length;
            document.getElementById('nextBtn').textContent = (isLast && allAnswered) ? 'View Results' : 'Next Case';
            document.getElementById('nextBtn').style.display = 'inline-block';

            // Update score
            const correct = userAnswers.filter((a, i) => a === cases[i].correct).length;
            document.getElementById('scoreLabel').textContent = `Score: ${correct}/${answeredCases.size}`;

            updateCaseNav();
        }

        function showExplanation() {
            const caseData = cases[currentCase];
            const userAnswer = userAnswers[currentCase];
            const isCorrect = userAnswer === caseData.correct;

            // Highlight options
            document.querySelectorAll('.component-option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                if (opt.dataset.component === caseData.correct) {
                    opt.classList.add('correct');
                } else if (opt.dataset.component === userAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            // Show explanation
            const expBox = document.getElementById('explanationBox');
            expBox.classList.add('show');
            expBox.classList.remove('correct-exp', 'incorrect-exp');
            expBox.classList.add(isCorrect ? 'correct-exp' : 'incorrect-exp');
            document.getElementById('explanationTitle').textContent =
                isCorrect ? '✓ Correct Diagnosis!' : `✗ Incorrect - The answer was ${caseData.correct}`;
        }

        function nextCase() {
            const allAnswered = answeredCases.size === cases.length;
            const isLast = currentCase === cases.length - 1;

            if (isLast && allAnswered) {
                showResults();
            } else {
                loadCase(currentCase + 1);
            }
        }

        function goToCase(index) {
            loadCase(index);
        }

        function showResults() {
            document.getElementById('casePanel').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';

            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.classList.add('show');

            const correct = userAnswers.filter((a, i) => a === cases[i].correct).length;
            const percentage = Math.round((correct / cases.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('resultsScore').textContent = `${percentage}%`;
            document.getElementById('resultsScore').className = `results-score ${passed ? 'passed' : 'failed'}`;
            document.getElementById('resultsMessage').textContent = passed ?
                'Excellent Diagnostic Skills!' : 'Keep Practicing!';
            document.getElementById('resultsDetails').textContent =
                `You correctly diagnosed ${correct} out of ${cases.length} hardware cases. (70% required to pass)`;

            if (passed) {
                saveProgress(percentage);
            }
        }

        function reviewCases() {
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('casePanel').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'flex';
            loadCase(0);
        }

        function retakeLab() {
            currentCase = 0;
            userAnswers = new Array(cases.length).fill(null);
            answeredCases = new Set();

            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('casePanel').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'flex';

            renderCaseNav();
            loadCase(0);
        }

        function saveProgress(percentage) {
            try {
                const progressKey = 'aplus-core1-progress';
                let progress = JSON.parse(localStorage.getItem(progressKey) || '{}');
                if (!progress.labs) progress.labs = {};

                progress.labs['hardware-diagnosis'] = {
                    completed: true,
                    score: percentage,
                    lastAttempt: new Date().toISOString()
                };

                localStorage.setItem(progressKey, JSON.stringify(progress));
            } catch (e) {
                /* silently ignore */
            }
            if (typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('forge', 'forge-hardware-diagnosis', { returnUrl: '../index.html' });
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="forge-hardware-diagnosis" house="forge"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
