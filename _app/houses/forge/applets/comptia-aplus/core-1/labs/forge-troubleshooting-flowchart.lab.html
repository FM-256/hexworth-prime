<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troubleshooting Flowchart Lab | CompTIA A+ Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .lab-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lab-header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .lab-header h1 {
            font-size: 1.8rem;
            color: #10b981;
            margin-bottom: 8px;
        }

        .lab-header p {
            color: #888;
            font-size: 0.95rem;
        }

        /* Methodology Steps Reference */
        .methodology-steps {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .step-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            transition: all 0.3s;
        }

        .step-badge.active {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
        }

        .step-badge .number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #333;
            border-radius: 50%;
            line-height: 24px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .step-badge.active .number {
            background: #10b981;
            color: #000;
        }

        .step-badge .name {
            display: block;
            font-size: 0.75rem;
            color: #888;
        }

        .step-badge.active .name {
            color: #10b981;
        }

        /* Progress */
        .progress-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Scenario Panel */
        .scenario-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scenario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scenario-header h2 {
            color: #10b981;
            font-size: 1.2rem;
        }

        .scenario-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-easy { background: #22c55e; color: #000; }
        .badge-medium { background: #f97316; color: #000; }
        .badge-hard { background: #ef4444; color: #fff; }

        /* User Report */
        .user-report {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
        }

        .user-report h4 {
            color: #10b981;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-report p {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.7;
            font-style: italic;
        }

        .user-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .info-item {
            font-size: 0.85rem;
        }

        .info-item .label {
            color: #666;
        }

        .info-item .value {
            color: #aaa;
        }

        /* Question Section */
        .question-section {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .question-section h3 {
            color: #10b981;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .answer-option:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .answer-option.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
        }

        .answer-option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .answer-option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .option-letter {
            width: 28px;
            height: 28px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .answer-option.selected .option-letter {
            background: #10b981;
            color: #000;
        }

        .answer-option.correct .option-letter {
            background: #22c55e;
            color: #000;
        }

        .answer-option.incorrect .option-letter {
            background: #ef4444;
            color: #fff;
        }

        .option-text {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Explanation */
        .explanation-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-box.correct-exp {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .explanation-box.incorrect-exp {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .explanation-box h4 {
            color: #3b82f6;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .explanation-box.correct-exp h4 {
            color: #22c55e;
        }

        .explanation-box.incorrect-exp h4 {
            color: #ef4444;
        }

        .explanation-box p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .methodology-highlight {
            background: rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 0 6px 6px 0;
        }

        .methodology-highlight strong {
            color: #10b981;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #0a0a0f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #10b981;
            color: #10b981;
        }

        .btn-secondary:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Panel */
        .results-panel {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-panel.show {
            display: block;
        }

        .results-score {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .results-score.passed { color: #22c55e; }
        .results-score.failed { color: #ef4444; }

        .results-message {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .results-details {
            color: #888;
            margin-bottom: 25px;
        }

        /* Scenario Navigation */
        .scenario-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #444;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-dot.current {
            background: #10b981;
            border-color: #10b981;
        }

        .nav-dot.answered {
            background: #22c55e;
            border-color: #22c55e;
        }

        .nav-dot.wrong {
            background: #ef4444;
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="lab-container">
        <a href="../chapters/ch11-troubleshooting/index.html" class="back-link" onclick="if(history.length>1){history.back();return false;}">&larr; Back to Chapter 11</a>

        <header class="lab-header">
            <h1>Troubleshooting Flowchart Lab</h1>
            <p>Practice the CompTIA 6-step troubleshooting methodology with real-world scenarios</p>
        </header>

        <!-- Methodology Steps Reference -->
        <div class="methodology-steps" id="methodologySteps">
            <div class="step-badge" data-step="1">
                <span class="number">1</span>
                <span class="name">Identify Problem</span>
            </div>
            <div class="step-badge" data-step="2">
                <span class="number">2</span>
                <span class="name">Establish Theory</span>
            </div>
            <div class="step-badge" data-step="3">
                <span class="number">3</span>
                <span class="name">Test Theory</span>
            </div>
            <div class="step-badge" data-step="4">
                <span class="number">4</span>
                <span class="name">Plan of Action</span>
            </div>
            <div class="step-badge" data-step="5">
                <span class="number">5</span>
                <span class="name">Verify & Prevent</span>
            </div>
            <div class="step-badge" data-step="6">
                <span class="number">6</span>
                <span class="name">Document</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span id="progressLabel">Scenario 1 of 10</span>
                <span id="scoreLabel">Score: 0/0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
        </div>

        <!-- Scenario Navigation -->
        <div class="scenario-nav" id="scenarioNav">
            <!-- Generated by JavaScript -->
        </div>

        <!-- Scenario Panel -->
        <div class="scenario-panel" id="scenarioPanel">
            <!-- Generated by JavaScript -->
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons" id="actionButtons">
            <button class="btn btn-primary" onclick="submitAnswer()" id="submitBtn" disabled>Submit Answer</button>
            <button class="btn btn-primary" onclick="nextScenario()" id="nextBtn" style="display: none;">Next Scenario</button>
        </div>

        <!-- Results Panel -->
        <div class="results-panel" id="resultsPanel">
            <div class="results-score" id="resultsScore">0%</div>
            <div class="results-message" id="resultsMessage">Lab Complete!</div>
            <div class="results-details" id="resultsDetails"></div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="reviewScenarios()">Review Answers</button>
                <button class="btn btn-primary" onclick="retakeLab()">Retake Lab</button>
            </div>
        </div>
    </div>

    <script>
        // Troubleshooting Scenarios
        const scenarios = [
            {
                id: 1,
                difficulty: "easy",
                title: "Computer Won't Boot",
                userReport: "My computer won't turn on at all. I pressed the power button but nothing happens - no lights, no fan, nothing.",
                userInfo: {
                    device: "Desktop PC",
                    age: "2 years old",
                    lastWorked: "Yesterday",
                    changes: "None reported"
                },
                question: "What should you do FIRST?",
                correctStep: 1,
                options: [
                    { text: "Replace the power supply unit", step: 4 },
                    { text: "Ask if the computer is plugged in and the outlet works", step: 1 },
                    { text: "Open the case and check internal connections", step: 3 },
                    { text: "Document the issue in the ticket system", step: 6 }
                ],
                correctIndex: 1,
                explanation: "Before doing anything else, you need to identify the problem by asking basic questions. Verifying power at the outlet is part of Step 1: Identify the problem. Always start with the obvious - is it plugged in? Does the outlet work?",
                methodologyNote: "Step 1: Identify the problem - Question the user, identify symptoms, verify obvious issues first."
            },
            {
                id: 2,
                difficulty: "easy",
                title: "Slow Computer",
                userReport: "My computer has been running really slow lately. Everything takes forever to open and sometimes it freezes completely.",
                userInfo: {
                    device: "Laptop",
                    age: "3 years old",
                    lastWorked: "Still works, just slow",
                    changes: "Installed some software last week"
                },
                question: "After questioning the user, you suspect malware. What should you do NEXT?",
                correctStep: 3,
                options: [
                    { text: "Reinstall the operating system", step: 4 },
                    { text: "Run a full malware scan to test your theory", step: 3 },
                    { text: "Document the symptoms in detail", step: 6 },
                    { text: "Order replacement hardware", step: 4 }
                ],
                correctIndex: 1,
                explanation: "After establishing a theory (malware), you need to test it. Running a malware scan directly tests your theory before taking more drastic action like reinstalling the OS.",
                methodologyNote: "Step 3: Test the theory - If the theory is confirmed, proceed to determine next steps. If not, establish a new theory."
            },
            {
                id: 3,
                difficulty: "medium",
                title: "Network Connectivity Issue",
                userReport: "I can't connect to the internet. My email won't sync and websites won't load. Other people in the office seem fine.",
                userInfo: {
                    device: "Desktop PC",
                    age: "1 year old",
                    lastWorked: "This morning",
                    changes: "IT did updates overnight"
                },
                question: "You've verified the cable is connected. Other users are working. What theory should you establish?",
                correctStep: 2,
                options: [
                    { text: "The internet service provider is down", step: 2 },
                    { text: "This specific computer has a NIC or IP configuration issue", step: 2 },
                    { text: "The network switch for the entire building failed", step: 2 },
                    { text: "All network cables in the building are bad", step: 2 }
                ],
                correctIndex: 1,
                explanation: "Since other users are working, the ISP, switch, and building cables are unlikely causes. The most logical theory is that this specific computer has an issue - either the NIC or its IP configuration. Always consider the simplest explanation that fits the symptoms.",
                methodologyNote: "Step 2: Establish a theory of probable cause - Question the obvious. If in doubt, start with the simplest explanation."
            },
            {
                id: 4,
                difficulty: "medium",
                title: "Printer Not Working",
                userReport: "The printer won't print my documents. It was working fine yesterday but now it just sits there. The printer shows online.",
                userInfo: {
                    device: "Network Printer",
                    age: "6 months old",
                    lastWorked: "Yesterday",
                    changes: "Paper was refilled this morning"
                },
                question: "You've tested printing and confirmed the issue. Your theory is a paper jam. What's the NEXT step?",
                correctStep: 4,
                options: [
                    { text: "Question the user more about the problem", step: 1 },
                    { text: "Document the paper jam in the ticket", step: 6 },
                    { text: "Develop a plan to clear the jam following manufacturer guidelines", step: 4 },
                    { text: "Replace the printer", step: 4 }
                ],
                correctIndex: 2,
                explanation: "Once your theory is confirmed (paper jam), you establish a plan of action. This should follow corporate policies and manufacturer guidelines for safely clearing the jam.",
                methodologyNote: "Step 4: Establish a plan of action - Refer to vendor documentation, consider corporate policies before implementing changes."
            },
            {
                id: 5,
                difficulty: "medium",
                title: "Blue Screen of Death",
                userReport: "My computer keeps crashing with a blue screen. It happens randomly - sometimes during work, sometimes when just browsing.",
                userInfo: {
                    device: "Desktop PC",
                    age: "4 years old",
                    lastWorked: "Intermittently",
                    changes: "New RAM installed last week"
                },
                question: "Given that new RAM was installed, what's the most logical theory?",
                correctStep: 2,
                options: [
                    { text: "The hard drive is failing", step: 2 },
                    { text: "The new RAM is defective or incompatible", step: 2 },
                    { text: "Windows needs to be reinstalled", step: 4 },
                    { text: "The power supply is bad", step: 2 }
                ],
                correctIndex: 1,
                explanation: "The timing is key - BSODs started after new RAM was installed. The most logical theory considers recent changes. This is 'questioning the obvious' - what changed right before the problem started?",
                methodologyNote: "Step 2: Establish a theory - Consider recent changes! 'What was different before the problem started?' is a key diagnostic question."
            },
            {
                id: 6,
                difficulty: "hard",
                title: "Intermittent Connection Drops",
                userReport: "My VPN keeps disconnecting randomly throughout the day. It's really frustrating because I lose my work connections.",
                userInfo: {
                    device: "Laptop (Wi-Fi)",
                    age: "2 years old",
                    lastWorked: "Works then drops",
                    changes: "Started working from home recently"
                },
                question: "You've confirmed the issue and tested multiple theories. VPN software is fine, but Wi-Fi signal strength fluctuates. You've identified the root cause is interference from other networks. What's NEXT?",
                correctStep: 5,
                options: [
                    { text: "Document the findings and close the ticket", step: 6 },
                    { text: "Verify the fix works and implement preventive measures (change Wi-Fi channel)", step: 5 },
                    { text: "Establish a new theory", step: 2 },
                    { text: "Question the user about their home network", step: 1 }
                ],
                correctIndex: 1,
                explanation: "After implementing the fix (changing Wi-Fi channel), you need to verify full system functionality AND implement preventive measures. This ensures the solution works and the problem won't recur.",
                methodologyNote: "Step 5: Verify full system functionality and implement preventive measures - Don't just fix it, make sure it stays fixed!"
            },
            {
                id: 7,
                difficulty: "hard",
                title: "Application Crash",
                userReport: "The accounting software crashes every time I try to generate the monthly report. It worked fine last month.",
                userInfo: {
                    device: "Desktop PC",
                    age: "1 year old",
                    lastWorked: "Last month",
                    changes: "Software was updated last week"
                },
                question: "You've successfully fixed the issue by rolling back the software update. What should you do NOW?",
                correctStep: 6,
                options: [
                    { text: "Document the problem, solution, and inform the software vendor", step: 6 },
                    { text: "Test other theories", step: 3 },
                    { text: "Install the update again to see if it crashes", step: 3 },
                    { text: "Question the user about other issues", step: 1 }
                ],
                correctIndex: 0,
                explanation: "After verifying the fix works, the final step is documentation. Record the problem, cause, solution, and any additional actions (like reporting to the vendor). This helps future troubleshooting.",
                methodologyNote: "Step 6: Document findings, actions, and outcomes - This helps build a knowledge base for future issues and ensures accountability."
            },
            {
                id: 8,
                difficulty: "easy",
                title: "No Sound",
                userReport: "My computer speakers aren't working. I can't hear anything - no system sounds, no videos, nothing.",
                userInfo: {
                    device: "Desktop PC",
                    age: "2 years old",
                    lastWorked: "Last week",
                    changes: "None"
                },
                question: "What should you check FIRST?",
                correctStep: 1,
                options: [
                    { text: "Replace the speakers with new ones", step: 4 },
                    { text: "Reinstall audio drivers", step: 4 },
                    { text: "Check if speakers are plugged in and volume isn't muted", step: 1 },
                    { text: "Run Windows troubleshooter", step: 3 }
                ],
                correctIndex: 2,
                explanation: "Always start with the obvious! Check physical connections and basic settings first. Is it plugged in? Is volume muted? These simple checks often solve the problem without any technical intervention.",
                methodologyNote: "Step 1: Identify the problem - Always check the obvious first. Physical connections and basic settings resolve many issues."
            },
            {
                id: 9,
                difficulty: "medium",
                title: "Email Not Syncing",
                userReport: "My email stopped syncing on my phone. I can see old emails but no new ones are coming through. Email works fine on my computer.",
                userInfo: {
                    device: "Smartphone",
                    age: "1 year old",
                    lastWorked: "Yesterday",
                    changes: "Changed email password yesterday"
                },
                question: "The user mentions they changed their email password. What's the most likely theory?",
                correctStep: 2,
                options: [
                    { text: "The email server is down", step: 2 },
                    { text: "The phone needs a factory reset", step: 4 },
                    { text: "The phone's email app needs the new password", step: 2 },
                    { text: "The phone has a hardware defect", step: 2 }
                ],
                correctIndex: 2,
                explanation: "The key information is that the password was just changed. Since email works on the computer (with the new password), the phone app likely still has the old password stored. This is a classic case of correlating the problem with recent changes.",
                methodologyNote: "Step 2: Establish a theory - Always ask about recent changes. The timing of problems often points directly to the cause."
            },
            {
                id: 10,
                difficulty: "hard",
                title: "Multiple System Failures",
                userReport: "Several computers in our department stopped working after a power outage. Some won't boot, others boot but freeze.",
                userInfo: {
                    device: "Multiple Desktop PCs",
                    age: "Various",
                    lastWorked: "Before power outage",
                    changes: "Power outage occurred"
                },
                question: "After fixing the immediate issues (replacing surge-damaged components), what's the most important PREVENTIVE measure?",
                correctStep: 5,
                options: [
                    { text: "Document each computer's issues separately", step: 6 },
                    { text: "Question users about what they were doing during the outage", step: 1 },
                    { text: "Install UPS (battery backup) systems to prevent future damage", step: 5 },
                    { text: "Establish new theories about other possible damage", step: 2 }
                ],
                correctIndex: 2,
                explanation: "Step 5 includes implementing PREVENTIVE measures. Installing UPS systems prevents this problem from recurring during future power outages. Prevention is a crucial but often overlooked part of troubleshooting.",
                methodologyNote: "Step 5: Implement preventive measures - Don't just fix the immediate problem; prevent it from happening again!"
            }
        ];

        // State
        let currentScenario = 0;
        let userAnswers = new Array(scenarios.length).fill(null);
        let answeredScenarios = new Set();

        // Initialize
        function init() {
            renderScenarioNav();
            loadScenario(0);
        }

        function renderScenarioNav() {
            const container = document.getElementById('scenarioNav');
            container.innerHTML = scenarios.map((_, i) =>
                `<div class="nav-dot ${i === 0 ? 'current' : ''}" onclick="goToScenario(${i})"></div>`
            ).join('');
        }

        function updateScenarioNav() {
            document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                dot.classList.remove('current', 'answered', 'wrong');
                if (i === currentScenario) dot.classList.add('current');
                if (userAnswers[i] !== null) {
                    dot.classList.add(userAnswers[i] === scenarios[i].correctIndex ? 'answered' : 'wrong');
                }
            });
        }

        function loadScenario(index) {
            currentScenario = index;
            const scenario = scenarios[index];

            // Update methodology step highlight
            document.querySelectorAll('.step-badge').forEach(badge => {
                badge.classList.remove('active');
                if (parseInt(badge.dataset.step) === scenario.correctStep) {
                    badge.classList.add('active');
                }
            });

            // Update progress
            document.getElementById('progressLabel').textContent = `Scenario ${index + 1} of ${scenarios.length}`;
            document.getElementById('progressFill').style.width = `${((index + 1) / scenarios.length) * 100}%`;

            const correct = userAnswers.filter((a, i) => a === scenarios[i].correctIndex).length;
            const answered = answeredScenarios.size;
            document.getElementById('scoreLabel').textContent = `Score: ${correct}/${answered}`;

            // Render scenario
            const panel = document.getElementById('scenarioPanel');
            panel.innerHTML = `
                <div class="scenario-header">
                    <h2>Scenario ${index + 1}: ${scenario.title}</h2>
                    <span class="scenario-badge badge-${scenario.difficulty}">${scenario.difficulty.toUpperCase()}</span>
                </div>

                <div class="user-report">
                    <h4>👤 User Report</h4>
                    <p>"${scenario.userReport}"</p>
                    <div class="user-info">
                        <div class="info-item"><span class="label">Device:</span> <span class="value">${scenario.userInfo.device}</span></div>
                        <div class="info-item"><span class="label">Age:</span> <span class="value">${scenario.userInfo.age}</span></div>
                        <div class="info-item"><span class="label">Last Worked:</span> <span class="value">${scenario.userInfo.lastWorked}</span></div>
                        <div class="info-item"><span class="label">Recent Changes:</span> <span class="value">${scenario.userInfo.changes}</span></div>
                    </div>
                </div>

                <div class="question-section">
                    <h3>🤔 ${scenario.question}</h3>
                    <div class="answer-options">
                        ${scenario.options.map((opt, i) => `
                            <div class="answer-option ${userAnswers[index] === i ? 'selected' : ''}"
                                 onclick="selectAnswer(${i})" data-index="${i}">
                                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                                <span class="option-text">${opt.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="explanation-box" id="explanationBox">
                    <h4 id="explanationTitle">Explanation</h4>
                    <p>${scenario.explanation}</p>
                    <div class="methodology-highlight">
                        <strong>${scenario.methodologyNote}</strong>
                    </div>
                </div>
            `;

            // Update buttons
            const isAnswered = answeredScenarios.has(index);
            document.getElementById('submitBtn').style.display = isAnswered ? 'none' : 'inline-block';
            document.getElementById('submitBtn').disabled = userAnswers[index] === null;

            if (isAnswered) {
                showExplanation();
                const isLast = index === scenarios.length - 1;
                const allAnswered = answeredScenarios.size === scenarios.length;
                document.getElementById('nextBtn').textContent = (isLast && allAnswered) ? 'View Results' : 'Next Scenario';
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                document.getElementById('nextBtn').style.display = 'none';
            }

            updateScenarioNav();
        }

        function selectAnswer(index) {
            if (answeredScenarios.has(currentScenario)) return;

            userAnswers[currentScenario] = index;

            document.querySelectorAll('.answer-option').forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) opt.classList.add('selected');
            });

            document.getElementById('submitBtn').disabled = false;
        }

        function submitAnswer() {
            if (userAnswers[currentScenario] === null) return;

            answeredScenarios.add(currentScenario);
            showExplanation();

            // Update buttons
            document.getElementById('submitBtn').style.display = 'none';
            const isLast = currentScenario === scenarios.length - 1;
            const allAnswered = answeredScenarios.size === scenarios.length;
            document.getElementById('nextBtn').textContent = (isLast && allAnswered) ? 'View Results' : 'Next Scenario';
            document.getElementById('nextBtn').style.display = 'inline-block';

            // Update score
            const correct = userAnswers.filter((a, i) => a === scenarios[i].correctIndex).length;
            document.getElementById('scoreLabel').textContent = `Score: ${correct}/${answeredScenarios.size}`;

            updateScenarioNav();
        }

        function showExplanation() {
            const scenario = scenarios[currentScenario];
            const userAnswer = userAnswers[currentScenario];
            const isCorrect = userAnswer === scenario.correctIndex;

            // Highlight options
            document.querySelectorAll('.answer-option').forEach((opt, i) => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                if (i === scenario.correctIndex) {
                    opt.classList.add('correct');
                } else if (i === userAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            // Show explanation
            const expBox = document.getElementById('explanationBox');
            expBox.classList.add('show');
            expBox.classList.remove('correct-exp', 'incorrect-exp');
            expBox.classList.add(isCorrect ? 'correct-exp' : 'incorrect-exp');
            document.getElementById('explanationTitle').textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect';
        }

        function nextScenario() {
            const allAnswered = answeredScenarios.size === scenarios.length;
            const isLast = currentScenario === scenarios.length - 1;

            if (isLast && allAnswered) {
                showResults();
            } else {
                loadScenario(currentScenario + 1);
            }
        }

        function goToScenario(index) {
            loadScenario(index);
        }

        function showResults() {
            document.getElementById('scenarioPanel').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';

            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.classList.add('show');

            const correct = userAnswers.filter((a, i) => a === scenarios[i].correctIndex).length;
            const percentage = Math.round((correct / scenarios.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('resultsScore').textContent = `${percentage}%`;
            document.getElementById('resultsScore').className = `results-score ${passed ? 'passed' : 'failed'}`;
            document.getElementById('resultsMessage').textContent = passed ?
                'Excellent Troubleshooting Skills!' : 'Review the Methodology!';
            document.getElementById('resultsDetails').textContent =
                `You answered ${correct} out of ${scenarios.length} scenarios correctly. (70% required to pass)`;

            if (passed) {
                saveProgress(percentage);
            }
        }

        function reviewScenarios() {
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('scenarioPanel').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'flex';
            loadScenario(0);
        }

        function retakeLab() {
            currentScenario = 0;
            userAnswers = new Array(scenarios.length).fill(null);
            answeredScenarios = new Set();

            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('scenarioPanel').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'flex';

            renderScenarioNav();
            loadScenario(0);
        }

        function saveProgress(percentage) {
            try {
                const progressKey = 'aplus-core1-progress';
                let progress = JSON.parse(localStorage.getItem(progressKey) || '{}');
                if (!progress.labs) progress.labs = {};

                progress.labs['troubleshooting-flowchart'] = {
                    completed: true,
                    score: percentage,
                    lastAttempt: new Date().toISOString()
                };

                localStorage.setItem(progressKey, JSON.stringify(progress));
            } catch (e) {
                console.log('Could not save progress:', e);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
