    <style>
        /* ── Base layout: dark forge theme with orange accent ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; }
        .page-header { padding: 15px 30px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(251,146,60,0.2); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #fb923c; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .page-header a:hover { color: #fdba74; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
        .quiz-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
        #prep-container { width: 100%; max-width: 800px; }

        /* ── Question type badges: color-coded by type ── */
        .q-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .q-badge.mc { background: rgba(251,146,60,0.2); color: #fb923c; }
        .q-badge.gui { background: rgba(34,211,238,0.2); color: #22d3ee; }
        .q-badge.terminal { background: rgba(74,222,128,0.2); color: #4ade80; }
        /* ── Selected state for MC options ── */
        .quiz-option.selected { border-color: #60a5fa !important; background: rgba(96,165,250,0.15) !important; opacity: 1 !important; }

        /* ── GUI mockup frame: simulates a desktop window ── */
        .mockup-frame { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; margin: 15px 0; user-select: none; }
        .mockup-titlebar { background: #0f172a; padding: 6px 12px; font-size: 0.7rem; color: #64748b; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .mockup-dots { display: flex; gap: 4px; }
        .mockup-dots span { width: 8px; height: 8px; border-radius: 50%; }

        /* ── I/O panel mockup: groups of clickable port icons ── */
        .io-panel { background: linear-gradient(135deg, #374151, #1f2937); padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: flex-start; }
        .io-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .io-group-label { font-size: 0.55rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
        .io-ports { display: flex; gap: 4px; }
        .io-port { cursor: pointer; border: 2px solid transparent; border-radius: 3px; padding: 3px; transition: all 0.2s; }
        .io-port:hover { border-color: #fbbf24; transform: scale(1.1); z-index: 1; }
        .io-port.selected { border-color: #60a5fa; background: rgba(96,165,250,0.15); }

        /* ── BIOS mockup: retro blue BIOS setup screen ── */
        .bios-screen { font-family: 'Courier New', monospace; background: #000080; color: #c0c0c0; font-size: 0.78rem; }
        .bios-hdr { background: #0000aa; padding: 6px 12px; text-align: center; color: #ffff00; font-weight: bold; border-bottom: 1px double #c0c0c0; font-size: 0.85rem; }
        .bios-tabs { display: flex; background: #000060; border-bottom: 1px solid #808080; }
        .bios-tab { padding: 4px 12px; color: #808080; }
        .bios-tab.active { color: #ffffff; background: #000080; }
        .bios-content { padding: 10px; min-height: 120px; }
        .bios-row { display: flex; justify-content: space-between; padding: 5px 8px; cursor: pointer; border: 1px solid transparent; margin: 1px 0; }
        .bios-row:hover { background: rgba(255,255,255,0.08); border-color: #808080; }
        .bios-row.selected { background: #0000aa; border-color: #ffff00; }
        .bios-val { color: #ffffff; }
        .bios-help { font-size: 0.65rem; color: #808080; margin-top: 10px; padding-top: 8px; border-top: 1px solid #404080; text-align: center; }

        /* ── Device Manager mockup: Windows-style tree view ── */
        .devmgr { background: #ffffff; color: #1e1e1e; font-family: 'Segoe UI', sans-serif; font-size: 0.82rem; }
        .devmgr-toolbar { background: #f0f0f0; padding: 4px 8px; border-bottom: 1px solid #d0d0d0; display: flex; gap: 6px; }
        .devmgr-toolbar span { display: inline-block; padding: 2px 6px; border: 1px solid #ccc; border-radius: 2px; font-size: 0.7rem; color: #555; background: #fff; }
        .devmgr-tree { padding: 6px 4px; }
        .devmgr-cat-label { display: flex; align-items: center; gap: 4px; padding: 2px 4px; font-weight: 500; }
        .devmgr-cat-label .arrow { color: #888; font-size: 0.7rem; }
        .devmgr-dev { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 22px; cursor: pointer; border: 1px solid transparent; border-radius: 2px; margin: 1px 0; }
        .devmgr-dev:hover { background: #e5f3ff; border-color: #cce4f7; }
        .devmgr-dev.selected { background: #cce5ff; border-color: #0078d4; }
        .devmgr-warning { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; background: #e8a200; color: #000; font-size: 0.6rem; font-weight: bold; border-radius: 1px; margin-left: 4px; }
        .dev-icon { display: inline-block; width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

        /* ── Disk Management mockup: partition bar view ── */
        .diskmgmt { background: #f0f0f0; color: #1e1e1e; font-family: 'Segoe UI', sans-serif; font-size: 0.8rem; }
        .diskmgmt-toolbar { background: #e8e8e8; padding: 4px 8px; border-bottom: 1px solid #ccc; display: flex; gap: 6px; }
        .diskmgmt-toolbar span { display: inline-block; padding: 2px 6px; border: 1px solid #ccc; border-radius: 2px; font-size: 0.7rem; color: #555; background: #fff; }
        .diskmgmt-body { padding: 8px; }
        .disk-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; padding: 6px 8px; border: 1px solid #ddd; background: #fff; border-radius: 3px; }
        .disk-label { width: 70px; font-size: 0.72rem; color: #555; flex-shrink: 0; }
        .disk-parts { display: flex; flex: 1; gap: 2px; height: 36px; }
        .disk-part { display: flex; align-items: center; justify-content: center; border-radius: 2px; font-size: 0.68rem; font-weight: 500; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; padding: 0 6px; }
        .disk-part:hover { border-color: #0078d4; }
        .disk-part.selected { border-color: #0078d4; box-shadow: 0 0 6px rgba(0,120,212,0.4); }

        /* ── Terminal mockup: dark command prompt ── */
        .terminal-frame { background: #0c0c0c; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin: 15px 0; font-family: 'Consolas', 'Courier New', monospace; }
        .terminal-titlebar { background: #2d2d2d; padding: 5px 12px; font-size: 0.7rem; color: #aaa; display: flex; align-items: center; justify-content: space-between; }
        .terminal-body { padding: 12px; font-size: 0.82rem; color: #ccc; min-height: 80px; }
        .terminal-line { display: flex; align-items: center; margin: 3px 0; }
        .terminal-prompt { color: #c0c0c0; white-space: pre; flex-shrink: 0; }
        .terminal-input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: inherit; flex: 1; caret-color: #fff; }
        .terminal-input::placeholder { color: #555; }
        .terminal-actions { padding: 8px 12px; background: #111; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
        .terminal-btn { padding: 6px 16px; border: 1px solid #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); border-radius: 4px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
        .terminal-btn:hover { background: rgba(74,222,128,0.2); }

        /* ── Next button: appears after answering, advances to next question ── */
        .next-btn { display: none; margin: 15px auto 0; padding: 10px 24px; background: linear-gradient(90deg, #fb923c, #f97316); border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(251,146,60,0.3); }
        .next-btn.visible { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .io-panel { gap: 10px; padding: 12px; }
            .bios-screen, .devmgr, .diskmgmt { font-size: 0.72rem; }
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">A+ Core 1 Prep: Round 1</h1>
    <div role="status" style="background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.4);color:#fbbf24;padding:8px 14px;margin:12px auto;max-width:880px;border-radius:6px;font-size:0.85rem;text-align:center;"><strong>PRACTICE MODE</strong>: this prep-round quiz is for self-paced practice. Answers are visible in page source; not for graded use.</div>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="prep-container"></div>
    </main>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    // A+ Core 1 Prep, Round 1: Full Spectrum (Ch 1-11)
    // Mixed: 4 MC + 3 GUI + 3 Terminal
    // Covers all 11 chapters of CompTIA A+ Core 1 (220-1101)
    // ═══════════════════════════════════════════════════════════════

    const CONFIG = {
        title: 'A+ Core 1 Prep: Round 1',
        subtitle: 'Full Spectrum: Chapters 1\u201311',
        description: '10 mixed questions: multiple choice, GUI simulations, and terminal commands',
        passingScore: 70,
        storageKey: 'aplus-core1-prep-r1',
        achievement: 'forge-core1-prep-round-1',
        moduleId: 'aplus-core1-prep-r1',
        houseId: 'forge'
    };

    const QUESTIONS = [
        // ──────────────────────────────────────────────────────────
        // Q1: MC, M.2 form factors and interfaces (Ch 2)
        // Tests knowledge of NVMe vs SATA M.2 keying differences
        // ──────────────────────────────────────────────────────────
        {
            type: 'mc',
            question: 'A technician is installing an M.2 NVMe SSD into a laptop. The slot on the motherboard has a single notch on the left side (M key). Which statement about M.2 form factors is correct?',
            options: [
                'An M-keyed slot only accepts NVMe drives; a B+M keyed SATA drive will not physically fit',
                'All M.2 drives are interchangeable regardless of keying',
                'M.2 NVMe and M.2 SATA drives use identical protocols but different physical connectors',
                'B+M keyed drives work in M-keyed slots, but NVMe M-keyed drives do not work in B-keyed slots'
            ],
            correct: 3,
            explanation: 'M.2 keying determines physical and protocol compatibility. B+M keyed drives (typically SATA) fit in both B-keyed and M-keyed slots due to having two notches. NVMe drives with only an M key will not fit in a B-keyed slot because the single notch is in the wrong position. An M-keyed slot can accept both M-keyed NVMe and B+M keyed SATA drives physically, though the slot must support the protocol. Review: Chapter 2, Storage Devices and Power Supplies (M.2 form factors, NVMe vs SATA, keying).',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // ──────────────────────────────────────────────────────────
        // Q2: GUI, BIOS boot order: set USB first (Ch 1)
        // Simulates BIOS Boot tab; student must pick Boot Option #1
        // ──────────────────────────────────────────────────────────
        {
            type: 'gui',
            question: 'A technician needs to boot a workstation from a USB drive to run a memory diagnostic tool. In this BIOS/UEFI Boot settings screen, click the option that controls which device boots first.',
            mockup: 'bios-boot-order',
            correctId: 'boot-option-1',
            hotspots: {
                'boot-option-1': 'Boot Option #1 [Hard Drive]',
                'boot-option-2': 'Boot Option #2 [USB Device]',
                'fast-boot': 'Fast Boot [Enabled]',
                'csm-mode': 'CSM / Legacy Mode [Disabled]',
                'network-boot': 'Network Stack [Disabled]'
            },
            explanation: 'Boot Option #1 determines which device the system tries first during POST. To boot from USB, change Boot Option #1 from Hard Drive to USB Device. Fast Boot skips some POST checks for speed. CSM enables legacy BIOS compatibility for older OS installations. Network Stack controls PXE booting. Review: Chapter 1, Motherboards, Processors, and Memory (BIOS/UEFI configuration, boot order, POST sequence).',
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        },
        // ──────────────────────────────────────────────────────────
        // Q3: Terminal, ipconfig /flushdns (Ch 6)
        // DNS cache clearing after a server migration
        // ──────────────────────────────────────────────────────────
        {
            type: 'terminal',
            question: 'After a company migrated its web server to a new IP address, several users still reach the old server. The DNS records have been updated on the server. What command clears the local DNS resolver cache on the affected Windows workstations?',
            prompt: 'C:\\>',
            accepted: ['ipconfig /flushdns'],
            matchMode: 'exact',
            expectedDisplay: 'ipconfig /flushdns',
            explanation: 'ipconfig /flushdns purges the local DNS resolver cache, forcing the machine to query the DNS server for fresh records on the next lookup. Windows caches DNS responses to speed up repeated lookups, but stale entries can cause connectivity issues after server IP changes. After flushing, use nslookup to verify the new IP resolves correctly. Review: Chapter 6, TCP/IP and Wireless (DNS caching, ipconfig switches, name resolution).',
            chapter: 6, chapterTitle: 'TCP/IP and Wireless'
        },
        // ──────────────────────────────────────────────────────────
        // Q4: MC, Power supply connectors (Ch 2)
        // Identifies the correct supplementary power connector for a GPU
        // ──────────────────────────────────────────────────────────
        {
            type: 'mc',
            question: 'A technician is installing a high-end GPU that requires additional power beyond the PCIe slot. The card has an 8-pin and a 6-pin power socket. Which PSU connectors should be used?',
            options: [
                'Two Molex adapters with a Molex-to-PCIe splitter cable',
                'A single 24-pin ATX connector split with an adapter',
                'One PCIe 8-pin (6+2) and one PCIe 6-pin connector from the PSU',
                'Two EPS 12V 4-pin connectors combined with an adapter'
            ],
            correct: 2,
            explanation: 'Modern PSUs include dedicated PCIe power cables in 6-pin and 8-pin (6+2) configurations specifically for graphics cards. The 6+2 design allows the same cable to fit either a 6-pin or 8-pin socket. Molex adapters are a last resort and can be unreliable. The 24-pin ATX powers the motherboard, and EPS 12V powers the CPU. Neither should be repurposed for GPU power. Review: Chapter 2, Storage Devices and Power Supplies (PSU connectors, PCIe power, wattage requirements).',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // ──────────────────────────────────────────────────────────
        // Q5: GUI, Disk Management: initialize unallocated disk (Ch 2)
        // Simulates Windows Disk Management with an uninitialized disk
        // ──────────────────────────────────────────────────────────
        {
            type: 'gui',
            question: 'A technician added a second hard drive to a workstation. In Disk Management, one disk shows as "Not Initialized" with unallocated space. Click on the disk that needs to be initialized before it can be used.',
            mockup: 'disk-management',
            correctId: 'disk1-unalloc',
            hotspots: {
                'disk0-windows': 'Disk 0: Windows (C:), NTFS, Healthy',
                'disk0-recovery': 'Disk 0: Recovery, 450 MB, Healthy',
                'disk1-unalloc': 'Disk 1: Not Initialized, Unallocated',
                'disk0-efi': 'Disk 0: EFI System Partition, 100 MB'
            },
            explanation: 'A new drive appears as "Not Initialized" in Disk Management because it has no partition table. Right-click the disk label and choose "Initialize Disk," then select GPT (for UEFI systems and drives over 2 TB) or MBR (for legacy BIOS). After initialization, create a volume and format it. The existing Disk 0 partitions (Windows, Recovery, EFI) are already healthy. Review: Chapter 2, Storage Devices and Power Supplies (disk initialization, GPT vs MBR, Disk Management).',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // ──────────────────────────────────────────────────────────
        // Q6: Terminal, shutdown /r /t 0 (Ch 9)
        // Remote restart via command line for software troubleshooting
        // ──────────────────────────────────────────────────────────
        {
            type: 'terminal',
            question: 'A remote user reports that their system is unresponsive to some applications after a Windows Update was applied. You have an elevated remote command prompt session. What command immediately restarts the computer?',
            prompt: 'C:\\>',
            accepted: ['shutdown /r /t 0', 'shutdown -r -t 0'],
            matchMode: 'exact',
            expectedDisplay: 'shutdown /r /t 0',
            explanation: 'shutdown /r performs a restart (/r = reboot). The /t 0 flag sets the timeout to zero seconds, causing an immediate restart without the default 30-second countdown. This is essential when administering machines remotely because the default delay can be confusing. Other useful switches: /s for shutdown, /f to force-close applications, /o to boot to Advanced Startup Options. Review: Chapter 9, Software Troubleshooting (shutdown command, Windows recovery, remote administration).',
            chapter: 9, chapterTitle: 'Software Troubleshooting'
        },
        // ──────────────────────────────────────────────────────────
        // Q7: MC, Wireless encryption standards (Ch 6)
        // Distinguishes between WPA2 and WPA3 authentication
        // ──────────────────────────────────────────────────────────
        {
            type: 'mc',
            question: 'A network administrator wants to prevent offline dictionary attacks against the company Wi-Fi password. Which wireless security protocol addresses this specific vulnerability?',
            options: [
                'WPA2-PSK, which uses AES-CCMP encryption to protect the passphrase',
                'WPA2-Enterprise, which uses RADIUS for per-user authentication',
                'WEP with a 128-bit key, which provides sufficient protection against dictionary attacks',
                'WPA3-Personal, which uses SAE (Simultaneous Authentication of Equals) to resist offline attacks'
            ],
            correct: 3,
            explanation: 'WPA3-Personal replaces the WPA2 4-way handshake with SAE (Simultaneous Authentication of Equals), also known as Dragonfly. SAE is a zero-knowledge proof protocol that prevents captured handshakes from being used in offline brute-force or dictionary attacks. WPA2-PSK is vulnerable because the 4-way handshake can be captured and cracked offline. WEP is fundamentally broken. WPA2-Enterprise avoids shared keys but does not solve the protocol-level weakness. Review: Chapter 6, TCP/IP and Wireless (WPA3, SAE, wireless security protocols).',
            chapter: 6, chapterTitle: 'TCP/IP and Wireless'
        },
        // ──────────────────────────────────────────────────────────
        // Q8: GUI, Device Manager: disabled Bluetooth adapter (Ch 10)
        // Student must identify a disabled device indicated by a down arrow
        // ──────────────────────────────────────────────────────────
        {
            type: 'gui',
            question: 'A user reports that their laptop cannot pair with Bluetooth headphones. You open Device Manager and notice one device has a down-arrow icon indicating it is disabled. Click the disabled device that needs to be enabled.',
            mockup: 'devmgr-disabled',
            correctId: 'bt-disabled',
            hotspots: {
                'bt-disabled': 'Intel Wireless Bluetooth (disabled)',
                'wifi-ok': 'Intel Wi-Fi 6 AX200',
                'audio-ok': 'Realtek High Definition Audio',
                'cam-ok': 'Integrated Webcam',
                'touchpad-ok': 'Synaptics SMBus TouchPad'
            },
            explanation: 'A down-arrow icon in Device Manager means the device has been manually disabled. This can happen accidentally via keyboard shortcut, a user disabling it to save battery, or group policy. Right-click the device and select "Enable device" to restore functionality. This is different from a yellow triangle (driver problem) or a red X (device error). Bluetooth is commonly toggled off on laptops, so always check Device Manager when pairing fails. Review: Chapter 10, Mobile Devices (Bluetooth, Device Manager status icons, enabling/disabling hardware).',
            chapter: 10, chapterTitle: 'Mobile Devices'
        },
        // ──────────────────────────────────────────────────────────
        // Q9: Terminal, format fs=ntfs quick (Ch 2)
        // Using format command inside diskpart context for a new volume
        // ──────────────────────────────────────────────────────────
        {
            type: 'terminal',
            question: 'Inside a diskpart session, you have selected a new partition on a secondary drive. What diskpart command would you type to perform a quick NTFS format on the selected volume?',
            prompt: 'DISKPART>',
            accepted: ['format fs=ntfs quick', 'format fs=ntfs label="data" quick', 'format fs=ntfs label=data quick'],
            matchMode: 'exact',
            expectedDisplay: 'format fs=ntfs quick',
            explanation: 'Within diskpart, the "format" command formats the currently selected volume. "fs=ntfs" specifies the NTFS file system (standard for Windows data drives). "quick" performs a quick format that writes a new file table without scanning every sector, completing in seconds rather than hours for large drives. A full format also checks for bad sectors. After formatting, use "assign" to give the volume a drive letter. Review: Chapter 2, Storage Devices and Power Supplies (diskpart, formatting, NTFS, file systems).',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // ──────────────────────────────────────────────────────────
        // Q10: MC, Virtualization and hypervisors (Ch 7)
        // Distinguishes Type 1 vs Type 2 hypervisors
        // ──────────────────────────────────────────────────────────
        {
            type: 'mc',
            question: 'A company is setting up a server to run multiple virtual machines for development and testing. They want the best performance and direct hardware access for the VMs. Which type of hypervisor should they use?',
            options: [
                'Type 2 hypervisor like VirtualBox, which runs inside the host OS for easier management',
                'A container engine like Docker, which provides full hardware virtualization',
                'Type 1 bare-metal hypervisor like VMware ESXi, which runs directly on hardware without a host OS',
                'Windows Sandbox, which provides persistent virtual environments for each developer'
            ],
            correct: 2,
            explanation: 'Type 1 (bare-metal) hypervisors like VMware ESXi, Microsoft Hyper-V Server, and Citrix XenServer run directly on hardware with no host OS, providing the best performance and direct resource allocation for VMs. Type 2 hypervisors (VirtualBox, VMware Workstation) run on top of a host OS, adding overhead. Docker uses OS-level containerization, not full hardware virtualization. Windows Sandbox is a lightweight, non-persistent isolated environment. Review: Chapter 7, Virtualization and Cloud (Type 1 vs Type 2 hypervisors, VM resource management).',
            chapter: 7, chapterTitle: 'Virtualization and Cloud'
        }
    ];

    // ── State: tracks current question, answers, score, and shuffled order ──
    let state = { current: 0, answers: [], score: 0, shuffled: [] };
    const container = document.getElementById('prep-container');

    // Fisher-Yates shuffle: randomizes question/option order each attempt
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ── Start Screen: shows quiz title, type badges, and start button ──
    function showStart() {
        container.innerHTML = `
        <div class="quiz-engine theme-forge">
            <div class="quiz-header" style="text-align:center;margin-bottom:0;padding-bottom:30px;">
                <h1 class="quiz-title">${CONFIG.title}</h1>
                <p style="color:#a8a29e;margin-bottom:8px;">${CONFIG.subtitle}</p>
                <p style="color:#bbb;font-size:0.95rem;">${CONFIG.description}</p>
                <div style="display:flex;justify-content:center;gap:10px;margin-top:18px;">
                    <span class="q-badge mc">4 MC</span>
                    <span class="q-badge gui">3 GUI</span>
                    <span class="q-badge terminal">3 Terminal</span>
                </div>
                <p style="color:#78716c;font-size:0.8rem;margin-top:12px;">Passing score: ${CONFIG.passingScore}%</p>
                <button class="quiz-btn quiz-retry-btn" style="margin-top:25px;" onclick="startQuiz()">Start Round</button>
            </div>
        </div>`;
    }

    // ── startQuiz: shuffles questions and MC options, resets state ──
    function startQuiz() {
        state.shuffled = shuffle(QUESTIONS.map(q => Object.assign({}, q)));
        // Shuffle MC options while tracking the correct answer's new index
        state.shuffled.forEach(q => {
            if (q.type === 'mc') {
                const correctText = q.options[q.correct];
                q.shuffledOptions = shuffle([...q.options]);
                q.shuffledCorrect = q.shuffledOptions.indexOf(correctText);
            }
        });
        state.current = 0;
        state.answers = [];
        state.score = 0;
        showQuestion();
    }

    // ── Question Screen: renders progress bar, type badge, and question body ──
    function showQuestion() {
        if (state.current >= state.shuffled.length) { endQuiz(); return; }
        const q = state.shuffled[state.current];
        const num = state.current + 1;
        const total = state.shuffled.length;
        const pct = ((state.current) / total * 100).toFixed(0);
        const typeLabel = q.type === 'mc' ? 'Multiple Choice' : q.type === 'gui' ? 'GUI Simulation' : 'Terminal Command';

        // Render the appropriate question body based on type
        let qBody = '';
        if (q.type === 'mc') qBody = renderMC(q);
        else if (q.type === 'gui') qBody = renderGUI(q);
        else qBody = renderTerminal(q);

        container.innerHTML = `
        <div class="quiz-engine theme-forge">
            <div class="quiz-header">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span style="color:#78716c;font-size:0.85rem;">Question ${num} of ${total}</span>
                    <span class="q-badge ${q.type}">${typeLabel}</span>
                </div>
                <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="quiz-body" style="animation:fadeIn 0.3s;">
                <p class="question-text">${q.question}</p>
                ${qBody}
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next \u2192</button>
            </div>
        </div>`;
        // Auto-focus terminal input for keyboard-first interaction
        const inp = document.querySelector('.terminal-input');
        if (inp) setTimeout(() => inp.focus(), 100);
    }

    // ── renderMC: builds clickable A/B/C/D option buttons ──
    function renderMC(q) {
        const opts = q.shuffledOptions || q.options;
        const letters = ['A','B','C','D'];
        return '<div class="quiz-options">' + opts.map((opt, i) =>
            '<button class="quiz-option" onclick="selectMC(' + i + ')" id="mc-opt-' + i + '">' +
            '<span class="option-letter">' + letters[i] + '</span>' +
            '<span class="option-text">' + opt + '</span></button>'
        ).join('') + '</div>';
    }

    // ── renderGUI: wraps mockup in a window frame with titlebar ──
    function renderGUI(q) {
        let mockupHTML = '';
        // Select the appropriate mockup builder based on mockup ID
        if (q.mockup === 'bios-boot-order') mockupHTML = buildBIOSBootOrder();
        else if (q.mockup === 'disk-management') mockupHTML = buildDiskManagement();
        else if (q.mockup === 'devmgr-disabled') mockupHTML = buildDevMgrDisabled();
        // Map mockup IDs to window titles
        const titleMap = {
            'bios-boot-order': 'AMI BIOS Setup Utility',
            'disk-management': 'Disk Management',
            'devmgr-disabled': 'Device Manager'
        };
        return '<div class="mockup-frame"><div class="mockup-titlebar">' +
            '<div class="mockup-dots"><span style="background:#ef4444"></span><span style="background:#eab308"></span><span style="background:#22c55e"></span></div>' +
            '<span>' + (titleMap[q.mockup] || '') + '</span></div><div class="mockup-body">' + mockupHTML + '</div></div>';
    }

    // ── buildBIOSBootOrder: BIOS Boot tab with boot priority options ──
    function buildBIOSBootOrder() {
        function row(id, label, val, style) {
            return '<div class="bios-row" onclick="selectGUI(\'' + id + '\',this)"><span>' + label + '</span><span class="bios-val"' + (style ? ' style="'+style+'"' : '') + '>[' + val + ']</span></div>';
        }
        return '<div class="bios-screen">' +
            '<div class="bios-hdr">AMI BIOS Setup Utility v2.21</div>' +
            '<div class="bios-tabs"><span class="bios-tab">Main</span><span class="bios-tab">Advanced</span><span class="bios-tab">Security</span><span class="bios-tab active">Boot</span><span class="bios-tab">Save &amp; Exit</span></div>' +
            '<div class="bios-content">' +
            row('boot-option-1', 'Boot Option #1', 'Hard Drive') +
            row('boot-option-2', 'Boot Option #2', 'USB Device') +
            row('fast-boot', 'Fast Boot', 'Enabled') +
            row('csm-mode', 'CSM / Legacy Mode', 'Disabled') +
            row('network-boot', 'Network Stack', 'Disabled') +
            '<div class="bios-help">\u2190 \u2192 Select Tab | \u2191 \u2193 Select Item | Enter Change Value | F10 Save &amp; Exit</div>' +
            '</div></div>';
    }

    // ── buildDiskManagement: Windows Disk Management with initialized and uninitialized disks ──
    function buildDiskManagement() {
        function part(id, label, color, width) {
            return '<div class="disk-part" onclick="selectGUI(\'' + id + '\',this)" style="background:' + color + ';flex:' + width + ';color:#fff;">' + label + '</div>';
        }
        return '<div class="diskmgmt">' +
            '<div class="diskmgmt-toolbar"><span>File</span><span>Action</span><span>View</span><span>Help</span></div>' +
            '<div class="diskmgmt-body">' +
            // Disk 0: healthy system drive with EFI, Windows, and Recovery partitions
            '<div class="disk-row"><span class="disk-label">Disk 0<br>500 GB<br>Online</span><div class="disk-parts">' +
            part('disk0-efi', 'EFI (100 MB)', '#5b7a9d', '0.5') +
            part('disk0-windows', 'Windows (C:) NTFS', '#3b82f6', '8') +
            part('disk0-recovery', 'Recovery (450 MB)', '#6b7280', '0.5') +
            '</div></div>' +
            // Disk 1: new uninitialized drive, this is the correct answer
            '<div class="disk-row"><span class="disk-label">Disk 1<br>1 TB<br>Not Init.</span><div class="disk-parts">' +
            part('disk1-unalloc', 'Unallocated', '#374151', '9') +
            '</div></div>' +
            '</div></div>';
    }

    // ── buildDevMgrDisabled: Device Manager tree with one disabled device (down-arrow) ──
    function buildDevMgrDisabled() {
        function dev(id, icon, color, name, disabled) {
            // disabled parameter adds a down-arrow indicator
            return '<div class="devmgr-dev" onclick="selectGUI(\'' + id + '\',this)">' +
                '<span class="dev-icon" style="background:' + color + '"></span> ' + name +
                (disabled ? ' <span style="color:#888;font-size:0.65rem;">\u25BC</span>' : '') + '</div>';
        }
        function cat(label, devices) {
            return '<div style="padding:1px 0"><div class="devmgr-cat-label"><span class="arrow">\u25BC</span> ' + label + '</div>' + devices + '</div>';
        }
        return '<div class="devmgr">' +
            '<div class="devmgr-toolbar"><span>File</span><span>Action</span><span>View</span><span>Help</span></div>' +
            '<div class="devmgr-tree">' +
            cat('Bluetooth', dev('bt-disabled','','#2563eb','Intel Wireless Bluetooth', true)) +
            cat('Network adapters', dev('wifi-ok','','#4a90d9','Intel Wi-Fi 6 AX200')) +
            cat('Sound, video and game controllers', dev('audio-ok','','#e67e22','Realtek High Definition Audio')) +
            cat('Cameras', dev('cam-ok','','#22c55e','Integrated Webcam')) +
            cat('Human Interface Devices', dev('touchpad-ok','','#888','Synaptics SMBus TouchPad')) +
            '</div></div>';
    }

    // ── renderTerminal: builds command prompt with text input and execute button ──
    function renderTerminal(q) {
        return '<div class="terminal-frame">' +
            '<div class="terminal-titlebar"><span>Administrator: Command Prompt</span></div>' +
            '<div class="terminal-body">' +
            '<div class="terminal-line" style="color:#888;">Microsoft Windows [Version 10.0.19045]</div>' +
            '<div class="terminal-line" style="color:#888;margin-bottom:8px;">(c) Microsoft Corporation. All rights reserved.</div>' +
            '<div class="terminal-line"><span class="terminal-prompt">' + q.prompt + ' </span>' +
            '<input class="terminal-input" id="termInput" type="text" placeholder="Type command here..." autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')submitTerminal()"></div>' +
            '</div><div class="terminal-actions"><button class="terminal-btn" onclick="submitTerminal()">Execute \u21B5</button></div></div>';
    }

    // ── Handlers ──

    // selectMC: locks in the MC answer, highlights selection, shows next button
    function selectMC(idx) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        var correct = q.shuffledCorrect !== undefined ? q.shuffledCorrect : q.correct;
        state.answers[state.current] = { type: 'mc', selected: idx, correct: idx === correct };
        if (idx === correct) state.score++;
        document.querySelectorAll('.quiz-option').forEach(function(el, i) {
            el.disabled = true;
            if (i === idx) el.classList.add('selected');
        });
        document.getElementById('nextBtn').classList.add('visible');
    }

    // selectGUI: locks in the GUI hotspot answer, disables further clicks
    function selectGUI(hotspotId, el) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        state.answers[state.current] = { type: 'gui', selectedId: hotspotId, correct: hotspotId === q.correctId };
        if (hotspotId === q.correctId) state.score++;
        // Disable all clickable elements in the mockup after selection
        var body = document.querySelector('.mockup-body');
        if (body) body.querySelectorAll('[onclick]').forEach(function(e) { e.style.pointerEvents = 'none'; });
        if (el) el.classList.add('selected');
        document.getElementById('nextBtn').classList.add('visible');
    }

    // submitTerminal: compares typed command against accepted answers (case-insensitive)
    function submitTerminal() {
        if (state.answers[state.current] !== undefined) return;
        var input = document.getElementById('termInput');
        if (!input) return;
        var val = input.value.trim();
        if (!val) return;
        var q = state.shuffled[state.current];
        var isCorrect = q.accepted.some(function(a) {
            return val.toLowerCase() === a.toLowerCase();
        });
        state.answers[state.current] = { type: 'terminal', input: val, correct: isCorrect };
        if (isCorrect) state.score++;
        input.disabled = true;
        input.style.color = isCorrect ? '#4ade80' : '#ef4444';
        document.querySelector('.terminal-btn').disabled = true;
        document.getElementById('nextBtn').classList.add('visible');
    }

    // nextQuestion: advances to next question or triggers endQuiz
    function nextQuestion() { state.current++; showQuestion(); }

    // endQuiz: calculates final score and triggers results/progress saving
    function endQuiz() {
        var total = state.shuffled.length;
        var pct = Math.round((state.score / total) * 100);
        var passed = pct >= CONFIG.passingScore;
        saveProgress(pct, state.score, total);
        showResults(pct, passed, total);
    }

    // ── Results Screen: shows score circle, per-type breakdown, and actions ──
    function showResults(pct, passed, total) {
        // Calculate per-type accuracy for the stats breakdown
        var mc = state.answers.filter(function(a) { return a && a.type === 'mc'; });
        var gui = state.answers.filter(function(a) { return a && a.type === 'gui'; });
        var term = state.answers.filter(function(a) { return a && a.type === 'terminal'; });
        var mcOk = mc.filter(function(a) { return a.correct; }).length;
        var guiOk = gui.filter(function(a) { return a.correct; }).length;
        var termOk = term.filter(function(a) { return a.correct; }).length;

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-results ' + (passed ? 'passed' : 'failed') + '">' +
            '<div class="results-header"><h2 class="results-title">' + (passed ? 'Round Complete!' : 'Keep Practicing') + '</h2></div>' +
            '<div class="results-score"><div class="score-circle ' + (passed ? 'passed' : 'failed') + '">' +
            '<span class="score-percentage">' + pct + '%</span><span class="score-fraction">' + state.score + '/' + total + '</span></div></div>' +
            '<p class="results-message">' + (passed ? 'Solid foundation across all Core 1 domains. Ready for Round 2!' : 'You need ' + CONFIG.passingScore + '% to pass. Review the explanations and try again.') + '</p>' +
            '<div class="results-stats">' +
            '<div class="stat"><span class="stat-value">' + mcOk + '/' + mc.length + '</span><span class="stat-label">MC</span></div>' +
            '<div class="stat"><span class="stat-value">' + guiOk + '/' + gui.length + '</span><span class="stat-label">GUI</span></div>' +
            '<div class="stat"><span class="stat-value">' + termOk + '/' + term.length + '</span><span class="stat-label">Terminal</span></div></div>' +
            (passed ? '<div class="results-achievement"><strong>Achievement Unlocked:</strong> Core 1 Prep: Round 1</div>' : '') +
            '<div class="results-actions">' +
            '<button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="showReview()">Review Answers</button></div>' +
            '</div></div>';
    }

    // ── Review Screen: shows each question with correct/incorrect feedback and explanations ──
    function showReview() {
        var cards = '';
        state.shuffled.forEach(function(q, i) {
            var ans = state.answers[i] || {};
            var ok = ans.correct;
            var statusClass = ok ? 'correct' : 'incorrect';
            var typeLabel = q.type === 'mc' ? 'MC' : q.type === 'gui' ? 'GUI' : 'Terminal';
            var body = '';

            if (q.type === 'mc') {
                // Show all options with correct highlighted green, wrong selection highlighted red
                var opts = q.shuffledOptions || q.options;
                var correctIdx = q.shuffledCorrect !== undefined ? q.shuffledCorrect : q.correct;
                body = '<div class="review-options">' + opts.map(function(opt, j) {
                    var cls = '';
                    if (j === correctIdx) cls = 'correct-answer';
                    else if (j === ans.selected) cls = 'wrong-selected';
                    return '<div class="review-option ' + cls + '">' + ['A','B','C','D'][j] + '. ' + opt + '</div>';
                }).join('') + '</div>';
            } else if (q.type === 'gui') {
                // Show what was clicked vs what was correct
                var selectedName = q.hotspots[ans.selectedId] || 'No selection';
                var correctName = q.hotspots[q.correctId];
                body = '<div style="padding:10px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:0.9rem;">' +
                    '<p>You clicked: <strong style="color:' + (ok ? '#2ed573' : '#ff4757') + '">' + selectedName + '</strong></p>' +
                    (!ok ? '<p>Correct answer: <strong style="color:#2ed573">' + correctName + '</strong></p>' : '') + '</div>';
            } else {
                // Show typed command vs expected command
                body = '<div class="terminal-frame" style="margin:10px 0;"><div class="terminal-body" style="padding:8px 12px;min-height:auto;">' +
                    '<div>You typed: <span style="color:' + (ok ? '#4ade80' : '#ef4444') + '">' + (ans.input || '(empty)') + '</span></div>' +
                    (!ok ? '<div>Correct: <span style="color:#4ade80">' + q.expectedDisplay + '</span></div>' : '') +
                    '</div></div>';
            }

            cards += '<div class="review-item ' + statusClass + '">' +
                '<div class="review-header"><span class="review-num">Q' + (i+1) + '</span>' +
                '<span class="q-badge ' + q.type + '" style="font-size:0.65rem;padding:2px 8px;">' + typeLabel + '</span>' +
                '<span class="review-status">' + (ok ? '\u2713' : '\u2717') + '</span></div>' +
                '<p class="review-question">' + q.question + '</p>' + body +
                '<div class="review-explanation">' + q.explanation + '</div></div>';
        });

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-review">' +
            '<div class="review-header-bar"><h2>Review: Round 1</h2>' +
            '<button class="quiz-btn quiz-review-btn" onclick="endQuiz()">Back to Results</button></div>' +
            '<div class="review-list">' + cards + '</div>' +
            '<div class="review-footer"><button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="endQuiz()">Back to Results</button></div>' +
            '</div></div>';
    }

    // ── Save Progress: persists score to localStorage and fires ModuleProgress/Achievement ──
    function saveProgress(pct, score, total) {
        try {
            var key = CONFIG.storageKey;
            var data = { completed: true, score: pct, correct: score, total: total, completedAt: new Date().toISOString() };
            localStorage.setItem(key, JSON.stringify(data));
            // Also save under the global hexworth_progress object for dashboard aggregation
            var progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
            if (!progress.forge) progress.forge = {};
            progress.forge[key] = data;
            localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            // Fire platform-level progress tracking and achievement unlock
            if (typeof ModuleProgress !== 'undefined') ModuleProgress.completeQuiz(CONFIG.moduleId, CONFIG.houseId, pct);
            if (pct >= CONFIG.passingScore && typeof AchievementManager !== 'undefined') AchievementManager.unlock(CONFIG.achievement);
        } catch (e) { console.warn('[Prep] Save failed:', e); }
    }

    // Initialize: show the start screen on page load
    showStart();
    </script>

    <hex-ai-button mission-id="forge-aplus-core1-prep-round-1" house="forge"></hex-ai-button>

</body>
