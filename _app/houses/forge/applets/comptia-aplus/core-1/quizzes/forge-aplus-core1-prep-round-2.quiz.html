    <title>A+ Core 1 Prep: Round 2 - Forge House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; }
        .page-header { padding: 15px 30px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(251,146,60,0.2); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #fb923c; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .page-header a:hover { color: #fdba74; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
        .quiz-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
        #prep-container { width: 100%; max-width: 800px; }

        .q-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .q-badge.mc { background: rgba(251,146,60,0.2); color: #fb923c; }
        .q-badge.gui { background: rgba(34,211,238,0.2); color: #22d3ee; }
        .q-badge.terminal { background: rgba(74,222,128,0.2); color: #4ade80; }
        .quiz-option.selected { border-color: #60a5fa !important; background: rgba(96,165,250,0.15) !important; opacity: 1 !important; }

        .mockup-frame { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; margin: 15px 0; user-select: none; }
        .mockup-titlebar { background: #0f172a; padding: 6px 12px; font-size: 0.7rem; color: #64748b; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .mockup-dots { display: flex; gap: 4px; }
        .mockup-dots span { width: 8px; height: 8px; border-radius: 50%; }

        .io-panel { background: linear-gradient(135deg, #374151, #1f2937); padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: flex-start; }
        .io-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .io-group-label { font-size: 0.55rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
        .io-ports { display: flex; gap: 4px; }
        .io-port { cursor: pointer; border: 2px solid transparent; border-radius: 3px; padding: 3px; transition: all 0.2s; }
        .io-port:hover { border-color: #fbbf24; transform: scale(1.1); z-index: 1; }
        .io-port.selected { border-color: #60a5fa; background: rgba(96,165,250,0.15); }

        .bios-screen { font-family: 'Courier New', monospace; background: #000080; color: #c0c0c0; font-size: 0.78rem; }
        .bios-hdr { background: #0000aa; padding: 6px 12px; text-align: center; color: #ffff00; font-weight: bold; border-bottom: 1px double #c0c0c0; font-size: 0.85rem; }
        .bios-tabs { display: flex; background: #000060; border-bottom: 1px solid #808080; }
        .bios-tab { padding: 4px 12px; color: #808080; }
        .bios-tab.active { color: #ffffff; background: #000080; }
        .bios-content { padding: 10px; min-height: 120px; }
        .bios-row { display: flex; justify-content: space-between; padding: 5px 8px; cursor: pointer; border: 1px solid transparent; margin: 1px 0; }
        .bios-row:hover { background: rgba(255,255,255,0.08); border-color: #808080; }
        .bios-row.selected { background: #0000aa; border-color: #ffff00; }
        .bios-val { color: #ffffff; }
        .bios-help { font-size: 0.65rem; color: #808080; margin-top: 10px; padding-top: 8px; border-top: 1px solid #404080; text-align: center; }

        .devmgr { background: #ffffff; color: #1e1e1e; font-family: 'Segoe UI', sans-serif; font-size: 0.82rem; }
        .devmgr-toolbar { background: #f0f0f0; padding: 4px 8px; border-bottom: 1px solid #d0d0d0; display: flex; gap: 6px; }
        .devmgr-toolbar span { display: inline-block; padding: 2px 6px; border: 1px solid #ccc; border-radius: 2px; font-size: 0.7rem; color: #555; background: #fff; }
        .devmgr-tree { padding: 6px 4px; }
        .devmgr-cat-label { display: flex; align-items: center; gap: 4px; padding: 2px 4px; font-weight: 500; }
        .devmgr-cat-label .arrow { color: #888; font-size: 0.7rem; }
        .devmgr-dev { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 22px; cursor: pointer; border: 1px solid transparent; border-radius: 2px; margin: 1px 0; }
        .devmgr-dev:hover { background: #e5f3ff; border-color: #cce4f7; }
        .devmgr-dev.selected { background: #cce5ff; border-color: #0078d4; }
        .devmgr-warning { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; background: #e8a200; color: #000; font-size: 0.6rem; font-weight: bold; border-radius: 1px; margin-left: 4px; }
        .dev-icon { display: inline-block; width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

        .terminal-frame { background: #0c0c0c; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin: 15px 0; font-family: 'Consolas', 'Courier New', monospace; }
        .terminal-titlebar { background: #2d2d2d; padding: 5px 12px; font-size: 0.7rem; color: #aaa; display: flex; align-items: center; justify-content: space-between; }
        .terminal-body { padding: 12px; font-size: 0.82rem; color: #ccc; min-height: 80px; }
        .terminal-line { display: flex; align-items: center; margin: 3px 0; }
        .terminal-prompt { color: #c0c0c0; white-space: pre; flex-shrink: 0; }
        .terminal-input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: inherit; flex: 1; caret-color: #fff; }
        .terminal-input::placeholder { color: #555; }
        .terminal-actions { padding: 8px 12px; background: #111; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
        .terminal-btn { padding: 6px 16px; border: 1px solid #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); border-radius: 4px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
        .terminal-btn:hover { background: rgba(74,222,128,0.2); }

        .next-btn { display: none; margin: 15px auto 0; padding: 10px 24px; background: linear-gradient(90deg, #fb923c, #f97316); border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(251,146,60,0.3); }
        .next-btn.visible { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .io-panel { gap: 10px; padding: 12px; }
            .bios-screen, .devmgr { font-size: 0.72rem; }
        }
    </style>
</head>
<body>
<h1 class="visually-hidden">A+ Core 1 Prep: Round 2</h1>
    <div role="status" style="background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.4);color:#fbbf24;padding:8px 14px;margin:12px auto;max-width:880px;border-radius:6px;font-size:0.85rem;text-align:center;"><strong>PRACTICE MODE</strong>: this prep-round quiz is for self-paced practice. Server-graded. Your answers are checked securely.</div>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="prep-container"></div>
    </main>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    // A+ Core 1 Prep, Round 2: Hardware & Peripherals (Ch 1-4)
    // Mixed: 4 MC + 3 GUI + 3 Terminal
    // ═══════════════════════════════════════════════════════════════

    const CONFIG = {
        title: 'A+ Core 1 Prep: Round 2',
        subtitle: 'Hardware & Peripherals: Chapters 1\u20134',
        description: '10 mixed questions: multiple choice, GUI simulations, and terminal commands',
        passingScore: 70,
        storageKey: 'aplus-core1-prep-r2',
        achievement: 'forge-core1-prep-round-2',
        moduleId: 'aplus-core1-prep-r2',
        houseId: 'forge',
        // serverGrading: declares this quiz is graded server-side — the custom engine always calls the
        // gradeQuiz Cloud Function and the answers live in Firestore quiz_keys, not the client. This is
        // a declaration for EduScan/convention, NOT a runtime toggle the engine branches on.
        serverGrading: true
    };

    const QUESTIONS = [
        // Q1: MC, CPU socket compatibility (Ch 1)
        {
            type: 'mc',
            question: 'A client wants to upgrade from an Intel Core i5-12600K to an Intel Core i9-13900K. The current motherboard uses an LGA 1700 socket. They also want the option to switch to AMD in the future. Which statement is correct?',
            options: [
                'The i9-13900K will work in the LGA 1700 socket; switching to AMD Ryzen 7000 requires a new AM5 motherboard',
                'Both Intel 13th gen and AMD Ryzen 7000 use the same LGA 1700 socket',
                'The i9-13900K requires the newer LGA 1800 socket',
                'AMD Ryzen 7000 processors are compatible with Intel LGA 1700 boards via an adapter bracket'
            ],
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        },
        // Q2: GUI, Motherboard I/O panel, click USB 3.2 Gen 2 port (Ch 3)
        {
            type: 'gui',
            question: 'A technician needs to connect a USB 3.2 Gen 2 (10 Gbps) external SSD to the motherboard rear I/O panel. Identify and click the USB 3.2 Gen 2 port.',
            mockup: 'io-panel',
            hotspots: {
                'ps2-kb': 'PS/2 Keyboard (purple)', 'ps2-ms': 'PS/2 Mouse (green)',
                'usb2': 'USB 2.0 Port', 'usb3': 'USB 3.0 Port (blue)',
                'usb32-gen2': 'USB 3.2 Gen 2 Port (teal)',
                'hdmi': 'HDMI Port', 'dp': 'DisplayPort',
                'rj45': 'Ethernet (RJ-45)',
                'audio-out': 'Line Out (green)', 'audio-mic': 'Mic In (pink)', 'audio-in': 'Line In (blue)'
            },
            chapter: 3, chapterTitle: 'Peripherals, Cables and Connectors'
        },
        // Q3: Terminal, chkdsk /f C: (Ch 2)
        {
            type: 'terminal',
            question: 'A help desk ticket reports that a user\'s C: drive has file system errors and Windows occasionally freezes during file operations. What command would you run in an elevated command prompt to check and fix file system errors on the C: drive?',
            prompt: 'C:\\>',
            matchMode: 'exact',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // Q4: MC, RAID 5 vs RAID 10 (Ch 2)
        {
            type: 'mc',
            question: 'A small business needs storage for their file server with four 2 TB drives. They need redundancy with good read performance while maximizing usable capacity, and must tolerate at least one drive failure. Which RAID level best fits?',
            options: [
                'RAID 0: striped across all four drives for maximum speed',
                'RAID 1: mirrored pairs providing 2 TB usable capacity',
                'RAID 5: striping with distributed parity, 6 TB usable, tolerates one drive failure',
                'RAID 10: striped mirrors, 4 TB usable, tolerates one failure per mirror set'
            ],
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // Q5: GUI, BIOS/UEFI enable TPM 2.0 (Ch 1)
        {
            type: 'gui',
            question: 'A company is deploying Windows 11 and needs TPM 2.0 enabled on all workstations. In this BIOS/UEFI Security settings screen, click the setting to enable TPM 2.0.',
            mockup: 'bios-tpm',
            hotspots: {
                'supervisor-pw': 'Supervisor Password', 'user-pw': 'User Password',
                'secure-boot': 'Secure Boot', 'tpm-device': 'TPM Device',
                'chassis-intrusion': 'Chassis Intrusion Detection'
            },
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        },
        // Q6: Terminal, sfc /scannow (Ch 11)
        {
            type: 'terminal',
            question: 'A user reports that several Windows features have stopped working after a sudden power loss. System file integrity may be compromised. What command would you run to scan and repair protected Windows system files?',
            prompt: 'C:\\Windows\\System32>',
            matchMode: 'exact',
            chapter: 11, chapterTitle: 'Troubleshooting Methodology'
        },
        // Q7: MC, Laser printer imaging process order (Ch 4)
        {
            type: 'mc',
            question: 'A technician is explaining the laser printing process to a trainee. Which sequence correctly lists the seven steps of the laser imaging process in order?',
            options: [
                'Processing, Charging, Exposing, Developing, Transferring, Fusing, Cleaning',
                'Charging, Processing, Developing, Exposing, Transferring, Cleaning, Fusing',
                'Processing, Exposing, Charging, Developing, Fusing, Transferring, Cleaning',
                'Charging, Exposing, Developing, Processing, Transferring, Fusing, Cleaning'
            ],
            chapter: 4, chapterTitle: 'Printers and Multifunction Devices'
        },
        // Q8: GUI, Device Manager update driver for warning device (Ch 3)
        {
            type: 'gui',
            question: 'After installing a new wireless network adapter, the device is not working. You open Device Manager and see a yellow triangle warning on one device. Click on the problematic device that needs its driver updated.',
            mockup: 'devmgr-update',
            hotspots: {
                'gpu-rtx3060': 'NVIDIA GeForce RTX 3060',
                'wifi-warning': 'Intel Wi-Fi 6 AX201 (warning)',
                'eth-realtek': 'Realtek PCIe GbE Family Controller',
                'audio-realtek': 'Realtek High Definition Audio',
                'usb-controller': 'Intel USB 3.0 eXtensible Host Controller'
            },
            chapter: 3, chapterTitle: 'Peripherals, Cables and Connectors'
        },
        // Q9: Terminal, diskpart (Ch 2)
        {
            type: 'terminal',
            question: 'A technician installed a new SSD but it does not appear in File Explorer. The drive is visible in BIOS. What command-line utility would you launch to initialize, partition, and format the new drive?',
            prompt: 'C:\\>',
            matchMode: 'exact',
            chapter: 2, chapterTitle: 'Storage Devices and Power Supplies'
        },
        // Q10: MC, DDR4 vs DDR5 identification (Ch 1)
        {
            type: 'mc',
            question: 'A technician finds two similar-looking RAM modules: one labeled DDR4-3200 and the other DDR5-4800. Which statement about these modules is correct?',
            options: [
                'DDR4 and DDR5 use the same 288-pin form factor and are interchangeable',
                'DDR5 has a different notch position than DDR4 and will not physically fit in a DDR4 slot',
                'DDR5 modules use 260 pins while DDR4 uses 288 pins',
                'Both DDR4 and DDR5 operate at 1.2V'
            ],
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        }
    ];

    // ── State: tracks current question, answers, score, and shuffled order ──
    let state = { current: 0, answers: [], shuffled: [], serverResults: null, score: 0 };
    const container = document.getElementById('prep-container');

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ── Start Screen ──
    function showStart() {
        container.innerHTML = `
        <div class="quiz-engine theme-forge">
            <div class="quiz-header" style="text-align:center;margin-bottom:0;padding-bottom:30px;">
                <h1 class="quiz-title">${CONFIG.title}</h1>
                <p style="color:#a8a29e;margin-bottom:8px;">${CONFIG.subtitle}</p>
                <p style="color:#bbb;font-size:0.95rem;">${CONFIG.description}</p>
                <div style="display:flex;justify-content:center;gap:10px;margin-top:18px;">
                    <span class="q-badge mc">4 MC</span>
                    <span class="q-badge gui">3 GUI</span>
                    <span class="q-badge terminal">3 Terminal</span>
                </div>
                <p style="color:#78716c;font-size:0.8rem;margin-top:12px;">Passing score: ${CONFIG.passingScore}%</p>
                <button class="quiz-btn quiz-retry-btn" style="margin-top:25px;" onclick="startQuiz()">Start Round</button>
            </div>
        </div>`;
    }

    // ── startQuiz: shuffles questions and MC options, resets state ──
    // Preserves each question's original index (_origQ) and, for MC, an option index map
    // (_optMap) so raw answers can be sent to the server in original-index terms.
    function startQuiz() {
        state.shuffled = shuffle(QUESTIONS.map((q, i) => Object.assign({}, q, { _origQ: i })));
        state.shuffled.forEach(q => {
            if (q.type === 'mc') {
                const sIdx = shuffle(q.options.map((_, i) => i));
                q.shuffledOptions = sIdx.map(i => q.options[i]);
                q._optMap = sIdx; // _optMap[shuffledIdx] = originalIdx
            }
        });
        state.current = 0;
        state.answers = [];
        state.score = 0;
        state.serverResults = null;
        showQuestion();
    }

    // ── Question Screen ──
    function showQuestion() {
        if (state.current >= state.shuffled.length) { submitQuiz(); return; }
        const q = state.shuffled[state.current];
        const num = state.current + 1;
        const total = state.shuffled.length;
        const pct = ((state.current) / total * 100).toFixed(0);
        const typeLabel = q.type === 'mc' ? 'Multiple Choice' : q.type === 'gui' ? 'GUI Simulation' : 'Terminal Command';

        let qBody = '';
        if (q.type === 'mc') qBody = renderMC(q);
        else if (q.type === 'gui') qBody = renderGUI(q);
        else qBody = renderTerminal(q);

        container.innerHTML = `
        <div class="quiz-engine theme-forge">
            <div class="quiz-header">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span style="color:#78716c;font-size:0.85rem;">Question ${num} of ${total}</span>
                    <span class="q-badge ${q.type}">${typeLabel}</span>
                </div>
                <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="quiz-body" style="animation:fadeIn 0.3s;">
                <p class="question-text">${q.question}</p>
                ${qBody}
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next \u2192</button>
            </div>
        </div>`;
        const inp = document.querySelector('.terminal-input');
        if (inp) setTimeout(() => inp.focus(), 100);
    }

    function renderMC(q) {
        const opts = q.shuffledOptions || q.options;
        const letters = ['A','B','C','D'];
        return '<div class="quiz-options">' + opts.map((opt, i) =>
            '<button class="quiz-option" onclick="selectMC(' + i + ')" id="mc-opt-' + i + '">' +
            '<span class="option-letter">' + letters[i] + '</span>' +
            '<span class="option-text">' + opt + '</span></button>'
        ).join('') + '</div>';
    }

    function renderGUI(q) {
        let mockupHTML = '';
        if (q.mockup === 'io-panel') mockupHTML = buildIOPanel();
        else if (q.mockup === 'bios-tpm') mockupHTML = buildBIOSTPM();
        else if (q.mockup === 'devmgr-update') mockupHTML = buildDevMgrUpdate();
        const titleMap = { 'io-panel': 'Motherboard Rear I/O Panel', 'bios-tpm': 'AMI BIOS Setup Utility', 'devmgr-update': 'Device Manager' };
        return '<div class="mockup-frame"><div class="mockup-titlebar">' +
            '<div class="mockup-dots"><span style="background:#ef4444"></span><span style="background:#eab308"></span><span style="background:#22c55e"></span></div>' +
            '<span>' + (titleMap[q.mockup] || '') + '</span></div><div class="mockup-body">' + mockupHTML + '</div></div>';
    }

    function buildIOPanel() {
        function port(id, svg) { return '<div class="io-port" onclick="selectGUI(\'' + id + '\',this)">' + svg + '</div>'; }
        function grp(label, ports) { return '<div class="io-group"><div class="io-ports">' + ports + '</div><span class="io-group-label">' + label + '</span></div>'; }
        var r = function(w,h,fill,stroke) { return '<svg width="'+w+'" height="'+h+'"><rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="1" fill="'+fill+'" stroke="'+(stroke||'#444')+'" stroke-width="1"/></svg>'; };
        var c = function(sz,fill) { return '<svg width="'+sz+'" height="'+sz+'"><circle cx="'+(sz/2)+'" cy="'+(sz/2)+'" r="'+(sz/2-2)+'" fill="'+fill+'" stroke="#555" stroke-width="1"/></svg>'; };
        return '<div class="io-panel">' +
            grp('PS/2', port('ps2-kb', c(20,'#7c3aed')) + port('ps2-ms', c(20,'#22c55e'))) +
            grp('USB 2.0', port('usb2', r(18,12,'#1a1a1a')) + port('usb2', r(18,12,'#1a1a1a'))) +
            grp('USB 3.0', port('usb3', r(18,12,'#1d4ed8','#60a5fa')) + port('usb3', r(18,12,'#1d4ed8','#60a5fa'))) +
            grp('USB 3.2 Gen2', port('usb32-gen2', r(18,12,'#0d9488','#2dd4bf'))) +
            grp('HDMI', port('hdmi', '<svg width="24" height="14"><polygon points="3,0 21,0 24,14 0,14" fill="#1a1a1a" stroke="#555" stroke-width="1"/></svg>')) +
            grp('DP', port('dp', '<svg width="22" height="14"><polygon points="0,0 18,0 22,7 18,14 0,14" fill="#1a1a1a" stroke="#555" stroke-width="1"/></svg>')) +
            grp('RJ-45', port('rj45', r(18,18,'#2a2a2a','#555'))) +
            grp('Audio', port('audio-out', c(14,'#22c55e')) + port('audio-mic', c(14,'#ec4899')) + port('audio-in', c(14,'#3b82f6'))) +
        '</div>';
    }

    function buildBIOSTPM() {
        function row(id, label, val, style) {
            return '<div class="bios-row" onclick="selectGUI(\'' + id + '\',this)"><span>' + label + '</span><span class="bios-val"' + (style ? ' style="'+style+'"' : '') + '>[' + val + ']</span></div>';
        }
        return '<div class="bios-screen">' +
            '<div class="bios-hdr">AMI BIOS Setup Utility v2.21</div>' +
            '<div class="bios-tabs"><span class="bios-tab">Main</span><span class="bios-tab">Advanced</span><span class="bios-tab active">Security</span><span class="bios-tab">Boot</span><span class="bios-tab">Save &amp; Exit</span></div>' +
            '<div class="bios-content">' +
            row('supervisor-pw', 'Supervisor Password', 'Not Set') +
            row('user-pw', 'User Password', 'Not Set') +
            row('secure-boot', 'Secure Boot', 'Enabled') +
            row('tpm-device', 'TPM Device', 'Disabled', 'color:#ff6666') +
            row('chassis-intrusion', 'Chassis Intrusion Detection', 'Disabled') +
            '<div class="bios-help">\u2190 \u2192 Select Tab | \u2191 \u2193 Select Item | Enter Change Value | F10 Save &amp; Exit</div>' +
            '</div></div>';
    }

    function buildDevMgrUpdate() {
        function dev(id, icon, color, name, warning) {
            return '<div class="devmgr-dev" onclick="selectGUI(\'' + id + '\',this)">' +
                '<span class="dev-icon" style="background:' + color + '"></span> ' + name +
                (warning ? ' <span class="devmgr-warning">!</span>' : '') + '</div>';
        }
        function cat(label, devices) {
            return '<div style="padding:1px 0"><div class="devmgr-cat-label"><span class="arrow">\u25BC</span> ' + label + '</div>' + devices + '</div>';
        }
        return '<div class="devmgr">' +
            '<div class="devmgr-toolbar"><span>File</span><span>Action</span><span>View</span><span>Help</span></div>' +
            '<div class="devmgr-tree">' +
            cat('Display adapters', dev('gpu-rtx3060','','#4a90d9','NVIDIA GeForce RTX 3060')) +
            cat('Network adapters',
                dev('wifi-warning','','#4a90d9','Intel Wi-Fi 6 AX201', true) +
                dev('eth-realtek','','#4a90d9','Realtek PCIe GbE Family Controller')) +
            cat('Sound, video and game controllers', dev('audio-realtek','','#e67e22','Realtek High Definition Audio')) +
            cat('Universal Serial Bus controllers', dev('usb-controller','','#888','Intel USB 3.0 eXtensible Host Controller')) +
            '</div></div>';
    }

    function renderTerminal(q) {
        return '<div class="terminal-frame">' +
            '<div class="terminal-titlebar"><span>Administrator: Command Prompt</span></div>' +
            '<div class="terminal-body">' +
            '<div class="terminal-line" style="color:#888;">Microsoft Windows [Version 10.0.19045]</div>' +
            '<div class="terminal-line" style="color:#888;margin-bottom:8px;">(c) Microsoft Corporation. All rights reserved.</div>' +
            '<div class="terminal-line"><span class="terminal-prompt">' + q.prompt + ' </span>' +
            '<input class="terminal-input" id="termInput" type="text" placeholder="Type command here..." autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')submitTerminal()"></div>' +
            '</div><div class="terminal-actions"><button class="terminal-btn" onclick="submitTerminal()">Execute \u21B5</button></div></div>';
    }

    // ── Handlers ──

    // selectMC: records the MC answer (raw = original option index via _optMap), highlights
    // the selection, shows the next button. No correctness is computed client-side; grading
    // is deferred to the server (submitQuiz).
    function selectMC(idx) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        state.answers[state.current] = { type: 'mc', _origQ: q._origQ, raw: q._optMap[idx], selectedDisplay: idx };
        document.querySelectorAll('.quiz-option').forEach(function(el, i) {
            el.disabled = true;
            if (i === idx) el.classList.add('selected');
        });
        document.getElementById('nextBtn').classList.add('visible');
    }

    // selectGUI: records the GUI hotspot answer (raw = clicked hotspot id), disables further
    // clicks. No correctness is computed client-side; grading is deferred to the server.
    function selectGUI(hotspotId, el) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        state.answers[state.current] = { type: 'gui', _origQ: q._origQ, raw: hotspotId, selectedId: hotspotId };
        // Disable all clickable elements in the mockup after selection
        var body = document.querySelector('.mockup-body');
        if (body) body.querySelectorAll('[onclick]').forEach(function(e) { e.style.pointerEvents = 'none'; });
        if (el) el.classList.add('selected');
        document.getElementById('nextBtn').classList.add('visible');
    }

    // submitTerminal: records the typed command (raw). No correctness is computed client-side;
    // grading is deferred to the server, so the input locks to a neutral color (not green/red).
    function submitTerminal() {
        if (state.answers[state.current] !== undefined) return;
        var input = document.getElementById('termInput');
        if (!input) return;
        var val = input.value.trim();
        if (!val) return;
        var q = state.shuffled[state.current];
        state.answers[state.current] = { type: 'terminal', _origQ: q._origQ, raw: val, input: val };
        input.disabled = true;
        input.style.color = '#888';
        document.querySelector('.terminal-btn').disabled = true;
        document.getElementById('nextBtn').classList.add('visible');
    }

    // nextQuestion: advances to next question or triggers submitQuiz (via showQuestion's boundary check)
    function nextQuestion() { state.current++; showQuestion(); }

    // submitQuiz: sends every recorded raw answer to the server-side grader (gradeQuiz), then
    // back-fills each answer's .correct / .correctAnswer / .explanation from the server response
    // before rendering results. Replaces the old client-side endQuiz(). No answer is ever marked
    // correct/incorrect until the server has graded it.
    async function submitQuiz() {
        var payload = {};
        state.answers.forEach(function(a) { payload[String(a._origQ)] = a.raw; });

        // Loading state while the grader runs
        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-body" style="text-align:center;padding:60px 20px;animation:fadeIn 0.3s;">' +
            '<p style="color:#e0e0e0;font-size:1.1rem;">Grading your answers&hellip;</p>' +
            '</div></div>';

        try {
            var res = await FirebaseAuth.callFunction('gradeQuiz', { quizId: CONFIG.moduleId, answers: payload });
            var data = res && res.data ? res.data : res;
            state.serverResults = data.results;
            state.score = data.score;
            // Back-fill each displayed answer with the server's verdict for this question
            state.answers.forEach(function(a) {
                var r = data.results[a._origQ];
                a.correct = r ? !!r.correct : false;
                a.correctAnswer = r ? r.correctAnswer : undefined;
                a.explanation = r ? r.explanation : undefined;
            });
            saveProgress(data.percentage, data.score, data.total);
            showResults(data.percentage, data.passed, data.total);
        } catch (e) {
            console.warn('[Prep] Grading failed:', e);
            // Error state: let the student retry grading without losing their answers
            container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-body" style="text-align:center;padding:60px 20px;">' +
                '<p style="color:#ef4444;font-size:1.05rem;">Could not grade your answers. Check your connection and try again.</p>' +
                '<button class="quiz-btn quiz-retry-btn" style="margin-top:20px;" onclick="showResultsRetry()">Retry</button>' +
                '</div></div>';
        }
    }

    // showResultsRetry: re-attempts server grading after a failed submitQuiz() call
    function showResultsRetry() { submitQuiz(); }

    // backToResults: returns from the review screen to the results screen using the already
    // server-graded state (never re-invokes the grader)
    function backToResults() {
        var total = state.shuffled.length;
        var pct = Math.round((state.score / total) * 100);
        var passed = pct >= CONFIG.passingScore;
        showResults(pct, passed, total);
    }

    // ── Results ──
    function showResults(pct, passed, total) {
        var mc = state.answers.filter(function(a) { return a && a.type === 'mc'; });
        var gui = state.answers.filter(function(a) { return a && a.type === 'gui'; });
        var term = state.answers.filter(function(a) { return a && a.type === 'terminal'; });
        var mcOk = mc.filter(function(a) { return a.correct; }).length;
        var guiOk = gui.filter(function(a) { return a.correct; }).length;
        var termOk = term.filter(function(a) { return a.correct; }).length;

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-results ' + (passed ? 'passed' : 'failed') + '">' +
            '<div class="results-header"><h2 class="results-title">' + (passed ? 'Round Complete!' : 'Keep Practicing') + '</h2></div>' +
            '<div class="results-score"><div class="score-circle ' + (passed ? 'passed' : 'failed') + '">' +
            '<span class="score-percentage">' + pct + '%</span><span class="score-fraction">' + state.score + '/' + total + '</span></div></div>' +
            '<p class="results-message">' + (passed ? 'Strong work on hardware and peripherals. Ready for Round 3!' : 'You need ' + CONFIG.passingScore + '% to pass. Review the explanations and try again.') + '</p>' +
            '<div class="results-stats">' +
            '<div class="stat"><span class="stat-value">' + mcOk + '/' + mc.length + '</span><span class="stat-label">MC</span></div>' +
            '<div class="stat"><span class="stat-value">' + guiOk + '/' + gui.length + '</span><span class="stat-label">GUI</span></div>' +
            '<div class="stat"><span class="stat-value">' + termOk + '/' + term.length + '</span><span class="stat-label">Terminal</span></div></div>' +
            (passed ? '<div class="results-achievement"><strong>Achievement Unlocked:</strong> Core 1 Prep: Round 2</div>' : '') +
            '<div class="results-actions">' +
            '<button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="showReview()">Review Answers</button></div>' +
            '</div></div>';
    }

    // ── Review Screen: shows each question with correct/incorrect feedback and explanations.
    // Correctness and the revealed correct answer come from the server-graded state.answers
    // (backfilled in submitQuiz), never from a client-side correct/correctId/accepted field. ──
    function showReview() {
        var cards = '';
        state.shuffled.forEach(function(q, i) {
            var ans = state.answers[i] || {};
            var ok = ans.correct;
            var statusClass = ok ? 'correct' : 'incorrect';
            var typeLabel = q.type === 'mc' ? 'MC' : q.type === 'gui' ? 'GUI' : 'Terminal';
            var body = '';

            if (q.type === 'mc') {
                // ans.correctAnswer is the ORIGINAL option index from the server; map it back
                // to this attempt's shuffled display position via _optMap before highlighting.
                var opts = q.shuffledOptions || q.options;
                var correctIdx = (q._optMap && ans.correctAnswer !== undefined) ? q._optMap.indexOf(ans.correctAnswer) : -1;
                body = '<div class="review-options">' + opts.map(function(opt, j) {
                    var cls = '';
                    if (j === correctIdx) cls = 'correct-answer';
                    else if (j === ans.selectedDisplay) cls = 'wrong-selected';
                    return '<div class="review-option ' + cls + '">' + ['A','B','C','D'][j] + '. ' + opt + '</div>';
                }).join('') + '</div>';
            } else if (q.type === 'gui') {
                // ans.correctAnswer is the correct hotspot id from the server
                var selectedName = q.hotspots[ans.selectedId] || 'No selection';
                var correctName = q.hotspots[ans.correctAnswer];
                body = '<div style="padding:10px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:0.9rem;">' +
                    '<p>You clicked: <strong style="color:' + (ok ? '#2ed573' : '#ff4757') + '">' + selectedName + '</strong></p>' +
                    (!ok ? '<p>Correct answer: <strong style="color:#2ed573">' + correctName + '</strong></p>' : '') + '</div>';
            } else {
                // ans.correctAnswer is an array of accepted commands from the server; show the first
                var correctCmd = Array.isArray(ans.correctAnswer) ? ans.correctAnswer[0] : ans.correctAnswer;
                body = '<div class="terminal-frame" style="margin:10px 0;"><div class="terminal-body" style="padding:8px 12px;min-height:auto;">' +
                    '<div>You typed: <span style="color:' + (ok ? '#4ade80' : '#ef4444') + '">' + (ans.input || '(empty)') + '</span></div>' +
                    (!ok ? '<div>Correct: <span style="color:#4ade80">' + correctCmd + '</span></div>' : '') +
                    '</div></div>';
            }

            cards += '<div class="review-item ' + statusClass + '">' +
                '<div class="review-header"><span class="review-num">Q' + (i+1) + '</span>' +
                '<span class="q-badge ' + q.type + '" style="font-size:0.65rem;padding:2px 8px;">' + typeLabel + '</span>' +
                '<span class="review-status">' + (ok ? '\u2713' : '\u2717') + '</span></div>' +
                '<p class="review-question">' + q.question + '</p>' + body +
                '<div class="review-explanation">' + (ans.explanation || '') + '</div></div>';
        });

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-review">' +
            '<div class="review-header-bar"><h2>Review: Round 2</h2>' +
            '<button class="quiz-btn quiz-review-btn" onclick="backToResults()">Back to Results</button></div>' +
            '<div class="review-list">' + cards + '</div>' +
            '<div class="review-footer"><button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="backToResults()">Back to Results</button></div>' +
            '</div></div>';
    }

    // ── Save Progress ──
    function saveProgress(pct, score, total) {
        try {
            var key = CONFIG.storageKey;
            var data = { completed: true, score: pct, correct: score, total: total, completedAt: new Date().toISOString() };
            localStorage.setItem(key, JSON.stringify(data));
            var progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
            if (!progress.forge) progress.forge = {};
            progress.forge[key] = data;
            localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            if (typeof ModuleProgress !== 'undefined') ModuleProgress.completeQuiz(CONFIG.moduleId, CONFIG.houseId, pct);
            if (pct >= CONFIG.passingScore && typeof AchievementManager !== 'undefined') AchievementManager.unlock(CONFIG.achievement);
        } catch (e) { console.warn('[Prep] Save failed:', e); }
    }

    showStart();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="forge-aplus-core1-prep-round-2" house="forge"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
