    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #1c1917 0%, #44403c 50%, #1c1917 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; }
        .page-header { padding: 15px 30px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(251,146,60,0.2); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #fb923c; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .page-header a:hover { color: #fdba74; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
        .quiz-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
        #prep-container { width: 100%; max-width: 800px; }

        .q-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .q-badge.mc { background: rgba(251,146,60,0.2); color: #fb923c; }
        .q-badge.gui { background: rgba(34,211,238,0.2); color: #22d3ee; }
        .q-badge.terminal { background: rgba(74,222,128,0.2); color: #4ade80; }
        .quiz-option.selected { border-color: #60a5fa !important; background: rgba(96,165,250,0.15) !important; opacity: 1 !important; }

        .mockup-frame { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; margin: 15px 0; user-select: none; }
        .mockup-titlebar { background: #0f172a; padding: 6px 12px; font-size: 0.7rem; color: #64748b; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .mockup-dots { display: flex; gap: 4px; }
        .mockup-dots span { width: 8px; height: 8px; border-radius: 50%; }

        /* Task Manager */
        .taskmgr { background: #1e1e1e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; font-size: 0.8rem; }
        .taskmgr-tabs { display: flex; background: #2d2d2d; border-bottom: 1px solid #444; }
        .taskmgr-tab { padding: 7px 14px; color: #999; font-size: 0.75rem; }
        .taskmgr-tab.active { color: #fff; border-bottom: 2px solid #0078d4; }
        .taskmgr-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 6px 12px; background: #2d2d2d; font-weight: 600; font-size: 0.72rem; color: #999; }
        .taskmgr-process { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 5px 12px; cursor: pointer; border: 1px solid transparent; border-radius: 2px; margin: 1px 0; }
        .taskmgr-process:hover { background: #333; }
        .taskmgr-process.selected { background: #0078d4; border-color: #0078d4; color: #fff; }
        .high-cpu { color: #ef4444; font-weight: 600; }

        /* BIOS Screen */
        .bios-screen { font-family: 'Courier New', monospace; background: #000080; color: #c0c0c0; font-size: 0.78rem; }
        .bios-hdr { background: #0000aa; padding: 6px 12px; text-align: center; color: #ffff00; font-weight: bold; border-bottom: 1px double #c0c0c0; font-size: 0.85rem; }
        .bios-tabs { display: flex; background: #000060; border-bottom: 1px solid #808080; }
        .bios-tab { padding: 4px 12px; color: #808080; }
        .bios-tab.active { color: #ffffff; background: #000080; }
        .bios-content { padding: 10px; min-height: 120px; }
        .bios-row { display: flex; justify-content: space-between; padding: 5px 8px; cursor: pointer; border: 1px solid transparent; margin: 1px 0; }
        .bios-row:hover { background: rgba(255,255,255,0.08); border-color: #808080; }
        .bios-row.selected { background: #0000aa; border-color: #ffff00; }
        .bios-val { color: #ffffff; }
        .bios-help { font-size: 0.65rem; color: #808080; margin-top: 10px; padding-top: 8px; border-top: 1px solid #404080; text-align: center; }
        .bios-note { font-size: 0.65rem; color: #aaaaff; margin-top: 6px; font-style: italic; }

        /* Device Manager */
        .devmgr { background: #ffffff; color: #1e1e1e; font-family: 'Segoe UI', sans-serif; font-size: 0.82rem; }
        .devmgr-toolbar { background: #f0f0f0; padding: 4px 8px; border-bottom: 1px solid #d0d0d0; display: flex; gap: 6px; }
        .devmgr-toolbar span { display: inline-block; padding: 2px 6px; border: 1px solid #ccc; border-radius: 2px; font-size: 0.7rem; color: #555; background: #fff; }
        .devmgr-tree { padding: 6px 4px; }
        .devmgr-cat-label { display: flex; align-items: center; gap: 4px; padding: 2px 4px; font-weight: 500; }
        .devmgr-cat-label .arrow { color: #888; font-size: 0.7rem; }
        .devmgr-dev { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 22px; cursor: pointer; border: 1px solid transparent; border-radius: 2px; margin: 1px 0; }
        .devmgr-dev:hover { background: #e5f3ff; border-color: #cce4f7; }
        .devmgr-dev.selected { background: #cce5ff; border-color: #0078d4; }
        .dev-icon { display: inline-block; width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
        .devmgr-note { font-size: 0.7rem; color: #666; padding: 6px 4px 2px 22px; font-style: italic; }

        .terminal-frame { background: #0c0c0c; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin: 15px 0; font-family: 'Consolas', 'Courier New', monospace; }
        .terminal-titlebar { background: #2d2d2d; padding: 5px 12px; font-size: 0.7rem; color: #aaa; display: flex; align-items: center; justify-content: space-between; }
        .terminal-body { padding: 12px; font-size: 0.82rem; color: #ccc; min-height: 80px; }
        .terminal-line { display: flex; align-items: center; margin: 3px 0; }
        .terminal-prompt { color: #c0c0c0; white-space: pre; flex-shrink: 0; }
        .terminal-input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: inherit; flex: 1; caret-color: #fff; }
        .terminal-input::placeholder { color: #555; }
        .terminal-actions { padding: 8px 12px; background: #111; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
        .terminal-btn { padding: 6px 16px; border: 1px solid #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); border-radius: 4px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
        .terminal-btn:hover { background: rgba(74,222,128,0.2); }

        .next-btn { display: none; margin: 15px auto 0; padding: 10px 24px; background: linear-gradient(90deg, #fb923c, #f97316); border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(251,146,60,0.3); }
        .next-btn.visible { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .taskmgr { font-size: 0.72rem; }
            .taskmgr-header, .taskmgr-process { grid-template-columns: 2fr 1fr 1fr; }
            .taskmgr-header > *:last-child, .taskmgr-process > *:last-child { display: none; }
            .bios-screen, .devmgr { font-size: 0.72rem; }
        }
    </style>

<h1 class="visually-hidden">A+ Core 1 Prep: Round 4</h1>
    <header class="page-header">

    <main class="quiz-wrapper">

    <script src="../../../../../../components/QuizEngine.js"></script>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    // A+ Core 1 Prep — Round 4: Troubleshooting & Mixed (Ch 11-12)
    // Mixed: 4 MC + 3 GUI + 3 Terminal
    // ═══════════════════════════════════════════════════════════════

    const CONFIG = {
        title: 'A+ Core 1 Prep \u2014 Round 4',
        subtitle: 'Troubleshooting & Mixed Review \u2014 Chapters 11\u201312 + Comprehensive',
        description: '10 mixed questions: multiple choice, GUI simulations, and terminal commands',
        passingScore: 70,
        storageKey: 'aplus-core1-prep-r4',
        achievement: 'forge-core1-prep-round-4',
        moduleId: 'aplus-core1-prep-r4',
        houseId: 'forge'
    };

    const QUESTIONS = [
        // Q1: MC — 6-step troubleshooting methodology (Ch 11)
        {
            type: 'mc',
            question: 'CompTIA defines a structured troubleshooting methodology. What is the correct order of the six steps?',
            options: [
                'Identify the problem, Establish a theory, Test the theory, Establish a plan of action, Verify functionality, Document findings',
                'Establish a theory, Identify the problem, Test the theory, Implement the solution, Document findings, Verify functionality',
                'Identify the problem, Test the theory, Establish a theory, Implement the solution, Verify functionality, Document findings',
                'Document findings, Identify the problem, Establish a theory, Test the theory, Implement the solution, Verify functionality'
            ],
            correct: 0,
            explanation: 'CompTIA\'s six-step troubleshooting methodology: (1) Identify the problem \u2014 gather information, question users, back up data, (2) Establish a theory of probable cause \u2014 question the obvious, (3) Test the theory \u2014 confirm or re-establish theory, (4) Establish a plan of action \u2014 and implement the solution, (5) Verify full system functionality \u2014 and implement preventive measures, (6) Document findings, actions, and outcomes. Review: Chapter 11 \u2014 Troubleshooting Methodology.',
            chapter: 11, chapterTitle: 'Troubleshooting Methodology'
        },
        // Q2: GUI — Task Manager: end high-CPU process (Ch 11)
        {
            type: 'gui',
            question: 'A user reports their computer is extremely slow. You open Task Manager and see one process consuming excessive CPU. Click on the process that is causing the performance issue.',
            mockup: 'task-manager',
            correctId: 'proc-malware',
            hotspots: {
                'proc-explorer': 'Windows Explorer (2% CPU)',
                'proc-chrome': 'Google Chrome (8% CPU)',
                'proc-malware': 'svchost_update.exe (94% CPU)',
                'proc-antivirus': 'Windows Security (3% CPU)',
                'proc-system': 'System (1% CPU)'
            },
            explanation: 'In Task Manager, sorting by CPU usage reveals which process is consuming resources. The process "svchost_update.exe" at 94% CPU is the culprit \u2014 and the suspicious name (mimicking svchost.exe) suggests it could be malware. Legitimate svchost.exe runs from C:\\Windows\\System32. After ending the task, investigate the file location and run a malware scan. Review: Chapter 11 \u2014 Troubleshooting Methodology (Task Manager, performance monitoring, identifying resource hogs).',
            chapter: 11, chapterTitle: 'Troubleshooting Methodology'
        },
        // Q3: Terminal — netstat -an (Ch 6)
        {
            type: 'terminal',
            question: 'You suspect a compromised workstation may have unauthorized network connections. What command would you run to display all active TCP/UDP connections and listening ports in numeric format?',
            prompt: 'C:\\>',
            accepted: ['netstat -an', 'netstat -na', 'netstat -ano', 'netstat -nao'],
            matchMode: 'exact',
            expectedDisplay: 'netstat -an',
            explanation: 'netstat -an displays all connections (-a) in numeric format (-n, showing IP addresses instead of hostnames). The -n flag speeds up output by skipping DNS resolution. Adding -o shows the owning process ID. Look for unexpected ESTABLISHED connections to unknown external IPs or unusual LISTENING ports that could indicate a backdoor. Review: Chapter 6 \u2014 Introduction to TCP/IP (netstat, network monitoring, port analysis).',
            chapter: 6, chapterTitle: 'Introduction to TCP/IP'
        },
        // Q4: MC — POST beep codes (Ch 11)
        {
            type: 'mc',
            question: 'A desktop computer powers on but the screen stays black. The system speaker emits one long beep followed by three short beeps repeatedly. Based on standard AMI BIOS beep codes, what is the most likely cause?',
            options: [
                'RAM failure \u2014 memory modules are not detected or faulty',
                'Video card failure \u2014 the GPU is not detected or not seated properly',
                'CPU overheating \u2014 the thermal protection has been triggered',
                'Hard drive failure \u2014 the boot drive is not responding'
            ],
            correct: 1,
            explanation: 'One long beep followed by three short beeps is a standard AMI BIOS code for a video adapter failure. The system can\'t initialize the display, so the screen stays black and the error is communicated via beep codes. Common causes: GPU not seated properly, auxiliary power cable not connected, or dead GPU. Memory failures typically produce continuous short beeps or a different pattern. Review: Chapter 11 \u2014 Troubleshooting Methodology (POST, beep codes, BIOS error codes, no-display troubleshooting).',
            chapter: 11, chapterTitle: 'Troubleshooting Methodology'
        },
        // Q5: Terminal — tracert (Ch 6)
        {
            type: 'terminal',
            question: 'Users report that a remote office website (remote.company.com) loads very slowly. You want to trace the network path and identify where latency spikes occur. What command would you use?',
            prompt: 'C:\\>',
            accepted: ['tracert remote.company.com'],
            matchMode: 'exact',
            expectedDisplay: 'tracert remote.company.com',
            explanation: 'tracert (traceroute on Linux/Mac) sends ICMP packets with incrementing TTL values to map every router hop between your machine and the destination. Each hop shows three round-trip times, making it easy to identify where latency increases. A sudden jump in response time or timeouts (***) indicates a problem at that hop or ISP segment. Review: Chapter 6 \u2014 Introduction to TCP/IP (tracert, network path analysis, latency troubleshooting).',
            chapter: 6, chapterTitle: 'Introduction to TCP/IP'
        },
        // Q6: GUI — BIOS/UEFI: change boot order to USB first (Ch 1)
        {
            type: 'gui',
            question: 'A technician needs to boot from a USB recovery drive to repair a corrupted Windows installation. In this BIOS Boot settings screen, click on the setting to change the boot order so USB boots first.',
            mockup: 'bios-boot',
            correctId: 'boot-order',
            hotspots: {
                'boot-order': 'Boot Option #1',
                'fast-boot': 'Fast Boot',
                'secure-boot-ctl': 'Secure Boot Control',
                'csm-support': 'CSM (Compatibility Support Module)',
                'pxe-boot': 'PXE/Network Boot'
            },
            explanation: 'To boot from USB, change "Boot Option #1" from the current hard drive to the USB device. In most BIOS/UEFI interfaces, you select the boot priority option and choose the USB drive from the list. Some systems also support a one-time boot menu (usually F12) that lets you select a boot device without permanently changing the order. Review: Chapter 1 \u2014 Motherboards, Processors, and Memory (BIOS/UEFI boot configuration, boot order, USB boot).',
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        },
        // Q7: MC — Laptop display issues (Ch 9)
        {
            type: 'mc',
            question: 'A laptop screen appears very dim but you can faintly see the desktop image when shining a flashlight on the screen. External monitor output works perfectly. What is the MOST likely failed component?',
            options: [
                'The LCD panel itself has failed and needs replacement',
                'The GPU is failing and cannot output to the internal display',
                'The backlight or LED driver board has failed',
                'The video cable connecting the motherboard to the display is loose'
            ],
            correct: 2,
            explanation: 'If the image is visible under a flashlight but the screen appears dark, the LCD panel is working but the backlight has failed. In older laptops, this was the CCFL inverter; in modern LED-backlit displays, it\'s the LED driver circuit or the LEDs themselves. A failed panel would show no image at all. A loose cable typically causes flickering or partial display, not uniform dimness. Review: Chapter 9 \u2014 Laptop and Mobile Device Hardware (display technologies, backlight, inverter, LED driver, display troubleshooting).',
            chapter: 9, chapterTitle: 'Laptop and Mobile Device Hardware'
        },
        // Q8: GUI — Device Manager: roll back driver (Ch 12)
        {
            type: 'gui',
            question: 'After a recent driver update, a user\'s display adapter is causing screen flickering and artifacts. You need to revert to the previous working driver. In Device Manager, click on the device whose driver you need to roll back.',
            mockup: 'devmgr-rollback',
            correctId: 'gpu-flickering',
            hotspots: {
                'gpu-flickering': 'NVIDIA GeForce RTX 3060 (flickering)',
                'net-intel': 'Intel I219-V Gigabit Ethernet',
                'audio-realtek': 'Realtek High Definition Audio',
                'usb-hub': 'Generic USB Hub',
                'nvme-samsung': 'Samsung 970 EVO Plus NVMe'
            },
            explanation: 'When a driver update causes problems, use Device Manager\'s "Roll Back Driver" feature. Right-click the device \u2192 Properties \u2192 Driver tab \u2192 Roll Back Driver. This reverts to the previously installed driver version. The option is only available if a previous driver exists. If Roll Back is grayed out, you\'ll need to manually install an older driver version. Review: Chapter 12 \u2014 Hardware and Network Troubleshooting (driver rollback, Device Manager, display troubleshooting).',
            chapter: 12, chapterTitle: 'Hardware and Network Troubleshooting'
        },
        // Q9: Terminal — ipconfig /release then /renew (Ch 6)
        {
            type: 'terminal',
            question: 'A workstation suddenly lost network connectivity. It has an APIPA address (169.254.x.x) suggesting DHCP failure. What command would you type first to release the current IP configuration before requesting a new one?',
            prompt: 'C:\\>',
            accepted: ['ipconfig /release'],
            matchMode: 'exact',
            expectedDisplay: 'ipconfig /release',
            explanation: 'ipconfig /release releases the current DHCP-assigned IP configuration. Follow this with ipconfig /renew to request a new IP from the DHCP server. This two-step process forces a fresh DHCP negotiation and often resolves APIPA (169.254.x.x) addressing issues caused by temporary DHCP communication failures. If /renew still gets an APIPA address, the DHCP server may be unreachable. Review: Chapter 6 \u2014 Introduction to TCP/IP (ipconfig switches, DHCP troubleshooting, APIPA).',
            chapter: 6, chapterTitle: 'Introduction to TCP/IP'
        },
        // Q10: MC — Thermal paste and cooling (Ch 1)
        {
            type: 'mc',
            question: 'A technician is reseating a CPU cooler on a workstation that has been overheating. Which of the following is the correct procedure for applying thermal paste?',
            options: [
                'Apply a thick layer of thermal paste covering the entire CPU heat spreader and cooler base',
                'Clean old paste with isopropyl alcohol, apply a small pea-sized dot to the center of the CPU, then seat the cooler',
                'Apply thermal paste to both the CPU and the cooler base for maximum coverage',
                'Skip thermal paste entirely if the cooler has a copper contact surface'
            ],
            correct: 1,
            explanation: 'The correct procedure: (1) Clean all old thermal paste from both the CPU heat spreader and cooler base using 90%+ isopropyl alcohol and a lint-free cloth, (2) Apply a small pea-sized amount to the center of the CPU, (3) Seat the cooler with even pressure \u2014 the mounting pressure spreads the paste into a thin, even layer. Too much paste acts as an insulator and can overflow onto components. Some aftermarket coolers come with pre-applied paste. Review: Chapter 1 \u2014 Motherboards, Processors, and Memory (thermal management, thermal paste application, CPU cooler installation).',
            chapter: 1, chapterTitle: 'Motherboards, Processors, and Memory'
        }
    ];

    // ── State ──
    let state = { current: 0, answers: [], score: 0, shuffled: [] };
    const container = document.getElementById('prep-container');

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function showStart() {
        container.innerHTML = '<div class="quiz-engine theme-forge">' +
            '<div class="quiz-header" style="text-align:center;margin-bottom:0;padding-bottom:30px;">' +
            '<h1 class="quiz-title">' + CONFIG.title + '</h1>' +
            '<p style="color:#a8a29e;margin-bottom:8px;">' + CONFIG.subtitle + '</p>' +
            '<p style="color:#bbb;font-size:0.95rem;">' + CONFIG.description + '</p>' +
            '<div style="display:flex;justify-content:center;gap:10px;margin-top:18px;">' +
            '<span class="q-badge mc">4 MC</span><span class="q-badge gui">3 GUI</span><span class="q-badge terminal">3 Terminal</span></div>' +
            '<p style="color:#78716c;font-size:0.8rem;margin-top:12px;">Passing score: ' + CONFIG.passingScore + '%</p>' +
            '<button class="quiz-btn quiz-retry-btn" style="margin-top:25px;" onclick="startQuiz()">Start Round</button>' +
            '</div></div>';
    }

    function startQuiz() {
        state.shuffled = shuffle(QUESTIONS.map(function(q) { return Object.assign({}, q); }));
        state.shuffled.forEach(function(q) {
            if (q.type === 'mc') {
                var correctText = q.options[q.correct];
                q.shuffledOptions = shuffle([].concat(q.options));
                q.shuffledCorrect = q.shuffledOptions.indexOf(correctText);
            }
        });
        state.current = 0; state.answers = []; state.score = 0;
        showQuestion();
    }

    function showQuestion() {
        if (state.current >= state.shuffled.length) { endQuiz(); return; }
        var q = state.shuffled[state.current];
        var num = state.current + 1, total = state.shuffled.length;
        var pct = ((state.current) / total * 100).toFixed(0);
        var typeLabel = q.type === 'mc' ? 'Multiple Choice' : q.type === 'gui' ? 'GUI Simulation' : 'Terminal Command';
        var qBody = '';
        if (q.type === 'mc') qBody = renderMC(q);
        else if (q.type === 'gui') qBody = renderGUI(q);
        else qBody = renderTerminal(q);

        container.innerHTML = '<div class="quiz-engine theme-forge">' +
            '<div class="quiz-header"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
            '<span style="color:#78716c;font-size:0.85rem;">Question ' + num + ' of ' + total + '</span>' +
            '<span class="q-badge ' + q.type + '">' + typeLabel + '</span></div>' +
            '<div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:' + pct + '%"></div></div></div>' +
            '<div class="quiz-body" style="animation:fadeIn 0.3s;"><p class="question-text">' + q.question + '</p>' +
            qBody + '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next \u2192</button></div></div>';
        var inp = document.querySelector('.terminal-input');
        if (inp) setTimeout(function() { inp.focus(); }, 100);
    }

    function renderMC(q) {
        var opts = q.shuffledOptions || q.options;
        var letters = ['A','B','C','D'];
        return '<div class="quiz-options">' + opts.map(function(opt, i) {
            return '<button class="quiz-option" onclick="selectMC(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span class="option-text">' + opt + '</span></button>';
        }).join('') + '</div>';
    }

    function renderGUI(q) {
        var mockupHTML = '';
        if (q.mockup === 'task-manager') mockupHTML = buildTaskMgr();
        else if (q.mockup === 'bios-boot') mockupHTML = buildBIOSBoot();
        else if (q.mockup === 'devmgr-rollback') mockupHTML = buildDevMgrRollback();
        var titleMap = { 'task-manager': 'Task Manager', 'bios-boot': 'AMI BIOS Setup Utility', 'devmgr-rollback': 'Device Manager' };
        return '<div class="mockup-frame"><div class="mockup-titlebar">' +
            '<div class="mockup-dots"><span style="background:#ef4444"></span><span style="background:#eab308"></span><span style="background:#22c55e"></span></div>' +
            '<span>' + (titleMap[q.mockup] || '') + '</span></div><div class="mockup-body">' + mockupHTML + '</div></div>';
    }

    function buildTaskMgr() {
        function proc(id, name, cpu, mem, disk) {
            var cpuClass = parseInt(cpu) > 50 ? ' class="high-cpu"' : '';
            return '<div class="taskmgr-process" onclick="selectGUI(\'' + id + '\',this)">' +
                '<span>' + name + '</span><span' + cpuClass + '>' + cpu + '</span><span>' + mem + '</span><span>' + disk + '</span></div>';
        }
        return '<div class="taskmgr">' +
            '<div class="taskmgr-tabs"><span class="taskmgr-tab active">Processes</span><span class="taskmgr-tab">Performance</span><span class="taskmgr-tab">Startup</span><span class="taskmgr-tab">Details</span></div>' +
            '<div class="taskmgr-header"><span>Name</span><span>CPU</span><span>Memory</span><span>Disk</span></div>' +
            proc('proc-malware', 'svchost_update.exe', '94%', '342 MB', '12 MB/s') +
            proc('proc-chrome', 'Google Chrome', '8%', '1.2 GB', '0.5 MB/s') +
            proc('proc-antivirus', 'Windows Security', '3%', '180 MB', '0.1 MB/s') +
            proc('proc-explorer', 'Windows Explorer', '2%', '95 MB', '0 MB/s') +
            proc('proc-system', 'System', '1%', '42 MB', '0.2 MB/s') +
            '</div>';
    }

    function buildBIOSBoot() {
        function row(id, label, val, style) {
            return '<div class="bios-row" onclick="selectGUI(\'' + id + '\',this)"><span>' + label + '</span><span class="bios-val"' + (style ? ' style="'+style+'"' : '') + '>[' + val + ']</span></div>';
        }
        return '<div class="bios-screen">' +
            '<div class="bios-hdr">AMI BIOS Setup Utility v2.21</div>' +
            '<div class="bios-tabs"><span class="bios-tab">Main</span><span class="bios-tab">Advanced</span><span class="bios-tab">Security</span><span class="bios-tab active">Boot</span><span class="bios-tab">Save &amp; Exit</span></div>' +
            '<div class="bios-content">' +
            row('boot-order', 'Boot Option #1', 'SATA: WDC 500GB', 'color:#ff6666') +
            row('fast-boot', 'Fast Boot', 'Enabled') +
            row('secure-boot-ctl', 'Secure Boot Control', 'Enabled') +
            row('csm-support', 'CSM (Compatibility Support)', 'Disabled') +
            row('pxe-boot', 'PXE/Network Boot', 'Disabled') +
            '<div class="bios-note">Change Boot Option #1 to USB device to boot from recovery drive</div>' +
            '<div class="bios-help">\u2190 \u2192 Select Tab | \u2191 \u2193 Select Item | Enter Change Value | F10 Save &amp; Exit</div>' +
            '</div></div>';
    }

    function buildDevMgrRollback() {
        function dev(id, color, name, note) {
            return '<div class="devmgr-dev" onclick="selectGUI(\'' + id + '\',this)">' +
                '<span class="dev-icon" style="background:' + color + '"></span> ' + name + '</div>' +
                (note ? '<div class="devmgr-note">' + note + '</div>' : '');
        }
        function cat(label, devices) {
            return '<div style="padding:1px 0"><div class="devmgr-cat-label"><span class="arrow">\u25BC</span> ' + label + '</div>' + devices + '</div>';
        }
        return '<div class="devmgr">' +
            '<div class="devmgr-toolbar"><span>File</span><span>Action</span><span>View</span><span>Help</span></div>' +
            '<div class="devmgr-tree">' +
            cat('Display adapters',
                dev('gpu-flickering', '#4a90d9', 'NVIDIA GeForce RTX 3060', 'Driver updated 2 days ago \u2014 screen flickering reported')) +
            cat('Network adapters',
                dev('net-intel', '#4a90d9', 'Intel I219-V Gigabit Ethernet')) +
            cat('Sound, video and game controllers',
                dev('audio-realtek', '#e67e22', 'Realtek High Definition Audio')) +
            cat('Universal Serial Bus controllers',
                dev('usb-hub', '#888', 'Generic USB Hub')) +
            cat('Disk drives',
                dev('nvme-samsung', '#333', 'Samsung 970 EVO Plus NVMe')) +
            '</div></div>';
    }

    function renderTerminal(q) {
        return '<div class="terminal-frame"><div class="terminal-titlebar"><span>Administrator: Command Prompt</span></div>' +
            '<div class="terminal-body"><div class="terminal-line" style="color:#888;">Microsoft Windows [Version 10.0.19045]</div>' +
            '<div class="terminal-line" style="color:#888;margin-bottom:8px;">(c) Microsoft Corporation. All rights reserved.</div>' +
            '<div class="terminal-line"><span class="terminal-prompt">' + q.prompt + ' </span>' +
            '<input class="terminal-input" id="termInput" type="text" placeholder="Type command here..." autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')submitTerminal()"></div>' +
            '</div><div class="terminal-actions"><button class="terminal-btn" onclick="submitTerminal()">Execute \u21B5</button></div></div>';
    }

    // ── Handlers ──
    function selectMC(idx) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        var correct = q.shuffledCorrect !== undefined ? q.shuffledCorrect : q.correct;
        state.answers[state.current] = { type: 'mc', selected: idx, correct: idx === correct };
        if (idx === correct) state.score++;
        document.querySelectorAll('.quiz-option').forEach(function(el, i) {
            el.disabled = true;
            if (i === idx) el.classList.add('selected');
        });
        document.getElementById('nextBtn').classList.add('visible');
    }

    function selectGUI(hotspotId, el) {
        if (state.answers[state.current] !== undefined) return;
        var q = state.shuffled[state.current];
        state.answers[state.current] = { type: 'gui', selectedId: hotspotId, correct: hotspotId === q.correctId };
        if (hotspotId === q.correctId) state.score++;
        var body = document.querySelector('.mockup-body');
        if (body) body.querySelectorAll('[onclick]').forEach(function(e) { e.style.pointerEvents = 'none'; });
        if (el) el.classList.add('selected');
        document.getElementById('nextBtn').classList.add('visible');
    }

    function submitTerminal() {
        if (state.answers[state.current] !== undefined) return;
        var input = document.getElementById('termInput');
        if (!input) return;
        var val = input.value.trim();
        if (!val) return;
        var q = state.shuffled[state.current];
        var isCorrect = q.accepted.some(function(a) { return val.toLowerCase() === a.toLowerCase(); });
        state.answers[state.current] = { type: 'terminal', input: val, correct: isCorrect };
        if (isCorrect) state.score++;
        input.disabled = true;
        input.style.color = isCorrect ? '#4ade80' : '#ef4444';
        document.querySelector('.terminal-btn').disabled = true;
        document.getElementById('nextBtn').classList.add('visible');
    }

    function nextQuestion() { state.current++; showQuestion(); }

    function endQuiz() {
        var total = state.shuffled.length;
        var pct = Math.round((state.score / total) * 100);
        var passed = pct >= CONFIG.passingScore;
        saveProgress(pct, state.score, total);
        showResults(pct, passed, total);
    }

    function showResults(pct, passed, total) {
        var mc = state.answers.filter(function(a) { return a && a.type === 'mc'; });
        var gui = state.answers.filter(function(a) { return a && a.type === 'gui'; });
        var term = state.answers.filter(function(a) { return a && a.type === 'terminal'; });
        var mcOk = mc.filter(function(a) { return a.correct; }).length;
        var guiOk = gui.filter(function(a) { return a.correct; }).length;
        var termOk = term.filter(function(a) { return a.correct; }).length;

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-results ' + (passed ? 'passed' : 'failed') + '">' +
            '<div class="results-header"><h2 class="results-title">' + (passed ? 'Round Complete!' : 'Keep Practicing') + '</h2></div>' +
            '<div class="results-score"><div class="score-circle ' + (passed ? 'passed' : 'failed') + '">' +
            '<span class="score-percentage">' + pct + '%</span><span class="score-fraction">' + state.score + '/' + total + '</span></div></div>' +
            '<p class="results-message">' + (passed ? 'Troubleshooting mastered. All four prep rounds complete!' : 'You need ' + CONFIG.passingScore + '% to pass. Review the explanations and try again.') + '</p>' +
            '<div class="results-stats">' +
            '<div class="stat"><span class="stat-value">' + mcOk + '/' + mc.length + '</span><span class="stat-label">MC</span></div>' +
            '<div class="stat"><span class="stat-value">' + guiOk + '/' + gui.length + '</span><span class="stat-label">GUI</span></div>' +
            '<div class="stat"><span class="stat-value">' + termOk + '/' + term.length + '</span><span class="stat-label">Terminal</span></div></div>' +
            (passed ? '<div class="results-achievement"><strong>Achievement Unlocked:</strong> Core 1 Prep \u2014 Round 4</div>' : '') +
            '<div class="results-actions"><button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="showReview()">Review Answers</button></div></div></div>';
    }

    function showReview() {
        var cards = '';
        state.shuffled.forEach(function(q, i) {
            var ans = state.answers[i] || {};
            var ok = ans.correct;
            var statusClass = ok ? 'correct' : 'incorrect';
            var typeLabel = q.type === 'mc' ? 'MC' : q.type === 'gui' ? 'GUI' : 'Terminal';
            var body = '';

            if (q.type === 'mc') {
                var opts = q.shuffledOptions || q.options;
                var correctIdx = q.shuffledCorrect !== undefined ? q.shuffledCorrect : q.correct;
                body = '<div class="review-options">' + opts.map(function(opt, j) {
                    var cls = '';
                    if (j === correctIdx) cls = 'correct-answer';
                    else if (j === ans.selected) cls = 'wrong-selected';
                    return '<div class="review-option ' + cls + '">' + ['A','B','C','D'][j] + '. ' + opt + '</div>';
                }).join('') + '</div>';
            } else if (q.type === 'gui') {
                var selectedName = q.hotspots[ans.selectedId] || 'No selection';
                var correctName = q.hotspots[q.correctId];
                body = '<div style="padding:10px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:0.9rem;">' +
                    '<p>You clicked: <strong style="color:' + (ok ? '#2ed573' : '#ff4757') + '">' + selectedName + '</strong></p>' +
                    (!ok ? '<p>Correct answer: <strong style="color:#2ed573">' + correctName + '</strong></p>' : '') + '</div>';
            } else {
                body = '<div class="terminal-frame" style="margin:10px 0;"><div class="terminal-body" style="padding:8px 12px;min-height:auto;">' +
                    '<div>You typed: <span style="color:' + (ok ? '#4ade80' : '#ef4444') + '">' + (ans.input || '(empty)') + '</span></div>' +
                    (!ok ? '<div>Correct: <span style="color:#4ade80">' + q.expectedDisplay + '</span></div>' : '') + '</div></div>';
            }

            cards += '<div class="review-item ' + statusClass + '"><div class="review-header"><span class="review-num">Q' + (i+1) + '</span>' +
                '<span class="q-badge ' + q.type + '" style="font-size:0.65rem;padding:2px 8px;">' + typeLabel + '</span>' +
                '<span class="review-status">' + (ok ? '\u2713' : '\u2717') + '</span></div>' +
                '<p class="review-question">' + q.question + '</p>' + body +
                '<div class="review-explanation">' + q.explanation + '</div></div>';
        });

        container.innerHTML = '<div class="quiz-engine theme-forge"><div class="quiz-review">' +
            '<div class="review-header-bar"><h2>Review \u2014 Round 4</h2>' +
            '<button class="quiz-btn quiz-review-btn" onclick="endQuiz()">Back to Results</button></div>' +
            '<div class="review-list">' + cards + '</div>' +
            '<div class="review-footer"><button class="quiz-btn quiz-retry-btn" onclick="startQuiz()">Retry</button>' +
            '<button class="quiz-btn quiz-review-btn" onclick="endQuiz()">Back to Results</button></div></div></div>';
    }

    function saveProgress(pct, score, total) {
        try {
            var key = CONFIG.storageKey;
            var data = { completed: true, score: pct, correct: score, total: total, completedAt: new Date().toISOString() };
            localStorage.setItem(key, JSON.stringify(data));
            var progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
            if (!progress.forge) progress.forge = {};
            progress.forge[key] = data;
            localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            if (typeof ModuleProgress !== 'undefined') ModuleProgress.completeQuiz(CONFIG.moduleId, CONFIG.houseId, pct);
            if (pct >= CONFIG.passingScore && typeof AchievementManager !== 'undefined') AchievementManager.unlock(CONFIG.achievement);
        } catch (e) { console.warn('[Prep] Save failed:', e); }
    }

    showStart();
    </script>
</body>
</html>
