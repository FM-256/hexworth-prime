<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 23 Quiz: Change Management - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0d0d12 0%, #0f1a15 50%, #0d0d12 100%); font-family: 'Segoe UI', sans-serif; color: #b5d4c4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; }
        .header h1 { color: #d5f5e8; font-size: 1.8rem; margin-bottom: 10px; }
        .back-link { display: inline-block; color: #4ade80; text-decoration: none; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(34, 197, 94, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.3s; }
        .question-card { background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .question-num { color: #4ade80; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #d5f5e8; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(34, 197, 94, 0.05); border: 2px solid rgba(34, 197, 94, 0.2); border-radius: 10px; cursor: pointer; }
        .option:hover { background: rgba(34, 197, 94, 0.1); }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(34, 197, 94, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .explanation h4 { color: #4ade80; margin-bottom: 10px; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 8px; color: white; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; margin: 20px 0; }
        .score.pass { color: #4ade80; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; color: #4ade80; text-decoration: none; }
        .nav-link.primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; }
        .complete-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="chapters/ch23-change-management/index.html" class="back-link" onclick="if(history.length>1){history.back();return false;}">← Back to Chapter 23</a>
        <div class="header">
            <h1>Chapter 23 Quiz</h1>
            <p style="color: #7a9e8b;">Change Management</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/change-management.html" class="nav-link">Review</a>
                <a href="../../labs/change-management-lab.html" class="nav-link">Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake</button>
                <a href="../../index.html" class="nav-link">Course Home</a>
            </div>
        </div>
    </div>
    <script>
        const questions = [
            {
                question: "What is the PRIMARY purpose of change management in IT operations?",
                options: [
                    "To prevent any changes from being made to systems",
                    "To control and document changes to minimize risk and disruption",
                    "To speed up the implementation of all requested changes",
                    "To reduce the IT department's workload"
                ],
                correct: 1,
                explanation: "Change management's primary purpose is to control and document changes in a structured way that minimizes risk and service disruption. It doesn't prevent changes but ensures they are properly reviewed, tested, and implemented."
            },
            {
                question: "Which type of change is pre-approved and requires NO CAB review?",
                options: [
                    "Emergency change",
                    "Normal change",
                    "Standard change",
                    "Critical change"
                ],
                correct: 2,
                explanation: "Standard changes are pre-approved, low-risk, routine changes that don't require CAB review. Examples include password resets and user account creation. Normal changes require CAB review, while emergency changes use an expedited process."
            },
            {
                question: "What does CAB stand for in change management?",
                options: [
                    "Change Administration Bureau",
                    "Critical Assessment Board",
                    "Change Advisory Board",
                    "Configuration Analysis Branch"
                ],
                correct: 2,
                explanation: "CAB stands for Change Advisory Board. It's a group of stakeholders (IT managers, technical leads, security officers, business representatives) who review, assess, and approve or reject proposed changes."
            },
            {
                question: "Which document is used to formally request approval for a proposed change?",
                options: [
                    "Change Order (CO)",
                    "Request for Change (RFC)",
                    "Service Level Agreement (SLA)",
                    "Work Order (WO)"
                ],
                correct: 1,
                explanation: "A Request for Change (RFC) is the formal document used to request approval for a proposed change. It includes the change description, justification, scope, risk assessment, implementation plan, rollback plan, and schedule."
            },
            {
                question: "A critical security vulnerability requires immediate patching. What type of change is this?",
                options: [
                    "Standard change",
                    "Normal change",
                    "Emergency change",
                    "Routine change"
                ],
                correct: 2,
                explanation: "An emergency change is used for urgent situations that require immediate action, such as patching a critical security vulnerability that is being actively exploited. Emergency changes use an expedited approval process but should still be documented."
            },
            {
                question: "What is the PRIMARY purpose of a rollback plan?",
                options: [
                    "To document how changes were made",
                    "To provide a way to reverse a change if it fails",
                    "To speed up the implementation process",
                    "To train users on the new system"
                ],
                correct: 1,
                explanation: "A rollback plan documents how to reverse a change if something goes wrong during or after implementation. It should include step-by-step reversal procedures, backups, timeline, and criteria for when to trigger a rollback."
            },
            {
                question: "What is a sandbox environment used for in change management?",
                options: [
                    "Training new employees",
                    "Storing backup data",
                    "Testing changes before production deployment",
                    "Running production workloads"
                ],
                correct: 2,
                explanation: "A sandbox (or test environment) is an isolated environment where changes can be tested safely without affecting production systems. Changes should be validated in test/staging environments before being deployed to production."
            },
            {
                question: "Impact analysis in change management helps determine:",
                options: [
                    "How much the change will cost",
                    "Which vendor to select",
                    "What systems and users will be affected",
                    "Who should be blamed if it fails"
                ],
                correct: 2,
                explanation: "Impact analysis evaluates how a change will affect systems, users, and business operations. It identifies affected servers, applications, networks, user groups, dependencies, duration, and potential downtime."
            },
            {
                question: "What should happen AFTER a change is successfully implemented?",
                options: [
                    "Immediately start the next change",
                    "Delete all documentation to save storage",
                    "Obtain end-user acceptance and update documentation",
                    "Disable the rollback plan"
                ],
                correct: 2,
                explanation: "After implementation, you should verify the change meets requirements, obtain end-user acceptance (formal sign-off), update all relevant documentation (network diagrams, procedures), and conduct a lessons learned review."
            },
            {
                question: "According to risk assessment, a change with HIGH likelihood of failure and HIGH impact should be classified as:",
                options: [
                    "Low risk",
                    "Medium risk",
                    "High risk",
                    "Critical risk"
                ],
                correct: 3,
                explanation: "Using a risk matrix, a change with both high likelihood of failure AND high impact is classified as Critical Risk. Such changes require additional testing, smaller rollout phases, scheduling during low-usage periods, and may require executive approval."
            }
        ];

        let currentQuestion = 0, score = 0, answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>
                    <div class="explanation" id="explanation"><h4>Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(i) {
            if (answered) return;
            answered = true;
            const q = questions[currentQuestion], opts = document.querySelectorAll('.option');
            opts.forEach(o => o.classList.add('disabled'));
            opts[i].classList.add(i === q.correct ? 'correct' : 'incorrect');
            opts[q.correct].classList.add('correct');
            if (i === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            const sd = document.getElementById('scoreDisplay');
            sd.textContent = pct + '%';
            sd.className = 'score ' + (pct >= 80 ? 'pass' : pct < 60 ? 'fail' : '');
            document.getElementById('resultMessage').textContent = pct >= 80
                ? `Excellent! You scored ${score}/${questions.length}. You have a solid understanding of change management!`
                : pct >= 60
                    ? `Good effort! You scored ${score}/${questions.length}. Review the topics you missed.`
                    : `You scored ${score}/${questions.length}. Consider reviewing the presentation and lab before retaking.`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <div style="text-align: center; padding: 30px;">
        <button class="complete-btn" onclick="markComplete()">✓ Mark Complete</button>
    </div>
    <script>
        function saveProgress() {
            try {
                const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
                if (!progress.forge) progress.forge = {};
                progress.forge['core2-ch23-quiz'] = {
                    completed: true,
                    completedAt: new Date().toISOString(),
                    score: 100
                };
                localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            } catch (e) {
                console.warn('[Forge] Failed to save:', e);
            }
        }
        function markComplete() {
            saveProgress();
            const btn = document.querySelector('.complete-btn');
            if (btn) { btn.innerHTML = '✓ Completed!'; btn.disabled = true; }
        }
    </script>
    <script src="../../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
