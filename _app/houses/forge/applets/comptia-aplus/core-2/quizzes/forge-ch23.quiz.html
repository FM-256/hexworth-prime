<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 23 Quiz: Change Management',
            description: 'A+ Core 2 - CAB, RFC, rollback plans, and risk assessment',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch23',
            moduleId: 'core2-ch23',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the PRIMARY purpose of change management in IT operations?',
                    options: [
                        'To prevent any changes from being made to systems',
                        'To control and document changes to minimize risk and disruption',
                        'To speed up the implementation of all requested changes',
                        'To reduce the IT department\'s workload'
                    ],explanation: 'Change management\'s primary purpose is to control and document changes in a structured way that minimizes risk and service disruption. It doesn\'t prevent changes but ensures they are properly reviewed, tested, and implemented.'
                },
                {
                    question: 'Which type of change is pre-approved and requires NO CAB review?',
                    options: [
                        'Emergency change',
                        'Normal change',
                        'Standard change',
                        'Critical change'
                    ],explanation: 'Standard changes are pre-approved, low-risk, routine changes that don\'t require CAB review. Examples include password resets and user account creation. Normal changes require CAB review, while emergency changes use an expedited process.'
                },
                {
                    question: 'What does CAB stand for in change management?',
                    options: [
                        'Change Administration Bureau',
                        'Critical Assessment Board',
                        'Change Advisory Board',
                        'Configuration Analysis Branch'
                    ],explanation: 'CAB stands for Change Advisory Board. It\'s a group of stakeholders (IT managers, technical leads, security officers, business representatives) who review, assess, and approve or reject proposed changes.'
                },
                {
                    question: 'Which document is used to formally request approval for a proposed change?',
                    options: [
                        'Change Order (CO)',
                        'Request for Change (RFC)',
                        'Service Level Agreement (SLA)',
                        'Work Order (WO)'
                    ],explanation: 'A Request for Change (RFC) is the formal document used to request approval for a proposed change. It includes the change description, justification, scope, risk assessment, implementation plan, rollback plan, and schedule.'
                },
                {
                    question: 'A critical security vulnerability requires immediate patching. What type of change is this?',
                    options: [
                        'Standard change',
                        'Normal change',
                        'Emergency change',
                        'Routine change'
                    ],explanation: 'An emergency change is used for urgent situations that require immediate action, such as patching a critical security vulnerability that is being actively exploited. Emergency changes use an expedited approval process but should still be documented.'
                },
                {
                    question: 'What is the PRIMARY purpose of a rollback plan?',
                    options: [
                        'To document how changes were made',
                        'To provide a way to reverse a change if it fails',
                        'To speed up the implementation process',
                        'To train users on the new system'
                    ],explanation: 'A rollback plan documents how to reverse a change if something goes wrong during or after implementation. It should include step-by-step reversal procedures, backups, timeline, and criteria for when to trigger a rollback.'
                },
                {
                    question: 'What is a sandbox environment used for in change management?',
                    options: [
                        'Training new employees',
                        'Storing backup data',
                        'Testing changes before production deployment',
                        'Running production workloads'
                    ],explanation: 'A sandbox (or test environment) is an isolated environment where changes can be tested safely without affecting production systems. Changes should be validated in test/staging environments before being deployed to production.'
                },
                {
                    question: 'Impact analysis in change management helps determine:',
                    options: [
                        'How much the change will cost',
                        'Which vendor to select',
                        'What systems and users will be affected',
                        'Who should be blamed if it fails'
                    ],explanation: 'Impact analysis evaluates how a change will affect systems, users, and business operations. It identifies affected servers, applications, networks, user groups, dependencies, duration, and potential downtime.'
                },
                {
                    question: 'What should happen AFTER a change is successfully implemented?',
                    options: [
                        'Immediately start the next change',
                        'Delete all documentation to save storage',
                        'Obtain end-user acceptance and update documentation',
                        'Disable the rollback plan'
                    ],explanation: 'After implementation, you should verify the change meets requirements, obtain end-user acceptance (formal sign-off), update all relevant documentation (network diagrams, procedures), and conduct a lessons learned review.'
                },
                {
                    question: 'According to risk assessment, a change with HIGH likelihood of failure and HIGH impact should be classified as:',
                    options: [
                        'Low risk',
                        'Medium risk',
                        'High risk',
                        'Critical risk'
                    ],explanation: 'Using a risk matrix, a change with both high likelihood of failure AND high impact is classified as Critical Risk. Such changes require additional testing, smaller rollout phases, scheduling during low-usage periods, and may require executive approval.'
                }
            ]
        });
        quiz.start();
    </script>
