<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 22 Quiz: Incident Response',
            description: 'A+ Core 2 - First responder actions, evidence handling, and IR phases',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch22',
            moduleId: 'core2-ch22',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the FIRST action a first responder should take when discovering a potential security incident?',
                    options: [
                        'Power off the affected system immediately',
                        'Begin investigating the root cause',
                        'Secure the scene and document observations',
                        'Run antivirus software to remove threats'
                    ],explanation: 'First responders should secure the scene and begin documenting observations immediately. Powering off could destroy volatile evidence, and investigation should be left to trained incident responders. The priority is to preserve evidence and report.'
                },
                {
                    question: 'According to the order of volatility, which data should be collected FIRST during incident response?',
                    options: [
                        'Hard drive contents',
                        'System logs',
                        'RAM (memory) contents',
                        'Backup tapes'
                    ],explanation: 'RAM (memory) contents are the most volatile - they are lost immediately when power is removed. The order of volatility goes: CPU registers/cache → RAM → Network state → Running processes → Disk → Remote logging → Physical media.'
                },
                {
                    question: 'What is the primary purpose of maintaining a chain of custody?',
                    options: [
                        'To speed up the investigation process',
                        'To prove evidence integrity for legal proceedings',
                        'To identify the attacker faster',
                        'To reduce storage costs for evidence'
                    ],explanation: 'Chain of custody documents everyone who handled evidence, ensuring its integrity can be proven in court. A broken chain of custody can make evidence inadmissible in legal proceedings.'
                },
                {
                    question: 'A user reports their computer shows a ransom note demanding Bitcoin. The computer is still powered on. What should you do?',
                    options: [
                        'Immediately unplug the power cord',
                        'Take a screenshot and begin collecting volatile data',
                        'Pay the ransom to recover files',
                        'Let the user continue working while you investigate'
                    ],explanation: 'With the computer still on, volatile data (RAM, network connections, running processes) can still be captured. Taking a screenshot documents the current state. Never power off until volatile data is collected, and never pay ransoms.'
                },
                {
                    question: 'Which hash algorithm is MOST recommended for evidence integrity verification?',
                    options: [
                        'MD5',
                        'SHA-1',
                        'SHA-256',
                        'CRC32'
                    ],explanation: 'SHA-256 is currently the recommended standard for evidence integrity verification. MD5 and SHA-1 have known collision vulnerabilities and are considered legacy. CRC32 is a checksum, not a cryptographic hash.'
                },
                {
                    question: 'What is the correct order of the incident response phases?',
                    options: [
                        'Identification, Preparation, Containment, Eradication, Recovery, Lessons Learned',
                        'Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned',
                        'Containment, Identification, Preparation, Recovery, Eradication, Lessons Learned',
                        'Preparation, Containment, Identification, Recovery, Eradication, Lessons Learned'
                    ],explanation: 'The six phases in order are: 1) Preparation, 2) Identification, 3) Containment, 4) Eradication, 5) Recovery, 6) Lessons Learned. Preparation comes first because you need plans and tools ready BEFORE an incident occurs.'
                },
                {
                    question: 'You find a suspicious mobile device during an investigation. What should you do FIRST?',
                    options: [
                        'Power it off to preserve battery',
                        'Unlock it to check for evidence',
                        'Place it in a Faraday bag or enable airplane mode',
                        'Connect it to a computer to copy files'
                    ],explanation: 'Mobile devices should be isolated from network communications immediately to prevent remote wipe commands. A Faraday bag blocks all wireless signals, or airplane mode can be enabled. Keep it charged - a dead battery could lock you out.'
                },
                {
                    question: 'What type of evidence would include witness statements and interviews?',
                    options: [
                        'Digital evidence',
                        'Physical evidence',
                        'Documentary evidence',
                        'Testimonial evidence'
                    ],explanation: 'Testimonial evidence includes witness statements, interviews, and verbal accounts from people involved in or who observed the incident. Digital evidence is data from computers, physical evidence is tangible items, and documentary evidence is written records.'
                },
                {
                    question: 'During incident documentation, why is it important to record exact timestamps?',
                    options: [
                        'To calculate overtime pay for responders',
                        'To correlate events and establish timeline of the attack',
                        'To meet compliance reporting deadlines',
                        'To schedule follow-up meetings'
                    ],explanation: 'Exact timestamps allow investigators to correlate events across multiple systems and establish a precise timeline of the attack. This helps determine how the incident occurred, what systems were affected, and in what order.'
                },
                {
                    question: 'What is the purpose of the \'Lessons Learned\' phase of incident response?',
                    options: [
                        'To assign blame to responsible parties',
                        'To improve future incident response and prevent recurrence',
                        'To calculate the cost of the incident',
                        'To satisfy regulatory requirements only'
                    ],explanation: 'The Lessons Learned phase focuses on what worked well, what could be improved, and what changes should be made to prevent similar incidents. It\'s about continuous improvement, not blame. Findings should be documented and used to update procedures.'
                }
            ]
        });
        quiz.start();
    </script>
