<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 22 Quiz: Incident Response - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0d0d12 0%, #0f1a15 50%, #0d0d12 100%); font-family: 'Segoe UI', sans-serif; color: #b5d4c4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; }
        .header h1 { color: #d5f5e8; font-size: 1.8rem; margin-bottom: 10px; }
        .back-link { display: inline-block; color: #4ade80; text-decoration: none; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(34, 197, 94, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.3s; }
        .question-card { background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .question-num { color: #4ade80; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #d5f5e8; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(34, 197, 94, 0.05); border: 2px solid rgba(34, 197, 94, 0.2); border-radius: 10px; cursor: pointer; }
        .option:hover { background: rgba(34, 197, 94, 0.1); }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(34, 197, 94, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .explanation h4 { color: #4ade80; margin-bottom: 10px; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 8px; color: white; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; margin: 20px 0; }
        .score.pass { color: #4ade80; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; color: #4ade80; text-decoration: none; }
        .nav-link.primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; }
        .complete-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="chapters/ch22-incident-response/index.html" class="back-link">← Back to Chapter 22</a>
        <div class="header">
            <h1>Chapter 22 Quiz</h1>
            <p style="color: #7a9e8b;">Incident Response</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/incident-response.html" class="nav-link">Review</a>
                <a href="../../labs/incident-response-lab.html" class="nav-link">Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake</button>
                <a href="../chapters/ch23-change-management/index.html" class="nav-link primary">Next →</a>
            </div>
        </div>
    </div>
    <script>
        const questions = [
            {
                question: "What is the FIRST action a first responder should take when discovering a potential security incident?",
                options: ["Power off the affected system immediately", "Begin investigating the root cause", "Secure the scene and document observations", "Run antivirus software to remove threats"],
                correct: 2,
                explanation: "First responders should secure the scene and begin documenting observations immediately. Powering off could destroy volatile evidence, and investigation should be left to trained incident responders. The priority is to preserve evidence and report."
            },
            {
                question: "According to the order of volatility, which data should be collected FIRST during incident response?",
                options: ["Hard drive contents", "System logs", "RAM (memory) contents", "Backup tapes"],
                correct: 2,
                explanation: "RAM (memory) contents are the most volatile - they are lost immediately when power is removed. The order of volatility goes: CPU registers/cache → RAM → Network state → Running processes → Disk → Remote logging → Physical media."
            },
            {
                question: "What is the primary purpose of maintaining a chain of custody?",
                options: ["To speed up the investigation process", "To prove evidence integrity for legal proceedings", "To identify the attacker faster", "To reduce storage costs for evidence"],
                correct: 1,
                explanation: "Chain of custody documents everyone who handled evidence, ensuring its integrity can be proven in court. A broken chain of custody can make evidence inadmissible in legal proceedings."
            },
            {
                question: "A user reports their computer shows a ransom note demanding Bitcoin. The computer is still powered on. What should you do?",
                options: ["Immediately unplug the power cord", "Take a screenshot and begin collecting volatile data", "Pay the ransom to recover files", "Let the user continue working while you investigate"],
                correct: 1,
                explanation: "With the computer still on, volatile data (RAM, network connections, running processes) can still be captured. Taking a screenshot documents the current state. Never power off until volatile data is collected, and never pay ransoms."
            },
            {
                question: "Which hash algorithm is MOST recommended for evidence integrity verification?",
                options: ["MD5", "SHA-1", "SHA-256", "CRC32"],
                correct: 2,
                explanation: "SHA-256 is currently the recommended standard for evidence integrity verification. MD5 and SHA-1 have known collision vulnerabilities and are considered legacy. CRC32 is a checksum, not a cryptographic hash."
            },
            {
                question: "What is the correct order of the incident response phases?",
                options: ["Identification, Preparation, Containment, Eradication, Recovery, Lessons Learned", "Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned", "Containment, Identification, Preparation, Recovery, Eradication, Lessons Learned", "Preparation, Containment, Identification, Recovery, Eradication, Lessons Learned"],
                correct: 1,
                explanation: "The six phases in order are: 1) Preparation, 2) Identification, 3) Containment, 4) Eradication, 5) Recovery, 6) Lessons Learned. Preparation comes first because you need plans and tools ready BEFORE an incident occurs."
            },
            {
                question: "You find a suspicious mobile device during an investigation. What should you do FIRST?",
                options: ["Power it off to preserve battery", "Unlock it to check for evidence", "Place it in a Faraday bag or enable airplane mode", "Connect it to a computer to copy files"],
                correct: 2,
                explanation: "Mobile devices should be isolated from network communications immediately to prevent remote wipe commands. A Faraday bag blocks all wireless signals, or airplane mode can be enabled. Keep it charged - a dead battery could lock you out."
            },
            {
                question: "What type of evidence would include witness statements and interviews?",
                options: ["Digital evidence", "Physical evidence", "Documentary evidence", "Testimonial evidence"],
                correct: 3,
                explanation: "Testimonial evidence includes witness statements, interviews, and verbal accounts from people involved in or who observed the incident. Digital evidence is data from computers, physical evidence is tangible items, and documentary evidence is written records."
            },
            {
                question: "During incident documentation, why is it important to record exact timestamps?",
                options: ["To calculate overtime pay for responders", "To correlate events and establish timeline of the attack", "To meet compliance reporting deadlines", "To schedule follow-up meetings"],
                correct: 1,
                explanation: "Exact timestamps allow investigators to correlate events across multiple systems and establish a precise timeline of the attack. This helps determine how the incident occurred, what systems were affected, and in what order."
            },
            {
                question: "What is the purpose of the 'Lessons Learned' phase of incident response?",
                options: ["To assign blame to responsible parties", "To improve future incident response and prevent recurrence", "To calculate the cost of the incident", "To satisfy regulatory requirements only"],
                correct: 1,
                explanation: "The Lessons Learned phase focuses on what worked well, what could be improved, and what changes should be made to prevent similar incidents. It's about continuous improvement, not blame. Findings should be documented and used to update procedures."
            }
        ];
        let currentQuestion = 0, score = 0, answered = false;
        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>
                    <div class="explanation" id="explanation"><h4>Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }
        function selectOption(i) {
            if (answered) return; answered = true;
            const q = questions[currentQuestion], opts = document.querySelectorAll('.option');
            opts.forEach(o => o.classList.add('disabled'));
            opts[i].classList.add(i === q.correct ? 'correct' : 'incorrect');
            opts[q.correct].classList.add('correct');
            if (i === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); } else showResults(); }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } }
        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            const sd = document.getElementById('scoreDisplay');
            sd.textContent = pct + '%';
            sd.className = 'score ' + (pct >= 80 ? 'pass' : pct < 60 ? 'fail' : '');
            document.getElementById('resultMessage').textContent = pct >= 80 ? `Excellent! ${score}/${questions.length}` : pct >= 60 ? `Good effort! ${score}/${questions.length}` : `Review needed. ${score}/${questions.length}`;
        }
        function restartQuiz() { currentQuestion = 0; score = 0; document.getElementById('results').classList.remove('show'); renderQuestion(); }
        renderQuestion();
    </script>
    <div style="text-align: center; padding: 30px;">
        <button class="complete-btn" onclick="markComplete()">✓ Mark Complete</button>
    </div>
    <script>
        function saveProgress() {
            try {
                const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
                if (!progress.forge) progress.forge = {};
                progress.forge['core2-ch22-quiz'] = {
                    completed: true,
                    completedAt: new Date().toISOString(),
                    score: 100
                };
                localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            } catch (e) {
                console.warn('[Forge] Failed to save:', e);
            }
        }
        function markComplete() {
            saveProgress();
            const btn = document.querySelector('.complete-btn');
            if (btn) { btn.innerHTML = '✓ Completed!'; btn.disabled = true; }
        }
    </script>
    <script src="../../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
