<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>

    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 18 Quiz: Users, Groups & Permissions',
            description: 'A+ Core 2 - User accounts, UAC, NTFS permissions, and groups',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch18',
            moduleId: 'core2-ch18',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'Which account type is recommended for day-to-day work to minimize security risks?',
                    options: [
                        'Administrator',
                        'Standard User',
                        'Guest',
                        'Power User'
                    ],explanation: 'Standard User accounts provide sufficient privileges for daily tasks while protecting the system from unauthorized changes. Administrators should only be used when necessary.'
                },
                {
                    question: 'What does UAC (User Account Control) do when a standard user attempts an administrative task?',
                    options: [
                        'Automatically allows the action',
                        'Blocks the action completely',
                        'Prompts for administrator credentials',
                        'Logs the user out'
                    ],explanation: 'UAC displays a credential prompt to standard users, requiring them to enter administrator credentials to elevate privileges for the task.'
                },
                {
                    question: 'Where are local user accounts stored in Windows?',
                    options: [
                        'Active Directory',
                        'SAM database',
                        'Registry',
                        'User profile folder'
                    ],explanation: 'Local user accounts are stored in the Security Account Manager (SAM) database located at C:\\Windows\\System32\\config\\SAM.'
                },
                {
                    question: 'Which NTFS permission allows a user to read, execute, and delete files but NOT change permissions?',
                    options: [
                        'Full Control',
                        'Modify',
                        'Read & Execute',
                        'Write'
                    ],explanation: 'Modify permission includes Read, Write, Execute, and Delete capabilities, but does not include the ability to change permissions or take ownership.'
                },
                {
                    question: 'What happens when both Share permissions (Full Control) and NTFS permissions (Read) apply to a folder accessed over the network?',
                    options: [
                        'Full Control takes effect',
                        'Read takes effect',
                        'The permissions combine to give Modify',
                        'Access is denied'
                    ],explanation: 'When both Share and NTFS permissions apply, the most restrictive permission wins. Read is more restrictive than Full Control, so Read is the effective permission.'
                },
                {
                    question: 'What command lists all local user accounts on a Windows computer?',
                    options: [
                        'net users',
                        'net user',
                        'list users',
                        'get-user'
                    ],explanation: 'The \'net user\' command (without a username) lists all local user accounts. With a username, it displays details about that specific account.'
                },
                {
                    question: 'In NTFS permission conflicts, what happens when a user has both Allow and Deny for the same permission?',
                    options: [
                        'Allow takes precedence',
                        'Deny takes precedence',
                        'They cancel each other out',
                        'The most recent setting applies'
                    ],explanation: 'Deny always overrides Allow in NTFS permissions. If a user is denied a permission through any group membership, they will be denied regardless of other Allow entries.'
                },
                {
                    question: 'Which Windows Hello authentication method uses the device\'s camera?',
                    options: [
                        'PIN',
                        'Fingerprint',
                        'Facial recognition',
                        'Security key'
                    ],explanation: 'Windows Hello facial recognition uses an IR camera to create a biometric profile of the user\'s face for authentication.'
                },
                {
                    question: 'What tool can you use to view the effective permissions a user has on a file or folder?',
                    options: [
                        'Properties → Security → Advanced → Effective Access',
                        'Properties → Sharing → Permissions',
                        'Control Panel → User Accounts',
                        'Computer Management → Shares'
                    ],explanation: 'The Effective Access tab in Advanced Security Settings allows you to enter a user or group name and see their calculated effective permissions.'
                },
                {
                    question: 'What command adds a user named \'techsupport\' to the Administrators group?',
                    options: [
                        'net group Administrators techsupport /add',
                        'net localgroup Administrators techsupport /add',
                        'add-user Administrators techsupport',
                        'net user techsupport /admin'
                    ],explanation: '\'net localgroup\' is used for local groups. The syntax is: net localgroup [groupname] [username] /add to add a user to a local group.'
                }
            ]
        });
        quiz.start();
    </script>
