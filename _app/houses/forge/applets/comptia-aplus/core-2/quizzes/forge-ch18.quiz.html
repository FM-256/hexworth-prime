<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 18 Quiz: Users, Groups & Permissions - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c4b5d4;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
        }
        .question-card {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-num { color: #a78bfa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(139, 92, 246, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.4); }
        .option.selected { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            display: none;
        }
        .explanation.show { display: block; }
        .explanation h4 { color: #a78bfa; margin-bottom: 10px; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results {
            text-align: center;
            padding: 40px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            display: none;
        }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #a78bfa; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link {
            padding: 10px 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(139, 92, 246, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch18-users-groups/index.html" class="back-link">← Back to Chapter 18</a>

        <div class="header">
            <h1>Chapter 18 Quiz</h1>
            <p>Users, Groups & Permissions</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span id="progressText">Question 1 of 10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../presentations/forge-users-groups.presentation.html" class="nav-link">Review Presentation</a>
                <a href="../labs/forge-users-groups.lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch19-security/index.html" class="nav-link primary" id="nextChapter">Next Chapter →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which account type is recommended for day-to-day work to minimize security risks?",
                options: ["Administrator", "Standard User", "Guest", "Power User"],
                correct: 1,
                explanation: "Standard User accounts provide sufficient privileges for daily tasks while protecting the system from unauthorized changes. Administrators should only be used when necessary."
            },
            {
                question: "What does UAC (User Account Control) do when a standard user attempts an administrative task?",
                options: [
                    "Automatically allows the action",
                    "Blocks the action completely",
                    "Prompts for administrator credentials",
                    "Logs the user out"
                ],
                correct: 2,
                explanation: "UAC displays a credential prompt to standard users, requiring them to enter administrator credentials to elevate privileges for the task."
            },
            {
                question: "Where are local user accounts stored in Windows?",
                options: [
                    "Active Directory",
                    "SAM database",
                    "Registry",
                    "User profile folder"
                ],
                correct: 1,
                explanation: "Local user accounts are stored in the Security Account Manager (SAM) database located at C:\\Windows\\System32\\config\\SAM."
            },
            {
                question: "Which NTFS permission allows a user to read, execute, and delete files but NOT change permissions?",
                options: ["Full Control", "Modify", "Read & Execute", "Write"],
                correct: 1,
                explanation: "Modify permission includes Read, Write, Execute, and Delete capabilities, but does not include the ability to change permissions or take ownership."
            },
            {
                question: "What happens when both Share permissions (Full Control) and NTFS permissions (Read) apply to a folder accessed over the network?",
                options: [
                    "Full Control takes effect",
                    "Read takes effect",
                    "The permissions combine to give Modify",
                    "Access is denied"
                ],
                correct: 1,
                explanation: "When both Share and NTFS permissions apply, the most restrictive permission wins. Read is more restrictive than Full Control, so Read is the effective permission."
            },
            {
                question: "What command lists all local user accounts on a Windows computer?",
                options: ["net users", "net user", "list users", "get-user"],
                correct: 1,
                explanation: "The 'net user' command (without a username) lists all local user accounts. With a username, it displays details about that specific account."
            },
            {
                question: "In NTFS permission conflicts, what happens when a user has both Allow and Deny for the same permission?",
                options: [
                    "Allow takes precedence",
                    "Deny takes precedence",
                    "They cancel each other out",
                    "The most recent setting applies"
                ],
                correct: 1,
                explanation: "Deny always overrides Allow in NTFS permissions. If a user is denied a permission through any group membership, they will be denied regardless of other Allow entries."
            },
            {
                question: "Which Windows Hello authentication method uses the device's camera?",
                options: ["PIN", "Fingerprint", "Facial recognition", "Security key"],
                correct: 2,
                explanation: "Windows Hello facial recognition uses an IR camera to create a biometric profile of the user's face for authentication."
            },
            {
                question: "What tool can you use to view the effective permissions a user has on a file or folder?",
                options: [
                    "Properties → Security → Advanced → Effective Access",
                    "Properties → Sharing → Permissions",
                    "Control Panel → User Accounts",
                    "Computer Management → Shares"
                ],
                correct: 0,
                explanation: "The Effective Access tab in Advanced Security Settings allows you to enter a user or group name and see their calculated effective permissions."
            },
            {
                question: "What command adds a user named 'techsupport' to the Administrators group?",
                options: [
                    "net group Administrators techsupport /add",
                    "net localgroup Administrators techsupport /add",
                    "add-user Administrators techsupport",
                    "net user techsupport /admin"
                ],
                correct: 1,
                explanation: "'net localgroup' is used for local groups. The syntax is: net localgroup [groupname] [username] /add to add a user to a local group."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            if (index === q.correct) score++;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered this chapter!`;
            } else if (percentage >= 60) {
                scoreDisplay.classList.remove('pass', 'fail');
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking the quiz.`;
            }

            // Save progress
            localStorage.setItem('core2-ch18-quiz', JSON.stringify({
                score: score,
                total: questions.length,
                completed: true
            }));
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
