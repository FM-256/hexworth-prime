<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 16 Quiz: System Tools & Utilities - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c4b5d4;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
        }
        .question-card {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-num { color: #a78bfa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(139, 92, 246, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.4); }
        .option.selected { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            display: none;
        }
        .explanation.show { display: block; }
        .explanation h4 { color: #a78bfa; margin-bottom: 10px; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results {
            text-align: center;
            padding: 40px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            display: none;
        }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #a78bfa; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link {
            padding: 10px 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(139, 92, 246, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch16-system-tools/index.html" class="back-link">← Back to Chapter 16</a>

        <div class="header">
            <h1>Chapter 16 Quiz</h1>
            <p>System Tools & Utilities</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span id="progressText">Question 1 of 10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/system-tools.html" class="nav-link">Review Presentation</a>
                <a href="../../labs/system-tools-lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch17-macos-linux/index.html" class="nav-link primary" id="nextChapter">Next Chapter →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which Task Manager tab allows you to disable programs that automatically run when Windows starts?",
                options: ["Processes", "Performance", "Startup", "Services"],
                correct: 2,
                explanation: "The Startup tab in Task Manager displays all programs configured to run at Windows startup. You can right-click any item to disable it, which helps improve boot times and reduce system resource usage."
            },
            {
                question: "A technician needs to boot Windows into Safe Mode. Which utility should be used to configure this option?",
                options: ["Task Manager", "System Configuration (msconfig)", "Registry Editor (regedit)", "System Information (msinfo32)"],
                correct: 1,
                explanation: "System Configuration (msconfig) includes a Boot tab where you can enable Safe Mode and other boot options. This is the proper method to configure Safe Mode on next restart without using advanced startup options."
            },
            {
                question: "In the Windows Registry, which hive contains hardware configuration information detected during startup?",
                options: ["HKEY_LOCAL_MACHINE", "HKEY_CURRENT_USER", "HKEY_CLASSES_ROOT", "HKEY_USERS"],
                correct: 0,
                explanation: "HKEY_LOCAL_MACHINE (HKLM) contains hardware and software configuration for the local computer, including hardware profiles detected during the boot process. This hive stores system-wide settings."
            },
            {
                question: "Which command-line tool is used to gather detailed system configuration information including hardware resources, components, and software environment?",
                options: ["dxdiag", "msinfo32", "msconfig", "sfc"],
                correct: 1,
                explanation: "System Information (msinfo32) provides a comprehensive view of hardware, software, and system components. It's valuable for troubleshooting and can export reports for documentation or remote support."
            },
            {
                question: "A user reports display problems and audio issues in games. Which diagnostic tool should you run first?",
                options: ["System Configuration", "Device Manager", "DirectX Diagnostic Tool (dxdiag)", "Disk Cleanup"],
                correct: 2,
                explanation: "The DirectX Diagnostic Tool (dxdiag) is specifically designed to troubleshoot video and sound issues related to DirectX. It tests display adapters, sound devices, and input devices, making it ideal for gaming issues."
            },
            {
                question: "Which utility removes temporary files, downloaded program files, and empties the Recycle Bin to free up disk space?",
                options: ["Disk Defragmenter", "Disk Cleanup", "System File Checker", "DISM"],
                correct: 1,
                explanation: "Disk Cleanup (cleanmgr) removes temporary files, system cache, downloaded program files, and can empty the Recycle Bin. It also offers to clean up Windows Update files and previous Windows installations."
            },
            {
                question: "On a traditional hard disk drive (HDD), which utility should be run periodically to improve file access performance?",
                options: ["Disk Cleanup", "System File Checker", "Optimize Drives (Defragment)", "DISM"],
                correct: 2,
                explanation: "Optimize Drives (defrag) reorganizes fragmented data on HDDs so files are stored contiguously, improving read/write performance. Note: SSDs should not be defragmented; Windows automatically runs TRIM instead."
            },
            {
                question: "What command scans Windows system files and replaces corrupted or missing files with cached copies?",
                options: ["DISM /Online /Cleanup-Image /RestoreHealth", "sfc /scannow", "chkdsk /f", "cleanmgr"],
                correct: 1,
                explanation: "System File Checker (sfc /scannow) scans all protected system files and replaces corrupted files with a cached copy from the Windows component store. It must be run from an elevated command prompt."
            },
            {
                question: "If System File Checker fails to repair corrupted files, which tool should be run to repair the Windows image before running SFC again?",
                options: ["chkdsk", "Disk Cleanup", "DISM /Online /Cleanup-Image /RestoreHealth", "msconfig"],
                correct: 2,
                explanation: "DISM (Deployment Image Servicing and Management) can repair the Windows component store that SFC uses. Running 'DISM /Online /Cleanup-Image /RestoreHealth' downloads fresh copies from Windows Update to fix the image."
            },
            {
                question: "Which Windows Recovery Environment option allows you to restore Windows to a previous point in time without affecting personal files?",
                options: ["Reset this PC", "System Restore", "System Image Recovery", "Startup Repair"],
                correct: 1,
                explanation: "System Restore reverts system files, registry settings, and installed programs to a previous restore point without affecting personal documents. It's ideal for recovering from problematic software installations or driver updates."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            if (index === q.correct) score++;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered this chapter!`;
            } else if (percentage >= 60) {
                scoreDisplay.classList.remove('pass', 'fail');
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking the quiz.`;
            }

            // Save progress
            localStorage.setItem('core2-ch16-quiz', JSON.stringify({
                score: score,
                total: questions.length,
                completed: true
            }));
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
