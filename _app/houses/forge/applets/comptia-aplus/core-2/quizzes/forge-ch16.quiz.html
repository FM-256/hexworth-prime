<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 16 Quiz: System Tools & Utilities',
            description: 'A+ Core 2 - Task Manager, msconfig, Registry Editor, and diagnostics',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch16',
            moduleId: 'core2-ch16',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'Which Task Manager tab allows you to disable programs that automatically run when Windows starts?',
                    options: [
                        'Processes',
                        'Performance',
                        'Startup',
                        'Services'
                    ],explanation: 'The Startup tab in Task Manager displays all programs configured to run at Windows startup. You can right-click any item to disable it, which helps improve boot times and reduce system resource usage.'
                },
                {
                    question: 'A technician needs to boot Windows into Safe Mode. Which utility should be used to configure this option?',
                    options: [
                        'Task Manager',
                        'System Configuration (msconfig)',
                        'Registry Editor (regedit)',
                        'System Information (msinfo32)'
                    ],explanation: 'System Configuration (msconfig) includes a Boot tab where you can enable Safe Mode and other boot options. This is the proper method to configure Safe Mode on next restart without using advanced startup options.'
                },
                {
                    question: 'In the Windows Registry, which hive contains hardware configuration information detected during startup?',
                    options: [
                        'HKEY_LOCAL_MACHINE',
                        'HKEY_CURRENT_USER',
                        'HKEY_CLASSES_ROOT',
                        'HKEY_USERS'
                    ],explanation: 'HKEY_LOCAL_MACHINE (HKLM) contains hardware and software configuration for the local computer, including hardware profiles detected during the boot process. This hive stores system-wide settings.'
                },
                {
                    question: 'Which command-line tool is used to gather detailed system configuration information including hardware resources, components, and software environment?',
                    options: [
                        'dxdiag',
                        'msinfo32',
                        'msconfig',
                        'sfc'
                    ],explanation: 'System Information (msinfo32) provides a comprehensive view of hardware, software, and system components. It\'s valuable for troubleshooting and can export reports for documentation or remote support.'
                },
                {
                    question: 'A user reports display problems and audio issues in games. Which diagnostic tool should you run first?',
                    options: [
                        'System Configuration',
                        'Device Manager',
                        'DirectX Diagnostic Tool (dxdiag)',
                        'Disk Cleanup'
                    ],explanation: 'The DirectX Diagnostic Tool (dxdiag) is specifically designed to troubleshoot video and sound issues related to DirectX. It tests display adapters, sound devices, and input devices, making it ideal for gaming issues.'
                },
                {
                    question: 'Which utility removes temporary files, downloaded program files, and empties the Recycle Bin to free up disk space?',
                    options: [
                        'Disk Defragmenter',
                        'Disk Cleanup',
                        'System File Checker',
                        'DISM'
                    ],explanation: 'Disk Cleanup (cleanmgr) removes temporary files, system cache, downloaded program files, and can empty the Recycle Bin. It also offers to clean up Windows Update files and previous Windows installations.'
                },
                {
                    question: 'On a traditional hard disk drive (HDD), which utility should be run periodically to improve file access performance?',
                    options: [
                        'Disk Cleanup',
                        'System File Checker',
                        'Optimize Drives (Defragment)',
                        'DISM'
                    ],explanation: 'Optimize Drives (defrag) reorganizes fragmented data on HDDs so files are stored contiguously, improving read/write performance. Note: SSDs should not be defragmented; Windows automatically runs TRIM instead.'
                },
                {
                    question: 'What command scans Windows system files and replaces corrupted or missing files with cached copies?',
                    options: [
                        'DISM /Online /Cleanup-Image /RestoreHealth',
                        'sfc /scannow',
                        'chkdsk /f',
                        'cleanmgr'
                    ],explanation: 'System File Checker (sfc /scannow) scans all protected system files and replaces corrupted files with a cached copy from the Windows component store. It must be run from an elevated command prompt.'
                },
                {
                    question: 'If System File Checker fails to repair corrupted files, which tool should be run to repair the Windows image before running SFC again?',
                    options: [
                        'chkdsk',
                        'Disk Cleanup',
                        'DISM /Online /Cleanup-Image /RestoreHealth',
                        'msconfig'
                    ],explanation: 'DISM (Deployment Image Servicing and Management) can repair the Windows component store that SFC uses. Running \'DISM /Online /Cleanup-Image /RestoreHealth\' downloads fresh copies from Windows Update to fix the image.'
                },
                {
                    question: 'Which Windows Recovery Environment option allows you to restore Windows to a previous point in time without affecting personal files?',
                    options: [
                        'Reset this PC',
                        'System Restore',
                        'System Image Recovery',
                        'Startup Repair'
                    ],explanation: 'System Restore reverts system files, registry settings, and installed programs to a previous restore point without affecting personal documents. It\'s ideal for recovering from problematic software installations or driver updates.'
                }
            ]
        });
        quiz.start();
    </script>
