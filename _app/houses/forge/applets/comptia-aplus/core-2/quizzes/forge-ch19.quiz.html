<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 19 Quiz: Security Fundamentals - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c4b5d4;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link { display: inline-block; color: #f87171; text-decoration: none; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }
        .progress-bar { width: 100%; height: 6px; background: rgba(220, 38, 38, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f87171); transition: width 0.3s ease; }
        .question-card {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-num { color: #f87171; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(220, 38, 38, 0.05);
            border: 2px solid rgba(220, 38, 38, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(220, 38, 38, 0.1); border-color: rgba(220, 38, 38, 0.4); }
        .option.selected { background: rgba(220, 38, 38, 0.2); border-color: #dc2626; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(220, 38, 38, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .explanation h4 { color: #f87171; margin-bottom: 10px; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #dc2626, #b91c1c); border: none; border-radius: 8px; color: white; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(220, 38, 38, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #f87171; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; color: #f87171; text-decoration: none; }
        .nav-link:hover { background: rgba(220, 38, 38, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="chapters/ch19-security/index.html" class="back-link">← Back to Chapter 19</a>
        <div class="header">
            <h1>Chapter 19 Quiz</h1>
            <p>Security Fundamentals</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../presentations/forge-security-fundamentals.presentation.html" class="nav-link">Review Presentation</a>
                <a href="../labs/forge-security-fundamentals.lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch20-malware/index.html" class="nav-link primary">Next Chapter →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the difference between authentication and authorization?",
                options: [
                    "Authentication grants permissions; authorization verifies identity",
                    "Authentication verifies identity; authorization grants permissions",
                    "They are the same thing",
                    "Authentication is for networks; authorization is for files"
                ],
                correct: 1,
                explanation: "Authentication verifies WHO you are (identity), while authorization determines WHAT you can access (permissions). Authentication always happens first."
            },
            {
                question: "Which combination represents TRUE multifactor authentication (MFA)?",
                options: [
                    "Password + PIN",
                    "Fingerprint + facial recognition",
                    "Password + SMS code",
                    "Two different passwords"
                ],
                correct: 2,
                explanation: "MFA requires factors from DIFFERENT categories. Password (something you know) + SMS code (something you have) uses two different factor types. Two passwords or two biometrics are from the same category."
            },
            {
                question: "What is the correct Group Policy processing order?",
                options: [
                    "Domain → Site → Local → OU",
                    "OU → Domain → Site → Local",
                    "Local → Site → Domain → OU",
                    "Site → Local → Domain → OU"
                ],
                correct: 2,
                explanation: "GPO processing follows LSDOU: Local → Site → Domain → OU. Later policies override earlier ones, so OU policies have the highest priority."
            },
            {
                question: "Which command opens the Local Security Policy console?",
                options: ["gpedit.msc", "secpol.msc", "lusrmgr.msc", "compmgmt.msc"],
                correct: 1,
                explanation: "secpol.msc opens Local Security Policy. gpedit.msc is Local Group Policy Editor, lusrmgr.msc is Local Users and Groups, compmgmt.msc is Computer Management."
            },
            {
                question: "What does setting account lockout threshold to 0 mean?",
                options: [
                    "Account locks after 0 failed attempts",
                    "Account never locks out",
                    "Account is permanently locked",
                    "Account locks for 0 minutes"
                ],
                correct: 1,
                explanation: "A lockout threshold of 0 means the account will never be locked out regardless of failed login attempts. This is NOT recommended as it allows unlimited password guessing."
            },
            {
                question: "In Active Directory, what is an Organizational Unit (OU)?",
                options: [
                    "A physical server location",
                    "A container for organizing AD objects",
                    "A user account type",
                    "A network segment"
                ],
                correct: 1,
                explanation: "An OU is a container within Active Directory used to organize objects like users, computers, and groups. OUs can also have Group Policies linked to them."
            },
            {
                question: "What password policy setting prevents users from cycling through passwords to reuse an old one?",
                options: [
                    "Maximum password age",
                    "Minimum password age",
                    "Password history",
                    "Password complexity"
                ],
                correct: 2,
                explanation: "Password history remembers previous passwords (typically 24). Combined with minimum password age, it prevents users from quickly cycling through passwords to return to a favorite."
            },
            {
                question: "Which authentication protocol does Active Directory primarily use?",
                options: ["NTLM", "Kerberos", "RADIUS", "OAuth"],
                correct: 1,
                explanation: "Kerberos is the primary authentication protocol in Active Directory. It provides single sign-on capabilities and uses tickets for authentication."
            },
            {
                question: "What type of data would be classified as 'PII'?",
                options: [
                    "Company marketing materials",
                    "Internal org charts",
                    "Social Security numbers",
                    "Public press releases"
                ],
                correct: 2,
                explanation: "PII (Personally Identifiable Information) includes data that can identify an individual: SSN, driver's license numbers, financial accounts, medical records. PII requires special protection."
            },
            {
                question: "What is a key benefit of Single Sign-On (SSO)?",
                options: [
                    "Requires separate passwords for each system",
                    "Users authenticate once to access multiple resources",
                    "Eliminates the need for passwords entirely",
                    "Only works with local accounts"
                ],
                correct: 1,
                explanation: "SSO allows users to authenticate once and access multiple systems without re-entering credentials. This improves user convenience and enables centralized access control."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `<div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>`).join('')}
                    </div>
                    <div class="explanation" id="explanation"><h4>Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');
            if (index === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); }
            else { showResults(); }
        }

        function prevQuestion() {
            if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered security fundamentals!`;
            } else if (percentage >= 60) {
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking.`;
            }
            localStorage.setItem('core2-ch19-quiz', JSON.stringify({ score, total: questions.length, completed: true }));
        }

        function restartQuiz() { currentQuestion = 0; score = 0; document.getElementById('results').classList.remove('show'); renderQuestion(); }
        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
