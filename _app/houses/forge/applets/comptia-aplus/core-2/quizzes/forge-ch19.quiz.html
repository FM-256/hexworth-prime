<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 19 Quiz: Security Fundamentals',
            description: 'A+ Core 2 - Authentication, authorization, Group Policy, and security',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch19',
            moduleId: 'core2-ch19',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the difference between authentication and authorization?',
                    options: [
                        'Authentication grants permissions; authorization verifies identity',
                        'Authentication verifies identity; authorization grants permissions',
                        'They are the same thing',
                        'Authentication is for networks; authorization is for files'
                    ],explanation: 'Authentication verifies WHO you are (identity), while authorization determines WHAT you can access (permissions). Authentication always happens first.'
                },
                {
                    question: 'Which combination represents TRUE multifactor authentication (MFA)?',
                    options: [
                        'Password + PIN',
                        'Fingerprint + facial recognition',
                        'Password + SMS code',
                        'Two different passwords'
                    ],explanation: 'MFA requires factors from DIFFERENT categories. Password (something you know) + SMS code (something you have) uses two different factor types. Two passwords or two biometrics are from the same category.'
                },
                {
                    question: 'What is the correct Group Policy processing order?',
                    options: [
                        'Domain → Site → Local → OU',
                        'OU → Domain → Site → Local',
                        'Local → Site → Domain → OU',
                        'Site → Local → Domain → OU'
                    ],explanation: 'GPO processing follows LSDOU: Local → Site → Domain → OU. Later policies override earlier ones, so OU policies have the highest priority.'
                },
                {
                    question: 'Which command opens the Local Security Policy console?',
                    options: [
                        'gpedit.msc',
                        'secpol.msc',
                        'lusrmgr.msc',
                        'compmgmt.msc'
                    ],explanation: 'secpol.msc opens Local Security Policy. gpedit.msc is Local Group Policy Editor, lusrmgr.msc is Local Users and Groups, compmgmt.msc is Computer Management.'
                },
                {
                    question: 'What does setting account lockout threshold to 0 mean?',
                    options: [
                        'Account locks after 0 failed attempts',
                        'Account never locks out',
                        'Account is permanently locked',
                        'Account locks for 0 minutes'
                    ],explanation: 'A lockout threshold of 0 means the account will never be locked out regardless of failed login attempts. This is NOT recommended as it allows unlimited password guessing.'
                },
                {
                    question: 'In Active Directory, what is an Organizational Unit (OU)?',
                    options: [
                        'A physical server location',
                        'A container for organizing AD objects',
                        'A user account type',
                        'A network segment'
                    ],explanation: 'An OU is a container within Active Directory used to organize objects like users, computers, and groups. OUs can also have Group Policies linked to them.'
                },
                {
                    question: 'What password policy setting prevents users from cycling through passwords to reuse an old one?',
                    options: [
                        'Maximum password age',
                        'Minimum password age',
                        'Password history',
                        'Password complexity'
                    ],explanation: 'Password history remembers previous passwords (typically 24). Combined with minimum password age, it prevents users from quickly cycling through passwords to return to a favorite.'
                },
                {
                    question: 'Which authentication protocol does Active Directory primarily use?',
                    options: [
                        'NTLM',
                        'Kerberos',
                        'RADIUS',
                        'OAuth'
                    ],explanation: 'Kerberos is the primary authentication protocol in Active Directory. It provides single sign-on capabilities and uses tickets for authentication.'
                },
                {
                    question: 'What type of data would be classified as \'PII\'?',
                    options: [
                        'Company marketing materials',
                        'Internal org charts',
                        'Social Security numbers',
                        'Public press releases'
                    ],explanation: 'PII (Personally Identifiable Information) includes data that can identify an individual: SSN, driver\'s license numbers, financial accounts, medical records. PII requires special protection.'
                },
                {
                    question: 'What is a key benefit of Single Sign-On (SSO)?',
                    options: [
                        'Requires separate passwords for each system',
                        'Users authenticate once to access multiple resources',
                        'Eliminates the need for passwords entirely',
                        'Only works with local accounts'
                    ],explanation: 'SSO allows users to authenticate once and access multiple systems without re-entering credentials. This improves user convenience and enables centralized access control.'
                }
            ]
        });
        quiz.start();
    </script>
