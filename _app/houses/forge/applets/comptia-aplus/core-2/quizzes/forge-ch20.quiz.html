<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 20 Quiz: Malware & Social Engineering',
            description: 'A+ Core 2 - Malware types, social engineering, and removal process',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch20',
            moduleId: 'core2-ch20',
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'Which malware type self-replicates and spreads without user action?',
                    options: [
                        'Virus',
                        'Worm',
                        'Trojan',
                        'Spyware'
                    ],
                    correct: 1,
                    explanation: 'Worms self-replicate and spread automatically across networks without requiring user action. Viruses require a host file and user action to spread.'
                },
                {
                    question: 'What type of malware encrypts files and demands payment?',
                    options: [
                        'Spyware',
                        'Adware',
                        'Ransomware',
                        'Rootkit'
                    ],
                    correct: 2,
                    explanation: 'Ransomware encrypts the victim\'s files and demands a ransom payment (usually cryptocurrency) for the decryption key.'
                },
                {
                    question: 'Which social engineering attack uses phone calls to trick victims?',
                    options: [
                        'Phishing',
                        'Vishing',
                        'Smishing',
                        'Whaling'
                    ],
                    correct: 1,
                    explanation: 'Vishing (voice phishing) uses phone calls to trick victims into revealing sensitive information. Smishing uses SMS, and phishing uses email.'
                },
                {
                    question: 'What is step 3 in the malware removal process?',
                    options: [
                        'Quarantine system',
                        'Disable System Restore',
                        'Remediate',
                        'Investigate'
                    ],
                    correct: 1,
                    explanation: 'Step 3 is Disable System Restore to prevent the malware from being restored from an infected restore point during remediation.'
                },
                {
                    question: 'Which malware type hides deep in the operating system and is very difficult to detect?',
                    options: [
                        'Trojan',
                        'Rootkit',
                        'Adware',
                        'Keylogger'
                    ],
                    correct: 1,
                    explanation: 'Rootkits embed themselves deep in the OS (often at kernel level) and actively hide their presence, making them very difficult to detect and remove.'
                },
                {
                    question: 'What is \'tailgating\' in security terms?',
                    options: [
                        'Phishing via email',
                        'Following someone through a secure door',
                        'Monitoring network traffic',
                        'Encrypting files'
                    ],
                    correct: 1,
                    explanation: 'Tailgating (also called piggybacking) is following an authorized person through a secure door or entrance without proper credentials.'
                },
                {
                    question: 'Which action isolates a suspected infected file for later analysis?',
                    options: [
                        'Delete',
                        'Quarantine',
                        'Encrypt',
                        'Compress'
                    ],
                    correct: 1,
                    explanation: 'Quarantine moves the suspected malware to a secure, isolated location where it cannot execute but can be analyzed or recovered if it\'s a false positive.'
                },
                {
                    question: 'What Windows feature protects folders against ransomware?',
                    options: [
                        'BitLocker',
                        'Controlled folder access',
                        'System Restore',
                        'UAC'
                    ],
                    correct: 1,
                    explanation: 'Controlled folder access in Windows Security prevents unauthorized apps from making changes to files in protected folders, defending against ransomware.'
                },
                {
                    question: 'Which attack targets high-level executives specifically?',
                    options: [
                        'Phishing',
                        'Spear phishing',
                        'Whaling',
                        'Vishing'
                    ],
                    correct: 2,
                    explanation: 'Whaling is a type of spear phishing that specifically targets high-level executives (the \'big fish\') like CEOs and CFOs.'
                },
                {
                    question: 'What should be the LAST step in malware removal?',
                    options: [
                        'Run antivirus scan',
                        'Enable System Restore',
                        'Educate the user',
                        'Disconnect from network'
                    ],
                    correct: 2,
                    explanation: 'The final step (step 7) is educating the end user about how the infection occurred and how to prevent future infections.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
