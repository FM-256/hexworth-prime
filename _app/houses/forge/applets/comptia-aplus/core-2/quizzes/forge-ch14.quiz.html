<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 14 Quiz: Windows Settings & Control Panel - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c4b5d4;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
        }
        .question-card {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-num { color: #a78bfa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(139, 92, 246, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.4); }
        .option.selected { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            display: none;
        }
        .explanation.show { display: block; }
        .explanation h4 { color: #a78bfa; margin-bottom: 10px; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results {
            text-align: center;
            padding: 40px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            display: none;
        }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #a78bfa; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link {
            padding: 10px 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(139, 92, 246, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch14-windows-settings/index.html" class="back-link">← Back to Chapter 14</a>

        <div class="header">
            <h1>Chapter 14 Quiz</h1>
            <p>Windows Settings & Control Panel</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span id="progressText">Question 1 of 10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../presentations/forge-windows-settings.presentation.html" class="nav-link">Review Presentation</a>
                <a href="../labs/forge-windows-settings.lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch15-admin-tools/index.html" class="nav-link primary" id="nextChapter">Next Chapter →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which Settings app category contains options for managing printers, Bluetooth devices, and mice?",
                options: ["System", "Devices", "Network & Internet", "Apps"],
                correct: 1,
                explanation: "The Devices category in Windows Settings manages connected hardware including printers, Bluetooth devices, mice, keyboards, touchpads, and USB devices."
            },
            {
                question: "A user wants to uninstall a traditional desktop application. Which Control Panel applet should they use?",
                options: ["System", "Programs and Features", "Administrative Tools", "Device Manager"],
                correct: 1,
                explanation: "Programs and Features (formerly Add/Remove Programs) is the Control Panel applet used to uninstall, change, or repair traditional desktop applications installed on Windows."
            },
            {
                question: "What is the recommended refresh rate for most monitors to prevent eye strain and ensure smooth visuals?",
                options: ["30 Hz", "60 Hz or higher", "24 Hz", "50 Hz"],
                correct: 1,
                explanation: "A refresh rate of 60 Hz or higher is recommended for comfortable viewing. Lower refresh rates can cause flickering and eye strain. Gaming monitors often support 120 Hz, 144 Hz, or higher."
            },
            {
                question: "Which power plan provides the best battery life on a laptop at the expense of performance?",
                options: ["Balanced", "High Performance", "Power Saver", "Ultimate Performance"],
                correct: 2,
                explanation: "Power Saver mode reduces system performance to maximize battery life. It lowers screen brightness, slows the processor, and puts components to sleep more aggressively."
            },
            {
                question: "Where would you configure proxy server settings in Windows 10/11?",
                options: [
                    "Settings → System → About",
                    "Settings → Network & Internet → Proxy",
                    "Control Panel → Internet Options → Security",
                    "Settings → Apps → Default apps"
                ],
                correct: 1,
                explanation: "Proxy settings are configured in Settings → Network & Internet → Proxy. You can set up automatic or manual proxy configuration for network connections."
            },
            {
                question: "A company wants to delay Windows feature updates for 30 days to test compatibility. Where is this configured?",
                options: [
                    "Settings → Update & Security → Windows Update → Advanced options",
                    "Control Panel → System → Advanced system settings",
                    "Settings → System → About",
                    "Control Panel → Administrative Tools → Services"
                ],
                correct: 0,
                explanation: "Windows Update Advanced options allow you to pause updates or defer feature updates for up to 365 days (on Windows 10 Pro/Enterprise). This gives IT departments time to test updates before deployment."
            },
            {
                question: "Which privacy setting controls whether apps can access your location data?",
                options: [
                    "Settings → Privacy → General",
                    "Settings → Privacy → Location",
                    "Settings → System → Display",
                    "Settings → Accounts → Sign-in options"
                ],
                correct: 1,
                explanation: "The Location setting under Privacy allows you to enable or disable location services system-wide and control which apps have permission to access your location data."
            },
            {
                question: "What is the primary purpose of a System Restore point?",
                options: [
                    "To back up personal files and documents",
                    "To save a snapshot of system files, drivers, and registry settings",
                    "To encrypt the hard drive",
                    "To defragment the hard drive"
                ],
                correct: 1,
                explanation: "System Restore creates snapshots of system files, installed programs, drivers, and registry settings. It does NOT back up personal files. Restore points allow you to roll back system changes without affecting documents."
            },
            {
                question: "Where do you configure which application opens PDF files by default in Windows 10/11?",
                options: [
                    "Control Panel → Programs and Features",
                    "Settings → Apps → Default apps → Choose defaults by file type",
                    "Settings → System → Display",
                    "Control Panel → File Explorer Options"
                ],
                correct: 1,
                explanation: "Default Apps settings (Settings → Apps → Default apps) lets you choose which applications handle specific file types, protocols, and tasks. You can set defaults by file type (.pdf, .jpg, etc.) or by app."
            },
            {
                question: "A user moving to France needs to change their system's date format and keyboard layout. Which settings should they modify?",
                options: [
                    "Settings → System → Display",
                    "Settings → Time & Language → Region and Language",
                    "Control Panel → Programs and Features",
                    "Settings → Personalization → Themes"
                ],
                correct: 1,
                explanation: "Time & Language settings control regional formats (date, time, currency), display language, speech settings, and keyboard layouts. Region settings adapt Windows to local conventions."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            if (index === q.correct) score++;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered this chapter!`;
            } else if (percentage >= 60) {
                scoreDisplay.classList.remove('pass', 'fail');
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking the quiz.`;
            }

            // Save progress
            localStorage.setItem('core2-ch14-quiz', JSON.stringify({
                score: score,
                total: questions.length,
                completed: true
            }));
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
