<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 17 Quiz: macOS & Linux Basics - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c4b5d4;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
        }
        .question-card {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-num { color: #a78bfa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(139, 92, 246, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.4); }
        .option.selected { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            display: none;
        }
        .explanation.show { display: block; }
        .explanation h4 { color: #a78bfa; margin-bottom: 10px; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results {
            text-align: center;
            padding: 40px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            display: none;
        }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #a78bfa; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link {
            padding: 10px 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(139, 92, 246, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch17-macos-linux/index.html" class="back-link">&larr; Back to Chapter 17</a>

        <div class="header">
            <h1>Chapter 17 Quiz</h1>
            <p>macOS & Linux Basics</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span id="progressText">Question 1 of 10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../presentations/forge-macos-linux-basics.presentation.html" class="nav-link">Review Presentation</a>
                <a href="../labs/forge-lab-macos-linux.lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch18-users-groups/index.html" class="nav-link primary" id="nextChapter">Next Chapter &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "In macOS, where are user-installed applications typically stored?",
                options: [
                    "/System/Applications",
                    "/Applications",
                    "/Users/Applications",
                    "/Library/Apps"
                ],
                correct: 1,
                explanation: "The /Applications folder is the standard location for user-installed applications in macOS. System applications are in /System/Applications, but third-party apps go in /Applications."
            },
            {
                question: "Which macOS feature provides automatic backup and versioning of files?",
                options: [
                    "File Vault",
                    "Spotlight",
                    "Time Machine",
                    "Mission Control"
                ],
                correct: 2,
                explanation: "Time Machine is Apple's built-in backup solution that automatically creates hourly, daily, and weekly backups. It allows users to restore individual files or the entire system to previous states."
            },
            {
                question: "In Linux, which directory contains system configuration files?",
                options: [
                    "/bin",
                    "/var",
                    "/etc",
                    "/usr"
                ],
                correct: 2,
                explanation: "The /etc directory contains system-wide configuration files. Examples include /etc/passwd for user accounts, /etc/fstab for filesystem mounts, and /etc/hosts for hostname resolution."
            },
            {
                question: "What Linux command displays the current working directory?",
                options: [
                    "cd",
                    "ls",
                    "pwd",
                    "dir"
                ],
                correct: 2,
                explanation: "The 'pwd' command (print working directory) displays the full path of the current directory. This is essential for navigation and scripting in the Linux terminal."
            },
            {
                question: "Which numeric value represents read, write, and execute permissions in Linux?",
                options: [
                    "5",
                    "6",
                    "7",
                    "8"
                ],
                correct: 2,
                explanation: "In Linux, permissions are represented numerically: read=4, write=2, execute=1. Combined, read+write+execute = 4+2+1 = 7. So 755 means rwx for owner, rx for group and others."
            },
            {
                question: "What command is used to install packages on Ubuntu and Debian-based Linux distributions?",
                options: [
                    "yum install",
                    "dnf install",
                    "apt install",
                    "pacman -S"
                ],
                correct: 2,
                explanation: "APT (Advanced Package Tool) is the package manager for Debian-based distributions like Ubuntu. Use 'apt install' or 'apt-get install' to install packages. Yum/dnf are for Red Hat-based systems."
            },
            {
                question: "In macOS, which application is used to access system settings and preferences?",
                options: [
                    "Control Panel",
                    "System Preferences / System Settings",
                    "Settings Manager",
                    "Configuration Utility"
                ],
                correct: 1,
                explanation: "System Preferences (renamed to System Settings in macOS Ventura and later) is the central location for configuring macOS settings including displays, network, security, and user accounts."
            },
            {
                question: "What Linux command changes file ownership?",
                options: [
                    "chmod",
                    "chown",
                    "chgrp",
                    "chattr"
                ],
                correct: 1,
                explanation: "The 'chown' command (change owner) modifies file ownership. Syntax: chown user:group filename. Use 'chmod' for permissions, 'chgrp' for group only, and 'chattr' for attributes."
            },
            {
                question: "Which command allows a regular user to execute commands with superuser (root) privileges in Linux?",
                options: [
                    "su",
                    "admin",
                    "sudo",
                    "root"
                ],
                correct: 2,
                explanation: "The 'sudo' command (superuser do) allows permitted users to execute commands as root or another user. It provides better security than logging in as root and creates an audit trail."
            },
            {
                question: "Which Linux directory contains user home folders?",
                options: [
                    "/users",
                    "/home",
                    "/var/users",
                    "/usr/home"
                ],
                correct: 1,
                explanation: "The /home directory contains individual user home directories (e.g., /home/john, /home/mary). Each user's personal files, settings, and documents are stored in their home folder."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            if (index === q.correct) score++;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered this chapter!`;
            } else if (percentage >= 60) {
                scoreDisplay.classList.remove('pass', 'fail');
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking the quiz.`;
            }

            // Save progress
            localStorage.setItem('core2-ch17-quiz', JSON.stringify({
                score: score,
                total: questions.length,
                completed: true
            }));
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
