<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 20 Quiz: Malware - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%); font-family: 'Segoe UI', sans-serif; color: #c4b5d4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .back-link { display: inline-block; color: #f87171; text-decoration: none; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(220, 38, 38, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f87171); transition: width 0.3s; }
        .question-card { background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .question-num { color: #f87171; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(220, 38, 38, 0.05); border: 2px solid rgba(220, 38, 38, 0.2); border-radius: 10px; cursor: pointer; }
        .option:hover { background: rgba(220, 38, 38, 0.1); }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(220, 38, 38, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #dc2626, #b91c1c); border: none; border-radius: 8px; color: white; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; color: #f87171; text-decoration: none; }
        .nav-link.primary { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="chapters/ch20-malware/index.html" class="back-link">← Back to Chapter 20</a>
        <div class="header">
            <h1>Chapter 20 Quiz</h1>
            <p style="color: #8b7a9e;">Malware & Social Engineering</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/malware.html" class="nav-link">Review</a>
                <a href="../../labs/malware-lab.html" class="nav-link">Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake</button>
                <a href="../chapters/ch21-physical-security/index.html" class="nav-link primary">Next →</a>
            </div>
        </div>
    </div>
    <script>
        const questions = [
            { question: "Which malware type self-replicates and spreads without user action?", options: ["Virus", "Worm", "Trojan", "Spyware"], correct: 1, explanation: "Worms self-replicate and spread automatically across networks without requiring user action. Viruses require a host file and user action to spread." },
            { question: "What type of malware encrypts files and demands payment?", options: ["Spyware", "Adware", "Ransomware", "Rootkit"], correct: 2, explanation: "Ransomware encrypts the victim's files and demands a ransom payment (usually cryptocurrency) for the decryption key." },
            { question: "Which social engineering attack uses phone calls to trick victims?", options: ["Phishing", "Vishing", "Smishing", "Whaling"], correct: 1, explanation: "Vishing (voice phishing) uses phone calls to trick victims into revealing sensitive information. Smishing uses SMS, and phishing uses email." },
            { question: "What is step 3 in the malware removal process?", options: ["Quarantine system", "Disable System Restore", "Remediate", "Investigate"], correct: 1, explanation: "Step 3 is Disable System Restore to prevent the malware from being restored from an infected restore point during remediation." },
            { question: "Which malware type hides deep in the operating system and is very difficult to detect?", options: ["Trojan", "Rootkit", "Adware", "Keylogger"], correct: 1, explanation: "Rootkits embed themselves deep in the OS (often at kernel level) and actively hide their presence, making them very difficult to detect and remove." },
            { question: "What is 'tailgating' in security terms?", options: ["Phishing via email", "Following someone through a secure door", "Monitoring network traffic", "Encrypting files"], correct: 1, explanation: "Tailgating (also called piggybacking) is following an authorized person through a secure door or entrance without proper credentials." },
            { question: "Which action isolates a suspected infected file for later analysis?", options: ["Delete", "Quarantine", "Encrypt", "Compress"], correct: 1, explanation: "Quarantine moves the suspected malware to a secure, isolated location where it cannot execute but can be analyzed or recovered if it's a false positive." },
            { question: "What Windows feature protects folders against ransomware?", options: ["BitLocker", "Controlled folder access", "System Restore", "UAC"], correct: 1, explanation: "Controlled folder access in Windows Security prevents unauthorized apps from making changes to files in protected folders, defending against ransomware." },
            { question: "Which attack targets high-level executives specifically?", options: ["Phishing", "Spear phishing", "Whaling", "Vishing"], correct: 2, explanation: "Whaling is a type of spear phishing that specifically targets high-level executives (the 'big fish') like CEOs and CFOs." },
            { question: "What should be the LAST step in malware removal?", options: ["Run antivirus scan", "Enable System Restore", "Educate the user", "Disconnect from network"], correct: 2, explanation: "The final step (step 7) is educating the end user about how the infection occurred and how to prevent future infections." }
        ];
        let currentQuestion = 0, score = 0, answered = false;
        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>
                    <div class="explanation" id="explanation"><h4 style="color:#f87171;margin-bottom:10px;">Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }
        function selectOption(i) {
            if (answered) return; answered = true;
            const q = questions[currentQuestion], opts = document.querySelectorAll('.option');
            opts.forEach(o => o.classList.add('disabled'));
            opts[i].classList.add(i === q.correct ? 'correct' : 'incorrect');
            opts[q.correct].classList.add('correct');
            if (i === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); } else showResults(); }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } }
        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            const sd = document.getElementById('scoreDisplay');
            sd.textContent = pct + '%';
            sd.className = 'score ' + (pct >= 80 ? 'pass' : pct < 60 ? 'fail' : '');
            document.getElementById('resultMessage').textContent = pct >= 80 ? `Excellent! ${score}/${questions.length}` : pct >= 60 ? `Good effort! ${score}/${questions.length}` : `Review needed. ${score}/${questions.length}`;
        }
        function restartQuiz() { currentQuestion = 0; score = 0; document.getElementById('results').classList.remove('show'); renderQuestion(); }
        renderQuestion();
    </script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
