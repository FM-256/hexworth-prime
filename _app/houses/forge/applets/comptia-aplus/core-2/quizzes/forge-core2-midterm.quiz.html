    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 2 Midterm Exam',
            description: 'CompTIA A+ 220-1102 comprehensive exam covering Chapters 13-24',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-midterm',
            moduleId: 'core2-midterm',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A company needs to join 200 workstations to an Active Directory domain for centralized management. Which is the MINIMUM Windows edition that supports domain join?',
                    options: [
                        'Windows 10/11 Home',
                        'Windows 10/11 Pro',
                        'Windows 10/11 Enterprise',
                        'Windows 10/11 Education'
                    ],explanation: 'Windows 10/11 Pro is the minimum edition that supports joining an Active Directory domain. The Home edition lacks domain join capability, Group Policy management, and Remote Desktop hosting. Enterprise and Education also support domain join but exceed the minimum requirement.'
                },
                {
                    question: 'A user is currently running a 32-bit version of Windows 10 Pro and wants to switch to the 64-bit version. What is the correct procedure?',
                    options: [
                        'Run Windows Update and select the 64-bit upgrade option',
                        'Change the architecture in Settings > System > About',
                        'Perform a clean install using 64-bit installation media',
                        'Use the DISM tool to convert the existing installation'
                    ],explanation: 'There is no in-place upgrade path from 32-bit to 64-bit Windows. A clean install with 64-bit installation media is required. The existing license key will work for either architecture, so no new purchase is needed. The user should back up all data before performing the clean install.'
                },
                {
                    question: 'In the Windows Settings app, which section would you navigate to in order to configure a VPN connection or view the current IP address?',
                    options: [
                        'System',
                        'Network & Internet',
                        'Devices',
                        'Apps'
                    ],explanation: 'Network & Internet in the Windows Settings app is where you configure VPN connections, view network status and IP addressing, manage Wi-Fi and Ethernet adapters, configure proxy settings, and check data usage. System handles display and power; Devices manages peripherals; Apps handles installed software.'
                },
                {
                    question: 'A technician needs to view the full computer name, domain membership status, and hardware device ID of a Windows workstation. Which tool provides this information in a single view?',
                    options: [
                        'Settings > System > About',
                        'Settings > Network & Internet',
                        'Control Panel > System (System Properties)',
                        'Settings > Accounts'
                    ],explanation: 'Control Panel > System (System Properties) displays the full computer name, domain or workgroup membership, Windows edition, processor, RAM, system type, and computer description in one consolidated view. While Settings > About shows some of this information, the classic System Properties dialog remains the authoritative source for domain/workgroup configuration.'
                },
                {
                    question: 'Which Event Viewer log records events related to logon attempts, object access, and policy changes as defined by the audit policy?',
                    options: [
                        'Application log',
                        'System log',
                        'Security log',
                        'Setup log'
                    ],explanation: 'The Security log records audit events including successful and failed logon attempts, object access (file/folder), privilege use, and policy changes. These events are controlled by the audit policy configured in Group Policy or Local Security Policy. The Application log records software events; the System log records OS component events; the Setup log tracks installation-related events.'
                },
                {
                    question: 'An administrator needs to run a disk cleanup script every Sunday at 2:00 AM without user intervention. Which Windows tool should be used?',
                    options: [
                        'Task Manager',
                        'Event Viewer',
                        'Task Scheduler',
                        'Services console'
                    ],explanation: 'Task Scheduler allows administrators to create automated tasks that run on specific schedules (time-based triggers), at system events (event-based triggers), or at startup/logon. A scheduled task can execute scripts, programs, or send notifications. Task Manager monitors running processes; Event Viewer reviews logs; Services manages background services.'
                },
                {
                    question: 'A user reports that their computer is running slowly. In Task Manager, which tab displays real-time CPU, memory, disk, and network utilization graphs?',
                    options: [
                        'Processes',
                        'Performance',
                        'Startup',
                        'Details'
                    ],explanation: 'The Performance tab in Task Manager provides real-time graphs and statistics for CPU, memory, disk, network, and GPU utilization. It shows current usage percentages, speeds, and historical trends. The Processes tab lists running applications and their individual resource usage; Startup shows boot-time programs; Details provides advanced process information.'
                },
                {
                    question: 'Which Windows Registry root key contains system-wide hardware configuration, software settings, and security databases that apply to all users of the computer?',
                    options: [
                        'HKEY_CURRENT_USER',
                        'HKEY_LOCAL_MACHINE',
                        'HKEY_CLASSES_ROOT',
                        'HKEY_USERS'
                    ],explanation: 'HKEY_LOCAL_MACHINE (HKLM) stores system-wide configuration including hardware settings (HARDWARE), operating system configuration (SYSTEM), installed software (SOFTWARE), and security databases (SAM, SECURITY). HKEY_CURRENT_USER stores settings for the currently logged-in user only. HKEY_CLASSES_ROOT merges file association data. HKEY_USERS contains profiles for all loaded user accounts.'
                },
                {
                    question: 'A macOS user reports that their external drive is not mounting properly. Which built-in macOS utility should be used first to verify and repair the disk?',
                    options: [
                        'Terminal with fsck command',
                        'Disk Utility - First Aid',
                        'System Preferences > Storage',
                        'Activity Monitor'
                    ],explanation: 'Disk Utility\'s First Aid feature verifies and repairs disk errors, file system corruption, and directory structure problems on macOS. It is the first-line tool for disk issues on a Mac. While fsck can be used from Terminal (especially in single-user mode), Disk Utility provides a graphical interface for the same functionality and is the recommended approach.'
                },
                {
                    question: 'A Linux administrator needs to install the Apache web server on a Debian-based distribution. Which command is correct?',
                    options: [
                        'yum install httpd',
                        'apt-get install apache2',
                        'dnf install apache2',
                        'pacman -S httpd'
                    ],explanation: 'Debian-based distributions (Debian, Ubuntu, Linux Mint) use the APT package manager with commands like apt-get or apt. The Apache package is named \'apache2\' on Debian systems. yum and dnf are used on Red Hat-based systems (RHEL, CentOS, Fedora) where the package is named \'httpd\'. pacman is the Arch Linux package manager.'
                },
                {
                    question: 'A shared folder on an NTFS volume has Full Control granted to the Sales group and Read granted to the Everyone group. A user who belongs to both Sales and Marketing (but not specifically denied) accesses the folder over the network. What are their effective NTFS permissions?',
                    options: [
                        'Read only, because Everyone is more restrictive',
                        'Full Control, because the least restrictive permission applies',
                        'No access, because permissions conflict',
                        'Read only, because network access overrides NTFS'
                    ],explanation: 'When a user belongs to multiple groups, NTFS permissions are cumulative — the least restrictive (most permissive) combination applies. Since the user is a member of the Sales group (Full Control) and the Everyone group (Read), they receive Full Control. The only exception is an explicit Deny, which always overrides Allow permissions.'
                },
                {
                    question: 'When a standard user attempts to install software on a Windows computer with User Account Control (UAC) enabled, what happens?',
                    options: [
                        'The installation is silently blocked with no notification',
                        'The user is prompted to enter an administrator username and password',
                        'UAC automatically elevates the standard user to administrator',
                        'The installation proceeds without any prompts'
                    ],explanation: 'When UAC is enabled and a standard user attempts an action requiring administrative privileges (like software installation), Windows displays a credential prompt requiring an administrator username and password. This differs from an admin user who sees a consent prompt (Yes/No). UAC never silently blocks or automatically elevates — it always notifies the user.'
                },
                {
                    question: 'What is the primary advantage of joining Windows workstations to a domain rather than using a workgroup?',
                    options: [
                        'Domains support a maximum of 20 computers while workgroups are unlimited',
                        'Domains provide centralized user authentication and Group Policy management',
                        'Domains do not require a server, making them less expensive',
                        'Domains allow each computer to maintain its own independent user database'
                    ],explanation: 'A Windows domain provides centralized authentication through Active Directory and allows administrators to apply Group Policy Objects (GPOs) to manage security settings, software deployment, and user configurations across all domain-joined computers from a single point. Workgroups use decentralized, per-machine user databases and are limited to small networks (typically under 20 computers).'
                },
                {
                    question: 'A technician uses the System Configuration utility (msconfig) to troubleshoot a startup issue. Which boot option starts Windows with only essential drivers and services loaded?',
                    options: [
                        'Normal startup',
                        'Diagnostic startup',
                        'Selective startup',
                        'Safe boot (Minimal)'
                    ],explanation: 'Safe boot (Minimal) in msconfig\'s Boot tab starts Windows with only the minimum set of drivers and services required to run the operating system, which is equivalent to Safe Mode. Diagnostic startup loads basic devices and services only. Selective startup lets you choose which startup items and services to load. Normal startup loads all drivers, services, and startup items.'
                },
                {
                    question: 'Which authentication protocol does Active Directory use by default to securely verify user identities using encrypted tickets rather than transmitting passwords over the network?',
                    options: [
                        'NTLM',
                        'Kerberos',
                        'RADIUS',
                        'LDAP'
                    ],explanation: 'Active Directory uses Kerberos as its default authentication protocol. Kerberos uses a ticket-granting system where the Key Distribution Center (KDC) issues encrypted tickets that prove identity without sending passwords across the network. NTLM is an older, less secure protocol kept for backward compatibility. RADIUS is used for remote access authentication. LDAP is a directory access protocol, not an authentication protocol.'
                },
                {
                    question: 'Group Policy Objects (GPOs) in Active Directory can be linked at which of the following levels? (Select the BEST answer)',
                    options: [
                        'Only at the domain level',
                        'Site, Domain, and Organizational Unit (OU) levels',
                        'Only at the Organizational Unit level',
                        'Individual user accounts and computer accounts only'
                    ],explanation: 'GPOs can be linked at three levels: Sites, Domains, and Organizational Units (OUs). They are processed in the order Local, Site, Domain, OU (LSDO), with the last-applied policy winning in case of conflict. GPOs cannot be directly linked to individual user or computer accounts — objects must be placed in OUs to receive OU-linked policies.'
                },
                {
                    question: 'A user reports that all their document files have been renamed with a .encrypted extension and a message is demanding payment in cryptocurrency to restore access. What type of malware is this?',
                    options: [
                        'Spyware',
                        'Trojan horse',
                        'Ransomware',
                        'Rootkit'
                    ],explanation: 'Ransomware encrypts the victim\'s files (documents, photos, databases) and demands payment — typically in cryptocurrency — for the decryption key. Indicators include renamed file extensions, ransom notes on the desktop, and inability to open files. Spyware silently collects data. Trojans disguise themselves as legitimate software. Rootkits hide their presence to maintain persistent access.'
                },
                {
                    question: 'During the malware removal process, what should the technician do IMMEDIATELY after identifying the malware infection?',
                    options: [
                        'Delete all infected files and empty the Recycle Bin',
                        'Quarantine the system by disconnecting it from the network',
                        'Run a full antivirus scan from within the normal Windows environment',
                        'Reformat the hard drive and reinstall the operating system'
                    ],explanation: 'The CompTIA malware removal process specifies that after identifying malware, the next step is to quarantine the infected system by disconnecting it from the network to prevent the malware from spreading to other systems or communicating with command-and-control servers. The full best-practice order is: Investigate, Quarantine, Disable System Restore, Remediate (Safe Mode scan), Schedule scans, Re-enable System Restore, Educate the user.'
                },
                {
                    question: 'An employee receives a phone call from someone claiming to be from the IT department, asking them to provide their password for a \'security audit.\' What type of social engineering attack is this?',
                    options: [
                        'Phishing',
                        'Vishing',
                        'Smishing',
                        'Shoulder surfing'
                    ],explanation: 'Vishing (voice phishing) is a social engineering attack conducted over the phone where the attacker impersonates a trusted entity to extract sensitive information. Phishing uses email or fake websites. Smishing uses SMS text messages. Shoulder surfing involves physically looking over someone\'s shoulder to observe confidential information like passwords or PINs.'
                },
                {
                    question: 'An organization\'s antivirus software failed to detect a new variant of malware that infected several workstations. What is the MOST likely reason for the detection failure?',
                    options: [
                        'The antivirus firewall rules were misconfigured',
                        'The virus definition/signature database was not up to date',
                        'The hard drives were encrypted with BitLocker',
                        'The workstations had too much RAM installed'
                    ],explanation: 'Signature-based antivirus relies on virus definition databases that contain known malware signatures. If the definitions are not updated regularly, new malware variants will not be recognized. This is why automatic definition updates should be enabled and verified. While heuristic and behavioral analysis can catch some unknown threats, signature updates remain critical for known malware detection.'
                },
                {
                    question: 'Which physical security control uses two interlocking doors to create a buffer zone that prevents tailgating into a secure area, allowing only one person through at a time?',
                    options: [
                        'Bollard',
                        'Access control vestibule (mantrap)',
                        'Turnstile',
                        'Security guard station'
                    ],explanation: 'An access control vestibule (formerly called a mantrap) uses two sets of interlocking doors — the first door must close and lock before the second door opens. This creates a controlled buffer zone that prevents tailgating and piggybacking. Bollards are physical posts that prevent vehicle access. Turnstiles allow one person at a time but don\'t create an enclosed space. Guard stations provide human monitoring.'
                },
                {
                    question: 'When evaluating a biometric authentication system, what does the term \'false acceptance rate\' (FAR) measure?',
                    options: [
                        'The percentage of times a legitimate user is incorrectly rejected',
                        'The percentage of times an unauthorized user is incorrectly granted access',
                        'The average time it takes to verify a biometric sample',
                        'The number of biometric templates stored in the database'
                    ],explanation: 'The false acceptance rate (FAR), also known as Type II error, measures how often the biometric system incorrectly authenticates an unauthorized person. A lower FAR means better security. The false rejection rate (FRR), or Type I error, measures how often legitimate users are incorrectly denied. The crossover error rate (CER) is where FAR and FRR are equal and represents the overall system accuracy.'
                },
                {
                    question: 'Which fire suppression method is MOST appropriate for a server room because it extinguishes fires without leaving residue that could damage electronic equipment?',
                    options: [
                        'Wet-pipe sprinkler system',
                        'Dry chemical extinguisher',
                        'Clean agent suppression system (FM-200 or similar)',
                        'Foam-based extinguisher'
                    ],explanation: 'Clean agent fire suppression systems (such as FM-200, Novec 1230, or similar) are designed specifically for environments with sensitive electronic equipment. They extinguish fires by removing heat or interrupting the chemical reaction without leaving water, residue, or particulates that could damage servers and networking gear. Wet-pipe sprinklers use water; dry chemical and foam extinguishers leave damaging residue on electronics.'
                },
                {
                    question: 'A technician wants to prevent unauthorized users from changing BIOS/UEFI settings or altering the boot device order on a workstation. Which security measure should be implemented?',
                    options: [
                        'Set a Windows administrator password',
                        'Enable BitLocker drive encryption',
                        'Set a BIOS/UEFI supervisor (administrator) password',
                        'Configure a screen saver password'
                    ],explanation: 'A BIOS/UEFI supervisor (administrator) password prevents unauthorized changes to firmware settings including boot order, Secure Boot configuration, virtualization settings, and hardware enablement. This is separate from a BIOS user/power-on password (which controls booting the system). Windows passwords and BitLocker protect the OS and data but do not restrict BIOS/UEFI access.'
                },
                {
                    question: 'Which wireless security protocol introduced Simultaneous Authentication of Equals (SAE) to replace the Pre-Shared Key (PSK) four-way handshake, providing protection against offline dictionary attacks?',
                    options: [
                        'WEP',
                        'WPA2-Personal',
                        'WPA3-Personal',
                        'WPA-Enterprise'
                    ],explanation: 'WPA3-Personal introduces SAE (Simultaneous Authentication of Equals), also known as Dragonfly handshake, which replaces the PSK exchange used in WPA2-Personal. SAE provides forward secrecy and protects against offline dictionary attacks because each session generates unique encryption keys. WEP is obsolete and insecure. WPA2-Personal uses the four-way handshake vulnerable to KRACK. WPA-Enterprise uses 802.1X/RADIUS authentication.'
                },
                {
                    question: 'A computer fails to boot and displays the message \'Operating System Not Found.\' The technician confirms the hard drive is detected in BIOS. What should be attempted FIRST?',
                    options: [
                        'Replace the hard drive immediately',
                        'Boot from Windows installation media and run Startup Repair',
                        'Flash the BIOS firmware to the latest version',
                        'Remove all USB devices and perform a RAM test'
                    ],explanation: 'When the BIOS detects the hard drive but the OS fails to load, the boot configuration (BCD/MBR) is likely corrupt. Booting from Windows installation media and running Startup Repair (from the Advanced Recovery options) can automatically repair the boot configuration. Replacing the drive is premature since BIOS sees it. Flashing BIOS and RAM testing address different issues.'
                },
                {
                    question: 'A user encounters a Blue Screen of Death (BSOD) with the stop code DRIVER_IRQL_NOT_LESS_OR_EQUAL. What is the MOST likely cause?',
                    options: [
                        'Insufficient disk space on the system drive',
                        'A faulty or incompatible device driver accessing invalid memory',
                        'The Windows license has expired',
                        'The monitor cable is loose'
                    ],explanation: 'DRIVER_IRQL_NOT_LESS_OR_EQUAL is a BSOD stop code indicating that a kernel-mode driver attempted to access pageable memory at an improper IRQL (Interrupt Request Level). This is typically caused by a faulty, outdated, or incompatible driver. The fix involves booting to Safe Mode, identifying the offending driver (noted in the BSOD details), and updating or rolling back that driver.'
                },
                {
                    question: 'A line-of-business application crashes intermittently. The technician needs to review the crash details including the faulting module and exception code. Which tool provides this information?',
                    options: [
                        'Task Manager > Startup tab',
                        'Event Viewer > Windows Logs > Application',
                        'Device Manager > Properties',
                        'Control Panel > Programs and Features'
                    ],explanation: 'Event Viewer\'s Application log records application errors, warnings, and informational events including crash details such as the faulting module name, exception code, and offset. This data is essential for identifying whether the crash is caused by the application itself, a runtime library, or a system DLL. Task Manager shows running processes; Device Manager handles hardware drivers; Programs and Features manages installations.'
                },
                {
                    question: 'A user complains their Windows 10 computer takes over five minutes to reach the desktop after logging in. Which is the BEST first step to reduce startup time?',
                    options: [
                        'Reinstall Windows from scratch',
                        'Add more RAM to the computer',
                        'Review and disable unnecessary startup programs in Task Manager',
                        'Defragment the hard drive'
                    ],explanation: 'The Task Manager Startup tab shows all programs configured to launch at boot, along with their startup impact rating (High, Medium, Low). Disabling unnecessary startup programs is the fastest and most common fix for slow boot times. Reinstalling Windows is excessive as a first step. Adding RAM helps if memory is the bottleneck. Defragmentation may help on HDDs but is not the primary startup fix.'
                },
                {
                    question: 'A user\'s web browser keeps redirecting to unfamiliar websites and displaying excessive pop-up advertisements, even on trusted sites. What does this symptom MOST likely indicate?',
                    options: [
                        'The router firmware needs to be updated',
                        'The computer has a browser hijacker or adware infection',
                        'The browser cache is full and needs to be cleared',
                        'The ISP is injecting advertisements into web traffic'
                    ],explanation: 'Browser redirection and excessive pop-ups are classic symptoms of a browser hijacker or adware malware. These programs modify browser settings (homepage, search engine, proxy), install malicious extensions, and inject advertisements into web pages. The remediation involves running anti-malware scans, removing suspicious browser extensions, and resetting browser settings to defaults.'
                },
                {
                    question: 'A technician needs to fix a corrupted Windows installation but wants to preserve all user files, installed applications, and settings. Which approach should be used?',
                    options: [
                        'Clean install (format and reinstall)',
                        'In-place upgrade (repair install) using the same Windows version',
                        'System Restore to a previous restore point',
                        'Reset this PC with \'Remove everything\' option'
                    ],explanation: 'An in-place upgrade (repair install) reinstalls Windows system files while preserving user files, installed applications, and most settings. This is ideal for fixing corrupted system files without data loss. A clean install erases everything. System Restore only reverts system settings and may not fix all corruption. \'Reset with Remove everything\' wipes all files and apps.'
                },
                {
                    question: 'After installing a new graphics driver, a user experiences display artifacts and system instability. The technician wants to revert to the previous working driver. Which tool and procedure is correct?',
                    options: [
                        'Uninstall the graphics card from Device Manager and restart',
                        'Use Device Manager > Properties > Driver tab > Roll Back Driver',
                        'Reinstall Windows to restore the original driver',
                        'Download the newest driver from the manufacturer\'s website'
                    ],explanation: 'Device Manager\'s Roll Back Driver feature (found on the Driver tab of the device\'s Properties) reverts to the previously installed driver version. This is the correct approach when a newly installed driver causes problems. Uninstalling the device would install a generic driver. Reinstalling Windows is excessive. Downloading the newest driver may not help if the latest version is the problem.'
                },
                {
                    question: 'A Linux administrator needs to review system log messages to troubleshoot a service that failed to start. Which directory contains the system log files on most Linux distributions?',
                    options: [
                        '/var/log/',
                        '/etc/log/',
                        '/usr/log/',
                        '/home/log/'
                    ],explanation: '/var/log/ is the standard directory for system and application log files on Linux. Key files include syslog or messages (general system events), auth.log (authentication events), kern.log (kernel messages), and dmesg (boot messages). The /etc/ directory contains configuration files. /usr/ contains user programs. /home/ contains user home directories.'
                },
                {
                    question: 'A workstation experiences slow file operations and the hard drive activity light is constantly on. Which Windows tool provides real-time disk I/O monitoring showing which processes are reading and writing to the disk?',
                    options: [
                        'Disk Defragmenter',
                        'Resource Monitor',
                        'Disk Cleanup',
                        'chkdsk'
                    ],explanation: 'Resource Monitor (resmon.exe) provides detailed real-time monitoring of CPU, memory, disk, and network activity. The Disk tab shows exactly which processes are performing read/write operations, the files being accessed, and the I/O throughput. Disk Defragmenter optimizes file placement. Disk Cleanup removes temporary files. chkdsk checks and repairs file system errors.'
                },
                {
                    question: 'A legacy application designed for Windows 7 will not launch on Windows 11 and displays a compatibility error. What should the technician try FIRST?',
                    options: [
                        'Install Windows 7 in a dual-boot configuration',
                        'Right-click the executable, go to Properties > Compatibility tab, and enable compatibility mode for Windows 7',
                        'Downgrade the entire system to Windows 7',
                        'Contact Microsoft to request a patch for the application'
                    ],explanation: 'Windows Compatibility Mode (accessed via the executable\'s Properties > Compatibility tab) allows older applications to run by emulating the behavior of previous Windows versions. The technician can select \'Run this program in compatibility mode for: Windows 7\' and may also need to check \'Run as administrator\' or adjust DPI settings. This is the least disruptive first step before considering virtualization or dual-boot.'
                },
                {
                    question: 'According to CompTIA\'s troubleshooting methodology, what is the FIRST step when a user reports a technical problem?',
                    options: [
                        'Implement a fix based on your initial instinct',
                        'Identify the problem by gathering information and questioning the user',
                        'Research the error message online',
                        'Escalate the issue to a senior technician'
                    ],explanation: 'CompTIA\'s troubleshooting methodology starts with \'Identify the problem\' — this involves gathering information from the user, identifying symptoms, questioning users about changes, and reproducing the problem if possible. The full order is: 1) Identify the problem, 2) Establish a theory of probable cause, 3) Test the theory, 4) Establish a plan of action, 5) Verify full system functionality, 6) Document the findings.'
                },
                {
                    question: 'During a forensic investigation of a potentially compromised workstation, which concept ensures that evidence is properly documented from the moment of collection through its presentation, tracking every person who handled it?',
                    options: [
                        'Data retention policy',
                        'Chain of custody',
                        'Acceptable use policy',
                        'Service level agreement'
                    ],explanation: 'Chain of custody is the documented, unbroken trail that records the seizure, custody, control, transfer, analysis, and disposition of physical or digital evidence. Every person who handles the evidence must be documented with dates, times, and actions taken. Breaking chain of custody can render evidence inadmissible in legal proceedings.'
                },
                {
                    question: 'Before implementing a major software update across the organization, which group is responsible for reviewing, approving, or rejecting the proposed change in a formal change management process?',
                    options: [
                        'The help desk team',
                        'The end users affected by the change',
                        'The Change Advisory Board (CAB)',
                        'The software vendor\'s support team'
                    ],explanation: 'The Change Advisory Board (CAB) is a group of stakeholders responsible for evaluating proposed changes, assessing risk, reviewing the implementation and rollback plans, and approving or rejecting changes. The CAB typically includes IT management, technical leads, security representatives, and business stakeholders. This ensures changes are properly vetted before deployment.'
                },
                {
                    question: 'A system administrator deployed a patch that caused critical application failures in production. The change management plan includes a rollback procedure. When should the rollback plan be executed?',
                    options: [
                        'Only after waiting 30 days to see if the issue resolves itself',
                        'Immediately when the change causes unacceptable negative impact',
                        'Only if the vendor provides official rollback instructions',
                        'Only during the next scheduled maintenance window'
                    ],explanation: 'A rollback plan should be executed immediately when a change causes unacceptable negative impact on production systems or users. Every change request should include a pre-defined rollback plan with clear criteria for when to trigger it. Waiting allows the problem to affect more users and systems. The goal is to restore service quickly while the root cause is investigated.'
                },
                {
                    question: 'A technician resolves a user\'s issue but does not document the resolution in the ticketing system. Why is this a problem?',
                    options: [
                        'It only matters for billing purposes',
                        'Other technicians cannot reference the solution for similar future issues, and there is no record of work performed',
                        'The user will automatically receive a satisfaction survey',
                        'The computer will revert to its previous state'
                    ],explanation: 'Proper ticket documentation serves multiple critical purposes: it creates a knowledge base for resolving similar future issues, provides an audit trail of work performed, helps track recurring problems, supports SLA compliance metrics, enables proper billing, and protects the technician and organization legally. Undocumented work is essentially invisible to the organization.'
                },
                {
                    question: 'What is the primary purpose of a knowledge base in an IT support environment?',
                    options: [
                        'To store employee personal information securely',
