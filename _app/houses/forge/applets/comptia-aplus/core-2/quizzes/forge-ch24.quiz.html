<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 24 Quiz: Documentation & Professionalism',
            description: 'A+ Core 2 - Documentation, SOPs, ticketing, and communication',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch24',
            moduleId: 'core2-ch24',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'What type of network diagram shows the actual physical locations of devices, cable runs, and rack positions?',
                    options: [
                        'Logical diagram',
                        'Physical diagram',
                        'Wiring schematic',
                        'Topology map'
                    ],explanation: 'A physical diagram shows the actual hardware layout including device locations, cable runs, and rack positions. A logical diagram shows network design elements like IP addresses, VLANs, and routing paths.'
                },
                {
                    question: 'A user calls about not being able to print. What is the FIRST thing you should document when creating a support ticket?',
                    options: [
                        'Your troubleshooting steps',
                        'The printer model number',
                        'The user\'s name and contact information',
                        'The solution you plan to try'
                    ],explanation: 'Always start by documenting the requester\'s name and contact information. You need to know who reported the issue and how to reach them. Troubleshooting steps and solutions come later in the process.'
                },
                {
                    question: 'What is the purpose of a knowledge base article in IT support?',
                    options: [
                        'To track individual support tickets',
                        'To store user passwords securely',
                        'To document common issues and solutions for future reference',
                        'To schedule maintenance windows'
                    ],explanation: 'A knowledge base is a repository of documented solutions to common problems. It helps technicians solve recurring issues quickly without having to rediscover solutions each time.'
                },
                {
                    question: 'When should you escalate a support ticket to a higher tier?',
                    options: [
                        'Whenever the user requests it',
                        'Only when your supervisor tells you to',
                        'When the issue exceeds your skill level or authority',
                        'Never - always try to solve it yourself'
                    ],explanation: 'Escalate when an issue requires expertise beyond your level, needs management approval, exceeds SLA timeframes, or is a major outage. Always document what you\'ve already tried before escalating.'
                },
                {
                    question: 'A frustrated user is raising their voice about a recurring computer issue. What is the BEST approach?',
                    options: [
                        'Tell them to calm down before you\'ll help',
                        'Match their energy to show you understand',
                        'Let them vent, acknowledge their frustration, then focus on the solution',
                        'Transfer them to your supervisor immediately'
                    ],explanation: 'Let frustrated users express their feelings, acknowledge their frustration with empathy (\'I understand this is frustrating\'), and then redirect focus to solving the problem. Never tell someone to calm down - it escalates the situation.'
                },
                {
                    question: 'What should be included when writing a Standard Operating Procedure (SOP)?',
                    options: [
                        'Only the steps to complete the task',
                        'Purpose, scope, prerequisites, steps, and verification',
                        'Just the verification steps',
                        'Only what to do when something goes wrong'
                    ],explanation: 'A complete SOP includes: purpose (why it exists), scope (when it applies), prerequisites (what\'s needed), step-by-step procedures, verification (how to confirm success), and troubleshooting (what to do if something goes wrong).'
                },
                {
                    question: 'When documenting troubleshooting steps in a ticket, what is the MOST important reason to be thorough?',
                    options: [
                        'To prove you did your job',
                        'To bill the customer accurately',
                        'To prevent the next technician from repeating the same steps',
                        'To satisfy compliance requirements only'
                    ],explanation: 'Thorough documentation prevents duplicate work if the ticket is escalated or reassigned. The next technician can see what was already tried and continue from where you left off rather than starting over.'
                },
                {
                    question: 'A user asks you to explain a technical issue. They have no IT background. What communication approach should you use?',
                    options: [
                        'Use proper technical terminology so they learn',
                        'Explain in simple terms without jargon',
                        'Send them a link to the documentation',
                        'Tell them they don\'t need to understand the technical details'
                    ],explanation: 'Adjust your language to your audience. Non-technical users need explanations in plain language they can understand. Using jargon creates confusion and makes users feel uninformed.'
                },
                {
                    question: 'Which of the following is the BEST practice for asset inventory documentation?',
                    options: [
                        'Only document assets when they break',
                        'Track serial numbers, location, assigned user, and warranty information',
                        'Keep all asset information in your head',
                        'Only document expensive items'
                    ],explanation: 'Proper asset documentation includes serial numbers, asset tags, make/model, purchase and warranty dates, physical location, assigned user, and maintenance history. This enables proper tracking, maintenance, and planning.'
                },
                {
                    question: 'A support ticket has been open for 3 hours with no resolution. According to your SLA, response time is 4 hours and resolution time is 8 hours. What should you do?',
                    options: [
                        'Close the ticket since you responded in time',
                        'Escalate immediately since the issue isn\'t resolved',
                        'Continue working the ticket and update the user on progress',
                        'Assign it to someone else to avoid SLA violation'
                    ],explanation: 'You\'ve met the response time SLA. Continue working toward resolution within the 8-hour window while keeping the user informed of progress. Only escalate if you hit blockers or approach the resolution deadline.'
                }
            ]
        });
        quiz.start();
    </script>
