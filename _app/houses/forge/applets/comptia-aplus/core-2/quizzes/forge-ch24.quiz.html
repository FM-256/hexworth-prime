<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 24 Quiz: Documentation & Professionalism - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0d0d12 0%, #0f1a15 50%, #0d0d12 100%); font-family: 'Segoe UI', sans-serif; color: #b5d4c4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; }
        .header h1 { color: #d5f5e8; font-size: 1.8rem; margin-bottom: 10px; }
        .back-link { display: inline-block; color: #4ade80; text-decoration: none; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(34, 197, 94, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.3s; }
        .question-card { background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .question-num { color: #4ade80; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #d5f5e8; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(34, 197, 94, 0.05); border: 2px solid rgba(34, 197, 94, 0.2); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .option:hover { background: rgba(34, 197, 94, 0.1); }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(34, 197, 94, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .explanation h4 { color: #4ade80; margin-bottom: 10px; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 1rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(15, 20, 18, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; margin: 20px 0; }
        .score.pass { color: #4ade80; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; color: #4ade80; text-decoration: none; }
        .nav-link.primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; }
        .complete-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch24-documentation/index.html" class="back-link">← Back to Chapter 24</a>
        <div class="header">
            <h1>Chapter 24 Quiz</h1>
            <p style="color: #7a9e8b;">Documentation & Professionalism</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../presentations/forge-documentation.presentation.html" class="nav-link">Review Presentation</a>
                <a href="../labs/forge-documentation.lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../index.html" class="nav-link primary">Course Home</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What type of network diagram shows the actual physical locations of devices, cable runs, and rack positions?",
                options: ["Logical diagram", "Physical diagram", "Wiring schematic", "Topology map"],
                correct: 1,
                explanation: "A physical diagram shows the actual hardware layout including device locations, cable runs, and rack positions. A logical diagram shows network design elements like IP addresses, VLANs, and routing paths."
            },
            {
                question: "A user calls about not being able to print. What is the FIRST thing you should document when creating a support ticket?",
                options: ["Your troubleshooting steps", "The printer model number", "The user's name and contact information", "The solution you plan to try"],
                correct: 2,
                explanation: "Always start by documenting the requester's name and contact information. You need to know who reported the issue and how to reach them. Troubleshooting steps and solutions come later in the process."
            },
            {
                question: "What is the purpose of a knowledge base article in IT support?",
                options: ["To track individual support tickets", "To store user passwords securely", "To document common issues and solutions for future reference", "To schedule maintenance windows"],
                correct: 2,
                explanation: "A knowledge base is a repository of documented solutions to common problems. It helps technicians solve recurring issues quickly without having to rediscover solutions each time."
            },
            {
                question: "When should you escalate a support ticket to a higher tier?",
                options: ["Whenever the user requests it", "Only when your supervisor tells you to", "When the issue exceeds your skill level or authority", "Never - always try to solve it yourself"],
                correct: 2,
                explanation: "Escalate when an issue requires expertise beyond your level, needs management approval, exceeds SLA timeframes, or is a major outage. Always document what you've already tried before escalating."
            },
            {
                question: "A frustrated user is raising their voice about a recurring computer issue. What is the BEST approach?",
                options: ["Tell them to calm down before you'll help", "Match their energy to show you understand", "Let them vent, acknowledge their frustration, then focus on the solution", "Transfer them to your supervisor immediately"],
                correct: 2,
                explanation: "Let frustrated users express their feelings, acknowledge their frustration with empathy ('I understand this is frustrating'), and then redirect focus to solving the problem. Never tell someone to calm down - it escalates the situation."
            },
            {
                question: "What should be included when writing a Standard Operating Procedure (SOP)?",
                options: ["Only the steps to complete the task", "Purpose, scope, prerequisites, steps, and verification", "Just the verification steps", "Only what to do when something goes wrong"],
                correct: 1,
                explanation: "A complete SOP includes: purpose (why it exists), scope (when it applies), prerequisites (what's needed), step-by-step procedures, verification (how to confirm success), and troubleshooting (what to do if something goes wrong)."
            },
            {
                question: "When documenting troubleshooting steps in a ticket, what is the MOST important reason to be thorough?",
                options: ["To prove you did your job", "To bill the customer accurately", "To prevent the next technician from repeating the same steps", "To satisfy compliance requirements only"],
                correct: 2,
                explanation: "Thorough documentation prevents duplicate work if the ticket is escalated or reassigned. The next technician can see what was already tried and continue from where you left off rather than starting over."
            },
            {
                question: "A user asks you to explain a technical issue. They have no IT background. What communication approach should you use?",
                options: ["Use proper technical terminology so they learn", "Explain in simple terms without jargon", "Send them a link to the documentation", "Tell them they don't need to understand the technical details"],
                correct: 1,
                explanation: "Adjust your language to your audience. Non-technical users need explanations in plain language they can understand. Using jargon creates confusion and makes users feel uninformed."
            },
            {
                question: "Which of the following is the BEST practice for asset inventory documentation?",
                options: ["Only document assets when they break", "Track serial numbers, location, assigned user, and warranty information", "Keep all asset information in your head", "Only document expensive items"],
                correct: 1,
                explanation: "Proper asset documentation includes serial numbers, asset tags, make/model, purchase and warranty dates, physical location, assigned user, and maintenance history. This enables proper tracking, maintenance, and planning."
            },
            {
                question: "A support ticket has been open for 3 hours with no resolution. According to your SLA, response time is 4 hours and resolution time is 8 hours. What should you do?",
                options: ["Close the ticket since you responded in time", "Escalate immediately since the issue isn't resolved", "Continue working the ticket and update the user on progress", "Assign it to someone else to avoid SLA violation"],
                correct: 2,
                explanation: "You've met the response time SLA. Continue working toward resolution within the 8-hour window while keeping the user informed of progress. Only escalate if you hit blockers or approach the resolution deadline."
            }
        ];

        let currentQuestion = 0, score = 0, answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>
                    <div class="explanation" id="explanation"><h4>Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(i) {
            if (answered) return;
            answered = true;
            const q = questions[currentQuestion];
            const opts = document.querySelectorAll('.option');
            opts.forEach(o => o.classList.add('disabled'));
            opts[i].classList.add(i === q.correct ? 'correct' : 'incorrect');
            opts[q.correct].classList.add('correct');
            if (i === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            const sd = document.getElementById('scoreDisplay');
            sd.textContent = pct + '%';
            sd.className = 'score ' + (pct >= 80 ? 'pass' : pct < 60 ? 'fail' : '');
            document.getElementById('resultMessage').textContent = pct >= 80 ? `Excellent work! ${score}/${questions.length} correct` : pct >= 60 ? `Good effort! ${score}/${questions.length} correct` : `Review recommended. ${score}/${questions.length} correct`;
            saveProgress();
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <div style="text-align: center; padding: 30px;">
        <button class="complete-btn" onclick="markComplete()">✓ Mark Complete</button>
    </div>
    <script>
        function saveProgress() {
            const pct = Math.round((score / questions.length) * 100);
            try {
                localStorage.setItem('core2-ch24-quiz', JSON.stringify({
                    score: score, total: questions.length, completed: true
                }));
            } catch(e) {}
            try {
                const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
                if (!progress.forge) progress.forge = {};
                progress.forge['core2-ch24-quiz'] = {
                    completed: true,
                    completedAt: new Date().toISOString(),
                    score: pct
                };
                localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            } catch (e) {
                console.warn('[Forge] Failed to save:', e);
            }
        }
        function markComplete() {
            saveProgress();
            const btn = document.querySelector('.complete-btn');
            if (btn) { btn.innerHTML = '✓ Completed!'; btn.disabled = true; }
        }
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
