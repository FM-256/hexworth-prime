    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%);

        }

        .header {
            text-align: center;

            padding: 30px;

            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
        }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .header p { color: #8b7a9e; }
        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
        }
        .question-card {
            background: rgba(20, 15, 30, 0.8);

            margin-bottom: 20px;
        }
        .question-num { color: #a78bfa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 20px;
            background: rgba(139, 92, 246, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.4); }
        .option.selected { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            display: none;
        }
        .explanation.show { display: block; }
        .explanation h4 { color: #a78bfa; margin-bottom: 10px; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results {
            text-align: center;
            padding: 40px;
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            display: none;
        }
        .results.show { display: block; }
        .score { font-size: 3rem; color: #a78bfa; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link {
            padding: 10px 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(139, 92, 246, 0.2); }
        .nav-link.primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../chapters/ch13-windows-editions/index.html" class="back-link" onclick="if(history.length>1){history.back();return false;}">← Back to Chapter 13</a>

        <div class="header">
            <h1>Chapter 13 Quiz</h1>
            <p>Windows Editions & Requirements</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span id="progressText">Question 1 of 10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/windows-editions.html" class="nav-link">Review Presentation</a>
                <a href="../../labs/windows-editions-lab.html" class="nav-link">Practice Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../chapters/ch14-windows-settings/index.html" class="nav-link primary" id="nextChapter">Next Chapter →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "A company needs to deploy Windows to 500 workstations and wants centralized management through Group Policy and Active Directory. Which is the MINIMUM edition that supports domain join?",
                options: ["Windows 10/11 Home", "Windows 10/11 Pro", "Windows 10/11 Enterprise", "Windows 10/11 Education"],
                correct: 1,
                explanation: "Windows Pro is the minimum edition that supports domain join and Group Policy management. Home edition cannot join a domain. Enterprise and Education also support these features but are not the minimum requirement."
            },
            {
                question: "What is the maximum amount of RAM supported by 64-bit Windows 10 Home?",
                options: ["4 GB", "64 GB", "128 GB", "2 TB"],
                correct: 2,
                explanation: "64-bit Windows 10 Home supports up to 128 GB of RAM. Windows 10 Pro supports up to 2 TB, and Enterprise/Education also support 2 TB. The 32-bit versions are limited to 4 GB."
            },
            {
                question: "Which Windows feature provides full-disk encryption and is NOT available in the Home edition?",
                options: ["Windows Defender", "BitLocker", "Windows Firewall", "Windows Update"],
                correct: 1,
                explanation: "BitLocker drive encryption is only available in Pro, Enterprise, and Education editions. Home edition users can use Device Encryption on supported hardware, but not the full BitLocker management features."
            },
            {
                question: "A user is running 32-bit Windows 10 and wants to upgrade to 64-bit. What is the correct upgrade path?",
                options: [
                    "Run Windows Update to convert to 64-bit",
                    "Use the Settings app to switch architectures",
                    "Perform a clean install with 64-bit installation media",
                    "Purchase a separate 64-bit license"
                ],
                correct: 2,
                explanation: "You cannot upgrade from 32-bit to 64-bit Windows in place. A clean install using 64-bit installation media is required. The same license key works for both architectures, so a new license is not needed."
            },
            {
                question: "Which licensing type is tied to the original computer's motherboard and typically cannot be transferred to a new PC?",
                options: ["Retail license", "Volume license", "OEM license", "Education license"],
                correct: 2,
                explanation: "OEM (Original Equipment Manufacturer) licenses are tied to the original hardware, specifically the motherboard, and cannot be transferred to a different computer. Retail licenses can be transferred between computers."
            },
            {
                question: "A small business wants to run virtual machines using Hyper-V. Which is the minimum Windows edition that includes Hyper-V?",
                options: ["Windows 10/11 Home", "Windows 10/11 Pro", "Windows 10/11 Enterprise only", "Windows Server only"],
                correct: 1,
                explanation: "Hyper-V is included in Windows 10/11 Pro, Enterprise, and Education editions on 64-bit systems with compatible processors. It is not available in Home edition."
            },
            {
                question: "What is the minimum RAM requirement for installing 64-bit Windows 11?",
                options: ["2 GB", "4 GB", "8 GB", "16 GB"],
                correct: 1,
                explanation: "Windows 11 (64-bit) requires a minimum of 4 GB of RAM. It also requires a 64-bit processor with 2 or more cores at 1 GHz, 64 GB storage, UEFI with Secure Boot, TPM 2.0, and a DirectX 12 compatible GPU."
            },
            {
                question: "Which Windows edition is designed for large organizations and offers features like DirectAccess, AppLocker, and BranchCache?",
                options: ["Windows Pro", "Windows Enterprise", "Windows Home", "Windows Pro for Workstations"],
                correct: 1,
                explanation: "Windows Enterprise includes advanced features for large organizations such as DirectAccess (VPN alternative), AppLocker (application whitelisting), BranchCache (WAN optimization), and Windows To Go."
            },
            {
                question: "A user with Windows 10 Home wants to use Remote Desktop to connect TO their computer from another location. What must they do?",
                options: [
                    "Enable Remote Desktop in Settings",
                    "Upgrade to Windows 10 Pro or higher",
                    "Install the Remote Desktop app from the Microsoft Store",
                    "Configure Windows Firewall only"
                ],
                correct: 1,
                explanation: "Windows Home can act as a Remote Desktop client (connect to other computers) but cannot be a Remote Desktop host (accept incoming connections). To allow incoming RDP connections, an upgrade to Pro, Enterprise, or Education is required."
            },
            {
                question: "Which upgrade path is VALID?",
                options: [
                    "Windows 10 Pro to Windows 10 Home",
                    "Windows 10 Home to Windows 10 Pro",
                    "Windows 10 Enterprise to Windows 10 Pro",
                    "Windows 11 Pro to Windows 10 Pro"
                ],
                correct: 1,
                explanation: "You can upgrade from a lower edition to a higher edition (Home to Pro), but not downgrade (Pro to Home, Enterprise to Pro). You also cannot downgrade from Windows 11 to Windows 10 without a clean install."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="selectOption(${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(index === q.correct ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            if (index === q.correct) score++;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('pass');
                document.getElementById('resultMessage').textContent = `Excellent! You scored ${score}/${questions.length}. You've mastered this chapter!`;
            } else if (percentage >= 60) {
                scoreDisplay.classList.remove('pass', 'fail');
                document.getElementById('resultMessage').textContent = `Good effort! You scored ${score}/${questions.length}. Review the material and try again.`;
            } else {
                scoreDisplay.classList.add('fail');
                document.getElementById('resultMessage').textContent = `You scored ${score}/${questions.length}. Review the presentation and lab before retaking the quiz.`;
            }

            // Save progress
            localStorage.setItem('core2-ch13-quiz', JSON.stringify({
                score: score,
                total: questions.length,
                completed: true
            }));
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results').classList.remove('show');
            renderQuestion();
        }

        renderQuestion();
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
