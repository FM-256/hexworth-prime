<script>
const quiz = new QuizEngine({
    containerId: 'quiz-container',
    title: 'Chapter 25 Quiz: Virtualization & Hypervisors',
    description: 'A+ Core 2 chapter 25. Hypervisor types, requirements, VM anatomy, networking and snapshots.',
    passingScore: 70,
    showFeedback: true,
    theme: 'forge',
    achievement: 'forge-core2-ch25',
    moduleId: 'core2-ch25',
    serverGrading: true,
    houseId: 'forge',
    trackProgress: true,
    poolSize: 12,          /* 12 drawn from the 20-item bank; retake gets a fresh draw */

    questions: [
        {
            question: 'What single question separates a Type 1 hypervisor from a Type 2 hypervisor?',
            options: [
                'Whether it can run more than one virtual machine at the same time on one box',
                'Whether there is a host operating system between the hypervisor and the hardware',
                'Whether it is licensed commercially or distributed free of charge to the public',
                'Whether the guest operating systems installed inside it are Windows or Linux'
            ],
            explanation: 'Type 1 IS the operating system on that machine. Type 2 RUNS ON one. Everything else, cost, guest count, guest OS, varies within both kinds and separates nothing.',
            source: 'presentation slide 4'
        },
        {
            question: 'You install a hypervisor on your existing Windows 11 laptop and keep using the laptop for email. Which kind is it?',
            options: [
                'Type 2, because it was installed onto an operating system that is still running',
                'Type 1, because it creates and manages virtual machines on behalf of the user',
                'Neither, because consumer laptop hardware cannot host a hypervisor of either kind',
                'Type 1, because Windows 11 exposes hardware virtualization extensions to it'
            ],
            explanation: 'If you can minimise it and check your email, it is Type 2. The host OS is still there underneath, still scheduling, still needing memory of its own.',
            source: 'presentation slide 4'
        },
        {
            question: 'A student builds a brand new VM, presses Start, and gets "FATAL: No bootable medium found! System halted." What has gone wrong?',
            options: [
                'The virtual disk was created corrupt and the machine must be built again',
                'The hypervisor installed incorrectly and its kernel drivers need reinstalling',
                'Nothing has gone wrong. A new VM is an empty computer with nothing to boot',
                'The host has insufficient free memory to bring the guest all the way up'
            ],
            explanation: 'This is correct behaviour, not a fault. A new VM is a computer with a blank disk and an empty optical drive. Attach an installer ISO and it boots.',
            source: 'presentation slide 8 and lab stage 1 task 5'
        },
        {
            question: 'A guest will not resize past a fixed resolution and the clipboard does not work between host and guest. What is missing, and where does it go?',
            options: [
                'The guest tooling (Guest Additions or VMware Tools), installed inside the guest',
                'The guest tooling, installed on the host machine alongside the hypervisor itself',
                'A second virtual display adapter, added to the machine settings while powered off',
                'A bridged network adapter, so the guest and the host can address each other'
            ],
            explanation: 'Guest Additions and VMware Tools install INSIDE the guest, which is why the lab requires the machine to be running first. The two products are not interchangeable: install the one matching the hypervisor.',
            source: 'presentation slides 12 and 18, lab stage 2 task 5'
        },
        {
            question: 'You are about to open a suspicious file inside a VM. Which VirtualBox network mode leaves the guest able to reach nothing at all?',
            options: [
                'NAT',
                'Bridged Adapter',
                'Host-only Adapter',
                'Internal Network'
            ],
            explanation: 'Internal Network is guest to guest only. NAT still reaches the internet, Bridged puts the guest on the physical LAN, and Host-only can still reach the host, which is the machine you are trying to protect.',
            source: 'presentation slide 13, lab stage 1 task 6'
        },
        {
            question: 'VMware Workstation offers no mode called "Internal Network". Which VMware setting does the same job?',
            options: [
                'Host-only',
                'LAN Segment',
                'NAT',
                'Bridged'
            ],
            explanation: 'LAN Segment is VMware\'s name for a private network shared only with other VMs. Recognising that the concept survives the rename is the transferable skill; a technician who knows only one product has learned a menu.',
            source: 'lab stage 2 task 6'
        },
        {
            question: 'Which file extension belongs to a VMware virtual disk?',
            options: [
                '.vmdk',
                '.vdi',
                '.vhdx',
                '.vbox'
            ],
            explanation: 'VMware uses .vmdk. VirtualBox uses .vdi, Hyper-V uses .vhdx, and .vbox is the VirtualBox machine configuration file rather than the disk.',
            source: 'presentation slide 12, lab stage 2 task 3'
        },
        {
            question: 'Why is a snapshot not a backup?',
            options: [
                'Snapshots can only be captured while the virtual machine is fully powered off',
                'Snapshots record only the machine configuration file and never the disk contents',
                'Snapshots expire automatically after thirty days and cannot be restored after that',
                'Snapshots depend on the original disk, so losing that disk loses the snapshot too'
            ],
            explanation: 'A snapshot is a point you can return to on the SAME disk chain. If the underlying storage dies, the snapshot dies with it. A backup is a separate copy in a separate place.',
            source: 'presentation slide 15'
        },
        {
            question: 'A machine that ran VMs fine last month now refuses, reporting that virtualization is unavailable, and nothing about the hardware has changed. What is the most likely cause?',
            options: [
                'The processor has partially failed and no longer reports its full feature set',
                'The hypervisor licence has quietly expired and the product is refusing to run',
                'VT-x or AMD-V has been disabled in firmware, or another feature has claimed it',
                'The guest operating system version is no longer supported by this hypervisor'
            ],
            explanation: 'The extensions are almost always present since roughly 2010 and frequently disabled in firmware. Hyper-V, WSL2, Windows Sandbox, Memory Integrity and Credential Guard all claim the same extensions, and a Type 2 hypervisor then runs degraded or refuses.',
            source: 'presentation slides 10 and 11'
        },
        {
            question: 'You give a guest more memory than the host can spare. What actually happens?',
            options: [
                'The hypervisor silently reduces the allocation to a safe value',
                'The guest refuses to start and the host is unaffected',
                'The host starts swapping and everything, host and guest alike, crawls',
                'The host reallocates memory from other applications with no visible effect'
            ],
            explanation: 'vRAM is reserved from host RAM while the guest runs. Over-allocate on a Type 2 host and the host swaps, which is why the lab makes you read the meter and find the safe maximum yourself.',
            source: 'presentation slide 12, lab stage 1 tasks 2 and 3'
        },
        {
            question: 'On a bare-metal Type 1 host, how much of the physical memory is available to guests?',
            options: [
                'All of it, because a Type 1 hypervisor uses no memory itself',
                'All of it except what the hypervisor itself consumes',
                'All of it except what the host operating system needs',
                'Half of it, because the hypervisor mirrors every allocation'
            ],
            explanation: 'There is no host OS underneath a Type 1 to reserve for, only the hypervisor itself. That is why the same host yields a different, larger guest pool than a Type 2 desktop, and noticing that difference is the point of the lab\'s third stage.',
            source: 'lab stage 3 task 2'
        },
        {
            question: 'Three guests are running on a Type 1 host and you try to power on a fourth that needs more memory than remains. What does the host do?',
            options: [
                'Powers it on and swaps the difference to disk',
                'Powers it on and takes the memory from the running guests',
                'Refuses to power it on',
                'Powers it on but pauses one of the running guests automatically'
            ],
            explanation: 'The pool is physical. A bare-metal host hands out real pages and refuses when there are none left. It does not warn and it does not improvise. Power a guest off, or right-size one.',
            source: 'lab stage 3 tasks 4 and 5'
        },
        {
            question: 'The host has 8 physical cores. Can four running guests be assigned more than 8 vCPUs between them?',
            options: [
                'Yes. CPU time is shared, so guests queue for the same silicon',
                'No. The host refuses any assignment beyond its physical core count',
                'Yes, but only if each guest is assigned exactly two vCPUs',
                'No. Each vCPU permanently reserves one physical core'
            ],
            explanation: 'Memory is handed out and hard-capped; CPU time is scheduled and shared. Overcommitting vCPUs is allowed, and more vCPUs than half the host cores generally makes guests slower rather than faster, because they queue.',
            source: 'presentation slide 12, lab stage 3 task 6'
        },
        {
            question: 'Which network mode gives a guest its own address on the physical network, so anything on the LAN can reach it?',
            options: [
                'NAT',
                'Internal Network',
                'Bridged',
                'Host-only'
            ],
            explanation: 'Bridged puts the guest on the physical network as a peer. Use it when the guest must be reachable as a server, and be deliberate about it, because the guest is now exposed to everything on that LAN.',
            source: 'presentation slide 13'
        },
        {
            question: 'A guest needs to download updates but nothing outside should be able to reach it. Which mode fits?',
            options: [
                'Bridged',
                'NAT',
                'Internal Network',
                'Host-only'
            ],
            explanation: 'NAT sends traffic out through the host and nothing comes back in unsolicited. Internal Network and Host-only both have no route to the internet, so updates would fail.',
            source: 'presentation slide 13'
        },
        {
            question: 'What does a snapshot taken while a machine is RUNNING capture that one taken while powered off does not?',
            options: [
                'The virtual disk contents',
                'The machine configuration file',
                'Memory and CPU state, so a resume can land mid-application',
                'The host\'s network configuration'
            ],
            explanation: 'A running snapshot stores memory and CPU state alongside the disk, which is why restoring one can drop you back into a half-open application rather than at a clean boot.',
            source: 'presentation slide 15'
        },
        {
            question: 'What is a virtual machine, in plain terms?',
            options: [
                'A remote desktop session that displays another physical computer on your screen',
                'A stripped-down operating system that runs inside a browser tab rather than on hardware',
                'A backup image of a physical computer, useful for restoring it but not itself bootable',
                'A complete computer, with CPU, memory, disk and network card, that exists as files on a real one'
            ],
            explanation: 'A VM is a whole computer expressed as files. The machine is the configuration file plus its disk, and nothing else, which is exactly why it can be copied, snapshotted and moved.',
            source: 'presentation slides 3 and 12'
        },
        {
            question: 'Which of these are genuine reasons an IT department runs a Type 1 hypervisor?',
            options: [
                'Running many workloads on one physical server instead of leaving several boxes mostly idle',
                'Isolating a workload so a compromise does not reach the rest of the network',
                'Snapshotting a server before a risky patch so it can be returned to a known state',
                'All of the above'
            ],
            explanation: 'Consolidation, isolation and rollback are all real drivers, and consolidation is the reason the technology exists at all. Before VMs, one physical server ran one workload and mostly sat idle.',
            source: 'presentation slides 5 and 16'
        },
        {
            question: 'Which of the following makes a VM inherently safe to open unknown malware in, with no further configuration?',
            options: [
                'The hypervisor scans guest disk writes for malicious code',
                'Shared folders are read-only by default in every hypervisor',
                'Guests cannot reach the host because virtualization isolates them completely',
                'None of the above'
            ],
            explanation: 'None of these is true. Isolation is a setting you choose, not a guarantee you inherit: shared folders, the clipboard and bridged networking are holes you opened. Treat the guest as hostile and the host as the thing to protect, and confirm the isolation rather than assuming it.',
            source: 'presentation slide 17'
        },
        {
            question: 'A colleague says VM escape means a guest ran out of disk space and spilled onto the host. Are they right?',
            options: [
                'Yes. That is exactly what the term describes in a virtualized environment',
                'No. VM escape is a hypervisor vulnerability that lets code cross from guest to host',
                'Yes, though the effect is limited to Type 2 hypervisors running on a desktop OS',
                'No. VM escape describes a snapshot being restored onto the wrong virtual machine'
            ],
            explanation: 'VM escape is the exception to the isolation rule: a flaw in the hypervisor itself that crosses the boundary. Rare, severe, and the reason hypervisor patching matters.',
            source: 'presentation slide 17'
        }
    ]
});

</script>
