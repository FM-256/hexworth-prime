<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 21 Quiz: Physical Security - A+ Core 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0d0d12 0%, #1a1520 50%, #0d0d12 100%); font-family: 'Segoe UI', sans-serif; color: #c4b5d4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; }
        .header h1 { color: #e8d5f5; font-size: 1.8rem; margin-bottom: 10px; }
        .back-link { display: inline-block; color: #f87171; text-decoration: none; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(220, 38, 38, 0.2); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f87171); transition: width 0.3s; }
        .question-card { background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .question-num { color: #f87171; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { color: #e8d5f5; font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(220, 38, 38, 0.05); border: 2px solid rgba(220, 38, 38, 0.2); border-radius: 10px; cursor: pointer; }
        .option:hover { background: rgba(220, 38, 38, 0.1); }
        .option.correct { background: rgba(52, 211, 153, 0.2); border-color: #34d399; }
        .option.incorrect { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .option.disabled { pointer-events: none; }
        .explanation { margin-top: 20px; padding: 20px; background: rgba(220, 38, 38, 0.1); border-radius: 10px; display: none; }
        .explanation.show { display: block; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #dc2626, #b91c1c); border: none; border-radius: 8px; color: white; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.4); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .results { text-align: center; padding: 40px; background: rgba(20, 15, 30, 0.8); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 16px; display: none; }
        .results.show { display: block; }
        .score { font-size: 3rem; margin: 20px 0; }
        .score.pass { color: #34d399; }
        .score.fail { color: #f87171; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; color: #f87171; text-decoration: none; }
        .nav-link.primary { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; border: none; }
        .complete-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="chapters/ch21-physical-security/index.html" class="back-link">← Back to Chapter 21</a>
        <div class="header">
            <h1>Chapter 21 Quiz</h1>
            <p style="color: #8b7a9e;">Physical Security</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText">Question 1 of 10</span>
        </div>
        <div id="quizContainer"></div>
        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="resultMessage"></p>
            <div class="nav-links">
                <a href="../../presentations/physical-security.html" class="nav-link">Review</a>
                <a href="../../labs/physical-security-lab.html" class="nav-link">Lab</a>
                <button class="nav-link primary" onclick="restartQuiz()">Retake</button>
                <a href="../chapters/ch22-incident-response/index.html" class="nav-link primary">Next →</a>
            </div>
        </div>
    </div>
    <script>
        const questions = [
            {
                question: "What is the purpose of an access vestibule (mantrap)?",
                options: ["Monitor network traffic", "Prevent tailgating by requiring one door to close before another opens", "Store backup power equipment", "Regulate temperature in server rooms"],
                correct: 1,
                explanation: "An access vestibule (formerly called mantrap) is a two-door system where one door must close and lock before the other can open. This prevents tailgating/piggybacking, where an unauthorized person follows an authorized person through a secure entrance."
            },
            {
                question: "Which biometric method scans the blood vessels at the back of the eye?",
                options: ["Iris scan", "Retina scan", "Facial recognition", "Fingerprint scan"],
                correct: 1,
                explanation: "A retina scan examines the unique pattern of blood vessels at the back of the eye (retina). An iris scan examines the colored part of the eye. Retina scans are more intrusive but very accurate."
            },
            {
                question: "What is the ideal humidity range for a data center?",
                options: ["20-30%", "40-60%", "70-80%", "90-100%"],
                correct: 1,
                explanation: "Data centers should maintain 40-60% relative humidity. Too low causes static electricity buildup that can damage components. Too high causes condensation and corrosion."
            },
            {
                question: "Which UPS type provides zero switchover time to battery power?",
                options: ["Standby/Offline UPS", "Line-Interactive UPS", "Online/Double-Conversion UPS", "Surge protector"],
                correct: 2,
                explanation: "Online/Double-Conversion UPS continuously runs equipment from the battery while the battery is being charged. This provides zero switchover time (0ms) since equipment is always on battery power."
            },
            {
                question: "What type of fire suppression is best for a server room?",
                options: ["Wet pipe sprinkler", "Dry pipe sprinkler", "Clean agent (FM-200)", "Standard fire extinguisher"],
                correct: 2,
                explanation: "Clean agent systems like FM-200 use gas to suppress fires without leaving residue or damaging electronic equipment. Water-based sprinklers can destroy servers and other electronics."
            },
            {
                question: "What is a Kensington lock used for?",
                options: ["Locking server room doors", "Securing laptops to desks or tables", "Encrypting hard drives", "Locking network ports"],
                correct: 1,
                explanation: "A Kensington lock is a cable lock that attaches to a standard security slot found on most laptops. It deters casual theft by physically tethering the laptop to a desk, table, or other fixed object."
            },
            {
                question: "A door that stays locked when power fails is called:",
                options: ["Fail-safe", "Fail-secure", "Fail-open", "Fail-closed"],
                correct: 1,
                explanation: "Fail-secure (or fail-closed) locks remain locked when power fails, prioritizing security. Fail-safe locks unlock when power fails, prioritizing life safety (allowing evacuation). Data centers typically use fail-secure for sensitive areas."
            },
            {
                question: "Which card technology is most easily cloned?",
                options: ["Smart card with embedded chip", "Proximity card with RFID", "Magnetic stripe card", "NFC-enabled badge"],
                correct: 2,
                explanation: "Magnetic stripe cards store data in a simple magnetic format that can be easily read and duplicated with inexpensive equipment. Smart cards with embedded chips use cryptographic protection and are much harder to clone."
            },
            {
                question: "What does hot aisle/cold aisle configuration optimize?",
                options: ["Network bandwidth", "Server processing power", "Cooling efficiency in data centers", "Badge reader response time"],
                correct: 2,
                explanation: "Hot aisle/cold aisle configuration arranges server racks so cold air is delivered to server intakes (cold aisle) and hot exhaust air is collected separately (hot aisle). This improves cooling efficiency and reduces energy costs."
            },
            {
                question: "What is the primary advantage of IP cameras over analog CCTV?",
                options: ["Lower cost", "No network required", "Higher resolution and remote viewing capability", "Simpler installation"],
                correct: 2,
                explanation: "IP cameras offer higher resolution, digital storage, remote viewing over the network, easier scalability, and advanced features like motion detection and analytics. Analog cameras require coax cabling and separate DVR equipment."
            }
        ];
        let currentQuestion = 0, score = 0, answered = false;
        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('quizContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-num">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>
                    <div class="explanation" id="explanation"><h4 style="color:#f87171;margin-bottom:10px;">Explanation</h4><p>${q.explanation}</p></div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
                    </div>
                </div>`;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            answered = false;
        }
        function selectOption(i) {
            if (answered) return; answered = true;
            const q = questions[currentQuestion], opts = document.querySelectorAll('.option');
            opts.forEach(o => o.classList.add('disabled'));
            opts[i].classList.add(i === q.correct ? 'correct' : 'incorrect');
            opts[q.correct].classList.add('correct');
            if (i === q.correct) score++;
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next →';
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); } else showResults(); }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } }
        function showResults() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('results').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            const sd = document.getElementById('scoreDisplay');
            sd.textContent = pct + '%';
            sd.className = 'score ' + (pct >= 80 ? 'pass' : pct < 60 ? 'fail' : '');
            document.getElementById('resultMessage').textContent = pct >= 80 ? `Excellent! ${score}/${questions.length}` : pct >= 60 ? `Good effort! ${score}/${questions.length}` : `Review needed. ${score}/${questions.length}`;
        }
        function restartQuiz() { currentQuestion = 0; score = 0; document.getElementById('results').classList.remove('show'); renderQuestion(); }
        renderQuestion();
    </script>
    <div style="text-align: center; padding: 30px;">
        <button class="complete-btn" onclick="markComplete()">✓ Mark Complete</button>
    </div>
    <script>
        function saveProgress() {
            try {
                const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
                if (!progress.forge) progress.forge = {};
                progress.forge['core2-ch21-quiz'] = {
                    completed: true,
                    completedAt: new Date().toISOString(),
                    score: 100
                };
                localStorage.setItem('hexworth_progress', JSON.stringify(progress));
            } catch (e) {
                console.warn('[Forge] Failed to save:', e);
            }
        }
        function markComplete() {
            saveProgress();
            const btn = document.querySelector('.complete-btn');
            if (btn) { btn.innerHTML = '✓ Completed!'; btn.disabled = true; }
        }
    </script>
    <script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
