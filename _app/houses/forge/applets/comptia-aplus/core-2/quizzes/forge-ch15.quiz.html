<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Forge House</a>
        <span class="brand"><span>&#9874;&#65039;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 15 Quiz: Administrative Tools',
            description: 'A+ Core 2 - MMC, Event Viewer, Task Scheduler, and more',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'forge',
            achievement: 'forge-core2-ch15',
            moduleId: 'core2-ch15',
            serverGrading: true,
            houseId: 'forge',
            trackProgress: true,

            questions: [
                {
                    question: 'A technician needs to configure multiple Windows administrative tools from a single interface. Which tool allows adding multiple snap-ins to create a custom management console?',
                    options: [
                        'Control Panel',
                        'Microsoft Management Console (MMC)',
                        'Windows Admin Center',
                        'System Configuration'
                    ],explanation: 'Microsoft Management Console (MMC) is a framework that hosts administrative snap-ins. You can launch it with mmc.exe and add snap-ins like Device Manager, Disk Management, and Event Viewer to create a customized console for specific administrative needs.'
                },
                {
                    question: 'Which Event Viewer log records events related to Windows services, drivers, and system components?',
                    options: [
                        'Application log',
                        'Security log',
                        'System log',
                        'Setup log'
                    ],explanation: 'The System log contains events logged by Windows system components, including driver failures, hardware errors, and service start/stop events. The Application log records software events, and the Security log tracks audit events like logon attempts.'
                },
                {
                    question: 'A user complains that a program is launching automatically at startup and slowing down boot time. Which Task Scheduler trigger would cause this behavior?',
                    options: [
                        'On a schedule (daily)',
                        'At log on',
                        'On idle',
                        'On workstation unlock'
                    ],explanation: 'The \'At log on\' trigger causes a task to run when any user (or a specific user) logs in to Windows. This is a common trigger for startup programs. Other triggers like \'At startup\' run before user logon, while \'On a schedule\' runs at specific times.'
                },
                {
                    question: 'A technician needs to prevent a service from starting automatically but wants to allow manual starts when needed. Which startup type should be configured?',
                    options: [
                        'Automatic',
                        'Automatic (Delayed Start)',
                        'Manual',
                        'Disabled'
                    ],explanation: 'Manual startup type means the service won\'t start automatically but can be started manually by a user or application when needed. Disabled prevents the service from starting entirely, while Automatic starts it during boot.'
                },
                {
                    question: 'In Disk Management, what must be done to a new disk before creating partitions?',
                    options: [
                        'Format the disk',
                        'Assign a drive letter',
                        'Initialize the disk',
                        'Convert to dynamic'
                    ],explanation: 'A new disk must be initialized before it can be used. During initialization, you choose between MBR (Master Boot Record) for disks under 2TB and legacy BIOS, or GPT (GUID Partition Table) for larger disks and UEFI systems.'
                },
                {
                    question: 'A technician needs to identify the hardware ID of a device to find the correct driver. Where can this information be found?',
                    options: [
                        'Device Manager → Properties → Details → Hardware Ids',
                        'System Information → Components',
                        'Disk Management → Properties',
                        'Computer Management → Services'
                    ],explanation: 'In Device Manager, right-click the device, select Properties, go to the Details tab, and select \'Hardware Ids\' from the Property dropdown. This displays the VEN (vendor) and DEV (device) IDs needed to locate compatible drivers.'
                },
                {
                    question: 'Which Windows tool is used to manage local users and groups, including setting password policies for individual accounts?',
                    options: [
                        'Computer Management → Local Users and Groups',
                        'Control Panel → User Accounts',
                        'Settings → Accounts',
                        'netplwiz'
                    ],explanation: 'Local Users and Groups (lusrmgr.msc), accessible through Computer Management, provides full control over local user accounts and groups, including password settings, group memberships, and account properties. It\'s not available in Windows Home editions.'
                },
                {
                    question: 'A technician needs to monitor CPU usage over time to identify performance bottlenecks. Which Performance Monitor counter should be added?',
                    options: [
                        'Memory → Available MBytes',
                        'Processor → % Processor Time',
                        'PhysicalDisk → % Disk Time',
                        'Network Interface → Bytes Total/sec'
                    ],explanation: 'Processor → % Processor Time shows the percentage of time the CPU is busy processing non-idle threads. Consistently high values (above 80-90%) indicate CPU bottlenecks. Performance Monitor (perfmon.msc) allows real-time monitoring and data collection over time.'
                },
                {
                    question: 'Which command opens the Certificate Manager for the current user to manage personal certificates?',
                    options: [
                        'certmgr.msc',
                        'mmc certificates',
                        'certutil',
                        'secpol.msc'
                    ],explanation: 'certmgr.msc opens the Certificate Manager snap-in for the current user, allowing management of personal certificates, trusted root CAs, and other certificate stores. For computer-level certificates, use the Certificates snap-in in MMC targeting the local computer.'
                },
                {
                    question: 'A critical Windows service fails to start and shows a dependency error. Where can the technician view which services must be running for this service to function?',
                    options: [
                        'Event Viewer → System log',
                        'Services console → Properties → Dependencies tab',
                        'Task Manager → Services tab',
                        'System Configuration → Services'
                    ],explanation: 'The Dependencies tab in a service\'s Properties (accessed via services.msc) shows two lists: services that the selected service depends on, and services that depend on the selected service. This helps troubleshoot startup failures caused by missing dependencies.'
                }
            ]
        });
        quiz.start();
    </script>
