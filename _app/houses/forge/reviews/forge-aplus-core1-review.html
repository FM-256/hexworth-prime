<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'A+ Core 1 Review',
  storageKey: 'hexworth_review_aplus_core1',
  houseId: 'forge',
  categories: [
    {
      name: 'Hardware',
      questions: [
        { value: 100, question: 'Which component connects the CPU to RAM and high-speed expansion slots on a modern motherboard?', options: ['Southbridge','Northbridge or integrated memory controller','BIOS chip','CMOS battery'], correct: 1, explanation: 'In modern architectures, the memory controller is integrated directly into the CPU die (since Intel Sandy Bridge and AMD Ryzen). Historically, the Northbridge chipset handled this function. The term persists in the A+ curriculum to describe the high-speed data path between CPU, RAM, and PCIe slots.' },
        { value: 200, question: 'A technician is installing DDR4 RAM into a workstation. The motherboard supports dual-channel memory. How should two 8GB modules be installed for optimal performance?', options: ['In any two available DIMM slots','In matching color-coded slots (typically slots 1 and 3 or 2 and 4) as specified by the motherboard manual','In slots 1 and 2 which are always the dual-channel pair','Only one module at a time; dual-channel uses a single module'], correct: 1, explanation: 'Dual-channel memory requires modules to be installed in paired slots, typically indicated by matching colors on the motherboard (e.g., both blue slots or both black slots). The motherboard manual specifies which slots form a dual-channel pair. Incorrect placement results in single-channel operation, reducing memory bandwidth.' },
        { value: 300, question: 'A workstation powers on but displays no video output. The system beeps with one long beep followed by three short beeps. According to standard AMI BIOS beep codes, what component is most likely at fault?', options: ['Hard drive failure','RAM not detected','Video card or GPU failure','CPU overheating'], correct: 2, explanation: 'One long beep followed by three short beeps in AMI BIOS typically indicates a video card/GPU failure or the video card is not properly seated. The technician should reseat the graphics card, check power connections to the GPU, and test with a known-good card.' },
        { value: 400, question: 'A user needs a power supply for a workstation with a high-end GPU (requires two 8-pin PCIe power connectors), five SATA drives, and an ATX motherboard. The GPU alone draws 300W under load. What is the minimum recommended PSU wattage, and what efficiency rating ensures lowest heat generation?', options: ['450W with 80 Plus Bronze is sufficient','650W with 80 Plus Gold or higher; calculate total system draw plus 20-30% headroom','1000W with any efficiency rating; bigger is always better','500W with no efficiency rating requirement'], correct: 1, explanation: 'With a 300W GPU, ~125W CPU, ~50W for drives and motherboard, the system draws approximately 475W under load. Adding 20-30% headroom for transient spikes and component aging brings the recommendation to 600-650W. 80 Plus Gold (87-90% efficiency at typical loads) means less waste heat and lower electricity costs compared to Bronze (82-85%).' },
        { value: 500, question: 'A company is building a workstation for video editing that requires maximum sustained sequential read/write performance for 4K footage. The budget allows for either four 1TB NVMe SSDs or a single 4TB SATA SSD. Comparing NVMe (PCIe Gen 4 x4) to SATA III performance, what is the theoretical maximum throughput difference, and which RAID level would maximize performance with the NVMe drives while maintaining fault tolerance?', options: ['NVMe is slightly faster; use RAID 0 for maximum speed','NVMe (up to ~7,000 MB/s) is approximately 12x faster than SATA III (600 MB/s); RAID 10 provides both performance and fault tolerance with four drives','NVMe and SATA perform identically for sequential operations','NVMe is faster but RAID cannot be used with NVMe drives'], correct: 1, explanation: 'PCIe Gen 4 x4 NVMe drives achieve up to ~7,000 MB/s sequential read vs. SATA III maximum of 600 MB/s (approximately 12x faster). RAID 10 with four NVMe drives provides striped reads/writes across mirrored pairs: near-RAID 0 performance with single-drive fault tolerance per mirror pair. RAID 5 with NVMe can cause write amplification issues with SSDs, making RAID 10 the preferred choice for this use case.' }
      ]
    },
    {
      name: 'Networking',
      questions: [
        { value: 100, question: 'What is the maximum cable length for a single run of Cat 6 Ethernet cable?', options: ['50 meters','100 meters (328 feet)','200 meters','500 meters'], correct: 1, explanation: '100 meters (328 feet) is the maximum supported cable length for a single run of Cat 5e, Cat 6, or Cat 6a cable per the TIA/EIA-568 standard. This includes patch cables at both ends. Exceeding this distance causes signal degradation and packet loss.' },
        { value: 200, question: 'A small office network uses the IP range 192.168.1.0/24. How many usable host addresses are available on this subnet?', options: ['256','254','255','253'], correct: 1, explanation: 'A /24 subnet (255.255.255.0) provides 256 total addresses (2^8). Subtract 2: the network address (192.168.1.0) and the broadcast address (192.168.1.255) are not assignable to hosts, leaving 254 usable host addresses.' },
        { value: 300, question: 'A technician is troubleshooting a network connection. The workstation can ping its own IP address and the default gateway but cannot reach any external websites. DNS resolution with nslookup also fails. What is the most likely cause?', options: ['The NIC is failing and needs replacement','The DNS server address is misconfigured or the DNS server is unreachable','The subnet mask is incorrect','The Ethernet cable has a broken pin 3'], correct: 1, explanation: 'The workstation has valid IP connectivity (can ping gateway) but cannot resolve names. Since nslookup also fails, the DNS configuration is the issue: either the DNS server IP is wrong, the DNS server is down, or firewall rules are blocking DNS (UDP/TCP port 53). The network layer is functioning correctly.' },
        { value: 400, question: 'A company has two floors with separate switches. Floor 1 uses VLAN 10 (192.168.10.0/24) and Floor 2 uses VLAN 20 (192.168.20.0/24). Users on Floor 1 cannot communicate with users on Floor 2. What network device is required to enable inter-VLAN communication?', options: ['A hub to bridge the two VLANs','A Layer 3 switch or router configured for inter-VLAN routing','An additional access point on each floor','A crossover cable between the two switches'], correct: 1, explanation: 'VLANs create separate broadcast domains at Layer 2. Communication between VLANs requires Layer 3 routing. A Layer 3 switch with SVIs (Switch Virtual Interfaces) for each VLAN, or a router connected via trunk port (router-on-a-stick), can route traffic between VLAN 10 and VLAN 20.' },
        { value: 500, question: 'A SOHO router is configured with NAT. A user running a web server on an internal machine (192.168.1.50:80) wants it accessible from the internet. Port forwarding is configured, but external users still cannot connect. The ISP-assigned WAN IP is in the 100.64.x.x range. What explains this failure, and what is the ISP-level issue?', options: ['Port 80 is always blocked by routers and cannot be forwarded','The 100.64.x.x range is CGNAT (Carrier-Grade NAT) space; the user is behind double NAT, and port forwarding on the home router is ineffective because the ISP performs additional NAT upstream','The web server needs to use port 443 instead of port 80','The user needs a static internal IP; DHCP-assigned addresses cannot use port forwarding'], correct: 1, explanation: 'The 100.64.0.0/10 range (RFC 6598) is reserved for CGNAT (Carrier-Grade NAT), meaning the ISP assigns a private-like address to the customer router and performs NAT at the ISP level. Port forwarding on the home router only works for the first NAT layer; the ISP NAT blocks inbound connections. The user needs a public IP from the ISP (often a paid upgrade) or must use a tunneling service.' }
      ]
    },
    {
      name: 'Mobile Devices',
      questions: [
        { value: 100, question: 'Which mobile device connection type uses very short range (about 4 cm) and is commonly used for contactless payments?', options: ['Bluetooth','Wi-Fi Direct','NFC (Near Field Communication)','Infrared'], correct: 2, explanation: 'NFC operates at a range of approximately 4 cm (1.5 inches) and is used for contactless payments (Apple Pay, Google Pay), transit cards, and device pairing. Its extremely short range provides inherent security against remote interception.' },
        { value: 200, question: 'An employee\'s company-owned smartphone needs to be configured so that corporate data is separated from personal data, corporate apps can be remotely wiped without affecting personal content, and device encryption is enforced. What technology enables this?', options: ['A second SIM card for work use','Mobile Device Management (MDM) with container/profile separation','Manual folder organization by the user','A VPN connection to the corporate network'], correct: 1, explanation: 'MDM solutions (Intune, Workspace ONE, MobileIron) create separate containers for corporate and personal data. Administrators can enforce encryption policies, remotely wipe the corporate container without touching personal data, and manage application deployment within the work profile.' },
        { value: 300, question: 'A user reports their smartphone battery drains completely within 3 hours of a full charge. The device is 6 months old. Which troubleshooting steps should be performed in order?', options: ['Replace the battery immediately','Check battery health in settings, review apps with high battery usage, disable background refresh for non-essential apps, and test in safe mode to rule out third-party app issues','Factory reset the device without investigation','Tell the user to charge the phone more frequently'], correct: 1, explanation: 'Systematic troubleshooting begins with checking battery health (iOS: Settings > Battery > Battery Health; Android: Settings > Battery). Next, identify apps with abnormal battery consumption. Disabling background refresh for non-essential apps reduces idle drain. Safe mode isolates whether a third-party app is the culprit. Battery replacement is a last resort for a 6-month-old device.' },
        { value: 400, question: 'A technician is configuring corporate email on an employee\'s smartphone. The company uses Microsoft Exchange. The required protocol for push email with calendar and contact synchronization is:', options: ['POP3 with SSL on port 995','IMAP4 with TLS on port 993','Exchange ActiveSync (EAS) using HTTPS on port 443','SMTP with STARTTLS on port 587'], correct: 2, explanation: 'Exchange ActiveSync (EAS) is Microsoft\'s protocol for synchronizing email, calendar, contacts, and tasks with mobile devices. It uses HTTPS (port 443) for encrypted communication and supports push notifications for real-time email delivery. POP3 and IMAP can access email but do not natively synchronize calendars and contacts.' },
        { value: 500, question: 'An organization discovers that a decommissioned company smartphone was resold without proper data sanitization. The device had full-disk encryption enabled and was factory reset before sale. Is the data at risk, and what is the correct decommissioning procedure?', options: ['Factory reset completely removes all data; no risk exists','The data is at risk because factory reset on some devices only removes encryption keys without overwriting data, and forensic tools may recover data from flash storage; proper decommissioning requires verifying the factory reset performs a cryptographic erase, then confirming with a spot-check forensic scan','Encryption makes data unrecoverable regardless of procedure','Physical destruction is the only safe option for any mobile device'], correct: 1, explanation: 'Modern devices with hardware-backed encryption perform a cryptographic erase during factory reset (destroying the encryption key, making data unrecoverable). However, older devices or those with software-based encryption may not securely overwrite all storage blocks. Proper NIST 800-88 compliant decommissioning verifies the erase type, performs validation testing, and documents the process. Physical destruction is reserved for highest-security classifications.' }
      ]
    },
    {
      name: 'Virtualization & Cloud',
      questions: [
        { value: 100, question: 'What is a hypervisor in the context of virtualization?', options: ['A high-performance network switch','Software or firmware that creates and manages virtual machines','A type of cloud storage service','An advanced CPU architecture'], correct: 1, explanation: 'A hypervisor (also called a Virtual Machine Monitor) is the layer that abstracts physical hardware and allocates resources to virtual machines. Type 1 (bare-metal) hypervisors run directly on hardware (ESXi, Hyper-V). Type 2 (hosted) hypervisors run on top of an operating system (VirtualBox, VMware Workstation).' },
        { value: 200, question: 'What is the key difference between IaaS, PaaS, and SaaS cloud service models?', options: ['They are different pricing tiers for the same service','IaaS provides virtual infrastructure, PaaS provides a platform for development, and SaaS provides complete applications; each layer abstracts more management responsibility from the customer','IaaS is for storage only, PaaS is for networking, SaaS is for computing','They all provide the same services but from different cloud providers'], correct: 1, explanation: 'IaaS (Infrastructure as a Service) provides VMs, storage, and networking. PaaS (Platform as a Service) adds managed runtime environments, databases, and development tools. SaaS (Software as a Service) delivers complete applications. Moving from IaaS to SaaS, the cloud provider manages increasingly more of the stack.' },
        { value: 300, question: 'A virtual machine is configured with 4 vCPUs and 16 GB RAM on a host with 8 physical cores and 32 GB RAM. Two other VMs with similar configurations exist on the same host. What performance issue will likely occur, and what is the underlying cause?', options: ['No issue; virtual resources are unlimited','CPU overcommitment: 12 vCPUs mapped to 8 physical cores causes CPU scheduling contention, leading to CPU ready time and degraded performance for all VMs during high-utilization periods','Memory overcommitment only; CPU is not affected','Network bandwidth saturation between VMs'], correct: 1, explanation: 'With 12 vCPUs competing for 8 physical cores, the hypervisor scheduler must time-slice physical CPU access. When multiple VMs need CPU simultaneously, they experience "CPU ready" time (waiting for a physical core). The VM performance degrades during contention periods. The ratio of vCPUs to physical cores (1.5:1 here) should be monitored and kept within acceptable bounds based on workload patterns.' },
        { value: 400, question: 'A company wants to migrate a legacy application to the cloud but the application requires a specific OS kernel version and custom kernel modules. Which cloud deployment strategy is most appropriate?', options: ['SaaS deployment with vendor customization','IaaS with a custom VM image containing the required OS and kernel configuration','PaaS deployment that abstracts the OS entirely','Serverless/FaaS (Function as a Service) deployment'], correct: 1, explanation: 'IaaS provides the most control over the operating system environment. The company can build a custom VM image with the exact kernel version and modules required, upload it to the cloud provider, and deploy VMs from that image. PaaS and SaaS abstract the OS layer, and serverless does not provide kernel-level access.' },
        { value: 500, question: 'A disaster recovery plan specifies an RPO (Recovery Point Objective) of 15 minutes and an RTO (Recovery Time Objective) of 1 hour for a critical database. The team is evaluating cloud-based DR solutions. Which architecture meets both objectives at reasonable cost?', options: ['Daily VM snapshots stored in cold cloud storage with manual restoration','Continuous database replication to a hot standby VM in another region with automated failover, combined with 15-minute incremental backups for point-in-time recovery','Weekly full backups to tape stored offsite','A pilot light configuration with the database server powered off until needed'], correct: 1, explanation: 'The 15-minute RPO requires data replication or backups at least every 15 minutes. Continuous replication provides near-zero RPO, and 15-minute incremental backups provide point-in-time recovery. The 1-hour RTO requires the standby to be running or quickly startable; a hot standby with automated failover meets this easily. Daily snapshots (24-hour RPO) and weekly tapes violate the RPO. A pilot light configuration may exceed the 1-hour RTO due to server boot and data sync time.' }
      ]
    },
    {
      name: 'Troubleshooting HW',
      questions: [
        { value: 100, question: 'A laser printer is producing faded prints on every page. Which component is most likely the cause?', options: ['The fuser assembly','The transfer roller','The toner cartridge (low toner)','The pickup roller'], correct: 2, explanation: 'Consistently faded output across all pages is the most common symptom of low toner. The toner cartridge should be checked first. Gently rocking the cartridge side-to-side can redistribute remaining toner temporarily, but replacement is needed. Fuser issues typically cause smearing, not fading.' },
        { value: 200, question: 'A user reports that their desktop computer randomly shuts down after running intensive applications for 30-60 minutes. The system restarts normally after cooling down. What is the most likely cause?', options: ['Power supply failure','CPU or GPU overheating causing thermal shutdown','Malware infection','Faulty RAM module'], correct: 1, explanation: 'Random shutdowns under load that resolve after cooling are classic thermal shutdown symptoms. Modern CPUs and GPUs have thermal protection that forces shutdown when temperatures exceed safe thresholds (typically 100-105C for CPUs). Common causes include dust-clogged heatsinks, dried thermal paste, or failed case fans.' },
        { value: 300, question: 'A technician replaces a failed hard drive in a workstation. The new drive is detected in BIOS but the Windows installer cannot see it. The drive is an NVMe SSD. What is the most likely cause?', options: ['The SSD is defective and must be returned','The Windows installation media does not include the NVMe/storage controller driver; the driver must be loaded during installation using "Load driver" option','NVMe SSDs are not compatible with Windows','The BIOS needs a firmware update to support any SSD'], correct: 1, explanation: 'Older Windows installation media may not include drivers for newer NVMe controllers or RAID controllers. During Windows setup, the "Load driver" option allows loading the appropriate storage controller driver from a USB drive. The manufacturer provides these drivers on their support website. This is especially common with custom OEM NVMe controllers.' },
        { value: 400, question: 'A workstation experiences intermittent blue screens (BSOD) with varying stop codes including IRQL_NOT_LESS_OR_EQUAL, PAGE_FAULT_IN_NONPAGED_AREA, and MEMORY_MANAGEMENT. The system passes a quick RAM test but fails an extended test. What does this indicate about the failure pattern?', options: ['The hard drive is failing and corrupting data','One or more RAM modules have intermittent bit errors that only manifest under extended stress testing; the modules should be tested individually to isolate the faulty stick','The CPU is overheating during extended use','The motherboard chipset is failing'], correct: 1, explanation: 'Multiple memory-related BSOD stop codes combined with passing quick RAM tests but failing extended tests indicate marginal RAM with intermittent bit errors. Quick tests only check basic addressing; extended tests stress-test every cell with patterns that reveal subtle failures. Testing each module individually (in the same known-good slot) isolates the faulty module.' },
        { value: 500, question: 'A server experiences a complete POST failure: no video, no beeps, and fans spin at full speed. The motherboard has no visible damage, capacitors appear normal, and the PSU tests good with a multimeter. Removing all components except the CPU and one RAM stick does not change the behavior. The CPU was recently upgraded. What systematic diagnostic approach identifies the root cause?', options: ['Replace the entire motherboard immediately','The full-speed fan spin with no POST indicates the CPU is not executing any code. Verify CPU compatibility with the specific motherboard BIOS revision, check for bent socket pins (LGA) or bent CPU pins (PGA), verify the CPU power connector (4/8-pin EPS) is fully seated, and test with the original CPU to confirm','The CMOS battery is dead; replace it and retry','The power supply tester is inaccurate; try a different PSU'], correct: 1, explanation: 'Fans at full speed with no POST/beep indicates the system is not entering POST code execution, pointing to a CPU initialization failure. After a CPU upgrade, the most likely causes are: (1) BIOS version does not support the new CPU (common with newer CPUs on older boards), (2) bent socket/CPU pins from installation, (3) the 4/8-pin CPU power connector is not seated. Testing with the original CPU confirms whether the issue is CPU compatibility or socket damage.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'A+ Core 1 Synthesis',
    question: 'A small business owner calls with this scenario: "My computer was working fine yesterday. This morning it turns on, fans spin, I see the manufacturer logo, then it says No Boot Device Found. I did not change anything." Walking the user through troubleshooting over the phone, what is the most methodical first step that addresses the most common cause?',
    options: [
      'Tell the user to reinstall Windows from scratch',
      'Have the user enter BIOS/UEFI setup and check if the boot drive is detected in the storage configuration; if missing, the drive may have failed or a cable is loose; if present, verify the boot order has not changed',
      'Recommend purchasing a new computer',
      'Ask the user to open the case and reseat the CPU'
    ],
    correct: 1,
    explanation: 'The CompTIA troubleshooting methodology starts with identifying the problem and establishing a theory. "No Boot Device Found" after previously working means either the drive is not detected (hardware failure, loose cable, or BIOS change) or the boot order changed (common after BIOS updates or battery issues). Checking BIOS first is non-destructive, does not require opening the case, and differentiates between drive detection (hardware) and boot order (configuration) issues, guiding the next troubleshooting step.'
  },
  onComplete: function(results) {
  }
});
