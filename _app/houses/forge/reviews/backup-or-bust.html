<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup or Bust - Forge House Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 12px;
            border: 2px solid #f97316;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fb923c;
            transform: translateX(-5px);
        }

        h1 {
            color: #f97316;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid #333;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316 0%, #fb923c 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .score-display {
            text-align: center;
            font-size: 1.5em;
            color: #f97316;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .scenario-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scenario-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333;
        }

        .scenario-icon {
            font-size: 3em;
            filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.5));
        }

        .scenario-title {
            flex: 1;
        }

        .scenario-title h2 {
            color: #f97316;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .scenario-type {
            display: inline-block;
            padding: 5px 15px;
            background: #f97316;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .scenario-content {
            margin: 20px 0;
        }

        .requirements-box {
            background: #0f0f0f;
            border: 2px solid #f97316;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .requirements-box h3 {
            color: #f97316;
            margin-bottom: 15px;
        }

        .requirement-item {
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }

        .requirement-item:last-child {
            border-bottom: none;
        }

        .requirement-label {
            color: #a0a0a0;
        }

        .requirement-value {
            color: #f97316;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: #0f0f0f;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
        }

        .calendar-day:hover {
            border-color: #f97316;
            transform: scale(1.05);
        }

        .calendar-day.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }

        .day-label {
            font-size: 0.8em;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .backup-indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-top: 5px;
        }

        .backup-full {
            background: #f97316;
        }

        .backup-incremental {
            background: #3b82f6;
        }

        .backup-differential {
            background: #10b981;
        }

        .backup-types {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .backup-type-btn {
            padding: 12px 24px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-weight: 600;
        }

        .backup-type-btn:hover {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }

        .backup-type-btn.active {
            border-color: #f97316;
            background: #f97316;
            color: white;
        }

        .backup-type-btn.full {
            border-color: #f97316;
        }

        .backup-type-btn.incremental {
            border-color: #3b82f6;
        }

        .backup-type-btn.differential {
            border-color: #10b981;
        }

        .timeline {
            background: #0f0f0f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
        }

        .timeline-items {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .timeline-item {
            min-width: 120px;
            padding: 15px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            border-color: #f97316;
            transform: translateY(-5px);
        }

        .timeline-item.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }

        .timeline-item.infected {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .timeline-label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #f97316;
        }

        .timeline-time {
            font-size: 0.85em;
            color: #a0a0a0;
        }

        .restore-chain {
            background: #0f0f0f;
            border: 2px dashed #f97316;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            margin: 20px 0;
        }

        .restore-chain h3 {
            color: #f97316;
            margin-bottom: 15px;
        }

        .chain-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chain-item {
            padding: 10px 20px;
            background: #1a1a1a;
            border: 2px solid #f97316;
            border-radius: 8px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .option-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-card:hover {
            border-color: #f97316;
            transform: translateY(-5px);
        }

        .option-card.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }

        .option-card.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .option-card.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .option-title {
            font-weight: bold;
            color: #f97316;
            margin-bottom: 10px;
        }

        .option-description {
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .disaster-banner {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .calculation-box {
            background: #0f0f0f;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .calculation-step {
            padding: 8px 0;
            color: #a0a0a0;
        }

        .calculation-result {
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 5px;
            margin-top: 10px;
            color: #3b82f6;
            font-weight: bold;
            font-size: 1.1em;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            color: #f97316;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f0f0f;
            border: 2px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f97316;
        }

        .btn {
            padding: 15px 40px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            background: #fb923c;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #333;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .feedback {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            color: #10b981;
        }

        .feedback.incorrect {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            color: #ef4444;
        }

        .explanation {
            background: #0f0f0f;
            border: 2px solid #f97316;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .explanation h3 {
            color: #f97316;
            margin-bottom: 15px;
        }

        .explanation p {
            margin: 10px 0;
            color: #a0a0a0;
        }

        .completion-screen {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #f97316;
            border-radius: 12px;
            animation: slideIn 0.5s ease;
        }

        .completion-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 1s ease;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .completion-title {
            color: #f97316;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .completion-score {
            font-size: 3em;
            color: #10b981;
            margin: 20px 0;
            font-weight: bold;
        }

        .completion-message {
            font-size: 1.2em;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .scenario-header {
                flex-direction: column;
                text-align: center;
            }

            .calendar-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .timeline-items {
                flex-direction: column;
            }

            .timeline-item {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" onclick="history.back(); return false;" class="back-link">← Back</a>
            <h1>🔥 Backup or Bust</h1>
            <p class="subtitle">Master Disaster Recovery & Backup Strategies</p>
        </header>

        <div class="score-display">
            Score: <span id="score">0</span> / 10
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;">
                <span id="progressText">Scenario 0/10</span>
            </div>
        </div>

        <div id="gameContainer"></div>
    </div>

    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>

    <script>
        // Game State
        let currentScenario = 0;
        let score = 0;
        let scenarioData = {};

        // Scenario Definitions
        const scenarios = [
            {
                id: 1,
                title: "Full Backup Basics",
                type: "PLAN",
                icon: "💾",
                description: "You manage a 100GB file server. You have a weekly backup window on Sunday nights. The server has a 1Gbps network connection to the backup device.",
                requirements: {
                    "Server Size": "100 GB",
                    "Backup Window": "Sunday Nights",
                    "Network Speed": "1 Gbps (125 MB/s)",
                    "Required Strategy": "Weekly Full Backup"
                },
                question: "How long will the full backup take at 50 MB/s effective throughput?",
                type_question: "multiple_choice",
                options: [
                    { id: "a", text: "15 minutes", correct: false },
                    { id: "b", text: "33 minutes", correct: true },
                    { id: "c", text: "2 hours", correct: false },
                    { id: "d", text: "50 minutes", correct: false }
                ],
                explanation: "Calculation: 100GB = 102,400 MB. At 50 MB/s: 102,400 / 50 = 2,048 seconds = ~34 minutes. Full backups capture all data regardless of changes, making them the simplest but most time-consuming backup type."
            },
            {
                id: 2,
                title: "Incremental Chain Recovery",
                type: "RESTORE",
                icon: "🔗",
                description: "Your backup schedule: Full backup every Sunday, Incremental backups Monday-Saturday. Disaster struck Wednesday at 2 PM!",
                disaster: "⚠️ SERVER CRASH - Data loss detected!",
                requirements: {
                    "Last Full Backup": "Sunday 11 PM",
                    "Incremental Backups": "Mon 11 PM, Tue 11 PM, Wed 11 PM",
                    "Disaster Time": "Wednesday 2 PM"
                },
                question: "Which backups do you need to restore? (Select all that apply)",
                type_question: "restore_chain",
                available_backups: [
                    { id: "sun_full", label: "Sunday Full", time: "11 PM", required: true },
                    { id: "mon_inc", label: "Monday Inc", time: "11 PM", required: true },
                    { id: "tue_inc", label: "Tuesday Inc", time: "11 PM", required: true },
                    { id: "wed_inc", label: "Wednesday Inc", time: "11 PM", required: false },
                    { id: "thu_inc", label: "Thursday Inc", time: "11 PM", required: false }
                ],
                correct_chain: ["sun_full", "mon_inc", "tue_inc"],
                explanation: "With incremental backups, you need the last full backup plus ALL incremental backups up to the disaster point. Wednesday's backup happened AFTER the disaster (11 PM), so it's not needed. You restore: Sunday Full → Monday Inc → Tuesday Inc. This recovers data up to Tuesday 11 PM (losing ~15 hours)."
            },
            {
                id: 3,
                title: "Differential vs Incremental",
                type: "PLAN",
                icon: "⚖️",
                description: "You need to design a backup strategy for a database server. Business requirement: 1-hour RTO (Recovery Time Objective). Compare strategies.",
                requirements: {
                    "RTO Requirement": "1 hour",
                    "Data Size": "200 GB",
                    "Daily Changes": "20 GB",
                    "Restore Speed": "100 MB/s"
                },
                question: "Which strategy meets the 1-hour RTO requirement?",
                type_question: "multiple_choice",
                options: [
                    {
                        id: "a",
                        title: "Weekly Full + Daily Incremental",
                        text: "Full backup Sunday, incremental backups Monday-Saturday. Worst case: restore 1 full + 6 incrementals.",
                        correct: false
                    },
                    {
                        id: "b",
                        title: "Weekly Full + Daily Differential",
                        text: "Full backup Sunday, differential backups Monday-Saturday. Worst case: restore 1 full + 1 differential.",
                        correct: true
                    },
                    {
                        id: "c",
                        title: "Daily Full Backup",
                        text: "Full backup every day. Restore only 1 backup set.",
                        correct: false
                    },
                    {
                        id: "d",
                        title: "Monthly Full + Daily Incremental",
                        text: "Full backup monthly, incremental daily. Worst case: restore 1 full + 30 incrementals.",
                        correct: false
                    }
                ],
                explanation: "Differential backups store all changes since the last full backup. By Saturday, the differential contains 120GB (6 days × 20GB). Restore time: 200GB full + 120GB diff = 320GB / 100MB/s = 53 minutes. Meets the 1-hour RTO! Incremental (option A) would need to restore 7 tapes sequentially, taking longer. Daily full works but wastes storage and backup time."
            },
            {
                id: 4,
                title: "RPO Challenge",
                type: "PLAN",
                icon: "⏱️",
                description: "Your business requires a 4-hour RPO (Recovery Point Objective). The database processes transactions continuously, with approximately 10GB of data changes per day.",
                requirements: {
                    "RPO Requirement": "4 hours",
                    "Daily Data Changes": "10 GB",
                    "Server Uptime": "24/7",
                    "Critical System": "Yes"
                },
                question: "Design the backup schedule to meet the 4-hour RPO:",
                type_question: "multiple_choice",
                options: [
                    { id: "a", text: "Full backup daily at midnight", correct: false },
                    { id: "b", text: "Full backup weekly, incremental backup every 4 hours", correct: true },
                    { id: "c", text: "Full backup weekly, incremental backup daily", correct: false },
                    { id: "d", text: "Differential backup every 6 hours", correct: false }
                ],
                explanation: "RPO defines the maximum acceptable data loss. A 4-hour RPO means backups must occur at least every 4 hours. Option B: Weekly full + 4-hour incrementals ensures you never lose more than 4 hours of data. Daily backups (A, C) could lose up to 24 hours. Option D's 6-hour interval exceeds the RPO requirement."
            },
            {
                id: 5,
                title: "Ransomware Recovery",
                type: "RESTORE",
                icon: "☠️",
                description: "Ransomware encrypted your files! Security logs show the infection started Tuesday at 2:00 PM. You need to restore from a clean backup set.",
                disaster: "🦠 RANSOMWARE DETECTED - Files encrypted!",
                requirements: {
                    "Infection Time": "Tuesday 2:00 PM",
                    "Detection Time": "Wednesday 9:00 AM",
                    "Backup Schedule": "Full Sunday, Incremental Daily"
                },
                question: "Which backup chain is SAFE to restore from?",
                type_question: "restore_chain",
                available_backups: [
                    { id: "sun_full", label: "Sunday Full", time: "11 PM", required: true, infected: false },
                    { id: "mon_inc", label: "Monday Inc", time: "11 PM", required: true, infected: false },
                    { id: "tue_6am", label: "Tuesday Inc", time: "6 AM", required: true, infected: false },
                    { id: "tue_12pm", label: "Tuesday Inc", time: "12 PM", required: false, infected: true },
                    { id: "tue_6pm", label: "Tuesday Inc", time: "6 PM", required: false, infected: true },
                    { id: "wed_6am", label: "Wednesday Inc", time: "6 AM", required: false, infected: true }
                ],
                correct_chain: ["sun_full", "mon_inc", "tue_6am"],
                explanation: "CRITICAL: Never restore from potentially infected backups! The infection began Tuesday at 2 PM, so any backup after that time (Tuesday 12 PM if it ran late, Tuesday 6 PM, Wednesday 6 AM) may contain encrypted files or malware. Safe chain: Sunday Full → Monday Inc → Tuesday 6 AM Inc. You'll lose data from 6 AM to 2 PM Tuesday, but your data will be clean."
            },
            {
                id: 6,
                title: "The 3-2-1 Rule",
                type: "PLAN",
                icon: "🛡️",
                description: "Implement the industry-standard 3-2-1 backup rule for maximum resilience: 3 copies of data, 2 different media types, 1 offsite copy.",
                requirements: {
                    "Data Size": "500 GB",
                    "Primary Location": "Office Server",
                    "Budget": "Moderate",
                    "Recovery Goal": "Survive site disaster"
                },
                question: "Which backup strategy correctly implements the 3-2-1 rule?",
                type_question: "multiple_choice",
                options: [
                    {
                        id: "a",
                        title: "3 copies on same NAS device",
                        text: "Production data + 2 backup copies, all on the same network storage.",
                        correct: false
                    },
                    {
                        id: "b",
                        title: "Production + Local NAS + Cloud",
                        text: "Production data on server (1), backup to local NAS (2, different media), copy to cloud storage (3, offsite).",
                        correct: true
                    },
                    {
                        id: "c",
                        title: "2 local backups + 1 offsite tape",
                        text: "Production + 2 local disk backups + monthly tape shipped offsite.",
                        correct: false
                    },
                    {
                        id: "d",
                        title: "Production + 2 cloud copies",
                        text: "Production data + backups to two different cloud providers.",
                        correct: false
                    }
                ],
                explanation: "The 3-2-1 rule: (3) Keep 3 copies of data - production + 2 backups. (2) Store on 2 different media types - disk and cloud/tape. (1) Keep 1 copy offsite - protects against fire, theft, natural disasters. Option B correctly implements this: server (production) + local NAS (different device) + cloud (offsite, different media). Option A fails '2 different media', C has 4 copies not 3, D lacks local fast recovery."
            },
            {
                id: 7,
                title: "Database Point-in-Time Recovery",
                type: "RESTORE",
                icon: "🗄️",
                description: "A developer accidentally ran a DELETE query at 3:47 PM. You need point-in-time recovery (PITR) for your SQL Server database using transaction log backups.",
                disaster: "❌ ACCIDENTAL DELETE - Need precise recovery!",
                requirements: {
                    "Full Backup": "Sunday 11 PM",
                    "Transaction Logs": "Every hour, on the hour",
                    "Incident Time": "Thursday 3:47 PM",
                    "Target Recovery": "Thursday 3:46 PM"
                },
                question: "Which backups do you need for point-in-time recovery to 3:46 PM?",
                type_question: "restore_chain",
                available_backups: [
                    { id: "sun_full", label: "Sunday Full", time: "11 PM", required: true },
                    { id: "log_mon", label: "Mon-Wed Logs", time: "All", required: true },
                    { id: "log_3pm", label: "Thu 3 PM Log", time: "3:00 PM", required: true },
                    { id: "log_4pm", label: "Thu 4 PM Log", time: "4:00 PM", required: false },
                    { id: "tail_log", label: "Tail-Log Backup", time: "Current", required: true }
                ],
                correct_chain: ["sun_full", "log_mon", "log_3pm", "tail_log"],
                explanation: "Point-in-time recovery requires: (1) Last full backup before the incident (2) All transaction log backups from full to incident (3) The tail-log backup (current transaction log). You restore Sunday full, then replay transaction logs through Thursday 3 PM, then use the tail-log backup to recover to exactly 3:46 PM. The 4 PM log doesn't exist yet. PITR can recover to any second, making it perfect for accidental deletions!"
            },
            {
                id: 8,
                title: "Cloud Storage Costs",
                type: "PLAN",
                icon: "☁️",
                description: "Calculate the monthly cloud storage costs for your backup strategy. Understanding costs is crucial for budget planning and retention policies.",
                requirements: {
                    "Initial Data Size": "500 GB",
                    "Daily Change Rate": "10% (50 GB)",
                    "Retention Period": "30 days",
                    "Cloud Storage Cost": "$0.023/GB/month",
                    "Strategy": "Weekly Full + Daily Incremental"
                },
                question: "What is the total monthly storage cost (approximate)?",
                type_question: "calculation",
                calculation: {
                    steps: [
                        "Weekly full backups: 4 weeks × 500 GB = 2,000 GB",
                        "Daily incrementals: 30 days × 50 GB = 1,500 GB",
                        "Total storage: 2,000 + 1,500 = 3,500 GB",
                        "Monthly cost: 3,500 GB × $0.023 = $80.50"
                    ],
                    answer: 80.50,
                    tolerance: 5
                },
                explanation: "Cloud backup costs include storage and often egress (downloading). With 30-day retention, you keep 4 weekly fulls (2TB) plus 30 daily incrementals (1.5TB) = 3.5TB total. At $0.023/GB, that's ~$80.50/month. Real-world tip: Incremental-forever or synthetic full backups can reduce storage by avoiding multiple full copies. Also consider egress costs if you need to restore!"
            },
            {
                id: 9,
                title: "RTO Calculation",
                type: "PLAN",
                icon: "⏰",
                description: "Your company has a 4-hour RTO SLA. Calculate if your current backup strategy can meet it. Account for all recovery steps!",
                requirements: {
                    "Full Backup Size": "1 TB (1,000 GB)",
                    "Latest Incremental": "100 GB",
                    "Restore Bandwidth": "200 MB/s",
                    "Server Rebuild Time": "30 minutes",
                    "Application Install": "15 minutes",
                    "Data Verification": "20 minutes"
                },
                question: "What is the total RTO (Recovery Time Objective)?",
                type_question: "calculation",
                calculation: {
                    steps: [
                        "Restore full backup: 1,000,000 MB / 200 MB/s = 5,000 sec = 83.3 min",
                        "Restore incremental: 100,000 MB / 200 MB/s = 500 sec = 8.3 min",
                        "Server rebuild: 30 min",
                        "Application install: 15 min",
                        "Data verification: 20 min",
                        "Total RTO: 83.3 + 8.3 + 30 + 15 + 20 = 156.6 minutes = 2.6 hours"
                    ],
                    answer: 2.6,
                    tolerance: 0.2
                },
                explanation: "RTO isn't just backup restore time! It includes: (1) Infrastructure rebuild (bare metal, VM, cloud instance) (2) OS and driver installation (3) Application installation and configuration (4) Data restoration (5) Verification and testing. Total: ~2.6 hours. This MEETS the 4-hour SLA with buffer time. Always calculate complete end-to-end recovery time, not just data restoration!"
            },
            {
                id: 10,
                title: "Full Data Center Disaster Recovery",
                type: "RESTORE",
                icon: "🔥",
                description: "DISASTER: Data center fire destroyed all primary systems. You must orchestrate complete DR recovery at the backup site. Order matters!",
                disaster: "🚨 DATA CENTER FIRE - Full DR activation required!",
                requirements: {
                    "Disaster Type": "Complete Site Loss",
                    "DR Site": "Cloud Infrastructure",
                    "Recovery Priority": "Business Critical Systems",
                    "Available Backups": "All recent backups intact"
                },
                question: "What is the correct recovery order?",
                type_question: "multiple_choice",
                options: [
                    {
                        id: "a",
                        title: "Database → App Servers → AD → DNS",
                        text: "Start with data, then applications, then infrastructure services.",
                        correct: false
                    },
                    {
                        id: "b",
                        title: "Active Directory → DNS → App Servers → Databases",
                        text: "Infrastructure first, then applications, then data.",
                        correct: true
                    },
                    {
                        id: "c",
                        title: "App Servers → Database → DNS → AD",
                        text: "Applications first, then supporting systems.",
                        correct: false
                    },
                    {
                        id: "d",
                        title: "DNS → Database → App Servers → AD",
                        text: "Name resolution first, then data and apps.",
                        correct: false
                    }
                ],
                explanation: "DR recovery order follows the dependency chain: (1) Active Directory - authentication and authorization foundation (2) DNS - name resolution needed for everything (3) Application Servers - business logic and services (4) Databases - data layer (often done in parallel with apps). If you restore databases before AD, nothing can authenticate. If apps come before DNS, they can't find services. This is called the 'recovery tree' - always start at the root (identity & infrastructure) and work up to data and applications."
            }
        ];

        // Initialize game
        function initGame() {
            renderScenario();
        }

        // Render current scenario
        function renderScenario() {
            const container = document.getElementById('gameContainer');

            if (currentScenario >= scenarios.length) {
                showCompletionScreen();
                return;
            }

            const scenario = scenarios[currentScenario];
            scenarioData = {};

            let html = `
                <div class="scenario-card">
                    <div class="scenario-header">
                        <div class="scenario-icon">${scenario.icon}</div>
                        <div class="scenario-title">
                            <h2>${scenario.title}</h2>
                            <span class="scenario-type">${scenario.type} PHASE</span>
                        </div>
                    </div>

                    <div class="scenario-content">
                        <p>${scenario.description}</p>

                        ${scenario.disaster ? `<div class="disaster-banner">${scenario.disaster}</div>` : ''}

                        <div class="requirements-box">
                            <h3>📋 Scenario Details</h3>
                            ${Object.entries(scenario.requirements).map(([key, value]) => `
                                <div class="requirement-item">
                                    <span class="requirement-label">${key}:</span>
                                    <span class="requirement-value">${value}</span>
                                </div>
                            `).join('')}
                        </div>

                        <h3 style="color: #f97316; margin: 20px 0;">${scenario.question}</h3>

                        ${renderQuestion(scenario)}
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button class="btn" onclick="submitAnswer()">Submit Answer</button>
                    </div>

                    <div id="feedback"></div>
                </div>
            `;

            container.innerHTML = html;
            updateProgress();
        }

        // Render question based on type
        function renderQuestion(scenario) {
            switch (scenario.type_question) {
                case 'multiple_choice':
                    return renderMultipleChoice(scenario);
                case 'restore_chain':
                    return renderRestoreChain(scenario);
                case 'calculation':
                    return renderCalculation(scenario);
                default:
                    return '';
            }
        }

        // Render multiple choice question
        function renderMultipleChoice(scenario) {
            return `
                <div class="options-grid">
                    ${scenario.options.map(option => `
                        <div class="option-card" onclick="selectOption('${option.id}')">
                            <div class="option-title">${option.title || option.text}</div>
                            ${option.text && option.title ? `<div class="option-description">${option.text}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Render restore chain question
        function renderRestoreChain(scenario) {
            scenarioData.selectedBackups = [];
            return `
                <div class="timeline">
                    <h3 style="color: #f97316; margin-bottom: 15px;">Available Backups (Click to select):</h3>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color backup-full"></div>
                            <span>Full Backup</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color backup-incremental"></div>
                            <span>Incremental</span>
                        </div>
                        ${scenario.available_backups.some(b => b.infected) ? `
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ef4444;"></div>
                            <span>Potentially Infected</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="timeline-items">
                        ${scenario.available_backups.map(backup => {
                            const isFull = backup.label.includes('Full');
                            const isLog = backup.label.includes('Log') || backup.label.includes('Tail');
                            const typeColor = isFull ? '#f97316' : isLog ? '#10b981' : '#3b82f6';
                            const typeLabel = isFull ? 'FULL' : isLog ? 'LOG' : 'INC';
                            return `
                            <div class="timeline-item ${backup.infected ? 'infected' : ''}" onclick="toggleBackup('${backup.id}')" style="border-left: 4px solid ${typeColor};">
                                <div style="display:inline-block;padding:2px 8px;border-radius:4px;background:${typeColor};color:#fff;font-size:0.7em;font-weight:bold;margin-bottom:8px;">${typeLabel}</div>
                                <div class="timeline-label">${backup.label}</div>
                                <div class="timeline-time">${backup.time}</div>
                                <div class="backup-indicator" style="background:${typeColor};width:20px;height:20px;border-radius:50%;margin:8px auto 0;"></div>
                                ${backup.infected ? '<div style="color: #ef4444; margin-top: 5px;">⚠️ Warning</div>' : ''}
                            </div>
                        `}).join('')}
                    </div>
                </div>

                <div class="restore-chain">
                    <h3>Selected Restore Chain (in order):</h3>
                    <div class="chain-items" id="chainItems">
                        <div style="color: #666;">Click backups above to build your restore chain...</div>
                    </div>
                </div>
            `;
        }

        // Render calculation question
        function renderCalculation(scenario) {
            return `
                <div class="calculation-box">
                    <h3 style="color: #3b82f6; margin-bottom: 15px;">💡 Calculation Hint:</h3>
                    ${scenario.calculation.steps.map(step => `
                        <div class="calculation-step">• ${step}</div>
                    `).join('')}
                </div>

                <div class="input-group">
                    <label>Your Answer (numeric value, e.g., 80.5 or 2.6):</label>
                    <input type="number" step="0.1" id="calculationInput" placeholder="Enter your calculated value">
                </div>
            `;
        }

        // Select multiple choice option
        function selectOption(optionId) {
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.target.closest('.option-card').classList.add('selected');
            scenarioData.selectedOption = optionId;
        }

        // Toggle backup in restore chain
        function toggleBackup(backupId) {
            const scenario = scenarios[currentScenario];
            const backup = scenario.available_backups.find(b => b.id === backupId);

            if (!scenarioData.selectedBackups) {
                scenarioData.selectedBackups = [];
            }

            const index = scenarioData.selectedBackups.indexOf(backupId);
            if (index > -1) {
                scenarioData.selectedBackups.splice(index, 1);
            } else {
                scenarioData.selectedBackups.push(backupId);
            }

            // Update visual feedback
            document.querySelectorAll('.timeline-item').forEach(item => {
                item.classList.remove('selected');
            });
            scenarioData.selectedBackups.forEach(id => {
                const element = document.querySelector(`[onclick="toggleBackup('${id}')"]`);
                if (element) element.classList.add('selected');
            });

            // Update chain display
            const chainContainer = document.getElementById('chainItems');
            if (scenarioData.selectedBackups.length === 0) {
                chainContainer.innerHTML = '<div style="color: #666;">Click backups above to build your restore chain...</div>';
            } else {
                chainContainer.innerHTML = scenarioData.selectedBackups.map(id => {
                    const backup = scenario.available_backups.find(b => b.id === id);
                    return `<div class="chain-item">${backup.label} (${backup.time})</div>`;
                }).join('');
            }
        }

        // Submit answer
        function submitAnswer() {
            const scenario = scenarios[currentScenario];
            let isCorrect = false;

            switch (scenario.type_question) {
                case 'multiple_choice':
                    isCorrect = checkMultipleChoice(scenario);
                    break;
                case 'restore_chain':
                    isCorrect = checkRestoreChain(scenario);
                    break;
                case 'calculation':
                    isCorrect = checkCalculation(scenario);
                    break;
            }

            if (isCorrect) {
                score++;
                updateScore();
            }

            showFeedback(isCorrect, scenario);
        }

        // Check multiple choice answer
        function checkMultipleChoice(scenario) {
            if (!scenarioData.selectedOption) {
                alert('Please select an answer!');
                return false;
            }

            const selectedOption = scenario.options.find(o => o.id === scenarioData.selectedOption);

            // Visual feedback
            document.querySelectorAll('.option-card').forEach(card => {
                const cardText = card.querySelector('.option-title, .option-description').textContent;
                const option = scenario.options.find(o =>
                    (o.title && cardText.includes(o.title)) || cardText.includes(o.text)
                );

                if (option) {
                    if (option.correct) {
                        card.classList.add('correct');
                    } else if (option.id === scenarioData.selectedOption) {
                        card.classList.add('incorrect');
                    }
                }
            });

            return selectedOption.correct;
        }

        // Check restore chain answer
        function checkRestoreChain(scenario) {
            if (!scenarioData.selectedBackups || scenarioData.selectedBackups.length === 0) {
                alert('Please select backups for the restore chain!');
                return false;
            }

            const correct = JSON.stringify(scenarioData.selectedBackups.sort()) ===
                          JSON.stringify(scenario.correct_chain.sort());

            // Visual feedback
            document.querySelectorAll('.timeline-item').forEach(item => {
                const backupId = item.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (scenario.correct_chain.includes(backupId)) {
                    item.style.borderColor = '#10b981';
                } else if (scenarioData.selectedBackups.includes(backupId)) {
                    item.style.borderColor = '#ef4444';
                }
            });

            return correct;
        }

        // Check calculation answer
        function checkCalculation(scenario) {
            const input = document.getElementById('calculationInput');
            if (!input || input.value === '') {
                alert('Please enter your calculated answer!');
                return false;
            }

            const userAnswer = parseFloat(input.value);
            const correctAnswer = scenario.calculation.answer;
            const tolerance = scenario.calculation.tolerance || 1;

            const isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;

            // Visual feedback
            if (isCorrect) {
                input.style.borderColor = '#10b981';
            } else {
                input.style.borderColor = '#ef4444';
            }

            return isCorrect;
        }

        // Show feedback
        function showFeedback(isCorrect, scenario) {
            const feedbackDiv = document.getElementById('feedback');

            const html = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <h3>${isCorrect ? '✅ Correct!' : '❌ Incorrect'}</h3>
                    <p>${isCorrect ? 'Great job! You understand this concept.' : 'Not quite right. Review the explanation below.'}</p>
                </div>

                <div class="explanation">
                    <h3>📚 Explanation</h3>
                    <p>${scenario.explanation}</p>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="nextScenario()">
                        ${currentScenario < scenarios.length - 1 ? 'Next Scenario →' : 'View Results'}
                    </button>
                </div>
            `;

            feedbackDiv.innerHTML = html;

            // Disable submit button
            document.querySelector('.btn[onclick="submitAnswer()"]').disabled = true;
        }

        // Next scenario
        function nextScenario() {
            currentScenario++;
            renderScenario();
        }

        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Update progress bar
        function updateProgress() {
            const progress = (currentScenario / scenarios.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Scenario ${currentScenario}/${scenarios.length}`;
        }

        // Show completion screen
        function showCompletionScreen() {
            const container = document.getElementById('gameContainer');
            const percentage = (score / scenarios.length) * 100;

            let message = '';
            let icon = '';

            if (percentage === 100) {
                message = 'Perfect Score! You are a Backup Master!';
                icon = '🏆';
            } else if (percentage >= 80) {
                message = 'Excellent work! You have strong DR knowledge!';
                icon = '🌟';
            } else if (percentage >= 60) {
                message = 'Good job! Keep learning about backup strategies!';
                icon = '👍';
            } else {
                message = 'Keep practicing! Disaster recovery is crucial!';
                icon = '📚';
            }

            container.innerHTML = `
                <div class="completion-screen">
                    <div class="completion-icon">${icon}</div>
                    <h2 class="completion-title">Game Complete!</h2>
                    <div class="completion-score">${score} / ${scenarios.length}</div>
                    <p class="completion-message">${message}</p>
                    <div style="margin: 30px 0;">
                        <p style="color: #10b981; font-size: 1.3em; font-weight: bold;">+50 XP Earned!</p>
                        <p style="color: #a0a0a0; margin-top: 10px;">Achievement Unlocked: Backup or Bust Complete</p>
                    </div>
                    <div style="margin-top: 30px;">
                        <button class="btn" onclick="location.reload()">Play Again</button>
                        <button class="btn btn-secondary" onclick="history.back()">Return to Forge</button>
                    </div>
                </div>
            `;

            // Award XP
            awardXP();
        }

        // Award XP and achievements
        function awardXP() {
            if (!localStorage.getItem('game_backup_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_backup_xp_awarded', 'true');

                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    const uid = localStorage.getItem('hexworth_uid');
                    if (uid) {
                        FirestoreManager.addXP(uid, 50, 'Backup or Bust Complete');
                    }
                }
            }

            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_backup');
            }

            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('backup', { score: score, total: scenarios.length });
            }
        }

        // Start the game
        initGame();
    </script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/GameScoreboard.js"></script>
</body>
</html>
