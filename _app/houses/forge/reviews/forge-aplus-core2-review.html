<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'A+ Core 2 Review',
  storageKey: 'hexworth_review_aplus_core2',
  houseId: 'forge',
  categories: [
    {
      name: 'Operating Systems',
      questions: [
        { value: 100, question: 'Which Windows feature allows a user to restore the system to a previous configuration state without affecting personal files?', options: ['System Image Backup','System Restore','Windows Reset','File History'], correct: 1, explanation: 'System Restore creates snapshots (restore points) of system files, registry settings, and installed programs. Restoring to a previous point reverts system configuration without deleting user documents, photos, or other personal files.' },
        { value: 200, question: 'A technician needs to upgrade a Windows 10 Home computer to Windows 10 Pro to join a corporate domain. What is the upgrade path?', options: ['A clean install is required; in-place upgrade is not possible','Enter a Windows 10 Pro product key in Settings > Update & Security > Activation to perform an in-place edition upgrade','Install Windows 10 Enterprise first, then downgrade to Pro','Run the Media Creation Tool and select Pro during setup'], correct: 1, explanation: 'Windows 10 supports in-place edition upgrades. Entering a valid Pro product key in the Activation settings triggers an automatic upgrade from Home to Pro without reinstalling the OS or losing data. The system downloads additional Pro features and restarts.' },
        { value: 300, question: 'A macOS user needs to force quit an unresponsive application. What is the keyboard shortcut and the alternative method?', options: ['Ctrl+Alt+Delete; or open Task Manager','Command+Option+Escape opens Force Quit Applications; alternatively use Activity Monitor from Utilities','Command+Q; or close the window','Power button hold for 5 seconds; or unplug the computer'], correct: 1, explanation: 'Command+Option+Escape opens the Force Quit Applications dialog where the user can select and force quit the unresponsive app. Activity Monitor (Applications > Utilities > Activity Monitor) provides more detailed process management similar to Task Manager, allowing you to quit processes and view resource usage.' },
        { value: 400, question: 'A Linux server running Ubuntu 22.04 needs a newer kernel to support recently installed hardware. The current kernel is 5.15 and the hardware requires 5.19. What is the safest approach to update the kernel without breaking the system?', options: ['Compile the kernel from source; it is the only option','Install the newer kernel using the HWE (Hardware Enablement) stack: sudo apt install linux-generic-hwe-22.04, which installs the newer kernel alongside the existing one and allows booting into either from GRUB','Replace the entire /boot partition with a newer Ubuntu release','Use Windows drivers in compatibility mode'], correct: 1, explanation: 'Ubuntu\'s HWE (Hardware Enablement) stack backports newer kernels to LTS releases. Installing the HWE kernel adds it alongside the existing kernel. Both appear in GRUB, allowing fallback to the original kernel if the new one causes issues. This is safer than manual kernel compilation and maintains Ubuntu\'s package management and update system.' },
        { value: 500, question: 'A company plans to deploy Windows 11 across 500 workstations. Many machines have TPM 1.2 instead of the required TPM 2.0, and some lack UEFI Secure Boot. What is the architectural reason Microsoft mandates these requirements, and what are the technical risks of bypassing them using registry edits?', options: ['TPM 2.0 and Secure Boot are marketing requirements with no technical benefit','TPM 2.0 provides hardware-backed key storage for BitLocker, Windows Hello, and Credential Guard. Secure Boot ensures only signed bootloaders execute, preventing bootkits. Bypassing these removes the hardware root of trust, making the system vulnerable to pre-boot attacks and unsupported for future security updates','TPM 1.2 and TPM 2.0 are identical; the version check is arbitrary','These requirements only apply to virtual machines, not physical hardware'], correct: 1, explanation: 'TPM 2.0 provides a hardware root of trust with stronger cryptographic algorithms (SHA-256 vs. SHA-1 in TPM 1.2), hardware-isolated key storage for BitLocker and Windows Hello, and attestation capabilities for Credential Guard. Secure Boot validates the boot chain integrity. Bypassing these via registry hacks (LabConfig values) removes these security foundations and may prevent future Windows Update security patches from being applied.' }
      ]
    },
    {
      name: 'Security',
      questions: [
        { value: 100, question: 'What type of malware disguises itself as legitimate software to trick users into installing it?', options: ['Worm','Trojan horse','Rootkit','Adware'], correct: 1, explanation: 'A Trojan horse (or Trojan) masquerades as legitimate, useful software to deceive users into installation. Unlike viruses and worms, Trojans do not self-replicate. Once installed, they can create backdoors, steal data, or install additional malware.' },
        { value: 200, question: 'A user receives an email claiming to be from their bank, asking them to click a link and verify their account credentials. The link leads to a convincing replica of the bank website. What type of attack is this?', options: ['Brute force attack','Phishing attack','Man-in-the-middle attack','Denial of service attack'], correct: 1, explanation: 'Phishing uses social engineering through deceptive emails, messages, or websites to trick users into revealing sensitive information. Spear phishing targets specific individuals, while whaling targets executives. The key indicators are urgency, impersonation of trusted entities, and links to fraudulent sites.' },
        { value: 300, question: 'An administrator wants to enforce a password policy that requires passwords to be at least 12 characters, include uppercase, lowercase, numbers, and special characters, and prevents reuse of the last 10 passwords. In Windows, which tool configures these settings for domain-joined workstations?', options: ['Registry Editor (regedit)','Group Policy Management Console (GPMC) editing the Default Domain Policy','Local Users and Groups (lusrmgr.msc)','Windows Defender Security Center'], correct: 1, explanation: 'Domain password policies are configured through Group Policy: Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy. Settings include minimum length, complexity requirements, password history (number of remembered passwords), and maximum/minimum age. The Default Domain Policy applies to all domain users.' },
        { value: 400, question: 'A technician discovers that a workstation has been compromised by a fileless malware attack that resides entirely in memory and uses PowerShell for execution. Traditional antivirus found nothing. What defense mechanisms specifically address fileless attacks?', options: ['Installing a stronger traditional antivirus with larger signature databases','Enabling Windows Defender Exploit Guard with Attack Surface Reduction rules, configuring PowerShell Constrained Language Mode, enabling Script Block Logging, and deploying an EDR solution with memory analysis capabilities','Disabling PowerShell entirely and using only Command Prompt','Running a full disk format and OS reinstallation as the only solution'], correct: 1, explanation: 'Fileless malware evades signature-based detection by operating in memory. Defense requires multiple layers: ASR rules block common fileless attack vectors (Office macro child processes, obfuscated scripts). Constrained Language Mode limits PowerShell to basic functions. Script Block Logging captures deobfuscated script content for analysis. EDR solutions with behavioral analysis and memory scanning detect anomalous process behavior that signature-based tools miss.' },
        { value: 500, question: 'A company implements BitLocker on all laptops with TPM and PIN protector. An employee\'s laptop is stolen while powered off. The attacker has physical access and sophisticated forensic tools. Evaluate the security of the data under these scenarios: (1) TPM-only mode, (2) TPM+PIN mode, and (3) TPM+PIN with pre-boot DMA protection disabled.', options: ['All three scenarios provide identical protection since BitLocker is enabled','(1) TPM-only is vulnerable to cold boot and DMA attacks since the key is released automatically at boot. (2) TPM+PIN requires the PIN before releasing keys, defeating automated boot attacks. (3) Without pre-boot DMA protection, a Thunderbolt/PCIe device can perform a DMA attack during the PIN prompt to extract keys from memory','BitLocker cannot be defeated by any physical attack','Only scenario 3 is vulnerable; scenarios 1 and 2 are equally secure'], correct: 1, explanation: 'TPM-only mode releases the encryption key during normal boot, meaning a cold boot attack (freezing RAM to preserve volatile data) or DMA attack (via FireWire/Thunderbolt/PCIe) during boot can extract the key. TPM+PIN mode requires user authentication before the TPM releases the key, preventing automated boot attacks. However, without pre-boot DMA protection (Kernel DMA Protection), a DMA attack during the PIN entry screen can still access physical memory. Full protection requires TPM+PIN with Secure Boot and Kernel DMA Protection enabled.' }
      ]
    },
    {
      name: 'Software Troubleshooting',
      questions: [
        { value: 100, question: 'A user reports that their web browser displays a "Your connection is not private" certificate error when visiting a company website. What is the most common cause?', options: ['The website has been hacked','The SSL/TLS certificate has expired, is self-signed, or the system clock is incorrect','The user needs to update their browser','JavaScript is disabled in the browser'], correct: 1, explanation: 'Certificate errors typically occur when: the certificate has expired, it is self-signed (not issued by a trusted CA), the domain name does not match the certificate, or the client system clock is wrong (certificates are validated against the current date). Checking the system clock is a quick first step.' },
        { value: 200, question: 'A Windows application crashes immediately after launching with the error "The application was unable to start correctly (0xc000007b)." What does this error indicate?', options: ['Insufficient disk space','A mismatch between 32-bit and 64-bit application components, or a missing/corrupted Visual C++ Redistributable or .NET Framework dependency','The application license has expired','The user does not have permission to run the application'], correct: 1, explanation: 'Error 0xc000007b indicates a bad image format, typically caused by a 32-bit application trying to load a 64-bit DLL (or vice versa), or missing Visual C++ Redistributable libraries. Reinstalling the appropriate Visual C++ Redistributable packages (both x86 and x64) and ensuring the correct application architecture is installed usually resolves this.' },
        { value: 300, question: 'A technician needs to troubleshoot a Windows 10 PC that boots to a blank screen after the Windows logo. Safe Mode with Networking works normally. What is the systematic approach to identify the cause?', options: ['Reinstall Windows immediately','In Safe Mode, check Event Viewer for errors during normal boot, use msconfig to perform a clean boot (disable all non-Microsoft services and startup items), then re-enable items in groups to isolate the conflicting software or driver','Replace the graphics card','Wait for the next Windows Update to fix it'], correct: 1, explanation: 'A clean boot (msconfig > Selective Startup) disables all third-party services and startup programs. If the system boots normally in clean boot, the issue is a third-party conflict. Re-enabling services in groups (half at a time, binary search method) efficiently isolates the problematic software. Event Viewer may also show the specific driver or service that failed during normal boot.' },
        { value: 400, question: 'A macOS user reports that Spotlight search returns no results and the system frequently shows a spinning rainbow cursor (beach ball). Activity Monitor shows the mds_stores process consuming 100% CPU. What is the diagnosis and resolution?', options: ['The hard drive is full; delete files to free space','The Spotlight index is corrupted; rebuild it using sudo mdutil -E / in Terminal to erase and rebuild the index for the root volume','macOS needs to be reinstalled from scratch','The RAM is failing and causing process errors'], correct: 1, explanation: 'mds_stores is the Spotlight metadata server responsible for indexing. 100% CPU usage with broken search results indicates a corrupted index. The command sudo mdutil -E / erases the existing Spotlight index for the specified volume and triggers a complete rebuild. During re-indexing (which may take hours), CPU usage will be elevated but should normalize once complete.' },
        { value: 500, question: 'A Linux server running a Java application experiences an OutOfMemoryError despite the server having 32 GB of RAM with 20 GB free. The JVM is configured with -Xmx4g (4 GB max heap). The application logs show the error occurs during peak traffic. What is the root cause, and what is the comprehensive troubleshooting approach?', options: ['The server needs more physical RAM','The JVM heap is exhausted despite available system RAM because Java manages its own memory pool. Troubleshooting: analyze the heap dump (jmap -dump:live,format=b,file=heap.hprof PID) to identify memory leaks, check for unclosed resources (database connections, file handles), review GC logs for full GC frequency, and consider tuning -Xmx, -Xms, and garbage collector settings based on the application profile','Restart the Linux server to clear the memory','Disable Java garbage collection to prevent memory issues'], correct: 1, explanation: 'The JVM allocates a fixed maximum heap (-Xmx) from system RAM. The OutOfMemoryError occurs when the 4 GB heap is exhausted, regardless of available system RAM. A heap dump reveals which objects consume memory (often indicating a memory leak like unclosed connections or growing caches). GC logs show if the garbage collector cannot free sufficient space. The fix may involve patching the application leak, increasing -Xmx, or tuning GC algorithms (G1GC, ZGC) for the workload pattern.' }
      ]
    },
    {
      name: 'Operational Procedures',
      questions: [
        { value: 100, question: 'What is the first step in the CompTIA troubleshooting methodology?', options: ['Establish a theory of probable cause','Identify the problem','Test the theory','Implement the solution'], correct: 1, explanation: 'The CompTIA troubleshooting methodology starts with: 1) Identify the problem (gather information, question users, identify symptoms, determine changes). This establishes the foundation for all subsequent steps: theory, testing, plan, implementation, verification, and documentation.' },
        { value: 200, question: 'A technician is about to replace a motherboard in a workstation containing sensitive company data. According to best practices, which precaution specifically protects the data during this hardware repair?', options: ['Wear an ESD wrist strap only','Document the data on the drives and ensure a current backup exists before beginning hardware work; note drive positions and connections for proper reassembly','Disconnect the internet cable before starting','Take a photo of the exterior of the case'], correct: 1, explanation: 'Before any hardware work that could affect storage devices, verify that a current backup exists. Document drive connections (SATA port numbers, RAID configuration) and positions. This ensures data recovery is possible if a drive is accidentally damaged during the repair and that the storage configuration can be properly restored.' },
        { value: 300, question: 'An organization is developing an Acceptable Use Policy (AUP) for company-issued devices. Which of the following should the AUP address?', options: ['Only the types of websites employees can visit','Permitted and prohibited uses of company equipment, personal use limitations, monitoring disclosure, data ownership, password requirements, and consequences for policy violations','Only the IT department responsibilities','Hardware specifications and warranty information'], correct: 1, explanation: 'A comprehensive AUP covers: permitted/prohibited use of company devices, personal use boundaries, company monitoring practices (email, web, device location), data ownership and intellectual property, password and authentication requirements, BYOD policies if applicable, incident reporting procedures, and consequences for violations. It must be acknowledged by all employees.' },
        { value: 400, question: 'A company is disposing of 50 old hard drives that contained sensitive financial data. The drives are a mix of HDDs and SSDs. What data destruction method is appropriate for each drive type, and why does the method differ?', options: ['Format all drives with a quick format; this is sufficient for both types','HDDs: degaussing or multi-pass overwrite (NIST 800-88). SSDs: manufacturer secure erase command (ATA Secure Erase) or physical destruction, because SSDs have wear-leveling that prevents complete overwriting of all cells through traditional write methods','Simply delete all files and empty the recycle bin on each drive','Physical destruction is the only option for both types'], correct: 1, explanation: 'HDD data can be reliably overwritten because the write head accesses all sectors sequentially. SSDs use wear-leveling controllers that remap blocks, meaning some data cells are not accessible through standard write operations (over-provisioned and remapped blocks). ATA Secure Erase sends a firmware-level command to the SSD controller to reset all cells. Physical destruction (shredding) is the highest-assurance method for both types when compliance requires it.' },
        { value: 500, question: 'A technician is called to a workstation that may have been involved in a security incident. The supervisor says law enforcement may need to investigate. What specific evidence handling procedures must the technician follow, and what common mistakes can render digital evidence inadmissible?', options: ['Turn off the computer immediately and hand it to law enforcement','Maintain chain of custody documentation from first contact. Do not power off the system (volatile evidence in RAM). Document the current state with photos and notes. Create a forensic disk image using a write blocker before examining the original. Common mistakes that render evidence inadmissible: powering off before capturing RAM, accessing the original drive without a write blocker, failing to document chain of custody, and modifying timestamps by opening files directly','Copy all files to a USB drive for law enforcement','Remove the hard drive and lock it in a safe until law enforcement arrives'], correct: 1, explanation: 'Digital forensics requires strict procedures: chain of custody must document every person who handles the evidence and when. Volatile evidence (RAM contents, running processes, network connections) is lost when powered off. Write blockers prevent any modification to the original media during imaging. Forensic images (bit-for-bit copies) are analyzed instead of the original. Any break in chain of custody or modification of original evidence (even opening a file changes its access timestamp) can render it inadmissible in court.' }
      ]
    },
    {
      name: 'Documentation & Change Mgmt',
      questions: [
        { value: 100, question: 'What is the purpose of a knowledge base in an IT support environment?', options: ['To store employee personal files','To provide a centralized repository of documented solutions, troubleshooting procedures, and known issues for faster resolution of recurring problems','To track employee attendance','To store software license keys only'], correct: 1, explanation: 'A knowledge base (KB) is a centralized collection of articles documenting solutions to known issues, step-by-step procedures, FAQs, and best practices. It enables faster incident resolution by allowing technicians to reference proven solutions instead of troubleshooting from scratch each time.' },
        { value: 200, question: 'A change management process requires several steps before implementing a change to production systems. What is the correct order of these steps?', options: ['Implement, document, test, approve','Submit change request, impact analysis, approval by change advisory board (CAB), test in staging, implement with rollback plan, document results','Test, implement, then submit the change request afterward','Approve, implement, skip documentation to save time'], correct: 1, explanation: 'Proper change management follows a structured process: request submission with justification, risk and impact analysis, CAB review and approval, testing in a non-production environment, scheduled implementation with a defined rollback plan, and post-implementation documentation and review. This minimizes the risk of unplanned outages.' },
        { value: 300, question: 'A network administrator makes a change to a core switch ACL on Friday evening. Monday morning, multiple departments report they cannot access shared drives. No documentation of the change exists. How does this scenario illustrate the importance of change management?', options: ['Change management would have prevented the administrator from making any changes','Proper change management would have required documentation of the change, a tested rollback plan, and CAB approval with impact analysis that would have identified the affected departments before implementation','Change management only applies to software changes, not network changes','The administrator should have made the change on Monday instead of Friday'], correct: 1, explanation: 'This scenario illustrates multiple change management failures: no change request or impact analysis (would have identified affected departments and file server access), no CAB review (a second pair of eyes would have caught the ACL issue), no rollback plan (recovery took the entire weekend without it), and no documentation (Monday troubleshooting started from zero). Each step in change management exists to prevent exactly this type of incident.' },
        { value: 400, question: 'A company is creating a Standard Operating Procedure (SOP) for onboarding new employees from an IT perspective. What elements should this SOP include to ensure consistency and security?', options: ['Only the steps to create an email account','Account creation workflow (AD user, email, application access based on role), hardware provisioning and asset tagging, security training enrollment, AUP acknowledgment, MFA enrollment, access verification by manager, and documentation of all assigned assets and access rights','A simple checklist of software to install','Verbal instructions passed between technicians'], correct: 1, explanation: 'A comprehensive onboarding SOP ensures every new employee receives consistent, role-appropriate setup: identity provisioning (AD account, email, application access based on job role), hardware assignment with asset tracking, mandatory security awareness training, AUP signature, MFA enrollment, manager verification of access rights, and documentation of all assigned assets and credentials. This ensures no steps are missed and provides an audit trail.' },
        { value: 500, question: 'An organization is audited and found non-compliant because they cannot produce accurate network diagrams, asset inventories, or change logs for the past year. The existing documentation is scattered across personal files, outdated wikis, and tribal knowledge. Design a documentation framework that addresses these audit failures and prevents recurrence.', options: ['Hire a dedicated documentation specialist to write everything from scratch','Create documentation failures cannot be solved; accept the audit findings','Implement a centralized CMDB (Configuration Management Database) for asset tracking, version-controlled network diagrams updated with every change request, automated change logging integrated with the ticketing system, and scheduled quarterly documentation reviews with assigned owners for each document category','Store all documentation in a shared email folder'], correct: 2, explanation: 'Sustainable documentation requires: a CMDB (ServiceNow, Snipe-IT) as the single source of truth for assets and configurations, network diagrams in version-controlled tools (draw.io with Git, Visio with SharePoint versioning) updated as part of the change management process, automated change logging (ticketing system captures what changed, when, why, and by whom), and governance through quarterly reviews with assigned document owners. The key insight is that documentation must be embedded into existing workflows (change management triggers diagram updates) rather than treated as a separate activity.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'A+ Core 2 Synthesis',
    question: 'A user calls the help desk reporting that their laptop screen shows a message demanding Bitcoin payment to decrypt their files. The user clicked a link in an email 30 minutes ago. The laptop is connected to a corporate network with mapped drives to shared file servers. Applying the CompTIA troubleshooting methodology and incident response best practices, what is the single most critical FIRST action?',
    options: [
      'Run a full antivirus scan to identify the ransomware variant',
      'Immediately disconnect the laptop from the network (pull Ethernet cable and disable Wi-Fi) to prevent the ransomware from encrypting files on mapped network shares',
      'Shut down the laptop to stop the encryption process',
      'Begin restoring files from the most recent backup'
    ],
    correct: 1,
    explanation: 'The most critical first action is network isolation. Ransomware actively encrypts files it can access, including mapped network drives. Every second the laptop remains connected, it may be encrypting shared files that affect the entire organization. Disconnecting the network stops lateral spread. A full shutdown is not recommended because volatile evidence in memory (encryption keys, process information) is needed for forensic analysis and potential decryption. Antivirus scanning and backup restoration are important subsequent steps, but stopping the spread takes absolute priority.'
  },
  onComplete: function(results) {
  }
});
