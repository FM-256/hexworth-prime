<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script><script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script><script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Troubleshooter Lab | Bare Metal | The Forge</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh}.lab-container{max-width:900px;margin:0 auto;padding:1.5rem}.lab-header{text-align:center;margin-bottom:2rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(245,158,11,0.05));border-radius:16px;border:1px solid rgba(251,191,36,0.3)}.lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.lab-subtitle{color:#9ca3af;font-size:.9rem;margin-top:.3rem}.score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:.8rem;font-size:.85rem;color:#fbbf24}.score-num{font-weight:700;font-size:1.2rem}.progress-track{width:180px;height:5px;background:rgba(251,191,36,0.15);border-radius:3px;overflow:hidden}.progress-fill{height:100%;width:0%;background:#fbbf24;transition:width .4s ease}.ticket{background:rgba(30,30,40,.6);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem;transition:all .3s}.ticket.done{opacity:.7;pointer-events:none}.ticket.ok{border-color:#22c55e}.ticket.no{border-color:#ef4444}.t-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}.t-num{font-size:.72rem;color:#fbbf24;text-transform:uppercase;letter-spacing:.1em}.t-type{font-size:.72rem;padding:.15rem .5rem;border-radius:10px;background:rgba(59,130,246,.12);color:#3b82f6}.t-symptom{font-size:.95rem;color:#f1f5f9;margin-bottom:.4rem;font-weight:600}.t-detail{font-size:.85rem;color:#94a3b8;margin-bottom:.8rem;line-height:1.5}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.opt{padding:.5rem .8rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:.82rem;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{border-color:rgba(251,191,36,.4)}.opt.right{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08)}.opt.wrong{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.06)}.t-fb{margin-top:.5rem;font-size:.82rem;padding:.5rem;border-radius:6px;display:none}.t-fb.show{display:block}.t-fb.fbok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.t-fb.fbno{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5}.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,.15)}.nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;border:1px solid rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.08)}.reset-btn{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;cursor:pointer;font-size:.78rem}#complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;cursor:pointer;margin:1rem auto}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Printer Troubleshooter Lab -- Bare Metal</h1>
<div class="lab-container">
    <div class="lab-header">
        <div class="lab-title">Printer Troubleshooter</div>
        <div class="lab-subtitle">Diagnose 8 printer problems. Read the symptom, select the cause.</div>
        <div class="score-bar"><span>Solved: <span class="score-num" id="score">0</span>/8</span><div class="progress-track"><div class="progress-fill" id="pf"></div></div><button class="reset-btn" onclick="resetLab()">Reset</button></div>
    </div>
    <div id="tickets"></div>
    <div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
    <nav class="nav-buttons"><a href="../index.html" class="nav-btn">Back to Bare Metal</a></nav>
</div>
<script>
const TICKETS=[
{type:"Laser",symptom:"Toner smears off the page when touched",detail:"A user reports that printouts from the office laser printer are legible but the toner wipes off with a finger. The text appears normal but is not permanently bonded to the paper.",answer:"Fuser assembly failure",opts:["Low toner","Fuser assembly failure","Drum defect","Wrong paper type"],explain:"The fuser melts toner into paper at ~200C. If the fuser fails, toner sits loose on the surface."},
{type:"Laser",symptom:"Repeating marks at regular intervals on every page",detail:"Every printout has a faint shadow of previously printed content appearing at consistent intervals down the page. The pattern repeats every 3-4 inches.",answer:"Defective OPC drum",opts:["Defective OPC drum","Low toner cartridge","Paper feed roller worn","Transfer belt misaligned"],explain:"Regular repeating marks = drum circumference. The drum is not being fully cleaned between rotations."},
{type:"Inkjet",symptom:"Horizontal white lines across the printout",detail:"An inkjet printer produces color images with thin horizontal white lines running across the output. Some areas print fine, others have gaps.",answer:"Clogged print head nozzles",opts:["Empty ink cartridge","Clogged print head nozzles","Wrong paper size","USB cable fault"],explain:"Clogged nozzles block ink from specific lines. Run the built-in nozzle cleaning utility."},
{type:"Laser",symptom:"Paper keeps jamming in the same spot",detail:"The printer jams every 5-10 pages. The paper always gets stuck at the same location inside the paper path, near the pickup area.",answer:"Worn pickup rollers",opts:["Worn pickup rollers","Fuser overheating","Incorrect paper weight","Network timeout"],explain:"Worn pickup rollers cannot grip paper consistently. Replace rollers or the maintenance kit."},
{type:"Inkjet",symptom:"Colors are shifted and misaligned",detail:"Text and images print with color layers that do not line up. Red, green, and blue components are visible separately instead of combining into the correct colors.",answer:"Print heads need alignment",opts:["Ink cartridge expired","Print heads need alignment","Wrong color profile","Paper loaded backwards"],explain:"Misaligned print heads cause color separation. Run the alignment utility from the printer software."},
{type:"Laser",symptom:"Blank pages coming out of the printer",detail:"The printer feeds paper and goes through the print cycle but every page comes out completely blank. The toner cartridge was recently replaced.",answer:"Sealing tape not removed from new cartridge",opts:["Sealing tape not removed from new cartridge","Fuser unplugged","Network driver error","Paper loaded upside down"],explain:"New toner cartridges have a sealing pull-tab. If not removed, no toner reaches the drum."},
{type:"Thermal",symptom:"Receipt printer output is completely black",detail:"A POS receipt printer is producing solid black paper instead of readable text. The paper was recently replaced.",answer:"Paper loaded wrong side up",opts:["Paper loaded wrong side up","Thermal head burned out","Ribbon exhausted","Firmware corruption"],explain:"Direct thermal paper has a heat-sensitive coating on one side. Loaded backwards, the heat turns the entire surface black."},
{type:"Network",symptom:"Print jobs stuck in queue, printer shows online",detail:"Multiple users report jobs stuck in the Windows print queue. The printer status shows 'Ready' on its control panel and responds to ping.",answer:"Print spooler service needs restart",opts:["Printer is offline","Print spooler service needs restart","Toner is empty","Firewall blocking port 80"],explain:"Stale spooler. Restart the Print Spooler service (services.msc) and clear the spool folder if needed."}
];
let sc=0,ans=0;
function build(){
    const c=document.getElementById('tickets');c.innerHTML='';
    TICKETS.forEach((t,i)=>{
        const d=document.createElement('div');d.className='ticket';d.id='t'+i;
        const opts=[...t.opts].sort(()=>Math.random()-.5);
        d.innerHTML=`<div class="t-header"><span class="t-num">Ticket ${i+1}</span><span class="t-type">${t.type}</span></div><div class="t-symptom">${t.symptom}</div><div class="t-detail">${t.detail}</div><div class="opts">${opts.map(o=>`<button class="opt" onclick="check(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div><div class="t-fb" id="fb${i}"></div>`;
        c.appendChild(d);
    });
}
function check(i,ch,btn){
    const d=document.getElementById('t'+i);if(d.classList.contains('done'))return;d.classList.add('done');ans++;
    const correct=TICKETS[i].answer;const fb=document.getElementById('fb'+i);
    d.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('right');});
    if(ch===correct){sc++;btn.classList.add('right');d.classList.add('ok');fb.className='t-fb show fbok';fb.textContent='Correct! '+TICKETS[i].explain;}
    else{btn.classList.add('wrong');d.classList.add('no');fb.className='t-fb show fbno';fb.textContent='Incorrect. Answer: '+correct+'. '+TICKETS[i].explain;}
    document.getElementById('score').textContent=sc;document.getElementById('pf').style.width=(ans/8*100)+'%';
    if(ans===8&&sc>=6)document.getElementById('complete-btn').style.display='block';
}
function resetLab(){sc=0;ans=0;document.getElementById('score').textContent='0';document.getElementById('pf').style.width='0%';document.getElementById('complete-btn').style.display='none';build();}
function completeModule(){if(typeof ModuleProgress!=='undefined')ModuleProgress.complete('forge','bm-w4-printers-lab',{returnUrl:'../index.html'});}
build();
</script>

    <hex-ai-button mission-id="bm-w4-printers" house="forge"></hex-ai-button>

</body>
</html>
