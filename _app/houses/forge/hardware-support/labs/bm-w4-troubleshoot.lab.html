<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script><script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script><script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Decoder Lab | Bare Metal | The Forge</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh}.lab-container{max-width:900px;margin:0 auto;padding:1.5rem}.lab-header{text-align:center;margin-bottom:2rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(245,158,11,0.05));border-radius:16px;border:1px solid rgba(251,191,36,0.3)}.lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.lab-subtitle{color:#9ca3af;font-size:.9rem;margin-top:.3rem}.score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:.8rem;font-size:.85rem;color:#fbbf24}.score-num{font-weight:700;font-size:1.2rem}.progress-track{width:180px;height:5px;background:rgba(251,191,36,0.15);border-radius:3px;overflow:hidden}.progress-fill{height:100%;width:0%;background:#fbbf24;transition:width .4s ease}.code-card{background:rgba(30,30,40,.6);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem;transition:all .3s}.code-card.done{opacity:.7;pointer-events:none}.code-card.ok{border-color:#22c55e}.code-card.no{border-color:#ef4444}.cc-header{display:flex;align-items:center;gap:1rem;margin-bottom:.6rem}.cc-num{font-size:.72rem;color:#fbbf24;text-transform:uppercase;letter-spacing:.1em}.cc-code{font-family:'Courier New',monospace;font-size:1.3rem;font-weight:700;padding:.3rem .8rem;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:6px;color:#fbbf24}.cc-scenario{font-size:.9rem;color:#94a3b8;margin-bottom:.8rem;line-height:1.5}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.opt{padding:.5rem .8rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:.82rem;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{border-color:rgba(251,191,36,.4)}.opt.right{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08)}.opt.wrong{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.06)}.cc-fb{margin-top:.5rem;font-size:.82rem;padding:.5rem;border-radius:6px;display:none}.cc-fb.show{display:block}.cc-fb.fbok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.cc-fb.fbno{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5}.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,.15)}.nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;border:1px solid rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.08)}.reset-btn{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;cursor:pointer;font-size:.78rem}#complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;cursor:pointer;margin:1rem auto}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">POST Decoder Lab -- Bare Metal</h1>
<div class="lab-container">
    <div class="lab-header">
        <div class="lab-title">POST Code Decoder</div>
        <div class="lab-subtitle">Interpret beep codes, LED patterns, and symptoms to identify the failing component. 10 scenarios.</div>
        <div class="score-bar"><span>Decoded: <span class="score-num" id="score">0</span>/10</span><div class="progress-track"><div class="progress-fill" id="pf"></div></div><button class="reset-btn" onclick="resetLab()">Reset</button></div>
    </div>
    <div id="codes"></div>
    <div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
    <nav class="nav-buttons"><a href="../index.html" class="nav-btn">Back to Bare Metal</a></nav>
</div>
<script>
const CODES=[
{code:"1 short beep",scenario:"System powers on, fans spin, single short beep, display appears, boots to OS normally.",answer:"Normal POST -- all tests passed",opts:["Normal POST -- all tests passed","RAM failure","CPU warning","GPU not detected"]},
{code:"1 long + 2 short beeps",scenario:"System powers on, fans spin, you hear one long beep followed by two short beeps. No display output on the monitor.",answer:"Video/GPU failure",opts:["RAM failure","Video/GPU failure","CPU overheating","Hard drive not found"]},
{code:"1 long + 3 short beeps",scenario:"After installing new RAM, the system beeps with one long beep and three short beeps. No display output.",answer:"Memory (RAM) failure",opts:["Video/GPU failure","Memory (RAM) failure","Keyboard not detected","CMOS battery dead"]},
{code:"Continuous beeping",scenario:"System powers on but produces a non-stop continuous beep tone. No display. RAM was recently removed for cleaning.",answer:"RAM not detected",opts:["CPU failure","PSU overload","RAM not detected","Motherboard short circuit"]},
{code:"No beeps, no display",scenario:"Press power button. Fans do not spin. No LEDs. No beeps. Complete silence. PSU switch is ON.",answer:"PSU failure or no power",opts:["PSU failure or no power","CPU failure","RAM failure","GPU failure"]},
{code:"DRAM LED lit (amber)",scenario:"Modern motherboard with debug LEDs. System powers on, fans spin, but the DRAM LED stays lit solid amber. No display.",answer:"RAM not detected or incompatible",opts:["CPU not seated properly","RAM not detected or incompatible","GPU power not connected","Storage drive missing"]},
{code:"VGA LED lit (white)",scenario:"Debug LED labeled VGA stays lit after POST attempts. Fans spin including GPU fans. No display output on any port.",answer:"GPU not detected or failed",opts:["RAM failure","CPU failure","GPU not detected or failed","Boot drive not found"]},
{code:"BOOT LED lit",scenario:"System shows the BIOS splash screen, then the BOOT debug LED stays lit. Error message: 'No bootable device found.'",answer:"Boot drive not detected or boot order wrong",opts:["RAM failure","CPU overheating","Boot drive not detected or boot order wrong","GPU driver missing"]},
{code:"Fans spin then stop (3 sec)",scenario:"Press power, all fans spin for about 3 seconds, then everything shuts off. Repeats on every attempt. New build, first power-on.",answer:"CPU power (8-pin EPS) not connected",opts:["PSU defective","CPU power (8-pin EPS) not connected","RAM in wrong slots","Case short circuit"]},
{code:"POST code 0x55 on debug card",scenario:"A POST diagnostic card inserted in a PCIe slot displays hex code 55. System hangs at this code. No display output.",answer:"Memory not installed or failed",opts:["CPU initialization error","Memory not installed or failed","PCI device enumeration","USB controller error"]}
];
let sc=0,ans=0;
function build(){
    const c=document.getElementById('codes');c.innerHTML='';
    CODES.forEach((cd,i)=>{
        const opts=[...cd.opts].sort(()=>Math.random()-.5);
        const d=document.createElement('div');d.className='code-card';d.id='c'+i;
        d.innerHTML=`<div class="cc-header"><span class="cc-num">Code ${i+1}</span><span class="cc-code">${cd.code}</span></div><div class="cc-scenario">${cd.scenario}</div><div class="opts">${opts.map(o=>`<button class="opt" onclick="check(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div><div class="cc-fb" id="fb${i}"></div>`;
        c.appendChild(d);
    });
}
function check(i,ch,btn){
    const d=document.getElementById('c'+i);if(d.classList.contains('done'))return;d.classList.add('done');ans++;
    const correct=CODES[i].answer;const fb=document.getElementById('fb'+i);
    d.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('right');});
    if(ch===correct){sc++;btn.classList.add('right');d.classList.add('ok');fb.className='cc-fb show fbok';fb.textContent='Correct!';}
    else{btn.classList.add('wrong');d.classList.add('no');fb.className='cc-fb show fbno';fb.textContent='Incorrect. The answer is: '+correct;}
    document.getElementById('score').textContent=sc;document.getElementById('pf').style.width=(ans/10*100)+'%';
    if(ans===10&&sc>=8)document.getElementById('complete-btn').style.display='block';
}
function resetLab(){sc=0;ans=0;document.getElementById('score').textContent='0';document.getElementById('pf').style.width='0%';document.getElementById('complete-btn').style.display='none';build();}
function completeModule(){if(typeof ModuleProgress!=='undefined')ModuleProgress.complete('forge','bm-w4-troubleshoot-lab',{returnUrl:'../index.html'});}
build();
</script>

</body>
</html>
