<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script><script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script><script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder Lab | Bare Metal | The Forge</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh}.lab-container{max-width:950px;margin:0 auto;padding:1.5rem}.lab-header{text-align:center;margin-bottom:1.5rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(245,158,11,0.05));border-radius:16px;border:1px solid rgba(251,191,36,0.3)}.lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.lab-subtitle{color:#9ca3af;font-size:.9rem;margin-top:.3rem}.score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:.8rem;font-size:.85rem;color:#fbbf24}.score-num{font-weight:700;font-size:1.2rem}.scenario-card{background:rgba(30,30,40,.6);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}.scenario-card.completed{opacity:.7;pointer-events:none}.scenario-card.pass{border-color:#22c55e}.scenario-card.fail{border-color:#ef4444}.sc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.sc-title{font-size:1.1rem;font-weight:600;color:#fbbf24}.sc-badge{padding:.2rem .6rem;border-radius:12px;font-size:.72rem;font-weight:600}.sc-budget{background:rgba(34,197,94,.15);color:#22c55e}.sc-type{background:rgba(59,130,246,.15);color:#3b82f6;margin-left:.5rem}.sc-reqs{font-size:.85rem;color:#94a3b8;margin-bottom:1rem;line-height:1.5}.req-tag{display:inline-block;padding:.15rem .5rem;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:4px;font-size:.75rem;color:#fde68a;margin:.2rem}.comp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:1rem}@media(max-width:600px){.comp-grid{grid-template-columns:1fr}}.comp-sel{display:flex;justify-content:space-between;align-items:center;padding:.5rem .7rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:6px}.comp-lbl{font-size:.78rem;color:#94a3b8}.comp-dd{padding:.3rem .5rem;background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.2);border-radius:4px;color:#e2e8f0;font-size:.78rem;font-family:inherit;max-width:180px}.submit-row{display:flex;gap:1rem;align-items:center}.submit-btn{padding:.5rem 1.2rem;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:8px;color:#fbbf24;cursor:pointer;font-weight:600;font-size:.88rem;transition:all .2s}.submit-btn:hover{background:rgba(251,191,36,.2)}.sc-fb{margin-top:.8rem;padding:.6rem;border-radius:6px;font-size:.82rem;display:none}.sc-fb.show{display:block}.sc-fb.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#86efac}.sc-fb.no{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5}.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,.15)}.nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;border:1px solid rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.08)}#complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;cursor:pointer;margin:1rem auto}</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">PC Builder Lab -- Bare Metal</h1>
<div class="lab-container">
    <div class="lab-header">
        <div class="lab-title">PC Builder Challenge</div>
        <div class="lab-subtitle">Given requirements and a budget, select the right components. 4 build scenarios.</div>
        <div class="score-bar"><span>Builds: <span class="score-num" id="score">0</span> / 4</span></div>
    </div>
    <div id="scenarios"></div>
    <div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
    <nav class="nav-buttons"><a href="../index.html" class="nav-btn">Back to Bare Metal</a></nav>
</div>
<script>
const SCENARIOS=[
{title:"Gaming Rig",type:"Gaming",budget:"$1,500",reqs:["1440p 60fps+","16+ GB RAM","NVMe boot drive","Good PSU headroom"],
components:{cpu:{label:"CPU",opts:[{n:"i3-12100 ($120)",v:"i3"},{n:"i5-13600K ($280)",v:"i5"},{n:"i9-13900K ($520)",v:"i9"}],correct:"i5"},
gpu:{label:"GPU",opts:[{n:"Integrated ($0)",v:"igpu"},{n:"RTX 4060 ($300)",v:"4060"},{n:"RTX 4070 ($550)",v:"4070"}],correct:"4070"},
ram:{label:"RAM",opts:[{n:"8GB DDR4 ($25)",v:"8"},{n:"16GB DDR5 ($70)",v:"16"},{n:"32GB DDR5 ($130)",v:"32"}],correct:"16"},
storage:{label:"Storage",opts:[{n:"500GB HDD ($25)",v:"hdd"},{n:"1TB SATA SSD ($60)",v:"sata"},{n:"1TB NVMe Gen4 ($80)",v:"nvme"}],correct:"nvme"},
psu:{label:"PSU",opts:[{n:"450W Bronze ($40)",v:"450"},{n:"650W Gold ($75)",v:"650"},{n:"850W Gold ($100)",v:"850"}],correct:"650"}},
explain:"i5 balances price/performance. RTX 4070 handles 1440p. 16GB DDR5 is sufficient. NVMe for boot. 650W Gold covers the ~380W draw."},
{title:"Office Workstation",type:"Business",budget:"$600",reqs:["Word/Excel/Chrome","Quiet","No gaming","8+ GB RAM"],
components:{cpu:{label:"CPU",opts:[{n:"i3-12100 ($120)",v:"i3"},{n:"i5-13600K ($280)",v:"i5"},{n:"i9-13900K ($520)",v:"i9"}],correct:"i3"},
gpu:{label:"GPU",opts:[{n:"Integrated ($0)",v:"igpu"},{n:"RTX 4060 ($300)",v:"4060"},{n:"RTX 4070 ($550)",v:"4070"}],correct:"igpu"},
ram:{label:"RAM",opts:[{n:"8GB DDR4 ($25)",v:"8"},{n:"16GB DDR5 ($70)",v:"16"},{n:"64GB ECC ($400)",v:"64ecc"}],correct:"16"},
storage:{label:"Storage",opts:[{n:"500GB HDD ($25)",v:"hdd"},{n:"256GB NVMe ($35)",v:"nvme256"},{n:"1TB NVMe Gen4 ($80)",v:"nvme"}],correct:"nvme256"},
psu:{label:"PSU",opts:[{n:"450W Bronze ($40)",v:"450"},{n:"650W Gold ($75)",v:"650"},{n:"850W Gold ($100)",v:"850"}],correct:"450"}},
explain:"i3 with iGPU is plenty. 16GB for Chrome tabs. 256GB NVMe for OS. 450W is overkill for this low-power system."},
{title:"Home NAS Server",type:"NAS",budget:"$800",reqs:["4+ drive bays","Runs 24/7","ECC preferred","Low power"],
components:{cpu:{label:"CPU",opts:[{n:"Intel N100 ($80)",v:"n100"},{n:"i5-13600K ($280)",v:"i5"},{n:"Ryzen 9 7950X ($450)",v:"r9"}],correct:"n100"},
gpu:{label:"GPU",opts:[{n:"Integrated ($0)",v:"igpu"},{n:"RTX 4060 ($300)",v:"4060"}],correct:"igpu"},
ram:{label:"RAM",opts:[{n:"8GB DDR4 ($25)",v:"8"},{n:"16GB DDR4 ECC ($80)",v:"16ecc"},{n:"64GB DDR5 ($250)",v:"64"}],correct:"16ecc"},
storage:{label:"Storage",opts:[{n:"2x 4TB NAS HDD ($180)",v:"2x4"},{n:"4x 4TB NAS HDD ($360)",v:"4x4"},{n:"1TB NVMe ($80)",v:"nvme"}],correct:"4x4"},
psu:{label:"PSU",opts:[{n:"450W Bronze ($40)",v:"450"},{n:"550W Gold ($60)",v:"550g"},{n:"850W Gold ($100)",v:"850"}],correct:"550g"}},
explain:"Low-power CPU for 24/7. ECC RAM for ZFS. 4 NAS drives for RAID. No GPU needed. 550W Gold for efficiency."},
{title:"Video Editing Workstation",type:"Workstation",budget:"$3,000",reqs:["4K timeline editing","64+ GB RAM","Fast scratch disk","Color-accurate output"],
components:{cpu:{label:"CPU",opts:[{n:"i5-13600K ($280)",v:"i5"},{n:"i9-13900K ($520)",v:"i9"},{n:"Ryzen 9 7950X ($450)",v:"r9"}],correct:"r9"},
gpu:{label:"GPU",opts:[{n:"Integrated ($0)",v:"igpu"},{n:"RTX 4060 ($300)",v:"4060"},{n:"RTX 4070 Ti ($750)",v:"4070ti"}],correct:"4070ti"},
ram:{label:"RAM",opts:[{n:"32GB DDR5 ($130)",v:"32"},{n:"64GB DDR5 ($250)",v:"64"},{n:"128GB DDR5 ($500)",v:"128"}],correct:"64"},
storage:{label:"Storage",opts:[{n:"1TB NVMe ($80)",v:"1nvme"},{n:"2TB NVMe + 2TB NVMe ($260)",v:"2x2nvme"},{n:"500GB HDD ($25)",v:"hdd"}],correct:"2x2nvme"},
psu:{label:"PSU",opts:[{n:"650W Gold ($75)",v:"650"},{n:"850W Gold ($100)",v:"850"},{n:"1000W Gold ($140)",v:"1000"}],correct:"850"}},
explain:"Ryzen 9 for 16 cores. 64GB for 4K timelines. Dual NVMe (OS + scratch). RTX 4070 Ti for hardware encoding. 850W for headroom."}
];
let passed=0;
function build(){
    const c=document.getElementById('scenarios');c.innerHTML='';
    SCENARIOS.forEach((s,i)=>{
        const keys=Object.keys(s.components);
        const card=document.createElement('div');card.className='scenario-card';card.id='sc'+i;
        card.innerHTML=`<div class="sc-header"><div><span class="sc-title">${s.title}</span><span class="sc-badge sc-type">${s.type}</span></div><span class="sc-badge sc-budget">${s.budget}</span></div><div class="sc-reqs">${s.reqs.map(r=>`<span class="req-tag">${r}</span>`).join(' ')}</div><div class="comp-grid">${keys.map(k=>{const c=s.components[k];return`<div class="comp-sel"><span class="comp-lbl">${c.label}</span><select class="comp-dd" id="s${i}_${k}">${c.opts.map(o=>`<option value="${o.v}">${o.n}</option>`).join('')}</select></div>`;}).join('')}</div><div class="submit-row"><button class="submit-btn" onclick="checkBuild(${i})">Submit Build</button></div><div class="sc-fb" id="fb${i}"></div>`;
        c.appendChild(card);
    });
}
function checkBuild(i){
    const s=SCENARIOS[i];const card=document.getElementById('sc'+i);if(card.classList.contains('completed'))return;
    card.classList.add('completed');
    const keys=Object.keys(s.components);
    let correct=0;
    keys.forEach(k=>{const sel=document.getElementById('s'+i+'_'+k).value;if(sel===s.components[k].correct)correct++;});
    const fb=document.getElementById('fb'+i);
    if(correct>=4){passed++;card.classList.add('pass');fb.className='sc-fb show ok';fb.textContent='Build approved! '+correct+'/'+keys.length+' correct. '+s.explain;}
    else{card.classList.add('fail');fb.className='sc-fb show no';fb.textContent='Build needs work. '+correct+'/'+keys.length+' correct. '+s.explain;}
    document.getElementById('score').textContent=passed;
    if(passed>=3)document.getElementById('complete-btn').style.display='block';
}
function completeModule(){if(typeof ModuleProgress!=='undefined')ModuleProgress.complete('forge','bm-w3-custom-lab',{returnUrl:'../index.html'});}
build();
</script>
</body>
</html>
