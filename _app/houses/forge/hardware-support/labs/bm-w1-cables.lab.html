<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connector Identifier Lab | Bare Metal | The Forge</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh;line-height:1.6}
        .lab-container{max-width:900px;margin:0 auto;padding:1.5rem}
        .lab-header{text-align:center;margin-bottom:2rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1) 0%,rgba(245,158,11,0.05) 100%);border-radius:16px;border:1px solid rgba(251,191,36,0.3)}
        .lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
        .lab-subtitle{color:#9ca3af;font-size:.95rem}
        .score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:1rem;font-size:.9rem;color:#fbbf24}
        .score-bar .score-num{font-weight:700;font-size:1.3rem}
        .progress-track{width:200px;height:6px;background:rgba(251,191,36,0.15);border-radius:3px;overflow:hidden}
        .progress-fill{height:100%;width:0%;background:#fbbf24;transition:width .4s ease;border-radius:3px}
        .question-card{background:rgba(30,30,40,0.6);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem;transition:all .3s ease}
        .question-card.correct{border-color:#22c55e;background:rgba(34,197,94,0.08)}
        .question-card.incorrect{border-color:#ef4444;background:rgba(239,68,68,0.08)}
        .question-card.disabled{opacity:.7;pointer-events:none}
        .q-number{font-size:.75rem;color:#fbbf24;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem}
        .q-desc{font-size:1rem;color:#f1f5f9;margin-bottom:1rem;line-height:1.5}
        .options{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
        .option-btn{padding:.6rem 1rem;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);border-radius:8px;color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s ease;text-align:left}
        .option-btn:hover{border-color:rgba(251,191,36,0.5);background:rgba(251,191,36,0.12)}
        .option-btn.selected{border-color:#fbbf24;background:rgba(251,191,36,0.15);color:#fbbf24;font-weight:600}
        .option-btn.correct-answer{border-color:#22c55e;background:rgba(34,197,94,0.15);color:#22c55e}
        .option-btn.wrong-answer{border-color:#ef4444;background:rgba(239,68,68,0.1);color:#ef4444}
        .feedback{margin-top:.8rem;padding:.6rem;border-radius:6px;font-size:.85rem;display:none}
        .feedback.show{display:block}
        .feedback.correct-fb{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac}
        .feedback.incorrect-fb{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
        .nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,0.15)}
        .nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;font-weight:500;transition:all .2s ease;border:1px solid rgba(251,191,36,0.3);color:#fbbf24;background:rgba(251,191,36,0.08)}
        .nav-btn:hover{background:rgba(251,191,36,0.15);transform:translateY(-1px)}
        .reset-btn{padding:.5rem 1rem;border-radius:6px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);color:#ef4444;cursor:pointer;font-size:.82rem;transition:all .2s}
        .reset-btn:hover{background:rgba(239,68,68,0.15)}
        #complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;font-size:.9rem;cursor:pointer;margin:1rem auto;transition:all .2s}
        #complete-btn:hover{background:#4ade80;transform:translateY(-1px)}
        @media(max-width:600px){.options{grid-template-columns:1fr}}
    </style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Connector Identifier Lab -- Bare Metal</h1>
<div class="lab-container">
    <div class="lab-header">
        <div class="lab-title">Connector Identifier</div>
        <div class="lab-subtitle">Read the description, identify the connector type. 12 questions.</div>
        <div class="score-bar">
            <span>Score: <span class="score-num" id="score">0</span> / 12</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <button class="reset-btn" onclick="resetLab()">Reset</button>
        </div>
    </div>
    <div id="questions"></div>
    <div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
    <nav class="nav-buttons">
        <a href="../index.html" class="nav-btn">Back to Bare Metal</a>
    </nav>
</div>
<script>
const QUESTIONS = [
    {desc:"Flat rectangular connector, one orientation only. Blue insert indicates USB 3.0. Found on desktops, laptops, and hubs.", answer:"USB Type-A", opts:["USB Type-A","USB Type-C","Mini-B","HDMI"]},
    {desc:"Small, reversible 24-pin connector. Supports USB4, Thunderbolt 3/4, DisplayPort Alt Mode, and up to 240W power delivery.", answer:"USB Type-C", opts:["USB Type-A","USB Type-C","Micro-B","Lightning"]},
    {desc:"15-pin D-sub connector with two thumbscrews. Blue housing. Analog video only, no audio. Trapezoidal shape.", answer:"VGA (DE-15)", opts:["DVI-D","VGA (DE-15)","HDMI","DisplayPort"]},
    {desc:"Slim trapezoidal digital connector carrying both audio and video. Supports 4K@60Hz (v2.0) and 8K (v2.1). Sizes include Standard, Mini, and Micro.", answer:"HDMI", opts:["DisplayPort","VGA","HDMI","DVI-I"]},
    {desc:"Asymmetric connector with one angled corner and a locking clip. Digital audio + video. Supports daisy-chaining multiple monitors (MST).", answer:"DisplayPort", opts:["HDMI","DisplayPort","Thunderbolt 1","DVI-D"]},
    {desc:"8-position modular plastic clip connector for Ethernet. Wider than RJ-11. Used with Cat5e/Cat6/Cat6a twisted-pair cables.", answer:"RJ-45", opts:["RJ-11","RJ-45","BNC","SC (Fiber)"]},
    {desc:"7-pin L-shaped data connector for internal storage devices. Maximum speed of 6 Gbps (III). One device per cable.", answer:"SATA Data", opts:["Molex","SATA Data","eSATA","SATA Power"]},
    {desc:"15-pin L-shaped power connector from the PSU. Provides 3.3V, 5V, and 12V rails to internal drives.", answer:"SATA Power", opts:["SATA Data","Molex 4-pin","SATA Power","ATX 24-pin"]},
    {desc:"White connector with a flat pin plus cross-shaped pin pattern. Digital video interface that supports single-link (1920x1200) and dual-link (2560x1600). No audio.", answer:"DVI", opts:["VGA","HDMI","DVI","DisplayPort"]},
    {desc:"Uses the same USB-C physical connector but identified by a lightning bolt icon next to the port. 40 Gbps bandwidth. Supports external GPUs.", answer:"Thunderbolt 3/4", opts:["USB 3.2","Thunderbolt 3/4","USB4","FireWire"]},
    {desc:"Round connector with a single copper center conductor surrounded by insulation and braided shield. F-type connector. Used for cable internet (DOCSIS) and TV.", answer:"Coaxial (RG-6)", opts:["RJ-45","Coaxial (RG-6)","Fiber SC","DB-9"]},
    {desc:"Small form-factor fiber optic connector with a latch mechanism. Half the size of SC. Most common in modern fiber installations and data centers.", answer:"LC (Fiber)", opts:["SC (Fiber)","ST (Fiber)","LC (Fiber)","MT-RJ"]}
];
let score=0, answered=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuestions(){
    const container=document.getElementById('questions');
    container.innerHTML='';
    QUESTIONS.forEach((q,i)=>{
        const opts=shuffle([...q.opts]);
        const card=document.createElement('div');
        card.className='question-card';
        card.id='q'+i;
        card.innerHTML=`<div class="q-number">Question ${i+1} of 12</div><div class="q-desc">${q.desc}</div><div class="options">${opts.map(o=>`<button class="option-btn" onclick="checkAnswer(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div><div class="feedback" id="fb${i}"></div>`;
        container.appendChild(card);
    });
}
function checkAnswer(idx,chosen,btn){
    const card=document.getElementById('q'+idx);
    if(card.classList.contains('disabled'))return;
    card.classList.add('disabled');
    answered++;
    const correct=QUESTIONS[idx].answer;
    const fb=document.getElementById('fb'+idx);
    const buttons=card.querySelectorAll('.option-btn');
    buttons.forEach(b=>{if(b.textContent===correct)b.classList.add('correct-answer');});
    if(chosen===correct){
        score++;btn.classList.add('selected');card.classList.add('correct');
        fb.className='feedback show correct-fb';fb.textContent='Correct!';
    } else {
        btn.classList.add('wrong-answer');card.classList.add('incorrect');
        fb.className='feedback show incorrect-fb';fb.textContent='Incorrect. The answer is: '+correct;
    }
    document.getElementById('score').textContent=score;
    document.getElementById('progressFill').style.width=(answered/12*100)+'%';
    if(answered===12 && score>=10) document.getElementById('complete-btn').style.display='block';
}
function resetLab(){score=0;answered=0;document.getElementById('score').textContent='0';document.getElementById('progressFill').style.width='0%';document.getElementById('complete-btn').style.display='none';buildQuestions();}
function completeModule(){if(typeof ModuleProgress!=='undefined'){ModuleProgress.complete('forge','bm-w1-cables-lab',{returnUrl:'../index.html'});}}
buildQuestions();
</script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;

         activity ticks the mood-ring.

    <hex-ai-button mission-id="bm-w1-cables" house="forge"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
