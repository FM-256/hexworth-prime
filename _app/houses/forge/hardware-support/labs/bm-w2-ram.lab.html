<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script><script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script><script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAM Compatibility Lab | Bare Metal | The Forge</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1510 50%,#0d0d15 100%);color:#e0e0e0;min-height:100vh}.lab-container{max-width:900px;margin:0 auto;padding:1.5rem}.lab-header{text-align:center;margin-bottom:2rem;padding:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(245,158,11,0.05));border-radius:16px;border:1px solid rgba(251,191,36,0.3)}.lab-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.lab-subtitle{color:#9ca3af;font-size:.9rem;margin-top:.3rem}.score-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:.8rem;font-size:.85rem;color:#fbbf24}.score-num{font-weight:700;font-size:1.2rem}.progress-track{width:180px;height:5px;background:rgba(251,191,36,0.15);border-radius:3px;overflow:hidden}.progress-fill{height:100%;width:0%;background:#fbbf24;transition:width .4s ease}.scenario{background:rgba(30,30,40,.6);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem}.scenario.done{opacity:.6;pointer-events:none}.scenario.correct-s{border-color:#22c55e}.scenario.wrong-s{border-color:#ef4444}.s-number{font-size:.72rem;color:#fbbf24;text-transform:uppercase;letter-spacing:.1em}.s-title{font-size:1.1rem;font-weight:600;color:#f1f5f9;margin:.4rem 0}.s-specs{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}.spec-tag{padding:.25rem .6rem;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:4px;font-size:.78rem;color:#fde68a}.s-question{font-size:.9rem;color:#94a3b8;margin:.6rem 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.opt-btn{padding:.5rem .8rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:.82rem;cursor:pointer;transition:all .2s;text-align:left}.opt-btn:hover{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06)}.opt-btn.right{border-color:#22c55e;background:rgba(34,197,94,.1);color:#22c55e}.opt-btn.wrong{border-color:#ef4444;background:rgba(239,68,68,.08);color:#ef4444}.feedback{margin-top:.6rem;padding:.5rem;border-radius:6px;font-size:.82rem;display:none}.feedback.show{display:block}.feedback.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#86efac}.feedback.fb-no{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5}.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(251,191,36,.15)}.nav-btn{padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.88rem;border:1px solid rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.08)}.reset-btn{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;cursor:pointer;font-size:.78rem}#complete-btn{display:none;padding:.7rem 1.5rem;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:700;cursor:pointer;margin:1rem auto}@media(max-width:600px){.options{grid-template-columns:1fr}}</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">RAM Compatibility Lab -- Bare Metal</h1>
<div class="lab-container">
    <div class="lab-header">
        <div class="lab-title">RAM Compatibility Checker</div>
        <div class="lab-subtitle">Given system specs, select the compatible RAM module. 8 scenarios.</div>
        <div class="score-bar"><span>Score: <span class="score-num" id="score">0</span>/8</span><div class="progress-track"><div class="progress-fill" id="pf"></div></div><button class="reset-btn" onclick="reset()">Reset</button></div>
    </div>
    <div id="scenarios"></div>
    <div style="text-align:center"><button id="complete-btn" onclick="completeModule()">Mark Complete</button></div>
    <nav class="nav-buttons"><a href="../index.html" class="nav-btn">Back to Bare Metal</a></nav>
</div>
<script>
const DATA=[
{title:"New Gaming Desktop",specs:["DDR5 motherboard","LGA 1700 (13th Gen Intel)","4 DIMM slots","Max 128 GB","XMP 3.0 support"],q:"Which RAM is compatible?",answer:"DDR5-5600 32GB (2x16GB) DIMM",opts:["DDR4-3200 32GB (2x16GB) DIMM","DDR5-5600 32GB (2x16GB) DIMM","DDR5-4800 32GB SO-DIMM","DDR3-1866 32GB (4x8GB) DIMM"],explain:"DDR5 board needs DDR5 DIMMs. SO-DIMM is laptop form factor. DDR3/DDR4 won't physically fit."},
{title:"Laptop RAM Upgrade",specs:["DDR4 laptop","2 SO-DIMM slots","Current: 1x8GB DDR4-2666","Max 32 GB"],q:"Best upgrade for dual channel?",answer:"1x 8GB DDR4-2666 SO-DIMM (match existing)",opts:["1x 8GB DDR4-2666 SO-DIMM (match existing)","2x 16GB DDR4-3200 DIMM","1x 16GB DDR5-4800 SO-DIMM","1x 8GB DDR3-1600 SO-DIMM"],explain:"Match the existing stick for dual channel. Full-size DIMMs don't fit laptops. DDR3/DDR5 incompatible."},
{title:"File Server Build",specs:["ECC required","DDR4 platform","Xeon E-2300 CPU","4 DIMM slots","Max 128 GB"],q:"Which module is appropriate?",answer:"DDR4-3200 ECC Unbuffered 32GB DIMM",opts:["DDR4-3200 Non-ECC 32GB DIMM","DDR4-3200 ECC Unbuffered 32GB DIMM","DDR5-4800 ECC RDIMM 32GB","DDR4-2666 SO-DIMM 16GB"],explain:"Server requires ECC. Xeon E-series uses unbuffered ECC (not registered). DDR5 won't fit DDR4 board."},
{title:"Budget Office PC",specs:["DDR4 motherboard","2 DIMM slots","Intel i3-12100","Max 64 GB","No XMP needed"],q:"Most cost-effective 16GB config?",answer:"2x 8GB DDR4-3200 DIMM (dual channel)",opts:["1x 16GB DDR4-3200 DIMM (single channel)","2x 8GB DDR4-3200 DIMM (dual channel)","4x 4GB DDR4-2400 DIMM","2x 8GB DDR5-4800 DIMM"],explain:"2 sticks in dual channel doubles bandwidth. Board only has 2 slots so 4x4 impossible. DDR5 incompatible."},
{title:"Workstation Upgrade",specs:["DDR4 board","AM4 socket (Ryzen 9 5950X)","4 DIMM slots","Current: 2x16GB in A2+B2","Max 128 GB"],q:"How to add more RAM?",answer:"Add 2x 16GB DDR4 matching speed to A1+B1",opts:["Replace all with 4x 32GB DDR5","Add 2x 16GB DDR4 matching speed to A1+B1","Add 1x 32GB DDR4 to A1 only","Add 2x 16GB DDR3 to A1+B1"],explain:"Fill remaining slots with matching DDR4. Same speed/timings ideal. AM4 is DDR4 only."},
{title:"Mini-ITX NAS Build",specs:["DDR4 Mini-ITX board","2 SO-DIMM slots","Intel N100 CPU","Max 16 GB","ECC not supported"],q:"Which RAM works?",answer:"2x 8GB DDR4-3200 SO-DIMM",opts:["2x 8GB DDR4-3200 DIMM","2x 8GB DDR4-3200 SO-DIMM","2x 8GB DDR4-3200 ECC DIMM","1x 16GB DDR5-4800 SO-DIMM"],explain:"Mini-ITX with SO-DIMM slots needs SO-DIMMs. No ECC support. DDR5 incompatible with DDR4 board."},
{title:"Threadripper Workstation",specs:["DDR4 quad-channel","TRX40 chipset","8 DIMM slots","Max 256 GB","ECC supported"],q:"Optimal 128GB configuration?",answer:"4x 32GB DDR4-3200 ECC UDIMM (quad channel)",opts:["2x 64GB DDR4-3200 (dual channel)","4x 32GB DDR4-3200 ECC UDIMM (quad channel)","8x 16GB DDR5-4800 DIMM","4x 32GB DDR3-1866 ECC RDIMM"],explain:"Quad-channel needs 4 sticks (or 8). ECC recommended for workstation. DDR4 platform, not DDR5 or DDR3."},
{title:"Laptop with DDR5",specs:["DDR5 laptop (2024)","2 SO-DIMM slots","Intel Core Ultra","Current: 1x 8GB DDR5-5600","Max 64 GB"],q:"Best upgrade path?",answer:"Replace with 2x 16GB DDR5-5600 SO-DIMM kit",opts:["Add 1x 8GB DDR4-3200 SO-DIMM","Replace with 2x 16GB DDR5-5600 SO-DIMM kit","Add 1x 8GB DDR5-4800 SO-DIMM","Replace with 2x 16GB DDR5-5600 DIMM"]}
];
let sc=0,ans=0;
function build(){
    const c=document.getElementById('scenarios');c.innerHTML='';
    DATA.forEach((d,i)=>{
        const s=document.createElement('div');s.className='scenario';s.id='s'+i;
        s.innerHTML=`<div class="s-number">Scenario ${i+1} of 8</div><div class="s-title">${d.title}</div><div class="s-specs">${d.specs.map(s=>`<span class="spec-tag">${s}</span>`).join('')}</div><div class="s-question">${d.q}</div><div class="options">${d.opts.map(o=>`<button class="opt-btn" onclick="check(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div><div class="feedback" id="fb${i}"></div>`;
        c.appendChild(s);
    });
}
function check(i,ch,btn){
    const s=document.getElementById('s'+i);if(s.classList.contains('done'))return;
    s.classList.add('done');ans++;
    const correct=DATA[i].answer;const fb=document.getElementById('fb'+i);
    s.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===correct)b.classList.add('right');});
    if(ch===correct){sc++;btn.classList.add('right');s.classList.add('correct-s');fb.className='feedback show fb-ok';fb.textContent='Correct! '+(DATA[i].explain||'');}
    else{btn.classList.add('wrong');s.classList.add('wrong-s');fb.className='feedback show fb-no';fb.textContent='Incorrect. Correct: '+correct+'. '+(DATA[i].explain||'');}
    document.getElementById('score').textContent=sc;document.getElementById('pf').style.width=(ans/8*100)+'%';
    if(ans===8&&sc>=6)document.getElementById('complete-btn').style.display='block';
}
function reset(){sc=0;ans=0;document.getElementById('score').textContent='0';document.getElementById('pf').style.width='0%';document.getElementById('complete-btn').style.display='none';build();}
function completeModule(){if(typeof ModuleProgress!=='undefined')ModuleProgress.complete('forge','bm-w2-ram-lab',{returnUrl:'../index.html'});}
build();
</script>

</body>
</html>
