<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Power Supplies | Bare Metal</title>
    <style>
        :root {
            --bg:         #0a0e1a;
            --bg-card:    #0f1625;
            --bg-option:  #141d2e;
            --primary:    #fbbf24;
            --primary-dim:rgba(251, 191, 36, 0.15);
            --accent:     #f59e0b;
            --text:       #e2e8f0;
            --text-muted: #8892a8;
            --success:    #22c55e;
            --danger:     #ef4444;
            --border:     rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #fcd34d; transform: translateX(-5px); display: inline-block; }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--primary-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--primary); font-weight: 600; white-space: nowrap; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(251, 191, 36, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--primary); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: var(--primary); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--primary); color: #1a1a2e; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(251, 191, 36, 0.15); color: var(--primary); }
        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: var(--primary); }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #1a1a2e; }
        .btn-hub { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4) !important; color: var(--accent); }
        .btn-hub:hover { background: var(--accent); color: #1a1a2e; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(34, 197, 94, 0.04); border-left: 2px solid var(--success); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--success); }

                @media (max-width: 640px) { .quiz-container { padding: 1rem; } .question-card { padding: 1.25rem; } .quiz-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Bare Metal Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz: Power Supplies</h1>
            <p class="subtitle">PSU wattage, 80 Plus ratings, connectors, voltage rails, UPS systems</p>
            <div class="meta"><span>Week 3</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS1150C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "What does the 80 Plus certification on a power supply unit guarantee?",
                opts: ["The PSU outputs at least 80 watts continuously", "The PSU supports at least 80 amps on the 12V rail", "The PSU has 80 or more built-in protection circuits", "The PSU operates at 80% or greater energy efficiency at 20%, 50%, and 100% load"],
                ans: 3,
                exp: "80 Plus certification means the PSU converts at least 80% of AC wall power into usable DC power, wasting less energy as heat. Higher tiers (Bronze, Silver, Gold, Platinum, Titanium) have higher efficiency."
            },
            {
                q: "Which PSU connector provides the primary power to the motherboard?",
                opts: ["4+4 pin EPS connector", "6+2 pin PCIe connector", "24-pin ATX connector", "15-pin SATA power connector"],
                ans: 2,
                exp: "The 24-pin ATX connector is the main motherboard power connector, supplying +3.3V, +5V, and +12V. The 4+4 pin EPS is for the CPU, 6+2 pin is for the GPU, and 15-pin SATA powers storage drives."
            },
            {
                q: "A gaming PC draws 450W under load. What is the recommended PSU wattage?",
                opts: ["450W (exact match)", "500W (10% headroom)", "550-650W (20-40% headroom for efficiency and future upgrades)", "1000W minimum for any gaming build"],
                ans: 2,
                exp: "A PSU is most efficient at 50-80% load. A 550-650W unit for a 450W system provides headroom for efficiency, component aging, transient power spikes, and future GPU upgrades."
            },
            {
                q: "What voltage does the yellow wire on an ATX PSU deliver?",
                opts: ["+3.3V", "+12V", "+5V", "-12V"],
                ans: 1,
                exp: "Yellow wires carry +12V, which powers the CPU, GPU, and fans. Red wires carry +5V (USB, some logic), orange wires carry +3.3V (RAM, chipset), and black wires are ground."
            },
            {
                q: "What is the difference between a modular and non-modular PSU?",
                opts: ["Modular PSUs are more efficient", "Non-modular PSUs cannot power GPUs", "A modular PSU has detachable cables so you only connect what you need, improving airflow and cable management", "Modular PSUs are always higher wattage"],
                ans: 2,
                exp: "Modular PSUs let you attach only the cables you need, reducing cable clutter and improving airflow. Non-modular PSUs have all cables permanently attached. Semi-modular units have fixed motherboard/CPU cables."
            },
            {
                q: "A UPS (Uninterruptible Power Supply) primarily protects against:",
                opts: ["Malware infections from the network", "Overclocking damage to the CPU", "Power outages, providing battery backup so systems can shut down gracefully", "Hard drive fragmentation"],
                ans: 2,
                exp: "A UPS contains a battery that provides temporary power during outages, giving servers and workstations time to save data and shut down cleanly. Many UPS units also filter voltage fluctuations and surges."
            },
            {
                q: "Which UPS topology provides the highest level of power protection with zero transfer time?",
                opts: ["Standby (offline) UPS", "Online (double-conversion) UPS", "Line-interactive UPS", "Surge protector strip"],
                ans: 1,
                exp: "An online (double-conversion) UPS continuously converts AC to DC to AC, isolating equipment from all power anomalies with zero transfer time. Standby UPS has a 5-12ms switchover delay."
            },
            {
                q: "The 4+4 pin EPS connector on a PSU provides power to which component?",
                opts: ["Graphics card", "CPU (via the motherboard's CPU power header)", "Case fans", "Front panel USB ports"],
                ans: 1,
                exp: "The 4+4 pin EPS (or 8-pin EPS12V) connector plugs into the CPU power header on the motherboard, delivering dedicated +12V power to the processor's voltage regulator module (VRM)."
            },
            {
                q: "A power supply's +12V rail is rated at 40A. What is the maximum wattage available on that rail?",
                opts: ["120W", "480W", "240W", "960W"],
                ans: 1,
                exp: "Power (watts) = Voltage x Amperage. 12V x 40A = 480W. The +12V rail powers the most demanding components (CPU, GPU), so its amperage rating is a critical spec."
            },
            {
                q: "What is the purpose of a surge protector?",
                opts: ["To clamp voltage spikes and divert excess energy to ground, protecting connected equipment", "To increase the available amperage from a wall outlet", "To provide backup power during an outage", "To convert DC power to AC power"],
                ans: 0,
                exp: "A surge protector uses metal oxide varistors (MOVs) to clamp voltage spikes (from lightning, grid switching, etc.) and shunt excess energy to ground before it reaches connected devices."
            },
            {
                q: "What happens if a system draws more power than the PSU can supply?",
                opts: ["The PSU may shut down via over-power protection (OPP), or the system experiences crashes, reboots, or component damage", "The system automatically underclocks all components", "Nothing -- the system throttles seamlessly", "The excess power is stored in the CMOS battery"],
                ans: 0,
                exp: "An overloaded PSU triggers safety protections (OPP/OCP) and shuts down, or if protections fail, it delivers unstable voltages causing crashes, data corruption, or permanent hardware damage."
            },
            {
                q: "Which connector is used to power a modern PCIe graphics card?",
                opts: ["6-pin or 6+2 pin (8-pin) PCIe power connector", "15-pin SATA power", "4-pin Molex", "24-pin ATX"],
                ans: 0,
                exp: "Modern GPUs use 6-pin (75W) or 8-pin/6+2-pin (150W) PCIe power connectors. High-end cards may require two or three connectors. The new PCIe 5.0 12VHPWR connector supplies up to 600W."
            },
            {
                q: "A technician smells a burning odor from inside a PC case. What should be done FIRST?",
                opts: ["Power off the system immediately and unplug it from the wall", "Open the case and visually inspect while running", "Run a hardware diagnostic from the BIOS", "Replace the thermal paste on the CPU"],
                ans: 0,
                exp: "A burning smell indicates a component failure (often the PSU or a capacitor). The immediate action is to power off and unplug to prevent fire or further damage. Then inspect with the power disconnected."
            },
            {
                q: "What does VA (volt-ampere) rating on a UPS indicate?",
                opts: ["The maximum voltage the UPS can output", "The charging speed of the internal battery", "The number of outlets on the UPS", "The apparent power capacity -- the maximum load the UPS battery can support"],
                ans: 3,
                exp: "VA is the apparent power rating of a UPS. A 1500VA UPS can support loads up to roughly 1500VA (or about 900W for typical computer loads with a 0.6 power factor). Always check both VA and watt ratings."
            },
            {
                q: "Which safety certification should you look for on a PSU sold in North America?",
                opts: ["CE marking only", "FCC Part 15 Class A", "IP67 waterproof rating", "UL (Underwriters Laboratories) listing"],
                ans: 3,
                exp: "UL listing means the PSU has been tested for electrical safety by Underwriters Laboratories. CE is for Europe. FCC certifies electromagnetic emissions. IP67 is an ingress protection rating for enclosures."
            }
        ];

        var current = 0, score = 0, answered = false, TOTAL = questions.length, userAnswers = [];
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;
            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) { html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>'; }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }
        function selectAnswer(idx) {
            if (answered) return; answered = true; userAnswers[current] = idx;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); if (i === q.ans) opts[i].classList.add('correct'); else if (i === idx) opts[i].classList.add('incorrect'); }
            var fb = document.getElementById('feedback');
            if (idx === q.ans) { score++; fb.className = 'feedback correct'; fb.textContent = 'Correct! ' + q.exp; }
            else { fb.className = 'feedback incorrect'; fb.textContent = 'Incorrect. ' + q.exp; }
            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;
            if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
        }
        function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var rc = document.getElementById('resultsCard'); rc.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100), sb = document.getElementById('finalScore');
            sb.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) sb.className = 'score-big'; else if (pct >= 70) sb.className = 'score-big mid'; else sb.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong understanding of power supply and UPS concepts.';
            else if (pct >= 70) msg = 'Good work -- you passed. Review any missed questions before moving on.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the Week 3 Power slides and try again.';
            else msg = 'Keep at it. Return to the Week 3 materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') { (function(){ try { ModuleProgress.completeQuiz('forge', 'bm-w3-power-quiz', pct, { returnToDashboard: false }); } catch (e) { console.warn('[bm-w3-power-quiz] ModuleProgress.completeQuiz failed:', e); } })(); }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                if (q.exp) html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }

        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }
        loadQuestion();
    </script>
</body>
</html>
