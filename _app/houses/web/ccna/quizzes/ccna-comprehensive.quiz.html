    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CCNA 200-301 Comprehensive Practice Exam',
            description: 'Full 50-question practice exam covering all 6 domains, weighted by exam percentage. Pass mark: 70%',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            moduleId: 'ccna-comprehensive-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,
            timeLimit: 5400, // 90 minutes

            questions: [
                // ══════════════════════════════════════════════
                // DOMAIN 1: Network Fundamentals (20%) — 10 questions
                // ══════════════════════════════════════════════
                {
                    question: "A company needs to connect 450 hosts across a single subnet. Which is the smallest subnet mask that accommodates this requirement?",
                    options: [
                        "/23 (255.255.254.0) — provides 510 usable hosts",
                        "/24 (255.255.255.0) — provides 254 usable hosts",
                        "/22 (255.255.252.0) — provides 1022 usable hosts",
                        "/25 (255.255.255.128) — provides 126 usable hosts"
                    ],
                    explanation: "/24 gives only 254 hosts — not enough. /23 gives 2^9 - 2 = 510 usable hosts, which is the smallest prefix that fits 450 hosts. /22 works but wastes addresses. Always choose the smallest subnet that fits the requirement to conserve address space."
                },
                {
                    question: "At which OSI layer does a switch make forwarding decisions based on MAC addresses?",
                    options: [
                        "Layer 2 — Data Link",
                        "Layer 1 — Physical",
                        "Layer 3 — Network",
                        "Layer 4 — Transport"
                    ],
                    explanation: "Switches operate at Layer 2 (Data Link), using MAC addresses to make forwarding decisions. They build a MAC address table by examining source MACs. Routers operate at Layer 3 using IP addresses. Hubs operate at Layer 1 (Physical), simply repeating signals."
                },
                {
                    question: "What distinguishes a WAN from a LAN in terms of geographic scope and typical ownership?",
                    options: [
                        "A WAN spans large geographic areas (cities/countries) and typically uses service provider links; a LAN is contained within a single building or campus and is privately owned",
                        "A WAN is always faster than a LAN because it uses fiber optics exclusively",
                        "A LAN uses public IP addressing while a WAN uses private addressing",
                        "A WAN connects devices within a single VLAN; a LAN connects multiple VLANs"
                    ],
                    explanation: "LANs cover a small geographic area (office, building, campus) and are owned by the organization. WANs connect geographically distant sites and often rely on service provider infrastructure (MPLS, Metro Ethernet, internet). Speed is not the differentiator — LANs are typically faster than WANs."
                },
                {
                    question: "Which protocol operates at the Transport layer and provides connectionless, best-effort delivery used for real-time applications like VoIP?",
                    options: [
                        "UDP (User Datagram Protocol)",
                        "TCP (Transmission Control Protocol)",
                        "ICMP (Internet Control Message Protocol)",
                        "HTTP (Hypertext Transfer Protocol)"
                    ],
                    explanation: "UDP is a Layer 4 connectionless protocol that sends datagrams without establishing a session or guaranteeing delivery. It has lower overhead than TCP, making it ideal for latency-sensitive applications like VoIP, video streaming, and DNS queries. TCP provides reliable, ordered delivery with higher overhead."
                },
                {
                    question: "Given the IPv4 address 192.168.10.65/28, what is the broadcast address of this subnet?",
                    options: [
                        "192.168.10.79",
                        "192.168.10.80",
                        "192.168.10.63",
                        "192.168.10.95"
                    ],
                    explanation: "/28 means block size of 16 in the fourth octet. 65 falls in the block starting at 64 (64-79). Network = 192.168.10.64, broadcast = 192.168.10.79 (last address in the block). Usable range: .65-.78 (14 hosts). The next block starts at .80."
                },
                {
                    question: "Which IPv6 address type is automatically configured on every IPv6-enabled interface and used for communication within a single link/segment?",
                    options: [
                        "Link-local (fe80::/10)",
                        "Global unicast (2000::/3)",
                        "Unique local (fc00::/7)",
                        "Solicited-node multicast (ff02::1:ff00:0/104)"
                    ],
                    explanation: "Link-local addresses (fe80::/10) are automatically generated on every IPv6-enabled interface using EUI-64 or random interface IDs. They are used for neighbor discovery, router advertisements, and communication on the local link only — they are not routable beyond the local segment."
                },
                {
                    question: "A network engineer enters 'Router(config)#' at the CLI prompt. Which Cisco IOS mode is this, and what types of commands can be executed?",
                    options: [
                        "Global configuration mode — commands that affect the entire device (hostname, routing protocols, ACLs, banners)",
                        "Privileged EXEC mode — show and debug commands only",
                        "Interface configuration mode — commands that affect a single interface",
                        "User EXEC mode — basic monitoring commands only"
                    ],
                    explanation: "The (config)# prompt indicates global configuration mode. This is where device-wide settings are configured: hostname, enable secret, routing protocols, access lists, NAT, banners, etc. Interface-specific commands require entering interface config mode (config-if)# from here."
                },
                {
                    question: "Which Cisco IOS command saves the running configuration to NVRAM so it persists across reboots?",
                    options: [
                        "copy running-config startup-config",
                        "write erase",
                        "reload",
                        "show startup-config"
                    ],
                    explanation: "'copy running-config startup-config' (or the shorthand 'write memory') saves the current in-memory configuration to NVRAM. Without this, all changes are lost on reboot. 'write erase' deletes the startup config. 'reload' restarts the device. 'show startup-config' displays the saved config."
                },
                {
                    question: "How does a full-duplex Ethernet connection differ from half-duplex?",
                    options: [
                        "Full-duplex allows simultaneous sending and receiving on the same link; half-duplex allows only one direction at a time",
                        "Full-duplex uses two separate cables; half-duplex uses one cable",
                        "Full-duplex is limited to 10 Mbps; half-duplex supports up to 1 Gbps",
                        "Full-duplex requires a hub; half-duplex requires a switch"
                    ],
                    explanation: "Full-duplex uses separate transmit and receive wire pairs simultaneously, effectively doubling throughput and eliminating collisions. Half-duplex shares the medium — devices must wait for the line to be clear (CSMA/CD). Modern switch-connected devices use full-duplex. Hubs force half-duplex."
                },
                {
                    question: "What is the primary purpose of ARP (Address Resolution Protocol) in an IPv4 network?",
                    options: [
                        "Resolves a known IP address to an unknown MAC address on the local network segment",
                        "Assigns IP addresses to devices dynamically",
                        "Routes packets between different subnets",
                        "Encrypts traffic between two hosts"
                    ],
                    explanation: "When a device needs to send a frame to a destination IP on the same subnet, it must know the destination's MAC address. ARP broadcasts an ARP Request ('Who has 10.1.1.5?'), and the device with that IP responds with its MAC in an ARP Reply. The sender caches this in its ARP table for future use."
                },

                // ══════════════════════════════════════════════
                // DOMAIN 2: Network Access (20%) — 10 questions
                // ══════════════════════════════════════════════
                {
                    question: "A Cisco switch has ports Fa0/1 through Fa0/24. Ports 1-12 are assigned to VLAN 10, ports 13-20 to VLAN 20, and ports 21-24 are trunk ports. A host on Fa0/5 sends a broadcast. Which ports receive it?",
                    options: [
                        "Only ports Fa0/1 through Fa0/12 (all VLAN 10 access ports) and the trunk ports carrying VLAN 10",
                        "All 24 ports on the switch",
                        "Only Fa0/5 — broadcasts are never forwarded",
                        "Ports Fa0/1-Fa0/12 and Fa0/13-Fa0/20 but not the trunks"
                    ],
                    explanation: "Broadcasts are confined to the originating VLAN. Fa0/5 is in VLAN 10, so the broadcast reaches all other VLAN 10 access ports (Fa0/1-Fa0/12 minus the source) and any trunk ports that carry VLAN 10. VLAN 20 ports never see this broadcast — VLANs are separate broadcast domains."
                },
                {
                    question: "What is the purpose of the 'switchport nonegotiate' command on a Cisco switch trunk port?",
                    options: [
                        "Disables DTP (Dynamic Trunking Protocol) frames on the interface, preventing trunk negotiation attacks",
                        "Forces the port into access mode regardless of neighbor configuration",
                        "Enables the port to negotiate EtherChannel parameters",
                        "Prevents the port from forwarding BPDU frames"
                    ],
                    explanation: "'switchport nonegotiate' disables DTP frames on a manually configured trunk port. This prevents a potential attacker from using DTP to negotiate a trunk with the switch (VLAN hopping attack). Best practice: manually configure ports as trunk or access and disable DTP with nonegotiate on trunks."
                },
                {
                    question: "In router-on-a-stick inter-VLAN routing, which command assigns 802.1Q VLAN tagging to a subinterface?",
                    options: [
                        "encapsulation dot1Q [vlan-id]",
                        "switchport access vlan [vlan-id]",
                        "vlan [vlan-id]",
                        "ip routing vlan [vlan-id]"
                    ],
                    explanation: "On a router subinterface (e.g., G0/0.10), the command 'encapsulation dot1Q 10' tells the router to tag/untag frames for VLAN 10 on this subinterface. Each subinterface also needs an IP address for that VLAN's subnet. The physical interface must be 'no shutdown' with no IP address."
                },
                {
                    question: "What is the STP root bridge, and how is it elected?",
                    options: [
                        "The switch with the lowest bridge ID (priority + MAC address) becomes the root bridge, which is the reference point for all path calculations",
                        "The first switch powered on becomes the root bridge permanently",
                        "The switch with the most ports becomes the root bridge",
                        "The root bridge is manually assigned by the network administrator and cannot be elected"
                    ],
                    explanation: "The root bridge is the central reference point in an STP topology. It is elected based on the lowest Bridge ID, which is a combination of priority (default 32768, configurable in increments of 4096) and base MAC address. Lower priority wins; if tied, lower MAC wins. Use 'spanning-tree vlan [id] root primary' to influence the election."
                },
                {
                    question: "Which EtherChannel load-balancing method uses both source and destination IP addresses to distribute traffic across member links?",
                    options: [
                        "src-dst-ip",
                        "src-mac",
                        "dst-ip",
                        "src-port"
                    ],
                    explanation: "EtherChannel load-balancing methods include: src-mac, dst-mac, src-dst-mac, src-ip, dst-ip, src-dst-ip, src-port, dst-port, src-dst-port. 'src-dst-ip' hashes both source and destination IP addresses to determine which member link carries each flow, providing the best distribution for routed traffic."
                },
                {
                    question: "A switch port in RSTP is in the 'Discarding' state. What does this mean?",
                    options: [
                        "The port is not forwarding user data frames and is not learning MAC addresses — equivalent to STP Blocking and Listening combined",
                        "The port is actively forwarding traffic but discarding BPDUs",
                        "The port has been administratively shut down",
                        "The port is learning MAC addresses but not forwarding traffic"
                    ],
                    explanation: "RSTP simplifies STP's five states into three: Discarding, Learning, and Forwarding. The Discarding state combines STP's Blocking and Listening states — the port processes BPDUs but does not forward user traffic or learn MAC addresses. This simplification helps RSTP converge faster."
                },
                {
                    question: "What is the maximum number of active links in a Cisco EtherChannel bundle?",
                    options: [
                        "8 active links (with LACP supporting 8 active + 8 standby)",
                        "4 active links maximum",
                        "16 active links",
                        "2 active links"
                    ],
                    explanation: "A Cisco EtherChannel supports up to 8 active physical links. LACP can configure up to 16 links total (8 active + 8 hot standby). The standby links automatically activate if an active link fails. PAgP supports a maximum of 8 links with no standby capability."
                },
                {
                    question: "Which wireless frequency band is exclusively used by 802.11a and offers more non-overlapping channels than 2.4 GHz?",
                    options: [
                        "5 GHz",
                        "2.4 GHz",
                        "6 GHz",
                        "60 GHz"
                    ],
                    explanation: "802.11a operates exclusively in the 5 GHz band. The 5 GHz band offers 24+ non-overlapping channels (compared to only 3 in 2.4 GHz), less interference from consumer devices, but shorter range due to higher frequency attenuation. 802.11b/g use 2.4 GHz. 6 GHz is Wi-Fi 6E. 60 GHz is 802.11ad."
                },
                {
                    question: "In a Cisco wireless deployment, what protocol does a lightweight access point (LAP) use to communicate with the Wireless LAN Controller?",
                    options: [
                        "CAPWAP (Control and Provisioning of Wireless Access Points)",
                        "SNMP (Simple Network Management Protocol)",
                        "RADIUS (Remote Authentication Dial-In User Service)",
                        "CDP (Cisco Discovery Protocol)"
                    ],
                    explanation: "CAPWAP is the protocol between lightweight APs and WLCs. It creates two tunnels: a control tunnel (management, configuration, firmware) and a data tunnel (client traffic). CAPWAP uses UDP ports 5246 (control) and 5247 (data). It replaced Cisco's proprietary LWAPP protocol."
                },
                {
                    question: "What is the default native VLAN on a Cisco switch trunk port, and why is it a security concern?",
                    options: [
                        "VLAN 1 — it is a security concern because untagged frames default to VLAN 1, enabling VLAN hopping attacks if not changed",
                        "VLAN 0 — it is a concern because VLAN 0 cannot be secured",
                        "VLAN 4095 — it is a concern because it is reserved and cannot carry user traffic",
                        "There is no default native VLAN; it must be configured manually"
                    ],
                    explanation: "VLAN 1 is the default native VLAN on all Cisco switches. Native VLAN frames are sent untagged across trunks. An attacker on VLAN 1 can double-tag frames to reach other VLANs (VLAN hopping). Best practice: change the native VLAN to an unused VLAN and tag all traffic with 'vlan dot1q tag native'."
                },

                // ══════════════════════════════════════════════
                // DOMAIN 3: IP Connectivity (25%) — 13 questions
                // ══════════════════════════════════════════════
                {
                    question: "A packet arrives at a router for destination 10.1.2.50. The routing table has these entries: 10.1.0.0/16, 10.1.2.0/24, and 10.1.2.48/28. Which route is selected?",
                    options: [
                        "10.1.2.48/28 — the longest prefix match (most specific route) always wins",
                        "10.1.0.0/16 — the broadest route covers all possibilities",
                        "10.1.2.0/24 — it provides the best balance of specificity and coverage",
                        "All three routes are used equally for load balancing"
                    ],
                    explanation: "Routers use the longest prefix match algorithm. 10.1.2.50 matches all three routes, but /28 (10.1.2.48-63) is the most specific match. The router always selects the route with the longest matching prefix (most bits matched). This is the fundamental routing decision algorithm in IP networking."
                },
                {
                    question: "What is the administrative distance of a directly connected network on a Cisco router?",
                    options: [
                        "0",
                        "1",
                        "5",
                        "20"
                    ],
                    explanation: "Connected networks have AD = 0, the most trusted source. AD hierarchy: Connected = 0, Static = 1, EIGRP summary = 5, eBGP = 20, EIGRP internal = 90, OSPF = 110, IS-IS = 115, RIP = 120, EIGRP external = 170, iBGP = 200. A directly connected network is the most trustworthy because the router can physically verify the link."
                },
                {
                    question: "Which command configures a default static route pointing to the next-hop 203.0.113.1?",
                    options: [
                        "ip route 0.0.0.0 0.0.0.0 203.0.113.1",
                        "ip default-gateway 203.0.113.1",
                        "ip route default 203.0.113.1",
                        "ip route 255.255.255.255 0.0.0.0 203.0.113.1"
                    ],
                    explanation: "The default route uses network 0.0.0.0 with mask 0.0.0.0, matching any destination. 'ip default-gateway' is used only on Layer 2 switches (when ip routing is disabled). There is no 'ip route default' syntax. The default route appears as 'S* 0.0.0.0/0' in the routing table with a star indicating 'candidate default'."
                },
                {
                    question: "OSPF routers exchange hello packets to establish and maintain neighbor relationships. What is the default hello interval on a broadcast multi-access network?",
                    options: [
                        "10 seconds",
                        "30 seconds",
                        "5 seconds",
                        "60 seconds"
                    ],
                    explanation: "OSPF default timers on broadcast and point-to-point links: Hello = 10 seconds, Dead = 40 seconds (4x hello). On NBMA links: Hello = 30 seconds, Dead = 120 seconds. If hello/dead intervals do not match between neighbors, the adjacency will NOT form. This is a common OSPF troubleshooting issue."
                },
                {
                    question: "A router has OSPF running with the default reference bandwidth of 100 Mbps. What OSPF cost is assigned to a 10 Gbps interface?",
                    options: [
                        "1 — because OSPF cost cannot be less than 1, making it equal to a 100 Mbps link",
                        "10 — calculated as 100 / 10 Gbps",
                        "100 — calculated as reference / interface speed",
                        "0.01 — calculated as 100 / 10000"
                    ],
                    explanation: "OSPF cost = reference bandwidth / interface bandwidth. 100 Mbps / 10000 Mbps = 0.01, but OSPF rounds up to the minimum value of 1. This means 100 Mbps, 1 Gbps, and 10 Gbps links all have cost 1 with the default reference. This is why you should set 'auto-cost reference-bandwidth 100000' (100 Gbps) to differentiate modern link speeds."
                },
                {
                    question: "In multi-area OSPF, which LSA type carries inter-area route summaries generated by ABRs?",
                    options: [
                        "Type 3 — Summary LSA",
                        "Type 1 — Router LSA",
                        "Type 2 — Network LSA",
                        "Type 5 — AS External LSA"
                    ],
                    explanation: "Type 3 Summary LSAs are generated by ABRs to advertise routes from one area to another. Type 1 (Router LSA) describes a router's directly connected links within an area. Type 2 (Network LSA) is created by the DR to represent multi-access segments. Type 5 (External LSA) carries routes redistributed from outside OSPF."
                },
                {
                    question: "An OSPF router shows a neighbor in the 'EXSTART' state. What does this indicate?",
                    options: [
                        "The routers are negotiating master/slave roles and initial sequence numbers before exchanging database descriptions",
                        "The neighbor relationship has failed and is restarting",
                        "The routers have fully synchronized their LSDBs",
                        "OSPF hello packets are being sent but no response has been received"
                    ],
                    explanation: "OSPF neighbor states: Down -> Init -> 2-Way -> ExStart -> Exchange -> Loading -> Full. ExStart is where routers negotiate who is master (higher router ID) and agree on the initial DBD sequence number. If stuck in ExStart, it often indicates an MTU mismatch between the two interfaces."
                },
                {
                    question: "What does the 'O IA' prefix indicate in a Cisco routing table entry?",
                    options: [
                        "An OSPF inter-area route — learned from a different OSPF area via an ABR",
                        "An OSPF internal area route — learned within the same area",
                        "An OSPF immediate adjacency — directly connected OSPF neighbor",
                        "An OSPF invalid advertisement — a route that failed validation"
                    ],
                    explanation: "'O IA' means OSPF Inter-Area route. 'O' alone means intra-area (within the same area). 'O E1' and 'O E2' are OSPF external routes (Type 1 and Type 2). 'O N1' and 'O N2' are NSSA external routes. Inter-area routes are carried by Type 3 Summary LSAs generated by ABRs."
                },
                {
                    question: "HSRP uses a virtual MAC address for the active router. What is the format of the HSRP virtual MAC on a Cisco device?",
                    options: [
                        "0000.0c07.acXX, where XX is the HSRP group number in hexadecimal",
                        "The physical MAC address of whichever router is currently active",
                        "A randomly generated MAC address that changes on each failover",
                        "ffff.ffff.ffff — the broadcast MAC address"
                    ],
                    explanation: "HSRP uses a well-known virtual MAC address: 0000.0c07.acXX, where XX is the HSRP group number in hex (e.g., group 1 = 0000.0c07.ac01). This virtual MAC remains constant regardless of which physical router is active, so hosts never need to update their ARP caches during failover."
                },
                {
                    question: "A network requires that if the primary router fails, the backup router assumes the gateway role within 3 seconds. Which HSRP timers should be configured?",
                    options: [
                        "Hello timer 1 second, hold timer 3 seconds",
                        "Hello timer 10 seconds, hold timer 30 seconds",
                        "Hello timer 3 seconds, hold timer 3 seconds",
                        "Hello timer 5 seconds, hold timer 15 seconds"
                    ],
                    explanation: "The HSRP standby router declares the active router failed after the hold timer expires (default 10 seconds). For 3-second failover: set hello = 1 second and hold = 3 seconds (hold should be at least 3x hello). The command is 'standby [group] timers 1 3'. HSRP millisecond timers are also available for sub-second failover."
                },
                {
                    question: "What is the purpose of an OSPF virtual link?",
                    options: [
                        "Connects a non-backbone area to Area 0 through a transit area when a direct physical connection is not possible",
                        "Creates an encrypted tunnel between two OSPF routers for secure LSA exchange",
                        "Replaces physical links with software-defined paths for traffic engineering",
                        "Connects two OSPF autonomous systems without redistributing routes"
                    ],
                    explanation: "OSPF requires all areas to connect to Area 0 (backbone). When an area cannot physically connect to Area 0, a virtual link is configured through a transit area. It is a temporary workaround — the best practice is to redesign the topology so all areas have a direct ABR connection to Area 0."
                },
                {
                    question: "Which routing protocol is considered a hybrid protocol, combining features of both distance-vector and link-state protocols?",
                    options: [
                        "EIGRP (Enhanced Interior Gateway Routing Protocol)",
                        "OSPF (Open Shortest Path First)",
                        "RIP (Routing Information Protocol)",
                        "BGP (Border Gateway Protocol)"
                    ],
                    explanation: "EIGRP is Cisco's advanced distance-vector protocol (sometimes called hybrid). It uses DUAL algorithm like distance-vector but maintains a topology table with neighbor relationships like link-state. It sends partial updates (not periodic full updates like RIP) and supports unequal-cost load balancing. OSPF is purely link-state. RIP is purely distance-vector."
                },
                {
                    question: "A router receives a packet destined for 10.0.0.50 but has no matching route in its routing table and no default route. What happens?",
                    options: [
                        "The router drops the packet and sends an ICMP Destination Unreachable message to the source",
                        "The router broadcasts the packet out all interfaces",
                        "The router holds the packet in a buffer indefinitely until a route is learned",
                        "The router forwards the packet to the nearest OSPF neighbor"
                    ],
                    explanation: "When a router has no matching route (including no default route), it drops the packet and generates an ICMP Type 3 (Destination Unreachable) message back to the source. The router does not flood, buffer, or guess — it follows the routing table strictly. This is why default routes are important on stub networks."
                },

                // ══════════════════════════════════════════════
                // DOMAIN 4: IP Services (10%) — 5 questions
                // ══════════════════════════════════════════════
                {
                    question: "A company has 200 internal hosts that need internet access through a single public IP address. Which NAT type is most appropriate?",
                    options: [
                        "PAT (NAT overload) — maps many private IPs to one public IP using port numbers",
                        "Static NAT — each host gets a permanent one-to-one public IP mapping",
                        "Dynamic NAT with a pool of 200 public addresses",
                        "No NAT is needed — private IPs are routable on the internet"
                    ],
                    explanation: "PAT (Port Address Translation / NAT overload) is the solution when many internal hosts must share a single public IP. The router tracks translations using unique source port numbers. This is the most common NAT type in enterprise and home networks. Static NAT would require 200 public IPs. Private IPs (RFC 1918) are not internet-routable."
                },
                {
                    question: "What is the purpose of the 'ip helper-address' command configured on a router's LAN interface?",
                    options: [
                        "Forwards specific UDP broadcast types (including DHCP) as unicast to a designated server on another subnet",
                        "Configures the router as a DHCP server for the connected subnet",
                        "Creates a static ARP entry mapping the helper address to a MAC address",
                        "Enables the router to respond to ping requests from the specified address"
                    ],
                    explanation: "'ip helper-address' enables DHCP relay. DHCP clients broadcast Discover messages, but broadcasts do not cross routers. The helper-address command on the default gateway's LAN interface forwards these broadcasts as unicast to the specified DHCP server IP. By default, it also forwards TFTP, DNS, TACACS, and other UDP services."
                },
                {
                    question: "Which syslog severity level should be configured to capture all errors and more critical messages but exclude informational and debug messages?",
                    options: [
                        "Level 3 — Error (captures Emergency, Alert, Critical, and Error)",
                        "Level 6 — Informational (captures everything except debug)",
                        "Level 7 — Debug (captures all messages)",
                        "Level 0 — Emergency (captures only system-unusable events)"
                    ],
                    explanation: "Setting logging level 3 (Error) captures all messages from level 0 (Emergency) through level 3 (Error): Emergency, Alert, Critical, Error. It excludes Warning (4), Notification (5), Informational (6), and Debug (7). In production, level 4 or 5 is common. Level 7 (Debug) generates enormous output and can impact device performance."
                },
                {
                    question: "Which protocol synchronizes time across network devices and uses a hierarchical stratum system where Stratum 0 is the most accurate source?",
                    options: [
                        "NTP (Network Time Protocol)",
                        "SNTP (Simple Network Time Protocol)",
                        "PTP (Precision Time Protocol)",
                        "CDP (Cisco Discovery Protocol)"
                    ],
                    explanation: "NTP uses a stratum hierarchy: Stratum 0 = atomic clocks/GPS (reference clocks, not directly accessible), Stratum 1 = servers directly connected to Stratum 0, Stratum 2 = servers synced to Stratum 1, and so on up to Stratum 15 (Stratum 16 = unsynchronized). Each stratum adds a small amount of timing uncertainty."
                },
                {
                    question: "What information does CDP (Cisco Discovery Protocol) share with directly connected devices by default?",
                    options: [
                        "Device ID, local interface, holdtime, capabilities, platform, port ID, and management IP address",
                        "Only the device hostname and IOS version",
                        "Full routing table and VLAN database",
                        "Running configuration and saved passwords"
                    ],
                    explanation: "CDP shares: Device ID (hostname), local and remote port IDs, capabilities (Router, Switch, etc.), platform (hardware model), IOS version, management IP, native VLAN, and duplex setting. It does NOT share routing tables, configurations, or passwords. CDP should be disabled on untrusted ports for security."
                },

                // ══════════════════════════════════════════════
                // DOMAIN 5: Security Fundamentals (15%) — 7 questions
                // ══════════════════════════════════════════════
                {
                    question: "An extended ACL is applied inbound on interface GigabitEthernet0/0 with the command 'ip access-group 110 in'. When does the router evaluate this ACL?",
                    options: [
                        "Immediately when packets arrive on G0/0, before any routing decision is made",
                        "After the routing decision, just before packets exit the outbound interface",
                        "Only when the router's CPU utilization is below 50%",
                        "Once per minute during scheduled ACL evaluation cycles"
                    ],
                    explanation: "Inbound ACLs are evaluated as soon as a packet arrives on the interface, BEFORE the routing table lookup. If the ACL denies the packet, it is dropped immediately — saving routing and forwarding resources. Outbound ACLs are evaluated AFTER the routing decision, just before the packet exits the outbound interface."
                },
                {
                    question: "A network administrator configures 'switchport port-security mac-address sticky' on an interface. What does this accomplish?",
                    options: [
                        "Dynamically learns the connected device's MAC address and adds it to the running configuration as a secure MAC, persisting it across sessions if saved",
                        "Permanently locks the port to the factory MAC address burned into the switch",
                        "Encrypts all traffic on the port using the MAC address as an encryption key",
                        "Sends the MAC address to a RADIUS server for authentication"
                    ],
                    explanation: "Sticky MAC learning dynamically learns the MAC address of the connected device and writes it into the running-config as a static secure entry. If you 'copy run start', it persists across reboots. This is easier than manually typing MAC addresses but more persistent than pure dynamic learning. The port stays secured to that specific device."
                },
                {
                    question: "DHCP snooping is enabled on a switch. What happens if a DHCP Offer message arrives on an untrusted port?",
                    options: [
                        "The switch drops the DHCP Offer — only trusted ports are allowed to send DHCP server responses",
                        "The switch forwards the Offer to all ports in the VLAN",
                        "The switch modifies the Offer to include the correct gateway address",
                        "The switch logs the Offer but still forwards it to the client"
                    ],
                    explanation: "DHCP snooping classifies ports as trusted (connected to legitimate DHCP servers/uplinks) or untrusted (connected to clients). DHCP server messages (Offer, Ack) arriving on untrusted ports are dropped. This prevents rogue DHCP servers from assigning malicious configurations. Client messages (Discover, Request) are allowed on untrusted ports."
                },
                {
                    question: "What is the principle of least privilege, and how does it apply to network administration?",
                    options: [
                        "Users and administrators should have only the minimum access permissions necessary to perform their specific job functions",
                        "All administrators should have full root/enable access to simplify troubleshooting",
                        "Network devices should use the lowest possible encryption standards to reduce CPU load",
                        "The least experienced administrator should handle the most critical systems"
                    ],
                    explanation: "Least privilege limits each user's access rights to the bare minimum needed for their role. In networking: a help desk user might get level 1 (show commands only), while a senior engineer gets level 15. RBAC (Role-Based Access Control) on Cisco devices and TACACS+ authorization enforce this principle."
                },
                {
                    question: "Which wireless security protocol should be deployed in an enterprise environment requiring individual user authentication with RADIUS?",
                    options: [
                        "WPA2-Enterprise (or WPA3-Enterprise) — uses 802.1X with EAP methods and a RADIUS server for per-user authentication",
                        "WPA2-Personal — uses a pre-shared key (PSK) shared among all users",
                        "WEP — provides basic encryption with a shared key",
                        "Open authentication with MAC filtering"
                    ],
                    explanation: "WPA2/WPA3-Enterprise uses 802.1X authentication with a RADIUS server (like Cisco ISE or FreeRADIUS). Each user authenticates with unique credentials (username/password, certificates, etc.). This provides accountability, granular access control, and the ability to revoke individual access. WPA2-Personal uses a single shared key with no per-user accountability."
                },
                {
                    question: "A company's security policy requires that only traffic from the 10.1.1.0/24 network is permitted to reach the server at 192.168.1.10. Which ACL entry correctly implements this?",
                    options: [
                        "access-list 100 permit ip 10.1.1.0 0.0.0.255 host 192.168.1.10",
                        "access-list 10 permit ip 10.1.1.0 255.255.255.0 host 192.168.1.10",
                        "access-list 100 deny ip 10.1.1.0 0.0.0.255 host 192.168.1.10",
                        "access-list 100 permit ip any host 192.168.1.10"
                    ],
                    explanation: "Extended ACL 100 permits IP traffic from source 10.1.1.0 with wildcard 0.0.0.255 (/24) to destination host 192.168.1.10. Standard ACLs cannot specify destination addresses. The wildcard mask (not subnet mask) is required. 'permit ip any' would allow all sources, violating the policy. The implicit deny at the end blocks everything else."
                },
                {
                    question: "What is the purpose of AAA (Authentication, Authorization, and Accounting) in network security?",
                    options: [
                        "Authentication verifies identity, Authorization determines what actions are permitted, and Accounting logs what actions were performed",
                        "AAA only applies to wireless networks and has no role in wired security",
                        "Authentication encrypts data, Authorization decrypts data, and Accounting stores encryption keys",
                        "AAA is an outdated framework replaced entirely by zero-trust architecture"
                    ],
                    explanation: "AAA is the foundational framework for network access control. Authentication: 'Who are you?' (username/password, certificate, biometric). Authorization: 'What can you do?' (command levels, VLAN assignment, access policies). Accounting: 'What did you do?' (logging commands executed, session duration, data transferred). TACACS+ and RADIUS are common AAA protocols."
                },

                // DOMAIN 6: Automation and Programmability (10%) — 5 questions
                // ══════════════════════════════════════════════
                {
                    question: "A REST API returns HTTP status code 201. What does this indicate?",
                    options: [
                        "The request succeeded and a new resource was created",
                        "The request failed due to authentication issues",

                        "The server encountered an internal error"
                    ],
                    explanation: "HTTP status codes: 200 = OK, 201 = Created (new resource successfully made), 204 = No Content, 400 = Bad Request, 401 = Unauthorized, 403 = Forbidden, 404 = Not Found, 500 = Internal Server Error. A 201 typically follows a successful POST request that creates a resource."
                },
                {
                    question: "In software-defined networking, what is the role of the northbound interface (NBI) of an SDN controller?",
                    options: [
                        "Provides APIs for applications and orchestration tools to communicate with the controller and request network services",
                        "Communicates with the data plane devices (switches/routers) to program forwarding tables",
                        "Connects the controller to external authentication servers",
                        "Monitors physical cable connections between network devices"
                    ],
                    explanation: "The northbound interface connects the SDN controller to higher-level applications (network management, orchestration, custom apps) via REST APIs. Applications use the NBI to request network services like path provisioning or policy changes. The southbound interface (OpenFlow, NETCONF) connects to the data plane devices."
                },
                {
                    question: "What format does an Ansible playbook use for defining automation tasks?",
                    options: [
                        "YAML (YAML Ain't Markup Language) — a human-readable data serialization format",
                        "JSON (JavaScript Object Notation) — key-value pair format",
                        "XML (Extensible Markup Language) — tag-based format",
                        "Python scripts with .py extension"
                    ],
                    explanation: "Ansible playbooks are written in YAML. YAML uses indentation (spaces, not tabs) to define structure, making it highly readable. A playbook contains plays, which contain tasks, which call modules. Ansible itself is written in Python, but playbooks are YAML. The inventory file can be INI or YAML format."
                },

                    question: "Cisco DNA Center provides 'assurance' capabilities. What does this feature provide?",
                    options: [
                        "AI/ML-driven analytics that proactively identify network issues, provide root-cause analysis, and suggest remediation",
                        "A backup system that mirrors all device configurations every hour",
                        "Manual configuration verification through CLI-based show commands",
                        "Physical security monitoring using IoT sensors connected to the network"
                    ],
                    explanation: "DNA Center Assurance uses machine learning and AI to continuously monitor network health, detect anomalies, correlate events across devices, identify root causes of issues, and provide guided remediation steps. It moves from reactive troubleshooting to proactive issue prevention — a key differentiator of intent-based networking."
                },
                {
                    question: "Which configuration management approach is described as 'push-based,' where the controller initiates connections to managed devices?",
                    options: [
                        "Ansible — it connects to devices via SSH/APIs from the control node and pushes configurations without requiring agents",
                        "Puppet — it uses agents that pull configurations from a central Puppet master",
                        "Chef — it uses chef-client agents that pull recipes from a Chef server",
                        "SaltStack in its default minion mode"
                    ],
                    explanation: "Ansible is push-based and agentless — the control node initiates SSH/API connections to managed devices and pushes configurations. Puppet and Chef are pull-based: agents on managed devices periodically contact the master/server to pull their configuration. SaltStack supports both push and pull but defaults to pull via minions."
                }
