    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Domains 4-6: IP Services, Security & Automation',
            description: 'NAT/PAT, DHCP, DNS, NTP, SNMP, syslog, QoS, ACLs, port security, 802.1X, REST APIs, DNA Center, Ansible (30 questions)',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            moduleId: 'ccna-domain456-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                // ── Domain 4: IP Services (10 questions) ──
                {
                    question: "What is the difference between static NAT and PAT (Port Address Translation)?",
                    options: [
                        "Static NAT maps one private IP to one public IP permanently; PAT maps many private IPs to one public IP using unique port numbers",
                        "Static NAT uses ports; PAT does not use ports",
                        "Static NAT is used for outbound traffic only; PAT is used for inbound traffic only",
                        "Static NAT and PAT are identical but use different Cisco IOS commands"
                    ],
                    explanation: "Static NAT creates a permanent one-to-one mapping between a private and public IP — useful for servers that need consistent external addresses. PAT (also called NAT overload) maps many internal IPs to a single public IP by appending unique source port numbers, allowing thousands of hosts to share one address."
                },
                {
                    question: "Which command enables PAT (NAT overload) on a Cisco router using the outbound interface's IP address?",
                    options: [
                        "ip nat inside source list [ACL] interface [interface] overload",
                        "ip nat outside source list [ACL] interface [interface]",
                        "ip nat pool MYPOOL [start-ip] [end-ip] overload",
                        "ip nat static [inside-ip] [outside-ip] overload"
                    ],
                    explanation: "PAT using the outbound interface IP: 'ip nat inside source list [ACL] interface [interface] overload'. The 'overload' keyword enables PAT. The ACL defines which inside hosts get translated. You also need 'ip nat inside' on the LAN interface and 'ip nat outside' on the WAN interface."
                },
                {
                    question: "In the DHCP DORA process, what do the four messages represent in order?",
                    options: [
                        "Discover (client broadcast), Offer (server unicast/broadcast), Request (client broadcast), Acknowledge (server unicast/broadcast)",
                        "Demand, Offer, Reply, Acknowledge",
                        "Discover, Open, Request, Accept",
                        "Detect, Obtain, Register, Activate"
                    ],
                    explanation: "DORA: (1) Discover — client broadcasts to find DHCP servers. (2) Offer — server responds with an available IP and lease parameters. (3) Request — client broadcasts acceptance of a specific offer (in case multiple servers responded). (4) Acknowledge — server confirms the lease. The client can now use the IP."
                },
                {
                    question: "A remote office has no DHCP server. Clients need to obtain IP addresses from a DHCP server at headquarters. What feature must be configured on the remote office router?",
                    options: [
                        "DHCP relay agent (ip helper-address) to forward DHCP broadcasts to the HQ server's IP",
                        "DHCP proxy that creates a local address pool mirroring the HQ server",
                        "A static route pointing DHCP traffic to the HQ network",
                        "A GRE tunnel dedicated exclusively to DHCP traffic"
                    ],
                    explanation: "DHCP Discover messages are broadcasts that do not cross router boundaries. The 'ip helper-address [server-IP]' command on the router's LAN-facing interface converts DHCP broadcasts into unicast packets forwarded to the specified server. This also forwards other UDP broadcasts (TFTP, DNS, etc.) by default."
                },
                {
                    question: "What is the primary role of DNS in IP networking?",
                    options: [
                        "Resolves human-readable domain names to IP addresses (and vice versa)",
                        "Assigns IP addresses to hosts dynamically",
                        "Encrypts data in transit between client and server",
                        "Routes packets between different autonomous systems"
                    ],
                    explanation: "DNS (Domain Name System) translates domain names (e.g., cisco.com) to IP addresses (e.g., 72.163.4.185) via A records (IPv4) and AAAA records (IPv6). Reverse DNS maps IPs to names via PTR records. DNS uses UDP port 53 for queries and TCP port 53 for zone transfers and large responses."
                },
                {
                    question: "Why is NTP (Network Time Protocol) critical for network infrastructure?",
                    options: [
                        "Synchronized clocks are essential for accurate log correlation, certificate validation, and troubleshooting across devices",
                        "NTP encrypts all management traffic with time-based one-time passwords",
                        "NTP controls the speed at which routing protocol timers expire",
                        "NTP is only needed for billing systems and has no impact on network operations"
                    ],
                    explanation: "NTP synchronizes clocks across all network devices to a common time source. Without synchronized time: syslog messages from different devices cannot be correlated during incident response, digital certificates may appear expired or not-yet-valid, scheduled tasks execute at wrong times, and forensic timelines become unreliable."
                },
                {
                    question: "SNMP is used for network monitoring. What are the three primary SNMP components?",
                    options: [
                        "SNMP Manager, SNMP Agent, and Management Information Base (MIB)",
                        "SNMP Server, SNMP Client, and SNMP Database",
                        "SNMP Controller, SNMP Sensor, and SNMP Log",
                        "SNMP Master, SNMP Slave, and SNMP Registry"
                    ],
                    explanation: "SNMP consists of: (1) Manager — the NMS (Network Management System) that polls devices and receives traps. (2) Agent — software running on managed devices that responds to queries and sends traps. (3) MIB — the database of objects (OIDs) that can be monitored/managed, defining what data is available."
                },
                {
                    question: "Which syslog severity level represents an emergency condition where the system is unusable?",
                    options: [
                        "Level 0 — Emergency",
                        "Level 7 — Debug",
                        "Level 3 — Error",
                        "Level 4 — Warning"
                    ],
                    explanation: "Syslog severity levels from most to least severe: 0-Emergency, 1-Alert, 2-Critical, 3-Error, 4-Warning, 5-Notification, 6-Informational, 7-Debug. The mnemonic 'Every Awesome Cisco Engineer Will Need Ice-cream Daily' helps remember the order. Setting logging level N captures levels 0 through N."
                },
                {
                    question: "In QoS (Quality of Service), what mechanism ensures voice traffic receives priority treatment over bulk data transfers?",
                    options: [
                        "Traffic marking (DSCP) combined with priority queuing to classify and expedite latency-sensitive traffic",
                        "Increasing the total bandwidth of all links to eliminate congestion",
                        "Disabling all non-essential traffic during business hours",
                        "Using separate physical networks for voice and data"
                    ],
                    explanation: "QoS uses traffic classification (marking packets with DSCP values like EF for voice), queuing mechanisms (priority queue/LLQ for real-time traffic), policing/shaping (rate limiting), and congestion avoidance (WRED). Voice is typically marked DSCP EF (46) and placed in a strict priority queue to minimize delay, jitter, and loss."
                },
                {
                    question: "Which protocol discovers directly connected Cisco devices and is Cisco proprietary?",
                    options: [
                        "CDP (Cisco Discovery Protocol)",
                        "LLDP (Link Layer Discovery Protocol)",
                        "STP (Spanning Tree Protocol)",
                        "ARP (Address Resolution Protocol)"
                    ],
                    explanation: "CDP is Cisco proprietary and discovers adjacent Cisco devices sharing information like device ID, platform, IP address, capabilities, and IOS version. LLDP (IEEE 802.1AB) is the vendor-neutral equivalent that works across manufacturers. Both operate at Layer 2 and do not cross routers. 'show cdp neighbors' and 'show lldp neighbors' display results."
                },

                // ── Domain 5: Security Fundamentals (10 questions) ──
                {
                    question: "What is the difference between a standard ACL and an extended ACL on a Cisco router?",
                    options: [
                        "Standard ACLs filter based on source IP only (numbered 1-99); extended ACLs filter on source/destination IP, protocol, and ports (numbered 100-199)",
                        "Standard ACLs filter on ports; extended ACLs filter on IP addresses",
                        "Standard ACLs are applied inbound only; extended ACLs are applied outbound only",
                        "There is no functional difference; the names are interchangeable"
                    ],
                    explanation: "Standard ACLs (1-99, 1300-1999) can only match on the source IP address — they should be placed close to the destination. Extended ACLs (100-199, 2000-2699) match on source IP, destination IP, protocol (TCP/UDP/ICMP), and port numbers — they should be placed close to the source to stop unwanted traffic early."
                },
                {
                    question: "Which ACL statement permits HTTP traffic from any source to the server at 10.1.1.100?",
                    options: [
                        "access-list 100 permit tcp any host 10.1.1.100 eq 80",
                        "access-list 10 permit tcp any host 10.1.1.100 eq 80",
                        "access-list 100 permit ip any host 10.1.1.100 eq 80",
                        "access-list 100 permit tcp any eq 80 host 10.1.1.100"
                    ],
                    explanation: "This is an extended ACL (100-199) matching TCP protocol, any source, destination host 10.1.1.100, destination port 80 (HTTP). Standard ACL numbers (1-99) cannot specify protocols or ports. 'ip' protocol does not support port matching. The 'eq 80' must follow the destination address."
                },
                {
                    question: "What is the implicit rule at the end of every Cisco ACL?",
                    options: [
                        "Deny all traffic (implicit deny any) — any traffic not explicitly permitted is dropped",
                        "Permit all traffic — any traffic not explicitly denied is allowed",
                        "Log all traffic that does not match any rule",
                        "Forward all unmatched traffic to a default route"
                    ],
                    explanation: "Every Cisco ACL ends with an invisible 'deny any' (standard) or 'deny ip any any' (extended). If a packet does not match any explicit permit or deny statement, it is dropped. This is why at least one permit statement is required — otherwise the ACL blocks everything. The implicit deny does not generate log messages."
                },
                {
                    question: "Port security on a Cisco switch is configured with 'switchport port-security violation shutdown'. What happens when a violation occurs?",
                    options: [
                        "The port is placed in err-disabled state, blocking all traffic until an administrator re-enables it",
                        "The offending MAC address's traffic is dropped but the port stays up for legitimate traffic",
                        "A syslog message is generated but no action is taken",
                        "The switch reboots to clear the violation"
                    ],
                    explanation: "The 'shutdown' violation mode (default) puts the port in err-disabled state — completely shutting it down. To recover: 'shutdown' then 'no shutdown' on the interface (or configure errdisable recovery). Other modes: 'restrict' drops violating traffic and logs it; 'protect' drops violating traffic silently."
                },
                {
                    question: "What attack does DHCP snooping prevent?",
                    options: [
                        "Rogue DHCP server attacks — where an unauthorized server hands out malicious IP configurations",
                        "ARP spoofing attacks between two hosts on the same VLAN",
                        "Brute-force password attacks against the DHCP server",
                        "DNS cache poisoning through falsified DHCP responses"
                    ],
                    explanation: "DHCP snooping builds a trusted binding table of IP-to-MAC-to-port mappings. It designates switch ports as trusted (facing legitimate DHCP servers) or untrusted (facing clients). DHCP server responses (Offer/Ack) from untrusted ports are dropped, preventing rogue servers from assigning malicious gateways or DNS servers."
                },
                {
                    question: "Dynamic ARP Inspection (DAI) depends on which other security feature to validate ARP packets?",
                    options: [
                        "DHCP snooping binding table — DAI checks ARP packets against DHCP-learned IP-to-MAC bindings",
                        "Port security MAC address table",
                        "802.1X authentication database",
                        "Access control lists applied to VLAN interfaces"
                    ],
                    explanation: "DAI validates ARP packets by comparing the sender's IP and MAC against the DHCP snooping binding table. If the ARP packet claims an IP-to-MAC mapping that does not match the binding table, DAI drops the packet — preventing ARP spoofing/poisoning attacks. DAI requires DHCP snooping to be enabled first."
                },
                {
                    question: "IEEE 802.1X provides port-based network access control. Which three roles are involved?",
                    options: [
                        "Supplicant (client), Authenticator (switch), Authentication Server (RADIUS)",
                        "Client, Server, Certificate Authority",
                        "User, Firewall, Active Directory",
                        "Endpoint, Controller, LDAP Server"
                    ],
                    explanation: "802.1X has three roles: (1) Supplicant — software on the client device requesting access. (2) Authenticator — the switch or AP that controls port access. (3) Authentication Server — typically a RADIUS server (like Cisco ISE) that validates credentials. Until authenticated, the supplicant can only send EAPoL frames."
                },
                {
                    question: "WPA3 improves upon WPA2 in wireless security. Which feature provides stronger protection against offline dictionary attacks?",
                    options: [
                        "SAE (Simultaneous Authentication of Equals), which replaces the PSK 4-way handshake with a zero-knowledge proof",
                        "AES-512 encryption replacing AES-256",
                        "Mandatory use of WPA3-Enterprise with certificates for all devices",
                        "Automatic MAC address randomization by the access point"
                    ],
                    explanation: "WPA3-Personal uses SAE (Simultaneous Authentication of Equals, based on Dragonfly key exchange). Unlike WPA2's PSK handshake, SAE does not transmit the password hash — making captured handshakes useless for offline dictionary/brute-force attacks. SAE also provides forward secrecy: compromising the password later cannot decrypt previously captured traffic."
                },
                {
                    question: "What is the security benefit of configuring a separate management VLAN for switch administration instead of using VLAN 1?",
                    options: [
                        "Isolates management traffic from user data, reducing the attack surface and preventing unauthorized access from user VLANs",
                        "Increases switch performance by dedicating bandwidth to management",
                        "Allows remote management from the internet without VPN",
                        "Automatically encrypts all management traffic with AES-256"
                    ],
                    explanation: "VLAN 1 is the default VLAN on all Cisco switches and cannot be deleted. Using it for management means any device on the default VLAN can potentially access switch management. A dedicated management VLAN isolates admin traffic, and ACLs or firewalls can restrict which hosts reach the management interface."
                },
                {
                    question: "Which command configures a Cisco switch port to allow a maximum of 2 MAC addresses before triggering a port security violation?",
                    options: [
                        "switchport port-security maximum 2",
                        "switchport port-security mac-address maximum 2",
                        "port-security max-hosts 2",
                        "switchport security limit 2"
                    ],
                    explanation: "Under the interface configuration: 'switchport port-security' enables port security, 'switchport port-security maximum 2' sets the limit to 2 MAC addresses. If a third unique MAC is seen, the configured violation action triggers (shutdown/restrict/protect). Default maximum is 1. You can also use 'sticky' to auto-learn and save MACs."
                },

                // ── Domain 6: Automation and Programmability (10 questions) ──
                {
                    question: "In a REST API, which HTTP method is used to create a new resource on the server?",
                    options: [
                        "POST",
                        "GET",
                        "DELETE",
                        "PATCH"
                    ],
                    explanation: "RESTful API HTTP methods: GET retrieves a resource, POST creates a new resource, PUT replaces/updates an entire resource, PATCH partially updates a resource, DELETE removes a resource. POST is not idempotent (calling it twice creates two resources), while PUT is idempotent."
                },
                {
                    question: "Which data format is most commonly used in modern REST APIs for network automation and is natively supported by Python?",
                    options: [
                        "JSON (JavaScript Object Notation)",
                        "CSV (Comma-Separated Values)",
                        "YAML (YAML Ain't Markup Language)",
                        "Binary Protocol Buffers"
                    ],
                    explanation: "JSON is the de facto standard for REST API data exchange. It uses key-value pairs, arrays, and nested objects in a human-readable text format. Python's json module can parse and generate JSON natively. YAML is popular for configuration files (Ansible) but less common in API responses. XML is used in older SOAP APIs."
                },
                {
                    question: "What is Cisco DNA Center's primary function in a software-defined network?",
                    options: [
                        "A centralized controller that provides intent-based networking, automation, assurance, and policy management across the enterprise network",
                        "A hardware firewall that inspects all traffic at the network edge",
                        "A DHCP server that replaces all distributed DHCP services",
                        "A monitoring-only tool that collects NetFlow data from all switches"
                    ],
                    explanation: "Cisco DNA Center is the management and orchestration platform for Cisco's intent-based networking (IBN). It provides: network design and provisioning, policy-based automation, network assurance (AI/ML-driven analytics), and integration through northbound REST APIs. It translates business intent into network configuration."
                },
                {
                    question: "Cisco Meraki's cloud management platform provides network visibility through which mechanism?",
                    options: [
                        "A cloud-hosted dashboard that Meraki devices connect to for centralized configuration, monitoring, and troubleshooting",
                        "SNMP polling from an on-premises management server",
                        "SSH sessions that the cloud initiates to each device",
                        "A VPN tunnel between each device and a dedicated Meraki data center router"
                    ],
                    explanation: "Meraki devices maintain a persistent, encrypted connection to the Meraki cloud. All configuration, firmware management, monitoring, and troubleshooting is done through the cloud dashboard (dashboard.meraki.com). No on-premises controller or management server is needed — reducing infrastructure requirements for distributed organizations."
                },
                {
                    question: "What is the role of Ansible in network automation?",
                    options: [
                        "An agentless automation tool that uses YAML playbooks to push configuration changes to network devices via SSH or APIs",
                        "A monitoring tool that collects SNMP data from network devices",
                        "A proprietary Cisco tool for configuring only Catalyst switches",
                        "A database system for storing device configurations and audit logs"
                    ],
                    explanation: "Ansible is an open-source, agentless automation tool. It uses YAML playbooks (human-readable automation scripts) and connects to network devices via SSH (for CLI devices) or REST APIs. No agent software needs to be installed on managed devices. Ansible is vendor-neutral and supports Cisco, Juniper, Arista, and more."
                },
                {
                    question: "In a JSON document, how is a list of three DNS servers correctly represented?",
                    options: [
                        "{\"dns_servers\": [\"8.8.8.8\", \"8.8.4.4\", \"1.1.1.1\"]}",
                        "{\"dns_servers\": (\"8.8.8.8\", \"8.8.4.4\", \"1.1.1.1\")}",
                        "{\"dns_servers\": {\"8.8.8.8\", \"8.8.4.4\", \"1.1.1.1\"}}",
                        "dns_servers: [8.8.8.8, 8.8.4.4, 1.1.1.1]"
                    ],
                    explanation: "JSON uses square brackets [] for arrays/lists and curly braces {} for objects/dictionaries. Parentheses () and sets {} (without keys) are not valid JSON. The last option uses YAML syntax, not JSON. String values must be in double quotes in JSON."
                },
                {
                    question: "Which network automation approach is described as 'the administrator defines WHAT the network should look like, and the controller determines HOW to implement it'?",
                    options: [
                        "Intent-based networking (IBN)",
                        "Command-line scripting",
                        "Manual configuration via console",
                        "SNMP-based configuration management"
                    ],
                    explanation: "Intent-based networking translates high-level business intent (e.g., 'engineering should be isolated from HR') into network policies and configurations. The controller (like DNA Center) handles the how — generating the specific ACLs, VLANs, and routing policies needed. This abstracts complexity and reduces human error."
                },
                {
                    question: "A network engineer needs to retrieve the list of all devices managed by DNA Center. Which API call is appropriate?",
                    options: [
                        "GET /dna/intent/api/v1/network-device",
                        "POST /dna/intent/api/v1/network-device",
                        "DELETE /dna/intent/api/v1/network-device",
                        "PUT /dna/intent/api/v1/network-device/all"
                    ],
                    explanation: "Retrieving data uses the GET method. The DNA Center REST API follows RESTful conventions: GET to read, POST to create, PUT to update, DELETE to remove. The /dna/intent/api/v1/network-device endpoint returns the inventory of managed devices. Authentication is via token obtained from the /auth endpoint."
                },
                {
                    question: "What is a key advantage of infrastructure as code (IaC) for network management?",
                    options: [
                        "Network configurations are version-controlled, repeatable, and auditable — eliminating manual drift and enabling rollback",
                        "It eliminates the need for any network hardware",
                        "All network traffic is automatically encrypted by the IaC platform",
                        "It guarantees 100% uptime by preventing all configuration errors"
                    ],
                    explanation: "IaC stores network configurations as code in version control (Git). Benefits: repeatability (same config deploys identically every time), auditability (every change is tracked with who/what/when), rollback capability (revert to previous known-good state), and drift detection (compare actual vs. intended configuration)."
                },
                {
                    question: "In the context of SDN (Software-Defined Networking), what is the function of the southbound interface?",
                    options: [
                        "Communication between the SDN controller and the network devices (data plane) using protocols like OpenFlow or NETCONF",
                        "Communication between the SDN controller and management applications",
                        "Communication between two SDN controllers in a redundant pair",
                        "Communication between end users and the network through a web portal"
                    ],
                    explanation: "In SDN architecture: the southbound interface (SBI) connects the controller to the data plane devices (switches, routers) using protocols like OpenFlow, NETCONF, or RESTCONF. The northbound interface (NBI) connects the controller to applications and orchestration tools, typically via REST APIs. The controller sits in the control plane."
                }
            ]
        });
        quiz.start();
    </script>
