<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to CCNA Hub</a>
        <span class="brand">CCNA 200-301 &mdash; Domain 3</span>
    </header>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Domain 3: IP Connectivity',
            description: 'Routing tables, administrative distance, static routes, OSPF, wildcard masks, DR/BDR, HSRP (20 questions)',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            moduleId: 'ccna-domain3-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: "A router has the following routes to 10.1.1.0/24: a connected route, a static route, and an OSPF-learned route. Which route will the router use and why?",
                    options: [
                        "The connected route, because it has the lowest administrative distance (AD = 0)",
                        "The OSPF route, because dynamic protocols are always preferred",
                        "The static route, because manually configured routes override all others",
                        "All three routes will be used for load balancing"
                    ],
                    explanation: "When multiple routing sources provide routes to the same destination, the router selects the one with the lowest administrative distance (AD). Connected = 0, Static = 1, OSPF = 110. Since the connected route has AD 0, it wins. AD is the trustworthiness of a routing source, not a path metric."
                },
                {
                    question: "What is the administrative distance (AD) of an OSPF-learned route on a Cisco router?",
                    options: [
                        "110",
                        "90",
                        "120",
                        "170"
                    ],
                    explanation: "OSPF has an administrative distance of 110. Key AD values for CCNA: Connected = 0, Static = 1, EIGRP (summary) = 5, EBGP = 20, EIGRP (internal) = 90, OSPF = 110, IS-IS = 115, RIP = 120, EIGRP (external) = 170, iBGP = 200. Lower AD = more trusted source."
                },
                {
                    question: "Which command creates a static route on a Cisco router to reach the 192.168.50.0/24 network via the next-hop address 10.0.0.2?",
                    options: [
                        "ip route 192.168.50.0 255.255.255.0 10.0.0.2",
                        "ip route 192.168.50.0/24 10.0.0.2",
                        "route add 192.168.50.0 mask 255.255.255.0 gateway 10.0.0.2",
                        "static route 192.168.50.0 255.255.255.0 next-hop 10.0.0.2"
                    ],
                    explanation: "Cisco IOS static route syntax: 'ip route [destination-network] [subnet-mask] [next-hop-IP or exit-interface]'. The /24 CIDR notation is not used in this command — you must specify the full subnet mask. The 'route add' syntax is Windows. There is no 'static route' command in IOS."
                },
                {
                    question: "A floating static route is configured with an administrative distance of 130. When does this route become active?",
                    options: [
                        "Only when the primary route (with a lower AD) fails or is removed from the routing table",
                        "Immediately — it operates alongside the primary route for load balancing",
                        "Only during scheduled maintenance windows",
                        "It is always active but with lower priority for packet forwarding"
                    ],
                    explanation: "A floating static route is a backup route configured with a higher AD than the primary routing protocol's AD. For example, if OSPF (AD 110) is the primary path and the floating static has AD 130, the static route only enters the routing table when OSPF withdraws the route. This provides automatic failover."
                },
                {
                    question: "In OSPF, what is the role of the Designated Router (DR) on a multi-access network segment?",
                    options: [
                        "Reduces OSPF adjacency overhead by acting as the central point for LSA exchange on the segment",
                        "Performs all routing calculations for the entire OSPF area",
                        "Assigns IP addresses to other routers on the segment",
                        "Encrypts all OSPF hello packets for security"
                    ],
                    explanation: "On multi-access networks (like Ethernet), OSPF elects a DR and BDR to reduce the number of adjacencies. Without a DR, every router would need a full adjacency with every other router (n*(n-1)/2). With a DR, all routers form adjacencies only with the DR and BDR, and the DR synchronizes LSAs across the segment."
                },
                {
                    question: "How is the OSPF Designated Router (DR) elected on a broadcast multi-access segment?",
                    options: [
                        "The router with the highest OSPF priority wins; if tied, the highest router ID breaks the tie",
                        "The router with the lowest IP address on the segment is always elected",
                        "The first router to boot on the segment becomes the DR permanently",
                        "DR election is random and changes every 30 seconds"
                    ],
                    explanation: "DR election uses OSPF interface priority (default 1, range 0-255). Priority 0 means the router will never become DR. If priorities tie, the highest OSPF router ID wins. The election is non-preemptive — a new router with higher priority does NOT take over as DR until the current DR fails."
                },
                {
                    question: "Which OSPF network type does NOT require a DR/BDR election?",
                    options: [
                        "Point-to-point",
                        "Broadcast multi-access",
                        "Non-broadcast multi-access (NBMA)",
                        "Virtual link"
                    ],
                    explanation: "Point-to-point links connect exactly two routers, so there is no need for a DR/BDR — a full adjacency forms directly. Broadcast multi-access (Ethernet) and NBMA networks require DR/BDR to manage adjacencies. Virtual links are special tunnels through a transit area and also do not use DR/BDR."
                },
                {
                    question: "What is the OSPF wildcard mask equivalent of the subnet mask 255.255.255.240?",
                    options: [
                        "0.0.0.15",
                        "0.0.0.240",
                        "0.0.0.16",
                        "255.255.255.15"
                    ],
                    explanation: "A wildcard mask is the inverse of the subnet mask. Subtract each octet from 255: 255-255=0, 255-255=0, 255-255=0, 255-240=15. So 255.255.255.240 becomes 0.0.0.15. Wildcard masks are used in OSPF network statements and ACLs. A 0 bit means 'must match'; a 1 bit means 'don't care.'"
                },
                {
                    question: "A router needs to advertise the 172.16.8.0/22 network in OSPF area 0. Which network statement is correct?",
                    options: [
                        "network 172.16.8.0 0.0.3.255 area 0",
                        "network 172.16.8.0 255.255.252.0 area 0",
                        "network 172.16.8.0 0.0.0.255 area 0",
                        "network 172.16.8.0/22 area 0"
                    ],
                    explanation: "OSPF uses wildcard masks in network statements. /22 = subnet mask 255.255.252.0, so the wildcard is 0.0.3.255 (255-252=3 in the third octet, 255-0=255 in the fourth). The CIDR notation /22 is not accepted in the OSPF network command. Subnet masks are also not accepted — only wildcard masks."
                },
                {
                    question: "In a multi-area OSPF deployment, what is the purpose of Area 0 (the backbone area)?",
                    options: [
                        "All inter-area traffic must transit through Area 0; all other areas must connect to it",
                        "Area 0 is optional and used only for management traffic",
                        "Area 0 stores all router configurations as a central database",
                        "Area 0 is used exclusively for external route redistribution"
                    ],
                    explanation: "OSPF Area 0 is the backbone area. All other areas must have at least one ABR (Area Border Router) connected to Area 0. Inter-area traffic always flows through the backbone. If an area cannot physically connect to Area 0, a virtual link must be configured through a transit area. This hierarchical design prevents routing loops."
                },
                {
                    question: "What is an Area Border Router (ABR) in OSPF?",
                    options: [
                        "A router with interfaces in multiple OSPF areas, including Area 0, that summarizes and exchanges routes between areas",
                        "A router that connects OSPF to a different routing protocol like EIGRP",
                        "The DR on a broadcast segment that borders two VLANs",
                        "A firewall that filters OSPF LSAs between security zones"
                    ],
                    explanation: "An ABR has interfaces in at least two OSPF areas (one of which is typically Area 0). It maintains separate LSDBs for each area and generates Type 3 LSAs (summary LSAs) to advertise routes between areas. An ASBR (Autonomous System Boundary Router) is the one that connects OSPF to external routing domains."
                },
                {
                    question: "OSPF uses which metric to determine the best path to a destination?",
                    options: [
                        "Cost, calculated as reference bandwidth / interface bandwidth",
                        "Hop count, similar to RIP",
                        "Administrative distance combined with bandwidth",
                        "Delay plus bandwidth, similar to EIGRP's composite metric"
                    ],
                    explanation: "OSPF cost = reference bandwidth / interface bandwidth. Default reference bandwidth is 100 Mbps. A 100 Mbps link = cost 1, a 10 Mbps link = cost 10, a 1 Gbps link = cost 1 (same as 100M by default — which is why you should adjust reference bandwidth with 'auto-cost reference-bandwidth'). The total path cost is the sum of all link costs to the destination."
                },
                {
                    question: "A router's OSPF reference bandwidth is set to 1000 (Mbps). What is the OSPF cost for a GigabitEthernet interface?",
                    options: [
                        "1",
                        "10",
                        "100",
                        "0"
                    ],
                    explanation: "Cost = reference bandwidth / interface bandwidth = 1000 Mbps / 1000 Mbps = 1. With the default reference bandwidth of 100 Mbps, both FastEthernet and GigabitEthernet would have cost 1, which prevents OSPF from preferring faster links. Setting reference bandwidth to at least 10000 (10 Gbps) is recommended in modern networks."
                },
                {
                    question: "Which OSPF packet type is used to discover and maintain neighbor relationships?",
                    options: [
                        "Hello packet",
                        "Database Description (DBD) packet",
                        "Link-State Request (LSR) packet",
                        "Link-State Update (LSU) packet"
                    ],
                    explanation: "OSPF Hello packets are sent periodically (default 10 seconds on broadcast/point-to-point) to discover neighbors, negotiate parameters, and serve as keepalives. If hellos stop arriving within the dead interval (default 40 seconds), the neighbor is declared down. DBD, LSR, and LSU are used for LSDB synchronization."
                },
                {
                    question: "For two OSPF routers to form a neighbor adjacency, which parameters MUST match?",
                    options: [
                        "Hello interval, dead interval, area ID, subnet mask, authentication, and stub area flag",
                        "Only the area ID and router ID",
                        "Router ID and IP address only",
                        "OSPF process number and router priority"
                    ],
                    explanation: "OSPF neighbor formation requires matching: Hello/Dead intervals, Area ID, subnet/mask on the shared link, authentication type and credentials, and stub area flags. Process numbers are locally significant and do NOT need to match. Router IDs must be unique but do not need to match. Priority affects DR election, not adjacency formation."
                },
                {
                    question: "What is the function of HSRP (Hot Standby Router Protocol) in a network?",
                    options: [
                        "Provides first-hop redundancy by creating a virtual IP/MAC shared between an active and standby router",
                        "Encrypts routing updates between core routers for security",
                        "Balances traffic equally across all available default gateways",
                        "Monitors link state and adjusts OSPF metrics automatically"
                    ],
                    explanation: "HSRP (Cisco proprietary) provides gateway redundancy. Two or more routers share a virtual IP address that hosts use as their default gateway. One router is Active (forwards traffic), one is Standby (ready to take over). If the Active router fails, the Standby assumes the virtual IP within seconds, transparent to end hosts."
                },
                {
                    question: "In a Cisco routing table entry 'O 10.10.0.0/16 [110/20] via 192.168.1.1, 00:05:23, GigabitEthernet0/0', what does [110/20] represent?",
                    options: [
                        "Administrative distance of 110 and OSPF metric (cost) of 20",
                        "OSPF area 110 and hop count of 20",
                        "Path cost of 110 and bandwidth of 20 Mbps",
                        "Timer value of 110 seconds and sequence number 20"
                    ],
                    explanation: "In a routing table entry, [AD/metric] shows the administrative distance and the routing protocol's metric. 'O' means OSPF (AD = 110). The cost of 20 is the cumulative OSPF cost to reach 10.10.0.0/16. '192.168.1.1' is the next-hop. 'GigabitEthernet0/0' is the exit interface."
                },
                {
                    question: "A network has two equal-cost OSPF paths to the same destination. What happens by default on a Cisco router?",
                    options: [
                        "The router load-balances across both paths using ECMP (Equal-Cost Multi-Path)",
                        "The router selects only the path with the lower next-hop IP address",
                        "The router randomly chooses one path and ignores the other",
                        "The router enters a loop-prevention state and blocks both paths"
                    ],
                    explanation: "Cisco routers support ECMP for OSPF by default with a maximum of 4 equal-cost paths (configurable up to 32 with 'maximum-paths'). Traffic is distributed across all equal-cost paths using a hash of source/destination fields. This provides both redundancy and increased aggregate bandwidth."
                },
                {
                    question: "What is the purpose of a default static route (0.0.0.0/0) on a router?",
                    options: [
                        "It acts as a gateway of last resort, matching any destination not in the routing table",
                        "It blocks all traffic that does not match a specific route",
                        "It advertises the router as the OSPF DR to all neighbors",
                        "It enables NAT for all outbound traffic automatically"
                    ],
                    explanation: "A default route (0.0.0.0 0.0.0.0) matches every possible destination — it is the least specific route. When a packet does not match any more specific route in the routing table, the default route is used. This is the 'gateway of last resort' and is essential for internet connectivity on stub networks."
                },
                {
                    question: "Which EIGRP feature allows it to maintain backup routes (feasible successors) in its topology table for instant failover?",
                    options: [
                        "DUAL (Diffusing Update Algorithm), which precomputes loop-free backup paths",
                        "SPF (Shortest Path First) algorithm running on all routes simultaneously",
                        "Periodic full routing table broadcasts every 30 seconds",
                        "Link-state advertisements flooded to all EIGRP neighbors"
                    ],
                    explanation: "EIGRP uses the DUAL algorithm to calculate primary paths (successors) and precompute backup paths (feasible successors) stored in the topology table. When a successor fails, EIGRP instantly promotes a feasible successor without recalculating — achieving sub-second convergence. This is faster than OSPF's SPF recalculation."
                }
            ]
        });
        quiz.start();
    </script>
