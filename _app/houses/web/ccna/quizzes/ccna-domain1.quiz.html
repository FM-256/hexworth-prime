<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to CCNA Hub</a>

    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Domain 1: Network Fundamentals',
            description: 'Network types, topologies, OSI model, TCP/IP, IPv4 subnetting, IPv6, Cisco IOS, and show commands (20 questions)',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            moduleId: 'ccna-domain1-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: "Which network type provides dedicated, guaranteed bandwidth between two endpoints and is commonly used in legacy WAN connections such as T1/E1 leased lines?",
                    options: [
                        "Circuit-switched network",
                        "Packet-switched network",
                        "Software-defined WAN (SD-WAN)",
                        "Metro Ethernet network"
                    ],
                    explanation: "Circuit-switched networks establish a dedicated communication path between two endpoints for the duration of the session. T1/E1 leased lines are classic examples. Packet-switched networks (like the internet) share bandwidth across multiple flows. SD-WAN is an overlay technology, and Metro Ethernet is a MAN service."
                },
                {
                    question: "A company has offices in three cities connected via MPLS. Each office also has local switches and routers. Which correctly identifies the WAN and LAN components?",
                    options: [
                        "MPLS links are the WAN; switches and routers within each office form the LAN",
                        "MPLS links are the LAN; inter-office connections are the WAN",
                        "Everything is WAN because MPLS is involved",
                        "Everything is LAN because the company owns all the equipment"
                    ],
                    explanation: "The WAN is the portion that connects geographically separated sites — in this case the MPLS links between cities. The LAN is the local network infrastructure within each office. Ownership does not determine LAN vs. WAN; geographic scope does."
                },
                {
                    question: "In the OSI model, which layer is responsible for logical addressing and routing packets between different networks?",
                    options: [
                        "Layer 3 — Network",
                        "Layer 2 — Data Link",
                        "Layer 4 — Transport",
                        "Layer 1 — Physical"
                    ],
                    explanation: "The Network layer (Layer 3) handles logical addressing (IP addresses) and routing decisions to move packets across different networks. Layer 2 handles MAC addressing and local delivery. Layer 4 manages end-to-end transport (TCP/UDP). Layer 1 deals with physical signaling."
                },
                {
                    question: "Which OSI layer handles data segmentation, flow control, and error recovery, and is where TCP and UDP operate?",
                    options: [
                        "Layer 4 — Transport",
                        "Layer 3 — Network",
                        "Layer 5 — Session",
                        "Layer 7 — Application"
                    ],
                    explanation: "The Transport layer (Layer 4) segments data, provides flow control and error recovery (TCP), or offers connectionless best-effort delivery (UDP). TCP guarantees delivery with three-way handshakes and acknowledgments; UDP does not."
                },
                {
                    question: "What is the correct encapsulation order as data moves down the OSI model from Application to Physical?",
                    options: [
                        "Data -> Segment -> Packet -> Frame -> Bits",
                        "Data -> Packet -> Segment -> Frame -> Bits",
                        "Data -> Frame -> Packet -> Segment -> Bits",
                        "Bits -> Frame -> Packet -> Segment -> Data"
                    ],
                    explanation: "At Layer 7-5 data is raw application data. Layer 4 (Transport) creates segments (TCP) or datagrams (UDP). Layer 3 (Network) creates packets by adding IP headers. Layer 2 (Data Link) creates frames with MAC headers and trailers. Layer 1 (Physical) converts to bits on the wire."
                },
                {
                    question: "In the TCP/IP model, which layer combines the functions of the OSI Session, Presentation, and Application layers?",
                    options: [
                        "Application layer",
                        "Transport layer",
                        "Internet layer",
                        "Network Access layer"
                    ],
                    explanation: "The TCP/IP model has four layers. Its Application layer maps to OSI layers 5 (Session), 6 (Presentation), and 7 (Application). The Transport layer maps to OSI Layer 4. The Internet layer maps to OSI Layer 3. The Network Access layer maps to OSI Layers 1 and 2."
                },
                {
                    question: "A host has the IP address 172.20.48.130/26. What is the subnet mask, and how many usable host addresses exist on this subnet?",
                    options: [
                        "255.255.255.192 with 62 usable hosts",
                        "255.255.255.128 with 126 usable hosts",
                        "255.255.255.224 with 30 usable hosts",
                        "255.255.255.240 with 14 usable hosts"
                    ],
                    explanation: "A /26 prefix means 26 network bits, leaving 6 host bits. The subnet mask is 255.255.255.192 (11111111.11111111.11111111.11000000). With 6 host bits: 2^6 = 64 total addresses, minus 2 (network and broadcast) = 62 usable hosts."
                },
                {
                    question: "Given the IP address 10.50.100.200/20, what is the network address?",
                    options: [
                        "10.50.96.0",
                        "10.50.100.0",
                        "10.50.64.0",
                        "10.50.128.0"
                    ],
                    explanation: "With /20, the third octet has 4 network bits (xxxx0000). 100 in binary is 01100100. Masking with 11110000 gives 01100000 = 96. So the network address is 10.50.96.0. The block size in the third octet is 16 (2^4), and 96 is the nearest multiple of 16 below 100."
                },
                {
                    question: "Which IPv6 address type is the equivalent of an IPv4 private address and is routable only within an organization's network?",
                    options: [
                        "Unique local address (fc00::/7)",
                        "Link-local address (fe80::/10)",
                        "Global unicast address (2000::/3)",
                        "Multicast address (ff00::/8)"
                    ],
                    explanation: "Unique local addresses (ULA, fc00::/7, practically fd00::/8) are the IPv6 equivalent of RFC 1918 private addresses. They are routable within an organization but not on the global internet. Link-local addresses are confined to a single link/subnet. Global unicast addresses are publicly routable."
                },
                {
                    question: "What is the compressed form of the IPv6 address 2001:0db8:0000:0000:0000:0000:0000:0001?",
                    options: [
                        "2001:db8::1",
                        "2001:db8:0:0:0:0:0:1",
                        "2001:0db8::0001",
                        "2001:db8:::1"
                    ],
                    explanation: "IPv6 compression rules: (1) remove leading zeros in each group (0db8 becomes db8, 0001 becomes 1), and (2) replace the longest consecutive sequence of all-zero groups with :: (used only once). Applying both rules to this address gives 2001:db8::1."
                },
                {
                    question: "A network engineer connects to a Cisco router via console and sees 'Router>' as the prompt. Which IOS mode is active, and what command enters privileged EXEC mode?",
                    options: [
                        "User EXEC mode; type 'enable'",
                        "Privileged EXEC mode; type 'configure terminal'",
                        "Global configuration mode; type 'exit'",
                        "Interface configuration mode; type 'end'"
                    ],
                    explanation: "The > prompt indicates user EXEC mode, which has limited read-only commands. Typing 'enable' elevates to privileged EXEC mode (Router#), which allows full configuration access. 'configure terminal' enters global config from privileged EXEC. 'exit' goes back one level."
                },
                {
                    question: "From which Cisco IOS mode do you execute the command 'interface GigabitEthernet0/1' to configure a specific interface?",
                    options: [
                        "Global configuration mode (config)#",
                        "User EXEC mode >",
                        "Privileged EXEC mode #",
                        "Interface configuration mode (config-if)#"
                    ],
                    explanation: "To enter interface configuration mode, you first need to be in global configuration mode (Router(config)#) and then issue the 'interface GigabitEthernet0/1' command. This transitions you to (config-if)# for that specific interface. You cannot configure interfaces from user EXEC or privileged EXEC directly."
                },
                {
                    question: "Which Cisco IOS command displays the IP address, status, and protocol state of all router interfaces in a summary table?",
                    options: [
                        "show ip interface brief",
                        "show interfaces",
                        "show running-config",
                        "show ip route"
                    ],
                    explanation: "'show ip interface brief' provides a concise table showing each interface's IP address, OK? status, Method, Status, and Protocol columns. 'show interfaces' gives verbose per-interface detail. 'show running-config' shows the full configuration. 'show ip route' displays the routing table."
                },
                {
                    question: "Which command would you use to verify the routing table on a Cisco router, showing all learned and connected routes?",
                    options: [
                        "show ip route",
                        "show ip interface brief",
                        "show arp",
                        "show mac address-table"
                    ],
                    explanation: "'show ip route' displays the entire IP routing table, including connected (C), static (S), OSPF (O), EIGRP (D), and other route sources with their administrative distance and metric. 'show arp' shows the ARP cache. 'show mac address-table' is a Layer 2 switch command."
                },
                {
                    question: "Which protocol and port number does SSH use, and why is it preferred over Telnet for remote device management?",
                    options: [
                        "TCP port 22; SSH encrypts the entire session including credentials",
                        "TCP port 23; SSH provides faster connection setup",
                        "UDP port 22; SSH uses connectionless transport for efficiency",
                        "TCP port 443; SSH runs over HTTPS for web-based management"
                    ],
                    explanation: "SSH operates on TCP port 22 and provides encrypted communication for remote management. Telnet (TCP port 23) transmits everything in cleartext, including usernames and passwords, making it a security risk. SSH is the CCNA-expected standard for secure device access."
                },
                {
                    question: "To configure SSH on a Cisco router, which of the following is NOT a required step?",
                    options: [
                        "Configure an access list to permit SSH traffic on the WAN interface",
                        "Set the hostname to something other than the default",
                        "Set the domain name with 'ip domain-name'",
                        "Generate RSA keys with 'crypto key generate rsa'"
                    ],
                    explanation: "SSH requires a hostname (not default), a domain name, and RSA key generation. An access list to permit SSH on the WAN interface is optional — SSH works without it. The required steps are: hostname, ip domain-name, crypto key generate rsa, line vty transport input ssh, and login local with a user account."
                },
                {
                    question: "A star topology has a central switch connecting 12 devices. If the central switch fails, what happens to network communication?",
                    options: [
                        "All 12 devices lose connectivity to each other",
                        "Only devices on the same VLAN lose connectivity",
                        "Devices can still communicate through backup paths",
                        "Only the devices directly adjacent to the switch are affected"
                    ],
                    explanation: "In a star topology, all communication passes through the central device. If that switch fails, every connected device loses the ability to communicate with every other device — there are no alternate paths. This single point of failure is the primary disadvantage of a pure star topology."
                },
                {
                    question: "Which TCP/IP protocol uses a three-way handshake (SYN, SYN-ACK, ACK) to establish a reliable connection before data transfer?",
                    options: [
                        "TCP (Transmission Control Protocol)",
                        "UDP (User Datagram Protocol)",
                        "ICMP (Internet Control Message Protocol)",
                        "ARP (Address Resolution Protocol)"
                    ],
                    explanation: "TCP uses a three-way handshake to establish a connection: the client sends SYN, the server responds with SYN-ACK, and the client confirms with ACK. This ensures both sides are ready for reliable, ordered data transfer. UDP is connectionless with no handshake. ICMP is for diagnostics. ARP resolves IP to MAC addresses."
                },
                {
                    question: "What is the purpose of the 'show version' command on a Cisco device?",
                    options: [
                        "Displays IOS version, uptime, hardware platform, memory, and configuration register",
                        "Shows the current running configuration line by line",
                        "Lists all connected neighbors and their IP addresses",
                        "Displays the contents of NVRAM including the startup configuration"
                    ],
                    explanation: "'show version' is one of the most informative commands, displaying the IOS version, system uptime, hardware platform and model, amount of RAM and flash memory, and the configuration register value (e.g., 0x2102). It does not show the running-config or neighbor details."
                },
                {
                    question: "Which binary value correctly represents the decimal number 201?",
                    options: [
                        "11001001",
                        "11001010",
                        "11010001",
                        "10110001"
                    ],
                    explanation: "To convert 201 to binary: 128(1) + 64(1) + 0(0) + 0(0) + 8(1) + 0(0) + 0(0) + 1(1) = 11001001. Binary conversion is fundamental for subnetting — you must be able to convert between decimal and binary quickly for the CCNA exam."
                }
            ]
        });
        quiz.start();
    </script>
