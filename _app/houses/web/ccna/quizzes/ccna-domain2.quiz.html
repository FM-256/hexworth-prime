<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to CCNA Hub</a>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Domain 2: Network Access',
            description: 'Ethernet switching, VLANs, trunking, STP, EtherChannel, and wireless (20 questions)',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            moduleId: 'ccna-domain2-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: "When a Cisco switch receives a frame with a destination MAC address not found in its MAC address table, what action does it take?",
                    options: [
                        "Floods the frame out all ports except the source port (unknown unicast flooding)",
                        "Drops the frame and sends an ICMP unreachable message",
                        "Sends the frame to the default gateway",
                        "Buffers the frame until the destination MAC is learned"
                    ],
                    explanation: "When a switch encounters an unknown unicast — a destination MAC not in its CAM/MAC table — it floods the frame out every port in the same VLAN except the port it arrived on. This ensures the frame reaches the destination if it exists. The switch learns the source MAC from the incoming frame and updates its table."
                },
                {
                    question: "Which statement correctly describes how a switch builds its MAC address table?",
                    options: [
                        "It learns source MAC addresses from incoming frames and maps them to the ingress port",
                        "It learns destination MAC addresses from outgoing frames",
                        "It uses ARP requests to populate the MAC table with IP-to-MAC mappings",
                        "It queries a central MAC database maintained by the network management server"
                    ],
                    explanation: "A switch populates its MAC address table by examining the source MAC address of every frame it receives and associating that MAC with the port it arrived on. This is a passive learning process — no queries or broadcasts are needed. MAC entries age out after a timeout (default 300 seconds on Cisco switches)."
                },
                {
                    question: "What is the purpose of a VLAN in a switched network?",
                    options: [
                        "To create separate broadcast domains within a single physical switch",
                        "To increase the speed of all switch ports by reducing collisions",
                        "To encrypt traffic between switches using 802.1Q headers",
                        "To replace the need for a router in inter-network communication"
                    ],
                    explanation: "VLANs (Virtual LANs) segment a physical switch into multiple logical broadcast domains. Devices in VLAN 10 cannot receive broadcasts from VLAN 20 without a Layer 3 device (router or L3 switch). VLANs improve security, reduce broadcast traffic, and provide logical grouping independent of physical location."
                },
                {
                    question: "A network engineer needs to carry traffic for VLANs 10, 20, and 30 between two Cisco switches over a single physical link. Which configuration is required?",
                    options: [
                        "Configure the inter-switch link as an 802.1Q trunk",
                        "Create three separate physical connections, one per VLAN",
                        "Enable STP on all three VLANs simultaneously",
                        "Configure a static route for each VLAN on both switches"
                    ],
                    explanation: "An 802.1Q trunk carries multiple VLAN traffic over a single physical link by tagging each frame with a VLAN ID in the 802.1Q header. The native VLAN is untagged. Without trunking, you would need a separate physical link for each VLAN. STP and routing are separate concerns."
                },
                {
                    question: "On a Cisco switch trunk port, what happens to frames belonging to the native VLAN?",
                    options: [
                        "They are sent untagged across the trunk",
                        "They are tagged with VLAN ID 0",
                        "They are dropped because only tagged frames traverse trunks",
                        "They are encapsulated in ISL headers instead of 802.1Q"
                    ],
                    explanation: "The native VLAN is the one VLAN whose frames are NOT tagged when sent across an 802.1Q trunk. By default, the native VLAN is VLAN 1. If both sides of the trunk have mismatched native VLANs, frames can end up in the wrong VLAN — a security concern called VLAN hopping. Best practice is to use an unused VLAN as native."
                },
                {
                    question: "Which command correctly assigns a Cisco switch port to VLAN 25 as an access port?",
                    options: [
                        "switchport mode access, then switchport access vlan 25",
                        "vlan 25, then interface assign switchport",
                        "switchport trunk allowed vlan 25",
                        "switchport mode dynamic desirable vlan 25"
                    ],
                    explanation: "To assign a port to a specific VLAN: enter interface config, set the port to access mode with 'switchport mode access', then assign the VLAN with 'switchport access vlan 25'. The trunk command adds VLANs to a trunk, not access ports. 'dynamic desirable' negotiates trunk/access via DTP."
                },
                {
                    question: "Inter-VLAN routing using a router-on-a-stick configuration requires which of the following?",
                    options: [
                        "A single router interface configured with 802.1Q subinterfaces, one per VLAN",
                        "A separate physical router interface for each VLAN",
                        "A Layer 2 switch with STP disabled on all VLAN ports",
                        "A dedicated management VLAN configured on the router"
                    ],
                    explanation: "Router-on-a-stick uses a single physical router interface divided into logical subinterfaces (e.g., G0/0.10, G0/0.20), each configured with 'encapsulation dot1Q [VLAN-ID]' and an IP address for that VLAN's subnet. The switch port connecting to the router must be configured as a trunk."
                },
                {
                    question: "What is the primary purpose of Spanning Tree Protocol (STP, IEEE 802.1D)?",
                    options: [
                        "To prevent Layer 2 loops by blocking redundant paths while maintaining failover capability",
                        "To load-balance traffic across multiple trunk links between switches",
                        "To encrypt VLAN traffic traversing trunk links",
                        "To dynamically assign IP addresses to switch management interfaces"
                    ],
                    explanation: "STP prevents broadcast storms and MAC table instability caused by Layer 2 loops. It places redundant ports in a blocking state so only one active path exists between any two switches. If the active path fails, STP reconverges by unblocking an alternate path. This can take 30-50 seconds in classic 802.1D."
                },
                {
                    question: "In STP, which port state allows a port to forward data frames and learn MAC addresses?",
                    options: [
                        "Forwarding",
                        "Listening",
                        "Learning",
                        "Blocking"
                    ],
                    explanation: "In classic 802.1D STP, ports transition through Blocking -> Listening -> Learning -> Forwarding. Only the Forwarding state actually sends and receives data frames. Learning adds MAC addresses to the table but does not forward user traffic. Listening participates in STP BPDUs only. Blocking receives BPDUs but does nothing else."
                },
                {
                    question: "Rapid Spanning Tree Protocol (RSTP, IEEE 802.1w) improves convergence over classic STP. What is a key difference?",
                    options: [
                        "RSTP reduces convergence from 30-50 seconds to typically under 6 seconds by using proposal/agreement handshakes",
                        "RSTP eliminates the need for a root bridge entirely",
                        "RSTP only works with Layer 3 switches, not Layer 2",
                        "RSTP uses VLAN-specific spanning trees by default"
                    ],
                    explanation: "RSTP achieves rapid convergence (often 1-6 seconds) through a proposal/agreement mechanism that allows ports to transition directly to forwarding without waiting through timer-based states. It reduces five port states to three (Discarding, Learning, Forwarding) and introduces edge ports and alternate/backup port roles."
                },
                {
                    question: "Which STP port role connects to the root bridge via the lowest-cost path?",
                    options: [
                        "Root port",
                        "Designated port",
                        "Alternate port",
                        "Backup port"
                    ],
                    explanation: "Every non-root switch has exactly one root port — the port with the lowest total path cost to the root bridge. The root bridge itself has no root ports; all its active ports are designated ports. Alternate ports are blocked backup paths to the root. Backup ports are blocked redundant paths on the same segment."
                },
                {
                    question: "A network uses LACP to bundle four physical links between two switches into an EtherChannel. If one link fails, what happens?",
                    options: [
                        "The EtherChannel continues operating with the remaining three links at reduced aggregate bandwidth",
                        "The entire EtherChannel goes down and traffic stops",
                        "STP reconverges and activates an alternate path",
                        "LACP disables all remaining links to prevent asymmetric routing"
                    ],
                    explanation: "EtherChannel treats multiple physical links as a single logical link. If one member fails, traffic is redistributed across the surviving members — bandwidth decreases proportionally but the channel stays up. STP sees the EtherChannel as one link, so no STP reconvergence occurs. This is a key advantage of link aggregation."
                },
                {
                    question: "What is the difference between LACP and PAgP for EtherChannel negotiation?",
                    options: [
                        "LACP is IEEE 802.3ad (open standard); PAgP is Cisco proprietary",
                        "LACP is Cisco proprietary; PAgP is IEEE 802.3ad (open standard)",
                        "LACP supports up to 4 links; PAgP supports up to 8 links",
                        "LACP requires matched speed only; PAgP requires matched speed and duplex"
                    ],
                    explanation: "LACP (Link Aggregation Control Protocol) is defined in IEEE 802.3ad and works across vendors. PAgP (Port Aggregation Protocol) is a Cisco-proprietary alternative. Both negotiate EtherChannel formation, but LACP is preferred in multi-vendor environments. Both support up to 8 active links. Both require matched speed and duplex."
                },
                {
                    question: "When configuring an EtherChannel using LACP, which mode combination on two switches will successfully form the channel?",
                    options: [
                        "Active on one side, Passive on the other",
                        "Passive on both sides",
                        "Desirable on one side, Active on the other",
                        "On on one side, Active on the other"
                    ],
                    explanation: "LACP uses Active and Passive modes. Active actively initiates negotiation; Passive waits for the other side to initiate. Active-Active and Active-Passive both work. Passive-Passive will NOT form a channel because neither side initiates. 'Desirable' and 'On' are PAgP modes, not LACP."
                },
                {
                    question: "Which IEEE standard defines the operation of wireless LANs and encompasses protocols like 802.11ac and 802.11ax?",
                    options: [
                        "IEEE 802.11",
                        "IEEE 802.3",
                        "IEEE 802.1Q",
                        "IEEE 802.1D"
                    ],
                    explanation: "IEEE 802.11 is the family of standards for wireless LANs (Wi-Fi). 802.11ac (Wi-Fi 5) and 802.11ax (Wi-Fi 6/6E) are amendments within this family. 802.3 is Ethernet. 802.1Q defines VLAN tagging. 802.1D defines Spanning Tree Protocol."
                },
                {
                    question: "What is the maximum theoretical data rate of 802.11ax (Wi-Fi 6) compared to 802.11ac (Wi-Fi 5)?",
                    options: [
                        "Wi-Fi 6 supports up to 9.6 Gbps vs. Wi-Fi 5's 6.9 Gbps, with better efficiency in dense environments",
                        "Wi-Fi 6 supports up to 3.5 Gbps vs. Wi-Fi 5's 1.3 Gbps",
                        "Both support the same maximum data rate but Wi-Fi 6 uses different frequency bands",
                        "Wi-Fi 6 supports up to 54 Mbps, the same as Wi-Fi 5"
                    ],
                    explanation: "802.11ax (Wi-Fi 6) has a maximum theoretical throughput of 9.6 Gbps (vs. 6.9 Gbps for 802.11ac). More importantly, Wi-Fi 6 introduces OFDMA and MU-MIMO improvements that dramatically improve real-world performance in high-density environments like classrooms and stadiums."
                },
                {
                    question: "In a Cisco wireless deployment, what is the role of a Wireless LAN Controller (WLC)?",
                    options: [
                        "Centrally manages and configures lightweight access points, handling authentication, roaming, and RF management",
                        "Acts as a Layer 2 switch connecting access points to the wired network",
                        "Provides DHCP services exclusively to wireless clients",
                        "Encrypts all traffic between access points using IPsec tunnels"
                    ],
                    explanation: "A WLC centralizes management of lightweight APs (LAPs) using the CAPWAP protocol. It handles client authentication, seamless roaming between APs, channel assignment, power level management, and security policies. Without a WLC, each AP must be configured individually (autonomous mode)."
                },
                {
                    question: "Cisco Meraki uses which management approach for wireless network administration?",
                    options: [
                        "Cloud-managed — all configuration, monitoring, and firmware updates are handled through a cloud dashboard",
                        "On-premises controller — a local WLC manages all Meraki APs",
                        "CLI-only — each Meraki AP is configured via SSH",
                        "Autonomous — each AP operates independently with local configuration"
                    ],
                    explanation: "Meraki is Cisco's cloud-managed platform. All device configuration, monitoring, troubleshooting, and firmware updates are managed through the Meraki cloud dashboard (dashboard.meraki.com). No on-premises controller is needed. This simplifies deployment and centralized management for distributed locations."
                },
                {
                    question: "Which command displays the VLAN assignments for all switch ports on a Cisco switch?",
                    options: [
                        "show vlan brief",
                        "show interfaces trunk",
                        "show spanning-tree",
                        "show mac address-table"
                    ],
                    explanation: "'show vlan brief' lists all VLANs on the switch and which access ports are assigned to each VLAN. 'show interfaces trunk' shows trunk port status and allowed VLANs. 'show spanning-tree' shows STP topology. 'show mac address-table' shows learned MAC addresses per port."
                },
                {
                    question: "A switch port is configured with 'switchport mode dynamic auto'. Under what condition will it become a trunk?",
                    options: [
                        "Only if the other side is set to trunk or dynamic desirable — it will not initiate trunking on its own",
                        "It will always become a trunk regardless of the other side's configuration",
                        "It will become a trunk only if both sides are set to dynamic auto",
                        "It will never trunk; dynamic auto always remains in access mode"
                    ],
                    explanation: "Dynamic auto passively waits for the other side to request trunking via DTP. It becomes a trunk only if the neighbor is set to 'trunk' or 'dynamic desirable'. Two 'dynamic auto' ports will NOT form a trunk because neither side initiates. Best practice is to manually set ports to access or trunk to avoid DTP-based attacks."
                }
            ]
        });
        quiz.start();
    </script>
