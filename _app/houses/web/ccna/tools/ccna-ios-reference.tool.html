<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco IOS Command Reference | CCNA Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #090910;
            --bg-card: #111120;
            --bg-card-hover: #181830;
            --cisco-primary: #10b981;
            --cisco-dim: rgba(16, 185, 129, 0.12);
            --cisco-border: rgba(16, 185, 129, 0.2);
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --text-muted: #5a6370;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .tool-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tool-header-left { display: flex; align-items: center; gap: 15px; }
        .tool-badge {
            background: var(--cisco-primary);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        .tool-header h1 { font-size: 1.1rem; font-weight: 600; color: var(--cisco-primary); }
        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--cisco-primary); border-color: var(--cisco-border); }
        .back-link img { width: 14px; height: 14px; opacity: 0.7; }

        /* Main Layout */
        .tool-body { max-width: 1200px; margin: 0 auto; padding: 25px 20px; }

        /* Search & Filters */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 280px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--cisco-primary); }
        .search-input::placeholder { color: var(--text-muted); }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .filter-btn:hover { border-color: var(--cisco-border); color: var(--text-primary); }
        .filter-btn.active {
            background: var(--cisco-dim);
            border-color: var(--cisco-primary);
            color: var(--cisco-primary);
        }

        .result-count {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 16px;
        }

        /* Mode filter */
        .mode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .mode-tag {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .mode-tag:hover { border-color: var(--cisco-border); color: var(--text-secondary); }
        .mode-tag.active { background: rgba(59,130,246,0.1); border-color: var(--info); color: var(--info); }

        /* Command Cards */
        .cmd-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .cmd-card:hover { border-color: var(--cisco-border); }
        .cmd-summary {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }
        .cmd-expand-icon {
            color: var(--text-muted);
            font-size: 0.7rem;
            transition: transform 0.2s;
            flex-shrink: 0;
            width: 16px;
            text-align: center;
        }
        .cmd-card.open .cmd-expand-icon { transform: rotate(90deg); }
        .cmd-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: var(--cisco-primary);
            font-weight: 500;
            flex-shrink: 0;
        }
        .cmd-desc {
            color: var(--text-secondary);
            font-size: 0.8rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmd-mode-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 3px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .cmd-mode-badge.priv { background: rgba(239,68,68,0.12); color: #f87171; }
        .cmd-mode-badge.global { background: rgba(245,158,11,0.12); color: #fbbf24; }
        .cmd-mode-badge.iface { background: rgba(59,130,246,0.12); color: #60a5fa; }
        .cmd-mode-badge.router { background: rgba(168,85,247,0.12); color: #c084fc; }
        .cmd-mode-badge.rommon { background: rgba(107,114,128,0.12); color: #9ca3af; }
        .cmd-mode-badge.line { background: rgba(20,184,166,0.12); color: #5eead4; }
        .cmd-mode-badge.acl { background: rgba(236,72,153,0.12); color: #f472b6; }
        .cmd-mode-badge.vlan { background: rgba(34,197,94,0.12); color: #4ade80; }

        .cmd-cat-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 3px;
            flex-shrink: 0;
            background: var(--cisco-dim);
            color: var(--cisco-primary);
        }

        .cmd-detail {
            display: none;
            border-top: 1px solid var(--border);
            padding: 16px;
            background: rgba(0,0,0,0.2);
        }
        .cmd-card.open .cmd-detail { display: block; }

        .detail-section { margin-bottom: 14px; }
        .detail-section:last-child { margin-bottom: 0; }
        .detail-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .detail-syntax {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            background: #0a0a18;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--cisco-primary);
            overflow-x: auto;
        }
        .detail-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .detail-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            background: #0a0a18;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            color: #c9d1d9;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.5;
        }
        .detail-tip {
            background: rgba(16,185,129,0.06);
            border-left: 3px solid var(--cisco-primary);
            padding: 8px 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-radius: 0 6px 6px 0;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state img { width: 48px; height: 48px; opacity: 0.4; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; }

        @media (max-width: 768px) {
            .cmd-desc { display: none; }
            .cmd-summary { padding: 10px 12px; gap: 8px; }
            .tool-header { padding: 12px 15px; }
            .tool-header h1 { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<header class="tool-header">
    <div class="tool-header-left">
        <span class="tool-badge">IOS REF</span>
        <h1>Cisco IOS Command Reference</h1>
    </div>
    <a href="../index.html" class="back-link">
        <img src="/assets/images/icons/icon-arrow-left.webp" alt="">
        CCNA Hub
    </a>
</header>

<div class="tool-body">
    <div class="search-bar">
        <input type="text" class="search-input" id="searchBox" placeholder="Search commands... (e.g. show ip route, ospf, vlan)">
    </div>

    <div class="filter-bar" id="categoryFilters"></div>
    <div class="mode-bar" id="modeFilters"></div>
    <div class="result-count" id="resultCount"></div>
    <div id="commandList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
        <img src="/assets/images/icons/icon-magnifier.webp" alt="">
        <p>No commands match your search</p>
    </div>
</div>

<script>
const COMMANDS = [
/* ── Device Management ── */
{cmd:"enable",syntax:"enable",mode:"User EXEC",modeClass:"priv",cat:"Device Management",desc:"Enter privileged EXEC mode",output:"Router> enable\nRouter#",tip:"Default enable secret is not set; configure one immediately."},
{cmd:"configure terminal",syntax:"configure terminal",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Enter global configuration mode",output:"Router# configure terminal\nRouter(config)#",tip:"Abbreviation: conf t"},
{cmd:"hostname",syntax:"hostname <name>",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Set the device hostname",output:"Router(config)# hostname CoreSwitch\nCoreSwitch(config)#",tip:"Hostname appears in the prompt and in CDP/LLDP advertisements."},
{cmd:"enable secret",syntax:"enable secret <password>",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Set an encrypted enable password (MD5 hash)",output:"Router(config)# enable secret Str0ngP@ss",tip:"Always use 'enable secret' over 'enable password' -- secret uses MD5 hashing."},
{cmd:"service password-encryption",syntax:"service password-encryption",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Encrypt all plaintext passwords in running-config (Type 7)",output:"Router(config)# service password-encryption",tip:"Type 7 is weak but better than plaintext. Use enable secret for strong hashing."},
{cmd:"copy running-config startup-config",syntax:"copy running-config startup-config",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Save the running configuration to NVRAM",output:"Router# copy running-config startup-config\nDestination filename [startup-config]?\nBuilding configuration...\n[OK]",tip:"Abbreviation: copy run start. Also: write memory (wr mem)."},
{cmd:"write erase",syntax:"write erase",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Erase the startup configuration",output:"Router# write erase\nErasing the nvram filesystem will remove all configuration files! Continue? [confirm]\n[OK]",tip:"Follow with 'reload' to factory-reset the device."},
{cmd:"reload",syntax:"reload",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Restart the device",output:"Router# reload\nProceed with reload? [confirm]",tip:"Save config first! Unsaved changes are lost on reload."},
{cmd:"show running-config",syntax:"show running-config [| section <keyword>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Display the current active configuration in RAM",output:"Router# show running-config\nBuilding configuration...\n\nCurrent configuration : 1482 bytes\n!\nhostname Router\n!\ninterface GigabitEthernet0/0\n ip address 192.168.1.1 255.255.255.0\n no shutdown\n!",tip:"Pipe to section: show run | section interface"},
{cmd:"show startup-config",syntax:"show startup-config",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Display the saved configuration in NVRAM",output:"Router# show startup-config\nUsing 1482 out of 262144 bytes\n...",tip:"Compare with running-config to see unsaved changes."},
{cmd:"show version",syntax:"show version",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Display IOS version, uptime, hardware, and license info",output:"Router# show version\nCisco IOS Software, Version 15.7(3)M5\nSystem uptime is 14 days, 3 hours, 22 minutes\nSystem image file is \"flash:c2900-universalk9-mz.SPA.157-3.M5.bin\"\nProcessor board ID FTX1234A5BC\n512K bytes of NVRAM\n256MB of Flash",tip:"Key for troubleshooting -- shows IOS version, uptime, interfaces, memory."},
{cmd:"show clock",syntax:"show clock [detail]",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Display the system clock",output:"Router# show clock\n*14:32:07.123 UTC Sun Apr 6 2026",tip:"Asterisk (*) means clock is not synchronized with NTP."},
{cmd:"clock set",syntax:"clock set <hh:mm:ss> <day> <month> <year>",mode:"Privileged EXEC",modeClass:"priv",cat:"Device Management",desc:"Manually set the system clock",output:"Router# clock set 14:30:00 6 April 2026",tip:"Use NTP for production; manual clock drifts."},
{cmd:"banner motd",syntax:"banner motd #<message>#",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Set the message of the day login banner",output:"Router(config)# banner motd #Authorized Access Only!#",tip:"Use a delimiter character (#) that does not appear in your message."},
{cmd:"no ip domain-lookup",syntax:"no ip domain-lookup",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Disable DNS lookup for mistyped commands",output:"Router(config)# no ip domain-lookup",tip:"Prevents the annoying pause when you mistype a command and IOS tries to resolve it as a hostname."},

/* ── Interface Configuration ── */
{cmd:"interface",syntax:"interface <type> <number>",mode:"Global Config",modeClass:"global",cat:"Interface Config",desc:"Enter interface configuration mode",output:"Router(config)# interface GigabitEthernet0/0\nRouter(config-if)#",tip:"Abbreviations: int g0/0, int fa0/1, int lo0"},
{cmd:"ip address",syntax:"ip address <ip> <subnet-mask>",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Assign an IPv4 address and mask to an interface",output:"Router(config-if)# ip address 192.168.1.1 255.255.255.0",tip:"Remember: IOS uses subnet mask (not prefix length) for IPv4."},
{cmd:"ipv6 address",syntax:"ipv6 address <ipv6-prefix/length>",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Assign an IPv6 address to an interface",output:"Router(config-if)# ipv6 address 2001:db8:1::1/64",tip:"Also supports 'ipv6 address autoconfig' for SLAAC."},
{cmd:"no shutdown",syntax:"no shutdown",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Administratively enable an interface",output:"Router(config-if)# no shutdown\n%LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up",tip:"Interfaces are shutdown by default on routers. Switches default to no shutdown."},
{cmd:"shutdown",syntax:"shutdown",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Administratively disable an interface",output:"Router(config-if)# shutdown\n%LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to administratively down",tip:"Use to disable unused ports -- a security best practice."},
{cmd:"description",syntax:"description <text>",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Set a description label on the interface",output:"Router(config-if)# description Link to Branch Office",tip:"Descriptions are visible in show interfaces and show run."},
{cmd:"speed",syntax:"speed {10 | 100 | 1000 | auto}",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Set the interface speed",output:"Switch(config-if)# speed 1000",tip:"Mismatched speed/duplex causes performance issues."},
{cmd:"duplex",syntax:"duplex {auto | full | half}",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Set the interface duplex mode",output:"Switch(config-if)# duplex full",tip:"Modern links should be full duplex. Half duplex = collisions."},
{cmd:"ip address dhcp",syntax:"ip address dhcp",mode:"Interface Config",modeClass:"iface",cat:"Interface Config",desc:"Configure interface to obtain IP via DHCP",output:"Router(config-if)# ip address dhcp",tip:"Common on WAN interfaces connecting to ISP."},
{cmd:"show interfaces",syntax:"show interfaces [<type> <number>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Interface Config",desc:"Display detailed interface status and statistics",output:"Router# show interfaces GigabitEthernet0/0\nGigabitEthernet0/0 is up, line protocol is up\n  Hardware is iGbE, address is aabb.cc00.0100\n  Internet address is 192.168.1.1/24\n  MTU 1500 bytes, BW 1000000 Kbit/sec, DLY 10 usec,\n  reliability 255/255, txload 1/255, rxload 1/255\n  5 minute input rate 1000 bits/sec, 12 packets/sec\n  5 minute output rate 2000 bits/sec, 8 packets/sec",tip:"Check for errors, CRC, collisions, and input/output drops."},
{cmd:"show ip interface brief",syntax:"show ip interface brief",mode:"Privileged EXEC",modeClass:"priv",cat:"Interface Config",desc:"Show summary of all interfaces with IP and status",output:"Router# show ip interface brief\nInterface              IP-Address      OK? Method Status                Protocol\nGi0/0                  192.168.1.1     YES manual up                    up\nGi0/1                  10.0.0.1        YES manual up                    up\nSe0/0/0                unassigned      YES unset  administratively down down",tip:"Quick way to check which interfaces are up/down and their IPs."},
{cmd:"show interfaces status",syntax:"show interfaces status",mode:"Privileged EXEC",modeClass:"priv",cat:"Interface Config",desc:"Show port status summary (switch only)",output:"Switch# show interfaces status\nPort    Name         Status    Vlan  Duplex Speed Type\nFa0/1   Server1      connected 10    a-full a-100 10/100BaseTX\nFa0/2                notconnect 1    auto   auto  10/100BaseTX\nGi0/1   Uplink       connected trunk a-full a-1000 10/100/1000BaseTX",tip:"Shows VLAN assignment, speed, duplex, and port name at a glance."},

/* ── Routing ── */
{cmd:"ip route",syntax:"ip route <network> <mask> {<next-hop> | <exit-interface>} [<AD>]",mode:"Global Config",modeClass:"global",cat:"Routing",desc:"Configure a static route",output:"Router(config)# ip route 10.10.0.0 255.255.0.0 192.168.1.2\nRouter(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1",tip:"0.0.0.0 0.0.0.0 = default route (gateway of last resort)."},
{cmd:"show ip route",syntax:"show ip route [<protocol> | <network>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Routing",desc:"Display the IP routing table",output:"Router# show ip route\nCodes: C - connected, S - static, O - OSPF, D - EIGRP\n\nGateway of last resort is 203.0.113.1 to network 0.0.0.0\n\nS*   0.0.0.0/0 [1/0] via 203.0.113.1\nC    192.168.1.0/24 is directly connected, GigabitEthernet0/0\nL    192.168.1.1/32 is directly connected, GigabitEthernet0/0\nO    10.0.0.0/24 [110/2] via 192.168.1.2, 00:05:12, GigabitEthernet0/0",tip:"C=connected, L=local, S=static, O=OSPF, D=EIGRP. Lower AD is preferred."},
{cmd:"router ospf",syntax:"router ospf <process-id>",mode:"Global Config",modeClass:"global",cat:"Routing",desc:"Enter OSPF router configuration mode",output:"Router(config)# router ospf 1\nRouter(config-router)#",tip:"Process ID is locally significant -- does not need to match on neighbors."},
{cmd:"network (OSPF)",syntax:"network <ip> <wildcard> area <area-id>",mode:"Router Config",modeClass:"router",cat:"Routing",desc:"Enable OSPF on interfaces matching the network/wildcard",output:"Router(config-router)# network 192.168.1.0 0.0.0.255 area 0\nRouter(config-router)# network 10.0.0.0 0.0.0.255 area 1",tip:"Wildcard mask is the inverse of subnet mask. 0.0.0.255 = /24."},
{cmd:"router-id",syntax:"router-id <A.B.C.D>",mode:"Router Config",modeClass:"router",cat:"Routing",desc:"Manually set the OSPF router ID",output:"Router(config-router)# router-id 1.1.1.1",tip:"Requires 'clear ip ospf process' to take effect if OSPF is already running."},
{cmd:"passive-interface",syntax:"passive-interface {<interface> | default}",mode:"Router Config",modeClass:"router",cat:"Routing",desc:"Suppress OSPF hello packets on an interface",output:"Router(config-router)# passive-interface GigabitEthernet0/1",tip:"Use on LAN-facing interfaces where no OSPF neighbors exist. Saves bandwidth and improves security."},
{cmd:"default-information originate",syntax:"default-information originate [always]",mode:"Router Config",modeClass:"router",cat:"Routing",desc:"Advertise a default route into OSPF",output:"Router(config-router)# default-information originate always",tip:"'always' injects the default route even if one is not in the routing table."},
{cmd:"show ip ospf neighbor",syntax:"show ip ospf neighbor",mode:"Privileged EXEC",modeClass:"priv",cat:"Routing",desc:"Show OSPF neighbor adjacencies",output:"Router# show ip ospf neighbor\n\nNeighbor ID  Pri State       Dead Time Address      Interface\n2.2.2.2        1 FULL/DR     00:00:33  192.168.1.2  Gi0/0\n3.3.3.3        1 FULL/BDR    00:00:31  192.168.1.3  Gi0/0",tip:"FULL = adjacency formed. 2WAY = seen but not adjacent (non-DR/BDR on multiaccess)."},
{cmd:"show ip ospf interface",syntax:"show ip ospf interface [brief]",mode:"Privileged EXEC",modeClass:"priv",cat:"Routing",desc:"Show OSPF-enabled interfaces with area, cost, and network type",output:"Router# show ip ospf interface brief\nInterface   PID Area  IP Address/Mask   Cost State Nbrs F/C\nGi0/0       1   0     192.168.1.1/24    1    DR    2/2\nGi0/1       1   1     10.0.0.1/24       1    P2P   1/1",tip:"Check cost and network type. Point-to-point does not elect DR/BDR."},
{cmd:"show ip ospf database",syntax:"show ip ospf database",mode:"Privileged EXEC",modeClass:"priv",cat:"Routing",desc:"Display the OSPF link-state database (LSDB)",output:"Router# show ip ospf database\n\n            OSPF Router with ID (1.1.1.1) (Process ID 1)\n\n                Router Link States (Area 0)\nLink ID      ADV Router   Age  Seq#       Checksum Link count\n1.1.1.1      1.1.1.1      312  0x80000005 0x00E8A2 3\n2.2.2.2      2.2.2.2      284  0x80000004 0x00C3B1 2",tip:"All routers in the same area should have identical LSDB entries."},
{cmd:"ip ospf cost",syntax:"ip ospf cost <value>",mode:"Interface Config",modeClass:"iface",cat:"Routing",desc:"Manually set the OSPF cost on an interface",output:"Router(config-if)# ip ospf cost 10",tip:"Cost = reference-bandwidth / interface-bandwidth. Default ref BW = 100 Mbps."},
{cmd:"auto-cost reference-bandwidth",syntax:"auto-cost reference-bandwidth <mbps>",mode:"Router Config",modeClass:"router",cat:"Routing",desc:"Change the OSPF reference bandwidth for cost calculation",output:"Router(config-router)# auto-cost reference-bandwidth 10000",tip:"Set to 10000 for 10G links. Must be consistent across all OSPF routers."},
{cmd:"ip ospf priority",syntax:"ip ospf priority <0-255>",mode:"Interface Config",modeClass:"iface",cat:"Routing",desc:"Set OSPF priority for DR/BDR election",output:"Router(config-if)# ip ospf priority 200",tip:"Priority 0 = never become DR. Highest priority wins. Ties broken by router-id."},
{cmd:"ip ospf network",syntax:"ip ospf network {broadcast | point-to-point | non-broadcast}",mode:"Interface Config",modeClass:"iface",cat:"Routing",desc:"Set the OSPF network type on an interface",output:"Router(config-if)# ip ospf network point-to-point",tip:"Point-to-point skips DR/BDR election -- faster convergence."},
{cmd:"show ip protocols",syntax:"show ip protocols",mode:"Privileged EXEC",modeClass:"priv",cat:"Routing",desc:"Show active routing protocols and their configuration",output:"Router# show ip protocols\nRouting Protocol is \"ospf 1\"\n  Router ID: 1.1.1.1\n  Number of areas in this router is 2\n  Reference bandwidth unit is 100 mbps\n  Routing for Networks:\n    192.168.1.0 0.0.0.255 area 0\n    10.0.0.0 0.0.0.255 area 1",tip:"Shows router-id, networks, AD values, and timers for all routing protocols."},

/* ── Switching ── */
{cmd:"vlan",syntax:"vlan <id>",mode:"Global Config",modeClass:"global",cat:"Switching",desc:"Create a VLAN or enter VLAN configuration mode",output:"Switch(config)# vlan 10\nSwitch(config-vlan)# name Sales",tip:"VLANs 1, 1002-1005 are reserved. Use 2-1001 for normal VLANs."},
{cmd:"switchport mode access",syntax:"switchport mode access",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Set the port as an access port (single VLAN)",output:"Switch(config-if)# switchport mode access",tip:"Access ports connect to end devices. Always set explicitly to prevent DTP negotiation."},
{cmd:"switchport access vlan",syntax:"switchport access vlan <id>",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Assign the access port to a specific VLAN",output:"Switch(config-if)# switchport access vlan 10",tip:"If the VLAN does not exist, IOS creates it automatically."},
{cmd:"switchport mode trunk",syntax:"switchport mode trunk",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Set the port as a trunk port (carries multiple VLANs)",output:"Switch(config-if)# switchport mode trunk",tip:"Trunk ports connect switches and carry 802.1Q tagged frames."},
{cmd:"switchport trunk allowed vlan",syntax:"switchport trunk allowed vlan {<vlan-list> | add <vlan> | remove <vlan> | all}",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Restrict which VLANs are allowed on a trunk",output:"Switch(config-if)# switchport trunk allowed vlan 10,20,30\nSwitch(config-if)# switchport trunk allowed vlan add 40",tip:"Best practice: only allow VLANs that are actually needed on the trunk."},
{cmd:"switchport trunk native vlan",syntax:"switchport trunk native vlan <id>",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Set the native VLAN for untagged trunk traffic",output:"Switch(config-if)# switchport trunk native vlan 99",tip:"Native VLAN mismatch between switches causes connectivity issues. Must match on both ends."},
{cmd:"show vlan brief",syntax:"show vlan brief",mode:"Privileged EXEC",modeClass:"priv",cat:"Switching",desc:"Display VLAN information and port assignments",output:"Switch# show vlan brief\n\nVLAN Name                Status    Ports\n---- ------------------- --------- -----------------------\n1    default             active    Fa0/5, Fa0/6\n10   Sales               active    Fa0/1, Fa0/2\n20   Engineering         active    Fa0/3, Fa0/4\n99   Management          active",tip:"Trunk ports do NOT appear in show vlan brief. Use show interfaces trunk instead."},
{cmd:"show interfaces trunk",syntax:"show interfaces trunk",mode:"Privileged EXEC",modeClass:"priv",cat:"Switching",desc:"Show trunk ports, native VLAN, and allowed VLANs",output:"Switch# show interfaces trunk\n\nPort      Mode     Encapsulation Status    Native vlan\nGi0/1     on       802.1q        trunking  99\n\nPort      Vlans allowed on trunk\nGi0/1     10,20,30,99",tip:"Check native VLAN matches on both sides of the trunk."},
{cmd:"show mac address-table",syntax:"show mac address-table [dynamic | address <mac> | interface <intf>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Switching",desc:"Display the MAC address table",output:"Switch# show mac address-table\n          Mac Address Table\n-------------------------------------------\nVlan  Mac Address     Type     Ports\n----  -----------     ------   -----\n  10  aabb.cc00.0100  DYNAMIC  Fa0/1\n  20  aabb.cc00.0200  DYNAMIC  Fa0/3\n   1  aabb.cc00.0300  DYNAMIC  Gi0/1",tip:"Dynamic entries age out after 300 seconds by default."},
{cmd:"show spanning-tree",syntax:"show spanning-tree [vlan <id>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Switching",desc:"Display STP status, root bridge, and port roles",output:"Switch# show spanning-tree vlan 10\n\nVLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority  24586\n             Address   aabb.cc00.0100\n  Bridge ID  Priority  32778\n             Address   aabb.cc00.0200\n\nInterface    Role Sts  Cost  Prio.Nbr\n-----------  ---- ---  ----  --------\nFa0/1        Root FWD  19    128.1\nFa0/2        Desg FWD  19    128.2\nGi0/1        Altn BLK  4     128.25",tip:"Root=towards root bridge, Desg=away from root, Altn=blocked backup."},
{cmd:"spanning-tree vlan priority",syntax:"spanning-tree vlan <id> priority <value>",mode:"Global Config",modeClass:"global",cat:"Switching",desc:"Set STP priority for a VLAN (controls root bridge election)",output:"Switch(config)# spanning-tree vlan 10 priority 4096",tip:"Priority must be a multiple of 4096. Lower wins. Default = 32768."},
{cmd:"spanning-tree portfast",syntax:"spanning-tree portfast",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Skip STP listening/learning on access ports (immediate forwarding)",output:"Switch(config-if)# spanning-tree portfast\n%Warning: portfast should only be enabled on ports connected to a single host.",tip:"Only use on access ports to end devices. Never on trunk/switch ports -- can cause loops."},
{cmd:"spanning-tree bpduguard enable",syntax:"spanning-tree bpduguard enable",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Shutdown port if a BPDU is received (protects against rogue switches)",output:"Switch(config-if)# spanning-tree bpduguard enable",tip:"Pair with PortFast. If a switch is plugged into this port, it gets err-disabled."},
{cmd:"interface vlan",syntax:"interface vlan <id>",mode:"Global Config",modeClass:"global",cat:"Switching",desc:"Create or enter a Switch Virtual Interface (SVI) for inter-VLAN routing",output:"Switch(config)# interface vlan 10\nSwitch(config-if)# ip address 192.168.10.1 255.255.255.0\nSwitch(config-if)# no shutdown",tip:"SVIs require a Layer 3 switch with 'ip routing' enabled."},
{cmd:"ip routing",syntax:"ip routing",mode:"Global Config",modeClass:"global",cat:"Switching",desc:"Enable Layer 3 routing on a multilayer switch",output:"Switch(config)# ip routing",tip:"Required for inter-VLAN routing on a Layer 3 switch."},
{cmd:"switchport nonegotiate",syntax:"switchport nonegotiate",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Disable DTP negotiation on a trunk port",output:"Switch(config-if)# switchport nonegotiate",tip:"Prevents VLAN hopping attacks via DTP. Best practice on all trunks."},

/* ── Security ── */
{cmd:"access-list (standard)",syntax:"access-list <1-99> {permit|deny} <source> [<wildcard>]",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Create a numbered standard ACL (filters by source IP only)",output:"Router(config)# access-list 10 permit 192.168.1.0 0.0.0.255\nRouter(config)# access-list 10 deny any",tip:"Standard ACLs: place close to the destination. Only match source IP."},
{cmd:"access-list (extended)",syntax:"access-list <100-199> {permit|deny} <protocol> <src> <src-wc> <dst> <dst-wc> [eq <port>]",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Create a numbered extended ACL (filters by source, dest, protocol, port)",output:"Router(config)# access-list 100 permit tcp 192.168.1.0 0.0.0.255 10.0.0.0 0.0.0.255 eq 80\nRouter(config)# access-list 100 deny ip any any",tip:"Extended ACLs: place close to the source. Can match protocol, ports, and both IPs."},
{cmd:"ip access-list",syntax:"ip access-list {standard|extended} <name>",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Create a named ACL (easier to edit than numbered)",output:"Router(config)# ip access-list extended WEB-FILTER\nRouter(config-ext-nacl)# permit tcp any any eq 443\nRouter(config-ext-nacl)# deny ip any any",tip:"Named ACLs allow inserting/removing individual entries by sequence number."},
{cmd:"ip access-group",syntax:"ip access-group {<number>|<name>} {in|out}",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Apply an ACL to an interface (inbound or outbound)",output:"Router(config-if)# ip access-group 100 in",tip:"'in' = filter packets entering the interface. 'out' = filter packets leaving."},
{cmd:"show access-lists",syntax:"show access-lists [<number>|<name>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Security",desc:"Display all configured ACLs and match counts",output:"Router# show access-lists\nExtended IP access list 100\n    10 permit tcp 192.168.1.0 0.0.0.255 10.0.0.0 0.0.0.255 eq www (45 matches)\n    20 deny ip any any (12 matches)",tip:"Match counts help verify ACL is working. Implicit deny at end has no counter."},
{cmd:"switchport port-security",syntax:"switchport port-security",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Enable port security on the interface",output:"Switch(config-if)# switchport port-security",tip:"Interface must be in access mode first. Limits MAC addresses on the port."},
{cmd:"switchport port-security maximum",syntax:"switchport port-security maximum <count>",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Set maximum allowed MAC addresses on a secured port",output:"Switch(config-if)# switchport port-security maximum 2",tip:"Default is 1. Set based on expected devices (e.g., 2 for IP phone + PC)."},
{cmd:"switchport port-security violation",syntax:"switchport port-security violation {shutdown|restrict|protect}",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Set action when a port security violation occurs",output:"Switch(config-if)# switchport port-security violation restrict",tip:"shutdown=err-disable port (default), restrict=drop+log, protect=drop silently."},
{cmd:"switchport port-security mac-address sticky",syntax:"switchport port-security mac-address sticky",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Dynamically learn and save MAC addresses to running-config",output:"Switch(config-if)# switchport port-security mac-address sticky",tip:"Learned MACs persist in running-config. Save with 'copy run start' to survive reboot."},
{cmd:"show port-security interface",syntax:"show port-security interface <intf>",mode:"Privileged EXEC",modeClass:"priv",cat:"Security",desc:"Show port security status for a specific interface",output:"Switch# show port-security interface Fa0/1\nPort Security              : Enabled\nPort Status                : Secure-up\nViolation Mode             : Restrict\nMaximum MAC Addresses      : 2\nTotal MAC Addresses        : 1\nSticky MAC Addresses       : 1\nSecurity Violation Count   : 3",tip:"Check violation count to see if unauthorized devices attempted connection."},
{cmd:"ip dhcp snooping",syntax:"ip dhcp snooping",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Enable DHCP snooping globally",output:"Switch(config)# ip dhcp snooping\nSwitch(config)# ip dhcp snooping vlan 10,20",tip:"Prevents rogue DHCP servers. Marks all ports as untrusted by default."},
{cmd:"ip dhcp snooping trust",syntax:"ip dhcp snooping trust",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Mark a port as trusted for DHCP snooping (uplink/server port)",output:"Switch(config-if)# ip dhcp snooping trust",tip:"Only trust ports connecting to legitimate DHCP servers or uplinks."},
{cmd:"line console 0",syntax:"line console 0",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Enter console line configuration mode",output:"Router(config)# line console 0\nRouter(config-line)# password cisco\nRouter(config-line)# login",tip:"Always set console password and enable 'login' to require it."},
{cmd:"line vty 0 15",syntax:"line vty 0 15",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Configure virtual terminal lines (SSH/Telnet access)",output:"Router(config)# line vty 0 15\nRouter(config-line)# transport input ssh\nRouter(config-line)# login local",tip:"Use 'transport input ssh' to disable Telnet. Pair with 'login local' and local usernames."},
{cmd:"username",syntax:"username <name> secret <password>",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Create a local user account with hashed password",output:"Router(config)# username admin secret S3cure!Pass",tip:"Use 'secret' not 'password' for MD5 hashing."},
{cmd:"crypto key generate rsa",syntax:"crypto key generate rsa modulus <bits>",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Generate RSA keys for SSH (required before enabling SSH)",output:"Router(config)# crypto key generate rsa modulus 2048\nThe name for the keys will be: Router.lab.local\n% Generating 2048 bit RSA keys...[OK]",tip:"Minimum 768 bits for SSHv2. Use 2048 for production."},
{cmd:"ip ssh version 2",syntax:"ip ssh version 2",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Force SSH version 2 (more secure than v1)",output:"Router(config)# ip ssh version 2",tip:"Requires RSA keys of at least 768 bits. Always use v2."},
{cmd:"ip access-class",syntax:"access-class {<number>|<name>} {in|out}",mode:"Line Config",modeClass:"line",cat:"Security",desc:"Apply an ACL to VTY lines to restrict management access",output:"Router(config-line)# access-class 10 in",tip:"Restricts which IPs can SSH/Telnet to the device. Critical for management plane security."},

/* ── Monitoring ── */
{cmd:"show ip arp",syntax:"show ip arp",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Display the ARP table (IP-to-MAC mappings)",output:"Router# show ip arp\nProtocol  Address      Age (min)  Hardware Addr   Type  Interface\nInternet  192.168.1.1        -    aabb.cc00.0100  ARPA  Gi0/0\nInternet  192.168.1.2       10    aabb.cc00.0200  ARPA  Gi0/0",tip:"Age '-' means it is the device's own interface entry."},
{cmd:"show cdp neighbors",syntax:"show cdp neighbors [detail]",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show directly connected Cisco devices (Cisco Discovery Protocol)",output:"Router# show cdp neighbors\nDevice ID    Local Intrfce  Holdtme  Capability Platform  Port ID\nSwitch1      Gig 0/0        155      S I        WS-C3560  Fas 0/24\nRouter2      Gig 0/1        131      R S I      ISR4331   Gig 0/0",tip:"CDP is Cisco proprietary. Use LLDP for multi-vendor environments."},
{cmd:"show lldp neighbors",syntax:"show lldp neighbors [detail]",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show directly connected devices via LLDP (vendor-neutral)",output:"Router# show lldp neighbors\nDevice ID    Local Intf   Hold-time  Capability Port ID\nLinuxSrv     Gi0/1        120                   eth0",tip:"LLDP must be enabled first: 'lldp run' in global config."},
{cmd:"show ip nat translations",syntax:"show ip nat translations",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Display the NAT translation table",output:"Router# show ip nat translations\nPro Inside global    Inside local     Outside local    Outside global\ntcp 203.0.113.1:80   192.168.1.10:80  10.1.1.1:49152   10.1.1.1:49152\n--- 203.0.113.1      192.168.1.10     ---              ---",tip:"Inside local = private IP. Inside global = public IP (post-NAT)."},
{cmd:"show ip nat statistics",syntax:"show ip nat statistics",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show NAT hit counts, pool usage, and configuration summary",output:"Router# show ip nat statistics\nTotal active translations: 12 (1 static, 11 dynamic; 8 extended)\nPeak translations: 24\nOutside interfaces: GigabitEthernet0/0\nInside interfaces: GigabitEthernet0/1\nHits: 2458  Misses: 12",tip:"High miss count may indicate NAT pool exhaustion."},
{cmd:"show etherchannel summary",syntax:"show etherchannel summary",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show EtherChannel groups and member port status",output:"Switch# show etherchannel summary\nGroup Port-channel  Protocol  Ports\n------+-------------+-----------+------\n1     Po1(SU)       LACP      Fa0/1(P)  Fa0/2(P)\n2     Po2(SD)       PAgP      Fa0/3(D)  Fa0/4(D)",tip:"P=bundled, D=down, S=suspended. SU=layer2 up, RU=layer3 up."},
{cmd:"show ip dhcp binding",syntax:"show ip dhcp binding",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show DHCP leases issued by this router",output:"Router# show ip dhcp binding\nBindings from all pools not associated with VRF:\nIP address     Client-ID             Lease expiration       Type\n192.168.1.100  0100.aabb.cc00.01     Apr 07 2026 02:30 AM   Automatic\n192.168.1.101  0100.aabb.cc00.02     Apr 07 2026 03:15 AM   Automatic",tip:"Verify clients are getting addresses from the correct pool."},
{cmd:"show ip dhcp pool",syntax:"show ip dhcp pool [<name>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show DHCP pool statistics and configuration",output:"Router# show ip dhcp pool\nPool LAN :\n Utilization mark (high/low): 100 / 0\n Subnet size (first/next): 0 / 0\n Total addresses: 254\n Leased addresses: 12\n Pending event: none\n 1 subnet is currently in the pool\n Current index IP address range           Leased/Excluded/Total\n 192.168.1.100  192.168.1.1 - 192.168.1.254  12/5/254",tip:"Check total vs. leased to see pool utilization."},
{cmd:"show ntp status",syntax:"show ntp status",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Display NTP synchronization status",output:"Router# show ntp status\nClock is synchronized, stratum 3, reference is 10.0.0.1\nnominal freq is 250.0000 Hz, actual freq is 249.9998 Hz\nclock offset is 0.3412 msec, root delay is 12.45 msec",tip:"Stratum 1 = atomic clock, stratum 16 = unsynchronized."},
{cmd:"show logging",syntax:"show logging",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Display syslog buffer messages",output:"Router# show logging\nSyslog logging: enabled\n  Console logging: level debugging, 142 messages logged\n  Buffer logging:  level debugging, 142 messages logged\n\n*Apr  6 14:22:01.123: %LINEPROTO-5-UPDOWN: Line protocol on Interface Gi0/0, changed state to up\n*Apr  6 14:22:05.456: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Gi0/0 from LOADING to FULL",tip:"Severity levels: 0=Emergency to 7=Debugging. Lower = more critical."},
{cmd:"show controllers serial",syntax:"show controllers serial <number>",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Show serial interface hardware status (DCE/DTE, clock rate)",output:"Router# show controllers serial 0/0/0\nInterface Serial0/0/0\nHardware is GT96K\nDCE V.35, clock rate 128000",tip:"DCE side sets the clock rate. DTE side receives it."},
{cmd:"show flash",syntax:"show flash:",mode:"Privileged EXEC",modeClass:"priv",cat:"Monitoring",desc:"Display contents of flash memory (IOS image files)",output:"Router# show flash:\n-#- --length-- -----date/time------ path\n1    67218776  Apr 01 2026 08:30:00 c2900-universalk9-mz.SPA.157-3.M5.bin\n\n256487424 bytes available (67218776 bytes used)",tip:"Verify IOS image exists before reloading. Check free space before upgrades."},

/* ── Troubleshooting ── */
{cmd:"ping",syntax:"ping <destination>",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Send ICMP echo requests to test reachability",output:"Router# ping 192.168.1.2\nSending 5, 100-byte ICMP Echos to 192.168.1.2, timeout is 2 seconds:\n!!!!!\nSuccess rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms",tip:"! = reply, . = timeout, U = unreachable. Use extended ping for source IP control."},
{cmd:"traceroute",syntax:"traceroute <destination>",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Trace the Layer 3 path to a destination",output:"Router# traceroute 10.0.0.1\nTracing the route to 10.0.0.1\n  1 192.168.1.2 4 msec 4 msec 4 msec\n  2 10.1.1.1 8 msec 8 msec 8 msec\n  3 10.0.0.1 12 msec 12 msec 12 msec",tip:"* = timeout at that hop. Useful for finding where connectivity breaks."},
{cmd:"debug ip ospf events",syntax:"debug ip ospf events",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Show real-time OSPF events (adjacency changes, SPF runs)",output:"Router# debug ip ospf events\nOSPF events debugging is on\n*Apr 6 14:25:01: OSPF-1 ADJ Gi0/0: Rcv hello from 2.2.2.2\n*Apr 6 14:25:01: OSPF-1 ADJ Gi0/0: 2 way communication to 2.2.2.2",tip:"WARNING: debug commands consume CPU. Always 'undebug all' when done."},
{cmd:"debug ip packet",syntax:"debug ip packet [detail] [access-list <number>]",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Debug IP packet forwarding (use with ACL filter!)",output:"Router# debug ip packet detail 100\nIP packet debugging is on (detailed) for access list 100",tip:"NEVER run without an ACL filter in production -- will crash the router."},
{cmd:"undebug all",syntax:"undebug all",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Disable all active debugging",output:"Router# undebug all\nAll possible debugging has been turned off",tip:"Alias: u all. Always run this after debugging."},
{cmd:"show ip interface",syntax:"show ip interface <intf>",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Show detailed IP configuration on an interface (ACLs, proxy ARP, etc.)",output:"Router# show ip interface GigabitEthernet0/0\nGigabitEthernet0/0 is up, line protocol is up\n  Internet address is 192.168.1.1/24\n  Broadcast address is 255.255.255.255\n  Outgoing access list is 100\n  Inbound access list is not set\n  Proxy ARP is enabled\n  ICMP redirects are always sent",tip:"Shows which ACLs are applied to the interface -- critical for troubleshooting."},
{cmd:"show arp",syntax:"show arp",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Display the ARP cache (Layer 2 to Layer 3 mapping)",output:"Router# show arp\nProtocol  Address      Age (min)  Hardware Addr   Type  Interface\nInternet  192.168.1.1        -    aabb.cc00.0100  ARPA  GigabitEthernet0/0\nInternet  192.168.1.2       14    aabb.cc00.0200  ARPA  GigabitEthernet0/0",tip:"Incomplete entries mean ARP request sent but no reply received."},
{cmd:"clear ip ospf process",syntax:"clear ip ospf process",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Reset OSPF process (forces re-adjacency and SPF recalculation)",output:"Router# clear ip ospf process\nReset ALL OSPF processes? [no]: yes",tip:"Required after changing router-id. Disrupts adjacencies temporarily."},
{cmd:"show ip cef",syntax:"show ip cef",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Display Cisco Express Forwarding table",output:"Router# show ip cef\nPrefix              Next Hop            Interface\n0.0.0.0/0           203.0.113.1         GigabitEthernet0/0\n192.168.1.0/24      attached            GigabitEthernet0/1\n10.0.0.0/24         192.168.1.2         GigabitEthernet0/1",tip:"CEF is the fast-switching path. If it is empty, routing may be broken."},
{cmd:"terminal monitor",syntax:"terminal monitor",mode:"Privileged EXEC",modeClass:"priv",cat:"Troubleshooting",desc:"Display syslog/debug output on a VTY (SSH/Telnet) session",output:"Router# terminal monitor",tip:"By default, debug/syslog only shows on console. Use this for remote sessions."},

/* ── NAT ── */
{cmd:"ip nat inside",syntax:"ip nat inside",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Mark interface as the NAT inside (private) interface",output:"Router(config-if)# ip nat inside",tip:"Typically the LAN-facing interface."},
{cmd:"ip nat outside",syntax:"ip nat outside",mode:"Interface Config",modeClass:"iface",cat:"Security",desc:"Mark interface as the NAT outside (public) interface",output:"Router(config-if)# ip nat outside",tip:"Typically the WAN/ISP-facing interface."},
{cmd:"ip nat inside source static",syntax:"ip nat inside source static <local-ip> <global-ip>",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Configure static NAT (one-to-one mapping)",output:"Router(config)# ip nat inside source static 192.168.1.10 203.0.113.10",tip:"Static NAT is used to make internal servers accessible from outside."},
{cmd:"ip nat inside source list",syntax:"ip nat inside source list <acl> pool <name> [overload]",mode:"Global Config",modeClass:"global",cat:"Security",desc:"Configure dynamic NAT or PAT (many-to-one with overload)",output:"Router(config)# ip nat pool MYPOOL 203.0.113.1 203.0.113.1 netmask 255.255.255.0\nRouter(config)# ip nat inside source list 1 pool MYPOOL overload",tip:"'overload' = PAT (Port Address Translation). Most common for internet access."},

/* ── DHCP ── */
{cmd:"ip dhcp pool",syntax:"ip dhcp pool <name>",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Create and configure a DHCP pool",output:"Router(config)# ip dhcp pool LAN\nRouter(dhcp-config)# network 192.168.1.0 255.255.255.0\nRouter(dhcp-config)# default-router 192.168.1.1\nRouter(dhcp-config)# dns-server 8.8.8.8",tip:"Also set 'ip dhcp excluded-address' for static assignments (gateway, servers)."},
{cmd:"ip dhcp excluded-address",syntax:"ip dhcp excluded-address <start-ip> [<end-ip>]",mode:"Global Config",modeClass:"global",cat:"Device Management",desc:"Exclude addresses from DHCP pool (for static assignments)",output:"Router(config)# ip dhcp excluded-address 192.168.1.1 192.168.1.10",tip:"Exclude gateway, servers, printers -- any device with a static IP."},
{cmd:"ip helper-address",syntax:"ip helper-address <dhcp-server-ip>",mode:"Interface Config",modeClass:"iface",cat:"Device Management",desc:"Forward DHCP broadcasts to a remote DHCP server (DHCP relay)",output:"Router(config-if)# ip helper-address 10.0.0.5",tip:"Required when DHCP server is on a different subnet. Converts broadcast to unicast."},

/* ── EtherChannel ── */
{cmd:"channel-group",syntax:"channel-group <number> mode {active|passive|on|desirable|auto}",mode:"Interface Config",modeClass:"iface",cat:"Switching",desc:"Add interface to an EtherChannel bundle",output:"Switch(config-if)# channel-group 1 mode active",tip:"active/passive = LACP (preferred). desirable/auto = PAgP (Cisco only). on = no protocol."},
{cmd:"port-channel load-balance",syntax:"port-channel load-balance <method>",mode:"Global Config",modeClass:"global",cat:"Switching",desc:"Set the EtherChannel load-balancing algorithm",output:"Switch(config)# port-channel load-balance src-dst-ip",tip:"Methods: src-mac, dst-mac, src-dst-mac, src-ip, dst-ip, src-dst-ip."},

/* ── FHRP ── */

/* ── State ── */
let activeCategory = 'All';
let activeMode = 'All';
let searchTerm = '';

/* ── Collect unique categories and modes ── */
const categories = ['All', ...new Set(COMMANDS.map(c => c.cat))];
const modes = ['All', ...new Set(COMMANDS.map(c => c.mode))];

/* ── Render filter buttons ── */
function renderFilters() {
    const catBar = document.getElementById('categoryFilters');
    catBar.innerHTML = categories.map(cat =>
        `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
    ).join('');
    catBar.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        activeCategory = btn.dataset.cat;
        renderFilters();
        renderCommands();
    });

    const modeBar = document.getElementById('modeFilters');
    modeBar.innerHTML = modes.map(m =>
        `<button class="mode-tag ${m === activeMode ? 'active' : ''}" data-mode="${m}">${m}</button>`
    ).join('');
    modeBar.addEventListener('click', e => {
        const btn = e.target.closest('.mode-tag');
        if (!btn) return;
        activeMode = btn.dataset.mode;
        renderFilters();
        renderCommands();
    });
}

/* ── Render command list ── */
function renderCommands() {
    const list = document.getElementById('commandList');
    const empty = document.getElementById('emptyState');
    const countEl = document.getElementById('resultCount');
    const q = searchTerm.toLowerCase();

    const filtered = COMMANDS.filter(c => {
        if (activeCategory !== 'All' && c.cat !== activeCategory) return false;
        if (activeMode !== 'All' && c.mode !== activeMode) return false;
        if (q) {
            return c.cmd.toLowerCase().includes(q) ||
                   c.desc.toLowerCase().includes(q) ||
                   c.syntax.toLowerCase().includes(q) ||
                   c.cat.toLowerCase().includes(q) ||
                   c.mode.toLowerCase().includes(q);
        }
        return true;
    });

    countEl.textContent = `${filtered.length} of ${COMMANDS.length} commands`;

    if (filtered.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map((c, i) => `
        <div class="cmd-card" data-idx="${i}">
            <div class="cmd-summary" onclick="this.parentElement.classList.toggle('open')">
                <span class="cmd-expand-icon">&#9654;</span>
                <span class="cmd-name">${esc(c.cmd)}</span>
                <span class="cmd-desc">${esc(c.desc)}</span>
                <span class="cmd-cat-badge">${esc(c.cat)}</span>
                <span class="cmd-mode-badge ${c.modeClass}">${esc(c.mode)}</span>
            </div>
            <div class="cmd-detail">
                <div class="detail-section">
                    <div class="detail-label">Syntax</div>
                    <div class="detail-syntax">${esc(c.syntax)}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">Description</div>
                    <div class="detail-text">${esc(c.desc)}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">Example</div>
                    <div class="detail-output">${esc(c.output)}</div>
                </div>
                ${c.tip ? `<div class="detail-section">
                    <div class="detail-label">Tip</div>
                    <div class="detail-tip"><img src="/assets/images/icons/icon-info.webp" alt="" style="width:14px;height:14px;vertical-align:middle;margin-right:6px;opacity:0.7;">${esc(c.tip)}</div>
                </div>` : ''}
            </div>
        </div>
    `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ── Search ── */
document.getElementById('searchBox').addEventListener('input', e => {
    searchTerm = e.target.value;
    renderCommands();
});

/* ── Init ── */
renderFilters();
renderCommands();
</script>
