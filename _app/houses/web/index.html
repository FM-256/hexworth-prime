                        <div class="path-card" onclick="window.location.href='quizzes/web-networking-fundamentals-ports.quiz.html'" style="flex-direction: column; text-align: center; padding: 20px;">

                            <div class="path-name" style="font-size: 0.85rem;">1. Ports Quiz</div>
                            <div class="path-cert" style="font-size: 0.7rem;">30 Questions</div>
                            <div style="margin-top: 8px; font-size: 0.65rem; color: #4ade80;"><img src="/assets/images/emblems/web.webp" alt="Initiate rank" style="width:14px;height:14px;border-radius:50%;object-fit:cover;vertical-align:middle;"> Initiate</div>

                            <div class="path-icon" style="margin-bottom: 10px;"><img src="/assets/images/categories/ip-addressing.webp" alt="IP Module" style="width:40px;height:40px;border-radius:8px;object-fit:cover;"></div>

        // Network Master Certification - Textbook unlock
        function checkTextbookUnlock() {
            const passed = localStorage.getItem('hexworth_web_midterm_passed') === 'true';
            const textbookStatus = document.getElementById('textbookStatus');
            const textbookCard = document.getElementById('textbookCard');

            if (passed && textbookStatus && textbookCard) {
                textbookStatus.textContent = '<img src="/assets/images/icons/icon-checkbox.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Unlocked';
                textbookStatus.style.color = '#22c55e';
                textbookCard.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                textbookCard.style.background = 'rgba(34, 197, 94, 0.1)';
            }
        }

        function openTextbook() {
            const passed = localStorage.getItem('hexworth_web_midterm_passed') === 'true';
            if (passed) {
                window.location.href = 'textbook/web-networking-textbook-ch7-20.textbook.html';
            } else {
                alert('<img src="/assets/images/icons/icon-padlock.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Textbook Locked\n\nComplete the Network Master Certification path to unlock:\n1. Complete the Ports Quiz\n2. Study the IP Module\n3. Review Flashcards\n4. Pass the Midterm Exam (70%+)');
            }
        }

        checkTextbookUnlock();
