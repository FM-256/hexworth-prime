<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Drop the Packet - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --house-primary: #60a5fa;
            --house-secondary: #3b82f6;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text-primary: #e0e0e0;
            --text-dim: #808080;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --critical: #dc2626;
            --alert: #fb923c;
            --info: #60a5fa;
        }

        body {
            font-family: 'Courier New', 'Consolas', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            background: var(--bg-darker);
            border-bottom: 2px solid var(--house-primary);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #title {
            font-size: 18px;
            font-weight: bold;
            color: var(--house-primary);
            letter-spacing: 1px;
        }

        #stats {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        #achievement-counter {
            color: var(--warning);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        #achievement-counter:hover {
            color: var(--house-primary);
            transform: scale(1.1);
        }

        #timer {
            font-size: 16px;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
            transition: color 0.3s;
        }

        #timer.normal { color: var(--success); }
        #timer.warning { color: var(--warning); }
        #timer.critical {
            color: var(--critical);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #output-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-dark);
            scroll-behavior: smooth;
        }

        #output-container::-webkit-scrollbar {
            width: 10px;
        }

        #output-container::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        #output-container::-webkit-scrollbar-thumb {
            background: var(--house-secondary);
            border-radius: 5px;
        }

        .line {
            margin-bottom: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .line-system { color: var(--house-primary); }
        .line-success { color: var(--success); }
        .line-error { color: var(--error); }
        .line-warning { color: var(--warning); }
        .line-critical {
            color: var(--critical);
            font-weight: bold;
            animation: flash 0.5s;
        }
        .line-alert { color: var(--alert); }
        .line-info { color: var(--info); }
        .line-dim { color: var(--text-dim); }
        .line-achievement {
            color: var(--warning);
            font-weight: bold;
            animation: flash 0.5s;
        }
        .line-narrative { color: var(--text-primary); font-style: italic; }
        .line-title {
            color: var(--house-primary);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        .line-hint {
            color: var(--info);
            background: rgba(96, 165, 250, 0.1);
            padding: 10px;
            border-left: 3px solid var(--info);
            margin: 10px 0;
        }
        .line-ps-output {
            color: var(--text-dim);
            font-family: 'Courier New', monospace;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #input-area {
            background: var(--bg-darker);
            border-top: 2px solid var(--house-primary);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        #prompt {
            color: var(--house-primary);
            font-weight: bold;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        #toast {
            position: fixed;
            top: 80px;
            right: -400px;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--house-secondary) 100%);
            border: 2px solid var(--warning);
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        #toast.show {
            right: 20px;
        }

        .toast-title {
            color: var(--warning);
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .toast-message {
            color: var(--text-primary);
            font-size: 13px;
        }

        #gallery-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 40px 20px;
        }

        #gallery-overlay.visible {
            display: block;
        }

        #gallery-content {
            max-width: 900px;
            margin: 0 auto;
        }

        #gallery-header {
            text-align: center;
            margin-bottom: 30px;
        }

        #gallery-header h2 {
            color: var(--house-primary);
            font-size: 28px;
            margin-bottom: 10px;
        }

        #gallery-header p {
            color: var(--text-dim);
            font-size: 14px;
        }

        #gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .achievement-card {
            background: var(--bg-darker);
            border: 2px solid var(--house-secondary);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }

        .achievement-card.locked {
            opacity: 0.4;
            border-color: var(--text-dim);
        }

        .achievement-card.unlocked {
            border-color: var(--warning);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .achievement-icon {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }

        .achievement-name {
            color: var(--house-primary);
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }

        .achievement-desc {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
        }

        #gallery-close {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 20px;
        }

        .ascii-art {
            color: var(--house-primary);
            line-height: 1.2;
            text-align: center;
            margin: 20px 0;
        }

        .choice-option {
            color: var(--warning);
            margin: 5px 0;
        }
        .back-link { position:fixed; top:12px; left:20px; color:#3b82f6; text-decoration:none; font-size:14px; cursor:pointer; z-index:10000; transition:color 0.3s; font-family:monospace; }
        .back-link:hover { color:#60a5fa; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; Back to Web House</a>
    <div id="header">
        <div id="title">DON'T DROP THE PACKET</div>
        <div id="stats">
            <div id="achievement-counter">* 0/12</div>
            <div id="timer" class="normal">3:00</div>
        </div>
    </div>

    <div id="output-container">
        <div id="output"></div>
    </div>

    <div id="input-area">
        <span id="prompt">CORE-SW01#</span>
        <input type="text" id="input" autocomplete="off" spellcheck="false">
    </div>

    <div id="toast">
        <div class="toast-title">ACHIEVEMENT UNLOCKED</div>
        <div class="toast-message"></div>
    </div>

    <div id="gallery-overlay">
        <div id="gallery-content">
            <div id="gallery-header">
                <h2>NETWORK ACHIEVEMENT LOG</h2>
                <p>Your networking prowess documented</p>
            </div>
            <div id="gallery-grid"></div>
            <div id="gallery-close">[Press ESC or click to close]</div>
        </div>
    </div>

    <script>
        const Game = (function() {
            // Game state
            const state = {
                phase: 'title', // title, playing, ending
                ending: null,
                timeRemaining: 180,
                timerInterval: null,

                // Network state
                stpFixed: false,
                vlanFixed: false,
                trunkFixed: false,
                interfaceUp: false,
                loopDetected: false,
                firmwareRolledBack: false,
                portSecurityEnabled: false,
                networkStable: false,
                checkedInterfaces: false,
                checkedStp: false,
                checkedVlans: false,
                checkedLogs: false,
                checkedVersion: false,
                savedConfig: false,
                ranPing: false,
                debugStp: false,

                // Methodology tracking
                identified: false,
                diagnosed: false,
                planned: false,
                implemented: false,
                verified: false,
                documented: false,

                commandsRun: [],
                eventsTriggered: []
            };

            // Achievement definitions
            const achievements = {
                first_responder: {
                    icon: '🚨',
                    name: 'First Responder',
                    desc: 'Check interfaces or STP within first 10 seconds'
                },
                loop_buster: {
                    icon: '🔄',
                    name: 'Loop Buster',
                    desc: 'Identify and fix the STP loop'
                },
                by_the_book: {
                    icon: '📚',
                    name: 'Network Methodologist',
                    desc: 'Follow the complete troubleshooting methodology'
                },
                speed_run: {
                    icon: '⚡',
                    name: 'Speed Run',
                    desc: 'Fix the network in under 30 seconds'
                },
                full_restore: {
                    icon: '🏆',
                    name: 'Full Restore',
                    desc: 'Fix STP, VLANs, trunks, and save config'
                },
                firmware_detective: {
                    icon: '🔍',
                    name: 'Firmware Detective',
                    desc: 'Identify the firmware as root cause'
                },
                saved_config: {
                    icon: '💾',
                    name: 'Save Your Work',
                    desc: 'Save the configuration with write memory'
                },
                pulled_the_plug: {
                    icon: '🔌',
                    name: 'Pulled the Plug',
                    desc: 'Attempt to unplug the core switch'
                },
                frozen: {
                    icon: '🧊',
                    name: 'Frozen',
                    desc: 'Do nothing until time runs out'
                },
                coffee_break: {
                    icon: '☕',
                    name: 'Coffee Break',
                    desc: 'Try to get coffee during a network outage'
                },
                wrong_os: {
                    icon: '🖥️',
                    name: 'Wrong OS',
                    desc: 'Try Linux/Windows commands on Cisco IOS'
                },
                rollback_hero: {
                    icon: '⏮️',
                    name: 'Rollback Hero',
                    desc: 'Roll back the problematic firmware'
                }
            };

            // DOM elements
            const elements = {
                output: document.getElementById('output'),
                input: document.getElementById('input'),
                timer: document.getElementById('timer'),
                achievementCounter: document.getElementById('achievement-counter'),
                toast: document.getElementById('toast'),
                galleryOverlay: document.getElementById('gallery-overlay'),
                galleryGrid: document.getElementById('gallery-grid')
            };

            // Utility: Styled text with line class
            function styled(text, className = '') {
                const str = new String(text);
                str._className = className;
                return str;
            }

            // Output text to console
            function print(text) {
                const line = document.createElement('div');
                line.className = 'line';
                if (text._className) {
                    line.classList.add(`line-${text._className}`);
                }
                line.textContent = text.toString();
                elements.output.appendChild(line);
                elements.output.parentElement.scrollTop = elements.output.parentElement.scrollHeight;
            }

            // Print multiple lines
            function printLines(lines) {
                lines.forEach(line => print(line));
            }

            // Clear output
            function clear() {
                elements.output.innerHTML = '';
            }

            // Format time as M:SS
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            // Update timer display
            function updateTimer() {
                elements.timer.textContent = formatTime(state.timeRemaining);

                if (state.timeRemaining > 60) {
                    elements.timer.className = 'normal';
                } else if (state.timeRemaining > 30) {
                    elements.timer.className = 'warning';
                } else {
                    elements.timer.className = 'critical';
                }
            }

            // Start timer
            function startTimer() {
                state.timerInterval = setInterval(() => {
                    state.timeRemaining--;
                    updateTimer();

                    // Timed events
                    triggerTimedEvents();

                    // Check freeze achievement
                    if (state.timeRemaining === 0 && state.commandsRun.length === 0) {
                        unlockAchievement('frozen');
                    }

                    if (state.timeRemaining <= 0) {
                        endGame('timeout');
                    }
                }, 1000);
            }

            // Stop timer
            function stopTimer() {
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
            }

            // Trigger timed escalation events
            function triggerTimedEvents() {
                const elapsed = 180 - state.timeRemaining;

                if (elapsed === 15 && !state.eventsTriggered.includes('loop_guard')) {
                    print(styled('[SYSLOG] %STP-2-LOOPGUARD_BLOCK: Loop guard blocking port Gi0/3', 'warning'));
                    state.eventsTriggered.push('loop_guard');
                }

                if (elapsed === 35 && !state.eventsTriggered.includes('building_a') && !state.vlanFixed && !state.trunkFixed) {
                    print(styled('[ALERT] Help desk reporting: "No one in Building A has network access"', 'alert'));
                    state.eventsTriggered.push('building_a');
                }

                if (elapsed === 60 && !state.eventsTriggered.includes('broadcast_storm') && !state.stpFixed) {
                    print(styled('[CRITICAL] Broadcast storm detected on VLAN 10 - 98% bandwidth utilization', 'critical'));
                    state.eventsTriggered.push('broadcast_storm');
                }

                if (elapsed === 90 && !state.eventsTriggered.includes('ip_phones') && !state.stpFixed) {
                    print(styled('[CRITICAL] IP phones going offline across campus - 911 service affected!', 'critical'));
                    state.eventsTriggered.push('ip_phones');
                }

                if (elapsed === 120 && !state.eventsTriggered.includes('cameras') && !state.stpFixed) {
                    print(styled('[CRITICAL] Campus security cameras offline - Physical security compromised!', 'critical'));
                    state.eventsTriggered.push('cameras');
                }

                if (elapsed === 150 && !state.eventsTriggered.includes('datacenter') && !state.stpFixed) {
                    print(styled('[CRITICAL] Data center uplinks saturated. Server team reporting connectivity loss.', 'critical'));
                    state.eventsTriggered.push('datacenter');
                }
            }

            // Achievement system
            function loadAchievements() {
                const saved = localStorage.getItem('hexworth_dontdroppacket_achievements');
                return saved ? JSON.parse(saved) : {};
            }

            function saveAchievements(unlocked) {
                localStorage.setItem('hexworth_dontdroppacket_achievements', JSON.stringify(unlocked));
            }

            function unlockAchievement(id) {
                const unlocked = loadAchievements();
                if (!unlocked[id]) {
                    unlocked[id] = Date.now();
                    saveAchievements(unlocked);
                    showToast(achievements[id].name, achievements[id].desc);
                    print(styled(`*** ACHIEVEMENT UNLOCKED: ${achievements[id].name} ***`, 'achievement'));
                    updateAchievementCounter();
                    return true;
                }
                return false;
            }

            function updateAchievementCounter() {
                const unlocked = loadAchievements();
                const count = Object.keys(unlocked).length;
                elements.achievementCounter.textContent = `* ${count}/12`;
            }

            function showToast(title, message) {
                const toastMessage = elements.toast.querySelector('.toast-message');
                toastMessage.textContent = message;
                elements.toast.classList.add('show');
                setTimeout(() => {
                    elements.toast.classList.remove('show');
                }, 3000);
            }

            // Achievement gallery
            function showGallery() {
                const unlocked = loadAchievements();
                elements.galleryGrid.innerHTML = '';

                Object.entries(achievements).forEach(([id, data]) => {
                    const card = document.createElement('div');
                    card.className = unlocked[id] ? 'achievement-card unlocked' : 'achievement-card locked';
                    card.innerHTML = `
                        <div class="achievement-icon">${unlocked[id] ? data.icon : '🔒'}</div>
                        <div class="achievement-name">${data.name}</div>
                        <div class="achievement-desc">${data.desc}</div>
                    `;
                    elements.galleryGrid.appendChild(card);
                });

                elements.galleryOverlay.classList.add('visible');
            }

            function hideGallery() {
                elements.galleryOverlay.classList.remove('visible');
            }

            // Command processing
            function processCommand(input) {
                const cmd = input.trim().toLowerCase();

                // Don't count empty commands
                if (!cmd) return;

                // Track command
                if (!state.commandsRun.includes(cmd)) {
                    state.commandsRun.push(cmd);
                }

                // First responder achievement
                if ((180 - state.timeRemaining) <= 10 &&
                    (cmd.includes('show int') || cmd.includes('show stp') || cmd.includes('show span'))) {
                    unlockAchievement('first_responder');
                }

                // Echo command
                print(styled(`CORE-SW01# ${input}`, 'system'));
                print('');

                // Command routing
                if (cmd === 'help' || cmd === '?') {
                    cmdHelp();
                } else if (cmd === 'hint' || cmd === 'hints') {
                    cmdHint();
                } else if (cmd === 'look' || cmd === 'examine') {
                    cmdLook();
                } else if (cmd === 'inventory' || cmd === 'i') {
                    cmdInventory();
                } else if (cmd === 'panic') {
                    cmdPanic();
                } else if (cmd === 'coffee') {
                    cmdCoffee();
                    unlockAchievement('coffee_break');
                } else if (cmd.includes('call tac') || cmd.includes('call cisco')) {
                    cmdCallTac();
                } else if (cmd.includes('unplug') || cmd.includes('pull the plug')) {
                    cmdUnplug();
                    unlockAchievement('pulled_the_plug');
                } else if (cmd.includes('blame firmware')) {
                    cmdBlameFirmware();
                } else if (cmd.includes('google')) {
                    cmdGoogle();
                } else if (cmd === 'show interfaces' || cmd === 'show int' || cmd === 'show int status') {
                    cmdShowInterfaces();
                } else if (cmd === 'show spanning-tree' || cmd === 'show stp') {
                    cmdShowStp();
                } else if (cmd === 'show vlan' || cmd === 'show vlan brief') {
                    cmdShowVlan();
                } else if (cmd === 'show running-config' || cmd === 'show run') {
                    cmdShowRun();
                } else if (cmd === 'show interfaces trunk') {
                    cmdShowTrunk();
                } else if (cmd === 'show mac address-table') {
                    cmdShowMac();
                } else if (cmd === 'show cdp neighbors') {
                    cmdShowCdp();
                } else if (cmd === 'show ip route') {
                    cmdShowRoute();
                } else if (cmd === 'show log' || cmd === 'show logging') {
                    cmdShowLog();
                } else if (cmd === 'show version') {
                    cmdShowVersion();
                } else if (cmd === 'show port-security') {
                    cmdShowPortSecurity();
                } else if (cmd.includes('debug spanning-tree') || cmd.includes('debug stp')) {
                    cmdDebugStp();
                } else if (cmd.includes('spanning-tree') && (cmd.includes('portfast') || cmd.includes('guard') || cmd.includes('bpdu'))) {
                    cmdFixStp();
                } else if (cmd.includes('interface') && cmd.includes('shutdown')) {
                    cmdShutdown();
                } else if (cmd.includes('interface') && cmd.includes('no shutdown')) {
                    cmdNoShutdown();
                } else if (cmd.includes('switchport mode trunk')) {
                    cmdFixTrunk();
                } else if (cmd.includes('switchport access vlan') || cmd.includes('switchport trunk allowed vlan')) {
                    cmdFixVlan();
                } else if (cmd.includes('errdisable recovery')) {
                    cmdErrdisable();
                } else if (cmd === 'reload' || cmd.includes('boot system')) {
                    cmdReload();
                } else if (cmd === 'copy running-config startup-config' || cmd === 'write memory' || cmd === 'wr') {
                    cmdSaveConfig();
                } else if (cmd.includes('ping')) {
                    cmdPing();
                } else if (cmd.includes('traceroute')) {
                    cmdTraceroute();
                } else if (cmd === 'reboot') {
                    cmdReboot();
                } else if (['ls', 'dir', 'pwd', 'cat', 'grep', 'sudo', 'apt', 'chmod', 'ipconfig'].some(c => cmd.startsWith(c))) {
                    cmdWrongOS();
                    unlockAchievement('wrong_os');
                } else {
                    print(styled('% Invalid input detected at \'^\' marker.', 'error'));
                    print(styled('Type "help" for available commands.', 'dim'));
                }

                print('');
                checkWinCondition();
            }

            // Command implementations
            function cmdHelp() {
                printLines([
                    styled('=== AVAILABLE COMMANDS ===', 'info'),
                    '',
                    styled('SHOW COMMANDS:', 'system'),
                    '  show interfaces          Show interface status',
                    '  show spanning-tree       Show STP topology',
                    '  show vlan                Show VLAN configuration',
                    '  show running-config      Show current configuration',
                    '  show interfaces trunk    Show trunk ports',
                    '  show mac address-table   Show MAC address table',
                    '  show logging             Show system logs',
                    '  show version             Show firmware version',
                    '  show cdp neighbors       Show connected devices',
                    '  show ip route            Show routing table',
                    '  show port-security       Show port security status',
                    '',
                    styled('CONFIGURATION COMMANDS:', 'system'),
                    '  spanning-tree portfast   Configure STP portfast',
                    '  spanning-tree guard root Configure root guard',
                    '  interface gi0/X          Configure interface',
                    '  switchport mode trunk    Set trunk mode',
                    '  switchport access vlan X Set access VLAN',
                    '  errdisable recovery      Enable auto-recovery',
                    '  reload                   Reload the switch',
                    '  write memory             Save configuration',
                    '',
                    styled('DIAGNOSTIC COMMANDS:', 'system'),
                    '  ping [address]           Test connectivity',
                    '  traceroute [address]     Trace packet path',
                    '  debug spanning-tree      Debug STP events',
                    '',
                    styled('OTHER:', 'system'),
                    '  help, hint, look, inventory'
                ]);
            }

            function cmdHint() {
                const hints = [];

                if (!state.checkedInterfaces && !state.checkedStp && !state.checkedLogs) {
                    hints.push('Start by checking the current state: show interfaces, show spanning-tree, show logging');
                } else if (state.checkedStp && !state.loopDetected) {
                    hints.push('Look closely at the STP output - multiple root bridges on the same network is bad news');
                } else if (state.loopDetected && !state.stpFixed) {
                    hints.push('You need to fix the STP loop. Consider root guard or shutting down problematic ports');
                } else if (state.checkedInterfaces && !state.vlanFixed && !state.trunkFixed) {
                    hints.push('Some ports might be in the wrong VLANs, or trunk configurations might be incorrect');
                } else if (state.checkedVersion && !state.firmwareRolledBack) {
                    hints.push('That firmware version (v16.12.4) was just installed. Coincidence?');
                } else if ((state.stpFixed || state.vlanFixed) && !state.savedConfig) {
                    hints.push('Don\'t forget to save your configuration with "write memory"');
                } else if (!state.verified) {
                    hints.push('After making changes, verify with ping or check interface status');
                } else {
                    hints.push('Follow the Network+ methodology: Identify, Diagnose, Plan, Implement, Verify, Document');
                }

                if (hints.length > 0) {
                    print(styled(`HINT: ${hints[0]}`, 'hint'));
                } else {
                    print(styled('You\'re on the right track!', 'success'));
                }
            }

            function cmdLook() {
                state.identified = true;
                printLines([
                    styled('You\'re standing in the main distribution frame (MDF) - the network operations center.', 'narrative'),

                    printLines([
                        styled('Type escape sequence to abort.', 'dim'),
                        styled('Sending 5, 100-byte ICMP Echos to 10.0.10.1, timeout is 2 seconds:', 'system'),
                        styled('.....', 'error'),
                        styled('Success rate is 0 percent (0/5)', 'error'),
                        styled('', ''),
                        styled('[FAILED] Network still unreachable. Fix the underlying issues first.', 'error')
                    ]);
                }
            }

            function cmdTraceroute() {
                const target = state.stpFixed || state.vlanFixed || state.trunkFixed;
                if (target) {
                    printLines([
                        styled('Tracing route to 10.0.10.1...', 'system'),
                        styled('', ''),
                        styled(' 1  10.0.0.1      2 ms    1 ms    2 ms', 'ps-output'),
                        styled(' 2  10.0.10.1     4 ms    3 ms    5 ms', 'ps-output'),
                        styled('', ''),
                        styled('Trace complete.', 'success')
                    ]);
                } else {
                    printLines([
                        styled('Tracing route to 10.0.10.1...', 'system'),
                        styled('', ''),
                        styled(' 1  * * * Request timed out.', 'error'),
                        styled(' 2  * * * Request timed out.', 'error'),
                        styled('', ''),
                        styled('Trace failed. Network unreachable.', 'error')
                    ]);
                }
            }

            function cmdWrongOS() {
                printLines([
                    styled('% Invalid input detected at \'^.\' marker.', 'error'),
                    styled('', ''),
                    styled('This is Cisco IOS, not Linux/Windows!', 'warning'),
                    styled('Try "show version" instead of "ls"', 'hint'),
                    styled('Try "show running-config" instead of "cat"', 'hint'),
                    styled('', ''),
                    styled('(You feel a deep sense of embarrassment)', 'narrative')
                ]);
            }

            // Win condition check
            function checkWinCondition() {
                // Must fix STP AND at least one other issue
                if (state.stpFixed && (state.vlanFixed || state.trunkFixed)) {

                    // Check full restore achievement
                    if (state.stpFixed && state.vlanFixed && state.trunkFixed && state.savedConfig) {
                        unlockAchievement('full_restore');
                    }

                    // Check methodology achievement
                    if (state.identified && state.diagnosed && state.planned &&
                        state.implemented && state.verified && state.documented) {
                        unlockAchievement('by_the_book');
                    }

                    endGame('success');
                }
            }

            // End game
            function endGame(result) {
                if (state.phase === 'ending') return;

                state.phase = 'ending';
                state.ending = result;
                stopTimer();
                elements.input.disabled = true;

                setTimeout(() => {
                    clear();
                    if (result === 'success') {
                        showSuccessScreen();
                    } else {
                        showFailureScreen();
                    }
                }, 1000);

                // Platform achievement integration
                if (typeof AchievementSystem !== 'undefined') {
                    if (result === 'success') {
                        AchievementSystem.unlockGameAchievement('packet', 'win');
                    }

                    const saved = loadAchievements();
                    if (saved.by_the_book) {
                        AchievementSystem.unlockGameAchievement('packet', 'by_the_book');
                    }
                    if (saved.speed_run) {
                        AchievementSystem.unlockGameAchievement('packet', 'speed');
                    }
                    if (Object.keys(saved).length >= 12) {
                        AchievementSystem.unlockGameAchievement('packet', 'all');
                    }
                }

                // Award XP (one-time)
                if (result === 'success') {
                    if (!localStorage.getItem('game_packet_xp_awarded')) {
                        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                        localStorage.setItem('game_packet_xp_awarded', 'true');
                        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                            const uid = localStorage.getItem('hexworth_uid');
                            if (uid) FirestoreManager.addXP(uid, 50, 'Don\'t Drop the Packet Complete');
                        }
                    }
                    if (typeof AchievementManager !== 'undefined') {
                        AchievementManager.unlock('game_packet');
                    }
                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    const saved = loadAchievements();
                    GameTracker.record('packet', {
                        result: state.ending || 'unknown',
                        timeElapsed: 180 - state.timeRemaining,
                        commandsUsed: state.commandsRun.length,
                        achievementsEarned: Object.keys(saved).length,
                        achievementsTotal: Object.keys(achievements).length
                    });
                }
            }

            function showSuccessScreen() {
                const timeElapsed = 180 - state.timeRemaining;
                const unlocked = loadAchievements();
                const achievementCount = Object.keys(unlocked).length;

                printLines([
                    styled('╔═══════════════════════════════════════════════════════════╗', 'success'),
                    styled('║                                                           ║', 'success'),
                    styled('║              🎉 NETWORK CRISIS AVERTED! 🎉               ║', 'title'),
                    styled('║                                                           ║', 'success'),
                    styled('╚═══════════════════════════════════════════════════════════╝', 'success'),
                    '',
                    styled('The STP loop has been eliminated. The broadcast storm subsides.', 'narrative'),
                    styled('Green LEDs return to their steady, reassuring blink pattern.', 'narrative'),
                    styled('The switch fans slow to a gentle hum. Temperature: 42°C. Normal.', 'narrative'),
                    '',
                    styled('Your phone buzzes. Help desk: "Whatever you did, it worked!"', 'success'),
                    styled('Building A reports network access restored. IP phones online.', 'success'),
                    styled('Security cameras feed resuming. Data center uplinks stable.', 'success'),
                    '',
                    styled('You lean back in your chair and exhale deeply.', 'narrative'),
                    styled('The coffee in your cup is still cold, but victory tastes sweet.', 'narrative'),
                    '',
                    styled('════════════════════════════════════════', 'dim'),
                    styled(`Time Elapsed: ${formatTime(timeElapsed)}`, 'info'),
                    styled(`Commands Run: ${state.commandsRun.length}`, 'info'),
                    styled(`Achievements Unlocked: ${achievementCount}/12`, 'achievement'),
                    styled('════════════════════════════════════════', 'dim'),
                    '',
                    styled('Your manager walks in: "Nice work. Now about that firmware update policy..."', 'warning'),
                    '',
                    styled('[R] Play Again    [A] View Achievements', 'system'),
                ]);
            }

            function showFailureScreen() {
                const unlocked = loadAchievements();
                const achievementCount = Object.keys(unlocked).length;

                printLines([
                    styled('╔═══════════════════════════════════════════════════════════╗', 'error'),
                    styled('║                                                           ║', 'error'),
                    styled('║                ⚠️  NETWORK MELTDOWN  ⚠️                  ║', 'title'),
                    styled('║                                                           ║', 'error'),
                    styled('╚═══════════════════════════════════════════════════════════╝', 'error'),
                    '',
                    styled('Time expired. The STP storm reached critical mass.', 'critical'),
                    styled('The core switch has become completely unresponsive.', 'critical'),
                    styled('All campus buildings report total network loss.', 'critical'),
                    '',
                    styled('Emergency services can\'t be reached. Security systems offline.', 'error'),
                    styled('The university president is calling an emergency meeting.', 'error'),
                    styled('Your phone won\'t stop ringing. Emails are piling up. Well, they would be.', 'error'),
                    styled('If you had email. Because the network is down.', 'dim'),
                    '',
                    styled('The switch will need to be factory reset and reconfigured from scratch.', 'warning'),
                    styled('It\'s going to be a very long night.', 'narrative'),
                    '',
                    styled('════════════════════════════════════════', 'dim'),
                    styled(`Achievements Unlocked: ${achievementCount}/12`, 'achievement'),
                    styled('════════════════════════════════════════', 'dim'),
                    '',
                    styled('Sometimes the best teacher is failure. And you just got a masterclass.', 'dim'),
                    '',
                    styled('[R] Try Again    [A] View Achievements', 'system'),
                ]);
            }

            // Title screen
            function showTitleScreen() {
                const unlocked = loadAchievements();
                const achievementCount = Object.keys(unlocked).length;

                clear();
                printLines([
                    styled('', ''),
                    styled('╔═══════════════════════════════════════════════════════════════════════╗', 'system'),
                    styled('║                                                                       ║', 'system'),
                    styled('║                     DON\'T DROP THE PACKET                             ║', 'title'),
                    styled('║                                                                       ║', 'system'),
                    styled('║                  A Network Engineering Survival Game                  ║', 'info'),
                    styled('║                                                                       ║', 'system'),
                    styled('╚═══════════════════════════════════════════════════════════════════════╝', 'system'),
                    '',
                    styled('                    .---.', 'dim'),
                    styled('                   /     \\', 'dim'),
                    styled('                  | () () |     [CORE-SW01]', 'dim'),
                    styled('                   \\  ^  /', 'dim'),
                    styled('                    |||||', 'dim'),
                    styled('                    |||||', 'dim'),
                    styled('              🔴🔴🔴🔴🔴🔴🔴🔴  <- PANIC LIGHTS', 'error'),
                    '',
                    styled('3:42 PM - The firmware update was supposed to be routine.', 'narrative'),
                    styled('3:43 PM - Users start reporting connectivity issues.', 'narrative'),
                    styled('3:44 PM - Your phone explodes with help desk tickets.', 'narrative'),
                    styled('3:45 PM - The core switch LEDs are doing a disco party.', 'narrative'),
                    styled('3:45 PM - You are now here, console cable in hand.', 'narrative'),
                    '',
                    styled('YOU HAVE 3 MINUTES.', 'critical'),
                    '',
                    styled('═══════════════════════════════════════════════════════════════════════', 'dim'),
                    styled('OBJECTIVE:', 'warning'),
                    styled('  - Fix the spanning tree loop causing broadcast storms', 'system'),
                    styled('  - Repair VLAN misconfigurations affecting Building A', 'system'),
                    styled('  - Restore trunk ports to proper operation', 'system'),
                    styled('  - Save the campus network before total meltdown', 'system'),
                    '',
                    styled('This is Cisco IOS. Use Cisco commands. Type "help" for available commands.', 'info'),
                    styled('Follow the Network+ troubleshooting methodology for best results.', 'hint'),
                    '',
                    styled(`Previous achievements unlocked: ${achievementCount}/12`, 'achievement'),
                    '',
                    styled('Press [ENTER] to begin, or type "achievements" to view your progress', 'dim'),
                    styled('═══════════════════════════════════════════════════════════════════════', 'dim'),
                    ''
                ]);

                state.phase = 'title';
                elements.input.disabled = false;
                elements.input.focus();
            }

            // Input handler
            function handleInput(e) {
                if (e.key !== 'Enter') return;

                const input = elements.input.value.trim();
                elements.input.value = '';

                if (state.phase === 'title') {
                    if (input.toLowerCase() === 'achievements' || input.toLowerCase() === 'a') {
                        showGallery();
                    } else {
                        startGame();
                    }
                } else if (state.phase === 'playing') {
                    processCommand(input);
                } else if (state.phase === 'ending') {
                    if (input.toLowerCase() === 'r') {
                        resetGame();
                    } else if (input.toLowerCase() === 'a') {
                        showGallery();
                    }
                }
            }

            // Start game
            function startGame() {
                state.phase = 'playing';
                state.timeRemaining = 180;
                state.commandsRun = [];
                state.eventsTriggered = [];

                clear();
                printLines([
                    styled('Console session established with CORE-SW01', 'system'),
                    styled('User Access Verification', 'dim'),
                    styled('Username: admin', 'dim'),
                    styled('Password: ********', 'dim'),
                    '',
                    styled('CORE-SW01>', 'system'),
                    styled('CORE-SW01>enable', 'system'),
                    styled('CORE-SW01#', 'system'),
                    '',
                    styled('[ALERT] Multiple network anomalies detected!', 'critical'),
                    styled('[ALERT] Spanning tree topology unstable!', 'critical'),
                    styled('[ALERT] Broadcast traffic exceeding normal thresholds!', 'critical'),
                    '',
                    styled('The timer is running. Type "help" for commands. Type "hint" for guidance.', 'info'),
                    ''
                ]);

                updateTimer();
                startTimer();
                elements.input.disabled = false;
                elements.input.focus();
            }

            // Reset game
            function resetGame() {
                stopTimer();

                // Reset state
                state.phase = 'title';
                state.ending = null;
                state.timeRemaining = 180;
                state.stpFixed = false;
                state.vlanFixed = false;
                state.trunkFixed = false;
                state.interfaceUp = false;
                state.loopDetected = false;
                state.firmwareRolledBack = false;
                state.portSecurityEnabled = false;
                state.networkStable = false;
                state.checkedInterfaces = false;
                state.checkedStp = false;
                state.checkedVlans = false;
                state.checkedLogs = false;
                state.checkedVersion = false;
                state.savedConfig = false;
                state.ranPing = false;
                state.debugStp = false;
                state.identified = false;
                state.diagnosed = false;
                state.planned = false;
                state.implemented = false;
                state.verified = false;
                state.documented = false;
                state.commandsRun = [];
                state.eventsTriggered = [];

                elements.input.disabled = false;
                showTitleScreen();
            }

            // Event listeners
            elements.input.addEventListener('keydown', handleInput);

            elements.achievementCounter.addEventListener('click', () => {
                showGallery();
            });

            elements.galleryOverlay.addEventListener('click', (e) => {
                if (e.target === elements.galleryOverlay) {
                    hideGallery();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && elements.galleryOverlay.classList.contains('visible')) {
                    hideGallery();
                }
            });

            // Initialize
            function init() {
                updateAchievementCounter();
                showTitleScreen();
            }

            return {
                init
            };
        })();

        // Start game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            Game.init();
        });
    </script>

    <script src="../../../components/GameTracker.js"></script>
    <!-- Platform achievement integration -->
    <script src="../../../components/AchievementSystem.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
</body>
</html>
