<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packet Sniffer - Web House - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes scanlineDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }

        @keyframes terminalBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes captureFlash {
            0% { box-shadow: 0 0 0 rgba(0, 255, 170, 0); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 170, 0.6); }
            100% { box-shadow: 0 0 0 rgba(0, 255, 170, 0); }
        }

        @keyframes flagPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes nodeGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 200, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.6)); }
        }

        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes successGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 100, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 100, 0.6); }
        }

        body {
            font-family: 'Courier New', 'Consolas', monospace;
            background: #060a10;
            color: #c0d8e8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 180, 255, 0.015),
                rgba(0, 180, 255, 0.015) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10000;
            animation: scanlineDrift 6s linear infinite;
        }

        .top-bar {
            background: linear-gradient(180deg, #0a1018 0%, #060c14 100%);
            border-bottom: 1px solid rgba(0, 180, 255, 0.2);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #60a5fa;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .app-title {
            font-size: 16px;
            color: #00ccff;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .app-title span {
            color: #ff4444;
            animation: terminalBlink 1.2s step-end infinite;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-label { color: #4a6a7a; }
        .status-value { color: #00ddff; font-weight: bold; }
        .status-value.score { color: #00ff88; }
        .status-value.scenario { color: #ffaa00; }

        /* ----- Start Screen ----- */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 50px);
            padding: 40px 20px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 42px;
            color: #00ccff;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.4);
        }

        .start-screen .subtitle {
            font-size: 14px;
            color: #4a8a9a;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .start-info {
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 8px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            text-align: left;
            margin-bottom: 30px;
        }

        .start-info h2 {
            color: #00ddff;
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .start-info ul {
            list-style: none;
            margin-bottom: 15px;
        }

        .start-info li {
            padding: 6px 0 6px 20px;
            position: relative;
            color: #8ab0c0;
            font-size: 13px;
            line-height: 1.5;
        }

        .start-info li::before {
            content: '>';
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .start-btn {
            padding: 16px 50px;
            background: linear-gradient(135deg, #003355 0%, #002244 100%);
            border: 2px solid #00ccff;
            border-radius: 4px;
            color: #00ffee;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: linear-gradient(135deg, #004466 0%, #003355 100%);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.4), inset 0 0 20px rgba(0, 200, 255, 0.1);
            transform: translateY(-2px);
        }

        /* ----- Main Layout ----- */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: auto 1fr;
            gap: 0;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        /* ----- Network Canvas Area ----- */
        .network-panel {
            grid-column: 1 / -1;
            background: #040810;
            border-bottom: 1px solid rgba(0, 180, 255, 0.15);
            position: relative;
            height: 240px;
            overflow: hidden;
        }

        .network-panel canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .network-overlay {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 11px;
            color: #2a5a6a;
            pointer-events: none;
        }

        .capture-indicator {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .capture-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3333;
            animation: terminalBlink 1s ease-in-out infinite;
        }

        .capture-dot.active {
            background: #00ff66;
        }

        .capture-label {
            color: #4a8a6a;
        }

        .capture-label.active {
            color: #00ff66;
        }

        /* ----- Packet Table Area ----- */
        .table-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #060a12;
            border-right: 1px solid rgba(0, 180, 255, 0.1);
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #0a1220;
            border-bottom: 1px solid rgba(0, 180, 255, 0.12);
            flex-wrap: wrap;
        }

        .filter-input {
            background: #060c16;
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 3px;
            color: #00ddff;
            font-family: inherit;
            font-size: 12px;
            padding: 5px 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-input:focus {
            border-color: #00ccff;
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.2);
        }

        .filter-input::placeholder {
            color: #2a4a5a;
        }

        .filter-input.expr {
            flex: 1;
            min-width: 180px;
        }

        .filter-btn {
            background: #0a1a2a;
            border: 1px solid rgba(0, 180, 255, 0.25);
            border-radius: 3px;
            color: #00bbdd;
            font-family: inherit;
            font-size: 11px;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: #0c2040;
            border-color: #00ccff;
        }

        .filter-btn.active {
            background: #003355;
            border-color: #00ccff;
            color: #00ffee;
        }

        .filter-btn.flag-mode {
            border-color: rgba(255, 60, 60, 0.4);
            color: #ff6666;
        }

        .filter-btn.flag-mode.active {
            background: #330a0a;
            border-color: #ff4444;
            color: #ff4444;
        }

        .filter-protocols {
            display: flex;
            gap: 4px;
        }

        .proto-btn {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.15);
            border-radius: 3px;
            font-family: inherit;
            font-size: 10px;
            padding: 3px 7px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .proto-btn:hover { border-color: #00ccff; }
        .proto-tcp { color: #00ddaa; }
        .proto-tcp.active { background: rgba(0, 200, 150, 0.15); border-color: #00ddaa; }
        .proto-udp { color: #4488ff; }
        .proto-udp.active { background: rgba(60, 120, 255, 0.15); border-color: #4488ff; }
        .proto-http { color: #3b82f6; }
        .proto-http.active { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
        .proto-dns { color: #aa77ff; }
        .proto-dns.active { background: rgba(160, 100, 255, 0.15); border-color: #aa77ff; }
        .proto-icmp { color: #00ccee; }
        .proto-icmp.active { background: rgba(0, 200, 230, 0.15); border-color: #00ccee; }
        .proto-tls { color: #ffaa33; }
        .proto-tls.active { background: rgba(255, 160, 40, 0.15); border-color: #ffaa33; }
        .proto-arp { color: #ff6666; }
        .proto-arp.active { background: rgba(255, 80, 80, 0.15); border-color: #ff6666; }
        .proto-ftp { color: #ffcc00; }
        .proto-ftp.active { background: rgba(255, 200, 0, 0.15); border-color: #ffcc00; }
        .proto-dhcp { color: #cc88ff; }
        .proto-dhcp.active { background: rgba(180, 120, 255, 0.15); border-color: #cc88ff; }

        .packet-list-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
        }

        .packet-list-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
        .packet-list-wrapper::-webkit-scrollbar-track { background: #060a12; }
        .packet-list-wrapper::-webkit-scrollbar-thumb { background: #1a3040; border-radius: 3px; }
        .packet-list-wrapper::-webkit-scrollbar-thumb:hover { background: #2a5060; }

        .packet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 700px;
        }

        .packet-table thead {
            background: #0c1422;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .packet-table th {
            padding: 6px 8px;
            text-align: left;
            color: #3a7a9a;
            font-weight: 600;
            border-bottom: 1px solid rgba(0, 180, 255, 0.15);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .packet-table th:hover {
            color: #00ccff;
        }

        .packet-table td {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(0, 40, 60, 0.3);
            white-space: nowrap;
            font-size: 11px;
        }

        .packet-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .packet-table tbody tr:nth-child(odd) { background: rgba(0, 10, 20, 0.3); }
        .packet-table tbody tr:nth-child(even) { background: rgba(0, 15, 30, 0.2); }
        .packet-table tbody tr:hover { background: rgba(0, 60, 100, 0.2); }
        .packet-table tbody tr.selected { background: rgba(0, 100, 180, 0.2); border-left: 2px solid #00ccff; }
        .packet-table tbody tr.flagged { background: rgba(100, 0, 0, 0.2); }
        .packet-table tbody tr.flagged td:first-child::before { content: '\25CF '; color: #ff4444; }
        .packet-table tbody tr.suspicious { }

        .pkt-tcp { color: #00ddaa; }
        .pkt-udp { color: #4488ff; }
        .pkt-http { color: #3b82f6; }
        .pkt-dns { color: #aa77ff; }
        .pkt-icmp { color: #00ccee; }
        .pkt-tls { color: #ffaa33; }
        .pkt-arp { color: #ff6666; }
        .pkt-ftp { color: #ffcc00; }
        .pkt-dhcp { color: #cc88ff; }
        .pkt-ssh { color: #88ddaa; }
        .pkt-smb { color: #dd88aa; }

        /* ----- Right Panel (Detail + Objective) ----- */
        .right-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #080e18;
        }

        .objective-panel {
            background: linear-gradient(180deg, #0a1828 0%, #081420 100%);
            border-bottom: 1px solid rgba(0, 180, 255, 0.12);
            padding: 12px;
            flex-shrink: 0;
        }

        .objective-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .objective-tag {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffaa00;
            font-weight: bold;
        }

        .scenario-counter {
            font-size: 10px;
            color: #3a6a7a;
        }

        .objective-text {
            font-size: 13px;
            color: #e0f0ff;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .objective-hint {
            font-size: 11px;
            color: #3a7a5a;
            font-style: italic;
        }

        .objective-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn {
            flex: 1;
            padding: 8px;
            background: linear-gradient(135deg, #003322 0%, #002218 100%);
            border: 1px solid #00aa66;
            border-radius: 4px;
            color: #00ff88;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #004433 0%, #003322 100%);
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hint-btn {
            padding: 8px 14px;
            background: #0a1a2a;
            border: 1px solid rgba(255, 170, 0, 0.3);
            border-radius: 4px;
            color: #ffaa00;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hint-btn:hover {
            border-color: #ffaa00;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }

        .hint-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ----- Packet Detail Panel ----- */
        .detail-panel {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .detail-panel::-webkit-scrollbar { width: 5px; }
        .detail-panel::-webkit-scrollbar-track { background: #080e18; }
        .detail-panel::-webkit-scrollbar-thumb { background: #1a3040; border-radius: 3px; }

        .detail-section {
            margin-bottom: 12px;
        }

        .detail-section-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #3a7a9a;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.1);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 11px;
        }

        .detail-key { color: #4a7a8a; }
        .detail-val { color: #b0d8e8; }

        .hex-dump {
            background: #040810;
            border: 1px solid rgba(0, 180, 255, 0.1);
            border-radius: 3px;
            padding: 8px;
            font-size: 10px;
            line-height: 1.6;
            color: #6a9aaa;
            overflow-x: auto;
            white-space: pre;
        }

        .hex-offset { color: #3a5a6a; }
        .hex-byte { color: #00bbcc; }
        .hex-byte.highlight { color: #ff4444; background: rgba(255, 0, 0, 0.1); }
        .hex-ascii { color: #4a8a6a; }

        .payload-preview {
            background: #040810;
            border: 1px solid rgba(0, 180, 255, 0.1);
            border-radius: 3px;
            padding: 8px;
            font-size: 11px;
            line-height: 1.5;
            color: #8ab8c8;
            word-break: break-all;
        }

        .no-selection {
            color: #2a4a5a;
            text-align: center;
            padding: 30px;
            font-size: 12px;
        }

        /* ----- Feedback Overlay ----- */
        .feedback-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            animation: fadeInUp 0.3s ease;
        }

        .feedback-card {
            background: linear-gradient(145deg, #0a1828 0%, #081420 100%);
            border: 1px solid rgba(0, 180, 255, 0.25);
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .feedback-card.success {
            border-color: rgba(0, 255, 100, 0.4);
            animation: successGlow 2s ease-in-out infinite;
        }

        .feedback-card.failure {
            border-color: rgba(255, 60, 60, 0.4);
        }

        .feedback-card.partial {
            border-color: rgba(255, 170, 0, 0.4);
        }

        .feedback-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .feedback-title {
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .feedback-card.success .feedback-title { color: #00ff88; }
        .feedback-card.failure .feedback-title { color: #ff6666; }
        .feedback-card.partial .feedback-title { color: #ffaa00; }

        .feedback-explanation {
            font-size: 13px;
            color: #8ab0c0;
            line-height: 1.7;
            margin-bottom: 20px;
            text-align: left;
            padding: 0 10px;
        }

        .feedback-score {
            font-size: 14px;
            color: #00ddff;
            margin-bottom: 20px;
        }

        .feedback-btn {
            padding: 10px 30px;
            background: #003355;
            border: 1px solid #00ccff;
            border-radius: 4px;
            color: #00ffee;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .feedback-btn:hover {
            background: #004466;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        /* ----- Final Results ----- */
        .results-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 50px);
            padding: 40px 20px;
            text-align: center;
        }

        .results-screen h1 {
            font-size: 32px;
            color: #00ccff;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .final-grade {
            font-size: 72px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .grade-s { color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .grade-a { color: #00ff88; text-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
        .grade-b { color: #00ccff; text-shadow: 0 0 30px rgba(0, 200, 255, 0.5); }
        .grade-c { color: #ffaa00; text-shadow: 0 0 30px rgba(255, 170, 0, 0.5); }
        .grade-f { color: #ff4444; text-shadow: 0 0 30px rgba(255, 68, 68, 0.5); }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 500px;
            width: 100%;
            margin: 20px 0;
        }

        .result-stat {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.15);
            border-radius: 6px;
            padding: 15px 10px;
        }

        .result-stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00ddff;
        }

        .result-stat-label {
            font-size: 10px;
            color: #4a7a8a;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .results-breakdown {
            max-width: 500px;
            width: 100%;
            text-align: left;
            margin: 15px 0;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            font-size: 12px;
            border-bottom: 1px solid rgba(0, 40, 60, 0.3);
        }

        .breakdown-name { color: #8ab0c0; }
        .breakdown-result { font-weight: bold; }
        .breakdown-result.pass { color: #00ff88; }
        .breakdown-result.fail { color: #ff4444; }
        .breakdown-result.partial { color: #ffaa00; }

        .results-perf {
            font-size: 14px;
            color: #8ab0c0;
            margin: 15px 0;
            max-width: 500px;
            line-height: 1.6;
        }

        .results-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        /* ----- Auto-capture toggle ----- */
        .autocap-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #4a8a9a;
            user-select: none;
        }

        .autocap-toggle input { display: none; }

        .toggle-track {
            width: 28px;
            height: 14px;
            background: #1a2a3a;
            border-radius: 7px;
            position: relative;
            transition: background 0.3s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px;

class PacketSnifferGame {
    constructor() {
        this.currentScenario = 0;
        this.score = 0;
        this.totalPossible = 0;
        this.results = [];
        this.packets = [];
        this.capturedPackets = [];
        this.flaggedIndices = new Set();
        this.selectedPacketIdx = -1;
        this.filterProto = new Set();
        this.filterExpr = '';
        this.flagMode = false;
        this.autoCapture = true;
        this.isCapturing = false;
        this.animPackets = [];
        this.canvas = null;
        this.ctx = null;
        this.animFrame = null;
        this.hintUsed = false;

        this.loadProgress();
        this.showStartScreen();
    }

    // ---- localStorage ----
    loadProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (saved.completedScenarios) {
                this.completedScenarios = saved.completedScenarios;
            } else {
                this.completedScenarios = [];
            }
            this.bestScore = saved.bestScore || 0;
        } catch(e) {
            this.completedScenarios = [];
            this.bestScore = 0;
        }
    }

    saveProgress() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            completedScenarios: this.completedScenarios,
            bestScore: this.bestScore,
            lastPlayed: new Date().toISOString()
        }));
    }

    // ---- Start Screen ----
    showStartScreen() {
        const root = document.getElementById('appRoot');
        root.innerHTML = `
            <div class="start-screen">
                <h1>PACKET SNIFFER</h1>
                <div class="subtitle">NETWORK TRAFFIC ANALYSIS SIMULATOR</div>
                <div class="start-info">
                    <h2>// MISSION BRIEFING</h2>
                    <ul>
                        <li>You are a SOC analyst monitoring live network traffic</li>
                        <li>Packets flow across a network visualization in real-time</li>
                        <li>Each scenario presents a security investigation challenge</li>
                        <li>Capture, filter, and analyze packets to find suspicious activity</li>
                        <li>Flag the malicious packets and submit your findings</li>
                    </ul>
                    <h2>// CONTROLS</h2>
                    <ul>
                        <li>Click packets in the capture table to view details</li>
                        <li>Use protocol filter buttons to narrow results</li>
                        <li>Type expressions in the filter bar (IP, port, keyword)</li>
                        <li>Toggle FLAG MODE to mark suspicious packets (red)</li>
                        <li>Submit your flagged packets when you've found the threat</li>
                    </ul>
                    <h2>// SCENARIOS: 10 INVESTIGATIONS</h2>
                    <ul>
                        <li>Difficulty ranges from basic capture to full incident response</li>
                        <li>Each solved scenario earns points based on accuracy</li>
                        <li>Hints are available but reduce your score</li>
                        <li>${this.bestScore > 0 ? `Best score: ${this.bestScore} / ${SCENARIOS.length * 100}` : 'No previous attempts recorded'}</li>
                    </ul>

            </div>
        `;
        document.getElementById('scenarioDisplay').textContent = '--';
        document.getElementById('scoreDisplay').textContent = '0';
        document.getElementById('capturedDisplay').textContent = '0';
        document.getElementById('flaggedDisplay').textContent = '0';
    }

    // ---- Start Investigation ----
    startInvestigation() {
        this.currentScenario = 0;
        this.score = 0;
        this.totalPossible = 0;
        this.results = [];
        this.nextScenario();
    }

    // ---- Load Scenario ----
    nextScenario() {
        if (this.currentScenario >= SCENARIOS.length) {
            this.showResults();
            return;
        }

        const scenario = SCENARIOS[this.currentScenario];
        this.packets = [];
        this.capturedPackets = [];
        this.flaggedIndices = new Set();
        this.selectedPacketIdx = -1;
        this.filterProto = new Set();
        this.filterExpr = '';
        this.flagMode = false;
        this.autoCapture = true;
        this.isCapturing = false;
        this.hintUsed = false;
        this.animPackets = [];

        // Generate packets
        const rawPackets = scenario.packetPool();
        rawPackets.forEach((p, i) => {
            p.id = i;
            p.captured = false;
            p.flagged = false;
        });
        this.packets = rawPackets;

        this.updateStatusBar();
        this.renderMainUI(scenario);

        // Start animation
        setTimeout(() => {
            this.initCanvas();
            this.startCapture();
        }, 100);
    }

    // ---- Render Main UI ----
    renderMainUI(scenario) {
        const root = document.getElementById('appRoot');
        root.innerHTML = `

    // ---- Canvas: Network Visualization ----
    initCanvas() {
        this.canvas = document.getElementById('networkCanvas');
        if (!this.canvas) return;
        const container = this.canvas.parentElement;
        this.canvas.width = container.clientWidth;
        this.canvas.height = container.clientHeight;
        this.ctx = this.canvas.getContext('2d');

        if (this.animFrame) cancelAnimationFrame(this.animFrame);
        this.drawNetwork();
    }

    drawNetwork() {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;

        ctx.clearRect(0, 0, W, H);

        // Background grid
        ctx.strokeStyle = 'rgba(0, 80, 120, 0.06)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Links
        NETWORK_LINKS.forEach(([fromId, toId]) => {
            const from = getNode(fromId);
            const to = getNode(toId);
            if (!from || !to) return;
            const fx = from.x * W, fy = from.y * H;
            const tx = to.x * W, ty = to.y * H;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(tx, ty);
            ctx.strokeStyle = 'rgba(0, 140, 200, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // Animated packets
        const now = Date.now();
        this.animPackets = this.animPackets.filter(ap => ap.progress < 1);
        this.animPackets.forEach(ap => {
            ap.progress += 0.008 + Math.random() * 0.004;
            if (ap.progress > 1) ap.progress = 1;

            const from = getNode(ap.fromNode);
            const to = getNode(ap.toNode);
            if (!from || !to) return;

            const fx = from.x * W, fy = from.y * H;
            const tx = to.x * W, ty = to.y * H;
            const px = fx + (tx - fx) * ap.progress;
            const py = fy + (ty - fy) * ap.progress;

            const color = PROTO_COLORS[ap.protocol] || '#00aaff';

            // Trail
            const trailLen = 0.08;
            const tp = Math.max(0, ap.progress - trailLen);
            const tpx = fx + (tx - fx) * tp;
            const tpy = fy + (ty - fy) * tp;
            const grad = ctx.createLinearGradient(tpx, tpy, px, py);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, color);
            ctx.beginPath();
            ctx.moveTo(tpx, tpy);
            ctx.lineTo(px, py);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Dot
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = color.replace(')', ',0.2)').replace('rgb', 'rgba');
            ctx.fill();
        });

        // Nodes
        NETWORK_NODES.forEach(node => {
            const nx = node.x * W;
            const ny = node.y * H;

            // Outer glow
            ctx.beginPath();
            ctx.arc(nx, ny, 22, 0, Math.PI * 2);
            ctx.fillStyle = node.color.replace(')', ',0.08)').replace('#', '');
            const glowColor = node.color + '14';
            ctx.fillStyle = 'rgba(0,100,150,0.08)';
            ctx.fill();

            // Node circle
            ctx.beginPath();
            ctx.arc(nx, ny, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#0a1420';
            ctx.fill();
            ctx.strokeStyle = node.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Icon text
            ctx.fillStyle = node.color;
            ctx.font = 'bold 9px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.icon, nx, ny);

            // Label
            ctx.fillStyle = 'rgba(150, 200, 220, 0.6)';
            ctx.font = '9px Courier New';
            ctx.fillText(node.label, nx, ny + 26);
        });

        this.animFrame = requestAnimationFrame(() => this.drawNetwork());
    }

    // ---- Capture Simulation ----
    startCapture() {
        this.isCapturing = true;
        const dot = document.getElementById('captureDot');
        const label = document.getElementById('captureLabel');
        if (dot) { dot.classList.add('active'); }
        if (label) { label.classList.add('active'); label.textContent = 'CAPTURING'; }

        let idx = 0;
        const captureNext = () => {
            if (idx >= this.packets.length || !this.isCapturing) {
                this.isCapturing = false;
                if (dot) dot.classList.remove('active');
                if (label) { label.classList.remove('active'); label.textContent = 'CAPTURE COMPLETE'; }
                return;
            }

            const pkt = this.packets[idx];
            pkt.captured = true;
            this.capturedPackets.push(pkt);

            // Add animation
            if (pkt.fromNode && pkt.toNode) {
                this.animPackets.push({
                    fromNode: pkt.fromNode,
                    toNode: pkt.toNode,
                    protocol: pkt.protocol,
                    progress: 0
                });
            }

            this.renderPacketRow(pkt, this.capturedPackets.length - 1);
            this.updateStatusBar();

            idx++;
            const delay = 200 + Math.random() * 300;
            setTimeout(captureNext, delay);
        };

        setTimeout(captureNext, 500);
    }

    // ---- Render Packet Row ----
    renderPacketRow(pkt, displayIdx) {
        const tbody = document.getElementById('packetTableBody');
        if (!tbody) return;

        const tr = document.createElement('tr');
        tr.dataset.pktId = pkt.id;
        if (pkt.flagged) tr.classList.add('flagged');

        tr.innerHTML = `
            <td>${displayIdx + 1}</td>
            <td>${pkt.time}</td>
            <td>${pkt.src}</td>
            <td>${pkt.srcPort || ''}</td>
            <td>${pkt.dst}</td>
            <td>${pkt.dstPort || ''}</td>
            <td class="${protoClass(pkt.protocol)}">${pkt.protocol}</td>
            <td>${pkt.length}</td>
            <td>${pkt.info}</td>
        `;

        tr.addEventListener('click', () => {
            if (this.flagMode) {
                this.toggleFlag(pkt.id);
            } else {
                this.selectPacket(pkt.id);
            }
        });

        tbody.appendChild(tr);
        tr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        // Check filter visibility
        if (!this.passesFilter(pkt)) {
            tr.style.display = 'none';
        }

        // Auto-scroll
        const wrapper = document.getElementById('packetListWrapper');
        if (wrapper) {
            wrapper.scrollTop = wrapper.scrollHeight;
        }
    }

    // ---- Filtering ----
    passesFilter(pkt) {
        // Protocol filter
        if (this.filterProto.size > 0 && !this.filterProto.has(pkt.protocol)) {
            return false;
        }
        // Expression filter
        if (this.filterExpr) {
            const expr = this.filterExpr.toLowerCase();
            const searchable = `${pkt.src} ${pkt.dst} ${pkt.srcPort} ${pkt.dstPort} ${pkt.protocol} ${pkt.info} ${pkt.flags} ${pkt.payload}`.toLowerCase();
            if (!searchable.includes(expr)) {
                return false;
            }
        }
        return true;
    }

    applyFilter() {
        this.filterExpr = (document.getElementById('filterExpr') || {}).value || '';
        this.refreshTableVisibility();
    }

    toggleProto(proto, btn) {
        if (this.filterProto.has(proto)) {
            this.filterProto.delete(proto);
            btn.classList.remove('active');
        } else {
            this.filterProto.add(proto);
            btn.classList.add('active');
        }
        this.refreshTableVisibility();
    }

    refreshTableVisibility() {
        const tbody = document.getElementById('packetTableBody');
        if (!tbody) return;
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            const pktId = parseInt(row.dataset.pktId);
            const pkt = this.packets.find(p => p.id === pktId);
            if (pkt) {
                row.style.display = this.passesFilter(pkt) ? '' : 'none';
            }
        });
    }

    // ---- Flag Mode ----
    toggleFlagMode() {
        this.flagMode = !this.flagMode;
        const btn = document.getElementById('flagModeBtn');
        if (btn) {
            btn.classList.toggle('active', this.flagMode);
            btn.textContent = this.flagMode ? 'FLAG MODE ON' : 'FLAG MODE';
        }
        // Change cursor on table
        const wrapper = document.getElementById('packetListWrapper');
        if (wrapper) {
            wrapper.style.cursor = this.flagMode ? 'crosshair' : 'default';
        }
    }

    toggleFlag(pktId) {
        const pkt = this.packets.find(p => p.id === pktId);
        if (!pkt) return;

        pkt.flagged = !pkt.flagged;
        if (pkt.flagged) {
            this.flaggedIndices.add(pktId);
        } else {
            this.flaggedIndices.delete(pktId);
        }

        // Update row visual
        const tbody = document.getElementById('packetTableBody');
        if (tbody) {
            const row = tbody.querySelector(`tr[data-pkt-id="${pktId}"]`);
            if (row) {
                row.classList.toggle('flagged', pkt.flagged);
            }
        }

        this.updateStatusBar();
        this.selectPacket(pktId);
    }

    // ---- Select Packet ----
    selectPacket(pktId) {
        this.selectedPacketIdx = pktId;
        const pkt = this.packets.find(p => p.id === pktId);
        if (!pkt) return;

        // Highlight row
        const tbody = document.getElementById('packetTableBody');
        if (tbody) {
            tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
            const row = tbody.querySelector(`tr[data-pkt-id="${pktId}"]`);
            if (row) row.classList.add('selected');
        }

        // Render detail
        const panel = document.getElementById('detailPanel');
        if (!panel) return;

        const hexDump = this.generateHexDump(pkt);

        panel.innerHTML = `
            <div class="detail-section">
                <div class="detail-section-title">FRAME INFO</div>
                <div class="detail-row"><span class="detail-key">Packet #</span><span class="detail-val">${pkt.id + 1}</span></div>
                <div class="detail-row"><span class="detail-key">Time</span><span class="detail-val">${pkt.time}</span></div>
                <div class="detail-row"><span class="detail-key">Length</span><span class="detail-val">${pkt.length} bytes</span></div>
                <div class="detail-row"><span class="detail-key">Status</span><span class="detail-val" style="color:${pkt.flagged ? '#ff4444' : '#4a8a6a'}">${pkt.flagged ? 'FLAGGED' : 'Normal'}</span></div>
            </div>
            <div class="detail-section">
                <div class="detail-section-title">NETWORK LAYER</div>
                <div class="detail-row"><span class="detail-key">Source IP</span><span class="detail-val">${pkt.src}</span></div>
                <div class="detail-row"><span class="detail-key">Destination IP</span><span class="detail-val">${pkt.dst}</span></div>
                <div class="detail-row"><span class="detail-key">Protocol</span><span class="detail-val ${protoClass(pkt.protocol)}">${pkt.protocol}</span></div>
            </div>
            <div class="detail-section">
                <div class="detail-section-title">TRANSPORT LAYER</div>
                <div class="detail-row"><span class="detail-key">Src Port</span><span class="detail-val">${pkt.srcPort || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-key">Dst Port</span><span class="detail-val">${pkt.dstPort || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-key">Flags</span><span class="detail-val">${pkt.flags || 'None'}</span></div>
            </div>
            ${pkt.payload ? `
            <div class="detail-section">
                <div class="detail-section-title">PAYLOAD PREVIEW</div>
                <div class="payload-preview">${this.escapeHtml(pkt.payload)}</div>
            </div>
            ` : ''}
            <div class="detail-section">
                <div class="detail-section-title">HEX DUMP</div>
                <div class="hex-dump">${hexDump}</div>
            </div>
        `;
    }

    generateHexDump(pkt) {
        // Generate a realistic-looking hex dump from packet content
        const text = `${pkt.src}:${pkt.srcPort}>${pkt.dst}:${pkt.dstPort} ${pkt.protocol} ${pkt.info} ${pkt.payload || ''}`;
        const bytes = [];
        for (let i = 0; i < Math.min(text.length, 128); i++) {
            bytes.push(text.charCodeAt(i));
        }
        // Pad to fill some rows
        while (bytes.length % 16 !== 0) bytes.push(0);

        let result = '';
        for (let row = 0; row < bytes.length; row += 16) {
            const offset = row.toString(16).padStart(4, '0');
            let hexPart = '';
            let asciiPart = '';
            for (let col = 0; col < 16; col++) {
                const idx = row + col;
                if (idx < bytes.length) {
                    const b = bytes[idx];
                    hexPart += `<span class="hex-byte">${b.toString(16).padStart(2, '0')}</span> `;
                    asciiPart += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
                } else {
                    hexPart += '   ';
                    asciiPart += ' ';
                }
                if (col === 7) hexPart += ' ';
            }
            result += `<span class="hex-offset">${offset}</span>  ${hexPart} <span class="hex-ascii">|${asciiPart}|</span>\n`;
        }
        return result;
    }

    escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---- Hint ----
    useHint() {
        if (this.hintUsed) return;
        this.hintUsed = true;
        const scenario = SCENARIOS[this.currentScenario];
        const hintArea = document.getElementById('hintArea');
        if (hintArea) {
            hintArea.textContent = scenario.hint;
            hintArea.style.animation = 'slideIn 0.3s ease';
        }
        const hintBtn = document.getElementById('hintBtn');
        if (hintBtn) hintBtn.disabled = true;
    }

    // ---- Submit Findings ----
    submitFindings() {
        if (this.flaggedIndices.size === 0) {
            // Quick confirmation
            if (!confirm('You haven\'t flagged any packets. Submit with no findings?')) return;
        }

        this.isCapturing = false;
        const scenario = SCENARIOS[this.currentScenario];
        const criteria = scenario.successCriteria;

        // Evaluate
        let correctFlags = 0;
        let totalSuspicious = 0;
        let wrongFlags = 0;

        this.packets.forEach(pkt => {
            const isSuspicious = this.evaluatePacket(pkt, criteria);
            if (isSuspicious) totalSuspicious++;
            if (pkt.flagged) {
                if (isSuspicious) {
                    correctFlags++;
                } else {
                    wrongFlags++;
                }
            }
        });

        const accuracy = totalSuspicious > 0 ? correctFlags / totalSuspicious : 0;
        const penalty = wrongFlags * 0.1;
        let scoreRaw = Math.max(0, accuracy - penalty);
        if (this.hintUsed) scoreRaw *= 0.8;

        const scenarioScore = Math.round(scoreRaw * 100);
        this.score += scenarioScore;
        this.totalPossible += 100;

        const passed = correctFlags >= criteria.minCount;

        this.results.push({
            id: scenario.id,
            title: scenario.title,
            passed: passed,
            score: scenarioScore,
            correctFlags,
            totalSuspicious,
            wrongFlags,
            hintUsed: this.hintUsed
        });

        // Show feedback
        this.showFeedback(scenario, passed, scenarioScore, correctFlags, totalSuspicious, wrongFlags);
    }

    evaluatePacket(pkt, criteria) {
        if (criteria.matchField === 'suspicious' && criteria.matchValue === true) {
            return pkt.suspicious === true;
        }
        let match1 = true;
        let match2 = true;

        if (criteria.matchField && criteria.matchPattern) {
            match1 = criteria.matchPattern.test(pkt[criteria.matchField] || '');
        }
        if (criteria.matchField && criteria.matchValue !== undefined && !criteria.matchPattern) {
            match1 = String(pkt[criteria.matchField]) === String(criteria.matchValue);
        }

        if (criteria.matchField2) {
            if (criteria.matchPattern2) {
                match2 = criteria.matchPattern2.test(pkt[criteria.matchField2] || '');
            } else if (criteria.matchValue2 !== undefined) {
                match2 = String(pkt[criteria.matchField2]) === String(criteria.matchValue2);
            } else if (criteria.minValue !== undefined) {
                match2 = (parseInt(pkt[criteria.matchField2]) || 0) >= criteria.minValue;
            }
        } else {
            match2 = true;
        }

        return match1 && match2;
    }

    showFeedback(scenario, passed, scenarioScore, correctFlags, totalSuspicious, wrongFlags) {
        let feedbackClass = 'success';
        let icon = '&#10003;';
        let title = 'INVESTIGATION SUCCESSFUL';

        if (!passed) {
            if (correctFlags > 0) {
                feedbackClass = 'partial';
                icon = '<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">';
                title = 'PARTIAL FINDINGS';
            } else {
                feedbackClass = 'failure';
                icon = '&#10007;';
                title = 'INVESTIGATION FAILED';
            }
        }

        const overlay = document.createElement('div');
        overlay.className = 'feedback-overlay';
        overlay.innerHTML = `
            <div class="feedback-card ${feedbackClass}">
                <div class="feedback-icon">${icon}</div>
                <div class="feedback-title">${title}</div>
                <div class="feedback-score">Score: ${scenarioScore} / 100 ${this.hintUsed ? '(hint penalty: -20%)' : ''}</div>
                <div class="feedback-explanation">
                    <strong>Findings:</strong> You correctly flagged ${correctFlags} of ${totalSuspicious} suspicious packets${wrongFlags > 0 ? ` with ${wrongFlags} false positive(s)` : ''}.<br><br>
                    <strong>Analysis:</strong> ${scenario.explanation}
                </div>
                <button class="feedback-btn" onclick="game.closeFeedback()">
                    ${this.currentScenario < SCENARIOS.length - 1 ? 'NEXT SCENARIO' : 'VIEW RESULTS'}
                </button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    closeFeedback() {
        const overlay = document.querySelector('.feedback-overlay');
        if (overlay) overlay.remove();

        if (this.animFrame) cancelAnimationFrame(this.animFrame);
        this.currentScenario++;
        this.nextScenario();
    }

    // ---- Update Status Bar ----
    updateStatusBar() {
        const scenario = SCENARIOS[this.currentScenario];
        document.getElementById('scenarioDisplay').textContent = scenario ? `${this.currentScenario + 1}/${SCENARIOS.length}` : '--';
        document.getElementById('scoreDisplay').textContent = this.score;
        document.getElementById('capturedDisplay').textContent = this.capturedPackets.length;
        document.getElementById('flaggedDisplay').textContent = this.flaggedIndices.size;

        const capturedEl = document.getElementById('capturedCount');
        if (capturedEl) capturedEl.textContent = `${this.capturedPackets.length} captured`;
        const flaggedEl = document.getElementById('flaggedCount');
        if (flaggedEl) flaggedEl.textContent = `${this.flaggedIndices.size} flagged`;
    }

    // ---- Results Screen ----
    showResults() {
        if (this.animFrame) cancelAnimationFrame(this.animFrame);

        const totalScore = this.score;
        const maxScore = SCENARIOS.length * 100;
        const pct = totalScore / maxScore;
        const passed = this.results.filter(r => r.passed).length;

        let grade, gradeClass;
        if (pct >= 0.95) { grade = 'S'; gradeClass = 'grade-s'; }
        else if (pct >= 0.80) { grade = 'A'; gradeClass = 'grade-a'; }
        else if (pct >= 0.65) { grade = 'B'; gradeClass = 'grade-b'; }
        else if (pct >= 0.45) { grade = 'C'; gradeClass = 'grade-c'; }
        else { grade = 'F'; gradeClass = 'grade-f'; }

        let perfText = '';
        if (pct >= 0.95) perfText = 'Outstanding. You have elite-level packet analysis skills. SOC teams would be lucky to have you.';
        else if (pct >= 0.80) perfText = 'Excellent work. You demonstrate strong network forensics capabilities and solid threat detection instincts.';
        else if (pct >= 0.65) perfText = 'Good performance. You can identify common attack patterns. Keep refining your filter and analysis techniques.';
        else if (pct >= 0.45) perfText = 'You found some threats but missed key indicators. Review the scenarios where you struggled and try again.';
        else perfText = 'The network remains compromised. Study the attack patterns described in each scenario explanation and attempt again.';

        const root = document.getElementById('appRoot');
        root.innerHTML = `
            <div class="results-screen">
                <h1>INVESTIGATION COMPLETE</h1>
                <div class="final-grade ${gradeClass}">${grade}</div>
                <div class="results-stats">
                    <div class="result-stat">
                        <div class="result-stat-value">${totalScore}</div>
                        <div class="result-stat-label">TOTAL SCORE</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value">${passed}/${SCENARIOS.length}</div>
                        <div class="result-stat-label">SCENARIOS PASSED</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value">${Math.round(pct * 100)}%</div>
                        <div class="result-stat-label">ACCURACY</div>
                    </div>
                </div>
                <div class="results-breakdown">
                    ${this.results.map(r => `
                        <div class="breakdown-row">
                            <span class="breakdown-name">${r.title}</span>
                            <span class="breakdown-result ${r.passed ? 'pass' : r.correctFlags > 0 ? 'partial' : 'fail'}">
                                ${r.score}/100 ${r.hintUsed ? '(H)' : ''} ${r.passed ? 'PASS' : r.correctFlags > 0 ? 'PARTIAL' : 'FAIL'}
                            </span>
                        </div>
                    `).join('')}
                </div>
                <div class="results-perf">${perfText}</div>
                <div class="results-actions">
                    <button class="start-btn" onclick="game.startInvestigation()">REPLAY ALL</button>
                    <button class="start-btn" onclick="game.showStartScreen()" style="background:linear-gradient(135deg,#1a1a2a,#0a0a1a);border-color:#4488ff;color:#4488ff;">MAIN MENU</button>
                </div>
            </div>
        `;

        // Save progress and award XP/achievements
        if (totalScore > this.bestScore) {
            this.bestScore = totalScore;
        }
        this.saveProgress();

        // XP award (one-time, or on improvement)
        if (passed >= 5) {
            if (!localStorage.getItem('game_packetsniffer_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_packetsniffer_xp_awarded', 'true');
                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    FirestoreManager.addXP(null, 50, 'Packet Sniffer Complete'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
                }
            }
            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_packetsniffer');
            }
        }

        // Track game completion
        if (typeof GameTracker !== 'undefined') {
            GameTracker.record('packetsniffer', { score: totalScore, total: maxScore, passed: passed });
        }

        // Save to hexworth_progress
        const progress = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
        if (!progress.web) progress.web = {};
        progress.web['packet-sniffer'] = {
            completed: true,
            completedAt: new Date().toISOString(),
            score: totalScore,
            maxScore: maxScore,
            passed: passed,
            grade: grade
        };
        localStorage.setItem('hexworth_progress', JSON.stringify(progress));
    }
}
