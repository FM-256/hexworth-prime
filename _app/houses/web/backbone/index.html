   Prefix: bb-
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --bb-primary:#22d3ee;
    --bb-secondary:#06b6d4;
    --bb-accent:#0891b2;
    --bb-glow:rgba(34,211,238,0.18);
    --bb-bg:#090910;
    --bb-surface:rgba(255,255,255,0.03);
    --bb-surface-solid:#111120;
    --bb-border:rgba(34,211,238,0.12);
    --bb-border-light:rgba(255,255,255,0.06);
    --bb-text:#e2e8f0;
    --bb-muted:#8b949e;
    --bb-dim:#444;
}
body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bb-bg);color:var(--bb-text);
    min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ---- Particle field ---- */
.bb-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bb-particle{
    position:absolute;bottom:-10px;border-radius:50%;
    color:var(--bb-primary);
    animation:bbFloat linear infinite;
}
@keyframes bbFloat{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:var(--o,0.25)}
    90%{opacity:var(--o,0.25)}
    100%{transform:translateY(-100vh) rotate(360deg);opacity:0}
}

/* ---- Ambient glow ---- */
.bb-ambient{
    position:fixed;top:-200px;left:50%;width:800px;height:500px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(6,182,212,0.07) 0%,transparent 70%);
    pointer-events:none;z-index:0;
}

/* ---- Header ---- */
.bb-header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:rgba(9,9,16,0.93);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(34,211,238,0.18);
}
.bb-header-left{display:flex;align-items:center;gap:12px}
.bb-header-icon{border-radius:6px}
.bb-header-title{font-size:16px;font-weight:700;color:var(--bb-primary)}
.bb-header-sub{font-size:12px;color:var(--bb-muted)}
.bb-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;
    background:rgba(34,211,238,0.08);color:var(--bb-primary);
    border:1px solid rgba(34,211,238,0.22);transition:all 0.2s;cursor:pointer;
}
.bb-btn:hover{background:rgba(34,211,238,0.15)}

/* ---- Breadcrumb ---- */
.bb-breadcrumb{
    padding:10px 24px;font-size:13px;color:var(--bb-muted);
    background:rgba(9,9,16,0.6);border-bottom:1px solid rgba(255,255,255,0.04);
    position:relative;z-index:99;
}
.bb-breadcrumb a{color:var(--bb-primary);text-decoration:none;transition:opacity 0.2s}
.bb-breadcrumb a:hover{opacity:0.8}
.bb-breadcrumb-sep{margin:0 8px;color:var(--bb-dim)}
.bb-breadcrumb-current{color:var(--bb-text)}

/* ---- Main container ---- */
.bb-main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}

/* ---- Hero ---- */
.bb-hero{text-align:center;padding:52px 0 36px}
.bb-hero-title{
    font-size:48px;font-weight:800;
    background:linear-gradient(135deg,#22d3ee,#06b6d4,#67e8f9);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.1;
}
.bb-hero-subtitle{
    font-size:18px;color:var(--bb-muted);margin-top:12px;
    max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5;
}
.bb-hero-tagline{
    display:inline-block;margin-top:18px;padding:6px 16px;border-radius:20px;
    font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    background:rgba(34,211,238,0.08);color:var(--bb-primary);
    border:1px solid rgba(34,211,238,0.2);
}
.bb-hero-stats{display:flex;justify-content:center;gap:48px;margin-top:28px;flex-wrap:wrap}
.bb-stat{text-align:center}
.bb-stat-num{display:block;font-size:32px;font-weight:800;color:var(--bb-primary)}
.bb-stat-label{font-size:11px;color:var(--bb-muted);text-transform:uppercase;letter-spacing:1px}

/* ---- Section headings ---- */
.bb-section{margin-top:40px}
.bb-section-title{
    font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--bb-primary);margin-bottom:16px;
    display:flex;align-items:center;gap:10px;
}
.bb-section-title::after{
    content:'';flex:1;height:1px;background:var(--bb-border);
}

/* ---- Overview panel ---- */
.bb-overview{
    background:var(--bb-surface);border:1px solid var(--bb-border);
    border-radius:14px;padding:28px;
}
.bb-overview-body{
    font-size:14px;color:var(--bb-muted);line-height:1.75;margin-bottom:20px;
}
.bb-domains{display:flex;flex-wrap:wrap;gap:8px}
.bb-domain-pill{
    font-size:11px;font-weight:600;padding:4px 12px;border-radius:6px;
    background:rgba(34,211,238,0.07);color:var(--bb-primary);
    border:1px solid rgba(34,211,238,0.15);letter-spacing:0.3px;
}

/* ---- Prerequisites ---- */
.bb-prereq-panel{
    background:var(--bb-surface);border:1px solid var(--bb-border);
    border-radius:14px;padding:24px;
}
.bb-prereq-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.bb-prereq-card{
    display:flex;align-items:flex-start;gap:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--bb-border-light);
    border-radius:10px;padding:14px 18px;min-width:200px;flex:1;
}
.bb-prereq-card-icon{width:28px;height:28px;flex-shrink:0;border-radius:4px}
.bb-prereq-card-name{font-size:14px;font-weight:600;color:var(--bb-text);margin-bottom:2px}
.bb-prereq-card-desc{font-size:12px;color:var(--bb-muted);line-height:1.4}
.bb-prereq-note{
    margin-top:14px;padding:10px 16px;border-radius:8px;
    background:rgba(34,211,238,0.04);border:1px solid rgba(34,211,238,0.1);
    font-size:12px;color:var(--bb-muted);line-height:1.5;
}

/* ---- Course grid ---- */
.bb-course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
}
.bb-course-card{
    background:var(--bb-surface);border:1px solid var(--bb-border-light);
    border-radius:14px;padding:24px;
    position:relative;overflow:hidden;
    transition:all 0.25s;
}
.bb-course-card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--card-color, var(--bb-primary));
    opacity:0.6;
}
.bb-course-card:hover{
    border-color:var(--card-color, var(--bb-primary));
    box-shadow:0 8px 28px rgba(0,0,0,0.4);
    transform:translateY(-2px);
}
.bb-card-glow{
    position:absolute;top:-40px;right:-40px;width:130px;height:130px;
    background:radial-gradient(circle,var(--card-glow,rgba(34,211,238,0.07)) 0%,transparent 70%);
    pointer-events:none;
}
.bb-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.bb-card-head-left{display:flex;align-items:center;gap:10px}
.bb-card-icon{width:36px;height:36px;border-radius:8px}
.bb-card-id{
    font-size:10px;font-weight:700;letter-spacing:0.5px;
    color:var(--card-color, var(--bb-primary));opacity:0.75;
    font-family:'Courier New',monospace;

.bb-card-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.bb-card-desc{font-size:12px;color:var(--bb-muted);line-height:1.5;margin-bottom:12px;min-height:48px}

/* ---- Difficulty badge ---- */
.bb-diff{
    font-size:9px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.bb-diff--intermediate{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)}
.bb-diff--advanced{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}

/* ---- Tags ---- */
.bb-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bb-tag{
    font-size:10px;font-weight:600;letter-spacing:0.3px;padding:2px 8px;border-radius:3px;
    background:rgba(255,255,255,0.05);color:var(--bb-muted);
    border:1px solid rgba(255,255,255,0.06);
}
.bb-tag--cert{
    background:rgba(34,211,238,0.07);color:var(--bb-primary);
    border:1px solid rgba(34,211,238,0.15);
}

/* ---- Card footer ---- */
.bb-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.bb-card-meta{font-size:11px;color:var(--bb-muted)}
.bb-card-soon{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#f59e0b;padding:3px 10px;border-radius:4px;
    background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);
}
.bb-card-live{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#22d3ee;padding:3px 10px;border-radius:4px;
    background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);
}

/* ---- Career alignment ---- */
.bb-career-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.bb-career-card{
    background:var(--bb-surface);border:1px solid var(--bb-border-light);
    border-radius:12px;padding:20px;
}
.bb-career-icon{width:28px;height:28px;margin-bottom:10px;border-radius:4px}
.bb-career-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.bb-career-desc{font-size:12px;color:var(--bb-muted);line-height:1.5;margin-bottom:10px}
.bb-career-certs{display:flex;flex-wrap:wrap;gap:5px}
.bb-career-cert{
    font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;
    background:rgba(34,211,238,0.07);color:var(--bb-primary);
    border:1px solid rgba(34,211,238,0.14);
}

/* ---- Footer ---- */
.bb-footer{
    text-align:center;padding:32px 0 16px;font-size:12px;color:var(--bb-dim);
    border-top:1px solid rgba(255,255,255,0.05);margin-top:48px;
}

/* ---- Responsive ---- */
@media(max-width:700px){
    .bb-hero-title{font-size:32px}
    .bb-hero-stats{gap:24px}
    .bb-course-grid{grid-template-columns:1fr}
    .bb-career-grid{grid-template-columns:1fr}
    .bb-prereq-grid{flex-direction:column}
}
</style>

            href: 'capstone/index.html'
        }
    ];

    // ---- Career alignment data ----
    const CAREERS = [
        {
            title: 'Network Engineer',
            icon: '../../../assets/images/icons/icon-network.webp',
            desc: 'Design, implement, and maintain enterprise and carrier-grade networks. BGP, MPLS, QoS, and routing deep dives are your core arsenal.',
            certs: ['CCNP Enterprise', 'CCNP SP', 'Network+']
        },
        {
            title: 'Cloud Architect',
            icon: '../../../assets/images/icons/icon-compass.webp',
            desc: 'Connect on-premises infrastructure to cloud platforms. SD-WAN, IPv6 transition, SDN programmability, and data center fabric design dominate this path.',
            certs: ['CCNP Enterprise', 'AWS ANS', 'CCDE']
        },
        {
            title: 'Security Architect',
            icon: '../../../assets/images/icons/icon-shield.webp',
            desc: 'Build networks that resist attack from the ground up. Network security architecture, forensics, zero-trust design, and microsegmentation are your foundation.',
            certs: ['CCNP Security', 'CISSP', 'Security+']
        },
        {
            title: 'HPC / AI Infrastructure Engineer',
            icon: '../../../assets/images/icons/icon-lightning.webp',
            desc: 'Interconnect GPU clusters and supercomputers. InfiniBand, RDMA, optical networking, and ultra-low-latency fabric design separate you from the rest.',
            certs: ['NVIDIA DGX Networking', 'RHCA', 'CCNP Data Center']
        }
    ];

    // ---- Track overview domains ----
    const DOMAINS = [
        'Autonomous System Routing','Label Switching','Data Center Fabrics',
        'High-Performance Interconnects','Network Programmability','SD-WAN',
        'Enterprise Wireless','Optical Transport','IPv6 at Scale',
        'Security Architecture','Packet Forensics','Quality of Service',
        'Interior Routing Protocols','5G / Cellular','Network Design'
    ];

    // ---- Prerequisite definitions ----
    const PREREQS = [
        {
            label: 'Network+',
            icon: '../../../assets/images/icons/icon-graduation.webp',
            desc: 'CompTIA Network+ or equivalent foundational networking knowledge.',
            keys: ['hexworth_comptia_network_complete','hexworth_network_plus_complete','hexworth_web_midterm_passed']
        },
        {
            label: 'CCNA',
            icon: '../../../assets/images/icons/icon-graduation.webp',
            desc: 'Cisco CCNA or completion of the Hexworth networking fundamentals track.',
            keys: ['hexworth_ccna_complete','hexworth_ccna_passed']
        }
    ];

    // ---- Particles ----
    function buildParticles() {
        var container = document.getElementById('bb-particles');
        for (var i = 0; i < 28; i++) {
            var p = document.createElement('span');
            p.className = 'bb-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (7 + Math.random() * 11) + 's';
            p.style.animationDelay = -(Math.random() * 18) + 's';
            p.style.setProperty('--o', String(0.1 + Math.random() * 0.25));
            p.style.fontSize = (3 + Math.random() * 4) + 'px';
            p.textContent = '\u2022';
            container.appendChild(p);
        }
    }

    // ---- Hero section ----
    function buildHero() {
        var div = document.createElement('section');
        div.className = 'bb-hero';
        div.innerHTML =
            '<h2 class="bb-hero-title">The Backbone</h2>' +
            '<div class="bb-hero-subtitle">Beyond Network+ and CCNA. Master enterprise-grade networking from data center fabrics and service provider routing to SDN automation and zero-trust architecture.</div>' +
            '<div class="bb-hero-tagline">Advanced Networking Track</div>' +
            '<div class="bb-hero-stats">' +
                '<div class="bb-stat"><span class="bb-stat-num">' + COURSES.length + '</span><span class="bb-stat-label">Courses</span></div>' +
                '<div class="bb-stat"><span class="bb-stat-num">' + (COURSES.length * 10) + '</span><span class="bb-stat-label">Modules</span></div>' +
                '<div class="bb-stat"><span class="bb-stat-num">4</span><span class="bb-stat-label">Career Paths</span></div>' +
                '<div class="bb-stat"><span class="bb-stat-num">8+</span><span class="bb-stat-label">Cert Alignments</span></div>' +
            '</div>';
        return div;
    }

    // ---- Overview section ----
    function buildOverview() {
        var section = document.createElement('div');
        section.className = 'bb-section';
        section.innerHTML = '<div class="bb-section-title">Track Overview</div>';

        var panel = document.createElement('div');
        panel.className = 'bb-overview';
        panel.innerHTML =
            '<div class="bb-overview-body">' +
                'The Backbone is Hexworth Prime\'s advanced networking curriculum, built for students who have completed foundational networking and are ready to operate at the carrier, enterprise, and data center level. ' +
                'The fifteen courses span every critical domain of modern network engineering: from the routing protocols that run the global internet, to the optical physical layer that carries it, ' +
                'to the security architectures that defend it. Courses are designed to align with industry certifications from Cisco, CompTIA, and specialized vendors, ' +
                'and to prepare students for the level of depth expected in senior network engineering and architecture roles.' +
            '</div>' +
            '<div class="bb-domains" id="bb-domains"></div>';
        section.appendChild(panel);

        setTimeout(function() {
            var container = document.getElementById('bb-domains');
            if (!container) return;
            DOMAINS.forEach(function(d) {
                var pill = document.createElement('span');
                pill.className = 'bb-domain-pill';
                pill.textContent = d;
                container.appendChild(pill);
            });
        }, 0);

        return section;
    }

    // ---- Prerequisites section ----
    function buildPrereqs() {
        var section = document.createElement('div');
        section.className = 'bb-section';
        section.innerHTML = '<div class="bb-section-title">Prerequisites</div>';

        var panel = document.createElement('div');
        panel.className = 'bb-prereq-panel';

        var gridDiv = document.createElement('div');
        gridDiv.className = 'bb-prereq-grid';

        PREREQS.forEach(function(p) {
            var earned = p.keys.some(function(k) {
                try { return localStorage.getItem(k) === 'true'; } catch(e) { return false; }
            });
            var card = document.createElement('div');
            card.className = 'bb-prereq-card';
            card.innerHTML =
                '<img class="bb-prereq-card-icon" src="' + p.icon + '" alt="">' +
                '<div>' +
                    '<div class="bb-prereq-card-name">' + p.label + (earned ? ' <span style="color:var(--bb-primary);font-size:10px">[Earned]</span>' : '') + '</div>' +
                    '<div class="bb-prereq-card-desc">' + p.desc + '</div>' +
                '</div>';
            gridDiv.appendChild(card);
        });
        panel.appendChild(gridDiv);

        var note = document.createElement('div');
        note.className = 'bb-prereq-note';
        note.innerHTML =
            'Students should complete the Web House networking fundamentals track (Network+) before starting The Backbone. ' +
            'Several advanced courses additionally recommend CCNA-level routing and switching knowledge. ' +
            'All courses are browsable regardless of prerequisite status.';
        panel.appendChild(note);

        section.appendChild(panel);
        return section;
    }

    // ---- Individual course card ----
    function buildCourseCard(course) {
        var card = document.createElement('div');
        card.className = 'bb-course-card';
        card.style.setProperty('--card-color', course.color);
        card.style.setProperty('--card-glow', course.glow);

        var tagsHtml = course.tags.map(function(t) {
            return '<span class="bb-tag">' + t + '</span>';
        }).join('');

        var certsHtml = course.certs.map(function(c) {
            return '<span class="bb-tag bb-tag--cert">' + c + '</span>';
        }).join('');

        card.innerHTML =
            '<div class="bb-card-glow"></div>' +
            '<div class="bb-card-head">' +
                '<div class="bb-card-head-left">' +
                    '<img class="bb-card-icon" src="' + course.icon + '" alt="">' +
                    '<div class="bb-card-id">' + course.id + '</div>' +
                '</div>' +
                '<span class="bb-diff bb-diff--' + course.difficulty + '">' + course.difficulty + '</span>' +
            '</div>' +
            '<div class="bb-card-name">' + course.name + '</div>' +
            '<div class="bb-card-desc">' + course.desc + '</div>' +
            '<div class="bb-card-tags">' + tagsHtml + certsHtml + '</div>' +
            '<div class="bb-card-foot">' +
                '<span class="bb-card-meta">' + course.modules + ' modules</span>' +
                (course.href ? '<span class="bb-card-live">Available</span>' : '<span class="bb-card-soon">Coming Soon</span>') +
            '</div>';

        if (course.href) {
            card.style.cursor = 'pointer';
            card.addEventListener('click', function() { window.location.href = course.href; });
        }

        return card;
    }

    // ---- Course grid section ----
    function buildCourseGrid() {
        var section = document.createElement('div');
        section.className = 'bb-section';
        section.innerHTML = '<div class="bb-section-title">15 Courses</div>';

        var grid = document.createElement('div');
        grid.className = 'bb-course-grid';

        COURSES.forEach(function(course) {
            grid.appendChild(buildCourseCard(course));
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Career alignment section ----
    function buildCareers() {
        var section = document.createElement('div');
        section.className = 'bb-section';
        section.innerHTML = '<div class="bb-section-title">Career Alignment</div>';

        var grid = document.createElement('div');
        grid.className = 'bb-career-grid';

        CAREERS.forEach(function(career) {
            var card = document.createElement('div');
            card.className = 'bb-career-card';

            var certsHtml = career.certs.map(function(c) {
                return '<span class="bb-career-cert">' + c + '</span>';
            }).join('');

            card.innerHTML =
                '<img class="bb-career-icon" src="' + career.icon + '" alt="">' +
                '<div class="bb-career-title">' + career.title + '</div>' +
                '<div class="bb-career-desc">' + career.desc + '</div>' +
                '<div class="bb-career-certs">' + certsHtml + '</div>';

            grid.appendChild(card);
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Footer ----
    function buildFooter() {
        var footer = document.createElement('div');
        footer.className = 'bb-footer';
        footer.innerHTML = 'The Backbone &mdash; Advanced Networking Hub &mdash; House of the Web &mdash; Hexworth Prime';
        return footer;
    }

    // ---- Main render ----
    function render() {
        buildParticles();

        var main = document.getElementById('bb-main');
        main.appendChild(buildHero());
        main.appendChild(buildOverview());
        main.appendChild(buildPrereqs());
        main.appendChild(buildCourseGrid());
        main.appendChild(buildCareers());
        main.appendChild(buildFooter());
    }

    render();

})();
    </script>
</body>
</html>
