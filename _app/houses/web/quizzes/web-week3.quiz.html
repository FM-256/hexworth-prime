<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>

    <script src="../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking Fundamentals &amp; Ports Quiz - House of the Web</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1929 0%, #1a2d4d 50%, #0a1929 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(96, 165, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #93bbfd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Web</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Networking Fundamentals & Ports Quiz',
            description: '30 questions covering networking basics, OSI layers, common ports, protocols, and network devices.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-week3',
            moduleId: 'week3',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,
            questions: [
                {
                    question: "What does LAN stand for?",
                    options: ["Local Area Network", "Large Area Node", "Linked Access Network", "Long Access Node"],explanation: "LAN stands for Local Area Network, a network that connects computers and devices in a limited geographical area such as an office, building, or campus."
                },
                {
                    question: "Which device connects multiple networks together?",
                    options: ["Hub", "Switch", "Router", "Repeater"],explanation: "A router connects multiple networks together and makes forwarding decisions based on IP addresses (Layer 3). Switches operate at Layer 2 within a single network."
                },
                {
                    question: "What layer of the OSI model handles logical addressing?",
                    options: ["Data Link", "Network", "Transport", "Application"],explanation: "The Network layer (Layer 3) handles logical addressing using IP addresses. It is responsible for routing packets between different networks."
                },
                {
                    question: "Which port is used by HTTP?",
                    options: ["21", "25", "80", "110"],explanation: "HTTP (Hypertext Transfer Protocol) uses port 80 by default. HTTPS uses port 443."
                },
                {
                    question: "What protocol uses port 443?",
                    options: ["HTTP", "HTTPS", "FTP", "Telnet"],explanation: "HTTPS (HTTP Secure) uses port 443. It encrypts web traffic using TLS/SSL for secure communications."
                },
                {
                    question: "What is the purpose of DNS?",
                    options: ["Translate IP to MAC", "Translate domain to IP", "Encrypt traffic", "Send mail"],explanation: "DNS (Domain Name System) translates human-readable domain names (like google.com) into IP addresses that computers use to communicate."
                },
                {
                    question: "Which layer adds source and destination MAC addresses?",
                    options: ["Network", "Data Link", "Physical", "Transport"],explanation: "The Data Link layer (Layer 2) adds source and destination MAC addresses to frames for local network delivery."
                },
                {
                    question: "Which port does FTP use for control commands?",
                    options: ["20", "21", "22", "23"],explanation: "FTP uses port 21 for control commands and port 20 for data transfer. SSH/SFTP uses port 22."
                },
                {
                    question: "Which device regenerates signals to extend network length?",
                    options: ["Router", "Repeater", "Switch", "Bridge"],explanation: "A repeater regenerates and amplifies network signals to extend the distance a signal can travel, operating at the Physical layer (Layer 1)."
                },
                {
                    question: "What is the default subnet mask for Class C?",
                    options: ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"],explanation: "Class C networks use a default subnet mask of 255.255.255.0 (/24), allowing up to 254 usable host addresses."
                },
                {
                    question: "What protocol sends emails?",
                    options: ["SMTP", "POP3", "IMAP", "SNMP"],explanation: "SMTP (Simple Mail Transfer Protocol) is used to send emails. POP3 and IMAP are used to receive/retrieve emails."
                },
                {
                    question: "Which port is used by SSH?",
                    options: ["21", "22", "23", "25"],explanation: "SSH (Secure Shell) uses port 22. It provides encrypted remote access to network devices and servers."
                },
                {
                    question: "Which topology uses a single central cable?",
                    options: ["Star", "Bus", "Mesh", "Ring"],explanation: "A bus topology uses a single central cable (backbone) that all devices connect to. A failure in the backbone can bring down the entire network."
                },
                {
                    question: "What is the purpose of ARP?",
                    options: ["Resolve IP to MAC", "Resolve MAC to IP", "Encrypt Data", "Route packets"],explanation: "ARP (Address Resolution Protocol) resolves IP addresses to MAC addresses on a local network, enabling Layer 2 frame delivery."
                },
                {
                    question: "What protocol is used for file transfer over a secure connection?",
                    options: ["FTP", "SFTP", "TFTP", "SMTP"],explanation: "SFTP (SSH File Transfer Protocol) provides secure file transfer over an encrypted SSH connection, unlike plain FTP which transmits data in cleartext."
                },
                {
                    question: "Which layer handles segmentation and reassembly?",
                    options: ["Transport", "Session", "Network", "Presentation"],explanation: "The Transport layer (Layer 4) handles segmentation of data into smaller units and reassembly at the destination. TCP provides reliable, ordered delivery."
                },
                {
                    question: "Which protocol uses port 3389?",
                    options: ["Telnet", "RDP", "SSH", "SNMP"],explanation: "RDP (Remote Desktop Protocol) uses port 3389. It allows graphical remote access to Windows systems."
                },
                {
                    question: "What type of cable is used in Ethernet networks?",
                    options: ["Coaxial", "Twisted Pair", "Fiber only", "Ribbon"],explanation: "Twisted pair cabling (Cat5e, Cat6, Cat6a) is the most common cable type used in Ethernet networks for LAN connections."
                },
                {
                    question: "Which IP class supports up to 254 hosts?",
                    options: ["A", "B", "C", "D"],explanation: "Class C networks support up to 254 usable host addresses (2^8 - 2 = 254, subtracting network and broadcast addresses)."
                },
                {
                    question: "Which port does DNS use?",
                    options: ["25", "53", "110", "161"],explanation: "DNS uses port 53 for both TCP and UDP queries. Most standard DNS queries use UDP, while zone transfers use TCP."
                },
                {
                    question: "Which protocol automatically assigns IP addresses?",
                    options: ["DNS", "NAT", "DHCP", "ICMP"],explanation: "DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses and other network configuration to devices on a network."
                },
                {
                    question: "Which layer of the OSI model provides encryption?",
                    options: ["Presentation", "Session", "Transport", "Data Link"],explanation: "The Presentation layer (Layer 6) handles data encryption, decryption, compression, and format translation between applications."
                },
                {
                    question: "Which port is used for Telnet?",
                    options: ["22", "23", "25", "110"],explanation: "Telnet uses port 23. It provides unencrypted remote access and should be replaced with SSH (port 22) for security."
                },
                {
                    question: "What command checks network connectivity?",
                    options: ["ipconfig", "ping", "netstat", "nslookup"],explanation: "The ping command tests network connectivity by sending ICMP echo requests to a target host and waiting for replies."
                },
                {
                    question: "Which protocol monitors network devices?",
                    options: ["SMTP", "SNMP", "HTTP", "SSH"],explanation: "SNMP (Simple Network Management Protocol) monitors and manages network devices such as routers, switches, servers, and printers."
                },
                {
                    question: "Which port is used by POP3?",
                    options: ["110", "143", "25", "443"],explanation: "POP3 (Post Office Protocol version 3) uses port 110. It downloads emails from the server to the client, typically removing them from the server."
                },
                {
                    question: "Which layer defines hardware addressing?",
                    options: ["Physical", "Data Link", "Network", "Session"],explanation: "The Data Link layer (Layer 2) defines hardware (MAC) addressing. MAC addresses are burned into network interface cards."
                },
                {
                    question: "What device divides a LAN into separate collision domains?",
                    options: ["Hub", "Switch", "Router", "Repeater"],explanation: "A switch creates a separate collision domain for each port, unlike a hub where all ports share one collision domain. This improves network performance."
                },
                {
                    question: "Which layer of OSI deals with cabling and connectors?",
                    options: ["Transport", "Data Link", "Physical", "Network"],explanation: "The Physical layer (Layer 1) deals with physical media including cabling, connectors, electrical signals, and data encoding."
                },
                {
                    question: "Which protocol is connectionless?",
                    options: ["TCP", "UDP", "FTP", "SMTP"],explanation: "UDP (User Datagram Protocol) is connectionless\u2014it sends data without establishing a connection or guaranteeing delivery. It's faster than TCP but less reliable."
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
