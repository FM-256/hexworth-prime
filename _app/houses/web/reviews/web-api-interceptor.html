<body>

<script>
        // Game state
        let currentRound = 0;
        let score = 0;
        let roundStartTime = 0;
        let correctAnswers = 0;

        // Round data with HTTP requests/responses and vulnerabilities
        const rounds = [
            {
                // Round 1: IDOR
                request: {
                    method: 'GET',
                    url: 'https://api.example.com/api/users/1042/profile',
                    headers: {
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
                        'User-Agent': 'Mozilla/5.0',
                        'Accept': 'application/json'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Request-ID': 'abc-123-def'
                    },
                    body: {
                        id: 1042,
                        username: 'alice_smith',
                        email: 'alice@example.com',
                        phone: '+1-555-0142',
                        address: '123 Main St, Springfield',
                        ssn: '***-**-1234',
                        account_balance: 5420.50
                    }
                },
                vulnerabilities: [
                    'IDOR (Insecure Direct Object Reference)',
                    'Broken Authentication',
                    'Mass Assignment',
                    'Rate Limiting Issues'
                ],
                correctAnswer: 'IDOR (Insecure Direct Object Reference)',
                explanation: 'This endpoint uses a predictable numeric ID (1042) in the URL without proper authorization checks. An attacker authenticated as a different user can simply change the ID to access any user\'s profile data. The API should verify that the authenticated user has permission to access the requested resource.',
                owaspReference: 'OWASP API1:2023 - Broken Object Level Authorization'
            },
            {
                // Round 2: Broken Auth - JWT issues
                request: {
                    method: 'POST',
                    url: 'https://api.example.com/api/auth/login',
                    headers: {
                        'Content-Type': 'application/json',
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: {
                        username: 'user@example.com',
                        password: 'password123'
                    }
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {
                        success: true,
                        token: 'eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJ1c2VySWQiOjEyMywicm9sZSI6ImFkbWluIn0.',
                        user: {
                            id: 123,
                            role: 'user',
                            username: 'user@example.com'
                        }
                    }
                },
                vulnerabilities: [
                    'Broken Authentication',
                    'IDOR (Insecure Direct Object Reference)',
                    'Excessive Data Exposure',
                    'SQL Injection'
                ],
                correctAnswer: 'Broken Authentication',
                explanation: 'Multiple authentication issues: 1) The JWT uses algorithm "none" (no signature), allowing token forgery. 2) The token claims show role:"admin" but the user object shows role:"user" - inconsistent privileges. 3) No expiration time in the token. These flaws allow attackers to escalate privileges and create persistent unauthorized access.',
                owaspReference: 'OWASP API2:2023 - Broken Authentication'
            },
            {
                // Round 3: Mass Assignment
                request: {
                    method: 'POST',
                    url: 'https://api.example.com/api/users/register',
                    headers: {
                        'Content-Type': 'application/json',
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: {
                        username: 'newuser',
                        email: 'newuser@example.com',
                        password: 'SecurePass123!',
                        role: 'admin',
                        is_verified: true
                    }
                },
                response: {
                    status: 201,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {
                        success: true,
                        user: {
                            id: 5001,
                            username: 'newuser',
                            email: 'newuser@example.com',
                            role: 'admin',
                            is_verified: true,
                            created_at: '2026-02-10T14:22:00Z'
                        }
                    }
                },
                vulnerabilities: [
                    'Mass Assignment',
                    'Rate Limiting Issues',
                    'IDOR (Insecure Direct Object Reference)',
                    'SSRF (Server-Side Request Forgery)'
                ],
                correctAnswer: 'Mass Assignment',
                explanation: 'The API accepts and processes fields like "role" and "is_verified" that should be server-controlled. A user registration should only accept username, email, and password. By including restricted fields, an attacker can grant themselves admin privileges during registration. APIs should use allow-lists to accept only specific expected fields.',
                owaspReference: 'OWASP API3:2023 - Broken Object Property Level Authorization'
            },
            {
                // Round 4: Rate Limit Bypass
                request: {
                    method: 'POST',
                    url: 'https://api.example.com/api/auth/login',
                    headers: {
                        'Content-Type': 'application/json',
                        'User-Agent': 'BruteForceBot/1.0'
                    },
                    body: {
                        username: 'admin@example.com',
                        password: 'attempt_487'
                    }
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Request-Count': '487'
                    },
                    body: {
                        success: true,
                        message: 'Login successful',
                        token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.abc123'
                    }
                },
                vulnerabilities: [
                    'Rate Limiting Issues',
                    'Broken Authentication',
                    'Mass Assignment',
                    'Exposed API Keys'
                ],
                correctAnswer: 'Broken Authentication',
                explanation: 'The X-Request-Count header shows 487 login attempts on the same account with no CAPTCHA or account lockout in sight - this is exactly the brute-force-without-lockout case OWASP calls out under Broken Authentication, not a generic resource-consumption issue. Rate limiting is the fix you\'d reach for, but the vulnerability being exploited is a failure to verify identity safely: without a lockout/CAPTCHA mechanism, an attacker can keep guessing passwords indefinitely. API4 (Unrestricted Resource Consumption) covers unthrottled costly operations like unlimited file uploads or third-party spend - it is not about login brute force. The API should implement account lockout after failed attempts and CAPTCHA after multiple failures.',
                owaspReference: 'OWASP API2:2023 - Broken Authentication'
            },
            {
                // Round 5: Exposed API Key
                request: {
                    method: 'GET',
                    url: 'https://api.example.com/api/products/search?q=laptop',
                    headers: {
                        'Authorization': 'Bearer user-token-xyz',
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'sk_live_51HxYz2eZ4H9k3L0A8X9Y',
                        'X-Internal-Service-URL': 'http://internal-db.company.local:5432',
                        'X-AWS-Secret': 'AKIAIOSFODNN7EXAMPLE',
                        'X-Debug-Mode': 'enabled'
                    },
                    body: {
                        results: [
                            { id: 1, name: 'Laptop Pro', price: 1299 },
                            { id: 2, name: 'Laptop Air', price: 999 }
                        ]
                    }
                },
                vulnerabilities: [
                    'Exposed API Keys',
                    'IDOR (Insecure Direct Object Reference)',
                    'Excessive Data Exposure',
                    'SQL Injection'
                ],
                correctAnswer: 'Exposed API Keys',
                explanation: 'The response headers leak sensitive internal information: a production API key (X-API-Key), AWS credentials (X-AWS-Secret), internal network addresses (X-Internal-Service-URL), and debug status. These headers should never be exposed to clients. Attackers can use this information to access internal services, make authenticated requests, or map the internal infrastructure.',
                owaspReference: 'OWASP API8:2023 - Security Misconfiguration'
            },
            {
                // Round 6: Excessive Data Exposure
                request: {
                    method: 'GET',
                    url: 'https://api.example.com/api/users',
                    headers: {
                        'Authorization': 'Bearer user-token',
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {
                        users: [
                            {
                                id: 1,
                                username: 'john_doe',
                                email: 'john@example.com',
                                password_hash: '$2b$10$EixZaYVK1fsbw1ZfbX3OXe',
                                ssn: '123-45-6789',
                                credit_card_last4: '4242',
                                internal_notes: 'High value customer - VIP support',
                                created_ip: '192.168.1.100',
                                last_login: '2026-02-10T09:15:00Z',
                                avatar: 'https://cdn.example.com/john.jpg'
                            },
                            {
                                id: 2,
                                username: 'jane_smith',
                                email: 'jane@example.com',
                                password_hash: '$2b$10$XyZKsf9Z2fQbw8ZfbY5PQe',
                                ssn: '987-65-4321',
                                credit_card_last4: '5555',
                                internal_notes: 'Payment issues - monitor',
                                created_ip: '10.0.0.50',
                                last_login: '2026-02-09T18:30:00Z',
                                avatar: 'https://cdn.example.com/jane.jpg'
                            }
                        ]
                    }
                },
                vulnerabilities: [
                    'Excessive Data Exposure',
                    'IDOR (Insecure Direct Object Reference)',
                    'Rate Limiting Issues',
                    'SSRF (Server-Side Request Forgery)'
                ],
                correctAnswer: 'Excessive Data Exposure',
                explanation: 'The API returns far more data than necessary, including highly sensitive fields: password hashes, SSNs, credit card information, internal notes, and IP addresses. A public user list should only return id, username, and avatar. This over-exposure allows attackers to collect sensitive data for offline attacks (like cracking password hashes) or social engineering.',
                owaspReference: 'OWASP API3:2023 - Broken Object Property Level Authorization'
            },
            {
                // Round 7: Broken Object Level Auth
                request: {
                    method: 'DELETE',
                    url: 'https://api.example.com/api/orders/5678',
                    headers: {
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjk5OX0.xyz',
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {
                        success: true,
                        message: 'Order 5678 deleted successfully',
                        deleted_order: {
                            id: 5678,
                            user_id: 1042,
                            total: 299.99,
                            status: 'delivered'
                        }
                    }
                },
                vulnerabilities: [
                    'IDOR (Insecure Direct Object Reference)',
                    'Mass Assignment',
                    'Exposed API Keys',
                    'SQL Injection'
                ],
                correctAnswer: 'IDOR (Insecure Direct Object Reference)',
                explanation: 'The authenticated user (ID 999 from the JWT) successfully deleted order 5678, which belongs to user 1042. The API didn\'t verify object-level permissions - it only checked if a user was authenticated, not if they own the resource. This is Broken Object Level Authorization, allowing users to manipulate resources belonging to others. The API should verify: req.user.id === order.user_id.',
                owaspReference: 'OWASP API1:2023 - Broken Object Level Authorization'
            },
            {
                // Round 8: SQL Injection
                request: {
                    method: 'GET',
                    url: 'https://api.example.com/api/products?category=electronics\' OR 1=1--',
                    headers: {
                        'User-Agent': 'Mozilla/5.0',
                        'Accept': 'application/json'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-SQL-Query': 'SELECT * FROM products WHERE category=\'electronics\' OR 1=1--\''
                    },
                    body: {
                        products: [
                            { id: 1, category: 'electronics', name: 'Laptop', price: 999 },
                            { id: 2, category: 'electronics', name: 'Phone', price: 699 },
                            { id: 3, category: 'clothing', name: 'Shirt', price: 29 },
                            { id: 4, category: 'books', name: 'Novel', price: 15 },
                            { id: 5, category: 'food', name: 'Snacks', price: 5 },
                            { id: 99, category: 'admin', name: 'SECRET_PRODUCT', price: 0 }
                        ]
                    }
                },
                vulnerabilities: [
                    'SQL Injection',
                    'Rate Limiting Issues',
                    'IDOR (Insecure Direct Object Reference)',
                    'Mass Assignment'
                ],
                correctAnswer: 'SQL Injection',
                explanation: 'The URL contains a SQL injection payload (\' OR 1=1--) that bypasses the category filter. The X-SQL-Query header confirms the raw query was executed without input sanitization. The response includes products from all categories, including hidden admin items. This allows attackers to extract entire databases, modify data, or even execute system commands. APIs must use parameterized queries or ORMs.',
                owaspReference: 'Not in the OWASP API Security Top 10 2023 (Injection was removed as a standalone category in the 2023 update) - see OWASP Top 10 (Web) A03:2021 - Injection'
            },
            {
                // Round 9: SSRF
                request: {
                    method: 'POST',
                    url: 'https://api.example.com/api/fetch-url',
                    headers: {

                        'Authorization': 'Bearer user-token'
                    },
                    body: {
                        url: 'http://169.254.169.254/latest/meta-data/iam/security-credentials/admin-role'
                    }
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {
                        success: true,
                        fetched_content: {
                            AccessKeyId: 'AKIAIOSFODNN7EXAMPLE',
                            SecretAccessKey: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY',
                            Token: 'FwoGZXIvYXdzEBYaDA...',
                            Expiration: '2026-02-10T20:00:00Z'
                        }
                    }
                },
                vulnerabilities: [
                    'SSRF (Server-Side Request Forgery)',
                    'Excessive Data Exposure',
                    'Broken Authentication',
                    'Mass Assignment'
                ],
                correctAnswer: 'SSRF (Server-Side Request Forgery)',
                explanation: 'The API accepts arbitrary URLs and fetches them server-side. The attacker provided the AWS metadata endpoint (169.254.169.254), which is only accessible from within AWS instances. This SSRF vulnerability allowed retrieving IAM credentials with admin privileges. Attackers can use SSRF to access internal services, cloud metadata, or perform port scanning. APIs should whitelist allowed domains and block private IP ranges.',
                owaspReference: 'OWASP API7:2023 - Server Side Request Forgery'
            },
            {
                // Round 10: Multi-Vulnerability
                request: {
                    method: 'GET',
                    url: 'https://api.example.com/api/admin/users/5500/financial-records',
                    headers: {
                        'User-Agent': 'Mozilla/5.0',
                        'Accept': 'application/json'
                    },
                    body: null
                },
                response: {
                    status: 200,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': 'admin-secret-key-12345'
                    },
                    body: {
                        user_id: 5500,
                        username: 'victim_user',
                        ssn: '123-45-6789',
                        credit_cards: [
                            { number: '4532-1111-2222-3333', cvv: '123', expiry: '12/27' }
                        ],
                        bank_accounts: [
                            { account_number: '9876543210', routing: '021000021', balance: 45000 }
                        ],
                        tax_returns: [
                            { year: 2025, income: 85000, refund: 2400 }
                        ],
                        medical_records: 'Patient has history of...',
                        internal_credit_score: 720
                    }
                },
                vulnerabilities: [
                    'Multiple Issues: No Auth + IDOR + Data Exposure',
                    'Only Rate Limiting',
                    'Only SQL Injection',
                    'Only Exposed API Keys'
                ],
                correctAnswer: 'Multiple Issues: No Auth + IDOR + Data Exposure',
                explanation: 'This endpoint has THREE critical vulnerabilities: 1) BROKEN FUNCTION LEVEL AUTHORIZATION - No Authorization header or role check is required to reach an admin-only endpoint. 2) IDOR - Can change user ID 5500 to access anyone\'s records. 3) EXCESSIVE DATA EXPOSURE - Returns full credit card numbers, CVVs, SSN, bank accounts, medical records. Any one of these would be critical; combined, they allow complete account takeover.',
                owaspReference: 'OWASP API1, API3, API5:2023 - Multiple Critical Issues'
            }
        ];

        // Initialize game
        function initGame() {
            loadRound();
        }

        // Load current round
        function loadRound() {
            if (currentRound >= rounds.length) {
                showFinalScreen();
                return;
            }

            const round = rounds[currentRound];
            roundStartTime = Date.now();

            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = `
                <div class="interceptor-header">
                    <div class="interceptor-title">
                        <div class="intercept-indicator"></div>
                        REQUEST INTERCEPTED
                    </div>
                    <div class="round-info">
                        <span class="timer" id="timer">Time: 0s</span>
                    </div>
                </div>

                <div class="panels-container">
                    <div class="panel">
                        <div class="panel-header">REQUEST</div>
                        <div class="panel-content" id="request-panel"></div>
                    </div>
                    <div class="panel">
                        <div class="panel-header">RESPONSE</div>
                        <div class="panel-content" id="response-panel"></div>
                    </div>
                </div>

                <div class="vulnerability-section">
                    <h3>Identify the Security Vulnerability</h3>
                    <div class="vulnerability-options" id="vuln-options"></div>
                    <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
                    <div id="feedback-area"></div>
                </div>
            `;

            renderRequest(round.request);
            renderResponse(round.response);
            renderVulnerabilityOptions(round.vulnerabilities);
            startTimer();
            updateRoundCounter();
        }

        // Render HTTP request
        function renderRequest(request) {
            const panel = document.getElementById('request-panel');
            const methodClass = `method-${request.method.toLowerCase()}`;

            let headersHtml = '';
            for (const [key, value] of Object.entries(request.headers)) {
                headersHtml += `<div class="header-line"><span class="header-key">${key}:</span> <span class="header-value">${value}</span></div>`;
            }

            const bodyHtml = request.body ?
                `<div class="http-section">
                    <div class="section-title">Body</div>
                    <div class="http-body">${syntaxHighlightJSON(request.body)}</div>
                </div>` : '';

            panel.innerHTML = `
                <div class="http-method ${methodClass}">${request.method}</div>
                <div class="http-url">${request.url}</div>
                <div class="http-section">
                    <div class="section-title">Headers</div>
                    <div class="http-headers">${headersHtml}</div>
                </div>
                ${bodyHtml}
            `;
        }

        // Render HTTP response
        function renderResponse(response) {
            const panel = document.getElementById('response-panel');
            const statusClass = `status-${response.status}`;

            let headersHtml = '';
            for (const [key, value] of Object.entries(response.headers)) {
                headersHtml += `<div class="header-line"><span class="header-key">${key}:</span> <span class="header-value">${value}</span></div>`;
            }

            const bodyHtml = response.body ?
                `<div class="http-section">
                    <div class="section-title">Body</div>
                    <div class="http-body">${syntaxHighlightJSON(response.body)}</div>
                </div>` : '';

            panel.innerHTML = `
                <div class="http-status ${statusClass}">${response.status} ${getStatusText(response.status)}</div>
                <div class="http-section">
                    <div class="section-title">Headers</div>
                    <div class="http-headers">${headersHtml}</div>
                </div>
                ${bodyHtml}
            `;
        }

        // Syntax highlight JSON
        function syntaxHighlightJSON(obj) {
            let json = JSON.stringify(obj, null, 2);

            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            json = json.replace(/(".*?")(\s*:)/g, '<span class="json-key">$1</span>$2');
            json = json.replace(/:\s*(".*?")/g, ': <span class="json-string">$1</span>');
            json = json.replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-number">$1</span>');
            json = json.replace(/:\s*(true|false)/g, ': <span class="json-boolean">$1</span>');
            json = json.replace(/:\s*(null)/g, ': <span class="json-null">$1</span>');

            return json;
        }

        // Get HTTP status text
        function getStatusText(status) {
            const statusTexts = {
                200: 'OK',
                201: 'Created',
                401: 'Unauthorized',
                403: 'Forbidden',
                500: 'Internal Server Error'
            };
            return statusTexts[status] || '';
        }

        // Render vulnerability options
        function renderVulnerabilityOptions(vulnerabilities) {
            const container = document.getElementById('vuln-options');
            container.innerHTML = vulnerabilities.map(vuln =>
                `<div class="vuln-option" onclick="selectVulnerability(this, '${vuln}')">${vuln}</div>`
            ).join('');
        }

        // Select vulnerability option
        let selectedVulnerability = null;
        function selectVulnerability(element, vuln) {
            document.querySelectorAll('.vuln-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedVulnerability = vuln;
        }

        // Submit answer
        function submitAnswer() {
            if (!selectedVulnerability) {
                alert('Please select a vulnerability type first!');
                return;
            }

            const round = rounds[currentRound];
            const isCorrect = selectedVulnerability === round.correctAnswer;
            const timeElapsed = Math.floor((Date.now() - roundStartTime) / 1000);

            // Calculate points (base 100 + time bonus)
            let points = 0;
            if (isCorrect) {
                correctAnswers++;
                points = 100;
                // Time bonus: max 50 points for answers under 10 seconds
                if (timeElapsed < 10) {
                    points += 50;
                } else if (timeElapsed < 20) {
                    points += 30;
                } else if (timeElapsed < 30) {
                    points += 10;
                }
                score += points;
                updateScore();
            }

            // Show feedback
            showFeedback(isCorrect, points, round);

            // Disable submit button
            document.getElementById('submit-btn').disabled = true;

            // Update option styles
            document.querySelectorAll('.vuln-option').forEach(opt => {
                if (opt.textContent === round.correctAnswer) {
                    opt.classList.add('correct');
                } else if (opt.textContent === selectedVulnerability) {
                    opt.classList.add('incorrect');
                }
            });

            // Track game progress
            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('api', {
                    round: currentRound + 1,
                    correct: isCorrect,
                    score: score
                });
            }
        }

        // Show feedback
        function showFeedback(isCorrect, points, round) {
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackClass = isCorrect ? 'correct' : 'incorrect';
            const title = isCorrect ? `Correct! +${points} points` : 'Incorrect';

            feedbackArea.innerHTML = `
                <div class="feedback ${feedbackClass}">
                    <div class="feedback-title">${title}</div>
                    <div class="feedback-content">${round.explanation}</div>
                    <div class="owasp-reference">${round.owaspReference}</div>
                    <button class="next-btn" onclick="nextRound()">
                        ${currentRound < rounds.length - 1 ? 'Next Round →' : 'View Results →'}
                    </button>
                </div>
            `;
        }

        // Next round
        function nextRound() {
            currentRound++;
            selectedVulnerability = null;
            loadRound();
        }

        // Timer
        let timerInterval;
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - roundStartTime) / 1000);
                const timerElement = document.getElementById('timer');
                if (timerElement) {
                    timerElement.textContent = `Time: ${elapsed}s`;
                }
            }, 1000);
        }

        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Update round counter
        function updateRoundCounter() {
            document.getElementById('round-counter').textContent = `${currentRound + 1}/10`;
        }

        // Show final screen
        function showFinalScreen() {
            if (timerInterval) clearInterval(timerInterval);

            const gameArea = document.getElementById('game-area');
            const accuracy = Math.round((correctAnswers / rounds.length) * 100);

            gameArea.innerHTML = `
                <div class="final-screen">
                    <h2>Mission Complete!</h2>
                    <div class="final-score">${score}</div>
                    <p style="color: #888; margin-bottom: 20px;">Total Points</p>

                    <div class="final-stats">
                        <div class="final-stat">
                            <div class="final-stat-value">${correctAnswers}/10</div>
                            <div class="final-stat-label">Vulnerabilities Found</div>
                        </div>
                        <div class="final-stat">
                            <div class="final-stat-value">${accuracy}%</div>
                            <div class="final-stat-label">Accuracy</div>
                        </div>
                    </div>

                    <p style="color: #10b981; font-size: 18px; margin-top: 20px;">+50 XP Earned</p>
                    <p style="color: #888; font-size: 14px;">Achievement Unlocked: API Security Expert</p>

                    <button class="restart-btn" onclick="restartGame()">Play Again</button>
                </div>
            `;

            // Award XP (one-time)
            if (!localStorage.getItem('game_api_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_api_xp_awarded', 'true');

                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    FirestoreManager.addXP(null, 50, 'API Interceptor Complete'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
                }
            }

            // Unlock achievement
            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_api');
            }

            // Final game tracking
            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('api', {
                    score: score,
                    total: 10,
                    correct: correctAnswers,
                    completed: true
                });
            }
        }

        // Restart game
        function restartGame() {
            currentRound = 0;
            score = 0;
            correctAnswers = 0;
            selectedVulnerability = null;
            updateScore();
            loadRound();
        }

        // Start game on load
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/GameScoreboard.js"></script>

        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>
