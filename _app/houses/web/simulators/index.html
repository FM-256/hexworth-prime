<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=../">
    <title>Simulators</title>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js">
        function completeModule() {
            if (typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-index', {
                    returnUrl: '../index.html'
                });
            }
        }
    </script>
</head>
<body>
<h1 class="visually-hidden">Simulators</h1>
    <p>Redirecting...</p>

    <div style="text-align:center; padding:20px; margin-top:10px;">
        <button onclick="completeModule()" style="background:#22c55e; color:#fff; border:none; padding:12px 32px; border-radius:8px; font-size:1rem; cursor:pointer; box-shadow:0 2px 8px rgba(34,197,94,0.3);">Complete Module ✓</button>
    </div>

    <div style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid rgba(255,255,255,0.08);">
        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>
</body>
</html>
