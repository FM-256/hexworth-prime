<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network+ Midterm — Comprehensive GUI Lab</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #090910; color: #eef2ff; }
        .lab-nav { padding: 12px 20px; background: #0d1117; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 16px; align-items: center; }
        .lab-nav a { color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .lab-nav a:hover { color: #06b6d4; }
        .lab-nav .midterm-badge { background: rgba(239,68,68,0.15); color: #ef4444; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.5px; }
        #lab-container { width: 100%; min-height: calc(100vh - 50px); }
    </style>
</head>
<body>
    <nav class="lab-nav">
        <a href="../index.html">&larr; Network+ Hub</a>
        <span class="midterm-badge">MIDTERM LAB</span>
    </nav>
    <div id="lab-container"></div>
    <script src="../engine/GUILabEngine.js"></script>
    <script src="../configs/gui-midterm-comprehensive.config.js"></script>
    <script>
        var container = document.getElementById('lab-container');
        if (container && typeof GUILabEngine !== 'undefined' && typeof GUI_MIDTERM_CONFIG !== 'undefined') {
            GUILabEngine.init(GUI_MIDTERM_CONFIG, container);
        }
    </script>
</body>
</html>
