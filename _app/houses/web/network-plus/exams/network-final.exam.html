<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Exam — Meridian Corp Operations Lab | Network+ N10-009</title>

<!-- ═══════════════════════════════════════════════════════════════════════════════════════════════
     EXAM MODE. Three things are deliberately ABSENT from this page, and each is a spec requirement
     rather than an oversight:

       1. THE DR. HEX BUTTON SCRIPT IS NOT LOADED. Spec section 9 names the midterm's live AI tutor
          as one of the two reasons that build fails the integrity bar, and requires the tutor be
          disabled on the exam page by not loading its script when examMode is true. The engine also
          returns a loadHexAI:false flag.

          The script's FILENAME is deliberately not written anywhere in this file. The acceptance
          criterion is checked by searching the delivered page for it, and a mention in a comment
          would read as a hit -- the same way a literal tag inside a comment broke the tag-balance
          check on the course hub. A page that explains its own compliance in terms a checker
          mistakes for a violation is worse than one that says nothing.

       2. NO COURSE LINKS. No hub, module, presentation, tool or lab navigation. Spec section 9:
          "no links to course modules, presentations, tools, or labs from the exam page."

       3. NO LAB LOGIC. Every command and every click is posted to a Cloud Function and this page
          renders the reply. The browser never holds the answer key, the fault list, the baseline or
          the seed -- it cannot, because they are never sent. Grading and rendering therefore share
          one code path on the server, so what a student sees and what the grader reads are the same
          computation.

     AccessGuard protects the page; firestore.rules denies every client read of the session document
     that holds the key. Spec section 9's note that AccessGuard "protects the page, not the config
     file" is why the key lives server-side rather than in a config this page could fetch.
     ═══════════════════════════════════════════════════════════════════════════════════════════ -->
<script src="../../../../components/AccessGuard.js"></script>
<script>AccessGuard.require('sorted');</script>
<script src="../../../../components/FirebaseAuth.js"></script>
<script src="/components/ObservatoryTelemetry.js"></script>

<style>
  :root {
    --bg: #090910; --bg2: #0f172a; --card: #1e293b; --ink: #e0e0e0; --muted: #94a3b8;
    --accent: #06b6d4; --ok: #2ed573; --warn: #ffc107; --bad: #ff4757;
    --border: rgba(255, 255, 255, 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 1rem; font-weight: 600; }
  .topbar .sub { color: var(--muted); font-size: 0.8rem; }
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 600; padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; }
  .clock.low { color: var(--bad); border-color: var(--bad); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 0.78rem; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); background: rgba(6, 182, 212, 0.1); }
  #term { height: 56vh; min-height: 320px; overflow-y: auto; padding: 12px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.82rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .cmdrow { display: flex; gap: 0; border-top: 1px solid var(--border); }
  .cmdrow span { padding: 10px 0 10px 12px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.82rem; color: var(--ok); white-space: pre; }
  .cmdrow input { flex: 1; background: transparent; border: 0; color: var(--ink); font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.82rem; padding: 10px 12px; outline: none; }
  #winbody { max-height: 56vh; overflow: auto; padding: 12px; font-size: 0.8rem; }
  #winbody table { width: 100%; border-collapse: collapse; }
  #winbody th, #winbody td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  #winbody th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; }
  .qlist { max-height: 60vh; overflow-y: auto; }
  .q { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .q .n { color: var(--muted); font-size: 0.72rem; }
  .q.answered .n { color: var(--ok); }
  .q p { font-size: 0.82rem; margin: 4px 0 7px; }
  .q input[type=text], .q select { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; font-size: 0.8rem; }
  .q .where { color: var(--muted); font-size: 0.72rem; font-style: italic; }
  /* The two halves of an ACL reference: side by side where there is room, stacked when there is not. */
  .q .pair { display: flex; gap: 8px; flex-wrap: wrap; }
  .q .pair select { flex: 1 1 11em; }
  .q .pair input[type=text] { flex: 1 1 9em; }
  .notice { padding: 10px 12px; font-size: 0.8rem; color: var(--muted); }
  .bad { color: var(--bad); }
  .good { color: var(--ok); }
  /* The submitted score. `.good` and `.big` were referenced by the script and never defined, so the
     status line rendered unstyled and the score rendered at body size. */
  .big { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em; }
  .big .of { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .pending-note { color: var(--warn); font-size: 0.82rem; padding: 2px 0 0; }

  /* ── action forms ─────────────────────────────────────────────────────────────────────────────
     One card per action the server declared for the open window. Stacked, full width: these are
     short forms a student fills under time pressure, and a multi-column grid would put the submit
     button somewhere different for every window. */
  .actions { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 4px; }
  .actform { border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; margin-top: 10px; background: var(--bg2); }
  .actform h4 { font-size: 0.8rem; margin: 0 0 8px; font-weight: 600; }
  .actform .field { margin-bottom: 8px; }
  .actform label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; }
  .actform input, .actform select, .actform textarea {
      width: 100%; box-sizing: border-box; background: var(--bg); color: var(--ink);
      border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px;
      font-size: 0.8rem; font-family: inherit;
  }
  .actform textarea { resize: vertical; min-height: 2.4em; }
  .actform button {
      background: var(--accent); color: #041014; border: 0; border-radius: 5px;
      padding: 7px 14px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  .actform button:hover { filter: brightness(1.08); }
  .actform .opt { color: var(--muted); font-style: italic; }
  .actform .notice { padding: 8px 0 0; }
  .footer { padding: 14px; display: flex; gap: 10px; align-items: center; }
  .footer button { background: var(--accent); color: #04232a; border: 0; border-radius: 7px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
  .footer button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  #report { padding: 14px; }
  #report .big { font-size: 2rem; font-weight: 700; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Final Exam &mdash; Meridian Corp Operations Lab</h1>
    <div class="sub">Troubleshoot the live network. 50 questions, 200 points. One attempt, server-timed.</div>
  </div>
  <div class="clock" id="clock" aria-live="polite">--:--</div>
</div>

<div class="layout" id="layout" hidden>
  <div>
    <div class="panel">
      <div class="tabs" id="surface" role="tablist">
        <button role="tab" aria-selected="true" data-surface="terminal">Terminal</button>
        <button role="tab" aria-selected="false" data-surface="firewall">Firewall</button>
        <button role="tab" aria-selected="false" data-surface="wireless">Wireless</button>
        <button role="tab" aria-selected="false" data-surface="noc">NOC</button>
        <button role="tab" aria-selected="false" data-surface="rack">Rack</button>
        <button role="tab" aria-selected="false" data-surface="change-requests">Change requests</button>
        <button role="tab" aria-selected="false" data-surface="incident-log">Incident log</button>
      </div>
      <div id="term" aria-live="polite"></div>
      <form class="cmdrow" id="cmdform"><span id="prompt">&gt; </span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="command"></form>
      <div id="winbody" hidden></div>
    </div>
    <div class="footer">
      <button type="button" id="submit">Submit exam</button>
      <span class="notice" id="status"></span>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Tickets</h2>
      <div class="qlist" id="tickets"></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Questions <span id="qcount" class="sub"></span></h2>
      <div class="qlist" id="questions"></div>
    </div>
  </div>
</div>

<div class="panel" id="gate" style="margin:40px auto; max-width:620px">
  <h2>Starting your exam</h2>
  <div class="notice" id="gatemsg">Generating your lab on the server&hellip;</div>
</div>

<div class="panel" id="done" hidden style="margin:40px auto; max-width:620px">
  <h2>Submitted</h2>
  <div id="report"></div>
</div>

<script>
/* ───────────────────────────────────────────────────────────────────────────────────────────────
   This script posts and renders. It holds NO lab logic, NO answer key and NO grader -- every one
   of those lives in functions/netfinal/ and is reached through a callable. If this file grew a
   copy of any of them, the exam would have two implementations of its own network and a student
   could be shown one while graded on the other.
   ─────────────────────────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';
  var EXAM_ID = 'net-final-2026';
  var session = null, questions = [], tickets = [], remaining = 0, surface = 'terminal', tick = null;
  /* The student's own saved answers, as the server last recorded them. Kept so a re-render puts them
     back into the controls -- see restoreAnswers. */
  var answers = {};

  function el(id) { return document.getElementById(id); }
  function call(name, data) {
    if (typeof FirebaseAuth === 'undefined' || typeof FirebaseAuth.callFunction !== 'function') {
      return Promise.reject(new Error('Cloud Functions unavailable — the exam cannot run offline.'));
    }
    return FirebaseAuth.callFunction(name, data || {}).then(function (r) { return (r && r.data) ? r.data : r; });
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function write(text) {
    if (!text) { return; }
    var d = document.createElement('div');
    d.textContent = text;
    el('term').appendChild(d);
    el('term').scrollTop = el('term').scrollHeight;
  }

  /* The clock is DISPLAY ONLY. Every server reply carries the authoritative remainingMs, so a
     student who edits this counter changes a number on their screen and nothing else. */
  function paintClock() {
    var m = Math.floor(remaining / 60000), s = Math.floor((remaining % 60000) / 1000);
    el('clock').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    el('clock').classList.toggle('low', remaining < 5 * 60000);
  }
  function setRemaining(ms) {
    if (typeof ms === 'number') { remaining = ms; }
    paintClock();
  }

  function telemetry(kind, detail) {
    try {
      if (window.ObservatoryTelemetry && ObservatoryTelemetry.log) {
        ObservatoryTelemetry.log({ area: 'netfinal', kind: kind, detail: detail, examId: EXAM_ID });
      }
    } catch (e) { /* telemetry must never break an exam in progress */ }
  }

  function renderTickets() {
    el('tickets').innerHTML = tickets.map(function (t) {
      return '<div class="q"><div class="n">' + esc(t.id) + ' · ' + esc(t.kind) + '</div><p>' + esc(t.text) + '</p></div>';
    }).join('');
  }

  function renderQuestions() {
    var answered = 0;
    el('questions').innerHTML = questions.map(function (q) {
      if (q.answeredLocal) { answered++; }
      var body;
      if (q.kind === 'aclref') {
        /* TWO FIELDS, NOT A SENTENCE. The ACL name is picked from the router's own ACLs; the
           sequence number is typed. Grading this as free text meant parsing an ACL reference out of
           whatever the student wrote, and three rounds of heuristics each found the next failure
           instead of converging -- bare English words became ACL names, and a ticket id, which this
           exam prints on every fix prompt and encourages students to cite, hijacked both halves at
           once. The sequence stays typed on purpose: closing it too would hand over the harder half
           of the question, which is reading the ACL and identifying the offending line. */
        body = '<div class="pair">'
          + '<select data-q="' + esc(q.id) + '" data-part="name" aria-label="ACL name">'
          + '<option value="">&mdash; ACL &mdash;</option>'
          + (q.options || []).map(function (o) {
              return '<option value="' + esc(o.id) + '">' + esc(o.text) + '</option>';
            }).join('')
          + '</select>'
          + '<input type="text" data-q="' + esc(q.id) + '" data-part="seq" inputmode="numeric"'
          + ' placeholder="sequence number" aria-label="sequence number">'
          + '</div>';
      } else if (q.kind === 'select' && q.options && !Array.isArray(q.options.layer)) {
        body = '<select data-q="' + esc(q.id) + '"><option value="">— choose —</option>'
          + (q.options || []).map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.text) + '</option>'; }).join('')
          + '</select>';
      } else if (q.kind === 'state' || q.kind === 'sequence') {
        body = '<div class="where">Graded from the network and your activity. Nothing to type.</div>';
      } else {
        body = '<input type="text" data-q="' + esc(q.id) + '" placeholder="your answer">';
      }
      return '<div class="q' + (q.answeredLocal ? ' answered' : '') + '" id="qq-' + esc(q.id) + '">'
        + '<div class="n">Q' + q.n + ' · ' + q.points + ' pt · ' + esc(q.phase) + '</div>'
        + '<p>' + esc(q.prompt) + '</p>' + body
        + (q.where ? '<div class="where">' + esc(q.where) + '</div>' : '')
        + (q.rubric ? '<div class="where">' + esc(q.rubric) + '</div>' : '')
        + '</div>';
    }).join('');
    restoreAnswers();
    /* Counted from the DOM's own answered markers, so the number and the cards can never disagree --
       a blank saved answer is neither marked nor counted. */
    el('qcount').textContent = el('questions').querySelectorAll('.q.answered').length
      + ' / ' + questions.length + ' answered';
  }

  /* PUT THE STUDENT'S SAVED ANSWERS BACK INTO THE CONTROLS.
     Spec section 9 promises a refresh resumes the exam, and the lab and the clock did -- but every
     answer field came up blank, because nothing sent the saved values back and nothing here put them
     in. For a single text box that was re-entry. For the two-field ACL question it was DATA LOSS:
     both controls post together, so re-picking the ACL after a refresh posted the chosen name with a
     BLANK sequence and overwrote a complete, already-credited answer with a half-credit one. The
     student lost half a question for re-affirming a field they had got right.
     Values are applied here rather than interpolated into the markup, so nothing depends on getting
     attribute escaping right for text a student typed. */
  function restoreAnswers() {
    Object.keys(answers).forEach(function (qid) {
      var v = answers[qid];
      var nodes = el('questions').querySelectorAll('[data-q="' + qid + '"]');
      if (!nodes.length) { return; }
      var filled = false;
      Array.prototype.forEach.call(nodes, function (ctl) {
        /* A multi-field answer is an object keyed by data-part; everything else is one value. */
        var part = ctl.dataset.part;
        if (part) {
          /* A multi-field control only restores from an OBJECT. Applying a bare string to both
             halves put the same text in the select and the number field -- reachable only by a raw
             API call, but confusing enough to be worth refusing rather than displaying. */
          if (!v || typeof v !== 'object') { return; }
          var pv = v[part];
          if (pv === null || pv === undefined || typeof pv === 'object') { return; }
          ctl.value = String(pv);
          if (String(pv) !== '') { filled = true; }
          return;
        }
        if (v === null || v === undefined || typeof v === 'object') { return; }
        ctl.value = String(v);
        if (String(v) !== '') { filled = true; }
      });
      /* MARKED ANSWERED ONLY IF SOMETHING IS ACTUALLY IN IT. The server stores an empty string
         without complaint, and the marker was applied unconditionally -- so a question saved blank
         came back looking answered while gradeTyped still scores '' as unanswered. Telling a student
         they have answered something they have not is worse than showing them nothing. */
      var card = el('qq-' + qid);
      if (card && filled) { card.classList.add('answered'); }
    });
  }

  function saveAnswer(id, value) {
    call('netfinalAnswer', { examId: EXAM_ID, questionId: id, value: value }).then(function (r) {
      setRemaining(r.remainingMs);
      /* Record what the SERVER accepted, so a re-render restores the stored answer rather than
         whatever happens to be in the DOM at the time. */
      answers[id] = value;
      var q = questions.filter(function (x) { return x.id === id; })[0];
      if (q) { q.answeredLocal = true; }
      var node = el('qq-' + id);
      if (node) { node.classList.add('answered'); }
      el('qcount').textContent = r.answered + ' / ' + questions.length + ' answered';
      telemetry('answer', id);
    }).catch(fatal);
  }

  /* ── surfaces ──────────────────────────────────────────────────────────────────────────────── */
  function showSurface(name) {
    surface = name;
    Array.prototype.forEach.call(el('surface').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.surface === name));
    });
    var isTerm = name === 'terminal';
    el('term').hidden = !isTerm;
    el('cmdform').hidden = !isTerm;
    el('winbody').hidden = isTerm;
    if (isTerm) { el('cmd').focus(); return; }
    el('winbody').innerHTML = '<div class="notice">Loading&hellip;</div>';
    call('netfinalWindow', { examId: EXAM_ID, window: name }).then(function (r) {
      setRemaining(r.remainingMs);
      el('winbody').innerHTML = renderWindow(name, r.view);
      telemetry('window', name);
    }).catch(function (e) { el('winbody').innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; });
  }

  /* Generic renderer: the server decides WHAT a window contains, this decides how it looks. Arrays
     of flat objects become tables, everything else a definition list -- so a new window or a new
     field needs no change here, which is the point of returning data rather than markup. */
  /* Build one form per action the SERVER declared for this window. The page does not know which
     windows have which actions, and must not: the engine ships `_actions` alongside the data, so a
     new action appears here because it exists. Before this, the window body was a read-only table
     dump -- fifteen actions existed and the page reached one, which left `incident-log/submit` and
     `change-requests/submit` unreachable even though both are graded, and left the firewall,
     wireless and rack repairs with no path at all. */
  function renderActions(name, forms) {
    return '<div class="actions">' + forms.map(function (f, fi) {
      var fid = 'act-' + name + '-' + fi;
      var inputs = f.params.map(function (prm) {
        var iid = fid + '-' + prm.name;
        var lbl = '<label for="' + iid + '">' + esc(prm.label)
          + (prm.optional ? ' <span class="opt">(optional)</span>' : '') + '</label>';
        var ctl;
        if (prm.options && prm.options.length) {
          ctl = '<select id="' + iid + '" data-param="' + esc(prm.name) + '">'
            + prm.options.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('')
            + '</select>';
        } else if (prm.textarea) {
          ctl = '<textarea id="' + iid + '" data-param="' + esc(prm.name) + '" rows="2" placeholder="'
            + esc(prm.placeholder) + '"></textarea>';
        } else {
          ctl = '<input id="' + iid + '" data-param="' + esc(prm.name) + '"'
            + (prm.optional ? ' data-optional="1"' : '')
            + ' placeholder="' + esc(prm.placeholder) + '" autocomplete="off" spellcheck="false">';
        }
        return '<div class="field">' + lbl + ctl + '</div>';
      }).join('');
      return '<form class="actform" data-window="' + esc(name) + '" data-action="' + esc(f.action) + '">'
        + '<h4>' + esc(f.label) + '</h4>' + inputs
        + '<button type="submit">' + esc(f.label) + '</button>'
        + '</form>';
    }).join('') + '</div>';
  }

  function renderWindow(name, view) {
    var out = ['<h3 style="font-size:.9rem;margin-bottom:10px">' + esc(view.title || name) + '</h3>'];
    Object.keys(view).forEach(function (k) {
      if (k === 'title' || k === '_actions' || k === '_restore') { return; }
      var v = view[k];
      out.push('<h2 style="padding:8px 0 4px;border:0">' + esc(k) + '</h2>');
      if (Array.isArray(v) && v.length && typeof v[0] === 'object') {
        var cols = Object.keys(v[0]);
        out.push('<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('')
          + '</tr></thead><tbody>' + v.map(function (row) {
            return '<tr>' + cols.map(function (c) {
              var cell = row[c];
              return '<td>' + esc(typeof cell === 'object' ? JSON.stringify(cell) : cell) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
      } else if (Array.isArray(v)) {
        out.push('<div>' + (v.length ? v.map(esc).join(', ') : '<span class="notice">none</span>') + '</div>');
      } else if (v && typeof v === 'object') {
        out.push('<table><tbody>' + Object.keys(v).map(function (kk) {
          var cell = v[kk];
          return '<tr><th>' + esc(kk) + '</th><td>' + esc(typeof cell === 'object' ? JSON.stringify(cell) : cell) + '</td></tr>';
        }).join('') + '</tbody></table>');
      } else {
        out.push('<div>' + esc(v) + '</div>');
      }
    });
    if (view._actions && view._actions.length) { out.push(renderActions(name, view._actions)); }
    if (view._restore && view._restore.devices && view._restore.devices.length) {
      out.push('<div class="actions"><form class="actform" id="restoreform">'
        + '<h4>' + esc(view._restore.label) + '</h4>'
        + '<div class="field"><label for="restoredev">Device</label>'
        + '<select id="restoredev">'
        + view._restore.devices.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('')
        + '</select></div>'
        + '<button type="submit">Restore device</button>'
        + '<p class="notice">A restore undoes every change you have made to that device, including a '
        + 'correct one. It is logged.</p>'
        + '</form></div>');
    }
    return out.join('');
  }

  /* Re-render the current window after an action, so the student sees the state they just changed
     rather than the state they changed it from. */
  function refreshWindow() {
    if (surface === 'terminal') { return Promise.resolve(); }
    return call('netfinalWindow', { examId: EXAM_ID, window: surface }).then(function (r) {
      setRemaining(r.remainingMs);
      el('winbody').innerHTML = renderWindow(surface, r.view);
    });
  }

  function actionResult(r) {
    var res = (r && r.result) ? r.result : r;
    var okay = res && res.ok;
    el('status').innerHTML = '<span class="' + (okay ? 'good' : 'bad') + '">'
      + esc(okay ? (res.message || 'Done.') : (res && res.reason ? res.reason : 'Rejected.')) + '</span>';
    /* A REJECTION IS NOT AN ERROR. The engine logs every attempt, successful or not, and the spec
       wants the rejected ones as evidence of what the student tried -- so a rejection updates the
       status line and leaves the form filled in, rather than throwing the work away. */
    return res;
  }

  function fatal(e) {
    var msg = (e && e.message) ? e.message : String(e);
    el('status').innerHTML = '<span class="bad">' + esc(msg) + '</span>';
    if (/Time expired|submitted/i.test(msg)) { finish(null, msg); }
  }

  function finish(report, msg) {
    if (tick) { clearInterval(tick); tick = null; }
    el('layout').hidden = true;
    el('done').hidden = false;
    if (!report) {
      el('report').innerHTML = '<div class="notice">' + esc(msg || 'Your exam has been submitted.') + '</div>';
      return;
    }
    /* THE HEADLINE NUMBER MUST NOT READ AS A FINAL GRADE WHILE POINTS ARE UNDECIDED.
       Q45 is instructor-marked, so a flawless run submits as total 191, outOf 200, with 9 pending --
       and "191 / 200" in 1.9rem type is read as a final score by every student who screenshots it,
       with the explanation in small grey text underneath. The graded-so-far denominator is the
       honest one, and the pending points are stated as pending rather than as lost. */
    var pending = Number(report.pendingInstructorMarks || 0);
    var gradedOutOf = report.outOf - pending;
    el('report').innerHTML =
      '<div class="big">' + report.total + ' <span class="of">/ ' + gradedOutOf
        + (pending ? ' graded' : '') + '</span></div>'
      + (pending
          ? '<div class="pending-note">' + pending + ' of the ' + report.outOf
            + ' points on this exam are marked by your instructor and are not included above.</div>' : '')
      + (report.flagged ? '<div class="notice bad">Flagged for instructor review: a change caused collateral damage.</div>' : '')
      + '<table style="margin-top:12px"><tbody>'
      + Object.keys(report.phases).map(function (p) {
          return '<tr><th>' + esc(p) + '</th><td>' + report.phases[p].earned + ' / ' + report.phases[p].of + '</td></tr>';
        }).join('')
      + '<tr><th>practical</th><td>' + report.subtotals.practical.earned + ' / ' + report.subtotals.practical.of + '</td></tr>'
      + '<tr><th>reasoning</th><td>' + report.subtotals.reasoning.earned + ' / ' + report.subtotals.reasoning.of + '</td></tr>'
      + '</tbody></table>';
  }

  /* ── wiring ────────────────────────────────────────────────────────────────────────────────── */
  el('cmdform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var line = el('cmd').value;
    if (!line.trim()) { return; }
    write(el('prompt').textContent + line);
    el('cmd').value = '';
    call('netfinalCommand', { examId: EXAM_ID, line: line }).then(function (r) {
      setRemaining(r.remainingMs);
      write(r.out);
      if (r.prompt) { el('prompt').textContent = r.prompt; }
      telemetry('command', line);
    }).catch(fatal);
  });

  /* DELEGATED on #winbody, which survives the innerHTML replacement that re-renders a window.
     Binding to each form would leak a listener per render and stop working after the first
     refresh. */
  el('winbody').addEventListener('submit', function (ev) {
    var form = ev.target.closest('form.actform');
    if (!form) { return; }
    ev.preventDefault();

    if (form.id === 'restoreform') {
      var dev = el('restoredev').value;
      var rbtn = form.querySelector('button[type=submit]');
      if (rbtn && rbtn.disabled) { return; }
      if (rbtn) { rbtn.disabled = true; }
      var rrelease = function () { if (rbtn) { rbtn.disabled = false; } };
      call('netfinalRestore', { examId: EXAM_ID, device: dev }).then(function (r) {
        actionResult(r);
        telemetry('restore', dev);
        return refreshWindow();
      }).then(rrelease, function (e) { rrelease(); fatal(e); });
      return;
    }

    var params = {};
    Array.prototype.forEach.call(form.querySelectorAll('[data-param]'), function (ctl) {
      var v = ctl.value;
      /* OMITTED ONLY IF THE SCHEMA SAID IT WAS OPTIONAL. The engine's validators distinguish "not
         given" from "given as empty" -- portforward-set applies toPort only when present, and
         sending '' would set the port to NaN -- but blanking a REQUIRED field is a different thing,
         and it must reach the server as the empty value it is so the rejection names the field
         instead of reporting it as undefined. */
      var optional = ctl.dataset.optional === '1';
      if (v === '' || v === null || v === undefined) {
        if (!optional) { params[ctl.dataset.param] = ''; }
        return;
      }
      params[ctl.dataset.param] = v;
    });
    /* DISABLED WHILE IN FLIGHT. The exam-submit button already did this; these forms did not, so a
       fast double-click or a window switch mid-request raced itself and the loser came back as the
       compare-and-set 'aborted' error. The server was right to refuse it, but a student who reads a
       red message and moves on has lost the work just the same. One request per form at a time, and
       the button comes back whatever happens. */
    var btn = form.querySelector('button[type=submit]');
    if (btn && btn.disabled) { return; }
    if (btn) { btn.disabled = true; }
    var release = function () { if (btn) { btn.disabled = false; } };

    call('netfinalAction', {
      examId: EXAM_ID, window: form.dataset.window, action: form.dataset.action, params: params
    }).then(function (r) {
      actionResult(r);
      telemetry('action', form.dataset.window + '/' + form.dataset.action);
      return refreshWindow();
    }).then(release, function (e) { release(); fatal(e); });
  });

  el('surface').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-surface]');
    if (b) { showSurface(b.dataset.surface); }
  });

  el('questions').addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || !t.dataset || !t.dataset.q) { return; }
    /* A MULTI-FIELD QUESTION SENDS ONE OBJECT. Both controls carry the same data-q, so whichever one
       changes posts the pair -- otherwise choosing the ACL would overwrite the sequence already
       typed, and the last field touched would be the only one that counted. */
    if (t.dataset.part) {
      var parts = {};
      Array.prototype.forEach.call(
        el('questions').querySelectorAll('[data-q="' + t.dataset.q + '"][data-part]'),
        function (ctl) { parts[ctl.dataset.part] = ctl.value; });
      saveAnswer(t.dataset.q, parts);
      return;
    }
    saveAnswer(t.dataset.q, t.value);
  });

  el('submit').addEventListener('click', function () {
    if (!window.confirm('Submit your exam? This cannot be undone and you have one attempt.')) { return; }
    el('submit').disabled = true;
    call('netfinalSubmit', { examId: EXAM_ID }).then(function (r) {
      telemetry('submit', '');
      finish(r.report, null);
    }).catch(function (e) { el('submit').disabled = false; fatal(e); });
  });

  /* ── start, or resume ──────────────────────────────────────────────────────────────────────── */
  call('netfinalStart', { examId: EXAM_ID }).then(function (r) {
    session = r;
    questions = r.questions || [];
    answers = r.answers || {};
    tickets = (r.initialState && r.initialState.tickets) || [];
    setRemaining(r.remainingMs);

    /* The server tells the page what exam mode means; the page does not decide. If this ever
       disagrees with the flags, the server is right. */
    /* The flag is read for completeness, but nothing acts on it: the tutor script is not loaded on
       this page under ANY flag value. A branch that COULD load it would make the guarantee depend
       on a server response, and the criterion is that the page never requests it. */
    if (r.examMode && r.examMode.loadHexAI) { telemetry('exam-mode-conflict', 'loadHexAI was true'); }

    if (r.submitted) { finish(null, 'This exam has already been submitted.'); return; }
    el('gate').hidden = true;
    el('layout').hidden = false;
    renderTickets();
    renderQuestions();
    write(r.resumed
      ? '[session resumed — same lab, same clock]'
      : '[Meridian Corp operations lab ready. You are on ADMIN-WS01.]');
    write('Type a command, or use the tabs above for the firewall, wireless controller, NOC and rack.');
    el('cmd').focus();
    tick = setInterval(function () {
      remaining = Math.max(0, remaining - 1000);
      paintClock();
      if (remaining === 0 && tick) {
        clearInterval(tick); tick = null;
        /* The SERVER decides time is up. This just asks, so an edited counter cannot end an exam
           early and a stopped counter cannot extend one. */
        call('netfinalSubmit', { examId: EXAM_ID }).then(function (r2) { finish(r2.report, null); }).catch(fatal);
      }
    }, 1000);
  }).catch(function (e) {
    el('gatemsg').innerHTML = '<span class="bad">' + esc(e.message) + '</span>';
  });
})();
</script>
</body>
</html>
