<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSI Model Quiz | N10-009</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'OSI Model Quiz',
            description: 'Test your knowledge of the 7 layers, PDUs, protocols, and devices.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-osi-quiz',
            moduleId: 'web-osi-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the PDU (Protocol Data Unit) at Layer 2?',
                    options: [
                        'Packet',
                        'Segment',
                        'Frame',
                        'Bits'
                    ],
                    explanation: 'At Layer 2 (Data Link), data is called a Frame. It contains MAC addresses and FCS for error checking.'
                },
                {
                    question: 'Which layer is responsible for logical addressing using IP addresses?',
                    options: [
                        'Layer 2 - Data Link',
                        'Layer 3 - Network',
                        'Layer 4 - Transport',
                        'Layer 5 - Session'
                    ],
                    explanation: 'Layer 3 (Network) handles IP addressing and routing between different networks.'
                },
                {
                    question: 'At which layer does a switch operate?',
                    options: [
                        'Layer 1',
                        'Layer 2',
                        'Layer 3',
                        'Layer 4'
                    ],
                    explanation: 'Switches operate at Layer 2 (Data Link) and make forwarding decisions based on MAC addresses.'
                },
                {
                    question: 'What happens during encapsulation?',
                    options: [
                        'Headers are removed',
                        'Headers are added',
                        'Data is deleted',
                        'Packets are merged'
                    ],
                    explanation: 'During encapsulation, each layer adds its own header (and sometimes trailer) as data moves down the stack.'
                },
                {
                    question: 'Which protocol operates at Layer 4 and provides reliable delivery?',
                    options: [
                        'IP',
                        'HTTP',
                        'TCP',
                        'Ethernet'
                    ],
                    explanation: 'TCP (Transmission Control Protocol) operates at Layer 4 and provides reliable, connection-oriented delivery.'
                },
                {
                    question: 'What is the correct order of the OSI layers from bottom to top?',
                    options: [
                        'Application, Presentation, Session, Transport, Network, Data Link, Physical',
                        'Physical, Data Link, Network, Transport, Session, Presentation, Application',
                        'Physical, Network, Transport, Data Link, Session, Presentation, Application',
                        'Network, Transport, Session, Physical, Data Link, Presentation, Application'
                    ],
                    explanation: 'From bottom to top: Physical (1), Data Link (2), Network (3), Transport (4), Session (5), Presentation (6), Application (7).'
                },
                {
                    question: 'Which layer handles encryption and data formatting?',
                    options: [
                        'Layer 5 - Session',
                        'Layer 6 - Presentation',
                        'Layer 7 - Application',
                        'Layer 4 - Transport'
                    ],
                    explanation: 'Layer 6 (Presentation) handles data formatting, encryption/decryption, and compression.'
                },
                {
                    question: 'What addressing is used at Layer 2?',
                    options: [
                        'IP addresses',
                        'Port numbers',
                        'MAC addresses',
                        'URL addresses'
                    ],
                    explanation: 'Layer 2 uses MAC (Media Access Control) addresses -- 48-bit physical addresses burned into network cards.'
                },
                {
                    question: 'A router operates at which OSI layer?',
                    options: [
                        'Layer 1',
                        'Layer 2',
                        'Layer 3',
                        'Layer 7'
                    ],
                    explanation: 'Routers operate at Layer 3 (Network) and make forwarding decisions based on IP addresses.'
                },
                {
                    question: 'Which layer uses port numbers to identify applications?',
                    options: [
                        'Layer 2',
                        'Layer 3',
                        'Layer 4',
                        'Layer 7'
                    ],
                    explanation: 'Layer 4 (Transport) uses port numbers to identify specific applications/services (e.g., port 80 for HTTP, port 443 for HTTPS).'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
