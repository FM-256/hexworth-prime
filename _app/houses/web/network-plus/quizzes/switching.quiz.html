<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 4: Switching Quiz | Network+ N10-009</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #111128 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #67e8f9; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(6, 182, 212, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Network+ Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Chapter 4: Switching Quiz</h1>
            <p class="subtitle">VLANs, STP, trunking, EtherChannel, and switching features</p>
            <div class="meta">
                <span>Chapter 4</span>
                <span>15 Questions</span>
                <span>Obj 2.2</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Network+ Hub</a>
                <a href="../index.html#ch6" id="nextChapterBtn" class="btn-hub" style="display:none;background:var(--success, #22c55e);color:#fff;border-color:var(--success, #22c55e);">Continue to Chapter 6 →</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "What is the default VLAN on most managed switches?",
                opts: ["VLAN 0", "VLAN 1", "VLAN 10", "VLAN 100"],
                ans: 1,
                exp: "VLAN 1 is the default VLAN. All ports are assigned to it by default until reconfigured."
            },
            {
                q: "Which protocol adds a 4-byte tag to Ethernet frames for VLAN identification?",
                opts: ["STP", "LACP", "802.1Q", "802.3"],
                ans: 2,
                exp: "802.1Q inserts a 4-byte VLAN tag between the source MAC and EtherType fields."
            },
            {
                q: "What is the purpose of a native VLAN on a trunk port?",
                opts: ["It encrypts traffic", "It carries untagged frames", "It blocks broadcast traffic", "It prioritizes voice traffic"],
                ans: 1,
                exp: "The native VLAN carries untagged frames on a trunk. Frames in the native VLAN are sent without an 802.1Q tag."
            },
            {
                q: "A VoIP phone is connected to a switch port. Which feature allows the phone and PC to be on different VLANs using the same port?",
                opts: ["Port mirroring", "Voice VLAN", "Port security", "SPAN"],
                ans: 1,
                exp: "Voice VLAN allows a switch port to carry two VLANs: one for the PC (data VLAN, untagged) and one for the phone (voice VLAN, tagged with 802.1Q)."
            },
            {
                q: "What does STP prevent in a switched network?",
                opts: ["VLAN hopping", "MAC flooding", "Switching loops", "ARP poisoning"],
                ans: 2,
                exp: "Spanning Tree Protocol prevents Layer 2 loops by blocking redundant paths while keeping them available for failover."
            },
            {
                q: "In STP, how is the root bridge elected?",
                opts: ["Highest MAC address", "Lowest Bridge ID (Priority + MAC)", "Most connected ports", "Fastest uplink speed"],
                ans: 1,
                exp: "The switch with the lowest Bridge ID (priority value + MAC address) becomes the root bridge. Default priority is 32768."
            },
            {
                q: "What is the maximum transmission unit (MTU) for standard Ethernet?",
                opts: ["1000 bytes", "1500 bytes", "9000 bytes", "64000 bytes"],
                ans: 1,
                exp: "Standard Ethernet MTU is 1500 bytes. Jumbo frames extend this to 9000+ bytes for high-performance networks."
            },
            {
                q: "What are jumbo frames used for?",
                opts: ["Encrypting large files", "Reducing overhead in high-throughput environments", "Prioritizing voice traffic", "Spanning VLANs"],
                ans: 1,
                exp: "Jumbo frames (MTU 9000+) reduce per-frame overhead for large data transfers. All devices in the path must support the same MTU."
            },
            {
                q: "Which EtherChannel protocol is an IEEE standard?",
                opts: ["PAgP", "LACP", "VTP", "CDP"],
                ans: 1,
                exp: "LACP (Link Aggregation Control Protocol, IEEE 802.3ad) is the open standard. PAgP is Cisco proprietary."
            },
            {
                q: "What is a Switch Virtual Interface (SVI)?",
                opts: ["A physical uplink port", "A virtual interface on a Layer 3 switch for inter-VLAN routing", "A SPAN mirror port", "A trunk port"],
                ans: 1,
                exp: "An SVI is a virtual interface assigned to a VLAN on a Layer 3 switch. It provides the default gateway for hosts in that VLAN, enabling routing between VLANs without an external router."
            },
            {
                q: "Which STP port state actively forwards traffic and learns MAC addresses?",
                opts: ["Blocking", "Listening", "Learning", "Forwarding"],
                ans: 3,
                exp: "Only the Forwarding state both learns MAC addresses AND forwards user traffic. Learning state learns MACs but does not forward."
            },
            {
                q: "What is the advantage of RSTP (802.1w) over STP (802.1D)?",
                opts: ["It supports more VLANs", "It converges in under 6 seconds", "It encrypts BPDUs", "It eliminates the need for trunk ports"],
                ans: 1,
                exp: "RSTP converges in under 6 seconds compared to STP's 30-50 seconds, reducing network downtime during topology changes."
            },
            {
                q: "A switch port is configured with a maximum of 2 MAC addresses. A third device connects. In \"shutdown\" violation mode, what happens?",
                opts: ["The third device's traffic is dropped silently", "The port sends an SNMP trap", "The port is err-disabled", "The switch reboots"],
                ans: 2,
                exp: "In shutdown mode (default), a port security violation puts the port into err-disabled state. An admin must manually re-enable it."
            },
            {
                q: "Which command displays the MAC address table on a Cisco switch?",
                opts: ["show arp", "show mac address-table", "show vlan brief", "show interfaces"],
                ans: 1,
                exp: "show mac address-table displays the CAM table showing learned MAC addresses, their associated VLANs, and switch ports."
            },
            {
                q: "On a trunk link, which VLANs are allowed by default?",
                opts: ["Only VLAN 1", "Only configured VLANs", "All VLANs (1-4094)", "No VLANs until configured"],
                ans: 2,
                exp: "By default, a trunk port allows all VLANs (1-4094). Administrators can restrict this with the switchport trunk allowed vlan command."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered Ethernet switching concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the topics you missed and you will be exam-ready.';
            else if (pct >= 50) msg = 'Good effort. Revisit the switching presentations and try again.';
            else msg = 'Keep studying. Review Chapter 4 materials and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-switching-quiz', { returnToDashboard: false, returnUrl: '../index.html' });
            }

            var nextBtn = document.getElementById('nextChapterBtn');
            if (nextBtn) nextBtn.style.display = pct >= 70 ? '' : 'none';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
