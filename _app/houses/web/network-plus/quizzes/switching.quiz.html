    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;

            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Switching Quiz',
            description: 'VLANs, STP, trunking, EtherChannel, and switching features.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-switching-quiz',
            moduleId: 'web-switching-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the default VLAN on most managed switches?',
                    options: [
                        'VLAN 0',
                        'VLAN 1',
                        'VLAN 10',
                        'VLAN 100'
                    ],
                    explanation: 'VLAN 1 is the default VLAN. All ports are assigned to it by default until reconfigured.'
                },
                {
                    question: 'Which protocol adds a 4-byte tag to Ethernet frames for VLAN identification?',
                    options: [
                        'STP',
                        'LACP',
                        '802.1Q',
                        '802.3'
                    ],
                    explanation: '802.1Q inserts a 4-byte VLAN tag between the source MAC and EtherType fields.'
                },
                {
                    question: 'What is the purpose of a native VLAN on a trunk port?',
                    options: [
                        'It encrypts traffic',
                        'It carries untagged frames',
                        'It blocks broadcast traffic',
                        'It prioritizes voice traffic'
                    ],
                    explanation: 'The native VLAN carries untagged frames on a trunk. Frames in the native VLAN are sent without an 802.1Q tag.'
                },
                {
                    question: 'A VoIP phone is connected to a switch port. Which feature allows the phone and PC to be on different VLANs using the same port?',
                    options: [
                        'Port mirroring',
                        'Voice VLAN',
                        'Port security',
                        'SPAN'
                    ],
                    explanation: 'Voice VLAN allows a switch port to carry two VLANs: one for the PC (data VLAN, untagged) and one for the phone (voice VLAN, tagged with 802.1Q).'
                },
                {
                    question: 'What does STP prevent in a switched network?',
                    options: [
                        'VLAN hopping',
                        'MAC flooding',
                        'Switching loops',
                        'ARP poisoning'
                    ],
                    explanation: 'Spanning Tree Protocol prevents Layer 2 loops by blocking redundant paths while keeping them available for failover.'
                },
                {
                    question: 'In STP, how is the root bridge elected?',
                    options: [
                        'Highest MAC address',
                        'Lowest Bridge ID (Priority + MAC)',
                        'Most connected ports',
                        'Fastest uplink speed'
                    ],
                    explanation: 'The switch with the lowest Bridge ID (priority value + MAC address) becomes the root bridge. Default priority is 32768.'
                },
                {
                    question: 'What is the maximum transmission unit (MTU) for standard Ethernet?',
                    options: [
                        '1000 bytes',
                        '1500 bytes',
                        '9000 bytes',
                        '64000 bytes'
                    ],
                    explanation: 'Standard Ethernet MTU is 1500 bytes. Jumbo frames extend this to 9000+ bytes for high-performance networks.'
                },
                {
                    question: 'What are jumbo frames used for?',
                    options: [
                        'Encrypting large files',
                        'Reducing overhead in high-throughput environments',
                        'Prioritizing voice traffic',
                        'Spanning VLANs'
                    ],
                    explanation: 'Jumbo frames (MTU 9000+) reduce per-frame overhead for large data transfers. All devices in the path must support the same MTU.'
                },
                {
                    question: 'Which EtherChannel protocol is an IEEE standard?',
                    options: [
                        'PAgP',
                        'LACP',
                        'VTP',
                        'CDP'
                    ],
                    explanation: 'LACP (Link Aggregation Control Protocol, IEEE 802.3ad) is the open standard. PAgP is Cisco proprietary.'
                },
                {
                    question: 'What is a Switch Virtual Interface (SVI)?',
                    options: [
                        'A physical uplink port',
                        'A virtual interface on a Layer 3 switch for inter-VLAN routing',
                        'A SPAN mirror port',
                        'A trunk port'
                    ],
                    explanation: 'An SVI is a virtual interface assigned to a VLAN on a Layer 3 switch. It provides the default gateway for hosts in that VLAN, enabling routing between VLANs without an external router.'
                },
                {
                    question: 'Which STP port state actively forwards traffic and learns MAC addresses?',
                    options: [
                        'Blocking',
                        'Listening',
                        'Learning',
                        'Forwarding'
                    ],
                    explanation: 'Only the Forwarding state both learns MAC addresses AND forwards user traffic. Learning state learns MACs but does not forward.'
                },
                {
                    question: 'What is the advantage of RSTP (802.1w) over STP (802.1D)?',
                    options: [
                        'It supports more VLANs',
                        'It converges in under 6 seconds',
                        'It encrypts BPDUs',
                        'It eliminates the need for trunk ports'
                    ],
                    explanation: 'RSTP converges in under 6 seconds compared to STP\\'s 30-50 seconds, reducing network downtime during topology changes.'
                },
                {
                    question: 'A switch port is configured with a maximum of 2 MAC addresses. A third device connects. In "shutdown" violation mode, what happens?',
                    options: [
                        'The third device\\'s traffic is dropped silently',
                        'The port sends an SNMP trap',
                        'The port is err-disabled',
                        'The switch reboots'
                    ],
                    explanation: 'In shutdown mode (default), a port security violation puts the port into err-disabled state. An admin must manually re-enable it.'
                },
                {
                    question: 'Which command displays the MAC address table on a Cisco switch?',
                    options: [
                        'show arp',
                        'show mac address-table',
                        'show vlan brief',
                        'show interfaces'
                    ],
                    explanation: 'show mac address-table displays the CAM table showing learned MAC addresses, their associated VLANs, and switch ports.'
                },
                {
                    question: 'On a trunk link, which VLANs are allowed by default?',
                    options: [
                        'Only VLAN 1',
                        'Only configured VLANs',
                        'All VLANs (1-4094)',
                        'No VLANs until configured'
                    ],
                    explanation: 'By default, a trunk port allows all VLANs (1-4094). Administrators can restrict this with the switchport trunk allowed vlan command.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
