    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Network Troubleshooting and Tools',
            description: 'Test your understanding of the CompTIA troubleshooting methodology, command-line tools, network monitoring, connectivity issues, and performance metrics.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'n10009-ch02-quiz',
            moduleId: 'n10009-ch02-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'In the CompTIA troubleshooting methodology, what is the FIRST step?',
                    options: [
                        'Establish a theory of probable cause',
                        'Test the theory to determine cause',
                        'Identify the problem',
                        'Document findings, actions, and outcomes'
                    ],
                    explanation: 'The CompTIA 7-step troubleshooting model begins with "Identify the problem." This means gathering information from the affected user, determining the scope (one user, one department, or the entire network), checking for recent changes, and attempting to duplicate the problem. Jumping to theories without first understanding the symptoms leads to wasted time and incorrect fixes. The full order is: 1) Identify, 2) Theorize, 3) Test, 4) Plan, 5) Implement/Escalate, 6) Verify, 7) Document.'
                },
                {
                    question: 'A technician resolves a network issue and confirms the fix works. What should they do NEXT according to the CompTIA methodology?',
                    options: [
                        'Establish a plan of action',
                        'Escalate to the next tier',
                        'Implement preventive measures',
                        'Document findings, actions, and outcomes'
                    ],
                    explanation: 'After step 6 (Verify full system functionality -- which includes implementing preventive measures), the final step is 7: Document findings, actions, and outcomes. Documentation creates a knowledge base entry for future technicians, provides an audit trail, and supports change management. Many technicians skip documentation in practice, but the CompTIA exam treats it as mandatory. Preventive measures are part of step 6 (verify), not a separate step after documentation.'
                },
                {
                    question: 'Which command-line tool sends ICMP Echo Request packets to test basic IP connectivity to a remote host?',
                    options: [
                        'tracert',
                        'ping',
                        'nslookup',
                        'netstat'
                    ],
                    explanation: 'Ping sends ICMP Echo Request packets and listens for ICMP Echo Reply responses. It is the most fundamental connectivity test -- if ping succeeds, there is bidirectional IP reachability between the two hosts. Ping output shows round-trip time (latency), TTL, and packet loss percentage. If ping fails, the target may be down, unreachable, or blocking ICMP. Tracert maps the path using TTL manipulation. Nslookup queries DNS. Netstat shows active connections on the local machine.'
                },
                {
                    question: 'A traceroute shows normal latency for the first 3 hops, then "* * *" for hop 4 and all subsequent hops. What does this most likely indicate?',
                    options: [
                        'The destination server is down',
                        'A router at hop 4 is blocking ICMP or the path beyond it is unreachable',
                        'The source machine has a DNS resolution failure',
                        'The local default gateway is misconfigured'
                    ],
                    explanation: 'Asterisks (* * *) in traceroute output mean the hop did not return an ICMP Time Exceeded message within the timeout period. When every hop after a certain point shows asterisks, the most likely cause is that a router or firewall at that hop is blocking ICMP (either filtering it or not generating Time Exceeded messages), or the path is genuinely broken at that point and packets cannot proceed. The first 3 hops responded normally, ruling out local gateway or DNS issues.'
                },
                {
                    question: 'A user reports they cannot browse to example.com. Ping to 8.8.8.8 succeeds, but ping to example.com fails with "could not find host." Which tool should the technician use to diagnose this?',
                    options: [
                        'arp -a',
                        'netstat -an',
                        'nslookup example.com',
                        'tracert 8.8.8.8'
                    ],
                    explanation: 'The symptoms clearly indicate a DNS resolution failure: IP connectivity works (ping to 8.8.8.8 succeeds) but name resolution does not (ping to a domain name fails). Nslookup queries the DNS server directly and will show whether the configured DNS server can resolve the domain. If nslookup fails with the default DNS server but succeeds with an alternate (nslookup example.com 8.8.8.8), the problem is the local DNS server. Arp shows MAC mappings, netstat shows connections, tracert tests path -- none diagnose DNS.'
                },
                {
                    question: 'Which command displays all active TCP and UDP connections on a Windows machine in numeric format?',
                    options: [
                        'ipconfig /all',
                        'arp -a',
                        'netstat -an',
                        'nslookup -type=any'
                    ],
                    explanation: 'The "netstat -an" command shows all (-a) active connections and listening ports in numeric (-n) format, meaning IP addresses and port numbers are displayed as numbers rather than resolved to hostnames. This is useful for identifying which services are listening, which remote hosts are connected, and whether connections are in ESTABLISHED, TIME_WAIT, or CLOSE_WAIT states. Adding -b on Windows shows the process name that owns each connection.'
                },
                {
                    question: 'A workstation obtains an IP address of 169.254.10.50. What does this indicate?',
                    options: [
                        'The DNS server is unreachable',
                        'The default gateway is misconfigured',
                        'The DHCP server is unreachable or the DHCP scope is exhausted',
                        'The switch port is in the wrong VLAN'
                    ],
                    explanation: 'An IP address in the 169.254.0.0/16 range is an Automatic Private IP Address (APIPA). Windows and some Linux systems assign an APIPA address when the DHCP client sends DHCP Discover broadcasts but receives no DHCP Offer response. Causes include: DHCP server down, DHCP scope exhausted (no available addresses), network connectivity between client and DHCP server is broken, or the DHCP relay agent (ip helper-address) is not configured on the router if the server is on a different subnet.'
                },
                {
                    question: 'Which SNMP version adds authentication (SHA) and encryption (AES) to protect management traffic?',
                    options: [
                        'SNMPv1',
                        'SNMPv2c',
                        'SNMPv3',
                        'SNMPv2'
                    ],
                    explanation: 'SNMPv3 introduces a User Security Model (USM) that provides authentication (SHA or MD5 hashing to verify the sender) and encryption (AES or DES to protect the payload). SNMPv1 and SNMPv2c use community strings transmitted in plaintext -- anyone who captures the community string can read or modify device configurations. SNMPv3 is the only version acceptable for production environments. The exam will always prefer SNMPv3 when security is a concern.'
                },
                {
                    question: 'A syslog message has severity level 2. What severity classification is this?',
                    options: [
                        'Warning',
                        'Critical',
                        'Informational',
                        'Debug'
                    ],
                    explanation: 'Syslog severity levels range from 0 (Emergency -- system unusable) to 7 (Debug -- verbose diagnostic output). Level 2 is Critical -- a condition requiring immediate attention, such as a hardware failure or a critical software error. The full scale: 0-Emergency, 1-Alert, 2-Critical, 3-Error, 4-Warning, 5-Notice, 6-Informational, 7-Debug. Lower numbers indicate higher severity. A common exam trick is reversing the scale -- remember "lower number = more severe."'
                },
                {
                    question: 'Which network monitoring technology records metadata about traffic flows (source/destination IP, ports, byte count) without capturing packet contents?',
                    options: [
                        'Wireshark',
                        'NetFlow',
                        'SNMP traps',
                        'Syslog'
                    ],
                    explanation: 'NetFlow (Cisco), sFlow, and IPFIX record flow metadata -- the 5-tuple (source IP, destination IP, source port, destination port, protocol) plus byte/packet counts and timestamps. This data reveals who is talking to whom, how much data is being transferred, and which applications are consuming bandwidth -- without the privacy and storage concerns of full packet capture. Wireshark performs full packet capture. SNMP polls device metrics. Syslog collects event logs.'
                },
                {
                    question: 'A network link is rated at 1 Gbps, but file transfers only achieve 700 Mbps. The 700 Mbps value represents which metric?',
                    options: [
                        'Bandwidth',
                        'Throughput',
                        'Latency',
                        'Jitter'
                    ],
                    explanation: 'Bandwidth is the theoretical maximum capacity of a link (1 Gbps). Throughput is the actual data transfer rate achieved in practice (700 Mbps in this case). Throughput is always less than bandwidth due to protocol overhead (Ethernet framing, TCP headers), congestion, errors, and retransmissions. The gap between bandwidth and throughput can indicate problems -- if a 1 Gbps link only achieves 200 Mbps, investigate duplex mismatches, CRC errors, or congestion. Latency measures delay, jitter measures delay variation.'
                },
                {
                    question: 'VoIP calls are experiencing choppy audio and garbled speech. Users report that file transfers work fine. Which performance metric is most likely the cause?',
                    options: [
                        'Bandwidth',
                        'Latency',
                        'Jitter',
                        'MTU size'
                    ],
                    explanation: 'Jitter is the variation in latency between successive packets. VoIP is extremely sensitive to jitter because the codec expects packets to arrive at consistent intervals. When jitter is high, packets arrive out of order or with irregular spacing, causing choppy audio, gaps in conversation, and garbled speech. File transfers tolerate jitter well because TCP handles reordering and retransmission. Acceptable VoIP jitter is under 30ms. Mitigation: QoS with priority queuing (DSCP EF for voice), jitter buffers on VoIP endpoints.'
                },
                {
                    question: 'A switch interface shows increasing CRC errors and input errors in the "show interface" output. What is the most likely cause?',
                    options: [
                        'A faulty or damaged cable',
                        'An incorrect VLAN assignment',
                        'A DNS resolution failure',
                        'An expired DHCP lease'
                    ],
                    explanation: 'CRC (Cyclic Redundancy Check) errors indicate that frames are arriving with corrupted data -- the checksum calculated by the receiver does not match the checksum in the frame. The most common causes are physical layer problems: a damaged cable, a loose connector, electromagnetic interference (EMI) from power cables or fluorescent lights, or a failing NIC. Rising CRC errors are a strong indicator of a Layer 1 issue. VLAN, DNS, and DHCP are higher-layer concerns and do not cause CRC errors.'
                },
                {
                    question: 'Which Windows command releases the current DHCP lease and requests a new IP address from the DHCP server?',
                    options: [
                        'ipconfig /flushdns followed by ipconfig /registerdns',
                        'netsh interface reset',
                        'ipconfig /release followed by ipconfig /renew',
                        'arp -d * followed by arp -a'
                    ],
                    explanation: 'The "ipconfig /release" command tells the DHCP client to send a DHCP Release message, giving up its current IP address. The "ipconfig /renew" command then sends a new DHCP Discover to request a fresh lease. This is a common troubleshooting step when a client has an incorrect IP configuration (wrong subnet, APIPA address) or when DHCP settings have changed on the server. The /flushdns command clears the DNS resolver cache, which is a DNS fix, not a DHCP fix.'
                },
                {
                    question: 'A network engineer wants to identify which router hop is dropping 15% of packets on the path to a remote server. Which tool provides per-hop packet loss statistics?',
                    options: [
                        'ping -t',
                        'nslookup',
                        'pathping',
                        'arp -a'
                    ],
                    explanation: 'Pathping (Windows) combines the functionality of ping and traceroute. It first maps the path to the destination (like traceroute), then sends 100 packets to each hop over a 25-second period and reports the packet loss percentage at each point. This identifies exactly which hop is responsible for packet loss. The Linux equivalent is mtr (My Traceroute), which provides the same data in real-time. Standard ping shows overall loss but not per-hop data. Traceroute shows the path but not loss statistics.'
                }
            ]
        });
        quiz.start();
    </script>
