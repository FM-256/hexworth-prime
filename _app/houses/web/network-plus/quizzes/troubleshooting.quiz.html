<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Troubleshooting Quiz',
            description: 'Methodology, tools, cable issues, and network diagnostics.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-troubleshooting-quiz',
            moduleId: 'web-troubleshooting-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the FIRST step in the CompTIA troubleshooting methodology?',
                    options: [
                        'Establish a theory of probable cause',
                        'Identify the problem',
                        'Test the theory to determine the cause',
                        'Implement the solution'
                    ],
                    explanation: 'The 7-step CompTIA methodology begins with Identify the problem. This includes gathering information, questioning users, and identifying symptoms.'
                },
                {
                    question: 'What is the correct order of the CompTIA 7-step troubleshooting methodology?',
                    options: [
                        'Identify, Theory, Test, Plan, Implement, Verify, Document',
                        'Document, Identify, Theory, Test, Plan, Implement, Verify',
                        'Identify, Test, Theory, Plan, Implement, Document, Verify',
                        'Theory, Identify, Test, Implement, Plan, Verify, Document'
                    ],
                    explanation: 'The correct order is: 1) Identify the problem, 2) Establish a theory, 3) Test the theory, 4) Establish a plan of action, 5) Implement the solution, 6) Verify full system functionality, 7) Document findings.'
                },
                {
                    question: 'A technician suspects a problem exists at a specific layer. Which troubleshooting approach starts at that layer and moves up or down?',
                    options: [
                        'Bottom-up',
                        'Top-down',
                        'Divide and conquer',
                        'Random approach'
                    ],
                    explanation: 'Divide and conquer starts at the suspected layer and works outward. Bottom-up starts at Layer 1, and top-down starts at Layer 7.'
                },
                {
                    question: 'Which command tests reachability to a remote host and measures round-trip time?',
                    options: [
                        'traceroute',
                        'nslookup',
                        'ping',
                        'netstat'
                    ],
                    explanation: 'Ping sends ICMP echo requests to a target and reports round-trip time, TTL, and packet loss -- the most basic reachability test.'
                },
                {
                    question: 'A user cannot access a website by name but can reach it by IP address. Which tool should you use first to diagnose this?',
                    options: [
                        'ping',
                        'traceroute',
                        'nslookup',
                        'netstat'
                    ],
                    explanation: 'When name resolution fails but IP access works, use nslookup or dig to query DNS and verify whether the DNS server returns correct records.'
                },
                {
                    question: 'Which command shows the path packets take across a network, listing each hop?',
                    options: [
                        'ping',
                        'traceroute / tracert',
                        'arp -a',
                        'ipconfig /all'
                    ],
                    explanation: 'Traceroute (Linux/Mac) or tracert (Windows) sends packets with incrementing TTL values to discover each router hop between source and destination.'
                },
                {
                    question: 'A technician runs netstat -an and sees many connections in TIME_WAIT state. What does this indicate?',
                    options: [
                        'Active SYN flood attack in progress',
                        'Connections that recently closed and are waiting for stale packets to expire',
                        'The server has run out of available ports',
                        'DNS resolution is failing'
                    ],
                    explanation: 'TIME_WAIT is a normal TCP state after a connection closes. The socket waits (typically 2x MSL) to ensure late-arriving packets are handled. Many TIME_WAIT entries indicate high recent connection turnover.'
                },
                {
                    question: 'What cable problem occurs when signals from one wire pair bleed into an adjacent pair?',
                    options: [
                        'Attenuation',
                        'EMI',
                        'Crosstalk',
                        'Open circuit'
                    ],
                    explanation: 'Crosstalk is signal interference between adjacent wire pairs in a cable. NEXT (near-end) and FEXT (far-end) are types measured by cable testers.'
                },
                {
                    question: 'What is the maximum recommended cable length for a single Cat 5e/6 UTP run?',
                    options: [
                        '50 meters',
                        '100 meters',
                        '150 meters',
                        '300 meters'
                    ],
                    explanation: 'The TIA/EIA standard specifies 100 meters (328 feet) maximum for a single copper Ethernet run, including patch cables at both ends.'
                },
                {
                    question: 'A switch port shows a high number of late collisions. What is the most likely cause?',
                    options: [
                        'Cable exceeds maximum length',
                        'Duplex mismatch between the switch and the connected device',
                        'Incorrect VLAN assignment',
                        'DNS misconfiguration'
                    ],
                    explanation: 'Late collisions are the hallmark symptom of a duplex mismatch -- one side is set to full-duplex while the other is half-duplex.'
                },
                {
                    question: 'In Wireshark, which display filter shows only HTTP traffic?',
                    options: [
                        'filter == http',
                        'tcp.port == 80',
                        'http',
                        'protocol.http'
                    ],
                    explanation: 'In Wireshark, typing \'http\' as a display filter shows all HTTP protocol traffic. You can also use \'tcp.port == 80\' but \'http\' is the proper protocol filter.'
                },
                {
                    question: 'A host receives an ICMP Type 3, Code 1 message. What does this indicate?',
                    options: [
                        'TTL expired in transit',
                        'Destination host unreachable',
                        'Port unreachable',
                        'Redirect to a better route'
                    ],
                    explanation: 'ICMP Type 3 is Destination Unreachable. Code 0 = network unreachable, Code 1 = host unreachable, Code 3 = port unreachable, Code 4 = fragmentation needed.'
                },
                {
                    question: 'A user can ping hosts on the local subnet but cannot reach any remote networks. Packets larger than 1472 bytes fail. What is the issue?',
                    options: [
                        'DNS failure',
                        'MTU/PMTUD issue -- packets are being dropped due to fragmentation problems',
                        'Duplex mismatch',
                        'VLAN misconfiguration'
                    ],
                    explanation: 'Path MTU Discovery (PMTUD) issues occur when ICMP \'fragmentation needed\' messages are blocked (often by a firewall), preventing the sender from reducing packet size.'
                },
                {
                    question: 'An interface shows a high number of CRC errors. What is the most likely cause?',
                    options: [
                        'Software bug on the switch',
                        'Damaged cable, bad connector, or electromagnetic interference',
                        'Incorrect IP configuration',
                        'DHCP scope exhaustion'
                    ],
                    explanation: 'CRC (Cyclic Redundancy Check) errors indicate data corruption during transmission, typically caused by bad cables, loose connectors, or EMI from nearby power sources.'
                },
                {
                    question: 'Users in a conference room report intermittent Wi-Fi disconnections. A site survey shows three nearby APs all on channel 6. What should you do?',
                    options: [
                        'Increase the transmit power on all APs',
                        'Change APs to non-overlapping channels (1, 6, 11)',
                        'Disable SSID broadcast on the APs',
                        'Switch all clients to 802.11a'
                    ],
                    explanation: 'Co-channel interference occurs when multiple APs use the same channel. In the 2.4 GHz band, channels 1, 6, and 11 are non-overlapping and should be assigned to adjacent APs.'
                }
            ]
        });
        quiz.start();
    </script>

</html>
