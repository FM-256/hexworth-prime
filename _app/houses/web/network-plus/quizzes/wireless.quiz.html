    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Wireless Quiz',
            description: '802.11 standards, frequencies, security, and architecture.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-wireless-quiz',
            moduleId: 'web-wireless-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'Which 802.11 standard introduced the 5 GHz frequency band and offered speeds up to 54 Mbps?',
                    options: [
                        '802.11b',
                        '802.11a',
                        '802.11g',
                        '802.11n'
                    ],
                    explanation: '802.11a operates on the 5 GHz band with speeds up to 54 Mbps. It was ratified the same year as 802.11b but saw less adoption due to shorter range at 5 GHz.'
                },
                {
                    question: 'Which three channels are the non-overlapping channels in the 2.4 GHz band?',
                    options: [
                        '1, 5, 9',
                        '1, 6, 11',
                        '2, 7, 12',
                        '3, 8, 13'
                    ],
                    explanation: 'Channels 1, 6, and 11 are the three non-overlapping channels in the 2.4 GHz band. Using these channels prevents co-channel interference between nearby access points.'
                },
                {
                    question: 'What is the key security improvement WPA3 offers over WPA2 for personal networks?',
                    options: [
                        'Longer SSID support',
                        'Simultaneous Authentication of Equals (SAE) replacing the 4-way handshake',
                        'Faster connection speeds',
                        'Support for more connected devices'
                    ],
                    explanation: 'WPA3-Personal uses SAE (Simultaneous Authentication of Equals), which replaces the PSK 4-way handshake. SAE provides forward secrecy and protects against offline dictionary attacks.'
                },
                {
                    question: 'What does SSID stand for?',
                    options: [
                        'Secure System Identification Data',
                        'Service Set Identifier',
                        'Signal Strength Indicator Display',
                        'System Security Integration Driver'
                    ],
                    explanation: 'SSID stands for Service Set Identifier. It is the human-readable name of a wireless network that clients see when scanning for available networks.'
                },
                {
                    question: 'Which 802.11 standard operates on both 2.4 GHz and 5 GHz and introduced MIMO technology?',
                    options: [
                        '802.11a',
                        '802.11g',
                        '802.11n (Wi-Fi 4)',
                        '802.11ac (Wi-Fi 5)'
                    ],
                    explanation: '802.11n (Wi-Fi 4) was the first standard to operate on both 2.4 GHz and 5 GHz bands and introduced MIMO (Multiple Input Multiple Output) for improved throughput up to 600 Mbps.'
                },
                {
                    question: 'What authentication method does WPA2-Enterprise use?',
                    options: [
                        'Pre-shared key (PSK)',
                        'Open authentication',
                        '802.1X with a RADIUS server',
                        'MAC address filtering'
                    ],
                    explanation: 'WPA2-Enterprise uses 802.1X authentication with a RADIUS server. Each user authenticates with unique credentials, providing centralized access control and accountability.'
                },
                {
                    question: 'What is a BSSID?',
                    options: [
                        'The password for a wireless network',
                        'The MAC address of the access point radio interface',
                        'The encryption key used by WPA2',
                        'The broadcast range of a wireless signal'
                    ],
                    explanation: 'The BSSID (Basic Service Set Identifier) is the MAC address of the access point\'s radio interface. It uniquely identifies a specific AP within a wireless network.'
                },
                {
                    question: 'What is the difference between infrastructure mode and ad-hoc mode?',
                    options: [
                        'Infrastructure uses an access point; ad-hoc is peer-to-peer without an AP',
                        'Ad-hoc uses an access point; infrastructure is peer-to-peer',
                        'Infrastructure is wireless; ad-hoc is wired',
                        'There is no difference'
                    ],
                    explanation: 'In infrastructure mode, wireless clients connect through a central access point. In ad-hoc mode, devices communicate directly with each other in a peer-to-peer fashion without an AP.'
                },
                {
                    question: 'Which 802.11 standard operates only on the 5 GHz band and supports speeds up to 6.9 Gbps using MU-MIMO?',
                    options: [
                        '802.11n (Wi-Fi 4)',
                        '802.11ac (Wi-Fi 5)',
                        '802.11ax (Wi-Fi 6)',
                        '802.11g'
                    ],
                    explanation: '802.11ac (Wi-Fi 5) operates exclusively on the 5 GHz band and introduced downlink MU-MIMO, with theoretical speeds up to 6.9 Gbps using 8 spatial streams and 160 MHz channels.'
                },
                {
                    question: 'What is the primary advantage of 802.11ax (Wi-Fi 6) over previous standards?',
                    options: [
                        'It uses a completely new frequency band',
                        'It improves efficiency in high-density environments using OFDMA and better MU-MIMO',
                        'It eliminates the need for access points',
                        'It only works with WPA3'
                    ],
                    explanation: '802.11ax (Wi-Fi 6) uses OFDMA (Orthogonal Frequency Division Multiple Access) and improved MU-MIMO (both uplink and downlink) to handle many simultaneous clients more efficiently in dense environments.'
                },
                {
                    question: 'What is the difference between a lightweight AP and an autonomous AP?',
                    options: [
                        'Lightweight APs are managed by a wireless LAN controller; autonomous APs are configured individually',
                        'Autonomous APs require a controller; lightweight APs do not',
                        'Lightweight APs only support 2.4 GHz; autonomous support both bands',
                        'There is no functional difference'
                    ],
                    explanation: 'Lightweight APs rely on a wireless LAN controller (WLC) for configuration, firmware, and management. Autonomous APs are standalone devices configured individually.'
                },
                {
                    question: 'What is the purpose of a wireless site survey?',
                    options: [
                        'To test internet speed at a location',
                        'To determine optimal AP placement, identify interference, and ensure adequate coverage',
                        'To count the number of wireless devices in a building',
                        'To configure encryption on all access points'
                    ],
                    explanation: 'A site survey maps the RF environment to determine optimal AP placement, identify sources of interference, ensure adequate signal coverage, and plan channel assignments.'
                },
                {
                    question: 'What is the key difference between an omnidirectional and a directional antenna?',
                    options: [
                        'Omnidirectional antennas are faster',
                        'Omnidirectional radiates signal in all directions; directional focuses signal in a specific direction',
                        'Directional antennas work on all frequencies; omnidirectional only on 2.4 GHz',
                        'There is no practical difference'
                    ],
                    explanation: 'An omnidirectional antenna radiates signal equally in all horizontal directions, suitable for general coverage. A directional antenna (like a Yagi or parabolic) focuses the signal in a specific direction for longer range point-to-point links.'
                },
                {
                    question: 'What does channel bonding accomplish in wireless networking?',
                    options: [
                        'It encrypts traffic across multiple channels simultaneously',
                        'It combines adjacent channels to create a wider channel for higher throughput',
                        'It prevents channel overlap between access points',
                        'It bonds wired and wireless channels together'
                    ],
                    explanation: 'Channel bonding combines two or more adjacent channels into a single wider channel. For example, bonding two 20 MHz channels into a 40 MHz channel increases available bandwidth and throughput.'
                },
                {
                    question: 'In a wireless mesh network, what role do mesh nodes play?',
                    options: [
                        'They only connect wired clients to the network',
                        'They relay traffic between other nodes, extending coverage without additional wired connections',
                        'They replace the need for any access points',
                        'They only function as wireless bridges between buildings'
                    ],
                    explanation: 'In a mesh network, nodes communicate with each other wirelessly and relay traffic between nodes. This extends coverage area without requiring each node to have a wired backhaul connection.'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
