<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 8: Wireless Quiz | Network+ N10-009</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #111128 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #67e8f9; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(6, 182, 212, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Network+ Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Chapter 8: Wireless Quiz</h1>
            <p class="subtitle">802.11 standards, frequencies, security, and architecture</p>
            <div class="meta">
                <span>Chapter 8</span>
                <span>15 Questions</span>
                <span>Obj 2.3</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Network+ Hub</a>
                <a href="../index.html#ch10" id="nextChapterBtn" class="btn-hub" style="display:none;background:var(--success, #22c55e);color:#fff;border-color:var(--success, #22c55e);">Continue to Chapter 10 →</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "Which 802.11 standard introduced the 5 GHz frequency band and offered speeds up to 54 Mbps?",
                opts: ["802.11b", "802.11a", "802.11g", "802.11n"],
                ans: 1,
                exp: "802.11a operates on the 5 GHz band with speeds up to 54 Mbps. It was ratified the same year as 802.11b but saw less adoption due to shorter range at 5 GHz."
            },
            {
                q: "Which three channels are the non-overlapping channels in the 2.4 GHz band?",
                opts: ["1, 5, 9", "1, 6, 11", "2, 7, 12", "3, 8, 13"],
                ans: 1,
                exp: "Channels 1, 6, and 11 are the three non-overlapping channels in the 2.4 GHz band. Using these channels prevents co-channel interference between nearby access points."
            },
            {
                q: "What is the key security improvement WPA3 offers over WPA2 for personal networks?",
                opts: [
                    "Longer SSID support",
                    "Simultaneous Authentication of Equals (SAE) replacing the 4-way handshake",
                    "Faster connection speeds",
                    "Support for more connected devices"
                ],
                ans: 1,
                exp: "WPA3-Personal uses SAE (Simultaneous Authentication of Equals), which replaces the PSK 4-way handshake. SAE provides forward secrecy and protects against offline dictionary attacks."
            },
            {
                q: "What does SSID stand for?",
                opts: [
                    "Secure System Identification Data",
                    "Service Set Identifier",
                    "Signal Strength Indicator Display",
                    "System Security Integration Driver"
                ],
                ans: 1,
                exp: "SSID stands for Service Set Identifier. It is the human-readable name of a wireless network that clients see when scanning for available networks."
            },
            {
                q: "Which 802.11 standard operates on both 2.4 GHz and 5 GHz and introduced MIMO technology?",
                opts: ["802.11a", "802.11g", "802.11n (Wi-Fi 4)", "802.11ac (Wi-Fi 5)"],
                ans: 2,
                exp: "802.11n (Wi-Fi 4) was the first standard to operate on both 2.4 GHz and 5 GHz bands and introduced MIMO (Multiple Input Multiple Output) for improved throughput up to 600 Mbps."
            },
            {
                q: "What authentication method does WPA2-Enterprise use?",
                opts: ["Pre-shared key (PSK)", "Open authentication", "802.1X with a RADIUS server", "MAC address filtering"],
                ans: 2,
                exp: "WPA2-Enterprise uses 802.1X authentication with a RADIUS server. Each user authenticates with unique credentials, providing centralized access control and accountability."
            },
            {
                q: "What is a BSSID?",
                opts: [
                    "The password for a wireless network",
                    "The MAC address of the access point radio interface",
                    "The encryption key used by WPA2",
                    "The broadcast range of a wireless signal"
                ],
                ans: 1,
                exp: "The BSSID (Basic Service Set Identifier) is the MAC address of the access point's radio interface. It uniquely identifies a specific AP within a wireless network."
            },
            {
                q: "What is the difference between infrastructure mode and ad-hoc mode?",
                opts: [
                    "Infrastructure uses an access point; ad-hoc is peer-to-peer without an AP",
                    "Ad-hoc uses an access point; infrastructure is peer-to-peer",
                    "Infrastructure is wireless; ad-hoc is wired",
                    "There is no difference"
                ],
                ans: 0,
                exp: "In infrastructure mode, wireless clients connect through a central access point. In ad-hoc mode, devices communicate directly with each other in a peer-to-peer fashion without an AP."
            },
            {
                q: "Which 802.11 standard operates only on the 5 GHz band and supports speeds up to 6.9 Gbps using MU-MIMO?",
                opts: ["802.11n (Wi-Fi 4)", "802.11ac (Wi-Fi 5)", "802.11ax (Wi-Fi 6)", "802.11g"],
                ans: 1,
                exp: "802.11ac (Wi-Fi 5) operates exclusively on the 5 GHz band and introduced downlink MU-MIMO, with theoretical speeds up to 6.9 Gbps using 8 spatial streams and 160 MHz channels."
            },
            {
                q: "What is the primary advantage of 802.11ax (Wi-Fi 6) over previous standards?",
                opts: [
                    "It uses a completely new frequency band",
                    "It improves efficiency in high-density environments using OFDMA and better MU-MIMO",
                    "It eliminates the need for access points",
                    "It only works with WPA3"
                ],
                ans: 1,
                exp: "802.11ax (Wi-Fi 6) uses OFDMA (Orthogonal Frequency Division Multiple Access) and improved MU-MIMO (both uplink and downlink) to handle many simultaneous clients more efficiently in dense environments."
            },
            {
                q: "What is the difference between a lightweight AP and an autonomous AP?",
                opts: [
                    "Lightweight APs are managed by a wireless LAN controller; autonomous APs are configured individually",
                    "Autonomous APs require a controller; lightweight APs do not",
                    "Lightweight APs only support 2.4 GHz; autonomous support both bands",
                    "There is no functional difference"
                ],
                ans: 0,
                exp: "Lightweight APs rely on a wireless LAN controller (WLC) for configuration, firmware, and management. Autonomous APs are standalone devices configured individually."
            },
            {
                q: "What is the purpose of a wireless site survey?",
                opts: [
                    "To test internet speed at a location",
                    "To determine optimal AP placement, identify interference, and ensure adequate coverage",
                    "To count the number of wireless devices in a building",
                    "To configure encryption on all access points"
                ],
                ans: 1,
                exp: "A site survey maps the RF environment to determine optimal AP placement, identify sources of interference, ensure adequate signal coverage, and plan channel assignments."
            },
            {
                q: "What is the key difference between an omnidirectional and a directional antenna?",
                opts: [
                    "Omnidirectional antennas are faster",
                    "Omnidirectional radiates signal in all directions; directional focuses signal in a specific direction",
                    "Directional antennas work on all frequencies; omnidirectional only on 2.4 GHz",
                    "There is no practical difference"
                ],
                ans: 1,
                exp: "An omnidirectional antenna radiates signal equally in all horizontal directions, suitable for general coverage. A directional antenna (like a Yagi or parabolic) focuses the signal in a specific direction for longer range point-to-point links."
            },
            {
                q: "What does channel bonding accomplish in wireless networking?",
                opts: [
                    "It encrypts traffic across multiple channels simultaneously",
                    "It combines adjacent channels to create a wider channel for higher throughput",
                    "It prevents channel overlap between access points",
                    "It bonds wired and wireless channels together"
                ],
                ans: 1,
                exp: "Channel bonding combines two or more adjacent channels into a single wider channel. For example, bonding two 20 MHz channels into a 40 MHz channel increases available bandwidth and throughput."
            },
            {
                q: "In a wireless mesh network, what role do mesh nodes play?",
                opts: [
                    "They only connect wired clients to the network",
                    "They relay traffic between other nodes, extending coverage without additional wired connections",
                    "They replace the need for any access points",
                    "They only function as wireless bridges between buildings"
                ],
                ans: 1,
                exp: "In a mesh network, nodes communicate with each other wirelessly and relay traffic between nodes. This extends coverage area without requiring each node to have a wired backhaul connection."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered wireless networking concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the topics you missed and you will be exam-ready.';
            else if (pct >= 50) msg = 'Good effort. Revisit the wireless presentations and try again.';
            else msg = 'Keep studying. Review Chapter 8 materials and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-wireless-quiz', { returnToDashboard: false, returnUrl: '../index.html' });
            }

            var nextBtn = document.getElementById('nextChapterBtn');
            if (nextBtn) nextBtn.style.display = pct >= 70 ? '' : 'none';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
