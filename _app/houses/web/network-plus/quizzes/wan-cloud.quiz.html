<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'WAN & Cloud Quiz',
            description: 'NAT, WAN technologies, cloud concepts, and remote access.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-wan-cloud-quiz',
            moduleId: 'web-wan-cloud-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'Which NAT type maps multiple private IP addresses to a single public IP using port numbers?',
                    options: [
                        'Static NAT (one-to-one mapping)',
                        'Dynamic NAT from a public address pool',
                        'PAT (Port Address Translation)',
                        'NAT64'
                    ],
                    explanation: 'PAT (also called NAT overload) maps many private IPs to one public IP by tracking unique source port numbers. Static NAT is one-to-one. Dynamic NAT uses a pool but still one-to-one per session.'
                },
                {
                    question: 'What is the purpose of NAT64?',
                    options: [
                        'Translates between two different IPv4 subnets that use overlapping ranges',
                        'Translates between IPv6 and IPv4 to allow interoperability',
                        'Encrypts each NAT translation entry so the mapping table cannot be read',
                        'Provides a redundant NAT table on a second router for stateful failover'
                    ],
                    explanation: 'NAT64 allows IPv6-only clients to communicate with IPv4-only servers by translating between the two address families. This is critical during the transition from IPv4 to IPv6.'
                },
                {
                    question: 'What does MPLS use to make forwarding decisions instead of IP addresses?',
                    options: [
                        'MAC addresses',
                        'Labels',
                        'VLAN tags',
                        'Port numbers'
                    ],
                    explanation: 'MPLS (Multiprotocol Label Switching) inserts short labels between Layer 2 and Layer 3 headers. Routers forward based on these labels, which is faster than full IP lookups and enables traffic engineering.'
                },
                {
                    question: 'What is the primary advantage of SD-WAN over traditional WAN?',
                    options: [
                        'It eliminates the need for any internet connection because the overlay carries its own transport',
                        'It uses centralized software control to dynamically route traffic across multiple connection types',
                        'It works only with MPLS circuits, which is why it is sold by carriers rather than vendors',
                        'It replaces all LAN switching with a single virtualised fabric managed from the cloud'
                    ],
                    explanation: 'SD-WAN uses a centralized controller to intelligently route traffic across MPLS, broadband, LTE, and other links based on application requirements, cost, and real-time performance metrics.'
                },
                {
                    question: 'Which broadband technology delivers internet over the existing telephone infrastructure using frequency division?',
                    options: [
                        'Cable (DOCSIS)',
                        'DSL',
                        'Fiber (FTTH)',
                        'Fixed wireless'
                    ],
                    explanation: 'DSL (Digital Subscriber Line) uses existing telephone copper pairs and separates voice and data using different frequencies. Cable uses coaxial TV infrastructure. Fiber delivers over glass strands.'
                },
                {
                    question: 'What is the demarcation point (demarc)?',
                    options: [
                        'The main patch panel in the server room where all building cabling is terminated',
                        'The boundary where the ISP\'s responsibility ends and the customer\'s begins',
                        'The firewall that sits between the LAN and the WAN and enforces the edge policy',
                        'The point where the incoming fibre is converted to copper for the internal network'
                    ],
                    explanation: 'The demarcation point is the physical location where the service provider\'s network ends and the customer\'s network begins. It is typically located at a network interface device (NID) on the building exterior.'
                },
                {
                    question: 'What is the function of a CSU/DSU?',
                    options: [
                        'Converts analogue telephone signals into digital form for transport over the WAN',
                        'Serves as the interface between a router and a digital leased line (T1/T3)',
                        'Supplies Power over Ethernet to the devices connected downstream of the router',
                        'Manages VLAN trunking between switches so tagged frames survive the WAN link'
                    ],
                    explanation: 'A CSU/DSU (Channel Service Unit/Data Service Unit) converts the digital signal from a router into the framing format required by the carrier\'s leased line (T1/T3) and provides line termination.'
                },
                {
                    question: 'What is the key difference between a site-to-site VPN and a client-to-site VPN?',
                    options: [
                        'Site-to-site tunnels use IPsec while client-to-site tunnels are carried inside plain HTTP sessions',
                        'Site-to-site connects two networks permanently; client-to-site connects a single user to a network',
                        'Client-to-site is faster than site-to-site because it terminates on the user device',
                        'Site-to-site links are unencrypted because both ends are already trusted networks'
                    ],
                    explanation: 'A site-to-site VPN creates a persistent encrypted tunnel between two network gateways (e.g., two office locations). A client-to-site (remote access) VPN connects an individual user\'s device to the corporate network.'
                },
                {
                    question: 'In a split tunnel VPN configuration, how is traffic handled?',
                    options: [
                        'All traffic from the client is forced through the VPN tunnel regardless of its destination',
                        'Only traffic destined for the corporate network goes through the tunnel; internet traffic goes directly out',
                        'Traffic is divided equally between two VPN concentrators to balance the load across them',
                        'Inbound traffic arrives through the tunnel while outbound traffic leaves over the local connection'
                    ],
                    explanation: 'Split tunneling sends only corporate-destined traffic through the VPN, while general internet traffic exits directly. Full tunnel sends all traffic through the VPN, providing more security but higher latency.'
                },
                {
                    question: 'Which cloud service model provides virtualized infrastructure (servers, storage, networking) that the customer manages?',
                    options: [
                        'SaaS',
                        'PaaS',
                        'IaaS',
                        'DaaS'
                    ],
                    explanation: 'IaaS (Infrastructure as a Service) provides raw compute, storage, and networking. The customer manages the OS, middleware, and applications. Examples include AWS EC2 and Azure Virtual Machines.'
                },
                {
                    question: 'A company uses a mix of on-premises servers and AWS cloud resources connected by a VPN. What cloud deployment model is this?',
                    options: [
                        'Public cloud',
                        'Private cloud',
                        'Hybrid cloud',
                        'Community cloud'
                    ],
                    explanation: 'A hybrid cloud combines on-premises (or private cloud) infrastructure with public cloud services, connected via VPN or dedicated links. This allows workload flexibility and data sovereignty.'
                },
                {
                    question: 'What is a VPC (Virtual Private Cloud)?',
                    options: [
                        'A physical data centre rented by a single tenant and isolated from other customers',
                        'An isolated virtual network within a public cloud where you define your own IP space and subnets',
                        'A VPN connection joining two cloud providers so workloads can move between them',
                        'A private DNS zone hosted in the cloud and resolvable only from inside the tenancy'
                    ],
                    explanation: 'A VPC is a logically isolated section of a public cloud where you control IP addressing, subnets, route tables, and gateways. It functions like your own private network inside the cloud provider\'s infrastructure.'
                },
                {
                    question: 'What is the purpose of security groups in cloud networking?',
                    options: [
                        'They manage user authentication and authorisation for access to cloud instances',
                        'They act as virtual firewalls controlling inbound and outbound traffic to cloud instances',
                        'They encrypt data at rest on the volumes attached to each cloud instance',
                        'They balance inbound load across instances running in multiple cloud regions'
                    ],
                    explanation: 'Security groups are stateful virtual firewalls that control traffic at the instance level. You define allow rules for inbound and outbound traffic by protocol, port, and source/destination.'
                },
                {
                    question: 'What does NFV (Network Functions Virtualization) accomplish?',
                    options: [
                        'Converts physical network cabling to wireless links so appliances need no patching',
                        'Replaces dedicated network hardware appliances with software running on standard servers',
                        'Encrypts every virtualised network function automatically as it is instantiated',
                        'Provides network address translation for IPv6 so legacy appliances remain usable'
                    ],
                    explanation: 'NFV decouples network functions (firewalls, load balancers, IDS/IPS, routers) from proprietary hardware and runs them as software on commodity servers, reducing cost and increasing agility.'
                },
                {
                    question: 'Which protocol should be used for secure remote command-line management of network devices?',
                    options: [
                        'Telnet',
                        'SSH',
                        'SNMP v1',
                        'HTTP'
                    ],
                    explanation: 'SSH (Secure Shell) encrypts all traffic including credentials. Telnet sends everything in cleartext and should never be used for management. SSH is the standard for in-band CLI management.'
                }
            ]
        });
        quiz.start();
    </script>
