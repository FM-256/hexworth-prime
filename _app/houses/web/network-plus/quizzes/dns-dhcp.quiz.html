<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'DNS & DHCP Quiz',
            description: 'Name resolution, DHCP operations, DNS records, NTP.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-dns-dhcp-quiz',
            moduleId: 'web-dns-dhcp-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'Which DNS record type maps a hostname to an IPv4 address?',
                    options: [
                        'AAAA',
                        'CNAME',
                        'A',
                        'PTR'
                    ],
                    explanation: 'An A record maps a hostname to an IPv4 address. For example, www.example.com might resolve to 192.168.1.10 via an A record.'
                },
                {
                    question: 'What are the four steps of the DHCP lease process in order?',
                    options: [
                        'Discover, Offer, Request, Acknowledge',
                        'Request, Offer, Discover, Acknowledge',
                        'Offer, Discover, Acknowledge, Request',
                        'Acknowledge, Request, Offer, Discover'
                    ],
                    explanation: 'The DHCP DORA process is Discover (client broadcasts), Offer (server responds), Request (client accepts), Acknowledge (server confirms the lease).'
                },
                {
                    question: 'Which DNS record type maps a hostname to an IPv6 address?',
                    options: [
                        'A',
                        'AAAA',
                        'MX',
                        'NS'
                    ],
                    explanation: 'AAAA (quad-A) records map hostnames to IPv6 addresses, similar to how A records map to IPv4.'
                },
                {
                    question: 'What is the purpose of a DHCP relay agent (IP helper)?',
                    options: [
                        'To encrypt DHCP traffic between client and server',
                        'To forward DHCP broadcast requests across subnets to a remote DHCP server',
                        'To assign static IP addresses to servers',
                        'To translate between DHCPv4 and DHCPv6'
                    ],
                    explanation: 'A DHCP relay agent (ip helper-address) forwards DHCP broadcast messages from clients on one subnet to a DHCP server on a different subnet, since broadcasts do not cross routers.'
                },
                {
                    question: 'Which DNS record type is used to specify the mail server for a domain?',
                    options: [
                        'A',
                        'CNAME',
                        'MX',
                        'SRV'
                    ],
                    explanation: 'MX (Mail Exchanger) records identify the mail servers responsible for receiving email for a domain. They include a priority value for failover.'
                },
                {
                    question: 'What does a PTR record do?',
                    options: [
                        'Maps a hostname to an IP address',
                        'Maps an IP address to a hostname (reverse DNS)',
                        'Creates an alias for another hostname',
                        'Specifies a text string for domain verification'
                    ],
                    explanation: 'PTR (Pointer) records are used for reverse DNS lookups, mapping an IP address back to a hostname. They are stored in reverse lookup zones.'
                },
                {
                    question: 'What is a DHCP scope?',
                    options: [
                        'The encryption level used by DHCP',
                        'A defined range of IP addresses that a DHCP server can assign to clients',
                        'The maximum number of DHCP servers on a network',
                        'The time zone setting distributed by DHCP'
                    ],
                    explanation: 'A DHCP scope defines the pool of IP addresses available for assignment, along with configuration options like default gateway, DNS servers, and lease duration.'
                },
                {
                    question: 'What is the difference between a DHCP reservation and an exclusion?',
                    options: [
                        'Reservations assign a specific IP to a MAC address; exclusions remove IPs from the assignable pool',
                        'Reservations block devices; exclusions allow them',
                        'There is no difference',
                        'Exclusions assign IPs; reservations remove them'
                    ],
                    explanation: 'A DHCP reservation guarantees a specific IP address is always assigned to a particular MAC address. An exclusion removes addresses from the scope so they are never assigned by DHCP.'
                },
                {
                    question: 'Which DNS record type creates an alias that points one hostname to another?',
                    options: [
                        'A',
                        'NS',
                        'CNAME',
                        'TXT'
                    ],
                    explanation: 'A CNAME (Canonical Name) record creates an alias. For example, www.example.com can be a CNAME pointing to webserver.example.com.'
                },
                {
                    question: 'What is the purpose of an NS record?',
                    options: [
                        'To map a hostname to an IP address',
                        'To identify the authoritative DNS servers for a domain',
                        'To specify mail server priority',
                        'To provide text-based domain verification'
                    ],
                    explanation: 'NS (Name Server) records identify which DNS servers are authoritative for a particular domain and can answer queries for that zone.'
                },
                {
                    question: 'What is the difference between an authoritative and a recursive DNS query?',
                    options: [
                        'Authoritative queries are faster; recursive queries are slower',
                        'An authoritative server holds the actual records for a zone; a recursive server queries other servers on behalf of the client',
                        'They are the same thing',
                        'Recursive servers hold zone files; authoritative servers forward queries'
                    ],
                    explanation: 'An authoritative DNS server holds the actual zone records and provides definitive answers. A recursive DNS server queries other servers on behalf of the client until it finds the answer.'
                },
                {
                    question: 'What is the primary purpose of NTP?',
                    options: [
                        'To resolve hostnames to IP addresses',
                        'To synchronize clocks across network devices',
                        'To assign IP addresses automatically',
                        'To encrypt DNS traffic'
                    ],
                    explanation: 'NTP (Network Time Protocol) synchronizes clocks across network devices. Accurate time is critical for authentication, logging, certificates, and troubleshooting.'
                },
                {
                    question: 'What is the purpose of DNSSEC?',
                    options: [
                        'To encrypt all DNS queries end-to-end',
                        'To authenticate DNS responses and protect against spoofing and cache poisoning',
                        'To speed up DNS resolution times',
                        'To replace traditional DNS with a peer-to-peer model'
                    ],
                    explanation: 'DNSSEC (DNS Security Extensions) adds digital signatures to DNS records, allowing resolvers to verify that responses are authentic and have not been tampered with.'
                },
                {
                    question: 'What is the difference between a forward lookup zone and a reverse lookup zone?',
                    options: [
                        'Forward zones resolve hostnames to IPs; reverse zones resolve IPs to hostnames',
                        'Forward zones are public; reverse zones are private',
                        'Forward zones use UDP; reverse zones use TCP',
                        'There is no difference'
                    ],
                    explanation: 'A forward lookup zone resolves hostnames to IP addresses (using A/AAAA records). A reverse lookup zone resolves IP addresses to hostnames (using PTR records).'
                },
                {
                    question: 'Why would an organization use separate internal and external DNS servers?',
                    options: [
                        'To increase DNS query speed for all users',
                        'To keep internal hostnames and network structure hidden from the public internet',
                        'Because DNS cannot handle both internal and external records on the same server',
                        'To comply with DHCP requirements'
                    ],
                    explanation: 'Split DNS (internal vs external) keeps internal resource names and IP addresses hidden from the public. External DNS only exposes public-facing services.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
