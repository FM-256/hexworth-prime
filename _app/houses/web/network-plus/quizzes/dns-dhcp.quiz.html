<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 6: DNS &amp; DHCP Quiz | Network+ N10-009</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #111128 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #67e8f9; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(6, 182, 212, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Network+ Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Chapter 6: DNS &amp; DHCP Quiz</h1>
            <p class="subtitle">Name resolution, DHCP operations, DNS records, NTP</p>
            <div class="meta">
                <span>Chapter 6</span>
                <span>15 Questions</span>
                <span>Obj 3.4</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Network+ Hub</a>
                <a href="../index.html#ch8" id="nextChapterBtn" class="btn-hub" style="display:none;background:var(--success, #22c55e);color:#fff;border-color:var(--success, #22c55e);">Continue to Chapter 8 →</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "Which DNS record type maps a hostname to an IPv4 address?",
                opts: ["AAAA", "CNAME", "A", "PTR"],
                ans: 2,
                exp: "An A record maps a hostname to an IPv4 address. For example, www.example.com might resolve to 192.168.1.10 via an A record."
            },
            {
                q: "What are the four steps of the DHCP lease process in order?",
                opts: [
                    "Discover, Offer, Request, Acknowledge",
                    "Request, Offer, Discover, Acknowledge",
                    "Offer, Discover, Acknowledge, Request",
                    "Acknowledge, Request, Offer, Discover"
                ],
                ans: 0,
                exp: "The DHCP DORA process is Discover (client broadcasts), Offer (server responds), Request (client accepts), Acknowledge (server confirms the lease)."
            },
            {
                q: "Which DNS record type maps a hostname to an IPv6 address?",
                opts: ["A", "AAAA", "MX", "NS"],
                ans: 1,
                exp: "AAAA (quad-A) records map hostnames to IPv6 addresses, similar to how A records map to IPv4."
            },
            {
                q: "What is the purpose of a DHCP relay agent (IP helper)?",
                opts: [
                    "To encrypt DHCP traffic between client and server",
                    "To forward DHCP broadcast requests across subnets to a remote DHCP server",
                    "To assign static IP addresses to servers",
                    "To translate between DHCPv4 and DHCPv6"
                ],
                ans: 1,
                exp: "A DHCP relay agent (ip helper-address) forwards DHCP broadcast messages from clients on one subnet to a DHCP server on a different subnet, since broadcasts do not cross routers."
            },
            {
                q: "Which DNS record type is used to specify the mail server for a domain?",
                opts: ["A", "CNAME", "MX", "SRV"],
                ans: 2,
                exp: "MX (Mail Exchanger) records identify the mail servers responsible for receiving email for a domain. They include a priority value for failover."
            },
            {
                q: "What does a PTR record do?",
                opts: [
                    "Maps a hostname to an IP address",
                    "Maps an IP address to a hostname (reverse DNS)",
                    "Creates an alias for another hostname",
                    "Specifies a text string for domain verification"
                ],
                ans: 1,
                exp: "PTR (Pointer) records are used for reverse DNS lookups, mapping an IP address back to a hostname. They are stored in reverse lookup zones."
            },
            {
                q: "What is a DHCP scope?",
                opts: [
                    "The encryption level used by DHCP",
                    "A defined range of IP addresses that a DHCP server can assign to clients",
                    "The maximum number of DHCP servers on a network",
                    "The time zone setting distributed by DHCP"
                ],
                ans: 1,
                exp: "A DHCP scope defines the pool of IP addresses available for assignment, along with configuration options like default gateway, DNS servers, and lease duration."
            },
            {
                q: "What is the difference between a DHCP reservation and an exclusion?",
                opts: [
                    "Reservations assign a specific IP to a MAC address; exclusions remove IPs from the assignable pool",
                    "Reservations block devices; exclusions allow them",
                    "There is no difference",
                    "Exclusions assign IPs; reservations remove them"
                ],
                ans: 0,
                exp: "A DHCP reservation guarantees a specific IP address is always assigned to a particular MAC address. An exclusion removes addresses from the scope so they are never assigned by DHCP."
            },
            {
                q: "Which DNS record type creates an alias that points one hostname to another?",
                opts: ["A", "NS", "CNAME", "TXT"],
                ans: 2,
                exp: "A CNAME (Canonical Name) record creates an alias. For example, www.example.com can be a CNAME pointing to webserver.example.com."
            },
            {
                q: "What is the purpose of an NS record?",
                opts: [
                    "To map a hostname to an IP address",
                    "To identify the authoritative DNS servers for a domain",
                    "To specify mail server priority",
                    "To provide text-based domain verification"
                ],
                ans: 1,
                exp: "NS (Name Server) records identify which DNS servers are authoritative for a particular domain and can answer queries for that zone."
            },
            {
                q: "What is the difference between an authoritative and a recursive DNS query?",
                opts: [
                    "Authoritative queries are faster; recursive queries are slower",
                    "An authoritative server holds the actual records for a zone; a recursive server queries other servers on behalf of the client",
                    "They are the same thing",
                    "Recursive servers hold zone files; authoritative servers forward queries"
                ],
                ans: 1,
                exp: "An authoritative DNS server holds the actual zone records and provides definitive answers. A recursive DNS server queries other servers on behalf of the client until it finds the answer."
            },
            {
                q: "What is the primary purpose of NTP?",
                opts: [
                    "To resolve hostnames to IP addresses",
                    "To synchronize clocks across network devices",
                    "To assign IP addresses automatically",
                    "To encrypt DNS traffic"
                ],
                ans: 1,
                exp: "NTP (Network Time Protocol) synchronizes clocks across network devices. Accurate time is critical for authentication, logging, certificates, and troubleshooting."
            },
            {
                q: "What is the purpose of DNSSEC?",
                opts: [
                    "To encrypt all DNS queries end-to-end",
                    "To authenticate DNS responses and protect against spoofing and cache poisoning",
                    "To speed up DNS resolution times",
                    "To replace traditional DNS with a peer-to-peer model"
                ],
                ans: 1,
                exp: "DNSSEC (DNS Security Extensions) adds digital signatures to DNS records, allowing resolvers to verify that responses are authentic and have not been tampered with."
            },
            {
                q: "What is the difference between a forward lookup zone and a reverse lookup zone?",
                opts: [
                    "Forward zones resolve hostnames to IPs; reverse zones resolve IPs to hostnames",
                    "Forward zones are public; reverse zones are private",
                    "Forward zones use UDP; reverse zones use TCP",
                    "There is no difference"
                ],
                ans: 0,
                exp: "A forward lookup zone resolves hostnames to IP addresses (using A/AAAA records). A reverse lookup zone resolves IP addresses to hostnames (using PTR records)."
            },
            {
                q: "Why would an organization use separate internal and external DNS servers?",
                opts: [
                    "To increase DNS query speed for all users",
                    "To keep internal hostnames and network structure hidden from the public internet",
                    "Because DNS cannot handle both internal and external records on the same server",
                    "To comply with DHCP requirements"
                ],
                ans: 1,
                exp: "Split DNS (internal vs external) keeps internal resource names and IP addresses hidden from the public. External DNS only exposes public-facing services."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered DNS and DHCP concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the topics you missed and you will be exam-ready.';
            else if (pct >= 50) msg = 'Good effort. Revisit the DNS and DHCP presentations and try again.';
            else msg = 'Keep studying. Review Chapter 6 materials and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-dns-dhcp-quiz', { returnToDashboard: false, returnUrl: '../index.html' });
            }

            var nextBtn = document.getElementById('nextChapterBtn');
            if (nextBtn) nextBtn.style.display = pct >= 70 ? '' : 'none';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
