<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 10: Operations Quiz | Network+ N10-009</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #111128 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #67e8f9; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(6, 182, 212, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Network+ Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Chapter 10: Operations Quiz</h1>
            <p class="subtitle">Monitoring, documentation, change management, and performance</p>
            <div class="meta">
                <span>Chapter 10</span>
                <span>15 Questions</span>
                <span>Obj 3.1, 3.2, 3.3, 5.4</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Network+ Hub</a>
                <a href="../index.html#ch11" id="nextChapterBtn" class="btn-hub" style="display:none;background:var(--success, #22c55e);color:#fff;border-color:var(--success, #22c55e);">Continue to Chapter 11 →</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "What is the key security improvement in SNMPv3 over SNMPv2c?",
                opts: ["SNMPv3 adds VLAN support", "SNMPv3 adds authentication and encryption of SNMP messages", "SNMPv3 uses TCP instead of UDP", "SNMPv3 removes the need for community strings by using anonymous access"],
                ans: 1,
                exp: "SNMPv3 adds message integrity, authentication (username/password), and encryption (privacy). SNMPv2c uses plaintext community strings with no encryption, making it insecure on untrusted networks."
            },
            {
                q: "What is the difference between an SNMP trap and an SNMP inform?",
                opts: ["Traps are sent by the manager; informs are sent by the agent", "Traps are unacknowledged; informs require an acknowledgment from the receiver", "Traps use TCP; informs use UDP", "There is no difference; they are the same mechanism"],
                ans: 1,
                exp: "SNMP traps are fire-and-forget notifications from agents to the manager with no confirmation of receipt. Informs also send notifications but require an acknowledgment, ensuring reliable delivery."
            },
            {
                q: "In the syslog severity scale, what does severity level 0 represent?",
                opts: ["Debug", "Informational", "Warning", "Emergency"],
                ans: 3,
                exp: "Syslog severity 0 is Emergency (system is unusable). The scale goes: 0-Emergency, 1-Alert, 2-Critical, 3-Error, 4-Warning, 5-Notice, 6-Informational, 7-Debug. Lower numbers are more severe."
            },
            {
                q: "What is the primary purpose of a SIEM system?",
                opts: ["To replace firewalls and IDS devices", "To collect, correlate, and analyze log data from multiple sources for security monitoring", "To provide bandwidth monitoring and traffic shaping", "To manage IP address assignments via DHCP"],
                ans: 1,
                exp: "A SIEM (Security Information and Event Management) aggregates logs from firewalls, servers, IDS/IPS, and other sources, correlates events in real time, and alerts on potential security incidents."
            },
            {
                q: "What does NetFlow provide that a simple packet capture does not?",
                opts: ["Full packet payload inspection", "Summarized traffic flow metadata (source, destination, protocol, byte counts) for traffic analysis", "Real-time malware scanning", "Encrypted traffic decryption"],
                ans: 1,
                exp: "NetFlow (and similar protocols like sFlow and IPFIX) exports flow metadata -- source/destination IPs, ports, protocol, byte/packet counts -- without capturing full payloads. This enables efficient traffic analysis and capacity planning."
            },
            {
                q: "Which step in the change management process comes immediately before implementation?",
                opts: ["Documentation", "Approval by the change advisory board", "Post-implementation review", "Notification to end users"],
                ans: 1,
                exp: "The standard change management process is: request, review/risk assessment, approval (by CAB or authority), implementation, then verification/documentation. Approval must precede any changes to production."
            },
            {
                q: "What is the difference between a physical network diagram and a logical network diagram?",
                opts: ["Physical diagrams show IP addresses; logical diagrams show cable routes", "Physical diagrams show actual device locations, cabling, and ports; logical diagrams show IP addressing, subnets, and data flow", "There is no difference; they show the same information", "Physical diagrams are for WANs; logical diagrams are for LANs"],
                ans: 1,
                exp: "Physical diagrams document real-world placement: rack positions, cable paths, port assignments, and room layouts. Logical diagrams abstract the network into IP subnets, VLAN assignments, routing paths, and traffic flow."
            },
            {
                q: "Why is establishing a network baseline important?",
                opts: ["It sets the maximum speed of the network", "It documents normal performance metrics so deviations and anomalies can be detected", "It configures firewall rules automatically", "It replaces the need for monitoring tools"],
                ans: 1,
                exp: "A baseline captures normal network behavior (bandwidth usage, latency, error rates) over time. When current metrics deviate significantly from the baseline, it indicates a potential problem or security event."
            },
            {
                q: "What does RPO (Recovery Point Objective) define?",
                opts: ["The maximum time to restore services after a failure", "The maximum acceptable amount of data loss measured in time", "The average time between hardware failures", "The time it takes to repair a failed component"],
                ans: 1,
                exp: "RPO defines how much data loss is acceptable, measured as the time gap between the last backup and the failure. An RPO of 4 hours means you can tolerate losing up to 4 hours of data."
            },
            {
                q: "What is the difference between RTO and MTTR?",
                opts: ["They are the same metric", "RTO is the target time to restore service; MTTR is the average actual time to repair a component", "RTO measures data loss; MTTR measures uptime", "RTO applies to software; MTTR applies to hardware only"],
                ans: 1,
                exp: "RTO (Recovery Time Objective) is the maximum acceptable downtime target set by the business. MTTR (Mean Time To Repair) is the measured average time it actually takes to fix a failed component and restore service."
            },
            {
                q: "Which disaster recovery site type has equipment installed and data replicated but requires some configuration before going live?",
                opts: ["Hot site", "Warm site", "Cold site", "Mobile site"],
                ans: 1,
                exp: "A warm site has hardware and connectivity in place with near-current data but needs final configuration/activation (hours to a day). A hot site is fully live and can take over immediately. A cold site is an empty facility."
            },
            {
                q: "In an active-active high availability configuration, how do the nodes operate?",
                opts: ["One node handles traffic while the other is on standby", "All nodes actively process traffic simultaneously, sharing the load", "Nodes alternate between active and standby every hour", "One node handles reads and the other handles writes"],
                ans: 1,
                exp: "Active-active means all nodes are processing traffic at the same time, distributing the workload. Active-passive keeps a standby node idle until the primary fails, at which point it takes over."
            },
            {
                q: "After a full backup on Sunday, differential backups are run Monday through Friday. If a failure occurs Friday morning, which backups are needed to restore?",
                opts: ["Sunday full + Monday through Thursday differential", "Sunday full + Thursday differential only", "All five differential backups", "Friday differential only"],
                ans: 1,
                exp: "A differential backup captures all changes since the last full backup. So Thursday's differential contains all changes from Monday through Thursday. Only two restores are needed: Sunday full + Thursday differential."
            },
            {
                q: "What is the primary purpose of NIC teaming (link aggregation)?",
                opts: ["To assign multiple IP addresses to one interface", "To combine multiple physical NICs for increased bandwidth and/or failover redundancy", "To create VLANs on a single NIC", "To enable wireless and wired connections simultaneously"],
                ans: 1,
                exp: "NIC teaming (bonding/link aggregation) groups multiple physical NICs into one logical interface, providing higher aggregate bandwidth and fault tolerance if one link fails."
            },
            {
                q: "A VoIP call is experiencing choppy audio and gaps. Which network performance metric is most likely the cause?",
                opts: ["High bandwidth utilization", "High jitter", "Low latency", "Large MTU size"],
                ans: 1,
                exp: "Jitter is the variation in packet arrival times. VoIP and video are highly sensitive to jitter because packets arriving at irregular intervals cause choppy audio and video artifacts. QoS with DSCP markings can prioritize voice traffic to reduce jitter."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered network operations concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the topics you missed and you will be exam-ready.';
            else if (pct >= 50) msg = 'Good effort. Revisit the Chapter 10 presentations and try again.';
            else msg = 'Keep studying. Review Chapter 10 materials and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-operations-quiz', { returnToDashboard: false, returnUrl: '../index.html' });
            }

            var nextBtn = document.getElementById('nextChapterBtn');
            if (nextBtn) nextBtn.style.display = pct >= 70 ? '' : 'none';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
