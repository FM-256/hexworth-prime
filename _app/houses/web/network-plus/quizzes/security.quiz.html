<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync (tryClassProgressSync calls CF) -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 10: Security Quiz | Network+ N10-009</title>
    <style>
        :root {
            --bg: #090910;
            --bg-card: #12121e;
            --bg-option: #161625;
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.15);
            --text: #e2e8f0;
            --text-muted: #8892a8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f1a 50%, #111128 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #67e8f9; transform: translateX(-5px); }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--cyan-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Progress */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Question card */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.05); }

        .option.selected { border-color: var(--cyan); background: rgba(6, 182, 212, 0.08); }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--cyan);
            flex-shrink: 0;
        }

        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Feedback */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--cyan); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        /* Results */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--cyan);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a, .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
        }
        .btn-retry:hover { background: var(--cyan); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Network+ Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Chapter 10: Security Quiz</h1>
            <p class="subtitle">Network security concepts, attacks, and defense techniques</p>
            <div class="meta">
                <span>Chapter 10</span>
                <span>15 Questions</span>
                <span>Obj 4.1-4.3</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Network+ Hub</a>
                <a href="../index.html#ch12" id="nextChapterBtn" class="btn-hub" style="display:none;background:var(--success, #22c55e);color:#fff;border-color:var(--success, #22c55e);">Continue to Chapter 12 →</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "Which three principles make up the CIA triad?",
                opts: ["Confidentiality, Integrity, Availability", "Confidentiality, Identity, Authentication", "Control, Integrity, Authorization", "Certification, Integrity, Availability"],
                ans: 0,
                exp: "The CIA triad is the foundation of information security: Confidentiality (only authorized access), Integrity (data is unaltered), and Availability (systems are accessible when needed)."
            },
            {
                q: "Which type of encryption uses the SAME key to both encrypt and decrypt data?",
                opts: ["Asymmetric encryption", "Symmetric encryption", "Hashing", "Digital signatures"],
                ans: 1,
                exp: "Symmetric encryption (e.g., AES) uses a single shared key for both encryption and decryption. It is fast but requires secure key distribution."
            },
            {
                q: "RSA is an example of which type of cryptography?",
                opts: ["Symmetric encryption", "Hashing algorithm", "Asymmetric encryption", "Stream cipher"],
                ans: 2,
                exp: "RSA is asymmetric — it uses a public/private key pair. The public key encrypts, the private key decrypts. It is commonly used for key exchange and digital signatures."
            },
            {
                q: "In PKI, what does a Certificate Authority (CA) do?",
                opts: ["Encrypts all network traffic", "Issues and validates digital certificates that bind public keys to identities", "Manages firewall rules", "Stores private keys for all users"],
                ans: 1,
                exp: "A Certificate Authority (CA) is a trusted entity that issues digital certificates, verifying that a public key belongs to the claimed identity."
            },
            {
                q: "A user logs in with a password and then must enter a code from an authenticator app. What type of authentication is this?",
                opts: ["Single-factor authentication", "Multi-factor authentication (MFA)", "Role-based access control", "Certificate-based authentication"],
                ans: 1,
                exp: "MFA requires two or more different factor types: something you know (password), something you have (authenticator app/token), or something you are (biometrics)."
            },
            {
                q: "Which AAA protocol encrypts the ENTIRE packet payload and is preferred for device administration?",
                opts: ["RADIUS", "TACACS+", "Kerberos", "LDAP"],
                ans: 1,
                exp: "TACACS+ encrypts the entire packet body (not just the password like RADIUS) and separates authentication, authorization, and accounting. It uses TCP port 49."
            },
            {
                q: "What standard provides port-based network access control, often used with RADIUS?",
                opts: ["802.11ac", "802.1X", "802.3af", "802.1Q"],
                ans: 1,
                exp: "802.1X (also called PNAC) requires devices to authenticate before gaining network access. It uses a supplicant, authenticator (switch/AP), and authentication server (RADIUS)."
            },
            {
                q: "What happens to traffic that does not match any explicit rule in an ACL?",
                opts: ["It is forwarded normally", "It triggers an alert", "It is denied by the implicit deny rule", "It is logged but permitted"],
                ans: 2,
                exp: "ACLs end with an implicit deny all — any traffic not explicitly permitted by a rule is dropped. This is a fundamental security principle."
            },
            {
                q: "What is the key difference between a stateful and a stateless firewall?",
                opts: ["Stateful firewalls are hardware; stateless are software", "Stateful firewalls track connection state; stateless evaluate each packet independently", "Stateless firewalls are more secure", "There is no practical difference"],
                ans: 1,
                exp: "A stateful firewall maintains a connection state table and understands traffic context (e.g., return traffic for an established session). Stateless firewalls filter each packet individually based on rules."
            },
            {
                q: "What is the primary difference between an IDS and an IPS?",
                opts: ["IDS uses signatures; IPS uses anomaly detection", "IDS is passive and alerts; IPS is inline and can block traffic", "IPS is cheaper to deploy", "IDS works at Layer 7; IPS works at Layer 3"],
                ans: 1,
                exp: "An IDS (Intrusion Detection System) monitors passively and generates alerts. An IPS (Intrusion Prevention System) sits inline and can actively block or drop malicious traffic."
            },
            {
                q: "What is the purpose of a DMZ in network architecture?",
                opts: ["To connect two private networks", "To host public-facing services in an isolated segment between the internal network and the internet", "To encrypt all outbound traffic", "To provide wireless access to guests"],
                ans: 1,
                exp: "A DMZ (Demilitarized Zone) is a network segment that hosts public-facing services (web servers, email) while isolating them from the internal trusted network."
            },
            {
                q: "An attacker sends fake ARP replies to associate their MAC address with the default gateway IP. What is this attack called?",
                opts: ["DNS poisoning", "VLAN hopping", "ARP poisoning / ARP spoofing", "Brute force attack"],
                ans: 2,
                exp: "ARP poisoning (ARP spoofing) tricks hosts into sending traffic to the attacker by corrupting the ARP cache with false MAC-to-IP mappings, enabling man-in-the-middle attacks."
            },
            {
                q: "An attacker floods a server with traffic from thousands of compromised machines. What type of attack is this?",
                opts: ["Phishing", "Man-in-the-middle", "Distributed Denial of Service (DDoS)", "SQL injection"],
                ans: 2,
                exp: "A DDoS attack uses many compromised systems (a botnet) to overwhelm a target with traffic, making it unavailable to legitimate users. A DoS uses a single source."
            },
            {
                q: "An unauthorized person follows an employee through a secured door without badging in. What is this called?",
                opts: ["Phishing", "Tailgating / piggybacking", "Shoulder surfing", "Vishing"],
                ans: 1,
                exp: "Tailgating (piggybacking) is a physical social engineering attack where an unauthorized person gains access by following an authorized person through a secured entry point."
            },
            {
                q: "Which security concept assumes no user or device should be trusted by default, even if inside the network perimeter?",
                opts: ["Defense in depth", "Implicit trust model", "Zero trust model", "Least privilege"],
                ans: 2,
                exp: "Zero trust assumes no implicit trust based on network location. Every access request must be verified, authenticated, and authorized regardless of where it originates — never trust, always verify."
            }
        ];

        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 60) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            var msg = '';
            if (pct >= 90) msg = 'Outstanding! You have mastered network security concepts.';
            else if (pct >= 70) msg = 'Solid understanding. Review the topics you missed and you will be exam-ready.';
            else if (pct >= 50) msg = 'Good effort. Revisit the security presentations and try again.';
            else msg = 'Keep studying. Review Chapter 10 materials and retake the quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'web-security-quiz', { returnToDashboard: false, returnUrl: '../index.html' });
            }

            var nextBtn = document.getElementById('nextChapterBtn');
            if (nextBtn) nextBtn.style.display = pct >= 70 ? '' : 'none';
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
