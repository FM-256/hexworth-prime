    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Security Quiz',
            description: 'Network security concepts, attacks, and defense techniques.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-security-quiz',
            moduleId: 'web-security-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'Which three principles make up the CIA triad?',
                    options: [
                        'Confidentiality, Integrity, Availability',
                        'Confidentiality, Identity, Authentication',
                        'Control, Integrity, Authorization',
                        'Certification, Integrity, Availability'
                    ],
                    explanation: 'The CIA triad is the foundation of information security: Confidentiality (only authorized access), Integrity (data is unaltered), and Availability (systems are accessible when needed).'
                },
                {
                    question: 'Which type of encryption uses the SAME key to both encrypt and decrypt data?',
                    options: [
                        'Asymmetric encryption',
                        'Symmetric encryption',
                        'Hashing',
                        'Digital signatures'
                    ],
                    explanation: 'Symmetric encryption (e.g., AES) uses a single shared key for both encryption and decryption. It is fast but requires secure key distribution.'
                },
                {
                    question: 'RSA is an example of which type of cryptography?',
                    options: [
                        'Symmetric encryption',
                        'Hashing algorithm',
                        'Asymmetric encryption',
                        'Stream cipher'
                    ],
                    explanation: 'RSA is asymmetric -- it uses a public/private key pair. The public key encrypts, the private key decrypts. It is commonly used for key exchange and digital signatures.'
                },
                {
                    question: 'In PKI, what does a Certificate Authority (CA) do?',
                    options: [
                        'Encrypts all network traffic',
                        'Issues and validates digital certificates that bind public keys to identities',
                        'Manages firewall rules',
                        'Stores private keys for all users'
                    ],
                    explanation: 'A Certificate Authority (CA) is a trusted entity that issues digital certificates, verifying that a public key belongs to the claimed identity.'
                },
                {
                    question: 'A user logs in with a password and then must enter a code from an authenticator app. What type of authentication is this?',
                    options: [
                        'Single-factor authentication',
                        'Multi-factor authentication (MFA)',
                        'Role-based access control',
                        'Certificate-based authentication'
                    ],
                    explanation: 'MFA requires two or more different factor types: something you know (password), something you have (authenticator app/token), or something you are (biometrics).'
                },
                {
                    question: 'Which AAA protocol encrypts the ENTIRE packet payload and is preferred for device administration?',
                    options: [
                        'RADIUS',
                        'TACACS+',
                        'Kerberos',
                        'LDAP'
                    ],
                    explanation: 'TACACS+ encrypts the entire packet body (not just the password like RADIUS) and separates authentication, authorization, and accounting. It uses TCP port 49.'
                },
                {
                    question: 'What standard provides port-based network access control, often used with RADIUS?',
                    options: [
                        '802.11ac',
                        '802.1X',
                        '802.3af',
                        '802.1Q'
                    ],
                    explanation: '802.1X (also called PNAC) requires devices to authenticate before gaining network access. It uses a supplicant, authenticator (switch/AP), and authentication server (RADIUS).'
                },
                {
                    question: 'What happens to traffic that does not match any explicit rule in an ACL?',
                    options: [
                        'It is forwarded normally',
                        'It triggers an alert',
                        'It is denied by the implicit deny rule',
                        'It is logged but permitted'
                    ],
                    explanation: 'ACLs end with an implicit deny all -- any traffic not explicitly permitted by a rule is dropped. This is a fundamental security principle.'
                },
                {
                    question: 'What is the key difference between a stateful and a stateless firewall?',
                    options: [
                        'Stateful firewalls are hardware; stateless are software',
                        'Stateful firewalls track connection state; stateless evaluate each packet independently',
                        'Stateless firewalls are more secure',
                        'There is no practical difference'
                    ],
                    explanation: 'A stateful firewall maintains a connection state table and understands traffic context (e.g., return traffic for an established session). Stateless firewalls filter each packet individually based on rules.'
                },
                {
                    question: 'What is the primary difference between an IDS and an IPS?',
                    options: [
                        'IDS uses signatures; IPS uses anomaly detection',
                        'IDS is passive and alerts; IPS is inline and can block traffic',
                        'IPS is cheaper to deploy',
                        'IDS works at Layer 7; IPS works at Layer 3'
                    ],
                    explanation: 'An IDS (Intrusion Detection System) monitors passively and generates alerts. An IPS (Intrusion Prevention System) sits inline and can actively block or drop malicious traffic.'
                },
                {
                    question: 'What is the purpose of a DMZ in network architecture?',
                    options: [
                        'To connect two private networks',
                        'To host public-facing services in an isolated segment between the internal network and the internet',
                        'To encrypt all outbound traffic',
                        'To provide wireless access to guests'
                    ],
                    explanation: 'A DMZ (Demilitarized Zone) is a network segment that hosts public-facing services (web servers, email) while isolating them from the internal trusted network.'
                },
                {
                    question: 'An attacker sends fake ARP replies to associate their MAC address with the default gateway IP. What is this attack called?',
                    options: [
                        'DNS poisoning',
                        'VLAN hopping',
                        'ARP poisoning / ARP spoofing',
                        'Brute force attack'
                    ],
                    explanation: 'ARP poisoning (ARP spoofing) tricks hosts into sending traffic to the attacker by corrupting the ARP cache with false MAC-to-IP mappings, enabling man-in-the-middle attacks.'
                },
                {
                    question: 'An attacker floods a server with traffic from thousands of compromised machines. What type of attack is this?',
                    options: [
                        'Phishing',
                        'Man-in-the-middle',
                        'Distributed Denial of Service (DDoS)',
                        'SQL injection'
                    ],
                    explanation: 'A DDoS attack uses many compromised systems (a botnet) to overwhelm a target with traffic, making it unavailable to legitimate users. A DoS uses a single source.'
                },
                {
                    question: 'An unauthorized person follows an employee through a secured door without badging in. What is this called?',
                    options: [
                        'Phishing',
                        'Tailgating / piggybacking',
                        'Shoulder surfing',
                        'Vishing'
                    ],
                    explanation: 'Tailgating (piggybacking) is a physical social engineering attack where an unauthorized person gains access by following an authorized person through a secured entry point.'
                },
                {
                    question: 'Which security concept assumes no user or device should be trusted by default, even if inside the network perimeter?',
                    options: [
                        'Defense in depth',
                        'Implicit trust model',
                        'Zero trust model',
                        'Least privilege'
                    ],
                    explanation: 'Zero trust assumes no implicit trust based on network location. Every access request must be verified, authenticated, and authorized regardless of where it originates -- never trust, always verify.'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
