<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP/IP Quiz | N10-009</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'TCP/IP Quiz',
            description: 'Ports, protocols, traffic types, and transport layer concepts.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-tcpip-quiz',
            moduleId: 'web-tcpip-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What port does HTTPS use?',
                    options: [
                        '80',
                        '8080',
                        '443',
                        '8443'
                    ],
                    explanation: 'HTTPS uses port 443 for encrypted web traffic (HTTP over TLS).'
                },
                {
                    question: 'Which transport protocol provides reliable, ordered delivery?',
                    options: [
                        'UDP',
                        'ICMP',
                        'IP',
                        'TCP'
                    ],
                    explanation: 'TCP provides reliable, connection-oriented, ordered delivery with acknowledgments.'
                },
                {
                    question: 'What is the protocol number for ICMP?',
                    options: [
                        '6',
                        '17',
                        '1',
                        '47'
                    ],
                    explanation: 'ICMP is Protocol 1 in the IP header. TCP is 6, UDP is 17, GRE is 47.'
                },
                {
                    question: 'A DHCP client sends a Discover message. What traffic type is this?',
                    options: [
                        'Unicast',
                        'Multicast',
                        'Anycast',
                        'Broadcast'
                    ],
                    explanation: 'DHCP Discover is sent to 255.255.255.255 (broadcast) because the client doesn\\'t know any DHCP server\\'s IP yet.'
                },
                {
                    question: 'What port does SSH use?',
                    options: [
                        '21',
                        '22',
                        '23',
                        '25'
                    ],
                    explanation: 'SSH uses port 22 for secure encrypted remote access. Port 23 is Telnet (insecure).'
                },
                {
                    question: 'Which IPSec protocol provides encryption?',
                    options: [
                        'AH',
                        'ESP',
                        'IKE',
                        'GRE'
                    ],
                    explanation: 'ESP (Encapsulating Security Payload, Protocol 50) provides encryption, authentication, and integrity. AH provides authentication only, no encryption.'
                },
                {
                    question: 'What type of traffic is sent to address 224.0.0.5?',
                    options: [
                        'Unicast',
                        'Broadcast',
                        'Multicast',
                        'Anycast'
                    ],
                    explanation: '224.0.0.0/4 is the multicast range. 224.0.0.5 specifically is the "All OSPF Routers" multicast address.'
                },
                {
                    question: 'What are the three steps of the TCP three-way handshake in order?',
                    options: [
                        'ACK, SYN, FIN',
                        'SYN, ACK, FIN',
                        'SYN, SYN-ACK, ACK',
                        'SYN, RST, ACK'
                    ],
                    explanation: 'The handshake is: Client sends SYN, Server responds SYN-ACK, Client sends ACK.'
                },
                {
                    question: 'Which port does SMTP use?',
                    options: [
                        '110',
                        '143',
                        '25',
                        '587'
                    ],
                    explanation: 'SMTP uses port 25 for sending email. Port 587 is SMTPS (secure submission).'
                },
                {
                    question: 'GRE uses which protocol number?',
                    options: [
                        '6',
                        '17',
                        '47',
                        '50'
                    ],
                    explanation: 'GRE (Generic Routing Encapsulation) is Protocol 47. It provides tunneling but no encryption.'
                },
                {
                    question: 'What does the TCP RST flag do?',
                    options: [
                        'Requests a new session',
                        'Resets/aborts the connection immediately',
                        'Resends lost data',
                        'Redirects to another port'
                    ],
                    explanation: 'RST immediately terminates the connection without the normal four-way teardown.'
                },
                {
                    question: 'Which port pair does FTP use?',
                    options: [
                        '20 and 21',
                        '22 and 23',
                        '80 and 443',
                        '110 and 143'
                    ],
                    explanation: 'FTP uses port 21 for control (commands) and port 20 for data transfer.'
                },
                {
                    question: 'IPv6 does NOT support which traffic type?',
                    options: [
                        'Unicast',
                        'Multicast',
                        'Anycast',
                        'Broadcast'
                    ],
                    explanation: 'IPv6 eliminated broadcast entirely. It uses multicast for functions that previously required broadcast.'
                },
                {
                    question: 'What port does DNS use?',
                    options: [
                        '23',
                        '53',
                        '67',
                        '69'
                    ],
                    explanation: 'DNS uses port 53 for both TCP and UDP. UDP for normal queries, TCP for zone transfers and large responses.'
                },
                {
                    question: 'What does AH (Authentication Header) NOT provide?',
                    options: [
                        'Integrity',
                        'Authentication',
                        'Encryption',
                        'Anti-replay protection'
                    ],
                    explanation: 'AH (Protocol 51) provides authentication, integrity, and anti-replay, but NOT encryption. Use ESP for encryption.'
                },
                {
                    question: 'A user types a URL and their browser connects to a web server. What traffic type is this?',
                    options: [
                        'Broadcast',
                        'Multicast',
                        'Unicast',
                        'Anycast'
                    ],
                    explanation: 'A standard web request from one client to one server is unicast (one-to-one).'
                },
                {
                    question: 'What port does RDP use?',
                    options: [
                        '443',
                        '3306',
                        '3389',
                        '5060'
                    ],
                    explanation: 'Remote Desktop Protocol uses port 3389.'
                },
                {
                    question: 'IKE Phase 1 uses which port?',
                    options: [
                        '443',
                        '500',
                        '4500',
                        '1194'
                    ],
                    explanation: 'IKE (Internet Key Exchange) uses UDP port 500. Port 4500 is used for NAT Traversal.'
                },
                {
                    question: 'What is the purpose of the TCP window size field?',
                    options: [
                        'Sets the maximum segment size',
                        'Controls how much data can be sent before requiring an acknowledgment',
                        'Determines the port number',
                        'Sets the time-to-live value'
                    ],
                    explanation: 'Window size implements flow control by telling the sender how much data the receiver can accept before needing an ACK.'
                },
                {
                    question: 'Which protocol uses port 5060?',
                    options: [
                        'SNMP',
                        'SIP',
                        'SMB',
                        'LDAP'
                    ],
                    explanation: 'SIP (Session Initiation Protocol) uses port 5060 for VoIP signaling. Port 5061 is SIP over TLS.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
