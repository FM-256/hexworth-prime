<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing Quiz | N10-009</title>
    <link rel="stylesheet" href="../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Routing Quiz',
            description: 'Static routes, dynamic protocols, administrative distance.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-routing-quiz',
            moduleId: 'web-routing-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the administrative distance of a directly connected route?',
                    options: [
                        '0',
                        '1',
                        '90',
                        '110'
                    ],
                    explanation: 'Directly connected routes have an administrative distance of 0, making them the most trusted routes in the routing table.'
                },
                {
                    question: 'Which routing protocol uses cost as its primary metric, calculated from interface bandwidth?',
                    options: [
                        'RIP',
                        'EIGRP',
                        'OSPF',
                        'BGP'
                    ],
                    explanation: 'OSPF uses cost as its metric, calculated by dividing a reference bandwidth by the interface bandwidth. Lower cost paths are preferred.'
                },
                {
                    question: 'What is the administrative distance of a static route?',
                    options: [
                        '0',
                        '1',
                        '5',
                        '20'
                    ],
                    explanation: 'Static routes have an administrative distance of 1, making them preferred over all dynamic routing protocols.'
                },
                {
                    question: 'Which routing protocol is used to exchange routes between autonomous systems on the internet?',
                    options: [
                        'OSPF',
                        'EIGRP',
                        'RIP',
                        'BGP'
                    ],
                    explanation: 'BGP (Border Gateway Protocol) is the path-vector protocol used to exchange routing information between autonomous systems (AS) on the internet.'
                },
                {
                    question: 'What does longest prefix match mean in route selection?',
                    options: [
                        'The route with the highest administrative distance wins',
                        'The route with the most specific subnet mask is chosen',
                        'The route that has been in the table the longest wins',
                        'The route with the longest AS path is preferred'
                    ],
                    explanation: 'Longest prefix match means the router selects the route with the most specific (longest) subnet mask. A /28 route is preferred over a /24 for the same destination.'
                },
                {
                    question: 'What is the administrative distance of OSPF?',
                    options: [
                        '90',
                        '100',
                        '110',
                        '120'
                    ],
                    explanation: 'OSPF has an administrative distance of 110. This means if both OSPF and RIP (AD 120) have a route to the same destination, OSPF is preferred.'
                },
                {
                    question: 'Which type of routing requires an administrator to manually configure each route?',
                    options: [
                        'Dynamic routing',
                        'Static routing',
                        'Default routing',
                        'Policy routing'
                    ],
                    explanation: 'Static routing requires manual configuration of each route entry. It does not adapt to topology changes automatically.'
                },
                {
                    question: 'In OSPF, what is the backbone area number?',
                    options: [
                        'Area 1',
                        'Area 0',
                        'Area 255',
                        'Area 100'
                    ],
                    explanation: 'OSPF Area 0 is the backbone area. All other OSPF areas must connect to Area 0 either directly or through virtual links.'
                },
                {
                    question: 'What metric does EIGRP use to calculate the best path?',
                    options: [
                        'Hop count only',
                        'Cost based on bandwidth only',
                        'Composite metric using bandwidth and delay by default',
                        'Latency only'
                    ],
                    explanation: 'EIGRP uses a composite metric that factors in bandwidth and delay by default. It can also consider reliability and load, though these are not used in the default calculation.'
                },
                {
                    question: 'What is the administrative distance of RIP?',
                    options: [
                        '90',
                        '100',
                        '110',
                        '120'
                    ],
                    explanation: 'RIP has an administrative distance of 120, making it less preferred than OSPF (110) and EIGRP (90) when multiple protocols have routes to the same destination.'
                },
                {
                    question: 'What is a default route used for?',
                    options: [
                        'To reach directly connected networks only',
                        'To forward packets when no more specific route exists in the routing table',
                        'To block traffic to unknown destinations',
                        'To override all other routes in the table'
                    ],
                    explanation: 'A default route (0.0.0.0/0) is used as the gateway of last resort. When no more specific route matches the destination, the default route forwards the traffic.'
                },
                {
                    question: 'What does the next hop represent in a routing table entry?',
                    options: [
                        'The final destination IP address',
                        'The IP address of the next router along the path to the destination',
                        'The MAC address of the destination host',
                        'The port number of the destination service'
                    ],
                    explanation: 'The next hop is the IP address of the next router interface that will receive the packet on its way to the final destination.'
                },
                {
                    question: 'What is the key difference between static and dynamic routing?',
                    options: [
                        'Static routing is faster than dynamic routing',
                        'Dynamic routing automatically adapts to network topology changes',
                        'Static routing uses more bandwidth than dynamic routing',
                        'Dynamic routing cannot be used on enterprise networks'
                    ],
                    explanation: 'Dynamic routing protocols automatically discover routes and adapt to changes in the network topology. Static routes require manual updates when the network changes.'
                },
                {
                    question: 'In BGP, what uniquely identifies each network on the internet?',
                    options: [
                        'OSPF Area ID',
                        'Autonomous System Number (ASN)',
                        'VLAN ID',
                        'Subnet mask'
                    ],
                    explanation: 'Each organization on the internet is identified by an Autonomous System Number (ASN). BGP uses ASNs to build a path of autonomous systems to reach a destination.'
                },
                {
                    question: 'What is convergence in the context of routing?',
                    options: [
                        'The process of encrypting routing updates',
                        'The time it takes for all routers to agree on the current network topology',
                        'Combining multiple routing protocols into one',
                        'The process of converting IPv4 routes to IPv6'
                    ],
                    explanation: 'Convergence is the time it takes for all routers in a network to update their routing tables and agree on the current topology after a change occurs. Faster convergence means less downtime.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
