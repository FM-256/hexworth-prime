    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Network Security Fundamentals',
            description: 'Test your understanding of network attacks, security devices, authentication protocols, wireless security, and network hardening.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'n10009-ch01-quiz',
            moduleId: 'n10009-ch01-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'A DDoS attack uses compromised hosts across the internet to flood a target server. What is the collection of these compromised hosts called?',
                    options: [
                        'A botnet',
                        'A honeypot',
                        'A DMZ',
                        'A VLAN'
                    ],
                    explanation: 'A botnet is a network of compromised computers (bots or zombies) controlled by an attacker through a command-and-control (C2) server. In a DDoS attack, the attacker instructs thousands of bots to simultaneously flood the target with traffic. The distributed nature makes DDoS much harder to mitigate than a single-source DoS attack because blocking one source has no effect on the thousands of others. A honeypot is a decoy system, a DMZ is a network zone, and a VLAN is a logical network segment -- none are collections of compromised hosts.'
                },
                {
                    question: 'Which attack technique sends gratuitous ARP replies to associate the attacker\'s MAC address with the default gateway\'s IP address?',
                    options: [
                        'DNS poisoning',
                        'ARP poisoning',
                        'VLAN hopping',
                        'SYN flooding'
                    ],
                    explanation: 'ARP poisoning (also called ARP spoofing) works by sending unsolicited (gratuitous) ARP replies that tell other hosts on the LAN to update their ARP cache, mapping the gateway IP to the attacker\'s MAC address. All traffic destined for the gateway is then redirected through the attacker, enabling a man-in-the-middle position. The primary defense is Dynamic ARP Inspection (DAI) on the switch, which validates ARP packets against the DHCP snooping binding table.'
                },
                {
                    question: 'What is the primary difference between an IDS and an IPS?',
                    options: [
                        'IDS uses signatures while IPS uses anomaly detection',
                        'IDS monitors wireless while IPS monitors wired networks',
                        'IDS can only detect threats while IPS can also block them',
                        'IDS runs on endpoints while IPS runs on the network'
                    ],
                    explanation: 'The key distinction is action capability. An IDS (Intrusion Detection System) monitors traffic passively -- typically via a SPAN port -- and generates alerts when it detects suspicious activity, but it cannot stop the attack. An IPS (Intrusion Prevention System) sits inline in the traffic path and can actively block malicious packets in real time. Both IDS and IPS can use signature-based and anomaly-based detection methods. Both can be host-based or network-based.'
                },
                {
                    question: 'A firewall administrator creates a rule set but does not add an explicit "permit" rule for return traffic. Legitimate traffic is being dropped. Which firewall concept explains this behavior?',
                    options: [
                        'Stateful inspection',
                        'Deep packet inspection',
                        'Port address translation',
                        'Implicit deny'
                    ],
                    explanation: 'Every firewall ends its rule set with an implicit deny -- any traffic not explicitly permitted by a rule is dropped silently. If the firewall is stateless (packet filtering), return traffic must be explicitly permitted because the firewall does not track connection state. A stateful firewall would automatically allow return traffic for established connections. The scenario describes a stateless firewall where the administrator forgot to add rules for return traffic, and the implicit deny at the end blocks it.'
                },
                {
                    question: 'Which authentication protocol uses TCP port 49, encrypts the entire packet body, and separates authentication, authorization, and accounting into distinct operations?',
                    options: [
                        'RADIUS',
                        'Kerberos',
                        'LDAP',
                        'TACACS+'
                    ],
                    explanation: 'TACACS+ (Terminal Access Controller Access-Control System Plus) uses TCP port 49 and encrypts the entire packet body, not just the password. It separates AAA (authentication, authorization, accounting) into independent processes, allowing granular command-level authorization -- this makes it preferred for network device administration. RADIUS uses UDP 1812/1813 and only encrypts the password field. Kerberos uses port 88 with ticket-based authentication. LDAP uses port 389/636 for directory queries.'
                },
                {
                    question: 'In an 802.1X authentication framework, what role does the wireless access point serve?',
                    options: [
                        'Supplicant',
                        'Authenticator',
                        'Authentication server',
                        'Certificate authority'
                    ],
                    explanation: '802.1X defines three roles: the supplicant (the client device requesting access), the authenticator (the network access device -- a switch or wireless AP that controls port access), and the authentication server (typically a RADIUS server that validates credentials). The AP/switch does not make the authentication decision -- it relays EAP messages between the supplicant and the RADIUS server. If authentication succeeds, the authenticator opens the port.'
                },
                {
                    question: 'Which wireless security standard replaced the PSK four-way handshake with Simultaneous Authentication of Equals (SAE) to provide forward secrecy?',
                    options: [
                        'WPA3',
                        'WPA2',
                        'WEP',
                        'WPA'
                    ],
                    explanation: 'WPA3 introduced SAE (also called the Dragonfly handshake) to replace the WPA2 PSK four-way handshake. SAE provides forward secrecy, meaning that even if the passphrase is later compromised, previously captured traffic cannot be decrypted because each session derives unique keys. WPA3-SAE also resists offline dictionary attacks -- an attacker who captures the handshake cannot brute-force the passphrase offline, which was a significant vulnerability in WPA2-PSK.'
                },
                {
                    question: 'A switch feature builds a binding table of MAC-to-IP mappings from DHCP transactions and blocks rogue DHCP servers on untrusted ports. What is this feature?',
                    options: [
                        'Port security',
                        'DHCP snooping',
                        'Dynamic ARP Inspection',
                        'Private VLANs'
                    ],
                    explanation: 'DHCP snooping inspects DHCP messages on the switch. Trusted ports (connected to legitimate DHCP servers) are allowed to send DHCP Offer and ACK messages. Untrusted ports (user-facing) are blocked from sending server-side DHCP messages, preventing rogue DHCP servers from distributing malicious configurations. The binding table created by DHCP snooping (mapping MAC, IP, VLAN, port) is also used by Dynamic ARP Inspection and IP Source Guard for additional Layer 2 security.'
                },
                {
                    question: 'What is the primary advantage of placing public-facing servers (web, email, DNS) in a DMZ rather than on the internal LAN?',
                    options: [
                        'DMZ servers run faster due to dedicated bandwidth',
                        'DMZ provides automatic load balancing',
                        'If a DMZ server is compromised, the attacker still cannot reach the internal network',
                        'DMZ eliminates the need for server patching'
                    ],
                    explanation: 'A DMZ (Demilitarized Zone) sits between two firewalls -- the external firewall allows internet traffic to reach DMZ servers, while the internal firewall blocks traffic from the DMZ to the internal LAN. If an attacker compromises a DMZ web server, they are contained in the DMZ and cannot pivot to internal resources because the inner firewall blocks lateral movement. This containment architecture is the fundamental purpose of a DMZ.'
                },
                {
                    question: 'Which type of VPN sends only corporate-destined traffic through the encrypted tunnel while allowing internet-bound traffic to use the local internet connection directly?',
                    options: [
                        'Site-to-site VPN',
                        'Full tunnel VPN',
                        'Split tunnel VPN',
                        'GRE tunnel'
                    ],
                    explanation: 'Split tunneling configures the VPN client to route only traffic destined for the corporate network through the VPN tunnel. All other traffic (general internet browsing, streaming) goes directly through the user\'s local internet connection. This reduces VPN bandwidth consumption and improves user experience for non-corporate traffic. The trade-off is reduced security visibility -- the corporate security stack cannot inspect the user\'s direct internet traffic. Full tunnel routes everything through the VPN.'
                },
                {
                    question: 'An attacker sends a frame with two 802.1Q tags to traverse from one VLAN to another on the same switch. What is this attack called?',
                    options: [
                        'MAC flooding',
                        'ARP spoofing',
                        'Double tagging',
                        'DNS amplification'
                    ],
                    explanation: 'Double tagging is a VLAN hopping technique. The attacker sends a frame with two 802.1Q VLAN tags. The access switch strips the outer tag (which matches the native VLAN) and forwards the frame with the inner tag to the target VLAN. This only works when the attacker is on the native VLAN and the switch uses native VLAN tagging. Defense: set the native VLAN to an unused VLAN ID, explicitly tag all VLANs on trunks, and disable DTP on all access ports.'
                },
                {
                    question: 'A company requires that network administrators authenticate to routers and switches using centralized credentials with per-command authorization. Which protocol is best suited?',
                    options: [
                        'LDAP',
                        'TACACS+',
                        'SAML',
                        'Kerberos'
                    ],
                    explanation: 'TACACS+ is designed specifically for network device administration. It separates authentication, authorization, and accounting into independent exchanges, allowing the TACACS+ server to authorize (permit or deny) individual CLI commands. For example, a junior admin might be allowed to run show commands but denied configure terminal. RADIUS combines authentication and authorization in a single response, making per-command authorization impractical. LDAP is a directory protocol, SAML is for web SSO.'
                },
                {
                    question: 'Which EAP type provides the highest security by requiring both the client and server to present digital certificates for mutual authentication?',
                    options: [
                        'PEAP',
                        'EAP-FAST',
                        'EAP-TLS',
                        'EAP-MD5'
                    ],
                    explanation: 'EAP-TLS requires both the client and the RADIUS server to present X.509 digital certificates, providing mutual authentication. This is the most secure EAP type because both sides cryptographically prove their identity -- there are no passwords to steal or brute-force. The trade-off is operational complexity: every client device needs a certificate, which requires a PKI (Public Key Infrastructure) to issue and manage. PEAP uses server-side certificates with password authentication inside the tunnel.'
                },
                {
                    question: 'A switch port is configured to allow only 2 MAC addresses. When a third MAC address is detected, the port shuts down. What switch security feature is this?',
                    options: [
                        'DHCP snooping',
                        'Dynamic ARP Inspection',
                        'Spanning Tree BPDU Guard',
                        'Port security'
                    ],
                    explanation: 'Port security limits the number of MAC addresses allowed on a switch port. When the maximum is exceeded, the violation mode determines the response: shutdown (disables the port entirely, requires admin intervention), restrict (drops frames from unknown MACs and logs the violation), or protect (silently drops frames, no logging). Port security prevents CAM table overflow attacks, where an attacker floods the switch with thousands of fake MAC addresses to force it into hub mode, allowing the attacker to sniff all traffic on the segment.'
                },
                {
                    question: 'Which protocol provides centralized, ticket-based single sign-on and is the default authentication mechanism for Windows Active Directory environments?',
                    options: [
                        'RADIUS',
                        'TACACS+',
                        'Kerberos',
                        'SAML'
                    ],
                    explanation: 'Kerberos is the authentication backbone of Active Directory. It uses a Key Distribution Center (KDC) to issue Ticket-Granting Tickets (TGTs) after initial authentication. The client then exchanges the TGT for service-specific tickets without re-entering credentials -- this is SSO. Kerberos uses port 88 (TCP/UDP), provides mutual authentication (both client and server verify each other), and relies on time synchronization (clocks must be within 5 minutes). SAML provides web-based SSO but is not the AD default.'
                }
            ]
        });
        quiz.start();
    </script>
