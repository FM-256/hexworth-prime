<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to N10-009 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Infrastructure Quiz',
            description: 'Cables, connectors, physical installations, and network topologies.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'web',
            achievement: 'web-infrastructure-quiz',
            moduleId: 'web-infrastructure-quiz',
            serverGrading: true,
            houseId: 'web',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the maximum data rate and distance for Cat6a cabling?',
                    options: [
                        '1 Gbps at 100 meters',
                        '10 Gbps at 55 meters',
                        '10 Gbps at 100 meters',
                        '25 Gbps at 100 meters'
                    ],
                    explanation: 'Cat6a supports 10 Gbps at up to 100 meters. Cat6 also supports 10 Gbps but only to 55 meters, while Cat5e maxes out at 1 Gbps.'
                },
                {
                    question: 'Which fiber type uses a laser light source and supports the longest distances?',
                    options: [
                        'Multimode OM3',
                        'Multimode OM4',
                        'Single-mode OS1',
                        'Multimode OM1'
                    ],
                    explanation: 'Single-mode fiber (OS1/OS2) uses a laser and a very small core (8-10 microns) to carry signals over distances up to 80+ km. Multimode uses LEDs with a larger core for shorter runs.'
                },
                {
                    question: 'Which connector type is most commonly used with single-mode fiber patch cables in data centers?',
                    options: [
                        'ST',
                        'SC',
                        'LC',
                        'F-type'
                    ],
                    explanation: 'LC (Lucent Connector) is the most common small form-factor fiber connector in modern data centers. SC is larger and older. ST uses a bayonet twist-lock. F-type is for coaxial cable.'
                },
                {
                    question: 'What is the wiring standard difference between T568A and T568B?',
                    options: [
                        'T568A uses Cat5e and T568B uses Cat6',
                        'The orange and green wire pairs are swapped',
                        'T568A is for fiber and T568B is for copper',
                        'T568B uses shielded cable only'
                    ],
                    explanation: 'T568A and T568B differ only in that the orange and green pairs (pins 1-2 and 3-6) are swapped. Both standards work equally well; consistency within an installation is what matters.'
                },
                {
                    question: 'When would you use a crossover cable instead of a straight-through cable?',
                    options: [
                        'Connecting a switch to a router',
                        'Connecting a PC to a switch',
                        'Connecting two switches together without Auto-MDI/X',
                        'Connecting a PC to a patch panel'
                    ],
                    explanation: 'A crossover cable is used to connect like devices (switch-to-switch, PC-to-PC) when Auto-MDI/X is not available. Straight-through cables connect unlike devices (PC-to-switch).'
                },
                {
                    question: 'What type of cable jacket is required in air-handling spaces above drop ceilings?',
                    options: [
                        'PVC',
                        'Plenum-rated',
                        'Riser-rated',
                        'Direct burial'
                    ],
                    explanation: 'Plenum-rated cable is required in air-handling spaces (plenums) because it produces less toxic smoke when burned. PVC cable releases hazardous fumes and is not permitted in these spaces.'
                },
                {
                    question: 'In a spine-leaf topology, how are leaf switches connected?',
                    options: [
                        'Each leaf connects to every other leaf',
                        'Each leaf connects to every spine switch',
                        'Leaves form a ring with spine switches in the center',
                        'Leaves connect to a single spine switch for redundancy'
                    ],
                    explanation: 'In a spine-leaf (Clos) architecture, every leaf switch connects to every spine switch, and leaf switches never connect directly to each other. This ensures consistent low-latency paths.'
                },
                {
                    question: 'In the three-tier hierarchical network model, which layer aggregates traffic from access switches and enforces policy?',
                    options: [
                        'Core layer',
                        'Distribution layer',
                        'Access layer',
                        'Management layer'
                    ],
                    explanation: 'The distribution layer sits between core and access. It aggregates traffic from access switches, enforces security policies, performs routing between VLANs, and summarizes routes toward the core.'
                },
                {
                    question: 'What is the primary purpose of an MDF (Main Distribution Frame)?',
                    options: [
                        'Provides wireless coverage for a single floor',
                        'Houses the demarcation point and core network equipment',
                        'Stores backup tapes and disaster recovery media',
                        'Provides power distribution to server racks'
                    ],
                    explanation: 'The MDF is the central wiring point for a building. It typically houses the demarcation point, core switches, routers, and connects to all IDFs (Intermediate Distribution Frames) in the facility.'
                },
                {
                    question: 'A standard full-size server rack is how many rack units tall?',
                    options: [
                        '24U',
                        '36U',
                        '42U',
                        '48U'
                    ],
                    explanation: 'A standard full-size rack is 42U (rack units). Each U is 1.75 inches (44.45mm). Shorter racks (24U, 12U) exist for smaller deployments, but 42U is the industry standard.'
                },
                {
                    question: 'What is the purpose of hot aisle/cold aisle containment in a data center?',
                    options: [
                        'To separate production servers from development servers',
                        'To prevent mixing of intake cool air and exhaust hot air for efficient cooling',
                        'To isolate network traffic between different VLANs',
                        'To provide fire suppression zones'
                    ],
                    explanation: 'Hot/cold aisle containment arranges racks so cold air intakes face one aisle and hot exhaust faces another. This prevents mixing, dramatically improving cooling efficiency and reducing energy costs.'
                },
                {
                    question: 'What is the difference between a UPS and a PDU?',
                    options: [
                        'A UPS distributes power to devices; a PDU provides battery backup',
                        'A UPS provides battery backup during outages; a PDU distributes power to rack equipment',
                        'They are the same device with different names',
                        'A UPS is for AC power; a PDU is for DC power'
                    ],
                    explanation: 'A UPS (Uninterruptible Power Supply) provides battery backup to keep equipment running during outages. A PDU (Power Distribution Unit) distributes power from a single source to multiple rack devices.'
                },
                {
                    question: 'What is the maximum wattage per port provided by IEEE 802.3bt (PoE++)?',
                    options: [
                        '15.4W',
                        '25.5W',
                        '51W',
                        '71.3W'
                    ],
                    explanation: '802.3af provides up to 15.4W, 802.3at (PoE+) provides up to 25.5W, and 802.3bt (PoE++) provides up to 71.3W per port. PoE++ can power devices like PTZ cameras and thin clients.'
                },
                {
                    question: 'Which fire suppression method is preferred for occupied data center spaces?',
                    options: [
                        'Wet pipe sprinkler',
                        'Dry pipe sprinkler',
                        'Clean agent (FM-200/Novec 1230)',
                        'Halon'
                    ],
                    explanation: 'Clean agent systems like FM-200 or Novec 1230 suppress fire without damaging electronics or harming personnel. Halon is effective but banned due to ozone depletion. Water-based systems risk equipment damage.'
                },
                {
                    question: 'Which cable testing tool sends a signal down a copper cable and measures the reflection to find faults?',
                    options: [
                        'Cable certifier',
                        'Tone generator',
                        'TDR (Time Domain Reflectometer)',
                        'Loopback adapter'
                    ],
                    explanation: 'A TDR sends an electrical pulse down a copper cable and analyzes the reflected signal to determine the distance to breaks, shorts, or impedance mismatches. OTDR does the same for fiber optic cable.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
