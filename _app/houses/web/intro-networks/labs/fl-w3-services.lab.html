<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Protocol Mapper | First Link - Intro to Networks</title>

    <style>
        :root {
            --primary: #60a5fa;
            --accent: #3b82f6;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a24;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --glow: rgba(96, 165, 250, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .lab-container { max-width: 860px; margin: 0 auto; padding: 2rem; }

        .lab-header {
            text-align: center; margin-bottom: 2rem; padding: 2rem;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
            border-radius: 16px; border: 1px solid var(--primary);
            box-shadow: 0 0 30px var(--glow);
        }

        .lab-header h1 {
            font-size: 2rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), #93c5fd);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lab-header .subtitle { color: var(--text-secondary); font-size: 1rem; }

        .back-link {
            display: inline-block; color: var(--primary); text-decoration: none;
            margin-bottom: 1rem; font-size: 0.9rem; transition: color 0.2s;
        }
        .back-link:hover { color: #93c5fd; }

        .score-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; background: var(--bg-card); border-radius: 12px;
            margin-bottom: 2rem; border: 1px solid rgba(96,165,250,0.15);
        }

        .score-display { font-size: 1.2rem; font-weight: 600; color: var(--primary); }

        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-ghost {
            background: transparent; color: var(--text-secondary);
            border: 1px solid rgba(96,165,250,0.2); margin-left: 0.5rem;
        }
        .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

        .scenario-card {
            padding: 1.5rem; background: var(--bg-card); border-radius: 12px;
            margin-bottom: 1rem; border: 1px solid rgba(96,165,250,0.1);
            transition: border-color 0.3s;
        }

        .scenario-card.correct { border-color: var(--success); background: rgba(34,197,94,0.06); }
        .scenario-card.incorrect { border-color: var(--danger); background: rgba(239,68,68,0.06); }

        .s-num {
            display: inline-block; width: 28px; height: 28px; line-height: 28px;
            text-align: center; border-radius: 6px; font-weight: 700; font-size: 0.8rem;
            background: rgba(96,165,250,0.15); color: var(--primary); margin-right: 0.75rem;
        }

        .s-text { display: inline; font-size: 0.95rem; }

        .proto-select {
            margin-top: 0.75rem; width: 100%; max-width: 240px;
            padding: 8px 12px; background: var(--bg-input);
            border: 1px solid rgba(96,165,250,0.2); border-radius: 6px;
            color: var(--text-primary); font-size: 0.9rem;
        }
        .proto-select:focus { outline: none; border-color: var(--primary); }

        .feedback { margin-top: 0.4rem; font-size: 0.8rem; min-height: 1.2em; }
        .fb-correct { color: var(--success); }
        .fb-incorrect { color: var(--danger); }

        .complete-banner {
            display: none; text-align: center; padding: 2rem; margin-top: 2rem;
            background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(96,165,250,0.1));
            border: 1px solid var(--success); border-radius: 16px;
        }
        .complete-banner h2 { color: var(--success); margin-bottom: 0.5rem; }

        .complete-btn {
            margin-top: 1rem; padding: 12px 32px; background: var(--success); color: #fff;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .complete-btn:hover { background: #16a34a; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
<div class="lab-container">
    <a href="../index.html" class="back-link">Back to Course Home</a>

    <div class="lab-header">
        <h1 aria-label="Service Protocol Mapper Lab - First Link Week 3">Service Protocol Mapper</h1>
        <p class="subtitle">Map 10 network service descriptions to the correct protocol</p>
    </div>

    <div class="score-bar">
        <span class="score-display" id="scoreDisplay">Score: 0 / 10</span>
        <div>
            <button class="btn btn-primary" id="submitBtn" onclick="gradeAll()">Submit Answers</button>
            <button class="btn btn-ghost" onclick="resetLab()">Reset</button>
        </div>
    </div>

    <div id="scenarioList"></div>

    <div class="complete-banner" id="completeBanner">
        <h2>Lab Complete</h2>
        <p id="finalMsg"></p>
        <button class="complete-btn" onclick="markComplete()">Mark Complete &amp; Return</button>
    </div>
</div>

<script>
    /* ================================================================
       SERVICE PROTOCOL MAPPER LAB
       Course: CTS1090C First Link - Introduction to Networks
       Module ID: fl-w3-services-lab
       10 service descriptions, match to protocol, scored X/10
       ================================================================ */

    const MODULE_ID = 'fl-w3-services-lab';
    const HOUSE_ID  = 'web';

    const PROTOCOLS = [
        'DNS', 'DHCP', 'SMTP', 'POP3', 'IMAP', 'SNMP', 'NTP', 'LDAP', 'SMB', 'HTTP'
    ];

    const SCENARIOS = [
        {
            text: 'A client computer just joined the network and automatically received an IP address, subnet mask, default gateway, and DNS server addresses from a server on the local network.',
            answer: 'DHCP'
        },
        {
            text: 'When a user types "www.example.com" in a browser, a query is sent to a server that translates the domain name into the IP address 93.184.216.34.',
            answer: 'DNS'
        },
        {
            text: 'An email client on a workstation sends a composed message to the mail server for relay to the recipient\'s mail server across the internet.',
            answer: 'SMTP'
        },
        {
            text: 'A user opens their email application and it downloads all new messages from the mail server to the local device, removing them from the server.',
            answer: 'POP3'
        },
        {
            text: 'A mobile user reads email on both a phone and laptop. Messages stay on the server and folders remain synchronized across all devices.',
            answer: 'IMAP'
        },
        {
            text: 'A network management station polls each switch and router every 5 minutes, collecting interface statistics, CPU usage, and uptime data using community strings.',
            answer: 'SNMP'
        },
        {
            text: 'All servers, switches, and routers on the network synchronize their clocks to within milliseconds of a reference time source to ensure accurate log correlation.',
            answer: 'NTP'
        },
        {
            text: 'When a user logs into their Windows domain account, the system queries a directory service that stores user objects, group memberships, and organizational units.',
            answer: 'LDAP'
        },
        {
            text: 'An employee maps a network drive on their Windows computer, accessing shared folders on a file server using the path \\\\server\\shared.',
            answer: 'SMB'
        },
        {
            text: 'A web browser sends a GET request to a server on port 80, which responds with an HTML page that renders in the browser window.',
            answer: 'HTTP'
        }
    ];

    let graded = false;

    function buildScenarios() {
        const container = document.getElementById('scenarioList');
        const shuffled = SCENARIOS.map(function(s, i) { return { idx: i, data: s }; });
        shuffled.sort(function() { return Math.random() - 0.5; });

        shuffled.forEach(function(item, displayIdx) {
            const card = document.createElement('div');
            card.className = 'scenario-card';
            card.dataset.answer = item.data.answer;

            let opts = '<option value="">-- Select Protocol --</option>';
            PROTOCOLS.forEach(function(p) {
                opts += '<option value="' + p + '">' + p + '</option>';
            });

            card.innerHTML =
                '<div>' +
                    '<span class="s-num">' + (displayIdx + 1) + '</span>' +
                    '<span class="s-text">' + item.data.text + '</span>' +
                '</div>' +
                '<select class="proto-select">' + opts + '</select>' +
                '<div class="feedback" id="sfb-' + displayIdx + '"></div>';

            container.appendChild(card);
        });
    }

    function gradeAll() {
        if (graded) return;
        graded = true;

        const cards = document.querySelectorAll('.scenario-card');
        let score = 0;

        cards.forEach(function(card, idx) {
            const select = card.querySelector('.proto-select');
            const fb = document.getElementById('sfb-' + idx);
            const correct = card.dataset.answer;

            select.disabled = true;

            if (select.value === correct) {
                score++;
                card.classList.add('correct');
                fb.textContent = 'Correct';
                fb.className = 'feedback fb-correct';
            } else {
                card.classList.add('incorrect');
                fb.textContent = 'Correct answer: ' + correct;
                fb.className = 'feedback fb-incorrect';
            }
        });

        document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / 10';
        document.getElementById('submitBtn').disabled = true;

        if (score >= 8) {
            var banner = document.getElementById('completeBanner');
            document.getElementById('finalMsg').textContent =
                'You scored ' + score + '/10. Well done!';
            banner.style.display = 'block';
        }
    }

    function resetLab() {
        graded = false;
        document.getElementById('scenarioList').innerHTML = '';
        document.getElementById('scoreDisplay').textContent = 'Score: 0 / 10';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('completeBanner').style.display = 'none';
        buildScenarios();
    }

    function markComplete() {
        if (typeof ModuleProgress !== 'undefined') {
            ModuleProgress.complete(HOUSE_ID, MODULE_ID, { returnUrl: '../index.html' });
        }
    }

    buildScenarios();
</script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;

         activity ticks the mood-ring.

    <hex-ai-button mission-id="fl-w3-services" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
