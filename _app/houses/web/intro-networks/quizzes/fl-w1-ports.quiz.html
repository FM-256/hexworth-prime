<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- AccessGuard: blocks unauthenticated and unsorted users -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- AchievementManager: unlocks badges on milestone events -->
    <script src="../../../../components/AchievementManager.js"></script>
    <!-- ModuleProgress: marks this module complete in Firestore -->
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Ports &amp; Protocols | First Link</title>
    <style>
        :root {
            --bg:         #0a0e1a;
            --bg-card:    #0f1625;
            --bg-option:  #141d2e;
            --primary:    #60a5fa;
            --primary-dim:rgba(96, 165, 250, 0.15);
            --accent:     #3b82f6;
            --text:       #e2e8f0;
            --text-muted: #8892a8;
            --success:    #22c55e;
            --danger:     #ef4444;
            --border:     rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }

        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); display: inline-block; }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--primary-dim);
        }
        .quiz-header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .score-label { font-size: 0.85rem; color: var(--primary); font-weight: 600; white-space: nowrap; }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .question-num { font-size: 0.8rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .question-text code {
            background: rgba(96, 165, 250, 0.1);
            color: #93c5fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
        }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .option:hover { border-color: rgba(96, 165, 250, 0.4); background: rgba(96, 165, 250, 0.05); }
        .option.selected { border-color: var(--primary); background: rgba(96, 165, 250, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700; font-size: 0.85rem;
            color: var(--primary);
            flex-shrink: 0;
        }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }
        .feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn {
            padding: 10px 24px;
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: var(--primary);
            border-radius: 8px;
            font-size: 0.9rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .next-btn:hover { background: var(--primary); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(96, 165, 250, 0.15); color: var(--primary); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }
        .results-card h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button {
            padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.2s; border: none;
        }
        .btn-retry { background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4) !important; color: var(--primary); }
        .btn-retry:hover { background: var(--primary); color: #fff; }
        .btn-hub { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(34, 197, 94, 0.04); border-left: 2px solid var(--success); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--success); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card  { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">

        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; First Link Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Quiz: Ports &amp; Protocols</h1>
            <p class="subtitle">TCP/UDP ports, common protocols, the TCP three-way handshake</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>Pass: 70%</span>
                <span>CTS1090C</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

    </div>

    <script>
        /* -- Question bank: Ports & Protocols (15 questions) -- */
        /* ans: 0=A, 1=B, 2=C, 3=D | Distribution: A=4 B=4 C=4 D=3 */
        var questions = [{"q":"Which well-known port does HTTP use by default?","opts":["Port 80","Port 443","Port 21","Port 25"],"exp":"HTTP (Hypertext Transfer Protocol) uses port 80 by default for unencrypted web traffic. HTTPS uses port 443."},{"q":"What three-step process establishes a TCP connection between two hosts?","opts":["ACK, SYN, FIN","SYN, SYN-ACK, ACK","FIN, ACK, RST","SYN, ACK, FIN"],"exp":"The TCP three-way handshake is SYN, SYN-ACK, ACK. The client sends SYN, the server replies with SYN-ACK, and the client confirms with ACK."},{"q":"Which transport-layer protocol is connectionless and does not guarantee delivery?","opts":["TCP","ICMP","UDP","TLS"],"exp":"UDP (User Datagram Protocol) is connectionless and provides best-effort delivery without establishing a session or guaranteeing packet arrival."},{"q":"HTTPS encrypts web traffic and operates on which default port?","opts":["Port 80","Port 8080","Port 8443","Port 443"],"exp":"HTTPS uses port 443 and wraps HTTP inside TLS to provide encryption, integrity, and server authentication."},{"q":"Which port does DNS use by default for name resolution queries?","opts":["Port 53","Port 67","Port 110","Port 143"],"exp":"DNS uses port 53 for both TCP and UDP. Standard queries use UDP; zone transfers and large responses use TCP."},{"q":"FTP uses two ports for operation. Which pair is correct?","opts":["20 and 22","20 and 21","21 and 23","25 and 110"],"exp":"FTP uses port 21 for control (commands) and port 20 for active-mode data transfer."},{"q":"Which protocol uses port 22 and provides encrypted remote terminal access?","opts":["Telnet","FTP","SSH","SNMP"],"exp":"SSH (Secure Shell) runs on port 22 and provides encrypted command-line access, file transfer (SCP/SFTP), and tunneling."},{"q":"What happens if a TCP segment is lost during transmission?","opts":["The connection is immediately terminated","The segment is silently dropped","The router retransmits it automatically","The sender retransmits it after the acknowledgment timer expires"],"exp":"TCP uses acknowledgments and retransmission timers. If a segment is not acknowledged within the timeout window, the sender retransmits it."},{"q":"SMTP is used for sending email and operates on which default port?","opts":["Port 25","Port 110","Port 143","Port 993"],"exp":"SMTP (Simple Mail Transfer Protocol) uses port 25 for server-to-server email relay. Submission from clients typically uses port 587."},{"q":"Which protocol retrieves email from a server and uses port 110 by default?","opts":["SMTP","POP3","IMAP","SNMP"],"exp":"POP3 (Post Office Protocol v3) uses port 110 to download email from the server. Its encrypted variant POP3S uses port 995."},{"q":"Telnet provides remote access on port 23. Why is it considered insecure?","opts":["It only supports IPv4","It requires a VPN","It transmits all data including credentials in plaintext","It uses weak encryption"],"exp":"Telnet sends everything in cleartext, including usernames and passwords. SSH (port 22) should be used instead."},{"q":"RDP (Remote Desktop Protocol) uses which default port?","opts":["Port 443","Port 445","Port 3306","Port 3389"],"exp":"RDP uses TCP port 3389 to provide graphical remote desktop access to Windows systems."},{"q":"The TCP FIN flag is used to:","opts":["Initiate a new connection","Reset a connection immediately","Gracefully close an established connection","Acknowledge received data"],"exp":"The FIN flag signals that the sender has finished transmitting data and wishes to gracefully close the connection through a four-way teardown."},{"q":"Which port does LDAP use by default for directory services queries?","opts":["Port 53","Port 389","Port 636","Port 1433"],"exp":"LDAP (Lightweight Directory Access Protocol) uses port 389. Its encrypted variant LDAPS uses port 636."},{"q":"Port numbers in the range 0-1023 are classified as:","opts":["Registered ports","Dynamic ports","Ephemeral ports","Well-known ports"],"exp":"Ports 0-1023 are well-known ports assigned to common services by IANA. Registered ports are 1024-49151, and dynamic/ephemeral ports are 49152-65535."}];

        var current = 0, score = 0, answered = false, TOTAL = questions.length, userAnswers = []; var revealedAnswers = {}; // server-revealed correct index per question (Family-5)

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;

            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'fl-w1-ports-quiz';
        // gradeOne: validate one answer server-side; capture the revealed correct index (revealToAll key) for review.
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) {
                    var res = r && r.results && r.results[qIndex];
                    if (res && typeof res.correctAnswer !== 'undefined') revealedAnswers[qIndex] = res.correctAnswer;
                    return res ? !!res.correct : null;
                })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;
            var q = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                var ca = revealedAnswers[current];
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer! ' + q.exp; }
                else {
                    if (typeof ca !== 'undefined') opts[ca].classList.add('correct');
                    if (!correct) opts[idx].classList.add('incorrect');
                    if (correct) score++;
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct! ' : 'Incorrect! ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) { showResults(); return; }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var rc = document.getElementById('resultsCard');
            rc.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var sb = document.getElementById('finalScore');
            sb.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) sb.className = 'score-big';
            else if (pct >= 70) sb.className = 'score-big mid';
            else sb.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong grasp of TCP/UDP ports and protocols.';
            else if (pct >= 70) msg = 'Good work -- you passed. Review any missed questions before moving on.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the Week 1 Ports & Protocols slides and try again.';
            else msg = 'Keep at it. Return to the Week 1 materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                (function(){ try { ModuleProgress.completeQuiz('web', 'fl-w1-ports-quiz', pct, { returnToDashboard: false }); } catch (e) { console.warn('[fl-w1-ports-quiz] ModuleProgress.completeQuiz failed:', e); } })();
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = revealedAnswers[i]; // Family-5: from server reveal
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                if (q.exp) html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="fl-w1-ports" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
