<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Network Connections | First Link</title>
    <style>
        :root { --bg:#0a0e1a;--bg-card:#0f1625;--bg-option:#141d2e;--primary:#60a5fa;--primary-dim:rgba(96,165,250,0.15);--accent:#3b82f6;--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--border:rgba(255,255,255,0.08); }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg) 0%,#0c1220 50%,#0e1828 100%);color:var(--text);min-height:100vh;line-height:1.6; }
        .quiz-container { max-width:800px;margin:0 auto;padding:2rem; }
        .nav-links { display:flex;gap:1.5rem;margin-bottom:1.5rem; }
        .back-link { color:var(--primary);text-decoration:none;font-size:0.9rem;transition:all 0.3s; }
        .back-link:hover { color:#93c5fd;transform:translateX(-5px);display:inline-block; }
        .quiz-header { text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--primary-dim); }
        .quiz-header h1 { font-size:1.6rem;color:var(--primary);margin-bottom:0.5rem; }
        .quiz-header .subtitle { color:var(--text-muted);font-size:0.9rem;margin-bottom:0.75rem; }
        .quiz-header .meta { display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:0.8rem; }
        .quiz-header .meta span { background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted); }
        .progress-bar-wrap { background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px; }
        .progress-label { font-size:0.85rem;color:var(--text-muted);white-space:nowrap; }
        .progress-track { flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden; }
        .progress-fill { height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width 0.4s ease;width:0%; }
        .score-label { font-size:0.85rem;color:var(--primary);font-weight:600;white-space:nowrap; }
        .question-card { background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem; }
        .question-num { font-size:0.8rem;color:var(--primary);font-weight:600;letter-spacing:0.5px;margin-bottom:0.75rem; }
        .question-text { font-size:1.15rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5; }
        .options { display:flex;flex-direction:column;gap:10px;margin-bottom:1rem; }
        .option { display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.2s;font-size:0.95rem; }
        .option:hover { border-color:rgba(96,165,250,0.4);background:rgba(96,165,250,0.05); }
        .option.correct { border-color:var(--success);background:rgba(34,197,94,0.1); }
        .option.incorrect { border-color:var(--danger);background:rgba(239,68,68,0.08); }
        .option.disabled { pointer-events:none;opacity:0.7; }
        .option.correct.disabled { opacity:1; }
        .option.incorrect.disabled { opacity:1; }
        .option-letter { width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:0.85rem;color:var(--primary);flex-shrink:0; }
        .option.correct .option-letter { background:var(--success);color:#fff;border-color:var(--success); }
        .option.incorrect .option-letter { background:var(--danger);color:#fff;border-color:var(--danger); }
        .feedback { padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:0.9rem;line-height:1.6;display:none; }
        .feedback.correct { display:block;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);color:#86efac; }
        .feedback.incorrect { display:block;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#fca5a5; }
        .quiz-nav { display:flex;justify-content:flex-end; }
        .next-btn { padding:10px 24px;background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.4);color:var(--primary);border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s; }
        .next-btn:hover { background:var(--primary);color:#fff; }
        .next-btn:disabled { opacity:0.3;cursor:not-allowed; }
        .next-btn:disabled:hover { background:rgba(96,165,250,0.15);color:var(--primary); }
        .results-card { display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border); }
        .results-card h2 { color:var(--primary);font-size:1.4rem;margin-bottom:1rem; }
        .score-big { font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:0.5rem; }
        .score-big.low { color:var(--danger); }
        .score-big.mid { color:#fbbf24; }
        .score-msg { color:var(--text-muted);font-size:1rem;margin-bottom:2rem; }
        .results-btns { display:flex;gap:12px;justify-content:center;flex-wrap:wrap; }
        .results-btns a,.results-btns button { padding:10px 24px;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s;border:none; }
        .btn-retry { background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.4) !important;color:var(--primary); }
        .btn-retry:hover { background:var(--primary);color:#fff; }
        .btn-hub { background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4) !important;color:var(--success); }
        .btn-hub:hover { background:var(--success);color:#fff; }
        @media (max-width:640px) { .quiz-container{padding:1rem;} .question-card{padding:1.25rem;} .quiz-header h1{font-size:1.3rem;} }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; First Link Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz: Network Connections</h1>
            <p class="subtitle">DSL, cable, fiber, satellite, LAN/WAN/MAN topologies, VPN</p>
            <div class="meta"><span>Week 4</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS1090C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to First Link Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* -- Network Connections (15 questions) -- */
        /* Distribution: A=4 B=4 C=4 D=3 */
        var questions = [
            {
                q: "A LAN (Local Area Network) typically covers:",
                opts: ["A single building or campus", "An entire city", "Multiple countries", "A single device"],
                ans: 0,
                exp: "A LAN covers a small geographic area such as a home, office, or campus building. It is owned and managed by a single organization."
            },
            {
                q: "A WAN (Wide Area Network) connects networks across:",
                opts: ["A single room", "Large geographic distances such as cities, states, or countries", "Only wireless devices", "A single VLAN"],
                ans: 1,
                exp: "A WAN spans large distances and connects LANs together. The internet is the largest WAN. Organizations use leased lines, MPLS, or VPNs for private WAN connectivity."
            },
            {
                q: "DSL internet service is delivered over:",
                opts: ["Coaxial cable", "Fiber optic cable", "Existing copper telephone lines", "Satellite link"],
                ans: 2,
                exp: "DSL (Digital Subscriber Line) uses existing copper telephone wiring to deliver broadband internet. Performance degrades with distance from the provider's central office."
            },
            {
                q: "Cable internet uses which type of physical medium?",
                opts: ["Twisted-pair telephone lines", "Coaxial cable shared with cable TV infrastructure", "Single-mode fiber", "Wireless microwave"],
                ans: 1,
                exp: "Cable internet uses the same coaxial cable infrastructure as cable television. It is a shared medium, so bandwidth can decrease during peak usage in the neighborhood."
            },
            {
                q: "Fiber optic internet offers higher speeds than DSL and cable primarily because:",
                opts: ["It uses light signals through glass or plastic strands, providing much greater bandwidth and distance", "It uses thicker copper wires", "It shares bandwidth with fewer neighbors", "It requires less electrical power"],
                ans: 0,
                exp: "Fiber uses pulses of light rather than electrical signals, enabling multi-gigabit speeds over long distances with no signal degradation from electromagnetic interference."
            },
            {
                q: "The main disadvantage of satellite internet is:",
                opts: ["Low download speeds", "Limited availability", "High latency due to the signal traveling to and from orbit", "Excessive power consumption"],
                ans: 2,
                exp: "Geostationary satellite internet has ~600ms round-trip latency because signals must travel ~35,786 km to the satellite and back. LEO constellations like Starlink reduce this significantly."
            },
            {
                q: "A MAN (Metropolitan Area Network) spans:",
                opts: ["A single building", "A campus", "A city or metropolitan area", "Multiple continents"],
                ans: 2,
                exp: "A MAN covers a city-sized area, connecting multiple LANs across buildings in a metropolitan region. Examples include citywide government or university networks."
            },
            {
                q: "A VPN (Virtual Private Network) provides security by:",
                opts: ["Replacing the ISP connection", "Creating an encrypted tunnel over an untrusted network like the internet", "Physically isolating the cable", "Blocking all inbound traffic"],
                ans: 1,
                exp: "A VPN encrypts traffic and encapsulates it in a tunnel, ensuring confidentiality and integrity even when traversing public or untrusted networks."
            },
            {
                q: "A site-to-site VPN connects:",
                opts: ["Two entire networks (such as branch offices) through a permanent encrypted tunnel", "A single remote user to the corporate network", "Two devices on the same LAN", "A wireless client to an access point"],
                ans: 0,
                exp: "A site-to-site VPN establishes a persistent encrypted tunnel between two network gateways, connecting entire office networks as if they were on the same LAN."
            },
            {
                q: "MPLS (Multiprotocol Label Switching) improves WAN performance by:",
                opts: ["Encrypting all packets end-to-end", "Using labels to make fast forwarding decisions without examining full IP headers at each hop", "Replacing TCP with a faster protocol", "Compressing all traffic to half its size"],
                ans: 1,
                exp: "MPLS assigns short labels to packets at the network edge. Core routers forward based on labels instead of complex IP lookups, improving speed and enabling traffic engineering."
            },
            {
                q: "A star topology connects all devices to:",
                opts: ["Each other directly (full mesh)", "A single central switch or hub", "A ring backbone", "A bus cable"],
                ans: 1,
                exp: "In a star topology, every device connects to a central node (switch or hub). If one link fails, only that device loses connectivity. Most modern LANs use this topology."
            },
            {
                q: "The main benefit of a full mesh topology is:",
                opts: ["Lowest cost", "Simplest cabling", "Maximum redundancy -- every node connects to every other node", "Fewest cables needed"],
                ans: 2,
                exp: "Full mesh provides maximum redundancy because every device has a direct link to every other device. If any link fails, traffic reroutes. However, it is the most expensive to implement."
            },
            {
                q: "SD-WAN (Software-Defined WAN) improves upon traditional WAN by:",
                opts: ["Requiring dedicated MPLS circuits only", "Using software to intelligently route traffic across multiple connection types (broadband, LTE, MPLS)", "Eliminating the need for encryption", "Operating exclusively over satellite links"],
                ans: 1,
                exp: "SD-WAN uses software-defined networking to dynamically route traffic across available links (broadband, MPLS, LTE) based on real-time performance metrics, reducing cost and improving reliability."
            },
            {
                q: "Split tunneling in a VPN means:",
                opts: ["All traffic goes through the VPN tunnel", "Only corporate-destined traffic uses the VPN; internet traffic goes directly to the ISP", "The VPN uses two separate encryption algorithms", "Traffic is split between TCP and UDP"],
                ans: 1,
                exp: "Split tunneling routes only corporate network traffic through the VPN while allowing general internet traffic to go directly through the local ISP, reducing VPN bandwidth usage."
            },
            {
                q: "A point-to-point leased line provides:",
                opts: ["Shared bandwidth with other customers", "A dedicated, private connection between two locations", "Wireless connectivity between buildings", "Free internet from the ISP"],
                ans: 1,
                exp: "A leased line is a dedicated, always-on connection between two sites. Bandwidth is guaranteed and not shared, but costs are significantly higher than broadband alternatives."
            }
        ];

        var current = 0, score = 0, answered = false, TOTAL = questions.length;
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;
            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) { html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>'; }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }
        function selectAnswer(idx) {
            if (answered) return; answered = true;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); if (i === q.ans) opts[i].classList.add('correct'); else if (i === idx) opts[i].classList.add('incorrect'); }
            var fb = document.getElementById('feedback');
            if (idx === q.ans) { score++; fb.className = 'feedback correct'; fb.textContent = 'Correct! ' + q.exp; }
            else { fb.className = 'feedback incorrect'; fb.textContent = 'Incorrect. ' + q.exp; }
            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;
            if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
        }
        function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var rc = document.getElementById('resultsCard'); rc.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100), sb = document.getElementById('finalScore');
            sb.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) sb.className = 'score-big'; else if (pct >= 70) sb.className = 'score-big mid'; else sb.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong understanding of WAN technologies and network connections.';
            else if (pct >= 70) msg = 'Good work -- you passed. Review any missed questions before moving on.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the Week 4 Connections slides and try again.';
            else msg = 'Keep at it. Return to the Week 4 materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') { ModuleProgress.completeQuiz('web', 'fl-w4-connections-quiz', score); }
        }
        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }
        loadQuestion();
    </script>
</body>
</html>
