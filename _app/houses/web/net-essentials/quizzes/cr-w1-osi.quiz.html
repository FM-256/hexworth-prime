<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: OSI Model &amp; Encapsulation | Cable Run</title>
    <style>
        :root {
            --bg:         #0a0e1a;
            --bg-card:    #0f1625;
            --bg-option:  #141d2e;
            --accent:     #60a5fa;
            --accent2:    #3b82f6;
            --accent-dim: rgba(96, 165, 250, 0.15);
            --text:       #e2e8f0;
            --text-muted: #8892a8;
            --success:    #22c55e;
            --danger:     #ef4444;
            --border:     rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); display: inline-block; }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--accent-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .question-text code { background: rgba(96, 165, 250, 0.1); color: #93c5fd; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas', 'Courier New', monospace; font-size: 1rem; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(96, 165, 250, 0.4); background: rgba(96, 165, 250, 0.05); }
        .option.selected { border-color: var(--accent); background: rgba(96, 165, 250, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--accent); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.correct { display: block; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4); color: var(--accent); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--accent); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(96, 165, 250, 0.15); color: var(--accent); }
        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--accent); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4) !important; color: var(--accent); }
        .btn-retry:hover { background: var(--accent); color: #fff; }
        .btn-hub { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4) !important; color: var(--accent2); }
        .btn-hub:hover { background: var(--accent2); color: #fff; }
        @media (max-width: 640px) { .quiz-container { padding: 1rem; } .question-card { padding: 1.25rem; } .quiz-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Cable Run Hub</a>
        </div>
        <div class="quiz-header">
            <h1>Quiz: OSI Model &amp; Encapsulation</h1>
            <p class="subtitle">OSI layers, PDUs, encapsulation, de-encapsulation, and the TCP/IP model</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>Pass: 70%</span>
                <span>CTS1305C</span>
            </div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Cable Run Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "Which OSI layer is responsible for logical addressing and routing?",
                opts: ["Network (Layer 3)", "Data Link (Layer 2)", "Transport (Layer 4)", "Session (Layer 5)"],
                ans: 0,
                exp: "The Network layer (Layer 3) handles logical addressing (IP addresses) and determines the best path for data to travel across networks using routing protocols."
            },
            {
                q: "What is the PDU (Protocol Data Unit) at the Transport layer?",
                opts: ["Bit", "Frame", "Packet", "Segment"],
                ans: 3,
                exp: "The Transport layer PDU is called a segment (TCP) or datagram (UDP). Layer 3 uses packets, Layer 2 uses frames, and Layer 1 uses bits."
            },
            {
                q: "During encapsulation, what is added at the Data Link layer?",
                opts: ["IP header", "Port numbers", "Header and trailer (frame)", "Session ID"],
                ans: 2,
                exp: "The Data Link layer adds both a header (containing MAC addresses) and a trailer (containing FCS for error detection) to create a frame. It is the only layer that adds a trailer."
            },
            {
                q: "Which OSI layer establishes, manages, and terminates sessions between applications?",
                opts: ["Application (Layer 7)", "Presentation (Layer 6)", "Session (Layer 5)", "Transport (Layer 4)"],
                ans: 2,
                exp: "The Session layer (Layer 5) manages dialog control between applications, establishing, maintaining, and tearing down communication sessions."
            },
            {
                q: "A switch operates primarily at which OSI layer?",
                opts: ["Layer 2 (Data Link)", "Layer 1 (Physical)", "Layer 3 (Network)", "Layer 4 (Transport)"],
                ans: 0,
                exp: "Switches operate at Layer 2 (Data Link). They use MAC addresses to forward frames to the correct port. Layer 3 switches can also perform routing."
            },
            {
                q: "What is the correct order of the OSI model from bottom to top?",
                opts: [
                    "Physical, Data Link, Network, Transport, Session, Presentation, Application",
                    "Application, Presentation, Session, Transport, Network, Data Link, Physical",
                    "Physical, Network, Data Link, Transport, Session, Application, Presentation",
                    "Data Link, Physical, Network, Session, Transport, Presentation, Application"
                ],
                ans: 0,
                exp: "The OSI model from Layer 1 to Layer 7: Physical, Data Link, Network, Transport, Session, Presentation, Application. A common mnemonic is 'Please Do Not Throw Sausage Pizza Away.'"
            },
            {
                q: "Which layer of the TCP/IP model combines the OSI Session, Presentation, and Application layers?",
                opts: ["Network Access", "Internet", "Transport", "Application"],
                ans: 3,
                exp: "The TCP/IP model has four layers. Its Application layer maps to OSI Layers 5, 6, and 7 combined. The TCP/IP model simplifies the upper layers into one."
            },
            {
                q: "What does the Presentation layer (Layer 6) primarily handle?",
                opts: ["Routing between networks", "Data encryption, compression, and format translation", "Error detection via checksums", "Physical signal transmission"],
                ans: 1,
                exp: "The Presentation layer handles data formatting, encryption/decryption, and compression. It translates data between the application format and the network format (e.g., JPEG, ASCII, TLS)."
            },
            {
                q: "Which device operates at Layer 3 of the OSI model?",
                opts: ["Hub", "Switch", "Router", "Access point"],
                ans: 2,
                exp: "Routers operate at Layer 3 (Network) and use IP addresses to make forwarding decisions. Hubs are Layer 1, switches are Layer 2, and access points are typically Layer 2."
            },
            {
                q: "During de-encapsulation, what happens as data moves up the OSI layers at the receiving host?",
                opts: ["Headers are added at each layer", "Headers are stripped off at each corresponding layer", "Data is encrypted at each layer", "The payload is duplicated at each layer"],
                ans: 1,
                exp: "De-encapsulation is the reverse of encapsulation. As data moves up the stack at the destination, each layer reads and removes its own header (and trailer at Layer 2) before passing the payload up."
            },
            {
                q: "What is the primary function of the Physical layer (Layer 1)?",
                opts: ["Logical addressing", "Framing and MAC addressing", "Transmitting raw bits over a physical medium", "Reliable data delivery"],
                ans: 2,
                exp: "The Physical layer converts data into electrical, optical, or radio signals and transmits raw bits across the physical medium (cables, fiber, wireless). It defines voltages, pin layouts, and data rates."
            },
            {
                q: "Which protocol operates at the Transport layer and provides reliable, connection-oriented delivery?",
                opts: ["IP", "UDP", "ARP", "TCP"],
                ans: 3,
                exp: "TCP (Transmission Control Protocol) operates at Layer 4 and provides reliable, ordered, connection-oriented delivery with acknowledgments, sequencing, and flow control."
            },
            {
                q: "The TCP/IP Internet layer maps to which OSI layer?",
                opts: ["Layer 1 (Physical)", "Layer 2 (Data Link)", "Layer 3 (Network)", "Layer 4 (Transport)"],
                ans: 2,
                exp: "The TCP/IP Internet layer handles IP addressing and routing, which directly maps to OSI Layer 3 (Network). Protocols at this layer include IP, ICMP, and IGMP."
            },
            {
                q: "What does the acronym PDU stand for?",
                opts: ["Packet Data Utility", "Protocol Data Unit", "Payload Delivery Update", "Primary Distribution Unit"],
                ans: 1,
                exp: "PDU stands for Protocol Data Unit. It is the generic term for data at each OSI layer: bits (L1), frames (L2), packets (L3), segments (L4), and data (L5-L7)."
            },
            {
                q: "Which OSI layer is responsible for end-to-end error recovery and flow control?",
                opts: ["Network (Layer 3)", "Transport (Layer 4)", "Data Link (Layer 2)", "Application (Layer 7)"],
                ans: 1,
                exp: "The Transport layer (Layer 4) provides end-to-end error recovery, flow control, and segmentation. TCP uses sequence numbers and acknowledgments to ensure reliable delivery between endpoints."
            }
        ];

        var current = 0, score = 0, answered = false, TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;
            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }
            var fb = document.getElementById('feedback');
            if (idx === q.ans) { score++; fb.className = 'feedback correct'; fb.textContent = 'Correct! ' + q.exp; }
            else { fb.className = 'feedback incorrect'; fb.textContent = 'Incorrect. ' + q.exp; }
            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;
            if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
        }

        function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 70) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong grasp of the OSI model, PDUs, and encapsulation.';
            else if (pct >= 70) msg = 'Good work — you passed. Review any missed questions before moving on.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the OSI model materials and try again.';
            else msg = 'Keep at it. Return to the Week 1 OSI materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('web', 'cr-w1-osi-quiz', { returnUrl: '../index.html' });
            }
        }

        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
