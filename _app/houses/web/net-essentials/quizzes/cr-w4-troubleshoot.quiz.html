<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Network Troubleshooting | Cable Run</title>
    <style>
        :root { --bg: #0a0e1a; --bg-card: #0f1625; --bg-option: #141d2e; --accent: #60a5fa; --accent2: #3b82f6; --accent-dim: rgba(96,165,250,0.15); --text: #e2e8f0; --text-muted: #8892a8; --success: #22c55e; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #93c5fd; transform: translateX(-5px); display: inline-block; }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--accent-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.05); }
        .option.correct { border-color: var(--success); background: rgba(34,197,94,0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239,68,68,0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--accent); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.checking { display: block; background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.35); color: #cbd5e1; }
        .feedback.correct { display: block; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.4); color: var(--accent); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--accent); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(96,165,250,0.15); color: var(--accent); }
        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--accent); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.4) !important; color: var(--accent); }
        .btn-retry:hover { background: var(--accent); color: #fff; }
        .btn-hub { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.4) !important; color: var(--accent2); }
        .btn-hub:hover { background: var(--accent2); color: #fff; }
        @media (max-width: 640px) { .quiz-container { padding: 1rem; } .question-card { padding: 1.25rem; } .quiz-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Cable Run Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz: Network Troubleshooting</h1>
            <p class="subtitle">Troubleshooting methodology, diagnostic tools, common issues, and LED indicators</p>
            <div class="meta"><span>Week 4</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS1305C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Cable Run Hub</a>
            </div>
        </div>
    </div>

    <script>
        var questions = [
            {
                q: "What is the first step in the CompTIA Network+ troubleshooting methodology?",
                opts: ["Establish a theory of probable cause", "Test the theory to determine cause", "Implement the solution", "Identify the problem"],
                exp: "The seven-step methodology: (1) Identify the problem, (2) Establish a theory, (3) Test the theory, (4) Establish a plan of action, (5) Implement the solution, (6) Verify full functionality, (7) Document findings."
            },
            {
                q: "A user cannot access any websites but can ping IP addresses successfully. What is the most likely issue?",
                opts: ["DNS resolution is failing", "The NIC is disabled", "The default gateway is incorrect", "The cable is unplugged"],
                exp: "If pinging by IP works but browsing fails, the issue is DNS. The host can reach the network (Layer 3 is fine) but cannot resolve domain names to IP addresses."
            },
            {
                q: "Which command-line tool shows the path a packet takes across the network?",
                opts: ["ping", "nslookup", "tracert / traceroute", "netstat"],
                exp: "tracert (Windows) / traceroute (Linux/macOS) shows each router hop between source and destination by sending packets with incrementing TTL values."
            },
            {
                q: "A switch port LED is amber/orange. What does this typically indicate?",
                opts: ["The port is operating at full speed", "The port is in PoE mode", "The port has no device connected", "The port is administratively disabled or experiencing an error"],
                exp: "An amber/orange LED on most switches indicates a port issue: it may be disabled by an administrator, blocked by STP, or experiencing an error condition like a speed/duplex mismatch."
            },
            {
                q: "What tool would you use to verify that an Ethernet cable is properly terminated with the correct pin-out?",
                opts: ["Multimeter", "Spectrum analyzer", "Cable tester / certifier", "Protocol analyzer"],
                exp: "A cable tester or certifier verifies wire mapping, pin-out (T568A/B), continuity, and can detect opens, shorts, and crossed pairs. Advanced certifiers also test for crosstalk and attenuation."
            },
            {
                q: "A host has an IP address of 169.254.x.x. What does this indicate?",
                opts: ["The host is configured with a static IP", "The host received an address from DHCP successfully", "The host could not reach a DHCP server and assigned itself an APIPA address", "The host is using an IPv6 link-local address"],
                exp: "169.254.0.0/16 is the APIPA (Automatic Private IP Addressing) range. Windows and macOS assign an address from this range when DHCP fails. It allows only local-link communication."
            },
            {
                q: "What does the command <code>ipconfig /release</code> followed by <code>ipconfig /renew</code> do?",
                opts: ["Releases the current DHCP lease and requests a new one", "Clears the DNS cache", "Resets the TCP/IP stack", "Flushes the ARP table"],
                exp: "ipconfig /release gives up the current DHCP-assigned IP address. ipconfig /renew sends a new DHCP Discover to obtain a fresh lease. This is a common first step for IP configuration issues."
            },
            {
                q: "Which tool captures and analyzes packets on a network for deep inspection?",
                opts: ["ping", "tracert", "nslookup", "Wireshark (protocol analyzer)"],
                exp: "Wireshark is a protocol analyzer (packet sniffer) that captures live traffic and allows deep inspection of every field in every protocol header. It is essential for advanced troubleshooting."
            },
            {
                q: "A user reports slow network performance. After testing, you find high latency. What should you check next?",
                opts: ["Network congestion, bandwidth utilization, and duplex mismatches", "DNS records", "The user's browser settings", "The user's screen resolution"],
                exp: "High latency can be caused by network congestion, bandwidth saturation, duplex mismatches, failing hardware, or excessive hops. Check interface error counters, utilization stats, and physical connections."
            },
            {
                q: "What is the purpose of the <code>netstat</code> command?",
                opts: ["Resolves DNS names", "Displays active network connections, listening ports, and routing tables", "Tests connectivity to a remote host", "Configures IP settings"],
                exp: "netstat shows active TCP/UDP connections, listening ports, protocol statistics, and the routing table. 'netstat -an' shows all connections in numeric form without DNS resolution."
            },
            {
                q: "You suspect a duplex mismatch between a switch and a server. What symptoms would you expect?",
                opts: ["Complete loss of connectivity", "Slow performance, late collisions, and FCS errors", "Intermittent DNS failures", "IP address conflicts"],
                exp: "A duplex mismatch (one side full-duplex, other half-duplex) causes late collisions, FCS errors, and degraded throughput. Both sides should be set to the same duplex or use auto-negotiation."
            },
            {
                q: "After implementing a fix, what should you do according to the troubleshooting methodology?",
                opts: ["Close the ticket immediately", "Verify full system functionality and implement preventive measures", "Restart all network devices", "Escalate to a senior engineer"],
                exp: "Step 6 is to verify full system functionality and implement preventive measures. Confirming the fix works and checking for side effects prevents premature ticket closure and ensures the root cause is addressed."
            },
            {
                q: "What does <code>ipconfig /flushdns</code> do?",
                opts: ["Releases the DHCP lease", "Clears the local DNS resolver cache", "Resets all network adapters", "Displays the routing table"],
                exp: "ipconfig /flushdns purges the local DNS resolver cache. This forces the system to query DNS servers fresh instead of using cached (potentially stale) records. Useful when DNS records have changed."
            },
            {
                q: "A user can ping their default gateway but not any external IP address. Where is the problem most likely?",
                opts: ["The local NIC is misconfigured", "The user's DNS is incorrect", "The router's connection to the ISP or upstream routing", "The switch port is disabled"],
                exp: "If the user reaches the gateway (local network is fine) but nothing beyond, the issue is upstream: the router's WAN link, ISP connectivity, or a routing table problem on the gateway itself."
            },
            {
                q: "What is the last step in the CompTIA troubleshooting methodology?",
                opts: ["Implement the solution", "Verify full system functionality", "Document findings, actions, and outcomes", "Establish a plan of action"],
                exp: "Step 7 is to document findings, actions taken, and outcomes in the ticketing system. Documentation creates a knowledge base for future troubleshooting and ensures accountability."
            }
        ];

        var current = 0, score = 0, answered = false, TOTAL = questions.length;

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;
            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) { html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>'; }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }

        var QUIZ_ID = 'cr-w4-troubleshoot-quiz';
        // Validate ONE answer server-side via gradeQuiz; key never reaches the client (QC-57).
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { r = (r && r.data) ? r.data : r; return !!(r && r.results && r.results[qIndex] && r.results[qIndex].correct); })
                .catch(function () { return null; });
        }
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking\u2026';
            gradeOne(current, idx).then(function (correct) {
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else { opts[idx].classList.add(correct ? 'correct' : 'incorrect'); if (correct) { score++; } fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect'); fb.textContent = (correct ? 'Correct! ' : 'Incorrect. ') + q.exp; }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }

        function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var resultsCard = document.getElementById('resultsCard'); resultsCard.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) scoreBig.className = 'score-big'; else if (pct >= 70) scoreBig.className = 'score-big mid'; else scoreBig.className = 'score-big low';
            var msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong grasp of troubleshooting methodology and diagnostic tools.';
            else if (pct >= 70) msg = 'Good work — you passed. Review missed questions before the final exam.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the troubleshooting materials and try again.';
            else msg = 'Keep at it. Return to the Week 4 troubleshooting materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') { ModuleProgress.complete('web', 'cr-w4-troubleshoot-quiz', { returnUrl: '../index.html' }); }
        }

        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }

        loadQuestion();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="cr-w4-troubleshoot" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
