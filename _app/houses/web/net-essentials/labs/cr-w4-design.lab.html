<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Topology Selector | Cable Run</title>
    <style>
        :root { --primary:#60a5fa; --accent:#3b82f6; --bg-dark:#0a0a0f; --bg-card:#12121a; --bg-input:#1a1a24; --text-primary:#e2e8f0; --text-secondary:#94a3b8; --success:#22c55e; --danger:#ef4444; --glow:rgba(96,165,250,0.3); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-dark); color:var(--text-primary); min-height:100vh; line-height:1.6; }
        .lab-container { max-width:900px; margin:0 auto; padding:2rem; }
        .lab-header { text-align:center; margin-bottom:2rem; padding:2rem; background:linear-gradient(135deg,var(--bg-card),var(--bg-input)); border-radius:16px; border:1px solid var(--primary); box-shadow:0 0 30px var(--glow); }
        .lab-header h1 { font-size:2rem; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--primary),#93c5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .lab-header .subtitle { color:var(--text-secondary); font-size:1rem; }
        .back-link { display:inline-block; color:var(--primary); text-decoration:none; margin-bottom:1rem; font-size:0.9rem; transition:color 0.2s; }
        .back-link:hover { color:#93c5fd; }
        .score-bar { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; background:var(--bg-card); border-radius:12px; margin-bottom:2rem; border:1px solid rgba(96,165,250,0.15); }
        .score-display { font-size:1.2rem; font-weight:600; color:var(--primary); }
        .btn { padding:10px 24px; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:#2563eb; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid rgba(96,165,250,0.2); margin-left:0.5rem; }
        .btn-ghost:hover { border-color:var(--primary); color:var(--primary); }
        .item-card { padding:1.25rem; background:var(--bg-card); border-radius:12px; margin-bottom:1rem; border:1px solid rgba(96,165,250,0.1); transition:border-color 0.3s; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
        .item-card.correct { border-color:var(--success); background:rgba(34,197,94,0.06); }
        .item-card.incorrect { border-color:var(--danger); background:rgba(239,68,68,0.06); }
        .item-num { display:inline-block; width:32px; height:32px; line-height:32px; text-align:center; border-radius:8px; font-weight:700; font-size:0.9rem; background:rgba(96,165,250,0.15); color:var(--primary); flex-shrink:0; }
        .item-desc { flex:1; min-width:200px; font-size:1rem; }
        .item-selects { display:flex; gap:0.5rem; flex-wrap:wrap; }
        .item-select { padding:8px 14px; background:var(--bg-input); border:1px solid rgba(96,165,250,0.2); border-radius:6px; color:var(--text-primary); font-size:0.9rem; cursor:pointer; }
        .item-select:focus { outline:none; border-color:var(--primary); }
        .item-select:disabled { opacity:0.7; }
        .item-feedback { font-size:0.8rem; width:100%; padding-left:42px; min-height:1.2em; }
        .fb-correct { color:var(--success); }
        .fb-incorrect { color:var(--danger); }
        .complete-banner { display:none; text-align:center; padding:2rem; margin-top:2rem; background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(96,165,250,0.1)); border:1px solid var(--success); border-radius:16px; }
        .complete-banner h2 { color:var(--success); margin-bottom:0.5rem; }
        .complete-btn { margin-top:1rem; padding:12px 32px; background:var(--success); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
        .complete-btn:hover { background:#16a34a; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width:600px) { .item-card { flex-direction:column; align-items:flex-start; } .item-feedback { padding-left:0; } }
    </style>
</head>
<body>
<h1 class="sr-only">Network Topology Selector Lab - Cable Run Week 4</h1>
<div class="lab-container">
    <a href="../index.html" class="back-link">Back to Course Home</a>
    <div class="lab-header">
        <h1>Network Topology Selector</h1>
        <p class="subtitle">Select the best topology and security control for 8 network scenarios</p>
    </div>
    <div class="score-bar">
        <span class="score-display" id="scoreDisplay">Score: 0 / 8</span>
        <div>
            <button class="btn btn-primary" id="submitBtn" onclick="gradeAll()">Submit Answers</button>
            <button class="btn btn-ghost" onclick="resetLab()">Reset</button>
        </div>
    </div>
    <div id="itemList"></div>
    <div class="complete-banner" id="completeBanner">
        <h2>Lab Complete</h2>
        <p id="finalMsg"></p>
        <button class="complete-btn" onclick="markComplete()">Mark Complete &amp; Return</button>
    </div>
</div>
<script>
    var MODULE_ID = 'cr-w4-design-lab';
    var HOUSE_ID = 'web';
    var TOPOLOGIES = ['Star','Mesh','Ring','Hybrid'];
    var CONTROLS = ['VLAN','ACL','Firewall','VPN'];
    var ITEMS = [
        { desc:'A 12-person startup office where all workstations connect to a single central switch and need department-level traffic isolation', topo:'Star', ctrl:'VLAN' },
        { desc:'A data center backbone where every core switch must have redundant paths to every other core switch for maximum fault tolerance', topo:'Mesh', ctrl:'Firewall' },
        { desc:'A multi-building campus with a core distribution layer connecting building-level star networks, requiring encrypted traffic between sites', topo:'Hybrid', ctrl:'VPN' },
        { desc:'A small branch office with 8 devices connected to one switch, where only the finance team should reach the accounting server', topo:'Star', ctrl:'ACL' },
        { desc:'An industrial control network using a token-based protocol where each PLC connects in sequence and traffic must be segmented from the corporate LAN', topo:'Ring', ctrl:'Firewall' },
        { desc:'A regional ISP backbone connecting 5 cities where any single link failure must not disrupt connectivity between remaining sites', topo:'Mesh', ctrl:'ACL' },
        { desc:'A university campus with building-level star networks feeding into a partially meshed core, requiring separate broadcast domains for students, faculty, and guests', topo:'Hybrid', ctrl:'VLAN' },
        { desc:'A remote office with 20 employees who need secure access to headquarters resources over the public internet through a single gateway appliance', topo:'Star', ctrl:'VPN' }
    ];
    var graded = false;

    function buildOpts(arr, label) {
        var html = '<option value="">-- ' + label + ' --</option>';
        arr.forEach(function(v) { html += '<option value="' + v + '">' + v + '</option>'; });
        return html;
    }

    function buildItems() {
        var container = document.getElementById('itemList');
        container.innerHTML = '';
        ITEMS.forEach(function(item, idx) {
            var card = document.createElement('div');
            card.className = 'item-card';
            card.id = 'item-' + idx;
            card.innerHTML =
                '<span class="item-num">' + (idx + 1) + '</span>' +
                '<span class="item-desc">' + item.desc + '</span>' +
                '<div class="item-selects">' +
                    '<select class="item-select" id="topo-' + idx + '">' + buildOpts(TOPOLOGIES, 'Topology') + '</select>' +
                    '<select class="item-select" id="ctrl-' + idx + '">' + buildOpts(CONTROLS, 'Security') + '</select>' +
                '</div>' +
                '<span class="item-feedback" id="fb-' + idx + '"></span>';
            container.appendChild(card);
        });
    }

    function gradeAll() {
        if (graded) return;
        graded = true;
        var score = 0;
        ITEMS.forEach(function(item, idx) {
            var topoSel = document.getElementById('topo-' + idx);
            var ctrlSel = document.getElementById('ctrl-' + idx);
            var fb = document.getElementById('fb-' + idx);
            var card = document.getElementById('item-' + idx);
            topoSel.disabled = true;
            ctrlSel.disabled = true;
            var ok = topoSel.value === item.topo && ctrlSel.value === item.ctrl;
            if (ok) {
                score++;
                card.classList.add('correct');
                fb.textContent = 'Correct';
                fb.className = 'item-feedback fb-correct';
            } else {
                card.classList.add('incorrect');
                fb.textContent = 'Incorrect -- Answer: ' + item.topo + ' / ' + item.ctrl;
                fb.className = 'item-feedback fb-incorrect';
            }
        });
        document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / 8';
        document.getElementById('submitBtn').disabled = true;
        if (score >= 6) {
            var banner = document.getElementById('completeBanner');
            document.getElementById('finalMsg').textContent = 'You scored ' + score + '/8. Network design skills solid!';
            banner.style.display = 'block';
        }
    }

    function resetLab() {
        graded = false;
        document.getElementById('scoreDisplay').textContent = 'Score: 0 / 8';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('completeBanner').style.display = 'none';
        buildItems();
    }

    function markComplete() {
        if (typeof ModuleProgress !== 'undefined') {
            ModuleProgress.complete(HOUSE_ID, MODULE_ID, { returnUrl: '../index.html' });
        }
    }

    buildItems();
</script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="cr-w4-design" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
