<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Calculator | Cable Run</title>
    <style>
        :root { --primary:#60a5fa; --accent:#3b82f6; --bg-dark:#0a0a0f; --bg-card:#12121a; --bg-input:#1a1a24; --text-primary:#e2e8f0; --text-secondary:#94a3b8; --success:#22c55e; --danger:#ef4444; --glow:rgba(96,165,250,0.3); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-dark); color:var(--text-primary); min-height:100vh; line-height:1.6; }
        .lab-container { max-width:900px; margin:0 auto; padding:2rem; }
        .lab-header { text-align:center; margin-bottom:2rem; padding:2rem; background:linear-gradient(135deg,var(--bg-card),var(--bg-input)); border-radius:16px; border:1px solid var(--primary); box-shadow:0 0 30px var(--glow); }
        .lab-header h1 { font-size:2rem; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--primary),#93c5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .lab-header .subtitle { color:var(--text-secondary); font-size:1rem; }
        .back-link { display:inline-block; color:var(--primary); text-decoration:none; margin-bottom:1rem; font-size:0.9rem; transition:color 0.2s; }
        .back-link:hover { color:#93c5fd; }
        .score-bar { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; background:var(--bg-card); border-radius:12px; margin-bottom:2rem; border:1px solid rgba(96,165,250,0.15); }
        .score-display { font-size:1.2rem; font-weight:600; color:var(--primary); }
        .btn { padding:10px 24px; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:#2563eb; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid rgba(96,165,250,0.2); margin-left:0.5rem; }
        .btn-ghost:hover { border-color:var(--primary); color:var(--primary); }
        .problem-card { padding:1.5rem; background:var(--bg-card); border-radius:12px; margin-bottom:1.5rem; border:1px solid rgba(96,165,250,0.1); transition:border-color 0.3s; }
        .problem-card.correct { border-color:var(--success); background:rgba(34,197,94,0.06); }
        .problem-card.incorrect { border-color:var(--danger); background:rgba(239,68,68,0.06); }
        .problem-header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem; }
        .item-num { display:inline-block; width:32px; height:32px; line-height:32px; text-align:center; border-radius:8px; font-weight:700; font-size:0.9rem; background:rgba(96,165,250,0.15); color:var(--primary); flex-shrink:0; }
        .problem-title { font-size:1.05rem; font-weight:600; }
        .problem-title code { background:var(--bg-input); padding:2px 8px; border-radius:4px; font-family:'Consolas',monospace; color:var(--primary); }
        .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
        .field-row { display:flex; flex-direction:column; gap:4px; }
        .field-label { font-size:0.8rem; color:var(--text-secondary); }
        .field-input { padding:8px 12px; background:var(--bg-input); border:1px solid rgba(96,165,250,0.2); border-radius:6px; color:var(--text-primary); font-size:0.9rem; font-family:'Consolas',monospace; }
        .field-input:focus { outline:none; border-color:var(--primary); }
        .field-input:disabled { opacity:0.7; }
        .field-fb { font-size:0.75rem; min-height:1em; }
        .fb-correct { color:var(--success); }
        .fb-incorrect { color:var(--danger); }
        .problem-feedback { font-size:0.85rem; margin-top:0.75rem; min-height:1.2em; }
        .complete-banner { display:none; text-align:center; padding:2rem; margin-top:2rem; background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(96,165,250,0.1)); border:1px solid var(--success); border-radius:16px; }
        .complete-banner h2 { color:var(--success); margin-bottom:0.5rem; }
        .complete-btn { margin-top:1rem; padding:12px 32px; background:var(--success); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
        .complete-btn:hover { background:#16a34a; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width:600px) { .field-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<h1 class="sr-only">Subnet Calculator Lab - Cable Run Week 2</h1>
<div class="lab-container">
    <a href="../index.html" class="back-link">Back to Course Home</a>
    <div class="lab-header">
        <h1>Subnet Calculator</h1>
        <p class="subtitle">Solve 6 subnetting problems -- calculate network, broadcast, usable range, and host count</p>
    </div>
    <div class="score-bar">
        <span class="score-display" id="scoreDisplay">Score: 0 / 6</span>
        <div>
            <button class="btn btn-primary" id="submitBtn" onclick="gradeAll()">Submit Answers</button>
            <button class="btn btn-ghost" onclick="resetLab()">Reset</button>
        </div>
    </div>
    <div id="itemList"></div>
    <div class="complete-banner" id="completeBanner">
        <h2>Lab Complete</h2>
        <p id="finalMsg"></p>
        <button class="complete-btn" onclick="markComplete()">Mark Complete &amp; Return</button>
    </div>
</div>
<script>
    var MODULE_ID = 'cr-w2-addressing-lab';
    var HOUSE_ID = 'web';
    var PROBLEMS = [
        { cidr:'192.168.1.130/25', network:'192.168.1.128', broadcast:'192.168.1.255', first:'192.168.1.129', last:'192.168.1.254', hosts:'126' },
        { cidr:'10.0.0.45/24', network:'10.0.0.0', broadcast:'10.0.0.255', first:'10.0.0.1', last:'10.0.0.254', hosts:'254' },
        { cidr:'172.16.4.100/22', network:'172.16.4.0', broadcast:'172.16.7.255', first:'172.16.4.1', last:'172.16.7.254', hosts:'1022' },
        { cidr:'10.10.10.200/28', network:'10.10.10.192', broadcast:'10.10.10.207', first:'10.10.10.193', last:'10.10.10.206', hosts:'14' },
        { cidr:'192.168.50.67/26', network:'192.168.50.64', broadcast:'192.168.50.127', first:'192.168.50.65', last:'192.168.50.126', hosts:'62' },
        { cidr:'172.20.128.10/20', network:'172.20.128.0', broadcast:'172.20.143.255', first:'172.20.128.1', last:'172.20.143.254', hosts:'4094' }
    ];
    var FIELDS = [
        { key:'network', label:'Network Address' },
        { key:'broadcast', label:'Broadcast Address' },
        { key:'first', label:'First Usable Host' },
        { key:'last', label:'Last Usable Host' },
        { key:'hosts', label:'Number of Usable Hosts' }
    ];
    var graded = false;

    function buildItems() {
        var container = document.getElementById('itemList');
        container.innerHTML = '';
        PROBLEMS.forEach(function(prob, idx) {
            var card = document.createElement('div');
            card.className = 'problem-card';
            card.id = 'prob-' + idx;
            var fieldsHtml = '';
            FIELDS.forEach(function(f) {
                fieldsHtml +=
                    '<div class="field-row">' +
                        '<label class="field-label">' + f.label + '</label>' +
                        '<input class="field-input" id="f-' + idx + '-' + f.key + '" type="text" placeholder="' + f.label + '">' +
                        '<span class="field-fb" id="ffb-' + idx + '-' + f.key + '"></span>' +
                    '</div>';
            });
            card.innerHTML =
                '<div class="problem-header">' +
                    '<span class="item-num">' + (idx + 1) + '</span>' +
                    '<span class="problem-title">Given: <code>' + prob.cidr + '</code></span>' +
                '</div>' +
                '<div class="field-grid">' + fieldsHtml + '</div>' +
                '<div class="problem-feedback" id="pfb-' + idx + '"></div>';
            container.appendChild(card);
        });
    }

    function gradeAll() {
        if (graded) return;
        graded = true;
        var score = 0;
        PROBLEMS.forEach(function(prob, idx) {
            var allCorrect = true;
            FIELDS.forEach(function(f) {
                var inp = document.getElementById('f-' + idx + '-' + f.key);
                var fb = document.getElementById('ffb-' + idx + '-' + f.key);
                inp.disabled = true;
                var val = inp.value.trim();
                if (val === prob[f.key]) {
                    fb.textContent = 'Correct';
                    fb.className = 'field-fb fb-correct';
                } else {
                    allCorrect = false;
                    fb.textContent = 'Answer: ' + prob[f.key];
                    fb.className = 'field-fb fb-incorrect';
                }
            });
            var card = document.getElementById('prob-' + idx);
            if (allCorrect) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('incorrect');
            }
        });
        document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / 6';
        document.getElementById('submitBtn').disabled = true;
        if (score >= 4) {
            var banner = document.getElementById('completeBanner');
            document.getElementById('finalMsg').textContent = 'You scored ' + score + '/6. Subnetting fundamentals locked in!';
            banner.style.display = 'block';
        }
    }

    function resetLab() {
        graded = false;
        document.getElementById('scoreDisplay').textContent = 'Score: 0 / 6';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('completeBanner').style.display = 'none';
        buildItems();
    }

    function markComplete() {
        if (typeof ModuleProgress !== 'undefined') {
            ModuleProgress.complete(HOUSE_ID, MODULE_ID, { returnUrl: '../index.html' });
        }
    }

    buildItems();
</script>
</body>
</html>
