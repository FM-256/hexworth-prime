<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troubleshooting Simulator | Cable Run</title>
    <style>
        :root { --primary:#60a5fa; --accent:#3b82f6; --bg-dark:#0a0a0f; --bg-card:#12121a; --bg-input:#1a1a24; --text-primary:#e2e8f0; --text-secondary:#94a3b8; --success:#22c55e; --danger:#ef4444; --glow:rgba(96,165,250,0.3); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-dark); color:var(--text-primary); min-height:100vh; line-height:1.6; }
        .lab-container { max-width:900px; margin:0 auto; padding:2rem; }
        .lab-header { text-align:center; margin-bottom:2rem; padding:2rem; background:linear-gradient(135deg,var(--bg-card),var(--bg-input)); border-radius:16px; border:1px solid var(--primary); box-shadow:0 0 30px var(--glow); }
        .lab-header h1 { font-size:2rem; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--primary),#93c5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .lab-header .subtitle { color:var(--text-secondary); font-size:1rem; }
        .back-link { display:inline-block; color:var(--primary); text-decoration:none; margin-bottom:1rem; font-size:0.9rem; transition:color 0.2s; }
        .back-link:hover { color:#93c5fd; }
        .score-bar { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; background:var(--bg-card); border-radius:12px; margin-bottom:2rem; border:1px solid rgba(96,165,250,0.15); }
        .score-display { font-size:1.2rem; font-weight:600; color:var(--primary); }
        .btn { padding:10px 24px; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:#2563eb; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid rgba(96,165,250,0.2); margin-left:0.5rem; }
        .btn-ghost:hover { border-color:var(--primary); color:var(--primary); }
        .item-card { padding:1.25rem; background:var(--bg-card); border-radius:12px; margin-bottom:1rem; border:1px solid rgba(96,165,250,0.1); transition:border-color 0.3s; }
        .item-card.correct { border-color:var(--success); background:rgba(34,197,94,0.06); }
        .item-card.incorrect { border-color:var(--danger); background:rgba(239,68,68,0.06); }
        .item-top { display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.75rem; }
        .item-num { display:inline-block; width:32px; height:32px; line-height:32px; text-align:center; border-radius:8px; font-weight:700; font-size:0.9rem; background:rgba(96,165,250,0.15); color:var(--primary); flex-shrink:0; }
        .item-desc { flex:1; font-size:1rem; }
        .item-symptoms { font-size:0.85rem; color:var(--text-secondary); margin-top:4px; font-style:italic; }
        .select-row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; padding-left:42px; }
        .select-label { font-size:0.8rem; color:var(--text-secondary); min-width:50px; }
        .item-select { padding:8px 14px; background:var(--bg-input); border:1px solid rgba(96,165,250,0.2); border-radius:6px; color:var(--text-primary); font-size:0.9rem; cursor:pointer; }
        .item-select:focus { outline:none; border-color:var(--primary); }
        .item-select:disabled { opacity:0.7; }
        .item-feedback { font-size:0.8rem; padding-left:42px; margin-top:0.5rem; min-height:1.2em; }
        .fb-correct { color:var(--success); }
        .fb-incorrect { color:var(--danger); }
        .complete-banner { display:none; text-align:center; padding:2rem; margin-top:2rem; background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(96,165,250,0.1)); border:1px solid var(--success); border-radius:16px; }
        .complete-banner h2 { color:var(--success); margin-bottom:0.5rem; }
        .complete-btn { margin-top:1rem; padding:12px 32px; background:var(--success); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
        .complete-btn:hover { background:#16a34a; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width:600px) { .select-row { padding-left:0; flex-direction:column; } }
    </style>
</head>
<body>
<h1 class="sr-only">Troubleshooting Simulator Lab - Cable Run Week 4</h1>
<div class="lab-container">
    <a href="../index.html" class="back-link">Back to Course Home</a>
    <div class="lab-header">
        <h1>Troubleshooting Simulator</h1>
        <p class="subtitle">Diagnose 8 network problems -- select the correct tool and root cause</p>
    </div>
    <div class="score-bar">
        <span class="score-display" id="scoreDisplay">Score: 0 / 8</span>
        <div>
            <button class="btn btn-primary" id="submitBtn" onclick="gradeAll()">Submit Answers</button>
            <button class="btn btn-ghost" onclick="resetLab()">Reset</button>
        </div>
    </div>
    <div id="itemList"></div>
    <div class="complete-banner" id="completeBanner">
        <h2>Lab Complete</h2>
        <p id="finalMsg"></p>
        <button class="complete-btn" onclick="markComplete()">Mark Complete &amp; Return</button>
    </div>
</div>
<script>
    var MODULE_ID = 'cr-w4-troubleshoot-lab';
    var HOUSE_ID = 'web';
    var TOOLS = ['ping','traceroute','nslookup','ipconfig/ifconfig','netstat','nmap','wireshark','arp'];
    var CAUSES = [
        'DNS resolution failure',
        'Incorrect subnet mask',
        'Default gateway misconfigured',
        'Duplicate IP address',
        'Firewall blocking traffic',
        'Cable/physical layer fault',
        'DHCP server unavailable',
        'Routing loop'
    ];
    var ITEMS = [
        {
            desc:'A user cannot access any websites by name but can reach them by IP address.',
            symptoms:'Browser shows "server not found" for all domains. Ping 8.8.8.8 succeeds. Ping google.com fails.',
            tool:'nslookup',
            cause:'DNS resolution failure'
        },
        {
            desc:'A workstation receives a 169.254.x.x address after booting and cannot reach any network resources.',
            symptoms:'ipconfig shows APIPA address. No default gateway assigned. Other devices on the same switch work fine.',
            tool:'ipconfig/ifconfig',
            cause:'DHCP server unavailable'
        },
        {
            desc:'Two devices on the same subnet intermittently lose connectivity, with both showing the same IP in ARP tables.',
            symptoms:'Connection drops randomly. ARP table shows MAC address flapping for one IP. One device was recently added with a static IP.',
            tool:'arp',
            cause:'Duplicate IP address'
        },
        {
            desc:'A user can ping devices on the local subnet but cannot reach any remote networks or the internet.',
            symptoms:'Ping to 192.168.1.1 (local router) fails. Ping to 192.168.1.50 (local server) succeeds. ipconfig shows 0.0.0.0 for gateway.',
            tool:'ipconfig/ifconfig',
            cause:'Default gateway misconfigured'
        },
        {
            desc:'Packets to a remote server take an unusually long time and appear to loop between two routers before timing out.',
            symptoms:'Traceroute shows hops alternating between 10.0.1.1 and 10.0.2.1 repeatedly. TTL expires after 30 hops. No destination reached.',
            tool:'traceroute',
            cause:'Routing loop'
        },
        {
            desc:'A newly installed server is running a web application on port 8080 but external clients cannot connect.',
            symptoms:'curl from localhost succeeds. curl from another machine times out. The server OS firewall was recently hardened.',
            tool:'netstat',
            cause:'Firewall blocking traffic'
        },
        {
            desc:'A switch port link light is off and the connected workstation shows "network cable unplugged" despite a cable being inserted.',
            symptoms:'No link LED on switch or NIC. Tried different switch ports with same result. Other cables on adjacent ports work.',
            tool:'ping',
            cause:'Cable/physical layer fault'
        },
        {
            desc:'A host can ping some devices on a /24 network but not others, even though all devices are on the same physical switch.',
            symptoms:'Host IP is 10.0.0.50/16. Target devices are 10.0.0.x/24. Host can reach 10.0.1.x devices on a different VLAN.',
            tool:'ipconfig/ifconfig',
            cause:'Incorrect subnet mask'
        }
    ];
    var graded = false;

    function buildOpts(arr, label) {
        var html = '<option value="">-- ' + label + ' --</option>';
        arr.forEach(function(v) { html += '<option value="' + v + '">' + v + '</option>'; });
        return html;
    }

    function buildItems() {
        var container = document.getElementById('itemList');
        container.innerHTML = '';
        ITEMS.forEach(function(item, idx) {
            var card = document.createElement('div');
            card.className = 'item-card';
            card.id = 'item-' + idx;
            card.innerHTML =
                '<div class="item-top">' +
                    '<span class="item-num">' + (idx + 1) + '</span>' +
                    '<div class="item-desc">' + item.desc +
                        '<div class="item-symptoms">Symptoms: ' + item.symptoms + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="select-row">' +
                    '<span class="select-label">Tool:</span>' +
                    '<select class="item-select" id="tool-' + idx + '">' + buildOpts(TOOLS, 'Tool') + '</select>' +
                    '<span class="select-label">Cause:</span>' +
                    '<select class="item-select" id="cause-' + idx + '">' + buildOpts(CAUSES, 'Root Cause') + '</select>' +
                '</div>' +
                '<div class="item-feedback" id="fb-' + idx + '"></div>';
            container.appendChild(card);
        });
    }

    function gradeAll() {
        if (graded) return;
        graded = true;
        var score = 0;
        ITEMS.forEach(function(item, idx) {
            var toolSel = document.getElementById('tool-' + idx);
            var causeSel = document.getElementById('cause-' + idx);
            var fb = document.getElementById('fb-' + idx);
            var card = document.getElementById('item-' + idx);
            toolSel.disabled = true;
            causeSel.disabled = true;
            var ok = toolSel.value === item.tool && causeSel.value === item.cause;
            if (ok) {
                score++;
                card.classList.add('correct');
                fb.textContent = 'Correct';
                fb.className = 'item-feedback fb-correct';
            } else {
                card.classList.add('incorrect');
                fb.textContent = 'Incorrect -- Answer: ' + item.tool + ' / ' + item.cause;
                fb.className = 'item-feedback fb-incorrect';
            }
        });
        document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / 8';
        document.getElementById('submitBtn').disabled = true;
        if (score >= 6) {
            var banner = document.getElementById('completeBanner');
            document.getElementById('finalMsg').textContent = 'You scored ' + score + '/8. Troubleshooting instincts sharp!';
            banner.style.display = 'block';
        }
    }

    function resetLab() {
        graded = false;
        document.getElementById('scoreDisplay').textContent = 'Score: 0 / 8';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('completeBanner').style.display = 'none';
        buildItems();
    }

    function markComplete() {
        if (typeof ModuleProgress !== 'undefined') {
            ModuleProgress.complete(HOUSE_ID, MODULE_ID, { returnUrl: '../index.html' });
        }
    }

    buildItems();
</script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="cr-w4-troubleshoot" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
