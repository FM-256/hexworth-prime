<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NE-07 NAT: Palo Alto PA-220 Firewall GUI Lab</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #090910; color: #eef2ff; }
        .lab-nav { padding: 12px 20px; background: #0d1117; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 16px; align-items: center; }
        .lab-nav a { color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .lab-nav a:hover { color: #06b6d4; }
        .lab-nav .lab-badge { background: rgba(6,182,212,0.15); color: #06b6d4; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.5px; }
        #lab-container { width: 100%; min-height: calc(100vh - 50px); }
    
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
<body>
    <h1 class="sr-only">NE-07 NAT: Palo Alto PA-220 Firewall GUI Lab</h1>
    <nav class="lab-nav">
        <a href="../network-plus/index.html">&larr; Network+ Hub</a>
        <a href="../index.html">Web House</a>
        <span class="lab-badge">NE-07 NAT LAB</span>
    </nav>
    <div id="lab-container"></div>
    <script src="engine/GUILabEngine.js"></script>
    <script src="configs/gui-ne07-paloalto.config.js"></script>
    <script>
        var container = document.getElementById('lab-container');
        if (container && typeof GUILabEngine !== 'undefined' && typeof GUI_NE07_PALOALTO_CONFIG !== 'undefined') {
            GUILabEngine.init(GUI_NE07_PALOALTO_CONFIG, container);
        }
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="web-ne07-paloalto-gui" house="web"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
