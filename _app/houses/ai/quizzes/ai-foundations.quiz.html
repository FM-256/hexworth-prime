    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1025 0%, #2d1b45 50%, #1a1025 100%);
            display: flex;

        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #8b5cf633;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;

            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;

            padding: 30px 20px;
        }

</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Machine</a>
        <span class="brand"><span>&#129302;</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'AI Foundations Challenge',
            description: 'Test your knowledge of ai foundations',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai-foundations',
            moduleId: 'foundations',
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'Which of the following is the most accurate definition of an AI agent?',
                    options: [
                        'A chatbot that answers user questions through a web interface',
                        'A software system that perceives its environment, reasons about goals, and takes actions to achieve them autonomously',
                        'A machine learning model trained on labelled data to make predictions',
                        'A robotic process automation script that executes pre-defined steps'
                    ],
                    correct: 1,
                    explanation: 'An AI agent is defined by three behaviours in combination: it perceives (observes state from its environment), reasons (uses an LLM or planning algorithm to decide what to do), and acts (calls tools, modifies state, or escalates). A chatbot that only answers questions is reactive; an RPA script has no reasoning capability; a prediction model produces outputs but does not act on them.'
                },
                {
                    question: 'A reactive agent differs from a deliberative agent primarily because it:',
                    options: [
                        'Uses a larger language model for reasoning',
                        'Responds directly to current percepts without maintaining an internal model of the world',
                        'Requires internet access to retrieve external knowledge',
                        'Can only execute one tool at a time'
                    ],
                    correct: 1,
                    explanation: 'Reactive agents map inputs to outputs in real time using condition-action rules — there is no persistent world model or planning step. Deliberative agents maintain an internal model, reason about future states, and plan sequences of actions before acting. Model size, internet access, and tool parallelism are independent architectural choices unrelated to this distinction.'
                },
                {
                    question: 'A hybrid agent architecture combines which two design patterns?',
                    options: [
                        'Supervised learning and reinforcement learning',
                        'Reactive responses for low-latency tasks and deliberative planning for complex goal-directed tasks',
                        'Cloud execution and on-device inference',
                        'Text-based reasoning and image-based reasoning'
                    ],
                    correct: 1,
                    explanation: 'Hybrid agents layer a reactive tier (fast, stimulus-response) on top of a deliberative tier (slower, goal-directed planning). This gives them the speed of reactive systems for routine percepts while retaining the strategic capability of deliberative systems for complex multi-step problems. The other options describe orthogonal design choices not related to the reactive/deliberative distinction.'
                },
                {
                    question: 'What fundamentally separates an AI agent from a conventional AI chatbot?',
                    options: [
                        'Agents use more parameters in their underlying model',
                        'Chatbots require cloud hosting while agents run locally',
                        'Agents can take actions in external systems and pursue multi-step goals, not just generate text',
                        'Agents respond faster because they use smaller context windows'
                    ],
                    correct: 2,
                    explanation: 'The critical distinction is agency — the ability to act on the world. A chatbot generates tokens in response to a prompt and stops. An agent perceives state, decides on a plan, calls external tools (APIs, databases, browsers, code interpreters), and iterates until a goal is met. Model size, hosting location, and context window size are implementation details, not definitional criteria.'
                },
                {
                    question: 'Which of these is the best real-world example of an AI agent (as opposed to a simpler automation or chatbot)?',
                    options: [
                        'A spell checker that highlights misspelled words',
                        'A customer service bot that answers FAQs from a static knowledge base',
                        'A system that monitors a security dashboard, identifies anomalies, queries a threat-intel API, and files an incident ticket — all without human prompting',
                        'A recommendation engine that surfaces products based on purchase history'
                    ],
                    correct: 2,
                    explanation: 'The security monitoring example exhibits all three agent behaviours: perceiving (reading the dashboard), reasoning (identifying anomalies and deciding to query threat intel), and acting (filing the ticket). The spell checker is a deterministic function; the FAQ bot is a lookup system; the recommendation engine generates outputs but does not take actions in external systems.'
                },
                {
                    question: 'According to the Automation Rubric, what is the correct sequence before applying the four scoring criteria to a task?',
                    options: [
                        'Build a prototype, test it, then decide whether to invest further',
                        'Document the task as it exists today, optimize it to remove unnecessary steps, then evaluate it with the rubric',
                        'Score the task first, then document it if the score is high enough to justify the effort',
                        'Assign the task to a vendor tool and see whether adoption is successful'
                    ],
                    correct: 1,
                    explanation: 'The rubric follows a strict Document → Optimize → Evaluate sequence. Automating without documenting produces blind spots; automating without optimizing amplifies existing inefficiencies at speed. Only after the process is clean and well-understood should you score it for automation potential. Skipping Step 2 (Optimize) is explicitly called out as the most common mistake.'
                },
                {
                    question: 'The Automation Rubric scores tasks across four dimensions. Which set of four is correct?',
                    options: [
                        'Cost, Speed, Accuracy, Scalability',
                        'Frequency, Rule-Clarity, Error Tolerance, and Strategic Value',
                        'Data Volume, Latency, Complexity, and Compliance Risk',
                        'ROI, Headcount Reduction, Integration Cost, and Maintenance Burden'
                    ],
                    correct: 1,
                    explanation: 'The four rubric criteria are: Frequency (how often does the task occur?), Rule-Clarity (can the task be expressed as unambiguous rules?), Error Tolerance (what is the cost of a mistake?), and Strategic Value (does a human expert add unique judgement?). The other options mix in valid engineering metrics but do not match the rubric framework.'
                },
                {
                    question: 'A task scores 18 out of 20 on the Automation Rubric. What is the appropriate recommendation?',
                    options: [
                        'Human ownership — the score suggests high strategic value that requires expert judgement',
                        'Agent-assist — a human should remain in the loop for final approval',
                        'Full automation — the high score indicates the task is well-suited for autonomous execution',
                        'Defer the decision — the task needs more documentation before a recommendation can be made'
                    ],
                    correct: 2,
                    explanation: 'The rubric produces three recommendation zones: scores of 16-20 indicate full automation is appropriate (high frequency, clear rules, low error cost, low strategic value of human judgement); 10-15 suggest an agent-assist model; below 10 indicates human ownership is required. A score of 18 falls squarely in the automate zone.'
                },
                {
                    question: 'Which type of task would score lowest on the Rule-Clarity dimension of the rubric?',
                    options: [
                        'Renaming downloaded files according to a date-based naming convention',
                        'Routing inbound emails to the correct department folder based on subject keywords',
                        'Deciding whether a novel legal contract clause poses an unacceptable business risk',
                        'Generating a weekly sales summary from structured database records'
                    ],
                    correct: 2,
                    explanation: 'Rule-Clarity measures how precisely you can specify the task as deterministic rules. Evaluating novel legal risk requires expert judgement, implicit context, and weighing competing considerations — it cannot be fully expressed as rules. File renaming, email routing, and report generation are all tasks with clear, articulable rules, even if they involve some variability.'
                },
                {
                    question: 'The Error Tolerance dimension scores high (favouring automation) when:',
                    options: [
                        'Mistakes are easily reversible and have low downstream cost',
                        'The task involves sensitive personal data that must be handled carefully',
                        'A human expert would catch errors before they reach the customer',
                        'The automated system can escalate to a human when it detects uncertainty'
                    ],
                    correct: 0,
                    explanation: 'Error Tolerance is specifically about the cost of a mistake made by the automation. When errors are cheap to detect and reverse (e.g. a mis-formatted report, a misrouted non-urgent email), automation is low risk. When errors are irreversible, dangerous, or legally consequential (e.g. a medical dosage recommendation, a financial transaction), the score drops and human oversight is required. The other options describe mitigations, not the dimension itself.'
                },
                {
                    question: 'The three-component model of an AI agent consists of:',
                    options: [
                        'Input, Processing, and Output',
                        'Brain (LLM), Memory, and Tools',
                        'Perception, Reasoning, and Execution',
                        'Training Data, Model Weights, and Inference Engine'
                    ],
                    correct: 1,
                    explanation: 'Every AI agent is composed of three pillars: the Brain (the LLM that reasons and plans), Memory (storage that persists context across steps and sessions), and Tools (external integrations the agent can invoke to act on the world). "Input/Processing/Output" and "Perception/Reasoning/Execution" describe generic system or cognitive models, not the specific agent architecture taught in the module.'
                },
                {
                    question: 'In the agent components model, what is the primary role of the Brain (LLM)?',
                    options: [
                        'To store long-term facts and retrieve them when needed',
                        'To execute API calls and browser automation scripts',
                        'To reason about the current state, plan what to do next, and decide which tools to call',
                        'To enforce safety guardrails and block harmful outputs'
                    ],
                    correct: 2,
                    explanation: 'The Brain is the reasoning and planning engine. It interprets the current state (from memory + current percepts), generates a plan, and decides which tools to invoke and in what order. Long-term storage is the Memory component. Executing API calls is the Tools layer. Safety guardrails are a separate architectural concern layered on top of the Brain.'
                },
                {
                    question: 'Which of the following is an example of episodic memory in an AI agent?',
                    options: [
                        'A system prompt that describes the agent\'s role and permanent rules',
                        'A vector database indexed on domain knowledge documents',
                        'A log of previous conversation turns stored in the context window for the current session',
                        'A cache of API responses stored to reduce redundant network calls'
                    ],
                    correct: 2,
                    explanation: 'Episodic memory stores sequences of past events — specifically the conversation history or action log for the current session. A system prompt is static/semantic memory. A vector knowledge base is semantic long-term memory. An API response cache is an infrastructure optimisation, not an episodic record.'
                },
                {
                    question: 'What distinguishes semantic memory from episodic memory in an agent?',
                    options: [
                        'Semantic memory is faster to query; episodic memory has higher accuracy',
                        'Semantic memory stores general facts and knowledge; episodic memory stores the sequence of specific past events and interactions',
                        'Semantic memory is stored on-device; episodic memory requires cloud storage',
                        'Semantic memory is set at training time and cannot change; episodic memory is always deleted after each session'
                    ],
                    correct: 1,
                    explanation: 'Semantic memory holds what the agent knows — facts, concepts, domain knowledge, and long-term learned associations. Episodic memory holds what the agent experienced — the ordered history of events, tool calls, and conversation turns. Query speed, storage location, and update mechanics are implementation details that vary by architecture.'
                },
                {
                    question: 'In the agent loop, the correct order of the four core phases is:',
                    options: [
                        'Think → Observe → Act → Store',
                        'Observe → Think → Act → Store',
                        'Act → Observe → Store → Think',
                        'Store → Think → Observe → Act'
                    ],
                    correct: 1,
                    explanation: 'The canonical agent loop is: Observe (gather current state from environment + memory), Think (the LLM reasons and plans), Act (invoke a tool or produce output), Store (write relevant results back to memory). The loop then repeats from Observe. This ordering is critical — acting before thinking or storing before acting produces unreliable behaviour.'
                },
                {
                    question: 'Which statement best describes the Tools layer of an agent?',
                    options: [
                        'The prompting templates and few-shot examples given to the LLM',
                        'The inference infrastructure (GPUs, serving endpoints) that runs the model',
                        'The set of external integrations the agent can invoke to read or write information beyond its context window',
                        'The safety filters that prevent the agent from producing harmful outputs'
                    ],
                    correct: 2,
                    explanation: 'Tools are how an agent reaches beyond its context window to interact with the real world — calling APIs, querying databases, executing code, browsing the web, reading files, or sending notifications. Without tools, an agent can only reason about what is in its current context. Prompting templates belong to the Brain configuration; serving infrastructure is platform-level; safety filters are a guardrails layer.'
                },
                {
                    question: 'A company deploys an agent that researches a topic by querying search APIs, stores interim findings in a scratch-pad, and writes a final report. Which component is primarily responsible for deciding when to search versus when to write?',
                    options: [
                        'The Tools layer, which dispatches API calls based on input triggers',
                        'The Memory layer, which tracks which information has already been gathered',
                        'The Brain (LLM), which plans the overall research strategy and decides the next action at each step',
                        'The Storage layer, which signals when the scratch-pad is full'
                    ],
                    correct: 2,
                    explanation: 'Strategic decision-making — including deciding whether to gather more information or synthesise what has been collected — is the responsibility of the Brain. The Tools layer executes the decisions; the Memory layer stores context; neither has the agency to initiate or switch strategies on its own. The Brain is the only component that plans and chooses.'
                },
                {
                    question: 'Why does context window size matter for an agent\'s effective memory?',
                    options: [
                        'Larger context windows increase the cost of each tool call',
                        'The agent can only reason about information currently in its context window, so facts outside it must be retrieved from external memory systems',
                        'Context window size determines how many tools an agent can call per minute',
                        'Smaller context windows make the agent more likely to hallucinate'
                    ],
                    correct: 1,
                    explanation: 'An LLM can only reason about what is currently in its context window. Any information outside that window — long conversation histories, large knowledge bases, previous session results — is invisible to the model unless explicitly retrieved and inserted. This is why the Memory component exists: to persist information and surface relevant portions into context when needed.'
                },
                {
                    question: 'A security operations team wants to automate Tier-1 alert triage. An analyst reviews 200 alerts per day using documented SOC playbooks. Most alerts are resolved by checking three databases and closing if no match is found. What rubric recommendation applies?',
                    options: [
                        'Human ownership — security decisions carry too much risk for automation',
                        'Agent-assist — an agent should flag alerts but humans must approve every closure',
                        'Full automation — the task scores high on frequency, rule-clarity, and low strategic-value criteria',
                        'Defer — the process needs to be documented before a recommendation is possible'
                    ],
                    correct: 2,
                    explanation: 'This task scores highly across all four rubric dimensions: Frequency (200/day is very high), Rule-Clarity (documented playbooks = clear rules), Error Tolerance (closing a false alert is reversible — missed critical alerts can be caught at Tier-2), Strategic Value (routine database checks add little unique human judgement). Full automation with appropriate escalation paths is the correct recommendation.'
                },
                {
                    question: 'Which agent design would be most appropriate for a task that requires reviewing customer contracts for non-standard clauses, a task that is performed infrequently and requires legal expertise?',
                    options: [
                        'A fully autonomous agent that reviews and flags contracts without human review',
                        'An agent-assist model where the agent pre-processes and highlights clauses but a human lawyer makes all final determinations',
                        'No automation — this task cannot benefit from AI in any form',
                        'A reactive agent that applies pre-defined keyword rules to flag specific phrases'
                    ],
                    correct: 1,
                    explanation: 'Legal contract review scores low on the automation rubric (infrequent, low rule-clarity for novel clauses, high error cost, high strategic value of expert judgement). However, an agent-assist model is appropriate: the agent handles the routine extraction and pre-screening work, surfacing relevant clauses for expert review. Fully autonomous review would be high-risk; pure keyword matching has no reasoning capability; claiming no AI benefit ignores the genuine value of pre-processing.'
                },
                {
                    question: 'An agent is asked: "Book a flight to Paris next week, confirm my calendar is clear, and email my manager the itinerary." During execution it discovers a calendar conflict. What should a well-designed agent do?',
                    options: [
                        'Ignore the conflict and complete the booking as instructed',
                        'Abort the entire task and wait for a new instruction',
                        'Stop only the flight booking step and proceed with the email',
                        'Pause, store the conflict as context, and escalate to the user with relevant details before proceeding'
                    ],
                    correct: 3,
                    explanation: 'A well-designed agent uses the Observe-Think-Act loop to handle unexpected state. When it detects a blocker (the conflict), it should: (1) store the finding in memory, (2) reason that proceeding without user knowledge could cause harm, and (3) escalate with the specific details needed for a decision. Ignoring the conflict or aborting entirely both represent failures. Selectively skipping steps without informing the user breaks transparency.'
                },
                {
                    question: 'A colleague argues: "We should automate our invoicing process — it would save time." According to the Automation Rubric pre-work, what is the correct first response?',
                    options: [
                        'Immediately evaluate the invoicing process against the four rubric criteria',
                        'Request a budget estimate from a vendor for the automation tooling',
                        'Ask them to document every step of the current process before any evaluation begins',
                        'Pilot the automation with one customer and measure time savings'
                    ],
                    correct: 2,
                    explanation: 'The rubric mandates Document → Optimize → Evaluate. The very first action is always documentation — mapping every step of the process as it actually works today. Without this, the rubric cannot be applied accurately, you cannot identify optimisation opportunities, and you risk automating a process that has unnecessary or redundant steps baked in. Piloting, vendor evaluation, and criteria scoring all come after documentation.'
                },
                {
                    question: 'An AI agent built to answer support tickets can only remember the last 5 messages before context is cut off. This is a limitation of which component?',
                    options: [
                        'The Tools layer — the agent needs better API integrations',
                        'The Brain — the LLM should be retrained on support data',
                        'The Memory layer — specifically the lack of external memory to supplement the context window',
                        'The agent loop — the Observe phase is not running frequently enough'
                    ],
                    correct: 2,
                    explanation: 'The symptom — forgetting information beyond a fixed window — is a Memory limitation. The solution is not to retrain the model or improve APIs but to implement an external memory system (e.g. a conversation store that summarises and injects relevant history into each new context window). Context window limits are a constraint of the Brain, but the architectural response is to extend the Memory layer.'
                },
                {
                    question: 'Retrieval-Augmented Generation (RAG) is best described as a technique that extends which agent component?',
                    options: [
                        'The Brain — it increases the parameter count of the underlying LLM',
                        'The Tools layer — it replaces web-search tools with an internal database',
                        'The Memory layer — it retrieves relevant documents at inference time and injects them into the context window',
                        'The agent loop — it adds a separate retrieval phase between Act and Store'
                    ],
                    correct: 2,
                    explanation: 'RAG is a Memory architecture pattern. Instead of fine-tuning the model (which would modify the Brain) or replacing tools, RAG adds a retrieval step: when a question is received, a semantic search is run against an external vector store and the most relevant document chunks are inserted into the context window before the LLM generates a response. This is a Memory extension, not a Brain or Tools change.'
                },
                {
                    question: 'An agent is processing a customer refund request. After checking the order history, the agent determines the refund is eligible but notices the customer\'s account is flagged for suspected fraud. What principle should guide the agent\'s next action?',
                    options: [
                        'Complete the refund automatically — the eligibility check passed',
                        'Deny the refund automatically — the fraud flag overrides eligibility',
                        'Pause and escalate to a human operator with both the eligibility result and the fraud flag as context',
                        'Ignore the fraud flag — it is outside the scope of the current task'
                    ],
                    correct: 2,
                    explanation: 'When an agent encounters a decision that has conflicting signals and significant consequences, the correct behaviour is to escalate with full context rather than resolve the ambiguity autonomously. This reflects the human-in-the-loop principle: the agent surfaces the relevant facts (eligible + fraud flagged) and defers the judgement call to a human. Auto-approving risks fraud loss; auto-denying risks an incorrect block; ignoring data is never appropriate.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
