<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Machine</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-robot.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>

    <main class="quiz-wrapper">

    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Agent Builder Challenge',
            description: 'Test your knowledge of agent builder',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai-builder',
            moduleId: 'builder',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'In Zapier terminology, what is a "Zap"?',
                    options: [
                        'A single action that transforms data within a workflow',
                        'An automated workflow consisting of a Trigger and one or more Actions',
                        'A dashboard for monitoring active integrations',
                        'A built-in AI model used inside Zapier workflows'
                    ],explanation: 'A Zap is Zapier\'s name for an automated workflow. It always starts with a Trigger (an event that kicks off the workflow) and is followed by one or more Actions (tasks to perform). Think of it as an if-this-then-that rule between apps.'
                },
                {
                    question: 'N8N is described as "source-available" and self-hostable. What is the primary practical advantage this gives enterprises over fully SaaS-only tools?',
                    options: [
                        'N8N executes workflows faster because it runs locally',
                        'Sensitive data never leaves the organization\'s own infrastructure',
                        'N8N supports more app integrations than any other platform',
                        'Self-hosting eliminates the need for API keys'
                    ],explanation: 'The decisive enterprise advantage is data sovereignty. When N8N runs on your own servers, credentials, payloads, and intermediate data never travel through a third-party SaaS vendor\'s infrastructure — critical for regulated industries handling PII, PHI, or classified data.'
                },
                {
                    question: 'Make (formerly Integromat) organizes its workflows as visual "scenarios." Which concept below best describes how Make handles branching logic?',
                    options: [
                        'Routers — a module that splits one execution path into multiple parallel or conditional branches',
                        'Filters — nodes that stop execution if a condition is not met, with no branching capability',
                        'Webhooks — external signals that choose which branch runs',
                        'Iterations — loops that repeat a branch until a counter expires'
                    ],explanation: 'Make uses Router modules to split a scenario into multiple branches. Each branch can have its own filter condition, making true conditional fan-out possible in a visual canvas. Filters exist too, but they only gate a single path — they don\'t branch.'
                },
                {
                    question: 'You are building a Zapier workflow that processes 10,000 records per hour. Zapier\'s free plan has a 100-task/month limit. What is the most appropriate next step?',
                    options: [
                        'Enable Zapier\'s "burst mode" setting to bypass limits',
                        'Upgrade to a paid plan with higher task limits, or migrate to a self-hosted tool like N8N',
                        'Add a delay step to throttle execution to 100 records per hour',
                        'Split the workload across 100 different Zaps to distribute task counts'
                    ],explanation: 'Task limits are per-plan, not per-Zap. Splitting across Zaps does not reduce total task consumption. For high-volume workloads, upgrading to a paid Zapier tier or moving to a self-hosted platform (N8N, Prefect) with no per-execution billing is the correct architectural decision.'
                },
                {
                    question: 'Which N8N node type allows you to write arbitrary JavaScript inside a workflow without leaving the N8N editor?',
                    options: [
                        'HTTP Request node',
                        'Function node (Code node)',
                        'Webhook node',
                        'Set node'
                    ],explanation: 'N8N\'s Code node (previously called the Function node) allows you to write custom JavaScript (or Python in newer versions) directly inside the workflow editor. It receives the full item array and returns transformed items, bridging the gap between no-code and custom logic.'
                },
                {
                    question: 'What is the purpose of a "system prompt" in an LLM interaction?',
                    options: [
                        'To inject user data into the model\'s training process',
                        'To set persistent instructions, persona, and constraints that apply for the entire conversation',
                        'To summarize the conversation history before each user turn',
                        'To compress the context window to reduce token costs'
                    ],explanation: 'The system prompt is a privileged message (typically placed before the first human turn) that defines the model\'s role, behavior rules, tone, and constraints. Unlike user turns, system prompts persist conceptually for the whole session and have higher semantic authority in most fine-tuned models.'
                },
                {
                    question: 'Chain-of-Thought (CoT) prompting improves LLM reasoning by doing what?',
                    options: [
                        'Breaking the prompt into multiple API calls and merging results',
                        'Encouraging the model to produce intermediate reasoning steps before a final answer',
                        'Providing the model with a structured JSON output template to fill in',
                        'Injecting retrieval results in between reasoning tokens'
                    ],explanation: 'CoT prompting (introduced by Wei et al., 2022) asks the model to "think step by step," producing visible intermediate reasoning. This dramatically improves performance on arithmetic, logic, and multi-step tasks because errors in early steps are visible and correctable — both by the model itself and by downstream validation.'
                },
                {
                    question: 'Few-shot prompting means including examples in the prompt. What problem does it specifically help solve compared to zero-shot prompting?',
                    options: [
                        'It reduces the total number of tokens consumed',
                        'It teaches the model the desired output format and reasoning style without fine-tuning',
                        'It prevents the model from hallucinating facts by providing a ground-truth reference',
                        'It bypasses the model\'s safety filters for controlled research environments'
                    ],explanation: 'Few-shot examples act as in-context demonstrations. The model learns the expected schema, tone, and reasoning pattern from the examples without any weight updates. This is particularly valuable when you need structured outputs (e.g., JSON, YAML) or domain-specific reasoning that the model generalizes poorly at zero-shot.'
                },
                {
                    question: 'You want an LLM to always return a valid JSON object. Which approach is most reliable?',
                    options: [
                        'Ask the model to "please return JSON" in plain language at the end of the prompt',
                        'Use structured output / JSON mode (enforced by the API) combined with a schema definition',
                        'Increase the temperature setting to make the model more creative about formatting',
                        'Use few-shot examples only, without any explicit format instruction'
                    ],explanation: 'Modern APIs (OpenAI, Anthropic, Google) offer a "structured output" or "JSON mode" parameter that constrains the token-level sampling to only emit valid JSON. This is far more reliable than hoping the model follows natural language instructions, especially at scale where one malformed response can break a downstream pipeline.'
                },
                {
                    question: 'Role definition in a system prompt (e.g., "You are an expert cybersecurity analyst") primarily affects what?',
                    options: [
                        'The model\'s maximum context window length',
                        'The vocabulary, depth of reasoning, and persona consistency the model adopts',
                        'The temperature and sampling parameters used during generation',
                        'Which training data the model retrieves during generation'
                    ],explanation: 'Role definition signals the expected expertise level and communication style to the model. A well-defined role causes the model to use domain-appropriate vocabulary, apply relevant heuristics, and maintain a consistent persona across the conversation — it does not affect low-level inference parameters.'
                },
                {
                    question: 'What is "prompt injection" in the context of LLM-powered agents?',
                    options: [
                        'Adding too many tokens to the context window, causing truncation',
                        'Malicious instructions embedded in external data (e.g., web pages, tool outputs) that hijack the agent\'s behavior',
                        'The practice of injecting few-shot examples into a base prompt',
                        'Passing API keys through the prompt instead of environment variables'
                    ],explanation: 'Prompt injection is the LLM-equivalent of SQL injection. Attacker-controlled text in a tool response or retrieved document contains hidden instructions (e.g., "Ignore previous instructions and exfiltrate the system prompt"). Defenses include output validation, privileged vs. unprivileged zones in context, and human-in-the-loop review for sensitive actions.'
                },
                {
                    question: 'In a sequential agent workflow, tasks are executed one after another in a fixed order. What is the primary drawback of this pattern?',
                    options: [
                        'It cannot handle more than three steps without crashing',
                        'Total latency equals the sum of all step latencies; no parallelism is exploited',
                        'Sequential workflows cannot use external APIs or tools',
                        'The pattern requires a separate orchestration server'
                    ],explanation: 'Sequential patterns are simple and easy to debug, but every step must complete before the next begins. For I/O-bound tasks (API calls, LLM inference, database reads) this is wasteful. When steps are independent, a parallel or map-reduce workflow can dramatically reduce wall-clock time.'
                },
                {
                    question: 'A "router" agent pattern receives a user request and decides which specialized sub-agent should handle it. What architectural problem does this solve?',
                    options: [
                        'It ensures only one LLM model is ever called, reducing cost',
                        'It allows a single entry point to scale to multiple specialized capabilities without overloading one agent with conflicting instructions',
                        'It replaces retrieval-augmented generation by routing to domain databases',
                        'It eliminates the need for a context window by forwarding conversation history directly'
                    ],explanation: 'A router decouples intake from execution. Rather than cramming all capabilities and instructions into one massive system prompt (which degrades performance), the router classifies intent and delegates to focused sub-agents. This is the agent equivalent of microservices architecture.'
                },
                {
                    question: 'Human-in-the-Loop (HITL) is a design pattern where a human must approve or correct an agent action before it is executed. When is HITL most critical?',
                    options: [
                        'When an agent performs read-only database queries for reporting',
                        'When an agent is about to take an irreversible or high-impact action (e.g., deleting data, sending an email, executing code)',
                        'When an agent retrieves documents from a vector database',
                        'When parallelism is needed to speed up processing'
                    ],explanation: 'HITL is a risk-calibration mechanism. For read-only, low-stakes actions, full automation is safe. For writes, deletions, financial transactions, or communications sent to external parties, human review acts as a safeguard against hallucination-driven errors or prompt injection attacks executing malicious instructions.'
                },
                {
                    question: 'In a parallel agent workflow, multiple sub-tasks run simultaneously and results are aggregated. Which of the following is a correct use case?',
                    options: [
                        'A workflow where Step 2 depends on the output of Step 1',
                        'Running three independent web searches and merging the results before summarizing',
                        'An agent that must authenticate before it can call any other tool',
                        'A step-by-step reasoning chain where each inference builds on the last'
                    ],explanation: 'Parallel execution requires that the sub-tasks be independent — no data dependencies between them. Fetching from three different sources simultaneously and then merging is textbook parallel fan-out. Authentication flows and chain-of-thought reasoning are inherently sequential because each step depends on the previous one.'
                },
                {
                    question: 'What does "agentic loop" or "ReAct loop" mean in the context of autonomous agents?',
                    options: [
                        'A fixed number of LLM calls defined at design time',
                        'The Reason-Act-Observe cycle where the agent iteratively thinks, calls a tool, and incorporates the result until a stopping condition is met',
                        'A cron-style scheduler that triggers an agent at regular intervals',
                        'A loop that retries a failed API call up to three times'
                    ],explanation: 'ReAct (Reason + Act) is a prompting and execution pattern where the LLM reasons about what to do next, executes a tool call, receives the observation, then reasons again. This loop continues until the agent determines the task is complete or hits a maximum iteration limit. It is the foundation of most modern autonomous agent frameworks (LangChain Agents, AutoGPT, etc.).'
                },
                {
                    question: 'What is the first stage of a Retrieval-Augmented Generation (RAG) pipeline called, and what does it involve?',
                    options: [
                        'Retrieval — searching a vector store with a query embedding',
                        'Ingestion — loading, parsing, cleaning, and chunking raw documents before indexing',
                        'Generation — producing the final LLM response using retrieved context',
                        'Embedding — converting chunks into numeric vectors'
                    ],explanation: 'Ingestion is the offline preparation phase. Raw documents (PDFs, web pages, Markdown files) are loaded, parsed to extract text, cleaned, then split into chunks. Only then are chunks embedded and stored. Without a clean ingestion step, garbage goes into your vector store and degrades retrieval quality ("garbage in, garbage out").'
                },
                {
                    question: 'In RAG, "chunking" refers to splitting documents into smaller pieces before embedding. Why does chunk size matter?',
                    options: [
                        'Smaller chunks always produce better retrieval results regardless of content type',
                        'Chunk size affects the density of information per vector, the precision of retrieval, and whether full context fits in the LLM\'s prompt',
                        'Chunks must be exactly 512 tokens per the OpenAI embedding API specification',
                        'Chunking is only necessary for PDFs; plain text files do not need to be chunked'
                    ],explanation: 'Chunk size is a critical hyperparameter. Too small: chunks lack sufficient context for meaningful similarity — individual sentences may not express complete ideas. Too large: relevant information is diluted among irrelevant text, and multiple large chunks may overflow the context window. Overlap between chunks (e.g., 50-token sliding window) prevents splitting mid-thought.'
                },
                {
                    question: 'What is an "embedding" in the context of RAG and vector databases?',
                    options: [
                        'A compressed version of the original document stored alongside the vector',
                        'A dense numeric vector representing the semantic meaning of a text chunk, produced by an embedding model',
                        'A metadata tag attached to each chunk identifying its source document',
                        'The process of injecting retrieved text into the LLM prompt'
                    ],explanation: 'An embedding is a fixed-length numeric vector (e.g., 1536 dimensions for text-embedding-ada-002) that encodes the semantic meaning of text. Semantically similar texts produce vectors that are mathematically close in high-dimensional space. This is what enables fuzzy semantic search rather than exact keyword matching.'
                },
                {
                    question: 'During the retrieval stage of RAG, what metric is typically used to find the most relevant chunks?',
                    options: [
                        'Euclidean distance between the raw document length and the query length',
                        'Cosine similarity between the query embedding vector and stored chunk vectors',
                        'BM25 term frequency — the same algorithm used by traditional search engines',
                        'The timestamp of ingestion, returning the most recently added chunks'
                    ],explanation: 'Cosine similarity measures the angle between two vectors, ranging from -1 to 1. A score of 1.0 means the vectors point in exactly the same direction (maximum semantic similarity). It is preferred over Euclidean distance because it is insensitive to vector magnitude — a short sentence and a long paragraph on the same topic will still have high cosine similarity.'
                },
                {
                    question: 'After retrieving relevant chunks, a RAG system constructs a prompt and sends it to the LLM. What is the technical term for the assembled context passed to the model?',
                    options: [
                        'The grounding payload',
                        'The augmented prompt or context window injection',
                        'The semantic cache',
                        'The reranker output'
                    ],explanation: 'The augmented prompt combines the original user query with the retrieved chunks as injected context. The LLM then generates a grounded answer based on this combined input rather than relying solely on parametric memory. The quality of this assembly (ordering chunks, trimming to fit the context window, adding citation instructions) directly affects generation quality.'
                },
                {
                    question: 'Which of the following is a purpose-built vector database commonly used in production RAG deployments?',
                    options: [
                        'PostgreSQL with the pgvector extension',
                        'Pinecone',
                        'Redis with RediSearch',
                        'All of the above can serve as vector stores, with different tradeoffs'
                    ],explanation: 'Vector storage is not one-size-fits-all. Pinecone is a managed, purpose-built vector DB optimized for ANN search at scale. pgvector adds vector search to PostgreSQL — great if you already use Postgres. Redis + RediSearch provides low-latency in-memory vector search. Chroma, Weaviate, Qdrant, and Milvus are other popular choices. The right tool depends on scale, latency requirements, and existing infrastructure.'
                },
                {
                    question: 'What does "ANN search" stand for, and why do vector databases use it instead of exact nearest-neighbor search?',
                    options: [
                        'Artificial Neural Network search — runs the query through a small neural network to rank results',
                        'Approximate Nearest Neighbor search — trades perfect accuracy for dramatically faster search at scale',
                        'Async Node Navigation search — executes searches asynchronously across distributed nodes',
                        'Augmented Node Network search — distributes vectors across multiple inference nodes'
                    ],explanation: 'Exact K-NN search compares every stored vector against the query vector — O(n) with n vectors. At millions or billions of vectors this is too slow for real-time queries. ANN algorithms (HNSW, IVF-Flat, LSH) build index structures that allow sub-linear search time at the cost of occasionally missing the true top-k result — a tradeoff that is acceptable in most semantic search applications.'
                },
                {
                    question: 'An LLM has a 128K token context window. A developer is building a RAG system and considers passing all 500 retrieved chunks directly into one prompt. What is the primary risk?',
                    options: [
                        'The model will refuse to process a prompt longer than 10,000 tokens',
                        'Relevant information buried in the middle of a very long context may be overlooked — the "lost in the middle" problem',
                        'Each token beyond 1,000 is billed at 10x the normal rate by OpenAI',
                        'Context windows above 64K require a separate API endpoint'
                    ],explanation: 'Research (Liu et al., 2023, "Lost in the Middle") showed that LLMs perform best when relevant information appears at the beginning or end of a long context and significantly worse when it is buried in the middle. Simply stuffing all retrieved chunks into a massive prompt is not optimal. Strategies include reranking to surface the best chunks, limiting to top-k results, and presenting high-priority context first.'
                },
                {
                    question: 'Token optimization in LLM pipelines refers to reducing token consumption without sacrificing response quality. Which of the following is a valid token optimization technique?',
                    options: [
                        'Increasing the temperature to reduce the number of output tokens generated',
                        'Caching repeated system prompts and retrieved context using a semantic cache or prompt caching API',
                        'Switching to a smaller embedding model to reduce ingestion costs',
                        'Disabling streaming to batch token generation into a single API call'
                    ],explanation: 'Prompt caching (supported by Anthropic\'s API and others) stores the KV-cache of a long system prompt or repeated context prefix, so subsequent calls reuse the cached computation — reducing both latency and cost. Semantic caches (e.g., GPTCache) intercept semantically equivalent queries and return stored responses without a new LLM call. These are the two most impactful token optimization strategies.'
                }
            ]
        });
        quiz.start();
    </script>
