    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Generative AI and Azure OpenAI',
            description: 'Test your understanding of LLMs, tokenization, prompt engineering, Azure OpenAI Service, and responsible generative AI',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch04-quiz',
            moduleId: 'ai900-ch04-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the fundamental mechanism by which large language models generate text?',
                    options: [
                        'Database lookups of pre-written responses',
                        'Predicting the most probable next token based on the input sequence',
                        'Translating between programming languages',
                        'Searching the internet for relevant content'
                    ],
                    explanation: 'LLMs generate text by predicting the next most probable token in a sequence. They don\'t search the internet, look up databases, or translate code. The model uses statistical patterns learned during training to determine which token is most likely to follow the current sequence — then repeats this process thousands of times to produce a full response.'
                },
                {
                    question: 'What is tokenization in the context of LLMs?',
                    options: [
                        'Encrypting text for security',
                        'Breaking text into smaller units (words, sub-words, punctuation) that the model can process',
                        'Converting text to audio',
                        'Compressing text for storage'
                    ],
                    explanation: 'Tokenization splits input text into tokens — the fundamental units the model works with. Tokens can be whole words (\'hello\'), sub-words (\'un\' + \'likely\'), punctuation, or common character sequences. Each token gets a unique integer ID. The model\'s vocabulary can contain hundreds of thousands of tokens. This is the first step before any processing happens.'
                },
                {
                    question: 'What is the role of the transformer\'s attention mechanism?',
                    options: [
                        'It compresses the model to use less memory',
                        'It determines how much each token in the sequence influences the prediction of the next token',
                        'It translates between languages automatically',
                        'It filters out offensive content'
                    ],
                    explanation: 'The attention mechanism examines each token and calculates how strongly it is influenced by every other token in the sequence. In \'I heard a dog bark\', the words \'heard\' and \'dog\' have high attention weights for predicting the next word because they provide the strongest semantic clues. This allows the model to understand context, not just adjacent words.'
                },
                {
                    question: 'What is the difference between zero-shot and few-shot prompting?',
                    options: [
                        'Zero-shot is faster, few-shot is slower',
                        'Zero-shot gives no examples; few-shot provides examples of the desired input-output pattern',
                        'Zero-shot uses GPT-4, few-shot uses GPT-3',
                        'There is no difference'
                    ],
                    explanation: 'Zero-shot prompting gives the model a task with no examples — \'Classify this review as positive or negative.\' Few-shot prompting includes examples first — \'Great product! = positive. Terrible quality. = negative. The battery is amazing. = ?\' The examples teach the model the expected pattern and format, typically improving accuracy and consistency on the specific task.'
                },
                {
                    question: 'Which Azure service provides enterprise access to GPT-4, DALL-E, and Whisper models?',
                    options: [
                        'Azure Machine Learning',
                        'Azure AI Language',
                        'Azure OpenAI Service',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure OpenAI Service provides enterprise-grade access to OpenAI\'s models (GPT-4, GPT-4o, DALL-E for images, Whisper for speech) with Azure\'s security, compliance, private networking, and responsible AI content filtering. Azure ML is for custom model training. AI Language handles NLP analytics. Cognitive Search is for content indexing.'
                },
                {
                    question: 'What does the \'temperature\' parameter control in a generative AI model?',
                    options: [
                        'The speed of response generation',
                        'The randomness/creativity of the output — low is predictable, high is creative',
                        'The maximum length of the response',
                        'The language of the output'
                    ],
                    explanation: 'Temperature controls the randomness of token selection. At temperature 0, the model always picks the highest-probability token (deterministic, predictable). At temperature 1-2, lower-probability tokens have a higher chance of being selected (creative, diverse, but potentially incoherent). Temperature 0.7 is a common balanced default.'
                },
                {
                    question: 'What is a \'system message\' in the context of Azure OpenAI chat completions?',
                    options: [
                        'An error message from the system',
                        'Instructions that define the AI\'s persona, behavior, and constraints before the conversation begins',
                        'A log of all previous conversations',
                        'A security alert from Azure'
                    ],
                    explanation: 'A system message sets the AI\'s role and behavioral guidelines at the start of a conversation — for example, \'You are a helpful IT technician. Answer in non-technical language.\' The model uses this context to shape all its responses. It is not visible to the end user but fundamentally influences how the model behaves throughout the conversation.'
                },
                {
                    question: 'What is \'hallucination\' in generative AI?',
                    options: [
                        'When the model runs out of memory',
                        'When the model generates confident but factually incorrect or fabricated information',
                        'When the model takes too long to respond',
                        'When the model refuses to answer'
                    ],
                    explanation: 'Hallucination occurs when the model generates text that sounds plausible and confident but is factually wrong — it might cite non-existent studies, invent statistics, or fabricate quotes. This happens because LLMs predict probable text, not verified facts. They have no concept of truth — only probability. Grounding techniques (connecting the model to verified data sources) help mitigate this.'
                },
                {
                    question: 'What is the purpose of content filtering in Azure OpenAI Service?',
                    options: [
                        'To improve response speed',
                        'To detect and block harmful content in both prompts and model outputs',
                        'To reduce API costs',
                        'To translate content automatically'
                    ],
                    explanation: 'Content filtering analyzes both user prompts AND model outputs for harmful content across four categories: violence, self-harm, sexual content, and hate speech. Each is rated by severity (safe, low, medium, high). Azure OpenAI can block requests or responses that exceed configured thresholds, preventing the model from generating harmful content even when prompted to do so.'
                },
                {
                    question: 'What is the difference between a Copilot and an AI Agent?',
                    options: [
                        'They are the same thing',
                        'A Copilot assists a human user; an Agent can act autonomously, plan, and use tools',
                        'A Copilot is free, an Agent is paid',
                        'A Copilot uses GPT-3, an Agent uses GPT-4'
                    ],
                    explanation: 'A Copilot works alongside a human — providing suggestions, drafting content, answering questions while the human retains control (e.g., Microsoft 365 Copilot, GitHub Copilot). An AI Agent operates more autonomously — it can plan multi-step tasks, use tools (search, code execution, APIs), and take actions with less human oversight. Agents represent a more advanced application of generative AI.'
                },
                {
                    question: 'How does \'grounding\' help reduce hallucination in generative AI?',
                    options: [
                        'By making the model run faster',
                        'By connecting the model to verified, relevant data sources so it bases responses on real information',
                        'By reducing the model\'s vocabulary',
                        'By limiting the number of users'
                    ],
                    explanation: 'Grounding connects the model to authoritative data sources — company documents, knowledge bases, databases — so its responses are based on real, verified information rather than just statistical predictions from training data. Retrieval-Augmented Generation (RAG) is a common grounding technique: retrieve relevant documents first, then have the model generate a response based on that specific context.'
                },
                {
                    question: 'What does \'max_tokens\' control in an Azure OpenAI API request?',
                    options: [
                        'The maximum number of words in the prompt',
                        'The maximum number of tokens the model will generate in its response',
                        'The maximum cost of the API call',
                        'The maximum number of users who can access the model'
                    ],
                    explanation: 'max_tokens sets the upper limit on how many tokens the model will generate in its completion. One token is roughly 4 characters or 3/4 of a word in English. Setting max_tokens to 100 limits the response to approximately 75 words. This controls response length and API cost. It does NOT limit the prompt length — that is controlled by the model\'s context window.'
                },
                {
                    question: 'Which of the following is NOT a responsible AI concern specific to generative AI?',
                    options: [
                        'Hallucination of factual information',
                        'Generation of harmful or biased content',
                        'Copyright issues with training data',
                        'Slow database query performance'
                    ],
                    explanation: 'Slow database performance is a general IT operations concern, not specific to generative AI. The three responsible AI concerns unique to generative AI are: hallucination (generating false information), harmful content generation (violence, hate speech despite safety filters), and copyright/IP questions (models trained on copyrighted data may reproduce protected content).'
                },
                {
                    question: 'A company wants to build a customer service chatbot that answers questions based only on their product documentation. Which approach should they use?',
                    options: [
                        'Train a new LLM from scratch on their documents',
                        'Use Azure OpenAI with RAG (Retrieval-Augmented Generation) to ground responses in their documentation',
                        'Use DALL-E to generate images of products',
                        'Use Azure AI Translator'
                    ],
                    explanation: 'RAG is the correct approach — retrieve relevant sections from the company\'s product documentation, then pass them as context to the LLM so it generates responses grounded in real product information. Training a new LLM from scratch is prohibitively expensive and unnecessary. DALL-E generates images. Translator handles language conversion. RAG gives accurate, grounded answers without hallucination.'
                },
                {
                    question: 'In the transformer architecture, what are \'embeddings\'?',
                    options: [
                        'The raw text input before processing',
                        'Vector representations of tokens that encode semantic and linguistic relationships',
                        'The final output text generated by the model',
                        'The training dataset used to build the model'
                    ],
                    explanation: 'Embeddings are multi-dimensional vector representations of tokens that capture meaning and relationships. The word \'king\' and \'queen\' would have similar embedding vectors because they are semantically related. Embeddings are created by the transformer\'s encoder using the attention mechanism. They are the bridge between raw tokens (just IDs) and the model\'s understanding of what those tokens mean in context.'
                }
            ]
        });
        quiz.start();
    </script>
