<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to AI-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Introduction to AI on Azure',
            description: 'Test your understanding of AI fundamentals, machine learning types, and responsible AI principles',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch01-quiz',
            moduleId: 'ai900-ch01-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'Which ML type predicts a continuous numeric value, such as temperature or price?',
                    options: [
                        'Classification',
                        'Clustering',
                        'Regression',
                        'Reinforcement learning'
                    ],
                    explanation: 'Regression predicts continuous numeric values — numbers on a scale like temperature (72.5°F), price ($450,000), or quantity (215 ice creams). Think of it as drawing a best-fit line through data points. Classification predicts categories (spam/not spam), Clustering groups data without labels, and Reinforcement Learning learns through rewards — none of these predict a number on a continuous scale.'
                },
                {
                    question: 'What term describes the known output value that a supervised ML model learns to predict?',
                    options: [
                        'Feature',
                        'Label',
                        'Hyperparameter',
                        'Weight'
                    ],
                    explanation: 'A label (y) is the known answer you are training the model to predict — like "spam" for an email or "$350,000" for a house price. Features (x) are the measurable inputs (email length, word patterns; or square footage, bedrooms). Hyperparameters tune the algorithm itself (learning rate, depth). Weights are internal numbers the model adjusts during training to improve accuracy.'
                },
                {
                    question: 'A hospital wants to predict patient readmission risk as either "likely" or "unlikely". Which ML type?',
                    options: [
                        'Regression',
                        'Binary classification',
                        'Multiclass classification',
                        'Clustering'
                    ],
                    explanation: 'Binary classification predicts one of exactly two outcomes — yes/no, true/false, likely/unlikely. A hospital predicting readmission risk (likely or unlikely) is binary because there are only two possible answers. Regression would output a number (like a 73% probability score). Multiclass handles 3+ categories. Clustering finds natural groups without predefined labels.'
                },
                {
                    question: 'What is the key difference between supervised and unsupervised machine learning?',
                    options: [
                        'Supervised uses more data',
                        'Supervised training data includes labels; unsupervised does not',
                        'Unsupervised is more accurate',
                        'Supervised only works with images'
                    ],
                    explanation: 'The fundamental difference is whether the training data includes labels (known answers). Supervised learning uses labeled data — the model sees both the input features AND the correct output, then learns the relationship. For example: photos labeled "cat" or "dog." Unsupervised learning gets only input data with no labels — it must discover patterns on its own, like grouping customers by behavior without being told what the groups are.'
                },
                {
                    question: 'Which Azure service provides pre-built models for image analysis, object detection, and OCR?',
                    options: [
                        'Azure Machine Learning',
                        'Azure AI Vision',
                        'Azure AI Document Intelligence',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure AI Vision provides ready-to-use APIs for image analysis, object detection, and OCR — no custom model training needed. Azure Machine Learning is a platform for building and training your own custom models. Azure AI Document Intelligence specializes in extracting structured data from forms (receipts, invoices). Azure Cognitive Search is a search indexing service, not an AI vision service.'
                },
                {
                    question: 'In deep learning, what are the processing layers between input and output called?',
                    options: [
                        'Feature layers',
                        'Hidden layers',
                        'Decision boundaries',
                        'Activation layers'
                    ],
                    explanation: 'Hidden layers are the processing layers between input and output in a neural network. Think of them as filters: the first hidden layer might detect simple edges in an image, the second detects shapes, the third detects objects — each layer builds on the previous one to learn increasingly complex patterns. Feature layers, decision boundaries, and activation layers are not standard neural network terminology for these intermediate processing stages.'
                },
                {
                    question: 'A wildlife researcher wants to classify animals in photos as bear, wolf, or elk. Which ML type?',
                    options: [
                        'Binary classification',
                        'Regression',
                        'Multiclass classification',
                        'Clustering'
                    ],
                    explanation: 'Multiclass classification predicts one label from three or more possible categories — in this case, bear, wolf, or elk (three species). Binary classification only handles two categories (yes/no). Regression predicts a continuous number, not a category. Clustering would group animals by physical similarity without knowing the species names in advance — it discovers groups rather than classifying into predefined ones.'
                },
                {
                    question: 'Which responsible AI principle addresses the risk of biased training data producing discriminatory outputs?',
                    options: [
                        'Transparency',
                        'Reliability and safety',
                        'Fairness',
                        'Accountability'
                    ],
                    explanation: 'Fairness addresses the risk that AI trained on biased data will produce discriminatory outputs. For example, a hiring model trained on historical data where most hires were male might unfairly reject female candidates — not because of qualifications, but because of bias in the training data. Transparency is about explaining how AI works. Reliability is about consistent performance. Accountability is about who is responsible for AI decisions.'
                },
                {
                    question: 'What technology enables generative AI to produce human-like text responses?',
                    options: [
                        'Decision trees',
                        'Support vector machines',
                        'Large language models (LLMs)',
                        'K-means clustering'
                    ],
                    explanation: 'Large Language Models (LLMs) are trained on massive text datasets to learn statistical patterns in language — which words are likely to follow which other words. This enables them to generate coherent, contextually relevant text. Decision trees split data into branches based on feature values. SVMs find boundaries between categories. K-means clustering groups data points — none of these generate new text content.'
                },
                {
                    question: 'A marketing team wants to segment customers into groups based on purchasing behavior, without predefined categories. Which ML type?',
                    options: [
                        'Regression',
                        'Binary classification',
                        'Supervised learning',
                        'Clustering'
                    ],
                    explanation: 'Clustering finds natural groups in data WITHOUT any predefined labels — the algorithm discovers the segments on its own. A marketing team with no predefined customer categories would use clustering to let the data reveal natural groupings based on behavior patterns. Regression predicts numbers. Binary classification needs predefined categories. Supervised learning requires labeled training data.'
                },
                {
                    question: 'Which Azure service would you use to convert spoken language into written text?',
                    options: [
                        'Azure AI Vision',
                        'Azure AI Language',
                        'Azure AI Speech',
                        'Azure OpenAI Service'
                    ],
                    explanation: 'Azure AI Speech provides speech-to-text (converting spoken language to written text) and text-to-speech (converting text to spoken audio). AI Vision handles images, not audio. AI Language handles text analytics (sentiment, entities). Azure OpenAI Service handles generative AI text generation — it does not specialize in audio transcription.'
                },
                {
                    question: 'What is "inferencing" in machine learning?',
                    options: [
                        'Training a model with new data',
                        'Using a trained model to make predictions on new data',
                        'Evaluating model accuracy on test data',
                        'Selecting features for training'
                    ],
                    explanation: 'Inferencing is the process of using a trained model to make predictions on new, unseen data — the model is deployed and receives new inputs it has never seen before. Training is the process of building the model from historical data. Evaluation tests model accuracy against known data. Feature selection is a preprocessing step before training begins.'
                },
                {
                    question: 'Which responsible AI principle requires making users aware of how an AI system works and its limitations?',
                    options: [
                        'Fairness',
                        'Privacy and security',
                        'Inclusiveness',
                        'Transparency'
                    ],
                    explanation: 'Transparency means making users aware of how an AI system works, what data it was trained on, and what limitations exist. For example, a bank using AI for loan decisions should disclose that AI is involved and explain what factors influence the decision. Fairness is about avoiding bias. Privacy protects personal data. Inclusiveness ensures accessibility for all users.'
                },
                {
                    question: 'What does Azure AI Document Intelligence specialize in?',
                    options: [
                        'Generating documents from templates',
                        'Translating documents between languages',
                        'Extracting structured data from forms and documents',
                        'Securing documents with encryption'
                    ],
                    explanation: 'Azure AI Document Intelligence (formerly Form Recognizer) extracts structured key-value data from forms and documents — it understands document layouts and returns named fields like "Total: $32.92" or "Patient Name: Smith." This goes beyond simple text extraction. Generating documents is a different task entirely. Translation converts languages. Encryption secures data — none of these extract structured fields.'
                },
                {
                    question: 'In the formula y = f(x), what does "x" represent?',
                    options: [
                        'The model\'s prediction',
                        'The training algorithm',
                        'The input features',
                        'The loss function'
                    ],
                    explanation: 'In the formula y = f(x), x represents the input features — the measurable attributes used to make predictions. For example, in predicting house prices: x = [square footage, bedrooms, location]. The model f processes these features and outputs y (the predicted price). The model prediction is y (the output). The training algorithm builds f. The loss function measures prediction errors during training.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
