    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 6: Azure AI Services',
            description: 'Test your understanding of Azure AI Services provisioning, speech capabilities, Document Intelligence, authentication, containers, and responsible AI practices',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch06-quiz',
            moduleId: 'ai900-ch06-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'What are Azure AI Services?',
                    options: [
                        'Custom-trained models you build from scratch',
                        'Pre-built, API-accessible AI capabilities that require no model training',
                        'A database management system',
                        'A code editor for AI development'
                    ],
                    explanation: 'Azure AI Services are Microsoft\'s catalog of pre-built AI capabilities available through REST APIs. Crawl: you do not train anything — you send data to an endpoint and get intelligent results back. Walk: the catalog covers vision (image analysis, OCR), language (sentiment, translation, summarization), speech (recognition, synthesis), and decision-making. Each service is backed by models Microsoft has already trained on massive datasets. Run: pre-built means faster time to value — a developer can add speech recognition to an app in hours rather than the months it would take to build, label, train, and validate a custom model. The trade-off is less domain-specific customization, though many services offer fine-tuning options for specialized vocabulary and requirements.'
                },
                {
                    question: 'What is the difference between creating an individual Azure AI service resource and a multi-service resource?',
                    options: [
                        'There is no difference',
                        'Individual resources provide one specific AI capability; multi-service provides all capabilities through one endpoint and key',
                        'Multi-service is free, individual is paid',
                        'Individual resources are faster'
                    ],
                    explanation: 'The choice between individual and multi-service resources is a trade-off between billing granularity and operational simplicity. Crawl: an individual resource (e.g., a Speech Services resource) gives you exactly one capability with its own endpoint and key. A multi-service resource (kind=CognitiveServices) gives you all capabilities through a single endpoint and key pair. Walk: individual resources let you monitor and control costs per capability — useful when different teams own different services or when you need to enforce usage limits on specific features. Multi-service simplifies key management and is ideal for prototyping or applications that use several AI capabilities together. Run: the billing model is the same rate either way — you pay per transaction. The difference is purely organizational: one resource vs. many, one key to manage vs. many, one cost center vs. many.'
                },
                {
                    question: 'What does speech recognition (speech-to-text) do?',
                    options: [
                        'Generates images from text',
                        'Converts spoken audio into written text',
                        'Translates between languages',
                        'Classifies text sentiment'
                    ],
                    explanation: 'Speech recognition converts spoken audio into written text using a two-stage acoustic and language model pipeline. Crawl: you send an audio stream or file to the service, and you get back a text transcript. Walk: the acoustic model interprets sound waves — phonemes, timing, speaker characteristics — and maps them to probable word sequences. The language model then applies context to pick the most likely words given what came before, correcting for homophones and natural speech patterns like contractions and filler words. Run: Azure Speech Services supports real-time streaming recognition (for live calls and dictation), batch transcription (for large audio files), and speaker diarization (identifying who said what in multi-speaker audio). The service can be customized with a custom speech model trained on domain-specific vocabulary — useful for medical, legal, or technical fields where specialized terminology is common.'
                },
                {
                    question: 'What is SSML used for in text-to-speech?',
                    options: [
                        'Encrypting speech data',
                        'Controlling pronunciation, speaking rate, pitch, pauses, and emphasis in synthesized speech',
                        'Compressing audio files',
                        'Training custom speech models'
                    ],
                    explanation: 'SSML (Speech Synthesis Markup Language) is an XML-based standard that gives developers fine-grained control over how synthesized speech sounds. Crawl: instead of sending plain text and accepting the default voice, you wrap text in SSML tags to customize the delivery. Walk: SSML supports adjusting speaking rate (faster for disclaimers, slower for emphasis), pitch, volume, adding pauses between sentences, specifying exact pronunciation for acronyms or unusual words, and switching between voices mid-document. For example, a navigation app might use a faster rate for long street names but pause clearly before turn instructions. Run: Azure Neural TTS supports Neural SSML extensions beyond the base standard — including expressiveness styles like "cheerful", "sad", or "newscast" on supported voices, and fine-grained prosody control down to individual phonemes. This matters for applications like audiobooks, IVR systems, and accessibility tools where natural-sounding speech directly affects user experience.'
                },
                {
                    question: 'Which Azure service specializes in extracting structured key-value data from forms, receipts, and invoices?',
                    options: [
                        'Azure AI Vision OCR',
                        'Azure AI Document Intelligence',
                        'Azure AI Language',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure AI Document Intelligence understands document layout and returns structured, typed fields rather than raw text. Crawl: point it at a receipt and you get back fields like MerchantName, Total, and TransactionDate — not just lines of text. Walk: OCR (available in Azure AI Vision) also reads documents, but it returns raw text lines and bounding boxes without understanding what any text means semantically. Document Intelligence goes further by applying pre-trained models that understand the layout of specific document types — receipts, invoices, tax forms, ID cards, business cards. Run: Document Intelligence offers prebuilt models (prebuilt-receipt, prebuilt-invoice, prebuilt-idDocument) for common formats, a general document model for extracting key-value pairs from any document, and a custom model option where you train on your own document layouts. This is the right choice any time your application needs to act on specific fields — not just search or display raw text.'
                },
                {
                    question: 'Why does Azure provide TWO API keys for each AI service resource?',
                    options: [
                        'One is for testing, one is for production',
                        'To allow key rotation without service interruption',
                        'One is encrypted, one is not',
                        'The second key is a backup in case the first is lost'
                    ],
                    explanation: 'Two keys exist to enable zero-downtime key rotation — a critical security operations pattern. Crawl: when you need to regenerate a key (because it was exposed, or as a routine security practice), you cannot simply delete the old key — all your apps would stop working. Walk: the rotation procedure is: (1) update all applications to use Key 2, (2) regenerate Key 1 (the old value is now invalid), (3) update all applications to use Key 1, (4) regenerate Key 2. At no point are any apps left without a valid key. Run: this pattern applies to any credentials that must be rotated without downtime — database connection strings, storage account keys, and API keys. Azure Key Vault can automate this rotation and notify dependent apps when keys change. Best practice is to store keys in Key Vault and reference them by secret name in your application config, so key rotation never requires a code deployment.'
                },
                {
                    question: 'When would you deploy an Azure AI service as a Docker container instead of using the cloud API?',
                    options: [
                        'When you want faster model training',
                        'When you need offline operation, low latency, or data residency compliance',
                        'When you want to save money',
                        'Containers are always faster than cloud APIs'
                    ],
                    explanation: 'Containerized Azure AI services exist for edge scenarios where data cannot or should not leave the local network. Crawl: you pull a Docker image from Microsoft, deploy it on your own hardware or private cloud, and call a local endpoint — audio, images, and documents never leave your premises. Walk: the key use cases are offline operation (factory floors without reliable internet, ships at sea, remote military sites), ultra-low latency (industrial control systems where a 200ms round-trip to the cloud is unacceptable), and data residency compliance (hospitals where patient audio cannot leave the building, government environments with classified data). Run: containers still need periodic billing check-in with Azure — they are not fully air-gapped unless you have a special arrangement. The container sends metering data (transaction counts, not your actual data) back to Azure for billing purposes. Cost is the same as the cloud API; you are not saving money, you are buying control over data location and availability.'
                },
                {
                    question: 'What authentication method provides the strongest security for Azure AI services?',
                    options: [
                        'API key in the URL',
                        'Microsoft Entra ID (formerly Azure Active Directory) with managed identities',
                        'Username and password',
                        'No authentication needed'
                    ],
                    explanation: 'Microsoft Entra ID with managed identities eliminates key management entirely, which is the strongest security posture available. Crawl: instead of storing an API key in your app, Azure automatically provisions and rotates an identity credential for your app — you never see or handle a secret. Walk: API keys are static strings that can be leaked in code commits, logs, environment variables, or error messages. Once leaked, the key is valid until manually rotated. A managed identity is automatically rotated by Azure, scoped to specific resources, and never exposed in code or config. Run: the implementation is: enable managed identity on your Azure resource (VM, App Service, Function App), grant that identity the Cognitive Services User role on the AI service resource, and use the Azure SDK\'s DefaultAzureCredential — which automatically handles the token exchange. Zero secrets in code, zero manual rotation, full audit trail in Azure Activity Log.'
                },
                {
                    question: 'What is a transparency note in the context of Azure AI services?',
                    options: [
                        'A billing receipt',
                        'A document describing a service\'s capabilities, limitations, and responsible use guidelines',
                        'A privacy policy',
                        'A performance benchmark report'
                    ],
                    explanation: 'Transparency notes are Microsoft\'s responsible AI documentation artifacts that accompany every Azure AI service. Crawl: before deploying an AI service in a product, you read its transparency note to understand what it can and cannot do, and what responsible use looks like. Walk: a transparency note covers intended use cases and out-of-scope uses, known performance limitations across demographic groups (e.g., lower accuracy for certain accents or skin tones in facial analysis), data requirements and privacy considerations, potential failure modes and their consequences, and guidance for human oversight. Run: transparency notes are part of Microsoft\'s implementation of its six Responsible AI principles — fairness, reliability and safety, privacy and security, inclusiveness, transparency, and accountability. For the AI-900 exam, understand that transparency notes are specifically about responsible use documentation, not performance benchmarks, billing, or privacy policies (which are separate documents with different purposes).'
                },
                {
                    question: 'A company wants to transcribe customer support calls in real-time. Which Azure AI capability should they use?',
                    options: [
                        'Text-to-speech',
                        'Speech-to-text (speech recognition)',
                        'Document Intelligence',
                        'Azure AI Vision'
                    ],
                    explanation: 'Real-time call transcription is a speech recognition (speech-to-text) use case — audio in, text out. Crawl: the agent speaks, the microphone captures audio, Azure Speech Services converts the stream to text in near-real-time. Walk: text-to-speech goes the opposite direction (text input, audio output) — used for IVR systems, audiobooks, and accessibility. Document Intelligence processes documents (PDFs, images of forms), not audio streams. Azure AI Vision analyzes images and video frames, not audio. Run: for call center transcription specifically, Azure Speech Services supports real-time streaming transcription with speaker diarization (labeling which speaker said which words), sentiment analysis per utterance, and keyword spotting. The transcripts can feed downstream analytics — identifying common complaints, coaching opportunities, or compliance violations — without any human review of every call.'
                },
                {
                    question: 'What is the `kind` value for a multi-service Azure AI resource?',
                    options: [
                        'SpeechServices',
                        'TextAnalytics',
                        'CognitiveServices',
                        'FormRecognizer'
                    ],
                    explanation: 'The kind=CognitiveServices value creates a single resource that provides access to all Azure AI capabilities through one endpoint and key pair. Crawl: when you create an Azure resource for AI, the kind parameter tells Azure which service you want. Walk: individual service kinds map to specific capabilities: SpeechServices for speech only, TextAnalytics for language analysis only, FormRecognizer (now Document Intelligence) for document processing only. Setting kind=CognitiveServices is the multi-service option — it activates all capabilities under a single resource. Run: in an ARM template or Azure CLI command, the distinction looks like: az cognitiveservices account create --kind SpeechServices (individual) vs. --kind CognitiveServices (multi-service). The SKU and location options are the same. For the exam, remember: CognitiveServices = multi-service = one key for everything; all other kind values are single-service.'
                },
                {
                    question: 'What does Azure AI Document Intelligence\'s prebuilt-receipt model return that OCR does not?',
                    options: [
                        'Raw text lines from the document',
                        'Structured key-value fields like MerchantName, Total, TransactionDate with data types',
                        'The number of pages',
                        'The file format'
                    ],
                    explanation: 'Document Intelligence returns semantically labeled, typed fields — OCR returns raw text without understanding what any of it means. Crawl: OCR reads "Starbucks" and "$6.75" as separate text lines. Document Intelligence understands "Starbucks" is the MerchantName and "$6.75" is the Total, and returns the total as a currency type. Walk: this distinction matters for any application that needs to act on specific values. An expense management app needs the total amount as a number it can add up — not a string buried in lines of text it must parse. OCR requires your application to write the parsing logic; Document Intelligence has already done that work for common document types. Run: the prebuilt-receipt model returns structured fields including MerchantName (string), MerchantAddress (address object), TransactionDate (date), TransactionTime (time), Items (array of line items with name, quantity, price), Subtotal, Tax, Tip, and Total (currency). Each field includes a confidence score. This is a fundamentally different output format from OCR, not just a richer version of the same thing.'
                },
                {
                    question: 'What is required for a containerized Azure AI service to function?',
                    options: [
                        'Nothing — containers work completely offline forever',
                        'A periodic connection to Azure for billing and metering',
                        'A constant internet connection',
                        'A GPU in every device'
                    ],
                    explanation: 'Containerized Azure AI services require periodic billing check-in with Azure — they are not truly air-gapped and cannot run offline indefinitely. Crawl: the container processes data locally, but it must connect back to Azure periodically to report usage (number of API calls made) for billing purposes. Walk: "periodic" means the container does not need a constant connection — short network outages are tolerable. But if the container cannot reach Azure for billing over an extended period, it will stop accepting requests. This is Azure\'s licensing enforcement mechanism: you cannot run Azure AI services without Azure knowing how much you have used. Run: the billing endpoint the container calls transmits only metering data (transaction counts and timestamps) — not your actual audio, images, or documents. Your sensitive data still stays on-premises. A constant internet connection is not required, but a GPU is also not required for most containerized AI services — they run on standard CPU hardware. For the exam: containers = local processing + periodic Azure billing check-in, not fully offline.'
                },
                {
                    question: 'Which Azure tool provides a unified dashboard for monitoring AI service usage, errors, and performance?',
                    options: [
                        'Azure AI Foundry',
                        'Azure Monitor',
                        'Azure DevOps',
                        'Azure Blob Storage'
                    ],
                    explanation: 'Azure Monitor is the centralized observability platform for all Azure resources, including AI services. Crawl: Azure Monitor collects diagnostic logs, metrics, and usage data from your AI service resources and provides dashboards, alerts, and query tools. Walk: for Azure AI services specifically, Azure Monitor surfaces metrics like total calls, successful calls, errors by error code, average latency, and data-in/data-out volumes. You can set alerts — "notify me if error rate exceeds 5% for 10 minutes" — and drill into logs to investigate individual failed requests. Run: Azure AI Foundry is the development and experimentation portal — it has some monitoring for models you deploy through Foundry, but it is not the general-purpose monitoring platform. Azure DevOps handles CI/CD pipelines. Azure Blob Storage is object storage. For production AI service monitoring — dashboards, alerting, log analytics — Azure Monitor with Log Analytics workspace is the correct answer.'
                },
                {
                    question: 'A healthcare application needs to run speech recognition in a hospital where patient data cannot leave the premises. What is the best approach?',
                    options: [
                        'Use the cloud API with encryption',
                        'Deploy the Speech Services container on-premises',
                        'Don\'t use speech recognition',
                        'Send anonymized data to the cloud'
                    ],
                    explanation: 'Deploying the Speech Services container on-premises keeps all patient audio within the hospital\'s network, satisfying data residency and HIPAA requirements. Crawl: the containerized service runs on hospital hardware — patient speech is processed locally and never transmitted to Azure\'s cloud endpoints. Walk: using the cloud API with encryption still sends audio data to Microsoft\'s servers in Azure data centers, which may violate healthcare data residency rules and HIPAA Business Associate Agreement requirements depending on jurisdiction and contract terms. Anonymizing audio is technically difficult (voice is itself a biometric identifier) and legally insufficient under most healthcare privacy frameworks. Run: the on-premises container connects to Azure only for billing metering — sending transaction counts, not audio. The hospital controls where the container runs, who has network access to it, and how long audio data is retained. This architecture satisfies data residency (data stays in the building), HIPAA technical safeguards (access controls, audit logging on local infrastructure), and still leverages Microsoft\'s speech recognition model quality without building a custom model. The periodic billing check-in to Azure is the only external communication, and it contains no patient data.'
                }
            ]
        });
        quiz.start();
    </script>
