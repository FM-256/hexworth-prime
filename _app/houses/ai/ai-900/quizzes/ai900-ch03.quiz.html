<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to AI-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Natural Language Processing',
            description: 'Test your understanding of NLP concepts, Azure AI Language, sentiment analysis, entity recognition, and conversational AI',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch03-quiz',
            moduleId: 'ai900-ch03-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'What does sentiment analysis determine about a piece of text?',
                    options: [
                        'The language it is written in',
                        'The emotional tone — positive, negative, or neutral',
                        'The key topics discussed',
                        'The named entities mentioned'
                    ],
                    explanation: 'Sentiment analysis evaluates the emotional tone of text — classifying it as positive, negative, or neutral with confidence scores. For example, \'The hotel was wonderful\' scores high positive sentiment. Language detection identifies the language. Key phrase extraction finds topics. NER finds entities like people and places.'
                },
                {
                    question: 'Which Azure service provides pre-built NLP capabilities including sentiment analysis, NER, and key phrase extraction?',
                    options: [
                        'Azure Machine Learning',
                        'Azure AI Language',
                        'Azure AI Vision',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure AI Language (formerly Text Analytics) provides pre-built NLP APIs for sentiment analysis, named entity recognition, key phrase extraction, PII detection, language detection, and summarization. Azure ML is for custom model training. AI Vision handles images. Cognitive Search is a search indexing service.'
                },
                {
                    question: 'Named Entity Recognition (NER) identifies which of the following in text?',
                    options: [
                        'Grammatical errors',
                        'People, places, organizations, dates, and quantities',
                        'The overall sentiment',
                        'Translation quality'
                    ],
                    explanation: 'NER scans text and identifies real-world entities — people (Satya Nadella), organizations (Microsoft), locations (Seattle), dates (Q1 2026), quantities (10 billion), products (Azure), and events (Build conference). Each entity gets a category label and confidence score.'
                },
                {
                    question: 'A company wants to automatically detect and redact personal information in customer emails. Which NLP capability should they use?',
                    options: [
                        'Sentiment analysis',
                        'Key phrase extraction',
                        'PII detection',
                        'Language detection'
                    ],
                    explanation: 'PII (Personally Identifiable Information) detection identifies sensitive data like email addresses, phone numbers, social security numbers, and names in text. It can automatically redact these values for compliance with privacy regulations like GDPR and HIPAA. Sentiment analyzes emotion. Key phrases find topics. Language detection identifies the language.'
                },
                {
                    question: 'What is the key difference between key phrase extraction and named entity recognition?',
                    options: [
                        'They are the same technology',
                        'Key phrases identify topics; NER identifies real-world entities with categories',
                        'Key phrases are more accurate',
                        'NER only works in English'
                    ],
                    explanation: 'Key phrase extraction identifies the main topics and important phrases in a document (e.g., \'Azure AI services\', \'annual conference\'). NER goes further — it identifies specific real-world entities AND classifies them into categories (Person, Organization, Location, DateTime, etc.). Key phrases are about WHAT the text discusses. NER is about WHO, WHERE, WHEN specifically.'
                },
                {
                    question: 'In conversational language understanding (CLU), what is an \'intent\'?',
                    options: [
                        'A database query',
                        'The user\'s goal or purpose behind their utterance',
                        'A translation target',
                        'A sentiment score'
                    ],
                    explanation: 'An intent represents what the user is trying to accomplish — their purpose or goal. For example, the utterance \'Book a flight to London\' has the intent \'BookFlight.\' CLU models are trained to recognize intents and extract entities (destination=London) from natural language input. This powers chatbots and virtual assistants.'
                },
                {
                    question: 'Which Azure service would you use to translate text between languages in real-time?',
                    options: [
                        'Azure AI Language',
                        'Azure AI Translator',
                        'Azure AI Speech',
                        'Azure OpenAI Service'
                    ],
                    explanation: 'Azure AI Translator provides real-time text translation between 100+ languages. It handles individual strings and full documents. Azure AI Language handles text analytics (sentiment, NER). Azure AI Speech handles spoken language. Azure OpenAI can translate but is not the dedicated translation service.'
                },
                {
                    question: 'What is extractive summarization?',
                    options: [
                        'Generating new summary sentences from scratch',
                        'Selecting the most important existing sentences from the source text',
                        'Translating a summary into multiple languages',
                        'Detecting the language of a document'
                    ],
                    explanation: 'Extractive summarization pulls the most important sentences directly from the source text — it does not generate new text. The selected sentences appear verbatim from the original document. Abstractive summarization (used by generative AI) creates new sentences. Extractive is simpler and preserves the original wording exactly.'
                },
                {
                    question: 'A customer review says: \'The food was amazing but the service was terrible.\' What would sentence-level sentiment analysis return?',
                    options: [
                        'Positive for the entire review',
                        'Negative for the entire review',
                        'Mixed — positive for the food sentence, negative for the service sentence',
                        'Neutral for both sentences'
                    ],
                    explanation: 'Sentence-level sentiment analysis evaluates each sentence independently. \'The food was amazing\' scores positive. \'The service was terrible\' scores negative. The overall document sentiment might be \'mixed.\' This granularity helps businesses identify specific strengths and weaknesses rather than just an overall score.'
                },
                {
                    question: 'In CLU, what is an \'entity\' in the context of the utterance \'Book a flight from Miami to London next Friday\'?',
                    options: [
                        'The entire sentence',
                        'The intent \'BookFlight\'',
                        'Specific values like \'Miami\', \'London\', and \'next Friday\'',
                        'The confidence score'
                    ],
                    explanation: 'Entities are the specific values extracted from an utterance that provide details about the intent. In \'Book a flight from Miami to London next Friday\': origin=Miami, destination=London, date=next Friday. The intent (BookFlight) is the user\'s goal. Entities are the parameters that make the intent actionable.'
                },
                {
                    question: 'Azure AI Language can detect which of the following types of PII?',
                    options: [
                        'Only email addresses',
                        'Only names and phone numbers',
                        'Email addresses, phone numbers, social security numbers, credit card numbers, and more',
                        'Only data in English text'
                    ],
                    explanation: 'Azure AI Language PII detection identifies a wide range of sensitive data: email addresses, phone numbers, SSNs, credit card numbers, passport numbers, addresses, names, and more. It works across multiple languages, not just English. It can also suggest redacted versions of the text with PII masked.'
                },
                {
                    question: 'What is the primary purpose of language detection in Azure AI Language?',
                    options: [
                        'Translating text automatically',
                        'Identifying which language a piece of text is written in',
                        'Detecting grammatical errors',
                        'Analyzing sentiment'
                    ],
                    explanation: 'Language detection identifies the language of input text and returns a language code (e.g., \'en\' for English, \'es\' for Spanish) with a confidence score. This is often used as a preprocessing step before other NLP tasks — for example, detecting the language before routing text to the appropriate sentiment model or translation service.'
                },
                {
                    question: 'Which NLP capability would best help a company analyze thousands of product reviews to understand common complaints?',
                    options: [
                        'Language detection',
                        'PII detection',
                        'Key phrase extraction combined with sentiment analysis',
                        'Translation'
                    ],
                    explanation: 'Combining key phrase extraction with sentiment analysis gives the most actionable insights from product reviews. Key phrases reveal WHAT customers are talking about (battery life, screen quality, customer service). Sentiment reveals HOW they feel about each topic (positive, negative, neutral). Together, they identify specific pain points at scale.'
                },
                {
                    question: 'What replaced QnA Maker for building question-answering solutions in Azure?',
                    options: [
                        'Azure Bot Service',
                        'Azure AI Language Question Answering feature',
                        'Azure Cognitive Search',
                        'Azure OpenAI Service'
                    ],
                    explanation: 'QnA Maker was retired in March 2025 and replaced by the Question Answering feature in Azure AI Language. It allows you to create a knowledge base from FAQs, documents, and web pages, then deploy it as an API that answers natural language questions. Azure Bot Service is a framework for building bots (not QnA specifically). Cognitive Search indexes content. OpenAI generates text.'
                },
                {
                    question: 'A company wants to automatically extract action items and key decisions from meeting transcripts. Which combination of NLP capabilities would be most effective?',
                    options: [
                        'Sentiment analysis only',
                        'Translation and language detection',
                        'Extractive summarization and key phrase extraction',
                        'PII detection and NER'
                    ],
                    explanation: 'Extractive summarization identifies the most important sentences (which often contain decisions and conclusions). Key phrase extraction highlights the specific topics and action items. Together, they distill a long meeting transcript into actionable takeaways. Sentiment analysis reveals emotional tone but not action items. PII detection finds personal data. NER finds entities but not action items.'
                }
            ]
        });
        quiz.start();
    </script>
