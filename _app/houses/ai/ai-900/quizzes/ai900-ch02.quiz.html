<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to AI-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Computer Vision',
            description: 'Test your understanding of computer vision concepts, Azure AI Vision, and image analysis capabilities',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch02-quiz',
            moduleId: 'ai900-ch02-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'What does image classification determine about an image?',
                    options: [
                        'The location of objects within the image',
                        'What the primary subject of the image is',
                        'The number of pixels in the image',
                        'Whether the image is real or generated'
                    ],
                    explanation: 'Image classification identifies WHAT the primary subject of an image is — labeling the entire image with a category like "cat," "car," or "sunset." It answers "what is this?" not "where are things?" Object detection finds locations with bounding boxes. Pixel counting measures resolution. Real vs generated detection is a separate AI capability.'
                },
                {
                    question: 'How does object detection differ from image classification?',
                    options: [
                        'Object detection is less accurate',
                        'Object detection identifies the location of objects with bounding boxes',
                        'Object detection only works with video',
                        'Object detection requires more training data'
                    ],
                    explanation: 'Object detection goes beyond classification by identifying WHERE objects are in an image, drawing bounding boxes with coordinates around each detected object. Classification says "this image contains a dog." Detection says "there is a dog at position (120, 45) to (280, 190)." Accuracy, video-only, and data requirements are not the distinguishing factors.'
                },
                {
                    question: 'What does semantic segmentation do at the pixel level?',
                    options: [
                        'Compresses the image to reduce file size',
                        'Classifies each individual pixel as belonging to a specific category',
                        'Removes background noise from images',
                        'Converts color images to grayscale'
                    ],
                    explanation: 'Semantic segmentation classifies EVERY SINGLE PIXEL in an image — assigning each one to a category (sky, road, car, person). This creates pixel-perfect masks, not just bounding boxes. It is used in self-driving cars to understand exactly where the road ends and sidewalk begins. Compression, noise removal, and grayscale conversion are image processing operations, not segmentation.'
                },
                {
                    question: 'Which Azure service provides pre-built computer vision capabilities including image analysis and OCR?',
                    options: [
                        'Azure Machine Learning',
                        'Azure AI Vision',
                        'Azure AI Language',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure AI Vision (formerly Computer Vision) provides pre-built APIs you can call immediately — image analysis, object detection, OCR, face detection — without training your own model. Azure Machine Learning is a platform for custom model development. Azure AI Language handles text, not images. Cognitive Search is a search indexing service.'
                },
                {
                    question: 'What is the primary purpose of OCR in computer vision?',
                    options: [
                        'Detecting objects in images',
                        'Recognizing faces in photographs',
                        'Extracting text from images and documents',
                        'Generating image descriptions'
                    ],
                    explanation: 'OCR (Optical Character Recognition) identifies and extracts text from images — whether printed text in documents, text on street signs, or handwritten notes. It converts visual text into machine-readable strings. Object detection finds objects, face recognition identifies people, and image generation creates new images — none of these extract text.'
                },
                {
                    question: 'What can a multi-modal AI model do that a standard vision model cannot?',
                    options: [
                        'Process images faster',
                        'Combine visual and text information to generate descriptions',
                        'Detect more objects per image',
                        'Work without training data'
                    ],
                    explanation: 'Multi-modal models process BOTH visual and text inputs simultaneously, enabling capabilities that neither modality alone can achieve — like generating a detailed caption for an image, or answering questions about what is in a photo. Standard vision models process images only. Multi-modal is not about speed, object count, or training data requirements.'
                },
                {
                    question: 'What is the difference between face detection and facial recognition?',
                    options: [
                        'They are the same technology',
                        'Detection finds faces; recognition identifies who the person is',
                        'Detection is less accurate than recognition',
                        'Recognition only works with frontal photos'
                    ],
                    explanation: 'Face DETECTION finds faces in an image and analyzes attributes like estimated age, emotional expression, glasses, and head pose. Face RECOGNITION goes further — it matches a detected face against a database of known individuals to identify WHO the person is. Detection answers "there is a face here." Recognition answers "this face belongs to John Smith." They are fundamentally different capabilities.'
                },
                {
                    question: 'A self-driving car needs to identify and locate pedestrians, vehicles, and traffic signs in real-time. Which capability?',
                    options: [
                        'Image classification',
                        'Object detection',
                        'OCR',
                        'Semantic segmentation'
                    ],
                    explanation: 'Object detection is ideal for self-driving cars because it identifies multiple objects AND their precise locations simultaneously — "pedestrian at coordinates (120,45), vehicle at (300,80), stop sign at (50,20)." Classification only labels the whole image. OCR extracts text. Semantic segmentation provides pixel masks but not object identity labels with bounding boxes.'
                },
                {
                    question: 'What does the Azure AI Vision Read API specialize in?',
                    options: [
                        'Real-time face detection',
                        'Extracting text from large, complex documents',
                        'Training custom image classifiers',
                        'Generating image thumbnails'
                    ],
                    explanation: 'The Azure AI Vision Read API is optimized for extracting text from large, complex, multi-page documents — think scanned contracts, printed reports, or handwritten notes spanning many pages. It handles mixed content (printed + handwritten) and returns results line by line. Face detection finds people. Classification labels images. Thumbnails resize images.'
                },
                {
                    question: 'A retail store uses cameras to monitor shelf stock levels. Which computer vision capability is most appropriate?',
                    options: [
                        'OCR',
                        'Face detection',
                        'Object detection',
                        'Image generation'
                    ],
                    explanation: 'Object detection identifies and counts individual products on shelves with bounding boxes, enabling automated stock level monitoring — "shelf A3 has 2 units of Product X remaining." OCR extracts text (useful for reading labels, not counting items). Face detection finds people. Image generation creates new images.'
                },
                {
                    question: 'Which responsible AI concern is most critical when deploying facial recognition technology?',
                    options: [
                        'Processing speed',
                        'Privacy and potential for surveillance misuse',
                        'Image file format compatibility',
                        'Network bandwidth requirements'
                    ],
                    explanation: 'Privacy is the most critical concern with facial recognition because the technology can enable mass surveillance, tracking individuals without their knowledge or consent, and building identification databases. Processing speed, file formats, and bandwidth are technical concerns — not ethical ones. The potential for misuse and civil liberties violations makes privacy the primary consideration.'
                },
                {
                    question: 'What format does the Azure AI Vision API return analysis results in?',
                    options: [
                        'XML',
                        'CSV',
                        'JSON',
                        'Plain text'
                    ],
                    explanation: 'Azure AI Vision returns analysis results as structured JSON — JavaScript Object Notation — containing labels, confidence scores, bounding box coordinates, extracted text, and other analysis data. This structured format makes it easy for applications to parse and use the results programmatically. XML, CSV, and plain text are not the standard return format for Azure AI Vision APIs.'
                },
                {
                    question: 'Azure Custom Vision allows you to:',
                    options: [
                        'Only use Microsoft\'s pre-built models',
                        'Train your own image classification or object detection models with your data',
                        'Edit and modify existing photographs',
                        'Generate new images from text descriptions'
                    ],
                    explanation: 'Azure Custom Vision lets you upload YOUR OWN labeled images and train a custom classifier or detector specific to your use case — no machine learning expertise required. You might train it to identify different types of circuit boards, or detect cracks in concrete. Pre-built models are general purpose. Custom Vision is for YOUR specific domain. It does not edit photos or generate images.'
                },
                {
                    question: 'A hospital needs to extract patient information from scanned intake forms with structured fields. Which Azure service is most appropriate?',
                    options: [
                        'Azure AI Vision OCR',
                        'Azure AI Document Intelligence',
                        'Azure AI Language',
                        'Azure Cognitive Search'
                    ],
                    explanation: 'Azure AI Document Intelligence (formerly Form Recognizer) specializes in extracting STRUCTURED key-value pairs from forms — it understands document layouts and returns named fields like "Patient Name: Smith, DOB: 1985-03-15." Standard OCR only extracts raw text lines without understanding field relationships. AI Language handles text analytics. Cognitive Search indexes content for search.'
                },
                {
                    question: 'A museum wants to generate audio descriptions of artwork for visually impaired visitors. Which capability combination is needed?',
                    options: [
                        'Object detection + OCR',
                        'Image description + text-to-speech',
                        'Face detection + classification',
                        'OCR + translation'
                    ],
                    explanation: 'Image description (multi-modal) generates a natural language text caption of the artwork — "A vibrant oil painting of a harbor at sunset with fishing boats." Text-to-speech then converts that caption into spoken audio for the visitor. This combination serves accessibility needs. Object detection + OCR would find objects and text but not generate a descriptive narrative. Face detection is irrelevant to artwork description.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
