    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: Predictive Models with Azure ML',
            description: 'Test your understanding of Azure Machine Learning, AutoML, model evaluation, deployment, and Azure AI Foundry',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'ai',
            achievement: 'ai900-ch05-quiz',
            moduleId: 'ai900-ch05-quiz',
            serverGrading: true,
            houseId: 'ai',
            trackProgress: true,

            questions: [
                {
                    question: 'What is Azure Machine Learning?',
                    options: [
                        'A pre-built AI model',
                        'A cloud platform for building, training, and deploying ML models',
                        'A database service',
                        'A content delivery network'
                    ],
                    explanation: 'Azure Machine Learning is Microsoft\'s end-to-end cloud platform for the full ML lifecycle. At the crawl level, think of it as a workspace where you bring data and get back predictions. Walk level: it provides tools for data preparation, model training (manual or AutoML), and experiment tracking. Run level: it integrates compute clusters, pipelines, model registries, and one-click deployment to REST endpoints — all within Azure\'s security and compliance boundary.'
                },
                {
                    question: 'What does Automated ML (AutoML) do?',
                    options: [
                        'Writes Python code automatically',
                        'Automatically tries multiple algorithms and selects the best model for your data',
                        'Automatically collects training data',
                        'Automatically deploys models to production'
                    ],
                    explanation: 'AutoML removes the manual trial-and-error of algorithm selection. Crawl: you give it a dataset and a target column, and it returns the best model. Walk: under the hood, AutoML runs many experiments in parallel — testing algorithms like logistic regression, gradient boosting, and neural networks — then ranks them by your chosen metric (accuracy, AUC, RMSE). Run: it also handles feature engineering, hyperparameter tuning, and cross-validation automatically, making ML accessible without deep algorithmic expertise.'
                },
                {
                    question: 'What is the purpose of splitting data into training and test sets?',
                    options: [
                        'To reduce storage costs',
                        'To evaluate how well the model performs on data it has never seen',
                        'To speed up training',
                        'To encrypt sensitive data'
                    ],
                    explanation: 'The train/test split is fundamental to honest model evaluation. Crawl: the training set teaches the model; the test set checks if it actually learned. Walk: if you evaluate on training data, the model looks artificially good — it has already memorized those examples. The test set must be completely unseen during training to simulate real-world performance. Run: a common split is 80% train / 20% test. For small datasets, k-fold cross-validation repeatedly rotates the test portion to get a more reliable estimate without wasting data.'
                },
                {
                    question: 'Which evaluation metric measures how close a regression model\'s predictions are to actual values?',
                    options: [
                        'Accuracy',
                        'F1 Score',
                        'Root Mean Squared Error (RMSE)',
                        'AUC'
                    ],
                    explanation: 'RMSE is the standard error metric for regression — models that predict continuous numeric values. Crawl: RMSE tells you how far off your predictions are in the same units as your target (e.g., dollars, degrees). Walk: it squares each error before averaging, which penalizes large mistakes more heavily than small ones — then takes the square root to return to original units. Run: Accuracy measures correctness for classification (categories). F1 Score balances precision and recall for classification. AUC measures how well a classifier separates classes. None of these apply to regression.'
                },
                {
                    question: 'A model correctly identifies 90 out of 100 spam emails but also flags 20 legitimate emails as spam. Which metric best captures this over-flagging problem?',
                    options: [
                        'Recall',
                        'Precision',
                        'RMSE',
                        'Silhouette score'
                    ],
                    explanation: 'Precision measures what fraction of the items the model labeled positive were actually positive. Crawl: in this case, the model flagged 110 emails as spam (90 real + 20 false alarms). Only 90 were actually spam, so precision = 90/110 = 82% — meaning 18% of its spam calls were wrong. Walk: low precision = too many false positives. Users delete legitimate emails by mistake. Recall measures the opposite — how many actual spam emails were caught. RMSE is for regression (continuous values). Silhouette score evaluates clustering quality. Neither applies here.'
                },
                {
                    question: 'What is clustering used for?',
                    options: [
                        'Predicting a specific numeric value',
                        'Classifying items into predefined categories',
                        'Discovering natural groups in data without labels',
                        'Translating text between languages'
                    ],
                    explanation: 'Clustering is an unsupervised ML technique — no labels required. Crawl: you give the algorithm data and it finds natural groupings on its own. Walk: unlike classification (where you define the categories in advance), clustering discovers structure the human analyst may not have anticipated. A retailer might cluster customers by purchase behavior and discover five distinct buyer profiles they never knew existed. Run: common algorithms include K-Means (specify number of clusters), DBSCAN (density-based, finds irregular shapes), and hierarchical clustering. The silhouette score evaluates how well-separated the resulting clusters are.'
                },
                {
                    question: 'In Azure ML Designer, how do you build a model?',
                    options: [
                        'By writing SQL queries',
                        'By dragging and connecting components on a visual canvas',
                        'By uploading a pre-trained model only',
                        'By editing JSON configuration files'
                    ],
                    explanation: 'Azure ML Designer is a no-code/low-code visual tool for building ML pipelines. Crawl: think of it like a flowchart builder — drag a dataset box, connect it to a cleaning box, connect that to a training box. Walk: each component represents a data transformation or model step. You connect outputs to inputs to define the data flow. When you run the pipeline, Azure executes each component in order on a compute cluster. Run: Designer is ideal for teams that understand ML concepts but prefer visual workflows over Python. It generates production-ready pipelines that can be retrained on new data by re-running the pipeline.'
                },
                {
                    question: 'What is a \'feature\' in machine learning?',
                    options: [
                        'A bug fix in software',
                        'An input variable used to make predictions',
                        'The final prediction output',
                        'A type of neural network'
                    ],
                    explanation: 'Features are the measurable input variables the model uses to make predictions. Crawl: if you\'re predicting house prices, features might include square footage, number of bedrooms, and zip code. Walk: the quality and relevance of your features often matter more than which algorithm you choose — this is called feature engineering. A feature like "price per square foot of nearby sold homes" can be more predictive than raw square footage alone. Run: the prediction output is called the label or target (y). Features are the x variables. Feature selection (choosing which inputs matter) and feature engineering (transforming inputs) are major parts of the ML workflow.'
                },
                {
                    question: 'After training a model in Azure ML, how do you make it available for applications to use?',
                    options: [
                        'Email the model file to developers',
                        'Deploy it as a REST API endpoint',
                        'Save it to a USB drive',
                        'Print the model parameters'
                    ],
                    explanation: 'Deploying a model as a REST API endpoint is the standard pattern for making ML predictions available to applications. Crawl: once deployed, any application sends an HTTP POST request with input data and receives a prediction in the response. Walk: in Azure ML, you can deploy to a managed online endpoint (real-time, low latency) or a batch endpoint (large volumes, scheduled). The endpoint handles authentication, scaling, and monitoring. Run: the typical flow is — register the model in the Azure ML model registry, create an endpoint, deploy the model to it with a scoring script that defines how inputs are processed and predictions are returned, then test with the REST URL.'
                },
                {
                    question: 'What does R-squared (R2) measure in regression?',
                    options: [
                        'The number of features used',
                        'The proportion of variance in the target that the model explains',
                        'The training time in seconds',
                        'The number of data points'
                    ],
                    explanation: 'R-squared measures explanatory power — how much of the variation in your target variable is captured by the model. Crawl: R2 = 0.94 means the model explains 94% of why house prices vary across the dataset. Walk: a baseline model that always predicts the mean would have R2 = 0. A perfect model scores R2 = 1.0. Negative R2 is possible if the model is worse than always guessing the mean. Run: R2 is unit-free (always between -inf and 1), making it useful for comparing models across different datasets. Use it alongside RMSE — R2 tells you relative explanatory power; RMSE tells you absolute prediction error in real units.'
                },
                {
                    question: 'What is Azure AI Foundry?',
                    options: [
                        'A hardware manufacturing facility',
                        'A unified platform that combines Azure ML, OpenAI, and AI services in one portal',
                        'A certification exam center',
                        'A data storage service'
                    ],
                    explanation: 'Azure AI Foundry (formerly Azure AI Studio) is Microsoft\'s unified AI development hub. Crawl: it\'s one portal where you can work with Azure ML, Azure OpenAI Service, and Azure AI services without switching between separate tools. Walk: Foundry introduces the concept of AI projects and hubs — a hub is a shared workspace with centralized governance (connections, compute, security), and projects live inside hubs for team collaboration. Run: Foundry is the strategic convergence point for Microsoft\'s AI stack — model catalog (including OpenAI, Meta Llama, Mistral), prompt flow for LLM orchestration, evaluation tools, and responsible AI dashboards all in one place.'
                },
                {
                    question: 'A classification model has 95% accuracy but only 40% recall for detecting fraud. What does this mean?',
                    options: [
                        'The model is excellent at detecting fraud',
                        'The model correctly predicts most transactions but misses 60% of actual fraud cases',
                        'The model is too slow for production',
                        'The model needs more features'
                    ],
                    explanation: 'This is the accuracy paradox — high accuracy can hide dangerous failures in imbalanced datasets. Crawl: if 95% of transactions are legitimate, a model that labels everything as "not fraud" scores 95% accuracy while catching zero fraud. Walk: recall for fraud = 40% means only 4 out of every 10 fraudulent transactions are caught. The other 6 slip through undetected. For fraud detection, catching actual fraud (recall) matters far more than overall accuracy. Run: in imbalanced scenarios, teams often use AUROC, F1 score, or optimize for recall at an acceptable precision threshold rather than accuracy. Azure ML\'s confusion matrix visualization makes this failure mode immediately visible.'
                },
                {
                    question: 'What is the silhouette score used for?',
                    options: [
                        'Evaluating regression models',
                        'Measuring how well-separated clusters are in clustering',
                        'Calculating classification accuracy',
                        'Measuring API response time'
                    ],
                    explanation: 'The silhouette score is the primary quality metric for unsupervised clustering. Crawl: it answers "are my clusters tight and well-separated?" Walk: for each data point, it measures how similar that point is to its own cluster versus the nearest neighboring cluster. The score ranges from -1 to +1: scores near +1 mean the point fits its cluster well and is far from others; near 0 means it\'s on a cluster boundary; negative means it may be in the wrong cluster. Run: you typically compute the average silhouette score across all points. A score above 0.5 is generally considered reasonable. You can use silhouette scores to compare different values of K in K-Means to find the optimal number of clusters.'
                },
                {
                    question: 'What information does a model card typically contain?',
                    options: [
                        'The model\'s source code',
                        'The model\'s capabilities, limitations, intended use cases, and evaluation metrics',
                        'The model\'s hardware requirements only',
                        'The model\'s billing history'
                    ],
                    explanation: 'A model card is a responsible AI documentation artifact that accompanies a published model. Crawl: think of it as a nutrition label for an ML model — it tells you what\'s in it and what it\'s safe for. Walk: a complete model card includes the model\'s intended use cases, out-of-scope uses, training data description, evaluation metrics across demographic groups, known limitations and failure modes, and ethical considerations. Run: model cards were introduced by Google researchers to promote transparency and became standard practice across the industry. Azure ML and AI Foundry both support creating and publishing model cards in the model registry, enabling teams to make informed decisions before deploying a model in a new context.'
                },
                {
                    question: 'A real estate company wants to predict house prices. Which ML task type should they use?',
                    options: [
                        'Classification',
                        'Clustering',
                        'Regression',
                        'Anomaly detection'
                    ],
                    explanation: 'House price prediction is a regression problem because the target (price) is a continuous numeric value. Crawl: regression predicts "how much" or "how many" — any numeric output on a continuous scale. Walk: classification predicts a category (spam/not spam, approved/denied). Clustering discovers groups in unlabeled data (no target variable at all). Anomaly detection flags unusual data points that deviate significantly from the norm — useful for fraud or equipment failure, but not for price prediction. Run: in Azure ML, AutoML automatically selects the task type based on your target column. For house prices, it would run regression algorithms (linear regression, gradient boosted trees, neural networks) and optimize for RMSE or R2 as the evaluation metric.'
                }
            ]
        });
        quiz.start();
    </script>
