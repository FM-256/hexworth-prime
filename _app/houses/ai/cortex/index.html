<style>
/* ============================================================
   THE CORTEX — AI/ML Hub
   House of AI | Hexworth Prime
   Prefix: cx-
   Accent: #8b5cf6 (purple/violet)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --cx-primary:#8b5cf6;
    --cx-secondary:#7c3aed;
    --cx-accent:#a78bfa;
    --cx-glow:rgba(139,92,246,0.16);
    --cx-bg:#09080f;
    --cx-surface:rgba(255,255,255,0.03);
    --cx-surface-solid:#110f1a;
    --cx-border:rgba(139,92,246,0.14);
    --cx-border-light:rgba(255,255,255,0.06);
    --cx-text:#e2e8f0;
    --cx-muted:#8b949e;
    --cx-dim:#444;
}
body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--cx-bg);color:var(--cx-text);
    min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ---- Particle field ---- */
.cx-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cx-particle{
    position:absolute;bottom:-10px;border-radius:50%;
    color:var(--cx-primary);
    animation:cxFloat linear infinite;
}
@keyframes cxFloat{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:var(--o,0.2)}
    90%{opacity:var(--o,0.2)}
    100%{transform:translateY(-100vh) rotate(360deg);opacity:0}
}

/* ---- Ambient glow ---- */
.cx-ambient{
    position:fixed;top:-200px;left:50%;width:900px;height:500px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(139,92,246,0.07) 0%,transparent 70%);
    pointer-events:none;z-index:0;
}

/* ---- Header ---- */
.cx-header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:rgba(9,8,15,0.94);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(139,92,246,0.18);
}
.cx-header-left{display:flex;align-items:center;gap:12px}
.cx-header-icon{border-radius:6px}
.cx-header-title{font-size:16px;font-weight:700;color:var(--cx-primary)}
.cx-header-sub{font-size:12px;color:var(--cx-muted)}
.cx-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;
    background:rgba(139,92,246,0.08);color:var(--cx-primary);
    border:1px solid rgba(139,92,246,0.22);transition:all 0.2s;cursor:pointer;
}
.cx-btn:hover{background:rgba(139,92,246,0.16)}

/* ---- Breadcrumb ---- */
.cx-breadcrumb{
    padding:10px 24px;font-size:13px;color:var(--cx-muted);
    background:rgba(9,8,15,0.6);border-bottom:1px solid rgba(255,255,255,0.04);
    position:relative;z-index:99;
}
.cx-breadcrumb a{color:var(--cx-primary);text-decoration:none;transition:opacity 0.2s}
.cx-breadcrumb a:hover{opacity:0.8}
.cx-breadcrumb-sep{margin:0 8px;color:var(--cx-dim)}
.cx-breadcrumb-current{color:var(--cx-text)}

/* ---- Main container ---- */
.cx-main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}

/* ---- Hero ---- */
.cx-hero{text-align:center;padding:52px 0 36px}
.cx-hero-title{
    font-size:52px;font-weight:800;
    background:linear-gradient(135deg,#8b5cf6,#a78bfa,#c4b5fd);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.1;
}
.cx-hero-subtitle{
    font-size:18px;color:var(--cx-muted);margin-top:14px;
    max-width:660px;margin-left:auto;margin-right:auto;line-height:1.55;
}
.cx-hero-tagline{
    display:inline-block;margin-top:18px;padding:6px 16px;border-radius:20px;
    font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    background:rgba(139,92,246,0.08);color:var(--cx-primary);
    border:1px solid rgba(139,92,246,0.22);
}
.cx-hero-stats{display:flex;justify-content:center;gap:48px;margin-top:28px;flex-wrap:wrap}
.cx-stat{text-align:center}
.cx-stat-num{display:block;font-size:32px;font-weight:800;color:var(--cx-primary)}
.cx-stat-label{font-size:11px;color:var(--cx-muted);text-transform:uppercase;letter-spacing:1px}

/* ---- Section headings ---- */
.cx-section{margin-top:40px}
.cx-section-title{
    font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--cx-primary);margin-bottom:16px;
    display:flex;align-items:center;gap:10px;
}
.cx-section-title::after{content:'';flex:1;height:1px;background:var(--cx-border)}

/* ---- Overview panel ---- */
.cx-overview{
    background:var(--cx-surface);border:1px solid var(--cx-border);
    border-radius:14px;padding:28px;
}
.cx-overview-body{
    font-size:14px;color:var(--cx-muted);line-height:1.75;margin-bottom:20px;
}
.cx-domains{display:flex;flex-wrap:wrap;gap:8px}
.cx-domain-pill{
    font-size:11px;font-weight:600;padding:4px 12px;border-radius:6px;
    background:rgba(139,92,246,0.07);color:var(--cx-primary);
    border:1px solid rgba(139,92,246,0.16);letter-spacing:0.3px;
}

/* ---- Prerequisites ---- */
.cx-prereq-panel{
    background:var(--cx-surface);border:1px solid var(--cx-border);
    border-radius:14px;padding:24px;
}
.cx-prereq-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.cx-prereq-card{
    display:flex;align-items:flex-start;gap:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--cx-border-light);
    border-radius:10px;padding:14px 18px;min-width:200px;flex:1;
}
.cx-prereq-card-icon{width:28px;height:28px;flex-shrink:0;border-radius:4px}
.cx-prereq-card-name{font-size:14px;font-weight:600;color:var(--cx-text);margin-bottom:2px}
.cx-prereq-card-desc{font-size:12px;color:var(--cx-muted);line-height:1.4}
.cx-prereq-note{
    margin-top:14px;padding:10px 16px;border-radius:8px;
    background:rgba(139,92,246,0.04);border:1px solid rgba(139,92,246,0.1);
    font-size:12px;color:var(--cx-muted);line-height:1.5;
}

/* ---- Course grid ---- */
.cx-course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
}
.cx-course-card{
    background:var(--cx-surface);border:1px solid var(--cx-border-light);
    border-radius:14px;padding:24px;
    position:relative;overflow:hidden;
    transition:all 0.25s;
}
.cx-course-card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--card-color,var(--cx-primary));
    opacity:0.6;
}
.cx-course-card:hover{
    border-color:var(--card-color,var(--cx-primary));
    box-shadow:0 8px 28px rgba(0,0,0,0.45);
    transform:translateY(-2px);
}
.cx-card-glow{
    position:absolute;top:-40px;right:-40px;width:130px;height:130px;
    background:radial-gradient(circle,var(--card-glow,rgba(139,92,246,0.07)) 0%,transparent 70%);
    pointer-events:none;
}
.cx-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.cx-card-head-left{display:flex;align-items:center;gap:10px}
.cx-card-icon{width:36px;height:36px;border-radius:8px}
.cx-card-id{
    font-size:10px;font-weight:700;letter-spacing:0.5px;
    color:var(--card-color,var(--cx-primary));opacity:0.75;
    font-family:'Courier New',monospace;
}
.cx-card-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.cx-card-desc{font-size:12px;color:var(--cx-muted);line-height:1.5;margin-bottom:12px;min-height:52px}

/* ---- Difficulty badges ---- */
.cx-diff{
    font-size:9px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.cx-diff--beginner{background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.25)}
.cx-diff--intermediate{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)}
.cx-diff--advanced{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}

/* ---- Tags ---- */
.cx-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cx-tag{
    font-size:10px;font-weight:600;letter-spacing:0.3px;padding:2px 8px;border-radius:3px;
    background:rgba(255,255,255,0.05);color:var(--cx-muted);
    border:1px solid rgba(255,255,255,0.06);
}

/* ---- Card footer ---- */
.cx-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.cx-card-meta{font-size:11px;color:var(--cx-muted)}
.cx-card-soon{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#8b5cf6;padding:3px 10px;border-radius:4px;
    background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);
}
.cx-card-live{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#4ade80;padding:3px 10px;border-radius:4px;
    background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);
}

/* ---- Career alignment ---- */
.cx-career-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cx-career-card{
    background:var(--cx-surface);border:1px solid var(--cx-border-light);
    border-radius:12px;padding:20px;
}
.cx-career-icon{width:28px;height:28px;margin-bottom:10px;border-radius:4px}
.cx-career-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.cx-career-desc{font-size:12px;color:var(--cx-muted);line-height:1.5;margin-bottom:10px}
.cx-career-roles{display:flex;flex-wrap:wrap;gap:5px}
.cx-career-role{
    font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;
    background:rgba(139,92,246,0.07);color:var(--cx-primary);
    border:1px solid rgba(139,92,246,0.15);
}

/* ---- Footer ---- */
.cx-footer{
    text-align:center;padding:32px 0 16px;font-size:12px;color:var(--cx-dim);
    border-top:1px solid rgba(255,255,255,0.05);margin-top:48px;
}

/* ---- Responsive ---- */
@media(max-width:700px){
    .cx-hero-title{font-size:34px}
    .cx-hero-stats{gap:24px}
    .cx-course-grid{grid-template-columns:1fr}
    .cx-career-grid{grid-template-columns:1fr}
    .cx-prereq-grid{flex-direction:column}
}
/* Model Forge entry (2026-07-30): the build spine's front door on the Cortex. */
.cx-forge-entry {
    margin-top: 26px; padding: 20px 24px; text-align: left;
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-left: 3px solid #8b5cf6; border-radius: 12px;
    background: linear-gradient(135deg, rgba(139,92,246,0.10), rgba(10,10,18,0.5));
}
.cx-forge-label { font-size: 0.7rem; letter-spacing: 0.22em; color: #a78bfa; font-weight: 700; }
.cx-forge-title { font-size: 1.15rem; font-weight: 700; color: #ede9fe; margin: 6px 0 8px; }
.cx-forge-desc { font-size: 0.9rem; color: #b8b0d0; line-height: 1.55; max-width: 780px; }
.cx-forge-link {
    display: inline-block; margin-top: 14px; padding: 9px 20px;
    border: 1px solid #8b5cf6; border-radius: 8px; color: #ede9fe;
    text-decoration: none; font-weight: 600; font-size: 0.9rem;
}
.cx-forge-link:hover { background: rgba(139, 92, 246, 0.18); }
</style>
</head>

        {
            title: 'Data Scientist',
            icon: '/assets/images/icons/icon-chart.webp',
            desc: 'Extracts insights and builds predictive models from organizational data. Strong statistics, feature engineering, and the ability to translate business problems into ML formulations.',
            roles: ['Data Scientist', 'Applied Scientist', 'ML Analyst']
        },
        {
            title: 'MLOps Engineer',
            icon: '/assets/images/icons/icon-gear.webp',
            desc: 'Builds the infrastructure that takes models from notebooks to production. CI/CD for ML, model monitoring, feature stores, and the reliability engineering needed to keep AI systems healthy.',
            roles: ['MLOps Engineer', 'ML Platform Engineer', 'AI Infrastructure']
        }
    ];

    // ---- Track overview domains ----
    var DOMAINS = [
        'AI History & Ethics', 'Mathematics for ML', 'Supervised Learning',
        'Unsupervised Learning', 'Deep Learning', 'Computer Vision',
        'Sequence Models', 'Natural Language Processing', 'Reinforcement Learning',
        'Generative AI', 'Adversarial ML', 'ML for Cybersecurity',
        'MLOps', 'Capstone Projects'
    ];

    // ---- Prerequisite definitions ----
    var PREREQS = [
        {
            label: 'Python Fundamentals',
            icon: '/assets/images/icons/icon-snake.webp',
            desc: 'Comfort with Python — variables, functions, loops, and basic data structures. All code examples use Python throughout the track.',
            keys: ['hexworth_python_hub_complete', 'hexworth_code_python_complete']
        },
        {
            label: 'Basic Mathematics',
            icon: '/assets/images/icons/icon-numbers.webp',
            desc: 'High-school level algebra and calculus familiarity. ML-3 (Math for ML) builds rigorously from scratch for those who need a refresher.',
            keys: ['hexworth_math_basics_complete']
        }
    ];

    // ---- Particle field ----
    function buildParticles() {
        var container = document.getElementById('cx-particles');
        for (var i = 0; i < 30; i++) {
            var p = document.createElement('span');
            p.className = 'cx-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = -(Math.random() * 20) + 's';
            p.style.setProperty('--o', String(0.07 + Math.random() * 0.18));
            p.style.fontSize = (3 + Math.random() * 4) + 'px';
            p.textContent = '\u2022';
            container.appendChild(p);
        }
    }

    // ---- Hero section ----
    function buildHero() {
        var div = document.createElement('section');
        div.className = 'cx-hero';
        div.innerHTML =
            '<h2 class="cx-hero-title">The Cortex</h2>' +
            '<div class="cx-hero-subtitle">Artificial intelligence and machine learning, built from first principles. From the mathematics of gradient descent to deploying models in production security systems.</div>' +
            '<div class="cx-hero-tagline">AI/ML Track &mdash; House of AI</div>' +
            '<div class="cx-hero-stats">' +
                '<div class="cx-stat"><span class="cx-stat-num">14</span><span class="cx-stat-label">Courses</span></div>' +
                '<div class="cx-stat"><span class="cx-stat-num">140</span><span class="cx-stat-label">Modules</span></div>' +
                '<div class="cx-stat"><span class="cx-stat-num">4</span><span class="cx-stat-label">Career Paths</span></div>' +
                '<div class="cx-stat"><span class="cx-stat-num">3</span><span class="cx-stat-label">Difficulty Tiers</span></div>' +
            '</div>' +
            // Model Forge entry point. The Cortex teaches theory across 14 courses; this is
            // the first lab that makes a learner BUILD the machinery.
            '<div class="cx-forge-entry">' +
                '<div class="cx-forge-label">AI MODEL FORGE &mdash; GATE 2</div>' +
                '<div class="cx-forge-title">HexGrad: Build the Learning Engine</div>' +
                '<div class="cx-forge-desc">Every framework starts with one idea: a number that ' +
                'remembers where it came from. Build reverse-mode automatic differentiation from ' +
                'scratch, then watch your own gradients checked against calculus on random inputs. ' +
                'No framework and no autograd &mdash; you write the derivative yourself, then turn it into a network that learns, then teach it to read.</div>' +
                '<a class="cx-forge-link" href="labs/hexgrad-engine.lab.html">Gate 2: HexGrad</a>' +
                '<a class="cx-forge-link" style="margin-left:10px" href="labs/hexnet-network.lab.html">Gate 3: HexNet</a>' +
                '<a class="cx-forge-link" style="margin-left:10px" href="labs/hextoken-vocabulary.lab.html">Gate 4: HexToken</a>' +
                '<a class="cx-forge-link" style="margin-left:10px" href="labs/hextalk-bigram.lab.html">Gate 5: HexTalk</a>' +
                '<a class="cx-forge-link" style="margin-left:10px" href="labs/hexmemory-rnn.lab.html">Gate 6: HexMemory</a>' +
            '</div>';
        return div;
    }

    // ---- Overview section ----
    function buildOverview() {
        var section = document.createElement('div');
        section.className = 'cx-section';
        section.innerHTML = '<div class="cx-section-title">Track Overview</div>';

        var panel = document.createElement('div');
        panel.className = 'cx-overview';
        panel.innerHTML =
            '<div class="cx-overview-body">' +
                'The Cortex is Hexworth Prime\'s AI and machine learning curriculum — a complete pathway from foundational concepts through production deployment. ' +
                'The track opens with the history, ethics, and taxonomy of AI (ML-2), then builds the mathematical machinery required to understand modern models from the ground up (ML-3). ' +
                'From there, the curriculum moves through classical ML, deep learning, computer vision, sequence models, NLP, and reinforcement learning, before branching into specialized domains: generative AI, adversarial machine learning, ML for cybersecurity, and MLOps. ' +
                'The track concludes with a capstone course where students apply the full curriculum to end-to-end real-world projects. ' +
                'Every course emphasizes intuition and implementation in equal measure — Python and PyTorch throughout, mathematical notation explained, never just invoked.' +
            '</div>' +
            '<div class="cx-domains" id="cx-domains"></div>';
        section.appendChild(panel);

        // Populate domain pills
        setTimeout(function() {
            var container = document.getElementById('cx-domains');
            if (!container) { return; }
            DOMAINS.forEach(function(d) {
                var pill = document.createElement('span');
                pill.className = 'cx-domain-pill';
                pill.textContent = d;
                container.appendChild(pill);
            });
        }, 0);

        return section;
    }

    // ---- Prerequisites section ----
    function buildPrereqs() {
        var section = document.createElement('div');
        section.className = 'cx-section';
        section.innerHTML = '<div class="cx-section-title">Prerequisites</div>';

        var panel = document.createElement('div');
        panel.className = 'cx-prereq-panel';

        var gridDiv = document.createElement('div');
        gridDiv.className = 'cx-prereq-grid';

        PREREQS.forEach(function(p) {
            var earned = p.keys.some(function(k) {
                try { return localStorage.getItem(k) === 'true'; } catch(e) { return false; }
            });
            var card = document.createElement('div');
            card.className = 'cx-prereq-card';
            card.innerHTML =
                '<img class="cx-prereq-card-icon" src="' + p.icon + '" alt="">' +
                '<div>' +
                    '<div class="cx-prereq-card-name">' + p.label +
                        (earned ? ' <span style="color:var(--cx-primary);font-size:10px">[Earned]</span>' : '') +
                    '</div>' +
                    '<div class="cx-prereq-card-desc">' + p.desc + '</div>' +
                '</div>';
            gridDiv.appendChild(card);
        });
        panel.appendChild(gridDiv);

        var note = document.createElement('div');
        note.className = 'cx-prereq-note';
        note.innerHTML =
            'The Cortex assumes basic Python fluency. ML-2 (AI Foundations) and ML-3 (Math for ML) are designed as entry points — no prior ML knowledge is required. ' +
            'Students who already have ML experience may begin at ML-4. All courses are accessible regardless of prerequisite status.';
        panel.appendChild(note);

        section.appendChild(panel);
        return section;
    }

    // ---- Individual course card ----
    function buildCourseCard(course) {
        var card = document.createElement('div');
        card.className = 'cx-course-card';
        card.style.setProperty('--card-color', course.color);
        card.style.setProperty('--card-glow', course.glow);

        var tagsHtml = course.tags.map(function(t) {
            return '<span class="cx-tag">' + t + '</span>';
        }).join('');

        card.innerHTML =
            '<div class="cx-card-glow"></div>' +
            '<div class="cx-card-head">' +
                '<div class="cx-card-head-left">' +
                    '<img class="cx-card-icon" src="' + course.icon + '" alt="">' +
                    '<div class="cx-card-id">' + course.id + '</div>' +
                '</div>' +
                '<span class="cx-diff cx-diff--' + course.difficulty + '">' + course.difficulty + '</span>' +
            '</div>' +
            '<div class="cx-card-name">' + course.name + '</div>' +
            '<div class="cx-card-desc">' + course.desc + '</div>' +
            '<div class="cx-card-tags">' + tagsHtml + '</div>' +
            '<div class="cx-card-foot">' +
                '<span class="cx-card-meta">' + course.modules + ' modules</span>' +
                (course.href
                    ? '<span class="cx-card-live">Available</span>'
                    : '<span class="cx-card-soon">Coming Soon</span>') +
            '</div>';

        if (course.href) {
            card.style.cursor = 'pointer';
            card.addEventListener('click', function() { window.location.href = course.href; });
        }

        return card;
    }

    // ---- Course grid section ----
    function buildCourseGrid() {
        var section = document.createElement('div');
        section.className = 'cx-section';
        section.innerHTML = '<div class="cx-section-title">14 Courses</div>';

        var grid = document.createElement('div');
        grid.className = 'cx-course-grid';

        COURSES.forEach(function(course) {
            grid.appendChild(buildCourseCard(course));
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Career alignment section ----
    function buildCareers() {
        var section = document.createElement('div');
        section.className = 'cx-section';
        section.innerHTML = '<div class="cx-section-title">Career Alignment</div>';

        var grid = document.createElement('div');
        grid.className = 'cx-career-grid';

        CAREERS.forEach(function(career) {
            var card = document.createElement('div');
            card.className = 'cx-career-card';

            var rolesHtml = career.roles.map(function(r) {
                return '<span class="cx-career-role">' + r + '</span>';
            }).join('');

            card.innerHTML =
                '<img class="cx-career-icon" src="' + career.icon + '" alt="">' +
                '<div class="cx-career-title">' + career.title + '</div>' +
                '<div class="cx-career-desc">' + career.desc + '</div>' +
                '<div class="cx-career-roles">' + rolesHtml + '</div>';

            grid.appendChild(card);
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Footer ----
    function buildFooter() {
        var footer = document.createElement('div');
        footer.className = 'cx-footer';
        footer.innerHTML = 'The Cortex &mdash; AI/ML Hub &mdash; House of AI &mdash; Hexworth Prime';
        return footer;
    }

    // ---- Main render ----
    function render() {
        buildParticles();

        var main = document.getElementById('cx-main');
        main.appendChild(buildHero());
        main.appendChild(buildOverview());
        main.appendChild(buildPrereqs());
        main.appendChild(buildCourseGrid());
        main.appendChild(buildCareers());
        main.appendChild(buildFooter());
    }

    render();

})();
    </script>
</body>
</html>
