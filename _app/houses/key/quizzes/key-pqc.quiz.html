    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a1e 0%, #2d1535 50%, #1a0a1e 100%);

        }

        }

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Key</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-key.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'PQC Challenge',
            description: 'Test your knowledge of pqc',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'key',
            achievement: 'key-pqc',
            moduleId: 'pqc',
            serverGrading: true,
            houseId: 'key',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the primary threat that Shor\'s algorithm poses to modern cryptography?',
                    options: [
                        'It weakens symmetric encryption by providing quadratic speedup',
                        'It can efficiently factor large numbers and solve discrete logarithm problems, breaking RSA and ECC',
                        'It makes hash functions reversible',
                        'It enables brute-force attacks on AES-256'
                    ],explanation: 'Shor\'s algorithm, developed in 1994, allows quantum computers to efficiently factor large integers and solve discrete logarithm problems in polynomial time. This breaks the mathematical foundations of RSA (factorization), ECC, and Diffie-Hellman (discrete logarithms). Symmetric encryption like AES is only weakened by Grover\'s algorithm, not Shor\'s.'
                },
                {
                    question: 'Which three algorithms did NIST select as the first standardized post-quantum cryptographic algorithms in August 2024?',
                    options: [
                        'Kyber, FALCON, and Classic McEliece',
                        'ML-KEM (Kyber), ML-DSA (Dilithium), and SLH-DSA (SPHINCS+)',
                        'RSA-4096, ECC-521, and SHA-512',
                        'Dilithium, NTRU, and SIKE'
                    ],explanation: 'NIST published three Federal Information Processing Standards (FIPS) in August 2024: FIPS 203 (ML-KEM, formerly Kyber) for key encapsulation, FIPS 204 (ML-DSA, formerly Dilithium) for digital signatures, and FIPS 205 (SLH-DSA, formerly SPHINCS+) for hash-based signatures. FALCON and Classic McEliece are still under consideration in Round 4.'
                },
                {
                    question: 'What is the main advantage of lattice-based cryptography (like Kyber and Dilithium) compared to other post-quantum approaches?',
                    options: [
                        'It produces the smallest possible key and signature sizes',
                        'It has been studied longer than any other PQC approach',
                        'It offers an excellent balance of security, performance, and reasonable key/signature sizes',
                        'It relies only on hash functions with no other assumptions'
                    ],explanation: 'Lattice-based cryptography (specifically Module-LWE used in Kyber and Dilithium) provides the best overall balance. It\'s faster than RSA, has reasonable key/signature sizes (1-4 KB), and offers strong security proofs. Hash-based signatures (SPHINCS+) have smaller keys but much larger signatures. Code-based (McEliece) has been studied longest but has enormous public keys.'
                },
                {
                    question: 'Why should organizations implement hybrid cryptography (combining classical and PQC algorithms) during the transition?',
                    options: [
                        'It makes systems run faster by distributing the computational load',
                        'It provides security if either the classical or PQC algorithm is secure, hedging against cryptanalytic breakthroughs',
                        'It reduces the size of keys and signatures',
                        'It\'s required by government regulations'
                    ],explanation: 'Hybrid approaches combine classical (e.g., ECDH) and PQC (e.g., Kyber) algorithms so that the system remains secure if EITHER algorithm is secure. If quantum computers break ECDH, Kyber protects. If a cryptanalytic breakthrough compromises Kyber, ECDH protects. This provides a safety net during the transition period when both threats exist.'
                },
                {
                    question: 'What is the "Harvest Now, Decrypt Later" (HNDL) threat model?',
                    options: [
                        'Attackers steal encryption keys now and use them immediately',
                        'Adversaries capture encrypted data today and store it until quantum computers can decrypt it in the future',
                        'Organizations delay PQC migration until quantum computers are actually available',
                        'A strategy for rotating cryptographic keys annually'
                    ],explanation: 'The HNDL threat model recognizes that adversaries can capture encrypted traffic TODAY (harvest), store it, and wait for powerful quantum computers to become available in the future (decrypt later). This is especially concerning for data with long-term confidentiality requirements (government secrets, healthcare records, financial data). Organizations must transition to PQC NOW to protect against this threat, even if quantum computers are years away.'
                },
                {
                    question: 'For a high-security government application requiring maximum cryptographic confidence and where bandwidth is not a major constraint, which signature algorithm would be most appropriate?',
                    options: [
                        'ML-DSA-44 (Dilithium) for smallest signatures',
                        'ECDSA P-256 for compatibility',
                        'SLH-DSA (SPHINCS+) for conservative hash-based security',
                        'RSA-4096 with larger keys'
                    ],explanation: 'For maximum security confidence, SLH-DSA (SPHINCS+) is the best choice. It relies only on hash functions (ultra-conservative assumptions) and has been extensively analyzed. While signatures are large (7-30 KB), the scenario states bandwidth is not a constraint. SPHINCS+ is NIST\'s backup standard specifically for high-security applications where conservative security is paramount.'
                },
                {
                    question: 'What is the primary disadvantage of Classic McEliece compared to lattice-based algorithms?',
                    options: [
                        'It\'s much slower than other PQC algorithms',
                        'Extremely large public keys (200+ KB)',
                        'It has weak security proofs',
                        'It only provides digital signatures, not encryption'
                    ],explanation: 'Classic McEliece has excellent security (45+ years of study), good performance, and small ciphertexts. However, its public keys are enormous (260 KB to 1.3 MB), making it impractical for many applications like TLS certificates or IoT devices. This is why Kyber was chosen as the primary KEM standard, with McEliece remaining under consideration as a backup due to its different mathematical foundation.'
                },
                {
                    question: 'What is "crypto agility" and why is it important for post-quantum migration?',
                    options: [
                        'Using the fastest possible cryptographic algorithms',
                        'The ability to quickly swap cryptographic algorithms without major system redesign',
                        'Rotating encryption keys on a regular schedule',
                        'Supporting multiple programming languages for crypto libraries'
                    ],explanation: 'Crypto agility is the design principle of abstracting cryptographic operations so that algorithms can be easily swapped without major code changes. This is critical for PQC migration because: (1) standards may evolve, (2) new attacks may emerge, (3) performance characteristics may differ from expectations, and (4) hybrid modes may be needed during transition. Systems with good crypto agility can respond quickly to cryptographic changes.'
                },
                {
                    question: 'Approximately how much larger is a typical ML-DSA-65 (Dilithium) signature compared to an ECDSA P-256 signature?',
                    options: [
                        'About the same size (within 10%)',
                        '2-3 times larger',
                        'About 50 times larger',
                        'Over 100 times larger'
                    ],explanation: 'ECDSA P-256 signatures are approximately 64 bytes, while ML-DSA-65 (Dilithium) signatures are approximately 3,293 bytes - about 51x larger. This significant size increase impacts bandwidth, especially for protocols with size constraints (DNS, blockchain, IoT). Organizations must plan for this impact through compression, caching, protocol optimizations, or choosing smaller parameter sets (ML-DSA-44) where appropriate.'
                },
                {
                    question: 'Which phase should be the FIRST priority when planning a post-quantum migration?',
                    options: [
                        'Immediately replace all RSA/ECC with PQC algorithms',
                        'Wait until quantum computers are commercially available',
                        'Conduct a cryptographic inventory to identify all systems using quantum-vulnerable algorithms',
                        'Deploy PQC only for new systems, leaving existing systems unchanged'
                    ],explanation: 'The first critical step is discovery: conducting a comprehensive cryptographic inventory to understand WHERE cryptography is used, WHICH algorithms are deployed, and WHAT data needs protection. You cannot migrate what you don\'t know exists. Many organizations discover cryptography in unexpected places (embedded devices, third-party dependencies, legacy systems). Only after completing this inventory can you assess risk, prioritize systems, and plan the actual migration.'
                }
            ]
        });
        quiz.start();
    </script>

</html>
