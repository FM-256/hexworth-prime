<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC &amp; HMAC Quiz - House of the Key</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a1e 0%, #2d1535 50%, #1a0a1e 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(244, 114, 182, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #f472b6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #f9a8d4; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Key</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Message Authentication Quiz',
            description: 'Test your understanding of HMAC, message authentication codes, and authenticated encryption.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'key',
            achievement: 'key-mac',
            moduleId: 'mac',
            houseId: 'key',
            trackProgress: true,
            questions: [
                {
                    question: "What is the primary difference between a hash function and an HMAC?",
                    options: [
                        "HMAC is faster than a hash function",
                        "HMAC incorporates a secret key, providing authentication",
                        "HMAC produces longer output than hash functions",
                        "Hash functions can only be used for password storage"
                    ],
                    correct: 1,
                    explanation: "HMAC (Hash-based Message Authentication Code) uses a secret key combined with a hash function. This key makes it cryptographically secure for authentication\u2014without the key, an attacker cannot forge a valid HMAC. Plain hash functions have no key and can't provide authentication."
                },
                {
                    question: "Why is constant-time comparison critical when verifying MACs?",
                    options: [
                        "It improves performance by skipping unnecessary comparisons",
                        "It prevents timing attacks where attackers measure execution time differences",
                        "It ensures the MAC is computed correctly",
                        "It's only required for HMAC-SHA1, not SHA-256"
                    ],
                    correct: 1,
                    explanation: "Timing attacks exploit the fact that early-exit comparisons take different amounts of time based on where the first mismatch occurs. By measuring response times statistically, attackers can forge valid MACs byte by byte. Constant-time comparison examines every byte regardless of matches, providing consistent execution time."
                },
                {
                    question: "Which authenticated encryption composition method is recommended?",
                    options: [
                        "MAC-then-Encrypt: MAC(plaintext), then encrypt both",
                        "Encrypt-then-MAC: Encrypt(plaintext), then MAC(ciphertext)",
                        "Encrypt-and-MAC: Compute both independently on plaintext",
                        "All methods are equally secure"
                    ],
                    correct: 1,
                    explanation: "Encrypt-then-MAC is the recommended approach because the MAC is verified before decryption, preventing padding oracle attacks and other decryption-based exploits. MAC-then-Encrypt is vulnerable to several attack classes. Encrypt-and-MAC can leak plaintext information."
                },
                {
                    question: "What does AEAD stand for, and what does it provide?",
                    options: [
                        "Advanced Encryption and Decryption",
                        "Authenticated Encryption with Associated Data",
                        "Asymmetric Encryption and Authentication Device",
                        "Automatic Error Detection and Decryption"
                    ],
                    correct: 1,
                    explanation: "AEAD (Authenticated Encryption with Associated Data) modes like AES-GCM and ChaCha20-Poly1305 provide integrated encryption and authentication in a single operation. They can also authenticate additional data (like protocol headers) that isn't encrypted, preventing header manipulation attacks."
                },
                {
                    question: "What is the CRITICAL requirement for AES-GCM nonce management?",
                    options: [
                        "Nonce must be at least 256 bits long",
                        "Nonce must NEVER be reused with the same key",
                        "Nonce must be kept secret from attackers",
                        "Nonce should be derived from the message content"
                    ],
                    correct: 1,
                    explanation: "Nonce reuse in AES-GCM is catastrophic\u2014it can allow attackers to recover the authentication key and forge messages. The nonce doesn't need to be secret (it can be transmitted in the clear), but it must be unique for every encryption operation with the same key. 96-bit nonces are standard, not 256-bit."
                },
                {
                    question: "Why should encryption keys and MAC keys be different?",
                    options: [
                        "It's faster to use two different keys",
                        "Key separation limits the impact if one key is compromised",
                        "MAC keys must be shorter than encryption keys",
                        "They don't need to be different; this is a myth"
                    ],
                    correct: 1,
                    explanation: "Using separate keys for different cryptographic operations is a fundamental security principle. If the same key is used for both encryption and MAC, a weakness or compromise in one system affects both. Key derivation functions (like HKDF) can generate separate keys from a master key."
                },
                {
                    question: "Which hash algorithm should NOT be used with HMAC in new systems?",
                    options: [
                        "SHA-256",
                        "SHA-512",
                        "SHA-1",
                        "SHA-384"
                    ],
                    correct: 2,
                    explanation: "SHA-1 is cryptographically broken and should not be used in new systems, even with HMAC. While HMAC provides some protection against hash weaknesses, it's best practice to use modern hash functions like SHA-256, SHA-384, or SHA-512 for new deployments."
                },
                {
                    question: "In AWS Signature Version 4, what is the primary purpose of signing API requests?",
                    options: [
                        "To encrypt the request data",
                        "To prove the requester has the secret key without transmitting it",
                        "To compress the request for faster transmission",
                        "To generate a unique session ID"
                    ],
                    correct: 1,
                    explanation: "AWS Signature V4 uses HMAC to sign API requests, proving the caller possesses the secret access key without transmitting it over the network. The signature covers the request method, path, headers, and body, ensuring integrity and authenticity. This is a standard pattern for API authentication."
                },
                {
                    question: "What is the main difference between MAC and digital signatures?",
                    options: [
                        "MACs use symmetric keys; digital signatures use asymmetric keys",
                        "MACs are faster but digital signatures are more secure",
                        "Digital signatures can only be used for emails",
                        "There is no difference; they're the same thing"
                    ],
                    correct: 0,
                    explanation: "MACs use symmetric keys (both parties share the same secret), while digital signatures use asymmetric cryptography (private key to sign, public key to verify). This means digital signatures provide non-repudiation (only the private key holder can sign), while both MAC parties can generate valid tags. MACs are much faster than signatures."
                },
                {
                    question: "Why does HMAC use nested hashing with ipad and opad?",
                    options: [
                        "To make computation slower and more secure",
                        "To protect against length extension attacks",
                        "To allow multiple keys in a single HMAC",
                        "To compress the output to save space"
                    ],
                    correct: 1,
                    explanation: "The nested construction H((K \u2295 opad) || H((K \u2295 ipad) || m)) protects against length extension attacks that affect simple H(K || m) constructions. With Merkle-Damg\u00E5rd hashes like SHA-256, attackers could extend H(K || m) without knowing K. HMAC's double hashing prevents this, providing proven security even if the underlying hash has some weaknesses."
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
