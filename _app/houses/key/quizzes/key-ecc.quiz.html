<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Key</a>

    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Elliptic Curve Cryptography Quiz',
            description: 'Test your understanding of ECC concepts, algorithms, and real-world applications. 10 challenging questions covering everything from mathematical foundations to implementation security.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'key',
            achievement: 'key-ecc',
            moduleId: 'ecc',
            serverGrading: true,
            houseId: 'key',
            trackProgress: true,
            questions: [
                {
                    question: "What is the general Weierstrass form of an elliptic curve used in ECC?",
                    options: [
                        "y = x\u00B2 + ax + b",
                        "y\u00B2 = x\u00B3 + ax + b",
                        "y\u00B3 = x\u00B2 + ax + b",
                        "y\u00B2 = x\u00B2 + ax + b"
                    ],explanation: "The Weierstrass form y\u00B2 = x\u00B3 + ax + b is the standard equation for elliptic curves used in cryptography. The discriminant 4a\u00B3 + 27b\u00B2 must be non-zero to ensure the curve has no singularities. This cubic equation creates the characteristic curved shape that makes ECC secure."
                },
                {
                    question: "A 256-bit ECC key provides security equivalent to which RSA key size?",
                    options: [
                        "1024-bit RSA",
                        "2048-bit RSA",
                        "3072-bit RSA",
                        "4096-bit RSA"
                    ],explanation: "A 256-bit ECC key (like P-256) provides 128-bit security, which is equivalent to a 3072-bit RSA key. This 12:1 ratio demonstrates ECC's efficiency advantage. ECC-256 is recommended for most modern applications, while RSA-3072 is the equivalent recommendation for RSA-based systems."
                },
                {
                    question: "What is the Elliptic Curve Discrete Logarithm Problem (ECDLP) that provides ECC's security?",
                    options: [
                        "Given k and G, find Q = k \u00D7 G",
                        "Given P and Q, find P + Q",
                        "Given a and b, find points on y\u00B2 = x\u00B3 + ax + b",
                        "Given Q and G, find k such that Q = k \u00D7 G"
                    ],explanation: "The ECDLP is the hard problem underlying ECC security: given a point Q and base point G, finding the scalar k where Q = k \u00D7 G is computationally infeasible for large k. Computing Q from k (scalar multiplication) is easy using double-and-add algorithms, but the reverse (discrete logarithm) has no known efficient solution, making it a perfect one-way function for cryptography."
                },
                {
                    question: "In ECDH key exchange, what do both parties compute to derive the shared secret?",
                    options: [
                        "Their own public key multiplied by the base point G",
                        "Their private key multiplied by the other party's public key",
                        "The sum of both public keys",
                        "The hash of their concatenated public keys"
                    ],explanation: "In ECDH, Alice computes S = a \u00D7 B (her private key \u00D7 Bob's public key) and Bob computes S = b \u00D7 A (his private key \u00D7 Alice's public key). Since B = b \u00D7 G and A = a \u00D7 G, both arrive at the same point: a \u00D7 (b \u00D7 G) = b \u00D7 (a \u00D7 G) = (a \u00D7 b) \u00D7 G. The x-coordinate of this shared point S becomes the shared secret."
                },
                {
                    question: "What critical security vulnerability occurs if the same nonce (k) is reused in ECDSA signatures?",
                    options: [
                        "The private key can be recovered from two different signatures",
                        "The signatures become identical",
                        "The signature verification always fails",
                        "The public key becomes invalid"
                    ],explanation: "Nonce reuse in ECDSA is catastrophic. If the same k is used for two messages, an attacker can solve for the private key algebraically from the two signatures (r, s1) and (r, s2). This vulnerability compromised Sony's PlayStation 3 signing key and has led to cryptocurrency wallet thefts. Modern implementations use deterministic nonce generation (RFC 6979) to prevent this."
                },
                {
                    question: "Which elliptic curve is used by Bitcoin for transaction signatures?",
                    options: [
                        "P-256 (secp256r1)",
                        "Curve25519",
                        "secp256k1",
                        "P-384 (secp384r1)"
                    ],explanation: "Bitcoin uses secp256k1, a Koblitz curve with the simple equation y\u00B2 = x\u00B3 + 7. This curve was chosen for its computational efficiency and verifiable parameters (no \"magic numbers\"). While less common in traditional applications, secp256k1 has been battle-tested through billions of dollars in cryptocurrency transactions and is also used by Ethereum and other cryptocurrencies."
                },
                {
                    question: "What is the primary advantage of Curve25519 over NIST P-256?",
                    options: [
                        "Larger key size providing more security",
                        "Government certification (FIPS compliance)",
                        "Support for both ECDH and ECDSA",
                        "Resistance to side-channel attacks and faster performance"
                    ],explanation: "Curve25519 was designed by Daniel J. Bernstein with security and implementation safety as primary goals. It's naturally resistant to timing attacks, doesn't require point validation in many scenarios, and uses Montgomery curve arithmetic for better performance. While P-256 has FIPS certification, Curve25519 is preferred for new applications due to its security properties and speed. Note: Curve25519 (X25519) is for ECDH; Ed25519 is the signature variant."
                },
                {
                    question: "What security vulnerability can occur if incoming elliptic curve points are not validated?",
                    options: [
                        "Denial of service from computational overhead",
                        "Invalid curve attacks that can leak private key information",
                        "Automatic key compromise through point reflection",
                        "Buffer overflow from malformed point data"
                    ],explanation: "Invalid curve attacks exploit missing point validation. An attacker sends a point that's not on the specified curve but on a different, weaker curve. If the implementation doesn't verify the point is on the correct curve, it performs operations on the weaker curve, potentially leaking private key bits. This attack has been demonstrated against real implementations. Always validate: 1) Point is on the curve, 2) Point is in the correct subgroup, 3) Point is not the point at infinity."
                },
                {
                    question: "In TLS 1.3, which protocol is used for perfect forward secrecy?",
                    options: [
                        "ECDSA for key agreement",
                        "Static ECDH with certificate-based keys",
                        "Ephemeral ECDH (ECDHE)",
                        "RSA key transport with ECC certificates"
                    ],explanation: "TLS 1.3 mandates Ephemeral ECDH (ECDHE) for key exchange, providing perfect forward secrecy (PFS). In ECDHE, fresh key pairs are generated for each session and destroyed afterward. Even if the server's long-term private key is compromised later, past session keys cannot be recovered, protecting historical communications. TLS 1.3 removed support for static RSA key exchange and static ECDH precisely to enforce PFS."
                },
                {
                    question: "What is the primary difference between ECDH and ECDSA?",
                    options: [
                        "ECDH is for key agreement, ECDSA is for digital signatures",
                        "ECDH uses different curves than ECDSA",
                        "ECDH is faster but less secure than ECDSA",
                        "ECDH requires pre-shared secrets, ECDSA does not"
                    ],explanation: "ECDH and ECDSA serve different cryptographic purposes. ECDH (Elliptic Curve Diffie-Hellman) is a key agreement protocol where two parties establish a shared secret over an insecure channel. ECDSA (Elliptic Curve Digital Signature Algorithm) is for creating and verifying digital signatures to ensure authenticity, integrity, and non-repudiation. Both can use the same curves, but they solve different problems: ECDH for confidentiality (encryption keys), ECDSA for authentication and integrity."
                }
            ]
        });
        quiz.start();
    </script>
