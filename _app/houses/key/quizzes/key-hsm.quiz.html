<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Key</a>

    </header>

    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'HSM & Key Management Quiz',
            description: '10 questions covering HSMs, key lifecycle, envelope encryption, and enterprise key management.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'key',
            achievement: 'key-hsm',
            moduleId: 'hsm',
            serverGrading: true,
            houseId: 'key',
            trackProgress: true,
            questions: [
                {
                    question: "What is the primary purpose of a Hardware Security Module (HSM)?",
                    options: [
                        "To encrypt data faster than software-based encryption",
                        "To provide tamper-resistant storage and cryptographic operations for keys",
                        "To generate random numbers for encryption algorithms",
                        "To serve as a backup storage device for encryption keys"
                    ],explanation: "HSMs are specialized hardware devices designed to protect cryptographic keys from compromise. They provide tamper-resistant/tamper-evident physical security, ensuring keys never exist in plaintext outside the HSM boundary. Physical attacks trigger automatic key zeroization (destruction). While HSMs do offer performance benefits and include TRNGs, their primary purpose is secure key protection."
                },
                {
                    question: "FIPS 140-2 Level 3 certification requires which of the following?",
                    options: [
                        "Software-based encryption with strong passwords",
                        "Tamper-evident seals and role-based authentication",
                        "Tamper-detection circuits that trigger key zeroization and identity-based authentication",
                        "Protection against environmental attacks (voltage, temperature manipulation)"
                    ],explanation: "FIPS 140-2 has four security levels: Level 1: Software cryptography, basic security. Level 2: Tamper-evident seals, role-based authentication. Level 3: Tamper-detection circuits + identity-based auth (physical attacks trigger zeroization). Level 4: Environmental attack protection (voltage, temperature, radiation). Level 3 is required for most high-security applications like payment processing and PKI root CAs."
                },
                {
                    question: "In a key hierarchy, what is the primary benefit of using Key Encryption Keys (KEKs) to protect Data Encryption Keys (DEKs)?",
                    options: [
                        "KEKs are faster to use than master keys for encryption operations",
                        "KEKs eliminate the need for key rotation",
                        "You can rotate KEKs without re-encrypting all data\u2014just re-wrap the DEKs",
                        "KEKs provide stronger encryption than master keys"
                    ],explanation: "The key hierarchy (Master \u2192 KEK \u2192 DEK) allows for efficient key rotation. When you rotate a KEK, you only need to re-wrap (re-encrypt) the DEKs with the new KEK. The actual encrypted data doesn't need to be touched. This is much faster than re-encrypting terabytes of data. Additionally, if a DEK is compromised, only data encrypted with that specific DEK is affected\u2014not all data encrypted with the KEK or master key. This is called \"limiting the blast radius.\""
                },
                {
                    question: "In envelope encryption, what should be stored alongside the encrypted data?",
                    options: [
                        "The plaintext Data Encryption Key (DEK)",
                        "The wrapped (encrypted) DEK and KMS key ID",
                        "The master encryption key",
                        "Nothing\u2014keys should never be stored with data"
                    ],explanation: "Envelope encryption stores: 1. Encrypted data (encrypted with plaintext DEK), 2. Wrapped DEK (DEK encrypted by KEK/master key), 3. KMS key ID (reference to which KEK was used). To decrypt: Send wrapped DEK to KMS \u2192 KMS unwraps it using master key \u2192 Use plaintext DEK to decrypt data \u2192 Delete plaintext DEK from memory. The plaintext DEK is NEVER stored\u2014only the wrapped (encrypted) version. The master key never leaves the HSM/KMS."
                },
                {
                    question: "What is the main difference between BYOK (Bring Your Own Key) and HYOK (Hold Your Own Key)?",
                    options: [
                        "BYOK is for AWS, HYOK is for Azure",
                        "BYOK uses software keys, HYOK uses hardware keys",
                        "BYOK is for symmetric keys, HYOK is for asymmetric keys",
                        "BYOK imports keys to cloud KMS; HYOK keeps keys on-premises with cloud calling back"
                    ],explanation: "BYOK (Bring Your Own Key): You generate keys in your on-premises HSM, then securely import them into cloud KMS. Keys now reside in cloud but you control the source. HYOK (Hold Your Own Key): Keys NEVER leave your on-premises infrastructure. Cloud services call back to your key management server for crypto operations. Maximum control but adds latency and operational complexity. HYOK is used in highly regulated industries (government, defense, banking) where keys must never leave customer-controlled infrastructure."
                },
                {
                    question: "PCI-DSS requires encryption keys to be rotated at least how frequently?",
                    options: [
                        "Annually (every 365 days)",
                        "Quarterly (every 90 days)",
                        "Monthly (every 30 days)",
                        "Only when compromised"
                    ],explanation: "PCI-DSS Requirement 3.6.4 mandates cryptographic key rotation at least annually (every 365 days). Many organizations rotate more frequently based on data sensitivity: High-value keys (master keys): 365 days, Payment KEKs: 180-365 days, DEKs: 90-180 days, Emergency rotation: Immediately upon suspected compromise. Regular rotation limits the \"blast radius\" if a key is compromised\u2014older data encrypted with previous keys remains protected."
                },
                {
                    question: "Which AWS KMS API call is used to generate a new Data Encryption Key (DEK) for envelope encryption?",
                    options: [
                        "CreateKey",
                        "Encrypt",
                        "GenerateDataKey",
                        "GenerateRandom"
                    ],explanation: "GenerateDataKey returns both: 1. Plaintext DEK (use this to encrypt data locally), 2. Wrapped DEK (encrypted DEK to store with data). Other API calls: CreateKey: Creates a new customer master key (CMK) in KMS, Encrypt: Encrypts small data (< 4KB) directly with CMK, GenerateRandom: Returns cryptographically secure random bytes (not keys), Decrypt: Unwraps an encrypted DEK to get plaintext DEK back."
                },
                {
                    question: "In a properly designed access control matrix, which role should NOT have decrypt permissions on encryption keys?",
                    options: [
                        "Application services that process encrypted data",
                        "Key administrators who manage key lifecycle",
                        "Backup and restore services",
                        "Analytics services with read-only access"
                    ],explanation: "Separation of duties: Key administrators should manage keys (create, rotate, delete) but NOT use them for encryption/decryption. This prevents a single compromised admin account from both managing keys and accessing all encrypted data. Proper access control: Application services: Encrypt, Decrypt, GenerateDataKey. Key administrators: Rotate, ScheduleKeyDeletion, UpdateKeyDescription (NO decrypt). Backup services: Decrypt (to restore encrypted data). Analytics (read-only): Decrypt only. Delete operations: Require MFA + manual approval."
                },
                {
                    question: "What is the recommended disaster recovery strategy for HSM master keys in a production e-commerce environment?",
                    options: [
                        "Export keys to S3 with versioning enabled",
                        "Print keys on paper and store in a safe",
                        "No backup needed\u2014regenerate keys if HSM fails",
                        "Multi-region HSM replication or Shamir secret sharing (M-of-N) with geographically distributed custodians"
                    ],explanation: "Best practices for HSM key backup: 1. Multi-region HSM replication: AWS CloudHSM can replicate to backup HSMs in different regions. Automatic failover. 2. Shamir Secret Sharing (3-of-5): Master key split into 5 shares. Any 3 shares can reconstruct the key. Shares held by different executives in different locations. Prevents single-person compromise. 3. HSM smartcard backup: Export wrapped keys to FIPS-certified smartcards. Store in physical safe with M-of-N access control. Exporting to S3 defeats the purpose of HSM (keys leave secure boundary). Printing keys is insecure and difficult to restore. Not backing up keys means data loss if HSM fails."
                },
                {
                    question: "A security audit reveals hardcoded encryption keys in your application's Git repository. What is the FIRST action you should take?",
                    options: [
                        "Delete the repository and create a new one",
                        "Remove the keys from the latest commit",
                        "Immediately rotate the compromised keys",
                        "Run BFG Repo-Cleaner to remove keys from git history"
                    ],explanation: "Remediation Priority: 1. Immediately rotate compromised keys (stop the bleeding). Assume keys are already compromised. Re-encrypt all affected data with new keys. 2. Remove keys from git history (BFG Repo-Cleaner, git filter-branch). Even after deletion, keys remain in git history forever. 3. Scan for forks and pull requests that may contain the keys. 4. Implement proper key management (AWS Secrets Manager, Azure Key Vault, environment variables). 5. Add pre-commit hooks (git-secrets, truffleHog) to prevent future key commits. 6. Assess notification requirements (GDPR, state breach laws if PII/payment data affected). Just removing from the latest commit doesn't help\u2014keys are still in git history accessible to anyone who clones the repo."
                }
            ]
        });
        quiz.start();
    </script>
