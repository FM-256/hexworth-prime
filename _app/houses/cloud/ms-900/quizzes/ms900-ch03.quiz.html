<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Pricing, Licensing, and Support',
            description: 'Test your understanding of M365 pricing models, licensing, admin center, support options, and lifecycle policy.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms900-ch03-quiz',
            moduleId: 'ms900-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the pricing model for Microsoft 365 subscriptions?',
                    options: [
                        'One-time perpetual license purchase',
                        'Per-user, per-month subscription pricing',
                        'Per-device licensing based on hardware',
                        'Free with Azure subscription'
                    ],
                    explanation: 'Microsoft 365 uses a per-user, per-month subscription pricing model. Each user is assigned a license that grants access to the services included in their plan. Pricing varies by plan tier (Business Basic through E5) and commitment type (annual commitment is cheaper than month-to-month). This is fundamentally different from perpetual Office licenses (Office 2021, 2024) which are one-time purchases but do not include cloud services or continuous updates.'
                },
                {
                    question: 'How much can organizations typically save by choosing annual commitment over monthly (no commitment) pricing?',
                    options: [
                        '5%',
                        '10%',
                        '20%',
                        '50%'
                    ],
                    explanation: 'Annual commitment pricing is approximately 20% cheaper than monthly no-commitment pricing. With annual commitment, you pay monthly but commit to a 12-month term. You can add licenses mid-term but cannot reduce below your commitment until renewal. Monthly pricing offers maximum flexibility (cancel anytime) but costs significantly more per user. For organizations with stable headcounts, annual commitment is almost always the better financial choice.'
                },
                {
                    question: 'Which URL provides access to the Microsoft 365 admin center?',
                    options: [
                        'portal.azure.com',
                        'admin.microsoft.com',
                        'security.microsoft.com',
                        'compliance.microsoft.com'
                    ],
                    explanation: 'The Microsoft 365 admin center is accessed at admin.microsoft.com. This is the centralized management portal for users, groups, licenses, billing, service health, and support tickets. portal.azure.com is the Azure portal. security.microsoft.com is the Microsoft 365 Defender portal. compliance.microsoft.com is the Microsoft Purview compliance portal. Each has a specific purpose -- the admin center is for day-to-day M365 administration.'
                },
                {
                    question: 'What is the purpose of the Message Center in the Microsoft 365 admin center?',
                    options: [
                        'To send email to Microsoft support',
                        'To provide advance notice of upcoming feature changes and required admin actions',
                        'To view user email messages',
                        'To configure email routing rules'
                    ],
                    explanation: 'The Message Center provides advance notice (typically 30-90 days) of upcoming feature changes, deprecation notices, and required admin actions. Posts are categorized by service (Teams, Exchange, SharePoint, etc.). Administrators should check the Message Center regularly or configure weekly email digests. This is where Microsoft communicates changes before they happen -- not reading Message Center posts is a common cause of being surprised by feature changes.'
                },
                {
                    question: 'Which admin role should be limited to only 2-4 users in an organization?',
                    options: [
                        'User Administrator',
                        'Billing Administrator',
                        'Global Administrator',
                        'Exchange Administrator'
                    ],
                    explanation: 'Global Administrator has unrestricted access to all admin centers and settings across the entire Microsoft 365 tenant. Because of this extreme privilege, best practice is to limit Global Admin to 2-4 users maximum and require MFA (or use PIM for just-in-time activation). All other administrative tasks should be delegated to role-specific admins: User Administrator for account management, Billing Administrator for finance, Exchange Administrator for email, etc.'
                },
                {
                    question: 'What type of support is included with every Microsoft 365 subscription at no additional cost?',
                    options: [
                        'Dedicated Technical Account Manager',
                        'On-site support visits',
                        'Admin center ticket submission with 24/7 response for critical issues',
                        'FastTrack deployment assistance'
                    ],
                    explanation: 'Every Microsoft 365 subscription includes technical support via the admin center. Administrators can submit support tickets online or by phone. Severity A (critical business impact -- entire service down) receives 24/7 response. Severity B and C receive business hours response. FastTrack is free but only for organizations with 150+ eligible licenses. Dedicated TAMs require a paid Microsoft Unified support agreement. On-site support is not included.'
                },
                {
                    question: 'What is Microsoft FastTrack?',
                    options: [
                        'A premium paid support plan with dedicated engineers',
                        'Free deployment guidance for organizations with 150+ eligible licenses',
                        'A network acceleration service for M365',
                        'An automated license assignment tool'
                    ],
                    explanation: 'Microsoft FastTrack provides free remote deployment guidance for organizations with 150 or more eligible M365 licenses. FastTrack engineers help plan and execute rollouts including Exchange Online migration, Teams deployment, Intune configuration, and security feature enablement. FastTrack does not make configuration changes on your behalf -- they provide guidance and best practices. It is a significant benefit that many organizations do not utilize.'
                },
                {
                    question: 'How much advance notice does Microsoft provide before removing features under the Modern Lifecycle Policy?',
                    options: [
                        '30 days',
                        '90 days',
                        '12 months',
                        '3 years'
                    ],
                    explanation: 'Under the Modern Lifecycle Policy, Microsoft provides at least 12 months notice before removing features from Microsoft 365 cloud services. This advance notice appears in the Message Center and gives organizations time to migrate workflows, retrain users, and update documentation. The Modern Lifecycle Policy applies to continuously updated services (unlike fixed lifecycle products with specific end-of-support dates).'
                },
                {
                    question: 'What is the difference between Targeted Release and Standard Release in Microsoft 365?',
                    options: [
                        'Targeted Release is for testing in a sandbox; Standard Release is production',
                        'Targeted Release delivers features first to selected users; Standard Release rolls out to everyone',
                        'Targeted Release is only for Enterprise plans; Standard Release is for Business plans',
                        'There is no difference -- they are the same release track'
                    ],
                    explanation: 'Targeted Release delivers new features days or weeks before Standard Release. Administrators can configure specific users (like IT staff and change champions) or the entire organization for Targeted Release in the admin center under Settings > Org settings > Release preferences. This allows organizations to preview, test, and prepare for upcoming changes before they reach all users on Standard Release. Best practice is to put IT admins on Targeted Release while keeping most users on Standard Release.'
                },
                {
                    question: 'Which purchasing channel provides the deepest discounts for organizations with 500+ users?',
                    options: [
                        'Web Direct (microsoft.com)',
                        'Cloud Solution Provider (CSP)',
                        'Enterprise Agreement (EA)',
                        'Microsoft Store'
                    ],
                    explanation: 'Enterprise Agreements (EA) provide the deepest volume discounts for large organizations (500+ users). EAs require a 3-year commitment with annual true-up (adjusting license counts once per year). They are managed through Microsoft account teams or Large Account Resellers. Web Direct is list price with no discounts. CSP partners may offer some discounts but typically not as deep as EA pricing. The Microsoft Store is for consumer products.'
                },
                {
                    question: 'What happens to a user\'s Microsoft 365 account when their license is removed?',
                    options: [
                        'The account and all data are immediately deleted',
                        'Desktop apps switch to read-only mode and cloud services become inaccessible',
                        'Nothing changes for 90 days',
                        'The user is automatically downgraded to a free plan'
                    ],
                    explanation: 'When a license is removed, desktop Office apps enter reduced functionality (read-only) mode -- users can view documents but cannot create or edit. Cloud services (email, Teams, SharePoint access) become inaccessible. The user account itself is not deleted -- it remains in Entra ID but without service access. Mailbox data is retained according to retention policies. If the user is fully deleted, the account enters a 30-day soft-delete period before permanent removal.'
                },
                {
                    question: 'Which tool in the M365 admin center helps identify unused licenses?',
                    options: [
                        'Compliance Manager',
                        'Usage Reports',
                        'Service Health Dashboard',
                        'Message Center'
                    ],
                    explanation: 'Usage Reports in the M365 admin center show adoption metrics for each service: which users are actively using Teams, Exchange, OneDrive, and SharePoint. These reports help identify users who are assigned licenses but not using the services -- a direct indicator of wasted license spend. Reports cover 7, 30, 90, or 180-day periods. Compliance Manager tracks regulatory compliance. Service Health monitors outages. Message Center announces feature changes.'
                },
                {
                    question: 'What is group-based licensing in Microsoft Entra ID?',
                    options: [
                        'A discount for purchasing licenses in groups of 10',
                        'Automatic license assignment based on security group membership',
                        'A way to share one license across multiple users',
                        'A licensing tier specifically for Microsoft 365 Groups'
                    ],
                    explanation: 'Group-based licensing automatically assigns licenses to users based on their membership in Entra ID security groups. When a user is added to a group that has licenses assigned to it, they automatically receive those licenses. When removed from the group, licenses are automatically unassigned. This is more efficient and less error-prone than manual per-user assignment, especially in large organizations with frequent employee onboarding and offboarding.'
                },
                {
                    question: 'What is the key difference between perpetual Office licenses and Microsoft 365 subscription licenses?',
                    options: [
                        'Perpetual licenses include more features',
                        'Perpetual licenses are one-time purchases but do not include cloud services or continuous feature updates',
                        'Microsoft 365 subscriptions can only be purchased annually',
                        'There is no difference in features or cost model'
                    ],
                    explanation: 'Perpetual Office licenses (Office 2021, Office LTSC 2024) are one-time purchases that include desktop apps but not cloud services (no Exchange Online, no Teams, no SharePoint Online, no OneDrive). They receive security updates but not new features. Microsoft 365 subscriptions are monthly payments that include desktop apps AND cloud services AND continuous feature updates. Additionally, M365 cloud services may eventually stop supporting connections from unsupported perpetual Office versions.'
                },
                {
                    question: 'A 200-person company wants to optimize M365 costs. 50 executives need full security features, 100 office workers need email and desktop apps, and 50 warehouse workers need only Teams on shared devices. What license mix is most cost-effective?',
                    options: [
                        'E5 for all 200 users',
                        'E5 for executives, E3 for office workers, F1 for warehouse workers',
                        'Business Premium for all 200 users',
                        'E3 for all 200 users with Defender add-on for everyone'
                    ],
                    explanation: 'The most cost-effective approach is mixed licensing: E5 (50 executives -- advanced security, analytics), E3 (100 office workers -- desktop apps, email, core security), and F1 (50 warehouse workers -- Teams and web apps only at the lowest cost). This targets premium features only to users who need them. E5 for everyone wastes money on warehouse workers. Business Premium could work (under 300 users) but lacks the advanced security features executives need. E3 with Defender add-on for everyone overspends on warehouse workers.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
