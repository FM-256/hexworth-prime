<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Security, Compliance, Privacy, and Trust',
            description: 'Test your understanding of Microsoft Entra ID, Defender suite, Purview compliance, and privacy principles.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms900-ch02-quiz',
            moduleId: 'ms900-ch02-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is Microsoft Entra ID?',
                    options: [
                        'A file storage service',
                        'A cloud-based identity and access management service',
                        'A database management system',
                        'A virtual machine hosting platform'
                    ],
                    explanation: 'Microsoft Entra ID (formerly Azure Active Directory) is a cloud-based identity and access management service. It is the identity provider for all Microsoft cloud services -- every user who signs into Microsoft 365, Azure, or any integrated SaaS application authenticates through Entra ID. It provides user management, group management, single sign-on (SSO), multi-factor authentication, and Conditional Access policies.'
                },
                {
                    question: 'What percentage of account compromise attacks does MFA block according to Microsoft?',
                    options: [
                        '50%',
                        '75%',
                        '90%',
                        '99.9%'
                    ],
                    explanation: 'Microsoft reports that multi-factor authentication blocks 99.9% of account compromise attacks. MFA requires a second verification factor beyond the password -- something you have (phone, security key) or something you are (biometric). Even if an attacker obtains a password through phishing or credential stuffing, they cannot complete authentication without the second factor. This is why MFA is the single most impactful security control in Microsoft 365.'
                },
                {
                    question: 'Which Conditional Access signal evaluates the security state of a device before granting access?',
                    options: [
                        'User location',
                        'Application sensitivity',
                        'Device compliance',
                        'Sign-in frequency'
                    ],
                    explanation: 'Device compliance is a Conditional Access signal that checks whether the device meets organizational security requirements defined in Intune compliance policies -- encryption enabled, OS version current, no jailbreak/root detected. Conditional Access evaluates multiple signals: user identity, group membership, device compliance, location (IP/named locations), application being accessed, and real-time risk level. The combination of these signals determines the access decision.'
                },
                {
                    question: 'Which three principles define the Zero Trust security model?',
                    options: [
                        'Encrypt everything, monitor logs, block all external access',
                        'Verify explicitly, use least privilege access, assume breach',
                        'Trust internal network, verify external access, encrypt data',
                        'Enable MFA, deploy firewalls, restrict admin accounts'
                    ],
                    explanation: 'Zero Trust is built on three principles: (1) Verify explicitly -- authenticate and authorize every request based on all available signals, not just network location. (2) Use least privilege access -- limit user access with just-in-time and just-enough-access (JIT/JEA). (3) Assume breach -- minimize blast radius through segmentation, encryption, and continuous monitoring. Microsoft 365 implements these through Conditional Access (verify), PIM (least privilege), and Defender XDR (assume breach).'
                },
                {
                    question: 'Which Microsoft 365 Defender component protects email from phishing and malicious attachments?',
                    options: [
                        'Defender for Endpoint',
                        'Defender for Identity',
                        'Defender for Office 365',
                        'Defender for Cloud Apps'
                    ],
                    explanation: 'Microsoft Defender for Office 365 protects email and collaboration tools from phishing, malicious attachments, and business email compromise. Safe Attachments opens suspicious files in a sandbox to detect malware. Safe Links rewrites URLs to check them at the time of click. Anti-phishing policies use machine learning to detect impersonation attempts. Defender for Endpoint protects devices, Defender for Identity monitors on-premises AD, and Defender for Cloud Apps is a CASB for SaaS applications.'
                },
                {
                    question: 'What is the primary purpose of Microsoft Purview sensitivity labels?',
                    options: [
                        'To organize files into folders',
                        'To classify and protect documents with encryption and visual markings',
                        'To delete old documents automatically',
                        'To compress files for storage optimization'
                    ],
                    explanation: 'Sensitivity labels classify and protect documents and emails by applying encryption, watermarks, headers, footers, and access restrictions based on the classification level (e.g., Public, Internal, Confidential, Highly Confidential). Labels travel with the document -- protection follows the data even when shared externally or downloaded. Auto-labeling policies can apply labels automatically based on content detection (e.g., documents containing credit card numbers get labeled Confidential).'
                },
                {
                    question: 'What does DLP stand for in the context of Microsoft Purview?',
                    options: [
                        'Data Lifecycle Protection',
                        'Data Loss Prevention',
                        'Document Library Policy',
                        'Digital License Provider'
                    ],
                    explanation: 'Data Loss Prevention (DLP) policies in Microsoft Purview detect and prevent the sharing of sensitive information. DLP scans content across Exchange, SharePoint, OneDrive, Teams chat, and endpoints for sensitive data patterns like credit card numbers, Social Security numbers, and health records. When a policy match is found, DLP can block sharing, show a policy tip warning the user, or notify compliance administrators. DLP is a core compliance feature tested on the MS-900 exam.'
                },
                {
                    question: 'Which Microsoft portal provides actual SOC audit reports and ISO certification documents?',
                    options: [
                        'Microsoft Trust Center',
                        'Microsoft Learn',
                        'Service Trust Portal',
                        'Microsoft 365 Admin Center'
                    ],
                    explanation: 'The Service Trust Portal (servicetrust.microsoft.com) is an authenticated portal that provides actual audit reports, compliance certificates, and penetration test results. SOC 1/2/3 reports, ISO 27001/27018 certificates, FedRAMP authorization packages, and GDPR documentation are all available here. The Trust Center (microsoft.com/trust-center) is the public-facing site that explains commitments. The admin center manages your tenant. Microsoft Learn is documentation.'
                },
                {
                    question: 'Which Microsoft privacy principle states that your email and documents are never used for advertising?',
                    options: [
                        'Transparency',
                        'No content-based targeting',
                        'Strong legal protections',
                        'Security'
                    ],
                    explanation: 'The "no content-based targeting" principle means Microsoft does not scan your email, chat messages, files, or other personal content to target advertising. Enterprise data in Microsoft 365 stays private and is never monetized. This distinguishes M365 from consumer services that use content analysis for ad targeting. Microsoft collects diagnostic data to improve service performance and reliability, but this is separate from content-based advertising.'
                },
                {
                    question: 'What is the purpose of Privileged Identity Management (PIM) in Microsoft Entra ID?',
                    options: [
                        'To encrypt all administrator communications',
                        'To provide just-in-time, time-bound admin role activation with approval workflows',
                        'To automatically create new admin accounts',
                        'To monitor network traffic for admin sessions'
                    ],
                    explanation: 'Privileged Identity Management (PIM) eliminates standing admin access by making administrative roles eligible rather than permanently assigned. When an admin needs to perform a privileged task, they activate the role through PIM -- which can require approval, justification, and enforces a time limit (e.g., 4 hours). After the time expires, the role is automatically deactivated. This implements the Zero Trust principle of least privilege access. PIM requires Entra ID P2.'
                },
                {
                    question: 'Which Defender component detects lateral movement and pass-the-hash attacks in on-premises Active Directory?',
                    options: [
                        'Defender for Endpoint',
                        'Defender for Office 365',
                        'Defender for Identity',
                        'Defender for Cloud Apps'
                    ],
                    explanation: 'Microsoft Defender for Identity monitors on-premises Active Directory signals to detect advanced threats like lateral movement, pass-the-hash, pass-the-ticket, and Golden Ticket attacks. It analyzes network traffic and Windows event logs from domain controllers to identify compromised identities and malicious insider actions. It integrates with Entra ID Identity Protection for unified risk scoring across cloud and on-premises environments.'
                },
                {
                    question: 'What is the Microsoft Compliance Manager used for?',
                    options: [
                        'Managing user passwords and MFA settings',
                        'Calculating a compliance score and tracking improvement actions across regulations',
                        'Monitoring network bandwidth usage',
                        'Deploying software updates to endpoints'
                    ],
                    explanation: 'Microsoft Compliance Manager calculates an organizational compliance score across 400+ regulations including GDPR, HIPAA, ISO 27001, and NIST 800-53. It provides improvement actions with step-by-step implementation guidance and tracks both Microsoft-managed controls (things Microsoft does for you) and customer-managed controls (things you need to configure) in a single dashboard. The compliance score quantifies your compliance posture.'
                },
                {
                    question: 'Which type of encryption does Microsoft 365 use by default for data stored in SharePoint and OneDrive?',
                    options: [
                        'No encryption is applied by default',
                        'Encryption at rest using BitLocker and per-file encryption keys',
                        'Only files marked as Confidential are encrypted',
                        'Encryption only applies to files larger than 1 MB'
                    ],
                    explanation: 'All data in SharePoint Online and OneDrive for Business is encrypted at rest by default using a combination of BitLocker (volume-level encryption) and per-file encryption with unique keys. Each file is encrypted with its own key, and the keys are encrypted with a storage-level key hierarchy. This means even if physical disks were stolen from a datacenter, the data would be unreadable. Customer Key and Double Key Encryption provide additional control over encryption keys.'
                },
                {
                    question: 'What does a Cloud Access Security Broker (CASB) do in the context of Microsoft Defender for Cloud Apps?',
                    options: [
                        'Provides antivirus scanning for cloud-stored files',
                        'Manages DNS resolution for cloud applications',
                        'Provides visibility into SaaS usage, governs data access, and detects anomalous behavior',
                        'Accelerates cloud application performance through caching'
                    ],
                    explanation: 'Microsoft Defender for Cloud Apps is a CASB that provides visibility into which SaaS applications employees use (shadow IT discovery), governs data access across cloud apps, detects anomalous user behavior (e.g., massive file downloads, impossible travel), and enforces session controls through Conditional Access App Control. It integrates with Conditional Access to provide real-time monitoring and control of user sessions within cloud applications.'
                },
                {
                    question: 'What is the baseline security feature available for free in all Microsoft 365 tenants?',
                    options: [
                        'Conditional Access policies',
                        'Security defaults',
                        'Privileged Identity Management',
                        'Microsoft Defender for Endpoint'
                    ],
                    explanation: 'Security defaults are a free baseline security configuration available in all Microsoft 365 tenants. They require MFA registration for all users, challenge administrators with MFA on every sign-in, and block legacy authentication protocols that cannot perform MFA. Security defaults are enabled by default on new tenants. Organizations that implement Conditional Access policies (which require Entra ID P1) should disable security defaults, as the two features are mutually exclusive.'
                }
            ]
        });
        quiz.start();
    </script>
