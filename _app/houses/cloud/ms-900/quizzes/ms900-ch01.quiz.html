<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-900 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Cloud Concepts and Microsoft 365',
            description: 'Test your understanding of cloud computing models, Microsoft 365 components, subscription plans, and organizational benefits.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms900-ch01-quiz',
            moduleId: 'ms900-ch01-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which cloud service model does Microsoft 365 primarily represent?',
                    options: [
                        'Infrastructure as a Service (IaaS)',
                        'Platform as a Service (PaaS)',
                        'Software as a Service (SaaS)',
                        'Desktop as a Service (DaaS)'
                    ],
                    explanation: 'Microsoft 365 is a SaaS offering. Microsoft manages everything -- infrastructure, platform, and application -- and delivers it as a subscription service. You simply use the applications (Outlook, Teams, SharePoint) without managing any underlying infrastructure. IaaS provides raw compute and storage (Azure VMs). PaaS provides a development platform (Azure App Service). SaaS is the highest abstraction level where the provider manages the entire stack.'
                },
                {
                    question: 'What is the maximum number of users supported by Microsoft 365 Business plans?',
                    options: [
                        '300 users',
                        '500 users',
                        'Unlimited users',
                        '1000 users'
                    ],
                    explanation: 'All Microsoft 365 Business plans (Basic, Standard, Premium) are capped at 300 users per tenant. Organizations with more than 300 users must use Enterprise plans (E3, E5) or Frontline plans (F1, F3), which have no user cap. This is one of the most common exam questions -- the 300-user limit is the primary differentiator between Business and Enterprise tiers.'
                },
                {
                    question: 'Which Microsoft 365 component provides cloud-based email and calendar services?',
                    options: [
                        'SharePoint Online',
                        'Microsoft Teams',
                        'OneDrive for Business',
                        'Exchange Online'
                    ],
                    explanation: 'Exchange Online is the cloud email and calendar service in Microsoft 365. It provides enterprise mailboxes (50 GB in Business plans, 100 GB in E3/E5), shared calendars, room booking, transport rules, and compliance features. SharePoint handles content management and team sites. Teams handles chat and meetings. OneDrive provides personal file storage.'
                },
                {
                    question: 'In the shared responsibility model for SaaS, which of the following is the customer responsible for?',
                    options: [
                        'Physical datacenter security',
                        'Network infrastructure maintenance',
                        'Identity and access management policies',
                        'Service patching and updates'
                    ],
                    explanation: 'In a SaaS model, the customer is responsible for identity and access management -- configuring Conditional Access policies, enabling MFA, managing user accounts, and setting sharing permissions. Microsoft handles the physical infrastructure, network, service availability, and patching. The shared responsibility model is a core MS-900 concept: Microsoft secures the infrastructure, you secure your data and access.'
                },
                {
                    question: 'Which deployment model combines on-premises infrastructure with cloud services?',
                    options: [
                        'Public cloud',
                        'Private cloud',
                        'Community cloud',
                        'Hybrid cloud'
                    ],
                    explanation: 'Hybrid cloud combines on-premises (private) infrastructure with public cloud services. This is the most common enterprise model for Microsoft 365 deployments. Organizations typically synchronize on-premises Active Directory with Microsoft Entra ID via Entra Connect, maintain some Exchange mailboxes on-premises while moving others to Exchange Online, and use Conditional Access policies that span both environments.'
                },
                {
                    question: 'What is the primary benefit of the OpEx (operational expenditure) model in cloud computing?',
                    options: [
                        'You own the physical hardware outright',
                        'Predictable per-user monthly costs with no upfront capital investment',
                        'Lower total cost guaranteed over 10 years',
                        'Faster network speeds than on-premises'
                    ],
                    explanation: 'The OpEx model converts large upfront capital expenditures (buying servers) into predictable monthly subscription costs. You pay per user per month, scaling costs linearly with headcount. No server purchases, no datacenter leases, no hardware refresh cycles. This predictability is one of the primary business benefits of cloud computing and a key MS-900 exam topic.'
                },
                {
                    question: 'Which Microsoft 365 plan includes desktop Office apps, Intune, and advanced security features for small businesses?',
                    options: [
                        'Microsoft 365 Business Basic',
                        'Microsoft 365 Business Standard',
                        'Microsoft 365 Business Premium',
                        'Microsoft 365 F1'
                    ],
                    explanation: 'Business Premium is the only Business-tier plan that includes both desktop Office apps and Microsoft Intune for device management, plus advanced security features like Defender for Business. Business Basic has web/mobile apps only and no Intune. Business Standard adds desktop apps but lacks Intune and advanced security. F1 is a frontline worker plan with minimal features.'
                },
                {
                    question: 'How much personal cloud storage does OneDrive for Business provide per user by default?',
                    options: [
                        '5 GB',
                        '100 GB',
                        '1 TB',
                        'Unlimited'
                    ],
                    explanation: 'OneDrive for Business provides 1 TB of personal cloud storage per user by default in most M365 plans. For organizations with 5+ users on qualifying plans, administrators can increase this to up to 5 TB per user. Known Folder Move (KFM) can redirect Desktop, Documents, and Pictures folders to OneDrive automatically, providing seamless cloud backup for user files.'
                },
                {
                    question: 'What is the financially-backed uptime SLA that Microsoft guarantees for Microsoft 365 services?',
                    options: [
                        '99.0%',
                        '99.5%',
                        '99.9%',
                        '100%'
                    ],
                    explanation: 'Microsoft guarantees 99.9% uptime for Microsoft 365 services with financially-backed SLAs. If the actual uptime drops below 99.9% in a given month, affected customers are eligible for service credits. 99.9% uptime translates to approximately 8.76 hours of permitted downtime per year. This high availability is achieved through globally distributed, redundant datacenters with automatic failover.'
                },
                {
                    question: 'Which feature in Microsoft Teams allows files shared in a channel to be stored in SharePoint?',
                    options: [
                        'This is the default behavior -- Teams uses SharePoint for channel file storage',
                        'Teams Files Connector must be manually configured',
                        'Files are stored in Azure Blob Storage by default',
                        'Files are stored in OneDrive by default for all conversations'
                    ],
                    explanation: 'This is the default behavior. When a Team is created, a SharePoint site is automatically provisioned behind it. Every channel gets a folder in that site document library. Files shared in channels are stored in SharePoint. Files shared in 1:1 or group chats are stored in the sender OneDrive. Understanding this backend architecture is essential because managing Teams files means managing SharePoint permissions.'
                },
                {
                    question: 'What is the purpose of Microsoft 365 deployment channels like Current Channel and Semi-Annual Enterprise Channel?',
                    options: [
                        'They determine which geographic region hosts your data',
                        'They control how quickly new features are delivered to Office desktop apps',
                        'They set the encryption level for data at rest',
                        'They determine the maximum number of users per tenant'
                    ],
                    explanation: 'Deployment channels control the cadence of feature updates to Microsoft 365 Apps for Enterprise (desktop Office apps). Current Channel delivers features as soon as they are ready. Monthly Enterprise Channel delivers features once per month on a predictable date. Semi-Annual Enterprise Channel delivers features twice per year (January and July). IT administrators choose channels based on their tolerance for change and testing capacity.'
                },
                {
                    question: 'Which Microsoft 365 plan is designed specifically for frontline workers who share devices?',
                    options: [
                        'Microsoft 365 E1',
                        'Microsoft 365 Business Basic',
                        'Microsoft 365 F1',
                        'Microsoft 365 Apps for Enterprise'
                    ],
                    explanation: 'Microsoft 365 F1 (and F3) are specifically designed for frontline workers -- retail staff, factory workers, healthcare workers -- who typically share devices and need mobile-first access. F1 provides Teams and web apps only with a 2 GB mailbox. It is the lowest-cost M365 plan. F3 adds limited Exchange, SharePoint, and OneDrive access. Neither includes desktop Office apps.'
                },
                {
                    question: 'What technology does Microsoft 365 use to enable real-time co-authoring in Word, Excel, and PowerPoint?',
                    options: [
                        'Files must be saved to a local shared network drive',
                        'AutoSave to OneDrive or SharePoint enables real-time co-authoring',
                        'Users must install a separate co-authoring plugin',
                        'Co-authoring requires a Teams meeting to be active'
                    ],
                    explanation: 'AutoSave to OneDrive or SharePoint is the mechanism that enables real-time co-authoring. When a document is saved to either cloud storage location, multiple users can edit simultaneously with changes synced in real time. Each user sees colored cursors indicating where others are editing. Version history provides rollback capability. No plugins or active meetings are required -- just cloud storage.'
                },
                {
                    question: 'What distinguishes Microsoft 365 E5 from E3?',
                    options: [
                        'E5 supports more users per tenant',
                        'E5 includes advanced security (Defender P2), analytics (Power BI Pro), and voice (Phone System)',
                        'E5 includes desktop Office apps while E3 does not',
                        'E5 uses a different cloud infrastructure than E3'
                    ],
                    explanation: 'E5 builds on E3 by adding advanced security features (Microsoft Defender for Endpoint P2, Defender for Office 365 P2, Identity Protection), analytics (Power BI Pro), voice capabilities (Teams Phone System), and advanced compliance (Purview premium features). Both E3 and E5 include desktop apps, unlimited users, and 100 GB mailboxes. E5 is the premium tier for organizations requiring the full Microsoft security and analytics stack.'
                },
                {
                    question: 'An organization needs to provide email and Teams access to 500 employees but cannot exceed a tight budget. Desktop Office apps are not required. Which plan is most cost-effective?',
                    options: [
                        'Microsoft 365 Business Basic',
                        'Microsoft 365 E3',
                        'Microsoft 365 Business Standard',
                        'Microsoft 365 E5'
                    ],
                    explanation: 'Business Basic would be ideal for budget and features (web/mobile apps, email, Teams) but it caps at 300 users. With 500 employees, Business plans are not eligible. The question tests whether you catch the 300-user limit. For 500 users needing only web apps and email, you would need an Enterprise plan. However, among the options, Business Basic cannot serve 500 users. E3 is the most cost-effective Enterprise option, though it includes desktop apps (which are not needed). In practice, organizations might use Exchange Online Plan 1 + Teams as standalone plans, but among these four options, E3 is the only viable choice for 500 users.'
                }
            ]
        });
        quiz.start();
    </script>
