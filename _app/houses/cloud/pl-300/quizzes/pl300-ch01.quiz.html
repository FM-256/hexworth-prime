<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to PL-300 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Prepare the Data',
            description: 'Test your knowledge of Power Query Editor, data sources, transformations, data cleaning, and query folding for the PL-300 exam.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'pl300-ch01-quiz',
            moduleId: 'pl300-ch01-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which Power BI component is used to shape, transform, and clean data before loading it into the model?',
                    options: [
                        'DAX Editor',
                        'Power Query Editor',
                        'Report View',
                        'Power Automate'
                    ],
                    explanation: 'Power Query Editor is the dedicated ETL (Extract, Transform, Load) tool in Power BI. It uses the M language behind the scenes to connect to data sources, shape columns, filter rows, merge queries, and clean data before loading it into the data model. The DAX Editor is for calculations after data is loaded. Report View is for building visuals.'
                },
                {
                    question: 'What language does Power Query use to define transformation steps?',
                    options: [
                        'DAX (Data Analysis Expressions)',
                        'M (Power Query Formula Language)',
                        'SQL (Structured Query Language)',
                        'Python'
                    ],
                    explanation: 'Power Query uses M (Power Query Formula Language), a functional language that defines each transformation step. Every action you take in the Power Query Editor UI generates an M expression behind the scenes. The Advanced Editor shows the full M script. DAX is a separate language used for measures and calculated columns in the data model, not in Power Query.'
                },
                {
                    question: 'Which data source type does Power BI NOT natively support as a direct connection?',
                    options: [
                        'SQL Server',
                        'SharePoint Online list',
                        'MongoDB with a native connector',
                        'Excel workbook'
                    ],
                    explanation: 'Power BI does not include a native, built-in MongoDB connector. To connect to MongoDB, you need a third-party connector or ODBC driver. Power BI natively supports SQL Server (DirectQuery and Import), SharePoint lists, Excel files, OData feeds, Azure services, and many more. This distinction between native and third-party connectors is tested on the PL-300.'
                },
                {
                    question: 'What is the difference between Import mode and DirectQuery mode?',
                    options: [
                        'Import loads data into the .pbix file; DirectQuery sends queries to the source at report time',
                        'DirectQuery is faster because it caches all data locally',
                        'Import mode only works with cloud sources; DirectQuery only with on-premises',
                        'There is no difference -- they produce the same result'
                    ],
                    explanation: 'Import mode copies a snapshot of the data into the Power BI data model (stored in the .pbix file), providing fast performance but requiring scheduled refreshes. DirectQuery does not store data locally -- every visual interaction sends a live query to the source database. DirectQuery gives real-time data but depends on the source performance. Choosing the right mode is a key PL-300 skill.'
                },
                {
                    question: 'What is query folding in Power Query?',
                    options: [
                        'Compressing query results to reduce file size',
                        'Translating Power Query transformation steps into native source queries (like SQL) for server-side processing',
                        'Folding multiple queries into a single table',
                        'Encrypting query steps for security'
                    ],
                    explanation: 'Query folding is when Power Query translates your transformation steps (filters, column selections, type changes) into a native query language like SQL and pushes the processing to the source server. This dramatically improves performance because the server handles filtering and aggregation instead of downloading all data to your machine. Right-click a step and choose "View Native Query" to check if folding is occurring.'
                },
                {
                    question: 'Which transformation step will BREAK query folding?',
                    options: [
                        'Filtering rows where Status = "Active"',
                        'Removing columns',
                        'Adding a custom column with a complex M function that has no SQL equivalent',
                        'Changing a column data type'
                    ],
                    explanation: 'Adding a custom column using a complex M function that cannot be translated into the source native query language breaks query folding. From that step forward, all data must be downloaded locally for processing. Filters, column removals, type changes, and simple renames are typically foldable because they translate directly to SQL WHERE, SELECT, and CAST clauses.'
                },
                {
                    question: 'How do you handle rows with errors in a column using Power Query?',
                    options: [
                        'Errors are automatically removed during import',
                        'Right-click the column header and choose Replace Errors, specifying a replacement value',
                        'Power Query does not support error handling',
                        'You must fix errors manually in the source system'
                    ],
                    explanation: 'In Power Query, you can right-click a column header and select "Replace Errors" to substitute a fallback value (like 0 or null). You can also use "Remove Errors" to delete entire rows containing errors. The M function is Table.ReplaceErrorValues(). Handling errors before loading prevents blank or broken visuals in reports and is a common PL-300 exam scenario.'
                },
                {
                    question: 'What does the "Use First Row as Headers" option do in Power Query?',
                    options: [
                        'Sorts the table by the first row',
                        'Promotes the first data row to become the column header names',
                        'Deletes the first row',
                        'Moves the headers to the last row'
                    ],
                    explanation: 'When data sources like CSV or Excel files do not have proper headers, the first row of data may contain the actual column names. "Use First Row as Headers" (Table.PromoteHeaders in M) takes that first row and makes each cell a column name, then removes it from the data rows. This is one of the most common first steps when importing flat files.'
                },
                {
                    question: 'A Power Query step is underlined in red in the Applied Steps pane. What does this indicate?',
                    options: [
                        'The step completed successfully with warnings',
                        'The step produced errors -- a previous step may have been changed or deleted, breaking this step reference',
                        'The step is currently being processed',
                        'The step is optional and can be skipped'
                    ],
                    explanation: 'A red-underlined step in Applied Steps indicates an error. This typically happens when a previous step is modified or deleted and a downstream step references a column or value that no longer exists. Steps in Power Query are sequential and dependent -- changing step 3 can break steps 4 through 10. Always review dependencies before modifying early steps.'
                },
                {
                    question: 'Which Power Query feature combines rows from two queries based on a matching column?',
                    options: [
                        'Append Queries',
                        'Merge Queries',
                        'Group By',
                        'Pivot Column'
                    ],
                    explanation: 'Merge Queries performs a join between two tables based on one or more matching columns, similar to a SQL JOIN. You select the join type (Left Outer, Right Outer, Full Outer, Inner, Left Anti, Right Anti). Append Queries stacks rows from multiple tables vertically (like SQL UNION). Group By aggregates rows. Pivot turns row values into columns.'
                },
                {
                    question: 'What is the result of using Append Queries in Power Query?',
                    options: [
                        'Columns from two tables are combined side by side',
                        'Rows from two or more tables are stacked vertically into one table',
                        'Duplicate rows are removed',
                        'A calculated column is added'
                    ],
                    explanation: 'Append Queries stacks rows from multiple tables on top of each other, similar to SQL UNION ALL. The tables should have matching column structures. If columns do not match exactly, Power Query adds null values for missing columns. This is useful for combining monthly sales files, regional data exports, or any scenario where the same data structure exists across multiple sources.'
                },
                {
                    question: 'What is the purpose of the "Changed Type" step that Power Query often auto-generates?',
                    options: [
                        'It converts the file format from CSV to Excel',
                        'It assigns data types (Text, Whole Number, Decimal, Date, etc.) to each column',
                        'It changes the query from Import to DirectQuery mode',
                        'It renames columns to a standard format'
                    ],
                    explanation: 'The "Changed Type" step sets the data type for each column -- Whole Number (Int64), Decimal Number, Text, Date, Date/Time, True/False, etc. Power Query auto-detects types based on the first 200 rows, but you should verify them. Wrong types cause calculation errors, broken relationships, and incorrect sorting. Dates stored as Text will not sort chronologically.'
                },
                {
                    question: 'When should you use a parameter in Power Query?',
                    options: [
                        'To change the color of a visual',
                        'To make connection strings, file paths, or filter values dynamic so the query can be reused across environments',
                        'Parameters are only used in DAX measures',
                        'To set the refresh schedule'
                    ],
                    explanation: 'Power Query parameters let you define dynamic values like server names, file paths, date ranges, or filter thresholds. You reference the parameter in your M code instead of hardcoding values. This makes it easy to switch between dev/test/prod environments, reuse queries across datasets, and let users control query behavior. Parameters are defined in Manage Parameters in the Power Query ribbon.'
                },
                {
                    question: 'What happens to Applied Steps if you reorder them in Power Query?',
                    options: [
                        'Steps automatically adjust their references',
                        'Reordering is not allowed -- steps are always sequential',
                        'Downstream steps may break if they depend on the output of a moved step',
                        'All steps are re-executed in parallel'
                    ],
                    explanation: 'You can move steps in Power Query, but it is risky. Steps are sequential: each step references the output of the previous step by name. If you move a step that a later step depends on, the later step will error because its reference no longer exists at that point in the chain. Always check downstream dependencies before reordering. In practice, it is safer to delete and recreate steps in the desired order.'
                },
                {
                    question: 'Which Power BI gateway is required to refresh an on-premises SQL Server data source in the Power BI Service?',
                    options: [
                        'No gateway is needed -- Power BI connects directly',
                        'On-premises data gateway (standard mode)',
                        'Power Automate gateway',
                        'Azure ExpressRoute only'
                    ],
                    explanation: 'The on-premises data gateway (standard mode) is required to bridge on-premises data sources with the Power BI Service in the cloud. It acts as a secure relay -- the gateway polls the Power BI Service for refresh requests, queries the local SQL Server, and sends results back through an encrypted outbound HTTPS connection. No inbound firewall ports are required. Personal mode gateways exist but only support one user.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
