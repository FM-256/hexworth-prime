    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1728 0%, #0d1f3c 50%, #0f1728 100%);

            padding: 15px 30px; background: rgba(0,0,0,0.4);

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to PL-300 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Deploy and Maintain',
            description: 'Test your knowledge of the Power BI Service, workspaces, publishing, dashboards, data refresh, gateways, row-level security, deployment pipelines, and endorsement.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'pl300-ch04-quiz',
            moduleId: 'pl300-ch04-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What two artifacts are created when you publish a .pbix file from Power BI Desktop to the Service?',
                    options: [
                        'A dashboard and a dataflow',
                        'A dataset and a report',
                        'A workspace and an app',
                        'A gateway and a data source'
                    ],
                    explanation: 'Publishing a .pbix from Desktop creates two artifacts in the target workspace: a dataset (containing the data model, Power Query queries, and relationships) and a report (containing the visual pages). If the dataset already exists in the workspace, it is overwritten and the report is updated in place.'
                },
                {
                    question: 'Which workspace role allows a user to publish and edit content but NOT manage workspace settings or add Admins?',
                    options: [
                        'Viewer',
                        'Contributor',
                        'Member',
                        'Admin'
                    ],
                    explanation: 'The Member role can publish content, edit reports, manage dataset refresh schedules, and share items with others. However, Members cannot manage workspace settings, change the workspace name/description, or add or remove Admins. Admins have full control; Contributors can publish but cannot share; Viewers can only consume.'
                },
                {
                    question: 'Which of the following can ONLY be created in the Power BI Service, not in Desktop?',
                    options: [
                        'Reports',
                        'Measures',
                        'Dashboards',
                        'Calculated columns'
                    ],
                    explanation: 'Dashboards are a Service-only artifact. They are single-canvas collections of pinned tiles that can aggregate visuals from multiple reports and datasets. Reports, measures, and calculated columns can all be created in Power BI Desktop. Dashboards also support unique features like data alerts and natural language Q&A.'
                },
                {
                    question: 'What is the maximum number of scheduled refreshes per day for a dataset on Power BI Pro (non-Premium)?',
                    options: [
                        '4 times per day',
                        '8 times per day',
                        '24 times per day',
                        '48 times per day'
                    ],
                    explanation: 'Power BI Pro supports up to 8 scheduled refreshes per day. Premium and Premium Per User (PPU) capacities support up to 48 refreshes per day. Each refresh re-imports the entire dataset (unless incremental refresh is configured), so the frequency should balance data freshness against resource consumption.'
                },
                {
                    question: 'What is required to refresh a dataset that connects to an on-premises SQL Server?',
                    options: [
                        'A Power BI Premium license only',
                        'An on-premises data gateway installed on a server with network access to the SQL Server',
                        'A direct VPN connection from the Power BI Service to the SQL Server',
                        'The SQL Server must be migrated to Azure first'
                    ],
                    explanation: 'On-premises data sources require an on-premises data gateway installed on a server that can reach the source database. The gateway creates an encrypted outbound connection to Azure Service Bus -- no inbound firewall rules are needed. Cloud sources (Azure SQL, SharePoint Online) connect directly without a gateway.'
                },
                {
                    question: 'What is the key advantage of incremental refresh over standard scheduled refresh?',
                    options: [
                        'It does not require a gateway',
                        'It only refreshes new and changed data instead of the entire dataset',
                        'It works without any parameters in Power Query',
                        'It is available on Power BI Free'
                    ],
                    explanation: 'Incremental refresh only processes new and changed rows, dramatically reducing refresh time and resource usage for large datasets. It requires defining RangeStart and RangeEnd DateTime parameters in Power Query and configuring an incremental refresh policy (e.g., keep 3 years of history, refresh last 10 days). This feature requires Premium or Premium Per User capacity.'
                },
                {
                    question: 'In dynamic row-level security (RLS), which DAX function is used to identify the current user?',
                    options: [
                        'USERNAME()',
                        'CURRENTUSER()',
                        'USERPRINCIPALNAME()',
                        'GETUSER()'
                    ],
                    explanation: 'USERPRINCIPALNAME() returns the email address (UPN) of the currently logged-in user. In dynamic RLS, this is matched against a security table to determine which rows the user can see. Example filter: [ManagerEmail] = USERPRINCIPALNAME(). This approach scales to thousands of users with a single role definition, unlike static RLS which requires a separate role per group.'
                },
                {
                    question: 'Where are RLS roles defined and where are users assigned to those roles?',
                    options: [
                        'Both defined and assigned in Power BI Desktop',
                        'Defined in Power BI Desktop, users assigned in the Power BI Service',
                        'Both defined and assigned in the Power BI Service',
                        'Defined in Azure Active Directory, assigned in Power BI Desktop'
                    ],
                    explanation: 'RLS roles and their DAX filter expressions are defined in Power BI Desktop (Modeling tab > Manage Roles). After publishing, users and security groups are assigned to those roles in the Power BI Service (Dataset > Security). This two-step process separates the technical definition (Desktop) from the administrative assignment (Service).'
                },
                {
                    question: 'What are the three stages in a Power BI deployment pipeline?',
                    options: [
                        'Draft, Review, Final',
                        'Development, Test, Production',
                        'Staging, QA, Release',
                        'Build, Validate, Ship'
                    ],
                    explanation: 'Deployment pipelines have three fixed stages: Development (where authors build and iterate), Test (where stakeholders validate), and Production (where end users consume). Content is promoted forward through these stages. Deployment rules can change data source connection strings per stage, so Dev connects to DevSQL and Production connects to ProdSQL.'
                },
                {
                    question: 'What is the difference between "Promoted" and "Certified" endorsement in the Power BI Service?',
                    options: [
                        'Promoted is for reports; Certified is for datasets only',
                        'Promoted can be set by any workspace Member; Certified requires tenant admin approval',
                        'Promoted requires Premium; Certified works on Pro',
                        'There is no difference -- they are synonyms'
                    ],
                    explanation: 'Promoted endorsement can be applied by any workspace Member or Admin without additional approval -- it signals that content is production-ready at the team level. Certified endorsement requires approval from a Power BI tenant admin or delegated certifier, representing the organization-level seal of trust. Certified content appears with a stronger badge and ranks higher in search results.'
                },
                {
                    question: 'A Power BI dataflow is best described as:',
                    options: [
                        'A visualization that flows data between report pages',
                        'A cloud-based ETL process using Power Query Online that prepares data independently from any report',
                        'A real-time streaming data source',
                        'A type of dashboard tile'
                    ],
                    explanation: 'Dataflows are cloud-based data preparation and transformation processes built with Power Query Online. They run independently from any report or dataset, storing results in Azure Data Lake or Dataverse. Multiple datasets can reference the same dataflow, ensuring consistent data preparation across reports. Dataflows refresh on their own schedule and are managed at the workspace level.'
                },
                {
                    question: 'What is the recommended method for distributing Power BI content to a broad audience of business users?',
                    options: [
                        'Add all users to the workspace with Viewer role',
                        'Share individual reports via email links',
                        'Publish a Power BI App from the workspace',
                        'Export reports to PDF and email them'
                    ],
                    explanation: 'Power BI Apps are the recommended distribution method for broad audiences. Apps package a workspace\'s reports and dashboards into a curated, read-only experience that users install from AppSource or a direct link. Apps have their own permissions separate from workspace roles. Never add business consumers to workspace roles -- workspaces should only contain content creators.'
                },
                {
                    question: 'Which type of on-premises data gateway is recommended for enterprise production workloads?',
                    options: [
                        'Personal gateway installed on any user\'s laptop',
                        'Standard (enterprise) gateway installed on a dedicated always-on server',
                        'Cloud gateway provisioned in Azure',
                        'No gateway is needed for production workloads'
                    ],
                    explanation: 'The standard (enterprise) gateway is recommended for production use. It is installed on a dedicated, always-on server with network access to the data sources. It supports multiple users, multiple data sources, and centralized management. The personal gateway is limited to a single user and requires the host machine to be running during refresh -- not suitable for production.'
                },
                {
                    question: 'A dataset refresh fails overnight and you need to investigate. Where do you find details about the failure?',
                    options: [
                        'Power BI Desktop error log',
                        'Dataset Settings > Refresh History in the Power BI Service',
                        'Windows Event Viewer on your local machine',
                        'Azure Monitor only'
                    ],
                    explanation: 'Refresh history is available in the Power BI Service under Dataset Settings > Refresh History. It shows each refresh attempt with status (success/failure), duration, start/end time, and error details. You can also configure email notifications for refresh failures. For tenant-wide monitoring, Power BI admins can use activity logs and the Admin Portal.'
                },
                {
                    question: 'Which users are exempt from row-level security (RLS) enforcement in the Power BI Service?',
                    options: [
                        'All Pro users',
                        'Users with the Viewer workspace role',
                        'Workspace Admins and Members (dataset owners)',
                        'Only the Power BI tenant admin'
                    ],
                    explanation: 'Workspace Admins and Members are exempt from RLS -- they always see all data in the dataset regardless of role assignments. This is by design because these users need full access for development and management. Only users who access content through sharing, Apps, or the Viewer workspace role are subject to RLS enforcement. Always test RLS using "View As" in Desktop or Service before deploying.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
