    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Model the Data',
            description: 'Test your understanding of star schema design, relationships, cardinality, cross-filter direction, DAX fundamentals, and calculated columns versus measures.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'pl300-ch02-quiz',
            moduleId: 'pl300-ch02-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'In a star schema, what is the role of a fact table?',
                    options: [
                        'Store descriptive attributes like product names and customer cities',
                        'Store measurable, quantitative data such as revenue, quantity, and cost for each transaction',
                        'Define the relationships between tables',
                        'Store DAX measure definitions'
                    ],
                    explanation: 'Fact tables store the measurable, quantitative events of your business -- each row represents a transaction, sale, or observation. Columns include foreign keys (linking to dimension tables) and numeric values (revenue, quantity, cost) that can be aggregated. Dimension tables store the descriptive attributes. Fact tables are typically the largest tables and grow continuously.'
                },
                {
                    question: 'What is the recommended relationship type between a dimension table and a fact table in Power BI?',
                    options: [
                        'Many-to-Many',
                        'One-to-One',
                        'One-to-Many (dimension is the "one" side)',
                        'No relationship is needed in a star schema'
                    ],
                    explanation: 'The standard relationship is One-to-Many where the dimension table is the "one" side (each ProductKey appears once in DimProduct) and the fact table is the "many" side (each ProductKey appears in many FactSales rows). This is the foundation of star schema design and represents approximately 95% of all Power BI relationships.'
                },
                {
                    question: 'What is the default cross-filter direction for a relationship in Power BI?',
                    options: [
                        'Both directions (bidirectional)',
                        'Single direction -- from the "one" side to the "many" side',
                        'Single direction -- from the "many" side to the "one" side',
                        'No cross-filtering by default'
                    ],
                    explanation: 'The default is single direction, flowing from the "one" side (dimension) to the "many" side (fact). When a user selects "Bikes" in a DimProduct slicer, the filter flows through the relationship to FactSales, showing only bike transactions. The fact table does not filter the dimension table by default. Bidirectional filtering must be explicitly enabled and should be used sparingly.'
                },
                {
                    question: 'Why should you avoid bidirectional cross-filtering unless necessary?',
                    options: [
                        'It is not supported in Power BI Desktop',
                        'It can create ambiguous filter paths between tables and degrade query performance',
                        'It prevents measures from evaluating correctly',
                        'It only works with DirectQuery mode'
                    ],
                    explanation: 'Bidirectional cross-filtering can create ambiguous filter paths when multiple paths exist between tables, leading to unpredictable results. It also degrades performance because the engine must evaluate filters in both directions. The recommended approach is to keep single-direction filtering and use CROSSFILTER() in DAX when you need to temporarily override the direction for a specific calculation.'
                },
                {
                    question: 'What must be true about a table marked as a Date table in Power BI?',
                    options: [
                        'It must have exactly 365 rows',
                        'It must contain a contiguous range of dates with no gaps, covering the full fact data range',
                        'It must be named exactly "Date"',
                        'It must be connected via bidirectional filtering'
                    ],
                    explanation: 'A proper Date table must have one row per day with no gaps in the date range. It must cover the entire date span of your fact data. It must have a column of Date data type and be explicitly marked via Table Tools > Mark as Date Table. The table can be named anything (DimDate, Calendar, etc.). Gaps in dates will break time-intelligence DAX functions like SAMEPERIODLASTYEAR.'
                },
                {
                    question: 'What is the primary difference between a calculated column and a measure in DAX?',
                    options: [
                        'Calculated columns use M language; measures use DAX',
                        'Calculated columns are evaluated row by row during refresh and stored; measures are evaluated at query time in filter context',
                        'Measures are stored in the model; calculated columns are not',
                        'There is no difference -- they are interchangeable'
                    ],
                    explanation: 'Calculated columns are evaluated row by row during data refresh and their values are physically stored in the model (consuming memory). They have row context. Measures are evaluated dynamically at query time based on the current filter context (slicer selections, row/column axes). Measures are not stored -- they recalculate for every visual interaction. Use measures for aggregations and calculated columns for row-level categorization.'
                },
                {
                    question: 'Which DAX function should you use instead of dividing directly with the / operator?',
                    options: [
                        'MOD()',
                        'DIVIDE()',
                        'QUOTIENT()',
                        'SPLIT()'
                    ],
                    explanation: 'DIVIDE() handles division safely by returning an alternate result (default: BLANK()) when the denominator is zero or BLANK(). Using the / operator directly produces an error when dividing by zero, which displays as an error in visuals. Example: DIVIDE(SUM(Sales[Profit]), SUM(Sales[Revenue]), 0) returns 0 when revenue is zero instead of an error.'
                },
                {
                    question: 'What does the CALCULATE function do in DAX?',
                    options: [
                        'Performs basic arithmetic on two numbers',
                        'Creates a new table in the data model',
                        'Evaluates an expression in a modified filter context',
                        'Calculates the row number of each record'
                    ],
                    explanation: 'CALCULATE is the most important DAX function. It evaluates an expression (typically a measure) in a modified filter context. You pass filter arguments that override, add to, or remove the existing filter context. Example: CALCULATE(SUM(Sales[Revenue]), Sales[Channel]="Online") evaluates total revenue but only for the Online channel, regardless of what the user has selected in slicers.'
                },
                {
                    question: 'A FactSales table has OrderDate, ShipDate, and DueDate columns, all needing to relate to DimDate. How do you handle this?',
                    options: [
                        'Create three separate date dimension tables',
                        'Create one active relationship (OrderDate) and two inactive relationships, using USERELATIONSHIP in DAX measures',
                        'Use bidirectional filtering on all three relationships',
                        'Combine all three dates into a single column'
                    ],
                    explanation: 'Power BI only allows one active relationship between two tables. Create the primary relationship (OrderDate -> DimDate) as active, and the other two (ShipDate, DueDate) as inactive. Then use USERELATIONSHIP inside CALCULATE to activate the inactive relationship when needed: CALCULATE(SUM(FactSales[Revenue]), USERELATIONSHIP(FactSales[ShipDate], DimDate[DateKey])). This is the role-playing dimension pattern.'
                },
                {
                    question: 'Which of the following is a valid reason to use a calculated column instead of a measure?',
                    options: [
                        'You need to calculate a running total that changes with filters',
                        'You need to create a row-level category (like "High" or "Low") that can be used as a slicer or filter',
                        'You need to display a grand total at the bottom of a table',
                        'You need to calculate year-over-year growth'
                    ],
                    explanation: 'Calculated columns are appropriate when you need a fixed, row-level value that users can drag to slicers, axes, or filter panes. A "High/Low" price category based on UnitPrice is a classic example -- the value is fixed per row and users want to filter by it. Running totals, grand totals, and YoY growth all depend on filter context and should be measures.'
                },
                {
                    question: 'What does the RELATED function do in DAX?',
                    options: [
                        'Creates a new relationship between two tables',
                        'Returns a value from a related table using an existing relationship',
                        'Counts the number of related rows in another table',
                        'Removes a relationship during a calculation'
                    ],
                    explanation: 'RELATED pulls a single value from a related table through an existing relationship. It works in calculated columns when you have row context. Example: in a FactSales calculated column, RELATED(DimProduct[Category]) retrieves the product category for each sales row by following the ProductKey relationship. RELATED navigates from the many side to the one side.'
                },
                {
                    question: 'Why should you disable the auto date/time feature in Power BI?',
                    options: [
                        'It prevents users from creating date hierarchies',
                        'It creates hidden date tables for every Date column, wasting memory and preventing custom fiscal calendars',
                        'It is incompatible with DirectQuery mode',
                        'It causes relationship conflicts'
                    ],
                    explanation: 'Auto date/time creates a hidden, internal date table for every Date-type column in your model. With 5 date columns, that is 5 hidden tables consuming memory. These auto tables cannot be customized for fiscal calendars, cannot be shared across relationships, and are not visible in Model view. Best practice: disable auto date/time (File > Options > Data Load) and create a single, explicit DimDate table.'
                },
                {
                    question: 'What type of cardinality should you investigate carefully if Power BI detects it between two tables?',
                    options: [
                        'One-to-Many',
                        'Many-to-One',
                        'Many-to-Many',
                        'One-to-One'
                    ],
                    explanation: 'Many-to-Many (M:M) cardinality means both tables have duplicate values in the join column, which can produce ambiguous or inflated results. If Power BI detects M:M, investigate whether a bridging table is needed, whether data should be deduplicated, or whether the model design should be restructured. M:M is sometimes legitimate (e.g., many-to-many between students and courses via an enrollment bridge table) but should always be validated.'
                },
                {
                    question: 'Which model optimization technique reduces the compressed size of a Power BI model most effectively?',
                    options: [
                        'Adding more measures',
                        'Removing unused columns, especially high-cardinality text and GUID columns',
                        'Converting all relationships to bidirectional',
                        'Increasing the number of rows in dimension tables'
                    ],
                    explanation: 'Removing unused columns -- especially those with high cardinality (many unique values) like GUIDs, free-text descriptions, and high-precision timestamps -- is the most effective way to reduce model size. The VertiPaq engine compresses repeated values efficiently, but unique values are expensive. A fact table with 30 columns should be trimmed to only the columns actually used in relationships, measures, and visuals.'
                },
                {
                    question: 'In a Power BI model, where should you create a measure to keep the model organized?',
                    options: [
                        'Always in the first table alphabetically',
                        'In a dedicated measures table or the fact table the measure relates to',
                        'In any dimension table',
                        'Measures cannot be assigned to specific tables'
                    ],
                    explanation: 'Best practice is to organize measures in either a dedicated measures table (an empty table created solely to hold measures) or in the fact table they relate to. A dedicated measures table keeps the field list clean and makes measures easy to find. If you do not use a measures table, place measures in the table they primarily aggregate. Never scatter measures randomly across dimension tables.'
                }
            ]
        });
        quiz.start();
    </script>
