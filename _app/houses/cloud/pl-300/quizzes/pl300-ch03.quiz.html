        <a href="../index.html">&larr; Back to PL-300 Hub</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Visualize and Analyze Data',
            description: 'Test your knowledge of Power BI chart types, conditional formatting, drill-down, drill-through, bookmarks, tooltips, AI visuals, and analytics lines for the PL-300 exam.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'pl300-ch03-quiz',
            moduleId: 'pl300-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which visual type is best for comparing values across categories when category labels are long?',
                    options: [
                        'Clustered column chart',
                        'Bar chart (horizontal)',
                        'Pie chart',
                        'Scatter chart'
                    ],
                    explanation: 'A horizontal bar chart is ideal when category labels are long because the labels display along the Y-axis with plenty of horizontal space. Column charts truncate long labels on the X-axis. Pie charts become unreadable with many categories. Scatter charts compare two measures, not categories against a single value.'
                },
                {
                    question: 'What is the key difference between a stacked column chart and a 100% stacked column chart?',
                    options: [
                        'Stacked shows absolute values; 100% stacked shows proportional contribution where every bar reaches 100%',
                        '100% stacked charts are faster to render',
                        'Stacked charts cannot have a legend',
                        'There is no difference -- they display the same data'
                    ],
                    explanation: 'A stacked column chart shows absolute values -- the height of each bar reflects the total sum, and segments show sub-category contributions. A 100% stacked column normalizes every bar to 100%, showing only the proportional split. Use stacked when the total matters; use 100% stacked when you care about relative proportions regardless of total size.'
                },
                {
                    question: 'Which visual is the only type that places a measure on both the X-axis and Y-axis?',
                    options: [
                        'Combo chart',
                        'Matrix',
                        'Scatter chart',
                        'Line chart'
                    ],
                    explanation: 'The scatter chart is the only Power BI visual that places a measure on both the X-axis and Y-axis. This makes it ideal for correlation analysis -- for example, plotting Revenue (X) against Profit Margin (Y) per product. You can also add a Size well for a third measure (bubble chart) and a Legend to color-code categories.'
                },
                {
                    question: 'A report needs to show regional sales data on a geographic visualization where entire states are shaded by revenue intensity. Which visual should you use?',
                    options: [
                        'Map visual (bubble map)',
                        'Filled map (choropleth)',
                        'Shape map',
                        'Treemap'
                    ],
                    explanation: 'A filled map (choropleth) shades entire geographic regions -- states, countries, ZIP codes -- by value intensity using a color gradient. A bubble map places sized circles at geographic points but does not shade boundaries. Shape map requires custom TopoJSON and is for non-standard shapes. Treemap is not geographic.'
                },
                {
                    question: 'When should you use a matrix visual instead of a table visual?',
                    options: [
                        'When you need to display raw detail-level rows without grouping',
                        'When you need row and column hierarchies with expand/collapse, subtotals, and grouped aggregation',
                        'When you want to add a trend line',
                        'Tables and matrices are interchangeable -- there is no functional difference'
                    ],
                    explanation: 'A matrix supports row and column hierarchies with expand/collapse navigation, subtotals at each level, and stepped or tabular layout. A table is a flat grid showing individual rows without grouping. If the scenario mentions grouping, hierarchies, pivot-table behavior, or subtotals, the answer is matrix. If it says "show all detail rows," use a table.'
                },
                {
                    question: 'Which conditional formatting option displays inline horizontal bars inside table or matrix cells?',
                    options: [
                        'Background color scales',
                        'Data bars',
                        'Icon sets',
                        'Font color rules'
                    ],
                    explanation: 'Data bars add inline horizontal bars inside cells, with bar length proportional to the cell value. They combine the precision of a number with the visual impact of a bar chart. Negative values extend left with a different color. Background color scales shade the entire cell background. Icon sets display symbols (arrows, flags). Font color rules change text color.'
                },
                {
                    question: 'What is the difference between drill-down and drill-through in Power BI?',
                    options: [
                        'Drill-down navigates within a visual hierarchy; drill-through navigates from one report page to another with filter context',
                        'Drill-through navigates within a visual; drill-down goes between pages',
                        'Both do the same thing but with different keyboard shortcuts',
                        'Drill-down requires DAX; drill-through does not'
                    ],
                    explanation: 'Drill-down lets users navigate within a single visual by stepping through hierarchy levels (Year > Quarter > Month). Drill-through lets users right-click a data point and navigate to a different report page that is filtered to that context. A back button is auto-generated on the drill-through target page. The PL-300 exam distinguishes these clearly.'
                },
                {
                    question: 'You want users to right-click a product category in a chart and navigate to a detail page showing that category breakdown. Which feature do you configure?',
                    options: [
                        'Drill-down hierarchy',
                        'Drill-through with Product[Category] in the target page filter well',
                        'Bookmark with an action button',
                        'Report page tooltip'
                    ],
                    explanation: 'Drill-through is the correct feature. On the target detail page, add Product[Category] to the Drill-Through filter well. When users right-click a category in any visual on any page, they see "Drill through > [page name]" and navigate to that filtered detail page. A back button is auto-created. Drill-down only moves within hierarchy levels in the same visual.'
                },
                {
                    question: 'What three properties can a bookmark capture independently?',
                    options: [
                        'Data (filters/slicers), Display (visual visibility), and Current Page',
                        'Color, Font, and Layout',
                        'Title, Subtitle, and Footer',
                        'Import mode, DirectQuery mode, and Dual mode'
                    ],
                    explanation: 'A bookmark can capture three independent properties: Data (current filter and slicer state), Display (which visuals are shown or hidden), and Current Page (which report page is active). You toggle each property on or off per bookmark. This flexibility lets you create bookmarks that only change visibility (for tabbed views) without resetting filters, or vice versa.'
                },
                {
                    question: 'How do you create a report page tooltip in Power BI?',
                    options: [
                        'Add fields to the Tooltips well on the target visual',
                        'Create a page sized to Tooltip (320x240), enable "Allow use as tooltip" in page settings, then reference it in the target visual Format pane',
                        'Use a slicer to filter tooltip data',
                        'Report page tooltips are only available in Power BI Premium'
                    ],
                    explanation: 'To create a report page tooltip: (1) create a new page, (2) set its size to the Tooltip preset (320x240 px), (3) toggle "Allow use as tooltip" under Page Information, and (4) on the target visual, open Format > Tooltip and set the tooltip page to your new page. All four steps are required. This feature is available in all Power BI Desktop editions, not just Premium.'
                },
                {
                    question: 'Which AI visual identifies the factors that most influence a metric to increase or decrease?',
                    options: [
                        'Decomposition Tree',
                        'Key Influencers',
                        'Smart Narratives',
                        'Q&A Visual'
                    ],
                    explanation: 'The Key Influencers visual uses machine learning (regression and classification) to identify which factors have the greatest impact on a metric. Drag the metric to Analyze and potential factors to Explain by. It ranks factors by influence strength (e.g., "When Category is Bikes, Revenue is 3.2x more likely to increase"). Decomposition Tree breaks down a measure interactively but does not perform statistical analysis.'
                },
                {
                    question: 'What does the Decomposition Tree AI Split (lightbulb icon) do?',
                    options: [
                        'Exports the tree to a PDF',
                        'Automatically finds the dimension with the highest or lowest contributor at the next level',
                        'Deletes the current tree branch',
                        'Converts the tree into a bar chart'
                    ],
                    explanation: 'AI Split (the lightbulb icon) in a Decomposition Tree automatically analyzes all available dimensions and selects the one that contains the highest (or lowest, depending on your choice) contributor at the next breakdown level. This saves users from manually testing each dimension. It uses statistical analysis to find the most interesting split.'
                },
                {
                    question: 'Which analytics feature extends a time-series line chart into the future with a confidence interval?',
                    options: [
                        'Trend line',
                        'Reference line',
                        'Forecast',
                        'Error bars'
                    ],
                    explanation: 'The Forecast feature in the Analytics pane projects a time-series visual into future periods with a shaded confidence interval (typically 95%). You set the forecast length (number of periods), confidence interval, and seasonality (auto-detected or manual). Trend lines show the best-fit direction of existing data but do not project future values. Reference lines are static markers.'
                },
                {
                    question: 'A scatter chart has a Legend field set. What happens when you enable Forecast in the Analytics pane?',
                    options: [
                        'Forecasting is disabled for scatter charts',
                        'The forecast applies to the aggregate trend only',
                        'The forecast operates per series defined by the Legend',
                        'The Legend is automatically removed'
                    ],
                    explanation: 'When a Legend field is present on a line chart, forecast operates per series -- each category in the Legend gets its own forecast line with its own confidence interval. To forecast the aggregate total instead, remove the Legend field. Note that Forecast requires a date axis with consistent intervals; scatter charts typically do not support it. This applies specifically to line charts.'
                },
                {
                    question: 'Which Q&A setup step improves the accuracy of natural-language queries in Power BI?',
                    options: [
                        'Adding a slicer to the report page',
                        'Defining synonyms in the model so users can query with familiar terms (e.g., "revenue" maps to SalesAmount)',
                        'Converting all measures to whole numbers',
                        'Enabling DirectQuery mode'
                    ],
                    explanation: 'Defining synonyms in the Q&A linguistic schema lets users ask questions using familiar business terms. For example, mapping "revenue" to the SalesAmount field means a user can type "total revenue by region" and Power BI correctly resolves it. Without synonyms, Q&A may not understand domain-specific vocabulary. Configure synonyms via Modeling > Q&A Setup > Field Synonyms.'
                }
            ]
        });
        quiz.start();
    </script>
