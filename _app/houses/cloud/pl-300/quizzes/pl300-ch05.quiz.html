    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: DAX Deep-Dive',
            description: 'Test your mastery of filter context, row context, CALCULATE, time intelligence, iterators, ALL/ALLEXCEPT, VAR/RETURN, and advanced DAX patterns.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'pl300-ch05-quiz',
            moduleId: 'pl300-ch05-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is filter context in DAX?',
                    options: [
                        'The set of rows currently being iterated in a calculated column',
                        'The combination of active filters (slicers, axes, page filters, CALCULATE arguments) that determine which rows a measure evaluates',
                        'The order in which DAX functions are executed',
                        'The security role applied to the current user'
                    ],
                    explanation: 'Filter context is the set of all active filters that determine which rows are visible to a DAX calculation. It is created by slicer selections, visual row/column axes, page and report filters, and CALCULATE filter arguments. Every measure evaluates inside a filter context. Understanding filter context is the most important concept in DAX.'
                },
                {
                    question: 'When does row context exist in DAX?',
                    options: [
                        'Whenever a measure is used in a card visual',
                        'Inside calculated columns and iterator functions (SUMX, AVERAGEX, COUNTX) where DAX processes one row at a time',
                        'Only when the RELATED function is used',
                        'Row context exists in all DAX expressions'
                    ],
                    explanation: 'Row context exists when DAX iterates through a table one row at a time. This happens in two scenarios: (1) calculated columns, which evaluate an expression for each row during data refresh, and (2) iterator functions like SUMX, AVERAGEX, and COUNTX, which process each row in their table argument. Within row context, you can reference column values of the current row directly.'
                },
                {
                    question: 'What happens when CALCULATE has a filter argument on a column that is already filtered by a slicer?',
                    options: [
                        'Both filters are combined with OR logic',
                        'The CALCULATE filter argument overrides the slicer filter on that same column',
                        'The slicer always takes priority over CALCULATE',
                        'An error is raised due to conflicting filters'
                    ],
                    explanation: 'CALCULATE filter arguments override existing filters on the SAME column. If a slicer filters Region = "East" and CALCULATE adds Region = "West," only West data appears (override). However, CALCULATE filters on DIFFERENT columns are combined with AND logic alongside existing filters. This override-vs-AND distinction is one of the most tested DAX concepts on the PL-300.'
                },
                {
                    question: 'Which DAX function calculates a running total from the start of the year through the current date in context?',
                    options: [
                        'DATEADD',
                        'SAMEPERIODLASTYEAR',
                        'TOTALYTD',
                        'PREVIOUSYEAR'
                    ],
                    explanation: 'TOTALYTD evaluates an expression from January 1 (or a custom fiscal year start) through the current date in the filter context. Syntax: TOTALYTD(SUM(Sales[Revenue]), DimDate[Date]). It requires a properly marked Date table. An optional third argument specifies the fiscal year-end date if your fiscal year does not end on December 31.'
                },
                {
                    question: 'What does SAMEPERIODLASTYEAR do?',
                    options: [
                        'Returns the same date range but shifted forward by one year',
                        'Returns a table of dates shifted back by exactly one year from the current filter context',
                        'Returns the average of the last 12 months',
                        'Removes the year filter entirely'
                    ],
                    explanation: 'SAMEPERIODLASTYEAR returns a table of dates shifted back by exactly one year. If the current filter context is March 2024, it returns March 2023. Used inside CALCULATE to compare current period against the prior year: CALCULATE(SUM(Sales[Revenue]), SAMEPERIODLASTYEAR(DimDate[Date])). Requires a Date table with no gaps.'
                },
                {
                    question: 'What is the difference between SUM and SUMX?',
                    options: [
                        'SUM works on measures; SUMX works on columns',
                        'SUM aggregates a single column directly; SUMX iterates row by row evaluating an expression and then sums the results',
                        'SUMX is faster than SUM in all cases',
                        'There is no difference -- SUMX is just an alias for SUM'
                    ],
                    explanation: 'SUM aggregates a single stored column directly -- it is fast and does not iterate. SUMX is an iterator: it processes each row in the specified table, evaluates the given expression (which can reference multiple columns), and then sums all results. Use SUMX when the value to aggregate must be computed per row, like Qty * UnitPrice. Use SUM when aggregating a single existing column.'
                },
                {
                    question: 'What does the ALL function do when used inside CALCULATE?',
                    options: [
                        'Applies all filters from every slicer',
                        'Removes filters from the specified table or columns, ignoring slicer and axis selections',
                        'Selects all rows including blank rows',
                        'Converts the expression to use all available data types'
                    ],
                    explanation: 'ALL removes filters from the specified table or columns. CALCULATE(SUM(Sales[Revenue]), ALL(Sales)) returns the grand total regardless of any slicer or axis filters. ALL(DimProduct[Category]) removes only the Category filter. This is essential for percentage-of-total calculations: DIVIDE(SUM(Revenue), CALCULATE(SUM(Revenue), ALL(Sales))).'
                },
                {
                    question: 'How does ALLEXCEPT differ from ALL?',
                    options: [
                        'ALLEXCEPT removes all filters except on the columns you specify as exceptions',
                        'ALLEXCEPT keeps all filters except the ones you specify',
                        'ALLEXCEPT only works with dimension tables',
                        'There is no practical difference'
                    ],
                    explanation: 'ALLEXCEPT removes all filters from a table EXCEPT the columns you specify. CALCULATE(SUM(Sales[Revenue]), ALLEXCEPT(Sales, Sales[Region])) removes every filter on the Sales table except Region. This is useful for "percentage of region total" where you want the denominator to ignore all filters except the region grouping.'
                },
                {
                    question: 'What are the benefits of using VAR/RETURN in DAX measures?',
                    options: [
                        'Variables make formulas run in parallel on multiple cores',
                        'Variables improve readability, are evaluated only once (performance), and can be individually returned for debugging',
                        'Variables are required for all CALCULATE expressions',
                        'Variables allow you to modify the data model at runtime'
                    ],
                    explanation: 'VAR/RETURN provides three key benefits: (1) Readability -- complex formulas are broken into named, self-documenting steps. (2) Performance -- a VAR is evaluated once and cached, even if referenced multiple times. (3) Debugging -- temporarily change RETURN to output a single variable to inspect intermediate values. Variables are optional but strongly recommended for any measure with more than one computation.'
                },
                {
                    question: 'Which function navigates from the many side of a relationship to the one side to retrieve a single value?',
                    options: [
                        'RELATEDTABLE',
                        'RELATED',
                        'LOOKUPVALUE',
                        'CALCULATETABLE'
                    ],
                    explanation: 'RELATED follows a many-to-one relationship to retrieve a single scalar value from the related dimension table. In a FactSales calculated column, RELATED(DimProduct[Category]) retrieves the category for each sales row. RELATEDTABLE goes the opposite direction (one-to-many) and returns a table. RELATED requires row context and an active relationship.'
                },
                {
                    question: 'What does SELECTEDVALUE return when multiple values exist in the current filter context?',
                    options: [
                        'The first value alphabetically',
                        'An error',
                        'The alternate result specified as the second argument (or BLANK if not specified)',
                        'A concatenated string of all values'
                    ],
                    explanation: 'SELECTEDVALUE(Column, AlternateResult) returns the single filtered value if exactly one value exists in context, or the alternate result if multiple values (or no values) exist. If no alternate result is specified, it returns BLANK(). This is commonly used for dynamic titles: "Revenue for " & SELECTEDVALUE(DimDate[Year], "All Years").'
                },
                {
                    question: 'What is "context transition" in DAX?',
                    options: [
                        'Switching from Import mode to DirectQuery mode',
                        'When CALCULATE converts the current row context into an equivalent filter context',
                        'When a slicer selection changes from one value to another',
                        'Transitioning from a measure to a calculated column'
                    ],
                    explanation: 'Context transition occurs when CALCULATE is used inside a row context (iterator or calculated column). CALCULATE takes each column value in the current row and converts them into filter context. This is why CALCULATE(SUM(Sales[Revenue])) inside SUMX(Products, ...) gives per-product revenue -- the row context for each product is transitioned into a filter that restricts Sales to that product.'
                },
                {
                    question: 'Which time intelligence function is the most flexible for shifting dates by any interval?',
                    options: [
                        'TOTALYTD',
                        'SAMEPERIODLASTYEAR',
                        'DATEADD',
                        'DATESYTD'
                    ],
                    explanation: 'DATEADD(DimDate[Date], Interval, Granularity) is the most flexible time-intelligence function. It shifts dates by any number of DAY, MONTH, QUARTER, or YEAR intervals in either direction. DATEADD(DimDate[Date], -1, QUARTER) shifts back one quarter; DATEADD(DimDate[Date], -3, MONTH) shifts back 3 months. SAMEPERIODLASTYEAR is a shortcut for DATEADD(..., -1, YEAR).'
                },
                {
                    question: 'What is the recommended alternative to adding measure columns directly inside SUMMARIZE?',
                    options: [
                        'Use FILTER instead of SUMMARIZE',
                        'Wrap SUMMARIZE (or VALUES) with ADDCOLUMNS to append calculated columns',
                        'Use CALCULATETABLE with nested IF statements',
                        'Measures cannot be used with table functions'
                    ],
                    explanation: 'Microsoft recommends using ADDCOLUMNS wrapping VALUES (or SUMMARIZE for grouping only) rather than adding aggregation columns directly inside SUMMARIZE. ADDCOLUMNS evaluates expressions in a cleaner filter context. Example: ADDCOLUMNS(VALUES(DimProduct[Category]), "Revenue", CALCULATE(SUM(FactSales[Revenue]))). The CALCULATE inside ADDCOLUMNS triggers context transition for correct per-group results.'
                },
                {
                    question: 'You need a measure that shows each region\'s revenue as a percentage of the total revenue across all regions, regardless of other slicer selections. Which pattern is correct?',
                    options: [
                        'DIVIDE(SUM(Sales[Revenue]), COUNTROWS(Sales))',
                        'DIVIDE(SUM(Sales[Revenue]), CALCULATE(SUM(Sales[Revenue]), ALL(Sales[Region])))',
                        'SUM(Sales[Revenue]) / SUM(Sales[Revenue])',
                        'CALCULATE(SUM(Sales[Revenue]), VALUES(Sales[Region]))'
                    ],
                    explanation: 'The correct pattern is DIVIDE(SUM(Sales[Revenue]), CALCULATE(SUM(Sales[Revenue]), ALL(Sales[Region]))). The numerator respects the current filter context (the specific region). The denominator uses ALL(Sales[Region]) to remove only the Region filter, giving the total across all regions while preserving any other active filters (like Year or Product). DIVIDE handles the safe division.'
                }
            ]
        });
        quiz.start();
    </script>
