    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: AWS Core Services and Technology',
            description: 'Test your understanding of AWS Regions, Availability Zones, edge locations, compute services, networking, storage, and database services',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'clf-ch02-quiz',
            moduleId: 'clf-ch02-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is an AWS Region?',
                    options: [
                        'A single datacenter building operated by AWS',
                        'A country where AWS services are legally available',
                        'A separate geographic area made up of multiple Availability Zones, fully isolated from every other Region',
                        'A logical boundary created by an AWS account'
                    ],
                    explanation: 'An AWS Region is a separate geographic area (such as us-east-1) made up of multiple Availability Zones, and it is fully independent from every other Region. Crawl: AWS operates 30+ Regions worldwide. A Region is not a single building or a country -- it is a cluster of datacenters, grouped into Availability Zones, close enough together for low-latency synchronous connections but far enough apart to survive a localized disaster. When you deploy a resource "in us-east-1," AWS places it in one of that Region\'s Availability Zones. Walk: Regions matter for three reasons: performance (deploy near your users to reduce latency), compliance (some regulations require data to stay in a specific geography), and service availability (not every AWS service launches in every Region on day one). You choose a Region when creating most resources, and that choice determines where your data physically resides. Run: the critical distinction for CLF-C02 is that AWS Regions do not automatically fail over to each other. Unlike some other clouds that "pair" Regions, AWS keeps every Region completely isolated -- no automatic cross-Region replication happens unless you build it yourself (with S3 Cross-Region Replication, DynamoDB Global Tables, or a custom multi-Region architecture). Isolated partitions exist outside the standard commercial partition too: AWS GovCloud (US) for regulated federal workloads and the China Regions operated by local partners. Understand that Region selection affects data residency, available services, and pricing -- costs can vary by Region due to local infrastructure and energy costs.'
                },
                {
                    question: 'What are AWS Availability Zones?',
                    options: [
                        'Physically separate groups of datacenters within a single AWS Region, each with independent power, cooling, and networking',
                        'Different AWS accounts used to separate billing',
                        'Software-defined partitions within a single datacenter rack',
                        'Isolated partitions such as GovCloud and the China Regions'
                    ],
                    explanation: 'Availability Zones (AZs) are physically separate groups of datacenters within a single AWS Region, each with its own independent power, cooling, and networking infrastructure. Crawl: every AWS Region has a minimum of three AZs. If one datacenter loses power or suffers a cooling failure, the other zones keep operating independently. An application deployed across multiple AZs survives a single-AZ failure. Walk: AZs are connected by high-throughput, low-latency private fiber, fast enough for synchronous replication (such as Amazon RDS Multi-AZ) but physically separate enough to protect against localized disasters like fires, floods, or a single power grid failure. Many managed services (Amazon S3, Amazon DynamoDB) replicate across AZs automatically with no configuration from you; others (a single EC2 instance, a single EBS volume) are pinned to one AZ, and you must deliberately spread resources across AZs yourself -- for example, with an Auto Scaling group or an RDS Multi-AZ deployment. Run: a single EC2 instance in a single AZ is a textbook single point of failure -- the CLF-C02 exam frequently tests whether you recognize that a highly available architecture must span at least two AZs, typically fronted by Elastic Load Balancing. Do not confuse an AZ with a Region (a Region contains multiple AZs) or with an edge location (edge locations cache content for CloudFront and Route 53, and are not where your compute or databases run).'
                },
                {
                    question: 'What is the primary purpose of AWS edge locations and Amazon CloudFront?',
                    options: [
                        'To run full EC2 workloads closer to customers for lower compute latency',
                        'To provide a secondary Region for automatic disaster recovery failover',
                        'To replace Amazon Route 53 as the primary DNS service',
                        'To cache and deliver content from locations physically close to end users, reducing latency'
                    ],
                    explanation: 'Edge locations are points of presence AWS operates in addition to Regions and Availability Zones, and Amazon CloudFront uses them to cache and deliver content from a location physically close to the end user, cutting latency. Crawl: there are hundreds of edge locations worldwide, far more numerous than Regions, spread across dozens of cities on every populated continent. When CloudFront serves a request, it checks the nearest edge location first; if the content is already cached there, it is returned immediately without a round trip to the origin (an S3 bucket or a load balancer in front of EC2). Walk: edge locations do not run your application code or host your database -- that is what Regions and Availability Zones are for. Their job is strictly to cache and accelerate delivery of content, and Amazon Route 53 (DNS) also uses this same edge network to resolve queries from the location closest to the requester. Run: this is a frequently tested distinction on CLF-C02 -- if a scenario says "reduce latency for a global audience viewing largely static or cacheable content," the answer is CloudFront (an edge-location service), not "deploy to more Regions" (which addresses compute and data residency, not content caching). AWS also operates a private global network backbone connecting Regions and edge locations, which is why cross-Region and edge traffic does not have to traverse the public internet.'
                },
                {
                    question: 'Which AWS service provides IaaS virtual servers where the customer manages the guest operating system?',
                    options: [
                        'AWS Lambda',
                        'Amazon EC2',
                        'AWS Elastic Beanstalk',
                        'Amazon RDS'
                    ],
                    explanation: 'Amazon EC2 (Elastic Compute Cloud) is AWS\'s core Infrastructure as a Service offering -- you get a virtual server (an "instance") and you are responsible for the guest operating system, patches, middleware, runtime, and application, while AWS manages the physical hardware, hypervisor, and network fabric beneath it. Crawl: when you launch an EC2 instance, you choose an Amazon Machine Image (AMI) as the template, an instance type (family + size) that determines vCPUs, memory, and network performance, and the Availability Zone it launches into. From that point forward, you SSH or RDP in and manage it like any server. Walk: instance families are matched to workload shape: t-series (burstable, general/dev), m-series (general purpose), c-series (compute-optimized), r-series (memory-optimized), g/p-series (GPU), and i-series (storage-optimized). Compare this to AWS Lambda (serverless -- AWS manages everything except your function code), AWS Elastic Beanstalk (PaaS -- AWS manages the OS and scaling, you manage code and configuration), and Amazon RDS (a managed database service, not general-purpose compute). Run: the shared responsibility model is central here -- EC2 shifts OS and application management to the customer, which is exactly why it gives you the most control of any AWS compute option, at the cost of the most operational responsibility. EC2 Auto Scaling groups, spread across multiple Availability Zones, are the standard way to make EC2-based architectures resilient.'
                },
                {
                    question: 'What does an EC2 Auto Scaling group do?',
                    options: [
                        'Automatically launches and terminates EC2 instances to keep capacity between a minimum and maximum, tracking a desired count based on demand',
                        'Automatically encrypts every EBS volume attached to an instance',
                        'Balances DNS queries across multiple Route 53 hosted zones',
                        'Migrates running EC2 instances between AWS Regions without downtime'
                    ],
                    explanation: 'An EC2 Auto Scaling group (ASG) automatically launches and terminates EC2 instances so that running capacity stays between a configured minimum and maximum, tracking a desired count that scaling policies adjust in response to real demand. Crawl: an ASG references a launch template (which packages the AMI, instance type, and configuration) and a set of Availability Zones to launch into. If traffic spikes, a scaling policy tied to a CloudWatch metric (CPU utilization, request count) can raise the desired count and the ASG launches new instances automatically; when demand drops, it terminates the excess. Walk: this is elasticity in concrete, testable form -- you never manually SSH in to add capacity, and you never pay for idle instances you provisioned "just in case." Spreading an ASG across multiple Availability Zones is also the standard way to make an EC2-based application highly available: losing one AZ does not take the application down because the ASG can launch replacement capacity in the surviving AZs. Run: the distractors describe unrelated AWS behaviors -- EBS encryption is a per-volume setting, Route 53 balances DNS resolution (not EC2 capacity), and EC2 instances are not migrated live between Regions. For CLF-C02, know that Auto Scaling is what turns a fixed fleet of EC2 instances into an elastic one, and that it is commonly paired with Elastic Load Balancing to distribute incoming traffic across whatever instances are currently running.'
                },
                {
                    question: 'Which statement best describes AWS Lambda?',
                    options: [
                        'A fully managed relational database engine',
                        'A content delivery network for caching static assets',
                        'A serverless compute service that runs code in response to events without provisioning servers, billed per millisecond of execution',
                        'A virtual desktop infrastructure service for remote employees'
                    ],
                    explanation: 'AWS Lambda is a serverless compute service that runs your code in response to events without you provisioning or managing any servers, and you are billed only for the compute time your function actually consumes, down to the millisecond. Crawl: you upload a function (in Python, Node.js, Java, Go, and other supported runtimes), attach a trigger, and Lambda runs it whenever that trigger fires. Common triggers include an API Gateway HTTP request, a new object landing in an S3 bucket, a DynamoDB stream event, or a scheduled rule. Walk: there is no instance type to choose and no Availability Zone to manage explicitly -- you configure memory allocation and a timeout, and Lambda handles everything else, including scaling from zero invocations to thousands per second automatically. This is the opposite end of the compute spectrum from Amazon EC2: EC2 gives maximum control with maximum management burden; Lambda gives essentially zero infrastructure management in exchange for giving up control over the underlying server. Run: the distractors name unrelated service categories (a database engine, a CDN, virtual desktops). For CLF-C02, recognize Lambda whenever a scenario emphasizes "event-driven," "no servers to manage," or "pay only for what you use, down to the millisecond" -- and remember that AWS Fargate extends this same serverless philosophy to containers.'
                },
                {
                    question: 'What is AWS Elastic Beanstalk?',
                    options: [
                        'A container orchestration service equivalent to Kubernetes',
                        'A managed NoSQL database service',
                        'A tool that automatically writes CloudFormation templates for you',
                        'A fully managed PaaS that provisions and manages the EC2 instances, load balancer, and Auto Scaling group behind your uploaded application code'
                    ],
                    explanation: 'AWS Elastic Beanstalk is a fully managed Platform as a Service: you upload your application code and Elastic Beanstalk provisions and manages the EC2 instances, the Elastic Load Balancer, and the Auto Scaling group running underneath it. Crawl: supported platforms include Java, .NET, PHP, Node.js, Python, Ruby, Go, and Docker. You never SSH into a server to install a web server or configure load balancing by hand -- Elastic Beanstalk wires it all together and keeps the OS patched. Walk: you still retain some access to the underlying resources if you need to tune them, which is part of what distinguishes Elastic Beanstalk from a pure serverless model like Lambda. Compare the compute spectrum: EC2 (you manage the OS) sits at one end, Elastic Beanstalk (AWS manages the OS, you manage code) sits in the middle, and Lambda (AWS manages everything but your function code) sits further along, with Fargate containers at the far end. Run: the distractors describe other categories entirely -- Kubernetes-equivalent orchestration is Amazon EKS, not Elastic Beanstalk; a managed NoSQL database is DynamoDB; and no AWS service automatically writes CloudFormation templates for you (CloudFormation templates are authored by you or generated by tools like the CDK). For CLF-C02, Elastic Beanstalk is the PaaS answer whenever a scenario wants "deploy code without managing servers, but still have some infrastructure visibility."'
                },
                {
                    question: 'A team wants to run containers without provisioning or managing any EC2 instances. Which AWS compute option should they use?',
                    options: [
                        'Amazon EC2 with a manually configured Auto Scaling group',
                        'AWS Fargate',
                        'AWS Elastic Beanstalk with a single-instance environment',
                        'Amazon EMR'
                    ],
                    explanation: 'AWS Fargate is a serverless compute engine for containers -- it runs tasks for Amazon ECS or pods for Amazon EKS without the team ever provisioning, patching, or managing an underlying EC2 instance. Crawl: normally, running containers on ECS or EKS means you (or AWS, if you choose Fargate) still need compute capacity to place those containers on. With the EC2 launch type, that capacity is a fleet of EC2 instances you manage. With Fargate, you specify the CPU and memory your container needs and AWS runs it directly -- no instance to patch, size, or scale manually. Walk: Amazon ECS is AWS\'s own container orchestrator; Amazon EKS is managed Kubernetes for teams standardized on the Kubernetes API. Both can run on Fargate, which makes Fargate the answer whenever a scenario asks for "containers with no server management," the same way Lambda is the answer for "functions with no server management." Run: the distractors either still require managing EC2 instances directly (option A), are not designed for container workloads at all (Elastic Beanstalk single-instance is meant for a monolithic app, not orchestrated containers), or serve a completely different purpose (Amazon EMR is a managed big-data/Hadoop-Spark cluster service, unrelated to this scenario). For CLF-C02, pair the keyword "containers" with "no server management" and land on Fargate.'
                },
                {
                    question: 'A company has data that is rarely accessed, must be retained for compliance, and can tolerate a retrieval time measured in hours. Which S3 storage class is the MOST cost-effective choice?',
                    options: [
                        'S3 Standard',
                        'S3 Standard-IA',
                        'S3 Glacier Deep Archive',
                        'S3 Intelligent-Tiering'
                    ],
                    explanation: 'S3 Glacier Deep Archive is the lowest-cost Amazon S3 storage class, purpose-built for data that is rarely if ever accessed and can tolerate a restore time measured in hours -- exactly the profile described in this scenario. Crawl: S3 storage classes exist on a spectrum that trades storage cost against retrieval speed and cost. S3 Standard is for frequently accessed, hot data with millisecond retrieval. S3 Standard-IA (infrequent access) lowers the per-GB storage cost but adds a retrieval fee, aimed at data accessed a few times a month. S3 Glacier Instant Retrieval keeps millisecond access for rarely touched archives. S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive push storage cost even lower in exchange for retrieval times ranging from minutes to hours -- Deep Archive is the cheapest of all, with restores typically taking up to 12 hours. Walk: S3 Intelligent-Tiering automatically moves objects between tiers based on observed access patterns, which is useful when access patterns are unpredictable, but it is not automatically the cheapest option for data you already know is rarely accessed and compliance-retained. Run: the specific combination of "rarely accessed," "compliance retention," and "hours-long retrieval is acceptable" is the textbook signal for S3 Glacier Deep Archive on the CLF-C02 exam -- watch for these qualifiers to distinguish it from Glacier Instant Retrieval (fast restore) or Standard-IA (still relatively fast, more expensive).'
                },
                {
                    question: 'Which statement correctly distinguishes Amazon EBS from Amazon EFS?',
                    options: [
                        'EBS is a block storage volume that lives in one Availability Zone and attaches to a single instance at a time; EFS is a managed NFS file system that many instances across multiple AZs can mount concurrently',
                        'EBS is object storage and EFS is block storage',
                        'EBS can be mounted by many EC2 instances at once, while EFS can only attach to a single instance',
                        'EBS and EFS are two marketing names for the same underlying AWS storage service'
                    ],
                    explanation: 'Amazon EBS provides block storage volumes that live in exactly one Availability Zone and attach to a single EC2 instance at a time, functioning like a virtual hard drive; Amazon EFS is a fully managed NFS file system that many EC2 instances, across multiple Availability Zones, can mount and share concurrently. Crawl: because an EBS volume is tied to one AZ, it can only attach to instances in that same AZ, and typically to one instance at a time (a few volume types support limited multi-attach, but the default mental model for CLF-C02 is one volume, one instance). EFS solves the opposite problem: when many instances need to read and write the same shared files -- a content management system, a shared home directory, a rendering farm -- EFS provides that shared, elastic file system without you managing any storage servers. Walk: EBS volume types trade IOPS, throughput, and cost: gp3 (general-purpose SSD) is the default choice for most workloads, io2 handles the highest and most consistent IOPS requirements, and st1/sc1 are lower-cost HDD types for throughput-heavy, infrequently accessed workloads. Run: the distractors invert the storage models (EBS is not object storage; S3 fills that role) or invert the attachment model (EFS is what supports concurrent multi-instance access, not EBS). For CLF-C02, the keyword "shared across instances" or "multiple Availability Zones" should point you to EFS; "boot volume" or "attached to one EC2 instance" should point you to EBS.'
                },
                {
                    question: 'What is an Amazon VPC?',
                    options: [
                        'A managed firewall appliance that filters all internet-bound traffic by default',
                        'A public DNS zone that resolves domain names to IP addresses',
                        'A load balancer that automatically distributes traffic across Availability Zones',
                        'A logically isolated virtual network, scoped to a Region, where you define subnets, route tables, and gateways'
                    ],
                    explanation: 'Amazon VPC (Virtual Private Cloud) is a logically isolated virtual network, scoped to a single AWS Region, where you define your own IP address range, subnets, route tables, and gateways. Crawl: every new AWS account gets a default VPC in each Region (commonly 172.31.0.0/16), but you can also create custom VPCs with your own CIDR block, such as 10.0.0.0/16. Inside a VPC you carve out subnets -- a public subnet with a route to an Internet Gateway for resources that need direct internet access, and private subnets that reach the internet only outbound, through a NAT Gateway. Walk: a VPC spans all the Availability Zones in its Region, so subnets (and the resources inside them) can be spread across multiple AZs for resilience. Traffic control inside a VPC happens at two layers: Security Groups (stateful, applied at the instance/ENI level, allow rules only) and Network ACLs (stateless, applied at the subnet level, support both allow and deny rules). Run: the distractors describe other AWS networking services -- AWS Network Firewall (a managed firewall appliance), Amazon Route 53 (public/private DNS), and Elastic Load Balancing (traffic distribution) -- none of which is the VPC itself. For CLF-C02, remember that a VPC is the networking foundation everything else (EC2, RDS, ELB, NAT Gateways) is deployed into.'
                },
                {
                    question: 'A company needs to distribute incoming HTTP traffic across EC2 instances running in two Availability Zones. Which AWS service should it use?',
                    options: [
                        'Amazon Route 53',
                        'Elastic Load Balancing',
                        'AWS Direct Connect',
                        'AWS Storage Gateway'
                    ],
                    explanation: 'Elastic Load Balancing (ELB) is the AWS service that distributes incoming application traffic across multiple targets -- EC2 instances, containers, or IP addresses -- in one or more Availability Zones, which is exactly the requirement in this scenario. Crawl: an Application Load Balancer (ALB) operates at Layer 7 and can make routing decisions based on HTTP path, host header, or headers -- the right choice for typical web application traffic. A Network Load Balancer (NLB) operates at Layer 4 for extreme performance and static IP requirements. Walk: ELB continuously health-checks its registered targets and only routes traffic to healthy ones, which is also how a Multi-AZ architecture built on EC2 Auto Scaling groups achieves high availability -- if one AZ becomes unhealthy, the load balancer simply stops sending traffic there while the ASG launches replacement capacity elsewhere. Run: the distractors serve different purposes -- Amazon Route 53 is DNS (it resolves a domain name to an IP address or routes based on policies like latency or geolocation, but it does not itself balance a live connection across instances the way ELB does), AWS Direct Connect is a private network link between on-premises and AWS, and AWS Storage Gateway bridges on-premises applications to AWS storage. For CLF-C02, "distribute traffic across instances/AZs" is the direct signal for Elastic Load Balancing; Amazon API Gateway plays a related but distinct role fronting serverless APIs, typically with Lambda behind it rather than EC2 instances.'
                },
                {
                    question: 'Which AWS database service is a fully managed relational database supporting engines such as MySQL, PostgreSQL, and SQL Server?',
                    options: [
                        'Amazon RDS',
                        'Amazon DynamoDB',
                        'Amazon ElastiCache',
                        'Amazon Redshift'
                    ],
                    explanation: 'Amazon RDS (Relational Database Service) is AWS\'s fully managed relational database service, supporting six engines: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, and Amazon Aurora. Crawl: RDS handles patching, automated backups, and (when you enable it) Multi-AZ deployments that maintain a synchronously replicated standby in a second Availability Zone for automatic failover. You still design your schema and write your SQL queries, but you no longer install database software, apply security patches by hand, or build your own backup scripts. Walk: Amazon Aurora, one of the six RDS-compatible engines, is AWS\'s own cloud-native relational database, compatible with MySQL and PostgreSQL wire protocols, built for higher throughput and storage that auto-scales up to very large sizes without manual provisioning. Run: the distractors are real AWS database and caching services but answer different questions -- Amazon DynamoDB is a NoSQL key-value/document database, not relational; Amazon ElastiCache is an in-memory caching layer (Redis or Memcached) that typically sits in front of a database to reduce read load, not a primary datastore; and Amazon Redshift is a data warehouse built for large-scale analytics and BI queries, not transactional relational workloads. For CLF-C02, "relational" plus "MySQL/PostgreSQL/SQL Server" is the direct signal for RDS (or Aurora specifically, when the scenario also emphasizes cloud-native performance).'
                },
                {
                    question: 'A mobile application needs a NoSQL database that delivers single-digit millisecond latency at massive scale, with the option to replicate data across Regions using Global Tables. Which AWS service fits this requirement?',
                    options: [
                        'Amazon RDS',
                        'Amazon Aurora',
                        'Amazon DynamoDB',
                        'Amazon Redshift'
                    ],
                    explanation: 'Amazon DynamoDB is a fully managed, serverless NoSQL database that delivers single-digit millisecond performance at virtually any scale, and DynamoDB Global Tables replicate data across the AWS Regions you select for multi-Region, low-latency access -- matching every requirement in this scenario. Crawl: DynamoDB uses a key-value and document data model rather than SQL tables and joins, which lets it scale horizontally to handle massive, unpredictable request volumes without you managing servers, storage, or replication infrastructure. Walk: Global Tables are DynamoDB\'s built-in multi-Region replication feature -- writes made in one Region propagate to the other Regions in the table automatically, so a mobile application with users worldwide can read and write to the Region closest to each user with low latency. Run: the distractors are all real, but relational-model, database services -- Amazon RDS and Amazon Aurora are both relational (SQL) databases better suited to structured data with joins and ACID transactions across tables, and Amazon Redshift is an analytical data warehouse, not a low-latency operational database for an app\'s live read/write path. For CLF-C02, the combination of "NoSQL," "single-digit millisecond," "massive scale," and "global replication" is the textbook signal for DynamoDB specifically -- this is one of the most frequently tested service-selection patterns on the exam.'
                },
                {
                    question: 'Which statement is true about the different ways to interact with AWS (Management Console, AWS CLI, SDKs, and CloudFormation)?',
                    options: [
                        'Only the AWS CLI can perform certain privileged operations that the Management Console cannot',
                        'SDKs can only read data from AWS services, not create or modify resources',
                        'CloudFormation templates can only be applied through the Management Console, never through the CLI',
                        'All four ultimately send signed requests to the same underlying AWS API, so anything one can do the others can also do'
                    ],
                    explanation: 'The Management Console, the AWS CLI, SDKs, and CloudFormation are four different interfaces to the same underlying AWS API -- every click, command, SDK call, or template deployment is translated into a signed HTTPS request against that API, so there is no capability exclusive to one interface. Crawl: the Management Console is the browser-based UI, ideal for exploring services and making one-off changes. The AWS CLI lets you script and automate the exact same actions from a terminal (the interface used throughout this chapter\'s lab). SDKs (such as boto3 for Python, or the AWS SDK for JavaScript, Java, and .NET) let application code call AWS services directly. CloudFormation is Infrastructure as Code -- you describe the desired resources in a JSON or YAML template and AWS creates, updates, or deletes them to match. Walk: because they all reach the same API, you can create a resource in the Console and manage it later with the CLI, or vice versa, with no loss of capability. Run: CloudFormation templates are commonly deployed via the CLI or SDKs in automated pipelines, not only through the Console, and SDKs fully support create, update, and delete operations, not just reads. For CLF-C02, understand why Infrastructure as Code matters: CloudFormation templates are version-controllable, repeatable, and self-documenting, letting you redeploy an identical environment instead of manually recreating it by clicking through the Console.'
                }
            ]
        });
        quiz.start();
    </script>
