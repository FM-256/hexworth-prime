    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Security, Billing & Support',
            description: 'Test your understanding of the AWS shared responsibility model, IAM, security services, compliance, pricing, billing tools, and AWS Support plans',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'clf-ch03-quiz',
            moduleId: 'clf-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'In the AWS shared responsibility model, which layer does the CUSTOMER always retain responsibility for, regardless of which service model (IaaS, a managed service like RDS, or SaaS) is in use?',
                    options: [
                        'Customer data, and the identities and access permissions used to reach it',
                        'Physical security of the AWS data center',
                        'Patching the hypervisor that hosts virtual machines',
                        'The global network backbone connecting AWS Regions'
                    ],
                    explanation: 'The customer always retains responsibility for their data and for the identities and access permissions used to reach it, no matter which AWS service model is in play. Crawl: AWS describes this split as "security OF the cloud" (AWS\'s job) versus "security IN the cloud" (the customer\'s job). AWS builds and physically secures the data centers, the hardware, the hypervisor, and the global network. The customer decides what goes into that infrastructure and who is allowed to touch it. Walk: what shifts across service models is everything in between. With EC2 (IaaS), the customer patches the guest OS and configures the firewall. With a managed database like RDS, AWS patches the database engine, but the customer still writes the IAM policies, encrypts the data, and decides who can query it. Even with a fully managed SaaS product, the customer configures user access and is accountable for what data goes in. Run: options B, C, and D are all squarely on the AWS side of the line in every service model -- physical security, hypervisor patching, and network hardware are never customer duties. Option A is the one constant across every model. For CLF-C02, whenever a scenario asks "who is responsible no matter what," the answer is data and access management -- the customer never gets to hand that off.'
                },
                {
                    question: 'An IAM policy statement includes Effect, Action, and Resource elements. Which element determines whether the statement ALLOWS or DENIES the specified actions?',
                    options: [
                        'Resource',
                        'Action',
                        'Principal',
                        'Effect'
                    ],
                    explanation: 'The Effect element is what determines whether a policy statement allows or denies the actions it describes -- it is set to either "Allow" or "Deny". Crawl: a minimal IAM policy statement needs three things to make sense: an Effect (allow or deny), one or more Actions (the specific API calls covered, like s3:GetObject), and one or more Resources (the ARNs the statement applies to, like a specific bucket). Without Effect, the statement has no verdict -- it would just be a list of actions and resources with no indication of whether they are permitted. Walk: Action defines which API operations are in scope, and Resource scopes those operations to specific ARNs, but neither one says yes or no. Principal is used in resource-based policies (like an S3 bucket policy) to specify who the statement applies to, but it is not present in identity-based policies attached to a user, group, or role, and even when present, it still is not the element that decides allow/deny. Run: IAM evaluates all applicable policies for a request and applies a strict rule -- an explicit Deny anywhere always wins, even if another policy has an Allow. If no Allow is found, access is denied by default. For CLF-C02, remember that IAM is deny-by-default: nothing is permitted until an Effect: Allow statement grants it, and that grant is always subject to being overridden by an explicit Effect: Deny elsewhere.'
                },
                {
                    question: 'What is the AWS-recommended best practice for the root user immediately after creating a new AWS account?',
                    options: [
                        'Generate long-term access keys for the root user so scripts can use them',
                        'Enable multi-factor authentication on the root user and reserve it only for tasks that specifically require root',
                        'Share the root user password with the entire operations team for convenience',
                        'Delete the root user, since IAM users can perform every action root can perform'
                    ],
                    explanation: 'AWS recommends enabling MFA on the root user immediately and using it only for the small number of tasks that genuinely require root, while everyday work is done through IAM users, roles, or IAM Identity Center. Crawl: the root user is created automatically with the AWS account and has unrestricted access to every resource and every setting, including the ability to close the account entirely. Because of that unrestricted power, root should not be the identity anyone logs in as day to day. Walk: enabling MFA (ideally a hardware security key or virtual authenticator app) on root adds a second factor beyond the password, so a leaked password alone cannot compromise the account. AWS also recommends never generating long-term access keys for root; if root credentials are needed for a script, that is a sign the design should use an IAM role instead. Run: a small set of actions genuinely require root, such as changing the account\'s AWS Support plan or closing the account, and those should be rare, deliberate, logged events -- not routine operations. Options A, C, and D all increase risk: generating root access keys creates a powerful long-lived credential that can leak, sharing the root password removes any accountability for who did what, and deleting root is not possible (and unnecessary) since AWS retains it as the account\'s ultimate identity. For CLF-C02, "MFA on root, minimize its use" is one of the most frequently tested security best practices.'
                },
                {
                    question: 'An application running on an EC2 instance needs to write objects to an S3 bucket. What is the AWS-recommended way to grant this access?',
                    options: [
                        'Store an IAM user\'s long-term access keys inside the application\'s source code',
                        'Make the destination S3 bucket public so any request succeeds',
                        'Attach an IAM role with the necessary permissions directly to the EC2 instance',
                        'Use the AWS account root user\'s credentials inside the application'
                    ],
                    explanation: 'The recommended pattern is to attach an IAM role, with only the permissions the application needs, directly to the EC2 instance. Crawl: an IAM role has no long-term credentials of its own. When it is attached to an EC2 instance (via an instance profile), the instance automatically receives short-lived, automatically rotated temporary credentials that the AWS SDK or CLI can use without any secrets being stored on disk or in code. Walk: this is exactly why roles exist as a distinct IAM concept from users -- a user is meant for a persistent identity (a person or a long-running external system) with durable credentials, while a role is meant to be assumed temporarily by whoever or whatever needs it, whether that is a human, an EC2 instance, or a Lambda function. Scoping the role\'s policy to only s3:PutObject on the specific bucket follows least privilege at the same time. Run: the other three options are textbook anti-patterns. Hardcoding IAM user access keys in source code risks them leaking through version control or logs. Making the bucket public removes access control entirely, exposing data to the internet. Using root credentials inside an application is the worst version of the access-key problem, since root has no permission boundaries at all. For CLF-C02, whenever a scenario describes an AWS resource (EC2, Lambda, ECS) needing to call another AWS service, the answer is almost always an IAM role.'
                },
                {
                    question: 'Which statement correctly distinguishes a security group from a network ACL?',
                    options: [
                        'Network ACLs are stateful and operate at the instance level; security groups are stateless and operate at the subnet level',
                        'Security groups are stateful and operate at the instance level; network ACLs are stateless and operate at the subnet level',
                        'Both security groups and network ACLs are stateful and operate at the subnet level',
                        'Both security groups and network ACLs are stateless and operate at the instance level'
                    ],
                    explanation: 'Security groups are stateful and attach to instances (technically to elastic network interfaces); network ACLs are stateless and attach to subnets. Crawl: "stateful" means a security group automatically allows the return traffic for any connection it permitted outbound or inbound -- you do not need a separate rule for the response. "Stateless" means a network ACL evaluates inbound and outbound traffic independently, so you must explicitly allow both directions of a conversation, or legitimate return traffic gets dropped. Walk: security groups only support Allow rules -- anything not explicitly allowed is implicitly denied, and every rule is evaluated before a decision is made. Network ACLs support both Allow and Deny rules, and they are evaluated in numbered order with the first matching rule deciding the outcome, which makes rule ordering meaningful in a way it is not for security groups. Run: because a security group operates at the instance/ENI level, it protects one resource or a group of resources you explicitly associate it with, while a network ACL protects every resource in the subnet it is attached to as a second layer of defense. A common real-world pattern is a permissive security group scoped tightly to the exact ports needed, backed by a stricter subnet-level NACL as defense in depth. For CLF-C02, memorize the pairing: security group = stateful + instance level + allow only; NACL = stateless + subnet level + allow and deny.'
                },
                {
                    question: 'A company wants to block SQL injection and cross-site scripting attempts against a web application running behind an Application Load Balancer. Which AWS service should they use?',
                    options: [
                        'AWS Shield Standard',
                        'Amazon GuardDuty',
                        'AWS WAF',
                        'AWS Config'
                    ],
                    explanation: 'AWS WAF is a web application firewall that operates at Layer 7 and is designed specifically to block common web exploits like SQL injection and cross-site scripting. Crawl: WAF deploys web ACLs (rule sets) in front of an Application Load Balancer, Amazon CloudFront distribution, API Gateway, or AppSync API. Each rule inspects the content of incoming HTTP(S) requests -- headers, query strings, request bodies -- and can allow, block, or count traffic that matches a malicious pattern. Walk: AWS provides managed rule groups that already encode protections against the OWASP Top 10 (including SQL injection and XSS), so a team does not need to hand-write every detection rule. Custom rules can also be added for application-specific threats, and rate-based rules can throttle abusive clients. Run: the other options solve different problems. AWS Shield Standard defends against network and transport layer (L3/L4) DDoS attacks, not application-layer exploits like SQL injection. Amazon GuardDuty detects anomalous account and network behavior across your AWS environment, but it does not inspect or block individual HTTP requests to a web app. AWS Config tracks resource configuration and compliance over time -- it has nothing to do with inline traffic inspection. For CLF-C02, when a scenario mentions attacks embedded in web requests (SQLi, XSS, bad bots), the answer is WAF; when it mentions volumetric or protocol-based flooding, the answer is Shield.'
                },
                {
                    question: 'A security team needs to determine exactly which IAM identity deleted a specific S3 bucket, and at what time. Which AWS service provides this information?',
                    options: [
                        'Amazon CloudWatch',
                        'AWS Trusted Advisor',
                        'Amazon Inspector',
                        'AWS CloudTrail'
                    ],
                    explanation: 'AWS CloudTrail is the audit log of every API call made in an AWS account, which makes it the service that can answer exactly who did what and when. Crawl: every time someone (or something) calls an AWS API -- through the console, CLI, SDK, or another AWS service -- CloudTrail can record that event, including the calling identity\'s ARN, the source IP address, the timestamp, and whether the call succeeded. A DeleteBucket call against S3 would show up as a management event with the responsible IAM user or role clearly identified. Walk: CloudTrail records management events by default at no extra charge, and can optionally capture data events (like individual S3 object reads) for a more granular, but higher-volume and billed, audit trail. Events are typically delivered to an S3 bucket and can also stream to CloudWatch Logs for real-time alerting on suspicious API activity. Run: CloudWatch monitors metrics, logs, and alarms about resource performance and operational health, not who called an API. Trusted Advisor gives configuration and cost recommendations, not an audit trail. Inspector scans for software vulnerabilities and network exposure, not user activity. For CLF-C02, the pattern is simple: any question about "who performed this action" or "was this account compromised and what did the attacker do" points to CloudTrail, because it is the only service purpose-built to record account activity.'
                },
                {
                    question: 'What is the primary function of Amazon GuardDuty?',
                    options: [
                        'Continuously analyze account activity using machine learning and threat intelligence to detect malicious or unauthorized behavior',
                        'Automatically encrypt data at rest across every AWS service',
                        'Scan EC2 AMIs for outdated software packages before they are launched',
                        'Enforce mandatory resource tagging across an AWS Organization'
                    ],
                    explanation: 'Amazon GuardDuty is a managed threat detection service that continuously analyzes account and network activity for signs of compromise, using machine learning, anomaly detection, and curated threat intelligence feeds. Crawl: GuardDuty ingests CloudTrail management and data events, VPC Flow Logs, and DNS query logs, and correlates them looking for patterns like an EC2 instance suddenly communicating with a known cryptocurrency-mining pool, unusual API calls from an unfamiliar geographic location, or reconnaissance activity against IAM credentials. Walk: it requires no agents to install and no infrastructure to manage -- you simply enable a detector per account/Region and findings start appearing, each with a severity rating and enough context to begin an investigation. This makes it fundamentally different from a preventive control; GuardDuty does not block anything on its own, it detects and alerts, and can trigger automated remediation through EventBridge if you build that integration. Run: the distractors describe other services entirely. Encryption at rest is the domain of KMS combined with each service\'s encryption settings, not GuardDuty. Scanning for vulnerable software packages describes Amazon Inspector. Enforcing tagging policy is a governance function handled by AWS Organizations tag policies or Config rules. For CLF-C02, GuardDuty is the answer whenever a scenario is about detecting threats or suspicious behavior after the fact, as opposed to blocking traffic in real time (WAF/Shield) or scanning for known vulnerabilities (Inspector).'
                },
                {
                    question: 'A company wants to be notified whenever a security group\'s configuration changes and whether the new configuration still complies with an internal rule. Which AWS service fits this requirement?',
                    options: [
                        'AWS CloudTrail',
                        'AWS Config',
                        'Amazon Macie',
                        'AWS Artifact'
                    ],
                    explanation: 'AWS Config records the configuration of your resources over time and can continuously evaluate that configuration against rules, making it the right fit for tracking a security group\'s changes and its ongoing compliance. Crawl: Config maintains a timeline of every configuration change for supported resource types, so you can see exactly what a security group\'s rules looked like at any point in the past, not just what they look like right now. Walk: Config Rules add the compliance layer -- a rule like "no security group should allow unrestricted SSH access from 0.0.0.0/0" is evaluated automatically whenever the resource changes, and the resource is marked compliant or non-compliant in a dashboard. Some rules can even trigger automatic remediation. This is different from a one-time check; Config re-evaluates continuously as configuration drifts. Run: CloudTrail would show that a security group\'s API was called and by whom, but it does not maintain a structured configuration history or evaluate compliance rules on its own. Macie is focused specifically on discovering sensitive data in S3, unrelated to network configuration. AWS Artifact is a document repository for compliance reports and agreements, not a live monitoring service. For CLF-C02, the distinguishing phrase to watch for is "track configuration changes over time and evaluate compliance" -- that phrase almost always points to AWS Config, while "record who called the API" points to CloudTrail.'
                },
                {
                    question: 'What is the main purpose of AWS Key Management Service (KMS)?',
                    options: [
                        'Automatically rotate database credentials used by an application',
                        'Continuously scan running EC2 instances for malware',
                        'Manage which IAM users belong to which IAM groups',
                        'Create, manage, and control the cryptographic keys used to encrypt data across AWS services'
                    ],
                    explanation: 'AWS KMS lets you create, manage, and control the cryptographic keys used to encrypt data across AWS services such as S3, EBS, and RDS. Crawl: instead of building and safeguarding your own key infrastructure, KMS gives you managed keys that never leave the service unencrypted, along with key policies that control exactly which IAM identities are allowed to use or administer each key. When you enable encryption on an S3 bucket or an EBS volume, you are typically choosing a KMS key to perform that encryption. Walk: KMS commonly uses envelope encryption -- a KMS key encrypts a smaller, unique data key, and that data key is what actually encrypts your bulk data, which avoids sending large volumes of data to KMS itself and keeps operations fast. Symmetric KMS keys can be configured to rotate automatically on an annual basis, reducing the operational burden of manual key rotation. Run: the distractors belong to other services -- automatically rotating database credentials is what AWS Secrets Manager does (and it can use a KMS key under the hood to encrypt those secrets, but rotation is Secrets Manager\'s job), scanning EC2 instances for malware and vulnerabilities is Amazon Inspector\'s role, and managing IAM group membership is a core IAM function unrelated to encryption. For CLF-C02, remember the pairing: KMS = the keys that encrypt data; Secrets Manager = the credentials and secrets that often get encrypted using those keys.'
                },
                {
                    question: 'A customer\'s external auditor requests AWS\'s latest SOC 2 report as evidence for a security audit. Where should the customer obtain it?',
                    options: [
                        'AWS Trusted Advisor',
                        'AWS Config',
                        'AWS Artifact',
                        'Amazon Macie'
                    ],
                    explanation: 'AWS Artifact is the self-service portal where customers can download AWS\'s compliance reports, including SOC 1, SOC 2, and SOC 3 reports, ISO certifications, and PCI DSS attestations, and where they can review and accept agreements like a HIPAA Business Associate Addendum (BAA). Crawl: rather than emailing an AWS account team and waiting for someone to manually send a document, Artifact gives every customer on-demand access to the current library of audit reports covering AWS\'s infrastructure and services. Walk: these reports describe AWS\'s own controls -- the "security OF the cloud" side of the shared responsibility model -- and are refreshed as AWS\'s independent audits are completed throughout the year, so the library in Artifact is kept current without any customer action required. A customer still has to produce their own evidence for the controls they are responsible for ("security IN the cloud"), but Artifact removes the AWS-side sourcing problem entirely. Run: none of the other services are document repositories. Trusted Advisor gives configuration and cost recommendations about your account. AWS Config tracks resource configuration history and compliance rule evaluation. Amazon Macie discovers sensitive data in S3. For CLF-C02, whenever a question mentions needing an audit report, certification, or a signed compliance agreement, AWS Artifact is the answer -- it is a library, not a scanning or monitoring tool.'
                },
                {
                    question: 'Which of the following AWS data transfer patterns is typically billed?',
                    options: [
                        'Data transferred out of AWS to the internet',
                        'Data transferred into AWS from the internet',
                        'Data transferred between two EC2 instances in the same Availability Zone',
                        'Data transferred inbound to AWS over AWS Direct Connect'
                    ],
                    explanation: 'Data transferred out of AWS to the internet is the data transfer pattern that is typically billed, while data moving into AWS is generally free. Crawl: AWS pricing rests on three core dimensions -- compute (pay for what runs), storage (pay for what is stored per GB per month), and data transfer, specifically data transfer OUT. Uploading data to AWS from the internet does not incur a data transfer charge, which removes friction from getting your data into the cloud in the first place. Walk: once your application serves that data back out to users over the internet, AWS charges per GB transferred out, and the rate can vary depending on volume and the AWS Region. This asymmetry is deliberate -- AWS wants ingestion to be frictionless, and monetizes egress instead. Traffic that stays inside AWS, especially within the same Availability Zone, is typically free or heavily discounted, which is one reason architects try to keep chatty internal traffic (like an application talking to its database) within the same AZ when possible. Run: inbound data transfer, whether over the public internet or over a Direct Connect link, is not the item that gets billed in this model; it is specifically the outbound leg to the internet that shows up as a distinct line item on the bill. For CLF-C02, remember the shorthand: data in is free, data out to the internet costs money, and same-AZ traffic is the cheapest of all.'
                },
                {
                    question: 'A company runs an interruption-tolerant batch analytics job that can pause and resume processing at any time. Which EC2 pricing model offers the largest potential savings for this workload?',
                    options: [
                        'On-Demand Instances',
                        'Standard Reserved Instances',
                        'Dedicated Hosts',
                        'Spot Instances'
                    ],
                    explanation: 'Spot Instances offer the deepest discounts of any EC2 pricing model, in exchange for AWS being able to reclaim the capacity with only a two-minute interruption notice -- a trade-off that fits an interruption-tolerant batch job perfectly. Crawl: Spot Instances let you use AWS\'s spare compute capacity at prices that can be dramatically lower than On-Demand, because you are agreeing that AWS may take the instance back if that capacity is needed elsewhere. A workload that can checkpoint, pause, and resume (or simply restart cleanly) is exactly what Spot is designed for. Walk: On-Demand offers no discount but no commitment either, making it the safe default for workloads that cannot tolerate interruption. Reserved Instances trade a 1- or 3-year commitment for a meaningful discount, but they assume the workload runs continuously and do not save more than Spot for a job that only runs intermittently. Dedicated Hosts dedicate an entire physical server to you, which is about licensing and compliance isolation, not cost savings, and are typically more expensive than shared-tenancy options, not less. Run: for CLF-C02, match workload characteristics to pricing model -- steady, predictable, always-on workloads favor Reserved Instances or Savings Plans; flexible, fault-tolerant, interruptible workloads (batch processing, CI/CD runners, big data jobs, rendering) favor Spot; and unpredictable or short-lived workloads default to On-Demand. The word "interruption-tolerant" in a scenario is almost always a direct pointer to Spot Instances.'
                },
                {
                    question: 'Which AWS tool should a company use to model the projected monthly cost of a new architecture BEFORE deploying any resources?',
                    options: [
                        'AWS Cost Explorer',
                        'AWS Budgets',
                        'AWS Pricing Calculator',
                        'AWS Cost and Usage Report'
                    ],
                    explanation: 'The AWS Pricing Calculator is purpose-built for estimating costs before anything is deployed -- you configure the services, tiers, and expected usage you are planning, and it produces a shareable monthly estimate with no resources created and no bill generated. Crawl: available as a free web tool, the Pricing Calculator lets you model an entire proposed architecture, compare configuration options side by side (for example, On-Demand versus a 1-year Savings Plan for the same workload), and export the estimate for stakeholder review before a single dollar is committed. Walk: this is fundamentally different from the other three tools, which all operate on usage that has already happened. AWS Cost Explorer visualizes and analyzes historical spend, broken down by service, account, Region, or tag -- it has nothing to estimate because the data does not exist until resources are running and billed. AWS Budgets monitors current and forecasted spend against a threshold you set and alerts you as you approach it, which again requires an active account with usage. The AWS Cost and Usage Report (CUR) is the most granular billing export available, delivered to S3 for detailed analysis of costs already incurred. Run: for CLF-C02, the timing keyword is the giveaway -- "estimate," "before deploying," or "plan a budget for a new project" all point to the Pricing Calculator, while "track," "analyze," or "alert on" spend point to Cost Explorer, Budgets, or the CUR respectively.'
                },
                {
                    question: 'Which is the minimum AWS Support plan that includes 24x7 access to Cloud Support Engineers by phone, chat, and email, along with the full set of AWS Trusted Advisor checks?',
                    options: [
                        'Basic',
                        'Developer',
                        'Business',
                        'Enterprise'
                    ],
                    explanation: 'The Business plan is the minimum tier that includes 24x7 phone, chat, and email access to Cloud Support Engineers as well as the complete set of Trusted Advisor checks across all five categories. Crawl: AWS offers five Support plans, and access expands at each tier. Basic is included free with every account and provides documentation, forums, the core (free) set of Trusted Advisor checks, and the AWS Health Dashboard, but no ability to open a technical support case. Developer adds business-hours email access to Cloud Support Associates, intended for testing and early development rather than production. Walk: Business is the first tier built for production workloads -- it unlocks 24x7 phone, chat, and email support, a roughly one-hour response target for a production system that is down, and critically, the full catalog of Trusted Advisor checks (Cost Optimization, Performance, Security, Fault Tolerance, and Service Limits), not just the small free set everyone gets on Basic. Run: Enterprise On-Ramp and Enterprise sit above Business, adding a pool of Technical Account Managers (or a single named TAM on Enterprise) and progressively faster response targets for business-critical outages, but they are not the minimum tier that unlocks 24x7 support and the full Trusted Advisor check set -- Business already provides both. For CLF-C02, know the tier where each capability first appears: technical cases start at Developer, 24x7 phone plus full Trusted Advisor starts at Business, and a dedicated Technical Account Manager starts at Enterprise.'
                }
            ]
        });
        quiz.start();
    </script>
