    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Manage Roles and Access',
            description: 'Test your understanding of built-in admin roles, custom roles, administrative units, Privileged Identity Management, and Conditional Access policies.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch03-quiz',
            moduleId: 'ms102-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which built-in role has full access to all administrative features across every Microsoft 365 service?',
                    options: [
                        'Security Administrator',
                        'User Administrator',
                        'Global Administrator',
                        'Exchange Administrator'
                    ],
                    explanation: 'The Global Administrator role has unrestricted access to all admin features in Microsoft Entra ID and every Microsoft 365 service. Microsoft recommends limiting this role to 2-4 accounts. All other roles are scoped to specific services or functions: Security Administrator manages security features, User Administrator manages users and groups, and Exchange Administrator manages Exchange Online only.'
                },
                {
                    question: 'A company needs an admin who can manage mail flow rules and transport policies but cannot reset user passwords or manage SharePoint sites. Which role should be assigned?',
                    options: [
                        'Global Administrator',
                        'User Administrator',
                        'Exchange Administrator',
                        'Helpdesk Administrator'
                    ],
                    explanation: 'The Exchange Administrator role provides full control of Exchange Online including mailboxes, mail flow rules, connectors, and transport policies. It cannot manage user passwords (that requires User Administrator or Helpdesk Administrator) or SharePoint sites (that requires SharePoint Administrator). This follows the principle of least privilege -- assign the narrowest role that covers the required tasks.'
                },
                {
                    question: 'What is the licensing requirement to create and assign custom roles in Microsoft Entra ID?',
                    options: [
                        'Microsoft 365 E3 -- no Entra ID premium needed',
                        'Microsoft Entra ID P1',
                        'Microsoft Entra ID P2',
                        'Microsoft Entra ID Free'
                    ],
                    explanation: 'Custom roles require Microsoft Entra ID P1 to create and assign. P2 is needed if you want to assign custom roles through Privileged Identity Management (PIM) with eligible activation. Without P1, organizations are limited to the 80+ built-in roles. This is a frequently tested licensing question on the MS-102 exam.'
                },
                {
                    question: 'An organization with offices in the US, UK, and Germany wants to delegate user management so that each regional IT team can only manage users in their own country. What should the administrator configure?',
                    options: [
                        'Three separate Microsoft 365 tenants',
                        'Administrative units with scoped role assignments',
                        'Three Global Administrator accounts',
                        'Custom Conditional Access policies per region'
                    ],
                    explanation: 'Administrative units allow you to scope role assignments (like User Administrator) to a subset of users, groups, or devices. Create an AU for each region (US, UK, Germany), populate it with users from that country (using dynamic membership based on the country attribute), and assign the User Administrator role scoped to that AU. This gives each regional IT team management access only to their own users -- without creating separate tenants or granting overly broad permissions.'
                },
                {
                    question: 'What is the difference between an eligible and an active role assignment in Privileged Identity Management (PIM)?',
                    options: [
                        'Eligible roles are permanent; active roles expire after 24 hours',
                        'Eligible roles require activation before use; active roles are always on',
                        'Eligible roles are free; active roles require P2 licensing',
                        'Eligible roles apply to groups only; active roles apply to users only'
                    ],
                    explanation: 'In PIM, an eligible assignment means the user can activate the role when needed but has zero standing access. An active assignment means the role is always on -- the user has the permissions at all times. PIM shifts organizations from active to eligible assignments to reduce attack surface. When a user needs access, they activate through PIM with MFA, justification, and optional approval. The activation is time-bound (1-24 hours) and fully audited.'
                },
                {
                    question: 'Which Microsoft Entra ID license is required for Privileged Identity Management (PIM)?',
                    options: [
                        'Microsoft Entra ID Free',
                        'Microsoft Entra ID P1',
                        'Microsoft Entra ID P2',
                        'Microsoft 365 Business Basic'
                    ],
                    explanation: 'PIM requires Microsoft Entra ID P2 (included in Entra ID Governance, EMS E5, or Microsoft 365 E5). P1 does not include PIM. Every user with an eligible role assignment needs a P2 license. This is one of the most frequently tested licensing questions on the MS-102 exam -- P1 covers Conditional Access and custom roles, but PIM and Identity Protection require P2.'
                },
                {
                    question: 'A Conditional Access policy is configured to require MFA for all users when accessing Exchange Online from outside the corporate network. Which components represent the "conditions" (the IF side) of this policy?',
                    options: [
                        'MFA requirement and Exchange Online',
                        'All users, Exchange Online, and locations outside corporate network',
                        'All users and MFA requirement',
                        'Exchange Online and MFA requirement'
                    ],
                    explanation: 'Conditions are the signals evaluated at sign-in -- the IF side of the if-then model. In this policy, the conditions are: users (all users), cloud apps (Exchange Online), and locations (outside the corporate network). The MFA requirement is the access control (the THEN side) -- it is what happens when the conditions are met. The exam frequently tests whether candidates can distinguish conditions from controls.'
                },
                {
                    question: 'An organization deploys a new Conditional Access policy. What is the recommended first step before enforcing it?',
                    options: [
                        'Enable the policy in On mode and monitor for 24 hours',
                        'Deploy the policy in Report-Only mode and review sign-in logs',
                        'Apply the policy only to Global Administrators first',
                        'Disable Security Defaults and immediately enable the policy'
                    ],
                    explanation: 'Microsoft recommends deploying new Conditional Access policies in Report-Only mode first. This logs what would happen (which users would be affected, which policies would apply) without actually enforcing the policy. Admins should review the sign-in logs and use the What-If tool to validate expected behavior. Only after confirming the policy works correctly should it be switched to On. Deploying directly to production risks locking out users or blocking legitimate access.'
                },
                {
                    question: 'Which type of accounts should be excluded from ALL Conditional Access policies?',
                    options: [
                        'Service accounts used by applications',
                        'Break-glass (emergency access) accounts',
                        'Guest user accounts from partner organizations',
                        'Accounts assigned the Helpdesk Administrator role'
                    ],
                    explanation: 'Break-glass accounts (emergency access accounts) must be excluded from all Conditional Access policies. These are permanently active Global Admin accounts with long, complex passwords stored in a secure vault. If Conditional Access is misconfigured and locks out all other admins, break-glass accounts provide emergency access to recover the tenant. They should have no MFA requirement, no location restriction, and no device compliance requirement. Monitor sign-ins to these accounts with alerts.'
                },
                {
                    question: 'Conditional Access and Security Defaults cannot both be active at the same time. What happens when an administrator enables Conditional Access?',
                    options: [
                        'Security Defaults is automatically enhanced with the new CA policies',
                        'Security Defaults must be manually disabled before CA policies can be created',
                        'Both can coexist -- CA policies override Security Defaults where they conflict',
                        'Security Defaults is automatically disabled when the first CA policy is enabled'
                    ],
                    explanation: 'Security Defaults must be manually disabled before Conditional Access policies can be created. They cannot coexist because Security Defaults enforces a fixed set of protections (MFA for all admins, block legacy auth) that cannot be customized, while Conditional Access provides granular control. The admin must go to Entra admin center > Properties > Security defaults > Disabled before creating CA policies. This is a frequently tested conflict on the MS-102 exam.'
                },
                {
                    question: 'Which Conditional Access grant control blocks legacy authentication protocols like POP3, IMAP, and SMTP Basic Auth?',
                    options: [
                        'Require MFA',
                        'Require compliant device',
                        'Block access (targeting legacy client app types)',
                        'Require Microsoft Entra joined device'
                    ],
                    explanation: 'To block legacy authentication, create a Conditional Access policy that targets the "Other clients" and "Exchange ActiveSync" client app types with the "Block access" grant control. Legacy protocols (POP3, IMAP, SMTP Basic Auth, older Office clients) cannot support MFA -- requiring MFA would just fail silently. Blocking them entirely is the correct approach. This is one of the most critical security policies and a common MS-102 exam scenario.'
                },
                {
                    question: 'An administrator needs to restrict who can modify members of the "Executive Leadership" administrative unit. Which setting should be enabled?',
                    options: [
                        'Dynamic membership rules',
                        'Restricted management on the administrative unit',
                        'Conditional Access policy targeting the AU',
                        'PIM approval workflow for User Administrator'
                    ],
                    explanation: 'The restricted management flag on an administrative unit prevents tenant-level admins (except Global Admin and Privileged Role Admin) from modifying the members inside that AU. This creates a hard security boundary -- even a User Administrator with tenant-wide scope cannot reset passwords or modify users in a restricted AU. This is the correct approach for sensitive groups like executives whose accounts need extra protection.'
                },
                {
                    question: 'Which PIM activation setting requires a user to provide a reason before their eligible role becomes active?',
                    options: [
                        'Approval workflow',
                        'MFA on activation',
                        'Justification requirement',
                        'Ticket information'
                    ],
                    explanation: 'The justification requirement forces the user to type a text reason explaining why they need the role (e.g., "Investigating security alert SEC-4521"). This is separate from: MFA on activation (re-authentication), approval workflow (another person must authorize), and ticket information (optional link to a change management ticket). Justification creates an audit trail explaining the business need for each activation.'
                },
                {
                    question: 'What is the maximum activation duration for a PIM eligible role?',
                    options: [
                        '1 hour',
                        '8 hours',
                        '24 hours',
                        '72 hours'
                    ],
                    explanation: 'The maximum activation duration for a PIM role is 24 hours. The default is 8 hours. Administrators configure this per role in the PIM role settings. After the activation period expires, the role automatically deactivates and the user loses the elevated permissions. The user must reactivate through PIM if they still need access. This time-bound approach is the core of just-in-time access.'
                },
                {
                    question: 'An organization wants to require a compliant device for Exchange Online access but only MFA for SharePoint Online access. How many Conditional Access policies are needed?',
                    options: [
                        'One policy with two different controls',
                        'Two separate policies -- one per cloud app',
                        'Three policies -- one per control plus one baseline',
                        'This is not possible with Conditional Access'
                    ],
                    explanation: 'Two separate Conditional Access policies are needed because each policy applies a single set of grant controls to the targeted cloud apps. Policy 1: target Exchange Online, require compliant device. Policy 2: target SharePoint Online, require MFA. A single policy cannot apply different controls to different apps. This is a common exam pattern -- whenever different apps need different controls, the answer is separate policies.'
                }
            ]
        });
        quiz.start();
    </script>
