    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: Security and Compliance',
            description: 'Test your understanding of Microsoft Purview compliance -- Compliance Manager, DLP policies, sensitivity labels, retention policies, eDiscovery, audit logging, insider risk management, and communication compliance.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch08-quiz',
            moduleId: 'ms102-ch08-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What does the Compliance Manager compliance score measure?',
                    options: [
                        'The number of DLP policies configured in the tenant',
                        'A risk-based percentage reflecting completed improvement actions across regulatory assessments',
                        'The total number of sensitivity labels applied to documents',
                        'The percentage of users with E5 licenses assigned'
                    ],
                    explanation: 'The compliance score is a risk-based percentage (0-100%) that reflects how many improvement actions have been completed across your active regulatory assessments. Points are earned by implementing controls -- both Microsoft-managed (infrastructure) and tenant-managed (admin-configured). Higher-impact preventive actions earn more points than lower-impact corrective actions. The score is not based on license counts, label usage, or policy counts.'
                },
                {
                    question: 'A DLP policy is configured with a condition that detects U.S. Social Security Numbers at high confidence. What does "high confidence" mean in this context?',
                    options: [
                        'The policy blocks content regardless of how many SSNs are found',
                        'The pattern, supporting keywords, and checksum must all match before the rule triggers',
                        'The policy only applies to content labeled "Highly Confidential"',
                        'The policy sends alerts but never blocks content'
                    ],
                    explanation: 'High confidence for a sensitive information type means all detection components must match: the regex pattern (###-##-####), supporting keywords within proximity (e.g., "SSN", "Social Security"), and the checksum validation (Luhn algorithm where applicable). This combination minimizes false positives. Low confidence matches on pattern alone, medium adds keyword proximity, and high requires all components including checksum. Confidence level is independent of sensitivity labels and enforcement actions.'
                },
                {
                    question: 'Which DLP policy locations can you configure for a single policy?',
                    options: [
                        'Exchange Online only -- separate policies are required for each additional location',
                        'Exchange, SharePoint, OneDrive, Teams, Windows endpoints, on-premises repositories, and Power BI',
                        'Only Microsoft 365 cloud services -- on-premises content cannot be scanned',
                        'Exchange and SharePoint only -- Teams requires a separate compliance solution'
                    ],
                    explanation: 'A single DLP policy can target multiple locations simultaneously: Exchange Online (email), SharePoint Online (sites), OneDrive for Business (accounts), Teams (chat and channel messages), Windows 10/11 endpoints (file operations), on-premises repositories (via scanner), and Power BI. Each location within the policy can include or exclude specific users, groups, or sites. Teams DLP and endpoint DLP require E5 or add-on licensing.'
                },
                {
                    question: 'What happens when a sensitivity label with encryption is applied to a document and that document is emailed to an external recipient?',
                    options: [
                        'The encryption is automatically removed when the document leaves the tenant',
                        'The document remains encrypted -- only authorized users defined in the label can open it',
                        'The document is blocked from being sent by default',
                        'The recipient can open the document but cannot see the sensitivity label'
                    ],
                    explanation: 'Sensitivity labels and their protections are persistent -- they travel with the document. If the label applies Azure Rights Management encryption, only users listed in the encryption permissions can open the document, regardless of where the file is stored or how it was shared. The encryption is not removed when leaving the tenant. Sending is not blocked by the label itself (a DLP policy would be needed for that). The label metadata is embedded in the file.'
                },
                {
                    question: 'A sensitivity label policy requires justification when downgrading. A user changes a document from "Confidential" to "General." What happens?',
                    options: [
                        'The change is blocked -- users cannot downgrade labels',
                        'The user must provide a text justification before the downgrade is accepted',
                        'The label is changed silently with no additional prompts',
                        'An admin must approve the downgrade before it takes effect'
                    ],
                    explanation: 'When a label policy is configured to require justification on downgrade or removal, the user is prompted to enter a text justification explaining why the label is being lowered. The downgrade is permitted after the user submits the justification. The event (including the justification text) is logged in Activity Explorer. Users can always upgrade labels freely. The downgrade does not require admin approval -- it requires user-provided justification that is auditable.'
                },
                {
                    question: 'How does service-side auto-labeling differ from client-side auto-labeling?',
                    options: [
                        'Service-side runs in Office desktop apps; client-side runs in the cloud',
                        'Service-side scans content at rest in SharePoint/OneDrive/Exchange and requires E5; client-side recommends labels in Office apps and works with E3',
                        'Both require E5 and function identically',
                        'Client-side auto-labeling only works with custom sensitive information types'
                    ],
                    explanation: 'Client-side auto-labeling runs in Office apps (Word, Excel, Outlook) and recommends or auto-applies labels as the user works with the document. It is included with E3 + Azure Information Protection P1. Service-side auto-labeling scans content already stored in SharePoint, OneDrive, and Exchange and applies labels without user interaction. Service-side requires E5 or the Information Protection add-on. This licensing distinction is a frequent exam topic.'
                },
                {
                    question: 'A retention policy says "retain for 7 years" and a user deletes a file from SharePoint. What happens?',
                    options: [
                        'The file is permanently deleted -- user actions override retention policies',
                        'The file moves to the Preservation Hold Library where it is retained for 7 years',
                        'The file moves to the site recycle bin and is permanently deleted after 93 days',
                        'The retention policy is automatically updated to exclude the deleted file'
                    ],
                    explanation: 'When a retention policy applies to SharePoint content, a copy of the file is preserved in the Preservation Hold Library (a hidden document library in the site) when the user deletes or modifies it. The file appears deleted to the user, but the preserved copy cannot be permanently removed until the retention period expires. In Exchange, retained content goes to the Recoverable Items folder. Retention always overrides user deletion -- this is the core principle of retention policies.'
                },
                {
                    question: 'What is the key difference between eDiscovery (Standard) and eDiscovery (Premium)?',
                    options: [
                        'Standard supports holds; Premium does not',
                        'Premium adds custodian management, review sets with AI analytics, and legal hold notifications',
                        'Standard is for Exchange only; Premium adds SharePoint',
                        'Standard requires E5; Premium requires E3'
                    ],
                    explanation: 'eDiscovery (Standard), included with E3, provides cases, holds, content searches, and export. eDiscovery (Premium), requiring E5 or add-on, adds custodian management (mapping data sources to people), legal hold notifications (automated notices with acknowledgment tracking), review sets with AI-powered analytics (near-duplicate detection, email threading, relevance scoring), advanced indexing for large items, and Teams conversation reconstruction. Both support holds on Exchange, SharePoint, and OneDrive.'
                },
                {
                    question: 'An eDiscovery manager creates a case and assigns themselves as a member. Can they access cases created by other eDiscovery managers?',
                    options: [
                        'Yes -- all eDiscovery managers can access all cases',
                        'No -- eDiscovery Managers can only access their own cases. eDiscovery Administrators can access all cases',
                        'Yes, but only in read-only mode',
                        'No -- only Global Administrators can access other managers\' cases'
                    ],
                    explanation: 'The eDiscovery Manager role provides access only to cases where the user is a member. The eDiscovery Administrator role can view and manage all cases in the organization, regardless of membership. This is by design to maintain case confidentiality -- an HR investigation case should not be visible to an eDiscovery Manager handling a separate matter. Global Admin alone does not grant eDiscovery access; the role must be explicitly assigned in the compliance portal.'
                },
                {
                    question: 'What is the default audit log retention period for Microsoft 365 E3, and what does E5 extend it to?',
                    options: [
                        'E3: 90 days, E5: 180 days',
                        'E3: 180 days, E5: 1 year (configurable up to 10 years with add-on)',
                        'E3: 30 days, E5: 90 days',
                        'E3: 1 year, E5: 5 years'
                    ],
                    explanation: 'Audit (Standard), included with E3, retains audit records for 180 days. Audit (Premium), included with E5, extends the default retention to 1 year. With the 10-Year Audit Log Retention add-on, organizations can retain records for up to 10 years. Custom audit log retention policies can also be created to retain specific activity types for different durations. Premium also adds high-value events like MailItemsAccessed and SearchQueryInitiated.'
                },
                {
                    question: 'Which Audit (Premium) event is critical for determining which emails an attacker read after compromising a mailbox?',
                    options: [
                        'FileAccessed',
                        'UserLoggedIn',
                        'MailItemsAccessed',
                        'SearchQueryInitiatedExchange'
                    ],
                    explanation: 'MailItemsAccessed is an Audit (Premium) event that logs every time a mail item is accessed (read) via any protocol (Outlook, OWA, IMAP, Graph API). This is critical for breach forensics -- after a mailbox compromise, security teams use MailItemsAccessed to determine exactly which emails the attacker viewed. This event is not available in Audit (Standard). SearchQueryInitiatedExchange logs search queries run by users. FileAccessed applies to SharePoint/OneDrive. UserLoggedIn logs sign-in events.'
                },
                {
                    question: 'In insider risk management, what is a "triggering event"?',
                    options: [
                        'Any DLP policy match that generates an alert',
                        'An event that brings a user into scope for monitoring, such as a resignation notice from the HR connector',
                        'The moment an insider risk alert is created',
                        'A manual flag placed on a user by a compliance officer'
                    ],
                    explanation: 'A triggering event activates insider risk monitoring for a specific user. Common triggering events include: HR connector signals (resignation submitted, termination date set), DLP policy matches, and user additions to priority user groups. Without a triggering event, most policy templates do not monitor the user (the exception is general data leak policies which can monitor all users). Once triggered, the system evaluates indicators (file downloads, email to external, USB copy) to build a risk score.'
                },
                {
                    question: 'Why are user identities pseudonymized by default in insider risk management alerts?',
                    options: [
                        'To reduce the number of alerts shown in the dashboard',
                        'To protect user privacy during initial triage and comply with data protection regulations',
                        'Because the system cannot identify users until the investigation is complete',
                        'To prevent compliance officers from investigating their own activity'
                    ],
                    explanation: 'Insider risk management pseudonymizes user identities (showing "User-1", "User-2" instead of real names) by default to protect user privacy during the initial triage phase. This aligns with data protection regulations like GDPR that require minimizing personal data exposure. Analysts with the Insider Risk Management Investigator role can de-anonymize identities when an investigation is warranted. The system always knows the real identity -- pseudonymization is a privacy control for the UI, not a technical limitation.'
                },
                {
                    question: 'Which communication compliance detection capability goes beyond simple keyword matching?',
                    options: [
                        'Regex pattern matching',
                        'Machine learning classifiers that detect harassing language, threats, and discriminatory content',
                        'Exact data match (EDM) scanning',
                        'Document fingerprinting'
                    ],
                    explanation: 'Communication compliance uses machine learning classifiers to detect inappropriate text including harassment, threats, profanity, and discriminatory language -- even when the content does not match explicit keyword lists. Pre-trained classifiers understand language context and tone, not just specific words. This is more effective than keyword-based detection because it catches paraphrased or coded language. Regex, EDM, and fingerprinting are DLP detection methods, not communication compliance features.'
                },
                {
                    question: 'A retention label marks a document as a "regulatory record." What restriction does this impose beyond a standard record?',
                    options: [
                        'The document can only be accessed by Global Administrators',
                        'The document is encrypted with Azure Rights Management',
                        'The retention label cannot be removed, even by administrators',
                        'The document is automatically exported to an external archive'
                    ],
                    explanation: 'A regulatory record is the most restrictive retention label option. Like a standard record, it prevents editing the document. But unlike a standard record, the regulatory record label itself cannot be removed or shortened by anyone -- including administrators and compliance officers. This is designed for financial regulations and legal requirements where immutability must be absolute. Standard records allow admins to unlock content or change the retention period if needed. Neither type encrypts content or restricts admin read access.'
                }
            ]
        });
        quiz.start();
    </script>
