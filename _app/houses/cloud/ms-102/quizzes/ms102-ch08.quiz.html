<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-102 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: Implement Microsoft Purview Data Governance',
            description: 'Test your knowledge of Microsoft Purview, DLP policies, sensitivity labels, retention policies, eDiscovery, and data lifecycle management.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch08-quiz',
            moduleId: 'ms102-ch08-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,
            questions: [
                {
                    question: 'What is the primary purpose of a Data Loss Prevention (DLP) policy in Microsoft Purview?',
                    options: [
                        'To encrypt all data at rest in SharePoint',
                        'To detect and prevent sharing of sensitive information based on defined conditions',
                        'To back up Microsoft 365 data to Azure Blob Storage',
                        'To monitor user login activity for anomalies'
                    ],
                    explanation: 'DLP policies detect sensitive information (credit card numbers, SSNs, health records, custom patterns) in Exchange, SharePoint, OneDrive, Teams, and endpoints. When sensitive content matches policy conditions, DLP can block sharing, display a policy tip to the user, notify admins, or generate incident reports. DLP does not encrypt data -- that is the role of sensitivity labels.'
                },
                {
                    question: 'Which component of a DLP policy defines the pattern of sensitive data to detect?',
                    options: [
                        'Sensitivity label',
                        'Sensitive information type (SIT)',
                        'Retention label',
                        'eDiscovery search query'
                    ],
                    explanation: 'Sensitive information types (SITs) define the patterns that DLP uses to detect sensitive data. Built-in SITs cover common patterns (credit cards, SSNs, passport numbers). Custom SITs can be created using regular expressions, keyword dictionaries, or exact data match (EDM). DLP rules reference one or more SITs with confidence levels and instance counts.'
                },
                {
                    question: 'What is the difference between a sensitivity label and a retention label in Microsoft Purview?',
                    options: [
                        'Sensitivity labels protect content; retention labels govern content lifecycle',
                        'Retention labels encrypt content; sensitivity labels delete content',
                        'They are the same feature with different names',
                        'Sensitivity labels apply to email; retention labels apply to files'
                    ],
                    explanation: 'Sensitivity labels protect content through encryption, visual markings (headers, footers, watermarks), and access restrictions. They travel with the document wherever it goes. Retention labels govern content lifecycle by specifying how long to retain content and what happens after (delete, start disposition review). Both can be applied to the same content simultaneously.'
                },
                {
                    question: 'An organization needs to automatically encrypt all documents labeled "Confidential" so only internal users can open them. Which feature achieves this?',
                    options: [
                        'DLP policy with block action',
                        'Sensitivity label with encryption and access control configured',
                        'Retention policy with delete action',
                        'eDiscovery hold'
                    ],
                    explanation: 'A sensitivity label with encryption enabled can restrict access to specific users or groups. Setting the encryption to "Only people in your organization" ensures only internal users can open the document regardless of where it is shared. The encryption travels with the file -- even if downloaded or forwarded, unauthorized users cannot open it.'
                },
                {
                    question: 'What is the purpose of a retention policy in Microsoft Purview?',
                    options: [
                        'To encrypt sensitive documents in SharePoint',
                        'To retain content for a specified period and optionally delete it after that period',
                        'To block external sharing of sensitive data',
                        'To assign permissions to documents'
                    ],
                    explanation: 'Retention policies ensure content is kept for compliance or regulatory requirements (e.g., retain email for 7 years) and optionally deleted after the retention period expires. Retention can be applied to entire workloads (all Exchange mailboxes) or specific locations. Content under retention cannot be permanently deleted by users, ensuring regulatory compliance.'
                },
                {
                    question: 'When both a retention policy and a user delete action conflict, which takes precedence?',
                    options: [
                        'The user delete action always wins',
                        'Retention always wins -- content is preserved even if the user deletes it',
                        'Whichever was configured first takes precedence',
                        'The admin must manually resolve the conflict'
                    ],
                    explanation: 'Retention always takes precedence over user deletion. If a retention policy requires content to be kept for 7 years and a user deletes the email, the content moves to a hidden recoverable items folder (for Exchange) or preservation hold library (for SharePoint) where it is preserved until the retention period expires. Users cannot permanently delete retained content.'
                },
                {
                    question: 'What is Microsoft Purview eDiscovery used for?',
                    options: [
                        'Encrypting data in transit between Microsoft data centers',
                        'Searching, preserving, and exporting electronic content for legal or compliance investigations',
                        'Monitoring real-time network traffic for threats',
                        'Managing Microsoft 365 license assignments'
                    ],
                    explanation: 'eDiscovery enables legal and compliance teams to search across Exchange, SharePoint, OneDrive, and Teams for content relevant to investigations or litigation. Content can be placed on hold (preserving it from deletion), searched with KQL queries, reviewed for relevance, and exported for external legal review. Standard eDiscovery is included in E3; Premium eDiscovery adds AI and review sets.'
                },
                {
                    question: 'What happens when you place an eDiscovery hold on a user mailbox?',
                    options: [
                        'The user can no longer send or receive email',
                        'All content is preserved in place; deleted or modified items are kept in a hidden folder',
                        'The mailbox is exported to a PST file',
                        'The user is notified that their mailbox is under investigation'
                    ],
                    explanation: 'An eDiscovery hold preserves all mailbox content in place. If the user deletes or modifies items, the original content is silently preserved in the Recoverable Items folder (SubstrateHolds subfolder). The user can continue using their mailbox normally and is not notified. This ensures evidence integrity for legal proceedings. The hold remains until explicitly removed by an eDiscovery manager.'
                },
                {
                    question: 'Which sensitivity label feature adds visual text to the top and bottom of documents?',
                    options: [
                        'Encryption',
                        'Content marking (headers and footers)',
                        'Auto-labeling',
                        'Label scope'
                    ],
                    explanation: 'Content marking adds visual indicators to documents: headers (text at the top), footers (text at the bottom), and watermarks (text overlaid on the document body). These markings are configured per label and applied when the label is assigned. They serve as visual reminders of the document classification. Content marking is independent of encryption -- a label can have markings without encryption or both.'
                },
                {
                    question: 'An organization needs to automatically apply a "Highly Confidential" sensitivity label to all documents containing more than 5 credit card numbers. Which feature should they use?',
                    options: [
                        'Manual labeling by users',
                        'Auto-labeling policy using sensitive information types',
                        'Default label in the label policy',
                        'eDiscovery content search'
                    ],
                    explanation: 'Auto-labeling policies automatically apply sensitivity labels to content based on conditions like sensitive information type matches. The policy can detect content containing credit card numbers (using the built-in SIT) with a count threshold (more than 5 instances) and automatically apply the specified label. Auto-labeling works on content at rest in SharePoint/OneDrive and in transit in Exchange.'
                },
                {
                    question: 'What is the role of a label policy in the Microsoft Purview sensitivity label framework?',
                    options: [
                        'It defines the encryption algorithm used by labels',
                        'It publishes labels to users and configures default labels, justification requirements, and mandatory labeling',
                        'It creates the labels themselves',
                        'It monitors label usage across the organization'
                    ],
                    explanation: 'Label policies publish sensitivity labels to specific users or groups, making them available in Office apps. Policy settings include: default label (applied automatically to new documents), mandatory labeling (users must apply a label before saving), justification (users must explain when downgrading a label), and label order. Labels are created separately; policies control their deployment.'
                },
                {
                    question: 'Which Microsoft Purview feature uses AI to identify and classify sensitive content that traditional pattern matching might miss?',
                    options: [
                        'Exact data match (EDM)',
                        'Trainable classifiers',
                        'Keyword dictionaries',
                        'Regular expressions'
                    ],
                    explanation: 'Trainable classifiers use machine learning to identify content categories that are difficult to define with patterns or keywords (e.g., resumes, source code, harassment, threats, tax forms). Pre-trained classifiers are available out of the box. Custom trainable classifiers can be trained with sample content specific to your organization. They can be used in DLP policies, retention labels, and auto-labeling.'
                },
                {
                    question: 'A retention policy is set to "Retain for 5 years, then delete." When does the 5-year retention period start for an Exchange email?',
                    options: [
                        'When the retention policy is created',
                        'When the email is sent or received',
                        'When the email is read by the recipient',
                        'When the admin manually triggers retention'
                    ],
                    explanation: 'For Exchange email, the retention period starts when the item is sent or received (the item creation date). For SharePoint and OneDrive, it starts when the item was last modified, unless configured otherwise. Retention periods are based on content dates, not policy creation dates. This means email received before the policy was created is still subject to retention based on its original date.'
                },
                {
                    question: 'What is the purpose of a disposition review in Microsoft Purview retention?',
                    options: [
                        'To automatically delete all content when retention expires',
                        'To require a reviewer to approve or extend retention before content is permanently deleted',
                        'To export content for backup before deletion',
                        'To notify end users that their content will be deleted'
                    ],
                    explanation: 'Disposition review creates a manual approval step at the end of the retention period. Instead of automatic deletion, designated reviewers receive a notification to review the content and decide: approve disposal (permanently delete), extend retention, or apply a different label. This is used for high-value records where automatic deletion is too risky. Only retention labels (not policies) support disposition review.'
                },
                {
                    question: 'Which DLP policy action displays a warning to the user in real time while they are working in an Office application?',
                    options: [
                        'Block the content',
                        'Display a policy tip',
                        'Send an incident report to the admin',
                        'Apply a sensitivity label'
                    ],
                    explanation: 'Policy tips display a real-time notification in the Office application (Outlook, Word, Excel, SharePoint) when the user creates or shares content that matches a DLP rule. The tip explains which policy was triggered and may offer the user an option to override with a business justification. Policy tips educate users about data handling requirements at the point of action, reducing violations through awareness.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
