    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Microsoft Entra ID and Authentication',
            description: 'Test your understanding of Entra Connect, SSPR, MFA, passwordless authentication, and Identity Protection.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch04-quiz',
            moduleId: 'ms102-ch04-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which Entra Connect authentication method synchronizes a hash of the on-premises password hash to Microsoft Entra ID?',
                    options: [
                        'Pass-through Authentication (PTA)',
                        'Password Hash Synchronization (PHS)',
                        'Federation with AD FS',
                        'Certificate-based authentication'
                    ],
                    explanation: 'Password Hash Synchronization (PHS) sends a hash of the hash of on-premises passwords to Microsoft Entra ID. The actual password never leaves the on-premises environment. PHS enables cloud-based authentication even if on-premises infrastructure is unavailable, and it is required for Identity Protection leaked credential detection. PTA validates passwords against on-premises AD in real time. Federation redirects authentication to AD FS servers.'
                },
                {
                    question: 'What is the primary advantage of Pass-through Authentication (PTA) over Password Hash Synchronization?',
                    options: [
                        'PTA works when on-premises servers are offline',
                        'PTA ensures passwords are never stored in the cloud in any form',
                        'PTA supports leaked credential detection',
                        'PTA requires fewer on-premises servers'
                    ],
                    explanation: 'PTA validates user credentials directly against on-premises Active Directory in real time. No form of the password (neither the password itself nor its hash) is ever stored in Microsoft Entra ID. This satisfies regulatory requirements where password data must remain on-premises. The tradeoff is that PTA requires on-premises PTA agents to be running -- if all agents are offline, authentication fails. PHS stores a hash of the hash in the cloud but works when on-premises infrastructure is down.'
                },
                {
                    question: 'Which Entra Connect Health component monitors the synchronization service between on-premises AD and Microsoft Entra ID?',
                    options: [
                        'Health agent for AD FS',
                        'Health agent for AD DS',
                        'Health agent for Sync',
                        'Health agent for Exchange'
                    ],
                    explanation: 'Entra Connect Health deploys three types of agents: Sync (monitors the Entra Connect sync engine), AD FS (monitors federation servers), and AD DS (monitors domain controllers). The Sync agent tracks export/import errors, sync cycle duration, password sync status, and connector space object counts. It sends alerts to the Entra portal when sync fails or errors exceed thresholds. There is no Exchange-specific health agent in Connect Health.'
                },
                {
                    question: 'An organization requires that users provide two verification methods when resetting their password via SSPR. Which configuration achieves this?',
                    options: [
                        'Set "Number of methods required to reset" to 2',
                        'Enable both email and phone as the only available methods',
                        'Require MFA for all password reset attempts',
                        'Set the SSPR lockout threshold to 2'
                    ],
                    explanation: 'The SSPR configuration includes a "Number of methods required to reset" setting. When set to 2, users must verify their identity with two separate methods (e.g., mobile phone + email, or authenticator app + office phone) before the password reset completes. This is independent of how many methods are available for registration. The lockout threshold controls how many failed attempts trigger a lockout, not the number of required verification methods.'
                },
                {
                    question: 'Which SSPR feature allows cloud password resets to update the on-premises Active Directory password?',
                    options: [
                        'Password synchronization',
                        'Password writeback',
                        'Password hash sync',
                        'Self-service password unlock'
                    ],
                    explanation: 'Password writeback is an Entra Connect feature that writes password changes made in Microsoft Entra ID (via SSPR or admin reset) back to on-premises Active Directory. This requires Entra Connect with the password writeback option enabled and Microsoft Entra ID P1 or P2 licensing. Without writeback, cloud password resets only affect the cloud account, and the on-premises password remains unchanged -- causing a password mismatch for hybrid users.'
                },
                {
                    question: 'What is the Microsoft-recommended approach for enforcing MFA across an organization instead of per-user MFA?',
                    options: [
                        'Security defaults',
                        'Per-user MFA in the legacy portal',
                        'Conditional Access policies',
                        'NPS extension'
                    ],
                    explanation: 'Conditional Access policies are the recommended method for enforcing MFA because they provide granular control: you can target specific users, groups, applications, locations, device states, and risk levels. Per-user MFA is a legacy approach that applies MFA to every sign-in for selected users with no conditional logic. Security defaults enable baseline MFA but lack granularity. The NPS extension adds MFA to RADIUS-based authentication (VPN, RDP) but is not a standalone MFA enforcement method.'
                },
                {
                    question: 'Which MFA component extends multi-factor authentication to on-premises RADIUS-based services like VPN?',
                    options: [
                        'Conditional Access',
                        'Microsoft Authenticator app',
                        'NPS extension for Microsoft Entra MFA',
                        'FIDO2 security keys'
                    ],
                    explanation: 'The NPS (Network Policy Server) extension installs on a Windows Server running the NPS role and intercepts RADIUS authentication requests. It adds a secondary Microsoft Entra MFA prompt to existing RADIUS flows (VPN, Remote Desktop Gateway, 802.1X wireless). This allows organizations to add cloud MFA to on-premises infrastructure without replacing their VPN or network equipment. Conditional Access does not integrate with RADIUS directly.'
                },
                {
                    question: 'Which passwordless authentication method uses a physical USB or NFC device based on the FIDO2 standard?',
                    options: [
                        'Windows Hello for Business',
                        'Microsoft Authenticator phone sign-in',
                        'FIDO2 security keys',
                        'Certificate-based authentication'
                    ],
                    explanation: 'FIDO2 security keys are physical devices (USB, NFC, or Bluetooth) that store cryptographic credentials and authenticate without passwords. Users touch or tap the key to verify their identity. FIDO2 keys are phishing-resistant because the credential is bound to the specific origin (URL) -- a fake login page cannot intercept it. Windows Hello for Business uses biometrics or PIN tied to the device TPM. Authenticator phone sign-in uses number matching on the phone.'
                },
                {
                    question: 'In Microsoft Entra Identity Protection, what does a "user risk" policy evaluate?',
                    options: [
                        'Whether the current sign-in attempt is suspicious',
                        'Whether the user account has been compromised based on accumulated signals',
                        'Whether the user has registered for MFA',
                        'Whether the user password meets complexity requirements'
                    ],
                    explanation: 'User risk represents the probability that a user account has been compromised. It is calculated from accumulated signals over time: leaked credentials found on the dark web, impossible travel patterns, sign-ins from malware-linked IP addresses, and other threat intelligence. User risk persists until remediated (password change or admin dismissal). Sign-in risk evaluates a single sign-in attempt in real time. The two risk types are independent and have separate policies.'
                },
                {
                    question: 'Which Identity Protection remediation action is automatically triggered when a user risk policy requires a password change?',
                    options: [
                        'The user account is disabled',
                        'The user is prompted to change their password via SSPR at next sign-in',
                        'An admin must manually reset the password',
                        'The user is blocked from all sign-ins permanently'
                    ],
                    explanation: 'When a user risk policy is configured to require a password change, Identity Protection forces the user to complete SSPR at their next sign-in. This requires SSPR to be enabled for the user. After a successful password change, the user risk is automatically cleared. If SSPR is not enabled, the user is blocked and an admin must intervene. Admin dismissal is a manual action, not an automatic remediation. Account disabling is a separate admin action.'
                },
                {
                    question: 'Which Entra Connect feature allows users to access on-premises and cloud resources with a single sign-in without being prompted again?',
                    options: [
                        'Password writeback',
                        'Seamless Single Sign-On (Seamless SSO)',
                        'Device writeback',
                        'Group writeback'
                    ],
                    explanation: 'Seamless SSO works with PHS or PTA to automatically sign users in when they are on domain-joined corporate devices. It uses a Kerberos ticket from the on-premises AD to authenticate to Microsoft Entra ID without prompting for credentials. Seamless SSO requires the device to be domain-joined and on the corporate network. Password writeback handles cloud-to-on-premises password sync. Device writeback and group writeback sync objects but do not handle sign-in experience.'
                },
                {
                    question: 'What is the key advantage of Windows Hello for Business over a traditional password?',
                    options: [
                        'It can be used from any device without registration',
                        'It uses biometrics or PIN tied to the device TPM, making it phishing-resistant',
                        'It requires no additional infrastructure beyond Active Directory',
                        'It eliminates the need for Microsoft Entra ID licensing'
                    ],
                    explanation: 'Windows Hello for Business replaces passwords with strong two-factor authentication: the device itself (private key stored in the TPM) plus a biometric or PIN. Credentials never leave the device and cannot be replayed on another device. Unlike passwords, WHfB credentials are bound to the specific device and are resistant to phishing, replay, and credential stuffing attacks. WHfB requires infrastructure setup (key trust or certificate trust) and works only on registered/joined devices.'
                }
            ]
        });
        quiz.start();
    </script>
