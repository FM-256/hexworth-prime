    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: Manage Exchange Online',
            description: 'Test your understanding of mailbox types, mail flow rules, connectors, anti-spam/anti-malware policies, quarantine, public folders, and migration methods.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch05-quiz',
            moduleId: 'ms102-ch05-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which Exchange Online mailbox type does NOT require a Microsoft 365 license?',
                    options: [
                        'User mailbox',
                        'Shared mailbox (under 50 GB)',
                        'Archive mailbox',
                        'Discovery mailbox'
                    ],
                    explanation: 'Shared mailboxes do not require a license as long as they remain under 50 GB. They are accessed by delegates (Full Access, Send As, Send on Behalf) and cannot be signed into directly. If a shared mailbox exceeds 50 GB, needs an archive, or requires litigation hold, a license must be assigned. User mailboxes always require a license. Archive mailboxes require Exchange Online Plan 2 or an add-on.'
                },
                {
                    question: 'A user converts a shared mailbox to a user mailbox. What must happen immediately?',
                    options: [
                        'The mailbox data is migrated to a new database',
                        'A Microsoft 365 license must be assigned to the mailbox',
                        'All delegate permissions are automatically removed',
                        'The mailbox is placed on litigation hold'
                    ],
                    explanation: 'Converting a shared mailbox to a user mailbox changes the RecipientTypeDetails property. A user mailbox requires a license -- without one, the mailbox will be disabled after a grace period. The conversion does not migrate data, remove permissions, or enable litigation hold. The reverse (user to shared) releases the license. This conversion scenario is frequently tested on the MS-102 exam.'
                },
                {
                    question: 'In a mail flow rule, what happens when a message matches a condition but also matches an exception?',
                    options: [
                        'The rule action is applied anyway',
                        'The exception takes priority and the rule is skipped',
                        'The message is quarantined for admin review',
                        'Both the action and exception are logged but neither is applied'
                    ],
                    explanation: 'Exceptions override conditions. If a message matches both a condition and an exception in the same rule, the rule is skipped entirely for that message -- the action is not applied. This is by design: exceptions provide a way to exclude specific senders, recipients, or message properties from a broadly applied rule. For example, a disclaimer rule for all external mail can except the Legal department.'
                },
                {
                    question: 'Which connector type validates inbound mail from an on-premises Exchange server using the sending server TLS certificate?',
                    options: [
                        'Outbound partner connector',
                        'Inbound partner connector',
                        'Inbound on-premises connector',
                        'Outbound on-premises connector'
                    ],
                    explanation: 'An inbound on-premises connector accepts mail from your on-premises Exchange servers. It validates the sender by TLS certificate (subject name or subject alternative name matching your on-premises certificate) or by source IP address. This ensures only your legitimate on-premises servers can route mail into Exchange Online as an internal sender. Partner connectors are for external partner organizations, not on-premises infrastructure.'
                },
                {
                    question: 'What does the Spam Confidence Level (SCL) represent in Exchange Online Protection?',
                    options: [
                        'The priority level assigned to a mail flow rule',
                        'A numerical score indicating the likelihood a message is spam',
                        'The number of spam messages sent by a user',
                        'The confidence level of the sender SPF record'
                    ],
                    explanation: 'The SCL is a score from 0 to 9 assigned by EOP to each inbound message based on content analysis, sender reputation, and other signals. Higher scores indicate higher spam probability. SCL 5-6 triggers the spam action (typically move to Junk). SCL 7-9 triggers the high-confidence spam action (typically quarantine). SCL -1 means the message is from a safe sender or allowed list and bypasses spam filtering.'
                },
                {
                    question: 'Which anti-spam policy layer operates by evaluating the sending server IP address before message content is analyzed?',
                    options: [
                        'Inbound anti-spam policy',
                        'Outbound anti-spam policy',
                        'Connection filter policy',
                        'Anti-malware policy'
                    ],
                    explanation: 'The connection filter is the first layer of EOP processing. It evaluates the connecting server IP address against the IP Allow List and IP Block List before any content analysis occurs. Messages from allowed IPs skip spam filtering. Messages from blocked IPs are rejected at the SMTP connection level. This is the most efficient filtering layer because it operates before message content is downloaded.'
                },
                {
                    question: 'What is Zero-hour Auto Purge (ZAP) in Exchange Online Protection?',
                    options: [
                        'A policy that deletes messages older than zero days',
                        'A feature that retroactively removes delivered messages identified as malicious after delivery',
                        'A timer that auto-releases quarantined messages after zero hours',
                        'A policy that blocks all messages during a zero-day attack'
                    ],
                    explanation: 'Zero-hour Auto Purge (ZAP) retroactively removes messages from user mailboxes after they have been delivered, when updated threat intelligence identifies them as spam, phishing, or malware. ZAP works on messages delivered to the Inbox or Junk folder within the last 48 hours. It moves spam to Junk, quarantines phishing, and removes malware. ZAP closes the window between delivery and detection of new threats.'
                },
                {
                    question: 'Which quarantine policy allows end users to view and release their own quarantined messages?',
                    options: [
                        'AdminOnlyAccessPolicy',
                        'DefaultFullAccessPolicy',
                        'NoAccessPolicy',
                        'LimitedAccessPolicy'
                    ],
                    explanation: 'DefaultFullAccessPolicy gives end users full control over their quarantined messages: view, release, delete, and report false positives. AdminOnlyAccessPolicy restricts all actions to administrators only (used for malware quarantine by default). LimitedAccessPolicy allows users to view and request release but not release directly. The quarantine policy is assigned per protection feature (spam, phishing, malware) in the corresponding filter policy.'
                },
                {
                    question: 'Which migration method moves ALL on-premises mailboxes to Exchange Online in a single batch and is recommended for fewer than 150 mailboxes?',
                    options: [
                        'Staged migration',
                        'Hybrid migration',
                        'Cutover migration',
                        'IMAP migration'
                    ],
                    explanation: 'Cutover migration moves all mailboxes, contacts, and distribution groups in one batch. It is designed for small organizations with fewer than 150 mailboxes running Exchange 2003 or later. All objects migrate together over a weekend or maintenance window. After migration, the MX record is updated to point to Exchange Online. Cutover does not support selective migration or long-term coexistence -- it is all-or-nothing.'
                },
                {
                    question: 'Which migration method requires the Hybrid Configuration Wizard and supports bidirectional mailbox moves between on-premises and Exchange Online?',
                    options: [
                        'Cutover migration',
                        'Staged migration',
                        'Hybrid migration',
                        'PST import'
                    ],
                    explanation: 'Hybrid migration provides full coexistence between on-premises Exchange (2010 or later) and Exchange Online. The Hybrid Configuration Wizard (HCW) automates connector setup, OAuth configuration, and shared namespace. Hybrid supports onboarding (on-prem to cloud) and offboarding (cloud to on-prem) move requests. Users retain their email address and Outlook profile. It is the only method that supports long-term or permanent coexistence.'
                },
                {
                    question: 'In Exchange Online, what is the purpose of an accepted domain configured as "Internal Relay"?',
                    options: [
                        'Exchange Online is the sole mail system and all recipients must exist in the directory',
                        'Exchange Online accepts mail for the domain but forwards messages for unknown recipients to on-premises servers',
                        'Exchange Online relays all mail to an external third-party mail system',
                        'The domain is used only for outbound mail, not inbound'
                    ],
                    explanation: 'An Internal Relay accepted domain means Exchange Online accepts inbound mail for the domain but does not require all recipients to exist in the cloud directory. If a recipient is not found in Exchange Online, the message is forwarded to the on-premises mail system via the outbound on-premises connector. This is common during hybrid migrations where some mailboxes remain on-premises. Authoritative means all recipients must exist in Exchange Online.'
                },
                {
                    question: 'Which Exchange Online feature allows you to track the delivery path of a specific message through the transport pipeline?',
                    options: [
                        'Mail flow rules',
                        'Message trace',
                        'Compliance search',
                        'Audit log'
                    ],
                    explanation: 'Message trace tracks an individual message through every hop in the Exchange Online transport pipeline: received, processed by transport rules, scanned by EOP, delivered, quarantined, expanded (distribution list), or failed. Filter by sender, recipient, date range, subject, or message ID. Results are available for up to 90 days (10 days in the quick trace, up to 90 days for downloadable reports). Essential for troubleshooting delivery issues.'
                },
                {
                    question: 'What is the purpose of an accepted domain in Exchange Online?',
                    options: [
                        'It defines which users can log in to the admin center',
                        'It specifies a domain for which Exchange Online will accept and process inbound email',
                        'It automatically creates mailboxes for the domain',
                        'It blocks spam from a specific domain'
                    ],
                    explanation: 'An accepted domain tells Exchange Online to accept inbound email for that domain instead of rejecting it. Without an accepted domain entry, Exchange Online returns an NDR for mail sent to recipients at that domain. Accepted domains are configured as either Authoritative (all recipients must exist in Exchange Online) or Internal Relay (unmatched recipients are forwarded to on-premises). Every verified custom domain is automatically added as an accepted domain.'
                },
                {
                    question: 'Which Exchange Online mailbox type is used for booking conference rooms?',
                    options: [
                        'Shared mailbox',
                        'User mailbox',
                        'Room mailbox (resource mailbox)',
                        'Equipment mailbox only'
                    ],
                    explanation: 'Room mailboxes are a type of resource mailbox specifically designed for conference rooms and meeting spaces. They automatically process meeting requests (accept or decline based on availability), display on the room finder in Outlook, and do not require a license. Equipment mailboxes are also resource mailboxes but represent physical equipment (projectors, vehicles). Both are created with New-Mailbox -Room or -Equipment.'
                },
                {
                    question: 'A mail flow rule has a "stop processing more rules" action. What does this mean?',
                    options: [
                        'The rule deletes the message',
                        'No subsequent lower-priority mail flow rules are evaluated for the message',
                        'All mail flow rules are disabled',
                        'The message is quarantined'
                    ],
                    explanation: '"Stop processing more rules" prevents any lower-priority mail flow rules from being evaluated for the matching message. By default, when a message matches a rule, Exchange continues evaluating all remaining rules in priority order. Adding this action short-circuits processing so that only the current rule and higher-priority rules that already matched take effect. This is useful for exception handling.'
                }
            ]
        });
        quiz.start();
    </script>
