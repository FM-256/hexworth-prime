    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 7: Manage Microsoft Teams',
            description: 'Test your understanding of Teams policies, guest access configuration, team creation, channel types, app management, voice features, the Teams admin center, and compliance capabilities for Teams.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch07-quiz',
            moduleId: 'ms102-ch07-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'A user has a messaging policy assigned directly that allows Giphy, and they also belong to a group that has a messaging policy blocking Giphy. Which policy takes effect?',
                    options: [
                        'The group policy wins because group policies override direct assignments',
                        'The direct user assignment wins because it has higher priority than group assignments',
                        'The most restrictive policy wins regardless of assignment method',
                        'Both policies merge, and individual settings are evaluated separately'
                    ],
                    explanation: 'Teams policies follow a strict priority order: direct user assignment takes the highest priority, followed by group assignment, followed by the Global (Org-wide default) policy. Since the user has a direct assignment that allows Giphy, that policy takes effect -- even though their group policy blocks it. The direct assignment always wins. If the user had no direct assignment, the group policy would apply.'
                },
                {
                    question: 'Guest access is enabled in the Teams admin center, but an invited guest cannot access a team. Which additional configuration should be checked first?',
                    options: [
                        'The guest\'s Microsoft 365 license assignment',
                        'Microsoft Entra ID External Collaboration settings and M365 Groups guest settings',
                        'The Teams meeting policy assigned to the guest',
                        'The SharePoint storage quota for the team site'
                    ],
                    explanation: 'Guest access in Teams requires four layers to be properly configured: (1) Entra ID External Collaboration settings (who can invite guests), (2) M365 Groups guest settings (allow group owners to add external guests), (3) Teams guest access toggle, and (4) SharePoint external sharing (at least "Existing guests"). If any layer is disabled, guest access fails. Since the Teams toggle is already enabled, the next check is Entra ID and M365 Groups settings -- the most commonly missed configuration.'
                },
                {
                    question: 'What is the key difference between a private channel and a shared channel in Microsoft Teams?',
                    options: [
                        'Private channels support file sharing; shared channels do not',
                        'Private channels are limited to team members; shared channels can include people from other teams and external organizations',
                        'Private channels use the parent team SharePoint site; shared channels get a separate site',
                        'Private channels support threaded conversations; shared channels only support flat chat'
                    ],
                    explanation: 'The key difference is scope: private channels restrict access to a subset of team members only, while shared channels can include users from other teams within the organization and even users from external organizations (via Entra ID B2B direct connect). Both private and shared channels get their own separate SharePoint site collection with independent permissions and storage. Both support threaded conversations and file sharing.'
                },
                {
                    question: 'An organization wants only IT staff to be able to create new teams. How is this restriction implemented?',
                    options: [
                        'Set a Teams admin center policy that restricts team creation to specific users',
                        'Create an Entra ID security group with IT members and set GroupCreationAllowedGroupId via PowerShell',
                        'Remove the Teams license from all non-IT users',
                        'Disable the "Create a team" button using a Teams app setup policy'
                    ],
                    explanation: 'To restrict who can create Microsoft 365 Groups (and therefore Teams), you create a security group in Entra ID containing the allowed users, then use the Set-MgBetaDirectorySetting PowerShell cmdlet to set the GroupCreationAllowedGroupId to that security group\'s object ID. This restriction applies across all M365 Group creation surfaces: Teams, Outlook, SharePoint, Planner, and Yammer. There is no Teams-specific setting for this -- it must be configured at the directory level.'
                },
                {
                    question: 'Which Teams voice component provides PSTN connectivity so users can make and receive calls to/from external phone numbers?',
                    options: [
                        'Teams Phone System (cloud PBX)',
                        'Calling Plan, Direct Routing, or Operator Connect',
                        'Audio Conferencing license',
                        'Teams meeting policy with PSTN dial-in'
                    ],
                    explanation: 'Teams Phone System provides the cloud PBX functionality (call control, voicemail, hold, transfer) but does not include PSTN connectivity. To make/receive calls to external phone numbers, you need one of three connectivity options: Microsoft Calling Plans (Microsoft provides phone numbers and minutes), Direct Routing (connect your SBC to Teams), or Operator Connect (carrier manages the SBC integration). Audio Conferencing provides dial-in numbers for meetings, not user-to-user PSTN calling.'
                },
                {
                    question: 'Where are Teams channel message files stored in SharePoint Online?',
                    options: [
                        'In the user\'s OneDrive who uploaded the file',
                        'In a hidden compliance archive in Exchange Online',
                        'In the team\'s SharePoint site (standard channels) or a separate site (private/shared channels)',
                        'In Azure Blob Storage directly, not SharePoint'
                    ],
                    explanation: 'Files shared in standard channels are stored in the parent team\'s SharePoint site under a folder matching the channel name in the Shared Documents library. Private channels and shared channels each get their own separate SharePoint site collection with independent storage and permissions. The General channel always uses the parent team\'s SharePoint site. This architecture means storage quotas and retention policies apply independently to each channel type.'
                },
                {
                    question: 'An admin wants to block all third-party apps for the entire organization in Teams. What is the most effective approach?',
                    options: [
                        'Create an app permission policy blocking third-party apps and assign it to every user',
                        'Toggle "Allow third-party apps" to Off in org-wide app settings',
                        'Remove each third-party app individually from the Manage Apps catalog',
                        'Block third-party apps via a Conditional Access policy in Entra ID'
                    ],
                    explanation: 'The most effective approach is to toggle "Allow third-party apps" to Off in the Teams admin center > Teams apps > Manage apps > Org-wide app settings. This is a master switch that overrides all app permission policies -- no third-party apps will be available to any user regardless of their individual policy assignment. This is more efficient than creating and assigning policies to every user or blocking apps individually.'
                },
                {
                    question: 'What is the difference between an auto attendant and a call queue in Teams Phone System?',
                    options: [
                        'Auto attendants route calls based on a menu system; call queues distribute calls to a group of agents',
                        'Auto attendants handle inbound calls; call queues handle outbound calls only',
                        'Auto attendants require a Calling Plan; call queues work with Direct Routing only',
                        'Auto attendants and call queues are the same feature with different names'
                    ],
                    explanation: 'Auto attendants provide an interactive voice menu ("Press 1 for Sales, 2 for Support") that routes calls based on caller input, time of day, or holidays. Call queues distribute inbound calls to a group of agents using routing methods like round robin, serial, longest idle, or attendant (ring all). Typically, an auto attendant menu option transfers the caller to a call queue. Both work with Calling Plans, Direct Routing, and Operator Connect.'
                },
                {
                    question: 'Where are Teams chat messages stored for eDiscovery and legal hold purposes?',
                    options: [
                        'In a dedicated Teams compliance database',
                        'In the user\'s Exchange Online mailbox (1:1 and group chats) and the M365 Group mailbox (channel messages)',
                        'In SharePoint Online document libraries',
                        'In Azure Cosmos DB and only accessible via the Teams admin center'
                    ],
                    explanation: 'Teams chat messages (1:1 and group chats) are stored in a hidden folder in each participant\'s Exchange Online mailbox. Channel messages are stored in a hidden folder in the associated Microsoft 365 Group mailbox. Private channel messages are stored in the individual user mailboxes of channel members. This storage model means eDiscovery searches target Exchange mailboxes, and legal holds placed on user or group mailboxes preserve Teams messages (including edited and deleted ones).'
                },
                {
                    question: 'A meeting policy is configured with "Who can bypass the lobby" set to "People in my organization." A guest user joins a Teams meeting. What happens?',
                    options: [
                        'The guest is admitted automatically because they are an authenticated user',
                        'The guest waits in the lobby until a meeting organizer or presenter admits them',
                        'The guest is blocked from joining entirely',
                        'The guest joins but with view-only permissions'
                    ],
                    explanation: 'When the lobby bypass is set to "People in my organization," only users with accounts in the tenant\'s Entra ID (internal users) bypass the lobby automatically. Guest users (external), even if they are authenticated Entra ID guests, are placed in the lobby and must be manually admitted by the meeting organizer or a presenter. This is a key security control for preventing unauthorized meeting access. Other lobby options include "Everyone" (no lobby), "People in my org and trusted orgs," and "Only me" (organizer admits everyone).'
                },
                {
                    question: 'What is the maximum number of org-wide teams allowed in a Microsoft 365 tenant?',
                    options: [
                        '1',
                        '5',
                        '10',
                        'Unlimited'
                    ],
                    explanation: 'A tenant can have a maximum of 5 org-wide teams. Org-wide teams automatically include every licensed user in the organization as a member. Members are automatically added when they join the organization and removed when they leave. Only Global Administrators can create org-wide teams, and they are limited to tenants with 10,000 or fewer users. Org-wide teams cannot have private or shared channels.'
                },
                {
                    question: 'Which compliance feature scans Teams chat and channel messages in real-time to detect sensitive data like credit card numbers?',
                    options: [
                        'Microsoft Purview eDiscovery',
                        'Microsoft Purview Data Loss Prevention (DLP)',
                        'Microsoft Purview Communication Compliance',
                        'Microsoft Purview Retention Policies'
                    ],
                    explanation: 'Data Loss Prevention (DLP) policies in Microsoft Purview scan Teams chat and channel messages in real-time as they are sent. DLP can detect sensitive data types (credit card numbers, SSNs, custom patterns) and take action: block the message, notify the sender with a policy tip, alert compliance officers, or require the user to provide a business justification to override the block. DLP for Teams requires Microsoft 365 E5 or E5 Compliance add-on.'
                },
                {
                    question: 'Teams meeting recordings are saved to which location by default?',
                    options: [
                        'Microsoft Stream',
                        'OneDrive for Business (non-channel meetings) or SharePoint (channel meetings)',
                        'Azure Blob Storage',
                        'The Teams admin center media library'
                    ],
                    explanation: 'Teams meeting recordings are saved to OneDrive for Business for non-channel meetings (stored in the organizer\'s OneDrive under a "Recordings" folder) and to SharePoint for channel meetings (stored in the channel\'s SharePoint document library). Microsoft Stream (Classic) was the previous storage location but is deprecated. Recordings expire after a configurable period (default: 120 days) and are automatically deleted unless the expiration is changed or removed.'
                },
                {
                    question: 'An organization needs to deploy a custom line-of-business app to all Teams users. What is the correct process?',
                    options: [
                        'Publish the app to the Microsoft Teams Store and wait for approval',
                        'Upload the app package to Manage Apps, allow it in the app catalog, and pin it via an app setup policy',
                        'Install the app on each user device using an Intune app deployment',
                        'Email the app .zip file to users and instruct them to sideload it'
                    ],
                    explanation: 'To deploy a custom LOB app: (1) upload the .zip app package to the Teams admin center > Teams apps > Manage apps, (2) ensure custom apps are allowed in org-wide app settings, (3) allow the app in the relevant app permission policy, and (4) pin it to the Teams sidebar using an app setup policy assigned to the target users. This gives centralized control over deployment and ensures all users see the app without manual installation.'
                },
                {
                    question: 'Where are Teams meeting recordings stored for channel meetings?',
                    options: [
                        'In the meeting organizer OneDrive for Business',
                        'In the channel SharePoint document library',
                        'In Microsoft Stream Classic',
                        'In the Teams admin center media library'
                    ],
                    explanation: 'Channel meeting recordings are stored in the channel SharePoint document library under a "Recordings" folder. Non-channel (private) meeting recordings are stored in the organizer OneDrive for Business. Microsoft Stream Classic is deprecated. Recordings expire after a configurable period (default 120 days). Admins can change or disable the expiration policy in the Teams admin center under Meeting policies.'
                }
            ]
        });
        quiz.start();
    </script>
