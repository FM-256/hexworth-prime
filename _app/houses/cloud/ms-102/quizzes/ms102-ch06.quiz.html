<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-102 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 6: Manage SharePoint and OneDrive',
            description: 'Test your understanding of SharePoint site collections, sharing settings, storage quotas, OneDrive sync client configuration, site permissions, content types, information architecture, and site lifecycle management.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch06-quiz',
            moduleId: 'ms102-ch06-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'An organization\'s SharePoint admin center has org-level sharing set to "New and existing guests." A site owner attempts to enable "Anyone" (anonymous) sharing links on their project site. What happens?',
                    options: [
                        'The site-level setting overrides the org-level, enabling anonymous links for that site',
                        'The change is blocked -- site-level sharing cannot exceed the org-level setting',
                        'Anonymous links are enabled but require admin approval before each use',
                        'The org-level setting automatically upgrades to match the site-level request'
                    ],
                    explanation: 'The org-level sharing setting is the ceiling. Site-level sharing can be equal to or more restrictive than the org-level, but never more permissive. Since the org-level is set to "New and existing guests" (which requires authentication), a site cannot enable "Anyone" links (which allow anonymous access). The site owner must request a global admin to raise the org-level setting first.'
                },
                {
                    question: 'What is the purpose of Known Folder Move (KFM) in OneDrive?',
                    options: [
                        'It moves files from OneDrive to a local backup drive on a schedule',
                        'It redirects the user Desktop, Documents, and Pictures folders to sync with OneDrive',
                        'It migrates files from on-premises SharePoint to SharePoint Online',
                        'It moves shared files from team sites to individual OneDrive accounts'
                    ],
                    explanation: 'Known Folder Move (KFM) silently redirects the Windows known folders -- Desktop, Documents, and Pictures -- to sync with the user\'s OneDrive for Business. This ensures user files are automatically backed up to the cloud. KFM is deployed via Group Policy or Intune and can operate silently (no user prompts) or with user notification. It is critical for data protection on managed devices.'
                },
                {
                    question: 'Which SharePoint site type provides shared navigation, theme, and search scope across multiple associated sites?',
                    options: [
                        'Team site',
                        'Communication site',
                        'Hub site',
                        'Root site'
                    ],
                    explanation: 'Hub sites provide a shared navigation bar, consistent theme/branding, and a unified search scope across all associated sites. Any team or communication site can be registered as a hub by a SharePoint Administrator. Hub sites do not affect permissions or storage on associated sites -- they only provide UI consistency and cross-site discovery. A site can associate with only one hub at a time.'
                },
                {
                    question: 'How is the SharePoint Online tenant storage pool calculated?',
                    options: [
                        '10 GB per licensed user with no base allocation',
                        '1 TB base plus 10 GB per licensed user',
                        '25 TB per site collection with no tenant pool',
                        '5 TB flat allocation regardless of user count'
                    ],
                    explanation: 'The SharePoint Online tenant storage pool is calculated as 1 TB base storage plus 10 GB per licensed user. For example, a tenant with 500 licensed users gets 1 TB + 5 TB = 6 TB total. This pool is shared across all SharePoint sites and OneDrive accounts. Additional storage can be purchased in 1 GB increments. Individual sites have a default limit of 25 TB each but draw from the shared tenant pool.'
                },
                {
                    question: 'A user\'s account is deleted from Microsoft Entra ID. What happens to their OneDrive data by default?',
                    options: [
                        'It is permanently deleted immediately',
                        'It is retained for 30 days and then permanently deleted',
                        'It is transferred to the user\'s manager automatically and retained indefinitely',
                        'It is archived in a compliance vault for 7 years'
                    ],
                    explanation: 'When a user account is deleted, their OneDrive data is retained for 30 days by default (configurable from 30 to 3,650 days in SharePoint admin center > Settings > OneDrive retention). During this period, the user\'s manager (if set) automatically receives delegate access to the OneDrive. After the retention period expires, the data is permanently deleted. This setting is controlled by the orphanedPersonalSitesRetentionPeriod tenant property.'
                },
                {
                    question: 'Which three default SharePoint groups are created for every new site?',
                    options: [
                        'Administrators, Editors, Readers',
                        'Owners, Members, Visitors',
                        'Full Control, Contribute, View Only',
                        'Site Admins, Content Managers, Viewers'
                    ],
                    explanation: 'Every SharePoint site is created with three default groups: Owners (Full Control permission level), Members (Edit permission level), and Visitors (Read permission level). For team sites connected to a Microsoft 365 Group, the Owners and Members groups inherit membership from the M365 Group owners and members. Communication sites use standalone SharePoint groups that must be managed separately.'
                },
                {
                    question: 'What is the key difference between "Files On-Demand" cloud-only files and locally available files?',
                    options: [
                        'Cloud-only files are encrypted; locally available files are not',
                        'Cloud-only files appear in File Explorer but are not downloaded until opened; locally available files are stored on disk',
                        'Cloud-only files can only be accessed through a web browser',
                        'There is no functional difference -- both states are identical'
                    ],
                    explanation: 'Files On-Demand creates three file states: cloud-only (online icon -- file metadata is visible in File Explorer but the file content is not downloaded, saving disk space), locally available (green checkmark -- downloaded and cached on disk), and always keep on device (green circle with checkmark -- pinned to local storage, always available offline). Cloud-only files download automatically when opened and may be freed back to cloud-only status by the sync client when disk space is low.'
                },
                {
                    question: 'An organization wants to restrict external sharing to only partners from fabrikam.com and tailwindtraders.com. Where is this configured?',
                    options: [
                        'Microsoft Entra ID > External Identities > Cross-tenant access',
                        'SharePoint admin center > Policies > Sharing > Advanced external sharing > Domain allow list',
                        'Microsoft 365 admin center > Settings > Org settings > Security',
                        'Microsoft Purview > Data Loss Prevention > Sharing rules'
                    ],
                    explanation: 'Domain allow/block lists for SharePoint and OneDrive sharing are configured in the SharePoint admin center under Policies > Sharing > Advanced external sharing settings. You can add specific domains to an allow list (only those domains can receive shared content) or a block list (all domains except those listed can receive shared content). You cannot use both lists simultaneously. This setting applies at the org level and can also be configured per-site.'
                },
                {
                    question: 'What is the purpose of the Content Type Hub in SharePoint Online?',
                    options: [
                        'It stores all document templates used across the tenant',
                        'It publishes standardized content types with metadata columns to all sites in the tenant',
                        'It manages the SharePoint search index and crawl schedule',
                        'It provides a central dashboard for monitoring site storage usage'
                    ],
                    explanation: 'The Content Type Hub (or the modern Content type gallery in the SharePoint admin center) is a central location where administrators define content types -- reusable bundles of metadata columns, document templates, and behaviors. Once published, these content types are available across all sites in the tenant, ensuring consistent metadata and document standards. Changes to published content types propagate automatically to all subscribing sites.'
                },
                {
                    question: 'A SharePoint site has had no user activity for 8 months. What happens if an inactive site policy is configured with a 6-month threshold?',
                    options: [
                        'The site is automatically deleted without notification',
                        'The site owners receive email notifications that the site is inactive and may be archived or deleted',
                        'The site is automatically moved to a read-only archive',
                        'All site members lose access immediately'
                    ],
                    explanation: 'When an inactive site policy detects a site with no activity beyond the configured threshold (6 months in this case), it sends email notifications to site owners warning that the site is inactive. Owners can confirm the site is still needed (resetting the inactivity timer) or acknowledge it should be archived/deleted. If owners do not respond, admins can take action: archive, delete, or reassign ownership. The policy does not auto-delete or auto-archive without human intervention by default.'
                },
                {
                    question: 'A deleted SharePoint site collection needs to be restored. How long is it available in the site collection Recycle Bin?',
                    options: [
                        '30 days',
                        '93 days',
                        '180 days',
                        '365 days'
                    ],
                    explanation: 'Deleted site collections are retained in the site collection Recycle Bin for 93 days. During this period, a SharePoint Administrator can restore the site with all content, permissions, and settings intact. After 93 days, the site is permanently deleted and cannot be recovered. Individual items deleted by users follow the same 93-day total retention across two recycle bin stages (site recycle bin and site collection recycle bin).'
                },
                {
                    question: 'Which OneDrive sync client feature should be enforced via Group Policy to prevent users from downloading all files to their local device?',
                    options: [
                        'Known Folder Move',
                        'Files On-Demand',
                        'Selective Sync',
                        'Storage Sense'
                    ],
                    explanation: 'Files On-Demand ensures files appear in File Explorer as cloud-only placeholders and are only downloaded when opened. Enforcing this via Group Policy (or Intune) prevents users from disabling it -- which would cause the sync client to download all synced content to the local disk, potentially consuming tens of gigabytes of storage. The policy "Use OneDrive Files On-Demand" should be set to Enabled and deployed to all managed devices.'
                },
                {
                    question: 'Where in the SharePoint admin center do you configure whether anonymous users can access SharePoint content from unmanaged devices?',
                    options: [
                        'Active sites > Site settings',
                        'Policies > Access control',
                        'Policies > Sharing',
                        'Settings > Default admin experience'
                    ],
                    explanation: 'Policies > Access control in the SharePoint admin center configures unmanaged device access policies, network location-based access, idle session sign-out, and app restrictions. This section integrates with Entra ID Conditional Access policies. You can set unmanaged devices to full access, limited access (web-only, no download), or blocked. This is separate from sharing settings, which control who content can be shared with.'
                },
                {
                    question: 'A team site is connected to a Microsoft 365 Group. How are site permissions managed?',
                    options: [
                        'Permissions are managed through standalone SharePoint groups only',
                        'The site Owners and Members groups inherit membership from the connected M365 Group',
                        'All permissions are managed exclusively through Entra ID roles',
                        'The team site has no permission model -- all M365 licensed users have access'
                    ],
                    explanation: 'When a team site is connected to a Microsoft 365 Group, the SharePoint site Owners group inherits from the M365 Group owners, and the Members group inherits from the M365 Group members. Adding someone to the M365 Group automatically grants them Member access to the SharePoint site (and the connected Teams team, shared mailbox, Planner plan, etc.). The Visitors group remains a standalone SharePoint group for granting read-only access to non-group members.'
                },
                {
                    question: 'Where in the SharePoint admin center do you configure access policies for unmanaged devices?',
                    options: [
                        'Sharing settings',
                        'Policies > Access control',
                        'Site settings > Permissions',
                        'Settings > Default admin experience'
                    ],
                    explanation: 'Policies > Access control in the SharePoint admin center configures unmanaged device access. Options include: full access, limited access (web-only with no download, print, or sync), or blocked. These policies integrate with Microsoft Entra ID Conditional Access. For organizations without Entra ID P1 licensing, the limited web-only access option provides basic unmanaged device restriction without full Conditional Access.'
                }
            ]
        });
        quiz.start();
    </script>
