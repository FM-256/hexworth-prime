<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-102 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Deploy and Manage a Microsoft 365 Tenant',
            description: 'Test your understanding of tenant provisioning, custom domains, DNS verification, organizational settings, admin center navigation, service health, Message Center, and release preferences.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch01-quiz',
            moduleId: 'ms102-ch01-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'When you create a new Microsoft 365 tenant, which domain is automatically provisioned and cannot be removed?',
                    options: [
                        'A custom domain you register during signup',
                        'The .onmicrosoft.com domain',
                        'The .microsoft.com domain',
                        'A domain based on your organization IP address'
                    ],
                    explanation: 'Every M365 tenant receives a default .onmicrosoft.com domain (e.g., contoso.onmicrosoft.com) at creation. This domain is permanent -- it cannot be renamed, transferred, or deleted. It serves as the fallback domain for user sign-in and email routing if all custom domains are removed. Custom domains can be added and removed, but the .onmicrosoft.com domain is always present.'
                },
                {
                    question: 'Which DNS record type is used to prove domain ownership when adding a custom domain to Microsoft 365?',
                    options: [
                        'MX record',
                        'CNAME record',
                        'TXT record',
                        'A record'
                    ],
                    explanation: 'Microsoft 365 generates a unique TXT record value (e.g., MS=ms12345678) that you add to your domain DNS zone at your registrar. Microsoft then queries your DNS to confirm the TXT record exists, proving you own the domain. MX records route email. CNAME records handle autodiscovery and DKIM. A records map hostnames to IP addresses but are not used for M365 domain verification.'
                },
                {
                    question: 'What is the purpose of the MX record when configuring a custom domain for Exchange Online?',
                    options: [
                        'It verifies domain ownership',
                        'It enables Outlook desktop auto-configuration',
                        'It routes inbound email to Exchange Online',
                        'It authenticates outbound email with SPF'
                    ],
                    explanation: 'The MX (Mail Exchange) record tells sending mail servers where to deliver email for your domain. For Exchange Online, the MX record points to contoso-com.mail.protection.outlook.com with priority 0. Without a correctly configured MX record, inbound email will not reach your Exchange Online mailboxes. Domain verification uses TXT records. Autodiscovery uses CNAME records. SPF uses a separate TXT record.'
                },
                {
                    question: 'An organization wants to allow only IT administrators to receive new M365 features early while keeping all other users on the standard release. Which configuration achieves this?',
                    options: [
                        'Standard Release for everyone',
                        'Targeted Release for everyone',
                        'Targeted Release for selected users',
                        'Semi-Annual Enterprise Channel'
                    ],
                    explanation: 'Targeted Release for selected users allows you to designate specific users (typically IT admins and early adopters) who receive new M365 web service features before the rest of the organization. Everyone else stays on Standard Release. This is the Microsoft-recommended approach for production tenants. Semi-Annual Enterprise Channel controls desktop Office app updates, not M365 web service features.'
                },
                {
                    question: 'Where in the Microsoft 365 admin center do you monitor real-time service outages and degradation?',
                    options: [
                        'Settings > Org settings',
                        'Health > Service health',
                        'Health > Message center',
                        'Reports > Usage'
                    ],
                    explanation: 'Health > Service health displays the real-time operational status of all M365 services (Exchange, Teams, SharePoint, etc.) with three states: operational, advisory, and incident. Active incidents include user impact, current status, and estimated resolution time. Message Center communicates upcoming changes, not real-time outages. Reports > Usage shows adoption metrics. Org settings manages tenant configuration.'
                },
                {
                    question: 'Which of the following is communicated through the Message Center rather than the Service Health dashboard?',
                    options: [
                        'An active Exchange Online outage affecting all users',
                        'A new Teams feature rolling out next month',
                        'A SharePoint service degradation in progress',
                        'A resolved incident with a post-incident report'
                    ],
                    explanation: 'The Message Center communicates upcoming changes: new features, deprecations, and policy changes with timelines and action items. Service Health shows current and past incidents (outages, degradations, and their post-incident reports). A new Teams feature rolling out is a change notification, not a service incident, so it appears in the Message Center with a "Stay Informed" or "Plan for Change" tag.'
                },
                {
                    question: 'What determines where your Microsoft 365 tenant data is stored at rest?',
                    options: [
                        'The billing address on your subscription',
                        'The geographic region selected during tenant creation',
                        'The location of your DNS registrar',
                        'The IP address of your Global Administrator'
                    ],
                    explanation: 'The data residency region is selected during tenant creation and determines where core workload data (Exchange, SharePoint, Teams) is stored at rest. This cannot be changed after creation without Microsoft assistance or Multi-Geo licensing. The billing address, DNS registrar location, and admin IP address have no effect on data residency. Multi-Geo add-ons allow satellite data locations for specific users.'
                },
                {
                    question: 'A custom domain can be verified in how many Microsoft 365 tenants simultaneously?',
                    options: [
                        'Unlimited tenants',
                        'Up to 5 tenants',
                        'Exactly one tenant',
                        'Up to 2 tenants (production and test)'
                    ],
                    explanation: 'A domain can only be verified in one M365 tenant at a time. If contoso.com is verified in Tenant A, it must be removed from Tenant A before it can be verified in Tenant B. This is a hard constraint enforced by Microsoft. There is no exception for production/test tenants. This is a commonly tested MS-102 concept, especially in scenarios involving tenant migrations or mergers.'
                },
                {
                    question: 'Which DNS record enables Outlook desktop clients to automatically discover mailbox settings for a custom domain?',
                    options: [
                        'MX record pointing to mail.protection.outlook.com',
                        'TXT record with MS= verification value',
                        'CNAME record for autodiscover pointing to autodiscover.outlook.com',
                        'A record pointing to the Exchange Online IP address'
                    ],
                    explanation: 'The autodiscover CNAME record maps autodiscover.contoso.com to autodiscover.outlook.com. When a user configures Outlook with their email address, Outlook queries this CNAME to find the Exchange Online endpoint and automatically configures server settings, encryption, and protocols. Without this record, users must manually enter server URLs. A records are not used -- Exchange Online uses CNAME-based autodiscovery.'
                },
                {
                    question: 'What is the recommended maximum number of Global Administrator accounts in a Microsoft 365 tenant?',
                    options: [
                        '1 account for maximum security',
                        '2 to 4 accounts',
                        '10 accounts per 1000 users',
                        'No limit -- assign to all IT staff'
                    ],
                    explanation: 'Microsoft recommends 2 to 4 Global Administrator accounts. At least 2 ensures you are not locked out if one account is compromised or unavailable (break-glass scenario). More than 4 increases your attack surface. All other IT staff should use least-privilege roles: User Administrator, Exchange Administrator, SharePoint Administrator, etc. Privileged Identity Management (PIM) enables just-in-time activation for elevated roles.'
                },
                {
                    question: 'Which organizational setting controls whether end users can grant third-party applications access to Microsoft 365 data?',
                    options: [
                        'Release preferences',
                        'User consent to apps',
                        'Customer lockbox',
                        'Idle session timeout'
                    ],
                    explanation: 'User consent to apps (Settings > Org settings > User consent to apps) controls whether users can grant OAuth permissions to third-party applications. Options include: allow all consent, allow consent only for verified publishers, or require admin approval for all apps. This is a high-risk setting -- overly permissive consent allows phishing apps to access organizational data. Customer lockbox controls Microsoft support access. Release preferences control feature rollout timing.'
                },
                {
                    question: 'What happens to a Microsoft 365 tenant when all subscriptions expire and the 90-day disabled period ends?',
                    options: [
                        'The tenant continues operating with limited features',
                        'The tenant is permanently deleted and all data is lost',
                        'The tenant is automatically renewed at the previous rate',
                        'The tenant is transferred to Microsoft for archival'
                    ],
                    explanation: 'When subscriptions expire, the tenant enters a 30-day grace period (full access), then a 90-day disabled state (admin-only access, users locked out), then permanent deletion. All data -- mailboxes, files, user accounts, configurations -- is irreversibly destroyed. No automatic renewal occurs. Microsoft does not archive tenants. Admins must renew or export data before the disabled period ends.'
                },
                {
                    question: 'Which email authentication DNS record specifies the policy for handling messages that fail both SPF and DKIM validation?',
                    options: [
                        'MX record',
                        'SPF TXT record',
                        'DMARC TXT record',
                        'DKIM CNAME record'
                    ],
                    explanation: 'DMARC (Domain-based Message Authentication, Reporting, and Conformance) is a TXT record at _dmarc.contoso.com that specifies what receiving servers should do with email that fails both SPF and DKIM: none (monitor only), quarantine (send to spam), or reject (block delivery). SPF defines authorized sending IPs. DKIM signs messages cryptographically. MX routes inbound email. Only DMARC sets the enforcement policy for failed authentication.'
                },
                {
                    question: 'You receive a Message Center post tagged "Prevent or Fix Issues" with a deadline of 30 days. What is the appropriate admin response?',
                    options: [
                        'Ignore it -- informational posts require no action',
                        'Read the post, assess impact, and complete required changes before the deadline',
                        'Forward it to Microsoft support for them to handle',
                        'Wait until the feature is auto-applied and then troubleshoot'
                    ],
                    explanation: '"Prevent or Fix Issues" is the highest-priority Message Center category. It means something will change that could break your environment if you do not act. The correct response is to read the full post, assess the impact on your tenant (users, apps, scripts, devices), plan and execute the required changes, and verify completion before the deadline. This is distinct from "Stay Informed" (awareness only) and "Plan for Change" (upcoming feature, action may be needed).'
                },
                {
                    question: 'Where do you access specialized administration for Exchange Online, SharePoint Online, and Microsoft Teams?',
                    options: [
                        'Each service has its own admin center accessible from the M365 admin center left navigation',
                        'All services are managed exclusively through PowerShell',
                        'Each service requires a separate Microsoft account',
                        'Specialized administration is only available through Azure Portal'
                    ],
                    explanation: 'The M365 admin center (admin.microsoft.com) left navigation includes a "Show all" link that reveals specialized admin centers: Exchange admin center (admin.exchange.microsoft.com), SharePoint admin center (admin.sharepoint.com [tenant-specific URL]), and Teams admin center (admin.teams.microsoft.com). Each provides workload-specific management (mail flow rules, site policies, meeting policies). PowerShell is also available but not the only method. No separate accounts are needed -- the same admin credentials work across all centers.'
                }
            ]
        });
        quiz.start();
    </script>
