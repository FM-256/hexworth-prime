<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to MS-102 Hub</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Manage Users and Groups',
            description: 'Test your understanding of user lifecycle management, bulk operations, guest users (B2B), group types, dynamic membership rules, self-service group management, soft-delete recovery, and license assignment.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'ms102-ch02-quiz',
            moduleId: 'ms102-ch02-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which user property must be set before a Microsoft 365 license can be assigned?',
                    options: [
                        'Department',
                        'Job title',
                        'Usage location',
                        'Manager'
                    ],
                    explanation: 'Usage location is a two-letter country code (e.g., US, GB) that determines which M365 services are available to the user based on regional regulations. It is required before any license -- direct or group-based -- can be assigned. Without a usage location, the license assignment fails. Department, job title, and manager are optional profile attributes.'
                },
                {
                    question: 'How long is the recovery window for a soft-deleted user in Microsoft Entra ID?',
                    options: [
                        '7 days',
                        '14 days',
                        '30 days',
                        '90 days'
                    ],
                    explanation: 'When a user is deleted, the account moves to the Deleted Users container in a soft-deleted state for 30 days. During this window, an admin can restore the user with all properties and group memberships intact. After 30 days, the account is permanently purged and cannot be recovered. The license is released immediately upon deletion, not after the 30-day window.'
                },
                {
                    question: 'What happens to a user\'s license when the account is soft-deleted?',
                    options: [
                        'The license remains assigned for 30 days',
                        'The license is released immediately and can be reassigned',
                        'The license is permanently consumed until the tenant is recreated',
                        'The license enters a suspended state for 90 days'
                    ],
                    explanation: 'When a user account is soft-deleted, the assigned license is released immediately and returns to the available pool. It can be reassigned to another user right away. The mailbox and OneDrive data are retained during the 30-day soft-delete window, but the license seat is freed. If the user is restored, the license must be manually re-assigned.'
                },
                {
                    question: 'Which group type provisions a shared mailbox, SharePoint site, OneNote notebook, and Planner board automatically?',
                    options: [
                        'Security Group',
                        'Distribution Group',
                        'Microsoft 365 Group',
                        'Mail-Enabled Security Group'
                    ],
                    explanation: 'Microsoft 365 Groups are collaboration groups that automatically provision a shared Exchange mailbox, SharePoint team site, OneNote notebook, Planner board, and optionally a Teams workspace. Security Groups provide access control only. Distribution Groups provide email-only delivery. Mail-Enabled Security Groups combine email delivery with access control but do not provision collaboration workloads.'
                },
                {
                    question: 'Which two group types support dynamic membership rules? (Choose the best answer.)',
                    options: [
                        'Distribution Groups and Mail-Enabled Security Groups',
                        'Microsoft 365 Groups and Security Groups',
                        'Security Groups and Distribution Groups',
                        'All four group types support dynamic membership'
                    ],
                    explanation: 'Dynamic membership is supported only for Microsoft 365 Groups and Security Groups. Distribution Groups and Mail-Enabled Security Groups do not support dynamic membership -- their members must be managed manually (assigned membership). Dynamic membership requires Microsoft Entra ID P1 or P2 licensing and uses attribute-based rules to automatically add or remove members.'
                },
                {
                    question: 'An organization wants to automatically add all users in the Sales department to a security group. Which dynamic membership rule achieves this?',
                    options: [
                        '(user.jobTitle -eq "Sales")',
                        '(user.department -eq "Sales")',
                        '(user.companyName -eq "Sales")',
                        '(user.usageLocation -eq "Sales")'
                    ],
                    explanation: 'The correct rule uses the department attribute: (user.department -eq "Sales"). This evaluates each user\'s department property and adds matching users to the group automatically. jobTitle matches the user\'s specific job title (e.g., "Sales Associate"), not the department. companyName matches the organization name. usageLocation is a country code (e.g., "US"), not a department name.'
                },
                {
                    question: 'What licensing requirement applies to dynamic group membership in Microsoft Entra ID?',
                    options: [
                        'No additional licensing required',
                        'Microsoft Entra ID Free tier is sufficient',
                        'Microsoft Entra ID P1 or P2 is required',
                        'Microsoft 365 F1 is required'
                    ],
                    explanation: 'Dynamic group membership requires Microsoft Entra ID P1 or P2 licensing. The Entra ID Free tier (included with M365 subscriptions) does not support dynamic groups. With P1/P2, you can create rules that automatically evaluate user attributes (department, job title, usage location, etc.) and manage group membership without manual intervention.'
                },
                {
                    question: 'In Microsoft Entra B2B collaboration, how does a guest user authenticate?',
                    options: [
                        'Using a new account and password created in the host tenant',
                        'Using their own organization\'s or personal credentials',
                        'Using a shared service account provided by the admin',
                        'Using certificate-based authentication only'
                    ],
                    explanation: 'Microsoft Entra B2B guests authenticate with their own existing credentials -- either their home organization\'s Microsoft Entra ID, a Microsoft account, Google federation, or a one-time passcode for other email providers. The host tenant does not create or manage passwords for guest users. This is a core B2B benefit: no additional credentials to manage for external collaborators.'
                },
                {
                    question: 'Which bulk operation is NOT available from the Microsoft 365 admin center\'s CSV upload feature?',
                    options: [
                        'Bulk create users',
                        'Bulk delete users',
                        'Bulk assign licenses',
                        'Bulk invite guest users'
                    ],
                    explanation: 'The M365 admin center supports four CSV-based bulk operations: bulk create, bulk delete, bulk invite (guest users), and bulk download (export user list). Bulk license assignment is NOT one of them -- licenses must be assigned individually per user or via group-based licensing. For bulk license assignment at scale, use PowerShell (Set-MgUserLicense) or group-based licensing.'
                },
                {
                    question: 'What is the maximum number of users that can be created in a single CSV bulk upload in the M365 admin center?',
                    options: [
                        '1,000',
                        '5,000',
                        '50,000',
                        '100,000'
                    ],
                    explanation: 'The M365 admin center supports up to 50,000 users per CSV file for bulk create operations. Each row represents one user with required fields: User name, First name, Last name, and Display name. For organizations that need to create more than 50,000 users, multiple CSV uploads or PowerShell scripting is required.'
                },
                {
                    question: 'An admin assigns a Microsoft 365 E5 license to a security group. A user in the group has no usage location set. What happens?',
                    options: [
                        'The license is assigned with a default usage location of US',
                        'The license assignment fails silently for that user',
                        'The entire group license assignment is rolled back',
                        'The user is automatically removed from the group'
                    ],
                    explanation: 'When group-based licensing encounters a user without a usage location, the license assignment fails silently for that specific user. Other group members with valid usage locations still receive their licenses normally. The failure is logged in the group\'s License assignment errors blade in Entra ID. The admin must set the user\'s usage location and then reprocess the license assignment.'
                },
                {
                    question: 'Which admin role follows the principle of least privilege for managing user accounts and groups without full tenant access?',
                    options: [
                        'Global Administrator',
                        'User Administrator',
                        'Security Administrator',
                        'Compliance Administrator'
                    ],
                    explanation: 'The User Administrator role can create and manage users and groups, reset passwords, manage licenses, and monitor service health -- without the full tenant-wide access of Global Administrator. Security Administrator manages security policies and alerts. Compliance Administrator manages compliance features. Microsoft recommends reserving Global Administrator for 2-4 break-glass accounts and using scoped roles like User Administrator for daily operations.'
                },
                {
                    question: 'Where do you configure whether all users or only specific users can create Microsoft 365 Groups?',
                    options: [
                        'Microsoft 365 admin center > Settings > Org settings',
                        'Microsoft Entra ID > Groups > General > Self-service group management',
                        'Exchange admin center > Recipients > Groups',
                        'SharePoint admin center > Policies > Sharing'
                    ],
                    explanation: 'Group creation restrictions are configured in Microsoft Entra ID > Groups > General > Self-service group management. You can allow all users to create M365 Groups (default) or restrict creation to members of a specific security group. This requires Entra ID P1. Note: this restriction applies only to M365 Groups -- it does not prevent users from creating Security Groups or Distribution Groups in Outlook.'
                },
                {
                    question: 'What happens to a Microsoft 365 Group when its expiration policy deadline passes and no owner renews it?',
                    options: [
                        'The group is permanently deleted immediately',
                        'The group is soft-deleted with a 30-day recovery window',
                        'The group is archived and becomes read-only',
                        'The group is reassigned to the Global Administrator'
                    ],
                    explanation: 'When an M365 Group expires without renewal, it is soft-deleted. During the 30-day recovery window, a Global Administrator or the group owner can restore it with all content (mailbox, SharePoint site, Teams data) intact. After 30 days, the group and all associated resources are permanently deleted. Owners receive renewal reminders at 30 days, 15 days, and 1 day before expiration.'
                },
                {
                    question: 'A user receives an M365 E3 license from Group A and an M365 E5 license from Group B. What is the result?',
                    options: [
                        'Both licenses are applied and the user gets the union of all service plans',
                        'A license conflict is flagged and the admin must resolve the overlapping service plans',
                        'The E5 license automatically overrides the E3 license',
                        'The first license assigned takes priority and the second is ignored'
                    ],
                    explanation: 'When a user inherits conflicting licenses from multiple groups (E3 and E5 have overlapping service plans like Exchange, Teams, SharePoint), the conflict is flagged in the License assignment errors blade. The admin must resolve the conflict -- typically by removing the user from one group or disabling overlapping service plans in one of the license assignments. Licenses do not automatically override each other.'
                }
            ]
        });
        quiz.start();
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
