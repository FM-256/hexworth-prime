<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5: Backup & Restore | Cloud Base</title>
    <style>
        :root { --bg: #060a14; --bg-card: #0c1424; --bg-option: #101c30; --sky: #38bdf8; --sky-dim: rgba(56,189,248,0.15); --text: #e2e8f0; --text-muted: #8892a8; --success: #22c55e; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #081420 50%, #0a1828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--sky); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #7dd3fc; }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--sky-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--sky); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sky), var(--success)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--sky); font-weight: 600; white-space: nowrap; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--sky); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .question-text code { background: rgba(56,189,248,0.1); color: #7dd3fc; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 1rem; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(56,189,248,0.4); background: rgba(56,189,248,0.05); }
        .option.selected { border-color: var(--sky); background: rgba(56,189,248,0.08); }
        .option.correct { border-color: var(--success); background: rgba(34,197,94,0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239,68,68,0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled { opacity: 1; } .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--sky); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.checking { display: block; background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.35); color: #cbd5e1; }
        .feedback.correct { display: block; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4); color: var(--sky); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--sky); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--sky); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); } .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4) !important; color: var(--sky); }
        .btn-retry:hover { background: var(--sky); color: #fff; }
        .btn-hub { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }
        @media (max-width: 640px) { .quiz-container { padding: 1rem; } .question-card { padding: 1.25rem; } .quiz-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Cloud Base Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz 5: Backup & Restore</h1>
            <p class="subtitle">Full, incremental, differential backups, RPO/RTO, snapshots, 3-2-1 rule</p>
            <div class="meta"><span>Week 3</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS2145C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Cloud Base Hub</a>
            </div>
        </div>
    </div>
    <script>
var questions = [{"q":"Which backup type copies ALL data every time it runs?","opts":["Incremental","Differential","Full","Snapshot"],"exp":"Full backup copies all data regardless of what changed. Largest storage, longest backup time, but simplest restore."},{"q":"RPO stands for:","opts":["Recovery Point Objective","Recovery Process Operation","Remote Point of Origin","Redundancy Protocol Overhead"],"exp":"RPO (Recovery Point Objective) is the maximum acceptable amount of data loss, measured in time. RPO of 1 hour means you can lose at most 1 hour of data."},{"q":"The 3-2-1 backup rule requires:","opts":["3 copies, 2 sites, 1 provider","3 copies, 2 different media, 1 offsite","3 providers, 2 regions, 1 backup","3 regions, 2 copies, 1 encryption key"],"exp":"3-2-1: three copies of data, on two different media types, with at least one copy stored offsite (different geographic location)."},{"q":"Incremental backups copy:","opts":["All data","Data changed since the last full backup","Data changed since the LAST backup (full or incremental)","Only metadata"],"exp":"Incremental copies only what changed since the last backup of any type. Fastest backup and smallest storage, but restore requires the full chain."},{"q":"An application-consistent snapshot ensures:","opts":["The disk blocks are copied","All write buffers are flushed before capture","The snapshot is taken at midnight","The backup is encrypted"],"exp":"Application-consistent snapshots flush write buffers and quiesce I/O before capturing. This prevents database corruption from in-flight transactions."},{"q":"Which metric defines the maximum acceptable downtime?","opts":["RPO","RTO","SLA","MTBF"],"exp":"RTO (Recovery Time Objective) is the maximum acceptable downtime. RTO of 4 hours means the system must be restored within 4 hours of failure."},{"q":"S3 Glacier Deep Archive is best for:","opts":["Frequently accessed data","Real-time analytics","Long-term compliance data accessed rarely","Database backups accessed daily"],"exp":"Glacier Deep Archive is the cheapest tier, designed for data accessed once or twice per year. Retrieval takes hours. Perfect for 7-year compliance retention."},{"q":"Synchronous replication provides:","opts":["Zero data loss (RPO = 0)","RPO of 1 hour","Weekly backup","Monthly archival"],"exp":"Synchronous replication writes to both primary and replica simultaneously. Zero data loss but adds write latency. Used within same region/AZ."},{"q":"How often should restore procedures be tested?","opts":["Never","Once at deployment","Quarterly","Only after a disaster"],"exp":"Test restores quarterly minimum. Pick a random backup, restore to an isolated environment, validate integrity. An untested backup is not reliable."},{"q":"Differential backups copy data changed since:","opts":["The last backup of any type","The last full backup","The previous day","The last incremental"],"exp":"Differential copies all changes since the last FULL backup. Larger than incremental but simpler restore: just the full backup + latest differential."},{"q":"Which AWS service provides centralized backup management for EC2, RDS, and EBS?","opts":["AWS S3","AWS Backup","AWS CloudFormation","AWS Lambda"],"exp":"AWS Backup is a centralized service for scheduling, managing, and monitoring backups across EC2, EBS, RDS, DynamoDB, EFS, and more."},{"q":"Geo-replication protects against:","opts":["Application bugs","Regional disasters","User errors","Performance issues"],"exp":"Geo-replication copies data across geographic regions. Protects against region-wide failures like earthquakes, power grid outages, or fiber cuts."},{"q":"A GFS (Grandfather-Father-Son) retention scheme keeps:","opts":["Only the most recent backup","Daily, weekly, monthly, and yearly backups at different retention periods","All backups forever","Only full backups"],"exp":"GFS retains daily (son) for 30 days, weekly (father) for 12 weeks, monthly (grandfather) for 12 months, yearly for 7+ years. Standard retention pattern."},{"q":"Point-in-time recovery (PITR) for databases enables:","opts":["Restoring to any second within the retention window","Only restoring to the last full backup","Restoring individual tables only","Restoring to midnight only"],"exp":"PITR uses transaction logs to restore a database to any point in time within the retention window (e.g., any second in the last 35 days for RDS)."},{"q":"What is the PRIMARY risk of storing all backup copies in the same region?","opts":["Higher cost","Slower restore times","A regional disaster destroys all copies","Compliance violation"],"exp":"If all copies are in the same region and that region has a catastrophic failure (earthquake, flood), all backups are lost. Cross-region backup is essential."}];
var current = 0, score = 0, answered = false, TOTAL = questions.length;
function loadQuestion() {
    var q = questions[current];
    document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
    document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
    document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
    document.getElementById('questionText').innerHTML = q.q;
    var html = '', letters = ['A','B','C','D'];
    for (var i = 0; i < q.opts.length; i++) {
        html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>';
    }
    document.getElementById('optionsEl').innerHTML = html;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('nextBtn').disabled = true;
    answered = false;
}
var studentAnswers = {};
        var QUIZ_ID = 'cb-w3-backup-quiz';
        // Validate ONE answer server-side via gradeQuiz; key never reaches the client (QC-57).
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { return !!(r && r.results && r.results[qIndex] && r.results[qIndex].correct); })
                .catch(function () { return null; });
        }
        // Record the pick, validate SERVER-SIDE, render instant Correct/Incorrect + explanation.
        function selectAnswer(idx) {
            if (answered) return; answered = true;
            studentAnswers[current] = idx;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }
            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking…';
            gradeOne(current, idx).then(function (correct) {
                if (correct === null) { opts[idx].classList.add('incorrect'); fb.className = 'feedback incorrect'; fb.textContent = 'Could not verify answer. ' + q.exp; }
                else { opts[idx].classList.add(correct ? 'correct' : 'incorrect'); if (correct) { score++; } fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect'); fb.textContent = (correct ? 'Correct! ' : 'Incorrect. ') + q.exp; }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
            });
        }
function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }
function showResults() {
    document.getElementById('questionCard').style.display = 'none';
    document.querySelector('.progress-bar-wrap').style.display = 'none';
    document.getElementById('resultsCard').style.display = 'block';
    var pct = Math.round((score / TOTAL) * 100);
    var sb = document.getElementById('finalScore');
    sb.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
    sb.className = pct >= 80 ? 'score-big' : pct >= 70 ? 'score-big mid' : 'score-big low';
    var msg = pct >= 90 ? 'Excellent! Strong grasp of the material.' : pct >= 70 ? 'Good work -- you passed. Review missed questions.' : pct >= 50 ? 'Close but not passing. Review the presentations and try again.' : 'More study needed. Return to the course materials.';
    document.getElementById('scoreMsg').textContent = msg;
    if (pct >= 70 && typeof ModuleProgress !== 'undefined') { ModuleProgress.complete('cloud', 'cb-w3-backup-quiz', { returnUrl: '../index.html' }); }
}
function restartQuiz() {
    current = 0; score = 0; answered = false;
    document.getElementById('scoreLabel').textContent = 'Score: 0';
    document.getElementById('questionCard').style.display = '';
    document.querySelector('.progress-bar-wrap').style.display = '';
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('nextBtn').textContent = 'Next Question';
    loadQuestion();
}
loadQuestion();
    </script>

</body>
</html>
