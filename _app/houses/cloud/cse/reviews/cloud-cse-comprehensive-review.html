ReviewEngine.init({
  containerId: 'review-container',
  title: 'CSE v1 Comprehensive Review',
  storageKey: 'hexworth_cse_review',
  houseId: 'cloud',

  categories: [

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 1 — Cloud Foundations
    // Covers: Module 1 — service models, deployment models, NIST characteristics,
    //         shared responsibility, and core cloud concepts.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Cloud Foundations',
      questions: [
        {
          value: 200,
          question: 'EC-Council CSE defines the three primary cloud service models. Name all three and briefly describe what each provider delivers.',
          options: [
            'IaaS, PaaS, SaaS — Infrastructure (servers/storage), Platform (dev environment/runtime), Software (ready-to-use applications)',
            'Public, Private, Hybrid — on-demand resources from different ownership models',
            'CaaS, FaaS, DBaaS — Containers, Functions, and Databases as a Service',
            'Compute, Storage, Network — the three pillars of virtualized infrastructure'
          ],
          correct: 0,
          explanation: 'The three NIST-recognized cloud service models are: IaaS (Infrastructure as a Service) — the provider delivers virtualized compute, storage, and networking; the customer manages OS and above. PaaS (Platform as a Service) — the provider adds the OS, runtime, and middleware; the customer manages only applications and data. SaaS (Software as a Service) — the provider delivers the complete application; the customer only uses it. CSE exam maps each model to a distinct security boundary within the shared responsibility model.'
        },
        {
          value: 400,
          question: 'A company migrates its e-commerce platform to a public cloud provider. Their security auditor asks who is responsible for patching the hypervisor. Under the shared responsibility model, who owns this responsibility?',
          options: [
            'The customer — they control all software on their leased instances',
            'Both parties equally — the customer patches guest OS, the provider patches hypervisor',
            'The cloud provider — they own and manage the underlying physical and virtualization infrastructure',
            'A third-party managed service provider — the cloud agreement assigns it to them'
          ],
          correct: 2,
          explanation: 'The shared responsibility model divides security duties at a well-defined boundary. The cloud provider is always responsible for the physical hardware, data center facilities, network infrastructure, and the hypervisor/virtualization layer. The customer takes responsibility from the guest OS upward — OS patches, application code, data encryption, and identity management. The auditor\'s question about the hypervisor sits firmly on the provider\'s side. Misunderstanding this boundary is a leading cause of cloud misconfiguration incidents.'
        },
        {
          value: 600,
          question: 'An organization processes classified government data and legally cannot allow that data to reside on shared infrastructure. Which cloud deployment model satisfies this requirement?',
          options: [
            'Public cloud — providers offer dedicated compliance regions for government workloads',
            'Community cloud — shared among organizations with similar compliance requirements',
            'Private cloud — all resources are provisioned exclusively for a single organization, either on-premises or hosted',
            'Hybrid cloud — sensitive data stays on-premises while analytics run in public cloud'
          ],
          correct: 2,
          explanation: 'A private cloud provisions all infrastructure solely for one organization. No other tenant shares the underlying hardware, making it the correct model when regulations prohibit data residency on multi-tenant infrastructure. It can be hosted on-premises (internal private cloud) or at a dedicated co-location facility managed by a third party. Community clouds are shared among organizations with common missions but still involve multiple tenants. Hybrid clouds split workloads but do not guarantee full isolation for all data.'
        },
        {
          value: 800,
          question: 'A DevOps team needs maximum control over the OS kernel, custom networking drivers, and bare-metal performance tuning while still using cloud infrastructure. Which service model provides the highest level of customer infrastructure control?',
          options: [
            'SaaS — customers fully control application settings and configurations',
            'PaaS — the runtime environment is customer-configurable',
            'IaaS — customers receive virtualized compute and manage everything from the OS upward, including kernel parameters and custom drivers',
            'FaaS — serverless functions provide direct kernel access through event handlers'
          ],
          correct: 2,
          explanation: 'IaaS gives the customer the most control in the standard service model hierarchy. The provider delivers virtualized or bare-metal compute, block storage, and networking. The customer installs and configures the OS, applies custom kernel parameters, installs specialized drivers, and manages middleware and applications. PaaS abstracts the OS and runtime away, removing that control. SaaS provides the least control — customers only configure application preferences. FaaS (serverless) abstracts even further, providing no OS-level visibility.'
        },
        {
          value: 1000,
          question: 'NIST SP 800-145 defines five essential characteristics of cloud computing. A vendor claims to offer "cloud services" but their platform requires a 72-hour provisioning lead time, has no usage metering, and resources are pre-allocated in fixed blocks. How many of the five NIST characteristics does this platform violate?',
          options: [
            'One characteristic violated — only the metering requirement is missing',
            'Two characteristics violated — metering and elasticity are absent',
            'Three characteristics violated — on-demand self-service, rapid elasticity, and measured service are all absent from the described platform',
            'Zero — NIST characteristics are aspirational guidelines, not hard requirements'
          ],
          correct: 2,
          explanation: 'NIST SP 800-145 defines five essential characteristics: (1) On-demand self-service — the 72-hour lead time violates this; customers must provision instantly without human interaction. (2) Broad network access — not directly violated by the description. (3) Resource pooling — not directly violated. (4) Rapid elasticity — fixed pre-allocated blocks violate this; resources must scale automatically and appear infinite. (5) Measured service — no usage metering violates this; cloud systems must automatically control and optimize resources using metering at some level. Three characteristics are violated: on-demand self-service, rapid elasticity, and measured service. CSE candidates must memorize all five characteristics as they appear directly on the exam.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 2 — IAM & Access
    // Covers: Module 2 — identity federation, RBAC, least privilege, MFA,
    //         zero trust architecture, SSO protocols, and access control models.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'IAM & Access',
      questions: [
        {
          value: 200,
          question: 'A user logging into a cloud console is prompted to enter a one-time code from their authenticator app after entering their password. What security mechanism is this?',
          options: [
            'Single Sign-On (SSO) — one credential grants access to multiple systems',
            'Multi-Factor Authentication (MFA) — requires two or more verification factors from separate categories',
            'Biometric authentication — identifies users by physical characteristics',
            'Certificate-based authentication — validates identity through a PKI certificate'
          ],
          correct: 1,
          explanation: 'Multi-Factor Authentication (MFA) requires a user to present two or more authentication factors from distinct categories: something you know (password), something you have (authenticator app generating a TOTP), and something you are (biometrics). The described scenario combines the password (know) with a time-based one-time code (have). MFA is one of the most effective controls against credential theft because a stolen password alone is insufficient to authenticate. CSE emphasizes MFA as a foundational IAM control for all cloud environments.'
        },
        {
          value: 400,
          question: 'A company creates cloud roles such as "Database Administrator," "Security Analyst," and "Developer." Permissions are attached to these roles, not to individual user accounts. What access control model is being implemented?',
          options: [
            'DAC (Discretionary Access Control) — resource owners assign permissions directly',
            'MAC (Mandatory Access Control) — the system enforces policy based on classification labels',
            'RBAC (Role-Based Access Control) — permissions are assigned to roles which are then assigned to users',
            'ABAC (Attribute-Based Access Control) — permissions depend on user, resource, and environment attributes'
          ],
          correct: 2,
          explanation: 'Role-Based Access Control (RBAC) centralizes permission management by defining roles that represent job functions. Users are assigned to roles rather than receiving individual permissions. This simplifies administration — when a user changes jobs, their role assignment changes rather than requiring line-by-line permission adjustments. RBAC is the dominant model in cloud IAM systems (AWS IAM Roles, Azure RBAC, GCP IAM). It supports the principle of least privilege when roles are well-scoped. Contrast with ABAC which evaluates dynamic conditions like time-of-day or IP address alongside user and resource attributes.'
        },
        {
          value: 600,
          question: 'A cloud administrator grants a developer full S3 bucket permissions because the developer asked for access to "upload files." Six months later, the developer still has full permissions and has never deleted a file. Which security principle was violated from the start?',
          options: [
            'Separation of duties — multiple people should approve access requests',
            'Need-to-know — information access should be restricted to job-relevant data',
            'Principle of least privilege — users should be granted only the minimum permissions necessary to perform their job function',
            'Defense in depth — multiple security layers should protect every resource'
          ],
          correct: 2,
          explanation: 'The Principle of Least Privilege (PoLP) requires that each user, process, or service receive only the minimum permissions required for their specific task — nothing more. Granting full S3 permissions (which includes read, write, delete, and ACL management) when only upload capability was needed is a direct violation. PoLP reduces the blast radius of account compromise — if the developer\'s credentials are stolen, the attacker is limited to upload capability only, not deletion or data exfiltration of all objects. CSE pairs PoLP with regular access reviews (entitlement reviews) to identify privilege creep over time.'
        },
        {
          value: 800,
          question: 'A large enterprise wants employees to authenticate once with their corporate Active Directory and then access AWS, Salesforce, and Google Workspace without re-entering credentials. Which authentication protocol is purpose-built for this federated SSO scenario?',
          options: [
            'LDAP (Lightweight Directory Access Protocol) — queries directory services for authentication',
            'Kerberos — ticket-based authentication for Windows domain environments',
            'SAML 2.0 (Security Assertion Markup Language) — an XML-based standard for federated identity that enables SSO across cloud services using Identity Provider assertions',
            'RADIUS — provides centralized AAA for network access authentication'
          ],
          correct: 2,
          explanation: 'SAML 2.0 (Security Assertion Markup Language) is the dominant standard for enterprise federated SSO. It uses XML-based assertions passed between an Identity Provider (IdP — your corporate Active Directory via ADFS or Azure AD) and Service Providers (AWS, Salesforce, Google Workspace). The user authenticates once to the IdP, which issues a signed SAML assertion. The service provider trusts this assertion without needing the user\'s credentials. OAuth 2.0 and OIDC are alternatives more common in consumer-facing applications. CSE covers both SAML and OAuth/OIDC as valid federation protocols. LDAP and Kerberos are authentication mechanisms but not designed for cross-organizational SSO federation.'
        },
        {
          value: 1000,
          question: 'A zero trust architecture review board rejects a proposed design that says "trust traffic from inside the corporate VPN without additional verification." What is the core principle of zero trust that this design violates?',
          options: [
            'Assume breach — all systems should be designed assuming compromise has already occurred',
            'Never trust, always verify — every access request must be authenticated and authorized regardless of network location or origin; network location alone does not confer trust',
            'Least privilege — users should only access resources they need for their specific role',
            'Defense in depth — multiple security controls should protect every resource layer'
          ],
          correct: 1,
          explanation: 'Zero Trust Architecture (ZTA) is defined by the core principle "never trust, always verify." Traditional perimeter security granted implicit trust to traffic originating from inside the network or VPN — this is exactly what zero trust eliminates. In ZTA, trust is never assumed based on network location. Every access request — whether from inside or outside the corporate network — must be authenticated, authorized, and continuously validated. The rejected design assumes VPN users are trustworthy, which violates zero trust. ZTA requires strong identity verification, device health checks, and micro-segmentation regardless of where the request originates. NIST SP 800-207 defines the complete ZTA framework tested on CSE.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 3 — Data & Crypto
    // Covers: Module 3 — encryption at rest and in transit, DLP, key management,
    //         data classification, envelope encryption, and cryptographic standards.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Data & Crypto',
      questions: [
        {
          value: 200,
          question: 'A healthcare provider stores patient records in a cloud database. The security team requires that the data remain unreadable if an attacker gains direct access to the underlying disk volumes. Which encryption type addresses this threat?',
          options: [
            'Encryption in transit — protects data moving across networks using TLS',
            'Encryption at rest — protects stored data on disk by encrypting volumes, objects, or database records so raw disk access yields only ciphertext',
            'End-to-end encryption — protects data from sender to recipient across all intermediaries',
            'Application-layer encryption — encrypts data within the application before sending to any storage'
          ],
          correct: 1,
          explanation: 'Encryption at rest protects data stored on persistent media — disk volumes, object storage buckets, database tablespaces, and backup files. If an attacker gains physical access to a disk or obtains a snapshot, they retrieve only ciphertext without the encryption keys. Cloud providers offer multiple levels: server-side encryption (SSE) where the provider manages keys, customer-managed keys (CMK) where the customer controls key material in a KMS, and client-side encryption where the application encrypts before sending to storage. For HIPAA-protected PHI, encryption at rest is a required safeguard under the Security Rule.'
        },
        {
          value: 400,
          question: 'An employee emails an entire customer database to their personal Gmail account before resigning. Which security control is specifically designed to detect and prevent this type of unauthorized data transfer?',
          options: [
            'IDS/IPS — Intrusion Detection/Prevention System monitors for network attacks and anomalies',
            'SIEM — Security Information and Event Management aggregates and analyzes log data',
            'DLP (Data Loss Prevention) — policies and tools that identify, monitor, and block unauthorized transfer of sensitive data based on content inspection',
            'CASB — Cloud Access Security Broker proxies cloud service traffic for visibility and control'
          ],
          correct: 2,
          explanation: 'Data Loss Prevention (DLP) is the control purpose-built for this scenario. DLP tools inspect content in motion (network DLP), at rest (storage DLP), and in use (endpoint DLP). They identify sensitive data using patterns — credit card numbers (Luhn algorithm), SSNs, HIPAA-defined PHI, or custom keywords — and apply policies to block, quarantine, or alert on unauthorized transfers. In the email scenario, network DLP or email gateway DLP would inspect the outbound email, identify the customer database content, and block the transmission before it reaches Gmail. CASBs provide similar controls for cloud service traffic specifically.'
        },
        {
          value: 600,
          question: 'A security operations team argues about how often to rotate encryption keys used for a critical production database. What is the primary security purpose of key rotation?',
          options: [
            'Key rotation improves encryption strength by generating stronger keys each time',
            'Key rotation limits the exposure window if a key is compromised — a rotated key restricts any attacker who obtained the old key to only the data encrypted with that key during its active period',
            'Key rotation is a compliance checkbox with no real security benefit',
            'Key rotation ensures compatibility with newer encryption algorithms by upgrading the key format'
          ],
          correct: 1,
          explanation: 'Key rotation limits the blast radius of a key compromise. If an encryption key is compromised and never rotated, an attacker can decrypt all data ever encrypted with that key — potentially years of records. With regular rotation, a compromised key only exposes data from its active period. CSE covers key rotation as a component of a complete Key Management Strategy: key generation, storage, distribution, rotation, and destruction. Cloud KMS services (AWS KMS, Azure Key Vault, GCP Cloud KMS) support automated annual rotation. Note: rotation changes the key but does not require re-encrypting all existing data — envelope encryption handles this elegantly.'
        },
        {
          value: 800,
          question: 'A company\'s data classification policy has four tiers. Which tier correctly describes information that is already published on the company\'s public website and press releases?',
          options: [
            'Confidential — internal business information shared only with employees',
            'Internal/Private — information intended for internal use but not secret',
            'Restricted/Secret — highly sensitive data requiring strict access controls',
            'Public/Unclassified — information approved for public release with no access restrictions'
          ],
          correct: 3,
          explanation: 'Data classification assigns sensitivity labels to determine appropriate handling requirements. Public/Unclassified data is already in the public domain — press releases, marketing materials, published product specifications, and website content. This tier requires minimal security controls because disclosure causes no harm. Moving up: Internal/Private is not secret but not intended for external audiences. Confidential covers business-sensitive information like financial forecasts or trade secrets. Restricted/Secret covers the most sensitive data — PII, PHI, payment card data — requiring encryption, strict access controls, and audit logging. CSE maps each classification tier to corresponding security controls and handling procedures.'
        },
        {
          value: 1000,
          question: 'A cloud architect implements a system where each S3 object is encrypted with a unique data encryption key (DEK), and each DEK is itself encrypted by a master key stored in AWS KMS. Why is this two-layer approach superior to encrypting all data with a single master key?',
          options: [
            'It is not superior — using a single master key is simpler and equally secure',
            'Envelope encryption allows key rotation without re-encrypting all data objects. Rotating the master key only requires re-encrypting the DEKs (which are small), not re-encrypting the potentially petabytes of actual data objects; it also limits blast radius since a compromised DEK only exposes one object',
            'Two-layer encryption doubles the computational overhead and is only used when regulatory compliance mandates it',
            'The DEK encrypts the master key, which then encrypts data — this nested structure prevents replay attacks'
          ],
          correct: 1,
          explanation: 'Envelope encryption is the industry-standard approach for large-scale data encryption. The architecture: a Data Encryption Key (DEK) — typically AES-256 — encrypts the actual data. The master key (Key Encryption Key/KEK) stored in KMS encrypts only the DEK. Each object gets a unique DEK so compromise of one DEK exposes only one object, not the entire dataset. Key rotation becomes operationally feasible: rotating the master key requires re-encrypting the DEKs (small operations), not re-processing potentially petabytes of data. The encrypted DEK travels with the data object, and KMS decrypts it on-demand when authorized access occurs. AWS S3 SSE-KMS, Azure Storage with CMK, and GCP CSEK all implement envelope encryption.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 4 — Network Defense
    // Covers: Modules 4-5 — VPCs, WAF, DDoS mitigation, microsegmentation,
    //         OWASP Top 10, network security controls, and secure architecture.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Network Defense',
      questions: [
        {
          value: 200,
          question: 'A cloud architect needs to create an isolated network environment within AWS where they control the IP address range, subnets, route tables, and gateways. What cloud construct provides this capability?',
          options: [
            'CDN (Content Delivery Network) — distributes content globally from edge locations',
            'VPC (Virtual Private Cloud) — a logically isolated section of the cloud network where you define the IP space, subnets, and control inbound/outbound traffic',
            'Security Group — a stateful virtual firewall attached to cloud instances',
            'Transit Gateway — connects multiple VPCs and on-premises networks together'
          ],
          correct: 1,
          explanation: 'A Virtual Private Cloud (VPC) is the foundational network isolation construct in cloud environments. Within a VPC, you define: a CIDR block for the IP address range (e.g., 10.0.0.0/16), public and private subnets across availability zones, route tables controlling traffic paths, internet gateways for public internet access, NAT gateways for private subnet internet egress, and security groups/NACLs for traffic filtering. The VPC is logically isolated from other customers — your traffic does not mix with theirs at the network layer. CSE covers VPC design as a core security architecture skill, including subnet segmentation for defense in depth.'
        },
        {
          value: 400,
          question: 'A web application is experiencing automated attacks including SQL injection attempts, cross-site scripting, and malformed HTTP requests. Which specialized security device inspects Layer 7 HTTP/HTTPS traffic and blocks these web-specific attacks?',
          options: [
            'Network Firewall — filters traffic based on IP, port, and protocol at Layers 3-4',
            'IDS (Intrusion Detection System) — detects attacks but does not block them inline',
            'WAF (Web Application Firewall) — inspects HTTP/HTTPS request and response bodies, headers, and URLs to detect and block application-layer attacks including OWASP Top 10 threats',
            'Load Balancer — distributes traffic across servers and can terminate SSL connections'
          ],
          correct: 2,
          explanation: 'A Web Application Firewall (WAF) operates at Layer 7 (application layer) and understands HTTP/HTTPS protocol semantics. It can inspect URL parameters, POST body content, HTTP headers, and cookies to detect attacks like SQL injection, XSS, CSRF, and path traversal. Traditional network firewalls operate at Layers 3-4 and cannot inspect HTTP payloads. Cloud WAFs (AWS WAF, Azure Application Gateway WAF, Cloudflare WAF) use managed rule sets (OWASP CRS — Core Rule Set) that are regularly updated. CSE positions WAF as a critical component of a web application security architecture, typically deployed inline behind a load balancer or CDN.'
        },
        {
          value: 600,
          question: 'An adversary floods a popular cloud-hosted API with millions of requests per second from thousands of compromised machines worldwide, causing legitimate users to receive timeout errors. What type of attack is this?',
          options: [
            'Man-in-the-Middle (MitM) attack — an attacker intercepts communications between two parties',
            'SQL Injection — malicious code is inserted into database queries',
            'DDoS (Distributed Denial of Service) — a coordinated flood of traffic from multiple sources overwhelms a target system, exhausting its resources and making it unavailable to legitimate users',
            'Brute Force attack — automated attempts to guess authentication credentials'
          ],
          correct: 2,
          explanation: 'A Distributed Denial of Service (DDoS) attack uses a botnet — thousands to millions of compromised machines (bots) — to generate massive traffic volumes targeting a single system. The "distributed" aspect makes simple IP blocking ineffective. DDoS attacks can target different layers: volumetric attacks (Gbps of bandwidth — UDP floods), protocol attacks (SYN floods exhausting connection state tables), and application-layer attacks (HTTP floods targeting specific endpoints). Cloud DDoS mitigation (AWS Shield, Azure DDoS Protection, Cloudflare Magic Transit) operates at the network edge to absorb traffic before it reaches the origin. CSE covers DDoS as a primary availability threat in cloud environments.'
        },
        {
          value: 800,
          question: 'A company\'s cloud network contains hundreds of microservices. Security architects want to ensure that if one microservice is compromised, the attacker cannot laterally move to other services. Which network security approach divides the network into small isolated zones where each service can only communicate with explicitly permitted peers?',
          options: [
            'Network segmentation using VLANs — divides networks into broadcast domains at Layer 2',
            'VPN tunneling — encrypts traffic between network segments to prevent eavesdropping',
            'Microsegmentation — applies fine-grained security policies at the individual workload level, enforcing east-west traffic controls between services regardless of IP address or network location',
            'DMZ architecture — places internet-facing servers in a buffer zone between external and internal networks'
          ],
          correct: 2,
          explanation: 'Microsegmentation applies security policy at the individual workload or service level, not just at network boundaries. Traditional segmentation with firewalls and VLANs protects north-south traffic (entering/leaving the network) but allows broad east-west traffic (service-to-service) within the same segment. Microsegmentation controls east-west traffic by defining granular allow-lists: "Service A can talk to Service B on port 5432, nothing else." This is implemented via software-defined networking (SDN), service mesh (Istio/Envoy), or cloud-native security groups applied per workload. If Service B is compromised, the attacker cannot reach Service C because no allow rule permits it. CSE positions microsegmentation as a core zero trust enabler for cloud-native environments.'
        },
        {
          value: 1000,
          question: 'A penetration tester submits a login form with the username: admin\'-- and gains full administrative access without knowing the password. Which OWASP Top 10 vulnerability allowed this attack?',
          options: [
            'A03:2021 Injection (SQL Injection) — malicious input is interpreted as a database command, altering the query logic to bypass authentication',
            'A07:2021 Identification and Authentication Failures — weak passwords allowed credential guessing',
            'A01:2021 Broken Access Control — the application fails to enforce access restrictions on functions',
            'A02:2021 Cryptographic Failures — passwords stored in plaintext enabled the bypass'
          ],
          correct: 0,
          explanation: 'SQL Injection (SQLi) — OWASP A03:2021 — occurs when untrusted user input is included in database queries without sanitization. The input admin\'-- closes the SQL string at the single quote and then uses -- to comment out the rest of the query (including the password check). The resulting query becomes SELECT * FROM users WHERE username=\'admin\'-- AND password=\'anything\' where the password clause is ignored. The fix: parameterized queries (prepared statements) separate SQL code from data so no user input can alter query structure. Input validation and WAF rules provide defense in depth. CSE dedicates significant coverage to OWASP Top 10 as a framework for understanding application security in cloud environments.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 5 — Monitor & Respond
    // Covers: Module 6 — SIEM, incident response lifecycle, threat hunting,
    //         cloud-native logging (CloudTrail, Azure Monitor), IOC vs IOA,
    //         and security operations in cloud environments.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Monitor & Respond',
      questions: [
        {
          value: 200,
          question: 'A security operations center needs to correlate logs from cloud instances, network devices, identity providers, and endpoint agents into a single platform that triggers automated alerts when attack patterns are detected. Which system provides this centralized security monitoring capability?',
          options: [
            'Vulnerability Scanner — identifies known security weaknesses in systems and applications',
            'SIEM (Security Information and Event Management) — aggregates, normalizes, and analyzes security logs from multiple sources to detect threats and generate alerts through correlation rules',
            'EDR (Endpoint Detection and Response) — monitors endpoint activity for malicious behavior',
            'WAF (Web Application Firewall) — filters malicious web traffic at the application layer'
