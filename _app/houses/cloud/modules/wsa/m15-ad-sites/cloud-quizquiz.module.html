    <script>
    WSAQuiz.init({
        moduleId: 'm15',
        title: 'M15: AD Sites & Replication',
        nextModule: '../m16-backup-recovery/cloud-presentation.module.html',
        questions: [
            {
                question: "What is the primary purpose of AD sites?",
                options: ["To group users by department", "To control replication traffic and direct clients to local DCs", "To create security boundaries", "To manage group policies"],
            },
            {
                question: "How often does intrasite (within site) replication typically occur?",
                options: ["Every 180 minutes", "Every 15 seconds after a change", "Once per day", "Every hour"],
            },
            {
                question: "What is a site link in Active Directory?",
                options: ["A physical network cable", "A logical connection defining replication between sites", "A DNS record", "A Group Policy link"],
            },
            {
                question: "What does a lower site link cost indicate?",
                options: ["Slower connection preferred", "Faster/better connection preferred", "More expensive bandwidth", "Higher priority GPO"],
            },
            {
                question: "What is the default intersite replication interval?",
                options: ["15 minutes", "60 minutes", "180 minutes (3 hours)", "24 hours"],
            },
            {
                question: "What is a bridgehead server?",
                options: ["The first DC in a domain", "A server that handles intersite replication for a site", "A read-only domain controller", "A DNS server"],
            },
            {
                question: "What happens if a client's IP subnet is not mapped to an AD site?",
                options: ["The client cannot log in", "The client selects a random DC from any site", "An error is logged and authentication fails", "The client uses the default site"],
            },
            {
                question: "What is the role of the KCC (Knowledge Consistency Checker)?",
                options: ["Checks password complexity", "Automatically creates and maintains replication topology", "Validates DNS records", "Manages site link schedules"],
            },
            {
                question: "Which command shows AD replication status?",
                options: ["netstat /repl", "repadmin /replsummary", "gpupdate /force", "dcdiag /test:dns"],
            },
            {
                question: "What type of replication does an RODC use?",
                options: ["Bidirectional replication", "Multimaster replication", "One-way inbound replication only", "No replication needed"],
            }
        ]
    });
    </script>
