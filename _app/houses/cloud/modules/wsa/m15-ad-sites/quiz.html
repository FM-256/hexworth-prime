<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M15 Quiz: AD Sites & Replication - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>M15: AD Sites & Replication Quiz</h1>
            <p>Test your knowledge of AD Sites and replication concepts</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="presentation.html" class="results-btn secondary">Review Material</a>
                <a href="../m16-backup-recovery/presentation.html" class="results-btn primary" id="nextModuleBtn">Next Module</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the primary purpose of AD sites?",
                options: ["To group users by department", "To control replication traffic and direct clients to local DCs", "To create security boundaries", "To manage group policies"],
                correct: 1,
                explanation: "AD sites represent physical network topology and control how replication occurs and which DC clients authenticate against."
            },
            {
                question: "How often does intrasite (within site) replication typically occur?",
                options: ["Every 180 minutes", "Every 15 seconds after a change", "Once per day", "Every hour"],
                correct: 1,
                explanation: "Intrasite replication is change-notification based and occurs approximately 15 seconds after a change is made."
            },
            {
                question: "What is a site link in Active Directory?",
                options: ["A physical network cable", "A logical connection defining replication between sites", "A DNS record", "A Group Policy link"],
                correct: 1,
                explanation: "Site links define the logical connections between sites and control how replication flows between them."
            },
            {
                question: "What does a lower site link cost indicate?",
                options: ["Slower connection preferred", "Faster/better connection preferred", "More expensive bandwidth", "Higher priority GPO"],
                correct: 1,
                explanation: "Lower cost means the path is preferred. Cost typically represents inverse of bandwidth - faster links should have lower costs."
            },
            {
                question: "What is the default intersite replication interval?",
                options: ["15 minutes", "60 minutes", "180 minutes (3 hours)", "24 hours"],
                correct: 2,
                explanation: "The default replication interval for site links is 180 minutes (3 hours), configurable down to 15 minutes minimum."
            },
            {
                question: "What is a bridgehead server?",
                options: ["The first DC in a domain", "A server that handles intersite replication for a site", "A read-only domain controller", "A DNS server"],
                correct: 1,
                explanation: "Bridgehead servers are designated to handle replication traffic between sites, reducing the number of cross-site connections."
            },
            {
                question: "What happens if a client's IP subnet is not mapped to an AD site?",
                options: ["The client cannot log in", "The client selects a random DC from any site", "An error is logged and authentication fails", "The client uses the default site"],
                correct: 1,
                explanation: "Clients with unmapped subnets may authenticate against any DC, potentially causing slow logons over WAN links."
            },
            {
                question: "What is the role of the KCC (Knowledge Consistency Checker)?",
                options: ["Checks password complexity", "Automatically creates and maintains replication topology", "Validates DNS records", "Manages site link schedules"],
                correct: 1,
                explanation: "The KCC runs on every DC and automatically creates/maintains the replication connection objects."
            },
            {
                question: "Which command shows AD replication status?",
                options: ["netstat /repl", "repadmin /replsummary", "gpupdate /force", "dcdiag /test:dns"],
                correct: 1,
                explanation: "repadmin /replsummary shows a summary of replication status across all domain controllers."
            },
            {
                question: "What type of replication does an RODC use?",
                options: ["Bidirectional replication", "Multimaster replication", "One-way inbound replication only", "No replication needed"],
                correct: 2,
                explanation: "Read-Only Domain Controllers (RODCs) only receive replication; they cannot send changes to other DCs."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (!passed) {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
