        .comparison-card li:last-child { border-bottom: none; }
        .code-block { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.9rem; overflow-x: auto; margin: 15px 0; white-space: pre-wrap; }
        .code-block .comment { color: #6a9955; }
        .code-block .cmdlet { color: #dcdcaa; }
        .code-block .param { color: #9cdcfe; }
        .code-block .string { color: #ce9178; }
        .code-block .prompt { color: #60a5fa; }
        .code-block .command { color: #e0e0e0; }
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .tool-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; }
        .tool-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-card h5 { color: var(--accent-blue); margin-bottom: 8px; }
        .tool-card p { font-size: 0.85rem; color: var(--text-secondary); }
        .info-box { background: rgba(0, 120, 212, 0.1); border-left: 4px solid var(--azure-blue); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .warning-box { background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--warning-color); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .event-types { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .event-type { padding: 15px 10px; border-radius: 8px; text-align: center; font-size: 0.8rem; }
        .event-type.error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error-color); color: var(--error-color); }
        .event-type.warning { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning-color); color: var(--warning-color); }
        .event-type.info { background: rgba(96, 165, 250, 0.2); border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .event-type.success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--success-color); color: var(--success-color); }
        .event-type.critical { background: rgba(127, 29, 29, 0.4); border: 1px solid #dc2626; color: #fca5a5; }
        .nav-footer { background: var(--secondary-bg); padding: 12px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); }
        .footer-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>

                        <div style="font-size: 5rem; margin-bottom: 20px;">📊</div>
                        <h2 style="color: var(--warning-color); font-size: 1.8rem; margin-bottom: 15px;">Module 07: Visibility & Control</h2>

            // Slide 2: Event Viewer
            {
                title: "Event Viewer",
                content: `
                    <p style="margin-bottom: 20px;">Event Viewer (eventvwr.msc) is the central location for system logs and application events:</p>
                    <div class="event-types">
                        <div class="event-type critical">🔴<br>Critical</div>
                        <div class="event-type error">❌<br>Error</div>
                        <div class="event-type warning">⚠️<br>Warning</div>
                        <div class="event-type info">ℹ️<br>Information</div>
                        <div class="event-type success">✓<br>Success Audit</div>
                    </div>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4>📁 Windows Logs</h4>
                            <ul>
                                <li><strong>Application</strong> - App-generated events</li>
                                <li><strong>Security</strong> - Logon, access audits</li>
                                <li><strong>System</strong> - OS and drivers</li>
                                <li><strong>Setup</strong> - Installation events</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">📂 Applications and Services</h4>
                            <ul>
                                <li><strong>Microsoft → Windows</strong> - Feature logs</li>
                                <li><strong>DNS Server</strong> - DNS queries/errors</li>
                                <li><strong>Directory Service</strong> - AD events</li>
                                <li><strong>PowerShell</strong> - Script execution</li>
                            </ul>
                        </div>
                    </div>
                    <p>Filter the System log for error-level events to find recent issues.</p>
                    <div class="code-block">
<span class="comment"># Pull the last 50 System events and filter for errors only</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-WinEvent</span> <span class="param">-LogName</span> System <span class="param">-MaxEvents</span> 50 | <span class="command">Where-Object</span> { $_.LevelDisplayName -eq <span class="string">'Error'</span> }
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">TimeCreated            Id    LevelDisplayName    Message</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
6/15/2025 8:42:01 AM   7034  <span class="command">Error</span>               The DNS Client service terminated unexpectedly.
6/15/2025 7:15:33 AM   1014  <span class="command">Error</span>               Name resolution for the name dc02 timed out.
                    </div>
                `
            },
            // Slide 3: Performance Monitor
            {
                title: "Performance Monitor",
                content: `
                    <p style="margin-bottom: 20px;">Performance Monitor (perfmon.msc) tracks real-time and historical system metrics:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon">📊</div>
                            <h5>Performance Monitor</h5>
                            <p>Real-time graphs of CPU, memory, disk, network counters</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📁</div>
                            <h5>Data Collector Sets</h5>
                            <p>Scheduled collection of performance data over time</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📋</div>
                            <h5>Reports</h5>
                            <p>Analyze collected data with built-in reports</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">⚠️</div>
                            <h5>Alerts</h5>
                            <p>Trigger actions when thresholds are exceeded</p>
                        </div>
                    </div>
                    <ul class="key-points">
                        <li><strong>Processor → % Processor Time</strong> - CPU utilization (healthy: < 80%)</li>
                        <li><strong>Memory → Available MBytes</strong> - Free RAM (healthy: > 10% of total)</li>
                        <li><strong>Physical Disk → Avg. Disk Queue Length</strong> - I/O bottleneck (healthy: < 2)</li>
                        <li><strong>Network Interface → Bytes Total/sec</strong> - Network throughput</li>

                    <p>Grab a real-time CPU usage sample from the performance counter system.</p>
                    <div class="code-block">
<span class="comment"># Read the current total CPU utilization percentage</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Counter</span> <span class="string">'\\Processor(_Total)\\% Processor Time'</span>

<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">Timestamp                CounterSamples</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
6/15/2025 10:32:15 AM    <span class="command">\\\\dc01\\processor(_total)\\% processor time :</span>
                         <span class="command">23.4521</span>
                    </div>
                `

            {
                title: "Windows Admin Center (WAC)",

                    <p style="margin-bottom: 20px;">Browser-based management tool for Windows Server and Windows 10/11:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--wac-purple);">Features</h4>

                                <li>Single pane of glass management</li>

<span class="prompt">PS C:\\&gt;</span> <span class="command">msiexec</span> /i WindowsAdminCenter.msi /qn /L*v log.txt SME_PORT=443 SSL_CERTIFICATE_OPTION=generate

Check log.txt for details if install fails.

                            <h5>Download</h5>

                        <div class="tool-card">

<span class="comment"># Force the WSUS client to detect available updates now</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">wuauclt</span> /detectnow

No console output. Check Windows Update in Settings or

<span class="prompt">ComputerName    Status        Updates</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="command">Server01</span>        <span class="command">InProgress</span>    3 updates queued
                    </div>

                    </div>

                    <p>Discover which performance counter sets are available for monitoring on this server.</p>
                    <div class="code-block">
<span class="comment"># List every available performance counter set by name</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Counter</span> <span class="param">-ListSet</span> * | <span class="command">Select-Object</span> CounterSetName
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">CounterSetName</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="command">Processor</span>
<span class="command">Memory</span>
<span class="command">PhysicalDisk</span>
<span class="command">Network Interface</span>
...
                    </div>

                    <p>Find the top 10 processes consuming the most CPU time on this server.</p>
                    <div class="code-block">
<span class="comment"># Rank processes by CPU consumption, top 10</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Process</span> | <span class="command">Sort-Object</span> CPU <span class="param">-Descending</span> | <span class="command">Select-Object</span> <span class="param">-First</span> 10
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">Handles    NPM(K)    PM(K)    WS(K)    CPU(s)    Id    ProcessName</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
1842       98        285412   290116   <span class="command">482.31</span>    4012  <span class="command">sqlservr</span>
  934       45        112048   118230   <span class="command">215.67</span>    2284  <span class="command">svchost</span>
                    </div>

                    <p>List every service on the server that is currently stopped to find potential issues.</p>
                    <div class="code-block">
<span class="comment"># Show all services with a Stopped status</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Service</span> | <span class="command">Where-Object</span> Status -eq <span class="string">'Stopped'</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">Status      Name              DisplayName</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="command">Stopped</span>     spooler           Print Spooler
<span class="command">Stopped</span>     wuauserv          Windows Update
<span class="command">Stopped</span>     BITS              Background Intelligent Transfer Service
                    </div>

                    <p>Run a performance counter query against multiple remote servers simultaneously.</p>
                    <div class="code-block">
<span class="comment"># Collect CPU usage from two remote servers at once</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Invoke-Command</span> <span class="param">-ComputerName</span> Server01,Server02 <span class="param">-ScriptBlock</span> { Get-Counter <span class="string">'\\Processor(_Total)\\% Processor Time'</span> }
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="prompt">PSComputerName    Timestamp                CounterSamples</span>
<span class="comment"># ─────────────────────────────────────────────────────────────</span>
<span class="command">Server01</span>          6/15/2025 10:32:15 AM    \\\\...\\% processor time : <span class="command">34.12</span>
<span class="command">Server02</span>          6/15/2025 10:32:15 AM    \\\\...\\% processor time : <span class="command">67.89</span>
                    </div>
                `
            },
            // Slide 8: Summary
            {
                title: "Module Summary",
                content: `
                    <ul class="key-points">
                        <li><strong>Event Viewer</strong> centralizes system, security, and application logs for troubleshooting</li>
                        <li><strong>Performance Monitor</strong> tracks real-time metrics and creates data collector sets for analysis</li>
                        <li><strong>Windows Admin Center</strong> provides browser-based, agent-less management of servers and clusters</li>
                        <li><strong>WSUS</strong> centralizes Windows update management with approval workflows and compliance reporting</li>
                        <li><strong>Azure Arc</strong> extends Azure governance (Policy, Monitor, Defender) to on-premises servers</li>
                        <li><strong>PowerShell</strong> enables scriptable monitoring with Get-WinEvent, Get-Counter, and remoting</li>
                    </ul>
                    <div style="margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 8px; text-align: center;">
                        <p style="margin-bottom: 15px;">Ready to practice?</p>
                        <a href="cloud-guilab.module.html" class="header-btn" style="margin-right: 10px;">GUI Lab</a>
                        <a href="cloud-pslab.module.html" class="header-btn" style="margin-right: 10px;">PowerShell Lab</a>
                        <a href="cloud-quizquiz.module.html" class="header-btn">Take Quiz</a>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next →';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'cloud-guilab.module.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
