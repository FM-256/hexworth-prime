    <script>
    WSAQuiz.init({
        moduleId: 'm07',
        title: 'M07: Monitoring & Management',
        nextModule: '../m08-dns/cloud-presentation.module.html',
        questions: [
            {
                question: 'Which tool is used to view Windows event logs?',
                options: [
                    'Task Manager',
                    'Event Viewer',
                    'Resource Monitor',
                    'Device Manager'
                ],
                correct: 1,
                explanation: 'Event Viewer (eventvwr.msc) is the primary tool for viewing and managing Windows event logs including System, Application, and Security logs.'
            },
            {
                question: 'Which event log contains logon and access audit events?',
                options: [
                    'System',
                    'Application',
                    'Security',
                    'Setup'
                ],
                correct: 2,
                explanation: 'The Security log contains security-related events including logon attempts (Event ID 4624/4625), object access, and privilege use. Auditing policies must be enabled to generate these events.'
            },
            {
                question: 'What PowerShell cmdlet queries Windows event logs?',
                options: [
                    'Get-EventLog',
                    'Get-WinEvent',
                    'Read-Event',
                    'Show-EventLog'
                ],
                correct: 1,
                explanation: 'Get-WinEvent is the modern cmdlet for querying Windows event logs. Get-EventLog is older and only works with classic logs. Get-WinEvent supports filtering with -FilterHashtable for efficient queries.'
            },
            {
                question: 'What is a healthy threshold for % Processor Time?',
                options: [
                    'Less than 50%',
                    'Less than 80%',
                    'Less than 95%',
                    'Less than 100%'
                ],
                correct: 1,
                explanation: 'Sustained CPU usage below 80% is generally considered healthy. Above 80% sustained may indicate the server needs more CPU resources, workload optimization, or load balancing.'
            },
            {
                question: 'What performance counter indicates a disk I/O bottleneck?',
                options: [
                    '% Disk Time',
                    'Avg. Disk Queue Length',
                    'Disk Bytes/sec',
                    'Current Disk Queue'
                ],
                correct: 1,
                explanation: 'Avg. Disk Queue Length shows how many I/O requests are waiting in the queue. A sustained value above 2 per physical disk indicates a potential bottleneck. This is the most reliable disk performance indicator.'
            },
            {
                question: 'What is a Data Collector Set in Performance Monitor?',
                options: [
                    'A backup configuration',
                    'A group of counters, traces, and config data collected on a schedule',
                    'A network capture tool',
                    'A log file archive'
                ],
                correct: 1,
                explanation: 'A Data Collector Set is a reusable collection of performance counters, event traces, and system configuration data that can be scheduled to run at specific times. It enables baseline comparisons and trend analysis over time.'
            },
            {
                question: 'What does Windows Admin Center NOT require on managed servers?',
                options: [
                    'Network connectivity',
                    'WinRM enabled',
                    'An agent installed',
                    'PowerShell remoting'
                ],
                correct: 2,
                explanation: 'Windows Admin Center is agent-less -- it uses existing WinRM and PowerShell remoting to manage servers without installing any software on the managed machines. It only requires a gateway installation.'
            },
            {
                question: 'Which memory counter best indicates a potential memory leak?',
                options: [
                    'Available MBytes dropping to zero immediately',
                    'Process Private Bytes steadily increasing over time without releasing',
                    'Pages/sec spiking during application launch',
                    'Cache Bytes being high'
                ],
                correct: 1,
                explanation: 'A memory leak is characterized by a process\'s Private Bytes counter steadily increasing over time without ever releasing memory back. This gradual, continuous growth pattern is the classic indicator of leaked memory in an application.'
            },
            {
                question: 'Which cmdlet gets real-time performance counter data?',
                options: [
                    'Get-Performance',
                    'Get-Counter',
                    'Measure-Counter',
                    'Read-Performance'
                ],
                correct: 1,
                explanation: 'Get-Counter retrieves real-time performance counter data. Use -ListSet to discover available counter sets, -Continuous for ongoing monitoring, and -SampleInterval to control timing.'
            },
            {
                question: 'What Event ID indicates a successful Windows logon?',
                options: [
                    '4624',
                    '4625',
                    '4634',
                    '4672'
                ],
                correct: 0,
                explanation: 'Event ID 4624 indicates a successful logon. 4625 is a failed logon attempt, 4634 is a logoff event, and 4672 indicates special privileges were assigned to a new logon session.'
            }
        ]
    });
    </script>
