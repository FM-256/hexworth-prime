<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Skills Gauntlet - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .g-header {
            background: rgba(0,0,0,0.85);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f59e0b;
            flex-shrink: 0;
            z-index: 10;
        }
        .g-header-left { display: flex; align-items: center; gap: 15px; }
        .g-header h1 { color: #f59e0b; font-size: 1.15rem; letter-spacing: 3px; }
        .g-score {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #fbbf24;
        }
        .g-grade {
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .g-header-right { display: flex; gap: 10px; align-items: center; }
        .g-hbtn {
            padding: 6px 14px;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.3);
            color: #60a5fa;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .g-hbtn:hover { background: #60a5fa; color: #000; }
        .g-timer { color: #9ca3af; font-size: 0.8rem; font-family: 'Cascadia Code', monospace; }

        /* ── Main Layout ── */
        .g-main { display: flex; flex: 1; overflow: hidden; }

        /* ── Sidebar ── */
        .g-sidebar {
            width: 280px;
            background: rgba(0,0,0,0.5);
            border-right: 1px solid rgba(245,158,11,0.15);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .g-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .g-filter-btn {
            padding: 3px 7px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: all 0.2s;
        }
        .g-filter-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; }
        .g-obj-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .g-obj-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .g-obj-item:hover { background: rgba(255,255,255,0.05); }
        .g-obj-item.selected { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.2); }
        .g-obj-item.completed { opacity: 0.7; }
        .g-obj-item.completed .g-obj-text { text-decoration: line-through; color: #22c55e; }
        .g-obj-check {
            width: 18px; height: 18px;
            border: 1px solid #555;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .g-obj-item.completed .g-obj-check { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.1); }
        .g-obj-icon { font-size: 0.85rem; flex-shrink: 0; }
        .g-obj-text { color: #ccc; flex: 1; }

        /* ── Hint Panel ── */
        .g-hint-panel {
            border-top: 1px solid rgba(245,158,11,0.15);
            padding: 10px;
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .g-hint-panel h4 { color: #f59e0b; font-size: 0.8rem; margin-bottom: 6px; }
        .g-hint-btn {
            padding: 5px 12px;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            color: #f59e0b;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .g-hint-btn:hover { background: rgba(245,158,11,0.2); }
        .g-hint-btn:disabled { opacity: 0.4; cursor: default; }
        .g-hint-text {
            font-size: 0.78rem;
            color: #d1d5db;
            padding: 5px 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
            margin-bottom: 4px;
            border-left: 2px solid #f59e0b;
        }
        .g-sidebar-score {
            padding: 8px 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.75rem;
            color: #9ca3af;
            text-align: center;
            flex-shrink: 0;
        }

        /* ── Workspace ── */
        .g-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .g-toolbar {
            background: #1e1e1e;
            padding: 6px 10px;
            display: flex;
            gap: 5px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .g-tool-btn {
            padding: 5px 10px;
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.25);
            border-radius: 4px;
            color: #60a5fa;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .g-tool-btn:hover { background: rgba(96,165,250,0.15); }
        .g-tool-btn.active { background: #60a5fa; color: #000; }
        .g-panel {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #12141f;
        }

        /* ── Status Bar ── */
        .g-statusbar {
            background: #1a1a1a;
            padding: 4px 15px;
            font-size: 0.72rem;
            color: #6b7280;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* ── Panel Content Styles ── */
        .p-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .p-header h3 { color: #60a5fa; font-size: 1rem; }
        .p-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .p-section h4 { color: #f59e0b; font-size: 0.85rem; margin-bottom: 10px; }
        .p-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .p-table th {
            text-align: left;
            padding: 7px 10px;
            background: rgba(96,165,250,0.08);
            color: #60a5fa;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(96,165,250,0.15);
        }
        .p-table td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #d1d5db;
        }
        .p-form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .p-form-group { flex: 1; }
        .p-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .p-form-group input, .p-form-group select {
            width: 100%;
            padding: 7px 10px;
            background: #1a1c28;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.82rem;
        }
        .p-form-group input:focus, .p-form-group select:focus {
            outline: none;
            border-color: #60a5fa;
        }
        .p-btn {
            padding: 6px 14px;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.3);
            color: #60a5fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .p-btn:hover { background: rgba(96,165,250,0.2); }
        .p-btn.primary { background: #60a5fa; color: #000; }
        .p-btn.primary:hover { background: #93c5fd; }
        .p-btn.danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
        .p-btn.success { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #22c55e; }
        .p-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .p-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .p-badge.green { background: rgba(34,197,94,0.15); color: #22c55e; }
        .p-badge.red { background: rgba(239,68,68,0.15); color: #ef4444; }
        .p-badge.yellow { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .p-badge.blue { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .p-empty { color: #555; font-size: 0.82rem; font-style: italic; padding: 10px 0; }
        .p-tree-item {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.82rem;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .p-tree-item:hover { background: rgba(255,255,255,0.05); }
        .p-tree-item.active { background: rgba(96,165,250,0.1); color: #60a5fa; }
        .p-inline-actions { display: flex; gap: 6px; }
        .p-checkbox-row {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 0; font-size: 0.82rem;
        }
        .p-checkbox-row input[type="checkbox"] { accent-color: #60a5fa; }

        /* ── Modal ── */
        .g-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .g-modal-overlay.show { display: flex; }
        .g-modal {
            background: #1e1e1e;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 22px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .g-modal h3 { color: #f59e0b; font-size: 1rem; margin-bottom: 15px; }
        .g-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

        /* ── Briefing Modal ── */
        .g-brief-modal { max-width: 700px; }
        .g-brief-layout { display: flex; gap: 0; min-height: 340px; }
        .g-brief-tabs {
            display: flex; flex-direction: column; gap: 2px;
            min-width: 155px; border-right: 1px solid #333; padding-right: 8px;
            overflow-y: auto; max-height: 55vh;
        }
        .g-brief-tab {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 8px; border-radius: 5px; cursor: pointer;
            font-size: 0.78rem; color: #9ca3af; transition: all 0.15s;
            white-space: nowrap; border: 1px solid transparent;
        }
        .g-brief-tab:hover { background: rgba(245,158,11,0.08); color: #e5e7eb; }
        .g-brief-tab.active { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: #f59e0b; }
        .g-brief-tab .bt-icon { font-size: 0.9rem; }
        .g-brief-tab .bt-label { flex: 1; }
        .g-brief-badge {
            font-size: 0.65rem; padding: 1px 5px; border-radius: 8px;
            font-weight: 600; min-width: 18px; text-align: center;
        }
        .g-brief-badge.done { background: rgba(34,197,94,0.2); color: #22c55e; }
        .g-brief-badge.partial { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .g-brief-badge.none { background: rgba(107,114,128,0.2); color: #6b7280; }
        .g-brief-content {
            flex: 1; padding: 0 0 0 16px; overflow-y: auto; max-height: 55vh;
        }
        .g-brief-content h4 { color: #f59e0b; font-size: 0.95rem; margin: 0 0 4px 0; }
        .g-brief-content .bc-progress { color: #6b7280; font-size: 0.75rem; margin-bottom: 12px; }
        .g-brief-content .bc-text { color: #d1d5db; font-size: 0.82rem; line-height: 1.65; }
        .g-brief-content .bc-text b { color: #93c5fd; font-weight: 600; }
        .g-brief-content .bc-overview { color: #9ca3af; font-size: 0.8rem; line-height: 1.6; }

        /* ── Notification ── */
        .g-notify {
            position: fixed;
            top: 60px; right: 20px;
            background: rgba(34,197,94,0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .g-notify.show { opacity: 1; transform: translateY(0); }

        /* ── Completion Overlay ── */
        .g-complete-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .g-complete-overlay.show { display: flex; }
        .g-complete-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #f59e0b;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        .g-complete-card h2 { color: #f59e0b; font-size: 1.8rem; letter-spacing: 4px; margin-bottom: 10px; }
        .g-complete-score { font-size: 4rem; font-weight: 700; color: #22c55e; margin: 15px 0; }
        .g-complete-grade {
            font-size: 2.5rem; font-weight: 700;
            width: 80px; height: 80px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%;
            margin: 10px 0 20px;
        }
        .g-complete-grade.S { background: rgba(168,85,247,0.2); color: #a855f7; border: 2px solid #a855f7; }
        .g-complete-grade.A { background: rgba(34,197,94,0.2); color: #22c55e; border: 2px solid #22c55e; }
        .g-complete-grade.B { background: rgba(96,165,250,0.2); color: #60a5fa; border: 2px solid #60a5fa; }
        .g-complete-grade.C { background: rgba(245,158,11,0.2); color: #f59e0b; border: 2px solid #f59e0b; }
        .g-complete-grade.D { background: rgba(239,68,68,0.2); color: #ef4444; border: 2px solid #ef4444; }
        .g-complete-grade.F { background: rgba(107,114,128,0.2); color: #6b7280; border: 2px solid #6b7280; }
        .g-complete-stats { color: #9ca3af; font-size: 0.9rem; margin-bottom: 20px; }
        .g-complete-actions { display: flex; gap: 12px; justify-content: center; }
        .g-complete-btn {
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
        }
        .g-complete-btn.primary { background: #f59e0b; color: #000; font-weight: 600; }
        .g-complete-btn.secondary { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid #555; }

        /* ── Resume Dialog ── */
        .g-resume-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
        }
        .g-resume-overlay.show { display: flex; }
        .g-resume-card {
            background: #1e1e1e;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
        }
        .g-resume-card h3 { color: #f59e0b; margin-bottom: 12px; }
        .g-resume-card p { color: #9ca3af; font-size: 0.9rem; margin-bottom: 20px; }
        .g-resume-actions { display: flex; gap: 12px; justify-content: center; }

        /* ── Chart area for monitoring ── */
        .p-chart {
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 6px;
            height: 180px;
            position: relative;
            overflow: hidden;
        }
        .p-chart canvas { width: 100%; height: 100%; }
    </style>
</head>

    <link rel="stylesheet" href="../../../../../components/styles/gui-simulator.css">
    <script src="../progress.js"></script>

    <!-- Header -->
    <div class="g-header">
        <div class="g-header-left">
            <h1>SKILLS GAUNTLET</h1>
            <span class="g-score" id="scoreDisplay">Score: 0/100</span>
            <span class="g-grade" id="gradeDisplay"></span>
            <span class="g-timer" id="timerDisplay">00:00:00</span>
        </div>
        <div class="g-header-right">
            <button class="g-hbtn" onclick="showBriefing()">Brief</button>
            <button class="g-hbtn" onclick="resetGauntlet()">Reset</button>
            <a class="g-hbtn" href="index.html">&larr; Exit</a>
        </div>
    </div>

    <!-- Main -->
    <div class="g-main">
        <!-- Sidebar -->
        <div class="g-sidebar">
            <div class="g-filter-bar" id="filterBar"></div>

    <!-- Modal -->

        <div class="g-modal" id="modalContent"></div>

    <!-- Notification -->
    <div class="g-notify" id="notification"></div>

    <!-- Completion Overlay -->
    <div class="g-complete-overlay" id="completionOverlay">
        <div class="g-complete-card" id="completionCard"></div>
    </div>

    <!-- Resume Dialog -->
    <div class="g-resume-overlay" id="resumeOverlay">
        <div class="g-resume-card">
            <h3>Previous Attempt Found</h3>
            <p id="resumeInfo"></p>
            <div class="g-resume-actions">
                <button class="g-complete-btn secondary" onclick="startFresh()">Start Fresh</button>
                <button class="g-complete-btn primary" onclick="resumeAttempt()">Resume</button>
            </div>
        </div>
    </div>

    // ── Scoring ──
    const scoring = {
        hintCosts: { 1: 1, 2: 2, 3: 3, 4: 5 },
        totalPenalty: 0,
        getMaxScore() { return Math.max(0, 100 - this.totalPenalty); },
        getScore() {
            const completed = objectives.filter(o => o.completed).length;
            return Math.round((completed / objectives.length) * this.getMaxScore());
        },
        getGrade() {
            const s = this.getScore();
            if (s >= 95) return 'S';
            if (s >= 90) return 'A';
            if (s >= 80) return 'B';
            if (s >= 70) return 'C';
            if (s >= 60) return 'D';
            return 'F';
        }
    };

    // ── Persistence (StateFederation) ──
    const _fed = StateFederation.register({
        storageKey: STORAGE_KEY,
        syncKey: 'wsa-gauntlet-sync',
        courseProgressKey: 'gauntlet',
        courseProgressProvider: 'wsa',
        courseProgressComponent: 'guiLab',

        extract: (full) => ({
            objectives: full.objectives,
            scoring: full.scoring,
            startedAt: full.startedAt,
            lastSaved: Date.now()
        }),

        merge: (full, sync) => {
            if (!sync.objectives) return;
            sync.objectives.forEach(so => {
                const fo = full.objectives.find(o => o.id === so.id);
                if (fo && !fo.completed && so.completed) fo.completed = true;
            });
        },

        fromSync: (sync) => {
            // Apply sync objectives into live objects
            sync.objectives.forEach(so => {
                const obj = objectives.find(o => o.id === so.id);
                if (obj) { obj.completed = so.completed; obj.hintsRevealed = so.hintsRevealed; }
            });
            scoring.totalPenalty = sync.scoring.totalPenalty;
            startedAt = sync.startedAt;
            return sync;
        },

        fromCompletion: (data) => data,

        resumeText: (data, source) => {
            if (source === 'completion') return null; // handled separately
            const objs = data.objectives || [];
            const done = objs.filter(o => o.completed).length;
            const elapsed = formatTime(Date.now() - (data.startedAt || Date.now()));
            const suffix = source === 'sync' ? ' (synced from another device)' : '';
            return `${done}/75 objectives completed | Time: ${elapsed}${suffix}`;
        }
    });

    function saveState() {
        const objData = objectives.map(o => ({ id: o.id, completed: o.completed, hintsRevealed: o.hintsRevealed }));
        _fed.save({
            state, startedAt,
            objectives: objData,
            scoring: { totalPenalty: scoring.totalPenalty },
            lastSaved: Date.now()
        });
    }

    function loadState() {
        const result = _fed.load();
        if (!result.data || result.source === 'completion') return false;
        if (result.source === 'sync') return true; // fromSync already applied to live objects
        // source === 'local': apply full state
        const saved = result.data;
        Object.assign(state, saved.state);
        saved.objectives.forEach(so => {
            const obj = objectives.find(o => o.id === so.id);
            if (obj) { obj.completed = so.completed; obj.hintsRevealed = so.hintsRevealed; }
        });
        scoring.totalPenalty = saved.scoring.totalPenalty;
        startedAt = saved.startedAt;
        return true;
    }

            </div>

        `;
        document.getElementById('completionOverlay').classList.add('show');

    // ── Objective Checking ──
    function checkAllObjectives() {
        let changed = false;
        objectives.forEach(obj => {
            try {
                const passes = obj.check();
                if (!obj.completed && passes) {
                    obj.completed = true;
                    changed = true;
                    notify('Objective completed!');
                } else if (obj.completed && !passes) {
                    // State was restored but check no longer passes — keep completed
                    // (don't revoke progress the user already earned)
                }
            } catch(e) {}
        });
        updateSidebar();
        updateScore();
        if (changed) {
            saveState();
            checkCompletion();
        }
    }

    function checkCompletion() {
        if (objectives.every(o => o.completed)) {
            setTimeout(() => {
                const card = document.getElementById('completionCard');
                const grade = scoring.getGrade();
                const score = scoring.getScore();
                const elapsed = formatTime(Date.now() - startedAt);
                const hintsUsed = objectives.reduce((s, o) => s + o.hintsRevealed, 0);
                card.innerHTML = `
                    <h2>GAUNTLET COMPLETE</h2>
                    <div class="g-complete-score">${score}/100</div>
                    <div class="g-complete-grade ${grade}">${grade}</div>
                    <div class="g-complete-stats">
                        <p>Time: ${elapsed}</p>
                        <p>Hints Used: ${hintsUsed} | Penalty: -${scoring.totalPenalty}</p>
                        <p>75/75 Objectives Complete</p>
                    </div>
                    <div class="g-complete-actions">
                        <a href="index.html" class="g-complete-btn secondary">Back to Briefing</a>
                        <button class="g-complete-btn primary" onclick="document.getElementById('completionOverlay').classList.remove('show')">Continue</button>
                    </div>
                `;
                document.getElementById('completionOverlay').classList.add('show');
                try { WSAProgress.markComplete('gauntlet', 'guiLab', { score, grade, hintsUsed }); } catch(e) {}
            }, 600);
        }
    }

    // ── UI Updates ──
    function updateScore() {
        const score = scoring.getScore();
        const max = scoring.getMaxScore();
        const grade = scoring.getGrade();
        document.getElementById('scoreDisplay').textContent = `Score: ${score}/${max}`;
        const gd = document.getElementById('gradeDisplay');
        gd.textContent = grade;
        gd.className = 'g-grade ' + grade;
        gd.style.color = { S:'#a855f7', A:'#22c55e', B:'#60a5fa', C:'#f59e0b', D:'#ef4444', F:'#6b7280' }[grade];
        document.getElementById('sidebarScore').textContent = `Max: ${max} | Hints: ${objectives.reduce((s,o)=>s+o.hintsRevealed,0)} | Done: ${objectives.filter(o=>o.completed).length}/75`;
    }

    function updateSidebar() {
        renderObjectivesList();
        if (selectedObjId) renderHintPanel();
    }

    function renderFilterBar() {
        const modules = ['All','M01','M02','M03','M04','M05','M06','M07','M08','M09','M10','M11'];
        document.getElementById('filterBar').innerHTML = modules.map(m =>
            `<button class="g-filter-btn ${activeFilter===m?'active':''}" onclick="setFilter('${m}')">${m}</button>`
        ).join('');
    }

    function setFilter(f) {
        activeFilter = f;
        renderFilterBar();
        renderObjectivesList();
    }

    function renderObjectivesList() {
        const list = document.getElementById('objList');
        const filtered = activeFilter === 'All' ? objectives : objectives.filter(o => o.module === activeFilter);
        list.innerHTML = filtered.map(o => {
            const icon = moduleIcons[o.module];
            const text = o.text;
            const cls = (o.completed ? ' completed' : '') + (o.id === selectedObjId ? ' selected' : '');
            return `<div class="g-obj-item${cls}" onclick="selectObj('${o.id}')">
                <div class="g-obj-check">${o.completed ? '✓' : ''}</div>
                <span class="g-obj-icon">${icon}</span>
                <span class="g-obj-text">${text}</span>
            </div>`;
        }).join('');
    }

    function selectObj(id) {
        selectedObjId = id;
        renderObjectivesList();
        renderHintPanel();
    }

    function renderHintPanel() {
        const panel = document.getElementById('hintPanel');
        if (!selectedObjId) { panel.innerHTML = '<p style="color:#555;font-size:0.75rem;padding:5px">Select an objective to see hints</p>'; return; }
        const obj = objectives.find(o => o.id === selectedObjId);
        if (!obj) return;

        let html = `<h4>${obj.completed ? obj.text : '??? (' + obj.module + ')'}</h4>`;
        for (let i = 0; i < obj.hints.length; i++) {
            if (i < obj.hintsRevealed) {
                html += `<div class="g-hint-text">L${obj.hints[i].l}: ${obj.hints[i].t}</div>`;
            }
        }
        if (!obj.completed && obj.hintsRevealed < obj.hints.length) {
            const nextHint = obj.hints[obj.hintsRevealed];
            const cost = scoring.hintCosts[nextHint.l];
            html += `<button class="g-hint-btn" onclick="revealHint('${obj.id}')">Reveal Hint L${nextHint.l} (-${cost} pts)</button>`;
        }
        if (obj.completed) html += `<p class="p-badge green" style="margin-top:6px">Complete</p>`;
        panel.innerHTML = html;
    }

    function revealHint(id) {
        const obj = objectives.find(o => o.id === id);
        if (!obj || obj.completed || obj.hintsRevealed >= obj.hints.length) return;
        const hint = obj.hints[obj.hintsRevealed];
        const cost = scoring.hintCosts[hint.l];
        scoring.totalPenalty += cost;
        obj.hintsRevealed++;
        updateScore();
        renderHintPanel();
        saveState();
    }

    function showGuiSimConsole(tool) {
        const simPanel = document.getElementById('guiSimPanel');

        // Properly close existing GUISimulator windows so the internal
        // windows Map stays in sync (innerHTML='' only kills the DOM,
        // leaving stale registrations that block new window creation).
        // Neutralize onClose first to prevent openTool('server') side-effects.
        ['gauntlet-aduc', 'gauntlet-disk', 'gauntlet-hyperv'].forEach(id => {
            try {
                const win = GUISimulator.getWindow(id);
                if (win) { win.config.onClose = null; }
                GUISimulator.closeWindow(id);
            } catch(e) {}
        });
        simPanel.innerHTML = '';

        // Push current gauntlet state into WSAState before rendering
        syncGauntletToWSAState();

        switch (tool) {
            case 'ad':
                guiSimInstances.aduc = GUISimulator.createADUC({
                    windowId: 'gauntlet-aduc',
                    onObjectiveComplete: handleAducObjective,
                    onClose: () => openTool('server')
                });
                break;
            case 'disk':
                guiSimInstances.disk = GUISimulator.createDiskManagement({
                    windowId: 'gauntlet-disk',
                    onObjectiveComplete: handleDiskObjective,
                    onClose: () => openTool('server')
                });
                break;
            case 'hyperv':
                guiSimInstances.hyperv = GUISimulator.createHyperVManager({
                    windowId: 'gauntlet-hyperv',
                    onObjectiveComplete: handleHypervObjective,
                    onClose: () => openTool('server')
                });
                break;
        }
    }

    // Bridge GUISimulator objective callbacks → gauntlet state sync
    function syncWSAStateToGauntlet() {
        const ws = WSAState.getState();

        // Sync AD state
        const ous = Object.values(ws.adOUs || {});
        state.ad.ous = ous.map(o => ({ name: o.Name, parent: o.Parent || null }));

        const users = Object.values(ws.adUsers || {});
        state.ad.users = users.filter(u => !['Administrator','Guest','krbtgt','DefaultAccount'].includes(u.SamAccountName)).map(u => ({
            firstName: u.GivenName || u.Name?.split(' ')[0] || '',
            lastName: u.Surname || u.Name?.split(' ')[1] || '',
            samAccountName: u.SamAccountName,
            ou: u.OU || (u.DistinguishedName ? extractOUFromDN(u.DistinguishedName) : null)
        }));

        const groups = Object.values(ws.adGroups || {});
        state.ad.groups = groups.filter(g => !['Domain Admins','Domain Users','Enterprise Admins','Schema Admins','Administrators','Users','Guests'].includes(g.Name)).map(g => ({
            name: g.Name,
            type: g.GroupCategory || 'Security',
            ou: g.OU || null
        }));

        // Sync group members
        groups.forEach(g => {
            if (g.Members && g.Members.length > 0) {
                state.ad.groupMembers[g.Name] = g.Members.map(m => {
                    // Members might be DN strings or SAM names
                    if (m.includes('CN=')) {
                        const match = m.match(/CN=([^,]+)/);
                        return match ? match[1] : m;
                    }
                    return m;
                });
            }
        });

        // Sync Disk state
        const disks = Object.values(ws.disks || {});
        disks.forEach(d => {
            const gDisk = state.storage.disks.find(sd => sd.id === d.Number);
            if (gDisk) {
                gDisk.initialized = d.PartitionStyle !== 'RAW' && d.OperationalStatus === 'Online';
                gDisk.format = d.PartitionStyle !== 'RAW' ? d.PartitionStyle : null;
                gDisk.status = d.OperationalStatus;
            }
        });

        // Sync volumes from WSAState
        const wsVolumes = Object.values(ws.volumes || {});
        const wsVolumeLetters = new Set(wsVolumes.filter(v => v.DriveLetter !== 'C').map(v => v.DriveLetter));

        wsVolumes.forEach(v => {
            if (v.DriveLetter === 'C') return; // skip system
            const existing = state.storage.volumes.find(sv => sv.letter === v.DriveLetter);
            if (!existing) {
                // Find which disk this volume belongs to
                let diskNum = 0;
                // Check disk.partitions arrays
                Object.values(ws.disks || {}).forEach(d => {
                    (d.partitions || []).forEach(p => {
                        if (p.DriveLetter === v.DriveLetter) diskNum = d.Number;
                    });
                });
                // Also check WSAState partitions store
                if (!diskNum) {
                    Object.values(ws.partitions || {}).forEach(p => {
                        if (p.DriveLetter === v.DriveLetter) diskNum = p.DiskNumber;
                    });
                }
                state.storage.volumes.push({
                    disk: diskNum,
                    letter: v.DriveLetter,
                    fs: v.FileSystem || 'NTFS',
                    size: Math.round((v.Size || 0) / (1024*1024*1024)),
                    label: v.FileSystemLabel || ''
                });
            } else {
                existing.fs = v.FileSystem || existing.fs;
                existing.label = v.FileSystemLabel || existing.label;
                existing.size = Math.round((v.Size || 0) / (1024*1024*1024)) || existing.size;
            }
        });

        // Remove gauntlet volumes that no longer exist in WSAState (deleted or letter changed)
        state.storage.volumes = state.storage.volumes.filter(sv =>
            sv.letter === 'C' || wsVolumeLetters.has(sv.letter)
        );

        // Sync shares
        const shares = Object.values(ws.shares || {});
        shares.forEach(s => {
            if (!state.storage.shares.some(ss => ss.name === s.Name)) {
                state.storage.shares.push({ name: s.Name, path: s.Path || '' });
            }
        });

        // Sync Hyper-V VMs
        const vms = Object.values(ws.vms || {});
        state.hyperv.vms = vms.map(v => ({
            Name: v.Name,
            Generation: v.Generation || 2,
            MemoryGB: Math.round((v.MemoryStartup || v.MemoryAssigned || 0) / (1024*1024*1024)),
            State: v.State || 'Off'
        }));

        // Sync VM switches
        const switches = Object.values(ws.vmSwitches || {});
        state.hyperv.switches = switches.map(s => ({
            name: s.Name,
            type: s.SwitchType || 'Internal'
        }));

        // Sync checkpoints
        const checkpoints = Object.values(ws.vmCheckpoints || {});
        state.hyperv.checkpoints = {};
        checkpoints.forEach(cp => {
            const vmName = cp.VMName || 'Unknown';
            if (!state.hyperv.checkpoints[vmName]) state.hyperv.checkpoints[vmName] = [];
            state.hyperv.checkpoints[vmName].push({ time: cp.CreationTime || new Date().toLocaleString() });
        });

        checkAllObjectives();
    }

    function extractOUFromDN(dn) {
        const match = dn.match(/OU=([^,]+)/);
        return match ? match[1] : null;
    }

    // ── Timer ──
    function formatTime(ms) {
        const s = Math.floor(ms/1000);
        const h = Math.floor(s/3600);
        const m = Math.floor((s%3600)/60);
        const sec = s%60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function syncGauntletToWSAState() {
        try {
            // Sync AD OUs
            const ouObj = {};
            state.ad.ous.forEach(o => {
                ouObj[o.name] = { Name: o.name, Parent: o.parent, DistinguishedName: `OU=${o.name},DC=branch,DC=hexworth,DC=local` };
            });
            // Sync AD Users
            const userObj = {};
            state.ad.users.forEach(u => {
                const ouPart = u.ou ? `OU=${u.ou},` : '';
                userObj[u.samAccountName] = {
                    Name: `${u.firstName} ${u.lastName}`.trim(),
                    SamAccountName: u.samAccountName,
                    GivenName: u.firstName,
                    Surname: u.lastName,
                    Enabled: true,
                    OU: u.ou,
                    DistinguishedName: `CN=${u.firstName} ${u.lastName},${ouPart}DC=branch,DC=hexworth,DC=local`
                };
            });
            // Sync AD Groups
            const groupObj = {};
            state.ad.groups.forEach(g => {
                groupObj[g.name] = {
                    Name: g.name,
                    GroupCategory: g.type,
                    GroupScope: 'Global',
                    OU: g.ou,
                    Members: state.ad.groupMembers[g.name] || [],
                    DistinguishedName: `CN=${g.name},DC=branch,DC=hexworth,DC=local`
                };
            });

            // Sync disk initialization state
            const wsState = WSAState.getState();
            const diskUpdates = {};
            state.storage.disks.forEach(d => {
                const wsDisk = wsState.disks[d.id];
                if (wsDisk) {
                    diskUpdates[d.id] = {
                        ...wsDisk,
                        PartitionStyle: d.initialized ? (d.format || 'GPT') : 'RAW',
                        OperationalStatus: d.initialized ? 'Online' : 'Offline',
                    };
                }
            });

            // Sync partitions from gauntlet volumes
            const partObj = {};
            state.storage.volumes.forEach(v => {
                if (v.letter === 'C') return; // skip system
                const key = `${v.disk}-${v.letter}`;
                partObj[key] = {
                    DiskNumber: v.disk,
                    PartitionNumber: Object.keys(partObj).filter(k => k.startsWith(`${v.disk}-`)).length + 1,
                    Size: (v.size || 0) * 1024 * 1024 * 1024,
                    DriveLetter: v.letter,
                    Type: 'Basic',
                };
            });

            // Sync volumes
            const volObj = { 'C': wsState.volumes?.['C'] || { DriveLetter: 'C', FileSystemLabel: 'System', FileSystem: 'NTFS', Size: 126*1024*1024*1024 } };
            state.storage.volumes.forEach(v => {
                if (v.letter === 'C') return;
                volObj[v.letter] = {
                    DriveLetter: v.letter,
                    FileSystem: v.fs || 'NTFS',
                    FileSystemLabel: v.label || 'New Volume',
                    Size: (v.size || 0) * 1024 * 1024 * 1024,
                    HealthStatus: 'Healthy',
                    DriveType: 'Fixed',
                };
            });

            // Sync shares
            const shareObj = {};
            state.storage.shares.forEach(s => {
                shareObj[s.name] = { Name: s.name, Path: s.path || '' };
            });

            // Sync Hyper-V VMs
            const vmObj = {};
            state.hyperv.vms.forEach(v => {
                vmObj[v.Name] = {
                    Name: v.Name,
                    Generation: v.Generation || 2,
                    MemoryStartup: (v.MemoryGB || 4) * 1024 * 1024 * 1024,
                    MemoryAssigned: (v.MemoryGB || 4) * 1024 * 1024 * 1024,
                    State: v.State || 'Off',
                    ProcessorCount: 2,
                };
            });

            // Sync VM switches
            const switchObj = {};
            state.hyperv.switches.forEach(s => {
                switchObj[s.name] = { Name: s.name, SwitchType: s.type || 'Internal' };
            });

            // Sync checkpoints
            const cpObj = {};
            Object.entries(state.hyperv.checkpoints).forEach(([vmName, cps]) => {
                cps.forEach((cp, i) => {
                    cpObj[`${vmName}-${i}`] = { VMName: vmName, CreationTime: cp.time || new Date().toLocaleString() };
                });
            });

            // Sync domain if promoted
            const domainName = state.ad.domain || wsState.domain || 'hexworth.local';
            const hostName = state.server.hostname || wsState.hostname || 'WIN-SERVER';

            WSAState.dispatch({ type: 'STATE_MERGE', payload: {
                adOUs: ouObj, adUsers: userObj, adGroups: groupObj,
                disks: diskUpdates, partitions: partObj, volumes: volObj,
                shares: shareObj, vms: vmObj, vmSwitches: switchObj, vmCheckpoints: cpObj,
                domain: domainName, hostname: hostName,
            }, source: 'gauntlet-sync' });
        } catch(e) { console.warn('Gauntlet→WSAState sync error:', e); }
    }

    // ── Reset ──
    function resetGauntlet() {
        if (!confirm('Reset ALL gauntlet progress? This cannot be undone.')) return;
        _fed.reset();
        location.reload();
    }

    // ── Resume Logic ──
    function checkResume() {
        const resume = _fed.getResume();
        if (!resume.hasResume) { initFresh(); return; }
        if (resume.source === 'completion') {
            _showPreviouslyCompleted(resume.data);
        } else {
            document.getElementById('resumeInfo').textContent = resume.text;
            document.getElementById('resumeOverlay').classList.add('show');
        }
    }

    function resumeAttempt() {
        document.getElementById('resumeOverlay').classList.remove('show');
        loadState();
        initUI();
        checkAllObjectives();
        // Ensure sync key exists (for devices that had state before this update)
        saveState();
    }

    function startFresh() {
        document.getElementById('resumeOverlay').classList.remove('show');
        document.getElementById('completionOverlay').classList.remove('show');
        _fed.reset();
        state = JSON.parse(JSON.stringify(defaultState));
        objectives.forEach(o => { o.completed = false; o.hintsRevealed = 0; });
        scoring.totalPenalty = 0;
        startedAt = Date.now();
        saveState();
        initUI();
    }

    function initFresh() {
        startedAt = Date.now();
        saveState();
        initUI();
    }

    function initUI() {
        renderFilterBar();
        renderObjectivesList();
        renderHintPanel();
        renderToolbar();
        updateScore();
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
        document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) hideModal(); });

        // Initialize GUISimulator for AD, Disk, Hyper-V consoles
        try {
            initGUISimulator();
            // Restore saved gauntlet state into WSAState (critical for resume)
            syncGauntletToWSAState();
            // Subscribe to WSAState changes to keep gauntlet state in sync
            WSAState.subscribe(() => syncWSAStateToGauntlet());
        } catch(e) {
            console.warn('GUISimulator init failed, falling back to custom consoles:', e);
            guiSimReady = false;
        }

        renderCurrentTool();
    }

        showModal(`<h3>Create Group</h3>
            <div class="p-form-group"><label>Group Name</label><input type="text" id="adGName" placeholder="Branch_Admins"></div>
            <div class="p-form-group"><label>Type</label>
                <select id="adGType"><option value="Security">Security</option><option value="Distribution">Distribution</option></select></div>
            <div class="p-form-group"><label>Target OU</label>

        const n = document.getElementById('adGName').value.trim();

    }

    function showAddMember() {
        if (state.ad.groups.length === 0 || state.ad.users.length === 0) { notify('Create groups and users first.'); return; }
        showModal(`<h3>Add Group Member</h3>
            <div class="p-form-group"><label>Group</label>
                <select id="adMGroup">${state.ad.groups.map(g=>`<option value="${g.name}">${g.name}</option>`).join('')}</select></div>
            <div class="p-form-group"><label>User</label>
                <select id="adMUser">${state.ad.users.map(u=>`<option value="${u.samAccountName}">${u.samAccountName}</option>`).join('')}</select></div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="addMember()">Add</button>
            </div>`);
    }
    function addMember() {
        const g = document.getElementById('adMGroup').value;
        const u = document.getElementById('adMUser').value;
        if (g && u) {
            if (!state.ad.groupMembers[g]) state.ad.groupMembers[g] = [];
            if (!state.ad.groupMembers[g].includes(u)) state.ad.groupMembers[g].push(u);
            hideModal(); applyAndCheck(); notify(u + ' added to ' + g);
        }
    }

    function renderDiskConsole() {
        return `
        <div class="p-header"><h3><img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Disk Management</h3>

    function showInitDisk() {
        const uninit = state.storage.disks.filter(d => !d.initialized);
        if (uninit.length === 0) { notify('All disks already initialized.'); return; }
        showModal(`<h3>Initialize Disk</h3>
            <div class="p-form-group"><label>Disk</label>
                <select id="dskId">${uninit.map(d=>`<option value="${d.id}">Disk ${d.id} (${d.size} GB)</option>`).join('')}</select></div>
            <div class="p-form-group"><label>Partition Style</label>
                <select id="dskFmt"><option value="GPT">GPT</option><option value="MBR">MBR</option></select></div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="initDisk()">Initialize</button>
            </div>`);
    }
    function initDisk() {
        const id = parseInt(document.getElementById('dskId').value);
        const fmt = document.getElementById('dskFmt').value;
        const d = state.storage.disks.find(d=>d.id===id);
        if (d) { d.initialized = true; d.format = fmt; d.status = 'Online'; hideModal(); applyAndCheck(); notify('Disk '+id+' initialized as '+fmt+'.'); }
    }

    function showCreateVolume() {
        const init = state.storage.disks.filter(d => d.initialized && d.id > 0);
        if (init.length === 0) { notify('Initialize a disk first.'); return; }
        showModal(`<h3>New Simple Volume</h3>
            <div class="p-form-group"><label>Disk</label>
                <select id="volDisk">${init.map(d=>`<option value="${d.id}">Disk ${d.id} (${d.size} GB)</option>`).join('')}</select></div>
            <div class="p-form-row">
                <div class="p-form-group"><label>Size (GB)</label><input type="number" id="volSize" value="100" min="1"></div>
                <div class="p-form-group"><label>Drive Letter</label><input type="text" id="volLetter" value="E" maxlength="1"></div>
            </div>
            <div class="p-form-row">
                <div class="p-form-group"><label>File System</label>
                    <select id="volFs"><option value="NTFS">NTFS</option><option value="ReFS">ReFS</option><option value="FAT32">FAT32</option></select></div>
                <div class="p-form-group"><label>Volume Label</label><input type="text" id="volLabel" placeholder="e.g. UserData"></div>
            </div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="createVolume()">Create</button>
            </div>`);
    }
    function createVolume() {
        const disk = parseInt(document.getElementById('volDisk').value);
        const size = parseInt(document.getElementById('volSize').value);
        const letter = document.getElementById('volLetter').value.trim().toUpperCase();
        const fs = document.getElementById('volFs').value;
        const label = document.getElementById('volLabel').value.trim();
        if (letter && size > 0) {
            state.storage.volumes.push({disk, letter, fs, size, label});
            hideModal(); applyAndCheck(); notify('Volume '+letter+': created.');
        }
    }

    function showEditVolume(idx) {
        const v = state.storage.volumes[idx];
        if (!v) return;
        showModal(`<h3>Volume Properties — ${v.letter}:</h3>
            <div class="p-form-group"><label>Volume Label</label>
                <input type="text" id="editVolLabel" value="${v.label||''}" placeholder="e.g. UserData"></div>

                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="editVolume(${idx})">Apply</button>
            </div>`);
    }
    function editVolume(idx) {
        const v = state.storage.volumes[idx];
        if (!v) return;
        v.label = document.getElementById('editVolLabel').value.trim();
        hideModal(); applyAndCheck(); renderCurrentTool(); notify('Volume '+v.letter+': label updated.');
    }

    function showCreateVM() {

        showModal(`<h3>Link GPO to OU</h3>

    function showEditGPO(gpoName) {
        if (state.gpo.gpos.length===0) { notify('Create a GPO first.'); return; }
        const gpo = gpoName ? state.gpo.gpos.find(g=>g.name===gpoName) : state.gpo.gpos[0];
        if (!gpo) return;
        const settings = gpo.settings || {};
        showModal(`<h3>Edit GPO Settings</h3>
            <div class="p-form-group"><label>GPO</label>
                <select id="editGpoName" onchange="showEditGPO(this.value)">${state.gpo.gpos.map(g=>`<option value="${g.name}" ${g.name===gpo.name?'selected':''}>${g.name}</option>`).join('')}</select></div>
            <h4 style="color:#f59e0b;font-size:0.85rem;margin:12px 0 8px">Password Policy</h4>
            <div class="p-form-row">
                <div class="p-form-group"><label>Min Password Length</label>
                    <input type="number" id="gpoMinPw" value="${settings.minPasswordLength||0}" min="0" max="128"></div>
                <div class="p-form-group"><label>Max Password Age (days)</label>
                    <input type="number" id="gpoMaxAge" value="${settings.maxPasswordAge||0}" min="0"></div>
            </div>
            <h4 style="color:#f59e0b;font-size:0.85rem;margin:12px 0 8px">Account Lockout</h4>
            <div class="p-form-group"><label>Lockout Threshold (attempts)</label>
                <input type="number" id="gpoLockout" value="${settings.lockoutThreshold||0}" min="0" max="999"></div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="editGPO()">Apply</button>
            </div>`);
    }
    function editGPO() {
        const name = document.getElementById('editGpoName').value;
        const gpo = state.gpo.gpos.find(g=>g.name===name);
        if (!gpo) return;
        const minPw = parseInt(document.getElementById('gpoMinPw').value);
        const maxAge = parseInt(document.getElementById('gpoMaxAge').value);
        const lockout = parseInt(document.getElementById('gpoLockout').value);
        if (!gpo.settings) gpo.settings = {};
        if (minPw > 0) gpo.settings.minPasswordLength = minPw;
        if (maxAge > 0) gpo.settings.maxPasswordAge = maxAge;
        if (lockout > 0) gpo.settings.lockoutThreshold = lockout;
        hideModal(); applyAndCheck(); notify('GPO settings applied.');
    }

    function showSecurityFilter() {
        if (state.gpo.gpos.length===0) { notify('Create a GPO first.'); return; }
        showModal(`<h3>Security Filtering</h3>
            <div class="p-form-group"><label>GPO</label>
                <select id="sfGpo">${state.gpo.gpos.map(g=>`<option value="${g.name}">${g.name}</option>`).join('')}</select></div>
            <div class="p-form-group"><label>Add Group</label>
                <input type="text" id="sfGroup" placeholder="Branch_Admins"></div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="addSecurityFilter()">Add</button>
            </div>`);
    }
    function addSecurityFilter() {
        const name = document.getElementById('sfGpo').value;
        const group = document.getElementById('sfGroup').value.trim();
        const gpo = state.gpo.gpos.find(g=>g.name===name);
        if (gpo && group) {
            if (!gpo.securityFilter) gpo.securityFilter = [];
            if (!gpo.securityFilter.includes(group)) gpo.securityFilter.push(group);
            hideModal(); applyAndCheck(); notify(group+' added to filter.');
        }
    }

            <div class="p-form-group"><label>Application Pool</label>
                <select id="assignPoolName">${state.iis.appPools.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}</select></div>
            <div class="g-modal-actions">
                <button class="p-btn" onclick="hideModal()">Cancel</button>
                <button class="p-btn primary" onclick="assignAppPoolToSite('${siteName}', document.getElementById('assignPoolName').value)">Assign</button>
            </div>`);
    }
    function assignAppPoolToSite(siteName, poolName) {
        const site = state.iis.sites.find(s=>s.name===siteName);
        if (site) { site.appPool = poolName; hideModal(); applyAndCheck(); notify(poolName+' assigned to '+siteName+'.'); }
    }

    // ═══════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', checkResume);

    // If cloud sync restores progress after page load, re-check
    window.addEventListener('stateFederation:restored', (e) => {
        if (e.detail.storageKey !== STORAGE_KEY) return;
        const resume = _fed.getResume();
        if (!resume.hasResume) return;
        if (resume.source === 'completion') {
            _showPreviouslyCompleted(resume.data);
        } else if (!localStorage.getItem(STORAGE_KEY)) {
            document.getElementById('resumeInfo').textContent = resume.text;
            document.getElementById('resumeOverlay').classList.add('show');
        }
    });

        function completeModule() {
            if (typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('cloud', 'cloud-gauntlet', {
                    returnUrl: '../../../index.html'
                });
            }
        }
    </script>
    
    <div style="text-align:center; padding:20px; margin-top:10px;">
        <button onclick="completeModule()" style="background:#22c55e; color:#fff; border:none; padding:12px 32px; border-radius:8px; font-size:1rem; cursor:pointer; box-shadow:0 2px 8px rgba(34,197,94,0.3);">Complete Module ✓</button>
    </div>
<script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
