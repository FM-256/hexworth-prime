<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M08 Quiz: DNS & Name Resolution - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #60a5fa;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #9ca3af;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #60a5fa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.2);
        }

        .option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .explanation {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(96, 165, 250, 0.1);
            border-left: 4px solid #60a5fa;
            border-radius: 0 8px 8px 0;
        }

        .explanation.show {
            display: block;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .nav-btn.next, .nav-btn.submit {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: #000;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            color: #60a5fa;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .score {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: #000;
        }

        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M08: DNS & Name Resolution Quiz</h1>
            <p>Test your knowledge of DNS concepts and management</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../m09-dhcp/cloud-presentation.module.html" class="results-btn primary" id="nextModuleBtn">Next Module →</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What type of DNS record maps a hostname to an IPv4 address?",
                options: ["CNAME", "A", "MX", "PTR"],
                correct: 1,
                explanation: "An A record (Address record) maps a hostname to an IPv4 address. AAAA records are used for IPv6."
            },
            {
                question: "Which DNS record type is used for reverse lookups (IP to name)?",
                options: ["A", "CNAME", "PTR", "SRV"],
                correct: 2,
                explanation: "PTR (Pointer) records are used for reverse DNS lookups, mapping IP addresses back to hostnames."
            },
            {
                question: "What does AD-integrated DNS provide that file-based DNS does not?",
                options: ["Faster queries", "Multi-master replication and secure updates", "Support for CNAME records", "Reverse lookup zones"],
                correct: 1,
                explanation: "AD-integrated DNS stores zone data in Active Directory, enabling multi-master updates and secure dynamic updates through AD authentication."
            },
            {
                question: "Which record type does Active Directory use to help clients locate domain controllers?",
                options: ["A", "CNAME", "MX", "SRV"],
                correct: 3,
                explanation: "SRV (Service) records are critical for AD. They help clients find services like LDAP, Kerberos, and Global Catalog servers."
            },
            {
                question: "What is the purpose of DNS forwarders?",
                options: ["Cache DNS records locally", "Send queries for external domains to another DNS server", "Create secondary zones", "Replicate zones between DCs"],
                correct: 1,
                explanation: "Forwarders send DNS queries for domains the server doesn't host to another DNS server, typically for internet resolution."
            },
            {
                question: "Which zone type allows updates from any DNS server that hosts it?",
                options: ["Primary zone", "Secondary zone", "Stub zone", "AD-integrated zone"],
                correct: 3,
                explanation: "AD-integrated zones allow multi-master updates - any DC hosting the zone can accept changes, unlike primary zones which are single-master."
            },
            {
                question: "What is the correct reverse lookup zone name for subnet 192.168.1.0/24?",
                options: ["192.168.1.in-addr.arpa", "1.168.192.in-addr.arpa", "192.168.1.0.in-addr.arpa", "168.192.1.in-addr.arpa"],
                correct: 1,
                explanation: "Reverse zones use the IP octets in reverse order plus .in-addr.arpa. For 192.168.1.x, it's 1.168.192.in-addr.arpa."
            },
            {
                question: "Which PowerShell cmdlet queries DNS for a hostname?",
                options: ["Get-DnsServerZone", "Test-Connection", "Resolve-DnsName", "Get-DnsClientCache"],
                correct: 2,
                explanation: "Resolve-DnsName performs DNS queries from PowerShell, similar to nslookup but with more detailed output."
            },
            {
                question: "What does DNS scavenging remove?",
                options: ["Duplicate records", "Stale (old) dynamic records", "All PTR records", "Forwarder configurations"],
                correct: 1,
                explanation: "Scavenging removes stale DNS records that are no longer valid, typically from DHCP clients that have released their IP addresses."
            },
            {
                question: "When configuring secure dynamic updates, who can register DNS records?",
                options: ["Any client on the network", "Only authenticated domain computers and users", "Only the DNS server", "Only domain controllers"],
                correct: 1,
                explanation: "Secure dynamic updates require Kerberos authentication, so only authenticated domain members can register or update their DNS records."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let showingResults = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">${q.explanation}</div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m08', percentage);
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
