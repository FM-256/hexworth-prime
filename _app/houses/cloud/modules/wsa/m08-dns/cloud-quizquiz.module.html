    <script>
    WSAQuiz.init({
        moduleId: 'm08',
        title: 'M08: DNS & Name Resolution',
        nextModule: '../m09-dhcp/cloud-presentation.module.html',
        questions: [
            {
                question: "What type of DNS record maps a hostname to an IPv4 address?",
                options: ["CNAME", "A", "MX", "PTR"],
                correct: 1,
                explanation: "An A record (Address record) maps a hostname to an IPv4 address. AAAA records are used for IPv6."
            },
            {
                question: "Which DNS record type is used for reverse lookups (IP to name)?",
                options: ["A", "CNAME", "PTR", "SRV"],
                correct: 2,
                explanation: "PTR (Pointer) records are used for reverse DNS lookups, mapping IP addresses back to hostnames."
            },
            {
                question: "What does AD-integrated DNS provide that file-based DNS does not?",
                options: ["Faster queries", "Multi-master replication and secure updates", "Support for CNAME records", "Reverse lookup zones"],
                correct: 1,
                explanation: "AD-integrated DNS stores zone data in Active Directory, enabling multi-master updates and secure dynamic updates through AD authentication."
            },
            {
                question: "Which record type does Active Directory use to help clients locate domain controllers?",
                options: ["A", "CNAME", "MX", "SRV"],
                correct: 3,
                explanation: "SRV (Service) records are critical for AD. They help clients find services like LDAP, Kerberos, and Global Catalog servers."
            },
            {
                question: "What is the purpose of DNS forwarders?",
                options: ["Cache DNS records locally", "Send queries for external domains to another DNS server", "Create secondary zones", "Replicate zones between DCs"],
                correct: 1,
                explanation: "Forwarders send DNS queries for domains the server doesn't host to another DNS server, typically for internet resolution."
            },
            {
                question: "Which zone type allows updates from any DNS server that hosts it?",
                options: ["Primary zone", "Secondary zone", "Stub zone", "AD-integrated zone"],
                correct: 3,
                explanation: "AD-integrated zones allow multi-master updates - any DC hosting the zone can accept changes, unlike primary zones which are single-master."
            },
            {
                question: "What is the correct reverse lookup zone name for subnet 192.168.1.0/24?",
                options: ["192.168.1.in-addr.arpa", "1.168.192.in-addr.arpa", "192.168.1.0.in-addr.arpa", "168.192.1.in-addr.arpa"],
                correct: 1,
                explanation: "Reverse zones use the IP octets in reverse order plus .in-addr.arpa. For 192.168.1.x, it's 1.168.192.in-addr.arpa."
            },
            {
                question: "Which PowerShell cmdlet queries DNS for a hostname?",
                options: ["Get-DnsServerZone", "Test-Connection", "Resolve-DnsName", "Get-DnsClientCache"],
                correct: 2,
                explanation: "Resolve-DnsName performs DNS queries from PowerShell, similar to nslookup but with more detailed output."
            },
            {
                question: "What does DNS scavenging remove?",
                options: ["Duplicate records", "Stale (old) dynamic records", "All PTR records", "Forwarder configurations"],
                correct: 1,
                explanation: "Scavenging removes stale DNS records that are no longer valid, typically from DHCP clients that have released their IP addresses."
            },
            {
                question: "When configuring secure dynamic updates, who can register DNS records?",
                options: ["Any client on the network", "Only authenticated domain computers and users", "Only the DNS server", "Only domain controllers"],
                correct: 1,
                explanation: "Secure dynamic updates require Kerberos authentication, so only authenticated domain members can register or update their DNS records."
            }
        ]
    });
    </script>
