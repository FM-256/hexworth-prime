    <title>WSA M11: IIS & Web Services - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); color: #e0e0e0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; margin: 0; padding: 0; }
        .slide-container { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .slide { display: none; flex: 1; min-height: 0; background: rgba(255,255,255,0.03); padding: 14px 36px; box-sizing: border-box; overflow: hidden; }
        .slide.active { display: flex; flex-direction: column; animation: fadeIn 0.5s ease; }
        .slide-content { width: 100%; max-width: 1400px; margin: 0 auto; line-height: 1.45; font-size: 0.98rem; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
        .slide.has-visual .slide-content { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: stretch; max-width: 1400px; }
        .slide-text { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .slide-visual { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 8px; }
        .slide-visual svg { width: 100%; height: auto; max-height: 100%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .slide h1 { color: #60a5fa; font-size: 2.5rem; margin-bottom: 30px; border-bottom: 2px solid rgba(96,165,250,0.3); padding-bottom: 20px; }
        .slide h2 { color: #93c5fd; font-size: 1.8rem; margin: 25px 0 15px; }
        .slide p, .slide li { font-size: 1.2rem; line-height: 1.8; margin-bottom: 15px; }
        .slide ul { margin-left: 30px; margin-bottom: 20px; }
        .highlight { background: rgba(96,165,250,0.2); padding: 2px 8px; border-radius: 4px; color: #93c5fd; }
        .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin: 20px 0; font-family: 'Consolas', monospace; font-size: 1rem; overflow-x: auto; white-space: pre-wrap; }
        .code-block .comment { color: #8b949e; }
        .code-block .cmdlet { color: #79c0ff; }
        .code-block .param { color: #a5d6ff; }
        .code-block .string { color: #a5d6ff; }
        .code-block .prompt { color: #60a5fa; }
        .code-block .command { color: #f0f0f0; }
        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        .column { background: rgba(0,0,0,0.2); padding: 25px; border-radius: 12px; border: 1px solid rgba(96,165,250,0.2); }
        .column h3 { color: #60a5fa; margin-bottom: 15px; font-size: 1.3rem; }
        .info-box { background: rgba(34,197,94,0.1); border-left: 4px solid #22c55e; padding: 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        .warning-box { background: rgba(245,158,11,0.1); border-left: 4px solid #f59e0b; padding: 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        .nav-controls {
            flex-shrink: 0;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: #0a0a0f;
            border-top: 1px solid rgba(96, 165, 250, 0.15);
        });
        function updateSlide() {
            slides.forEach((slide, i) => slide.classList.toggle('active', i === currentSlide));
            document.querySelectorAll('.progress-dot').forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
        }
        function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlide(); } }
        function goToSlide(index) { currentSlide = index; updateSlide(); }
        document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    </script>
    <script src="../progress.js"></script>
    <script>WSAProgress.markPresentationViewed('m11');
        function completeModule() {
            if (typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('cloud', 'wsa-m11-pres', {
                    returnUrl: '../../../index.html'
                });
            }
        }
    </script>

    <div id="completeWrap" style="text-align:center; padding:20px; margin-top:10px; display:none;">
        <button onclick="completeModule()" style="background:#22c55e; color:#fff; border:none; padding:12px 32px; border-radius:8px; font-size:1rem; cursor:pointer; box-shadow:0 2px 8px rgba(34,197,94,0.3);">Complete Module ✓</button>
    </div>
