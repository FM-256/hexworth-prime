<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M10 Quiz: Group Policy - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M10: Group Policy Quiz</h1>
            <p>Test your knowledge of Group Policy concepts and management</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../midterm-outpost/index.html" class="results-btn primary" id="nextModuleBtn">Midterm Project</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What does LSDOU stand for in Group Policy processing order?",
                options: ["Local, Site, Domain, OU", "Link, Security, Domain, User", "Local, Server, DC, OU", "Logon, Site, Domain, Object"],
                correct: 0,
                explanation: "LSDOU represents the order GPOs are processed: Local, Site, Domain, then Organizational Unit. Later policies override earlier ones."
            },
            {
                question: "Where is the Group Policy Template (GPT) stored?",
                options: ["Active Directory database", "SYSVOL folder", "System Registry", "DNS zone"],
                correct: 1,
                explanation: "The GPT containing actual policy settings is stored in SYSVOL (\\\\domain\\SYSVOL\\domain\\Policies\\{GPO-GUID}\\)."
            },
            {
                question: "What happens when Block Inheritance is set on an OU?",
                options: ["All GPOs are deleted", "Parent GPOs don't apply to that OU", "Child OUs are removed", "Users can't log in"],
                correct: 1,
                explanation: "Block Inheritance prevents GPOs linked at higher levels (domain, parent OUs) from applying to that OU."
            },
            {
                question: "Which GPO setting overrides Block Inheritance?",
                options: ["Security Filtering", "WMI Filtering", "Enforced (No Override)", "Loopback Processing"],
                correct: 2,
                explanation: "An Enforced (formerly No Override) GPO will apply even to OUs that have Block Inheritance set."
            },
            {
                question: "What is the purpose of Loopback Processing in Replace mode?",
                options: ["Apply computer settings twice", "Apply only the user's GPO settings", "Apply only the computer's GPO user settings", "Merge user and computer settings"],
                correct: 2,
                explanation: "Replace mode ignores the user's normal GPOs and applies only user settings from GPOs linked to the computer's OU."
            },
            {
                question: "Password policies linked to an OU will affect users in that OU. True or False?",
                options: ["True - OU policies always apply", "False - Password policies only work at domain level", "Depends on security filtering", "Only if Block Inheritance is not set"],
                correct: 1,
                explanation: "Password, account lockout, and Kerberos policies only work when linked at the domain level. Use Fine-Grained Password Policies for OU-level control."
            },
            {
                question: "What is the difference between Policies and Preferences?",
                options: ["Policies are faster to apply", "Preferences can be changed by users", "Policies require less bandwidth", "Preferences are more secure"],
                correct: 1,
                explanation: "Policies enforce settings that users cannot change. Preferences set initial values that users can modify."
            },
            {
                question: "Which command forces an immediate Group Policy refresh?",
                options: ["gpupdate /force", "gpedit /refresh", "gpresult /sync", "repadmin /gpo"],
                correct: 0,
                explanation: "gpupdate /force immediately refreshes both computer and user policies without waiting for the normal refresh interval."
            },
            {
                question: "What does a WMI filter do?",
                options: ["Blocks malware from executing", "Applies GPO conditionally based on system properties", "Filters network traffic", "Manages user permissions"],
                correct: 1,
                explanation: "WMI filters evaluate system properties (OS version, hardware, etc.) and only apply the GPO if the query returns true."
            },
            {
                question: "When backing up a GPO, what is NOT included?",
                options: ["Security settings", "Registry values", "GPO links", "Administrative templates"],
                correct: 2,
                explanation: "GPO backups include settings but NOT links. After restoring, you must re-link the GPO to the appropriate containers."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m10', percentage);
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
