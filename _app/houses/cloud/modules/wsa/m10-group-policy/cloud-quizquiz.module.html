    <script>
    WSAQuiz.init({
        moduleId: 'm10',
        title: 'M10: Group Policy',
        nextModule: '../m11-iis/cloud-presentation.module.html',
        questions: [
            {
                question: "What does LSDOU stand for in Group Policy processing order?",
                options: ["Local, Site, Domain, OU", "Link, Security, Domain, User", "Local, Server, DC, OU", "Logon, Site, Domain, Object"],
            },
            {
                question: "Where is the Group Policy Template (GPT) stored?",
                options: ["Active Directory database", "SYSVOL folder", "System Registry", "DNS zone"],
            },
            {
                question: "What happens when Block Inheritance is set on an OU?",
                options: ["All GPOs are deleted", "Parent GPOs don't apply to that OU", "Child OUs are removed", "Users can't log in"],
            },
            {
                question: "Which GPO setting overrides Block Inheritance?",
                options: ["Security Filtering", "WMI Filtering", "Enforced (No Override)", "Loopback Processing"],
            },
            {
                question: "What is the purpose of Loopback Processing in Replace mode?",
                options: ["Apply computer settings twice", "Apply only the user's GPO settings", "Apply only the computer's GPO user settings", "Merge user and computer settings"],
            },
            {
                question: "Password policies linked to an OU will affect users in that OU. True or False?",
                options: ["True - OU policies always apply", "False - Password policies only work at domain level", "Depends on security filtering", "Only if Block Inheritance is not set"],
            },
            {
                question: "What is the difference between Policies and Preferences?",
                options: ["Policies are faster to apply", "Preferences can be changed by users", "Policies require less bandwidth", "Preferences are more secure"],
            },
            {
                question: "Which command forces an immediate Group Policy refresh?",
                options: ["gpupdate /force", "gpedit /refresh", "gpresult /sync", "repadmin /gpo"],
            },
            {
                question: "What does a WMI filter do?",
                options: ["Blocks malware from executing", "Applies GPO conditionally based on system properties", "Filters network traffic", "Manages user permissions"],
            },
            {
                question: "When backing up a GPO, what is NOT included?",
                options: ["Security settings", "Registry values", "GPO links", "Administrative templates"],
            }
        ]
    });
    </script>
