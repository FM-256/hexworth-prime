    <script>
    WSAQuiz.init({
        moduleId: 'm18',
        title: 'M18: PowerShell Automation',
        nextModule: '../m19-troubleshooting-migration/cloud-presentation.module.html',
        questions: [
            {
                question: "What is the recommended way to define script parameters in PowerShell?",
                options: ["Using $args array", "Using param() block", "Using command-line parsing", "Using environment variables"],
                correct: 1,
                explanation: "The param() block at the beginning of a script provides proper parameter definition with validation, type checking, and automatic help generation."
            },
            {
                question: "Which preference variable controls how PowerShell handles non-terminating errors?",
                options: ["$ErrorBehavior", "$ErrorActionPreference", "$ErrorHandling", "$ErrorMode"],
                correct: 1,
                explanation: "$ErrorActionPreference controls how PowerShell responds to non-terminating errors. Set it to 'Stop' to make all errors terminating and catchable."
            },
            {
                question: "What cmdlet is used to create a new scheduled task in PowerShell?",
                options: ["New-ScheduledTask", "Register-ScheduledTask", "Add-ScheduledTask", "Create-ScheduledTask"],
                correct: 1,
                explanation: "Register-ScheduledTask creates and registers a new scheduled task. New-ScheduledTaskAction, New-ScheduledTaskTrigger are used to define components."
            },
            {
                question: "What does DSC stand for in PowerShell?",
                options: ["Dynamic Script Configuration", "Desired State Configuration", "Distributed System Control", "Default Security Configuration"],
                correct: 1,
                explanation: "Desired State Configuration (DSC) is PowerShell's declarative configuration management platform for defining and enforcing system configurations."
            },
            {
                question: "Which DSC cmdlet applies a configuration to target nodes?",
                options: ["Apply-DscConfiguration", "Start-DscConfiguration", "Set-DscConfiguration", "Push-DscConfiguration"],
                correct: 1,
                explanation: "Start-DscConfiguration applies the MOF configuration files to the target nodes. Use -Wait -Verbose for synchronous execution with detailed output."
            },
            {
                question: "What cmdlet runs PowerShell commands on remote computers?",
                options: ["Run-Remote", "Invoke-Command", "Execute-Command", "Start-RemoteCommand"],
                correct: 1,
                explanation: "Invoke-Command runs commands on local and remote computers. It uses WinRM and PowerShell remoting for secure remote execution."
            },
            {
                question: "Which parameter limits concurrent remote connections in Invoke-Command?",
                options: ["-MaxConnections", "-ConcurrentLimit", "-ThrottleLimit", "-ConnectionLimit"],
                correct: 2,
                explanation: "-ThrottleLimit specifies the maximum number of concurrent connections that can be established. Default is 32."
            },
            {
                question: "What type of file does a DSC configuration compile to?",
                options: [".dsc file", ".config file", ".mof file", ".xml file"],
                correct: 2,
                explanation: "DSC configurations compile to MOF (Managed Object Format) files, which contain the declarative configuration for target nodes."
            },
            {
                question: "Which cmdlet tests if a system matches its DSC desired state?",
                options: ["Compare-DscConfiguration", "Test-DscConfiguration", "Verify-DscConfiguration", "Check-DscConfiguration"],
                correct: 1,
                explanation: "Test-DscConfiguration checks if the current system configuration matches the desired state. Returns True if compliant, False if drift detected."
            },
            {
                question: "What is the purpose of #Requires statements in PowerShell scripts?",
                options: ["Import modules automatically", "Specify prerequisites and fail early if not met", "Document dependencies only", "Enable strict mode"],
                correct: 1,
                explanation: "#Requires statements specify prerequisites (version, modules, admin rights) and cause the script to fail immediately if requirements aren't met."
            }
        ]
    });
    </script>
