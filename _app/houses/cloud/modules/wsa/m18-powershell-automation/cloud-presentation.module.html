                    <p style="margin-bottom: 20px;">Production scripts require robust error handling and comprehensive logging.</p>

                    <div class="code-block">
<span class="comment"># Logging function with try/catch pattern for production scripts</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">function Write-Log {
    param([string]$Message, [string]$Level = 'INFO')
    $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
    "[$timestamp] [$Level] $Message" | Add-Content -Path $LogPath
}

try {
    Write-Log "Starting operation on $ServerName"
    Invoke-Command -ComputerName $ServerName -ScriptBlock {
        Get-Service | Where-Object Status -eq 'Stopped'
    }
    Write-Log "Operation completed successfully"
}
catch {
    Write-Log "ERROR: $_" -Level 'ERROR'
    throw
}
finally {
    Write-Log "Script execution ended"
}</span>
                    </div>
                    <div class="info-box">

$principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -RunLevel Highest
Register-ScheduledTask -TaskName 'DailyMaintenance' -Action $action -Trigger $trigger -Principal $principal</span>

<span class="comment"># Step 1: Define a security baseline configuration</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Configuration SecureServer {
    Import-DscResource -ModuleName PSDesiredStateConfiguration
    Node $AllNodes.NodeName {
        WindowsFeature RemoveFeatures {
            Name = 'Telnet-Client'
            Ensure = 'Absent'
        }
        Service WinRM {
            Name = 'WinRM'
            State = 'Running'
            StartupType = 'Automatic'
        }
    }
}</span>

<span class="comment"># Step 2: Compile the configuration into MOF files</span>

                    <p>This function encapsulates user onboarding: creates the AD account, adds group membership, and provisions the home folder in one call.</p>

<span class="comment"># Reusable function that provisions a new employee end-to-end</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">function New-HexworthUser {
    param($FirstName, $LastName, $Department)

                    <p style="margin-top: 15px;">The PSGallery is the public module repository. Install community and Microsoft modules from here to extend your automation capabilities.</p>

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next >';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'cloud-guilab.module.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
