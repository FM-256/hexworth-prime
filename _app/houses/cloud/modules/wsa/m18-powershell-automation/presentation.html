                        <h2 style="color: var(--warning-color); font-size: 1.8rem; margin-bottom: 15px;">Module 18: Automate Everything</h2>

            // Slide 2: Script Fundamentals
            {
                title: "PowerShell Script Fundamentals",
                content: `
                    <p style="margin-bottom: 20px;">Building robust, maintainable PowerShell scripts for server automation:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">Script Structure</h4>
                            <ul>
                                <li><strong>#Requires</strong> - Specify prerequisites</li>
                                <li><strong>Param()</strong> - Define parameters</li>
                                <li><strong>Begin/Process/End</strong> - Pipeline blocks</li>
                                <li><strong>Functions</strong> - Reusable code blocks</li>
                                <li><strong>Comment-based help</strong> - Documentation</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--success-color);">Best Practices</h4>
                            <ul>
                                <li>Use approved verbs (Get, Set, New)</li>
                                <li>Implement error handling (Try/Catch)</li>
                                <li>Add -WhatIf and -Confirm support</li>
                                <li>Log all actions to file</li>
                                <li>Use strict mode for debugging</li>
                            </ul>
                        </div>
                    </div>
                    <div class="code-block">
<span class="comment">#Requires -Version 5.1</span>
<span class="comment">#Requires -RunAsAdministrator</span>

<span class="keyword">param</span>(
    [<span class="keyword">Parameter</span>(Mandatory)]
    [<span class="keyword">string</span>]<span class="variable">$ServerName</span>,
    [<span class="keyword">switch</span>]<span class="variable">$Force</span>
)

<span class="cmdlet">Set-StrictMode</span> <span class="param">-Version</span> Latest
<span class="variable">$ErrorActionPreference</span> = <span class="string">'Stop'</span>
                    </div>
                `
            },
            // Slide 3: Error Handling
            {
                title: "Error Handling & Logging",
                content: `
                    <p style="margin-bottom: 20px;">Production scripts require robust error handling and comprehensive logging:</p>
                    <div class="code-block">
<span class="keyword">function</span> <span class="cmdlet">Write-Log</span> {
    <span class="keyword">param</span>([<span class="keyword">string</span>]<span class="variable">$Message</span>, [<span class="keyword">string</span>]<span class="variable">$Level</span> = <span class="string">'INFO'</span>)
    <span class="variable">$timestamp</span> = <span class="cmdlet">Get-Date</span> <span class="param">-Format</span> <span class="string">'yyyy-MM-dd HH:mm:ss'</span>
    <span class="string">"[$timestamp] [$Level] $Message"</span> | <span class="cmdlet">Add-Content</span> <span class="param">-Path</span> <span class="variable">$LogPath</span>
}

<span class="keyword">try</span> {
    <span class="cmdlet">Write-Log</span> <span class="string">"Starting operation on $ServerName"</span>

    <span class="comment"># Main script logic here</span>
    <span class="cmdlet">Invoke-Command</span> <span class="param">-ComputerName</span> <span class="variable">$ServerName</span> <span class="param">-ScriptBlock</span> {
        <span class="cmdlet">Get-Service</span> | <span class="cmdlet">Where-Object</span> Status <span class="param">-eq</span> <span class="string">'Stopped'</span>
    }

    <span class="cmdlet">Write-Log</span> <span class="string">"Operation completed successfully"</span>
}
<span class="keyword">catch</span> {
    <span class="cmdlet">Write-Log</span> <span class="string">"ERROR: $_"</span> <span class="param">-Level</span> <span class="string">'ERROR'</span>
    <span class="keyword">throw</span>
}
<span class="keyword">finally</span> {
    <span class="cmdlet">Write-Log</span> <span class="string">"Script execution ended"</span>
}
                    </div>
                    <div class="info-box">
                        <strong>ErrorAction Preference:</strong> Set <code>$ErrorActionPreference = 'Stop'</code> to ensure all errors are caught by try/catch blocks.
                    </div>
                `
            },
            // Slide 4: Scheduled Tasks
            {
                title: "Task Scheduler Integration",
                content: `
                    <p style="margin-bottom: 20px;">Automate script execution with Windows Task Scheduler:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon">&#9203;</div>
                            <h5>Time-Based Triggers</h5>
                            <p>Daily, weekly, monthly, at startup, on idle</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">&#128276;</div>
                            <h5>Event-Based Triggers</h5>
                            <p>On event log entry, workstation lock/unlock</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">&#128100;</div>
                            <h5>Run As Options</h5>
                            <p>Run whether user is logged on or not</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">&#9888;</div>
                            <h5>Conditions</h5>
                            <p>Network, power, idle conditions</p>
                        </div>
                    </div>
                    <div class="code-block">
<span class="comment"># Create a scheduled task for daily maintenance</span>
<span class="variable">$action</span> = <span class="cmdlet">New-ScheduledTaskAction</span> <span class="param">-Execute</span> <span class="string">'powershell.exe'</span> `
    <span class="param">-Argument</span> <span class="string">'-ExecutionPolicy Bypass -File C:\\Scripts\\DailyMaintenance.ps1'</span>

<span class="variable">$trigger</span> = <span class="cmdlet">New-ScheduledTaskTrigger</span> <span class="param">-Daily</span> <span class="param">-At</span> <span class="string">'2:00AM'</span>

<span class="variable">$principal</span> = <span class="cmdlet">New-ScheduledTaskPrincipal</span> <span class="param">-UserId</span> <span class="string">'SYSTEM'</span> <span class="param">-RunLevel</span> Highest

<span class="cmdlet">Register-ScheduledTask</span> <span class="param">-TaskName</span> <span class="string">'DailyMaintenance'</span> `
    <span class="param">-Action</span> <span class="variable">$action</span> <span class="param">-Trigger</span> <span class="variable">$trigger</span> <span class="param">-Principal</span> <span class="variable">$principal</span>
                    </div>
                `
            },
            // Slide 5: Desired State Configuration
            {
                title: "Desired State Configuration (DSC)",
                content: `
                    <p style="margin-bottom: 20px;">DSC is PowerShell's declarative configuration management platform:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">DSC Components</h4>
                            <ul>
                                <li><strong>Configuration</strong> - Declarative script</li>
                                <li><strong>Resources</strong> - Building blocks</li>
                                <li><strong>LCM</strong> - Local Configuration Manager</li>
                                <li><strong>MOF Files</strong> - Compiled configurations</li>
                                <li><strong>Pull Server</strong> - Centralized distribution</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--success-color);">Built-in Resources</h4>
                            <ul>
                                <li><strong>File</strong> - Manage files/folders</li>
                                <li><strong>Registry</strong> - Registry keys/values</li>
                                <li><strong>Service</strong> - Windows services</li>
                                <li><strong>WindowsFeature</strong> - Roles/features</li>
                                <li><strong>User/Group</strong> - Local accounts</li>
                            </ul>
                        </div>
                    </div>
                    <div class="code-block">
<span class="keyword">Configuration</span> <span class="cmdlet">WebServerConfig</span> {
    <span class="keyword">Node</span> <span class="string">'WebServer01'</span> {
        <span class="cmdlet">WindowsFeature</span> IIS {
            <span class="param">Name</span> = <span class="string">'Web-Server'</span>
            <span class="param">Ensure</span> = <span class="string">'Present'</span>
        }

        <span class="cmdlet">File</span> WebsiteContent {
            <span class="param">DestinationPath</span> = <span class="string">'C:\\inetpub\\wwwroot\\index.html'</span>
            <span class="param">Contents</span> = <span class="string">'&lt;h1&gt;Welcome to Hexworth&lt;/h1&gt;'</span>
            <span class="param">Ensure</span> = <span class="string">'Present'</span>
        }
    }
}
                    </div>
                `
            },
            // Slide 6: DSC Implementation
            {
                title: "Implementing DSC",
                content: `
                    <p style="margin-bottom: 20px;">Deploy and enforce configurations with DSC:</p>
                    <div class="code-block">
<span class="comment"># Step 1: Define the configuration</span>
<span class="keyword">Configuration</span> <span class="cmdlet">SecureServer</span> {
    <span class="keyword">Import-DscResource</span> <span class="param">-ModuleName</span> PSDesiredStateConfiguration

    <span class="keyword">Node</span> <span class="variable">$AllNodes.NodeName</span> {
        <span class="cmdlet">WindowsFeature</span> RemoveFeatures {
            <span class="param">Name</span> = <span class="string">'Telnet-Client'</span>
            <span class="param">Ensure</span> = <span class="string">'Absent'</span>
        }

        <span class="cmdlet">Service</span> WinRM {
            <span class="param">Name</span> = <span class="string">'WinRM'</span>
            <span class="param">State</span> = <span class="string">'Running'</span>
            <span class="param">StartupType</span> = <span class="string">'Automatic'</span>
        }
    }
}

<span class="comment"># Step 2: Generate MOF files</span>
<span class="cmdlet">SecureServer</span> <span class="param">-OutputPath</span> <span class="string">'C:\\DSC\\SecureServer'</span>

<span class="comment"># Step 3: Apply configuration</span>
<span class="cmdlet">Start-DscConfiguration</span> <span class="param">-Path</span> <span class="string">'C:\\DSC\\SecureServer'</span> <span class="param">-Wait</span> <span class="param">-Verbose</span>

<span class="comment"># Step 4: Check compliance</span>
<span class="cmdlet">Test-DscConfiguration</span> <span class="param">-Detailed</span>
                    </div>
                    <div class="warning-box">
                        <strong>DSC Modes:</strong> Push mode applies configs on-demand. Pull mode has nodes periodically check a pull server for updates.
                    </div>

                title: "PowerShell Remoting",
                content: `
                    <p style="margin-bottom: 20px;">Manage multiple servers efficiently with PowerShell remoting:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">Remoting Methods</h4>
                            <ul>
                                <li><strong>Invoke-Command</strong> - Run commands remotely</li>
                                <li><strong>Enter-PSSession</strong> - Interactive session</li>
                                <li><strong>New-PSSession</strong> - Persistent connection</li>
                                <li><strong>CIM/WMI</strong> - Management queries</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--success-color);">Best Practices</h4>
                            <ul>
                                <li>Use sessions for multiple commands</li>
                                <li>Throttle concurrent connections</li>
                                <li>Handle disconnected sessions</li>
                                <li>Use CredSSP sparingly</li>
                            </ul>
                        </div>
                    </div>
                    <div class="code-block">
<span class="comment"># Query multiple servers in parallel</span>
<span class="variable">$servers</span> = <span class="string">'DC01'</span>, <span class="string">'WEB01'</span>, <span class="string">'SQL01'</span>, <span class="string">'FILE01'</span>

<span class="cmdlet">Invoke-Command</span> <span class="param">-ComputerName</span> <span class="variable">$servers</span> <span class="param">-ScriptBlock</span> {
    [<span class="keyword">PSCustomObject</span>]@{
        ComputerName = <span class="variable">$env:COMPUTERNAME</span>
        Uptime = ((<span class="cmdlet">Get-Date</span>) - (<span class="cmdlet">Get-CimInstance</span> Win32_OperatingSystem).LastBootUpTime).Days
        FreeSpaceGB = [<span class="keyword">math</span>]::Round((<span class="cmdlet">Get-PSDrive</span> C).Free / 1GB, 2)
    }
} <span class="param">-ThrottleLimit</span> 10
                    </div>
                `
            },

            {
                title: "Automation Workflow Patterns",
                content: `
                    <p style="margin-bottom: 20px;">Common automation patterns for enterprise environments:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon">&#128100;</div>
                            <h5>User Provisioning</h5>

                        </div>
                        <div class="tool-card">
                            <div class="icon">&#128220;</div>
                            <h5>Compliance Reporting</h5>

                        </div>
                        <div class="tool-card">
                            <div class="icon">&#128260;</div>
                            <h5>Backup Automation</h5>

<span class="comment"># User provisioning automation example</span>
<span class="keyword">function</span> <span class="cmdlet">New-HexworthUser</span> {

    <span class="comment"># Add to department group</span>
    <span class="cmdlet">Add-ADGroupMember</span> <span class="param">-Identity</span> <span class="string">"GRP-$Department"</span> <span class="param">-Members</span> <span class="variable">$username</span>

    <span class="comment"># Create home folder</span>

}

                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">Module Structure</h4>

                                <li><strong>ModuleName.psm1</strong> - Script module</li>

                            <ul>
                                <li><strong>PSGallery</strong> - Public repository</li>
                                <li><strong>NuGet</strong> - Internal hosting</li>
                                <li><strong>Azure Artifacts</strong> - Cloud repository</li>
                                <li><strong>File Share</strong> - Simple internal repo</li>
                            </ul>
                        </div>
                    </div>
                    <div class="code-block">
<span class="comment"># Install module from PSGallery</span>
<span class="cmdlet">Install-Module</span> <span class="param">-Name</span> <span class="string">'Az.Accounts'</span> <span class="param">-Scope</span> AllUsers

<span class="comment"># Register internal repository</span>
<span class="cmdlet">Register-PSRepository</span> <span class="param">-Name</span> <span class="string">'HexworthRepo'</span> `

            {
                title: "Module Summary",
                content: `
                    <ul class="key-points">
                        <li><strong>Script Structure</strong> - Use param blocks, comment-based help, and strict mode for production scripts</li>
                        <li><strong>Error Handling</strong> - Implement Try/Catch/Finally with comprehensive logging for troubleshooting</li>
                        <li><strong>Scheduled Tasks</strong> - Automate recurring maintenance with Task Scheduler integration</li>
                        <li><strong>DSC</strong> - Desired State Configuration ensures servers maintain compliance with defined configurations</li>
                        <li><strong>Remoting</strong> - Invoke-Command and PSSession enable efficient multi-server management</li>
                        <li><strong>Modules</strong> - Package reusable functions into modules and distribute via repositories</li>
                    </ul>
                    <div style="margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 8px; text-align: center;">
                        <p style="margin-bottom: 15px;">Ready to practice?</p>
                        <a href="gui-lab.html" class="header-btn" style="margin-right: 10px;">GUI Lab</a>
                        <a href="ps-lab.html" class="header-btn" style="margin-right: 10px;">PowerShell Lab</a>
                        <a href="quiz.html" class="header-btn">Take Quiz</a>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next >';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'gui-lab.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
    <script src="../progress.js"></script>
    <script>WSAProgress.markPresentationViewed('m18');</script>
</body>
