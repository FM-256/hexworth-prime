<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M14 Quiz: Advanced Networking - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>M14: Advanced Networking Quiz</h1>
            <p>Test your knowledge of Windows Server networking features</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="presentation.html" class="results-btn secondary">Review Material</a>
                <a href="../m15-ad-sites/presentation.html" class="results-btn primary" id="nextModuleBtn">Next Module →</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which NIC Teaming mode provides the best fault tolerance without switch configuration?",
                options: ["LACP", "Static Teaming", "Switch Independent", "Hyper-V Port"],
                correct: 2,
                explanation: "Switch Independent mode doesn't require switch configuration and provides fault tolerance by using multiple NICs independently."
            },
            {
                question: "What protocol is used for LACP-based NIC Teaming?",
                options: ["802.1Q", "802.3ad", "802.11ac", "802.1X"],
                correct: 1,
                explanation: "IEEE 802.3ad (Link Aggregation Control Protocol) is used for dynamic link aggregation in LACP teaming mode."
            },
            {
                question: "What is the valid VLAN ID range?",
                options: ["0-1024", "1-4094", "1-4096", "0-65535"],
                correct: 1,
                explanation: "Valid VLAN IDs range from 1 to 4094. VLAN 0 is reserved for priority tagging and 4095 is reserved."
            },
            {
                question: "What does SDN stand for in Windows Server networking?",
                options: ["Server Data Network", "Software Defined Networking", "Secure Domain Network", "System Distribution Node"],
                correct: 1,
                explanation: "Software Defined Networking separates the network control plane from the data plane for centralized, programmable management."
            },
            {
                question: "Which PowerShell cmdlet creates a firewall rule?",
                options: ["Add-NetFirewall", "New-NetFirewallRule", "Create-FirewallRule", "Set-NetFirewall"],
                correct: 1,
                explanation: "New-NetFirewallRule is the cmdlet for creating Windows Firewall rules with advanced security."
            },
            {
                question: "What is the purpose of IPsec in Windows Server?",
                options: ["DNS resolution", "IP address assignment", "Network layer encryption and authentication", "Bandwidth management"],
                correct: 2,
                explanation: "IPsec provides authentication and encryption at the network layer (Layer 3) for secure communications."
            },
            {
                question: "Which DSCP value is typically used for VoIP traffic priority?",
                options: ["0", "26", "46", "63"],
                correct: 2,
                explanation: "DSCP 46 (Expedited Forwarding) is the standard marking for VoIP/real-time traffic requiring low latency."
            },
            {
                question: "What command tests network connectivity with port checking in PowerShell?",
                options: ["Ping-Host", "Test-NetConnection", "Test-Connection", "Get-NetConnection"],
                correct: 1,
                explanation: "Test-NetConnection can test ICMP connectivity and TCP port availability with the -Port parameter."
            },
            {
                question: "What is the primary purpose of NAT in Windows Server?",
                options: ["Encrypt traffic", "Balance load", "Translate private to public addresses", "Monitor traffic"],
                correct: 2,
                explanation: "NAT (Network Address Translation) translates private IP addresses to public addresses for internet access."
            },
            {
                question: "Which load balancing algorithm in NIC Teaming is best for Hyper-V environments?",
                options: ["Address Hash", "Dynamic", "Hyper-V Port", "Round Robin"],
                correct: 2,
                explanation: "Hyper-V Port mode distributes traffic based on virtual machine port assignment, optimal for virtualized environments."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers. You've completed the Advanced Networking module!`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;
        }

        renderQuestion();
    </script>
</body>
</html>
