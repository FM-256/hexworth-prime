    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm16',
        title: 'M16: Backup & Disaster Recovery',
        nextModule: '../m17-firewall-security/cloud-presentation.module.html',
        questions: [
            {
                question: "What is the 3-2-1 backup rule?",
                options: ["3 backups daily, 2 weekly, 1 monthly", "3 copies, 2 different media, 1 offsite", "3 servers, 2 targets, 1 schedule", "3 full backups, 2 incremental, 1 differential"],
                correct: 1,
                explanation: "The 3-2-1 rule: keep 3 copies of data, on 2 different media types, with 1 copy offsite for disaster recovery."
            },
            {
                question: "What is the difference between incremental and differential backups?",
                options: ["Incremental is faster to restore", "Differential backs up changes since last full; incremental since last any backup", "They are the same thing", "Incremental uses more storage"],
                correct: 1,
                explanation: "Differential backs up all changes since last full backup. Incremental backs up only changes since the last backup of any type."
            },
            {
                question: "What does System State backup include on a domain controller?",
                options: ["Only the registry", "AD database (NTDS.dit), SYSVOL, registry, and boot files", "Only user data", "Application databases only"],
                correct: 1,
                explanation: "On a DC, System State includes AD database, SYSVOL, registry, boot files, COM+ registration, and other critical components."
            },
            {
                question: "What is Bare Metal Recovery (BMR)?",
                options: ["Recovering from tape backup", "Restoring to completely new/blank hardware", "Backing up only metal components", "A type of incremental backup"],
                correct: 1,
                explanation: "BMR allows restoring a complete server to new hardware without pre-installing Windows. It includes all system and boot volumes."
            },
            {
                question: "What is the purpose of VSS (Volume Shadow Copy Service)?",
                options: ["To encrypt backups", "To create consistent backups of data in use", "To compress backup files", "To schedule backups"],
                correct: 1,
                explanation: "VSS creates point-in-time snapshots allowing consistent backups even while applications are running and files are open."
            },
            {
                question: "When would you use an authoritative restore of Active Directory?",
                options: ["Always when restoring a DC", "To recover accidentally deleted objects", "Only for new DC installations", "To upgrade AD schema"],
                correct: 1,
                explanation: "Authoritative restore is used to recover deleted objects. It marks restored objects with higher version numbers so they replicate to other DCs."
            },
            {
                question: "What is RPO (Recovery Point Objective)?",
                options: ["Maximum acceptable downtime", "Maximum acceptable data loss period", "Number of recovery points to keep", "Recovery procedure operations"],
                correct: 1,
                explanation: "RPO defines the maximum acceptable amount of data loss measured in time - how old the data can be when recovered."
            },
            {
                question: "Which PowerShell cmdlet creates a new backup policy?",
                options: ["Create-BackupPolicy", "New-WBPolicy", "Set-BackupSchedule", "Initialize-Backup"],
                correct: 1,
                explanation: "New-WBPolicy creates a new Windows Backup policy object that can then be configured with targets, schedules, and volumes."
            },
            {
                question: "What happens if you enable AD Recycle Bin?",
                options: ["It can be disabled later", "Deleted objects can be restored with all attributes for 180 days by default", "AD automatically backs up daily", "Nothing until the first deletion"],
                correct: 1,
                explanation: "AD Recycle Bin preserves deleted objects with all attributes intact. Objects can be restored for the tombstone lifetime (default 180 days)."
            },
            {
                question: "Why is regular backup testing important?",
                options: ["It's not important if backups complete successfully", "To verify backups can actually be restored and data is intact", "Only required for compliance", "To reduce storage usage"],
                correct: 1,
                explanation: "A backup that has never been tested is unproven. Regular testing verifies backup integrity and that recovery procedures work correctly."
            }
        ]
    });
    </script>
