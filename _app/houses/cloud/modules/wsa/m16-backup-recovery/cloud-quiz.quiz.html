<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M16 Quiz: Backup & Disaster Recovery - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M16: Backup & Disaster Recovery Quiz</h1>
            <p>Test your knowledge of backup strategies and recovery procedures</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../m17-firewall-security/cloud-presentation.module.html" class="results-btn primary" id="nextModuleBtn">Next Module</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the 3-2-1 backup rule?",
                options: ["3 backups daily, 2 weekly, 1 monthly", "3 copies, 2 different media, 1 offsite", "3 servers, 2 targets, 1 schedule", "3 full backups, 2 incremental, 1 differential"],
                correct: 1,
                explanation: "The 3-2-1 rule: keep 3 copies of data, on 2 different media types, with 1 copy offsite for disaster recovery."
            },
            {
                question: "What is the difference between incremental and differential backups?",
                options: ["Incremental is faster to restore", "Differential backs up changes since last full; incremental since last any backup", "They are the same thing", "Incremental uses more storage"],
                correct: 1,
                explanation: "Differential backs up all changes since last full backup. Incremental backs up only changes since the last backup of any type."
            },
            {
                question: "What does System State backup include on a domain controller?",
                options: ["Only the registry", "AD database (NTDS.dit), SYSVOL, registry, and boot files", "Only user data", "Application databases only"],
                correct: 1,
                explanation: "On a DC, System State includes AD database, SYSVOL, registry, boot files, COM+ registration, and other critical components."
            },
            {
                question: "What is Bare Metal Recovery (BMR)?",
                options: ["Recovering from tape backup", "Restoring to completely new/blank hardware", "Backing up only metal components", "A type of incremental backup"],
                correct: 1,
                explanation: "BMR allows restoring a complete server to new hardware without pre-installing Windows. It includes all system and boot volumes."
            },
            {
                question: "What is the purpose of VSS (Volume Shadow Copy Service)?",
                options: ["To encrypt backups", "To create consistent backups of data in use", "To compress backup files", "To schedule backups"],
                correct: 1,
                explanation: "VSS creates point-in-time snapshots allowing consistent backups even while applications are running and files are open."
            },
            {
                question: "When would you use an authoritative restore of Active Directory?",
                options: ["Always when restoring a DC", "To recover accidentally deleted objects", "Only for new DC installations", "To upgrade AD schema"],
                correct: 1,
                explanation: "Authoritative restore is used to recover deleted objects. It marks restored objects with higher version numbers so they replicate to other DCs."
            },
            {
                question: "What is RPO (Recovery Point Objective)?",
                options: ["Maximum acceptable downtime", "Maximum acceptable data loss period", "Number of recovery points to keep", "Recovery procedure operations"],
                correct: 1,
                explanation: "RPO defines the maximum acceptable amount of data loss measured in time - how old the data can be when recovered."
            },
            {
                question: "Which PowerShell cmdlet creates a new backup policy?",
                options: ["Create-BackupPolicy", "New-WBPolicy", "Set-BackupSchedule", "Initialize-Backup"],
                correct: 1,
                explanation: "New-WBPolicy creates a new Windows Backup policy object that can then be configured with targets, schedules, and volumes."
            },
            {
                question: "What happens if you enable AD Recycle Bin?",
                options: ["It can be disabled later", "Deleted objects can be restored with all attributes for 180 days by default", "AD automatically backs up daily", "Nothing until the first deletion"],
                correct: 1,
                explanation: "AD Recycle Bin preserves deleted objects with all attributes intact. Objects can be restored for the tombstone lifetime (default 180 days)."
            },
            {
                question: "Why is regular backup testing important?",
                options: ["It's not important if backups complete successfully", "To verify backups can actually be restored and data is intact", "Only required for compliance", "To reduce storage usage"],
                correct: 1,
                explanation: "A backup that has never been tested is unproven. Regular testing verifies backup integrity and that recovery procedures work correctly."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m16');
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
