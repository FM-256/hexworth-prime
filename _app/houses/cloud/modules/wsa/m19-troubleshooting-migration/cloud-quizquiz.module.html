    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm19',
        title: 'M19: Troubleshooting & Migration',
        nextModule: null,
        questions: [
            {
                question: "What is the FIRST step in the troubleshooting methodology?",
                options: ["Test the theory", "Research the problem", "Identify the problem", "Implement the solution"],
                correct: 2,
                explanation: "The troubleshooting methodology starts with identifying and defining the problem clearly before researching, hypothesizing, testing, and implementing a solution."
            },
            {
                question: "Which command checks Active Directory domain controller health?",
                options: ["adcheck", "dcdiag", "adhealth", "domaintest"],
                correct: 1,
                explanation: "dcdiag (Domain Controller Diagnostic Tool) runs a series of tests to check AD health, replication, DNS, and other DC-related functions."
            },
            {
                question: "What command shows AD replication status between domain controllers?",
                options: ["Get-ADReplication", "repadmin /replsummary", "Show-Replication", "adrepl /status"],
                correct: 1,
                explanation: "repadmin /replsummary provides a summary of AD replication status, showing any failures between domain controllers."
            },
            {
                question: "Which PowerShell cmdlet tests network connectivity including port availability?",
                options: ["Test-Connection", "Test-NetConnection", "Ping-Host", "Test-Port"],
                correct: 1,
                explanation: "Test-NetConnection tests network connectivity and can check specific ports with -Port parameter. Test-Connection is similar to ping but doesn't test ports."
            },
            {
                question: "What command repairs the Windows boot sector?",
                options: ["fixboot", "bootrec /fixboot", "bootfix", "repair-boot"],
                correct: 1,
                explanation: "bootrec /fixboot writes a new boot sector to the system partition. Other bootrec options include /fixmbr and /rebuildbcd."
            },
            {
                question: "What type of AD restore replicates the restored data TO other domain controllers?",
                options: ["Non-authoritative restore", "Authoritative restore", "Full restore", "Selective restore"],
                correct: 1,
                explanation: "Authoritative restore marks the restored objects with a higher version number, causing them to replicate TO other DCs instead of being overwritten by replication."
            },
            {
                question: "Which command checks and repairs Windows system files?",
                options: ["chkdsk /f", "sfc /scannow", "repair /windows", "fixfiles"],
                correct: 1,
                explanation: "sfc /scannow (System File Checker) scans and repairs protected Windows system files. DISM can also repair the Windows image."
            },
            {
                question: "What Windows Server feature enables seamless file server migration?",
                options: ["File Migration Wizard", "Storage Migration Service", "Server Migration Tool", "Data Transfer Service"],
                correct: 1,
                explanation: "Storage Migration Service (SMS) enables seamless file server migration with inventory, transfer, and cutover phases, preserving server identity."
            },
            {
                question: "Which Kerberos-related event ID indicates authentication failure?",
                options: ["4624", "4625", "4771", "4768"],
                correct: 2,
                explanation: "Event ID 4771 indicates Kerberos pre-authentication failed. 4624 is successful logon, 4625 is failed logon (general), and 4768 is Kerberos ticket request."
            },
            {
                question: "What is the purpose of the 'swing migration' approach?",
                options: ["Upgrade OS in place", "Use temporary server during transition", "Migrate one user at a time", "Parallel running of old and new systems"],
                correct: 1,
                explanation: "Swing migration uses a temporary intermediate server to hold roles/data while the original server is rebuilt, then migrates back. Useful when hardware is reused."
            }
        ]
    });
    </script>
