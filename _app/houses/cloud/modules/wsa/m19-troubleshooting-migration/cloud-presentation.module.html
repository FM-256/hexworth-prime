    <style>

        .code-block .comment { color: #8b949e; }

        .warning-box { background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--warning-color); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .error-box { background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--error-color); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .nav-footer { background: var(--secondary-bg); padding: 12px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); }
        .footer-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.9rem; }

    <script>
        const slides = [
            // Slide 1: Title
            {
                title: "Troubleshooting & Migration",
                content: `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="font-size: 5rem; margin-bottom: 20px;"><img src="/assets/images/icons/icon-wrench.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                        <h2 style="color: var(--warning-color); font-size: 1.8rem; margin-bottom: 15px;">Module 19: Diagnose, Repair, Migrate</h2>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                            Master troubleshooting methodologies, diagnostic tools, and migration strategies for Windows Server environments.
                        </p>
                        <div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;"><img src="/assets/images/icons/icon-magnifier.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                                <div style="color: var(--warning-color); font-weight: 600;">Diagnose</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;"><img src="/assets/images/icons/icon-tools.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                                <div style="color: var(--success-color); font-weight: 600;">Repair</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;"><img src="/assets/images/icons/icon-rocket.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                                <div style="color: var(--accent-blue); font-weight: 600;">Migrate</div>
                            </div>
                        </div>
                    </div>
                `
            },
            // Slide 2: Troubleshooting Methodology
            {
                title: "Troubleshooting Methodology",
                content: `
                    <p style="margin-bottom: 20px;">Follow a systematic approach to diagnose and resolve issues:</p>
                    <div class="troubleshoot-flow">
                        <div class="flow-step">
                            <div class="num">1</div>
                            <p><strong>Identify</strong><br>Define the problem</p>
                        </div>
                        <span class="flow-arrow">&rarr;</span>
                        <div class="flow-step">
                            <div class="num">2</div>
                            <p><strong>Research</strong><br>Gather information</p>
                        </div>
                        <span class="flow-arrow">&rarr;</span>
                        <div class="flow-step">
                            <div class="num">3</div>
                            <p><strong>Hypothesize</strong><br>Theory of cause</p>
                        </div>
                        <span class="flow-arrow">&rarr;</span>
                        <div class="flow-step">
                            <div class="num">4</div>
                            <p><strong>Test</strong><br>Verify the theory</p>
                        </div>
                        <span class="flow-arrow">&rarr;</span>
                        <div class="flow-step">
                            <div class="num">5</div>
                            <p><strong>Resolve</strong><br>Implement fix</p>
                        </div>
                    </div>
                    <ul class="key-points" style="margin-top: 30px;">
                        <li><strong>Document everything</strong> - Keep detailed notes of symptoms, changes, and results</li>
                        <li><strong>Change one thing at a time</strong> - Isolate variables to identify root cause</li>
                        <li><strong>Check the simple things first</strong> - Verify cables, power, DNS before complex analysis</li>
                        <li><strong>Use baseline comparisons</strong> - Compare against known-good configurations</li>
                    </ul>
                `
            },
            // Slide 3: Built-in Diagnostic Tools
            {
                title: "Built-in Diagnostic Tools",
                content: `
                    <p style="margin-bottom: 20px;">Windows Server includes powerful diagnostic utilities:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Event Viewer</h5>
                            <p>System, application, and security logs</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Resource Monitor</h5>
                            <p>Real-time CPU, memory, disk, network</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Reliability Monitor</h5>
                            <p>System stability timeline</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Best Practices Analyzer</h5>
                            <p>Configuration recommendations</p>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">Pull the most recent critical and error events from the System log to spot failures fast.</p>
                    <div class="code-block">
<span class="comment"># Filter System log for critical/error events</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-WinEvent -LogName System -MaxEvents 50 | Where-Object Level -le 2</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="prompt">TimeCreated          Id  LevelDisplayName  Message</span>
<span class="comment">-----------          --  ----------------  -------</span>
<span class="command">1/15/2025 3:22 AM</span>    41  <span class="command">Critical</span>          The system has rebooted...
<span class="command">1/14/2025 9:05 PM</span>  1014  <span class="command">Error</span>             Name resolution for...
                    </div>

                    <p>Check real-time memory availability to identify resource pressure.</p>
                    <div class="code-block">
<span class="comment"># Query available memory in megabytes</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Counter '\\Memory\\Available MBytes'</span>
                    </div>

                    <p>Verify that a specific port is reachable on a remote server, which confirms both network path and service availability.</p>
                    <div class="code-block">
<span class="comment"># Test SMB connectivity to a domain controller</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Test-NetConnection -ComputerName DC01 -Port 445</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="prompt">ComputerName     RemotePort  TcpTestSucceeded</span>
<span class="comment">------------     ----------  ----------------</span>
<span class="command">DC01</span>             445         <span class="command">True</span>
                    </div>

                    <p>Confirm DNS resolution is returning the correct address for your domain.</p>
                    <div class="code-block">
<span class="comment"># Resolve a DNS A record for the domain</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Resolve-DnsName -Name 'hexworth.local' -Type A</span>
                    </div>
                `
            },
            // Slide 4: Network Troubleshooting
            {
                title: "Network Troubleshooting",
                content: `
                    <p style="margin-bottom: 20px;">Diagnose connectivity and network service issues:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h3 style="color: var(--accent-blue);">Connectivity Tests</h3>
                            <ul>
                                <li><strong>ping</strong> - Basic reachability</li>
                                <li><strong>tracert</strong> - Route path analysis</li>
                                <li><strong>pathping</strong> - Combined ping + trace</li>
                                <li><strong>Test-NetConnection</strong> - Port connectivity</li>
                                <li><strong>nslookup/Resolve-DnsName</strong> - DNS resolution</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h3 style="color: var(--success-color);">Common Issues</h3>
                            <ul>
                                <li>IP address conflicts</li>
                                <li>DNS server misconfiguration</li>
                                <li>Firewall blocking traffic</li>
                                <li>VLAN/subnet mismatches</li>
                                <li>MTU size issues</li>
                            </ul>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">Start by reviewing the full IP configuration to confirm addresses, gateways, and DNS servers are correct.</p>
                    <div class="code-block">
<span class="comment"># Display full IP configuration for all adapters</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-NetIPConfiguration</span>
                    </div>

                    <p>Check which adapters are active and their link speed to rule out physical layer issues.</p>
                    <div class="code-block">
<span class="comment"># List adapter status and link speed</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-NetAdapter | Select-Object Name, Status, LinkSpeed</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="prompt">Name           Status  LinkSpeed</span>
<span class="comment">----           ------  ---------</span>
<span class="command">Ethernet</span>       Up      <span class="command">1 Gbps</span>
<span class="command">Wi-Fi</span>          Up      <span class="command">300 Mbps</span>
                    </div>

                    <p>Verify that the correct DNS servers are assigned to each interface.</p>
                    <div class="code-block">
<span class="comment"># Show DNS server addresses per interface</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-DnsClientServerAddress</span>
                    </div>

                    <p>Identify which ports have services actively listening, which helps detect conflicts or unexpected services.</p>
                    <div class="code-block">
<span class="comment"># List all listening ports with process IDs</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">netstat -ano | Select-String 'LISTENING'</span>
                    </div>

                    <p>Run a detailed connectivity test against LDAP on a domain controller to confirm AD communication.</p>
                    <div class="code-block">
<span class="comment"># Test LDAP port connectivity with full details</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Test-NetConnection -ComputerName DC01 -Port 389 -InformationLevel Detailed</span>
                    </div>
                `
            },
            // Slide 5: Active Directory Troubleshooting
            {
                title: "Active Directory Troubleshooting",
                content: `
                    <p style="margin-bottom: 20px;">Diagnose AD replication, authentication, and DNS issues:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h3 style="color: var(--error-color);">Replication Issues</h3>
                            <ul>
                                <li><strong>repadmin /replsummary</strong> - Replication status</li>
                                <li><strong>repadmin /showrepl</strong> - Detailed replication info</li>
                                <li><strong>repadmin /syncall</strong> - Force replication</li>
                                <li><strong>dcdiag /test:replications</strong> - Replication test</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h3 style="color: var(--warning-color);">Authentication Issues</h3>
                            <ul>
                                <li><strong>nltest /dsgetdc:</strong> - DC discovery</li>
                                <li><strong>klist</strong> - Kerberos tickets</li>
                                <li><strong>setspn -L</strong> - SPN listing</li>
                                <li><strong>Event ID 4771</strong> - Kerberos failures</li>
                            </ul>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">Run dcdiag in verbose mode for a comprehensive domain controller health report covering DNS, replication, and services.</p>
                    <div class="code-block">
<span class="comment"># Run full DC diagnostics in verbose mode</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">dcdiag /v</span>
                    </div>

                    <p>Get a quick summary of replication status across all domain controllers to spot failures.</p>
                    <div class="code-block">
<span class="comment"># Show replication summary for all DCs</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">repadmin /replsummary</span>
                    </div>

                    <p>Query specific replication failures on a named DC to pinpoint the source of replication problems.</p>
                    <div class="code-block">
<span class="comment"># Check replication failures on a specific DC</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-ADReplicationFailure -Target DC01</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="prompt">Server       FirstFailureTime  FailureCount  FailureType</span>
<span class="comment">------       ----------------  ------------  -----------</span>
<span class="command">DC02</span>         1/10/2025 2:15AM  3             <span class="command">1722 (RPC unavailable)</span>
                    </div>

                    <p>Verify which domain controller a client is authenticating against and confirm proper DC discovery.</p>
                    <div class="code-block">
<span class="comment"># Discover which DC is servicing this domain</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">nltest /dsgetdc:hexworth.local</span>
                    </div>

                    <p>List all domain controllers with their site assignments and Global Catalog status for topology review.</p>
                    <div class="code-block">
<span class="comment"># List all DCs with site and GC status</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-ADDomainController -Filter * | Select-Object Name, Site, IsGlobalCatalog</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="prompt">Name    Site              IsGlobalCatalog</span>
<span class="comment">----    ----              ---------------</span>
<span class="command">DC01</span>    Default-First     <span class="command">True</span>
<span class="command">DC02</span>    Branch-Office     <span class="command">True</span>
                    </div>
                `
            },
            // Slide 6: Boot and Startup Issues
            {
                title: "Boot & Startup Issues",
                content: `
                    <p style="margin-bottom: 20px;">Recover from boot failures and startup problems:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-chain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Safe Mode</h5>
                            <p>Boot with minimal drivers and services</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-plug.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Last Known Good</h5>
                            <p>Previous successful configuration</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-memory.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>System Restore</h5>
                            <p>Roll back to restore point</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-gear.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Startup Repair</h5>
                            <p>Automatic boot sector repair</p>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">From the Windows Recovery Environment command prompt, repair the Master Boot Record if the system cannot find the boot partition.</p>
                    <div class="code-block">
<span class="comment"># Repair the Master Boot Record (WinRE)</span>
<span class="prompt">C:\\&gt;</span> <span class="command">bootrec /fixmbr</span>
                    </div>

                    <p>Write a new boot sector to the system partition to fix corrupted boot code.</p>
                    <div class="code-block">
<span class="comment"># Write a new boot sector</span>
<span class="prompt">C:\\&gt;</span> <span class="command">bootrec /fixboot</span>
                    </div>

                    <p>Rebuild the Boot Configuration Data store when Windows installations are not listed at startup.</p>
                    <div class="code-block">
<span class="comment"># Rebuild the BCD store</span>
<span class="prompt">C:\\&gt;</span> <span class="command">bootrec /rebuildbcd</span>
                    </div>

                    <p>Review the full boot configuration to verify OS entries, boot device paths, and recovery settings.</p>
                    <div class="code-block">
<span class="comment"># Display all boot configuration entries</span>
<span class="prompt">C:\\&gt;</span> <span class="command">bcdedit /enum all</span>
                    </div>

                    <p>Scan for and repair corrupted system files. If SFC finds unrepairable files, use DISM to restore the component store first.</p>
                    <div class="code-block">
<span class="comment"># Scan and repair protected system files</span>
<span class="prompt">C:\\&gt;</span> <span class="command">sfc /scannow</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Repair the Windows component store (run before SFC if needed)</span>
<span class="prompt">C:\\&gt;</span> <span class="command">DISM /Online /Cleanup-Image /RestoreHealth</span>
                    </div>
                    <div class="error-box">
                        <strong>Stop Errors (BSOD):</strong> Check minidump files in C:\\Windows\\Minidump for crash analysis. Use WinDbg or BlueScreenView to analyze.
                    </div>
                `

            // Slide 7: Windows Server Backup & Recovery
            {
                title: "Backup & Recovery",
                content: `
                    <p style="margin-bottom: 20px;">Implement backup strategies and perform system recovery:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h3 style="color: var(--accent-blue);">Backup Types</h3>
                            <ul>
                                <li><strong>Full Server</strong> - Complete system state + data</li>
                                <li><strong>System State</strong> - AD, registry, boot files</li>
                                <li><strong>Bare Metal</strong> - Full recovery to new hardware</li>
                                <li><strong>Volume/File</strong> - Specific data backup</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h3 style="color: var(--success-color);">Recovery Options</h3>
                            <ul>
                                <li><strong>Non-authoritative</strong> - Restore and replicate from other DCs</li>
                                <li><strong>Authoritative</strong> - Restore and replicate TO other DCs</li>
                                <li><strong>BMR</strong> - Bare metal restore to new server</li>
                                <li><strong>File Recovery</strong> - Restore individual files</li>
                            </ul>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">First, install the Windows Server Backup feature if it is not already present.</p>
                    <div class="code-block">
<span class="comment"># Install the Windows Server Backup feature</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-WindowsFeature Windows-Server-Backup</span>
                    </div>

                    <p>Create a backup policy, target the C: volume and system state, then execute the backup. These commands chain together through the $policy variable.</p>
                    <div class="code-block">
<span class="comment"># Build and run a backup policy for C: drive + system state</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">$policy = New-WBPolicy</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">$volume = Get-WBVolume -AllVolumes | Where-Object MountPoint -eq 'C:'</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-WBVolume -Policy $policy -Volume $volume</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-WBSystemState -Policy $policy</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Start-WBBackup -Policy $policy</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment">-------------------------------------------</span>
Backup started at <span class="command">1/15/2025 10:30:00 PM</span>
Creating volume shadow copy...
<span class="command">Backup completed successfully.</span>
                    </div>
                `
            },
            // Slide 8: Server Migration Strategies
            {
                title: "Server Migration Strategies",
                content: `
                    <p style="margin-bottom: 20px;">Plan and execute migrations between Windows Server versions:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h3 style="color: var(--accent-blue);">Migration Approaches</h3>
                            <ul>
                                <li><strong>In-place Upgrade</strong> - Upgrade OS on same hardware</li>
                                <li><strong>Side-by-side</strong> - New server, migrate roles/data</li>
                                <li><strong>Swing Migration</strong> - Temporary server during transition</li>
                                <li><strong>Cluster Rolling</strong> - Upgrade cluster nodes one at a time</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h3 style="color: var(--success-color);">Migration Tools</h3>
                            <ul>
                                <li><strong>Windows Server Migration Tools</strong></li>
                                <li><strong>Storage Migration Service</strong></li>
                                <li><strong>ADMT</strong> - AD Migration Tool</li>
                                <li><strong>USMT</strong> - User State Migration Tool</li>
                            </ul>
                        </div>
                    </div>
                    <div class="warning-box">
                        <strong>Migration Checklist:</strong>
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            <li>Inventory current roles, features, and applications</li>
                            <li>Verify hardware/software compatibility</li>
                            <li>Full backup before migration</li>
                            <li>Test in lab environment first</li>
                            <li>Plan rollback procedure</li>
                        </ul>
                    </div>
                `
            },
            // Slide 9: Storage Migration Service
            {
                title: "Storage Migration Service",
                content: `
                    <p style="margin-bottom: 20px;">Migrate file servers with identity preservation:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-barchart.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Inventory</h5>
                            <p>Scan source servers for shares and data</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-package.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Transfer</h5>
                            <p>Copy data and permissions to destination</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon"><img src="/assets/images/icons/icon-refresh.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></div>
                            <h5>Cutover</h5>
                            <p>Swap identities (name/IP) seamlessly</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">&#10004;</div>
                            <h5>Validate</h5>
                            <p>Verify migration success</p>
                        </div>
                    </div>
                    <p style="margin-top: 15px;">Install the Storage Migration Service proxy on the destination server.</p>
                    <div class="code-block">
<span class="comment"># Install the SMS proxy feature</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Install-WindowsFeature SMS-Proxy</span>
                    </div>

                    <p>Create a named migration job that will track the entire migration lifecycle.</p>
                    <div class="code-block">
<span class="comment"># Create a new migration job</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">New-SmsJob -Name "FileServer-Migration"</span>
                    </div>

                    <p>Define the source and destination servers for this migration job.</p>
                    <div class="code-block">
<span class="comment"># Add the source server to the migration job</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-SmsSourceComputer -Name "FileServer-Migration" -ComputerName "FS-OLD"</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Set the destination server for the migration job</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Set-SmsDestinationComputer -Name "FileServer-Migration" -ComputerName "FS-NEW"</span>
                    </div>

                    <p>Execute the three migration phases in order: inventory scans shares, transfer copies data, and cutover swaps server identities.</p>
                    <div class="code-block">
<span class="comment"># Phase 1: Scan source for shares and data</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Start-SmsInventory -Name "FileServer-Migration"</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Phase 2: Copy data and permissions to destination</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Start-SmsTransfer -Name "FileServer-Migration"</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Phase 3: Swap identities (name/IP) to complete migration</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Start-SmsCutover -Name "FileServer-Migration"</span>
                    </div>
                `
            },
            // Slide 10: Summary
            {
                title: "Module Summary",
                content: `

                        <li><strong>Methodology</strong> - Follow systematic troubleshooting: Identify, Research, Hypothesize, Test, Resolve</li>

                    <div style="margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 8px; text-align: center;">
                        <p style="margin-bottom: 15px;">Ready to practice?</p>
                        <a href="cloud-guilab.module.html" class="header-btn" style="margin-right: 10px;">GUI Lab</a>

                        <a href="cloud-quizquiz.module.html" class="header-btn">Take Quiz</a>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next >';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'cloud-guilab.module.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
