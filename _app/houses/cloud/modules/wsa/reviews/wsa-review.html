  <h1>Windows Server Administration Review</h1>
  <p class="subtitle">5 categories &middot; 25 questions &middot; Jeopardy-style board</p>
  <div id="review-root"></div>
</div>
<script src="../../../../../components/ReviewEngine.js"></script>
<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'Windows Server Administration Review',
  storageKey: 'hexworth_review_wsa',
  houseId: 'cloud',
  categories: [
    {
      name: 'Active Directory',
      questions: [
        { value: 100, question: 'What is the primary database that stores all user accounts, computer accounts, and security policies in a Windows domain?', options: ['SAM database','Active Directory Domain Services','LDAP server','DNS zone file'], correct: 1, explanation: 'Active Directory Domain Services (AD DS) is the directory service that stores information about objects on a network and makes this information available to users and administrators.' },
        { value: 200, question: 'An administrator needs to delegate password reset capabilities for a specific OU to the help desk team. Which tool should they use?', options: ['Active Directory Sites and Services','Group Policy Management Console','Delegation of Control Wizard','ADSI Edit'], correct: 2, explanation: 'The Delegation of Control Wizard in Active Directory Users and Computers allows granular delegation of specific administrative tasks to users or groups for a particular OU.' },
        { value: 300, question: 'A company has offices in New York and London connected by a WAN link. Replication between domain controllers is slow. What should the administrator configure to control replication scheduling?', options: ['Organizational Units','Active Directory Sites and site links','Trust relationships','Domain functional level'], correct: 1, explanation: 'AD Sites and Services allows administrators to define sites representing physical locations and configure site links to control replication topology, scheduling, and cost across WAN connections.' },
        { value: 400, question: 'An administrator runs dcdiag and discovers that the SYSVOL share is not being replicated to a new domain controller. The domain is at Windows Server 2016 functional level. Which replication mechanism should be verified?', options: ['FRS (File Replication Service)','NTFRS','DFS-R (Distributed File System Replication)','SMB replication'], correct: 2, explanation: 'At Windows Server 2016 functional level, SYSVOL replication uses DFS-R (Distributed File System Replication), which replaced the older FRS. The administrator should verify DFS-R health using dfsrdiag.' },
        { value: 500, question: 'A multi-domain forest has a child domain that was decommissioned. Users in the parent domain still see stale SID entries in access control lists referencing the deleted domain. What is the most efficient remediation approach?', options: ['Delete and recreate all affected ACLs manually','Run a SID cleanup using ntdsutil and then audit ACLs with PowerShell','Raise the forest functional level to clear stale SIDs','Perform an authoritative restore of the parent domain'], correct: 1, explanation: 'Using ntdsutil for metadata cleanup removes stale domain controller and domain references, and PowerShell scripts like Get-Acl can audit and clean orphaned SID entries across the remaining domain objects.' }
      ]
    },
    {
      name: 'DNS & DHCP',
      questions: [
        { value: 100, question: 'Which DNS record type maps a hostname to an IPv4 address?', options: ['AAAA','CNAME','A','MX'], correct: 2, explanation: 'An A (Address) record maps a fully qualified domain name to an IPv4 address. AAAA records are used for IPv6 addresses.' },
        { value: 200, question: 'A DHCP server has a scope of 192.168.1.100-200 but the administrator wants to ensure the printer at .150 always receives the same address. What should be configured?', options: ['A DNS static entry','A DHCP exclusion range','A DHCP reservation','A secondary scope'], correct: 2, explanation: 'A DHCP reservation binds a specific IP address to a device MAC address, ensuring the same IP is always assigned to that device while still managed by DHCP for options like gateway and DNS.' },
        { value: 300, question: 'Users in a branch office can access internal resources by IP but not by name. The local DNS server forwards to the main office DNS. What is the most likely issue?', options: ['The forwarder IP is incorrect','DNS conditional forwarder is missing the internal zone','The branch DNS server needs a secondary zone for the internal domain','DNSSEC is blocking unsigned queries'], correct: 2, explanation: 'A conditional forwarder routes queries for a specific domain to designated DNS servers. Without it, the branch DNS would use root hints or general forwarders which do not resolve internal names.' },
        { value: 400, question: 'An administrator notices that DHCP lease requests are failing on a remote subnet even though the DHCP server is operational. The server and clients are on different VLANs. What component is most likely missing?', options: ['A DHCP failover partner','An IP helper address (DHCP relay agent) on the router','A superscope on the DHCP server','A multicast scope'], correct: 1, explanation: 'DHCP broadcast messages do not cross router boundaries. An IP helper address (ip helper-address) configured on the router interface facing the remote subnet forwards DHCP broadcasts to the DHCP server as unicast.' },
        { value: 500, question: 'An organization uses split-brain DNS where the same zone name exists on both internal and external DNS servers. Internal users suddenly cannot access the public website while external users can. Internal DNS resolves the name to an old internal IP. What is the root cause and fix?', options: ['DNSSEC validation failure; disable DNSSEC','Stale A record in the internal zone; update the internal zone record to point to the correct address','DNS cache poisoning; flush all DNS caches','The external DNS TTL expired; increase the TTL value'], correct: 1, explanation: 'In split-brain DNS, the internal DNS server is authoritative for the zone and serves its own records. If the internal A record is stale or points to a decommissioned server, internal clients get the wrong IP. The fix is updating the internal zone record.' }
      ]
    },
    {
      name: 'Group Policy',
      questions: [
        { value: 100, question: 'What is the order in which Group Policy Objects are applied?', options: ['Site, Domain, OU, Local','Local, Site, Domain, OU','Domain, Site, OU, Local','OU, Domain, Site, Local'], correct: 1, explanation: 'GPOs are applied in LSDOU order: Local policy first, then Site, Domain, and finally Organizational Unit. The last policy applied wins in case of conflicts.' },
        { value: 200, question: 'An administrator wants to prevent users from accessing the Control Panel on all workstations. Which GPO setting path should they navigate to?', options: ['Computer Configuration > Administrative Templates > System','User Configuration > Administrative Templates > Control Panel','Computer Configuration > Windows Settings > Security Settings','User Configuration > Preferences > Control Panel Settings'], correct: 1, explanation: 'The "Prohibit access to Control Panel and PC Settings" policy is found under User Configuration > Administrative Templates > Control Panel. This prevents users from opening Control Panel.' },
        { value: 300, question: 'A GPO is linked to the Sales OU but the IT staff in the Sales OU should be exempt from the policy. What is the most efficient way to accomplish this without moving users?', options: ['Create a new OU for IT staff in Sales','Use WMI filtering to exclude IT staff','Apply security filtering: remove Authenticated Users and add only non-IT groups','Block inheritance on a child OU containing IT staff'], correct: 2, explanation: 'Security filtering allows you to specify which security principals (users, computers, groups) the GPO applies to. Removing Authenticated Users and adding specific groups effectively exempts IT staff.' },
        { value: 400, question: 'An administrator runs gpresult /r on a workstation and discovers that a GPO is listed under "The following GPOs were not applied because they were filtered out" with a reason of "Denied (Security)." What does this indicate?', options: ['The GPO is disabled at the domain level','The computer account does not have Read and Apply Group Policy permissions on the GPO','WMI filter evaluated to false','The GPO link is not enforced'], correct: 1, explanation: 'A "Denied (Security)" status in gpresult means the security filtering on the GPO explicitly denies or does not grant the "Apply Group Policy" permission to the computer or user account being evaluated.' },
        { value: 500, question: 'Multiple GPOs at different levels contain conflicting settings for the same policy. One GPO at the domain level is set to Enforced. A child OU has Block Inheritance enabled. Another GPO is linked to the child OU. Which policy takes final precedence?', options: ['The child OU GPO because it is closest to the object','The domain-level enforced GPO because Enforced overrides Block Inheritance','Block Inheritance cancels all higher-level GPOs including Enforced','The local policy always wins as the last applied'], correct: 1, explanation: 'An Enforced (No Override) GPO setting at a higher level takes precedence over Block Inheritance at a lower level. Enforced GPOs cannot be blocked, ensuring domain-wide policies are always applied.' }
      ]
    },
    {
      name: 'Server Roles',
      questions: [
        { value: 100, question: 'Which Windows Server role provides centralized file storage and enables users to access shared files over the network?', options: ['Web Server (IIS)','File and Storage Services','Remote Desktop Services','Hyper-V'], correct: 1, explanation: 'File and Storage Services is the built-in server role that manages shared folders, disk storage, and provides features like DFS, BranchCache, and iSCSI target for centralized file access.' },
        { value: 200, question: 'A company needs to deploy a certification authority to issue SSL certificates for internal web servers. Which server role should be installed?', options: ['Network Policy and Access Services','Active Directory Certificate Services','Web Server (IIS)','Active Directory Federation Services'], correct: 1, explanation: 'Active Directory Certificate Services (AD CS) provides a PKI infrastructure for issuing and managing digital certificates, including SSL/TLS certificates for internal services.' },
        { value: 300, question: 'An organization wants to allow remote workers to access internal applications through a web browser without a VPN. Which role service combination should be deployed?', options: ['DirectAccess and Routing','Remote Desktop Gateway and RemoteApp','Web Application Proxy and AD FS','IIS with Windows Authentication'], correct: 2, explanation: 'Remote Desktop Gateway allows remote users to connect to internal resources over HTTPS, and RemoteApp publishes specific applications to users through a web portal or Start menu without exposing the full desktop.' },
        { value: 400, question: 'An administrator configures Windows Server 2022 as a RADIUS server for 802.1X wireless authentication. Which role and policy type are required?', options: ['AD FS with claims-based authentication','Network Policy and Access Services with NPS network policies','DHCP with MAC-based authentication','Web Application Proxy with preauthentication'], correct: 1, explanation: 'Network Policy Server (NPS) is Microsoft\'s RADIUS implementation. Network policies define conditions, constraints, and settings for authenticating 802.1X wireless clients against Active Directory.' },
        { value: 500, question: 'A Windows Server is configured with both the Hyper-V role and the Remote Desktop Session Host role on the same physical server. Users report intermittent performance issues during peak hours. What is the fundamental architectural problem and recommended fix?', options: ['The roles are incompatible and cannot coexist; uninstall one role','Resource contention between VMs and RD sessions; separate these roles onto dedicated physical or virtual servers following Microsoft best practices','The issue is caused by insufficient RAM; simply add more memory','RDSH requires Server Core installation; convert to Server Core'], correct: 1, explanation: 'Microsoft recommends against running RDSH on a Hyper-V host because both roles compete for CPU, memory, and I/O resources. The solution is role separation: dedicated hosts for Hyper-V and separate VMs or physical servers for RDSH.' }
      ]
    },
    {
      name: 'PowerShell Admin',
      questions: [
        { value: 100, question: 'Which PowerShell cmdlet retrieves a list of all Active Directory users?', options: ['Get-ADUser -Filter *','Get-User -All','List-ADAccounts','Find-ADUser -Scope All'], correct: 0, explanation: 'Get-ADUser -Filter * retrieves all user objects from Active Directory. The -Filter parameter is required and the asterisk wildcard matches all users.' },
        { value: 200, question: 'An administrator needs to find all disabled user accounts in the "Sales" OU. Which command is correct?', options: ['Get-ADUser -Filter {Enabled -eq $false} -SearchBase "OU=Sales,DC=corp,DC=local"','Search-ADAccount -Disabled -OU "Sales"','Get-ADUser -SearchBase "Sales" | Where Disabled','Find-ADUser -Status Disabled -Path Sales'], correct: 0, explanation: 'Get-ADUser with a -Filter for Enabled -eq $false and -SearchBase set to the Sales OU distinguished name returns all disabled accounts in that specific OU.' },
        { value: 300, question: 'An administrator wants to restart the DNS Server service on three remote servers simultaneously. Which approach is most efficient?', options: ['RDP to each server and restart the service manually','Invoke-Command -ComputerName DC1,DC2,DC3 -ScriptBlock { Restart-Service DNS }','Restart-Service DNS -ComputerName DC1; Restart-Service DNS -ComputerName DC2; Restart-Service DNS -ComputerName DC3','Send-RestartCommand -Service DNS -Targets DC1,DC2,DC3'], correct: 1, explanation: 'Invoke-Command with multiple computer names runs the script block in parallel on all specified servers using PowerShell Remoting (WinRM), making it the most efficient approach for simultaneous operations.' },
        { value: 400, question: 'An administrator needs to create a scheduled task via PowerShell that runs a backup script every night at 2:00 AM under a service account with highest privileges. Which set of cmdlets should be combined?', options: ['New-ScheduledTask with -Trigger and -Action parameters only','New-ScheduledTaskTrigger, New-ScheduledTaskAction, New-ScheduledTaskPrincipal, then Register-ScheduledTask','Set-ScheduledJob -Trigger (New-JobTrigger -Daily -At 2am)','Add-ScheduledTask -Script backup.ps1 -Time "02:00" -RunAs ServiceAccount'], correct: 1, explanation: 'The proper approach uses New-ScheduledTaskTrigger to define when, New-ScheduledTaskAction for what to run, New-ScheduledTaskPrincipal for the identity and privilege level (RunLevel Highest), then Register-ScheduledTask to create it.' },
        { value: 500, question: 'An organization needs to audit all servers for a specific registry value across 200 machines. The script must handle offline servers gracefully, log results to a CSV, and complete within a maintenance window. Which PowerShell pattern best solves this?', options: ['A foreach loop with Test-Connection, Get-ItemProperty via Invoke-Command, and Export-Csv','A workflow with parallel execution using ForEach -Parallel','A simple ForEach loop with direct registry access via .NET classes','Using Group Policy Preferences to read registry values'], correct: 0, explanation: 'Testing connectivity first (Test-Connection) prevents timeout delays on offline servers. Invoke-Command handles remote registry reads efficiently, and Export-Csv produces the audit log. While workflows offer parallelism, they are deprecated in PowerShell 7+; the foreach pattern with -ThrottleLimit on Invoke-Command is the modern best practice.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'Windows Server Synthesis',
    question: 'A company is deploying a new branch office with 50 users. They need local authentication if the WAN link fails, name resolution for internal resources, automatic IP addressing, and the ability to apply group policies locally. What is the minimum set of roles that must be installed on a single server at the branch to meet all requirements?',
    options: [
      'AD DS, DNS, DHCP, and File Services',
      'AD DS (as a RODC), DNS, and DHCP',
      'DNS, DHCP, and Web Server (IIS)',
      'AD DS, DNS, DHCP, and Remote Desktop Services'
    ],
    correct: 1,
    explanation: 'A Read-Only Domain Controller (RODC) provides local authentication and Group Policy processing during WAN outages without the security risk of a writable DC at a branch. DNS integrates with AD for name resolution, and DHCP handles automatic IP addressing. File Services and RDS are not required to meet the stated requirements.'
  },
  onComplete: function(results) {
    console.log('WSA Review complete:', results);
  }
});
</script>
