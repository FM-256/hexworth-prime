<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- Progress & Achievements -->
    <script src="../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Advanced Skills Gauntlet - Hexworth Enterprise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .g-header {
            background: rgba(0,0,0,0.85);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #dc2626;
            flex-shrink: 0;
            z-index: 10;
        }
        .g-header-left { display: flex; align-items: center; gap: 15px; }
        .g-header h1 { color: #dc2626; font-size: 1.05rem; letter-spacing: 3px; }
        .g-score {
            background: rgba(220,38,38,0.1);
            border: 1px solid rgba(220,38,38,0.3);
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #fca5a5;
        }
        .g-fix-bonus { color: #22c55e; font-size: 0.8rem; margin-left: 4px; }
        .g-grade {
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .g-header-right { display: flex; gap: 10px; align-items: center; }
        .g-hbtn {
            padding: 6px 14px;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.3);
            color: #60a5fa;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .g-hbtn:hover { background: #60a5fa; color: #000; }
        .g-timer { color: #9ca3af; font-size: 0.8rem; font-family: 'Cascadia Code', monospace; }

        /* ── Server Tabs ── */
        .g-server-tabs {
            display: flex;
            gap: 0;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .g-server-tab {
            padding: 8px 24px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            color: #6b7280;
        }
        .g-server-tab:hover { color: #e0e0e0; background: rgba(255,255,255,0.03); }
        .g-server-tab.active-hq { color: #22c55e; border-bottom-color: #22c55e; background: rgba(34,197,94,0.05); }
        .g-server-tab.active-alpha { color: #3b82f6; border-bottom-color: #3b82f6; background: rgba(59,130,246,0.05); }
        .g-server-tab.active-beta { color: #a855f7; border-bottom-color: #a855f7; background: rgba(168,85,247,0.05); }

        /* ── Main Layout ── */
        .g-main { display: flex; flex: 1; overflow: hidden; }

        /* ── Sidebar ── */
        .g-sidebar {
            width: 280px;
            background: rgba(0,0,0,0.5);
            border-right: 1px solid rgba(220,38,38,0.15);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .g-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .g-filter-section { width: 100%; display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
        .g-filter-label { width: 100%; font-size: 0.6rem; color: #555; text-transform: uppercase; letter-spacing: 1px; padding: 2px 0; }
        .g-filter-btn {
            padding: 3px 7px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: all 0.2s;
        }
        .g-filter-btn.active { background: #dc2626; color: #fff; border-color: #dc2626; }
        .g-filter-btn.active-hq { background: #22c55e; color: #000; border-color: #22c55e; }
        .g-filter-btn.active-alpha { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .g-filter-btn.active-beta { background: #a855f7; color: #fff; border-color: #a855f7; }
        .g-obj-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .g-obj-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .g-obj-item:hover { background: rgba(255,255,255,0.05); }
        .g-obj-item.selected { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.2); }
        .g-obj-item.completed { opacity: 0.7; }
        .g-obj-item.completed .g-obj-text { text-decoration: line-through; color: #22c55e; }
        .g-obj-item.broken .g-obj-text { color: #f87171; }
        .g-obj-check {
            width: 18px; height: 18px;
            border: 1px solid #555;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .g-obj-item.completed .g-obj-check { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.1); }
        .g-obj-icon { font-size: 0.85rem; flex-shrink: 0; }
        .g-obj-text { color: #ccc; flex: 1; }
        .g-obj-server {
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .g-obj-server.hq { background: rgba(34,197,94,0.15); color: #22c55e; }
        .g-obj-server.alpha { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .g-obj-server.beta { background: rgba(168,85,247,0.15); color: #a855f7; }

        /* ── Hint Panel ── */
        .g-hint-panel {
            border-top: 1px solid rgba(220,38,38,0.15);
            padding: 10px;
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .g-hint-panel h4 { color: #dc2626; font-size: 0.8rem; margin-bottom: 6px; }
        .g-hint-btn {
            padding: 5px 12px;
            background: rgba(220,38,38,0.1);
            border: 1px solid rgba(220,38,38,0.3);
            color: #dc2626;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .g-hint-btn:hover { background: rgba(220,38,38,0.2); }
        .g-hint-btn:disabled { opacity: 0.4; cursor: default; }
        .g-hint-text {
            font-size: 0.78rem;
            color: #d1d5db;
            padding: 5px 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
            margin-bottom: 4px;
            border-left: 2px solid #dc2626;
        }
        .g-sidebar-score {
            padding: 8px 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.75rem;
            color: #9ca3af;
            text-align: center;
            flex-shrink: 0;
        }

        /* ── Workspace ── */
        .g-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .g-toolbar {
            background: #1e1e1e;
            padding: 6px 10px;
            display: flex;
            gap: 5px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .g-tool-btn {
            padding: 5px 10px;
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.25);
            border-radius: 4px;
            color: #60a5fa;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .g-tool-btn:hover { background: rgba(96,165,250,0.15); }
        .g-tool-btn.active { background: #60a5fa; color: #000; }
        .g-panel {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #12141f;
        }

        /* ── Status Bar ── */
        .g-statusbar {
            background: #1a1a1a;
            padding: 4px 15px;
            font-size: 0.72rem;
            color: #6b7280;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* ── Panel Content Styles ── */
        .p-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .p-header h3 { color: #60a5fa; font-size: 1rem; }
        .p-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .p-section h4 { color: #dc2626; font-size: 0.85rem; margin-bottom: 10px; }
        .p-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .p-table th {
            text-align: left;
            padding: 7px 10px;
            background: rgba(96,165,250,0.08);
            color: #60a5fa;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(96,165,250,0.15);
        }
        .p-table td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #d1d5db;
        }
        .p-form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .p-form-group { flex: 1; }
        .p-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .p-form-group input, .p-form-group select {
            width: 100%;
            padding: 7px 10px;
            background: #1a1c28;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.82rem;
        }
        .p-form-group input:focus, .p-form-group select:focus {
            outline: none;
            border-color: #60a5fa;
        }
        .p-btn {
            padding: 6px 14px;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.3);
            color: #60a5fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .p-btn:hover { background: rgba(96,165,250,0.2); }
        .p-btn.primary { background: #60a5fa; color: #000; }
        .p-btn.primary:hover { background: #93c5fd; }
        .p-btn.danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
        .p-btn.success { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #22c55e; }
        .p-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .p-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .p-badge.green { background: rgba(34,197,94,0.15); color: #22c55e; }
        .p-badge.red { background: rgba(239,68,68,0.15); color: #ef4444; }
        .p-badge.yellow { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .p-badge.blue { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .p-empty { color: #555; font-size: 0.82rem; font-style: italic; padding: 10px 0; }
        .p-checkbox-row {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 0; font-size: 0.82rem;
        }
        .p-checkbox-row input[type="checkbox"] { accent-color: #60a5fa; }
        .p-inline-actions { display: flex; gap: 6px; }

        /* ── Modal ── */
        .g-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .g-modal-overlay.show { display: flex; }
        .g-modal {
            background: #1e1e1e;
            border: 1px solid #dc2626;
            border-radius: 10px;
            padding: 22px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .g-modal h3 { color: #dc2626; font-size: 1rem; margin-bottom: 15px; }
        .g-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

        /* ── Briefing Modal ── */
        .g-brief-modal { max-width: 700px; }
        .g-brief-layout { display: flex; gap: 0; min-height: 340px; }
        .g-brief-tabs {
            width: 170px; border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0;
            max-height: 400px;
        }
        .g-brief-tab {
            display: flex; align-items: center; gap: 6px; padding: 7px 10px; cursor: pointer;
            font-size: 0.75rem; color: #9ca3af; border-left: 3px solid transparent;
            transition: all 0.15s;
        }
        .g-brief-tab:hover { background: rgba(245,158,11,0.08); color: #e5e7eb; }
        .g-brief-tab.active { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: #f59e0b; }
        .g-brief-tab .bt-icon { font-size: 0.9rem; }
        .g-brief-tab .bt-label { flex: 1; }
        .g-brief-badge {
            font-size: 0.65rem; padding: 1px 5px; border-radius: 8px; font-weight: 600;
        }
        .g-brief-badge.done { background: rgba(34,197,94,0.2); color: #22c55e; }
        .g-brief-badge.partial { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .g-brief-badge.none { background: rgba(107,114,128,0.2); color: #6b7280; }
        .g-brief-content {
            flex: 1; padding: 16px 20px; overflow-y: auto; max-height: 400px;
        }
        .g-brief-content h4 { color: #f59e0b; font-size: 0.95rem; margin: 0 0 4px 0; }
        .g-brief-content .bc-progress { color: #6b7280; font-size: 0.75rem; margin-bottom: 12px; }
        .g-brief-content .bc-text { color: #d1d5db; font-size: 0.82rem; line-height: 1.65; }
        .g-brief-content .bc-text b { color: #93c5fd; font-weight: 600; }
        .g-brief-content .bc-overview { color: #9ca3af; font-size: 0.8rem; line-height: 1.6; }

        /* ── Notification ── */
        .g-notify {
            position: fixed;
            top: 60px; right: 20px;
            background: rgba(34,197,94,0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .g-notify.show { opacity: 1; transform: translateY(0); }

        /* ── Completion Overlay ── */
        .g-complete-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .g-complete-overlay.show { display: flex; }
        .g-complete-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #dc2626;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        .g-complete-card h2 { color: #dc2626; font-size: 1.8rem; letter-spacing: 4px; margin-bottom: 10px; }
        .g-complete-score { font-size: 4rem; font-weight: 700; color: #22c55e; margin: 15px 0; }
        .g-complete-grade {
            font-size: 2.5rem; font-weight: 700;
            width: 80px; height: 80px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%;
            margin: 10px 0 20px;
        }
        .g-complete-grade.S { background: rgba(168,85,247,0.2); color: #a855f7; border: 2px solid #a855f7; }
        .g-complete-grade.A { background: rgba(34,197,94,0.2); color: #22c55e; border: 2px solid #22c55e; }
        .g-complete-grade.B { background: rgba(96,165,250,0.2); color: #60a5fa; border: 2px solid #60a5fa; }
        .g-complete-grade.C { background: rgba(245,158,11,0.2); color: #f59e0b; border: 2px solid #f59e0b; }
        .g-complete-grade.D { background: rgba(239,68,68,0.2); color: #ef4444; border: 2px solid #ef4444; }
        .g-complete-grade.F { background: rgba(107,114,128,0.2); color: #6b7280; border: 2px solid #6b7280; }
        .g-complete-stats { color: #9ca3af; font-size: 0.9rem; margin-bottom: 20px; }
        .g-complete-actions { display: flex; gap: 12px; justify-content: center; }
        .g-complete-btn {
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
        }
        .g-complete-btn.primary { background: #dc2626; color: #fff; font-weight: 600; }
        .g-complete-btn.secondary { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid #555; }

        /* ── Resume Dialog ── */
        .g-resume-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
        }
        .g-resume-overlay.show { display: flex; }
        .g-resume-card {
            background: #1e1e1e;
            border: 2px solid #dc2626;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
        }
        .g-resume-card h3 { color: #dc2626; margin-bottom: 12px; }
        .g-resume-card p { color: #9ca3af; font-size: 0.9rem; margin-bottom: 20px; }
        .g-resume-actions { display: flex; gap: 12px; justify-content: center; }
    </style>
</head>
<body>
    <link rel="stylesheet" href="../../../../../components/styles/gui-simulator.css">
    <script src="../progress.js"></script>
    <script src="../../../../../components/WSAState.js"></script>
    <script src="../../../../../components/GUISimulator.js"></script>

    <!-- Header -->
    <div class="g-header">
        <div class="g-header-left">
            <h1>ADVANCED GAUNTLET</h1>
            <span class="g-score" id="scoreDisplay">Score: 0/100</span>
            <span class="g-fix-bonus" id="fixBonusDisplay"></span>
            <span class="g-grade" id="gradeDisplay"></span>
            <span class="g-timer" id="timerDisplay">00:00:00</span>
        </div>
        <div class="g-header-right">
            <button class="g-hbtn" onclick="showBriefing()">Brief</button>
            <button class="g-hbtn" onclick="resetGauntlet()">Reset</button>
            <a class="g-hbtn" href="index.html">&larr; Exit</a>
        </div>
    </div>

    <!-- Server Tabs -->
    <div class="g-server-tabs" id="serverTabs">
        <div class="g-server-tab active-hq" onclick="switchServer('hq')">HQ-DC01</div>
        <div class="g-server-tab" onclick="switchServer('alpha')">ALPHA-DC01</div>
        <div class="g-server-tab" onclick="switchServer('beta')">BETA-DC01</div>
    </div>

    <!-- Main -->
    <div class="g-main">
        <!-- Sidebar -->
        <div class="g-sidebar">
            <div class="g-filter-bar" id="filterBar"></div>
            <div class="g-obj-list" id="objList"></div>
            <div class="g-hint-panel" id="hintPanel"></div>
            <div class="g-sidebar-score" id="sidebarScore">Max: 100 | Hints: 0 | Done: 0/135</div>
        </div>

        <!-- Workspace -->
        <div class="g-workspace">
            <div class="g-toolbar" id="toolbar"></div>
            <div class="g-panel" id="guiPanel"></div>
            <div class="g-panel" id="guiSimPanel" style="display:none;padding:0;position:relative;"></div>
            <div class="g-statusbar">
                <span id="statusLeft">Ready</span>
                <span id="statusRight">Hexworth Corp — HQ-DC01 | 0/135</span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="g-modal-overlay" id="modalOverlay">
        <div class="g-modal" id="modalContent"></div>
    </div>

    <!-- Notification -->
    <div class="g-notify" id="notification"></div>

    <!-- Completion Overlay -->
    <div class="g-complete-overlay" id="completionOverlay">
        <div class="g-complete-card" id="completionCard"></div>
    </div>

    <!-- Resume Dialog -->
    <div class="g-resume-overlay" id="resumeOverlay">
        <div class="g-resume-card">
            <h3>Previous Attempt Found</h3>
            <p id="resumeInfo"></p>
            <div class="g-resume-actions">
                <button class="g-complete-btn secondary" onclick="startFresh()">Start Fresh</button>
                <button class="g-complete-btn primary" onclick="resumeAttempt()">Resume</button>
            </div>
        </div>
    </div>

    <script>

    // ═══════════════════════════════════════════════════════════════
    // WSA ADVANCED SKILLS GAUNTLET — Core Engine
    // 3 Servers, 3 Domains, 135 Objectives, 7 Broken Configs
    // ═══════════════════════════════════════════════════════════════

    const STORAGE_KEY = 'wsa-advanced-gauntlet-state';
    let startedAt = Date.now();
    let timerInterval = null;
    let currentTool = 'server';
    let selectedObjId = null;

    // ═══════════════════════════════════════════════════════════════
    // SCORING
    // ═══════════════════════════════════════════════════════════════
    const scoring = {
        hintCosts: {1:1,2:2,3:3,4:5},
        totalPenalty: 0,
        getMaxScore() { return Math.max(0, 100 - this.totalPenalty); },
        getScore() {
            const completed = objectives.filter(o=>o.completed).length;
            return Math.round((completed / objectives.length) * this.getMaxScore());
        },
        getFixBonus() {
            const fixObjs = objectives.filter(o=>o.broken);
            let bonus = 0;
            fixObjs.forEach(o => { if (o.completed && o.hintsRevealed === 0) bonus += 2; });
            return bonus;
        },
        getGrade() {
            const s = this.getScore() + this.getFixBonus();
            if (s >= 95) return 'S';
            if (s >= 90) return 'A';
            if (s >= 80) return 'B';
            if (s >= 70) return 'C';
            if (s >= 60) return 'D';
            return 'F';
        }
    };

    // ═══════════════════════════════════════════════════════════════
    // PERSISTENCE
    // ═══════════════════════════════════════════════════════════════
    function saveState() {
        const data = {
            state, startedAt,
            objectives: objectives.map(o => ({id:o.id,completed:o.completed,hintsRevealed:o.hintsRevealed})),
            scoring: {totalPenalty:scoring.totalPenalty},
            activeServer,
            lastSaved: Date.now()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { notify('⚠ Save failed — storage full', 'warn'); }
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const saved = JSON.parse(raw);
            // Deep merge state
            function deepMerge(target, source) {
                for (const key in source) {
                    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                        if (!target[key]) target[key] = {};
                        deepMerge(target[key], source[key]);
                    } else {
                        target[key] = source[key];
                    }
                }
            }
            deepMerge(state, saved.state);
            saved.objectives.forEach(so => {
                const obj = objectives.find(o=>o.id===so.id);
                if (obj) { obj.completed = so.completed; obj.hintsRevealed = so.hintsRevealed; }
            });
            scoring.totalPenalty = saved.scoring.totalPenalty;
            startedAt = saved.startedAt;
            activeServer = saved.activeServer || 'hq';
            return true;
        } catch(e) { return false; }
    }

    // ═══════════════════════════════════════════════════════════════
    // OBJECTIVE CHECKING
    // ═══════════════════════════════════════════════════════════════
    function checkAllObjectives() {
        let changed = false;
        objectives.forEach(obj => {
            try {
                const passes = obj.check();
                if (!obj.completed && passes) {
                    obj.completed = true;
                    changed = true;
                    notify('Objective completed!');
                }
            } catch(e) {}
        });
        updateSidebar();
        updateScore();
        if (changed) {
            saveState();
            checkCompletion();
        }
    }

    function checkCompletion() {
        if (objectives.every(o=>o.completed)) {
            setTimeout(() => {
                const card = document.getElementById('completionCard');
                const grade = scoring.getGrade();
                const score = scoring.getScore();
                const fixBonus = scoring.getFixBonus();
                const elapsed = formatTime(Date.now() - startedAt);
                const hintsUsed = objectives.reduce((s,o)=>s+o.hintsRevealed,0);
                card.innerHTML = `
                    <h2>GAUNTLET COMPLETE</h2>
                    <div class="g-complete-score">${score}/100${fixBonus>0?' <span style="color:#22c55e;font-size:1.5rem">(+${fixBonus} Fix Bonus)</span>':''}</div>
                    <div class="g-complete-grade ${grade}">${grade}</div>
                    <div class="g-complete-stats">
                        <p>Time: ${elapsed}</p>
                        <p>Hints Used: ${hintsUsed} | Penalty: -${scoring.totalPenalty}</p>
                        <p>135/135 Objectives Complete</p>
                        <p>Fix Bonus: +${fixBonus}/14</p>
                    </div>
                    <div class="g-complete-actions">
                        <a href="index.html" class="g-complete-btn secondary">Back to Briefing</a>
                        <button class="g-complete-btn primary" onclick="document.getElementById('completionOverlay').classList.remove('show')">Continue</button>
                    </div>
                `;
                document.getElementById('completionOverlay').classList.add('show');
                try { WSAProgress.markComplete('gauntlet-advanced','guiLab',{score,grade,hintsUsed,fixBonus}); } catch(e) {}
            }, 600);
        }
    }

    function renderFilterBar() {

        const modules = ['All','M01','M02','M03','M04','M05','M06','M07','M08','M09','M10','M11','M12','M13','M14','M15','M16','M17','M18','M19'];
        const statuses = ['All','Todo','Done'];

        let html = '<div class="g-filter-section"><div class="g-filter-label">Site</div>';
        servers.forEach(s => {
            const sKey = s.toLowerCase();

            let cls = 'g-filter-btn';
            if (isActive && s !== 'All') cls += ' active-' + sKey;
            else if (isActive) cls += ' active';
            html += `<button class="${cls}" onclick="setServerFilter('${s}')">${s}</button>`;
        });

        modules.forEach(m => {

        });
        html += '</div><div class="g-filter-section"><div class="g-filter-label">Status</div>';
        statuses.forEach(s => {

    function setServerFilter(f) { activeServerFilter = f; renderFilterBar(); renderObjectivesList(); }
    function setModuleFilter(f) { activeModuleFilter = f; renderFilterBar(); renderObjectivesList(); }
    function setStatusFilter(f) { activeStatusFilter = f; renderFilterBar(); renderObjectivesList(); }

    function renderObjectivesList() {
        const list = document.getElementById('objList');
        let filtered = objectives;

        if (activeServerFilter !== 'All') {
            const sMap = {HQ:'hq',Alpha:'alpha',Beta:'beta'};
            filtered = filtered.filter(o => o.server === sMap[activeServerFilter]);
        }
        if (activeModuleFilter !== 'All') {
            filtered = filtered.filter(o => o.module === activeModuleFilter);
        }
        if (activeStatusFilter === 'Todo') filtered = filtered.filter(o => !o.completed);
        if (activeStatusFilter === 'Done') filtered = filtered.filter(o => o.completed);

        list.innerHTML = filtered.map(o => {
            const icon = moduleIcons[o.module];
            const text = o.completed ? o.text : (o.broken ? '🔴 ???' : '???');
            const cls = (o.completed ? ' completed' : '') + (o.id === selectedObjId ? ' selected' : '') + (o.broken && !o.completed ? ' broken' : '');
            return `<div class="g-obj-item${cls}" onclick="selectObj('${o.id}')">
                <div class="g-obj-check">${o.completed ? '✓' : ''}</div>
                <span class="g-obj-icon">${icon}</span>
                <span class="g-obj-text">${text}</span>
                <span class="g-obj-server ${o.server}">${o.server.toUpperCase().substring(0,2)}</span>
            </div>`;
        }).join('') || '<div class="p-empty" style="padding:15px">No objectives match filters</div>';
    }

    function selectObj(id) {
        selectedObjId = id;
        renderObjectivesList();
        renderHintPanel();
    }

    function renderHintPanel() {
        const panel = document.getElementById('hintPanel');
        if (!selectedObjId) { panel.innerHTML = '<p style="color:#555;font-size:0.75rem;padding:5px">Select an objective to see hints</p>'; return; }
        const obj = objectives.find(o => o.id === selectedObjId);
        if (!obj) return;

        let html = `<h4>${obj.completed ? obj.text : '??? (' + obj.module + ' / ' + obj.server.toUpperCase() + ')'}</h4>`;
        for (let i = 0; i < obj.hints.length; i++) {
            if (i < obj.hintsRevealed) {
                html += `<div class="g-hint-text">L${obj.hints[i].l}: ${obj.hints[i].t}</div>`;
            }
        }
        if (!obj.completed && obj.hintsRevealed < obj.hints.length) {
            const nextHint = obj.hints[obj.hintsRevealed];
            const cost = scoring.hintCosts[nextHint.l];
            html += `<button class="g-hint-btn" onclick="revealHint('${obj.id}')">Reveal Hint L${nextHint.l} (-${cost} pts)</button>`;
        }
        if (obj.completed) html += `<p class="p-badge green" style="margin-top:6px">Complete</p>`;
        if (obj.broken && !obj.completed) html += `<p class="p-badge red" style="margin-top:6px">Broken Config — Needs Fix</p>`;
        panel.innerHTML = html;
    }

    function revealHint(id) {
        const obj = objectives.find(o => o.id === id);
        if (!obj || obj.completed || obj.hintsRevealed >= obj.hints.length) return;
        const hint = obj.hints[obj.hintsRevealed];
        const cost = scoring.hintCosts[hint.l];
        scoring.totalPenalty += cost;
        obj.hintsRevealed++;
        updateScore();
        renderHintPanel();
        saveState();
    }

    function formatTime(ms) {
        const s = Math.floor(ms/1000);
        const h = Math.floor(s/3600);
        const m = Math.floor((s%3600)/60);
        const sec = s%60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    // ═══════════════════════════════════════════════════════════════
    function checkResume() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const saved = JSON.parse(raw);
                const done = saved.objectives.filter(o=>o.completed).length;
                const elapsed = formatTime(Date.now() - saved.startedAt);
                document.getElementById('resumeInfo').textContent = `${done}/135 objectives completed | Time: ${elapsed}`;
                document.getElementById('resumeOverlay').classList.add('show');
            } catch(e) { initFresh(); }
        } else { initFresh(); }
    }

    function resumeAttempt() {
        document.getElementById('resumeOverlay').classList.remove('show');
        loadState();
        initUI();
        checkAllObjectives();
    }

    function startFresh() {
        document.getElementById('resumeOverlay').classList.remove('show');
        localStorage.removeItem(STORAGE_KEY);
        state = createDefaultState();
        initBrokenConfigs();
        objectives.forEach(o => { o.completed = false; o.hintsRevealed = 0; });
        scoring.totalPenalty = 0;
        startedAt = Date.now();
        activeServer = 'hq';
        saveState();
        initUI();
    }

    function initFresh() {
        initBrokenConfigs();
        startedAt = Date.now();
        saveState();
        initUI();
    }

    function initUI() {
        renderFilterBar();
        renderObjectivesList();
        renderHintPanel();
        renderToolbar();
        updateScore();
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
        document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) hideModal(); });
        switchServer(activeServer);
    }

            </div>`);

    function deleteOU() {
        const name=document.getElementById('adDelOU').value;
        const s=S();
        if (s.ad.ous.some(o=>o.parent===name)) { notify('Cannot delete — OU has child OUs.'); return; }
        if (s.ad.users.some(u=>u.ou===name)) { notify('Cannot delete — OU contains users. Move or delete them first.'); return; }
        if (s.ad.groups.some(g=>g.ou===name)) { notify('Cannot delete — OU contains groups.'); return; }
        s.ad.ous = s.ad.ous.filter(o=>o.name!==name);
        hideModal(); applyAndCheck(); notify('OU "'+name+'" deleted.');
    }

    function showDeleteUser() {
        const s=S();
        if (s.ad.users.length===0) { notify('No users to delete.'); return; }
        showModal(`<h3>Delete User</h3>
            <div class="p-form-group"><label>Select User</label>

    function deleteUser() {
        const name=document.getElementById('adDelUser').value;
        const s=S();
        s.ad.users = s.ad.users.filter(u=>u.samAccountName!==name);
        for (const g in s.ad.groupMembers) {

function activateScope(name) {
    const s = S().dhcp.scopes.find(s=>s.name===name);

}

function showEditScope(name) {
    const scope = S().dhcp.scopes.find(s=>s.name===name);

    showModal(`<h3>Edit Scope — ${scope.name}</h3>

            <button class="p-btn primary" onclick="editScopeMask('${scope.name}')">Apply</button>

function editScopeMask(name) {
    const scope = S().dhcp.scopes.find(s=>s.name===name);

}

function showEditGPO() {
    if (S().gpo.gpos.length===0) { notify('Create a GPO first.'); return; }
    const gpo = S().gpo.gpos[0];
    const settings = gpo.settings || {};
    showModal(`<h3>Edit GPO Settings</h3>
        <div class="p-form-group"><label>GPO</label>
            <select id="editGpoName" onchange="updateEditGPOFields()">${S().gpo.gpos.map(g=>`<option value="${g.name}">${g.name}</option>`).join('')}</select></div>
        <h4 style="color:#f59e0b;font-size:0.85rem;margin:12px 0 8px">Password Policy</h4>
        <div class="p-form-row">
            <div class="p-form-group"><label>Min Password Length</label>
                <input type="number" id="gpoMinPw" value="${settings.minPasswordLength||0}" min="0" max="128"></div>
            <div class="p-form-group"><label>Max Password Age (days)</label>
                <input type="number" id="gpoMaxAge" value="${settings.maxPasswordAge||0}" min="0"></div>
        </div>
        <h4 style="color:#f59e0b;font-size:0.85rem;margin:12px 0 8px">Account Lockout</h4>
        <div class="p-form-group"><label>Lockout Threshold (attempts)</label>
            <input type="number" id="gpoLockout" value="${settings.lockoutThreshold||0}" min="0" max="999"></div>
        <h4 style="color:#f59e0b;font-size:0.85rem;margin:12px 0 8px">Audit &amp; Scripts</h4>
        <div class="p-checkbox-row">
            <input type="checkbox" id="gpoAudit" ${settings.auditEnabled?'checked':''}>
            <label for="gpoAudit">Enable Audit Policy</label></div>
        <div class="p-form-group"><label>Logon Script</label>
            <input type="text" id="gpoLogonScript" value="${settings.logonScript||''}" placeholder="\\\\server\\share\\logon.bat"></div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="editGPO()">Apply</button>
        </div>`);
}
function updateEditGPOFields() {
    const name = document.getElementById('editGpoName').value;
    const gpo = S().gpo.gpos.find(g=>g.name===name);
    if (!gpo) return;
    const settings = gpo.settings || {};
    document.getElementById('gpoMinPw').value = settings.minPasswordLength || 0;
    document.getElementById('gpoMaxAge').value = settings.maxPasswordAge || 0;
    document.getElementById('gpoLockout').value = settings.lockoutThreshold || 0;
    document.getElementById('gpoAudit').checked = !!settings.auditEnabled;
    document.getElementById('gpoLogonScript').value = settings.logonScript || '';
}
function editGPO() {
    const name = document.getElementById('editGpoName').value;
    const gpo = S().gpo.gpos.find(g=>g.name===name);
    if (!gpo) return;
    const minPw = parseInt(document.getElementById('gpoMinPw').value) || 0;
    const maxAge = parseInt(document.getElementById('gpoMaxAge').value) || 0;
    const lockout = parseInt(document.getElementById('gpoLockout').value) || 0;
    const auditEnabled = document.getElementById('gpoAudit').checked;
    const logonScript = document.getElementById('gpoLogonScript').value.trim();
    if (!gpo.settings) gpo.settings = {};
    if (minPw > 0) gpo.settings.minPasswordLength = minPw;
    if (maxAge > 0) gpo.settings.maxPasswordAge = maxAge;
    if (lockout > 0) gpo.settings.lockoutThreshold = lockout;
    if (auditEnabled) gpo.settings.auditEnabled = true;
    if (logonScript) gpo.settings.logonScript = logonScript;
    hideModal(); applyAndCheck(); notify('GPO "'+name+'" settings applied.');
}

function showEditLink() {
    if (S().gpo.links.length===0) { notify('No links to edit.'); return; }
    const ouOptions = (S().ad.ous||[]).map(o=>`<option value="${o.name}">${o.name}</option>`).join('');
    showModal(`<h3>Edit GPO Link</h3>
        <div class="p-form-group"><label>Select Link</label>
            <select id="editLinkIdx">${S().gpo.links.map((l,i)=>`<option value="${i}">${l.gpo} &rarr; ${l.ou||l.target}</option>`).join('')}</select></div>

            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="editLink()">Apply</button>
        </div>`);
}
function editLink() {
    const idx = parseInt(document.getElementById('editLinkIdx').value) || 0;
    const target = document.getElementById('editLinkTarget').value;
    if (S().gpo.links[idx] && target) {
        S().gpo.links[idx].ou = target;
        hideModal(); applyAndCheck(); notify('Link updated to '+target+'.');
    }
}

    showModal(`<h3>New Virtual Machine</h3>
        <div class="p-form-group"><label>VM Name</label>

        <div class="p-form-row">
            <div class="p-form-group"><label>Generation</label>
                <select id="hvVMGen">
                    <option value="1">Generation 1</option>
                    <option value="2" selected>Generation 2</option>
                </select></div>
            <div class="p-form-group"><label>Memory (MB)</label>
                <input type="number" id="hvVMMem" value="4096" min="512" step="512"></div>
        </div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="createVM()">Create</button>
        </div>`);
}
function createVM() {
    const n = document.getElementById('hvVMName').value.trim();
    const gen = parseInt(document.getElementById('hvVMGen').value) || 2;
    const mem = parseInt(document.getElementById('hvVMMem').value) || 4096;
    if (n) {
        S().hyperv.vms.push({Name:n, Generation:gen, MemoryGB:Math.round(mem/1024), State:'Off'});
        hideModal(); applyAndCheck(); notify('VM "'+n+'" created.');
    }
}

function startVM(name) {
    const vm = S().hyperv.vms.find(v=>v.Name===name);
    if (vm) { vm.State = 'Running'; applyAndCheck(); notify(name+' started.'); }
}
function stopVM(name) {
    const vm = S().hyperv.vms.find(v=>v.Name===name);
    if (vm) { vm.State = 'Off'; applyAndCheck(); notify(name+' stopped.'); }
}
function checkpointVM(name) {
    if (!S().hyperv.checkpoints[name]) S().hyperv.checkpoints[name] = [];
    S().hyperv.checkpoints[name].push({time: new Date().toLocaleString()});
    applyAndCheck(); notify('Checkpoint created for '+name+'.');
}

function renderMonitorConsole() {
    if (activeServer !== 'beta') {
        return `<div class="p-header"><h3>Performance Monitor</h3></div>
            <div class="p-section"><p style="color:#f59e0b">Monitoring is only available on ${serverNames.beta}. Switch to the Beta server.</p></div>`;

    const mon = S().monitoring;
    const filteredEvents = mon.eventFilter === 'All'
        ? mon.events
        : mon.events.filter(e => e.level === mon.eventFilter);
    return `
    <div class="p-header"><h3>Performance Monitor [${serverNames[activeServer]}]</h3>
        <div class="p-actions">
            <button class="p-btn" onclick="showAddCounter()">Add Counter</button>

        ${mon.counters.length===0?'<p class="p-empty">No counters added</p>':`
        <table class="p-table"><tr><th>Category</th><th>Counter</th><th>Value</th></tr>
        ${mon.counters.map(c=>`<tr><td>${c.category}</td><td>${c.counter}</td>
            <td>${c.category==='Processor'?Math.floor(Math.random()*40+10)+'%':
                c.category==='Memory'?Math.floor(Math.random()*30+40)+'%':
                c.category==='Network'?Math.floor(Math.random()*800+100)+' Kbps':
                Math.floor(Math.random()*200)+' MB/s'}</td></tr>`).join('')}
        </table>`}
    </div>
    <div class="p-section"><h4>Alerts</h4>
        ${mon.alerts.length===0?'<p class="p-empty">No alerts configured</p>':`
        <table class="p-table"><tr><th>Counter</th><th>Condition</th><th>Status</th></tr>
        ${mon.alerts.map(a=>`<tr><td>${a.counter}</td><td>&gt; ${a.threshold}%</td>
            <td><span class="p-badge green">Active</span></td></tr>`).join('')}
        </table>`}
    </div>
    <div class="p-section"><h4>Event Viewer</h4>
        <div style="margin-bottom:8px">
            <label style="font-size:0.75rem;color:#9ca3af;margin-right:8px">Filter:</label>
            <select onchange="setEventFilter(this.value)" style="padding:4px 8px;background:#1a1c28;border:1px solid #333;color:#e0e0e0;border-radius:3px;font-size:0.8rem">
                <option value="All" ${mon.eventFilter==='All'?'selected':''}>All</option>
                <option value="Error" ${mon.eventFilter==='Error'?'selected':''}>Error</option>
                <option value="Warning" ${mon.eventFilter==='Warning'?'selected':''}>Warning</option>
                <option value="Information" ${mon.eventFilter==='Information'?'selected':''}>Information</option>
            </select>
        </div>
        <table class="p-table"><tr><th>Level</th><th>Source</th><th>Message</th></tr>
        ${filteredEvents.map(e=>`<tr>
            <td><span class="p-badge ${e.level==='Error'?'red':e.level==='Warning'?'yellow':'blue'}">${e.level}</span></td>
            <td>${e.source}</td><td style="font-size:0.75rem">${e.msg}</td></tr>`).join('')}
        </table>
    </div>`;
}

function createZone() {

}

function showCreateRecord() {
    if (S().dns.zones.length===0) { notify('Create a zone first.'); return; }
    showModal(`<h3>Create DNS Record</h3>
        <div class="p-form-group"><label>Zone</label>
            <select id="dnsRZone">${S().dns.zones.map(z=>`<option value="${z.name}">${z.name}</option>`).join('')}</select></div>
        <div class="p-form-group"><label>Record Type</label>
            <select id="dnsRType">
                <option value="A">A (Host)</option>
                <option value="AAAA">AAAA (IPv6)</option>
                <option value="CNAME">CNAME (Alias)</option>
                <option value="MX">MX (Mail Exchange)</option>
                <option value="PTR">PTR (Pointer)</option>
                <option value="SRV">SRV (Service)</option>
            </select></div>
        <div class="p-form-group"><label>Name</label>
            <input type="text" id="dnsRName" placeholder="app01"></div>
        <div class="p-form-group"><label>Value</label>
            <input type="text" id="dnsRValue" placeholder="10.0.50.20"></div>
        <div class="p-form-group"><label>Priority (MX only)</label>
            <input type="number" id="dnsRPri" value="10" min="1"></div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="createRecord()">Create</button>
        </div>`);
}
function createRecord() {
    const zone = document.getElementById('dnsRZone').value;
    const type = document.getElementById('dnsRType').value;
    const name = document.getElementById('dnsRName').value.trim();
    const value = document.getElementById('dnsRValue').value.trim();
    const priority = parseInt(document.getElementById('dnsRPri').value) || 10;
    if (name && value) {
        const rec = {type:type, name:name, value:value, zone:zone};
        if (type==='MX') rec.priority = priority;
        S().dns.records.push(rec);
        hideModal(); applyAndCheck(); notify(type+' record created.');
    }
}

function showEditRecord(idx) {
    const r = S().dns.records[idx];
    if (!r) return;
    showModal(`<h3>Edit DNS Record</h3>
        <div class="p-form-group"><label>Zone</label>
            <input type="text" value="${r.zone||''}" disabled style="opacity:0.6"></div>
        <div class="p-form-group"><label>Type</label>
            <input type="text" value="${r.type}" disabled style="opacity:0.6"></div>
        <div class="p-form-group"><label>Name</label>
            <input type="text" value="${r.name}" disabled style="opacity:0.6"></div>
        <div class="p-form-group"><label>Value</label>
            <input type="text" id="dnsEditValue" value="${r.value}"></div>
        ${r.type==='MX'?`<div class="p-form-group"><label>Priority</label>
            <input type="number" id="dnsEditPri" value="${r.priority||10}" min="1"></div>`:''}
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="editRecord(${idx})">Save</button>
        </div>`);
}
function editRecord(idx) {
    const r = S().dns.records[idx];
    if (!r) return;
    const newVal = document.getElementById('dnsEditValue').value.trim();
    if (newVal) {
        r.value = newVal;
        if (r.type==='MX') {
            const priEl = document.getElementById('dnsEditPri');
            if (priEl) r.priority = parseInt(priEl.value) || 10;
        }
        hideModal(); applyAndCheck(); notify('Record updated.');
    }

                    <option value="SystemState">System State</option>
                    <option value="Full">Full</option>
                    <option value="BMR">Bare Metal Recovery (BMR)</option>
                </select></div>
            <div class="p-form-group"><label>Schedule</label>
                <select id="bkPolicySched">
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                </select></div>
        </div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="createPolicy()">Create</button>
        </div>`);
}
function createPolicy() {
    const n = document.getElementById('bkPolicyName').value.trim();
    const type = document.getElementById('bkPolicyType').value;
    const schedule = document.getElementById('bkPolicySched').value;
    if (n) {
        if (!S().backup.policies) S().backup.policies = [];
        S().backup.policies.push({name:n, type, schedule});
        hideModal(); applyAndCheck(); notify('Policy "'+n+'" created.');
    }
}

function showAddTarget() {
    showModal(`<h3>Add Backup Target</h3>
        <div class="p-form-group"><label>Target Path</label>
            <input type="text" id="bkTargetPath" placeholder="e.g. \\\\HQ-DC01\\Backups"></div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="addTarget()">Add</button>
        </div>`);
}
function addTarget() {
    const p = document.getElementById('bkTargetPath').value.trim();
    if (p) {
        if (!S().backup.targets) S().backup.targets = [];
        S().backup.targets.push({path:p});
        hideModal(); applyAndCheck(); notify('Target "'+p+'" added.');
    }
}

function showRunBackup() {
    const policies = S().backup.policies||[];
    if (policies.length===0) { notify('Create a backup policy first.'); return; }
    showModal(`<h3>Run Backup Now</h3>
        <div class="p-form-group"><label>Policy</label>
            <select id="bkRunPolicy">${policies.map(p=>`<option value="${p.type}">${p.name} (${p.type})</option>`).join('')}</select></div>
        <p style="color:#9ca3af;font-size:0.82rem;margin:10px 0">This will immediately start a backup using the selected policy.</p>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn success" onclick="runBackup()">Run</button>
        </div>`);
}
function runBackup() {
    const type = document.getElementById('bkRunPolicy').value;
    if (!S().backup.history) S().backup.history = [];
    const now = new Date();
    const date = now.toLocaleDateString()+' '+now.toLocaleTimeString();
    const sizes = {SystemState:'1.2 GB', Full:'45.8 GB', BMR:'62.3 GB'};
    S().backup.history.push({date, type, status:'Success', size:sizes[type]||'12.5 GB'});
    hideModal(); applyAndCheck(); notify(type+' backup completed successfully.');
}

// CONSOLE 10: Task Scheduler (all 3 servers)
// =================================================================
function renderTaskSchedulerConsole() {
    const tasks = S().tasks.scheduled||[];
    return `
    <div class="p-header"><h3>Task Scheduler [${serverNames[activeServer]}]</h3>
        <div class="p-actions">
            <button class="p-btn" onclick="showNewTask()">New Task</button>
        </div>
    </div>
    <div class="p-section"><h4>Scheduled Tasks</h4>
        ${tasks.length===0?'<p class="p-empty">No scheduled tasks</p>':`
        <table class="p-table"><tr><th>Name</th><th>Status</th><th>Trigger</th><th>Time</th><th>Next Run</th><th>Actions</th></tr>
        ${tasks.map((t,i)=>`<tr><td>${t.name}</td>
            <td><span class="p-badge ${t.enabled?'green':'yellow'}">${t.enabled?'Enabled':'Disabled'}</span></td>
            <td>${t.trigger}</td><td>${t.time||''}</td>
            <td>${t.enabled?computeNextRun(t):'N/A'}</td>
            <td><div class="p-inline-actions">
                <button class="p-btn" onclick="showEditTask(${i})">Edit</button>
                <button class="p-btn ${t.enabled?'danger':'success'}" onclick="toggleTask(${i})">${t.enabled?'Disable':'Enable'}</button>
            </div></td></tr>`).join('')}
        </table>`}
    </div>`;
}

function computeNextRun(task) {
    if (!task.time) return 'Not scheduled';
    const now = new Date();
    const [h, m] = task.time.split(':').map(Number);
    const next = new Date(now);
    next.setHours(h, m, 0, 0);
    if (next <= now) {
        if (task.trigger==='Daily') next.setDate(next.getDate()+1);
        else if (task.trigger==='Weekly') next.setDate(next.getDate()+7);
        else next.setDate(next.getDate()+1);
    }
    return next.toLocaleDateString()+' '+task.time;
}

function showNewTask() {
    showModal(`<h3>New Scheduled Task</h3>
        <div class="p-form-group"><label>Task Name</label>
            <input type="text" id="taskName" placeholder="e.g. Nightly-Cleanup"></div>
        <div class="p-form-row">
            <div class="p-form-group"><label>Trigger</label>
                <select id="taskTrigger">
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                    <option value="OnEvent">On Event</option>
                </select></div>
            <div class="p-form-group"><label>Time</label>
                <input type="time" id="taskTime" value="02:00"></div>
        </div>
        <div class="p-form-group"><label>Action / Script Path</label>
            <input type="text" id="taskAction" placeholder="e.g. C:\\Scripts\\cleanup.ps1"></div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn primary" onclick="createTask()">Create</button>
        </div>`);
}
function createTask() {
    const name = document.getElementById('taskName').value.trim();
    const trigger = document.getElementById('taskTrigger').value;
    const time = document.getElementById('taskTime').value;
    const action = document.getElementById('taskAction').value.trim();
    if (name) {
        if (!S().tasks.scheduled) S().tasks.scheduled = [];
        S().tasks.scheduled.push({name, trigger, time, action, enabled:true});
        hideModal(); applyAndCheck(); notify('Task "'+name+'" created.');
    }
}

function showEditTask(idx) {
    const t = S().tasks.scheduled[idx];
    if (!t) return;
    showModal(`<h3>Edit Scheduled Task</h3>
        <div class="p-form-group"><label>Task Name</label>
            <input type="text" id="taskEditName" value="${t.name}"></div>
        <div class="p-form-row">
            <div class="p-form-group"><label>Trigger</label>
                <select id="taskEditTrigger">
                    <option value="Daily" ${t.trigger==='Daily'?'selected':''}>Daily</option>
                    <option value="Weekly" ${t.trigger==='Weekly'?'selected':''}>Weekly</option>
                    <option value="OnEvent" ${t.trigger==='OnEvent'?'selected':''}>On Event</option>
                </select></div>
            <div class="p-form-group"><label>Time</label>
                <input type="time" id="taskEditTime" value="${t.time||'02:00'}"></div>
        </div>
        <div class="p-form-group"><label>Action / Script Path</label>
            <input type="text" id="taskEditAction" value="${t.action||''}"></div>
        <div class="g-modal-actions">
            <button class="p-btn" onclick="hideModal()">Cancel</button>
            <button class="p-btn ${t.enabled?'danger':'success'}" onclick="toggleTask(${idx});hideModal();">${t.enabled?'Disable':'Enable'}</button>
            <button class="p-btn primary" onclick="editTask(${idx})">Save</button>
        </div>`);
}
function editTask(idx) {
    const t = S().tasks.scheduled[idx];
    if (!t) return;
    t.name = document.getElementById('taskEditName').value.trim();
    t.trigger = document.getElementById('taskEditTrigger').value;
    t.time = document.getElementById('taskEditTime').value;
    t.action = document.getElementById('taskEditAction').value.trim();
    hideModal(); applyAndCheck(); notify('Task "'+t.name+'" updated.');
}

function toggleTask(idx) {
    const t = S().tasks.scheduled[idx];
    if (t) { t.enabled = !t.enabled; applyAndCheck(); notify('Task "'+t.name+'" '+(t.enabled?'enabled':'disabled')+'.'); }
}
