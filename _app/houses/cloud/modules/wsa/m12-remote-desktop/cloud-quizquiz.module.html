<body>
    <script src="../progress.js"></script>
    <div class="wq-container" id="wsaQuizRoot"></div>
    <div class="wq-footer">
        <a href="cloud-presentation.module.html">&larr; Presentation</a>

    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm12',
        title: 'M12: Remote Desktop Services',
        nextModule: '../m13-certificate-services/cloud-presentation.module.html',
        questions: [
            {
                question: "Which RDS role service manages session distribution and reconnection?",
                options: ["RD Session Host", "RD Connection Broker", "RD Web Access", "RD Gateway"],
                correct: 1,
                explanation: "The RD Connection Broker handles load balancing, session tracking, and reconnection to existing sessions."
            },
            {
                question: "What is the main difference between session-based and VDI deployments?",
                options: ["VDI is faster", "Session-based uses shared OS, VDI uses dedicated VMs", "Session-based requires more resources", "VDI doesn't require licensing"],
                correct: 1,
                explanation: "Session-based deployments have multiple users sharing one OS instance, while VDI gives each user a dedicated virtual machine."
            },
            {
                question: "How does RD Gateway enable secure external access?",
                options: ["Opens RDP port 3389 on firewall", "Tunnels RDP traffic over HTTPS (port 443)", "Requires VPN connection", "Uses SSH tunneling"],
                correct: 1,
                explanation: "RD Gateway tunnels RDP traffic inside HTTPS, allowing access through standard web ports without exposing RDP directly."
            },
            {
                question: "What are the two types of RD Gateway authorization policies?",
                options: ["User and Device", "Connection (CAP) and Resource (RAP)", "Internal and External", "Domain and Local"],
                correct: 1,
                explanation: "CAP (Connection Authorization Policy) determines who can connect, RAP (Resource Authorization Policy) determines what they can access."
            },
            {
                question: "What licensing is required for RDS deployments?",
                options: ["Windows Server license only", "RDS CALs (Client Access Licenses)", "Microsoft 365 license", "No additional licensing"],
                correct: 1,
                explanation: "RDS requires Client Access Licenses (CALs) for each user or device connecting to Remote Desktop Session Hosts."
            },
            {
                question: "What is a RemoteApp program?",
                options: ["A mobile application", "A server-hosted app that appears as local program", "A web application", "A virtualized application package"],
                correct: 1,
                explanation: "RemoteApp programs run on the RD Session Host but appear seamlessly integrated with the user's local desktop."
            },
            {
                question: "How long is the RDS licensing grace period?",
                options: ["30 days", "60 days", "90 days", "120 days"],
                correct: 3,
                explanation: "RDS provides a 120-day grace period to install and configure licensing before connections are denied."
            },
            {
                question: "What do User Profile Disks (UPDs) provide?",
                options: ["Faster application loading", "Persistent user settings across session hosts", "Application virtualization", "Encrypted storage"],
                correct: 1,
                explanation: "UPDs store user profile data in VHDX files that follow users across different session hosts in a collection."
            },
            {
                question: "Which PowerShell cmdlet creates a new session collection?",
                options: ["Add-RDSessionCollection", "New-RDSessionCollection", "Create-RDCollection", "Install-RDSessionCollection"],
                correct: 1,
                explanation: "New-RDSessionCollection is the cmdlet used to create session collections in RDS deployments."
            },
            {
                question: "For RD Connection Broker high availability, what database is typically used?",
                options: ["MySQL", "SQLite", "SQL Server", "MongoDB"],
                correct: 2,
                explanation: "RD Connection Broker HA requires SQL Server to store the shared connection broker database."
            }
        ]
    });
    </script>
