<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M12 Quiz: Remote Desktop Services - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M12: Remote Desktop Services Quiz</h1>
            <p>Test your knowledge of RDS architecture and administration</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../m13-certificate-services/cloud-presentation.module.html" class="results-btn primary" id="nextModuleBtn">Next Module</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which RDS role service manages session distribution and reconnection?",
                options: ["RD Session Host", "RD Connection Broker", "RD Web Access", "RD Gateway"],
                correct: 1,
                explanation: "The RD Connection Broker handles load balancing, session tracking, and reconnection to existing sessions."
            },
            {
                question: "What is the main difference between session-based and VDI deployments?",
                options: ["VDI is faster", "Session-based uses shared OS, VDI uses dedicated VMs", "Session-based requires more resources", "VDI doesn't require licensing"],
                correct: 1,
                explanation: "Session-based deployments have multiple users sharing one OS instance, while VDI gives each user a dedicated virtual machine."
            },
            {
                question: "How does RD Gateway enable secure external access?",
                options: ["Opens RDP port 3389 on firewall", "Tunnels RDP traffic over HTTPS (port 443)", "Requires VPN connection", "Uses SSH tunneling"],
                correct: 1,
                explanation: "RD Gateway tunnels RDP traffic inside HTTPS, allowing access through standard web ports without exposing RDP directly."
            },
            {
                question: "What are the two types of RD Gateway authorization policies?",
                options: ["User and Device", "Connection (CAP) and Resource (RAP)", "Internal and External", "Domain and Local"],
                correct: 1,
                explanation: "CAP (Connection Authorization Policy) determines who can connect, RAP (Resource Authorization Policy) determines what they can access."
            },
            {
                question: "What licensing is required for RDS deployments?",
                options: ["Windows Server license only", "RDS CALs (Client Access Licenses)", "Microsoft 365 license", "No additional licensing"],
                correct: 1,
                explanation: "RDS requires Client Access Licenses (CALs) for each user or device connecting to Remote Desktop Session Hosts."
            },
            {
                question: "What is a RemoteApp program?",
                options: ["A mobile application", "A server-hosted app that appears as local program", "A web application", "A virtualized application package"],
                correct: 1,
                explanation: "RemoteApp programs run on the RD Session Host but appear seamlessly integrated with the user's local desktop."
            },
            {
                question: "How long is the RDS licensing grace period?",
                options: ["30 days", "60 days", "90 days", "120 days"],
                correct: 3,
                explanation: "RDS provides a 120-day grace period to install and configure licensing before connections are denied."
            },
            {
                question: "What do User Profile Disks (UPDs) provide?",
                options: ["Faster application loading", "Persistent user settings across session hosts", "Application virtualization", "Encrypted storage"],
                correct: 1,
                explanation: "UPDs store user profile data in VHDX files that follow users across different session hosts in a collection."
            },
            {
                question: "Which PowerShell cmdlet creates a new session collection?",
                options: ["Add-RDSessionCollection", "New-RDSessionCollection", "Create-RDCollection", "Install-RDSessionCollection"],
                correct: 1,
                explanation: "New-RDSessionCollection is the cmdlet used to create session collections in RDS deployments."
            },
            {
                question: "For RD Connection Broker high availability, what database is typically used?",
                options: ["MySQL", "SQLite", "SQL Server", "MongoDB"],
                correct: 2,
                explanation: "RD Connection Broker HA requires SQL Server to store the shared connection broker database."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m12');
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
