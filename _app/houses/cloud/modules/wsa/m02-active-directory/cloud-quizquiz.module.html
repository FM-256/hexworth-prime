    <div class="wq-container" id="wsaQuizRoot"></div>
    <div class="wq-footer">
        <a href="cloud-presentation.module.html">&larr; Presentation</a>

    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm02',
        title: 'M02: Active Directory & Identity',
        nextModule: '../m03-storage/cloud-presentation.module.html',
        questions: [
            {
                question: 'What is the TOP-LEVEL container in Active Directory that represents the security boundary?',
                options: [
                    'Domain',
                    'Forest',
                    'Organizational Unit',
                    'Tree'
                ],
                correct: 1,
                explanation: 'The Forest is the top-level container and represents the security boundary in Active Directory. All domains within a forest share the same schema and global catalog.'
            },
            {
                question: 'Which group scope can contain members from any domain in the forest but can only be used for permissions in the same domain?',
                options: [
                    'Global',
                    'Domain Local',
                    'Universal',
                    'Distribution'
                ],
                correct: 1,
                explanation: 'Domain Local groups can contain members from any domain in the forest (and trusted forests) but can only be assigned permissions within the same domain where they exist.'
            },
            {
                question: 'What is the recommended minimum number of domain controllers for redundancy?',
                options: [
                    '1',
                    '2',
                    '3',
                    '5'
                ],
                correct: 1,
                explanation: 'Microsoft recommends at least 2 domain controllers for redundancy. If a single DC fails and it\'s the only one, users cannot authenticate to the domain.'
            },
            {
                question: 'What is the correct order for Group Policy processing?',
                options: [
                    'Domain \u2192 Site \u2192 Local \u2192 OU',
                    'Local \u2192 Site \u2192 Domain \u2192 OU',
                    'OU \u2192 Domain \u2192 Site \u2192 Local',
                    'Site \u2192 Local \u2192 OU \u2192 Domain'
                ],
                correct: 1,
                explanation: 'Group Policy processes in LSDOU order: Local \u2192 Site \u2192 Domain \u2192 OU. Later policies override earlier ones, so OU policies take precedence over domain policies.'
            },
            {
                question: 'Which PowerShell cmdlet would you use to add a user to a security group?',
                options: [
                    'Set-ADGroupMember',
                    'Add-ADGroupMember',
                    'New-ADGroupMember',
                    'Join-ADGroup'
                ],
                correct: 1,
                explanation: 'Add-ADGroupMember is used to add members to a group. Syntax: Add-ADGroupMember -Identity "GroupName" -Members user1,user2'
            },
            {
                question: 'What FSMO role handles password changes and account lockout policies?',
                options: [
                    'RID Master',
                    'Schema Master',
                    'PDC Emulator',
                    'Infrastructure Master'
                ],
                correct: 2,
                explanation: 'The PDC Emulator handles password changes, account lockouts, time synchronization for the domain, and serves as the target for legacy systems. It\'s one of five FSMO roles.'
            },
            {
                question: 'Which AD management tool shows the PowerShell equivalent of GUI actions?',
                options: [
                    'Active Directory Users and Computers',
                    'Active Directory Administrative Center',
                    'Group Policy Management Console',
                    'Active Directory Sites and Services'
                ],
                correct: 1,
                explanation: 'Active Directory Administrative Center (ADAC) displays the PowerShell equivalent of GUI actions in a history pane, making it an excellent tool for learning AD cmdlets.'
            },
            {
                question: 'What is the Microsoft-recommended group nesting strategy called?',
                options: [
                    'ADGLP',
                    'AGDLP',
                    'LDAPG',
                    'GPDLA'
                ],
                correct: 1,
                explanation: 'AGDLP stands for Accounts \u2192 Global groups \u2192 Domain Local groups \u2192 Permissions. This strategy provides flexibility and simplifies cross-domain resource access.'
            },
            {
                question: 'Which PowerShell cmdlet finds all locked out user accounts?',
                options: [
                    'Get-ADUser -Filter {LockedOut -eq $true}',
                    'Find-ADLockedAccount',
                    'Search-ADAccount -LockedOut',
                    'Get-LockedOutUser'
                ],
                correct: 2,
                explanation: 'Search-ADAccount -LockedOut is the most efficient cmdlet for finding locked accounts. It\'s specifically designed for searching account states like locked, disabled, or expired.'
            },
            {
                question: 'What attribute represents a user\'s modern logon name in the format user@domain.com?',
                options: [
                    'sAMAccountName',
                    'distinguishedName',
                    'userPrincipalName',
                    'objectSID'
                ],
                correct: 2,
                explanation: 'userPrincipalName (UPN) is the modern logon format (user@domain.com). sAMAccountName is the legacy pre-Windows 2000 format (DOMAIN\\user).'
            }
        ]
    });
    </script>
</body>
</html>
