    <script>
    WSAQuiz.init({
        moduleId: 'm04',
        title: 'M04: Hyper-V Virtualization',
        nextModule: '../m05-containers/cloud-presentation.module.html',
        questions: [
            {
                question: 'Hyper-V is what type of hypervisor?',
                options: [
                    'Type 1 (Bare-metal)',
                    'Type 2 (Hosted)',
                    'Type 3 (Container)',
                    'Type 0 (Embedded)'
                ],
                correct: 0,
                explanation: 'Hyper-V is a Type 1 (bare-metal) hypervisor that runs directly on hardware, not on top of a host OS. This gives it better performance and security than Type 2 hypervisors like VirtualBox.'
            },
            {
                question: 'Which VM generation supports UEFI and Secure Boot?',
                options: [
                    'Generation 1',
                    'Generation 2',
                    'Both generations',
                    'Neither generation'
                ],
                correct: 1,
                explanation: 'Generation 2 VMs use UEFI firmware and support Secure Boot. Generation 1 uses legacy BIOS and is needed only for older operating systems or 32-bit guests.'
            },
            {
                question: 'Which virtual switch type allows VMs to communicate with the physical network?',
                options: [
                    'Private',
                    'Internal',
                    'External',
                    'Isolated'
                ],
                correct: 2,
                explanation: 'External switches bind to a physical NIC, allowing VMs to access the external physical network. This is the most common switch type in production environments.'
            },
            {
                question: 'What cmdlet creates a new virtual machine?',
                options: [
                    'Create-VM',
                    'Add-VM',
                    'New-VM',
                    'Set-VM'
                ],
                correct: 2,
                explanation: 'New-VM creates a new virtual machine. Set-VM modifies existing VMs. Example: New-VM -Name "Server01" -MemoryStartupBytes 4GB -NewVHDSizeBytes 50GB'
            },
            {
                question: 'Which checkpoint type uses VSS for application-consistent backups?',
                options: [
                    'Standard Checkpoint',
                    'Production Checkpoint',
                    'Quick Checkpoint',
                    'Full Checkpoint'
                ],
                correct: 1,
                explanation: 'Production checkpoints use Volume Shadow Copy Service (VSS) for application-consistent state. Standard checkpoints capture the entire VM state including memory, which can cause issues with AD and databases.'
            },
            {
                question: 'What is the maximum supported virtual hard disk size for VHDX format?',
                options: [
                    '2 TB',
                    '16 TB',
                    '64 TB',
                    '128 TB'
                ],
                correct: 2,
                explanation: 'VHDX format supports virtual hard disks up to 64 TB and provides better resilience to power failures. The older VHD format is limited to 2 TB maximum.'
            },
            {
                question: 'Which switch type allows VMs and the host to communicate but NOT the external physical network?',
                options: [
                    'External',
                    'Internal',
                    'Private',
                    'NAT'
                ],
                correct: 1,
                explanation: 'Internal switches allow communication between VMs and the Hyper-V host but do NOT connect to the external physical network. This is useful for isolated management or test networks.'
            },
            {
                question: 'What feature allows a VM to dynamically adjust its RAM based on demand?',
                options: [
                    'Smart Paging',
                    'Dynamic Memory',
                    'Memory Ballooning',
                    'Hot Add Memory'
                ],
                correct: 1,
                explanation: 'Dynamic Memory allows VMs to adjust RAM allocation between configured minimum and maximum values based on workload demand. Smart Paging is only used during VM restart when memory demand exceeds the minimum.'
            },
            {
                question: 'What does Hyper-V Replica provide for virtual machines?',
                options: [
                    'Load balancing across hosts',
                    'Asynchronous replication for disaster recovery',
                    'Real-time synchronous mirroring',
                    'Automatic VM scaling'
                ],
                correct: 1,
                explanation: 'Hyper-V Replica provides asynchronous replication of VMs to a replica server for disaster recovery. It replicates at intervals of 30 seconds, 5 minutes, or 15 minutes and does not require shared storage or clustering.'
            },
            {
                question: 'What CPU feature must be enabled in BIOS/UEFI to run Hyper-V nested virtualization?',
                options: [
                    'Hyper-Threading',
                    'Hardware virtualization extensions (Intel VT-x / AMD-V)',
                    'Turbo Boost',
                    'Execute Disable Bit only'
                ],
                correct: 1,
                explanation: 'Hardware virtualization extensions (Intel VT-x or AMD-V) must be enabled in the BIOS/UEFI firmware. For nested virtualization, the host VM must also be configured with Set-VMProcessor -ExposeVirtualizationExtensions $true.'
            }
        ]
    });
    </script>
