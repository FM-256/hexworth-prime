    <script>
        const slides = [
            // Slide 1: Title
            {
                title: "Containers & Nano Server",
                content: `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="font-size: 5rem; margin-bottom: 20px;">📦</div>
                        <h2 style="color: var(--docker-blue); font-size: 1.8rem; margin-bottom: 15px;">Module 05: Lightweight Deployment</h2>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                            Modern application deployment with Windows Containers and minimal footprint server options.
                        </p>
                        <div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">🐳</div>
                                <div style="color: var(--docker-blue); font-weight: 600;">Docker</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">📦</div>
                                <div style="color: var(--accent-blue); font-weight: 600;">Containers</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">🔬</div>
                                <div style="color: var(--nano-green); font-weight: 600;">Nano Server</div>
                            </div>
                        </div>
                    </div>
                `
            },
            // Slide 2: Containers vs VMs
            {
                title: "Containers vs Virtual Machines",
                content: `
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4>📦 Containers</h4>
                            <ul>
                                <li><strong>Shared OS Kernel</strong> - Lightweight isolation</li>
                                <li><strong>Startup Time:</strong> Seconds</li>
                                <li><strong>Size:</strong> MBs (image layers)</li>
                                <li><strong>Density:</strong> 100s per host</li>
                                <li><strong>Isolation:</strong> Process-level</li>
                                <li><strong>Use Case:</strong> Microservices, CI/CD</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4>🖥️ Virtual Machines</h4>
                            <ul>
                                <li><strong>Full OS</strong> - Complete isolation</li>
                                <li><strong>Startup Time:</strong> Minutes</li>
                                <li><strong>Size:</strong> GBs (full OS)</li>
                                <li><strong>Density:</strong> 10s per host</li>
                                <li><strong>Isolation:</strong> Hardware-level</li>
                                <li><strong>Use Case:</strong> Legacy apps, different OS</li>
                            </ul>
                        </div>
                    </div>
                    <div class="architecture-diagram">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                            <div>
                                <div style="font-weight: 600; margin-bottom: 10px; color: var(--docker-blue);">Container Architecture</div>
                                <div class="arch-layer arch-container">App A | App B | App C</div>
                                <div class="arch-layer arch-engine">Container Engine (Docker)</div>
                                <div class="arch-layer arch-host">Host Operating System</div>
                                <div class="arch-layer arch-hardware">Hardware</div>
                            </div>
                            <div>
                                <div style="font-weight: 600; margin-bottom: 10px; color: var(--accent-blue);">VM Architecture</div>
                                <div class="arch-layer" style="background: #0078d4; color: white;">VM 1 (Full OS) | VM 2 (Full OS)</div>
                                <div class="arch-layer arch-engine">Hypervisor (Hyper-V)</div>
                                <div class="arch-layer arch-host">Host Operating System</div>
                                <div class="arch-layer arch-hardware">Hardware</div>
                            </div>
                        </div>
                    </div>
                `
            },
            // Slide 3: Windows Container Types
            {
                title: "Windows Container Isolation Modes",
                content: `
                    <p style="margin-bottom: 20px;">Windows Server supports two container isolation modes:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4>🔄 Process Isolation</h4>
                            <ul>
                                <li>Shares kernel with host</li>
                                <li>Fastest performance</li>
                                <li>Lower resource overhead</li>
                                <li>Requires matching OS version</li>
                                <li><strong>Best for:</strong> Production workloads on Server</li>
                            </ul>
                            <div class="code-block" style="margin-top: 10px;">
<span class="comment"># Run with shared-kernel process isolation</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker run --isolation=process mcr.microsoft.com/windows/servercore:ltsc2022</span>
                            </div>
                        </div>
                        <div class="comparison-card">
                            <h4>🛡️ Hyper-V Isolation</h4>
                            <ul>
                                <li>Each container in lightweight VM</li>
                                <li>Stronger security boundary</li>
                                <li>Cross-version compatibility</li>
                                <li>Higher resource usage</li>
                                <li><strong>Best for:</strong> Multi-tenant, untrusted code</li>
                            </ul>
                            <div class="code-block" style="margin-top: 10px;">
<span class="comment"># Run with Hyper-V hardware isolation</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker run --isolation=hyperv mcr.microsoft.com/windows/servercore:ltsc2022</span>
                            </div>
                        </div>
                    </div>
                    <div class="info-box">
                        <strong>Default Behavior:</strong> Windows Server defaults to process isolation. Windows 10/11 defaults to Hyper-V isolation for security.
                    </div>
                `
            },
            // Slide 4: Windows Base Images
            {
                title: "Windows Container Base Images",
                content: `
                    <p style="margin-bottom: 20px;">Microsoft provides official base images from the Microsoft Container Registry (MCR):</p>
                    <div class="image-types">
                        <div class="image-type">
                            <h5>Windows Server Core</h5>
                            <div class="size">~2.5 GB</div>
                            <div class="desc">Full .NET Framework, PowerShell, most server roles</div>
                        </div>
                        <div class="image-type">
                            <h5 style="color: var(--nano-green);">Nano Server</h5>
                            <div class="size">~300 MB</div>
                            <div class="desc">Minimal footprint, .NET Core only, no GUI</div>
                        </div>
                        <div class="image-type">
                            <h5>Windows</h5>
                            <div class="size">~5+ GB</div>
                            <div class="desc">Full Windows with UI support (rare use)</div>
                        </div>
                    </div>
                    <p style="margin-bottom: 15px;">Download the Server Core image for workloads that need full .NET Framework support.</p>

                    <div class="code-block">
<span class="comment"># Pull the Server Core base image from Microsoft Container Registry</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker pull mcr.microsoft.com/windows/servercore:ltsc2022</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
ltsc2022: Pulling from windows/servercore
<span class="command">Digest: sha256:a1b2c3d4...</span>
Status: Downloaded newer image for mcr.microsoft.com/windows/servercore:ltsc2022
                    </div>

                    <p style="margin-bottom: 15px;">Pull the lightweight Nano Server image for .NET Core microservices.</p>

                    <div class="code-block">
<span class="comment"># Pull the minimal Nano Server base image</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker pull mcr.microsoft.com/windows/nanoserver:ltsc2022</span>
                    </div>

                    <p style="margin-bottom: 15px;">Use a pre-built ASP.NET Core runtime image for web applications.</p>

                    <div class="code-block">
<span class="comment"># Pull the ASP.NET Core 8.0 runtime on Nano Server</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker pull mcr.microsoft.com/dotnet/aspnet:8.0-nanoserver-ltsc2022</span>
                    </div>
                    <div class="warning-box">
                        <strong>Version Matching:</strong> Container host OS version must match or be newer than the container base image version (for process isolation).
                    </div>
                `
            },
            // Slide 5: Docker Commands
            {
                title: "Essential Docker Commands",
                content: `
                    <p style="margin-bottom: 15px;">List all container images stored locally on this host.</p>

                    <div class="code-block">
<span class="comment"># Show all downloaded container images</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker images</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">REPOSITORY</span>                                    <span class="prompt">TAG</span>          <span class="prompt">IMAGE ID</span>       <span class="prompt">SIZE</span>
<span class="prompt">──────────</span>                                    <span class="prompt">───</span>          <span class="prompt">────────</span>       <span class="prompt">────</span>
<span class="command">mcr.microsoft.com/windows/servercore</span>          ltsc2022     a1b2c3d4e5f6   <span class="command">2.5 GB</span>
<span class="command">mcr.microsoft.com/windows/nanoserver</span>          ltsc2022     f6e5d4c3b2a1   <span class="command">296 MB</span>
                    </div>

                    <p style="margin-bottom: 15px;">Create and start a container in detached mode so it runs in the background.</p>

                    <div class="code-block">
<span class="comment"># Launch a container in the background with a friendly name</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker run -d --name web1 mcr.microsoft.com/windows/servercore:ltsc2022</span>
                    </div>

                    <p style="margin-bottom: 15px;">Check which containers are running, or use -a to see stopped ones too.</p>

                    <div class="code-block">
<span class="comment"># List only running containers</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker ps</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">CONTAINER ID</span>   <span class="prompt">IMAGE</span>          <span class="prompt">COMMAND</span>        <span class="prompt">STATUS</span>          <span class="prompt">NAMES</span>
<span class="prompt">────────────</span>   <span class="prompt">─────</span>          <span class="prompt">───────</span>        <span class="prompt">──────</span>          <span class="prompt">─────</span>
a1b2c3d4e5f6   servercore     "cmd"          Up 5 minutes    <span class="command">web1</span>
                    </div>

                    <p style="margin-bottom: 15px;">Stop, restart, or remove containers as needed during their lifecycle.</p>

                    <div class="code-block">
<span class="comment"># Stop a running container gracefully</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker stop web1</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Start a previously stopped container</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker start web1</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Delete a stopped container permanently</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker rm web1</span>
                    </div>

                    <p style="margin-bottom: 15px;">Open an interactive shell inside a running container for troubleshooting.</p>

                    <div class="code-block">
<span class="comment"># Open an interactive PowerShell session inside the container</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker exec -it web1 powershell</span>
                    </div>

                    <ul class="key-points" style="margin-top: 20px;">
                        <li><strong>-d</strong> = Detached mode (run in background)</li>
                        <li><strong>-it</strong> = Interactive terminal</li>
                        <li><strong>-p 80:80</strong> = Port mapping (host:container)</li>
                        <li><strong>-v</strong> = Volume mount for persistent storage</li>
                    </ul>
                `
            },
            // Slide 6: Nano Server
            {
                title: "Nano Server Overview",
                content: `
                    <p style="margin-bottom: 20px;">Nano Server is a minimal Windows Server deployment option optimized for:</p>
                    <ul class="key-points">
                        <li><strong>Container Base Image</strong> - Smallest official Windows image (~300 MB)</li>
                        <li><strong>Cloud-Native Apps</strong> - .NET Core, ASP.NET Core workloads</li>
                        <li><strong>Microservices</strong> - Minimal attack surface, fast startup</li>
                        <li><strong>Remote Management Only</strong> - No local logon, no GUI, PowerShell Core only</li>
                    </ul>
                    <div class="comparison-grid" style="margin-top: 20px;">
                        <div class="comparison-card nano">
                            <h4>What's Included</h4>
                            <ul>
                                <li>.NET Core Runtime</li>
                                <li>PowerShell Core</li>
                                <li>Windows Filtering Platform</li>
                                <li>Base networking stack</li>
                                <li>WMI (limited)</li>
                            </ul>
                        </div>
                        <div class="comparison-card" style="border-color: var(--error-color);">
                            <h4 style="color: var(--error-color);">What's NOT Included</h4>
                            <ul>
                                <li>GUI / Desktop Experience</li>
                                <li>Full .NET Framework</li>
                                <li>32-bit (WoW64) support</li>
                                <li>MSI installer support</li>
                                <li>Server roles (IIS, AD, etc.)</li>
                            </ul>
                        </div>
                    </div>
                    <div class="info-box">
                        <strong>Note:</strong> Since Windows Server 2019, Nano Server is only available as a container base image, not as a standalone installation.
                    </div>
                `
            },
            // Slide 7: Dockerfile Basics
            {
                title: "Building Custom Images with Dockerfile",
                content: `
                    <p style="margin-bottom: 15px;">A Dockerfile defines how to build a custom container image:</p>
                    <div class="code-block">
<span class="comment"># Dockerfile for ASP.NET Core app on Nano Server</span>
<span class="docker">FROM</span> mcr.microsoft.com/dotnet/aspnet:8.0-nanoserver-ltsc2022
<span class="docker">WORKDIR</span> /app
<span class="docker">COPY</span> publish/ .
<span class="docker">EXPOSE</span> 80
<span class="docker">ENTRYPOINT</span> ["dotnet", "MyWebApp.dll"]
                    </div>
                    <ul class="key-points" style="margin-top: 20px;">
                        <li><strong>FROM</strong> - Base image to build upon</li>
                        <li><strong>WORKDIR</strong> - Set working directory inside container</li>
                        <li><strong>COPY</strong> - Copy files from build context into image</li>
                        <li><strong>EXPOSE</strong> - Document which ports the app uses</li>
                        <li><strong>ENTRYPOINT</strong> - Command to run when container starts</li>
                    </ul>
                    <p style="margin: 15px 0;">Build the Dockerfile into a tagged image, then run a container from it.</p>

                    <div class="code-block">
<span class="comment"># Build the custom image and tag it as myapp:v1</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker build -t myapp:v1 .</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
Step 1/5 : FROM mcr.microsoft.com/dotnet/aspnet:8.0-nanoserver-ltsc2022
 ---&gt; a1b2c3d4e5f6
Step 2/5 : WORKDIR /app
Step 3/5 : COPY publish/ .
Step 4/5 : EXPOSE 80
Step 5/5 : ENTRYPOINT ["dotnet", "MyWebApp.dll"]
<span class="command">Successfully built f6e5d4c3b2a1</span>
<span class="command">Successfully tagged myapp:v1</span>
                    </div>

                    <div class="code-block">
<span class="comment"># Run the container, mapping host port 8080 to container port 80</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">docker run -d -p 8080:80 --name webapp myapp:v1</span>
                    </div>
                `
            },
            // Slide 8: Summary
            {
                title: "Module Summary",
                content: `
                    <ul class="key-points">
                        <li><strong>Containers</strong> provide lightweight, fast-starting application isolation using shared OS kernel</li>
                        <li><strong>Process Isolation</strong> shares host kernel (fast), <strong>Hyper-V Isolation</strong> uses lightweight VMs (secure)</li>
                        <li><strong>Windows Server Core</strong> (~2.5 GB) for full .NET Framework; <strong>Nano Server</strong> (~300 MB) for .NET Core</li>
                        <li><strong>Docker commands</strong>: run, ps, stop, start, exec, logs, images, pull</li>
                        <li><strong>Nano Server</strong> is container-only since 2019 - minimal footprint, remote management only</li>
                        <li><strong>Dockerfiles</strong> define custom images with FROM, COPY, EXPOSE, ENTRYPOINT</li>
                    </ul>
                    <div style="margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 8px; text-align: center;">
                        <p style="margin-bottom: 15px;">Ready to practice?</p>
                        <a href="cloud-guilab.module.html" class="header-btn" style="margin-right: 10px;">GUI Lab</a>
                        <a href="cloud-pslab.module.html" class="header-btn" style="margin-right: 10px;">PowerShell Lab</a>
                        <a href="cloud-quizquiz.module.html" class="header-btn" onclick="if(history.length>1){history.back();return false;}">Take Quiz</a>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next →';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'cloud-guilab.module.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
    <script src="../progress.js"></script>
    <script>WSAProgress.markPresentationViewed('m05');</script>
</body>
</html>
