    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm05',
        title: 'M05: Containers & Nano Server',
        nextModule: '../m06-clustering/cloud-presentation.module.html',
        questions: [
            {
                question: 'What is the primary difference between containers and virtual machines?',
                options: [
                    'Containers require more resources',
                    'Containers share the host OS kernel',
                    'VMs are faster to start',
                    'VMs use less disk space'
                ],
                correct: 1,
                explanation: 'Containers share the host operating system kernel, making them lightweight and fast to start. VMs include a full OS for each instance, consuming significantly more resources.'
            },
            {
                question: 'Which Windows container isolation mode provides the strongest security boundary?',
                options: [
                    'Process isolation',
                    'Hyper-V isolation',
                    'NAT isolation',
                    'Bridge isolation'
                ],
                correct: 1,
                explanation: 'Hyper-V isolation runs each container in a lightweight VM, providing hardware-level isolation similar to traditional VMs. This is required when running untrusted workloads or containers with different kernel version requirements.'
            },
            {
                question: 'What is the approximate size of a Windows Nano Server container image?',
                options: [
                    '50 MB',
                    '300 MB',
                    '1 GB',
                    '2.5 GB'
                ],
                correct: 1,
                explanation: 'Nano Server is approximately 300 MB, making it the smallest official Windows container base image. Server Core is around 3.6 GB by comparison.'
            },
            {
                question: 'Which Docker command lists all running containers?',
                options: [
                    'docker list',
                    'docker containers',
                    'docker ps',
                    'docker show'
                ],
                correct: 2,
                explanation: 'docker ps lists running containers. Add the -a flag to show all containers including stopped ones. This is one of the most commonly used Docker commands.'
            },
            {
                question: 'Since Windows Server 2019, how can Nano Server be deployed?',
                options: [
                    'As a standalone installation only',
                    'As a container base image only',
                    'Both standalone and container',
                    'As a VM template only'
                ],
                correct: 1,
                explanation: 'Since Windows Server 2019, Nano Server is only available as a container base image. It can no longer be installed as a standalone operating system or VM image.'
            },
            {
                question: 'Which Dockerfile instruction sets the base image for a container build?',
                options: [
                    'BASE',
                    'IMAGE',
                    'FROM',
                    'SOURCE'
                ],
                correct: 2,
                explanation: 'FROM is always the first instruction in a Dockerfile and specifies the base image. For example: FROM mcr.microsoft.com/windows/nanoserver:ltsc2022. Every Dockerfile must begin with a FROM instruction.'
            },
            {
                question: 'What is the default networking mode for Docker containers on Windows?',
                options: [
                    'Bridge',
                    'NAT',
                    'Transparent',
                    'Overlay'
                ],
                correct: 1,
                explanation: 'NAT (Network Address Translation) is the default networking mode for Docker containers on Windows. On Linux, the default is bridge mode. NAT allows containers to access external networks through the host\'s IP address.'
            },
            {
                question: 'What is the difference between a container image and a running container?',
                options: [
                    'There is no difference',
                    'An image is a read-only template; a container is a running instance of that image',
                    'A container is smaller than an image',
                    'Images run on Linux only; containers run on Windows'
                ],
                correct: 1,
                explanation: 'A container image is a read-only template containing the application and its dependencies. A container is a running (or stopped) instance created from that image. Multiple containers can be created from the same image.'
            },
            {
                question: 'Which Docker command is used to persist data outside of a container\'s writable layer?',
                options: [
                    'docker save',
                    'docker export',
                    'docker run -v (volume mount)',
                    'docker commit'
                ],
                correct: 2,
                explanation: 'Docker volumes (-v or --mount flag) persist data outside the container\'s writable layer. Without volumes, data is lost when a container is removed. Example: docker run -v mydata:C:\\data myimage'
            },
            {
                question: 'What must match between host and container for process isolation to work on Windows?',
                options: [
                    'CPU architecture only',
                    'Memory size',
                    'OS version',
                    'Network configuration'
                ],
                correct: 2,
                explanation: 'For process isolation on Windows, the container\'s base image OS version must match or be older than the host OS version. Hyper-V isolation removes this requirement by running each container in its own lightweight VM with its own kernel.'
            }
        ]
    });
    </script>
