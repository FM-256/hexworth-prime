<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M09 Quiz: DHCP Services - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #60a5fa;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #60a5fa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.2);
        }

        .option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .explanation {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(96, 165, 250, 0.1);
            border-left: 4px solid #60a5fa;
            border-radius: 0 8px 8px 0;
        }

        .explanation.show { display: block; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .nav-btn.next, .nav-btn.submit {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: #000;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .results.show { display: block; }

        .results h2 {
            color: #60a5fa;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .score {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: #000;
        }

        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M09: DHCP Services Quiz</h1>
            <p>Test your knowledge of DHCP concepts and management</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../m10-group-policy/cloud-presentation.module.html" class="results-btn primary" id="nextModuleBtn">Next Module</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What does DORA stand for in DHCP?",
                options: ["Discover, Obtain, Request, Acknowledge", "Discover, Offer, Request, Acknowledge", "Deliver, Offer, Receive, Accept", "Detect, Offer, Reply, Accept"],
                correct: 1,
                explanation: "DORA stands for Discover, Offer, Request, Acknowledge - the four-step handshake process for obtaining an IP address from DHCP."
            },
            {
                question: "At what percentage of lease time does a client first attempt renewal?",
                options: ["25% (T1)", "50% (T1)", "75% (T2)", "87.5% (T2)"],
                correct: 1,
                explanation: "At 50% of lease time (T1), the client attempts unicast renewal with its DHCP server. At 87.5% (T2), it broadcasts for any server."
            },
            {
                question: "What is the purpose of a DHCP reservation?",
                options: ["To block a MAC address from getting any IP", "To guarantee a specific IP always goes to a specific MAC address", "To extend lease duration for a client", "To exclude an IP from the address pool"],
                correct: 1,
                explanation: "A reservation ensures that a specific IP address is always assigned to a specific device based on its MAC address."
            },
            {
                question: "Which DHCP option number specifies the default gateway (router)?",
                options: ["001", "003", "006", "015"],
                correct: 1,
                explanation: "Option 003 specifies the router (default gateway). Option 006 is DNS servers, and 015 is DNS domain name."
            },
            {
                question: "What does an APIPA address (169.254.x.x) indicate?",
                options: ["DHCP server is overloaded", "Client couldn't reach any DHCP server", "Lease has expired", "IP conflict detected"],
                correct: 1,
                explanation: "An APIPA (Automatic Private IP Addressing) address means the client couldn't contact a DHCP server and assigned itself a link-local address."
            },
            {
                question: "In Hot Standby failover mode, what is the default percentage reserved for the standby server?",
                options: ["0%", "5%", "25%", "50%"],
                correct: 1,
                explanation: "Hot Standby mode reserves 5% of the address pool for the standby server. Load Balance mode splits 50/50 by default."
            },
            {
                question: "Why must DHCP servers be authorized in Active Directory?",
                options: ["For DNS integration", "To prevent rogue DHCP servers", "For failover support", "To enable reservations"],
                correct: 1,
                explanation: "AD authorization prevents rogue DHCP servers from responding to client requests, which could cause network disruption."
            },
            {
                question: "What PowerShell cmdlet creates a new DHCP scope?",
                options: ["New-DhcpServerv4Scope", "Add-DhcpServerv4Scope", "Set-DhcpServerv4Scope", "Create-DhcpServerv4Scope"],
                correct: 1,
                explanation: "Add-DhcpServerv4Scope creates a new DHCP scope. Set-DhcpServerv4Scope modifies an existing scope."
            },
            {
                question: "What is a superscope used for?",
                options: ["Combining multiple servers", "Grouping multiple scopes on the same physical network", "Creating failover relationships", "Increasing lease duration"],
                correct: 1,
                explanation: "A superscope groups multiple scopes that share the same physical network, useful when you've exhausted one IP range."
            },
            {
                question: "What is MCLT in DHCP failover?",
                options: ["Maximum Client Lease Time", "Maximum Client Lead Time", "Minimum Client Lease Time", "Managed Client Load Tracking"],
                correct: 1,
                explanation: "MCLT (Maximum Client Lead Time) is the maximum time one server can extend a lease beyond what the partner knows about."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation">${q.explanation}</div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m09', percentage);
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
