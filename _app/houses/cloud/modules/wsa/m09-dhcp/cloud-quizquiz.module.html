    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm09',
        title: 'M09: DHCP Services',
        nextModule: '../m10-group-policy/cloud-presentation.module.html',
        questions: [
            {
                question: "What does DORA stand for in DHCP?",
                options: ["Discover, Obtain, Request, Acknowledge", "Discover, Offer, Request, Acknowledge", "Deliver, Offer, Receive, Accept", "Detect, Offer, Reply, Accept"],
                correct: 1,
                explanation: "DORA stands for Discover, Offer, Request, Acknowledge - the four-step handshake process for obtaining an IP address from DHCP."
            },
            {
                question: "At what percentage of lease time does a client first attempt renewal?",
                options: ["25% (T1)", "50% (T1)", "75% (T2)", "87.5% (T2)"],
                correct: 1,
                explanation: "At 50% of lease time (T1), the client attempts unicast renewal with its DHCP server. At 87.5% (T2), it broadcasts for any server."
            },
            {
                question: "What is the purpose of a DHCP reservation?",
                options: ["To block a MAC address from getting any IP", "To guarantee a specific IP always goes to a specific MAC address", "To extend lease duration for a client", "To exclude an IP from the address pool"],
                correct: 1,
                explanation: "A reservation ensures that a specific IP address is always assigned to a specific device based on its MAC address."
            },
            {
                question: "Which DHCP option number specifies the default gateway (router)?",
                options: ["001", "003", "006", "015"],
                correct: 1,
                explanation: "Option 003 specifies the router (default gateway). Option 006 is DNS servers, and 015 is DNS domain name."
            },
            {
                question: "What does an APIPA address (169.254.x.x) indicate?",
                options: ["DHCP server is overloaded", "Client couldn't reach any DHCP server", "Lease has expired", "IP conflict detected"],
                correct: 1,
                explanation: "An APIPA (Automatic Private IP Addressing) address means the client couldn't contact a DHCP server and assigned itself a link-local address."
            },
            {
                question: "In Hot Standby failover mode, what is the default percentage reserved for the standby server?",
                options: ["0%", "5%", "25%", "50%"],
                correct: 1,
                explanation: "Hot Standby mode reserves 5% of the address pool for the standby server. Load Balance mode splits 50/50 by default."
            },
            {
                question: "Why must DHCP servers be authorized in Active Directory?",
                options: ["For DNS integration", "To prevent rogue DHCP servers", "For failover support", "To enable reservations"],
                correct: 1,
                explanation: "AD authorization prevents rogue DHCP servers from responding to client requests, which could cause network disruption."
            },
            {
                question: "What PowerShell cmdlet creates a new DHCP scope?",
                options: ["New-DhcpServerv4Scope", "Add-DhcpServerv4Scope", "Set-DhcpServerv4Scope", "Create-DhcpServerv4Scope"],
                correct: 1,
                explanation: "Add-DhcpServerv4Scope creates a new DHCP scope. Set-DhcpServerv4Scope modifies an existing scope."
            },
            {
                question: "What is a superscope used for?",
                options: ["Combining multiple servers", "Grouping multiple scopes on the same physical network", "Creating failover relationships", "Increasing lease duration"],
                correct: 1,
                explanation: "A superscope groups multiple scopes that share the same physical network, useful when you've exhausted one IP range."
            },
            {
                question: "What is MCLT in DHCP failover?",
                options: ["Maximum Client Lease Time", "Maximum Client Lead Time", "Minimum Client Lease Time", "Managed Client Load Tracking"],
                correct: 1,
                explanation: "MCLT (Maximum Client Lead Time) is the maximum time one server can extend a lease beyond what the partner knows about."
            }
        ]
    });
    </script>
