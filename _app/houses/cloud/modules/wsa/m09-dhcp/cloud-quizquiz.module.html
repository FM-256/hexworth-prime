            {
                question: "What does DORA stand for in DHCP?",
                options: ["Discover, Obtain, Request, Acknowledge", "Discover, Offer, Request, Acknowledge", "Deliver, Offer, Receive, Accept", "Detect, Offer, Reply, Accept"],

            {
                question: "At what percentage of lease time does a client first attempt renewal?",

            },
            {
                question: "What is the purpose of a DHCP reservation?",

            {
                question: "Which DHCP option number specifies the default gateway (router)?",
                options: ["001", "003", "006", "015"],
            },
            {
                question: "What does an APIPA address (169.254.x.x) indicate?",
                options: ["DHCP server is overloaded", "Client couldn't reach any DHCP server", "Lease has expired", "IP conflict detected"],

            {
                question: "In Hot Standby failover mode, what is the default percentage reserved for the standby server?",
                options: ["0%", "5%", "25%", "50%"],
            },
            {
                question: "Why must DHCP servers be authorized in Active Directory?",
                options: ["For DNS integration", "To prevent rogue DHCP servers", "For failover support", "To enable reservations"],
            },
            {
                question: "What PowerShell cmdlet creates a new DHCP scope?",

            },
            {
                question: "What is a superscope used for?",
                options: ["Combining multiple servers", "Grouping multiple scopes on the same physical network", "Creating failover relationships", "Increasing lease duration"],
            },
            {
                question: "What is MCLT in DHCP failover?",
                options: ["Maximum Client Lease Time", "Maximum Client Lead Time", "Minimum Client Lease Time", "Managed Client Load Tracking"],
            }
        ]
    });
