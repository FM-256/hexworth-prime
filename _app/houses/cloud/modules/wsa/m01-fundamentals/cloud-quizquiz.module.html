    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm01',
        title: 'M01: Server Installation & Configuration',
        nextModule: '../m02-active-directory/cloud-presentation.module.html',
        questions: [
            {
                question: 'What is the PRIMARY difference between Windows Server 2022 Standard and Datacenter editions?',
                options: [
                    'Datacenter supports Active Directory, Standard does not',
                    'Standard includes 2 VM licenses, Datacenter includes unlimited VM licenses',
                    'Standard supports only 64GB RAM, Datacenter supports up to 48TB',
                    'Datacenter includes a GUI, Standard is command-line only'
                ],
                correct: 1,
                explanation: 'The primary difference between Standard and Datacenter is virtualization licensing. Standard includes rights for 2 Hyper-V VMs (or 2 Windows Server containers), while Datacenter includes unlimited VM and container licenses. Both editions share the same features and capabilities.'
            },
            {
                question: 'Which Windows Server installation option has the SMALLEST attack surface and disk footprint?',
                options: [
                    'Desktop Experience',
                    'Server Core',
                    'Nano Server',
                    'Windows Server Essentials'
                ],
                correct: 1,
                explanation: 'Server Core is the minimal installation option with no GUI shell, resulting in a smaller disk footprint (~10 GB less than Desktop Experience), fewer updates, and a significantly reduced attack surface. Nano Server is a container-only image and not a full installation type.'
            },
            {
                question: 'What is the MINIMUM RAM requirement for installing Windows Server 2022?',
                options: [
                    '256 MB',
                    '512 MB',
                    '2 GB',
                    '4 GB'
                ],
                correct: 1,
                explanation: 'The minimum RAM requirement for Windows Server 2022 is 512 MB. However, Microsoft recommends 2 GB or more for practical use. Desktop Experience requires additional RAM beyond the minimum for acceptable performance.'
            },
            {
                question: 'Which tool launches automatically at logon on a Windows Server with Desktop Experience and serves as the central management console?',
                options: [
                    'Windows Admin Center',
                    'Server Manager',
                    'PowerShell ISE',
                    'Computer Management (compmgmt.msc)'
                ],
                correct: 1,
                explanation: 'Server Manager is the central management console that launches automatically at logon on Desktop Experience. It provides a dashboard for monitoring server health, adding roles and features, and managing both local and remote servers.'
            },
            {
                question: 'After installing Windows Server, which of the following is NOT a recommended initial configuration task?',
                options: [
                    'Rename the computer from its default name',
                    'Configure a static IP address',
                    'Disable Windows Firewall completely',
                    'Apply the latest Windows Updates'
                ],
                correct: 2,
                explanation: 'You should NEVER completely disable Windows Firewall on a server. Instead, configure specific rules to allow only the traffic needed for the server\'s roles. Recommended post-install tasks include renaming the computer, configuring a static IP, applying updates, setting the time zone, and enabling Remote Desktop.'
            },
            {
                question: 'Which PowerShell cmdlet would you use to view all installed and available roles and features on a Windows Server?',
                options: [
                    'Get-WindowsFeature',
                    'Get-ServerRole',
                    'Show-WindowsFeature',
                    'List-ServerFeature'
                ],
                correct: 0,
                explanation: 'Get-WindowsFeature lists all available roles and features along with their installation status. Use Get-WindowsFeature | Where-Object {$_.Installed -eq $true} to filter for installed features only. Install-WindowsFeature is used to add new roles.'
            },
            {
                question: 'What PowerShell cmdlet sets a static IP address on a network adapter?',
                options: [
                    'Set-IPAddress -Interface "Ethernet" -IP 192.168.1.10',
                    'New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress 192.168.1.10 -PrefixLength 24',
                    'netsh interface ip set address "Ethernet" static 192.168.1.10',
                    'Configure-NetAdapter -Name "Ethernet" -Address 192.168.1.10'
                ],
                correct: 1,
                explanation: 'New-NetIPAddress is the PowerShell cmdlet for assigning a static IP address. -InterfaceAlias specifies the adapter, -IPAddress sets the IP, and -PrefixLength defines the subnet mask in CIDR notation (24 = 255.255.255.0). While netsh (option C) also works, it is the legacy tool; New-NetIPAddress is the modern PowerShell approach.'
            },
            {
                question: 'Windows Server 2022 uses which licensing model for the Standard and Datacenter editions?',
                options: [
                    'Per-server with Client Access Licenses (CALs)',
                    'Per-core with Client Access Licenses (CALs)',
                    'Per-user subscription model only',
                    'Free with Azure subscription'
                ],
                correct: 1,
                explanation: 'Windows Server 2022 Standard and Datacenter use per-core licensing with Client Access Licenses (CALs). Licenses are sold in 2-core packs, with a minimum of 8 cores per physical processor and 16 cores per server. CALs can be per-user or per-device.'
            },
            {
                question: 'When initializing a new disk in Windows Server, which partition style supports UEFI boot, disks larger than 2 TB, and up to 128 partitions?',
                options: [
                    'MBR (Master Boot Record)',
                    'GPT (GUID Partition Table)',
                    'Dynamic Disk',
                    'ReFS (Resilient File System)'
                ],
                correct: 1,
                explanation: 'GPT (GUID Partition Table) is the modern standard. It supports UEFI boot, disks larger than 2 TB, and up to 128 partitions. MBR (Master Boot Record) is legacy, limited to 2 TB disks and 4 primary partitions. All modern servers should use GPT.'
            },
            {
                question: 'Which activation method allows enterprise servers to activate against an internal host without direct internet access?',
                options: [
                    'Retail product key entered manually on each server',
                    'KMS (Key Management Service)',
                    'Activation is not required for server operating systems',
                    'Windows Update automatically activates all servers'
                ],
                correct: 1,
                explanation: 'KMS (Key Management Service) allows organizations to activate machines against an internal KMS host server, eliminating the need for each server to contact Microsoft directly. ADBA (Active Directory-Based Activation) and MAK (Multiple Activation Key) are alternatives, but KMS is the most common enterprise solution.'
            }
        ]
    });
    </script>
