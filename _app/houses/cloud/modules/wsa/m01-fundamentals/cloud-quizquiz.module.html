        moduleId: 'm01',
        title: 'M01: Server Installation & Configuration',
        nextModule: '../m02-active-directory/cloud-presentation.module.html',
        questions: [
            {
                question: 'What is the PRIMARY difference between Windows Server 2022 Standard and Datacenter editions?',
                options: [
                    'Datacenter supports Active Directory, Standard does not',
                    'Standard includes 2 VM licenses, Datacenter includes unlimited VM licenses',
                    'Standard supports only 64GB RAM, Datacenter supports up to 48TB',
                    'Datacenter includes a GUI, Standard is command-line only'
                ],
            },
            {
                question: 'Which Windows Server installation option has the SMALLEST attack surface and disk footprint?',
                options: [
                    'Desktop Experience',
                    'Server Core',
                    'Nano Server',
                    'Windows Server Essentials'
                ],
            },
            {
                question: 'What is the MINIMUM RAM requirement for installing Windows Server 2022?',
                options: [
                    '256 MB',
                    '512 MB',
                    '2 GB',
                    '4 GB'
                ],
            },
            {
                question: 'Which tool launches automatically at logon on a Windows Server with Desktop Experience and serves as the central management console?',
                options: [
                    'Windows Admin Center',
                    'Server Manager',
                    'PowerShell ISE',
                    'Computer Management (compmgmt.msc)'
                ],
            },
            {
                question: 'After installing Windows Server, which of the following is NOT a recommended initial configuration task?',
                options: [
                    'Rename the computer from its default name',
                    'Configure a static IP address',
                    'Disable Windows Firewall completely',
                    'Apply the latest Windows Updates'
                ],
            },
            {
                question: 'Which PowerShell cmdlet would you use to view all installed and available roles and features on a Windows Server?',
                options: [
                    'Get-WindowsFeature',
                    'Get-ServerRole',
                    'Show-WindowsFeature',
                    'List-ServerFeature'
                ],
            },
            {
                question: 'What PowerShell cmdlet sets a static IP address on a network adapter?',
                options: [
                    'Set-IPAddress -Interface "Ethernet" -IP 192.168.1.10',
                    'New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress 192.168.1.10 -PrefixLength 24',
                    'netsh interface ip set address "Ethernet" static 192.168.1.10',
                    'Configure-NetAdapter -Name "Ethernet" -Address 192.168.1.10'
                ],
            },
            {
                question: 'Windows Server 2022 uses which licensing model for the Standard and Datacenter editions?',
                options: [
                    'Per-server with Client Access Licenses (CALs)',
                    'Per-core with Client Access Licenses (CALs)',
                    'Per-user subscription model only',
                    'Free with Azure subscription'
                ],
            },
            {
                question: 'When initializing a new disk in Windows Server, which partition style supports UEFI boot, disks larger than 2 TB, and up to 128 partitions?',
                options: [
                    'MBR (Master Boot Record)',
                    'GPT (GUID Partition Table)',
                    'Dynamic Disk',
                    'ReFS (Resilient File System)'
                ],
            },
            {
                question: 'Which activation method allows enterprise servers to activate against an internal host without direct internet access?',
                options: [
                    'Retail product key entered manually on each server',
                    'KMS (Key Management Service)',
                    'Activation is not required for server operating systems',
                    'Windows Update automatically activates all servers'
                ],
            }
        ]
    });
