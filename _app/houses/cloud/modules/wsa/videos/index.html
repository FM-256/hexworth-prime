<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Any sorted student may watch (parity with sibling WSA tools) -->
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Video Library</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-server.webp">
    <style>
        /* Cloud-house palette, readable library register */
        :root {
            --bg: #07182b; --panel: #0d2238; --line: #1d3a5a;
            --ink: #e6f0fb; --muted: #93b2d4; --primary: #00d4ff; --accent: #ff9500;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
        a { color: var(--primary); }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 22px 70px; }
        .back { display: inline-block; margin-bottom: 14px; font-size: .85rem; text-decoration: none; color: var(--muted); }
        .back:hover { color: var(--primary); }
        header h1 { margin: 0 0 4px; font-size: 1.7rem; }
        header .sub { color: var(--muted); margin: 0; }

        /* Responsive grid of video cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
                gap: 20px; margin-top: 24px; }
        .vcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
                 overflow: hidden; scroll-margin-top: 20px; }
        .vcard video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
        .vbody { padding: 14px 16px 18px; }
        .vtag { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
        .vtitle { font-size: 1.18rem; font-weight: 700; margin: 4px 0 2px; }
        .vmeta { color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
        .vdesc { font-size: .92rem; line-height: 1.5; }
        .dur { display: inline-block; background: rgba(0,212,255,0.12); color: var(--primary);
               border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: .72rem; }
        @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="/houses/cloud/modules/wsa/index.html">&larr; WSA Hub</a>
    <header>
        <h1>WSA Video Library</h1>
        <p class="sub">Narrated overviews and primers. Watch any time — the hands-on work stays in the labs.</p>
    </header>
    <div class="grid" id="grid"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// VIDEO MANIFEST — add a new object here to publish another video. Each gets a
// poster-backed player + anchor (id) so the hub sidebar can deep-link to it.
// mp4s live under /assets/videos/ (deployed but gitignored, per the video policy).
// ---------------------------------------------------------------------------
const VIDEOS = [
    {
        id: 'mega-restaurant',
        tag: 'Week 3 · Primer',
        title: 'The Digital Mega-Restaurant',
        duration: '5 min',
        src: '/assets/videos/wsa-w3-mega-restaurant.mp4',
        poster: '/assets/videos/wsa-w3-mega-restaurant-poster.jpg',
        desc: 'A short course hook: Windows Server roles told as one growing restaurant chain. Watch first to frame the week.'
    },
    {
        id: 'core-to-edge',
        tag: 'Week 3 · Overview',
        title: 'Core-to-Edge Ecosystem',
        duration: '10 min',
        src: '/assets/videos/wsa-w3-core-to-edge.mp4',
        poster: '/assets/videos/wsa-w3-core-to-edge-poster.jpg',
        desc: 'The full Week 3 walkthrough — IIS, app pools & auth, Remote Desktop Services, certificate services, and advanced network routing.'
    }
];

// Render one video card (player + metadata) from a manifest entry.
function cardHTML(v) {
    return `<div class="vcard" id="${v.id}">
        <video controls preload="metadata" playsinline poster="${v.poster}">
            <source src="${v.src}" type="video/mp4">
            Your browser does not support embedded video.
            <a href="${v.src}">Download the video</a>.
        </video>
        <div class="vbody">
            <div class="vtag">${v.tag}</div>
            <div class="vtitle">${v.title}</div>
            <div class="vmeta"><span class="dur">${v.duration}</span></div>
            <div class="vdesc">${v.desc}</div>
        </div>
    </div>`;
}

// Build the library grid, then jump to a deep-linked video if one is in the URL hash.
function renderLibrary() {
    document.getElementById('grid').innerHTML = VIDEOS.map(cardHTML).join('');
    if (location.hash) {
        const el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView();
    }
}
renderLibrary();
</script>
</body>
</html>
