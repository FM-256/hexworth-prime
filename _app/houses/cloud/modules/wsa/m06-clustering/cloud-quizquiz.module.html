    <script src="../quiz-engine.js"></script>
    <script>
    WSAQuiz.init({
        moduleId: 'm06',
        title: 'M06: Failover Clustering',
        nextModule: '../m07-monitoring/cloud-presentation.module.html',
        questions: [
            {
                question: 'What is the primary purpose of a failover cluster?',
                options: [
                    'Load balancing web traffic',
                    'High availability through automatic failover',
                    'Faster application performance',
                    'Centralized storage management'
                ],
                correct: 1,
                explanation: 'Failover clusters provide high availability by automatically moving workloads to surviving nodes when a failure occurs. This ensures services remain online with minimal disruption.'
            },
            {
                question: 'What prevents \'split-brain\' scenarios in a failover cluster?',
                options: [
                    'Heartbeat network',
                    'Quorum',
                    'Shared storage',
                    'Live migration'
                ],
                correct: 1,
                explanation: 'Quorum ensures that only one partition of a split cluster remains online by requiring a majority of votes to continue operation. This prevents both halves from running simultaneously and causing data corruption.'
            },
            {
                question: 'Which quorum witness type uses Azure blob storage?',
                options: [
                    'Disk Witness',
                    'File Share Witness',
                    'Cloud Witness',
                    'Node Majority'
                ],
                correct: 2,
                explanation: 'Cloud Witness uses an Azure Storage account\'s blob storage as an arbitration point, ideal for multi-site or Azure-integrated clusters. It requires only a standard Azure storage account and read/write access.'
            },
            {
                question: 'What is the advantage of Cluster Shared Volumes (CSV)?',
                options: [
                    'Only one node can access at a time',
                    'Faster disk I/O',
                    'All nodes can read/write simultaneously',
                    'Smaller disk footprint'
                ],
                correct: 2,
                explanation: 'CSV allows multiple nodes to access the same storage simultaneously through a unified namespace (C:\\ClusterStorage\\). This is essential for features like live migration of VMs between nodes.'
            },
            {
                question: 'Which cmdlet pauses a cluster node for maintenance?',
                options: [
                    'Stop-ClusterNode',
                    'Pause-ClusterNode',
                    'Suspend-ClusterNode',
                    'Disable-ClusterNode'
                ],
                correct: 2,
                explanation: 'Suspend-ClusterNode pauses a node and can optionally drain (move) roles to other nodes with the -Drain parameter. This is the proper way to prepare a node for maintenance.'
            },
            {
                question: 'What is the difference between live migration and quick migration in a cluster?',
                options: [
                    'There is no difference',
                    'Live migration has zero downtime; quick migration briefly saves VM state',
                    'Quick migration is faster than live migration',
                    'Live migration requires shared storage; quick migration does not'
                ],
                correct: 1,
                explanation: 'Live migration transfers a running VM between nodes with zero downtime by copying memory state over the network. Quick migration saves the VM state to disk first, causing a brief pause (seconds of downtime) before resuming on the new node.'
            },
            {
                question: 'What does Cluster-Aware Updating (CAU) do?',
                options: [
                    'Updates cluster configuration',
                    'Automates Windows patching with minimal downtime',
                    'Updates DNS records',
                    'Synchronizes cluster time'
                ],
                correct: 1,
                explanation: 'CAU automates the installation of Windows updates across cluster nodes by draining, patching, rebooting, and resuming each node in sequence. This maintains high availability throughout the patching process.'
            },
            {
                question: 'What should you run before creating a new cluster or adding nodes?',
                options: [
                    'Get-Cluster',
                    'New-Cluster',
                    'Test-Cluster',
                    'Install-Cluster'
                ],
                correct: 2,
                explanation: 'Test-Cluster runs validation tests to verify that servers and storage are properly configured for clustering. Microsoft requires passing validation for the cluster to be in a supported configuration.'
            },
            {
                question: 'What is Storage Spaces Direct (S2D) in a failover cluster?',
                options: [
                    'A SAN management tool',
                    'Software-defined storage that pools local disks across cluster nodes',
                    'A cloud backup solution',
                    'An iSCSI target configuration'
                ],
                correct: 1,
                explanation: 'Storage Spaces Direct (S2D) is software-defined storage that pools local disks (HDD, SSD, NVMe) across cluster nodes into a shared, highly available storage pool. It eliminates the need for shared SAS or SAN storage.'
            },
            {
                question: 'What is a \'preferred owner\' in a failover cluster?',
                options: [
                    'The only node that can run a role',
                    'The node a clustered role will try to run on when possible',
                    'The administrator of the cluster',
                    'The node with the most resources'
                ],
                correct: 1,
                explanation: 'A preferred owner is the node a clustered role will try to run on when available. During failback, the role will automatically move back to its preferred owner. This is configured per role and is not a hard requirement.'
            }
        ]
    });
    </script>
