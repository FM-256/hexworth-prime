    <title>WSA M06: Failover Clustering - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-bg: #0a0a0f; --secondary-bg: #12141f; --panel-bg: #1a1c28;
            --border-color: #2d3748; --accent-blue: #60a5fa; --accent-light: #93c5fd;
            --text-primary: #e0e0e0; --text-secondary: #9ca3af;
            --success-color: #22c55e; --warning-color: #f59e0b; --error-color: #ef4444;
            --cluster-green: #10b981; --cluster-gold: #fbbf24;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--primary-bg); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
        .presentation-container { display: flex; flex-direction: column; height: 100vh; }
        .slide-header { background: var(--secondary-bg); padding: 12px 20px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .slide-header h1 { font-size: 1.2rem; color: var(--accent-blue); }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .slide-counter { color: var(--accent-light); font-size: 0.9rem; }
        .header-btn { padding: 8px 16px; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); color: var(--accent-blue); border-radius: 6px; cursor: pointer; font-size: 0.85rem; text-decoration: none; transition: all 0.3s; }
        .header-btn:hover { background: var(--accent-blue); color: #000; }
        .slide-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; overflow: auto; }
        .slide { max-width: 1000px; width: 100%; }
        .slide-title { font-size: 2.2rem; color: var(--accent-blue); margin-bottom: 30px; text-align: center; }
        .slide-content { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; }
        .slide-nav { background: var(--secondary-bg); padding: 15px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; }
        .nav-btn.secondary { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .nav-btn.primary { background: var(--accent-blue); color: #000; }
        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .key-points { list-style: none; }
        .key-points li { padding: 12px 15px; margin-bottom: 10px; background: var(--panel-bg); border-left: 4px solid var(--accent-blue); border-radius: 0 8px 8px 0; }
        .key-points li strong { color: var(--accent-blue); }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .comparison-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .comparison-card h4 { color: var(--cluster-green); margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .comparison-card ul { list-style: none; font-size: 0.9rem; color: var(--text-secondary); }
        .comparison-card li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .comparison-card li:last-child { border-bottom: none; }
        .code-block { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.9rem; overflow-x: auto; margin: 15px 0; white-space: pre-wrap; }
        .code-block .comment { color: #6a9955; }
        .code-block .cmdlet { color: #dcdcaa; }
        .code-block .param { color: #9cdcfe; }
        .code-block .string { color: #ce9178; }
        .code-block .prompt { color: #60a5fa; }
        .code-block .command { color: #e0e0e0; }
        .architecture-diagram { background: var(--panel-bg); border-radius: 8px; padding: 20px; margin: 20px 0; text-align: center; }
        .cluster-diagram { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 20px 0; }
        .cluster-node { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border-radius: 8px; padding: 20px; min-width: 120px; text-align: center; }
        .cluster-node.active { border: 3px solid var(--cluster-green); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .cluster-node .icon { font-size: 2rem; margin-bottom: 8px; }
        .cluster-node .label { font-weight: 600; }
        .cluster-node .status { font-size: 0.8rem; color: var(--cluster-green); }
        .cluster-shared { background: linear-gradient(135deg, #374151, #1f2937); border: 2px dashed var(--cluster-gold); border-radius: 8px; padding: 15px 25px; }
        .info-box { background: rgba(16, 185, 129, 0.1); border-left: 4px solid var(--cluster-green); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .warning-box { background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--warning-color); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .quorum-types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .quorum-type { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .quorum-type h5 { color: var(--cluster-gold); margin-bottom: 8px; }
        .quorum-type p { font-size: 0.85rem; color: var(--text-secondary); }
        .nav-footer { background: var(--secondary-bg); padding: 12px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); }
        .footer-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>

    <script>
        const slides = [
            // Slide 1: Title
            {
                title: "Failover Clustering",
                content: `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="font-size: 5rem; margin-bottom: 20px;">🔄</div>
                        <h2 style="color: var(--cluster-green); font-size: 1.8rem; margin-bottom: 15px;">Module 06: High Availability</h2>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                            Implement fault-tolerant infrastructure with Windows Server Failover Clustering for continuous service availability.
                        </p>
                        <div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">🖥️</div>
                                <div style="color: var(--cluster-green); font-weight: 600;">Nodes</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">⚖️</div>
                                <div style="color: var(--cluster-gold); font-weight: 600;">Quorum</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">💾</div>
                                <div style="color: var(--accent-blue); font-weight: 600;">CSV</div>
                            </div>
                        </div>
                    </div>
                `
            },
            // Slide 2: What is Failover Clustering
            {
                title: "What is Failover Clustering?",
                content: `
                    <p style="margin-bottom: 20px;">A failover cluster is a group of independent servers (nodes) that work together to increase availability of applications and services.</p>
                    <div class="cluster-diagram">
                        <div class="cluster-node active">
                            <div class="icon">🖥️</div>
                            <div class="label">Node 1</div>
                            <div class="status">Active</div>
                        </div>
                        <div style="font-size: 2rem;">⟷</div>
                        <div class="cluster-shared">
                            <div style="font-size: 1.5rem; margin-bottom: 5px;">💾</div>
                            <div>Shared Storage</div>
                        </div>
                        <div style="font-size: 2rem;">⟷</div>
                        <div class="cluster-node">
                            <div class="icon">🖥️</div>
                            <div class="label">Node 2</div>
                            <div class="status" style="color: var(--text-secondary);">Standby</div>
                        </div>
                    </div>
                    <ul class="key-points">
                        <li><strong>Automatic Failover</strong> - When a node fails, workloads move to surviving nodes automatically</li>
                        <li><strong>Shared Storage</strong> - All nodes access the same data via SAN, iSCSI, or Storage Spaces Direct</li>
                        <li><strong>Heartbeat Network</strong> - Nodes constantly monitor each other's health</li>
                        <li><strong>Clustered Roles</strong> - Services that can move between nodes (VMs, File Servers, SQL, etc.)</li>
                    </ul>
                `
            },
            // Slide 3: Quorum & Witness
            {
                title: "Quorum & Witness Configuration",
                content: `
                    <p style="margin-bottom: 15px;">Quorum determines how many failures the cluster can sustain while remaining online. It prevents "split-brain" scenarios.</p>
                    <div class="info-box">
                        <strong>Split-Brain:</strong> When network partition causes both halves of a cluster to think the other has failed, potentially corrupting data. Quorum prevents this.
                    </div>
                    <div class="quorum-types">
                        <div class="quorum-type">
                            <h5>🗳️ Node Majority</h5>
                            <p>Each node gets one vote. Cluster stays up if majority of nodes are online. Best for odd number of nodes.</p>
                        </div>
                        <div class="quorum-type">
                            <h5>💾 Disk Witness</h5>
                            <p>Small shared disk gets a vote. Breaks ties in even-node clusters. Requires shared storage.</p>
                        </div>
                        <div class="quorum-type">
                            <h5>☁️ Cloud Witness</h5>
                            <p>Azure blob storage acts as witness. No shared storage needed. Great for stretched clusters.</p>
                        </div>
                        <div class="quorum-type">
                            <h5>📁 File Share Witness</h5>
                            <p>SMB file share gets a vote. For clusters without shared storage or Azure access.</p>
                        </div>
                    </div>
                    <p>Use PowerShell to configure the quorum witness type for your cluster.</p>
                    <div class="code-block">
<span class="comment"># Set Azure blob storage as the cluster quorum witness</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Set-ClusterQuorum</span> <span class="param">-CloudWitness</span>
    <span class="param">-AccountName</span> <span class="string">"hexworthwitness"</span>
    <span class="param">-AccessKey</span> <span class="string">"&lt;storage-key&gt;"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="prompt">Cluster          QuorumResource        QuorumType</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="command">HexCluster</span>       Cloud Witness         <span class="command">NodeAndCloudMajority</span>
                    </div>
                `
            },
            // Slide 4: Cluster Shared Volumes
            {
                title: "Cluster Shared Volumes (CSV)",
                content: `
                    <p style="margin-bottom: 20px;">CSV provides a unified namespace for shared storage, allowing all cluster nodes to read/write simultaneously.</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4>Traditional Cluster Disks</h4>
                            <ul>
                                <li>Only one node can access at a time</li>
                                <li>Disk must "move" during failover</li>
                                <li>Each disk has own drive letter</li>
                                <li>Slower failover times</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">Cluster Shared Volumes</h4>
                            <ul>
                                <li>All nodes can access simultaneously</li>
                                <li>No disk movement needed</li>
                                <li>Unified path: C:\\ClusterStorage\\</li>
                                <li>Faster VM live migration</li>
                            </ul>
                        </div>
                    </div>
                    <div class="architecture-diagram">
                        <div style="font-weight: 600; margin-bottom: 15px; color: var(--cluster-gold);">CSV Architecture</div>
                        <div style="background: #1e3a8a; padding: 10px; border-radius: 6px; margin-bottom: 10px; color: white;">
                            C:\\ClusterStorage\\Volume1 ← All Nodes Access Same Path
                        </div>
                        <div style="display: flex; justify-content: center; gap: 20px;">
                            <div style="background: var(--panel-bg); padding: 10px 20px; border-radius: 6px;">Node 1: R/W</div>
                            <div style="background: var(--panel-bg); padding: 10px 20px; border-radius: 6px;">Node 2: R/W</div>
                            <div style="background: var(--panel-bg); padding: 10px 20px; border-radius: 6px;">Node 3: R/W</div>
                        </div>
                    </div>
                    <p>Convert a cluster disk to a Cluster Shared Volume so all nodes can access it simultaneously.</p>
                    <div class="code-block">
<span class="comment"># Convert a cluster disk into a shared volume</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-ClusterSharedVolume</span> <span class="param">-Name</span> <span class="string">"Cluster Disk 1"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────────────</span>
<span class="prompt">Name              State    Node        SharedVolumesRoot</span>
<span class="comment"># ─────────────────────────────────────────────────────────</span>
<span class="command">Cluster Disk 1</span>    Online   <span class="command">Node1</span>       C:\\ClusterStorage\\Volume1
                    </div>
                `
            },
            // Slide 5: Clustered Roles
            {
                title: "Common Clustered Roles",
                content: `
                    <p style="margin-bottom: 20px;">Clustered roles are services or applications that can fail over between nodes:</p>
                    <div class="quorum-types">
                        <div class="quorum-type">
                            <h5 style="color: var(--accent-blue);">🖥️ Hyper-V VMs</h5>
                            <p>Live migration moves VMs between nodes with zero downtime. Most common cluster workload.</p>
                        </div>
                        <div class="quorum-type">
                            <h5 style="color: var(--cluster-green);">📁 File Server</h5>
                            <p>Scale-Out File Server (SOFS) provides continuously available SMB shares for SQL, Hyper-V.</p>
                        </div>
                        <div class="quorum-type">
                            <h5 style="color: var(--warning-color);">🗄️ SQL Server</h5>
                            <p>Failover Cluster Instance (FCI) or Always On Availability Groups for database HA.</p>
                        </div>
                        <div class="quorum-type">
                            <h5 style="color: var(--error-color);">🌐 Generic Services</h5>
                            <p>DHCP, Print Server, iSCSI Target, or any service that supports clustering.</p>
                        </div>
                    </div>
                    <p>Register a Hyper-V virtual machine as a highly available clustered role.</p>
                    <div class="code-block">
<span class="comment"># Make a VM highly available by adding it to the cluster</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Add-ClusterVirtualMachineRole</span> <span class="param">-VMName</span> <span class="string">"SQL-VM-01"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="prompt">Name          OwnerNode    State</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="command">SQL-VM-01</span>     Node1        <span class="command">Online</span>
                    </div>

                    <p>Set a resource dependency so the VM requires its cluster disk before starting.</p>
                    <div class="code-block">
<span class="comment"># Require Cluster Disk 1 before this VM can come online</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Set-ClusterResourceDependency</span> <span class="param">-Resource</span> <span class="string">"SQL-VM-01"</span>
    <span class="param">-Dependency</span> <span class="string">"[Cluster Disk 1]"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="prompt">Resource       DependencyExpression</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="command">SQL-VM-01</span>      [<span class="command">Cluster Disk 1</span>]
                    </div>
                `
            },
            // Slide 6: Cluster-Aware Updating
            {
                title: "Cluster-Aware Updating (CAU)",
                content: `
                    <p style="margin-bottom: 20px;">CAU automates Windows updates across cluster nodes with minimal downtime:</p>
                    <div class="architecture-diagram">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
                            <div style="background: var(--cluster-green); color: #000; padding: 10px 15px; border-radius: 6px; font-weight: 600;">
                                1. Pause Node
                            </div>
                            <div style="font-size: 1.5rem;">→</div>
                            <div style="background: var(--warning-color); color: #000; padding: 10px 15px; border-radius: 6px; font-weight: 600;">
                                2. Drain Roles
                            </div>
                            <div style="font-size: 1.5rem;">→</div>
                            <div style="background: var(--accent-blue); color: #000; padding: 10px 15px; border-radius: 6px; font-weight: 600;">
                                3. Install Updates
                            </div>
                            <div style="font-size: 1.5rem;">→</div>
                            <div style="background: var(--error-color); color: #fff; padding: 10px 15px; border-radius: 6px; font-weight: 600;">
                                4. Reboot
                            </div>
                            <div style="font-size: 1.5rem;">→</div>
                            <div style="background: var(--cluster-green); color: #000; padding: 10px 15px; border-radius: 6px; font-weight: 600;">
                                5. Resume Node
                            </div>
                        </div>
                        <div style="margin-top: 15px; color: var(--text-secondary);">Process repeats for each node in the cluster</div>
                    </div>
                    <ul class="key-points">
                        <li><strong>Self-Updating Mode</strong> - Cluster updates itself on a schedule (requires CAU role installed)</li>
                        <li><strong>Remote-Updating Mode</strong> - Administrator triggers updates from a remote machine</li>
                        <li><strong>Pre/Post Scripts</strong> - Run custom scripts before/after updates</li>
                    </ul>
                    <p>Trigger a rolling update across all cluster nodes with a single command.</p>
                    <div class="code-block">
<span class="comment"># Start a Cluster-Aware Updating run on all nodes</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Invoke-CauRun</span> <span class="param">-ClusterName</span> <span class="string">"HexCluster"</span> <span class="param">-Force</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="prompt">RunId    ClusterName    Status         NodesUpdated</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="command">1</span>        HexCluster     <span class="command">InProgress</span>     0 / 2
                    </div>

                    <p>Monitor the progress of the current or most recent CAU run.</p>
                    <div class="code-block">
<span class="comment"># Check the status of the current update run</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-CauRun</span> <span class="param">-ClusterName</span> <span class="string">"HexCluster"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="prompt">RunId    ClusterName    Status       StartTime</span>
<span class="comment"># ─────────────────────────────────────────────────</span>
<span class="command">1</span>        HexCluster     <span class="command">Succeeded</span>    2025-06-15 02:00:00
                    </div>
                `
            },
            // Slide 7: PowerShell Management
            {
                title: "Cluster PowerShell Commands",
                content: `
                    <p>Retrieve the cluster name, domain, and configuration details.</p>
                    <div class="code-block">
<span class="comment"># View basic cluster information</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-Cluster</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">Name</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="command">HexCluster</span>
                    </div>

                    <p>List every node in the cluster and see which are currently up.</p>
                    <div class="code-block">
<span class="comment"># List all nodes and their current state</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-ClusterNode</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">Name      ID    State</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="command">Node1</span>     1     <span class="command">Up</span>
<span class="command">Node2</span>     2     <span class="command">Up</span>
                    </div>

                    <p>See all clustered roles and which node currently owns each one.</p>
                    <div class="code-block">
<span class="comment"># Show all clustered roles (VMs, file servers, etc.)</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Get-ClusterGroup</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">Name              OwnerNode    State</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="command">SQL-VM-01</span>         Node1        <span class="command">Online</span>
<span class="command">FileServer</span>        Node2        <span class="command">Online</span>
Cluster Group     Node1        Online
                    </div>

                    <p>Pause a node and drain its roles to another node before maintenance.</p>
                    <div class="code-block">
<span class="comment"># Drain all roles off a node for planned maintenance</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Suspend-ClusterNode</span> <span class="param">-Name</span> <span class="string">"Node1"</span> <span class="param">-Drain</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="prompt">Name      State</span>
<span class="comment"># ─────────────────────────────────────────</span>
<span class="command">Node1</span>     <span class="command">Paused</span>
                    </div>

                    <p>After maintenance, bring the node back into service.</p>
                    <div class="code-block">
<span class="comment"># Return a paused node to active cluster duty</span>
<span class="prompt">PS C:\\&gt;</span> <span class="command">Resume-ClusterNode</span> <span class="param">-Name</span> <span class="string">"Node1"</span>
                    </div>
                    <div class="code-block">
<span class="comment"># Expected output:</span>
<span class="comment"># ─────────────────────────────────────────</span>

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next →';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'cloud-guilab.module.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
