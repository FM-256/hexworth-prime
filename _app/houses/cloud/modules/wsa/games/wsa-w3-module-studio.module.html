<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access control: any sorted student may study (parity with sibling WSA tools) -->
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Module Studio — The Digital Mega-Restaurant</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-server.webp">
    <style>
        /* Cloud-house palette, study-tool register (readable, not arcade) */
        :root {
            --bg: #07182b; --panel: #0d2238; --panel-2: #102b46;
            --line: #1d3a5a; --ink: #e6f0fb; --muted: #93b2d4;
            --primary: #00d4ff; --accent: #ff9500; --good: #34d399; --bad: #f87171;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
        a { color: var(--primary); }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 22px 60px; }

        /* Header + the restaurant framing line */
        header h1 { margin: 0 0 4px; font-size: 1.7rem; }
        header .sub { color: var(--muted); margin: 0 0 4px; }
        header .theme { color: var(--accent); font-size: .9rem; letter-spacing: .02em; }
        .back { display: inline-block; margin-bottom: 14px; font-size: .85rem; text-decoration: none; color: var(--muted); }
        .back:hover { color: var(--primary); }

        /* Tab bar */
        .tabs { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
        .tab { background: var(--panel); border: 1px solid var(--line); color: var(--ink);
               padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: .95rem; font-weight: 600; }
        .tab.active { background: var(--primary); color: #03263a; border-color: var(--primary); }
        .panel { display: none; }
        .panel.active { display: block; animation: fade .25s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Station chips (restaurant metaphor) */
        .station { font-size: .72rem; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }

        /* Compare mode */
        .cmp-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
                 border-radius: 8px; padding: 9px 12px; font-size: .95rem; }
        .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .col-head { padding: 14px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
        .col-head .mod { font-size: 1.15rem; font-weight: 700; }
        .col-head .tech { color: var(--muted); font-size: .85rem; margin-top: 2px; }
        .row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .row:last-child { border-bottom: none; }
        .row .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--primary); margin-bottom: 6px; }
        .row ul { margin: 0; padding-left: 18px; }
        .row li { margin: 3px 0; font-size: .9rem; }
        .row.diff { background: rgba(255,149,0,0.05); }

        /* Flashcards mode */
        .fc-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .card { perspective: 1400px; height: 340px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform .5s;
                      transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px;
                border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column;
                justify-content: center; }
        .face.front { background: var(--panel); }
        .face.back { background: var(--panel-2); transform: rotateY(180deg); }
        .face .q { font-size: 1.35rem; font-weight: 700; }
        .face .hint { color: var(--muted); margin-top: 10px; font-size: .85rem; }
        .face .a-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 10px; }
        .face ul { margin: 0; padding-left: 20px; }
        .face li { margin: 5px 0; font-size: 1rem; }

        /* Challenge mode */
        .ch-stat { display: flex; gap: 22px; margin-bottom: 14px; font-size: .95rem; }
        .ch-stat b { color: var(--primary); }
        .clue { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                padding: 22px; font-size: 1.2rem; text-align: center; margin-bottom: 16px; min-height: 90px;
                display: flex; align-items: center; justify-content: center; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
               padding: 16px; border-radius: 10px; cursor: pointer; text-align: left; font-size: .95rem; }
        .opt:hover { border-color: var(--primary); }
        .opt.correct { background: rgba(52,211,153,0.18); border-color: var(--good); }
        .opt.wrong { background: rgba(248,113,113,0.16); border-color: var(--bad); }
        .opt .st { display: block; font-size: .7rem; color: var(--muted); margin-top: 3px; }
        .btn { background: var(--accent); color: #2a1500; border: none; padding: 10px 18px;
               border-radius: 9px; font-weight: 700; cursor: pointer; font-size: .9rem; }
        .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); }
        .feedback { margin-top: 14px; min-height: 24px; font-size: .95rem; }
        .done { text-align: center; padding: 30px; }
        .done .score { font-size: 2.4rem; font-weight: 800; color: var(--primary); }

        @media (max-width: 760px) { .cmp-grid, .opts { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="/houses/cloud/modules/wsa/index.html">&larr; WSA Hub</a>
    <header>
        <h1>Week 3 Module Studio</h1>
        <p class="sub">IIS &middot; RDS &middot; Certificate Services &middot; Advanced Networking — compare, drill, and test yourself.</p>
        <p class="theme">The Digital Mega-Restaurant: every server role is a station in one growing kitchen.</p>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="compare">Compare</button>
        <button class="tab" data-tab="flash">Flashcards</button>
        <button class="tab" data-tab="challenge">Challenge</button>
    </div>

    <!-- COMPARE -->
    <section class="panel active" id="compare">
        <div class="cmp-controls">
            <label>Compare <select id="selA"></select></label>
            <label>against <select id="selB"></select></label>
        </div>
        <div class="cmp-grid" id="cmpGrid"></div>
    </section>

    <!-- FLASHCARDS -->
    <section class="panel" id="flash">
        <div class="fc-bar">
            <button class="btn ghost" id="fcPrev">&larr; Prev</button>
            <span id="fcCount"></span>
            <button class="btn ghost" id="fcNext">Next &rarr;</button>
            <button class="btn ghost" id="fcShuffle">Shuffle</button>
            <span class="hint" style="color:var(--muted)">Click the card to flip</span>
        </div>
        <div class="card" id="fcCard"><div class="card-inner">
            <div class="face front"><div class="q" id="fcQ"></div><div class="hint" id="fcHint"></div></div>
            <div class="face back"><div class="a-title">Answer</div><div id="fcA"></div></div>
        </div></div>
    </section>

    <!-- CHALLENGE -->
    <section class="panel" id="challenge">
        <div id="chPlay">
            <div class="ch-stat"><span>Question <b id="chNum">1</b>/<span id="chTotal">10</span></span>
                <span>Score <b id="chScore">0</b></span><span>Streak <b id="chStreak">0</b></span></div>
            <div class="clue" id="chClue"></div>
            <div class="opts" id="chOpts"></div>
            <div class="feedback" id="chFeedback"></div>
        </div>
        <div class="done" id="chDone" style="display:none;">
            <div class="score" id="chFinal"></div>
            <p id="chVerdict" style="color:var(--muted)"></p>
            <button class="btn" id="chRestart">Play again</button>
        </div>
    </section>
</div>

<script>
// ---------------------------------------------------------------------------
// DATA — Week 3 module summary (verbatim from the "Module Summary" spreadsheet),
// plus a restaurant "station" framing tied to the slide-2 opener video.
// ---------------------------------------------------------------------------
const MODULES = [
    { id: 'iis', tag: 'M11', name: 'IIS', station: 'The Pass / Serving Line',
      tech: 'Windows Web Stack / HTTP.sys kernel-mode driver',
      components: ['HTTP.sys (kernel driver)', 'WAS — Windows Process Activation Service', 'W3SVC — World Wide Web Publishing Service', 'w3wp.exe — worker process'],
      functions: ['Application pool isolation', 'Zero-downtime recycling', 'SSL/TLS hardening', 'Five auth flavors: Anonymous, Windows, Basic, Digest, Forms'],
      config: ['Registry-based protocol enabling (TLS 1.2/1.3)', 'SNI for certificate sharing', 'URL Rewrite for HTTPS redirection', 'Recycling triggers: time, memory, request count'],
      modes: ['Static vs. Dynamic requests', 'Overlapped vs. Non-overlapped recycling'] },
    { id: 'rds', tag: 'M12', name: 'RDS', station: 'The Dining Rooms',
      tech: 'Multi-user app delivery / RDP over HTTPS',
      components: ['RD Session Host', 'RD Connection Broker', 'RD Gateway', 'RD Web Access', 'RD Licensing'],
      functions: ['RemoteApp delivery', 'External access without VPN via RD Gateway', 'CAP/RAP security policies', 'CAL tracking'],
      config: ['120-day licensing grace period', 'Port 443 tunneling for Gateway', 'NPS integration for MFA', 'Per-User vs. Per-Device CAL assignment'],
      modes: ['Session-Based (shared OS) vs. VDI (per-user VM)', 'Per-User CAL vs. Per-Device CAL'] },
    { id: 'cert', tag: 'M13', name: 'Certificate Services', station: 'ID & Door Security',
      tech: 'PKI (Public Key Infrastructure) / X.509',
      components: ['Root CA', 'Issuing CA (subordinate)', 'Certificate Templates', 'CRL / OCSP'],
      functions: ['Chain of trust', 'GPO-triggered autoenrollment', 'Web enrollment', 'Certificate revocation'],
      config: ['Two-tier hierarchy: offline Root + online Issuing', 'Template permissions (Enroll / Autoenroll)', 'CDP / AIA URL embedding'],
      modes: ['Enterprise CA (AD-integrated) vs. Standalone CA (manual/offline)'] },
    { id: 'net', tag: 'M14', name: 'Advanced Networking', station: 'Host Stand & Directory',
      tech: 'NIC Teaming, DNS Policies, DNSSEC',
      components: ['Logical interfaces (Teams)', 'DNS Zone Scopes', 'DNSSEC records: RRSIG, DNSKEY, DS'],
      functions: ['Bandwidth aggregation', 'Site-aware DNS responses', 'Cryptographic verification of DNS answers', 'Split-Brain DNS'],
      config: ['Teaming modes: Switch Independent, LACP, Static', 'Load balancing: Address Hash, Dynamic', 'PowerShell-only DNS policy configuration'],
      modes: ['Switch Independent vs. LACP', 'NIC Teaming vs. SET (Switch Embedded Teaming)'] }
];
// The dimensions rendered in Compare + turned into flashcards.
const DIMS = [
    { key: 'tech', label: 'Core Technology' },
    { key: 'components', label: 'Primary Components' },
    { key: 'functions', label: 'Key Functions' },
    { key: 'config', label: 'Configuration Details' },
    { key: 'modes', label: 'Comparison / Modes' }
];
const byId = id => MODULES.find(m => m.id === id);

// ---------------------------------------------------------------------------
// TABS — show one panel at a time.
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
}));

// ---------------------------------------------------------------------------
// COMPARE — two module pickers render side-by-side; rows that differ are tinted.
// ---------------------------------------------------------------------------
const selA = document.getElementById('selA'), selB = document.getElementById('selB');
// Populate both dropdowns with the four modules.
MODULES.forEach(m => {
    selA.add(new Option(`${m.tag} — ${m.name}`, m.id));
    selB.add(new Option(`${m.tag} — ${m.name}`, m.id));
});
selA.value = 'iis'; selB.value = 'rds';

// Build one module column's HTML for the comparison grid.
function colHTML(m, other) {
    let rows = '';
    DIMS.forEach(d => {
        const val = m[d.key];
        // Mark a row as "diff" when the two modules' values are not identical.
        const same = JSON.stringify(val) === JSON.stringify(other[d.key]);
        const body = Array.isArray(val)
            ? '<ul>' + val.map(v => `<li>${v}</li>`).join('') + '</ul>'
            : `<div>${val}</div>`;
        rows += `<div class="row ${same ? '' : 'diff'}"><div class="lbl">${d.label}</div>${body}</div>`;
    });
    return `<div class="col"><div class="col-head"><div class="station">${m.station}</div>
            <div class="mod">${m.tag} &middot; ${m.name}</div></div>${rows}</div>`;
}
// Re-render the comparison grid from the two current selections.
function renderCompare() {
    const a = byId(selA.value), b = byId(selB.value);
    document.getElementById('cmpGrid').innerHTML = colHTML(a, b) + colHTML(b, a);
}
selA.addEventListener('change', renderCompare);
selB.addEventListener('change', renderCompare);
renderCompare();

// ---------------------------------------------------------------------------
// FLASHCARDS — auto-generated from every module x dimension cell.
// ---------------------------------------------------------------------------
// Build the card list: one card per (module, dimension).
function buildCards() {
    const cards = [];
    MODULES.forEach(m => DIMS.forEach(d => {
        cards.push({
            q: `${m.name} — ${d.label}?`,
            hint: `${m.tag} · ${m.station}`,
            answer: m[d.key]
        });
    }));
    return cards;
}
let cards = buildCards(), fcIdx = 0;
const fcCard = document.getElementById('fcCard');

// Render the current flashcard (front shows question, back shows the answer).
function renderCard() {
    const c = cards[fcIdx];
    fcCard.classList.remove('flipped');
    document.getElementById('fcQ').textContent = c.q;
    document.getElementById('fcHint').textContent = c.hint;
    const a = c.answer;
    document.getElementById('fcA').innerHTML = Array.isArray(a)
        ? '<ul>' + a.map(v => `<li>${v}</li>`).join('') + '</ul>'
        : `<div style="font-size:1.05rem">${a}</div>`;
    document.getElementById('fcCount').textContent = `Card ${fcIdx + 1} / ${cards.length}`;
}
// Flip the card on click.
fcCard.addEventListener('click', () => fcCard.classList.toggle('flipped'));
// Navigation + shuffle.
document.getElementById('fcNext').addEventListener('click', () => { fcIdx = (fcIdx + 1) % cards.length; renderCard(); });
document.getElementById('fcPrev').addEventListener('click', () => { fcIdx = (fcIdx - 1 + cards.length) % cards.length; renderCard(); });
document.getElementById('fcShuffle').addEventListener('click', () => {
    // Fisher–Yates shuffle (no Math.random dependency on dates etc.).
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    fcIdx = 0; renderCard();
});
renderCard();

// ---------------------------------------------------------------------------
// CHALLENGE — "which module owns this?" multiple-choice recall game.
// ---------------------------------------------------------------------------
const CH_TOTAL = 10;
let chQuestions = [], chNum = 0, chScore = 0, chStreak = 0, chLock = false;

// Build a pool of clues: each component/function/mode mapped to its owning module.
function buildClues() {
    const pool = [];
    MODULES.forEach(m => {
        m.components.forEach(c => pool.push({ clue: c, answer: m.id }));
        m.functions.forEach(c => pool.push({ clue: c, answer: m.id }));
        m.modes.forEach(c => pool.push({ clue: c, answer: m.id }));
    });
    return pool;
}
// Shuffle helper used to pick questions + order options.
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
// Start (or restart) a challenge run.
function startChallenge() {
    chQuestions = shuffle(buildClues()).slice(0, CH_TOTAL);
    chNum = 0; chScore = 0; chStreak = 0;
    document.getElementById('chDone').style.display = 'none';
    document.getElementById('chPlay').style.display = 'block';
    document.getElementById('chTotal').textContent = CH_TOTAL;
    renderQuestion();
}
// Render the current clue + four module options.
function renderQuestion() {
    chLock = false;
    const q = chQuestions[chNum];
    document.getElementById('chNum').textContent = chNum + 1;
    document.getElementById('chScore').textContent = chScore;
    document.getElementById('chStreak').textContent = chStreak;
    document.getElementById('chFeedback').textContent = '';
    document.getElementById('chClue').textContent = q.clue;
    const opts = document.getElementById('chOpts');
    opts.innerHTML = '';
    // All four modules are options every time (only four exist).
    shuffle(MODULES).forEach(m => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = `${m.tag} — ${m.name}<span class="st">${m.station}</span>`;
        b.addEventListener('click', () => answer(b, m.id, q.answer));
        opts.appendChild(b);
    });
}
// Handle an answer click: lock, score, reveal correct, advance.
function answer(btn, picked, correct) {
    if (chLock) return;
    chLock = true;
    const right = picked === correct;
    if (right) { chScore++; chStreak++; btn.classList.add('correct'); }
    else { chStreak = 0; btn.classList.add('wrong'); }
    // Always highlight the correct option.
    document.querySelectorAll('#chOpts .opt').forEach(o => {
        if (o.textContent.startsWith(byId(correct).tag)) o.classList.add('correct');
    });
    const cm = byId(correct);
    document.getElementById('chFeedback').innerHTML = right
        ? `<span style="color:var(--good)">Correct — that's ${cm.name} (${cm.station}).</span>`
        : `<span style="color:var(--bad)">That belongs to ${cm.name} — ${cm.station}.</span>`;
    document.getElementById('chScore').textContent = chScore;
    document.getElementById('chStreak').textContent = chStreak;
    // Advance after a short reveal.
    setTimeout(() => {
        chNum++;
        if (chNum >= chQuestions.length) finishChallenge();
        else renderQuestion();
    }, 1100);
}
// Show the final score with a verdict band.
function finishChallenge() {
    document.getElementById('chPlay').style.display = 'none';
    document.getElementById('chDone').style.display = 'block';
    document.getElementById('chFinal').textContent = `${chScore} / ${CH_TOTAL}`;
    const pct = chScore / CH_TOTAL;
    document.getElementById('chVerdict').textContent = pct === 1 ? 'Head chef. You own every station.'
        : pct >= 0.7 ? 'Solid line cook — a few stations to firm up.'
        : 'Back to the prep table — run the flashcards and try again.';
}
document.getElementById('chRestart').addEventListener('click', startChallenge);
startChallenge();
</script>
    <script src="/components/ObservatoryTelemetry.js"></script>
</body>
</html>
