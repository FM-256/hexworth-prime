            {
                question: "In a three-tier CA hierarchy, what is the recommended state for the Root CA?",
                options: ["Online and domain-joined", "Offline and air-gapped", "Virtualized with snapshots", "Running on a domain controller"],
            },
            {
                question: "What is the purpose of a Certificate Template?",
                options: ["Store certificate private keys", "Define certificate properties and enrollment permissions", "Encrypt certificate databases", "Route certificate requests"],
            },
            {
                question: "What is the difference between CRL and OCSP?",
                options: ["CRL is faster, OCSP is more secure", "CRL is a periodic list, OCSP provides real-time checks", "OCSP is deprecated, CRL is modern", "They are the same thing"],

                question: "Which CA type integrates with Active Directory for automatic enrollment?",
                options: ["Standalone CA", "Enterprise CA", "Third-party CA", "Root CA"],

                options: ["Revoke the Root certificate", "Issue new certificates", "The entire PKI must be rebuilt", "Nothing, Root CAs are self-healing"],

            {
                question: "What is Key Archival used for?",
                options: ["Storing public keys", "Backing up encryption keys for recovery", "Archiving expired certificates", "Compressing the CA database"],
            },
            {
                question: "For which certificate type should you NEVER enable key archival?",
                options: ["Encryption certificates", "Signature-only certificates", "Web server certificates", "User certificates"],
            },
            {
                question: "What is the recommended key length for a Root CA?",
                options: ["1024 bits", "2048 bits", "4096 bits or higher", "512 bits"],
            },
            {
                question: "How do you enable automatic certificate enrollment for domain computers?",
                options: ["Run certreq on each computer", "Configure GPO autoenrollment settings", "Email the IT department", "Install a web server"],
            },
            {
                question: "What must be backed up when performing a CA backup?",
                options: ["Only the CA database", "Only the private key", "CA database, private key, and configuration", "Only issued certificates"],
            }
        ]
    });
