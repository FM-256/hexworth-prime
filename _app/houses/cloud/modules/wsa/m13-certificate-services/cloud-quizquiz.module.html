<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M13 Quiz: Certificate Services - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="container">
        <div class="header">
            <h1>M13: Certificate Services Quiz</h1>
            <p>Test your knowledge of PKI and AD CS</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="cloud-presentation.module.html" class="results-btn secondary">Review Material</a>
                <a href="../m14-advanced-networking/cloud-presentation.module.html" class="results-btn primary" id="nextModuleBtn">Next Module</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "In a three-tier CA hierarchy, what is the recommended state for the Root CA?",
                options: ["Online and domain-joined", "Offline and air-gapped", "Virtualized with snapshots", "Running on a domain controller"],
                correct: 1,
                explanation: "The Root CA should be kept offline (air-gapped) to protect its private key, which is critical to the entire PKI."
            },
            {
                question: "What is the purpose of a Certificate Template?",
                options: ["Store certificate private keys", "Define certificate properties and enrollment permissions", "Encrypt certificate databases", "Route certificate requests"],
                correct: 1,
                explanation: "Certificate templates define key usage, validity, key size, subject format, and which users/computers can enroll."
            },
            {
                question: "What is the difference between CRL and OCSP?",
                options: ["CRL is faster, OCSP is more secure", "CRL is a periodic list, OCSP provides real-time checks", "OCSP is deprecated, CRL is modern", "They are the same thing"],
                correct: 1,
                explanation: "CRL is a periodically published list of revoked certificates, while OCSP provides real-time revocation status checks."
            },
            {
                question: "Which CA type integrates with Active Directory for automatic enrollment?",
                options: ["Standalone CA", "Enterprise CA", "Third-party CA", "Root CA"],
                correct: 1,
                explanation: "Enterprise CAs integrate with AD for autoenrollment, template-based issuance, and publishing certificates to AD."
            },
            {
                question: "What happens if a Root CA private key is compromised?",
                options: ["Revoke the Root certificate", "Issue new certificates", "The entire PKI must be rebuilt", "Nothing, Root CAs are self-healing"],
                correct: 2,
                explanation: "A compromised Root CA key means all certificates in the hierarchy are potentially untrusted - the PKI must be rebuilt."
            },
            {
                question: "What is Key Archival used for?",
                options: ["Storing public keys", "Backing up encryption keys for recovery", "Archiving expired certificates", "Compressing the CA database"],
                correct: 1,
                explanation: "Key archival backs up user encryption private keys so they can be recovered if the user loses access to them."
            },
            {
                question: "For which certificate type should you NEVER enable key archival?",
                options: ["Encryption certificates", "Signature-only certificates", "Web server certificates", "User certificates"],
                correct: 1,
                explanation: "Signature-only certificates should never have key archival - if the key is recovered, someone else could forge signatures."
            },
            {
                question: "What is the recommended key length for a Root CA?",
                options: ["1024 bits", "2048 bits", "4096 bits or higher", "512 bits"],
                correct: 2,
                explanation: "Root CAs should use 4096-bit or stronger keys since they have long validity periods (10-20 years)."
            },
            {
                question: "How do you enable automatic certificate enrollment for domain computers?",
                options: ["Run certreq on each computer", "Configure GPO autoenrollment settings", "Email the IT department", "Install a web server"],
                correct: 1,
                explanation: "Autoenrollment is configured through Group Policy under Computer/User Configuration > Policies > Windows Settings > Security Settings > Public Key Policies."
            },
            {
                question: "What must be backed up when performing a CA backup?",
                options: ["Only the CA database", "Only the private key", "CA database, private key, and configuration", "Only issued certificates"],
                correct: 2,
                explanation: "A complete CA backup includes the private key, CA certificate, database, logs, and registry configuration."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (passed) {
                WSAProgress.markQuizPassed('m13', percentage);
            } else {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
