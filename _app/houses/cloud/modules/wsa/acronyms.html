<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Acronym Index &middot; CTS1328C / AZ-800</title>
    <!-- Canonical WSA acronym dictionary (window.HEX_GLOSSARY.wsa). -->
    <script src="../../../../data/glossary/acronyms-wsa.js"></script>
    <style>
        :root { --bg:#0a1628; --panel:#0f1f38; --text:#e6edf3; --muted:#94a3b8; --accent:#60a5fa; --border:rgba(148,163,184,0.18); }
        * { box-sizing: border-box; }
        html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
        .wrap { max-width:980px; margin:0 auto; padding:32px 20px 80px; }
        header.page { border-bottom:1px solid var(--border); padding-bottom:18px; margin-bottom:22px; }
        .eyebrow { color:var(--accent); font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
        h1 { font-size:1.9rem; margin:6px 0 4px; }
        .sub { color:var(--muted); font-size:.95rem; }
        /* Sticky control bar: search box + live count. */
        .controls { position:sticky; top:0; background:var(--bg); padding:14px 0; z-index:5; border-bottom:1px solid var(--border); }
        #search { width:100%; padding:12px 14px; font-size:1rem; background:var(--panel); color:var(--text);
                  border:1px solid var(--border); border-radius:10px; outline:none; }
        #search:focus { border-color:var(--accent); }
        .count { color:var(--muted); font-size:.85rem; margin-top:8px; }
        /* A-Z jump nav (hidden while searching). */
        .azbar { display:flex; flex-wrap:wrap; gap:4px; margin:16px 0 4px; }
        .azbar a { color:var(--accent); text-decoration:none; font-size:.8rem; font-weight:600; padding:3px 7px; border-radius:6px; }
        .azbar a:hover { background:var(--panel); }
        /* Letter sections + definition rows. */
        .letter { font-size:1.1rem; color:var(--accent); font-weight:800; margin:26px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
        dl { margin:0; }
        .row { display:grid; grid-template-columns:160px 1fr; gap:14px; padding:9px 0; border-bottom:1px solid rgba(148,163,184,0.08); }
        dt { font-weight:700; color:#fff; font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace; font-size:.95rem; word-break:break-word; }
        dd { margin:0; color:var(--text); }
        dd ul { margin:0; padding-left:18px; }
        dd li { margin:2px 0; }
        .empty { color:var(--muted); padding:40px 0; text-align:center; }
        @media (max-width:560px) { .row { grid-template-columns:1fr; gap:2px; } dt { color:var(--accent); } }
    </style>
</head>
<body>
<div class="wrap">
    <header class="page">
        <div class="eyebrow">Windows Server Administration</div>
        <h1>Acronym Index</h1>
        <div class="sub">CTS1328C / AZ-800 &middot; every acronym used across the WSA course, with its expansion.</div>
    </header>

    <div class="controls">
        <input id="search" type="search" placeholder="Search acronym or words (e.g. WSUS, kerberos, certificate)…" autocomplete="off" autofocus>
        <div class="count" id="count"></div>
    </div>

    <nav class="azbar" id="azbar" aria-label="Jump to letter"></nav>
    <dl id="list"></dl>
    <div class="empty" id="empty" hidden>No acronyms match that search.</div>
</div>

<script>
    // Pull the dictionary; normalize every value to an array of meanings.
    var DICT = (window.HEX_GLOSSARY && window.HEX_GLOSSARY.wsa) || {};
    var ENTRIES = Object.keys(DICT).map(function (k) {
        var v = DICT[k];
        return { acronym: k, meanings: Array.isArray(v) ? v : [v] };
    }).sort(function (a, b) {
        return a.acronym.toLowerCase().localeCompare(b.acronym.toLowerCase());
    });

    var listEl = document.getElementById('list');
    var azEl = document.getElementById('azbar');
    var countEl = document.getElementById('count');
    var emptyEl = document.getElementById('empty');
    var searchEl = document.getElementById('search');

    // First alphanumeric character of an acronym, uppercased, for grouping.
    function letterOf(s) {
        var m = s.toUpperCase().match(/[A-Z0-9]/);
        return m ? m[0] : '#';
    }

    // Render the given entries grouped into A-Z letter sections.
    function render(entries) {
        listEl.innerHTML = '';
        azEl.innerHTML = '';
        emptyEl.hidden = entries.length > 0;

        var lettersSeen = {};
        var currentLetter = null;
        var dl = document.createDocumentFragment();

        entries.forEach(function (e) {
            var L = letterOf(e.acronym);
            if (L !== currentLetter) {
                currentLetter = L;
                lettersSeen[L] = true;
                var h = document.createElement('div');
                h.className = 'letter';
                h.id = 'letter-' + L;
                h.textContent = L;
                dl.appendChild(h);
            }
            var row = document.createElement('div');
            row.className = 'row';
            var dt = document.createElement('dt');
            dt.textContent = e.acronym;
            var dd = document.createElement('dd');
            if (e.meanings.length === 1) {
                dd.textContent = e.meanings[0];
            } else {
                // Multi-meaning acronym: list each distinct definition.
                var ul = document.createElement('ul');
                e.meanings.forEach(function (m) {
                    var li = document.createElement('li');
                    li.textContent = m;
                    ul.appendChild(li);
                });
                dd.appendChild(ul);
            }
            row.appendChild(dt);
            row.appendChild(dd);
            dl.appendChild(row);
        });
        listEl.appendChild(dl);

        // Build the A-Z jump bar from the letters actually present.
        Object.keys(lettersSeen).sort().forEach(function (L) {
            var a = document.createElement('a');
            a.href = '#letter-' + L;
            a.textContent = L;
            azEl.appendChild(a);
        });
        countEl.textContent = entries.length + ' of ' + ENTRIES.length + ' acronyms';
    }

    // Filter on acronym text OR any expansion text (case-insensitive).
    function filter(q) {
        q = q.trim().toLowerCase();
        azEl.style.display = q ? 'none' : 'flex';
        if (!q) return ENTRIES;
        return ENTRIES.filter(function (e) {
            if (e.acronym.toLowerCase().indexOf(q) !== -1) return true;
            return e.meanings.some(function (m) { return m.toLowerCase().indexOf(q) !== -1; });
        });
    }

    searchEl.addEventListener('input', function () { render(filter(searchEl.value)); });
    render(ENTRIES);
</script>
</body>
</html>
