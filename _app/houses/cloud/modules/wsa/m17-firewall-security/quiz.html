<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M17 Quiz: Windows Firewall & Security - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #9ca3af; }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            transition: width 0.3s;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number { color: #60a5fa; font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.2); }
        .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .option-marker {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            border-color: #60a5fa;
            background: #60a5fa;
            color: #000;
        }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.prev { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; }
        .nav-btn.next, .nav-btn.submit { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; text-align: center; padding: 40px; }
        .results.show { display: block; }
        .results h2 { color: #60a5fa; font-size: 2rem; margin-bottom: 20px; }

        .score { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        .score.pass { color: #22c55e; }
        .score.fail { color: #ef4444; }

        .results-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }

        .results-btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .results-btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: #000; }
        .results-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>M17: Windows Firewall & Security Quiz</h1>
            <p>Test your knowledge of Windows Firewall and security concepts</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <p id="progressText">Question 1 of 10</p>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>Quiz Complete!</h2>
            <div class="score" id="scoreDisplay">0%</div>
            <p id="scoreMessage"></p>
            <div class="results-actions">
                <a href="presentation.html" class="results-btn secondary">Review Material</a>
                <a href="../m18-powershell-automation/presentation.html" class="results-btn primary" id="nextModuleBtn">Next Module →</a>
                <a href="../index.html" class="results-btn secondary">Course Overview</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What are the three Windows Firewall profiles?",
                options: ["Home, Work, Public", "Domain, Private, Public", "Internal, External, DMZ", "Trusted, Untrusted, Mixed"],
                correct: 1,
                explanation: "Windows Firewall uses Domain, Private, and Public profiles that activate based on network location detection."
            },
            {
                question: "What is the default behavior for inbound connections in Windows Firewall?",
                options: ["Allow all connections", "Block all connections", "Prompt user for each connection", "Allow only signed connections"],
                correct: 1,
                explanation: "By default, Windows Firewall blocks all unsolicited inbound connections while allowing outbound connections."
            },
            {
                question: "Which profile activates when a computer can reach a domain controller?",
                options: ["Private profile", "Domain profile", "Public profile", "Enterprise profile"],
                correct: 1,
                explanation: "The Domain profile automatically activates when the computer detects it can authenticate with a domain controller."
            },
            {
                question: "What is the purpose of Connection Security Rules?",
                options: ["Block specific IP addresses", "Configure IPsec authentication and encryption", "Rate limit connections", "Log all traffic"],
                correct: 1,
                explanation: "Connection Security Rules configure IPsec-based authentication and encryption between computers."
            },
            {
                question: "Which PowerShell cmdlet creates a new firewall rule?",
                options: ["Add-FirewallRule", "New-NetFirewallRule", "Create-WindowsFirewallRule", "Set-NetFirewallRule"],
                correct: 1,
                explanation: "New-NetFirewallRule creates new inbound or outbound firewall rules with specified properties."
            },
            {
                question: "What type of rule would you create to allow incoming HTTPS traffic?",
                options: ["Outbound rule for TCP 443", "Inbound rule for TCP 443", "Connection security rule", "Outbound rule for UDP 443"],
                correct: 1,
                explanation: "HTTPS uses TCP port 443, and you need an inbound rule to allow incoming connections to a web server."
            },
            {
                question: "Why is the Public profile the most restrictive?",
                options: ["It's the default profile", "It's designed for untrusted networks like public WiFi", "It blocks all traffic", "It requires administrator approval"],
                correct: 1,
                explanation: "The Public profile is designed for untrusted networks where you want maximum protection, like coffee shop WiFi."
            },
            {
                question: "What does enabling 'Log dropped packets' do?",
                options: ["Blocks more traffic", "Records blocked connection attempts to a log file", "Automatically blocks repeat offenders", "Sends alerts to administrators"],
                correct: 1,
                explanation: "Enabling this setting records all blocked connections to the firewall log, useful for troubleshooting and security monitoring."
            },
            {
                question: "Which ports should typically NOT be exposed directly to the internet?",
                options: ["80 and 443", "25 and 587", "3389 (RDP) and 445 (SMB)", "53 and 123"],
                correct: 2,
                explanation: "RDP and SMB are common attack targets. They should be accessed through VPN or other secure methods, not directly from the internet."
            },
            {
                question: "What does Test-NetConnection help you do?",
                options: ["Create firewall rules automatically", "Test if a port is reachable through the firewall", "Enable all network connections", "Configure VPN settings"],
                correct: 1,
                explanation: "Test-NetConnection tests connectivity to a host and optionally to a specific TCP port, helping diagnose firewall issues."
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${answers[currentQuestion] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                                <div>${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>← Previous</button>
                    ${currentQuestion === questions.length - 1
                        ? '<button class="nav-btn submit" onclick="submitQuiz()">Submit Quiz</button>'
                        : '<button class="nav-btn next" onclick="nextQuestion()">Next →</button>'
                    }
                </div>
            `;

            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function submitQuiz() {
            let correct = 0;
            answers.forEach((ans, i) => {
                if (ans === questions[i].correct) correct++;
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = percentage + '%';
            scoreDisplay.className = 'score ' + (passed ? 'pass' : 'fail');

            document.getElementById('scoreMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            if (!passed) {
                document.getElementById('nextModuleBtn').style.display = 'none';
            }
        }

        renderQuestion();
    </script>
</body>
</html>
