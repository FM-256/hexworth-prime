<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M03 Quiz: Storage & File Services - Hexworth Prime</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0a0f;
            --secondary-bg: #12141f;
            --panel-bg: #1a1c28;
            --border-color: #2d3748;
            --accent-blue: #60a5fa;
            --accent-light: #93c5fd;
            --text-primary: #e0e0e0;
            --text-secondary: #9ca3af;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .page-header {
            background: var(--secondary-bg);
            padding: 12px 20px;
            border-bottom: 2px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-btn {
            padding: 8px 16px;
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: var(--accent-blue);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            text-decoration: none;
        }

        .header-btn:hover {
            background: var(--accent-blue);
            color: #000;
        }

        /* Quiz Container */
        .quiz-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .quiz-progress {
            background: var(--secondary-bg);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: var(--panel-bg);
            border-radius: 4px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Question Card */
        .question-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .question-number {
            color: var(--accent-blue);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .question-text code {
            background: rgba(96, 165, 250, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
        }

        /* Answer Options */
        .options-list {
            list-style: none;
        }

        .option {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: var(--accent-blue);
            background: rgba(96, 165, 250, 0.05);
        }

        .option.selected {
            border-color: var(--accent-blue);
            background: rgba(96, 165, 250, 0.1);
        }

        .option.correct {
            border-color: var(--success-color);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .option.selected .option-letter {
            background: var(--accent-blue);
            color: #000;
        }

        .option.correct .option-letter {
            background: var(--success-color);
            color: #fff;
        }

        .option.incorrect .option-letter {
            background: var(--error-color);
            color: #fff;
        }

        .option-text {
            flex: 1;
        }

        /* Explanation */
        .explanation {
            display: none;
            background: rgba(96, 165, 250, 0.1);
            border-left: 4px solid var(--accent-blue);
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation h4 {
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navigation */
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .nav-btn.secondary {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }

        .nav-btn.primary {
            background: var(--accent-blue);
            color: #000;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results */
        .results-card {
            display: none;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }

        .results-card.show {
            display: block;
        }

        .results-score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 20px 0;
        }

        .results-score.passing {
            color: var(--success-color);
        }

        .results-score.failing {
            color: var(--error-color);
        }

        .results-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--text-secondary);
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Navigation Footer */
        .nav-footer {
            background: var(--secondary-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        .footer-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .footer-btn:hover {
            background: var(--accent-blue);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>WSA M03 Quiz: Storage & File Services</h1>
        <div class="header-controls">
            <a class="header-btn" href="presentation.html">&larr; Review Material</a>
        </div>
    </div>

    <div class="quiz-container">
        <div class="quiz-progress">
            <span id="progressText">Question 1 of 10</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 10%"></div>
            </div>
            <span id="scoreText">Score: 0</span>
        </div>

        <div id="questionContainer">
            <!-- Questions loaded dynamically -->
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete!</h2>
            <div class="results-score" id="finalScore">0%</div>
            <p class="results-message" id="resultsMessage"></p>
            <div class="results-actions">
                <button class="nav-btn secondary" onclick="restartQuiz()">Try Again</button>
                <a href="presentation.html" class="nav-btn secondary">Review Material</a>
                <a href="../m04-hyperv/presentation.html" class="nav-btn primary">Next Module &rarr;</a>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="presentation.html" class="footer-btn">&larr; Presentation</a>
        <a href="gui-lab.html" class="footer-btn">GUI Lab</a>
        <a href="ps-lab.html" class="footer-btn">PS Lab</a>
        <a href="../index.html" class="footer-btn">Course Home</a>
    </div>

    <script>
        const questions = [
            {
                question: "What is the maximum disk size supported by MBR partition style?",
                options: ["512 GB", "2 TB", "4 TB", "Unlimited"],
                correct: 1,
                explanation: "MBR (Master Boot Record) supports disks up to 2 TB. For larger disks, you must use GPT (GUID Partition Table)."
            },
            {
                question: "Which PowerShell cmdlet initializes a new disk?",
                options: ["New-Disk", "Initialize-Disk", "Set-Disk", "Start-Disk"],
                correct: 1,
                explanation: "Initialize-Disk sets the partition style (GPT or MBR) on a new disk before partitions can be created."
            },
            {
                question: "What partition style should you use for UEFI-based systems?",
                options: ["MBR", "GPT", "Dynamic", "Basic"],
                correct: 1,
                explanation: "GPT (GUID Partition Table) is required for UEFI boot. MBR is used with legacy BIOS systems."
            },
            {
                question: "In Storage Spaces, what is the minimum number of disks required for a mirrored virtual disk?",
                options: ["1", "2", "3", "4"],
                correct: 1,
                explanation: "A two-way mirror requires at least 2 physical disks. A three-way mirror requires at least 5 disks."
            },
            {
                question: "Which cmdlet creates a new SMB file share?",
                options: ["Add-SmbShare", "New-SmbShare", "Create-Share", "Set-SmbShare"],
                correct: 1,
                explanation: "New-SmbShare creates a new SMB share with specified name, path, and permissions."
            },
            {
                question: "When both NTFS and share permissions apply, which rule determines effective access?",
                options: [
                    "Share permissions always win",
                    "NTFS permissions always win",
                    "Most permissive wins",
                    "Most restrictive wins"
                ],
                correct: 3,
                explanation: "The most restrictive permission wins. If share grants Full but NTFS grants Read, the user gets Read access."
            },
            {
                question: "What does a $ symbol at the end of a share name indicate?",
                options: [
                    "Administrative share",
                    "Hidden share",
                    "Read-only share",
                    "Encrypted share"
                ],
                correct: 1,
                explanation: "A share name ending with $ (like Data$) is hidden and won't appear when browsing the network. Users must know the exact name to access it."
            },
            {
                question: "Which Storage Spaces resiliency type provides the best storage efficiency?",
                options: ["Simple", "Mirror", "Parity", "All are equal"],
                correct: 0,
                explanation: "Simple (striping) provides 100% efficiency but no redundancy. Mirror uses ~50%, and Parity uses 67-88% depending on disk count."
            },
            {
                question: "What is the correct pipeline to initialize, partition, and format a disk in one command?",
                options: [
                    "New-Disk | New-Partition | Format-Volume",
                    "Initialize-Disk | New-Partition | Format-Volume",
                    "Set-Disk | Add-Partition | Format-Volume",
                    "Get-Disk | Set-Partition | New-Volume"
                ],
                correct: 1,
                explanation: "The pipeline is: Initialize-Disk (set partition style) → New-Partition (create partition) → Format-Volume (apply filesystem)."
            },
            {
                question: "Which file system should you choose for modern Windows Server data volumes?",
                options: ["FAT32", "exFAT", "NTFS", "ext4"],
                correct: 2,
                explanation: "NTFS is the standard Windows file system supporting security permissions, compression, encryption, and large volumes. ReFS is an alternative for specific scenarios."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('questionContainer');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <ul class="options-list">
                        ${q.options.map((opt, i) => `
                            <li class="option" data-index="${i}" onclick="selectOption(${i})">
                                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                                <span class="option-text">${opt}</span>
                            </li>
                        `).join('')}
                    </ul>
                    <div class="explanation" id="explanation">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                </div>
                <div class="quiz-nav">
                    <button class="nav-btn secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()" disabled>
                        ${currentQuestion === questions.length - 1 ? 'Finish' : 'Next'} &rarr;
                    </button>
                </div>
            `;

            answered = false;
            updateProgress();
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const options = document.querySelectorAll('.option');
            const correct = questions[currentQuestion].correct;

            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === correct) {
                    opt.classList.add('correct');
                } else if (i === index && i !== correct) {
                    opt.classList.add('incorrect');
                }
            });

            if (index === correct) {
                score++;
                document.getElementById('scoreText').textContent = `Score: ${score}`;
            }

            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function showResults() {
            document.getElementById('questionContainer').innerHTML = '';
            document.querySelector('.quiz-progress').style.display = 'none';

            const percentage = Math.round((score / questions.length) * 100);
            const passing = percentage >= 70;

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const scoreEl = document.getElementById('finalScore');
            scoreEl.textContent = `${percentage}%`;
            scoreEl.className = `results-score ${passing ? 'passing' : 'failing'}`;

            let message = '';
            if (percentage === 100) {
                message = "Perfect score! You've mastered Storage & File Services!";
            } else if (percentage >= 80) {
                message = "Excellent work! You have a strong understanding of storage concepts.";
            } else if (percentage >= 70) {
                message = "Good job! You passed. Review the material to strengthen weak areas.";
            } else {
                message = "Keep practicing! Review the presentation and try the labs again.";
            }
            document.getElementById('resultsMessage').textContent = message;

            // Save progress
            if (passing) {
                try {
                    const progress = JSON.parse(localStorage.getItem('hexworthProgress') || '{}');
                    progress['wsa-m03-quiz'] = {
                        completed: true,
                        score: percentage,
                        date: new Date().toISOString(),
                    };
                    localStorage.setItem('hexworthProgress', JSON.stringify(progress));
                } catch (e) {
                    console.error('Failed to save progress:', e);
                }
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = false;

            document.getElementById('resultsCard').classList.remove('show');
            document.querySelector('.quiz-progress').style.display = 'flex';
            document.getElementById('scoreText').textContent = 'Score: 0';

            renderQuestion();
        }

        // Initialize
        renderQuestion();
    </script>
</body>
</html>
