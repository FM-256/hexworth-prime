<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Any sorted student may browse the atlas (parity with sibling WSA tools) -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Module Atlas — All 19 Modules</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-server.webp">
    <style>
        :root {
            --bg:#07182b; --panel:#0d2238; --panel2:#102b46; --line:#1d3a5a;
            --ink:#e6f0fb; --muted:#93b2d4; --primary:#00d4ff; --accent:#ff9500;
        }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}
        a{color:var(--primary)}
        .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 70px}
        .back{display:inline-block;margin-bottom:14px;font-size:.85rem;color:var(--muted);text-decoration:none}
        .back:hover{color:var(--primary)}
        header h1{margin:0 0 4px;font-size:1.7rem}
        header .sub{color:var(--muted);margin:0}
        /* Controls */
        .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
        #search{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
                border-radius:10px;padding:11px 14px;font-size:.95rem}
        .tracks{display:flex;gap:6px;flex-wrap:wrap}
        .tk{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;
            padding:6px 12px;font-size:.78rem;cursor:pointer}
        .tk.active{color:#03263a;font-weight:700}
        /* Grid */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
        .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tk,#3a5a7a);
              border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .12s,border-color .12s}
        .card:hover{transform:translateY(-3px);border-color:var(--primary)}
        .card .num{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
        .card .nm{font-size:1.08rem;font-weight:700;margin:2px 0 4px}
        .card .tech{font-size:.82rem;color:var(--muted);min-height:34px}
        .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
        .chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.7rem;color:var(--ink)}
        .chip.more{color:var(--muted)}
        .tkbadge{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tk,#7da)}
        /* Detail modal */
        .overlay{position:fixed;inset:0;background:rgba(2,10,20,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
        .overlay.open{display:flex}
        .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;
               max-height:86vh;overflow:auto;padding:24px 26px}
        .modal h2{margin:0 0 2px}
        .modal .mtech{color:var(--muted);margin:0 0 16px}
        .sec{margin-bottom:16px}
        .sec .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);margin-bottom:7px}
        .sec ul{margin:0;padding-left:18px}.sec li{margin:3px 0;font-size:.92rem}
        .modes .chip{background:rgba(255,149,0,.10);border-color:rgba(255,149,0,.35)}
        .close{float:right;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;
               padding:6px 12px;cursor:pointer;font-size:.85rem}
        .count{color:var(--muted);font-size:.82rem;margin:10px 2px}
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="/houses/cloud/modules/wsa/index.html">&larr; WSA Hub</a>
    <header>
        <h1>WSA Module Atlas</h1>
        <p class="sub">All 19 modules at a glance — search, filter by track, click any module for the full breakdown.</p>
    </header>
    <div class="controls">
        <input id="search" type="search" placeholder="Search modules, components, features… (e.g. DNSSEC, recycling, RODC)">
        <div class="tracks" id="tracks"></div>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
// ---------------------------------------------------------------------------
// MODULE DATA — the full WSA module summary (built with the module-summary-builder
// skill, grounded in each module's deck). 7-field schema + a color "track".
// ---------------------------------------------------------------------------
const TRACKS = {
    found:{label:'Foundations',c:'#7aa2c8'}, ident:{label:'Identity & AD',c:'#a78bfa'},
    storage:{label:'Storage & Virtualization',c:'#2dd4bf'}, net:{label:'Networking',c:'#22d3ee'},
    apps:{label:'Apps & Remote',c:'#ff9500'}, sec:{label:'Security & PKI',c:'#f472b6'},
    ops:{label:'Operations',c:'#34d399'}
};
const MODULES = [
 {n:1,t:'found',name:'Fundamentals',tech:'Windows Server install + base configuration',comp:['Server Manager','PowerShell','Server Core vs Desktop Experience','Domain Controller','DNS'],func:['Role/feature install','IP/hostname/domain-join','GUI vs CLI mgmt','RDP remote admin'],cfg:['Static IP','Computer rename','Domain join'],modes:['Desktop Experience vs Server Core','GUI vs PowerShell']},
 {n:2,t:'ident',name:'Active Directory',tech:'AD DS directory service',comp:['Domain Controller (DC)','Organizational Unit (OU)','AD DS','LDAP','Users/Groups'],func:['Domain/forest design','Users/groups/OUs','Delegation','GPO linking','LDAP directory queries'],cfg:['Install-ADDSDomainController','OU structure','Delegation of control'],modes:['Forest vs Domain','Security vs Distribution groups']},
 {n:3,t:'storage',name:'Storage',tech:'Windows storage stack + file systems',comp:['NTFS','GPT','MBR','SMB','ACL','Storage Spaces'],func:['Volume creation','NTFS permissions/ACLs','SMB file shares','Disk init'],cfg:['GPT vs MBR init','NTFS ACLs','SMB share perms'],modes:['GPT vs MBR','NTFS vs ReFS','Basic vs Dynamic disks']},
 {n:4,t:'storage',name:'Hyper-V',tech:'Type-1 hypervisor virtualization',comp:['Virtual Machine (VM)','Virtual switch','Virtual NIC','IDE controller (Gen 1)','SCSI controller (Gen 2)','UEFI (Gen 2)'],func:['VM creation','Virtual networking','Checkpoints','PXE boot'],cfg:['vSwitch types','Dynamic memory','Generation config'],modes:['Generation 1 (BIOS/IDE) vs Generation 2 (UEFI/SCSI)']},
 {n:5,t:'storage',name:'Containers',tech:'Windows containers / Docker',comp:['Container image','Container host','Nano Server base image','NAT network','IIS container'],func:['Image build/run','Container networking','App isolation'],cfg:['Networking drivers: NAT / Transparent / Overlay / L2bridge','Image build/copy'],modes:['Process Isolation vs Hyper-V Isolation','Container vs VM']},
 {n:6,t:'storage',name:'Failover Clustering',tech:'High-availability clustering',comp:['Cluster Shared Volumes (CSV)','Cluster-Aware Updating (CAU)','Cluster nodes','Quorum witness','Cloud Witness'],func:['HA failover','CSV shared storage','Rolling patches (CAU)','Quorum'],cfg:['Quorum witness (Disk / File Share / Cloud)','CSV','CAU schedule'],modes:['Node Majority / Node+Disk / Node+File-Share / No Majority (legacy)','Active/Passive vs Active/Active (CSV)']},
 {n:7,t:'ops',name:'Monitoring & Updates',tech:'Patch + performance management',comp:['WSUS','Windows Admin Center (WAC)','Performance Monitor','RBAC'],func:['Patch approval/deploy (WSUS)','Perf monitoring (CPU/RAM)','Central mgmt (WAC)','RBAC'],cfg:['WSUS approvals','Perfmon data collector sets'],modes:['WSUS vs Windows Update','WAC vs Server Manager']},
 {n:8,t:'net',name:'DNS',tech:'Name resolution',comp:['DNS zones','SRV/PTR/A records','TLD','TTL','Forwarders'],func:['Forward/reverse lookup','AD-integrated zones','Record mgmt','Recursion/forwarding'],cfg:['Zone create','TTL','Conditional forwarders'],modes:['Forward vs Reverse','Primary vs Secondary vs AD-integrated','Recursion vs Forwarding']},
 {n:9,t:'net',name:'DHCP',tech:'Dynamic IP assignment',comp:['DHCP scope','DORA process','Reservations','DDNS','PXE'],func:['IP leasing (DORA)','Reservations','Scope options','DDNS','PXE boot'],cfg:['Scope range/exclusions','MAC reservations','Lease duration'],modes:['Dynamic vs Reservation','Failover: Load-Balance vs Hot-Standby']},
 {n:10,t:'ident',name:'Group Policy',tech:'AD centralized configuration',comp:['GPO','GPMC','SYSVOL','gpupdate','gpresult/RSoP','WMI filters'],func:['Centralized user/computer config','Scoping','Preferences vs Policies'],cfg:['LSDOU order (Local→Site→Domain→OU)','gpupdate /force'],modes:['Block Inheritance vs Enforced','Security Filtering vs WMI Filtering']},
 {n:11,t:'apps',name:'IIS',tech:'Windows web stack / HTTP.sys kernel driver',comp:['HTTP.sys','WAS','W3SVC','w3wp.exe'],func:['App pool isolation','Zero-downtime recycling','SSL/TLS hardening','5 auth flavors'],cfg:['TLS protocol toggle (SCHANNEL registry); cipher order via GPO','SNI','URL Rewrite','Recycling triggers'],modes:['Static vs Dynamic','Overlapped vs Non-overlapped recycling']},
 {n:12,t:'apps',name:'Remote Desktop Services',tech:'Multi-user app delivery / RDP over HTTPS',comp:['RD Session Host','RD Connection Broker','RD Gateway','RD Web Access','RD Licensing'],func:['RemoteApp','VPN-less external access','CAP/RAP policies','CAL tracking'],cfg:['120-day grace','443 tunneling','NPS/MFA','NLA'],modes:['Session-Based vs VDI','Per-User vs Per-Device CAL']},
 {n:13,t:'sec',name:'Certificate Services',tech:'PKI / X.509',comp:['Root CA','Issuing CA','Certificate Templates','CRL/OCSP','KRA'],func:['Chain of trust','GPO autoenrollment','Web enrollment','Revocation','Key recovery'],cfg:['Two-tier (offline Root + online Issuing)','Template perms','CDP/AIA','EKU'],modes:['Enterprise vs Standalone CA']},
 {n:14,t:'net',name:'Advanced Networking',tech:'Teaming, DNS security, IP management, remote access',comp:['NIC Teaming / SET','DNS Policies & DNSSEC','IPAM','VPN (RRAS)','RADIUS / NPS','VLAN'],func:['Bandwidth aggregation (teaming)','Site-aware DNS + DNSSEC validation','Centralized IP mgmt (IPAM)','VPN remote access','RADIUS auth (NPS)'],cfg:['Teaming modes (Switch Independent/LACP)','DNSSEC signing (RRSIG/DNSKEY/DS)','NPS policies','IPAM discovery','VLAN tagging'],modes:['NIC Teaming vs SET','VPN (RRAS) vs Always On VPN (DirectAccess = legacy)','Switch Independent vs LACP']},
 {n:15,t:'ident',name:'AD Sites & Replication',tech:'Multi-site AD topology',comp:['KCC (Knowledge Consistency Checker)','SYSVOL','RODC','DFS-R','Site links'],func:['Multi-site replication','Topology gen (KCC)','Branch RODC','SYSVOL replication'],cfg:['Sites/subnets','Site-link cost/schedule','RODC'],modes:['Intra-site vs Inter-site','Writable DC vs RODC','DFS-R vs FRS']},
 {n:16,t:'ops',name:'Backup & Recovery',tech:'Backup + disaster recovery',comp:['Volume Shadow Copy (VSS)','Windows Server Backup (WSB)','Bare Metal Recovery (BMR)','DSRM'],func:['Scheduled backup','BMR','AD recovery (DSRM)','VSS snapshots','RTO/RPO planning'],cfg:['Backup schedule','VSS','DSRM password'],modes:['Full vs Incremental','Authoritative vs Non-authoritative AD restore']},
 {n:17,t:'sec',name:'Firewall & Security',tech:'Windows Defender Firewall + hardening',comp:['Windows Firewall w/ Advanced Security','GPO policy','Connection security rules'],func:['Inbound/outbound rules (RDP/SMB/LDAP)','GPO-deployed firewall','IPsec','Hardening'],cfg:['Port rules (TCP)','GPO firewall policy','Profiles'],modes:['Domain vs Private vs Public profile','Allow vs Block','Inbound vs Outbound']},
 {n:18,t:'ops',name:'PowerShell Automation',tech:'Config-as-code / Desired State Configuration',comp:['DSC','MOF (Managed Object Format)','LCM (Local Configuration Manager)','Remoting','Scheduled tasks'],func:['DSC config-as-code','MOF compile','LCM enforcement','Remoting','Scheduled automation'],cfg:['Config→MOF','LCM refresh mode'],modes:['Push vs Pull DSC','ApplyOnly / ApplyAndMonitor / ApplyAndAutoCorrect']},
 {n:19,t:'ops',name:'Troubleshooting & Migration',tech:'Repair + role/server migration',comp:['DISM','System File Checker (SFC)','WSMT','Storage Migration Service (SMS)','ADMT','USMT','Event logs'],func:['Image repair — run DISM /RestoreHealth before SFC /scannow','Role/DC/storage migration','Log analysis','Recovery'],cfg:['DISM /RestoreHealth','SFC /scannow','Role/data migration'],modes:['In-place / Side-by-side / Swing / Cluster Rolling upgrade']}
];

let activeTrack = 'all', query = '';

// Build the track-filter pills (All + one per track).
function renderTracks() {
    const el = document.getElementById('tracks');
    let html = `<span class="tk ${activeTrack==='all'?'active':''}" data-tk="all" style="background:${activeTrack==='all'?'var(--primary)':''}">All</span>`;
    for (const [k,v] of Object.entries(TRACKS)) {
        const on = activeTrack===k;
        html += `<span class="tk ${on?'active':''}" data-tk="${k}" style="${on?`background:${v.c}`:`border-color:${v.c}55;color:${v.c}`}">${v.label}</span>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('.tk').forEach(t => t.onclick = () => { activeTrack = t.dataset.tk; renderTracks(); renderGrid(); });
}

// Does a module match the current search query (name + every field)?
function matches(m) {
    if (activeTrack !== 'all' && m.t !== activeTrack) return false;
    if (!query) return true;
    const hay = (m.name + ' ' + m.tech + ' ' + m.comp.join(' ') + ' ' + m.func.join(' ') + ' ' + m.cfg.join(' ') + ' ' + m.modes.join(' ')).toLowerCase();
    return hay.includes(query);
}

// Render the filtered module grid.
function renderGrid() {
    const list = MODULES.filter(matches);
    document.getElementById('count').textContent = `${list.length} of ${MODULES.length} modules`;
    document.getElementById('grid').innerHTML = list.map(m => {
        const tk = TRACKS[m.t];
        const chips = m.comp.slice(0,3).map(c=>`<span class="chip">${c}</span>`).join('')
                    + (m.comp.length>3?`<span class="chip more">+${m.comp.length-3}</span>`:'');
        return `<div class="card" style="--tk:${tk.c}" data-n="${m.n}">
            <div class="num">MODULE ${String(m.n).padStart(2,'0')}</div>
            <div class="nm">${m.name}</div>
            <div class="tech">${m.tech}</div>
            <div class="chips">${chips}</div>
            <div class="chips"><span class="tkbadge" style="--tk:${tk.c}">${tk.label}</span></div>
        </div>`;
    }).join('');
    document.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(+c.dataset.n));
}

// Open the full 7-field detail modal for a module.
function openDetail(n) {
    const m = MODULES.find(x=>x.n===n), tk = TRACKS[m.t];
    const ul = a => '<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    const chipRow = a => '<div class="chips">'+a.map(x=>`<span class="chip">${x}</span>`).join('')+'</div>';
    document.getElementById('modal').innerHTML = `
        <button class="close" onclick="closeDetail()">Close ✕</button>
        <div class="tkbadge" style="--tk:${tk.c}">Module ${String(m.n).padStart(2,'0')} · ${tk.label}</div>
        <h2>${m.name}</h2>
        <p class="mtech">${m.tech}</p>
        <div class="sec"><div class="lbl">Primary Components</div>${chipRow(m.comp)}</div>
        <div class="sec"><div class="lbl">Key Functions</div>${ul(m.func)}</div>
        <div class="sec"><div class="lbl">Configuration Details</div>${ul(m.cfg)}</div>
        <div class="sec modes"><div class="lbl">Comparison / Modes</div>${chipRow(m.modes)}</div>`;
    document.getElementById('overlay').classList.add('open');
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); }
// Close on backdrop click or Escape.
document.getElementById('overlay').onclick = e => { if (e.target.id==='overlay') closeDetail(); };
document.addEventListener('keydown', e => { if (e.key==='Escape') closeDetail(); });
// Live search.
document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderGrid(); });

renderTracks();
renderGrid();
</script>
    <script src="/components/ObservatoryTelemetry.js"></script>
</body>
</html>
