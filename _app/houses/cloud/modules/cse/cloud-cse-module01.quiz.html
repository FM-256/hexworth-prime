<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access Control -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>
        AccessGuard.require('sorted');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 01 Quiz: Cloud Computing & Security Fundamentals - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #1e1e1e;
            --secondary-bg: #252526;
            --card-bg: #2d2d2d;
            --border-color: #3d3d3d;
            --text-primary: #e0e0e0;
            --text-secondary: #9f9f9f;
            --cloud-orange: #F59E0B;
            --cloud-orange-dark: #D97706;
            --success-color: #3fb950;
            --error-color: #f85149;
            --info-color: #58a6ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: var(--secondary-bg);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            color: var(--cloud-orange);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .quiz-meta {
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        /* Progress */
        .progress-container {
            background: var(--secondary-bg);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 8px;
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cloud-orange), var(--success-color));
            transition: width 0.3s;
            border-radius: 4px;
        }

        /* Question Card */
        .question-card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .question-card.answered {
            opacity: 0.8;
        }

        .question-card.correct {
            border-color: var(--success-color);
        }

        .question-card.incorrect {
            border-color: var(--error-color);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .question-number {
            background: var(--cloud-orange);
            color: #000;
            min-width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .question-text {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .section-tag {
            background: var(--card-bg);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover:not(.disabled) {
            border-color: var(--cloud-orange);
            background: rgba(245, 158, 11, 0.1);
        }

        .option.selected {
            border-color: var(--cloud-orange);
            background: rgba(245, 158, 11, 0.15);
        }

        .option.correct {
            border-color: var(--success-color);
            background: rgba(63, 185, 80, 0.15);
        }

        .option.incorrect {
            border-color: var(--error-color);
            background: rgba(248, 81, 73, 0.15);
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .option-letter {
            background: var(--border-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .option.selected .option-letter {
            background: var(--cloud-orange);
            color: #000;
        }

        .option.correct .option-letter {
            background: var(--success-color);
            color: #000;
        }

        .option.incorrect .option-letter {
            background: var(--error-color);
            color: #fff;
        }

        /* Explanation */
        .explanation {
            background: rgba(88, 166, 255, 0.1);
            border-left: 4px solid var(--info-color);
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        .explanation-header {
            color: var(--info-color);
            font-weight: bold;
            margin-bottom: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin: 30px 0;
        }

        .submit-btn {
            background: var(--cloud-orange);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: var(--cloud-orange-dark);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        /* Results */
        .results-container {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            border: 1px solid var(--border-color);
            display: none;
        }

        .results-container.show {
            display: block;
        }

        .results-header {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .results-header.pass {
            color: var(--success-color);
        }

        .results-header.fail {
            color: var(--error-color);
        }

        .score-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--cloud-orange);
            margin: 20px 0;
        }

        .score-breakdown {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
        }

        .breakdown-item {
            text-align: center;
        }

        .breakdown-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .breakdown-value.correct {
            color: var(--success-color);
        }

        .breakdown-value.incorrect {
            color: var(--error-color);
        }

        .breakdown-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .result-message {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .result-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .action-btn.primary {
            background: var(--cloud-orange);
            color: #000;
        }

        .action-btn.secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* Section Performance */
        .section-performance {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }

        .section-performance h3 {
            color: var(--cloud-orange);
            margin-bottom: 15px;
            text-align: center;
        }

        .section-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-row:last-child {
            border-bottom: none;
        }

        .section-score {
            font-weight: bold;
        }

        .section-score.good {
            color: var(--success-color);
        }

        .section-score.needs-work {
            color: var(--error-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .question-header {
                flex-direction: column;
            }

            .quiz-meta {
                flex-direction: column;
                gap: 10px;
            }

            .score-breakdown {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CSE Module 01 Quiz</h1>
            <p>Cloud Computing & Security Fundamentals</p>
            <div class="quiz-meta">
                <span>📝 18 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-header">
                <span id="progressText">Question 0 of 18</span>
                <span id="answeredCount">0 Answered</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be inserted here -->
        </div>

        <div class="submit-container">
            <button class="submit-btn" id="submitBtn" onclick="submitQuiz()" disabled>
                Submit Quiz
            </button>
        </div>

        <div class="results-container" id="resultsContainer">
            <h2 class="results-header" id="resultsHeader">Quiz Complete!</h2>
            <div class="score-display" id="scoreDisplay">0%</div>

            <div class="score-breakdown">
                <div class="breakdown-item">
                    <div class="breakdown-value correct" id="correctCount">0</div>
                    <div class="breakdown-label">Correct</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-value incorrect" id="incorrectCount">0</div>
                    <div class="breakdown-label">Incorrect</div>
                </div>
            </div>

            <p class="result-message" id="resultMessage"></p>

            <div class="section-performance" id="sectionPerformance">
                <h3>Performance by Section</h3>
                <!-- Section breakdown will be inserted here -->
            </div>

            <div class="result-actions">
                <button class="action-btn secondary" onclick="reviewAnswers()">Review Answers</button>
                <button class="action-btn secondary" onclick="retakeQuiz()">Retake Quiz</button>
                <button class="action-btn secondary" onclick="window.location.href='cloud-cse-module01.presentation.html'">Review Presentation</button>
                <a href="cloud-cse-module02.presentation.html" class="action-btn primary" id="nextModuleBtn">Next Module →</a>
                <a href="../../index.html" class="action-btn secondary">← Cloud House</a>
            </div>
        </div>
    </div>

    <script>
        // Quiz Questions
        const questions = [
            // Section 1: Cloud Computing Types & Service Models
            {
                id: 1,
                section: "Service Models",
                question: "According to NIST, which of the following is NOT one of the five essential characteristics of cloud computing?",
                options: [
                    "On-demand self-service",
                    "Broad network access",
                    "Dedicated hardware",
                    "Rapid elasticity"
                ],
                correct: 2,
                explanation: "The five essential characteristics are: On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, and Measured service. Dedicated hardware is not a characteristic; cloud computing uses shared, pooled resources."
            },
            {
                id: 2,
                section: "Service Models",
                question: "Which cloud service model gives customers the MOST control over the operating system?",
                options: [
                    "SaaS (Software as a Service)",
                    "PaaS (Platform as a Service)",
                    "IaaS (Infrastructure as a Service)",
                    "FaaS (Function as a Service)"
                ],
                correct: 2,
                explanation: "IaaS provides the most control as customers manage the operating system, middleware, runtime, data, and applications. The provider only manages virtualization, servers, storage, and networking."
            },
            {
                id: 3,
                section: "Service Models",
                question: "Microsoft 365 and Google Workspace are examples of which cloud service model?",
                options: [
                    "IaaS",
                    "PaaS",
                    "SaaS",
                    "Hybrid"
                ],
                correct: 2,
                explanation: "SaaS (Software as a Service) provides complete applications over the internet. Users access the software through a web browser and only manage their data. Microsoft 365 and Google Workspace are classic SaaS examples."
            },
            {
                id: 4,
                section: "Deployment Models",
                question: "A company uses AWS for their public website but keeps patient records on their own private servers. What deployment model is this?",
                options: [
                    "Private Cloud",
                    "Public Cloud",
                    "Hybrid Cloud",
                    "Community Cloud"
                ],
                correct: 2,
                explanation: "Hybrid Cloud combines two or more distinct cloud infrastructures (private, public, or community) that remain unique entities but are bound together for data and application portability."
            },
            // Section 2: Cloud Security Challenges
            {
                id: 5,
                section: "Security Challenges",
                question: "Which challenge arises from using multiple cloud models that can lead to data 'sprawl'?",
                options: [
                    "Network latency",
                    "Data and identity governance",
                    "Hardware maintenance",
                    "Software licensing"
                ],
                correct: 1,
                explanation: "Data and identity governance becomes challenging when using private, public, and hybrid cloud models. Data can spread across multiple environments, making it difficult to track and protect."
            },
            {
                id: 6,
                section: "Security Challenges",
                question: "What is Shadow IT?",
                options: [
                    "Encrypted data storage",
                    "Unauthorized installation of applications by employees",
                    "A type of DDoS attack",
                    "Cloud backup services"
                ],
                correct: 1,
                explanation: "Shadow IT refers to the unauthorized installation of applications or use of cloud services by employees without IT department approval. This can introduce security vulnerabilities and compliance issues."
            },
            // Section 3: Shared Responsibility Model
            {
                id: 7,
                section: "Shared Responsibility",
                question: "In the shared responsibility model, which responsibility ALWAYS remains with the customer regardless of service model?",
                options: [
                    "Physical security",
                    "Operating system patching",
                    "Data governance and classification",
                    "Network infrastructure"
                ],
                correct: 2,
                explanation: "Data governance and classification is ALWAYS the customer's responsibility across all service models (IaaS, PaaS, SaaS). The customer must classify and protect their data appropriately."
            },
            {
                id: 8,
                section: "Shared Responsibility",
                question: "In a PaaS environment, who is responsible for operating system security patches?",
                options: [
                    "The customer",
                    "The cloud service provider",
                    "Shared between customer and provider",
                    "A third-party vendor"
                ],
                correct: 1,
                explanation: "In PaaS, the cloud provider is responsible for the operating system. The customer focuses on their applications and data while the provider handles OS patches, infrastructure, and platform maintenance."
            },
            // Section 4: Evaluating CSPs
            {
                id: 9,
                section: "CSP Comparison",
                question: "What is the Azure equivalent of AWS's Virtual Private Cloud (VPC)?",
                options: [
                    "Azure Resource Group",
                    "Azure Virtual Network (VNET)",
                    "Azure Active Directory",
                    "Azure Security Center"
                ],
                correct: 1,
                explanation: "Azure Virtual Network (VNET) is Azure's equivalent to AWS VPC. Both provide isolated virtual network environments for deploying cloud resources with defined IP address ranges and subnets."
            },
            {
                id: 10,
                section: "CSP Comparison",
                question: "Which AWS service is used for centralized security monitoring and threat detection?",
                options: [
                    "AWS CloudTrail",
                    "AWS GuardDuty",
                    "AWS S3",
                    "AWS Lambda"
                ],
                correct: 1,
                explanation: "AWS GuardDuty is a threat detection service that continuously monitors for malicious activity. CloudTrail is for audit logging, S3 for storage, and Lambda for serverless computing."
            },
            // Section 5: Cloud Security Benefits
            {
                id: 11,
                section: "Security Benefits",
                question: "Which security benefit of cloud computing helps organizations meet regulatory requirements?",
                options: [
                    "Measured service",
                    "Compliance tools and frameworks",
                    "Broad network access",
                    "Resource pooling"
                ],
                correct: 1,
                explanation: "Cloud providers offer built-in compliance tools and frameworks that help organizations meet regulatory requirements like GDPR, HIPAA, and PCI-DSS. These include audit logs, encryption, and compliance dashboards."
            },
            // Section 6: Threats & Attacks
            {
                id: 12,
                section: "Threats & Attacks",
                question: "According to the OWASP Cloud-Native Application Security Top 10, what is the #1 risk?",
                options: [
                    "SQL Injection",
                    "Insecure cloud, container, or orchestration configuration",
                    "Cross-site scripting (XSS)",
                    "Denial of Service"
                ],
                correct: 1,
                explanation: "OWASP ranks 'Insecure cloud, container, or orchestration configuration' as the #1 risk for cloud-native applications. Misconfiguration is the leading cause of cloud security breaches."
            },
            {
                id: 13,
                section: "Threats & Attacks",
                question: "Which attack type specifically targets employees with personalized emails that appear to come from their employer?",
                options: [
                    "Phishing",
                    "Spear phishing",
                    "Brute force",
                    "SQL injection"
                ],
                correct: 1,
                explanation: "Spear phishing is a targeted form of phishing that uses personalized emails designed to appear from a trusted source like an employer. Regular phishing uses generic mass emails."
            },
            {
                id: 14,
                section: "Threats & Attacks",
                question: "What type of attack floods services with traffic to prevent legitimate users from accessing them?",
                options: [
                    "SQL Injection",
                    "Cross-site scripting",
                    "Denial of Service (DoS)",
                    "Man-in-the-middle"
                ],
                correct: 2,
                explanation: "Denial of Service (DoS) attacks overwhelm systems with traffic, preventing legitimate users from accessing services. Cloud providers typically offer DDoS protection services to mitigate these attacks."
            },
            // Section 7: Security Design Principles
            {
                id: 15,
                section: "Design Principles",
                question: "Which CIA Triad component ensures data has not been altered from creation to access?",
                options: [
                    "Confidentiality",
                    "Integrity",
                    "Availability",
                    "Authentication"
                ],
                correct: 1,
                explanation: "Integrity ensures that data remains unaltered and trustworthy from the time it is created until it is accessed. Confidentiality protects against unauthorized access, and Availability ensures data is accessible when needed."
            },
            {
                id: 16,
                section: "Design Principles",
                question: "Which Zero Trust principle states that users should only be given the minimum access required for a specific task?",
                options: [
                    "Verify explicitly",
                    "Assume breach",
                    "Least privilege access",
                    "Defense in depth"
                ],
                correct: 2,
                explanation: "Least privilege access (also called Just-in-Time, Just Enough Access) is a core Zero Trust principle that grants only the minimum permissions needed for a specific task, for only the necessary duration."
            },
            {
                id: 17,
                section: "Design Principles",
                question: "The Zero Trust model is built on how many pillars?",
                options: [
                    "3 pillars",
                    "5 pillars",
                    "6 pillars",
                    "8 pillars"
                ],
                correct: 2,
                explanation: "Zero Trust has 6 pillars: Identity, Devices, Applications, Data, Infrastructure, and Networking. Each pillar requires verification and must be secured independently."
            },
            // Section 8: Cloud Security Architecture
            {
                id: 18,
                section: "Architecture",
                question: "What is a Secure Landing Zone in cloud architecture?",
                options: [
                    "A physical data center location",
                    "A scalable, pre-configured starting point for cloud deployment with security controls",
                    "An encryption algorithm",
                    "A type of firewall"
                ],
                correct: 1,
                explanation: "A Secure Landing Zone is a scalable and modular starting point for cloud deployment. It includes pre-configured security controls, network topology, identity management, and governance policies as repeatable templates."
            }
        ];

        // Quiz State
        const quizState = {
            answers: {},
            submitted: false
        };

        // Initialize Quiz
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
        });

        // Render Questions
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const optionLetters = ['A', 'B', 'C', 'D'];
                const questionHtml = `
                    <div class="question-card" id="question-${q.id}" data-question="${q.id}">
                        <div class="question-header">
                            <span class="question-number">${index + 1}</span>
                            <div class="question-text">
                                <span class="section-tag">${q.section}</span>
                                <p>${q.question}</p>
                            </div>
                        </div>
                        <div class="options-container">
                            ${q.options.map((opt, i) => `
                                <div class="option" data-question="${q.id}" data-option="${i}" onclick="selectOption(${q.id}, ${i})">
                                    <span class="option-letter">${optionLetters[i]}</span>
                                    <span class="option-text">${opt}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="explanation" id="explanation-${q.id}">
                            <div class="explanation-header">Explanation:</div>
                            <p>${q.explanation}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += questionHtml;
            });
        }

        // Select Option
        function selectOption(questionId, optionIndex) {
            if (quizState.submitted) return;

            const questionCard = document.getElementById(`question-${questionId}`);
            const options = questionCard.querySelectorAll('.option');

            // Deselect all options for this question
            options.forEach(opt => opt.classList.remove('selected'));

            // Select clicked option
            options[optionIndex].classList.add('selected');

            // Store answer
            quizState.answers[questionId] = optionIndex;

            // Update progress
            updateProgress();
        }

        // Update Progress
        function updateProgress() {
            const answered = Object.keys(quizState.answers).length;
            const total = questions.length;
            const percentage = (answered / total) * 100;

            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `Question ${answered} of ${total}`;
            document.getElementById('answeredCount').textContent = `${answered} Answered`;

            // Enable submit button when all questions are answered
            document.getElementById('submitBtn').disabled = answered < total;
        }

        // Submit Quiz
        function submitQuiz() {
            if (Object.keys(quizState.answers).length < questions.length) {
                alert('Please answer all questions before submitting.');
                return;
            }

            quizState.submitted = true;

            let correctCount = 0;
            const sectionScores = {};

            questions.forEach(q => {
                const questionCard = document.getElementById(`question-${q.id}`);
                const options = questionCard.querySelectorAll('.option');
                const userAnswer = quizState.answers[q.id];
                const isCorrect = userAnswer === q.correct;

                // Track section performance
                if (!sectionScores[q.section]) {
                    sectionScores[q.section] = { correct: 0, total: 0 };
                }
                sectionScores[q.section].total++;

                if (isCorrect) {
                    correctCount++;
                    sectionScores[q.section].correct++;
                    questionCard.classList.add('correct');
                    options[userAnswer].classList.add('correct');
                } else {
                    questionCard.classList.add('incorrect');
                    options[userAnswer].classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                }

                // Show explanation
                document.getElementById(`explanation-${q.id}`).classList.add('show');

                // Disable options
                options.forEach(opt => opt.classList.add('disabled'));
                questionCard.classList.add('answered');
            });

            // Calculate score
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 70;

            // Display results
            displayResults(score, correctCount, questions.length - correctCount, passed, sectionScores);

            // Save to localStorage
            saveQuizResults(score, passed);
        }

        // Display Results
        function displayResults(score, correct, incorrect, passed, sectionScores) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsHeader = document.getElementById('resultsHeader');

            document.getElementById('scoreDisplay').textContent = score + '%';
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;

            if (passed) {
                resultsHeader.textContent = '🎉 Congratulations!';
                resultsHeader.className = 'results-header pass';
                document.getElementById('resultMessage').textContent =
                    `You passed the quiz with a score of ${score}%. You have demonstrated a solid understanding of Cloud Computing & Security Fundamentals.`;
            } else {
                resultsHeader.textContent = '📚 Keep Learning!';
                resultsHeader.className = 'results-header fail';
                document.getElementById('resultMessage').textContent =
                    `You scored ${score}%, but you need 70% to pass. Review the material and try again. Focus on the sections marked as "Needs Work" below.`;
            }

            // Section performance
            const sectionPerformance = document.getElementById('sectionPerformance');
            let sectionHtml = '<h3>Performance by Section</h3>';

            for (const [section, data] of Object.entries(sectionScores)) {
                const sectionScore = Math.round((data.correct / data.total) * 100);
                const scoreClass = sectionScore >= 70 ? 'good' : 'needs-work';
                sectionHtml += `
                    <div class="section-row">
                        <span>${section}</span>
                        <span class="section-score ${scoreClass}">${data.correct}/${data.total} (${sectionScore}%)</span>
                    </div>
                `;
            }

            sectionPerformance.innerHTML = sectionHtml;
            resultsContainer.classList.add('show');

            // Show/hide next module button based on pass status
            document.getElementById('nextModuleBtn').style.display = passed ? 'inline-block' : 'none';

            // Scroll to results
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Save Quiz Results
        function saveQuizResults(score, passed) {
            try {
                const progress = JSON.parse(localStorage.getItem('hexworthProgress') || '{}');
                progress['cse-module01-quiz'] = {
                    completed: true,
                    passed: passed,
                    score: score,
                    date: new Date().toISOString()
                };
                localStorage.setItem('hexworthProgress', JSON.stringify(progress));
            } catch (e) {
                console.log('Could not save progress');
            }
        }

        // Review Answers
        function reviewAnswers() {
            document.getElementById('resultsContainer').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Retake Quiz
        function retakeQuiz() {
            quizState.answers = {};
            quizState.submitted = false;

            document.getElementById('resultsContainer').classList.remove('show');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = 'Question 0 of 18';
            document.getElementById('answeredCount').textContent = '0 Answered';
            document.getElementById('submitBtn').disabled = true;

            // Reset all question cards
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.remove('correct', 'incorrect', 'answered');
            });

            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect', 'disabled');
            });

            document.querySelectorAll('.explanation').forEach(exp => {
                exp.classList.remove('show');
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
