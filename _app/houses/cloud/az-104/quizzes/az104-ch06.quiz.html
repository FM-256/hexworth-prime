                {
                    question: 'What are the two primary data types Azure Monitor collects?',
                    options: [
                        'Files and databases',

                    explanation: 'Azure Monitor is built around two fundamental data types that serve different analysis needs. Crawl: Metrics are lightweight numeric values collected at regular intervals — CPU percentage, memory usage, disk IOPS, network bytes in/out. Each metric is a time-series: a sequence of (timestamp, value) pairs. Metrics are stored in a high-performance time-series database optimized for near-real-time alerting and dashboards. They are automatically collected from most Azure resources with no configuration required. Retention is 93 days by default. Logs are structured records with variable schema — event logs, diagnostic data, application traces, security events. Logs are stored in a Log Analytics workspace and queried using Kusto Query Language (KQL). Logs support rich filtering, aggregation, and joining across multiple data sources. Retention is configurable (30 days default, up to 730 days in the workspace, longer with archival). Walk: the distinction matters for architecture decisions. Metrics are best for "what is happening right now" — dashboards, real-time alerts, auto-scale triggers. Response latency is seconds. Logs are best for "what happened and why" — troubleshooting, security investigation, trend analysis over weeks or months. Metrics alert: CPU > 90% for 5 minutes = near-instant detection. Log alert: query finds 50 failed login attempts from the same IP in the last hour = scheduled query runs every 5 minutes. Run: for AZ-104, understand the data pipeline. Sources: Azure resources (platform metrics/logs), guest OS (via Azure Monitor Agent), applications (via Application Insights SDK), custom sources (REST API, Log Ingestion API). Collection: Azure Monitor Agent uses Data Collection Rules (DCRs) to define what to collect and where to send it. Destinations: Metrics go to the Azure Monitor metrics store. Logs go to a Log Analytics workspace. Both can also be exported to Storage Accounts (archival) or Event Hubs (streaming to SIEM, partners). Exam trigger: "near-real-time numeric values" = Metrics. "Queryable structured records" = Logs. "Both types" = Azure Monitor.'

                {
                    question: 'What language is used to query Log Analytics data?',
                    options: [
                        'SQL',

                    ],
                    explanation: 'Kusto Query Language (KQL) is the purpose-built query language for Azure Monitor Log Analytics — it is optimized for time-series and log data and uses a pipe-based syntax where the output of each operator feeds into the next. Crawl: a basic KQL query looks like this: SecurityEvent | where EventID == 4625 | summarize count() by Computer | order by count_ desc. Read it left to right: start with the SecurityEvent table, filter to rows where EventID equals 4625 (failed logon), aggregate to count per Computer, sort descending by count. The pipe operator (|) chains operations — each operator receives the result of the previous one. Core operators: where (filter rows), project (select/rename columns), summarize (aggregate), order by (sort), take/limit (return N rows), extend (add calculated columns), join (combine tables), render (visualize as chart). Walk: KQL resembles SQL in intent but differs structurally. SQL uses SELECT...FROM...WHERE...GROUP BY with keywords in a fixed position. KQL starts from the table and pipes through transformations. KQL time functions are first-class: ago(1h) returns the timestamp one hour ago. bin(TimeGenerated, 1h) rounds timestamps to the nearest hour for time-bucketed aggregations. Common time query: Perf | where TimeGenerated > ago(24h) | where CounterName == "% Processor Time" | summarize avg(CounterValue) by Computer, bin(TimeGenerated, 1h) | render timechart. Run: for AZ-104, know the essential KQL operators and the tables you will query. Key tables: AzureActivity (subscription-level operations), SecurityEvent (Windows security events), Syslog (Linux events), Perf (performance counters), AzureDiagnostics (diagnostic logs from Azure resources), Event (Windows application/system events), Heartbeat (agent connectivity). KQL functions to recognize: ago(), now(), bin(), count(), countif(), avg(), sum(), min(), max(), percentile(), tostring(), parse. Exam trigger: "query Log Analytics" = KQL. "Aggregate log data" = summarize operator in KQL. "Filter log records" = where operator in KQL.'
                },
                {
                    question: 'What is an Azure Monitor alert rule?',
                    options: [
                        'A backup policy',
                        'A condition that triggers a notification or action when a metric exceeds a threshold',
                        'A DNS record',
                        'A firewall rule'
                    ],
                    explanation: 'An Azure Monitor alert rule monitors a target resource (metric value, log query result, or activity log event) and fires an action group when the defined condition is met — enabling automated notification and response to operational events without manual monitoring. Crawl: an alert rule has four core components. Scope: the resource or resource group being monitored (a VM, a storage account, a subscription). Condition: the trigger — metric alert (e.g., CPU > 90% over a 5-minute window), log search alert (KQL query returns more than N results), or activity log alert (a specific operation occurred, such as a VM being deleted). Action group: what to do when the condition fires — send email, send SMS, call a webhook, trigger a Logic App, run an Azure Function, create an ITSM ticket, notify via Azure app push notification. Alert rule details: name, severity (0=Critical, 1=Error, 2=Warning, 3=Informational, 4=Verbose), and whether the alert is enabled. Walk: the alert lifecycle has three states. Fired: the condition is currently true — alert is active. Resolved: the condition is no longer true — alert auto-resolves (for metric alerts). Acknowledged: someone has seen and accepted the alert (manual acknowledgment). Metric alerts support two evaluation models. Static threshold: fire if CPU > 90% (fixed value). Dynamic threshold: uses machine learning to detect anomalies based on historical patterns — no need to manually set a threshold. Dynamic thresholds adapt to daily/weekly cycles (e.g., CPU is normally 80% on Monday mornings due to batch jobs — dynamic threshold won\'t alert on that). Run: for AZ-104, understand action groups and their notification types in depth. Action groups are reusable — one action group can be referenced by many alert rules. Notification types: Email/SMS/Push/Voice (basic human notification), Azure Function (call a serverless function to auto-remediate), Logic App (orchestrate complex workflows), Webhook (call any HTTP endpoint), ITSM (ServiceNow, Cherwell), Automation Runbook (run a PowerShell runbook to take corrective action, e.g., restart a VM or scale up). Alert processing rules (formerly suppression rules) let you suppress alerts during planned maintenance windows. Exam trigger: "notify when CPU is high" = metric alert rule + action group. "Auto-remediate when disk is full" = alert rule + action group with Azure Function or Automation Runbook. "Suppress alerts during maintenance" = alert processing rule.'
                },
                {
                    question: 'What is a Recovery Services vault?',
                    options: [
                        'A virtual machine type',
                        'A central repository for storing backup data and recovery configurations',
                        'A network security tool',
                        'A DNS service'
                    ],
                    explanation: 'A Recovery Services vault is an Azure management entity that serves as the central store for backup data, backup policies, recovery points, and replication configurations — supporting Azure Backup and Azure Site Recovery from a single resource. Crawl: when you back up a VM, the backup data does not go to a generic storage account — it goes to a Recovery Services vault. The vault abstracts the underlying storage from you, manages redundancy (LRS or GRS), enforces backup policies, tracks recovery points, and provides the restore interface. Each vault belongs to a specific Azure region and subscription. You can have multiple vaults per subscription. Resources that can be protected by a vault: Azure VMs (Windows and Linux), Azure SQL in a VM, Azure Files shares, Azure Blob Storage, SAP HANA databases in a VM, Azure Database for PostgreSQL (preview), on-premises machines via the Microsoft Azure Recovery Services (MARS) agent. Walk: vaults provide several critical management features beyond simple storage. Backup policies: define the schedule (frequency, time), retention rules (daily, weekly, monthly, yearly recovery points), and whether to use instant restore snapshots. Soft delete: when enabled, deleted backup data is retained for 14 additional days (configurable) before permanent deletion — protection against accidental or malicious deletion. Multi-user authorization (MUA): requires a second authorized user to approve critical operations (disabling soft delete, deleting backup data) — extra protection against ransomware scenarios. Cross-region restore (CRR): when vault is configured with GRS, allows restoring backup data from the secondary region even when the primary region is operational (for testing or real disaster recovery). Run: for AZ-104, understand vault design considerations. One vault or many: Microsoft recommends separate vaults for different workloads (VMs in one vault, SQL in another) for clean organization and independent policy management. Vault naming: globally unique within the resource group, 2-50 characters, alphanumeric and hyphens. RBAC: Backup Contributor can manage backup jobs but cannot delete vaults. Backup Operator can manage backups but cannot configure backup. Backup Reader is read-only. These are built-in roles for delegation. Exam trigger: "where is backup data stored" = Recovery Services vault. "Backup policies and recovery points" = Recovery Services vault. "Azure Site Recovery configuration" = Recovery Services vault.'
                },
                {
                    question: 'What is the difference between application-consistent and crash-consistent VM backups?',
                    options: [
                        'They are the same',
                        'Application-consistent uses VSS to flush in-memory data before snapshot; crash-consistent captures disk state only',
                        'Application-consistent is faster',
                        'Crash-consistent is more reliable'
                    ],
                    explanation: 'Application-consistent backups use the Volume Shadow Copy Service (VSS) on Windows (or pre/post scripts on Linux) to coordinate with running applications — flushing in-memory data to disk and quiescing I/O before the snapshot — while crash-consistent backups capture only the disk state at a point in time without any application coordination, equivalent to recovering from a sudden power loss. Crawl: to understand the difference, consider a SQL Server running when the backup snapshot is taken. In-memory: SQL has active transactions in its buffer pool — data that has been modified but not yet written to the data files on disk. Transaction log: SQL writes every change to the transaction log before the data file, so the log is the source of truth for committed transactions. Application-consistent (VSS): before the snapshot, Azure calls the VSS framework. SQL Server\'s VSS writer flushes all in-memory data to disk, completes pending I/O, and freezes new writes. The snapshot captures a fully consistent on-disk state. SQL can recover from this backup without any transaction log roll-forward — it is clean. Crash-consistent: the snapshot is taken without notifying any application. SQL\'s buffer pool data is not flushed. The snapshot reflects the disk at a random mid-transaction moment. On restore, SQL detects an unclean shutdown and performs crash recovery — replaying the transaction log to reach a consistent state. Most transactions recover cleanly. Some in-flight transactions may be rolled back. Walk: when does crash-consistent happen? On Linux VMs without pre/post scripts configured, the backup is crash-consistent because VSS is a Windows technology. On Windows VMs where VSS fails (VSS writer errors, VSS service issues, application not VSS-aware), the backup falls back to crash-consistent. Azure Backup logs which consistency type was used for each recovery point in the vault. For databases, application-consistent is always preferred. Run: for AZ-104, understand the Linux equivalent of VSS. Azure Backup supports pre-script and post-script execution on Linux VMs. The pre-script quiesces the application (e.g., pauses MySQL replication, flushes PostgreSQL buffers). The backup snapshot runs. The post-script resumes normal operation. Microsoft provides pre/post script frameworks for common Linux databases. Without these scripts, Linux VM backups are crash-consistent. Exam trigger: "VSS" = application-consistent. "Quiesce application before snapshot" = application-consistent. "Snapshot without application coordination" = crash-consistent. "Power loss equivalent" = crash-consistent.'
                },
                {
                    question: 'What does the Azure Monitor Agent (AMA) replace?',
                    options: [
                        'Azure Backup',
                        'The legacy Microsoft Monitoring Agent (MMA) and Azure Diagnostics Extension',
                        'Microsoft Entra ID',
                        'Azure Policy'
                    ],
                    explanation: 'The Azure Monitor Agent (AMA) is the unified, next-generation data collection agent that replaces three legacy agents — the Microsoft Monitoring Agent (MMA, also called the Log Analytics agent), the Azure Diagnostics Extension (WAD/LAD), and the Dependency Agent (for VM Insights service map) — consolidating them into a single, policy-driven agent managed through Data Collection Rules. Crawl: the legacy agent landscape was fragmented. Microsoft Monitoring Agent (MMA): sent data to Log Analytics workspaces. Required a workspace ID and key for authentication. Could not filter what data was sent — all configured counters went to all workspaces. Retirement date: August 31, 2024. Azure Diagnostics Extension (Windows: WAD, Linux: LAD): sent diagnostics data to Storage Accounts and Event Hubs. Separate from MMA with its own configuration. Dependency Agent: collected service map data for VM Insights. Azure Monitor Agent (AMA) replaces all three with a single agent. Authentication: uses Managed Identity instead of workspace keys — more secure, no credential management. Configuration: Data Collection Rules (DCRs) define what data to collect, where to send it, and any filtering/transformation. Multiple DCRs can apply to one agent. Walk: Data Collection Rules are the key concept to understand. A DCR is an Azure resource (exists in a resource group) that specifies: data sources (Windows event logs, Linux syslog, performance counters, text logs, IIS logs), destinations (one or more Log Analytics workspaces, Azure Monitor metrics store), and optional transformations (filter out noisy events before ingestion to reduce cost). You associate DCRs with VMs or VM scale sets directly, or via Azure Policy (Deploy AMA + associate DCR to all VMs in a subscription). Run: for AZ-104, understand AMA deployment methods and scope. Deployment: Azure portal (per-VM), Azure Policy (bulk deployment), ARM templates, CLI. Supported platforms: Azure VMs, Azure Arc-enabled servers (on-premises and multi-cloud), VM scale sets. Dependencies: AMA requires a Managed Identity on the VM (system-assigned or user-assigned). The DCR-to-agent association is created separately from the agent installation. Troubleshooting AMA: check that the Managed Identity is assigned, the DCR association exists, and the AMA extension shows "Provisioning succeeded" in the VM extensions blade. Exam trigger: "replace MMA" or "replace Log Analytics agent" = AMA. "Data Collection Rules" = AMA architecture. "Unified monitoring agent" = AMA.'
                },
                {
                    question: 'What are diagnostic settings used for?',
                    options: [
                        'Diagnosing VM boot failures',
                        'Routing platform logs and metrics from Azure resources to destinations like Log Analytics, Storage, or Event Hub',
                        'Creating backup policies',
                        'Managing DNS zones'
                    ],
                    explanation: 'Diagnostic settings are per-resource configurations that enable the collection and routing of a resource\'s platform logs (resource logs, activity logs, audit logs) and platform metrics to one or more destinations — Log Analytics workspace, Storage Account, Event Hub, or partner solution — without requiring an agent on the resource. Crawl: every Azure resource generates platform telemetry — it is the service itself producing logs about its own operations. A Storage Account generates logs about read/write/delete operations, authentication events, and throttling. An Azure SQL Database generates logs about queries, errors, and deadlocks. A Key Vault logs every key, secret, and certificate access. By default, this telemetry is not retained anywhere — it is ephemeral. Diagnostic settings capture and route it. Configuration: in the portal, navigate to a resource, select Diagnostic settings, and click Add diagnostic setting. Choose which log categories and metrics to enable, then select one or more destinations. Walk: the three primary destinations serve different purposes. Log Analytics workspace: enables KQL queries, alerting, dashboards, and long-term analysis. Best for operational monitoring and security investigations. Storage Account: low-cost long-term archival. Data is stored as JSON blobs in containers. Cannot be queried directly (no KQL) — useful for compliance archival and export to other systems. Event Hub: streaming to external systems — SIEM tools (Splunk, QRadar), partner monitoring platforms, custom processing pipelines. Real-time stream, not stored by Event Hub itself (storage in Event Hub is limited). Run: for AZ-104, understand diagnostic setting categories and the activity log specifically. Resource logs: operation-level logs from within the resource (formerly called diagnostic logs). Examples: StorageRead, StorageWrite, AuditEvent (Key Vault), SQLSecurityAuditEvents. AllMetrics: platform metrics sent to Log Analytics or Storage (useful when you need metrics in KQL alongside logs). Activity log: subscription-level log of control-plane operations (who created a VM, who changed an NSG, who deleted a resource group). Activity log has its own diagnostic setting at the subscription level — route it to a workspace for querying with KQL. Exam trigger: "enable resource logs" = diagnostic settings. "Route logs to Log Analytics or Storage" = diagnostic settings. "Platform telemetry not being collected" = diagnostic settings not configured.'
                },
                {
                    question: 'What is the default redundancy for a Recovery Services vault?',
                    options: [
                        'LRS',
                        'GRS',
                        'ZRS',
                        'No redundancy'
                    ],
                    explanation: 'Recovery Services vaults default to Geo-Redundant Storage (GRS) — backup data is asynchronously replicated to a secondary Azure region hundreds of miles away, providing protection against a complete primary region failure and enabling cross-region restore. Crawl: GRS replicates data synchronously three times within the primary region (same as LRS) and then asynchronously to a secondary paired region. The paired region is predetermined by Azure (East US pairs with West US, North Europe pairs with West Europe, etc.). For backup data, GRS means: if the primary region suffers a catastrophic event (natural disaster, major outage), the backup data survives in the secondary region and can be used for restore. LRS (Locally Redundant Storage) replicates data three times within a single datacenter in the primary region. Less expensive than GRS, but vulnerable to region-wide or zone-wide failures. Walk: the default is GRS because backup data exists to recover from disasters — if the disaster destroys both your production environment and your backup data, backup provides no value. However, GRS costs approximately twice as much as LRS. Organizations with relaxed RPO requirements, or where the workload is non-critical, may choose LRS to reduce backup storage cost. Critical constraint: the redundancy setting must be configured before the first backup is taken. Once backup data exists in the vault, you cannot change from GRS to LRS or vice versa — you would need to stop protection, delete all backup data, and reconfigure. This makes the initial decision important. Run: for AZ-104, understand cross-region restore (CRR) and how it relates to GRS. Cross-region restore is an opt-in feature on GRS vaults that allows you to restore backup data from the secondary region at any time — not just during a disaster. Use cases: restore a VM in the secondary region for DR testing without impacting production. Restore data to a secondary region to meet a compliance requirement that data be available in two regions. CRR adds a small additional cost. CRR is available for Azure VM backups and SQL in Azure VM. ZRS (Zone-Redundant Storage) for Recovery Services vaults is available in select regions — replicates across availability zones in the same region, protecting against zone failures without cross-region replication. Exam trigger: "default vault redundancy" = GRS. "Change redundancy after backup" = not possible, must delete all data first. "Cross-region restore" = requires GRS vault with CRR enabled.'
                },
                {
                    question: 'What restore options are available for Azure VM backup?',
                    options: [
                        'Only create a new VM',
                        'Create new VM, replace existing disks, or restore individual files',
                        'Only restore files',
                        'Only replace existing disks'
                    ],
                    explanation: 'Azure VM backup provides three distinct restore options — create a new VM from a recovery point, replace the existing VM\'s disks with backed-up versions, or mount the recovery point as a temporary drive to retrieve individual files and folders — each suited to different recovery scenarios. Crawl: Create new VM: deploys a completely new virtual machine from the recovery point. You specify a new VM name, resource group, virtual network, and subnet. The original VM is untouched. Use when: you want to validate the backup, build a test environment from a production snapshot, or restore alongside the original. Replace existing disk: the backed-up disk(s) replace the current disk(s) attached to the original VM. The VM must be stopped (deallocated) for this operation. Azure creates a restore point before replacing disks (as a safety net). Use when: the original VM exists and you want to roll it back to a previous state (e.g., after a bad software deployment). File recovery: Azure mounts the recovery point\'s VHDs to a temporary script-generated location. A download script (PowerShell for Windows, Python for Linux) attaches the recovery point as a drive on any target VM. You navigate the mounted drive and copy the specific files or folders you need. Use when: you only need a handful of files, not the entire VM. Walk: the file recovery workflow has important limitations. Mount time: the recovery point stays mounted for up to 12 hours. After 12 hours, it is automatically unmounted. File system compatibility: for Windows recovery points, you mount on a Windows machine. For Linux, on a Linux machine. Encrypted VMs: file recovery from encrypted VMs requires the encryption keys to be present in the target environment. Maximum disk size: file recovery supports disks up to 4 TB. Run: for AZ-104, understand the restore workflow decisions. Scenario: VM is corrupted after a bad Windows Update = replace existing disks (rollback the OS disk to before the update). Scenario: VM was accidentally deleted = create new VM (original no longer exists). Scenario: a developer deleted an important config file = file recovery (copy just that file from the recovery point). Scenario: you want to test whether your backup is recoverable = create new VM in a test resource group. Secondary region recovery: if the primary region is down and GRS is enabled, restore to a secondary region uses the same three options but targets the paired region. Exam trigger: "restore a deleted VM" = create new VM option. "Roll back to a previous state" = replace disk option. "Recover specific files" = file recovery option.'
                },
                {
                    question: 'What is Azure Site Recovery (ASR)?',
                    options: [
                        'A backup solution',
                        'A disaster recovery service that replicates VMs to a secondary region with automated failover',
                        'A monitoring tool',
                        'A DNS service'
                    ],
                    explanation: 'Azure Site Recovery is a Disaster Recovery as a Service (DRaaS) solution that continuously replicates virtual machines from a primary location to a secondary location — enabling orchestrated failover with minimal data loss and minimal downtime, and failback to primary once the disaster is resolved. Crawl: ASR is distinct from Azure Backup. Backup creates periodic snapshots at scheduled intervals (once per day by default). ASR performs near-continuous replication — the recovery point is typically 30 seconds to a few minutes behind primary, versus hours for backup. When a disaster strikes, ASR fails over the replicated VMs in the secondary region, bringing the workload online with minimal data loss. Recovery scenarios: Azure VM to Azure (primary region to secondary region). VMware VMs to Azure (on-premises to Azure cloud). Hyper-V VMs to Azure. Physical servers to Azure. Walk: the ASR workflow has distinct phases. Replication: ASR installs a mobility service on the source VM (Azure VM replication uses native Azure infrastructure). Changed disk blocks are continuously replicated to the recovery location using a cache storage account for staging and target managed disks in the secondary region. Failover: when a disaster occurs (or for DR testing), you initiate failover. ASR creates new VMs in the secondary region from the latest recovery point. Test failover: runs a failover into an isolated virtual network without impacting replication — allows DR testing without disrupting production. Planned failover: zero data loss failover (synchronizes before cutting over) — used for planned migrations. Failback: after the primary region recovers, you replicate changes from the secondary back to primary and fail back. Run: for AZ-104, understand RPO and RTO in the ASR context. RPO (Recovery Point Objective): how much data can you afford to lose? ASR targets RPO of 30 seconds to 1 hour depending on replication lag. This is far better than backup (which may lose 24 hours of data). RTO (Recovery Time Objective): how quickly must the workload be back online? ASR with automated recovery plans can achieve RTO of minutes to hours. Backup restores can take hours to a day. Recovery plans: ASR supports recovery plans that define the order in which VMs are brought online (database servers first, then application servers, then web tier), with optional manual actions and Azure Automation runbooks for configuration steps during failover. Replication policy: defines RPO threshold, recovery point retention (up to 24 hours of hourly recovery points, 15 minutes for app-consistent recovery points), and app-consistent snapshot frequency. Exam trigger: "continuous replication to secondary region" = ASR. "Failover and failback" = ASR. "DR testing without impacting production" = ASR test failover. "RPO of minutes" = ASR.'
                },
                {
                    question: 'What is RPO in disaster recovery?',
                    options: [
                        'Recovery Point Objective — the maximum acceptable amount of data loss measured in time',
                        'Recovery Performance Outcome',
                        'Resource Provisioning Order',
                        'Remote Power Option'
                    ],
                    explanation: 'Recovery Point Objective (RPO) is the business-defined maximum amount of data loss an organization can tolerate in a disaster, expressed as a duration of time — an RPO of 15 minutes means the recovery system must keep the secondary site no more than 15 minutes behind primary, so that at most 15 minutes of data changes are lost in a failover. Crawl: RPO answers the question: "If we fail over right now, how much data do we lose?" Specifically: the time between the last successful replication and the moment of failure is the actual data loss. RPO is the contractual ceiling on that number. RPO of 24 hours: acceptable for non-critical systems. Daily backup is sufficient. RPO of 1 hour: requires frequent backups or replication. Hourly backup jobs or continuous replication with hourly snapshots. RPO of 15 minutes: requires near-continuous replication. Azure Site Recovery typically achieves this. RPO of 0 (zero data loss): requires synchronous replication. Every write is committed to both primary and secondary before acknowledging to the application. Expensive and adds write latency. Walk: RPO drives technology selection. If the business requires RPO = 24h: Azure Backup with daily backup policy is sufficient and cost-effective. If RPO = 1h: Azure Backup with hourly backup, or ASR with 1-hour recovery points. If RPO = 5 minutes: ASR with near-continuous replication. If RPO = 0: application-level synchronous replication (SQL Always On Availability Groups with synchronous replicas, Azure Database for SQL with active geo-replication in synchronous mode). Lower RPO = higher cost and complexity. Run: for AZ-104, understand the relationship between RPO and RTO — they are independent metrics that together define the DR requirement. RTO (Recovery Time Objective): maximum acceptable downtime. How long can the system be unavailable? RPO 4h + RTO 2h means: at most 4 hours of data loss, and the system must be back online within 2 hours of declaring a disaster. A solution can have excellent RPO but poor RTO — ASR replicates continuously (great RPO) but recovery plan execution takes time (RTO determined by system complexity). Conversely, good RTO (pre-warmed instances) but poor RPO (hourly snapshots). DR design balances both metrics against cost. Exam trigger: "how much data can be lost" = RPO. "Maximum downtime" = RTO. "RPO of 15 minutes means" = at most 15 minutes of data loss.'
                },
                {
                    question: 'A company needs to be notified when any VM\'s CPU exceeds 90% for 5 minutes. What should they configure?',
                    options: [
                        'A backup policy',
                        'An Azure Monitor metric alert with a static threshold condition',
                        'A diagnostic setting',

res regional outage survival, which eliminates LRS and ZRS. Run: for AZ-104, understand the cross-region restore (CRR) feature that GRS enables. CRR allows restoring GRS vault backup data to the secondary region without waiting for a disaster. Use cases: DR drill — restore a VM in the paired region and verify the restored application works correctly, without impacting production. Compliance — some regulations require verifiable data availability in a second geography. CRR has an additional cost beyond GRS storage charges. Without CRR, GRS still protects the data — but Microsoft controls access to secondary region data during an actual declared regional disaster. With CRR, you initiate secondary region restores at any time. Exam trigger: "survive regional outage" = GRS. "Regional disaster recovery for backups" = GRS. "Cheapest option, regional failure acceptable" = LRS. "Zone failure protection only" = ZRS.'
