    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Deploy and Manage Azure Compute',
            description: 'Test your understanding of Azure VMs, availability sets, scale sets, App Service, deployment slots, and container instances',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az104-ch04-quiz',
            moduleId: 'az104-ch04-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the difference between IaaS and PaaS for compute?',
                    options: [
                        'No difference',
                        'IaaS gives you full OS control (VMs); PaaS manages the infrastructure for you (App Service)',
                        'IaaS is free; PaaS is paid',
                        'PaaS gives you more control than IaaS'
                    ],
                    explanation: 'IaaS (Infrastructure as a Service) and PaaS (Platform as a Service) represent fundamentally different levels of responsibility between you and Azure. Crawl: IaaS gives you a virtual machine — raw compute with a full operating system. You are responsible for the OS, patches, runtimes, middleware, and applications running on it. Azure manages the physical hardware, networking fabric, and hypervisor. Azure VMs are the primary IaaS compute offering. PaaS removes the OS and runtime layers from your responsibility. Azure manages the infrastructure, OS patches, and runtime environment. You deploy your application code and configuration. Azure App Service is the primary PaaS compute offering — you push code, Azure runs it. Walk: the practical implications of this distinction are significant for day-to-day operations. With IaaS (VMs), you must patch the operating system, manage security updates, configure the runtime stack, scale infrastructure manually or build scaling automation, and respond to OS-level issues. With PaaS (App Service), you deploy code via git push, ZIP deploy, or CI/CD pipeline, and Azure handles everything below the application layer. If a runtime vulnerability is discovered in Node.js, Azure patches it across all App Service instances — you do nothing. Run: for AZ-104, understand the shared responsibility model at each layer. IaaS responsibility boundary: you own OS and above. Azure owns hardware, hypervisor, networking. PaaS responsibility boundary: you own application and data. Azure owns OS, runtime, middleware, infrastructure. The tradeoff is control vs. operational overhead. IaaS: maximum control, maximum ops burden. PaaS: less control, minimal ops burden. Exam tip: questions involving patching the OS, configuring the runtime, or installing software on the server point to IaaS. Questions involving deploying application code without managing servers, auto-patching, and runtime management by Azure point to PaaS.'
                },
                {
                    question: 'What do availability sets protect against?',
                    options: [
                        'Data loss',
                        'Hardware failures and planned maintenance within a datacenter',
                        'Cross-region disasters',
                        'Network attacks'
                    ],
                    explanation: 'Availability sets distribute VMs across fault domains and update domains within a single datacenter, protecting against hardware failures on specific racks and ensuring not all VMs are rebooted simultaneously during planned maintenance. Crawl: an availability set is a logical grouping you assign VMs to at creation time. It controls placement across two types of domains. Fault domains (FDs) are physical groupings of hardware that share a common power source and network switch — think of them as separate server racks. VMs in different FDs are on separate physical infrastructure, so a rack failure takes down only those VMs on that specific rack. Update domains (UDs) are logical groupings used during planned maintenance — when Azure needs to reboot hosts for updates, it processes one UD at a time with a waiting period between them. Walk: the protection model is straightforward. If a server rack loses power (hardware fault), only the VMs on that FD are affected. VMs on other FDs in the same availability set remain running. If Azure applies a host OS update (planned maintenance), it reboots hosts in one UD at a time. With 5 update domains and 5 VMs spread across them, at most 1 VM is down at any time during maintenance. Without an availability set, Azure might place all your VMs on the same hardware, and maintenance could reboot all of them simultaneously. Run: for AZ-104, understand the SLA implications. A single VM with Premium SSD gets 99.9% SLA. Two or more VMs in an availability set get 99.95% SLA. Two or more VMs across availability zones get 99.99% SLA. Availability sets are a within-datacenter construct — they do not protect against datacenter-level failures (fire, flood, power loss to the whole building). For datacenter-level protection, use availability zones. For regional-level protection, use geo-redundancy (ASR, Traffic Manager). Exam trigger: "protect against hardware failure within a datacenter" or "prevent all VMs from rebooting during maintenance" = availability sets.'
                },
                {
                    question: 'How do availability zones differ from availability sets?',
                    options: [
                        'They are the same',
                        'Zones are physically separate datacenters within a region; sets distribute across racks in one datacenter',
                        'Zones are cheaper',
                        'Sets provide higher availability'
                    ],
                    explanation: 'Availability zones are physically separate datacenters within an Azure region — each with independent power, cooling, and networking — while availability sets distribute VMs across fault domains (separate racks) within a single datacenter. Zones provide a higher SLA and broader blast radius protection. Crawl: availability zones are distinct physical buildings within the same Azure region, connected by a high-bandwidth, low-latency network. Each zone is independent — a power outage, cooling failure, or network cut affecting one zone does not impact the others. Regions that support availability zones have a minimum of 3 zones. Deploying VMs across multiple zones means your application survives the complete loss of an entire datacenter. Availability sets are a rack-level construct inside a single datacenter. They protect against individual rack failures and stagger planned maintenance, but all FDs and UDs exist in the same building. Walk: the SLA difference reflects the broader protection scope of zones. Availability sets: 99.95% SLA (2+ VMs across FDs/UDs in one datacenter). Availability zones: 99.99% SLA (2+ VMs across separate datacenters). The higher SLA comes from the statistically lower probability that multiple physically separate datacenters fail simultaneously. Run: for AZ-104, understand when to use each. Availability sets: older deployments, regions without zone support, cost-sensitive scenarios where the zone SLA premium is not justified, dev/test environments needing maintenance protection. Availability zones: production workloads requiring the highest SLA, any region that supports zones for a critical workload, compliance requirements mandating datacenter-level redundancy. Important: you cannot use both an availability set and an availability zone for the same VM simultaneously — they are mutually exclusive placement strategies. Zone-redundant scale sets can span zones and are the recommended approach for new production VM deployments. Exam pattern: "higher SLA (99.99%)" = zones. "Protection within a single datacenter" = sets. "Separate power and cooling" = zones. "Stagger planned maintenance reboots" = sets.'
                },
                {
                    question: 'What happens when you stop a VM but do NOT deallocate it?',
                    options: [
                        'The VM is deleted',
                        'The VM stops but you continue to pay for the compute allocation',
                        'The VM is moved to another region',
                        'Nothing — stop and deallocate are the same'
                    ],
                    explanation: 'Stopping a VM (OS shutdown) without deallocating it shuts down the operating system but keeps the compute resources allocated on Azure\'s hardware — you continue paying compute charges as if the VM were running. Only deallocation releases compute and stops compute billing. Crawl: there are three distinct VM states with different billing implications. Running: VM is powered on, consuming CPU and memory. You pay full compute + storage. Stopped (not deallocated): OS is shut down but the compute allocation is held on the physical host. You pay compute + storage. Deallocated: compute resources are released back to Azure\'s pool. The VM is removed from the host. You pay only for storage (disks, associated resources). Walk: the distinction matters enormously for cost management. A team that stops 50 VMs every evening using OS shutdown commands or the portal "Stop" button (without checking "Deallocate") may believe they are saving money — but they are still paying full compute charges for 12+ hours per day. The correct approach for cost savings is to deallocate VMs when not in use. Deallocation can be done via the portal (Stop button → confirm deallocation), Azure CLI (az vm deallocate), PowerShell (Stop-AzVM), or Auto-shutdown schedules. Run: for AZ-104, understand the practical implications of deallocation beyond billing. When a VM is deallocated, its public IP address (if dynamic) is released and will be different when the VM starts again. Static public IP reservations are maintained. The VM\'s data disks are preserved — deallocation does not delete data. After deallocation, you can resize the VM to a different SKU (some resize operations require deallocation). Azure Auto-shutdown is a built-in feature that schedules daily deallocations automatically — useful for dev/test VMs. The exam trigger for this concept: "why are we still being charged after stopping VMs?" = VM was stopped but not deallocated. "How to stop compute billing?" = deallocate the VM. Storage charges always continue until the managed disks are deleted, regardless of VM power state.'
                },
                {
                    question: 'What is a Virtual Machine Scale Set?',
                    options: [
                        'A backup of a VM',
                        'A group of identical, auto-scaling VMs behind a load balancer',
                        'A VM with extra storage',
                        'A premium VM size'
                    ],
                    explanation: 'A Virtual Machine Scale Set (VMSS) is a resource that manages a group of identical, load-balanced VMs that can automatically scale out (add instances) or scale in (remove instances) based on demand metrics, eliminating the need to manually provision individual VMs as load changes. Crawl: VMSS creates and manages multiple VM instances from a single configuration — all instances share the same image, size, and configuration. A load balancer distributes incoming traffic across all healthy instances automatically. Autoscale rules define when to add or remove instances: scale out when average CPU exceeds 70%, scale in when average CPU drops below 30%, with minimum and maximum instance counts to bound costs and capacity. Walk: the operational value of VMSS is handling variable workloads without manual intervention. An e-commerce platform that experiences 10x traffic on Black Friday can scale from 5 to 50 instances automatically as load rises, then scale back to 5 when demand subsides. No one has to manually provision VMs at 2 AM. The health probe integration means instances that fail health checks are automatically removed from the load balancer pool and replaced with fresh instances. Run: for AZ-104, understand VMSS scaling modes and update policies. Scaling modes: Manual (you set instance count), Scheduled (scale to specific count at specific times), Autoscale (metric-based, reactive). Autoscale metrics: CPU percentage, network bytes, custom metrics from Azure Monitor, queue depth (for worker scenarios). Update policies: Rolling (update instances in batches, zero downtime), Automatic (update all at once), Manual (you trigger updates). Orchestration modes: Uniform (all instances identical, suitable for stateless workloads) and Flexible (mix instance types, better Availability Zone support). Zone-spanning VMSS: deploy across availability zones for 99.99% SLA. Exam trigger: "auto-scale based on CPU" or "identical VMs that scale out automatically" = VMSS.'
                },
                {
                    question: 'Which App Service plan tier supports auto-scaling?',
                    options: [
                        'Free',
                        'Shared',
                        'Basic',
                        'Standard and above'
                    ],
                    explanation: 'Auto-scaling in Azure App Service requires the Standard tier (S1) or higher — Free, Shared, and Basic tiers are designed for development and testing and do not include auto-scaling capabilities. Crawl: App Service plans define the compute resources, features, and price point for your web applications. The tiers are: Free (F1): shared infrastructure, no custom domains, no SSL, 60 CPU minutes/day — suitable for learning and demos. Shared (D1): shared infrastructure, custom domains, no SSL — minimal step above Free. Basic (B1/B2/B3): dedicated infrastructure, custom domains, SSL, manual scaling only (you set a fixed instance count). Standard (S1/S2/S3): dedicated infrastructure, custom domains, SSL, auto-scaling, deployment slots (5 slots), Traffic Manager integration, daily backups. Premium (P1v3/P2v3/P3v3): same as Standard with more powerful hardware, more deployment slots (20), enhanced networking features (VNet integration). Walk: the feature jump from Basic to Standard is significant for production workloads. Basic supports manual scaling — you set instance count to 1, 2, or 3 and it stays there until you change it. Standard adds auto-scale rules: scale out when CPU > 70% for 10 minutes, scale in when CPU < 30% for 20 minutes. Standard also adds deployment slots, which are critical for zero-downtime deployments. Run: for AZ-104, memorize the tier feature matrix for common exam scenarios. "Auto-scale" = Standard minimum. "Deployment slots (swap staging to production)" = Standard minimum. "Custom domain" = Basic minimum. "SSL certificate" = Basic minimum. "VNet Integration (outbound)" = Premium or Standard with VNet Integration add-on. "Isolated network with App Service Environment" = Isolated tier. "Dev/test on shared infrastructure" = Free or Shared. "Dedicated instance, no auto-scale, just manual scaling" = Basic. The exam often presents a scenario where a team is on Basic and complains that auto-scale does not work — the fix is to upgrade to Standard.'
                },
                {
                    question: 'What is a deployment slot in App Service?',
                    options: [
                        'A storage location for deployment packages',
                        'A separate environment (staging) that can be swapped with production for zero-downtime deployments',
                        'A backup of the app',
                        'A DNS record'
                    ],
                    explanation: 'A deployment slot is a live, fully functional instance of your App Service app with its own hostname, configuration, and deployment — the swap operation atomically redirects traffic from staging to production (and vice versa), enabling zero-downtime deployments and instant rollback. Crawl: each slot is a complete running instance of the application: it has its own URL (myapp-staging.azurewebsites.net), its own app settings, connection strings, and deployment source. The production slot is the main app URL. When you swap, Azure performs a warm swap: it first warms up the staging slot by sending requests to it, waits until it responds, then swaps the routing — zero requests are dropped and there is no restart visible to users. Walk: the deployment workflow with slots: deploy new code to staging, run smoke tests against the staging URL, confirm the deployment is good, execute the swap. Traffic moves instantly to the new code. If a bug is found in production, swap back — the old version is still running in the staging slot, ready to become production again in seconds. Slot-sticky settings are configuration values that do not swap — connection strings for production databases, for example, stay in the production slot regardless of which code version is there. Walk settings that do swap with the code, sticky settings that stay with the slot. Run: for AZ-104, understand slot counts by tier and the auto-swap feature. Standard: 5 deployment slots. Premium: 20 deployment slots. Auto-swap: configure a slot to automatically swap into production when a deployment completes — fully automated zero-downtime CD pipeline. Swap with preview: a two-phase swap where you can preview the production slot with staging settings before completing the swap. Clone slot: create a new slot as a copy of an existing slot for A/B testing or multi-stage pipelines. Exam trigger: "zero-downtime deployment," "instant rollback," "staging environment," or "swap staging to production" = deployment slots. Always requires Standard tier or above.'
                },
                {
                    question: 'What is Azure Container Instances (ACI) best suited for?',
                    options: [
                        'Large-scale container orchestration',
                        'Simple, fast-startup containers for batch jobs, event-driven tasks, and dev/test',
                        'Long-running production workloads',
                        'Database hosting'
                    ],
                    explanation: 'ACI is Azure\'s serverless container offering optimized for simple, isolated containers that need to start fast and run briefly — ideal for batch processing, event-triggered tasks, CI/CD pipeline steps, and development/testing, where the overhead of managing a Kubernetes cluster is not justified. Crawl: ACI launches containers in seconds with no infrastructure to provision or manage. You define the container image, CPU/memory requirements, and environment variables, and ACI runs the container directly. Billing is per-second based on the exact vCPU and memory consumed while the container runs — there is no idle cost when the container is stopped. Containers run in isolation with their own networking and storage. ACI supports both Linux and Windows containers. Walk: the use case fit for ACI versus AKS is the key distinction. ACI: you have a container that needs to run a nightly data processing job, render a video on demand, run automated tests in a CI pipeline, or handle a webhook event. The container runs, does its work, and stops. ACI is perfect — fast startup, per-second billing, no cluster. AKS: you have a microservices application with 10 services, inter-service communication, health monitoring, rolling updates, and persistent traffic. AKS provides the orchestration layer (Kubernetes) that manages all of it. Run: for AZ-104, understand ACI use cases and integration patterns. Burst capacity: use ACI as a burst destination for AKS when the cluster is at capacity — AKS Virtual Nodes integration allows pods to run on ACI during traffic spikes. Event-driven: Azure Logic Apps and Azure Functions can trigger ACI container groups for on-demand processing. Container groups: ACI supports multi-container groups (sidecar pattern) where containers share network and storage. Persistent storage: ACI can mount Azure Files shares for data that persists beyond the container lifetime. Exam pattern: "fast startup, no cluster management, per-second billing" = ACI. "Orchestrated microservices, Kubernetes" = AKS. "Long-running production containers with full orchestration" = AKS. "Simple scheduled or event-triggered containers" = ACI.'
                },
                {
                    question: 'What does the Custom Script Extension do?',
                    options: [
                        'Extends the VM\'s storage',
                        'Runs scripts on a VM after deployment for configuration and software installation',
                        'Changes the VM\'s size',
                        'Enables remote desktop'
                    ],
                    explanation: 'The Custom Script Extension downloads and executes scripts (Bash for Linux, PowerShell for Windows) on a VM after provisioning — enabling automated post-deployment configuration such as installing software packages, configuring settings, joining domains, and applying compliance baselines. Crawl: the Custom Script Extension is a VM extension — a lightweight agent that runs as part of the Azure VM agent framework already installed on Azure VMs. You provide a script URI (Azure Blob Storage, GitHub, or any HTTPS endpoint) and the command to execute it. Azure downloads the script to the VM and runs it under the system account. Execution output (stdout and stderr) is captured and viewable in the Azure portal or CLI. Walk: the practical application for Custom Script Extension covers the gap between "VM is provisioned and running" and "VM is fully configured and ready." Provisioning gives you a bare OS. Custom Script Extension handles the configuration: installing IIS or nginx, deploying application artifacts, running configuration management tools (Chef, Puppet bootstrap), configuring Windows features, setting firewall rules, registering the VM with a monitoring agent. In ARM templates and Bicep, the extension is defined as a child resource of the VM — it runs automatically as part of the deployment. Run: for AZ-104, understand the Custom Script Extension lifecycle and alternatives. Extension execution: runs once at deployment by default. To run again, you must update the extension configuration (change the script or command). For ongoing configuration management, use Azure Automation State Configuration (DSC) or Azure Policy Guest Configuration instead. Linux: script runs as root. Windows: script runs as LocalSystem. Timeout: 90 minutes. Script size limit: 256 KB inline, no limit for URI-referenced scripts. Alternatives: cloud-init for Linux VMs (runs at OS first boot before the Azure agent starts, used for base configuration). Run Command (az vm run-command invoke) for ad-hoc script execution without deploying an extension. VM Applications for deploying packaged software. Exam trigger: "configure a VM after deployment," "install software automatically after provisioning," or "run a script on a VM at deployment time" = Custom Script Extension.'
                },
                {
                    question: 'What is the difference between ACI and AKS?',
                    options: [
                        'They are the same',
                        'ACI runs individual containers quickly; AKS manages orchestrated multi-container applications with Kubernetes',
                        'ACI is for Windows only; AKS is for Linux only',
                        'ACI requires more management than AKS'
                    ],
                    explanation: 'ACI (Azure Container Instances) is a serverless, single-container-group service for fast, simple container execution with no infrastructure management, while AKS (Azure Kubernetes Service) is a fully managed Kubernetes cluster for complex, multi-container applications requiring orchestration, scaling, service discovery, and production reliability. Crawl: ACI abstracts all infrastructure — you submit a container definition and ACI runs it. No nodes to manage, no cluster to configure, no Kubernetes knowledge required. Billed per second of execution. Best for isolated, short-lived workloads. AKS provides a managed Kubernetes control plane (free) and worker node pools (you pay for the VMs). You deploy pods, services, deployments, ingress controllers, and all Kubernetes constructs. AKS handles control plane upgrades, etcd backups, and API server availability. Worker nodes are your VMs and you manage their OS updates and scaling. Walk: the complexity curve matches the use case. ACI requires understanding container images, resource requests, and environment variables — that is the entire operational surface. AKS requires understanding Kubernetes concepts: pods, deployments, replica sets, services (ClusterIP, LoadBalancer, NodePort), ingress, namespaces, ConfigMaps, Secrets, PersistentVolumeClaims, RBAC, NetworkPolicies, Helm charts, and more. ACI is a quick on-ramp. AKS is production infrastructure. Run: for AZ-104, understand the integration between ACI and AKS. Virtual Nodes: an AKS cluster can be configured to burst workloads to ACI when cluster capacity is exhausted — pods scheduled on virtual nodes run on ACI transparently. This gives you the orchestration of AKS with the elastic capacity of ACI. The exam scenario: "run 1000 batch containers for 5 minutes each day" = ACI. "Deploy a microservices application with 8 services, health checks, rolling updates, and a load balancer" = AKS. "Prototype a container locally and test in Azure quickly" = ACI. "Production-grade container orchestration with autoscaling and blue-green deployments" = AKS. ACI requires no Kubernetes knowledge. AKS requires significant Kubernetes expertise.'
                },
                {
                    question: 'Which VM size series is optimized for compute-intensive workloads?',
                    options: [
                        'B-series (burstable)',
                        'D-series (general purpose)',
                        'F-series (compute optimized)',
                        'E-series (memory optimized)'
                    ],
                    explanation: 'The F-series is Azure\'s compute-optimized VM family — it has the highest CPU-to-memory ratio of any Azure VM series, making it ideal for workloads that need maximum compute throughput per dollar: batch processing, gaming servers, web servers under high CPU load, and scientific computing. Crawl: Azure VM size families are organized by their CPU-to-memory ratio optimization. Each serves different workload profiles. B-series (Burstable): uses CPU credits, suitable for workloads with variable CPU usage that periodically need bursts (dev/test VMs, small databases, build servers). Accumulates credits during low usage, spends credits during bursts. D-series (General Purpose): balanced CPU-to-memory ratio, suitable for most production workloads: web servers, app servers, relational databases, development and test environments. F-series (Compute Optimized): highest CPU-to-memory ratio. Same CPUs as D-series but half the memory at the same price, making them cheaper per vCPU for CPU-bound workloads. E-series (Memory Optimized): high memory-to-CPU ratio, suitable for in-memory databases (SAP HANA, Redis), big data analytics, large relational database servers. Walk: choosing the right series requires understanding your workload\'s bottleneck. CPU-bound (video encoding, rendering, batch processing, game servers): F-series. Memory-bound (in-memory caching, large SQL Server instances, SAP): E-series. I/O-bound (databases needing fast disk): L-series (storage optimized) or Premium SSD with D-series. GPU workloads (AI/ML training, 3D visualization): N-series. Run: for AZ-104, memorize the series-to-use-case mapping for common exam scenarios. F-series: compute optimized, high CPU-to-memory, batch, gaming, web servers. D-series: general purpose, balanced, most web apps and databases. E-series: memory optimized, in-memory workloads, SAP, large databases. B-series: burstable, low-cost dev/test, credit-based CPU. L-series: storage optimized, high disk throughput and IOPS, Cassandra, Elasticsearch. N-series: GPU, deep learning training, graphics rendering. M-series: ultra-high memory (up to 12 TB RAM), largest SAP HANA workloads. Exam tip: the word "compute-intensive" or "high CPU-to-memory" = F-series. "Variable workload that occasionally needs more CPU" = B-series.'
                },
                {
                    question: 'How many fault domains can an availability set have?',
                    options: [
                        '1',
                        'Up to 2 or 3 (depending on region)',
                        'Unlimited',
                        'Exactly 5'
                    ],
                    explanation: 'The maximum number of fault domains in an availability set is 2 or 3 depending on the Azure region — most regions support 3 fault domains, while some support only 2. Each fault domain represents a separate physical rack with independent power and networking. Crawl: when you create an availability set, you configure the fault domain count (default 3, minimum 1, maximum 2 or 3 by region) and the update domain count (default 5, configurable up to 20). VMs assigned to the availability set are distributed as evenly as possible across fault domains. With 3 FDs and 6 VMs, you get 2 VMs per FD. If one rack fails (one FD), 2 VMs go down and 4 remain. Walk: the fault domain count is fixed at availability set creation — you cannot change it afterward. The count you choose should match the criticality of the workload. 3 FDs: maximum hardware failure protection within the datacenter. 2 FDs: still provides rack redundancy, acceptable for less critical workloads or in regions with a 2-FD maximum. 1 FD: effectively no rack-level protection — all VMs could be on the same physical rack. Not recommended for production. Run: for AZ-104, understand how fault domains and update domains work together. Update domains (UDs) are logical, not physical. Azure applies maintenance to one UD at a time, waiting between rounds. Default is 5 UDs; maximum is 20. With 5 UDs and 5 VMs, at most 1 VM is rebooted at a time during planned maintenance. The combination of FDs + UDs provides two types of protection simultaneously: FDs protect against unplanned hardware failures (rack power loss), UDs protect against service disruption during planned maintenance (host OS updates). A VM is placed on one FD and one UD — if UD 2 is being maintained, only the VMs in UD 2 are affected, and if those VMs also happen to be on different FDs, even a rack failure during maintenance only takes down a subset of them. Exam tip: "how many fault domains" = 2 or 3 depending on region. "How many update domains" = default 5, max 20. "What protects against rack power failure" = fault domains. "What staggers maintenance reboots" = update domains.'
                },
                {
                    question: 'A company needs to deploy a web application with zero-downtime updates and automatic scaling. Which service should they use?',
                    options: [
                        'Azure VM with manual updates',
                        'Azure App Service with Standard plan + deployment slots',
                        'Azure Container Instances',
                        'Azure Blob Storage'
                    ],
                    explanation: 'Azure App Service with the Standard plan provides both zero-downtime deployments (via deployment slots with swap) and automatic scaling (via auto-scale rules) in a single fully managed PaaS service — the exact combination this scenario requires. Crawl: the two requirements drive the solution: zero-downtime updates and automatic scaling. Zero-downtime updates: App Service deployment slots allow you to deploy to a staging slot, warm it up, test it, then swap staging to production in one atomic operation. No requests are dropped during the swap. Standard plan includes 5 deployment slots. Automatic scaling: Standard plan enables autoscale rules — add instances when CPU exceeds a threshold, remove instances when CPU drops. Walk: evaluating the alternatives reveals why each fails this scenario. Azure VM with manual updates: every update requires connecting to the VM, deploying new code, and restarting the application — there is downtime and no automation. Manual scaling means you provision instances ahead of time. Azure Container Instances: ACI is designed for short-lived containers, not persistent web applications. It does not support deployment slots or horizontal auto-scaling of a single application. Azure Blob Storage: Blob Storage serves static files (images, documents, static HTML). It cannot host a dynamic web application with server-side logic. Run: for AZ-104, understand the App Service feature requirements for each scenario. Scenario: zero-downtime deployment + auto-scale = Standard plan (minimum). Scenario: zero-downtime deployment only = Standard plan (slots). Scenario: custom domain + SSL only = Basic plan (minimum). Scenario: isolated network, dedicated hardware = App Service Environment (Isolated tier). Scenario: global load balancing across multiple App Service deployments = Traffic Manager or Front Door in front of App Service. The exam will frequently describe a scenario with two requirements (like this one) and ask which tier or service satisfies both — read carefully to ensure the answer satisfies all stated requirements, not just one. Standard is the minimum for the combination of auto-scale + slots.'
                },
                {
                    question: 'What is the Azure Kubernetes Service control plane?',
                    options: [
                        'The worker nodes that run containers',
                        'The management layer (API server, scheduler, etcd) that Azure manages for free',
                        'A load balancer',

ration (CNI plugin choice), storage class configuration. Cost model: control plane is free, worker nodes are billed as standard VMs. System node pool minimum 1 node is required for AKS cluster operation. Exam trigger: "who manages the AKS control plane" = Azure, at no cost. "What do you pay for in AKS" = worker node VMs.'
