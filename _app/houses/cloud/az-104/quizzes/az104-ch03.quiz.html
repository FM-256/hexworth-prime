    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Implement and Manage Storage',
            description: 'Test your understanding of Azure storage accounts, blob storage, access tiers, SAS tokens, redundancy, and storage security',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az104-ch03-quiz',
            moduleId: 'az104-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which storage account type is recommended for most scenarios?',
                    options: [
                        'BlobStorage',
                        'General-purpose v1',
                        'General-purpose v2',
                        'Premium FileStorage'
                    ],
                    explanation: 'General-purpose v2 (GPv2) is the recommended account type for virtually all Azure storage workloads because it supports every storage service and every access tier from a single account. Crawl: GPv2 accounts support all four Azure storage services — Blob, File, Table, and Queue — and all three blob access tiers (Hot, Cool, and Archive). GPv1 is the legacy account type that predates access tiers and lacks some newer features. BlobStorage accounts are a legacy type that only support blob storage and cannot be used for files, tables, or queues. Premium FileStorage and Premium BlockBlobStorage are specialized account types for high-performance scenarios requiring SSD-backed storage — not the default recommendation. Walk: the practical implication is that when you create a new storage account for general use, GPv2 is always the correct answer unless you have a specific performance requirement driving you to a Premium tier. GPv2 accounts can be created in Standard (HDD-backed) or Premium performance tiers. Standard GPv2 is the workhorse for most enterprise storage: backups, logs, application data, file shares, and queues all live here efficiently. GPv1 accounts can be upgraded to GPv2 in-place (one-way, non-reversible) without service interruption or data migration. Run: for AZ-104, understand the account type decision tree. Starting point: always GPv2 Standard unless something specific demands otherwise. Premium BlockBlobStorage: needed when you require consistent single-digit millisecond latency for blob operations — high-frequency transaction workloads, IoT telemetry ingestion. Premium FileStorage: needed when Azure Files shares require sub-millisecond file operation latency — SQL Server FCI, SAP HANA, virtual desktop infrastructure. Premium PageBlobStorage: needed for unmanaged virtual hard disks (legacy scenario; managed disks are preferred). The BlobStorage and General-purpose v1 account types are effectively deprecated for new deployments — Microsoft no longer recommends creating them. Exam tip: if a question asks which account type supports all storage services and all access tiers, the answer is always GPv2.'
                },
                {
                    question: 'What is the difference between the Hot and Cool blob access tiers?',
                    options: [
                        'Hot is faster to read; Cool is encrypted',
                        'Hot has higher storage costs but lower access costs; Cool has lower storage costs but higher access costs',
                        'Hot and Cool are identical',
                        'Cool is only for archive'
                    ],
                    explanation: 'Hot and Cool tiers represent a classic cost trade-off: Hot optimizes for frequent access with low per-operation costs and higher storage costs per GB, while Cool optimizes for infrequent access with lower storage costs but higher per-read costs and a minimum retention period. Crawl: Hot tier is for data that is accessed frequently. Storage cost per GB is higher than Cool, but read and write transaction costs are lower. Cool tier is for data accessed infrequently — think monthly billing statements, compliance archives accessed quarterly, or backup data you hope to never need. Storage cost per GB is significantly lower than Hot, but read operations and retrieval costs are higher. Cool has a 30-day minimum retention period: if you delete or move a blob before 30 days, you pay an early deletion penalty for the remaining days. Walk: the economic logic drives blob lifecycle management. When data is first created and actively used, it lives in Hot. As it ages and access frequency drops, a lifecycle management policy automatically transitions it to Cool after a defined period (e.g., move to Cool after 30 days of no access). Further aging moves it to Cold (90-day minimum) or Archive (180-day minimum). Azure handles the transitions automatically based on rules you define — no manual intervention required. The tiers can be set at the account level (default for new blobs) or overridden at the individual blob level. Run: for AZ-104, understand the full tier spectrum in order of increasing storage cost efficiency and decreasing access speed: Hot (frequent) > Cool (infrequent, 30-day minimum) > Cold (rare, 90-day minimum) > Archive (offline, 180-day minimum, hours to rehydrate). Blob lifecycle management policies are the exam-tested mechanism for automating tier transitions — you define rules like "transition to Cool if not accessed for 30 days, to Archive if not accessed for 180 days, delete after 365 days." This is the cost optimization pattern for Azure blob storage at scale.'
                },
                {
                    question: 'What does LRS (Locally Redundant Storage) provide?',
                    options: [
                        '6 copies across 2 regions',
                        '3 copies within a single datacenter',
                        '3 copies across 3 availability zones',
                        '1 copy with no redundancy'
                    ],
                    explanation: 'LRS creates 3 synchronous copies of your data within a single physical datacenter — protecting against drive and rack failures but offering no protection if the datacenter itself is destroyed. Crawl: when you write data to a storage account with LRS redundancy, Azure synchronously replicates the write to 3 storage nodes in the same datacenter before acknowledging success to the client. All 3 copies are in the same physical building, on the same power and cooling infrastructure, in the same network. LRS provides 11 nines of durability (99.999999999%) for objects over a year — meaning data loss from hardware failure is extremely unlikely. Walk: the critical limitation of LRS is its blast radius: a datacenter-level failure — fire, flooding, power loss without backup, or catastrophic hardware failure affecting the facility — could destroy all 3 copies simultaneously. Microsoft guarantees they will work to recover data, but there is no failover to another location. This makes LRS appropriate only for data that can be reconstructed from another source (caches, transient data, dev/test environments) or data where the cost of geo-redundancy outweighs the risk. Run: for AZ-104, understand all five redundancy options and their protection scope. LRS: 3 copies, 1 datacenter — cheapest, no datacenter protection. ZRS: 3 copies across 3 availability zones in 1 region — survives datacenter failure, not regional failure. GRS: 6 copies (3 primary + 3 secondary region, LRS each side) — regional disaster protection, secondary not readable until failover. RA-GRS: same as GRS with secondary readable at all times — highest read availability. GZRS and RA-GZRS: ZRS on primary side plus geo-replication — highest overall durability. The exam scenario pattern: "cheapest option" = LRS. "Survives datacenter failure without cross-region" = ZRS. "Read secondary without waiting for failover" = RA-GRS. "Maximum durability" = RA-GZRS.'
                },
                {
                    question: 'Which redundancy option provides read access to data in a secondary region during an outage?',
                    options: [
                        'LRS',
                        'ZRS',
                        'GRS',
                        'RA-GRS'
                    ],
                    explanation: 'RA-GRS (Read-Access Geo-Redundant Storage) is the only standard redundancy option that provides a readable secondary endpoint in a different Azure region before a failover is triggered — making data available for reads even during a primary region outage. Crawl: RA-GRS maintains 6 copies of your data: 3 copies in the primary region (using LRS within that region) and 3 copies in a paired secondary region (also LRS). The secondary endpoint URL is always available for reads — formatted as <accountname>-secondary.blob.core.windows.net. Applications can be configured to read from the secondary when the primary is degraded, providing continuous read availability. Walk: the key distinction between GRS and RA-GRS is secondary readability. GRS also has 6 copies across 2 regions, but the secondary endpoint is not readable under normal conditions — it only becomes accessible after Microsoft initiates a failover, which can take hours. RA-GRS gives you the secondary read endpoint immediately, with no waiting for Microsoft to declare an outage and execute a failover. The trade-off: RA-GRS costs more than GRS. The secondary data may be slightly stale — Azure replicates asynchronously to the secondary, and the Last Sync Time property tells you how current the secondary copy is. Run: for AZ-104, understand the read availability matrix. LRS/ZRS/GRS: data is only readable from the primary endpoint. RA-GRS: data readable from both primary and secondary at all times. GZRS: ZRS in primary region + LRS in secondary, secondary not readable (like GRS). RA-GZRS: ZRS in primary + readable secondary (like RA-GRS but with zone redundancy on the primary side). The exam scenario: "application must continue read operations even if the primary Azure region goes down" = RA-GRS or RA-GZRS. "Must replicate to secondary region but no secondary read required" = GRS or GZRS. Applications using RA-GRS should implement the Circuit Breaker pattern: read from primary normally, detect primary unavailability, switch reads to the secondary endpoint, then switch back once primary recovers. This is the exam-tested architecture for high-availability blob applications.'
                },
                {
                    question: 'What is the most secure type of SAS token?',
                    options: [
                        'Account SAS',
                        'Service SAS',
                        'User delegation SAS',
                        'Container SAS'
                    ],
                    explanation: 'User delegation SAS is the most secure SAS type because it is signed using Microsoft Entra ID credentials rather than the storage account key — this means you can revoke it by revoking the Entra ID credential or the delegation key, without touching your storage account keys. Crawl: a Shared Access Signature (SAS) is a URI that grants time-limited, scoped access to specific storage resources. There are three types. Account SAS: signed with the storage account key, grants access to services (blob, file, queue, table) and resource types (service, container, object) at the account level — broadest scope, most risk if compromised. Service SAS: signed with the storage account key, grants access to a specific storage service (blob only, queue only, etc.) at the object or container level — narrower scope than Account SAS. User delegation SAS: signed with an Entra ID user or service principal credential via the delegationKey API — not signed with the account key at all. Walk: the security advantage of user delegation SAS is key independence. With Account SAS or Service SAS, the token is signed with the storage account key. If the SAS token is compromised and you want to invalidate it, your only option is to rotate the storage account key — which invalidates every SAS and application using that key, causing disruption. With user delegation SAS, revocation is targeted: invalidate the specific Entra ID credential or the delegation key used to sign it. No key rotation required, no blast radius beyond the compromised token. Run: for AZ-104, understand the revocation model for each SAS type. Account SAS and Service SAS: to revoke, rotate the account key (nuclear option) or use a Stored Access Policy (which allows targeted revocation). User delegation SAS: to revoke, revoke the Entra ID user delegation key (az storage account revoke-delegation-keys) or the credential used to generate it. User delegation SAS also requires the caller to have RBAC permissions on the storage account — you cannot generate one unless you have Storage Blob Data Contributor or similar. This dual-gating (Entra ID credential + RBAC) makes it the most enterprise-appropriate SAS type. Exam tip: "most secure" or "best practice for SAS" = user delegation SAS. "Signed with account key" = Account SAS or Service SAS. "Can be revoked without rotating keys" = user delegation SAS or SAS with Stored Access Policy.'
                },
                {
                    question: 'What is the Archive blob access tier used for?',
                    options: [
                        'Frequently accessed data',
                        'Data accessed every few days',
                        'Long-term retention with rare access (offline storage)',
                        'Real-time streaming data'
                    ],
                    explanation: 'Archive tier is Azure\'s offline cold storage for data that must be retained for compliance or legal reasons but is almost never accessed — it offers the lowest storage cost per GB of any tier, but data is not immediately readable and must be rehydrated before access. Crawl: when a blob is moved to Archive tier, Azure physically moves it to offline storage. The blob cannot be read, downloaded, or copied directly from Archive. To access the data, you must first rehydrate it — either by changing its tier to Hot or Cool (in-place rehydration) or by copying it to a new blob in a readable tier. Rehydration can take up to 15 hours for standard priority, or faster (under 1 hour) for high priority at additional cost. Archive has a 180-day minimum retention period with early deletion penalties. Walk: the use cases for Archive are regulatory and legal: financial records required by law for 7 years, healthcare records required under HIPAA, compliance data that auditors might request but almost never do. The economics make it compelling: Archive storage costs as little as $0.001 per GB per month compared to $0.018 for Hot in some regions. For a company with 100 TB of compliance data that will be accessed once every 3 years, Archive tier generates enormous cost savings. Run: for AZ-104, memorize the tier retention minimums and offline status. Hot: no minimum, immediately accessible. Cool: 30-day minimum, immediately accessible. Cold: 90-day minimum, immediately accessible. Archive: 180-day minimum, OFFLINE (must rehydrate). The offline status is the critical differentiator for Archive — it is the only tier where the data is not immediately accessible. Rehydration priority options: Standard (up to 15 hours, lower cost) and High (under 1 hour, higher cost). The Archive tier is not available for ZRS, GZRS, or RA-GZRS accounts — only for LRS and GRS redundancy. Lifecycle management policies are the primary mechanism for automatically tiering aged data into Archive.'
                },
                {
                    question: 'How do you restrict a storage account to specific IP addresses?',
                    options: [
                        'Azure Policy',
                        'Storage account firewall (network rules)',
                        'RBAC',
                        'SAS tokens'
                    ],
                    explanation: 'The storage account firewall (network rules) is the correct mechanism for restricting storage access to specific IP addresses or virtual networks — it operates at the network layer, independently of identity and authorization controls. Crawl: every Azure storage account has a network rules configuration accessible under the Networking blade. By default, all networks are allowed. To restrict access, you change the default action to Deny (block all traffic) and then create allow rules for specific IPv4 addresses, IPv4 CIDR ranges, or Azure virtual network subnets. When the firewall is active, only traffic from explicitly allowed sources can reach the storage account endpoints. Walk: understanding why the other options do not solve the problem is important for AZ-104 reasoning. Azure Policy controls resource configuration and compliance — it can enforce that storage accounts must have the firewall enabled, but it does not directly filter traffic. RBAC controls who can manage and access the storage account based on identity — a user with RBAC permissions can still be blocked by the firewall if they are connecting from a non-allowed IP. SAS tokens control access to specific resources within the storage account but operate at the authorization layer after the network layer — a valid SAS token from a blocked IP is still rejected by the firewall. Run: for AZ-104, understand the layered security model for storage accounts. Layer 1 — Network: firewall rules (allowed IPs, allowed VNets, private endpoints). Layer 2 — Identity: Entra ID authentication + RBAC (Storage Blob Data Reader, Storage Blob Data Contributor, etc.). Layer 3 — Authorization: SAS tokens, Stored Access Policies. All three layers work independently and stack: traffic must pass the network layer before identity is evaluated, and identity must pass before authorization is checked. A complete secure storage implementation uses all three: private endpoint or firewall for network isolation, managed identity + RBAC for application access, SAS tokens or user delegation SAS for client access where needed. Exam pattern: "restrict to specific IPs" = storage firewall. "Restrict who can manage the account" = RBAC. "Restrict what resources a token can access" = SAS. "Enforce that all storage accounts have HTTPS enabled" = Azure Policy.'
                },
                {
                    question: 'What is Azure File Sync used for?',
                    options: [
                        'Syncing blobs between regions',
                        'Synchronizing on-premises file servers with Azure Files for hybrid access',
                        'Backing up Azure VMs',
                        'Replicating databases'
                    ],
                    explanation: 'Azure File Sync extends Azure Files to on-premises Windows Server environments, enabling hybrid file sharing where on-premises servers cache the most frequently accessed files locally while the full file share lives in Azure — combining the performance of local storage with the durability and accessibility of the cloud. Crawl: Azure File Sync consists of three components. A Storage Sync Service resource in Azure. A sync group that defines the relationship between the Azure file share (cloud endpoint) and one or more Windows Server locations (server endpoints). The Azure File Sync agent installed on each Windows Server, which handles the bidirectional synchronization. Once configured, changes made on-premises sync to Azure, and changes in Azure sync down to every registered server endpoint. Walk: the cloud tiering feature is what makes File Sync compelling beyond simple backup. Cloud tiering allows the on-premises server to keep only frequently accessed files locally while tiering rarely accessed files to Azure Files — they appear as placeholder files on disk (with a cloud icon and zero local size) but are accessible on demand. When a user opens a tiered file, File Sync automatically recalls it from Azure in the background. The policy is configurable: maintain X% free space on the volume, or only cache files accessed within the last N days. Run: for AZ-104, understand the architectural use cases and topology constraints. Multi-site file sharing: File Sync enables branch offices to share files through Azure as the hub, with each branch running a server endpoint connected to the same sync group. Disaster recovery: if an on-premises server fails, stand up a new server, install the agent, connect to the sync group, and files are available immediately (tiered, recalled on demand). Cloud migration: use File Sync to pre-populate Azure Files over time, then cut over when ready. Topology: a single sync group can have one cloud endpoint (the Azure file share) and up to 100 server endpoints. The file share and the Storage Sync Service must be in the same Azure region. Server endpoints can be on physical servers, VMs, or Azure VMs. Exam trigger: "hybrid file server," "on-premises to Azure file sync," "cloud tiering," or "extend Windows Server file shares to Azure" all point to Azure File Sync.'
                },
                {
                    question: 'What protocols can Azure Files use?',
                    options: [
                        'HTTP only',
                        'SMB and NFS',
                        'FTP only',
                        'SFTP only'
                    ],
                    explanation: 'Azure Files supports SMB (Server Message Block) for Windows and cross-platform file sharing, and NFS (Network File System) for Linux-native workloads — making it usable across the full range of enterprise operating systems and applications. Crawl: SMB support in Azure Files covers SMB 2.1, 3.0, and 3.1.1. SMB 3.0 introduced encryption in transit, which Azure requires when connecting over the public internet (SMB with encryption or HTTPS is enforced by default on storage accounts). Azure Files SMB shares can be mounted on Windows (net use or persistent drive mapping), Linux (mount.cifs), and macOS (mount_smbfs). Active Directory integration is supported — you can Kerberos-authenticate to Azure Files SMB shares using on-premises AD DS or Microsoft Entra Domain Services, enabling identity-based access with ACLs. Walk: NFS support in Azure Files is for Linux-native scenarios where applications expect POSIX semantics (Unix-style file permissions, hard links, symlinks) rather than Windows ACL semantics. NFS Azure Files shares require a Premium storage account and must be accessed from within an Azure virtual network — NFS is not supported over the public internet without a private endpoint or VNet service endpoint. NFS shares support NFSv4.1 and are designed for high-performance Linux workloads: media rendering farms, content repositories, software development environments. Run: for AZ-104, understand the protocol-to-use-case mapping. SMB: Windows file shares, enterprise file servers, Azure File Sync, profiles and home directories, any workload currently using UNC paths (\\\\server\\share). NFS: Linux workloads, POSIX applications, media/entertainment pipelines, any workload that uses mount points with Unix permissions. Azure Files also supports SFTP (SSH File Transfer Protocol) for blob storage access as a separate feature (not traditional file shares) — but this is not the primary protocol for Azure Files shares. Azure Queue Storage uses HTTP/HTTPS only. The exam will test whether you know that HTTP alone is not a supported file protocol for Azure Files.'
                },
                {
                    question: 'What does setting a blob container\'s access level to "Blob" allow?',
                    options: [
                        'Full public access to the container',
                        'Anonymous read access to individual blobs only (not container listing)',
                        'No access at all',
                        'Write access for anonymous users'
                    ],
                    explanation: 'The "Blob" public access level allows unauthenticated users to read individual blobs by their direct URL, but they cannot list the contents of the container — they must already know the full blob URL to access anything. Crawl: Azure blob containers have three public access levels. Private (default): no anonymous access. All requests require authentication. Blob: anonymous users can read individual blobs if they know the URL, but cannot enumerate (list) the container contents. Container: anonymous users can read individual blobs AND list all blobs in the container — full public read access. The access level is set on the container, not individual blobs. Walk: the distinction between Blob and Container access matters for security design. Blob access is appropriate for a public CDN scenario where you know the blob URLs in advance (e.g., website assets, public images) and you want to serve them without authentication, but you do not want users to be able to discover what other blobs exist in the container. Container access is appropriate when you explicitly want the container to be fully browsable and all contents publicly listed — rare in production, common in demos. Run: for AZ-104, understand the anonymous access security model and how it has changed. Microsoft has progressively tightened anonymous access defaults. Storage accounts now have an "Allow Blob anonymous access" setting at the account level that must be enabled before any container-level public access setting takes effect — this is a killswitch that overrides individual container settings. By default, new storage accounts created via Azure Policy enforcement or organizational standards may have anonymous access disabled at the account level. Exam tip: if a question says "users can read blobs without signing in but cannot see what else is in the container" = Blob access level. "Users can browse and list all blobs in the container without signing in" = Container access level. "All blob access requires authentication" = Private (default). Write access is never available anonymously regardless of access level — anonymous access is always read-only.'
                },
                {
                    question: 'What is the minimum retention period for the Cool access tier?',
                    options: [
                        'No minimum',
                        '30 days',
                        '90 days',
                        '180 days'
                    ],
                    explanation: 'The Cool access tier has a 30-day minimum retention period — if a blob is deleted or moved to a different tier before 30 days have elapsed, you are charged an early deletion fee for the remaining days. Crawl: Azure storage tiers below Hot have minimum retention periods that enforce a minimum billable window. This exists because the tiers are priced on the assumption that data will remain there for at least the minimum period — the lower storage cost is offset by the penalty if data does not stay long enough. Cool: 30 days minimum. Cold: 90 days minimum. Archive: 180 days minimum. Hot: no minimum — you can write and immediately delete data in Hot tier with no penalty. Walk: the early deletion charge calculation: if you move a 100 GB blob to Cool on day 1 and delete it on day 10, you pay for 20 days of Cool storage (the remaining 20 days of the 30-day minimum). The penalty is prorated at the Cool storage rate for the remaining days. This is important for lifecycle management policy design: if you configure a policy to move blobs to Cool after 30 days of no access and then delete after 35 days, blobs in Cool will only stay there 5 days before deletion — triggering 25 days of early deletion charges. You need to ensure blobs stay in each tier at least as long as the minimum before the next transition. Run: for AZ-104, memorize this sequence: Hot = no minimum. Cool = 30 days. Cold = 90 days. Archive = 180 days. This directly maps to the exam question "what is the minimum retention for [tier]?" The early deletion penalty is also a tested concept — understand that it is charged when the blob is removed before the minimum, not when it is created. Lifecycle management policies must be designed to respect these minimums to avoid unexpected charges. A well-designed policy transitions to Cool after day 30, to Cold after day 90+, and to Archive after day 180+, then deletes after whatever the retention requirement is — ensuring each tier minimum is naturally satisfied.'
                },
                {
                    question: 'What tool is best for large-scale bulk data transfers to Azure Storage?',
                    options: [
                        'Azure Portal',
                        'Azure Storage Explorer',
                        'AzCopy',
                        'PowerShell only'
                    ],
                    explanation: 'AzCopy is a command-line utility specifically engineered for high-performance, large-scale data transfers to and from Azure Storage — it supports parallel transfers, resumable operations, and direct storage-to-storage copies without routing data through a local machine. Crawl: AzCopy is a standalone executable (no installation required) that supports upload, download, and copy operations across Azure Blob Storage, Azure Files, and Azure Data Lake Storage Gen2. It authenticates using Entra ID (OAuth 2.0), SAS tokens, or storage account keys. The azcopy copy command accepts source and destination as URLs or local paths, and transfers data using parallel chunks for maximum throughput. Walk: the performance characteristics that make AzCopy the right tool at scale. Parallel chunking: large blobs are split into chunks and transferred simultaneously across multiple connections. Resume on failure: if a transfer is interrupted, azcopy jobs resume continues from where it stopped using a job log file. Benchmarking: azcopy bench tests the upload speed from your environment to Azure. Storage-to-storage copies: azcopy copy between two Azure storage account URLs transfers data directly on the Azure backend without downloading and re-uploading through your machine — dramatically faster for TB-scale migrations. Run: for AZ-104, understand the right tool for each scenario. Azure Portal: suitable for individual file uploads, exploring containers, setting properties on a handful of blobs. Azure Storage Explorer: GUI tool for browsing and managing storage accounts, uploading/downloading small sets of files, managing permissions — not built for bulk operations. AzCopy: bulk uploads/downloads, cross-account migrations, CI/CD pipeline data staging, TB-scale transfers. PowerShell (Az.Storage module): scripted operations, automation, integration with larger PowerShell workflows — functional but not optimized for raw transfer throughput compared to AzCopy. Azure Data Box / Data Box Heavy: for PB-scale migrations where internet bandwidth is the bottleneck and physical disk shipment is more efficient than network transfer. Exam pattern: "fastest way to transfer large amounts of data" or "bulk migration to Azure Storage" = AzCopy. "Physical appliance for offline petabyte migration" = Azure Data Box.'
                },
                {
                    question: 'What is a Stored Access Policy?',
                    options: [
                        'A type of VM policy',
                        'A named policy on a container that controls SAS token permissions and can be revoked',
                        'A firewall rule',
                        'An RBAC role'
                    ],
                    explanation: 'A Stored Access Policy is a server-side policy defined on a blob container, file share, table, or queue that groups SAS token permissions and expiry into a named, modifiable, revocable entity — enabling you to invalidate all SAS tokens associated with that policy in a single operation. Crawl: when you create a SAS token, you can optionally reference a Stored Access Policy by name. Instead of hard-coding the permissions and expiry into the SAS token URI, the token defers to the policy for those parameters. The policy is defined on the container and stored server-side. If you need to revoke all SAS tokens linked to a policy (because one was compromised, or access should be revoked), you delete the policy — all tokens referencing it immediately become invalid, regardless of their stated expiry. Walk: without Stored Access Policies, the only way to revoke a compromised Account SAS or Service SAS is to rotate the storage account key that signed it. Rotating the account key invalidates every SAS signed with that key — not just the compromised one — and breaks every application using those tokens. This is a broad, disruptive operation. Stored Access Policies provide targeted revocation: create one policy per application or use case, associate SAS tokens with specific policies, and revoke only the affected policy when needed. Run: for AZ-104, understand the practical implementation of Stored Access Policies. A container can have up to 5 stored access policies. To create one, use the portal (container > Manage access policies), Azure CLI (az storage container policy create), or ARM templates. SAS tokens that reference a policy look similar to standalone SAS tokens but include a signed identifier (si parameter in the URI) that maps to the policy name. Stored Access Policies can be modified after creation — you can extend or shorten the expiry of all associated tokens by updating the policy, without issuing new SAS tokens to clients. Exam pattern: "revoke SAS tokens without rotating keys" = Stored Access Policy. "Most secure SAS" = user delegation SAS. "Revoke all SAS tokens for the account" = rotate account key. "SAS for specific Entra ID users" = user delegation SAS.'
                },
                {
                    question: 'What does encryption at rest mean for Azure Storage?',
                    options: [
                        'Data is encrypted only during transfer',
                        'All data stored on disk is automatically encrypted using 256-bit AES',
                        'Encryption must be manually enabled',
                        'Only blob data is encrypted'
                    ],
