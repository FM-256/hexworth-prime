    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Prerequisites for Azure Administrators',
            description: 'Test your understanding of Azure Resource Manager, ARM templates, Cloud Shell, Azure CLI, and PowerShell',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az104-ch01-quiz',
            moduleId: 'az104-ch01-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is Azure Resource Manager (ARM)?',
                    options: [
                        'A virtual machine type',
                        'The deployment and management layer that processes all Azure requests',
                        'A storage service',
                        'A monitoring tool'
                    ],
                    explanation: 'ARM is the control plane that sits between every Azure client and the underlying services. Crawl: every request you make — whether through the portal, Azure CLI, PowerShell, or an SDK — goes through ARM first. ARM authenticates the request, checks authorization via RBAC, and routes it to the correct resource provider. Walk: this unified entry point is what makes ARM powerful. Before ARM, each Azure service had its own management API with different authentication schemes and inconsistent behavior. ARM standardized everything: one authentication model, one RBAC system, one tagging system, one deployment unit (the resource group). Run: ARM\'s role as the control plane means that features like resource locks, tags, policies, and role assignments work consistently across all resource types. When you lock a resource against deletion, ARM enforces that lock regardless of whether the delete request came from the portal, CLI, or an automated script. ARM also enables the template model — because all deployments go through ARM, you can describe infrastructure declaratively and ARM handles the execution order and idempotency.'
                },
                {
                    question: 'What is a resource group in Azure?',
                    options: [
                        'A billing account',
                        'A logical container for related Azure resources',
                        'A virtual network',
                        'A security policy'
                    ],
                    explanation: 'Resource groups are the fundamental organizational unit in Azure — every resource must belong to exactly one resource group. Crawl: a resource group is a logical container you create in a specific Azure region. Resources inside can be in different regions than the group itself — the group\'s region only determines where the group\'s metadata is stored. Walk: the key rule is that resources belong to exactly one resource group at a time, though they can be moved. Deleting a resource group is a cascading operation — every resource inside is permanently deleted with a single command. This makes RGs useful for lifecycle management: a dev environment gets its own RG so you can tear down everything with one delete. Run: best practice is to group resources that share the same lifecycle — things you deploy together, manage together, and delete together. A web application might have one RG containing its App Service, database, storage account, and Key Vault. Separating by environment (dev, staging, prod) into different RGs gives you clean cost tracking, separate RBAC assignments, and safe teardown without touching production. Tags on the RG can be inherited by resources inside using Azure Policy.'
                },
                {
                    question: 'What does "declarative syntax" mean in ARM templates?',
                    options: [
                        'You write step-by-step deployment instructions',
                        'You describe the desired end state and Azure figures out how to get there',
                        'You write Python code',
                        'You use drag-and-drop'
                    ],
                    explanation: 'Declarative syntax means you define WHAT you want, not HOW to build it — ARM handles the execution logic. Crawl: in a declarative template, you write "I want a storage account named mystorage in East US with LRS redundancy." You do not write the sequence of API calls to create it. Walk: the contrast is imperative programming — a Bash script that calls az storage account create, checks for errors, retries if it fails, and so on. Declarative templates are shorter, easier to read, and easier to audit because they describe intent rather than procedure. Run: ARM\'s declarative model enables idempotency. Because you describe the desired end state, ARM can compare the template against the current state of your environment and only make the changes necessary to reach that state. If the storage account already exists with the right settings, ARM does nothing. If it exists but with the wrong SKU, ARM updates it. If it does not exist, ARM creates it. This compare-and-reconcile behavior is what makes templates safe to re-run and useful as the source of truth for your infrastructure configuration.'
                },
                {
                    question: 'What does "idempotent" mean for ARM template deployments?',
                    options: [
                        'Each deployment creates duplicate resources',
                        'Deploying the same template multiple times produces the same result',
                        'Templates can only be deployed once',
                        'Templates delete resources after deployment'
                    ],
                    explanation: 'Idempotency means running the same operation multiple times produces the same outcome — no duplicates, no errors on re-runs. Crawl: if you deploy an ARM template that defines a storage account, running the deployment a second time does not create a second storage account — it verifies the existing one matches the template and does nothing if it already does. Walk: this property is essential for automated pipelines. A CI/CD system might deploy your template on every merge to main. Without idempotency, you would need to check whether resources already exist before every deployment. With idempotency, the template is the check — ARM compares desired state (template) against actual state (Azure) and reconciles the difference. Run: ARM achieves idempotency through its deployment modes. In Incremental mode (default), ARM adds or updates resources defined in the template but does not delete resources that exist in the environment but are absent from the template. In Complete mode, ARM deletes resources not in the template — making the environment exactly match the template. Complete mode is more strict but riskier. Both modes are idempotent for the resources they manage. Understanding deployment mode is important for AZ-104 because choosing the wrong mode can accidentally delete production resources.'
                },
                {
                    question: 'Which section of an ARM template defines user-provided values at deployment time?',
                    options: [
                        'variables',
                        'resources',
                        'parameters',
                        'outputs'
                    ],
                    explanation: 'Parameters are the inputs to an ARM template — values the deployer provides at runtime to customize the deployment. Crawl: a parameters section defines what information the user must or can supply when they run the deployment. Common parameters are environment name, location, resource name prefix, and SKU tier. Walk: each parameter has a type (string, int, bool, array, object, secureString), an optional defaultValue, and an optional allowedValues list that restricts inputs. The difference between parameters and variables matters: parameters come from the user at deployment time; variables are computed internally by the template. A variable might concatenate a parameter value with a suffix to create a unique resource name. Run: best practice is to parameterize anything that changes between environments — names, SKUs, and capacity settings. Hard-code anything that is constant and should not be changed — like the type of a resource (Microsoft.Storage/storageAccounts). Outputs are the third category: values the template returns after deployment completes, like a storage endpoint URL or a VM\'s public IP address, which downstream scripts or pipelines can consume.'
                },
                {
                    question: 'What is Azure Cloud Shell?',
                    options: [
                        'A local terminal application',
                        'A browser-based command-line environment with pre-installed Azure tools',
                        'A virtual machine image',
                        'A code editor'
                    ],
                    explanation: 'Cloud Shell is a fully managed, browser-accessible terminal that requires zero local installation and persists your files across sessions. Crawl: navigate to shell.azure.com or click the Cloud Shell button in the Azure portal and you get a terminal with Azure CLI, Azure PowerShell, common scripting tools (git, vim, nano, jq, curl), and authenticated with your Azure identity automatically. Walk: because Cloud Shell is authenticated via your portal session, there is no az login or Connect-AzAccount step — you are already logged in. Files you create in Cloud Shell persist in an Azure Storage account (a fileshare mounted at ~/clouddrive) so your scripts and configurations survive browser closes and session timeouts. Run: Cloud Shell supports both Bash and PowerShell environments, switchable from the toolbar. It runs on a Microsoft-managed container — you get a fresh shell environment each session but your home directory persists. This makes Cloud Shell ideal for: quick administrative tasks without setting up a local environment, running scripts on lab machines or shared workstations where you cannot install tools, and following documentation examples that assume a pre-configured Azure environment. The trade-off is that Cloud Shell has a 20-minute inactivity timeout and cannot access private network resources unless configured with VNet injection.'
                },
                {
                    question: 'Which Azure CLI command creates a resource group?',
                    options: [
                        'az group new',
                        'az group create --name <name> --location <loc>',
                        'az create-group',
                        'New-AzResourceGroup'
                    ],
                    explanation: 'az group create with --name and --location flags is the correct Azure CLI syntax for creating a resource group. Crawl: the command structure is az group create --name MyRG --location eastus. Both flags are required — you must name the group and specify the region where its metadata will be stored. Walk: az group new does not exist — CLI verbs are consistent: create, list, show, update, delete. az create-group inverts the noun-verb order, which is not how Azure CLI works. New-AzResourceGroup is the correct PowerShell cmdlet but it is not Azure CLI. Run: the location flag accepts region names like eastus, westeurope, or southeastasia. You can get the full list with az account list-locations --output table. For the AZ-104 exam, memorize the pattern: az <noun group> <verb> --<required-flags>. Common resource group commands are az group create, az group list, az group show --name <name>, az group delete --name <name> --yes, and az group export --name <name> to export a template from an existing resource group. The --yes flag on delete skips the confirmation prompt — useful in scripts but dangerous if run accidentally in production.'
                },
                {
                    question: 'What is the correct structure of Azure CLI commands?',
                    options: [
                        'az <verb> <noun>',
                        'az <group> <command> --<flags>',
                        '<command> -az -<flags>',
                        'az -<command> <group>'
                    ],
                    explanation: 'Azure CLI follows the pattern az <resource group> <action> --<flags>, where the resource group is the noun and the action is the verb. Crawl: every Azure CLI command starts with az, followed by the resource type (vm, storage account, network vnet, group), followed by the action (create, list, show, update, delete), followed by any required or optional flags. Walk: examples that illustrate the pattern: az vm create --resource-group MyRG --name MyVM --image UbuntuLTS, az storage account list --resource-group MyRG, az network vnet show --name MyVNet --resource-group MyRG. Notice the noun (vm, storage account, network vnet) always comes before the verb (create, list, show). This is the opposite of PowerShell, which uses Verb-Noun (Get-AzVM, New-AzStorageAccount). Run: Azure CLI also supports sub-groups for resources with complex hierarchies. For example: az network vnet subnet create nests under az network vnet. The az interactive mode (az interactive) launches an autocomplete shell that helps learn the command structure. For the AZ-104 exam, understanding the structure helps you reconstruct commands you have not memorized — if you know you need to list virtual network peerings, the command will be az network vnet peering list with appropriate resource group and vnet name flags.'
                },
                {
                    question: 'What is Bicep?',
                    options: [
                        'A monitoring tool',
                        'A simplified language for ARM templates that compiles to JSON',
                        'A database service',
                        'A networking protocol'
                    ],
                    explanation: 'Bicep is a domain-specific language (DSL) for Azure infrastructure as code that is human-readable and compiles to standard ARM JSON before deployment. Crawl: instead of writing verbose ARM JSON with all its nesting, you write cleaner Bicep syntax. The Bicep compiler converts it to ARM JSON, which ARM then deploys. Walk: Bicep advantages over raw ARM JSON include shorter syntax (a resource that takes 30 lines of JSON might take 10 lines of Bicep), type safety (the compiler catches errors before deployment), modules (split large templates into reusable files), and cleaner parameter and variable declarations without the verbose JSON type annotations. Here is the conceptual difference: ARM JSON requires "type": "string" on every parameter; Bicep uses param location string = \'eastus\'. Run: Bicep is the recommended approach for new ARM template work. The az bicep build command compiles Bicep to JSON. The az bicep decompile command converts existing ARM JSON to Bicep — useful for migrating legacy templates. Bicep files use the .bicep extension and are deployed with az deployment group create --template-file main.bicep just like ARM JSON files. Everything Bicep produces is valid ARM JSON, so all ARM features (deployment modes, what-if, linked templates) work identically. For AZ-104, understand that Bicep and ARM JSON are interchangeable at the ARM layer — Bicep is purely an authoring improvement, not a different deployment system.'
                },
                {
                    question: 'What happens when you delete a resource group?',
                    options: [
                        'Only the group metadata is deleted',
                        'All resources within the group are also deleted',
                        'Resources are moved to a default group',
                        'Nothing — groups cannot be deleted'
                    ],
                    explanation: 'Deleting a resource group is a cascading, permanent operation — every resource inside the group is deleted along with the group itself. Crawl: az group delete --name MyRG --yes removes the resource group and every VM, storage account, database, and network resource inside it. There is no recycle bin. Walk: this behavior is by design — resource groups model lifecycle. If you group resources correctly (everything in the RG shares the same lifecycle), then deleting the RG at end-of-life is convenient and clean. The danger is misuse: if you put a shared network in the same RG as an application and delete that RG to clean up the app, you also delete the network. Run: before deleting a resource group in production, best practices are: (1) use az group show --name <name> to confirm you have the right group, (2) use az resource list --resource-group <name> to enumerate everything inside, (3) check for resource locks with az lock list --resource-group <name> — a delete lock will prevent the operation, (4) consider exporting a template first with az group export as a recovery option. Resource locks at the RG level propagate to all resources inside — a CanNotDelete lock on the RG prevents accidental deletion. This is a critical AZ-104 concept: always understand what is inside an RG before deleting it.'
                },
                {
                    question: 'Which PowerShell cmdlet lists all resource groups?',
                    options: [
                        'az group list',
                        'Get-AzResourceGroup',
                        'List-AzGroup',
                        'Show-AzResourceGroups'
                    ],
                    explanation: 'Get-AzResourceGroup is the correct PowerShell cmdlet — it follows the standard Verb-Noun pattern used by all Az module cmdlets. Crawl: running Get-AzResourceGroup with no parameters returns all resource groups in the current subscription. Adding -Name <name> filters to a specific group. Walk: PowerShell Verb-Noun pattern: approved verbs are Get (retrieve), New (create), Remove (delete), Set (modify), Update (partial update). Az module cmdlets follow this strictly. List-AzGroup does not exist because List is not an approved PowerShell verb — Get is the correct retrieval verb. Show-AzResourceGroups does not exist for the same reason. az group list is Azure CLI, not PowerShell. Run: the parallel between CLI and PowerShell is worth memorizing. az group list → Get-AzResourceGroup. az group create → New-AzResourceGroup. az group delete → Remove-AzResourceGroup. Both environments accomplish the same tasks through different syntax. When scripting in PowerShell, you work with objects rather than text — Get-AzResourceGroup returns ResourceGroup objects with properties like ResourceGroupName, Location, ProvisioningState, and Tags, which you can pipe to Where-Object for filtering or Select-Object for projection. This object pipeline model is more powerful than CLI text output for complex automation, though CLI output can be parsed as JSON with the --output json flag and piped through tools like jq.'
                },
                {
                    question: 'What is the purpose of the "outputs" section in an ARM template?',
                    options: [
                        'To define input parameters',
                        'To return values after deployment (e.g., endpoints, connection strings)',
                        'To specify resource dependencies',
                        'To set environment variables'
                    ],
                    explanation: 'Outputs return values from a completed deployment — they are the template\'s way of surfacing information that only exists after resources are created. Crawl: after an ARM template deploys a storage account, the outputs section can return the storage account\'s blob endpoint URL, which was not known until the account was created. Walk: outputs are referenced using the reference() function combined with the resource\'s properties. For example, a storage account output might be reference(storageAccountName).primaryEndpoints.blob — the URL assigned by Azure during creation that you could not know in advance. Run: outputs are consumed in several ways. In Azure DevOps or GitHub Actions pipelines, az deployment group show can extract output values and pass them to subsequent pipeline steps. In linked or nested templates, an inner template\'s outputs can be consumed by the outer template as inputs to subsequent resources. Common outputs include: storage endpoints and connection strings, VM public IP addresses, App Service hostnames, database server FQDNs, and Key Vault URIs. For AZ-104, understand the distinction clearly: parameters flow IN to the template from the user; variables are computed INSIDE the template; outputs flow OUT of the template to consumers. The outputs section does not affect what gets deployed — it only surfaces information about what was deployed.'
                },
                {
                    question: 'In an ARM template, what does the "resources" section define?',
                    options: [
                        'The Azure subscription to use',
                        'The actual Azure resources to create or update',
                        'The deployment location',
                        'The template version'
                    ],
                    explanation: 'The resources section is the core of every ARM template — it is an array of resource definitions that ARM will create, update, or verify during deployment. Crawl: each item in the resources array describes one Azure resource with its type, API version, name, location, and properties. Walk: every resource definition requires at minimum: type (e.g., Microsoft.Storage/storageAccounts), apiVersion (e.g., 2023-01-01), name (the resource name, often referencing a parameter), and location. Additional properties are resource-specific — a storage account needs a sku object and kind property; a virtual network needs an addressSpace. Run: the resources array supports dependencies via the dependsOn property. If a VM depends on a network interface, and the network interface depends on a virtual network, you chain dependsOn to ensure ARM creates them in the right order. ARM also infers implicit dependencies when you use the reference() function — if resource B\'s properties reference resource A, ARM knows to create A first. The resources section also supports copy loops for creating multiple instances of a resource with different names or configurations — essential for deploying N identical VMs without duplicating the resource definition N times. Understanding the resources section structure is fundamental to reading, writing, and troubleshooting ARM templates for the AZ-104 exam.'
                },
                {
                    question: 'What are Azure tags used for?',
                    options: [
                        'Encrypting resources',
                        'Organizing and categorizing resources with key-value metadata',
                        'Deleting resources',
                        'Creating backups'
                    ],
                    explanation: 'Tags are key-value metadata pairs you attach to Azure resources and resource groups to enable organization, cost tracking, policy enforcement, and automation. Crawl: a tag is simply a name-value pair like Environment=Production or CostCenter=Finance. You can apply up to 50 tags per resource. Walk: tags serve multiple operational purposes. For cost management: tag every resource with a CostCenter tag, then use Azure Cost Management to filter and aggregate spending by cost center — essential for chargebacks and budget reporting. For organization: tag by environment (dev/staging/prod), team (networking, security, appdev), or project to filter resources in the portal across subscriptions and regions. For policy: Azure Policy can enforce required tags (every resource must have a CostCenter tag) or inherit tags from the resource group automatically. Run: tags are not inherited by default — a tag on a resource group does not appear on resources inside unless you configure Azure Policy to enforce inheritance. Tags do not affect Azure functionality or security — they are purely metadata. One important AZ-104 distinction: tags are different from resource group membership. A resource belongs to exactly one resource group (structural), but can have any number of tags (metadata). You filter resources by tag across multiple resource groups and subscriptions using az resource list --tag Environment=Production or in the portal\'s resource filter. This cross-group, cross-subscription filtering is something resource groups alone cannot provide.'
                },
                {
                    question: 'A company needs to ensure all Azure deployments follow the same configuration. Which approach is best?',
                    options: [
                        'Deploy manually through the portal each time',
                        'Use ARM templates or Bicep for infrastructure as code',
                        'Email instructions to each administrator',
                        'Use screenshots of the portal'
                    ],
                    explanation: 'Infrastructure as code (IaC) with ARM templates or Bicep is the only approach that provides consistency, repeatability, version control, and auditability at scale. Crawl: you write the infrastructure definition once as a template, store it in source control, and every deployment runs from the same file. The environment is always identical to what the template describes. Walk: manual portal deployments fail consistency at every step — different administrators make different choices, options change between visits, steps are missed under pressure. There is no audit trail of what was configured. Email instructions and screenshots compound the problem — they go stale, get misread, and cannot be enforced. IaC eliminates these failure modes: the template is the single source of truth, git history shows every change with author and timestamp, and code review enforces standards before templates reach production. Run: the organizational pattern for IaC maturity is: (1) write templates, (2) store in git with branching strategy, (3) add to CI/CD pipeline so every merge triggers a deployment, (4) use what-if deployments (az deployment group what-if) to preview changes before applying, (5) enforce template compliance with Azure Policy. For AZ-104, IaC is not just a best practice answer — it directly enables features like deployment history (every ARM deployment is logged in the resource group\'s deployment history), rollback (redeploy a previous template version), and disaster recovery (recreate an entire environment from templates in minutes).'
                }
            ]
        });
        quiz.start();
    </script>
