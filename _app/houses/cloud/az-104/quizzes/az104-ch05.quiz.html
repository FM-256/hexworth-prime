    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: Configure and Manage Virtual Networks',
            description: 'Test your understanding of VNets, subnets, NSGs, VNet peering, routing, DNS, load balancers, and Application Gateway',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az104-ch05-quiz',
            moduleId: 'az104-ch05-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is an Azure Virtual Network (VNet)?',
                    options: [
                        'A public internet connection',
                        'A private, isolated network in Azure where you deploy resources',
                        'A DNS service',
                        'A monitoring tool'
                    ],
                    explanation: 'A VNet is Azure\'s foundational networking construct — a private, software-defined network that isolates your resources from other Azure customers and from the public internet by default. Crawl: when you create a VNet, you define an address space using CIDR notation (for example, 10.0.0.0/16). That address space is subdivided into subnets, each with its own CIDR range carved from the parent space. Resources deployed into a VNet — VMs, App Service Environments, AKS nodes, Azure SQL Managed Instances — receive private IP addresses from their subnet. Traffic between resources in the same VNet flows privately over Azure\'s backbone network without traversing the public internet. VNets are region-scoped: a single VNet exists in one Azure region and cannot span regions natively (you use VNet peering or VPN Gateways for cross-region connectivity). Walk: the isolation model is fundamental to Azure security. By default, resources in a VNet cannot be reached from the internet unless you explicitly expose them (public IP, load balancer, Application Gateway). Resources in one VNet cannot communicate with resources in a different VNet unless connectivity is explicitly configured (peering, gateway). This means you can deploy sensitive workloads into a VNet with no public exposure, connect them only to trusted systems, and satisfy compliance requirements for network isolation. A single subscription can have multiple VNets in the same or different regions. VNets in the same region can be peered at low latency. Run: for AZ-104, understand the key VNet design constraints. Address space: defined at creation, can be expanded later by adding additional address ranges but cannot shrink. Subnets: each VNet must have at least one subnet. Subnets cannot overlap within a VNet. Some Azure services require dedicated subnets (Application Gateway needs its own subnet, Azure Bastion needs AzureBastionSubnet, VPN Gateway needs GatewaySubnet). DNS: by default, VNet resources use Azure-provided DNS (168.63.129.16), which resolves Azure resource names within the VNet and forwards external queries to Azure\'s public resolvers. Custom DNS servers can be configured at the VNet level. Exam trigger: "private network in Azure," "network isolation," "resources communicate privately" = VNet.'
                },
                {
                    question: 'How many IP addresses does Azure reserve in each subnet?',
                    options: [
                        '0',
                        '3',
                        '5',
                        '10'
                    ],
                    explanation: 'Azure reserves exactly 5 IP addresses from every subnet\'s address range — these are consumed by Azure infrastructure and are not available for deployment to your resources. Crawl: in any subnet, the five reserved addresses follow a fixed pattern. Take a subnet of 10.0.1.0/24 as an example. 10.0.1.0 is the network address (identifies the subnet itself). 10.0.1.1 is the default gateway (used by Azure to route traffic out of the subnet). 10.0.1.2 and 10.0.1.3 are reserved for Azure DNS. 10.0.1.255 is the broadcast address (reserved by the IP protocol even though Azure does not use broadcast). All five are off-limits to your resources. Walk: the practical impact of this reservation matters most for small subnets. A /29 subnet gives you 8 total addresses, minus 5 Azure reservations, leaving only 3 usable IPs. A /28 gives 16 total minus 5, leaving 11 usable. Subnet sizing is a critical design decision because subnets cannot be resized without deleting and recreating them (which requires removing all resources first). For production workloads, over-provision your subnets — it costs nothing extra for unused private IP space, and you avoid painful subnet migrations later. The general rule of thumb: never go smaller than /27 (27 usable IPs) for anything production-facing, and plan for growth. Run: for AZ-104, internalize the usable IP formula. Total IPs in a /N subnet = 2^(32-N). Usable IPs = total - 5. A /24 = 256 total, 251 usable. A /25 = 128 total, 123 usable. A /26 = 64 total, 59 usable. A /27 = 32 total, 27 usable. A /28 = 16 total, 11 usable. A /29 = 8 total, 3 usable. The exam will present a scenario where a subnet needs to host a specific number of VMs and ask which CIDR provides sufficient addresses — always add 5 to your required count before selecting the CIDR. Exam trigger: "how many usable IPs in a /24 subnet in Azure" = 251. "Azure reserves how many IPs per subnet" = 5.'
                },
                {
                    question: 'What is the purpose of a Network Security Group (NSG)?',
                    options: [
                        'Encrypt data at rest',
                        'Filter network traffic with stateful firewall rules based on source/destination/port',
                        'Create DNS records',
                        'Monitor VM performance'
                    ],
                    explanation: 'An NSG is a stateful layer-3/layer-4 packet filter that controls inbound and outbound network traffic to Azure resources using allow/deny rules based on source IP, destination IP, port, and protocol. Crawl: an NSG contains two sets of rules: inbound (traffic entering the associated resource) and outbound (traffic leaving the associated resource). Each rule specifies: priority (100–4096, lower number = higher priority), source (IP address, CIDR range, service tag, or application security group), destination (same options), protocol (TCP, UDP, ICMP, or Any), port range (single port, range, or *), and action (Allow or Deny). Azure evaluates rules in priority order — the first matching rule determines the outcome. If no rule matches, a set of default rules applies. Default rules exist for every NSG: AllowVNetInBound (allows all inbound from the VNet address space), AllowAzureLoadBalancerInBound (allows health probe traffic), DenyAllInBound (denies everything else at priority 65500). Walk: NSGs can be applied at two levels: the subnet level and the NIC (network interface) level. Subnet-level NSG applies to all resources in that subnet. NIC-level NSG applies only to the specific VM. When both are applied, traffic must pass through both NSGs. For inbound traffic, the subnet NSG is evaluated first; for outbound, the NIC NSG is evaluated first. This layering allows you to set broad subnet policies and then fine-tune per-VM rules. Stateful behavior means that if you allow inbound TCP traffic on port 80, the return traffic is automatically permitted — you do not need a separate outbound rule for the response packets. Run: for AZ-104, understand NSG rule evaluation flow and the concept of service tags. Service tags are named groups of Azure service IP ranges maintained by Microsoft (e.g., AzureLoadBalancer, VirtualNetwork, Internet, Storage, Sql). Using service tags avoids hardcoding IP ranges that change over time. Application Security Groups (ASGs) allow you to group VMs by function (WebServers, AppServers, DBServers) and write NSG rules against those groups instead of IP addresses. Exam pattern: "allow port 443 from the internet to web servers" = inbound NSG rule, source Internet, destination Web ASG, port 443, Allow. "Block all traffic between subnets except port 1433" = NSG on subnet with explicit Deny rules and a targeted Allow.'
                },
                {
                    question: 'How are NSG rules evaluated?',
                    options: [
                        'Alphabetically by name',
                        'By priority number — lowest number evaluated first; first match wins',
                        'Randomly',
                        'By creation date'
                    ],
                    explanation: 'NSG rules are evaluated in ascending priority order — the rule with the lowest priority number is checked first, and the first rule whose conditions match the traffic determines the action (Allow or Deny); no further rules are evaluated after a match. Crawl: priority numbers range from 100 to 4096. Microsoft recommends leaving gaps between rules (100, 200, 300) so you can insert new rules without renumbering. Priority 100 is evaluated before priority 200. Once a rule matches, evaluation stops — subsequent rules with higher numbers are irrelevant for that packet. If no user-defined rule matches, Azure falls through to the default rules. The final default rule (DenyAll) at priority 65500 denies everything not already matched. Walk: understanding first-match-wins is critical for debugging. A common misconfiguration: you add an allow rule at priority 300 for port 3389 (RDP) but have a deny rule at priority 200 for all inbound traffic from the internet. Traffic hits the deny rule at 200 first, never reaches 300, and RDP is blocked despite the allow rule existing. The fix: set the allow rule to a lower priority number than the deny rule (e.g., allow at 150, deny-all at 200), or make the deny rule more specific. Walk through a complete evaluation for inbound traffic to a VM: NSG attached to the NIC is evaluated. Rules checked in order: 100, 150, 200, 300... If a rule matches, action taken, done. If no match, check default rules. Default AllowVNetInBound at 65000 matches VNet-sourced traffic. Default DenyAllInBound at 65500 blocks everything else. Run: for AZ-104, understand the augmented security rules feature. Augmented rules allow a single rule to reference multiple ports, source IPs, and destination IPs using comma-separated values or CIDR ranges, reducing the total rule count. Instead of 10 rules for 10 different port ranges, one augmented rule handles all of them. Also understand the NSG flow log feature for diagnostics: NSG flow logs sent to a Storage Account capture accepted and denied traffic, source/dest IPs, ports, protocol, and packet counts. Used with Traffic Analytics for visualization. Exam trigger: "which rule takes precedence" = lower priority number. "Why is traffic blocked despite an allow rule" = a lower-numbered deny rule is matching first.'
                },
                {
                    question: 'What is VNet peering?',
                    options: [
                        'Connecting a VNet to the internet',
                        'Connecting two VNets so resources can communicate over Azure\'s backbone network (not internet)',
                        'Merging two VNets into one',
                        'Creating a VPN tunnel'
                    ],
                    explanation: 'VNet peering creates a direct, low-latency, high-bandwidth connection between two VNets using Azure\'s private backbone network — traffic between peered VNets never traverses the public internet and does not require encryption overhead. Crawl: when two VNets are peered, their address spaces must not overlap — if VNet A uses 10.0.0.0/16 and VNet B uses 10.0.0.0/16, peering is not possible because routing would be ambiguous. VNet peering is not a gateway or a tunnel — it is a direct fabric-level connection. There is no latency penalty beyond what is inherent to the physical distance between the VNets. Traffic crosses Azure\'s internal network fabric, not the internet. Pricing: peering has a per-GB data transfer charge in both directions (inbound and outbound), unlike traffic within the same VNet which is free. Peering supports both same-region peering and global peering (cross-region). Walk: peering must be configured bidirectionally — you create a peering link from VNet A to VNet B, and a separate peering link from VNet B to VNet A. Both links must exist and both must be in the "Connected" state before traffic flows. If only one side is configured, the state shows "Initiated" and traffic does not flow. This is a common exam trap and a real-world troubleshooting scenario. Non-transitive: peering is not transitive by default. If A peers with B and B peers with C, resources in A cannot reach resources in C through B. Each pair needs a direct peering link. For hub-spoke architectures where spoke VNets need to communicate through a hub, you need either direct spoke-to-spoke peering or a network virtual appliance/gateway in the hub with Allow Gateway Transit configured. Run: for AZ-104, understand the key peering options. Allow Virtual Network Access: enables resources in the remote VNet to communicate (should be Enabled, default). Allow Forwarded Traffic: allows traffic forwarded from a virtual appliance in the remote VNet to flow through this peering. Allow Gateway Transit: allows the remote VNet to use a VPN Gateway or ExpressRoute Gateway in this VNet (hub-spoke pattern). Use Remote Gateways: the spoke VNet uses the hub\'s gateway for on-premises connectivity. Exam trigger: "connect two VNets privately" = VNet peering. "Traffic between VNets using Azure backbone" = VNet peering. "Non-transitive" = VNet peering characteristic.'
                },
                {
                    question: 'What does "non-transitive" mean for VNet peering?',
                    options: [
                        'Traffic is encrypted',
                        'If VNet A peers with B and B peers with C, A cannot reach C through B automatically',
                        'Peering is one-directional',
                        'Peering requires a VPN gateway'
                    ],
                    explanation: 'Non-transitive means that VNet peering connections do not chain — each peering is a direct, isolated link between exactly two VNets, and intermediate VNets do not relay traffic between non-peered VNets unless explicitly configured to do so. Crawl: picture three VNets: A (10.0.0.0/16), B (10.1.0.0/16), C (10.2.0.0/16). You create peering A↔B and B↔C. A VM in VNet A tries to reach a VM in VNet C. The packet arrives at VNet B, but there is no peering between A and C. VNet B does not forward the packet to VNet C on A\'s behalf. The packet is dropped. This is non-transitive behavior — connectivity does not flow through an intermediary VNet automatically. Walk: to connect A to C, you have three options. Option 1: create a direct A↔C peering. Simplest approach, but as the number of VNets grows, the number of peering links grows exponentially (n*(n-1)/2 for full mesh). 10 VNets = 45 peering links. Option 2: hub-spoke topology with a Network Virtual Appliance (NVA) in the hub (VNet B). Configure UDRs in VNet A and VNet C to send cross-VNet traffic to the NVA\'s private IP. The NVA routes and optionally inspects the traffic. Option 3: hub-spoke with gateway transit. If VNet B has a VPN Gateway, configure Allow Gateway Transit on B\'s peering and Use Remote Gateways on A\'s and C\'s peerings. This works for on-premises connectivity (VNet A and C reach on-prem through B\'s gateway), but still does not route VNet A directly to VNet C without a spoke-to-spoke UDR through the hub NVA. Run: for AZ-104, understand that non-transitive peering is the design driver behind hub-spoke architectures. The hub VNet hosts shared services: firewall, VPN Gateway, DNS, monitoring. Spokes contain workloads. Each spoke peers with the hub. Spokes do not peer with each other — instead, traffic between spokes routes through the hub NVA, which provides centralized inspection and policy enforcement. Azure Virtual WAN automates hub-spoke routing and solves the transitivity limitation at scale. Exam trigger: "A cannot reach C through B" = non-transitive peering. "Hub-spoke architecture" often connects to the non-transitive limitation as the motivation.'
                },
                {
                    question: 'What is a User Defined Route (UDR)?',
                    options: [
                        'A DNS record type',
                        'A custom route that overrides Azure\'s default system routes to control traffic flow',
                        'A firewall rule',
                        'A load balancer configuration'
                    ],
                    explanation: 'A UDR is a custom IP routing entry that you add to a route table and associate with a subnet — it overrides Azure\'s default system routes to redirect traffic to a next hop of your choosing, enabling traffic inspection, forced tunneling, and advanced network topologies. Crawl: Azure automatically creates system routes for every VNet subnet — routes for the VNet address space (local), routes for peered VNets, a default route for internet traffic (0.0.0.0/0 next hop: Internet), and routes for Azure services. These system routes handle most traffic automatically. UDRs let you override these defaults. A UDR specifies a destination CIDR prefix and a next hop type. Next hop types: VirtualAppliance (send traffic to a specific private IP — your firewall or NVA), VirtualNetworkGateway (send to your VPN/ExpressRoute gateway), VnetLocal (keep within the VNet), Internet (send to the internet), None (drop the traffic — black hole route). Walk: UDRs are organized into route tables. A route table is an Azure resource that contains one or more UDRs. You associate the route table with one or more subnets — every VM in that subnet inherits the routes. When traffic matches a UDR, the system route for the same or less-specific prefix is overridden. Longest-prefix match wins: a more specific UDR (10.0.0.0/24) takes precedence over a less specific one (10.0.0.0/16). UDRs cannot override Border Gateway Protocol (BGP) routes that are more specific. Run: for AZ-104, understand the two most common UDR use cases. Forced tunneling: add a UDR for 0.0.0.0/0 with next hop VirtualNetworkGateway. All internet-bound traffic from the subnet is redirected to your on-premises network via VPN/ExpressRoute for inspection. Useful for compliance requirements mandating that all outbound traffic passes through a corporate firewall. NVA routing: add UDRs in spoke subnets pointing to a firewall NVA (Azure Firewall or a third-party appliance) as the next hop for cross-subnet or cross-VNet traffic. The NVA inspects and allows or denies traffic centrally. Exam trigger: "route traffic through a firewall" = UDR with next hop VirtualAppliance. "Force all internet traffic through on-premises" = UDR with 0.0.0.0/0 next hop VirtualNetworkGateway.'
                },
                {
                    question: 'What is the difference between Azure Load Balancer and Application Gateway?',
                    options: [
                        'They are the same',
                        'Load Balancer operates at Layer 4 (TCP/UDP); Application Gateway operates at Layer 7 (HTTP/HTTPS) with URL routing and SSL termination',
                        'Load Balancer is more expensive',
                        'Application Gateway is only for internal traffic'
                    ],
                    explanation: 'Azure Load Balancer is a Layer 4 (transport layer) load balancer that distributes TCP and UDP traffic based on IP address and port, while Application Gateway is a Layer 7 (application layer) load balancer that understands HTTP/HTTPS content — enabling URL-based routing, SSL termination, cookie-based session affinity, and optional Web Application Firewall (WAF) inspection. Crawl: Layer 4 vs. Layer 7 describes where in the network stack the device makes routing decisions. Layer 4 sees IP addresses and port numbers — it knows source IP, destination IP, source port, destination port, and protocol. Azure Load Balancer uses a 5-tuple hash (source IP, source port, destination IP, destination port, protocol) to select a backend. It does not inspect the payload. This makes it extremely fast and capable of handling millions of flows. Layer 7 sees the full HTTP request — URL path, HTTP headers, hostname, cookies, query string. Application Gateway uses this information to make routing decisions. Route /api/* to one backend pool and /images/* to another. Route traffic to different backends based on the Host header for multi-tenant applications. Walk: choosing between them depends on the traffic type and routing requirements. Load Balancer: TCP/UDP load balancing, lowest latency, highest throughput. Use for non-HTTP protocols (SQL always-on, custom TCP services), or HTTP workloads where you don\'t need URL routing. External (public) and Internal (private) SKUs. Standard SKU provides zone-redundancy and SLA. Application Gateway: HTTP/HTTPS load balancing with content inspection. Use when you need SSL termination (offload TLS processing from backend VMs), URL-path-based routing (different backends for different paths), multi-site hosting (different backends for different hostnames), WAF protection (OWASP rule sets for SQLi, XSS, and more). Run: for AZ-104, understand the SKU landscape. Load Balancer SKUs: Basic (no SLA, no zone support, retired September 2025) and Standard (99.99% SLA, zone-redundant, secure by default — requires NSG to allow traffic). Application Gateway SKUs: Standard_v2 (URL routing, SSL termination, autoscaling) and WAF_v2 (adds OWASP-based WAF to Standard_v2 features). Exam trigger: "SSL termination" or "URL-based routing" or "WAF" = Application Gateway. "TCP load balancing" or "non-HTTP protocols" or "4-layer" = Load Balancer.'
                },
                {
                    question: 'Which Azure DNS zone type resolves names only within linked VNets?',
                    options: [
                        'Public DNS zone',
                        'Private DNS zone',
                        'Reverse DNS zone',
                        'Conditional DNS zone'
                    ],
                    explanation: 'Azure Private DNS zones resolve hostnames only within VNets that are explicitly linked to the zone — they are not resolvable from the public internet and provide name resolution for internal resources without exposing DNS records publicly. Crawl: Azure DNS offers two fundamentally different zone types. A public DNS zone hosts records that are resolvable from anywhere on the internet — your website\'s A records, MX records for email, TXT records for domain verification. The zone is authoritative on the internet for the domain. A private DNS zone is invisible to the internet. Records in the private zone are only resolvable by VMs and services inside VNets that are linked to the zone. Linking a VNet to a private DNS zone means Azure\'s built-in DNS resolver (168.63.129.16) will answer queries for that zone from resources in that VNet. Walk: private DNS zones serve critical internal naming scenarios. Without a private zone, VMs in a VNet communicate using private IP addresses directly. Private DNS zones let you assign FQDNs like webserver.internal.contoso.com to a VM\'s private IP, enabling name-based communication and much easier management as IPs change. Auto-registration: when you link a VNet to a private zone with auto-registration enabled, Azure automatically creates and removes DNS records as VMs are added to and removed from the VNet. One private zone can have auto-registration enabled from up to one VNet, but can be linked (for resolution only) to up to 1,000 VNets. Run: for AZ-104, understand the private DNS zone use cases and service-specific zones. Azure Private Link creates private endpoints that need DNS resolution — when you create a private endpoint for a Storage Account, you need a private DNS zone (privatelink.blob.core.windows.net) linked to your VNet so that the storage account FQDN resolves to the private endpoint IP instead of the public IP. Each Azure service has its own privatelink DNS zone name. Without the private DNS zone, your private endpoint is unreachable by FQDN. Exam trigger: "resolve names internally without internet exposure" = private DNS zone. "Private endpoint DNS resolution" = private DNS zone with VNet link. "Resolve from anywhere on the internet" = public DNS zone.'
                },
                {
                    question: 'What is the Standard Load Balancer SKU advantage over Basic?',
                    options: [
                        'Basic is more reliable',
                        'Standard provides an SLA (99.99%), zone-redundancy, and supports availability zones',
                        'Standard is free; Basic is paid',
                        'Basic supports more backend pool members'
                    ],
                    explanation: 'Standard Load Balancer provides a 99.99% SLA, zone-redundant deployment across availability zones, secure-by-default behavior requiring NSG rules, and support for cross-zone backends — while Basic has no SLA, no zone support, is open by default, and Microsoft retired Basic on September 30, 2025. Crawl: the SKU differences are significant for production decisions. Standard SKU: 99.99% SLA with two or more instances. Zone-redundant (frontend IP and load balancing rules survive a zone failure). Cross-zone load balancing (backends in any zone, load balancer distributes across them). Secure by default — inbound traffic is blocked unless an NSG explicitly allows it. Backend pool supports up to 1,000 instances, and backends can be VMs in any VNet in the region (not just the same VNet). Supports HTTPS health probes. Standard public IP required (no Basic public IP). Basic SKU: no SLA. No availability zone support. Open by default — no NSG required to accept traffic. Backend pool limited to 300 instances, must be in the same availability set or scale set. No cross-zone support. Retired September 30, 2025. Walk: the secure-by-default behavior of Standard is a common source of confusion. When you migrate from Basic to Standard or create a new Standard LB, traffic does not flow until you add NSG rules to the associated subnet or NIC explicitly allowing the traffic. With Basic, traffic flows through the load balancer automatically. Many teams experience an outage when they upgrade and forget to add the NSG rules. The health probe traffic from the load balancer must also be allowed (source: AzureLoadBalancer service tag, or source IP 168.63.129.16). Run: for AZ-104, understand what Standard LB supports that Basic does not. Multiple frontends: Standard supports multiple frontend IP configurations for routing different traffic streams. HA Ports rule: Standard supports a special "all ports" load balancing rule (protocol=All, port=0) that load balances all TCP and UDP traffic — used for NVA high availability deployments. Outbound rules: Standard allows explicit outbound NAT configuration, giving you control over which public IP outbound connections use and the SNAT port allocation. Basic uses implicit SNAT. Exam trigger: "zone-redundant load balancer" = Standard. "SLA for load balancer" = Standard (99.99%). "Secure by default, requires NSG" = Standard. "Retired / no longer available" = Basic.'
                },
                {
                    question: 'A company needs to route all outbound traffic through a firewall appliance. What should they configure?',
                    options: [
                        'NSG rules',
                        'A User Defined Route with next hop type VirtualAppliance pointing to the firewall\'s IP',
                        'VNet peering',
                        'Azure DNS'
                    ],
                    explanation: 'Routing all outbound traffic through a firewall NVA requires a UDR with a destination of 0.0.0.0/0 (all traffic), next hop type of VirtualAppliance, and next hop IP address set to the firewall\'s private IP — attached to the route table of every subnet that must send traffic through the firewall. Crawl: without a UDR, outbound traffic from a VM subnet follows Azure\'s default system route for 0.0.0.0/0, which sends it directly to the internet. A UDR for 0.0.0.0/0 with next hop VirtualAppliance overrides this default. The firewall\'s private IP is the next hop address — Azure sends packets matching the route to that IP. The firewall appliance then inspects the packet, applies its own policies (allow/block by domain, URL, threat intelligence), and forwards permitted traffic to its destination. Walk: the configuration requires attention to several details. The firewall NVA must have IP Forwarding enabled on its network interface — by default, Azure drops packets destined for an IP other than the NIC\'s own IP. IP Forwarding tells Azure to pass those packets through. The firewall VM also needs its own subnet — you should not apply the route table with the 0.0.0.0/0 UDR to the firewall\'s subnet, or you create a routing loop (the firewall tries to route traffic through itself). If the firewall has two NICs (inside and outside), the inside NIC faces the workload subnets and the outside NIC connects to the internet or peered networks. Run: for AZ-104, understand the full deployment pattern for an NVA firewall. Source subnet route table: UDR 0.0.0.0/0 next hop = firewall inside NIC private IP. Optionally add UDRs for specific destination CIDRs. Firewall NIC: IP Forwarding = Enabled. Firewall subnet NSG: allow traffic on the required ports from the workload subnets. Return traffic: if the firewall performs NAT, return traffic naturally flows back through the firewall. If not, you may need UDRs on other subnets to route return traffic back through the firewall as well. Azure Firewall is Microsoft\'s managed NVA — it handles IP forwarding and routing setup automatically when you configure a Firewall Policy. For Azure Firewall, you just create the UDR pointing to the Azure Firewall private IP. Exam trigger: "route through a firewall" or "inspect all outbound traffic" = UDR with next hop VirtualAppliance + IP Forwarding enabled on the NVA.'
                },
                {
                    question: 'What happens if you create VNet peering from VNet A to VNet B but NOT from B to A?',
                    options: [
                        'Bidirectional communication works',
                        'No traffic flows in either direction — peering state shows "Initiated" not "Connected" until both sides are configured',
                        'Both VNets are deleted',
                        'The peering is automatically created in both directions'
                    ],

ant: requires careful RBAC coordination — a user with contributor access on both subscriptions (or delegated access via Azure Lighthouse) must configure both sides. Exam trigger: "peering shows Initiated, not Connected" = only one side configured. "Traffic not flowing between peered VNets" = check that both sides are Connected, address spaces don\'t overlap, and NSG rules aren\'t blocking the traffic.'

t manages rotation automatically). Backend authentication certificates: for end-to-end SSL, you upload the backend server\'s public certificate to Application Gateway\'s HTTP settings so the gateway can validate the backend\'s identity. Mutual TLS (mTLS): Application Gateway v2 supports client certificate authentication where clients must present a valid certificate — used for API-to-API authentication. Exam trigger: "reduce CPU load on backend servers from TLS" = SSL termination. "HTTPS inspection and routing" = Application Gateway. "Certificate lives on the load balancer" = SSL termination.'
