<html lang="en">

    <meta charset="UTF-8">

    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-07: Risk Assessment & Management - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Risk Assessment & Management',
            description: 'Test your knowledge of cloud risk management concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-07',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'According to Gartner, what percentage of cloud security failures through 2025 will be due to human error?',
                    options: [
                        '50%',
                        '75%',
                        '99%',
                        '85%'
                    ],correct: 2, explanation: 'According to Gartner, through 2025, 99% of all cloud security failures will be due to some level of human error. This highlights the importance of training, automation, and proper configuration management.'
                },
                {
                    question: 'What are the four steps in the Risk Management cycle?',
                    options: [
                        'Plan, Do, Check, Act',
                        'Frame, Assess, Respond, Monitor',
                        'Identify, Analyze, Evaluate, Treat',
                        'Detect, Contain, Eradicate, Recover'
                    ],correct: 1, explanation: 'The Risk Management cycle consists of four continuous steps: Frame (define strategy and tolerance), Assess (identify threats and vulnerabilities), Respond (implement controls), and Monitor (ongoing assessment).'
                },
                {
                    question: 'What does the formula ALE = SLE × ARO calculate?',
                    options: [
                        'Average Liability Expense',
                        'Annualized Loss Expectancy',
                        'Asset Loss Estimate',
                        'Annual Liability Estimation'
                    ],correct: 1, explanation: 'ALE (Annualized Loss Expectancy) = SLE (Single Loss Expectancy) × ARO (Annualized Rate of Occurrence). This quantitative formula helps calculate the expected yearly financial loss from a specific risk.'
                },
                {
                    question: 'Which risk category describes catastrophic impact where the business may cease to exist?',
                    options: [
                        'Low Risk',
                        'Moderate Risk',
                        'High Risk',
                        'Critical Risk'
                    ],correct: 2, explanation: 'High Risk represents severe and catastrophic impact to the company. Financial loss will most likely cause the business to cease to exist, recovery is very unlikely, and it could involve loss of life.'
                },
                {
                    question: 'What is the principle of \'Defense in Depth\'?',
                    options: [
                        'Using the deepest encryption algorithms',
                        'One strong layer of protection is sufficient',
                        'Multiple layers of security controls',
                        'Protecting only the most critical assets'
                    ],correct: 2, explanation: 'Defense in Depth is the principle that one level of protection is not enough. It requires a complete approach using multiple layers of security controls to protect data and systems.'
                },
                {
                    question: 'Which risk response involves purchasing cyber insurance?',
                    options: [
                        'Mitigate',
                        'Avoid',
                        'Accept',
                        'Transfer'
                    ],correct: 3, explanation: 'Transfer (or Share) means having someone else take on the risk. Examples include cyber insurance or using cloud services where the provider assumes some responsibility.'
                },
                {
                    question: 'What are the seven steps in NIST Risk Management Framework (SP 800-37)?',
                    options: [
                        'Plan, Do, Check, Act, Monitor, Review, Approve',
                        'Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor',
                        'Identify, Protect, Detect, Respond, Recover, Govern, Monitor',
                        'Frame, Analyze, Design, Build, Test, Deploy, Maintain'
                    ],correct: 1, explanation: 'NIST RMF (SP 800-37) consists of seven steps: Prepare, Categorize, Select, Implement, Assess, Authorize, and Monitor. This provides a structured approach to managing security and privacy risk.'
                },
                {
                    question: 'What type of risk analysis is subjective, quick to implement, and uses probability/impact rankings?',
                    options: [
                        'Quantitative',
                        'Qualitative',
                        'Statistical',
                        'Financial'
                    ],correct: 1, explanation: 'Qualitative Risk Analysis is subjective and quick to implement. It identifies potential threats, assesses likelihood and impact, and presents results through a probability/impact ranking matrix using High/Medium/Low ratings.'
                },
                {
                    question: 'Which common cloud vulnerability refers to the explosion of publicly available workloads from microservices adoption?',
                    options: [
                        'Human Error',
                        'Misconfiguration',
                        'Unmanaged Attack Surface',
                        'Data Breach'
                    ],correct: 2, explanation: 'Unmanaged Attack Surface refers to the total exposure of your environment. The adoption of microservices can lead to an explosion of publicly available workloads, which significantly adds to the attack surface.'
                },
                {
                    question: 'What should you NEVER do when identifying a risk?',
                    options: [
                        'Accept it',
                        'Transfer it',
                        'Mitigate it',
                        'Ignore it'
                    ],correct: 3, explanation: 'You should NEVER ignore a risk! All identified risks must have a documented response - whether that\'s mitigate, avoid, accept, or transfer. Ignoring risks leaves the organization vulnerable to unmanaged threats.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
