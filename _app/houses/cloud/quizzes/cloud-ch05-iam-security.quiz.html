<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM & Security Quiz - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'IAM & Security Quiz',
            description: 'Chapter 5: Securing Your AWS Resources',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'ch05-iam-security',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the AWS Identity and Access Management (IAM) best practice for the root account?',
                    options: [
                        'Use it for daily administrative tasks',
                        'Enable MFA and use it only for account setup and billing',
                        'Share the credentials with your team',
                        'Delete it after creating IAM users'
                    ],correct: 1, explanation: 'The root account has unlimited access to all AWS resources. Best practice is to enable MFA on it and use it only for initial account setup and billing tasks. Daily operations should be performed using IAM users or roles with appropriate permissions.'
                },
                {
                    question: 'Which IAM policy type is attached directly to a user, group, or role?',
                    options: [
                        'Service Control Policy (SCP)',
                        'Resource-based policy',
                        'Identity-based policy',
                        'Permission boundary'
                    ],correct: 2, explanation: 'Identity-based policies are attached directly to IAM identities (users, groups, or roles) and define what actions those identities can perform on which resources. Resource-based policies are attached to resources, not identities.'
                },
                {
                    question: 'What does the principle of least privilege mean in IAM?',
                    options: [
                        'Give users the minimum permissions needed to perform their job',
                        'Always deny access by default',
                        'Grant full administrator access to all users',
                        'Only allow read-only access to all resources'
                    ],correct: 0, explanation: 'The principle of least privilege means granting only the minimum permissions necessary for users to perform their job functions. This reduces the potential impact of security breaches and limits accidental damage from user errors.'
                },
                {
                    question: 'Which AWS service provides Multi-Factor Authentication (MFA) for enhanced security?',
                    options: [
                        'AWS Shield',
                        'AWS IAM',
                        'AWS WAF',
                        'AWS GuardDuty'
                    ],correct: 1, explanation: 'AWS IAM provides MFA capabilities that add an extra layer of security. MFA requires users to provide two forms of authentication: something they know (password) and something they have (MFA device code).'
                },
                {
                    question: 'What is the purpose of an IAM role?',
                    options: [
                        'To permanently assign permissions to a user',
                        'To provide temporary credentials that can be assumed by trusted entities',
                        'To encrypt data at rest',
                        'To configure network access controls'
                    ],correct: 1, explanation: 'IAM roles provide temporary security credentials that can be assumed by trusted entities such as IAM users, applications, or AWS services. Unlike IAM users, roles don\'t have permanent credentials and are ideal for granting temporary access.'
                },
                {
                    question: 'In a security group, what is the default behavior for inbound traffic?',
                    options: [
                        'All traffic is allowed',
                        'All traffic is denied unless explicitly allowed',
                        'Only HTTP and HTTPS traffic is allowed',
                        'Traffic is allowed from the same VPC only'
                    ],correct: 1, explanation: 'Security groups are stateful firewalls with a default deny-all policy for inbound traffic. You must explicitly add rules to allow specific inbound traffic. This follows the security best practice of denying everything by default.'
                },
                {
                    question: 'What is the difference between security groups and Network ACLs (NACLs)?',
                    options: [
                        'Security groups are stateful, NACLs are stateless',
                        'Security groups are stateless, NACLs are stateful',
                        'There is no difference; they are the same',
                        'Security groups apply to VPCs, NACLs apply to regions'
                    ],correct: 0, explanation: 'Security groups are stateful (return traffic is automatically allowed), while NACLs are stateless (you must explicitly allow both inbound and outbound traffic). Security groups operate at the instance level, while NACLs operate at the subnet level.'
                },
                {
                    question: 'Which IAM credential type should be used for programmatic access to AWS services?',
                    options: [
                        'Username and password',
                        'Access keys (Access Key ID and Secret Access Key)',
                        'SSH key pairs',
                        'SSL certificates'
                    ],correct: 1, explanation: 'Access keys consisting of an Access Key ID and Secret Access Key are used for programmatic access to AWS via the CLI, SDKs, or APIs. Usernames and passwords are used for console access, while SSH keys are used for EC2 instance access.'
                },
                {
                    question: 'What is an IAM policy statement\'s \'Effect\' field used for?',
                    options: [
                        'To specify the AWS region where the policy applies',
                        'To specify whether the statement allows or denies access',
                        'To specify the resource being accessed',
                        'To specify the user or group the policy applies to'
                    ],correct: 1, explanation: 'The \'Effect\' field in an IAM policy statement specifies whether the statement results in an \'Allow\' or \'Deny\'. This determines whether the specified actions on specified resources are permitted or blocked.'
                },
                {
                    question: 'What is the maximum number of security groups that can be attached to an EC2 instance?',
                    options: [
                        '1',
                        '3',
                        '5',
                        '10'
                    ],correct: 2, explanation: 'AWS allows you to attach up to 5 security groups to an EC2 instance. The rules from all attached security groups are aggregated to determine what traffic is allowed. This provides flexibility in managing access controls.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
