<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Services Quiz - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Database Services Quiz',
            description: 'Chapter 9: AWS Database Services',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'ch09-database',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which AWS database service is best suited for high-traffic web applications requiring single-digit millisecond latency?',
                    options: [
                        'Amazon RDS',
                        'Amazon DynamoDB',
                        'Amazon Redshift',
                        'Amazon Aurora'
                    ]
                },
                {
                    question: 'What is the primary purpose of Amazon Redshift?',
                    options: [
                        'In-memory caching',
                        'Relational database for OLTP',
                        'Data warehousing and analytics',
                        'Document storage'
                    ],
                    explanation: 'Amazon Redshift is designed as a fast, fully managed data warehouse that makes it simple and cost-effective to analyze large amounts of data using SQL and BI tools. It\'s optimized for OLAP (Online Analytical Processing) workloads.'
                },
                {
                    question: 'Which database engines are supported by Amazon RDS? (Choose the best answer)',
                    options: [
                        'Only MySQL and PostgreSQL',
                        'MySQL, PostgreSQL, Oracle, SQL Server, MariaDB, and Aurora',
                        'Only commercial databases like Oracle and SQL Server',
                        'MongoDB and Cassandra'
                    ]
                },
                {
                    question: 'What are the two engines supported by Amazon ElastiCache?',
                    options: [
                        'MySQL and PostgreSQL',
                        'Redis and Memcached',
                        'MongoDB and DynamoDB',
                        'Oracle and SQL Server'
                    ]
                },
                {
                    question: 'Which feature makes Amazon Aurora different from standard MySQL or PostgreSQL?',
                    options: [
                        'It only runs on-premises',
                        'It',
                        ',',
                        't support SQL queries',
                        'It'
                    ]
                },
                {
                    question: 'What is the maximum storage capacity that can be automatically scaled with Amazon Aurora?',
                    options: [
                        '16 TB',
                        '64 TB',
                        '128 TB',
                        '256 TB'
                    ]
                },
                {
                    question: 'Which AWS database service is MongoDB-compatible?',
                    options: [
                        'Amazon DynamoDB',
                        'Amazon RDS',
                        'Amazon DocumentDB',
                        'Amazon Neptune'
                    ]
                },
                {
                    question: 'What feature of Amazon DynamoDB allows for automatic data replication across multiple AWS regions?',
                    options: [
                        'Multi-AZ deployment',
                        'Global tables',
                        'Read replicas',
                        'Cross-region snapshots'
                    ]
                },
                {
                    question: 'Which database service would be BEST for caching frequently accessed database query results to improve application performance?',
                    options: [
                        'Amazon RDS',
                        'Amazon DynamoDB',
                        'Amazon ElastiCache',
                        'Amazon Redshift'
                    ]
                },
                {
                    question: 'What type of database model does Amazon DynamoDB use?',
                    options: [
                        'Relational (tables with rows and columns)',
                        'Graph database',
                        'Key-value and document',
                        'Time-series'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
