<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 03: Data Protection & Encryption - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Data Protection & Encryption',
            description: 'CSE Module 03 - Data protection and encryption concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module03',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'According to the shared responsibility model, who is responsible for encrypting data stored in an S3 bucket?',
                    options: [
                        'AWS only',
                        'The customer only',
                        'Shared between AWS and customer',
                        'Neither - S3 is automatically encrypted'
                    ]s responsibility. AWS provides encryption tools (SSE-S3, SSE-KMS) but YOU must enable and configure them. This is YOUR data - YOUR responsibility.'
                },
                {
                    question: 'Which combination of controls from Modules 02-03 would have prevented this breach?',
                    options: [
                        'MFA + Encryption at rest only',
                        'MFA + Customer-managed keys + DLP policies',
                        'RBAC + SSO only',
                        'Firewall + Antivirus'
                    ]t decrypt without YOUR keys. DLP (M03) blocks unauthorized data exfiltration. Defense in depth!'
                },
                {
                    question: 'How does the Principle of Least Privilege (M02) apply to key management (M03)?',
                    options: [
                        'All admins should have access to all encryption keys',
                        'Only the key creator should ever access the key',
                        'Grant key access only to services/users who need to encrypt/decrypt specific data',
                        'Encryption keys should be publicly accessible for transparency'
                    ]
                },
                {
                    question: 'Which data classification level requires the MOST protection and has the HIGHEST business impact if exposed?',
                    options: [
                        'Public',
                        'Internal',
                        'Confidential',
                        'Restricted'
                    ]
                },
                {
                    question: 'What is the correct classification and immediate action?',
                    options: [
                        'Internal - add password protection',
                        'Confidential - enable sharing restrictions',
                        'Restricted - encrypt immediately and apply DLP policy',
                        'Public - no action needed'
                    ]
                },
                {
                    question: 'What does DSPM (Data Security Posture Management) help organizations do?',
                    options: [
                        'Only backup data',
                        'Automate data discovery, policy enforcement, and compliance reporting',
                        'Replace encryption entirely',
                        'Eliminate the need for data classification'
                    ]
                },
                {
                    question: 'What is the industry standard encryption algorithm for data at rest in cloud environments?',
                    options: [
                        'DES',
                        '3DES',
                        'AES-256',
                        'MD5'
                    ]
                },
                {
                    question: 'What does TLS protect data from during transit?',
                    options: [
                        'Only eavesdropping',
                        'Only tampering',
                        'Only impersonation',
                        'Eavesdropping, tampering, AND impersonation'
                    ]
                },
                {
                    question: 'What does the attacker see?',
                    options: [
                        'Plaintext data',
                        'Encrypted ciphertext (unreadable)',
                        'Partial data depending on encryption strength',
                        'Metadata only'
                    ]
                },
                {
                    question: 'Which encryption approach provides defense in depth?',
                    options: [
                        'Encryption at rest only',
                        'Encryption in transit only',
                        'Both encryption at rest AND in transit',
                        'Neither - firewalls are sufficient'
                    ]
                },
                {
                    question: 'What is a key advantage of Customer-Managed Keys (CMK) over CSP-managed keys?',
                    options: [
                        'Lower cost',
                        'Simpler management',
                        'You can revoke access independent of the CSP',
                        'Automatic rotation'
                    ]
                },
                {
                    question: 'Which AWS service provides single-tenant, dedicated hardware for key management with FIPS 140-2 Level 3 compliance?',
                    options: [
                        'AWS KMS',
                        'AWS CloudHSM',
                        'AWS Secrets Manager',
                        'AWS Certificate Manager'
                    ]
                },
                {
                    question: 'What happens to data encrypted with a customer-managed key if the key is deleted?',
                    options: [
                        'Data becomes unreadable permanently',
                        'Data automatically decrypts',
                        'CSP provides a backup key',
                        'Data stays encrypted but accessible'
                    ]
                },
                {
                    question: 'What is the immediate priority action?',
                    options: [
                        'Delete the GitHub repo',
                        'Notify the developer',
                        'Rotate the exposed keys immediately',
                        'File an incident report'
                    ]
                },
                {
                    question: 'What is the primary purpose of Data Loss Prevention (DLP) solutions?',
                    options: [
                        'Encrypt all data automatically',
                        'Detect and block unauthorized data sharing',
                        'Replace antivirus software',
                        'Manage encryption keys'
                    ]s used, and blocks unauthorized sharing (email, cloud upload, USB, printing). It\'s about preventing data from leaving your control.'
                },
                {
                    question: 'Which AWS service specifically focuses on discovering sensitive data in S3 buckets?',
                    options: [
                        'AWS Guard Duty',
                        'AWS Macie',
                        'AWS Inspector',
                        'AWS Config'
                    ]
                },
                {
                    question: 'What should a properly configured DLP policy do?',
                    options: [
                        'Allow the email but log it',
                        'Block the email and alert security',
                        'Encrypt the attachment automatically',
                        'Forward the email to the employee'
                    ]t prevent the breach.'
                },
                {
                    question: 'What is the key difference between RTO and RPO?',
                    options: [
                        'RTO measures data loss, RPO measures recovery time',
                        'RTO measures recovery time, RPO measures acceptable data loss',
                        'They are the same thing',
                        'RTO is for backup, RPO is for replication'
                    ]
                },
                {
                    question: 'Why can\'t replication alone protect against ransomware?',
                    options: [
                        'Replication is too slow',
                        'Corrupted/encrypted data replicates to the replica',
                        'Ransomware cannot cross network boundaries',
                        'Replication costs too much'
                    ]
                },
                {
                    question: 'What DR strategy provides the fastest recovery (lowest RTO) but highest cost?',
                    options: [
                        'Backup-only',
                        'Pilot light',
                        'Warm standby',
                        'Hot standby'
                    ]s the most expensive because you\'re paying for two complete environments. Use when downtime is unacceptable.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
