<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-08: Compliance & Governance - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Compliance & Governance',
            description: 'Final quiz on cloud compliance frameworks',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-08',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which regulation protects data privacy for individuals within the European Union?',
                    options: [
                        'FISMA',
                        'GDPR',
                        'FERPA',
                        'HIPAA'
                    ]
                },
                {
                    question: 'What does FISMA establish cybersecurity standards for?',
                    options: [
                        'Healthcare organizations',
                        'Payment processors',
                        'U.S. government tech infrastructure',
                        'Educational institutions'
                    ]
                },
                {
                    question: 'Which industry compliance standard applies to organizations handling credit card data?',
                    options: [
                        'HIPAA',
                        'SOX',
                        'PCI-DSS',
                        'GLBA'
                    ]
                },
                {
                    question: 'What are the five functions of the NIST Cybersecurity Framework?',
                    options: [
                        'Plan, Do, Check, Act, Monitor',
                        'Identify, Protect, Detect, Respond, Recover',
                        'Prevent, Detect, Contain, Eradicate, Recover',
                        'Assess, Mitigate, Transfer, Accept, Monitor'
                    ]
                },
                {
                    question: 'How many security controls are included in ISO 27001 Annex A?',
                    options: [
                        '50 controls in 7 domains',
                        '93 controls in 10 domains',
                        '114 controls in 14 domains',
                        '197 controls in 17 domains'
                    ]
                },
                {
                    question: 'What does CSA STAR Registry document?',
                    options: [
                        'Employee certifications',
                        'Security and privacy controls of cloud providers',
                        'Network configurations',
                        'Penetration testing results'
                    ]
                },
                {
                    question: 'How many control objectives are in the CSA Cloud Controls Matrix (CCM)?',
                    options: [
                        '114 in 14 domains',
                        '150 in 15 domains',
                        '197 in 17 domains',
                        '250 in 20 domains'
                    ]
                },
                {
                    question: 'What are the four pillars of cloud security governance?',
                    options: [
                        'People, Process, Technology, Data',
                        'Risk Management, Governance, Auditing, Continuous Monitoring',
                        'Identify, Protect, Detect, Respond',
                        'Confidentiality, Integrity, Availability, Accountability'
                    ]
                },
                {
                    question: 'Which Azure service enforces organizational standards and assesses compliance?',
                    options: [
                        'Azure Monitor',
                        'Azure Arc',
                        'Azure Policy',
                        'Azure Sentinel'
                    ]
                },
                {
                    question: 'What does FedRAMP provide for federal agencies?',
                    options: [
                        'Free cloud storage',
                        'Standardized approach to security for cloud services',
                        'Network monitoring tools',
                        'Employee training programs'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
