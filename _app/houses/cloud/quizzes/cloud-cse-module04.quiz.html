    <script>
        const questions = [
            // Section 1: VPC Architecture (Q1-4)
            {
                category: 'VPC Architecture',
                categoryClass: 'cat-vpc',
                question: 'In AWS, which VPC component must be explicitly created and is NOT provided by default when you create a new VPC?',
                options: [
                    'Route table',
                    'Network ACL',
                    'Internet Gateway',
                    'Security Group'
                ],
                correct: 2,
                explanation: 'When you create a VPC, AWS automatically creates a main route table, a default NACL, and a default security group. However, the Internet Gateway (IGW) must be explicitly created and attached to enable public internet connectivity.'
            },
            {
                category: 'VPC Architecture',
                categoryClass: 'cat-vpc',
                question: 'What is the key difference between how AWS VPC subnets and Azure VNet subnets are scoped?',
                options: [
                    'AWS subnets span regions; Azure subnets are per-zone',
                    'AWS subnets are per Availability Zone; Azure subnets span the region',
                    'Both use identical regional scoping',
                    'AWS uses dynamic subnets; Azure uses static'
                ],
                correct: 1,
                explanation: 'AWS subnets are tied to a specific Availability Zone, providing physical isolation. Azure subnets span the entire region, offering more flexibility but different fault domain characteristics.'
            },
            {
                category: 'VPC Architecture',
                categoryClass: 'cat-vpc',
                question: 'VPC Peering allows private connectivity between VPCs. Which statement is TRUE about VPC peering?',
                options: [
                    'Peering connections are transitive by default',
                    'Peering requires both VPCs to be in the same region',
                    'Peering can be established across different AWS accounts',
                    'Peering automatically shares route tables between VPCs'
                ],
                correct: 2,
                explanation: 'VPC Peering can connect VPCs across different AWS accounts and even across regions (inter-region peering). However, peering is NOT transitive—if VPC A peers with B, and B peers with C, A cannot reach C through B.'
            },
            {
                category: 'VPC Architecture',
                categoryClass: 'cat-vpc',
                question: 'In a 3-tier VPC architecture, where should the NAT Gateway be deployed?',
                options: [
                    'Private subnet (data tier)',
                    'Private subnet (application tier)',
                    'Public subnet (web tier)',
                    'Outside the VPC in a separate region'
                ],
                correct: 2,
                explanation: 'NAT Gateways must be deployed in a public subnet because they need a route to the internet through the Internet Gateway. They enable instances in private subnets to reach the internet for updates while preventing inbound connections.'
            },
            // Section 2: Network Segmentation (Q5-7)
            {
                category: 'Network Segmentation',
                categoryClass: 'cat-segment',
                question: 'Which type of load balancer should you use when end-to-end TLS encryption is required for compliance, and you cannot terminate TLS at the load balancer?',
                options: [
                    'Application Load Balancer (ALB)',
                    'Network Load Balancer (NLB)',
                    'Classic Load Balancer',
                    'Gateway Load Balancer'
                ],
                correct: 1,
                explanation: 'Network Load Balancer (NLB) supports TLS passthrough, allowing encrypted traffic to pass directly to backend instances without decryption at the load balancer. This is required for strict compliance scenarios like PCI DSS where end-to-end encryption is mandated.'
            },
            {
                category: 'Network Segmentation',
                categoryClass: 'cat-segment',
                question: 'What is the PRIMARY security benefit of TLS/SSL termination at a load balancer?',
                options: [
                    'Eliminates the need for backend encryption entirely',
                    'Offloads cryptographic processing from backend servers',
                    'Provides stronger encryption than backend TLS',
                    'Automatically patches SSL vulnerabilities'
                ],
                correct: 1,
                explanation: 'TLS termination offloads CPU-intensive cryptographic operations from backend servers, allowing them to use smaller instances. However, traffic between the load balancer and backends should still be encrypted (re-encryption) for defense-in-depth.'
            },
            {
                category: 'Network Segmentation',
                categoryClass: 'cat-segment',
                question: 'AWS Shield Standard provides automatic DDoS protection. Which services are covered at NO additional cost?',
                options: [
                    'Only EC2 instances in public subnets',
                    'CloudFront, Route 53, and Elastic Load Balancing',
                    'All services in any VPC',
                    'Only services using AWS WAF'
                ],
                correct: 1,
                explanation: 'AWS Shield Standard is free and automatically protects CloudFront distributions, Route 53 hosted zones, and Elastic Load Balancers against common Layer 3/4 DDoS attacks like SYN floods and reflection attacks.'
            },
            // Section 3: NACLs and Security Groups (Q8-11)
            {
                category: 'Access Controls',
                categoryClass: 'cat-acl',
                question: 'You configure a Security Group to allow inbound HTTPS (port 443). What happens to the return traffic?',
                options: [
                    'It is blocked unless you add an explicit outbound rule',
                    'It is automatically allowed because Security Groups are stateful',
                    'It requires a matching NACL outbound rule',
                    'It is allowed only for the first 60 seconds'
                ],
                correct: 1,
                explanation: 'Security Groups are stateful, meaning they track connections. When you allow inbound traffic, the corresponding return (outbound) traffic is automatically allowed, regardless of outbound rules.'
            },
            {
                category: 'Access Controls',
                categoryClass: 'cat-acl',
                question: 'A NACL has the following rules: Rule 100 ALLOW all from 0.0.0.0/0, Rule 50 DENY from 10.0.0.50/32. What happens to traffic from 10.0.0.50?',
                options: [
                    'Traffic is allowed (Rule 100 takes precedence)',
                    'Traffic is denied (Rule 50 is evaluated first)',
                    'Traffic is allowed on even ports, denied on odd ports',
                    'Traffic depends on the Security Group configuration'
                ],
                correct: 1,
                explanation: 'NACL rules are evaluated in order by rule number (lowest first). Rule 50 is evaluated before Rule 100, so traffic from 10.0.0.50 is denied before the allow-all rule is reached.'
            },
            {
                category: 'Access Controls',
                categoryClass: 'cat-acl',
                question: 'What is the default behavior of a NEWLY CREATED (custom) Network ACL in AWS?',
                options: [
                    'Allows all inbound and outbound traffic',
                    'Denies all inbound and outbound traffic',
                    'Allows inbound, denies outbound',
                    'Matches the VPC default NACL settings'
                ],
                correct: 1,
                explanation: 'Custom-created NACLs in AWS deny all traffic by default (both inbound and outbound). This is different from the default NACL that comes with the VPC, which allows all traffic. You must explicitly add allow rules to custom NACLs.'
            },
            {
                category: 'Access Controls',
                categoryClass: 'cat-acl',
                question: 'Azure Application Security Groups (ASGs) provide what primary benefit for NSG rule management?',
                options: [
                    'Automatic port scanning and vulnerability detection',
                    'Grouping VMs by function for simplified rule management',
                    'Encryption of traffic between grouped VMs',
                    'Load balancing across grouped resources'
                ],
                correct: 1,
                explanation: 'Application Security Groups allow you to group VMs by function (web servers, databases, etc.) and reference these groups in NSG rules instead of individual IP addresses. This simplifies rule management as you scale.'
            },
            // Section 4: Remote Access (Q12-14)
            {
                category: 'Remote Access',
                categoryClass: 'cat-access',
                question: 'What is the PRIMARY security advantage of using VPC Endpoints (PrivateLink) instead of accessing AWS services over the public internet?',
                options: [
                    'VPC Endpoints provide faster data transfer speeds',
                    'Traffic stays within the AWS network, never traversing the public internet',
                    'VPC Endpoints are free while internet access has data transfer costs',
                    'VPC Endpoints automatically encrypt all traffic'
                ],
                correct: 1,
                explanation: 'VPC Endpoints keep traffic on the AWS private network backbone, eliminating exposure to the public internet. This reduces attack surface and meets compliance requirements for sensitive data handling.'
            },
            {
                category: 'Remote Access',
                categoryClass: 'cat-access',
                question: 'Azure Bastion provides secure VM access. Which statement BEST describes its security model?',
                options: [
                    'It requires SSH/RDP ports to be open on the VM public IP',
                    'It uses browser-based access through Azure Portal with no exposed ports',
                    'It requires a VPN connection to the Azure network first',
                    'It only works with Windows VMs, not Linux'
                ],
                correct: 1,
                explanation: 'Azure Bastion provides RDP/SSH access through the Azure Portal browser interface. VMs do not need public IPs or exposed management ports (22/3389), significantly reducing attack surface.'
            },
            {
                category: 'Remote Access',
                categoryClass: 'cat-access',
                question: 'Just-In-Time (JIT) VM Access implements which security principle?',
                options: [
                    'Defense in depth',
                    'Separation of duties',
                    'Least privilege (time-limited access)',
                    'Security through obscurity'
                ],
                correct: 2,
                explanation: 'JIT access embodies least privilege by granting access only when needed and automatically revoking it after a set time. This minimizes the window of exposure for management ports.'
            },
            // Section 5: Firewalls and IDS/IPS (Q15-17)
            {
                category: 'Firewalls & IDS/IPS',
                categoryClass: 'cat-firewall',
                question: 'Which type of firewall is specifically designed to protect against OWASP Top 10 vulnerabilities like SQL injection and XSS?',
                options: [
                    'Network Firewall (Layer 3-4)',
                    'Web Application Firewall (WAF)',
                    'Host-based Firewall',
                    'Next-Generation Firewall (NGFW)'
                ],
                correct: 1,
                explanation: 'Web Application Firewalls (WAF) operate at Layer 7 and inspect HTTP/HTTPS traffic for application-level attacks. They are specifically designed to block SQL injection, XSS, and other OWASP Top 10 vulnerabilities.'
            },
            {
                category: 'Firewalls & IDS/IPS',
                categoryClass: 'cat-firewall',
                question: 'What is the key difference between an IDS and an IPS?',
                options: [
                    'IDS uses signatures; IPS uses machine learning',
                    'IDS only detects and alerts; IPS can block malicious traffic',
                    'IDS is cloud-based; IPS is on-premises only',
                    'IDS monitors inbound traffic; IPS monitors outbound'
                ],
                correct: 1,
                explanation: 'Intrusion Detection Systems (IDS) passively monitor and alert on suspicious activity. Intrusion Prevention Systems (IPS) are deployed inline and can actively block or modify malicious traffic in real-time.'
            },
            {
                category: 'Firewalls & IDS/IPS',
                categoryClass: 'cat-firewall',
                question: 'When deploying both a Network Firewall and a WAF, what is the recommended order in the traffic flow?',
                options: [
                    'WAF first, then Network Firewall',
                    'Network Firewall first, then WAF',
                    'They should be deployed in parallel, not in sequence',
                    'Order does not matter for cloud deployments'
                ],
                correct: 1,
                explanation: 'Network Firewall should be first to filter Layer 3-4 attacks (malicious IPs, port scans) before traffic reaches the WAF, which then inspects Layer 7 content. This provides defense-in-depth.'
            },
            // Section 6: Cumulative Review (Q18-20)
            {
                category: 'M01 Review',
                categoryClass: 'cat-review',
                question: '[M01 Review] In the Shared Responsibility Model, who is responsible for configuring Security Groups and NACLs in an IaaS environment?',
                options: [
                    'Cloud Service Provider',
                    'Customer',
                    'Shared responsibility between both',
                    'Third-party security vendor'
                ],
                correct: 1,
                explanation: 'Network access controls (Security Groups, NACLs) are customer responsibility in IaaS. The CSP provides the networking infrastructure; customers must configure it securely. This connects M01 to M04 concepts.'
            },
            {
                category: 'M02 Review',
                categoryClass: 'cat-review',
                question: '[M02 Review] When configuring VPC Endpoint policies, which IAM principle should be applied to restrict access to specific S3 buckets?',
                options: [
                    'Role-based access control (RBAC)',
                    'Principle of least privilege',
                    'Separation of duties',
                    'Mandatory access control (MAC)'
                ],
                correct: 1,
                explanation: 'VPC Endpoint policies should follow least privilege by specifying only the S3 buckets and actions required. This combines M02 IAM concepts with M04 network endpoint security.'
            },
            {
                category: 'M03 Review',
                categoryClass: 'cat-review',
                question: '[M03 Review] A load balancer terminates TLS connections. To maintain encryption in transit to backend servers, what must be configured?',
                options: [
                    'Enable encryption at rest on the load balancer',
                    'Configure re-encryption (TLS to backend instances)',
                    'Use a NAT Gateway instead of the load balancer',
                    'Deploy a WAF to encrypt traffic'
                ],
                correct: 1,
                explanation: 'When TLS terminates at a load balancer, traffic to backend servers is unencrypted by default. Re-encryption (new TLS connection to backends) maintains M03 encryption-in-transit requirements.'
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let questionsContainer = document.getElementById('questionsContainer');

        function initQuiz() {
            questionsContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card' + (index === 0 ? ' active' : '');
                card.id = `question-${index}`;

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} of ${questions.length}</div>
                    <span class="question-category ${q.categoryClass}">${q.category}</span>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-question="${index}" data-option="${i}" onclick="selectOption(${index}, ${i})">
                                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation-${index}">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="nav-btn" onclick="nextQuestion()" id="nextBtn-${index}">
                            ${index === questions.length - 1 ? 'Finish Quiz' : 'Next →'}
                        </button>
                    </div>
                `;

                questionsContainer.appendChild(card);
            });
        }

        function selectOption(questionIndex, optionIndex) {
            const question = questions[questionIndex];
            const options = document.querySelectorAll(`[data-question="${questionIndex}"]`);

            // If already answered, don't allow changes
            if (answers[questionIndex] !== null) return;

            answers[questionIndex] = optionIndex;

            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === question.correct) {
                    opt.classList.add('correct');
                } else if (i === optionIndex && optionIndex !== question.correct) {
                    opt.classList.add('incorrect');
                }
            });

            document.getElementById(`explanation-${questionIndex}`).classList.add('show');
            saveProgress();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                document.getElementById(`question-${currentQuestion}`).classList.remove('active');
                currentQuestion++;
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                document.getElementById(`question-${currentQuestion}`).classList.remove('active');
                currentQuestion--;
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            }
        }

        function updateProgress() {
            const pct = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function showResults() {
            document.getElementById(`question-${currentQuestion}`).classList.remove('active');
            document.querySelector('.progress-section').style.display = 'none';

            let correct = 0;
            let sectionScores = {};

            questions.forEach((q, i) => {
                if (answers[i] === q.correct) correct++;

                if (!sectionScores[q.category]) {
                    sectionScores[q.category] = { correct: 0, total: 0 };
                }
                sectionScores[q.category].total++;
                if (answers[i] === q.correct) {
                    sectionScores[q.category].correct++;
                }
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('scoreNumber').textContent = percentage + '%';
            document.getElementById('scoreCircle').className = 'score-circle ' + (passed ? 'pass' : 'fail');
            document.getElementById('resultMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            let breakdownHTML = '<h3>Section Breakdown</h3>';
            for (const [section, scores] of Object.entries(sectionScores)) {
                const sectionPct = Math.round((scores.correct / scores.total) * 100);
                breakdownHTML += `
                    <div class="section-score">
                        <span>${section}</span>
                        <span>${scores.correct}/${scores.total} (${sectionPct}%)</span>
                    </div>
                `;
            }
            document.getElementById('sectionBreakdown').innerHTML = breakdownHTML;

            document.getElementById('resultsCard').classList.add('active');

            localStorage.setItem('cse-module04-quiz-score', percentage);
            localStorage.setItem('cse-module04-quiz-passed', passed);

            // Track in ProgressManager
            if (passed && typeof ProgressManager !== 'undefined') {
                ProgressManager.completeModule('cse-module04-quiz', 'cloud', 'quiz', { score: percentage });
            }
        }

        function resetQuiz() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            document.getElementById('resultsCard').classList.remove('active');
            document.querySelector('.progress-section').style.display = 'block';
            initQuiz();
            updateProgress();
            localStorage.removeItem('cse-module04-quiz-answers');
        }

        function saveProgress() {
            localStorage.setItem('cse-module04-quiz-answers', JSON.stringify(answers));
            localStorage.setItem('cse-module04-quiz-current', currentQuestion);
        }

        function loadProgress() {
            const savedAnswers = localStorage.getItem('cse-module04-quiz-answers');
            const savedCurrent = localStorage.getItem('cse-module04-quiz-current');

            if (savedAnswers && savedCurrent) {
                answers = JSON.parse(savedAnswers);
                currentQuestion = parseInt(savedCurrent);

                // Restore answer states
                answers.forEach((answer, i) => {
                    if (answer !== null) {
                        const options = document.querySelectorAll(`[data-question="${i}"]`);
                        options.forEach((opt, j) => {
                            opt.classList.add('disabled');
                            if (j === questions[i].correct) {
                                opt.classList.add('correct');
                            } else if (j === answer && answer !== questions[i].correct) {
                                opt.classList.add('incorrect');
                            }
                        });
                        document.getElementById(`explanation-${i}`).classList.add('show');
                    }
                });

                // Show current question
                document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            }
        }

        initQuiz();
        loadProgress();
    </script>

    <!-- Progress System -->
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
