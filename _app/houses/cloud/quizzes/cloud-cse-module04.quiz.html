<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 04: Network Security - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Network Security',
            description: 'CSE Module 04 - Cloud network security concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module04',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'In AWS, which VPC component must be explicitly created and is NOT provided by default when you create a new VPC?',
                    options: [
                        'Security Group',
                        'Route table',
                        'Network ACL',
                        'Internet Gateway'
                    ]
                },
                {
                    question: 'What is the key difference between how AWS VPC subnets and Azure VNet subnets are scoped?',
                    options: [
                        'AWS subnets span regions; Azure subnets are per-zone',
                        'AWS subnets are per Availability Zone; Azure subnets span the region',
                        'AWS uses dynamic subnets; Azure uses static',
                        'Both use identical regional scoping'
                    ]
                },
                {
                    question: 'VPC Peering allows private connectivity between VPCs. Which statement is TRUE about VPC peering?',
                    options: [
                        'Peering requires both VPCs to be in the same region',
                        'Peering connections are transitive by default',
                        'Peering can be established across different AWS accounts',
                        'Peering automatically shares route tables between VPCs'
                    ]
                },
                {
                    question: 'In a 3-tier VPC architecture, where should the NAT Gateway be deployed?',
                    options: [
                        'Private subnet (data tier)',
                        'Private subnet (application tier)',
                        'Public subnet (web tier)',
                        'Outside the VPC in a separate region'
                    ]
                },
                {
                    question: 'Which type of load balancer should you use when end-to-end TLS encryption is required for compliance, and you cannot terminate TLS at the load balancer?',
                    options: [
                        'Gateway Load Balancer',
                        'Network Load Balancer (NLB)',
                        'Classic Load Balancer',
                        'Application Load Balancer (ALB)'
                    ]
                },
                {
                    question: 'What is the PRIMARY security benefit of TLS/SSL termination at a load balancer?',
                    options: [
                        'Provides stronger encryption than backend TLS',
                        'Automatically patches SSL vulnerabilities',
                        'Eliminates the need for backend encryption entirely',
                        'Offloads cryptographic processing from backend servers'
                    ]
                },
                {
                    question: 'AWS Shield Standard provides automatic DDoS protection. Which services are covered at NO additional cost?',
                    options: [
                        'All services in any VPC',
                        'Only EC2 instances in public subnets',
                        'Only services using AWS WAF',
                        'CloudFront, Route 53, and Elastic Load Balancing'
                    ]
                },
                {
                    question: 'You configure a Security Group to allow inbound HTTPS (port 443). What happens to the return traffic?',
                    options: [
                        'It is automatically allowed because Security Groups are stateful',
                        'It is allowed only for the first 60 seconds',
                        'It is blocked unless you add an explicit outbound rule',
                        'It requires a matching NACL outbound rule'
                    ]
                },
                {
                    question: 'A NACL has the following rules: Rule 100 ALLOW all from 0.0.0.0/0, Rule 50 DENY from 10.0.0.50/32. What happens to traffic from 10.0.0.50?',
                    options: [
                        'Traffic depends on the Security Group configuration',
                        'Traffic is allowed (Rule 100 takes precedence)',
                        'Traffic is allowed on even ports, denied on odd ports',
                        'Traffic is denied (Rule 50 is evaluated first)'
                    ]
                },
                {
                    question: 'What is the default behavior of a NEWLY CREATED (custom) Network ACL in AWS?',
                    options: [
                        'Matches the VPC default NACL settings',
                        'Allows all inbound and outbound traffic',
                        'Denies all inbound and outbound traffic',
                        'Allows inbound, denies outbound'
                    ]
                },
                {
                    question: 'Azure Application Security Groups (ASGs) provide what primary benefit for NSG rule management?',
                    options: [
                        'Automatic port scanning and vulnerability detection',
                        'Load balancing across grouped resources',
                        'Encryption of traffic between grouped VMs',
                        'Grouping VMs by function for simplified rule management'
                    ]
                },
                {
                    question: 'What is the PRIMARY security advantage of using VPC Endpoints (PrivateLink) instead of accessing AWS services over the public internet?',
                    options: [
                        'Traffic stays within the AWS network, never traversing the public internet',
                        'VPC Endpoints automatically encrypt all traffic',
                        'VPC Endpoints are free while internet access has data transfer costs',
                        'VPC Endpoints provide faster data transfer speeds'
                    ]
                },
                {
                    question: 'Azure Bastion provides secure VM access. Which statement BEST describes its security model?',
                    options: [
                        'It uses browser-based access through Azure Portal with no exposed ports',
                        'It requires SSH/RDP ports to be open on the VM public IP',
                        'It only works with Windows VMs, not Linux',
                        'It requires a VPN connection to the Azure network first'
                    ]
                },
                {
                    question: 'Just-In-Time (JIT) VM Access implements which security principle?',
                    options: [
                        'Security through obscurity',
                        'Separation of duties',
                        'Defense in depth',
                        'Least privilege (time-limited access)'
                    ]
                },
                {
                    question: 'Which type of firewall is specifically designed to protect against OWASP Top 10 vulnerabilities like SQL injection and XSS?',
                    options: [
                        'Next-Generation Firewall (NGFW)',
                        'Network Firewall (Layer 3-4)',
                        'Web Application Firewall (WAF)',
                        'Host-based Firewall'
                    ]
                },
                {
                    question: 'What is the key difference between an IDS and an IPS?',
                    options: [
                        'IDS is cloud-based; IPS is on-premises only',
                        'IDS only detects and alerts; IPS can block malicious traffic',
                        'IDS uses signatures; IPS uses machine learning',
                        'IDS monitors inbound traffic; IPS monitors outbound'
                    ]
                },
                {
                    question: 'When deploying both a Network Firewall and a WAF, what is the recommended order in the traffic flow?',
                    options: [
                        'WAF first, then Network Firewall',
                        'Network Firewall first, then WAF',
                        'They should be deployed in parallel, not in sequence',
                        'Order does not matter for cloud deployments'
                    ]
                },
                {
                    question: '[M01 Review] In the Shared Responsibility Model, who is responsible for configuring Security Groups and NACLs in an IaaS environment?',
                    options: [
                        'Customer',
                        'Third-party security vendor',
                        'Cloud Service Provider',
                        'Shared responsibility between both'
                    ]
                },
                {
                    question: '[M02 Review] When configuring VPC Endpoint policies, which IAM principle should be applied to restrict access to specific S3 buckets?',
                    options: [
                        'Principle of least privilege',
                        'Role-based access control (RBAC)',
                        'Mandatory access control (MAC)',
                        'Separation of duties'
                    ]
                },
                {
                    question: '[M03 Review] A load balancer terminates TLS connections. To maintain encryption in transit to backend servers, what must be configured?',
                    options: [
                        'Deploy a WAF to encrypt traffic',
                        'Use a NAT Gateway instead of the load balancer',
                        'Enable encryption at rest on the load balancer',
                        'Configure re-encryption (TLS to backend instances)'
                    ]
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────

         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="cloud-cse-module04" house="cloud"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
