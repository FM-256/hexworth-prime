<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA Module 01: Windows Server Fundamentals - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Windows Server Fundamentals',
            description: 'WSA Module 01 - Windows Server fundamentals quiz',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cloud-quiz',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the PRIMARY difference between Windows Server Standard and Datacenter editions?',
                    options: [
                        'Datacenter includes more security features',
                        'Datacenter allows unlimited virtual machine licenses',
                        'Standard doesn\'t support Active Directory',
                        'Standard cannot be managed remotely'
                    ],correct: 1, explanation: 'The main difference between Standard and Datacenter is virtualization licensing. Standard includes 2 VM licenses, while Datacenter allows unlimited VMs on a single host.'
                },
                {
                    question: 'Which installation option has a smaller disk footprint and reduced attack surface?',
                    options: [
                        'Desktop Experience',
                        'Server Core',
                        'Nano Server',
                        'Windows Server Essentials'
                    ],correct: 1, explanation: 'Server Core has no GUI, resulting in a smaller disk footprint (~10GB less) and reduced attack surface since fewer components are installed.'
                },
                {
                    question: 'What is the command-line tool used for basic Server Core configuration?',
                    options: [
                        'servermanager',
                        'sconfig',
                        'netcfg',
                        'wconfig'
                    ],correct: 1, explanation: 'sconfig is the Server Configuration Tool - a menu-driven utility for common Server Core administration tasks like networking, domain join, and remote management.'
                },
                {
                    question: 'Which PowerShell cmdlet would you use to view all running services?',
                    options: [
                        'Show-Service -Running',
                        'Get-Service | Where-Object {$_.Status -eq \'Running\'}',
                        'List-Services -Filter Running',
                        'net start'
                    ],correct: 1, explanation: 'Get-Service retrieves all services, and the Where-Object filter selects only those with Status equal to Running. This follows the PowerShell pipeline pattern.'
                },
                {
                    question: 'What port does Remote Desktop Protocol (RDP) use by default?',
                    options: [
                        '22',
                        '443',
                        '3389',
                        '5985'
                    ],correct: 2, explanation: 'RDP uses TCP port 3389 by default. Port 22 is SSH, 443 is HTTPS, and 5985 is WinRM (HTTP).'
                },
                {
                    question: 'Which tool is Microsoft\'s modern, browser-based server management interface?',
                    options: [
                        'Server Manager',
                        'Windows Admin Center',
                        'MMC Console',
                        'Azure Portal'
                    ],correct: 1, explanation: 'Windows Admin Center (WAC) is Microsoft\'s modern, browser-based management tool that can be deployed in gateway mode for multi-user access or desktop mode for single-user.'
                },
                {
                    question: 'What PowerShell cmdlet is used to install Windows Server roles and features?',
                    options: [
                        'Add-WindowsRole',
                        'Install-WindowsFeature',
                        'Enable-WindowsOptionalFeature',
                        'Setup-ServerRole'
                    ],correct: 1, explanation: 'Install-WindowsFeature is the correct cmdlet for installing roles and features via PowerShell. Use with -IncludeManagementTools to add admin tools.'
                },
                {
                    question: 'Which service is critical for Active Directory authentication and must maintain accurate time synchronization?',
                    options: [
                        'DNS Server',
                        'DHCP Server',
                        'Windows Time (W32Time)',
                        'Print Spooler'
                    ],correct: 2, explanation: 'Windows Time (W32Time) is critical for Kerberos authentication in AD. Time differences of more than 5 minutes can cause authentication failures.'
                },
                {
                    question: 'Can you convert a Server Core installation to Desktop Experience after initial setup?',
                    options: [
                        'Yes, using Add-WindowsFeature',
                        'Yes, but only with Windows Server Datacenter',
                        'No, it requires reinstallation',
                        'Yes, using sconfig option 12'
                    ],correct: 2, explanation: 'You cannot add the Desktop Experience GUI to Server Core after installation. You can go from Desktop Experience to Server Core, but not the reverse without reinstalling.'
                },
                {
                    question: 'What protocol does PowerShell Remoting use for communication?',
                    options: [
                        'SSH',
                        'RDP',
                        'WinRM (WS-Management)',
                        'SNMP'
                    ],correct: 2, explanation: 'PowerShell Remoting uses WinRM (Windows Remote Management), which implements the WS-Management protocol. Default ports are 5985 (HTTP) and 5986 (HTTPS).'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
