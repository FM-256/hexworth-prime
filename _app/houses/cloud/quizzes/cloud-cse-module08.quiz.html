<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 08: Compliance & Governance - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Cloud Compliance & Governance',
            description: 'CSE Module 08 - Compliance frameworks and governance',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module08',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'Which regulation protects personal data and privacy for individuals within the European Union?',
                    options: [
                        'HIPAA',
                        'FERPA',
                        'GDPR',
                        'SOX'
                    ],explanation: 'GDPR (General Data Protection Regulation) is the EU law that protects personal data and privacy for all individuals within the European Union and European Economic Area.'
                },
                {
                    question: 'What are the three main rules that make up GLBA (Gramm-Leach-Bliley Act)?',
                    options: [
                        'Privacy Rule, Security Rule, Breach Rule',
                        'Financial Privacy Rule, Safeguards Rule, Pretexting Provisions',
                        'Consent Rule, Encryption Rule, Audit Rule',
                        'Customer Rule, Data Rule, Access Rule'
                    ],explanation: 'GLBA consists of three core sections: the Financial Privacy Rule, the Safeguards Rule, and the Pretexting Provisions.'
                },
                {
                    question: 'Which NIST special publication defines cloud computing and its service/deployment models?',
                    options: [
                        'SP 800-53',
                        'SP 800-144',
                        'SP 800-145',
                        'SP 800-37'
                    ],explanation: 'NIST SP 800-145 is the authoritative definition of cloud computing, defining its characteristics, service models (IaaS, PaaS, SaaS), and deployment models.'
                },
                {
                    question: 'What are the five core functions of the NIST Cybersecurity Framework?',
                    options: [
                        'Plan, Do, Check, Act, Review',
                        'Identify, Protect, Detect, Respond, Recover',
                        'Assess, Design, Implement, Operate, Monitor',
                        'Prevent, Detect, Analyze, Contain, Eradicate'
                    ],explanation: 'The NIST CSF core functions are Identify, Protect, Detect, Respond, and Recover, forming the foundation for cybersecurity risk management.'
                },
                {
                    question: 'Which FedRAMP authorization path is designed for low-impact SaaS solutions with a streamlined process?',
                    options: [
                        'FedRAMP Ready',
                        'FedRAMP Authorized',
                        'FedRAMP Tailored',
                        'FedRAMP Moderate'
                    ],explanation: 'FedRAMP Tailored is a streamlined authorization process specifically designed for low-impact Software-as-a-Service (SaaS) solutions.'
                },
                {
                    question: 'How many control domains are included in CSA Cloud Controls Matrix (CCM) version 4.0?',
                    options: [
                        '14 domains',
                        '17 domains',
                        '19 domains',
                        '21 domains'
                    ],explanation: 'CSA Cloud Controls Matrix (CCM) 4.0 contains 17 domains with 197 control objectives mapped to various compliance frameworks.'
                },
                {
                    question: 'In ISO 27001, Annex A contains how many security controls across how many domains?',
                    options: [
                        '93 controls in 11 domains',
                        '114 controls in 14 domains',
                        '135 controls in 18 domains',
                        '197 controls in 17 domains'
                    ],explanation: 'ISO 27001 Annex A provides a list of 114 security controls organized across 14 domains that can be applied based on risk assessment.'
                },
                {
                    question: 'Which HIPAA rule specifically addresses the protection of electronic Protected Health Information (ePHI)?',
                    options: [
                        'Privacy Rule',
                        'Security Rule',
                        'Breach Notification Rule',
                        'Enforcement Rule'
                    ],explanation: 'The HIPAA Security Rule specifically addresses the safeguards (administrative, physical, technical) required to protect electronic PHI.'
                },
                {
                    question: 'What does HITRUST CSF stand for?',
                    options: [
                        'Health IT Risk Unified Security Trust Framework',
                        'HITRUST Common Security Framework',
                        'Healthcare Information Trust Security Framework',
                        'Health Insurance Trust Unified Security Framework'
                    ],explanation: 'HITRUST CSF stands for HITRUST Common Security Framework, a comprehensive framework leveraging ISO, NIST, PCI, HIPAA, and GDPR.'
                },
                {
                    question: 'Which AWS service continuously monitors resource configurations for compliance with rules?',
                    options: [
                        'AWS CloudTrail',
                        'AWS Config',
                        'AWS GuardDuty',
                        'AWS Inspector'
                    ],explanation: 'AWS Config records configuration changes and evaluates resources against rules to report compliance status and enable automatic remediation.'
                },
                {
                    question: 'Which PCI-DSS requirement specifically addresses the protection of stored cardholder data?',
                    options: [
                        'Requirement 1',
                        'Requirement 3',
                        'Requirement 6',
                        'Requirement 10'
                    ],explanation: 'PCI-DSS Requirement 3 focuses on protecting stored cardholder data through encryption and other security measures.'
                },
                {
                    question: 'What is the primary difference between SOC 2 Type I and SOC 2 Type II reports?',
                    options: [
                        'Type I is for cloud, Type II is for on-premises',
                        'Type I tests design at a point in time, Type II tests operating effectiveness over time',
                        'Type I is public, Type II is confidential',
                        'Type I covers 5 trust principles, Type II covers 3'
                    ],explanation: 'SOC 2 Type I evaluates control design at a specific point in time, while Type II evaluates operating effectiveness over a period of time (typically 6-12 months).'
                },
                {
                    question: 'According to GDPR, what is the maximum timeframe to report a data breach to supervisory authorities?',
                    options: [
                        '24 hours',
                        '48 hours',
                        '72 hours',
                        '1 week'
                    ],explanation: 'GDPR requires data controllers to report personal data breaches to the relevant supervisory authority within 72 hours of becoming aware of the breach.'
                },
                {
                    question: 'What does FISMA stand for?',
                    options: [
                        'Federal Information Security Management Act',
                        'Financial Information Security Mandate Act',
                        'Federal Infrastructure Security Monitoring Act',
                        'Financial Industry Security Management Act'
                    ],explanation: 'FISMA (Federal Information Security Management Act) is a U.S. federal law establishing guidelines and cybersecurity standards for government IT infrastructure.'
                },
                {
                    question: 'In cloud penetration testing, which phase involves gathering information about the target without direct interaction?',
                    options: [
                        'Scanning',
                        'Passive Reconnaissance',
                        'Exploitation',
                        'Post-Exploitation'
                    ],explanation: 'Passive reconnaissance gathers information without directly interacting with the target (e.g., DNS records, OSINT, certificate transparency logs).'
                },
                {
                    question: 'Which Azure service enforces organizational standards and assesses compliance across Azure resources?',
                    options: [
                        'Azure Security Center',
                        'Azure Policy',
                        'Azure Sentinel',
                        'Azure Monitor'
                    ],explanation: 'Azure Policy enforces organizational standards by evaluating resources against policy definitions and can automatically remediate non-compliant resources.'
                },
                {
                    question: 'What are the four key pillars of cloud security governance?',
                    options: [
                        'People, Process, Technology, Data',
                        'Roles & Responsibilities, Framework, Risk Management, Continuous Assessment',
                        'Identify, Protect, Detect, Respond',
                        'Administrative, Physical, Technical, Operational'
                    ],explanation: 'Cloud security governance pillars include: Roles & Responsibilities, Framework Selection, Risk Management, Security Controls, and Continuous Assessment.'
                },
                {
                    question: '[M05 Review] What testing methodology analyzes application source code without executing the program?',
                    options: [
                        'DAST (Dynamic Application Security Testing)',
                        'SAST (Static Application Security Testing)',
                        'IAST (Interactive Application Security Testing)',
                        'RASP (Runtime Application Self-Protection)'
                    ],explanation: 'SAST (Static Application Security Testing) analyzes source code, bytecode, or binaries without executing the program, finding vulnerabilities early in development.'
                },
                {
                    question: '[M06 Review] Which cloud security platform combines CSPM and CWPP capabilities into a unified solution?',
                    options: [
                        'SIEM',
                        'SOAR',
                        'CNAPP',
                        'XDR'
                    ],explanation: 'CNAPP (Cloud-Native Application Protection Platform) combines CSPM (Cloud Security Posture Management) and CWPP (Cloud Workload Protection Platform) capabilities.'
                },
                {
                    question: '[M07 Review] In risk response strategies, which approach involves purchasing cyber insurance?',
                    options: [
                        'Mitigate',
                        'Avoid',
                        'Accept',
                        'Transfer'
                    ],explanation: 'Transfer (or Share) means having someone else take on the risk, such as through cyber insurance policies or using managed cloud services.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
