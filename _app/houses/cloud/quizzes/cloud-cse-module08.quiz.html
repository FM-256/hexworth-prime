<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 08: Compliance & Governance Quiz - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .module-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .module-nav a {
            background: rgba(34, 139, 34, 0.2);
            color: #90ee90;
            padding: 10px 25px;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(34, 139, 34, 0.4);
            transition: all 0.3s ease;
        }

        .module-nav a:hover, .module-nav a.active {
            background: linear-gradient(135deg, #228b22, #006400);
            color: white;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .quiz-header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #90ee90, #228b22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .quiz-header p {
            color: #32cd32;
            font-size: 1.2em;
        }

        .capstone-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(34, 139, 34, 0.2);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #228b22, #90ee90);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: linear-gradient(145deg, rgba(34, 139, 34, 0.1), rgba(0, 100, 0, 0.05));
            border: 1px solid rgba(34, 139, 34, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, #228b22, #006400);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
        }

        .question-category {
            color: #32cd32;
            font-size: 0.85em;
        }

        .review-badge {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 10px;
        }

        .question-text {
            font-size: 1.15em;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(34, 139, 34, 0.1);
            border: 2px solid rgba(34, 139, 34, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: #228b22;
            background: rgba(34, 139, 34, 0.2);
        }

        .option.selected {
            border-color: #228b22;
            background: rgba(34, 139, 34, 0.25);
        }

        .option.correct {
            border-color: #32cd32;
            background: rgba(50, 205, 50, 0.2);
        }

        .option.incorrect {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
        }

        .option-letter {
            background: rgba(34, 139, 34, 0.3);
            color: #90ee90;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option.selected .option-letter {
            background: #228b22;
            color: white;
        }

        .option.correct .option-letter {
            background: #32cd32;
            color: white;
        }

        .option.incorrect .option-letter {
            background: #ff4444;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct {
            background: rgba(50, 205, 50, 0.15);
            border-left: 4px solid #32cd32;
            display: block;
        }

        .feedback.incorrect {
            background: rgba(255, 68, 68, 0.15);
            border-left: 4px solid #ff4444;
            display: block;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #228b22, #006400);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 139, 34, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(34, 139, 34, 0.2);
            border: 1px solid rgba(34, 139, 34, 0.4);
        }

        .results-card {
            background: linear-gradient(145deg, rgba(34, 139, 34, 0.15), rgba(0, 100, 0, 0.1));
            border: 2px solid rgba(34, 139, 34, 0.4);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .results-card.show {
            display: block;
        }

        .score-display {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #90ee90, #228b22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .score-message {
            font-size: 1.3em;
            color: #32cd32;
            margin-bottom: 30px;
        }

        .certification-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            padding: 20px 40px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.2em;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #228b22, #006400);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 139, 34, 0.4);
        }

        @media (max-width: 768px) {
            .quiz-header h1 {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
<a href="#" onclick="history.back(); return false;" class="back-btn" style="position:fixed;top:15px;left:15px;z-index:1000;color:#aaa;text-decoration:none;font-size:1.1rem;padding:6px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(10,10,18,0.85);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(10,10,18,0.85)'">&larr; Back</a>

    <div class="quiz-container">
        <div class="module-nav">
            <a href="../presentations/cloud-cse-module08.presentation.html">Presentation</a>
            <a href="../labs/cloud-cse-module08.lab.html">Hands-On Lab</a>
            <a href="cloud-cse-module08.quiz.html" class="active">Quiz</a>
        </div>

        <div class="quiz-header">
            <div class="capstone-badge">CAPSTONE QUIZ</div>
            <h1>Cloud Compliance & Governance Quiz</h1>
            <p>Module 08 - Final Assessment</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div id="quizContent"></div>

        <div class="results-card" id="resultsCard">
            <h2>Course Complete!</h2>
            <div class="score-display" id="scoreDisplay">0%</div>
            <p class="score-message" id="scoreMessage"></p>
            <div class="certification-badge" id="certBadge" style="display: none;">
                CSE Course Completed
            </div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="../presentations/cloud-cse-module01.presentation.html" class="nav-btn">Review Course →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // Module 08 Core Questions (17 questions)
            {
                question: "Which regulation protects personal data and privacy for individuals within the European Union?",
                options: ["HIPAA", "FERPA", "GDPR", "SOX"],
                correct: 2,
                explanation: "GDPR (General Data Protection Regulation) is the EU law that protects personal data and privacy for all individuals within the European Union and European Economic Area.",
                category: "Regulatory Compliance"
            },
            {
                question: "What are the three main rules that make up GLBA (Gramm-Leach-Bliley Act)?",
                options: [
                    "Privacy Rule, Security Rule, Breach Rule",
                    "Financial Privacy Rule, Safeguards Rule, Pretexting Provisions",
                    "Consent Rule, Encryption Rule, Audit Rule",
                    "Customer Rule, Data Rule, Access Rule"
                ],
                correct: 1,
                explanation: "GLBA consists of three core sections: the Financial Privacy Rule, the Safeguards Rule, and the Pretexting Provisions.",
                category: "Regulatory Compliance"
            },
            {
                question: "Which NIST special publication defines cloud computing and its service/deployment models?",
                options: ["SP 800-53", "SP 800-144", "SP 800-145", "SP 800-37"],
                correct: 2,
                explanation: "NIST SP 800-145 is the authoritative definition of cloud computing, defining its characteristics, service models (IaaS, PaaS, SaaS), and deployment models.",
                category: "Standards"
            },
            {
                question: "What are the five core functions of the NIST Cybersecurity Framework?",
                options: [
                    "Plan, Do, Check, Act, Review",
                    "Identify, Protect, Detect, Respond, Recover",
                    "Assess, Design, Implement, Operate, Monitor",
                    "Prevent, Detect, Analyze, Contain, Eradicate"
                ],
                correct: 1,
                explanation: "The NIST CSF core functions are Identify, Protect, Detect, Respond, and Recover, forming the foundation for cybersecurity risk management.",
                category: "Standards"
            },
            {
                question: "Which FedRAMP authorization path is designed for low-impact SaaS solutions with a streamlined process?",
                options: ["FedRAMP Ready", "FedRAMP Authorized", "FedRAMP Tailored", "FedRAMP Moderate"],
                correct: 2,
                explanation: "FedRAMP Tailored is a streamlined authorization process specifically designed for low-impact Software-as-a-Service (SaaS) solutions.",
                category: "FedRAMP"
            },
            {
                question: "How many control domains are included in CSA Cloud Controls Matrix (CCM) version 4.0?",
                options: ["14 domains", "17 domains", "19 domains", "21 domains"],
                correct: 1,
                explanation: "CSA Cloud Controls Matrix (CCM) 4.0 contains 17 domains with 197 control objectives mapped to various compliance frameworks.",
                category: "Standards"
            },
            {
                question: "In ISO 27001, Annex A contains how many security controls across how many domains?",
                options: ["93 controls in 11 domains", "114 controls in 14 domains", "135 controls in 18 domains", "197 controls in 17 domains"],
                correct: 1,
                explanation: "ISO 27001 Annex A provides a list of 114 security controls organized across 14 domains that can be applied based on risk assessment.",
                category: "Standards"
            },
            {
                question: "Which HIPAA rule specifically addresses the protection of electronic Protected Health Information (ePHI)?",
                options: ["Privacy Rule", "Security Rule", "Breach Notification Rule", "Enforcement Rule"],
                correct: 1,
                explanation: "The HIPAA Security Rule specifically addresses the safeguards (administrative, physical, technical) required to protect electronic PHI.",
                category: "Regulatory Compliance"
            },
            {
                question: "What does HITRUST CSF stand for?",
                options: [
                    "Health IT Risk Unified Security Trust Framework",
                    "HITRUST Common Security Framework",
                    "Healthcare Information Trust Security Framework",
                    "Health Insurance Trust Unified Security Framework"
                ],
                correct: 1,
                explanation: "HITRUST CSF stands for HITRUST Common Security Framework, a comprehensive framework leveraging ISO, NIST, PCI, HIPAA, and GDPR.",
                category: "Standards"
            },
            {
                question: "Which AWS service continuously monitors resource configurations for compliance with rules?",
                options: ["AWS CloudTrail", "AWS Config", "AWS GuardDuty", "AWS Inspector"],
                correct: 1,
                explanation: "AWS Config records configuration changes and evaluates resources against rules to report compliance status and enable automatic remediation.",
                category: "Cloud Auditing"
            },
            {
                question: "Which PCI-DSS requirement specifically addresses the protection of stored cardholder data?",
                options: ["Requirement 1", "Requirement 3", "Requirement 6", "Requirement 10"],
                correct: 1,
                explanation: "PCI-DSS Requirement 3 focuses on protecting stored cardholder data through encryption and other security measures.",
                category: "Regulatory Compliance"
            },
            {
                question: "What is the primary difference between SOC 2 Type I and SOC 2 Type II reports?",
                options: [
                    "Type I is for cloud, Type II is for on-premises",
                    "Type I tests design at a point in time, Type II tests operating effectiveness over time",
                    "Type I is public, Type II is confidential",
                    "Type I covers 5 trust principles, Type II covers 3"
                ],
                correct: 1,
                explanation: "SOC 2 Type I evaluates control design at a specific point in time, while Type II evaluates operating effectiveness over a period of time (typically 6-12 months).",
                category: "Compliance Auditing"
            },
            {
                question: "According to GDPR, what is the maximum timeframe to report a data breach to supervisory authorities?",
                options: ["24 hours", "48 hours", "72 hours", "1 week"],
                correct: 2,
                explanation: "GDPR requires data controllers to report personal data breaches to the relevant supervisory authority within 72 hours of becoming aware of the breach.",
                category: "Regulatory Compliance"
            },
            {
                question: "What does FISMA stand for?",
                options: [
                    "Federal Information Security Management Act",
                    "Financial Information Security Mandate Act",
                    "Federal Infrastructure Security Monitoring Act",
                    "Financial Industry Security Management Act"
                ],
                correct: 0,
                explanation: "FISMA (Federal Information Security Management Act) is a U.S. federal law establishing guidelines and cybersecurity standards for government IT infrastructure.",
                category: "Regulatory Compliance"
            },
            {
                question: "In cloud penetration testing, which phase involves gathering information about the target without direct interaction?",
                options: ["Scanning", "Passive Reconnaissance", "Exploitation", "Post-Exploitation"],
                correct: 1,
                explanation: "Passive reconnaissance gathers information without directly interacting with the target (e.g., DNS records, OSINT, certificate transparency logs).",
                category: "Security Assessment"
            },
            {
                question: "Which Azure service enforces organizational standards and assesses compliance across Azure resources?",
                options: ["Azure Security Center", "Azure Policy", "Azure Sentinel", "Azure Monitor"],
                correct: 1,
                explanation: "Azure Policy enforces organizational standards by evaluating resources against policy definitions and can automatically remediate non-compliant resources.",
                category: "Cloud Auditing"
            },
            {
                question: "What are the four key pillars of cloud security governance?",
                options: [
                    "People, Process, Technology, Data",
                    "Roles & Responsibilities, Framework, Risk Management, Continuous Assessment",
                    "Identify, Protect, Detect, Respond",
                    "Administrative, Physical, Technical, Operational"
                ],
                correct: 1,
                explanation: "Cloud security governance pillars include: Roles & Responsibilities, Framework Selection, Risk Management, Security Controls, and Continuous Assessment.",
                category: "Governance"
            },
            // Review Questions from Previous Modules (3 questions)
            {
                question: "[M05 Review] What testing methodology analyzes application source code without executing the program?",
                options: ["DAST (Dynamic Application Security Testing)", "SAST (Static Application Security Testing)", "IAST (Interactive Application Security Testing)", "RASP (Runtime Application Self-Protection)"],
                correct: 1,
                explanation: "SAST (Static Application Security Testing) analyzes source code, bytecode, or binaries without executing the program, finding vulnerabilities early in development.",
                category: "M05: Application Security",
                isReview: true
            },
            {
                question: "[M06 Review] Which cloud security platform combines CSPM and CWPP capabilities into a unified solution?",
                options: ["SIEM", "SOAR", "CNAPP", "XDR"],
                correct: 2,
                explanation: "CNAPP (Cloud-Native Application Protection Platform) combines CSPM (Cloud Security Posture Management) and CWPP (Cloud Workload Protection Platform) capabilities.",
                category: "M06: Security Monitoring",
                isReview: true
            },
            {
                question: "[M07 Review] In risk response strategies, which approach involves purchasing cyber insurance?",
                options: ["Mitigate", "Avoid", "Accept", "Transfer"],
                correct: 3,
                explanation: "Transfer (or Share) means having someone else take on the risk, such as through cyber insurance policies or using managed cloud services.",
                category: "M07: Risk Assessment",
                isReview: true
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = [];

        function initQuiz() {
            renderQuestion();
            updateProgress();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContent');

            const reviewBadge = q.isReview ? '<span class="review-badge">Review Question</span>' : '';

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-number">Question ${currentQuestion + 1} of ${questions.length}</span>
                        <span class="question-category">${q.category}${reviewBadge}</span>
                    </div>
                    <p class="question-text">${q.question}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <div class="option" onclick="selectOption(${idx})" id="option${idx}">
                                <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="quiz-controls">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>Previous</button>
                        <button class="btn" onclick="nextQuestion()" id="nextBtn" disabled>Next</button>
                    </div>
                </div>
            `;

            if (answered[currentQuestion] !== undefined) {
                showAnswerState(answered[currentQuestion]);
            }
        }

        function selectOption(idx) {
            if (answered[currentQuestion] !== undefined) return;

            answered[currentQuestion] = idx;
            const q = questions[currentQuestion];
            const isCorrect = idx === q.correct;

            if (isCorrect) score++;

            showAnswerState(idx);
        }

        function showAnswerState(selectedIdx) {
            const q = questions[currentQuestion];
            const isCorrect = selectedIdx === q.correct;

            document.querySelectorAll('.option').forEach((opt, idx) => {
                opt.onclick = null;
                if (idx === q.correct) {
                    opt.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong><br>
                ${q.explanation}
            `;

            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                updateProgress();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                updateProgress();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizContent').style.display = 'none';
            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('scoreDisplay').textContent = percentage + '%';

            let message = '';
            if (percentage >= 90) {
                message = 'Outstanding! You have mastered Cloud Security Essentials!';
                document.getElementById('certBadge').style.display = 'inline-block';
            } else if (percentage >= 80) {
                message = 'Great job! You have a strong understanding of cloud compliance and governance.';
                document.getElementById('certBadge').style.display = 'inline-block';
            } else if (percentage >= 70) {
                message = 'Good work! Review regulatory requirements and compliance frameworks.';
            } else {
                message = 'Keep studying! Focus on GDPR, HIPAA, PCI-DSS, and cloud security standards.';
            }
            document.getElementById('scoreMessage').textContent = message;

            // Track in ProgressManager
            if (percentage >= 70 && typeof ProgressManager !== 'undefined') {
                ProgressManager.completeModule('cse-module08-quiz', 'cloud', 'quiz', { score: percentage });
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = [];
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('resultsCard').classList.remove('show');
            renderQuestion();
            updateProgress();
        }

        // Initialize quiz
        initQuiz();
    </script>

    <!-- Progress System -->
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
