<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 07: Risk Assessment Quiz - Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .module-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .module-nav a {
            background: rgba(138, 43, 226, 0.2);
            color: #da70d6;
            padding: 10px 25px;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(138, 43, 226, 0.4);
            transition: all 0.3s ease;
        }

        .module-nav a:hover, .module-nav a.active {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .quiz-header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #da70d6, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .quiz-header p {
            color: #ba55d3;
            font-size: 1.2em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #8a2be2, #da70d6);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.1), rgba(75, 0, 130, 0.05));
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
        }

        .question-category {
            color: #ba55d3;
            font-size: 0.85em;
        }

        .review-badge {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 10px;
        }

        .question-text {
            font-size: 1.15em;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(138, 43, 226, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: #8a2be2;
            background: rgba(138, 43, 226, 0.2);
        }

        .option.selected {
            border-color: #8a2be2;
            background: rgba(138, 43, 226, 0.25);
        }

        .option.correct {
            border-color: #32cd32;
            background: rgba(50, 205, 50, 0.2);
        }

        .option.incorrect {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
        }

        .option-letter {
            background: rgba(138, 43, 226, 0.3);
            color: #da70d6;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option.selected .option-letter {
            background: #8a2be2;
            color: white;
        }

        .option.correct .option-letter {
            background: #32cd32;
            color: white;
        }

        .option.incorrect .option-letter {
            background: #ff4444;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct {
            background: rgba(50, 205, 50, 0.15);
            border-left: 4px solid #32cd32;
            display: block;
        }

        .feedback.incorrect {
            background: rgba(255, 68, 68, 0.15);
            border-left: 4px solid #ff4444;
            display: block;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
        }

        .results-card {
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.15), rgba(75, 0, 130, 0.1));
            border: 2px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .results-card.show {
            display: block;
        }

        .score-display {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #da70d6, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .score-message {
            font-size: 1.3em;
            color: #ba55d3;
            margin-bottom: 30px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }

        @media (max-width: 768px) {
            .quiz-header h1 {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="module-nav">
            <a href="cloud-cse-module07.presentation.html">Presentation</a>
            <a href="cloud-cse-module07.lab.html">Hands-On Lab</a>
            <a href="cloud-cse-module07.quiz.html" class="active">Quiz</a>
        </div>

        <div class="quiz-header">
            <h1>Risk Assessment & Management Quiz</h1>
            <p>Module 07 - Test Your Knowledge</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div id="quizContent"></div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete!</h2>
            <div class="score-display" id="scoreDisplay">0%</div>
            <p class="score-message" id="scoreMessage"></p>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="restartQuiz()">Retake Quiz</button>
                <a href="cloud-cse-module08.presentation.html" class="nav-btn">Next Module →</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // Module 07 Core Questions (17 questions)
            {
                question: "According to Gartner, what percentage of cloud security failures through 2025 will be due to human error?",
                options: ["75%", "85%", "95%", "99%"],
                correct: 3,
                explanation: "Gartner predicts that through 2025, 99% of all cloud security failures will be due to some level of human error, emphasizing the importance of training and automation.",
                category: "Cloud Security Risks"
            },
            {
                question: "What is the formula for calculating Annualized Loss Expectancy (ALE)?",
                options: ["ALE = AV × EF", "ALE = SLE × ARO", "ALE = ARO ÷ SLE", "ALE = Risk × Impact"],
                correct: 1,
                explanation: "ALE = SLE × ARO. Annualized Loss Expectancy equals Single Loss Expectancy multiplied by Annualized Rate of Occurrence.",
                category: "Quantitative Risk"
            },
            {
                question: "In the NIST Risk Management Framework (SP 800-37), what is the first step?",
                options: ["Categorize", "Prepare", "Select", "Assess"],
                correct: 1,
                explanation: "The RMF begins with Prepare, which involves defining the risk management strategy and risk tolerance, followed by Categorize, Select, Implement, Assess, Authorize, and Monitor.",
                category: "Risk Frameworks"
            },
            {
                question: "Which risk response involves purchasing cyber insurance to handle potential losses?",
                options: ["Mitigate", "Avoid", "Accept", "Transfer"],
                correct: 3,
                explanation: "Transfer (or Share) means having someone else take on the risk, such as through cyber insurance or using managed cloud services.",
                category: "Risk Response"
            },
            {
                question: "What is the key difference between BCP (Business Continuity Plan) and DRP (Disaster Recovery Plan)?",
                options: [
                    "BCP is for IT, DRP is for business operations",
                    "BCP maintains operations during disaster, DRP restores IT after disaster",
                    "BCP is required by law, DRP is optional",
                    "BCP is for cloud, DRP is for on-premises"
                ],
                correct: 1,
                explanation: "BCP focuses on keeping business operational DURING a disaster, while DRP focuses on restoring IT infrastructure AFTER a disaster.",
                category: "BCP/DRP"
            },
            {
                question: "If an asset is valued at $5,000,000 and the exposure factor for a specific threat is 40%, what is the Single Loss Expectancy (SLE)?",
                options: ["$1,000,000", "$2,000,000", "$3,000,000", "$4,000,000"],
                correct: 1,
                explanation: "SLE = Asset Value × Exposure Factor = $5,000,000 × 0.40 = $2,000,000",
                category: "Quantitative Risk"
            },
            {
                question: "Which type of risk assessment uses probability/impact ranking matrices and is quicker to implement?",
                options: ["Quantitative", "Qualitative", "Hybrid", "Statistical"],
                correct: 1,
                explanation: "Qualitative risk analysis is subjective and quick to implement, using probability/impact ranking matrices to classify risks by source or effect.",
                category: "Risk Assessment"
            },
            {
                question: "What does the 'R' in DREAD threat modeling stand for?",
                options: ["Risk", "Reproducibility", "Recovery", "Remediation"],
                correct: 1,
                explanation: "DREAD = Damage potential, Reproducibility, Exploitability, Affected users, Discoverability. Reproducibility measures how easy it is to reproduce the attack.",
                category: "Threat Modeling"
            },
            {
                question: "In the NIST RMF, which tier represents the Information Systems level?",
                options: ["Tier 1", "Tier 2", "Tier 3", "Tier 4"],
                correct: 2,
                explanation: "Tier 3 is the Information Systems level, focusing on operational security and system-level controls. Tier 1 is Organization, Tier 2 is Mission/Business Process.",
                category: "Risk Frameworks"
            },
            {
                question: "What is residual risk?",
                options: [
                    "The initial risk before any controls are applied",
                    "The risk that remains after controls have been implemented",
                    "The maximum possible risk exposure",
                    "Risk that has been transferred to a third party"
                ],
                correct: 1,
                explanation: "Residual risk is the risk that remains after risk response and controls have been implemented. It should be within the organization's risk tolerance.",
                category: "Risk Concepts"
            },
            {
                question: "Which of the following is NOT a valid risk response strategy?",
                options: ["Mitigate", "Avoid", "Ignore", "Transfer"],
                correct: 2,
                explanation: "The four valid risk responses are: Mitigate, Avoid, Accept, and Transfer. Ignoring risk is NEVER a valid response strategy.",
                category: "Risk Response"
            },
            {
                question: "A company experiences one data breach every 2.5 years on average. What is the Annualized Rate of Occurrence (ARO)?",
                options: ["0.25", "0.40", "0.50", "2.50"],
                correct: 1,
                explanation: "ARO = 1 ÷ 2.5 = 0.40 occurrences per year.",
                category: "Quantitative Risk"
            },
            {
                question: "Which component of a Business Continuity Plan identifies and quantifies the impact of business function loss?",
                options: ["Risk Mitigation", "BCP Team", "Business Impact Analysis (BIA)", "Continuity Strategies"],
                correct: 2,
                explanation: "Business Impact Analysis (BIA) identifies, quantifies, and qualifies the impact of a loss, interruption, or disruption to critical business functions.",
                category: "BCP/DRP"
            },
            {
                question: "What does RTO stand for in disaster recovery planning?",
                options: [
                    "Recovery Time Objective",
                    "Real-Time Operations",
                    "Risk Tolerance Optimization",
                    "Restoration Target Order"
                ],
                correct: 0,
                explanation: "RTO (Recovery Time Objective) is the maximum acceptable downtime for a system or process. RPO (Recovery Point Objective) is the maximum acceptable data loss.",
                category: "BCP/DRP"
            },
            {
                question: "In STRIDE threat modeling, what does the 'E' represent?",
                options: ["Exploitation", "Elevation of Privilege", "Encryption Bypass", "Error Injection"],
                correct: 1,
                explanation: "STRIDE = Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege.",
                category: "Threat Modeling"
            },
            {
                question: "Which vulnerability scanning metric indicates a vulnerability is being actively exploited in the wild?",
                options: ["CVSS Score", "Exploit DB Entry", "KEV (Known Exploited Vulnerabilities) List", "CVE Age"],
                correct: 2,
                explanation: "The KEV (Known Exploited Vulnerabilities) list, maintained by CISA, identifies vulnerabilities that are actively being exploited in the wild and require immediate remediation.",
                category: "Vulnerability Assessment"
            },
            {
                question: "If the SLE is $500,000 and the ARO is 0.20, what is the annual expected loss (ALE)?",
                options: ["$50,000", "$100,000", "$250,000", "$2,500,000"],
                correct: 1,
                explanation: "ALE = SLE × ARO = $500,000 × 0.20 = $100,000 per year.",
                category: "Quantitative Risk"
            },
            // Review Questions from Previous Modules (3 questions)
            {
                question: "[M04 Review] What is the primary difference between a NACL and a Security Group in AWS?",
                options: [
                    "NACLs are stateful, Security Groups are stateless",
                    "NACLs are stateless and operate at subnet level, Security Groups are stateful and operate at instance level",
                    "NACLs only filter inbound traffic",
                    "Security Groups cannot deny traffic"
                ],
                correct: 1,
                explanation: "NACLs are stateless (evaluate each packet independently) and operate at the subnet level. Security Groups are stateful (track connections) and operate at the instance/ENI level.",
                category: "M04: Network Security",
                isReview: true
            },
            {
                question: "[M05 Review] Which OWASP Top 10 vulnerability involves attackers injecting malicious scripts that execute in users' browsers?",
                options: ["SQL Injection", "Cross-Site Scripting (XSS)", "CSRF", "SSRF"],
                correct: 1,
                explanation: "Cross-Site Scripting (XSS) allows attackers to inject malicious scripts into web pages viewed by other users, executing in their browsers.",
                category: "M05: Application Security",
                isReview: true
            },
            {
                question: "[M06 Review] What does SOAR stand for in security operations?",
                options: [
                    "Security Orchestration, Automation, and Response",
                    "System Operations and Risk",
                    "Security Operations and Remediation",
                    "Synchronized Operational Alert Response"
                ],
                correct: 0,
                explanation: "SOAR (Security Orchestration, Automation, and Response) automates incident response workflows through playbooks and integrates with security tools.",
                category: "M06: Security Monitoring",
                isReview: true
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = [];

        function initQuiz() {
            renderQuestion();
            updateProgress();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContent');

            const reviewBadge = q.isReview ? '<span class="review-badge">Review Question</span>' : '';

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-number">Question ${currentQuestion + 1} of ${questions.length}</span>
                        <span class="question-category">${q.category}${reviewBadge}</span>
                    </div>
                    <p class="question-text">${q.question}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <div class="option" onclick="selectOption(${idx})" id="option${idx}">
                                <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="quiz-controls">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>Previous</button>
                        <button class="btn" onclick="nextQuestion()" id="nextBtn" disabled>Next</button>
                    </div>
                </div>
            `;

            if (answered[currentQuestion] !== undefined) {
                showAnswerState(answered[currentQuestion]);
            }
        }

        function selectOption(idx) {
            if (answered[currentQuestion] !== undefined) return;

            answered[currentQuestion] = idx;
            const q = questions[currentQuestion];
            const isCorrect = idx === q.correct;

            if (isCorrect) score++;

            showAnswerState(idx);
        }

        function showAnswerState(selectedIdx) {
            const q = questions[currentQuestion];
            const isCorrect = selectedIdx === q.correct;

            document.querySelectorAll('.option').forEach((opt, idx) => {
                opt.onclick = null;
                if (idx === q.correct) {
                    opt.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong><br>
                ${q.explanation}
            `;

            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                updateProgress();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                updateProgress();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizContent').style.display = 'none';
            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('scoreDisplay').textContent = percentage + '%';

            let message = '';
            if (percentage >= 90) {
                message = 'Outstanding! You have mastered cloud risk assessment and management!';
            } else if (percentage >= 80) {
                message = 'Great job! You have a strong understanding of risk frameworks and analysis.';
            } else if (percentage >= 70) {
                message = 'Good work! Review ALE calculations and risk response strategies.';
            } else {
                message = 'Keep studying! Focus on NIST RMF, quantitative analysis, and BCP/DRP concepts.';
            }
            document.getElementById('scoreMessage').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = [];
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('resultsCard').classList.remove('show');
            renderQuestion();
            updateProgress();
        }

        // Initialize quiz
        initQuiz();
    </script>
</body>
</html>
