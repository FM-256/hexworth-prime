    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);

            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);

            align-items: center;
        }
        .page-header a {
            color: #38bdf8;

            transition: color 0.2s;
        }

</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'AWS Storage Services Quiz',
            description: 'Chapter 8: S3, EBS, EFS, and Storage Gateway',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'ch08-storage',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the maximum size of an individual object that can be stored in Amazon S3?',
                    options: [
                        '5 GB',
                        '5 TB',
                        '50 TB',
                        'Unlimited'
                    ],
                    correct: 1,
                    explanation: 'The maximum size of an individual object in Amazon S3 is 5 TB (terabytes). For objects larger than 5 GB, you must use multipart upload. While S3 itself has virtually unlimited storage capacity, individual objects are limited to 5 TB.'
                },
                {
                    question: 'Which AWS storage service provides block-level storage volumes for use with EC2 instances?',
                    options: [
                        'Amazon S3',
                        'Amazon EBS',
                        'Amazon EFS',
                        'Amazon Glacier'
                    ],
                    correct: 1,
                    explanation: 'Amazon EBS (Elastic Block Store) provides persistent block-level storage volumes for EC2 instances. Unlike S3 (object storage) or EFS (file storage), EBS volumes can be attached to a single EC2 instance at a time (except with Multi-Attach) and provide low-latency access for databases and applications.'
                },
                {
                    question: 'What is the durability guarantee of Amazon S3 Standard storage class?',
                    options: [
                        '99.9% (3 nines)',
                        '99.99% (4 nines)',
                        '99.999999999% (11 nines)',
                        '100%'
                    ],
                    correct: 2,
                    explanation: 'Amazon S3 Standard provides 99.999999999% (11 nines) durability, which means if you store 10 million objects, you can expect to lose one object every 10,000 years on average. This is achieved by automatically storing data redundantly across multiple facilities.'
                },
                {
                    question: 'Which storage service allows multiple EC2 instances to access the same file system simultaneously?',
                    options: [
                        'Amazon EBS',
                        'Amazon S3',
                        'Amazon EFS',
                        'Amazon Glacier'
                    ],
                    correct: 2,
                    explanation: 'Amazon EFS (Elastic File System) is designed to provide shared file storage that can be accessed simultaneously by thousands of EC2 instances. EBS volumes are typically attached to a single instance, while S3 is object storage accessed via APIs, not as a mounted file system.'
                },
                {
                    question: 'What is the pricing model for Amazon EBS?',
                    options: [
                        'Pay only for storage used',
                        'Pay for storage provisioned',
                        'Pay per request',
                        'Free tier only'
                    ],
                    correct: 1,
                    explanation: 'Amazon EBS charges based on the amount of storage you provision, not the amount you actually use. If you create a 100 GB EBS volume, you pay for 100 GB whether you use all of it or not. This is different from S3 and EFS, which charge based on actual storage used.'
                },
                {
                    question: 'Which S3 storage class is most cost-effective for long-term archival data that is rarely accessed?',
                    options: [
                        'S3 Standard',
                        'S3 Intelligent-Tiering',
                        'S3 Glacier Deep Archive',
                        'S3 One Zone-IA'
                    ],
                    correct: 2,
                    explanation: 'S3 Glacier Deep Archive is the lowest-cost storage class in AWS, designed for data that is retained for 7-10 years or longer. It costs about $1 per TB per month, but has retrieval times of 12-48 hours. It\'s ideal for compliance archives and long-term backups.'
                },
                {
                    question: 'What is the primary use case for AWS Storage Gateway?',
                    options: [
                        'Storing objects in S3',
                        'Creating EBS snapshots',
                        'Integrating on-premises storage with AWS',
                        'Hosting static websites'
                    ],
                    correct: 2,
                    explanation: 'AWS Storage Gateway is a hybrid cloud storage service that provides on-premises applications with seamless access to AWS cloud storage. It\'s primarily used for backup, disaster recovery, and cloud migration scenarios where you need to integrate on-premises infrastructure with AWS.'
                },
                {
                    question: 'Which EBS volume type provides the highest performance for mission-critical, low-latency workloads?',
                    options: [
                        'gp3 (General Purpose SSD)',
                        'io2 (Provisioned IOPS SSD)',
                        'st1 (Throughput Optimized HDD)',
                        'sc1 (Cold HDD)'
                    ],
                    correct: 1,
                    explanation: 'io2 (Provisioned IOPS SSD) volumes provide the highest performance with up to 64,000 IOPS and 99.999% durability. They are designed for mission-critical applications like large databases (Oracle, SQL Server, MongoDB) that require consistent, low-latency performance.'
                },
                {
                    question: 'What happens to data on an EBS volume when the attached EC2 instance is stopped (not terminated)?',
                    options: [
                        'Data is lost',
                        'Data is automatically backed up to S3',
                        'Data persists and will be available when instance restarts',
                        'Data is moved to Glacier'
                    ],
                    correct: 2,
                    explanation: 'EBS volumes persist independently from EC2 instances. When you stop (but not terminate) an instance, the EBS volume data remains intact and will be available when you restart the instance. However, data on instance store volumes (ephemeral storage) is lost when the instance is stopped.'
                },
                {
                    question: 'Which Amazon EFS performance mode should you choose if you need the lowest latency for file operations?',
                    options: [
                        'Max I/O mode',
                        'General Purpose mode',
                        'Bursting mode',
                        'Provisioned mode'
                    ],
                    correct: 1,
                    explanation: 'General Purpose performance mode provides the lowest latency per file operation and is recommended for most workloads. Max I/O mode can scale to higher aggregate throughput and IOPS but has slightly higher latency per operation. It\'s only needed when thousands of EC2 instances are accessing the file system simultaneously.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
