<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Storage Services Quiz - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'AWS Storage Services Quiz',
            description: 'Chapter 8: S3, EBS, EFS, and Storage Gateway',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'ch08-storage',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the maximum size of an individual object that can be stored in Amazon S3?',
                    options: [
                        '5 GB',
                        '5 TB',
                        '50 TB',
                        'Unlimited'
                    ]
                },
                {
                    question: 'Which AWS storage service provides block-level storage volumes for use with EC2 instances?',
                    options: [
                        'Amazon S3',
                        'Amazon EBS',
                        'Amazon EFS',
                        'Amazon Glacier'
                    ]
                },
                {
                    question: 'What is the durability guarantee of Amazon S3 Standard storage class?',
                    options: [
                        '99.9% (3 nines)',
                        '99.99% (4 nines)',
                        '99.999999999% (11 nines)',
                        '100%'
                    ]
                },
                {
                    question: 'Which storage service allows multiple EC2 instances to access the same file system simultaneously?',
                    options: [
                        'Amazon EBS',
                        'Amazon S3',
                        'Amazon EFS',
                        'Amazon Glacier'
                    ]
                },
                {
                    question: 'What is the pricing model for Amazon EBS?',
                    options: [
                        'Pay only for storage used',
                        'Pay for storage provisioned',
                        'Pay per request',
                        'Free tier only'
                    ]
                },
                {
                    question: 'Which S3 storage class is most cost-effective for long-term archival data that is rarely accessed?',
                    options: [
                        'S3 Standard',
                        'S3 Intelligent-Tiering',
                        'S3 Glacier Deep Archive',
                        'S3 One Zone-IA'
                    ],
                    explanation: 'S3 Glacier Deep Archive is the lowest-cost storage class in AWS, designed for data that is retained for 7-10 years or longer. It costs about $1 per TB per month, but has retrieval times of 12-48 hours. It\'s ideal for compliance archives and long-term backups.'
                },
                {
                    question: 'What is the primary use case for AWS Storage Gateway?',
                    options: [
                        'Storing objects in S3',
                        'Creating EBS snapshots',
                        'Integrating on-premises storage with AWS',
                        'Hosting static websites'
                    ],
                    explanation: 'AWS Storage Gateway is a hybrid cloud storage service that provides on-premises applications with seamless access to AWS cloud storage. It\'s primarily used for backup, disaster recovery, and cloud migration scenarios where you need to integrate on-premises infrastructure with AWS.'
                },
                {
                    question: 'Which EBS volume type provides the highest performance for mission-critical, low-latency workloads?',
                    options: [
                        'gp3 (General Purpose SSD)',
                        'io2 (Provisioned IOPS SSD)',
                        'st1 (Throughput Optimized HDD)',
                        'sc1 (Cold HDD)'
                    ]
                },
                {
                    question: 'What happens to data on an EBS volume when the attached EC2 instance is stopped (not terminated)?',
                    options: [
                        'Data is lost',
                        'Data is automatically backed up to S3',
                        'Data persists and will be available when instance restarts',
                        'Data is moved to Glacier'
                    ]
                },
                {
                    question: 'Which Amazon EFS performance mode should you choose if you need the lowest latency for file operations?',
                    options: [
                        'Max I/O mode',
                        'General Purpose mode',
                        'Bursting mode',
                        'Provisioned mode'
                    ],
                    explanation: 'General Purpose performance mode provides the lowest latency per file operation and is recommended for most workloads. Max I/O mode can scale to higher aggregate throughput and IOPS but has slightly higher latency per operation. It\'s only needed when thousands of EC2 instances are accessing the file system simultaneously.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
