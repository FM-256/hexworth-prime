<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../components/FirebaseAuth.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'IAM in Cloud',
            description: 'CSE Module 02 - Identity and Access Management',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module02',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'In the shared responsibility model, which security aspect is ALWAYS the customer\'s responsibility regardless of service model (IaaS, PaaS, or SaaS)?',
                    options: [
                        'Network infrastructure',
                        'Identity and access management',
                        'Physical data center security',
                        'Hypervisor patching'
                    ],
                    explanation: 'Identity and access management (IAM) is always the customer\'s responsibility across all service models. The CSP provides IAM tools, but you define and manage identities, roles, and access policies.'
                },
                {
                    question: 'Who is responsible for configuring MFA for administrator accounts?',
                    options: [
                        'Your company (the customer)',
                        'AWS (the cloud service provider)',
                        'The network hardware vendor',
                        'Shared equally between AWS and customer'
                    ],
                    explanation: 'In IaaS (and all service models), configuring MFA and managing user authentication is the customer\'s responsibility. AWS provides the MFA capability, but enabling and enforcing it is your job.'
                },
                {
                    question: 'What is the correct order of the AAA framework in access control?',
                    options: [
                        'Authentication → Authorization → Accounting',
                        'Authentication → Accounting → Authorization',
                        'Accounting → Authentication → Authorization',
                        'Authorization → Authentication → Accounting'
                    ]
                },
                {
                    question: 'Which term describes the process of VERIFYING what actions a user is permitted to perform?',
                    options: [
                        'Accounting',
                        'Authorization',
                        'Authentication',
                        'Identification'
                    ],
                    explanation: 'Authorization (AuthZ) verifies what you\'re allowed to do - checking roles and permissions. Authentication (AuthN) proves who you are. These are distinct but related processes.'
                },
                {
                    question: 'What is a key limitation of legacy IAM systems compared to modern IAM?',
                    options: [
                        'Legacy IAM has built-in MFA support',
                        'Legacy IAM uses centralized identity databases',
                        'Legacy IAM typically does not support Single Sign-On',
                        'Legacy IAM provides real-time risk analytics'
                    ],
                    explanation: 'Legacy IAM systems typically don\'t support SSO, requiring users to maintain multiple passwords. Modern IAM enables seamless SSO across applications with centralized identity management.'
                },
                {
                    question: 'Your team needs a CI/CD pipeline to authenticate to the cloud and deploy resources automatically, with no human signing in. Which principal type should you use for this automation?',
                    options: [
                        'User account with saved credentials',
                        'External Identity',
                        'Service Principal',
                        'Reader account'
                    ],
                    explanation: 'Service principals are non-human identities that authenticate and link resources for automation such as CI/CD pipelines and API integrations. A user account with saved credentials is a credential-hygiene risk, and External Identity and Reader account do not describe automation principals.'
                },
                {
                    question: 'In Azure, what is a \'Managed Identity\'?',
                    options: [
                        'A user account managed by IT helpdesk',
                        'A predefined identity assigned to Azure resources for automatic authentication',
                        'An identity managed by an external provider',
                        'A guest account from a partner company'
                    ]
                },
                {
                    question: 'In RBAC, what determines the set of resources a role assignment applies to?',
                    options: [
                        'The role definition name',
                        'The scope (resource, resource group, subscription)',
                        'The tenant ID',
                        'The user'
                    ]
                },
                {
                    question: 'A developer must create and manage virtual machines and storage for a project but must not be able to grant anyone else access. Which built-in role is most appropriate?',
                    options: [
                        'User Access Administrator',
                        'Contributor',
                        'Reader',
                        'Owner'
                    ],
                    explanation: 'Contributor can create and manage resources but cannot grant access to others. Owner adds access management; Reader is view-only; User Access Administrator manages access, not resources.'
                },
                {
                    question: 'An auditor needs to review cloud resources and generate compliance reports but should not modify anything. Which role is appropriate?',
                    options: [
                        'Reader',
                        'Owner',
                        'Contributor',
                        'Security Administrator'
                    ]
                },
                {
                    question: 'What is the primary benefit of hybrid identity federation?',
                    options: [
                        'Removes the need for MFA',
                        'Users authenticate once and access both cloud and on-premises apps',
                        'Automatically migrates all users to cloud-only',
                        'Eliminates the need for on-premises Active Directory'
                    ]
                },
                {
                    question: 'A company launches a consumer mobile app where customers sign in with their existing Google or Facebook accounts. Which federation type supports this scenario?',
                    options: [
                        'Business-to-Consumer (B2C)',
                        'Hybrid Federation',
                        'Business-to-Business (B2B)',
                        'Multicloud Federation'
                    ],
                    explanation: 'Business-to-Consumer (B2C) federation lets consumers authenticate with external identity providers such as Google or Facebook. B2B is partner-to-partner trust, hybrid links on-premises AD with cloud, and multicloud spans cloud providers.'
                },
                {
                    question: 'By default, how long can a user stay signed in to the AWS access portal before IAM Identity Center requires re-authentication?',
                    options: [
                        '7 days',
                        '1 hour',
                        '24 hours',
                        '8 hours'
                    ],
                    explanation: 'The default session duration for AWS access portal user interactive sessions is 8 hours, configurable from 15 minutes up to 90 days. Don\'t confuse this with the permission set session duration for AWS account access, which defaults to 1 hour with a 12-hour maximum.'
                },
                {
                    question: 'What is a key security benefit of Self-Service Password Reset (SSPR)?',
                    options: [
                        'Automatically generates strong passwords',
                        'Removes the need for MFA',
                        'Eliminates the need for passwords entirely',
                        'Reduces social engineering attacks targeting helpdesk'
                    ]
                },
                {
                    question: 'Which combination represents valid multi-factor authentication?',
                    options: [
                        'Password + Security Question (both \'something you know\')',
                        'Password + Fingerprint scan',
                        'PIN + Password',
                        'Two different passwords'
                    ],
                    explanation: 'True MFA requires factors from different categories. Password (know) + Fingerprint (are) uses two different factor types. Password + Security Question are both \'something you know\' - not true MFA.'
                },
                {
                    question: 'What percentage of automated attacks does MFA typically block?',
                    options: [
                        '50%',
                        '90%',
                        '75%',
                        '99.9%'
                    ]
                },
                {
                    question: 'What does \'Just In Time\' (JIT) access mean?',
                    options: [
                        'Access is granted only when needed and expires after a set time',
                        'Access is granted to the just-in-time inventory system',
                        'Access is granted permanently but logged',
                        'Access is granted without approval'
                    ]
                },
                {
                    question: 'If a user attempts to access sensitive data from an unmanaged device in an unusual location, what should the policy enforce?',
                    options: [
                        'Notify IT but allow access',
                        'Grant read-only access automatically',
                        'Block access or require additional verification (MFA)',
                        'Allow full access since the user is authenticated'
                    ]
                },
                {
                    question: 'What type of analysis detects when a user logs in from New York and then from Moscow 30 minutes later?',
                    options: [
                        'Activity Logging',
                        'Event Correlation',
                        'Identity Secure Score',
                        'Impossible Travel Detection (User Behavior Analytics)'
                    ],
                    explanation: 'User Behavior Analytics includes \'impossible travel\' detection - identifying logins from geographically impossible locations in short timeframes, indicating potential credential compromise.'
                },
                {
                    question: 'Why should IAM audit logs be integrated with a SIEM platform?',
                    options: [
                        'To replace the need for manual log review',
                        'To automatically fix security issues',
                        'To reduce storage costs',
                        'To correlate identity events with other security data for threat detection'
                    ],
                    explanation: 'SIEM integration allows correlation of IAM events with other security data. A suspicious login + unusual data access + after-hours activity together may indicate a breach that individual logs wouldn\'t reveal.'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
