<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-06: Security Monitoring & IR - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Security Monitoring & Incident Response',
            description: 'Test your knowledge of cloud monitoring and IR concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-06',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What are the three types of data you should log to identify threats in cloud environments?',
                    options: [
                        'Events, Activity, Metrics',
                        'Users, Groups, Roles',
                        'CPU, Memory, Storage',
                        'Input, Output, Process'
                    ],correct: 0, explanation: 'Cloud logging should capture Events (what\'s happening), Activity (who\'s doing what), and Metrics (how resources are performing) to identify potential threats and anomalies.'
                },
                {
                    question: 'Which AWS service is used for API audit logging and recording user activity?',
                    options: [
                        'CloudWatch',
                        'CloudTrail',
                        'Inspector',
                        'GuardDuty'
                    ],correct: 1, explanation: 'AWS CloudTrail records user activity and API calls across AWS services, enabling auditing, security monitoring, and operational troubleshooting.'
                },
                {
                    question: 'What is the primary purpose of SIEM?',
                    options: [
                        'Automate security responses',
                        'Aggregate information from disparate sources for analysis',
                        'Block malicious network traffic',
                        'Encrypt data at rest'
                    ],correct: 1, explanation: 'SIEM (Security Information and Event Management) aggregates information from disparate sources into a single platform for security incident analysis and investigation.'
                },
                {
                    question: 'What does SOAR stand for?',
                    options: [
                        'Security Operations and Risk',
                        'Security Orchestration and Automated Response',
                        'System Operations and Recovery',
                        'Security Oversight and Review'
                    ],correct: 1, explanation: 'SOAR stands for Security Orchestration and Automated Response. It works with SIEM to provide efficiency through playbooks and automation tools that respond to threats proactively.'
                },
                {
                    question: 'What is CSPM used for?',
                    options: [
                        'Managing cloud storage costs',
                        'Identifying security risks and misconfigurations in cloud infrastructure',
                        'Provisioning virtual machines',
                        'Monitoring employee productivity'
                    ],correct: 1, explanation: 'CSPM (Cloud Security Posture Management) is automated software that identifies security risks and misconfigurations in cloud infrastructure, including SaaS, PaaS, IaaS, containers, and serverless code.'
                },
                {
                    question: 'CNAPP combines which three security capabilities into one platform?',
                    options: [
                        'SIEM, SOAR, and EDR',
                        'CSPM, CWPP, and CIEM',
                        'IAM, MFA, and SSO',
                        'VPN, WAF, and DLP'
                    ],correct: 1, explanation: 'CNAPP (Cloud Native Application Protection Platform) combines CSPM (Cloud Security Posture Management), CWPP (Cloud Workload Protection Platform), and CIEM (Cloud Infrastructure Entitlement Management) into one platform.'
                },
                {
                    question: 'What is the correct order in the timeline of a security breach?',
                    options: [
                        'Incident > Event > Breach',
                        'Breach > Event > Incident',
                        'Event > Incident > Breach',
                        'Incident > Breach > Event'
                    ],correct: 2, explanation: 'The timeline is: Event (anomaly identified) > Incident (verified malicious activity) > Breach (sensitive information accessed and communication plan activated).'
                },
                {
                    question: 'Which Azure service provides centralized management of multi-cloud and on-premises resources?',
                    options: [
                        'Azure Monitor',
                        'Azure Arc',
                        'Log Analytics',
                        'Network Watcher'
                    ],correct: 1, explanation: 'Azure Arc provides centralized management and governance of multi-cloud and on-premises resources into Azure, managing VMs, containers, and databases with consistent management tools.'
                },
                {
                    question: 'What must an Incident Response Plan include?',
                    options: [
                        'Only technical remediation steps',
                        'Definition of incident, roles, process, and communication plan',
                        'Just the escalation phone numbers',
                        'Only the IT team contacts'
                    ],correct: 1, explanation: 'An IR Plan must include: definition of an incident, roles and responsibilities, process from detection to resolution, communication plan, and understanding of legal/regulatory notification requirements.'
                },
                {
                    question: 'How should incidents be prioritized?',
                    options: [
                        'By cost of resolution',
                        'By urgency and impact (High-High first)',
                        'By department affected',
                        'By time of occurrence'
                    ],correct: 1, explanation: 'Incidents should be prioritized based on Urgency and Impact using Low-Medium-High levels. High-High identified incidents (high urgency and high impact) should be addressed first.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
