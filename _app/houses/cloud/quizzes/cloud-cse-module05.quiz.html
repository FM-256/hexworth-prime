<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 05 Quiz: Application Security | Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .quiz-header {
            text-align: center;
            padding: 30px;
            background: rgba(233, 30, 99, 0.1);
            border: 1px solid rgba(233, 30, 99, 0.3);
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .quiz-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #e91e63, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quiz-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            color: #888;
        }

        .quiz-meta span { color: #e91e63; }

        .progress-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e91e63, #f48fb1);
            transition: width 0.3s ease;
        }

        .question-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(233, 30, 99, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            display: none;
        }

        .question-card.active { display: block; }

        .question-number {
            font-size: 0.9rem;
            color: #e91e63;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .question-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        .cat-sdlc { background: rgba(233, 30, 99, 0.2); color: #f48fb1; }
        .cat-waf { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .cat-owasp { background: rgba(244, 67, 54, 0.2); color: #ef5350; }
        .cat-testing { background: rgba(156, 39, 176, 0.2); color: #ce93d8; }
        .cat-serverless { background: rgba(33, 150, 243, 0.2); color: #64b5f6; }
        .cat-container { background: rgba(0, 188, 212, 0.2); color: #4dd0e1; }
        .cat-review { background: rgba(76, 175, 80, 0.2); color: #81c784; }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px 20px;
            background: rgba(233, 30, 99, 0.05);
            border: 2px solid rgba(233, 30, 99, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover:not(.disabled) {
            border-color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
        }

        .option.selected {
            border-color: #e91e63;
            background: rgba(233, 30, 99, 0.15);
        }

        .option.correct {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.2);
        }

        .option.incorrect {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .option.disabled { cursor: not-allowed; }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(233, 30, 99, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #e91e63;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-left: 4px solid #e91e63;
            display: none;
        }

        .explanation.show { display: block; }

        .explanation h4 {
            color: #e91e63;
            margin-bottom: 10px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .nav-btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: 2px solid #e91e63;
            background: transparent;
            color: #e91e63;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: #e91e63;
            color: #0a0a0f;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .results-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(233, 30, 99, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .results-card.active { display: block; }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid #e91e63;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
        }

        .score-circle.pass { border-color: #4caf50; }
        .score-circle.fail { border-color: #f44336; }

        .score-number {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .score-circle.pass .score-number { color: #4caf50; }
        .score-circle.fail .score-number { color: #f44336; }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 12px 24px;
            background: rgba(233, 30, 99, 0.2);
            border: 1px solid rgba(233, 30, 99, 0.4);
            border-radius: 8px;
            color: #e91e63;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(233, 30, 99, 0.4);
        }

        .section-breakdown {
            margin-top: 30px;
            text-align: left;
        }

        .section-breakdown h3 {
            color: #e91e63;
            margin-bottom: 15px;
        }

        .section-score {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(233, 30, 99, 0.2);
        }
    </style>
</head>
<body>
<a href="#" onclick="history.back(); return false;" class="back-btn" style="position:fixed;top:15px;left:15px;z-index:1000;color:#aaa;text-decoration:none;font-size:1.1rem;padding:6px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(10,10,18,0.85);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(10,10,18,0.85)'">&larr; Back</a>

    <div class="quiz-container">
        <div class="quiz-header">
            <h1>Module 05 Quiz: Application Security</h1>
            <p style="color: #888; margin-top: 10px;">Test your knowledge of cloud application security</p>
            <div class="quiz-meta">
                <div>Questions: <span>20</span></div>
                <div>Passing: <span>70%</span></div>
                <div>Difficulty: <span>Advanced</span></div>
            </div>
        </div>

        <div class="progress-section">
            <div style="display: flex; justify-content: space-between;">
                <span>Progress</span>
                <span id="progressText">Question 1 of 20</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 5%"></div>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete!</h2>
            <div class="score-circle" id="scoreCircle">
                <div class="score-number" id="scoreNumber">0%</div>
                <div>Score</div>
            </div>
            <p id="resultMessage"></p>

            <div class="section-breakdown" id="sectionBreakdown">
                <h3>Section Breakdown</h3>
            </div>

            <div class="nav-links">
                <a href="../presentations/cloud-cse-module05.presentation.html" class="nav-link">📊 Review Presentation</a>
                <a href="../labs/cloud-cse-module05.lab.html" class="nav-link">🔬 Practice in Lab</a>
                <a href="#" class="nav-link" onclick="resetQuiz(); return false;">🔄 Retake Quiz</a>
                <a href="../presentations/cloud-cse-module06.presentation.html" class="nav-link">➡️ Next Module</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // Section 1: Secure SDLC (Q1-3)
            {
                category: 'Secure SDLC',
                categoryClass: 'cat-sdlc',
                question: 'According to NIST SP 800-64, during which SDLC phase should threat modeling be performed?',
                options: [
                    'Initiation',
                    'Acquisition/Development',
                    'Operations/Maintenance',
                    'Disposal'
                ],
                correct: 1,
                explanation: 'Threat modeling should be performed during the Acquisition/Development phase when the system is being designed. This allows security controls to be built into the design rather than bolted on later.'
            },
            {
                category: 'Secure SDLC',
                categoryClass: 'cat-sdlc',
                question: 'The "3 R\'s" of secure software design include Reliability, Resiliency, and which third concept?',
                options: [
                    'Redundancy',
                    'Recovery',
                    'Replication',
                    'Responsiveness'
                ],
                correct: 1,
                explanation: 'The 3 R\'s are Reliability (functions as expected), Resiliency (withstands attacks), and Recovery (restores with minimal disruption). Recovery is critical for business continuity after security incidents.'
            },
            {
                category: 'Secure SDLC',
                categoryClass: 'cat-sdlc',
                question: 'What is the primary goal of DevSecOps?',
                options: [
                    'Replace security teams with automation',
                    'Integrate security throughout the development lifecycle',
                    'Delay security testing until production',
                    'Reduce development costs by eliminating security reviews'
                ],
                correct: 1,
                explanation: 'DevSecOps integrates security practices throughout the entire development lifecycle (CI/CD pipeline), rather than treating it as a separate phase. Security becomes everyone\'s responsibility.'
            },
            // Section 2: WAF (Q4-6)
            {
                category: 'WAF',
                categoryClass: 'cat-waf',
                question: 'At which OSI layer does a Web Application Firewall (WAF) operate?',
                options: [
                    'Layer 3 (Network)',
                    'Layer 4 (Transport)',
                    'Layer 7 (Application)',
                    'Layer 2 (Data Link)'
                ],
                correct: 2,
                explanation: 'WAF operates at Layer 7 (Application layer), inspecting HTTP/HTTPS traffic for application-level attacks like SQL injection and XSS. This is different from network firewalls that operate at Layer 3-4.'
            },
            {
                category: 'WAF',
                categoryClass: 'cat-waf',
                question: 'AWS WAF can be integrated with which AWS services? (Select the BEST answer)',
                options: [
                    'EC2 instances directly',
                    'Application Load Balancer and CloudFront',
                    'S3 buckets only',
                    'RDS databases'
                ],
                correct: 1,
                explanation: 'AWS WAF integrates with Application Load Balancer, CloudFront, and API Gateway. It cannot be attached directly to EC2 instances—it requires a front-end service that handles HTTP/HTTPS traffic.'
            },
            {
                category: 'WAF',
                categoryClass: 'cat-waf',
                question: 'Which attack type is WAF specifically designed to protect against?',
                options: [
                    'Brute force SSH attacks',
                    'SQL injection and Cross-Site Scripting (XSS)',
                    'DDoS volumetric attacks',
                    'Port scanning'
                ],
                correct: 1,
                explanation: 'WAF protects against application-layer attacks like SQL injection, XSS, CSRF, and code injection. DDoS volumetric attacks are handled by DDoS protection services (Shield, DDoS Standard), and network attacks by network firewalls.'
            },
            // Section 3: OWASP Top 10 (Q7-9)
            {
                category: 'OWASP Top 10',
                categoryClass: 'cat-owasp',
                question: 'Which vulnerability type moved from #1 to #3 in the OWASP Top 10 (2021)?',
                options: [
                    'Broken Access Control',
                    'Injection',
                    'Security Misconfiguration',
                    'Cryptographic Failures'
                ],
                correct: 1,
                explanation: 'Injection attacks (SQL, command, LDAP) dropped from #1 to #3 in 2021, while Broken Access Control rose to #1. This reflects improved developer awareness of injection and the persistent challenge of access control.'
            },
            {
                category: 'OWASP Top 10',
                categoryClass: 'cat-owasp',
                question: 'Which OWASP Top 10 (2021) vulnerability category is NEW and addresses issues in the design phase?',
                options: [
                    'A04: Insecure Design',
                    'A08: Software and Data Integrity Failures',
                    'A10: Server-Side Request Forgery',
                    'All of the above are new'
                ],
                correct: 0,
                explanation: 'A04: Insecure Design is a new category focusing on missing or ineffective security controls in the design phase. It emphasizes the need for threat modeling and secure design patterns before coding begins.'
            },
            {
                category: 'OWASP Top 10',
                categoryClass: 'cat-owasp',
                question: 'Which technology helps protect against ransomware by detecting threats at the endpoint?',
                options: [
                    'WAF',
                    'EDR/XDR',
                    'Load Balancer',
                    'VPC Peering'
                ],
                correct: 1,
                explanation: 'Endpoint Detection and Response (EDR) and Extended Detection and Response (XDR) detect and respond to threats at the endpoint level, including ransomware behaviors like mass file encryption.'
            },
            // Section 4: Security Testing (Q10-12)
            {
                category: 'Security Testing',
                categoryClass: 'cat-testing',
                question: 'Which security testing method analyzes source code without running the application?',
                options: [
                    'DAST (Dynamic Application Security Testing)',
                    'SAST (Static Application Security Testing)',
                    'RASP (Runtime Application Self-Protection)',
                    'IAST (Interactive Application Security Testing)'
                ],
                correct: 1,
                explanation: 'SAST (white box testing) analyzes source code, bytecode, or binaries without executing the application. It finds vulnerabilities early in development but may have higher false positives than dynamic testing.'
            },
            {
                category: 'Security Testing',
                categoryClass: 'cat-testing',
                question: '"Shift Left" security refers to:',
                options: [
                    'Moving security testing to later in the pipeline',
                    'Moving security testing earlier in the development lifecycle',
                    'Shifting responsibility to the operations team',
                    'Moving applications to the left side of the data center'
                ],
                correct: 1,
                explanation: 'Shift Left means integrating security earlier in the development process (to the "left" of a timeline diagram). Earlier detection means lower remediation costs and faster time to market.'
            },
            {
                category: 'Security Testing',
                categoryClass: 'cat-testing',
                question: 'RASP (Runtime Application Self-Protection) provides what unique capability?',
                options: [
                    'Scans code before it compiles',
                    'Tests APIs in staging environments',
                    'Detects and blocks attacks during runtime execution',
                    'Reviews code during pull requests'
                ],
                correct: 2,
                explanation: 'RASP runs inside the application and can detect and block attacks in real-time during production. Unlike SAST/DAST which are testing tools, RASP provides continuous protection.'
            },
            // Section 5: Serverless & API (Q13-15)
            {
                category: 'Serverless & API',
                categoryClass: 'cat-serverless',
                question: 'When securing AWS Lambda functions, where should secrets like database passwords be stored?',
                options: [
                    'Hardcoded in the function code',
                    'In environment variables in plain text',
                    'In AWS Secrets Manager or Parameter Store',
                    'In the function\'s /tmp directory'
                ],
                correct: 2,
                explanation: 'Secrets should be stored in AWS Secrets Manager or Systems Manager Parameter Store, never hardcoded in code or plain environment variables. These services provide encryption, rotation, and access control.'
            },
            {
                category: 'Serverless & API',
                categoryClass: 'cat-serverless',
                question: 'What is the security benefit of using API Gateway with Lambda functions?',
                options: [
                    'It provides DDoS protection and rate limiting',
                    'It eliminates the need for IAM roles',
                    'It encrypts the Lambda function code',
                    'It automatically patches Lambda runtime'
                ],
                correct: 0,
                explanation: 'API Gateway provides DDoS protection, rate limiting, authentication, and request validation. It acts as a secure front door for Lambda functions, reducing direct exposure to attacks.'
            },
            {
                category: 'Serverless & API',
                categoryClass: 'cat-serverless',
                question: 'Azure API Management (APIM) security best practices include:',
                options: [
                    'Exposing original backend URLs in responses',
                    'Removing rate limiting for better performance',
                    'Stripping response headers that expose technology stack',
                    'Disabling authentication for public APIs'
                ],
                correct: 2,
                explanation: 'APIM should strip or transform response headers that expose server versions, technology stack, or internal URLs. This reduces information leakage that could help attackers.'
            },
            // Section 6: Container Security (Q16-17)
            {
                category: 'Container Security',
                categoryClass: 'cat-container',
                question: 'Which container security practice helps prevent privilege escalation attacks?',
                options: [
                    'Running containers as root user',
                    'Running containers with restricted privileges (non-root)',
                    'Using the latest tag for images',
                    'Storing secrets in environment variables'
                ],
                correct: 1,
                explanation: 'Containers should run as non-root users with restricted privileges. Running as root allows attackers who compromise the container to potentially escape to the host system.'
            },
            {
                category: 'Container Security',
                categoryClass: 'cat-container',
                question: 'Using ":latest" image tags in Kubernetes is a security concern because:',
                options: [
                    'Latest images are always outdated',
                    'It prevents image caching',
                    'It creates unpredictable deployments and supply chain risks',
                    'Kubernetes does not support latest tags'
                ],
                correct: 2,
                explanation: 'Using :latest tags means you may deploy different versions at different times, making deployments unpredictable. It also increases supply chain attack risk since a compromised :latest image affects all deployments.'
            },
            // Section 7: Cumulative Review (Q18-20)
            {
                category: 'M02 Review',
                categoryClass: 'cat-review',
                question: '[M02 Review] When configuring Lambda functions, what IAM principle should be applied to execution roles?',
                options: [
                    'Administrative access for flexibility',
                    'Least privilege with one role per function',
                    'Shared roles across all functions',
                    'No IAM role required'
                ],
                correct: 1,
                explanation: 'Each Lambda function should have its own least-privileged IAM role with only the permissions required for that specific function. This limits blast radius if any single function is compromised.'
            },
            {
                category: 'M03 Review',
                categoryClass: 'cat-review',
                question: '[M03 Review] In a supply chain attack scenario, which M03 concept would help protect exfiltrated data?',
                options: [
                    'Data classification',
                    'Encryption at rest',
                    'Backup and recovery',
                    'All of the above'
                ],
                correct: 3,
                explanation: 'Data classification identifies sensitive data, encryption at rest protects it if exfiltrated, and backups enable recovery. All three M03 concepts apply to supply chain attack mitigation and response.'
            },
            {
                category: 'M04 Review',
                categoryClass: 'cat-review',
                question: '[M04 Review] In a defense-in-depth architecture, what is the correct order for traffic inspection?',
                options: [
                    'WAF → Network Firewall → Application',
                    'Application → WAF → Network Firewall',
                    'Network Firewall → WAF → Application',
                    'WAF → Application → Network Firewall'
                ],
                correct: 2,
                explanation: 'Traffic should flow through Network Firewall (L3-4 filtering) first, then WAF (L7 application inspection), and finally to the application. This provides layered defense at multiple OSI layers.'
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let questionsContainer = document.getElementById('questionsContainer');

        function initQuiz() {
            questionsContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card' + (index === 0 ? ' active' : '');
                card.id = `question-${index}`;

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} of ${questions.length}</div>
                    <span class="question-category ${q.categoryClass}">${q.category}</span>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-question="${index}" data-option="${i}" onclick="selectOption(${index}, ${i})">
                                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation-${index}">
                        <h4>Explanation</h4>
                        <p>${q.explanation}</p>
                    </div>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="nav-btn" onclick="nextQuestion()" id="nextBtn-${index}">
                            ${index === questions.length - 1 ? 'Finish Quiz' : 'Next →'}
                        </button>
                    </div>
                `;

                questionsContainer.appendChild(card);
            });
        }

        function selectOption(questionIndex, optionIndex) {
            const question = questions[questionIndex];
            const options = document.querySelectorAll(`[data-question="${questionIndex}"]`);

            if (answers[questionIndex] !== null) return;

            answers[questionIndex] = optionIndex;

            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === question.correct) {
                    opt.classList.add('correct');
                } else if (i === optionIndex && optionIndex !== question.correct) {
                    opt.classList.add('incorrect');
                }
            });

            document.getElementById(`explanation-${questionIndex}`).classList.add('show');
            saveProgress();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                document.getElementById(`question-${currentQuestion}`).classList.remove('active');
                currentQuestion++;
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                document.getElementById(`question-${currentQuestion}`).classList.remove('active');
                currentQuestion--;
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            }
        }

        function updateProgress() {
            const pct = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function showResults() {
            document.getElementById(`question-${currentQuestion}`).classList.remove('active');
            document.querySelector('.progress-section').style.display = 'none';

            let correct = 0;
            let sectionScores = {};

            questions.forEach((q, i) => {
                if (answers[i] === q.correct) correct++;

                if (!sectionScores[q.category]) {
                    sectionScores[q.category] = { correct: 0, total: 0 };
                }
                sectionScores[q.category].total++;
                if (answers[i] === q.correct) {
                    sectionScores[q.category].correct++;
                }
            });

            const percentage = Math.round((correct / questions.length) * 100);
            const passed = percentage >= 70;

            document.getElementById('scoreNumber').textContent = percentage + '%';
            document.getElementById('scoreCircle').className = 'score-circle ' + (passed ? 'pass' : 'fail');
            document.getElementById('resultMessage').textContent = passed
                ? `Congratulations! You passed with ${correct}/${questions.length} correct answers.`
                : `You scored ${correct}/${questions.length}. Review the material and try again.`;

            let breakdownHTML = '<h3>Section Breakdown</h3>';
            for (const [section, scores] of Object.entries(sectionScores)) {
                const sectionPct = Math.round((scores.correct / scores.total) * 100);
                breakdownHTML += `
                    <div class="section-score">
                        <span>${section}</span>
                        <span>${scores.correct}/${scores.total} (${sectionPct}%)</span>
                    </div>
                `;
            }
            document.getElementById('sectionBreakdown').innerHTML = breakdownHTML;

            document.getElementById('resultsCard').classList.add('active');

            localStorage.setItem('cse-module05-quiz-score', percentage);
            localStorage.setItem('cse-module05-quiz-passed', passed);

            // Track in ProgressManager
            if (passed && typeof ProgressManager !== 'undefined') {
                ProgressManager.completeModule('cse-module05-quiz', 'cloud', 'quiz', { score: percentage });
            }
        }

        function resetQuiz() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            document.getElementById('resultsCard').classList.remove('active');
            document.querySelector('.progress-section').style.display = 'block';
            initQuiz();
            updateProgress();
            localStorage.removeItem('cse-module05-quiz-answers');
        }

        function saveProgress() {
            localStorage.setItem('cse-module05-quiz-answers', JSON.stringify(answers));
            localStorage.setItem('cse-module05-quiz-current', currentQuestion);
        }

        function loadProgress() {
            const savedAnswers = localStorage.getItem('cse-module05-quiz-answers');
            const savedCurrent = localStorage.getItem('cse-module05-quiz-current');

            if (savedAnswers && savedCurrent) {
                answers = JSON.parse(savedAnswers);
                currentQuestion = parseInt(savedCurrent);

                answers.forEach((answer, i) => {
                    if (answer !== null) {
                        const options = document.querySelectorAll(`[data-question="${i}"]`);
                        options.forEach((opt, j) => {
                            opt.classList.add('disabled');
                            if (j === questions[i].correct) {
                                opt.classList.add('correct');
                            } else if (j === answer && answer !== questions[i].correct) {
                                opt.classList.add('incorrect');
                            }
                        });
                        document.getElementById(`explanation-${i}`).classList.add('show');
                    }
                });

                document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
                document.getElementById(`question-${currentQuestion}`).classList.add('active');
                updateProgress();
            }
        }

        initQuiz();
        loadProgress();
    </script>

    <!-- Progress System -->
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
