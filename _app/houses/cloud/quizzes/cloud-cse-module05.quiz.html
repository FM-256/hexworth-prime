<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 05: Application Security - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Application Security',
            description: 'CSE Module 05 - Cloud application security',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module05',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'According to NIST SP 800-64, during which SDLC phase should threat modeling be performed?',
                    options: [
                        'Initiation',
                        'Acquisition/Development',
                        'Operations/Maintenance',
                        'Disposal'
                    ],correct: 1, explanation: 'Threat modeling should be performed during the Acquisition/Development phase when the system is being designed. This allows security controls to be built into the design rather than bolted on later.'
                },
                {
                    question: 'The "3 R\'s" of secure software design include Reliability, Resiliency, and which third concept?',
                    options: [
                        'Redundancy',
                        'Recovery',
                        'Replication',
                        'Responsiveness'
                    ],correct: 1, explanation: 'The 3 R\'s are Reliability (functions as expected), Resiliency (withstands attacks), and Recovery (restores with minimal disruption). Recovery is critical for business continuity after security incidents.'
                },
                {
                    question: 'What is the primary goal of DevSecOps?',
                    options: [
                        'Replace security teams with automation',
                        'Integrate security throughout the development lifecycle',
                        'Delay security testing until production',
                        'Reduce development costs by eliminating security reviews'
                    ],correct: 1, explanation: 'DevSecOps integrates security practices throughout the entire development lifecycle (CI/CD pipeline), rather than treating it as a separate phase. Security becomes everyone\'s responsibility.'
                },
                {
                    question: 'At which OSI layer does a Web Application Firewall (WAF) operate?',
                    options: [
                        'Layer 3 (Network)',
                        'Layer 4 (Transport)',
                        'Layer 7 (Application)',
                        'Layer 2 (Data Link)'
                    ],correct: 2, explanation: 'WAF operates at Layer 7 (Application layer), inspecting HTTP/HTTPS traffic for application-level attacks like SQL injection and XSS. This is different from network firewalls that operate at Layer 3-4.'
                },
                {
                    question: 'AWS WAF can be integrated with which AWS services? (Select the BEST answer)',
                    options: [
                        'EC2 instances directly',
                        'Application Load Balancer and CloudFront',
                        'S3 buckets only',
                        'RDS databases'
                    ],correct: 1, explanation: 'AWS WAF integrates with Application Load Balancer, CloudFront, and API Gateway. It cannot be attached directly to EC2 instances—it requires a front-end service that handles HTTP/HTTPS traffic.'
                },
                {
                    question: 'Which attack type is WAF specifically designed to protect against?',
                    options: [
                        'Brute force SSH attacks',
                        'SQL injection and Cross-Site Scripting (XSS)',
                        'DDoS volumetric attacks',
                        'Port scanning'
                    ],correct: 1, explanation: 'WAF protects against application-layer attacks like SQL injection, XSS, CSRF, and code injection. DDoS volumetric attacks are handled by DDoS protection services (Shield, DDoS Standard), and network attacks by network firewalls.'
                },
                {
                    question: 'Which vulnerability type moved from #1 to #3 in the OWASP Top 10 (2021)?',
                    options: [
                        'Broken Access Control',
                        'Injection',
                        'Security Misconfiguration',
                        'Cryptographic Failures'
                    ],correct: 1, explanation: 'Injection attacks (SQL, command, LDAP) dropped from #1 to #3 in 2021, while Broken Access Control rose to #1. This reflects improved developer awareness of injection and the persistent challenge of access control.'
                },
                {
                    question: 'Which OWASP Top 10 (2021) vulnerability category is NEW and addresses issues in the design phase?',
                    options: [
                        'A04: Insecure Design',
                        'A08: Software and Data Integrity Failures',
                        'A10: Server-Side Request Forgery',
                        'All of the above are new'
                    ],correct: 0, explanation: 'A04: Insecure Design is a new category focusing on missing or ineffective security controls in the design phase. It emphasizes the need for threat modeling and secure design patterns before coding begins.'
                },
                {
                    question: 'Which technology helps protect against ransomware by detecting threats at the endpoint?',
                    options: [
                        'WAF',
                        'EDR/XDR',
                        'Load Balancer',
                        'VPC Peering'
                    ],correct: 1, explanation: 'Endpoint Detection and Response (EDR) and Extended Detection and Response (XDR) detect and respond to threats at the endpoint level, including ransomware behaviors like mass file encryption.'
                },
                {
                    question: 'Which security testing method analyzes source code without running the application?',
                    options: [
                        'DAST (Dynamic Application Security Testing)',
                        'SAST (Static Application Security Testing)',
                        'RASP (Runtime Application Self-Protection)',
                        'IAST (Interactive Application Security Testing)'
                    ],correct: 1, explanation: 'SAST (white box testing) analyzes source code, bytecode, or binaries without executing the application. It finds vulnerabilities early in development but may have higher false positives than dynamic testing.'
                },
                {
                    question: '"Shift Left" security refers to:',
                    options: [
                        'Moving security testing to later in the pipeline',
                        'Moving security testing earlier in the development lifecycle',
                        'Shifting responsibility to the operations team',
                        'Moving applications to the left side of the data center'
                    ],correct: 1, explanation: 'Shift Left means integrating security earlier in the development process (to the "left" of a timeline diagram). Earlier detection means lower remediation costs and faster time to market.'
                },
                {
                    question: 'RASP (Runtime Application Self-Protection) provides what unique capability?',
                    options: [
                        'Scans code before it compiles',
                        'Tests APIs in staging environments',
                        'Detects and blocks attacks during runtime execution',
                        'Reviews code during pull requests'
                    ],correct: 2, explanation: 'RASP runs inside the application and can detect and block attacks in real-time during production. Unlike SAST/DAST which are testing tools, RASP provides continuous protection.'
                },
                {
                    question: 'When securing AWS Lambda functions, where should secrets like database passwords be stored?',
                    options: [
                        'Hardcoded in the function code',
                        'In environment variables in plain text',
                        'In AWS Secrets Manager or Parameter Store',
                        'In the function\'
                    ],correct: 2, explanation: 'Secrets should be stored in AWS Secrets Manager or Systems Manager Parameter Store, never hardcoded in code or plain environment variables. These services provide encryption, rotation, and access control.'
                },
                {
                    question: 'What is the security benefit of using API Gateway with Lambda functions?',
                    options: [
                        'It provides DDoS protection and rate limiting',
                        'It eliminates the need for IAM roles',
                        'It encrypts the Lambda function code',
                        'It automatically patches Lambda runtime'
                    ],correct: 0, explanation: 'API Gateway provides DDoS protection, rate limiting, authentication, and request validation. It acts as a secure front door for Lambda functions, reducing direct exposure to attacks.'
                },
                {
                    question: 'Azure API Management (APIM) security best practices include:',
                    options: [
                        'Exposing original backend URLs in responses',
                        'Removing rate limiting for better performance',
                        'Stripping response headers that expose technology stack',
                        'Disabling authentication for public APIs'
                    ],correct: 2, explanation: 'APIM should strip or transform response headers that expose server versions, technology stack, or internal URLs. This reduces information leakage that could help attackers.'
                },
                {
                    question: 'Which container security practice helps prevent privilege escalation attacks?',
                    options: [
                        'Running containers as root user',
                        'Running containers with restricted privileges (non-root)',
                        'Using the latest tag for images',
                        'Storing secrets in environment variables'
                    ],correct: 1, explanation: 'Containers should run as non-root users with restricted privileges. Running as root allows attackers who compromise the container to potentially escape to the host system.'
                },
                {
                    question: 'Using ":latest" image tags in Kubernetes is a security concern because:',
                    options: [
                        'Latest images are always outdated',
                        'It prevents image caching',
                        'It creates unpredictable deployments and supply chain risks',
                        'Kubernetes does not support latest tags'
                    ],correct: 2, explanation: 'Using :latest tags means you may deploy different versions at different times, making deployments unpredictable. It also increases supply chain attack risk since a compromised :latest image affects all deployments.'
                },
                {
                    question: '[M02 Review] When configuring Lambda functions, what IAM principle should be applied to execution roles?',
                    options: [
                        'Administrative access for flexibility',
                        'Least privilege with one role per function',
                        'Shared roles across all functions',
                        'No IAM role required'
                    ],correct: 1, explanation: 'Each Lambda function should have its own least-privileged IAM role with only the permissions required for that specific function. This limits blast radius if any single function is compromised.'
                },
                {
                    question: '[M03 Review] In a supply chain attack scenario, which M03 concept would help protect exfiltrated data?',
                    options: [
                        'Data classification',
                        'Encryption at rest',
                        'Backup and recovery',
                        'All of the above'
                    ],correct: 3, explanation: 'Data classification identifies sensitive data, encryption at rest protects it if exfiltrated, and backups enable recovery. All three M03 concepts apply to supply chain attack mitigation and response.'
                },
                {
                    question: '[M04 Review] In a defense-in-depth architecture, what is the correct order for traffic inspection?',
                    options: [
                        'WAF → Network Firewall → Application',
                        'Application → WAF → Network Firewall',
                        'Network Firewall → WAF → Application',
                        'WAF → Application → Network Firewall'
                    ],correct: 2, explanation: 'Traffic should flow through Network Firewall (L3-4 filtering) first, then WAF (L7 application inspection), and finally to the application. This provides layered defense at multiple OSI layers.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
