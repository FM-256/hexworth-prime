<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Module 01: Cloud Computing & Security Fundamentals - Hexworth Prime</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1a365d 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #7dd3fc; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Cloud Computing & Security Fundamentals',
            description: 'CSE Module 01 - Cloud fundamentals and security principles',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            moduleId: 'cse-module01',
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'According to NIST, which of the following is NOT one of the five essential characteristics of cloud computing?',
                    options: [
                        'On-demand self-service',
                        'Broad network access',
                        'Dedicated hardware',
                        'Rapid elasticity'
                    ],
                    correct: 2,
                    explanation: 'The five essential characteristics are: On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, and Measured service. Dedicated hardware is not a characteristic; cloud computing uses shared, pooled resources.'
                },
                {
                    question: 'Which cloud service model gives customers the MOST control over the operating system?',
                    options: [
                        'SaaS (Software as a Service)',
                        'PaaS (Platform as a Service)',
                        'IaaS (Infrastructure as a Service)',
                        'FaaS (Function as a Service)'
                    ],
                    correct: 2,
                    explanation: 'IaaS provides the most control as customers manage the operating system, middleware, runtime, data, and applications. The provider only manages virtualization, servers, storage, and networking.'
                },
                {
                    question: 'Microsoft 365 and Google Workspace are examples of which cloud service model?',
                    options: [
                        'IaaS',
                        'PaaS',
                        'SaaS',
                        'Hybrid'
                    ],
                    correct: 2,
                    explanation: 'SaaS (Software as a Service) provides complete applications over the internet. Users access the software through a web browser and only manage their data. Microsoft 365 and Google Workspace are classic SaaS examples.'
                },
                {
                    question: 'A company uses AWS for their public website but keeps patient records on their own private servers. What deployment model is this?',
                    options: [
                        'Private Cloud',
                        'Public Cloud',
                        'Hybrid Cloud',
                        'Community Cloud'
                    ],
                    correct: 2,
                    explanation: 'Hybrid Cloud combines two or more distinct cloud infrastructures (private, public, or community) that remain unique entities but are bound together for data and application portability.'
                },
                {
                    question: 'Which challenge arises from using multiple cloud models that can lead to data \'sprawl\'?',
                    options: [
                        'Network latency',
                        'Data and identity governance',
                        'Hardware maintenance',
                        'Software licensing'
                    ],
                    correct: 1,
                    explanation: 'Data and identity governance becomes challenging when using private, public, and hybrid cloud models. Data can spread across multiple environments, making it difficult to track and protect.'
                },
                {
                    question: 'What is Shadow IT?',
                    options: [
                        'Encrypted data storage',
                        'Unauthorized installation of applications by employees',
                        'A type of DDoS attack',
                        'Cloud backup services'
                    ],
                    correct: 1,
                    explanation: 'Shadow IT refers to the unauthorized installation of applications or use of cloud services by employees without IT department approval. This can introduce security vulnerabilities and compliance issues.'
                },
                {
                    question: 'In the shared responsibility model, which responsibility ALWAYS remains with the customer regardless of service model?',
                    options: [
                        'Physical security',
                        'Operating system patching',
                        'Data governance and classification',
                        'Network infrastructure'
                    ],
                    correct: 2,
                    explanation: 'Data governance and classification is ALWAYS the customer\'s responsibility across all service models (IaaS, PaaS, SaaS). The customer must classify and protect their data appropriately.'
                },
                {
                    question: 'In a PaaS environment, who is responsible for operating system security patches?',
                    options: [
                        'The customer',
                        'The cloud service provider',
                        'Shared between customer and provider',
                        'A third-party vendor'
                    ],
                    correct: 1,
                    explanation: 'In PaaS, the cloud provider is responsible for the operating system. The customer focuses on their applications and data while the provider handles OS patches, infrastructure, and platform maintenance.'
                },
                {
                    question: 'What is the Azure equivalent of AWS\'s Virtual Private Cloud (VPC)?',
                    options: [
                        'Azure Resource Group',
                        'Azure Virtual Network (VNET)',
                        'Azure Active Directory',
                        'Azure Security Center'
                    ],
                    correct: 1,
                    explanation: 'Azure Virtual Network (VNET) is Azure\'s equivalent to AWS VPC. Both provide isolated virtual network environments for deploying cloud resources with defined IP address ranges and subnets.'
                },
                {
                    question: 'Which AWS service is used for centralized security monitoring and threat detection?',
                    options: [
                        'AWS CloudTrail',
                        'AWS GuardDuty',
                        'AWS S3',
                        'AWS Lambda'
                    ],
                    correct: 1,
                    explanation: 'AWS GuardDuty is a threat detection service that continuously monitors for malicious activity. CloudTrail is for audit logging, S3 for storage, and Lambda for serverless computing.'
                },
                {
                    question: 'Which security benefit of cloud computing helps organizations meet regulatory requirements?',
                    options: [
                        'Measured service',
                        'Compliance tools and frameworks',
                        'Broad network access',
                        'Resource pooling'
                    ],
                    correct: 1,
                    explanation: 'Cloud providers offer built-in compliance tools and frameworks that help organizations meet regulatory requirements like GDPR, HIPAA, and PCI-DSS. These include audit logs, encryption, and compliance dashboards.'
                },
                {
                    question: 'According to the OWASP Cloud-Native Application Security Top 10, what is the #1 risk?',
                    options: [
                        'SQL Injection',
                        'Insecure cloud, container, or orchestration configuration',
                        'Cross-site scripting (XSS)',
                        'Denial of Service'
                    ],
                    correct: 1,
                    explanation: 'OWASP ranks \'Insecure cloud, container, or orchestration configuration\' as the #1 risk for cloud-native applications. Misconfiguration is the leading cause of cloud security breaches.'
                },
                {
                    question: 'Which attack type specifically targets employees with personalized emails that appear to come from their employer?',
                    options: [
                        'Phishing',
                        'Spear phishing',
                        'Brute force',
                        'SQL injection'
                    ],
                    correct: 1,
                    explanation: 'Spear phishing is a targeted form of phishing that uses personalized emails designed to appear from a trusted source like an employer. Regular phishing uses generic mass emails.'
                },
                {
                    question: 'What type of attack floods services with traffic to prevent legitimate users from accessing them?',
                    options: [
                        'SQL Injection',
                        'Cross-site scripting',
                        'Denial of Service (DoS)',
                        'Man-in-the-middle'
                    ],
                    correct: 2,
                    explanation: 'Denial of Service (DoS) attacks overwhelm systems with traffic, preventing legitimate users from accessing services. Cloud providers typically offer DDoS protection services to mitigate these attacks.'
                },
                {
                    question: 'Which CIA Triad component ensures data has not been altered from creation to access?',
                    options: [
                        'Confidentiality',
                        'Integrity',
                        'Availability',
                        'Authentication'
                    ],
                    correct: 1,
                    explanation: 'Integrity ensures that data remains unaltered and trustworthy from the time it is created until it is accessed. Confidentiality protects against unauthorized access, and Availability ensures data is accessible when needed.'
                },
                {
                    question: 'Which Zero Trust principle states that users should only be given the minimum access required for a specific task?',
                    options: [
                        'Verify explicitly',
                        'Assume breach',
                        'Least privilege access',
                        'Defense in depth'
                    ],
                    correct: 2,
                    explanation: 'Least privilege access (also called Just-in-Time, Just Enough Access) is a core Zero Trust principle that grants only the minimum permissions needed for a specific task, for only the necessary duration.'
                },
                {
                    question: 'The Zero Trust model is built on how many pillars?',
                    options: [
                        '3 pillars',
                        '5 pillars',
                        '6 pillars',
                        '8 pillars'
                    ],
                    correct: 2,
                    explanation: 'Zero Trust has 6 pillars: Identity, Devices, Applications, Data, Infrastructure, and Networking. Each pillar requires verification and must be secured independently.'
                },
                {
                    question: 'What is a Secure Landing Zone in cloud architecture?',
                    options: [
                        'A physical data center location',
                        'A scalable, pre-configured starting point for cloud deployment with security controls',
                        'An encryption algorithm',
                        'A type of firewall'
                    ],
                    correct: 1,
                    explanation: 'A Secure Landing Zone is a scalable and modular starting point for cloud deployment. It includes pre-configured security controls, network topology, identity management, and governance policies as repeatable templates.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
