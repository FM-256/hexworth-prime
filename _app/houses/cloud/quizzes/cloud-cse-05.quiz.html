<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-05: Application Security Quiz - Cloud House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1929 0%, #1e3a5f 50%, #0c1929 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(96, 165, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #93c5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Cloud House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> EC-Council CSE</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <!-- Progress System (loads ProgressManager, AchievementSystem, LearningPaths, SkillTreeData) -->
    <script src="../../../components/ProgressSystem.js"></script>

    <!-- Quiz Engine -->
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Application Security in Cloud',
            description: 'Test your knowledge of secure SDLC, OWASP Top 10, WAF, and container security',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'cse-app-security',
            moduleId: 'cse-05-appsec',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is "Shift Left" in application security?',
                    options: [
                        'Moving security testing to the end of development',
                        'Integrating security practices earlier in the development lifecycle',
                        'Using left-justified code formatting',
                        'Migrating to a different cloud region'
                    ]
                },
                {
                    question: 'What is SAST (Static Application Security Testing)?',
                    options: [
                        'Testing the application while it runs in production',
                        'Analyzing source code for vulnerabilities without executing it',
                        'Penetration testing by external teams',
                        'Load testing for performance'
                    ]
                },
                {
                    question: 'What is DAST (Dynamic Application Security Testing)?',
                    options: [
                        'Analyzing code before compilation',
                        'Testing the running application by sending requests and analyzing responses',
                        'Reviewing documentation for security',
                        'Static code analysis'
                    ]
                },
                {
                    question: 'Which OWASP Top 10 vulnerability involves untrusted data being sent to an interpreter?',
                    options: [
                        'Broken Access Control',
                        'Injection',
                        'Security Misconfiguration',
                        'Cryptographic Failures'
                    ]
                },
                {
                    question: 'What is the purpose of secrets management in cloud applications?',
                    options: [
                        'Hiding application features from users',
                        'Securely storing and accessing API keys, passwords, and certificates',
                        'Compressing sensitive data',
                        'Encrypting user interfaces'
                    ]
                },
                {
                    question: 'What is a container image vulnerability scan?',
                    options: [
                        'Checking physical shipping containers',
                        'Scanning Docker images for known CVEs in packages and dependencies',
                        'Monitoring container network traffic',
                        'Backing up container data'
                    ]
                },
                {
                    question: 'Which practice applies the principle of least privilege to serverless functions?',
                    options: [
                        'Assign one narrowly scoped execution role per function',
                        'Share a single broad execution role across all functions',
                        'Grant every function administrator access to avoid permission errors',
                        'Embed long-lived credentials in function code'
                    ],
                    explanation: 'Serverless security best practice is one role per function, granting only the permissions that function needs. A shared or over-privileged role widens the blast radius if any single function is compromised, and credentials belong in a secrets manager, never in code.'
                },
                {
                    question: 'What does IAST (Interactive Application Security Testing) combine?',
                    options: [
                        'Manual code review and documentation',
                        'Elements of both SAST and DAST, running inside the application',
                        'Network and physical security testing',
                        'User acceptance and load testing'
                    ]
                },
                {
                    question: 'What is an API Gateway security function?',
                    options: [
                        'Storing API source code',
                        'Rate limiting, authentication, authorization, and request validation',
                        'Compiling API code',
                        'Hosting API documentation only'
                    ]
                },
                {
                    question: 'What is the principle of "immutable infrastructure" in cloud security?',
                    options: [
                        'Never changing any infrastructure',
                        'Replacing servers/containers rather than modifying them, ensuring consistent state',
                        'Making all resources publicly accessible',
                        'Using only permanent storage'
                    ]
                }
            ]
        });
        quiz.start();
    
        function completeModule() {
            if (typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('cloud', 'cloud-cse-05', {
                    returnUrl: '../index.html'
                });
            }
        }
    </script>
    
    <div style="text-align:center; padding:20px; margin-top:10px;">
        <button onclick="completeModule()" style="background:#22c55e; color:#fff; border:none; padding:12px 32px; border-radius:8px; font-size:1rem; cursor:pointer; box-shadow:0 2px 8px rgba(34,197,94,0.3);">Complete Module ✓</button>
    </div>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="cloud-cse-05" house="cloud"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
