<title>The Nines | House of the Cloud</title>
<!--
  THE NINES -- Mini Metro, where the network you draw is a request path and the passengers
  are requests.

  REBUILD 2026-08-03. v1 was a capacity SIMULATOR with a placement UI: pick a component from
  a palette, click to drop it in a zone, watch a demand curve climb. The physics were sound
  and are kept below. But the ask was a Mini Metro clone, and the thing that makes Mini Metro
  what it is was absent -- there was not one drag handler in the file. You never authored a
  route, never re-authored one under pressure, and failure was an aggregate percentage rather
  than a place on the map you could point at. v1 is archived at
  hexworth-shared/archive/games/cloud-the-nines-v1-simulator-20260803.html.

  What carries over is the CLOUD PHYSICS, now spatial instead of numeric:
    - cross-zone hops cost throughput (a runner crawls over a zone boundary)
    - data stations spread across zones lose capacity to replication traffic
    - a seeded zone failure takes every station in it dark, mid-run
  What is new is the GAME: stations arrive over time, requests queue as visible shapes, you
  drag lines between stations, runners walk those lines, and one station drowning in its own
  backlog ends the run -- at that station, where you can watch it happen.

  Determinism: every draw comes from a seeded RNG, so a level replays identically.
  Math.random is never called.
-->
<style>
    :root {
        --bg: #080d16;
        --panel: rgba(14, 22, 36, 0.92);
        --ink: #e8f0fb;
        --muted: #8ea3bd;
        --line: rgba(120, 170, 220, 0.18);
        --accent: #22d3ee;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #ff4d5e;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg); color: var(--ink);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
    }
    /* HEUR-008: absolute, never fixed -- a body filter on a host wrapper breaks fixed. */
    #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }

    header {
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        padding: 10px 18px; border-bottom: 1px solid var(--line);
        background: var(--panel); z-index: 5;
    }
    header h1 {
        font-size: 17px; margin: 0; letter-spacing: .02em; font-weight: 700;
        color: var(--accent); white-space: nowrap;
    }
    .stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 62px; }
    .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .stat.good b { color: var(--ok); } .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
    .spacer { flex: 1; }
    button {
        background: rgba(34, 211, 238, .12); color: var(--accent);
        border: 1px solid rgba(34, 211, 238, .4); border-radius: 6px;
        padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
        font-family: inherit;
    }
    button:hover { background: rgba(34, 211, 238, .22); }
    button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #stage { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

    /* Line inventory: the scarce resource. Mini Metro keeps this on screen at all times. */
    #lines-bar {
        position: absolute; left: 14px; bottom: 14px; z-index: 4;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 9px 12px;
    }
    .lchip {
        width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;

    .lchip.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
    #lines-bar .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .res { font-size: 12px; color: var(--muted); }
    .res b { color: var(--ink); font-variant-numeric: tabular-nums; }

    /* Overlays: absolute + inset, matching the shipped ArcadeScoreModal pattern. */
    .ovl {
        position: absolute; inset: 0; z-index: 40; display: grid; place-items: center;
        background: rgba(5, 9, 18, .93); padding: 20px; overflow-y: auto;
    }
    .ovl .box {
        max-width: 560px; width: 100%; background: linear-gradient(160deg, #111a2c, #0d1523);
        border: 1px solid var(--accent); border-radius: 14px; padding: 24px;
    }
    .ovl h2 { margin: 0 0 6px; color: var(--accent); font-size: 21px; }
    .ovl p { color: #cddcec; line-height: 1.6; margin: 8px 0; }

    .choices { display: grid; gap: 10px; margin-top: 16px; }

        text-align: left; padding: 13px 16px; border-radius: 9px; cursor: pointer;
        background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--ink);

    .choice:hover { background: rgba(34,211,238,.12); border-color: var(--accent); }

    @media (max-width: 640px) {
        header { gap: 11px; padding: 8px 12px; }

        .stat b { font-size: 14px; } .stat { min-width: 50px; }
        #lines-bar { left: 8px; bottom: 8px; padding: 7px 9px; gap: 6px; }
    }
</style>

<script>
'use strict';

/* ══════════════════════════════ tuning ══════════════════════════════ */

const AZ_COUNT      = 3;
const AZ_NAME       = ['az-a', 'az-b', 'az-c'];
const SHAPES        = ['circle', 'triangle', 'square', 'diamond', 'cross'];
const LINE_COLORS   = ['#22d3ee', '#f472b6', '#fbbf24', '#a78bfa', '#34d399', '#fb923c'];

const WEEK_SECONDS  = 22;      // time between upgrade choices
const STATION_CAP   = 6;       // queued requests a station tolerates
const OVERLOAD_FUSE = 9;       // seconds over capacity before the run ends
const REQ_PATIENCE  = 34;      // seconds a request waits before timing out (counts as dropped)
const RUNNER_CAP    = 6;       // requests one runner carries
const RUNNER_SPEED  = 152;     // px/sec on a within-zone hop

// Cloud physics carried over from v1, expressed spatially.
const CROSS_AZ_TAX    = 0.55;  // a runner crossing a zone boundary moves at 55% speed
const REPLICATION_TAX = 0.25;  // data stations spanning zones lose 25% of queue capacity

const LEVELS = [
    { name: 'Single Region', seed: 0x1F35A2C1, azFail: null, spawnEvery: 12 },
    { name: 'Zone Failure',  seed: 0x77E1B903, azFail: 96,   spawnEvery: 11 },
    { name: 'Peak Season',   seed: 0x2C9D45EF, azFail: 62,   spawnEvery: 9  }
];

/* ══════════════════════════════ rng ══════════════════════════════ */
/* Mulberry32. Every random draw comes from here so a level replays identically. */
function mkRng(seed) {
    let a = seed >>> 0;
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

/* ══════════════════════════════ state ══════════════════════════════ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

let S = null;
let level = 0;
let paused = false;
let lastT = 0;

function newGame() {
    const L = LEVELS[level];
    S = {
        rng: mkRng(L.seed),
        t: 0, week: 1, weekT: 0,
        stations: [], lines: [], runners: [],
        linesMax: 3, runnersSpare: 2, tunnels: 1, capBonus: 0,
        served: 0, dropped: 0,
        spawnEvery: L.spawnEvery, spawnT: 6,
        azFailAt: L.azFail, azDown: -1, azDownT: 0,
        replicating: false, azFailed: false,
        over: false, overReason: '', selLine: 0,
        drag: null, msg: '', msgT: 0,
        zones: []
    };
    layoutZones();
    /* Open with one of each core shape, all in ONE zone. Mini Metro starts compact and
       expands; scattering the first three across zones would force a cross-zone line on move
       one, spend the only tunnel, and put a slow hop in the opening -- measured as
       unwinnable in the first playtest (served 0 after 11s). Zones b and c fill in later. */
    ['circle', 'triangle', 'square'].forEach(function (sh) { addStation(sh, 0); });
    paintChips();
}

/* Zones are drawn regions AND the driver of station placement -- they sit far apart, which is
   what makes a cross-zone hop a real spatial cost rather than a number in a panel. */
function layoutZones() {
    if (!S) return;
    S.zones = [];
    const R = Math.min(W, H);
    for (let i = 0; i < AZ_COUNT; i++) {
        const ang = -Math.PI / 2 + (i * 2 * Math.PI) / AZ_COUNT;
        S.zones.push({
            name: AZ_NAME[i],
            cx: W / 2 + Math.cos(ang) * R * 0.27,
            cy: H / 2 + Math.sin(ang) * R * 0.24,
            r: R * 0.21
        });
    }
}

function addStation(shape, az) {
    const z = S.zones[az];
    if (!z) return;
    let x = z.cx, y = z.cy;
    for (let tries = 0; tries < 50; tries++) {
        const a = S.rng() * Math.PI * 2;
        const r = Math.sqrt(S.rng()) * z.r * 0.86;
        const nx = z.cx + Math.cos(a) * r;
        const ny = z.cy + Math.sin(a) * r;
        if (nx < 46 || ny < 46 || nx > W - 46 || ny > H - 104) continue;   // H-104 clears the lines-bar HUD
        if (S.stations.every(function (s) { return Math.hypot(s.x - nx, s.y - ny) > 60; })) { x = nx; y = ny; break; }
    }
    S.stations.push({
        id: S.stations.length, shape: shape, az: az, x: x, y: y,
        queue: [], cap: STATION_CAP, over: 0, dead: false
    });
}

/* A request may only want a shape that actually exists on the map. */
function liveShapes() {
    const set = {};
    S.stations.forEach(function (s) { if (!s.dead) set[s.shape] = true; });
    return Object.keys(set);
}

/* ══════════════════════════════ geometry ══════════════════════════════ */

/* Octolinear elbow: a straight run, then a 45-degree diagonal. This one constraint is what
   makes a drawn line read as a transit map rather than a scribble. */
function elbow(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const sx = Math.sign(dx), sy = Math.sign(dy);
    if (adx > ady) return [ax + sx * (adx - ady), ay];
    return [ax, ay + sy * (ady - adx)];
}

function segLength(a, b) {
    const e = elbow(a.x, a.y, b.x, b.y);
    return Math.hypot(e[0] - a.x, e[1] - a.y) + Math.hypot(b.x - e[0], b.y - e[1]);
}

function segPoint(a, b, t) {
    const e = elbow(a.x, a.y, b.x, b.y);
    const l1 = Math.hypot(e[0] - a.x, e[1] - a.y);
    const l2 = Math.hypot(b.x - e[0], b.y - e[1]);
    const total = l1 + l2;
    if (total === 0) return { x: a.x, y: a.y };
    const d = t * total;
    if (d <= l1) {
        const k = l1 === 0 ? 0 : d / l1;
        return { x: a.x + (e[0] - a.x) * k, y: a.y + (e[1] - a.y) * k };
    }
    const k = l2 === 0 ? 0 : (d - l1) / l2;
    return { x: e[0] + (b.x - e[0]) * k, y: e[1] + (b.y - e[1]) * k };
}

function stationAt(x, y) {
    return S.stations.find(function (s) { return !s.dead && Math.hypot(s.x - x, s.y - y) < 28; }) || null;
}

/* ══════════════════════════════ lines ══════════════════════════════ */

function getLine(i) {
    if (!S.lines[i]) S.lines[i] = { color: LINE_COLORS[i % LINE_COLORS.length], stops: [] };
    return S.lines[i];
}

function crossings(stops) {
    let n = 0;
    for (let i = 1; i < stops.length; i++) {
        const a = S.stations[stops[i - 1]], b = S.stations[stops[i]];
        if (a && b && a.az !== b.az) n++;
    }
    return n;
}
function tunnelsUsed() {
    return S.lines.reduce(function (a, l) { return a + (l ? crossings(l.stops) : 0); }, 0);
}

/* Lines extend from either END only. That restriction is Mini Metro's, and it is the reason
   line topology is a decision rather than a doodle. */
function tryConnect(fromId, toId) {
    if (fromId === toId) return;
    const li = S.selLine;
    const line = getLine(li);
    let stops = line.stops.slice();

    if (stops.length === 0) {
        const drawn = S.lines.filter(function (l) { return l && l.stops.length >= 2; }).length;
        if (drawn >= S.linesMax) { flash('No spare line -- select an empty slot or clear one'); return; }
        stops = [fromId, toId];
    } else if (stops[stops.length - 1] === fromId) {
        if (stops.indexOf(toId) !== -1) return;
        stops.push(toId);
    } else if (stops[0] === fromId) {
        if (stops.indexOf(toId) !== -1) return;
        stops.unshift(toId);
    } else {
        flash('Extend a line from either end');
        return;
    }

    const others = S.lines.reduce(function (a, l, idx) {
        return a + (idx === li || !l ? 0 : crossings(l.stops));
    }, 0);
    if (others + crossings(stops) > S.tunnels) { flash('No tunnel left for a cross-zone hop'); return; }

    line.stops = stops;
    if (!S.runners.some(function (r) { return r.line === li; })) assignRunner(li);
    paintChips();
}

function assignRunner(li) {
    if (S.runnersSpare <= 0) return false;
    S.runnersSpare--;
    const r = { line: li, seg: 0, p: 0, dir: 1, load: [] };
    /* Stagger runners sharing a line. They run identical deterministic math, so without this
       a second runner sits exactly on top of the first forever: capacity doubles and the
       player sees nothing move. Alternate ends, then offset within the segment. */
    const already = S.runners.filter(function (x) { return x.line === li; }).length;
    const st0 = S.lines[li] && S.lines[li].stops;
    if (already && st0 && st0.length >= 2) {
        if (already % 2 === 1) { r.seg = st0.length - 1; r.dir = -1; }
        r.p = (Math.floor(already / 2) * 0.37) % 1;
    }
    S.runners.push(r);
    /* Board immediately at the stop it starts on. Without this the first hop is always empty,
       so the first request is not served until TWO hops in -- measured at 14s in playtest,
       which reads as a broken game rather than a slow one. */
    /* Board at the stop this runner ACTUALLY starts on. This used to be hardcoded to
       stops[0], which was harmless while every runner started at index 0 -- but the stagger
       above puts odd-indexed runners at the far end, and they would then instantly board a
       request queued at the opposite end of the line. A queue marker vanished at a station
       with no runner near it. Even-indexed runners still have seg 0, so this is a strict
       generalisation rather than a behaviour change for them. */
    const l0 = S.lines[li];
    if (l0 && l0.stops.length) exchange(r, S.stations[l0.stops[r.seg]], l0);
    return true;
}

function clearLine(li) {
    const line = getLine(li);
    line.stops = [];
    S.runners = S.runners.filter(function (r) {
        if (r.line === li) {
            S.runnersSpare++;
            S.dropped += r.load.length;   // requests in flight when you tear up the line are lost
            return false;
        }
        return true;
    });
    paintChips();
}

/* ══════════════════════════════ simulation ══════════════════════════════ */

function update(dt) {
    S.t += dt;
    S.weekT += dt;

    /* A new station arrives -- the pressure that forces you to re-author the map. */
    S.spawnT -= dt;
    if (S.spawnT <= 0) {
        S.spawnT = S.spawnEvery;
        const pool = S.t > 70 ? SHAPES : SHAPES.slice(0, 3);   // exotic shapes arrive later
        const shape = pool[Math.floor(S.rng() * pool.length)];
        /* Early stations stay in the opening zone so the map grows outward rather than
           starting scattered; zones b and c open up once there is something to connect. */
        let az = S.stations.length < 5 ? 0 : Math.floor(S.rng() * AZ_COUNT);
        if (az === S.azDown) az = (az + 1) % AZ_COUNT;
        addStation(shape, az);
    }

    /* Seeded zone failure. */
    if (S.azFailAt !== null && S.t >= S.azFailAt && S.azDown === -1) {
        S.azDown = Math.floor(S.rng() * AZ_COUNT);
        S.azDownT = 26;
        S.azFailed = true;
        S.stations.forEach(function (s) {
            if (s.az === S.azDown) { s.dead = true; S.dropped += s.queue.length; s.queue.length = 0; }
        });
        flash(AZ_NAME[S.azDown].toUpperCase() + ' IS DOWN -- reroute around it');
    }
    if (S.azDown !== -1) {
        S.azDownT -= dt;
        if (S.azDownT <= 0) {
            const back = S.azDown;
            S.stations.forEach(function (s) { if (s.az === back) s.dead = false; });
            flash(AZ_NAME[back].toUpperCase() + ' is back');
            S.azDown = -1; S.azFailAt = null;
        }
    }

    /* Replication tax: data (square) stations spread across zones lose queue capacity to the
       traffic that keeps those zones consistent. Spreading buys survivability, not free lunch. */
    const dataZones = {};
    S.stations.forEach(function (s) { if (s.shape === 'square' && !s.dead) dataZones[s.az] = true; });
    S.replicating = Object.keys(dataZones).length > 1;
    S.stations.forEach(function (s) {
        s.cap = STATION_CAP + S.capBonus;
        if (S.replicating && s.shape === 'square') s.cap = Math.round(s.cap * (1 - REPLICATION_TAX));
    });

    /* Requests appear, queue visibly, and eventually time out. */
    const shapes = liveShapes();
    const rate = 0.048 + S.t * 0.0021;                 // demand climbs forever (tuned from playtest)
    S.stations.forEach(function (st) {
        if (st.dead) { st.over = 0; return; }
        if (S.rng() < rate * dt * 6) {
            const want = shapes.filter(function (x) { return x !== st.shape; });
            if (want.length) st.queue.push({ want: want[Math.floor(S.rng() * want.length)], age: 0 });
        }
        for (let i = st.queue.length - 1; i >= 0; i--) {
            st.queue[i].age += dt;
            if (st.queue[i].age > REQ_PATIENCE) { st.queue.splice(i, 1); S.dropped++; }
        }
        /* The loss condition, and it happens AT a station you can point at. */
        if (st.queue.length > st.cap) {
            st.over += dt;
            if (st.over >= OVERLOAD_FUSE && !S.over) {
                S.over = true;
                S.overReason = 'A ' + st.shape + ' station in ' + AZ_NAME[st.az] +
                    ' drowned in its own backlog. Requests arrived faster than anything could carry them away.';
            }
        } else {
            st.over = Math.max(0, st.over - dt * 1.6);
        }
    });

    S.runners.forEach(function (r) { stepRunner(r, dt); });

    if (S.weekT >= WEEK_SECONDS && !S.over) { S.weekT = 0; S.week++; offerUpgrade(); }
}

function stepRunner(r, dt) {
    const line = S.lines[r.line];
    if (!line || line.stops.length < 2) return;
    const stops = line.stops;
    if (r.seg > stops.length - 1) { r.seg = stops.length - 1; r.dir = -1; }
    if (r.seg < 0) { r.seg = 0; r.dir = 1; }
    const nextIdx = r.seg + r.dir;
    if (nextIdx < 0 || nextIdx > stops.length - 1) { r.dir *= -1; return; }

    const a = S.stations[stops[r.seg]], b = S.stations[stops[nextIdx]];
    if (!a || !b) return;

    /* Crossing a zone boundary is slow. This is v1's latency tax, made physical. */
    const speed = RUNNER_SPEED * (a.az !== b.az ? CROSS_AZ_TAX : 1);
    r.p += (speed * dt) / Math.max(1, segLength(a, b));

    if (r.p >= 1) {
        r.p = 0;
        r.seg = nextIdx;
        exchange(r, S.stations[stops[r.seg]], line);
        if (r.seg >= stops.length - 1) r.dir = -1;
        else if (r.seg <= 0) r.dir = 1;
    }
}

/* Mini Metro's boarding rule, unchanged: a request boards only if this line actually reaches a
   station of the shape it wants. That is what makes topology the thing you think about. */
function exchange(r, st, line) {
    if (!st) return;
    for (let i = r.load.length - 1; i >= 0; i--) {
        if (r.load[i].want === st.shape) { r.load.splice(i, 1); S.served++; }
    }
    if (st.dead) return;
    const reach = {};
    line.stops.forEach(function (id) { const s = S.stations[id]; if (s && !s.dead) reach[s.shape] = true; });
    let i = 0;
    while (i < st.queue.length && r.load.length < RUNNER_CAP) {
        if (reach[st.queue[i].want]) r.load.push(st.queue.splice(i, 1)[0]);
        else i++;
    }
}

function uptime() {
    const total = S.served + S.dropped;
    return total === 0 ? 100 : (S.served / total) * 100;
}

/* ══════════════════════════════ render ══════════════════════════════ */

function drawShape(x, y, shape, s, fill, stroke, lw) {
    ctx.beginPath();
    if (shape === 'circle')        ctx.arc(x, y, s, 0, Math.PI * 2);
    else if (shape === 'square')   ctx.rect(x - s, y - s, s * 2, s * 2);
    else if (shape === 'triangle') { ctx.moveTo(x, y - s * 1.15); ctx.lineTo(x + s, y + s * 0.8); ctx.lineTo(x - s, y + s * 0.8); ctx.closePath(); }
    else if (shape === 'diamond')  { ctx.moveTo(x, y - s * 1.2); ctx.lineTo(x + s * 1.1, y); ctx.lineTo(x, y + s * 1.2); ctx.lineTo(x - s * 1.1, y); ctx.closePath(); }
    else { const t = s * 0.42; ctx.rect(x - t, y - s, t * 2, s * 2); ctx.rect(x - s, y - t, s * 2, t * 2); }
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}

function render() {
    ctx.fillStyle = '#080d16';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    S.zones.forEach(function (z, i) {
        const down = i === S.azDown;
        const g = ctx.createRadialGradient(z.cx, z.cy, 0, z.cx, z.cy, z.r);
        g.addColorStop(0, down ? 'rgba(255,77,94,.13)' : 'rgba(34,211,238,.085)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, Math.PI * 2); ctx.fill();
        ctx.setLineDash([4, 8]);
        ctx.strokeStyle = down ? 'rgba(255,77,94,.42)' : 'rgba(120,170,220,.16)';
        ctx.lineWidth = 1.5; ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = down ? 'rgba(255,77,94,.85)' : 'rgba(142,163,189,.55)';
        ctx.font = '600 11px Segoe UI, sans-serif';
        ctx.fillText(z.name.toUpperCase() + (down ? '  DOWN' : ''), z.cx, z.cy - z.r + 16);
    });

    S.lines.forEach(function (line, li) {
        if (!line || line.stops.length < 2) return;
        ctx.strokeStyle = line.color;
        ctx.lineWidth = li === S.selLine ? 9 : 7;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i < line.stops.length - 1; i++) {
            const a = S.stations[line.stops[i]], b = S.stations[line.stops[i + 1]];
            if (!a || !b) continue;
            const e = elbow(a.x, a.y, b.x, b.y);
            if (i === 0) ctx.moveTo(a.x, a.y);
            ctx.lineTo(e[0], e[1]); ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();
    });

    if (S.drag) {
        const a = S.stations[S.drag.from];
        if (a) {
            ctx.strokeStyle = 'rgba(255,255,255,.55)';
            ctx.lineWidth = 4; ctx.setLineDash([6, 6]);
            const e = elbow(a.x, a.y, S.drag.x, S.drag.y);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(e[0], e[1]); ctx.lineTo(S.drag.x, S.drag.y); ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    S.runners.forEach(function (r) {
        const line = S.lines[r.line];
        if (!line || line.stops.length < 2) return;
        const nextIdx = r.seg + r.dir;
        const a = S.stations[line.stops[r.seg]], b = S.stations[line.stops[nextIdx]];
        if (!a || !b) return;
        const pt = segPoint(a, b, r.p);
        ctx.fillStyle = line.color;
        ctx.strokeStyle = '#04121d'; ctx.lineWidth = 3;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(pt.x - 11, pt.y - 7, 22, 14, 4);
        else ctx.rect(pt.x - 11, pt.y - 7, 22, 14);
        ctx.fill(); ctx.stroke();
        r.load.forEach(function (q, i) {
            drawShape(pt.x - 6 + (i % 3) * 6, pt.y - 2 + Math.floor(i / 3) * 6, q.want, 2, '#04121d', null);
        });
    });

    S.stations.forEach(function (st) {
        if (st.over > 0) {
            const k = Math.min(1, st.over / OVERLOAD_FUSE);
            ctx.beginPath(); ctx.arc(st.x, st.y, 22 + k * 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,77,94,' + (0.35 + k * 0.6) + ')';
            ctx.lineWidth = 2 + k * 3; ctx.stroke();
        }
        drawShape(st.x, st.y, st.shape, 13, st.dead ? '#38455c' : '#eaf5ff', '#04121d', 4);
        st.queue.forEach(function (q, i) {
            const col = Math.floor(i / 4), row = i % 4;
            drawShape(st.x + 23 + col * 11, st.y - 16 + row * 11, q.want, 3.6,
                      q.age > REQ_PATIENCE * 0.7 ? '#ff9aa4' : '#9fd8e8', null);
        });
    });

    if (S.msgT > 0) {
        ctx.globalAlpha = Math.min(1, S.msgT);
        ctx.fillStyle = '#fff';
        ctx.font = '700 16px Segoe UI, sans-serif';
        ctx.fillText(S.msg, W / 2, 40);
        ctx.globalAlpha = 1;
    }
}

function flash(m) { S.msg = m; S.msgT = 3.2; }

/* ══════════════════════════════ hud ══════════════════════════════ */

function paintChips() {
    const box = document.getElementById('chips');
    box.innerHTML = '';
    for (let i = 0; i < S.linesMax; i++) {
        const l = S.lines[i];
        const used = !!(l && l.stops.length >= 2);
        const d = document.createElement('div');
        d.className = 'lchip' + (used ? '' : ' empty') + (i === S.selLine ? ' sel' : '');
        if (used) d.style.background = l.color;
        d.textContent = used ? String(l.stops.length) : '+';
        d.title = used ? 'Line ' + (i + 1) + ' -- click to select, double-click to tear up'
                       : 'Empty line slot -- select it, then drag between two stations';
        d.addEventListener('click', function () { S.selLine = i; paintChips(); });
        d.addEventListener('dblclick', function () { clearLine(i); });
        box.appendChild(d);
    }
    document.getElementById('r-run').textContent = S.runnersSpare;
    document.getElementById('r-tun').textContent = Math.max(0, S.tunnels - tunnelsUsed());
}

function paintHud() {
    const u = uptime();
    document.getElementById('s-week').textContent = S.week;
    document.getElementById('s-served').textContent = S.served;
    document.getElementById('s-drop').textContent = S.dropped;
    const el = document.getElementById('s-up');
    el.querySelector('b').textContent = u.toFixed(2) + '%';
    el.className = 'stat ' + (u >= 99.9 ? 'good' : u >= 99 ? 'warn' : 'bad');
}

/* ══════════════════════════════ upgrades ══════════════════════════════ */

const UPGRADES = [
    { t: 'A new line',     d: 'One more colour to draw with. More reach, more topology to think about.', f: function () { S.linesMax++; } },
    { t: 'Another runner', d: 'Spare capacity to put on any line. Throughput rather than reach.',        f: function () { S.runnersSpare++; } },
    { t: 'A tunnel',       d: 'One more cross-zone hop allowed. Survivability -- but runners crawl over it.', f: function () { S.tunnels++; } },
    { t: 'Bigger buffers', d: 'Every station tolerates 2 more queued requests before the fuse starts burning.', f: function () { S.capBonus += 2; } }
];

function offerUpgrade() {
    paused = true;
    const pool = UPGRADES.slice();
    const pick = [];
    while (pick.length < 3 && pool.length) {
        pick.push(pool.splice(Math.floor(S.rng() * pool.length), 1)[0]);
    }
    showOverlay(
        '<h2>Week ' + S.week + '</h2>' +
        '<p class="sub">Demand does not stop climbing. Pick one.</p>' +
        '<div class="choices">' + pick.map(function (c, i) {
            return '<button type="button" class="choice" data-i="' + i + '"><b>' + c.t + '</b><span>' + c.d + '</span></button>';
        }).join('') + '</div>',
        function (root) {
            root.querySelectorAll('.choice').forEach(function (b) {
                b.addEventListener('click', function () {
                    pick[parseInt(b.dataset.i, 10)].f();
                    closeOverlay(); paused = false; paintChips();
                });
            });
        }
    );
}

/* ══════════════════════════════ overlays ══════════════════════════════ */

function showOverlay(html, wire) {
    closeOverlay();
    const o = document.createElement('div');
    o.className = 'ovl'; o.id = 'ovl';
    o.innerHTML = '<div class="box">' + html + '</div>';
    document.getElementById('stage').appendChild(o);
    if (wire) wire(o);
}
function closeOverlay() { const o = document.getElementById('ovl'); if (o) o.remove(); }

/* Evidence-based verdict -- it reads what you actually built, never a generic platitude. */
function verdict() {
    const drawn = S.lines.filter(function (l) { return l && l.stops.length >= 2; });
    if (!drawn.length) return 'You never drew a line. Requests only move along a line you author.';
    const cross = tunnelsUsed();
    if (cross === 0 && S.azFailed) {
        return 'Every line stayed inside one zone, so when that zone failed there was no path around it.';
    }
    if (cross === 0) return 'You kept every line inside a single zone. Fast hops, but a single zone failure would have taken the whole run with it.';
    if (S.replicating) return 'You spread data stations across zones. That bought survivability and cost queue capacity to replication -- exactly the trade the tax models.';
    const longest = drawn.reduce(function (m, l) { return Math.max(m, l.stops.length); }, 0);
    if (longest >= 7) return 'One very long line. It reaches everything, but a runner takes a long time to come back to where it is needed.';
    return 'Short lines and tight loops. Good latency, but every new station forces another decision.';
}

function endRun() {
    paused = true;
    const u = uptime();
    /* A ratio is only as good as the sample behind it. 14 requests served with none dropped is
       100%, and it is not four nines -- it is not enough traffic to claim anything. Each nine
       demands roughly an order of magnitude more evidence, which is exactly how availability
       targets work in practice. */
    const MIN_FOR = { 4: 1000, 3: 200, 2: 50 };
    let nines, col;
    if (S.served < MIN_FOR[2]) {
        nines = 'NOT ENOUGH TRAFFIC';
        col = 'var(--muted)';
    } else if (u >= 99.99 && S.served >= MIN_FOR[4]) { nines = 'FOUR NINES';  col = 'var(--ok)'; }
    else if (u >= 99.9 && S.served >= MIN_FOR[3])    { nines = 'THREE NINES'; col = 'var(--ok)'; }
    else if (u >= 99)                                { nines = 'TWO NINES';   col = 'var(--warn)'; }
    else                                             { nines = 'BELOW TWO NINES'; col = 'var(--bad)'; }

    showOverlay(
        '<h2>Outage</h2>' +
        '<p>' + S.overReason + '</p>' +
        '<div class="grade" style="color:' + col + '">' + nines + '</div>' +
        '<p class="sub">' + u.toFixed(3) + '% of ' + (S.served + S.dropped) + ' requests served' +
        (S.served < MIN_FOR[2]
            ? ' &mdash; too small a sample to claim any nines'
            : (u >= 99.99 && S.served < MIN_FOR[4]) ? ' &mdash; the ratio is there, the traffic is not'
            : (u >= 99.9 && S.served < MIN_FOR[3]) ? ' &mdash; the ratio is there, the traffic is not' : '') +
        '</p>' +
        '<table class="sum">' +
        '<tr><td>Weeks survived</td><td>' + S.week + '</td></tr>' +
        '<tr><td>Requests served</td><td>' + S.served + '</td></tr>' +
        '<tr><td>Requests dropped</td><td>' + S.dropped + '</td></tr>' +
        '<tr><td>Stations online</td><td>' + S.stations.filter(function (s) { return !s.dead; }).length + '</td></tr>' +
        '<tr><td>Lines drawn</td><td>' + S.lines.filter(function (l) { return l && l.stops.length >= 2; }).length + '</td></tr>' +
        '</table>' +
        '<p class="sub">' + verdict() + '</p>' +
        '<div class="choices"><button type="button" class="choice" id="again"><b>Run it again</b><span>Same seed, same map. What would you build differently?</span></button></div>',
        function (root) {
            root.querySelector('#again').addEventListener('click', function () {
                closeOverlay(); newGame(); paused = false;
                document.getElementById('btn-pause').textContent = 'Pause';
            });
        }
    );

    if (typeof GameTracker !== 'undefined' && GameTracker.record) {
        GameTracker.record('the-nines', { score: S.served, result: 'failure', weeks: S.week });
    }
    if (typeof AchievementManager !== 'undefined' && AchievementManager.unlock && u >= 99.9 && S.week >= 5) {
        AchievementManager.unlock('game_nines');
    }
    if (S.week >= 5 && !localStorage.getItem('nines_xp_awarded')) {
        try { localStorage.setItem('nines_xp_awarded', 'true'); } catch (e) { /* private mode */ }
        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
            FirestoreManager.addXP(null, 50, 'The Nines: 5 weeks');
        }
    }
}

/* ══════════════════════════════ input: drag to draw ══════════════════════════════ */

function pos(ev) {
    const r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

cv.addEventListener('pointerdown', function (ev) {
    if (paused || !S || S.over) return;
    const p = pos(ev);
    const st = stationAt(p.x, p.y);
    if (!st) return;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* older browsers */ }
    S.drag = { from: st.id, x: p.x, y: p.y };
});
cv.addEventListener('pointermove', function (ev) {
    if (!S || !S.drag) return;
    const p = pos(ev);
    S.drag.x = p.x; S.drag.y = p.y;
});
cv.addEventListener('pointerup', function (ev) {
    if (!S || !S.drag) return;
    const p = pos(ev);
    const st = stationAt(p.x, p.y);
    if (st) tryConnect(S.drag.from, st.id);
    S.drag = null;
});
cv.addEventListener('pointercancel', function () { if (S) S.drag = null; });

/* ══════════════════════════════ loop ══════════════════════════════ */

function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = r.width || 800; H = r.height || 600;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutZones();
}
window.addEventListener('resize', resize);

/* FIXED TIMESTEP. The demand roll draws one RNG value per live station per update(), so
   stepping by a variable frame delta made the number of draws a function of FRAMERATE rather
   than elapsed time -- which quietly broke the "same seed, same run" promise the restart
   button makes. Accumulating and stepping in fixed 1/60s slices makes a replay depend only on
   elapsed time and player input, which is what determinism has to mean here. */
const STEP = 1 / 60;
let acc = 0;

function loop(ts) {
    const dt = Math.min(0.25, (ts - lastT) / 1000 || 0);
    lastT = ts;
    if (S && !paused && !S.over) {
        acc += dt;
        let guard = 0;
        while (acc >= STEP && !S.over && guard++ < 240) {   // guard: never spiral after a tab-out
            update(STEP);
            if (S.msgT > 0) S.msgT -= STEP;
            acc -= STEP;
        }
        if (S.over) endRun();
    }
    if (S) { render(); paintHud(); }
    requestAnimationFrame(loop);
}

/* Spending a spare runner on an already-drawn line. Without this the weekly "Another runner"
   upgrade was a dead counter once every line slot was in use -- the UI sold throughput the
   player could never actually deploy. */
document.getElementById('add-runner').addEventListener('click', function () {
    const l = S.lines[S.selLine];
    if (!l || l.stops.length < 2) { flash('Select a drawn line first'); return; }
    if (S.runnersSpare <= 0) { flash('No spare runner'); return; }
    assignRunner(S.selLine);
    flash('Runner added to line ' + (S.selLine + 1));
    paintChips();
});

document.getElementById('btn-pause').addEventListener('click', function () {
    if (!S || S.over) return;
    paused = !paused;
    this.textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('btn-restart').addEventListener('click', function () {
    closeOverlay(); newGame(); paused = false;
    document.getElementById('btn-pause').textContent = 'Pause';
});

resize();
newGame();
resize();
requestAnimationFrame(loop);

if (typeof GameBriefing !== 'undefined') {
    GameBriefing.init({
        key: 'the-nines',
        title: 'The Nines',
        accent: '#22d3ee',
        role: 'You are the capacity planner for a service whose traffic never stops growing.',
        goal: 'Keep requests moving. A station that stays over capacity for nine seconds takes the service down, and the run ends there -- at that station, where you can see it.',
        howto: [
            'DRAG from one station to another to draw a line. That line is a request path.',
            'Requests are the small shapes queued beside each station. A request only boards if your line reaches a station of its shape.',
            'Lines extend from either END. Double-click a line chip to tear it up and get the runner back.',
            'Select a line, then press + beside Runners to put a spare runner on it -- more carrying capacity on the same track.',
            'Each week, choose one upgrade: a new line, another runner, a tunnel, or bigger buffers.',
            'Crossing a zone boundary spends a tunnel and runners crawl over it -- the latency tax, made physical.'
        ],
        why: 'Capacity planning is topology, not arithmetic. Where you route matters more than how much you buy.',
        help: 'Press How to Play any time to reopen this briefing.'
    });
}
</script>
