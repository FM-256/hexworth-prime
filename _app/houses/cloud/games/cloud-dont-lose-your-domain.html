<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Lose Your Domain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'Terminal';
            src: local('Cascadia Mono'), local('Consolas'), local('Courier New');
        }

        body {
            background: linear-gradient(180deg, #0a0a12 0%, #0a0a0a 50%, #080810 100%);
            color: #c0c0c0;
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* CRT Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.25) 100%);
            pointer-events: none;
            z-index: 999;
        }

        /* ── Header Bar ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(160deg, #111118 0%, #111 50%, #0d0d14 100%);
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
            flex-shrink: 0;
            box-shadow: 0 2px 15px rgba(6, 182, 212, 0.08);
            position: relative;
            z-index: 1;
        }

        .header-title {
            color: #e74c3c;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            min-width: 60px;
            text-align: right;
            transition: color 0.3s;
        }

        .timer.warning { color: #f39c12; }
        .timer.critical { color: #e74c3c; animation: pulse 0.5s infinite alternate; }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* ── Achievements Counter ── */
        .achievement-counter {
            font-size: 12px;
            color: #f1c40f;
            cursor: pointer;
            padding: 2px 8px;
            border: 1px solid #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .achievement-counter:hover {
            background: rgba(241, 196, 15, 0.08);
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.15);
        }

        /* ── Output Area ── */
        .output-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        .output-area::-webkit-scrollbar { width: 8px; }
        .output-area::-webkit-scrollbar-track { background: #0a0a0a; }
        .output-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%); border-radius: 4px; }

        .line { margin-bottom: 2px; white-space: pre-wrap; word-wrap: break-word; }
        .line-input { color: #22d3ee; }
        .line-system { color: #7f8c8d; font-style: italic; }
        .line-success { color: #2ecc71; }
        .line-error { color: #e74c3c; }
        .line-warning { color: #f39c12; }
        .line-critical { color: #e74c3c; font-weight: bold; }
        .line-alert { color: #e67e22; }
        .line-info { color: #22d3ee; }
        .line-dim { color: #555; }
        .line-achievement { color: #f1c40f; }
        .line-narrative { color: #bdc3c7; }
        .line-title { color: #e74c3c; }
        .line-hint { color: #9b59b6; }
        .line-ps-output { color: #ddd; }

        /* ── Input Area ── */
        .input-area {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(160deg, #111118 0%, #111 50%, #0d0d14 100%);
            border-top: 1px solid rgba(6, 182, 212, 0.2);
            flex-shrink: 0;
            box-shadow: 0 -2px 15px rgba(6, 182, 212, 0.05);
            position: relative;
            z-index: 1;
        }

        .prompt {
            color: #22d3ee;
            margin-right: 8px;
            white-space: nowrap;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.4);
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: #eee;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #67e8f9;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
        }

        .input-field::placeholder {
            color: #444;
        }

        .input-field:disabled {
            color: #555;
        }

        /* ── Achievement Toast ── */
        .achievement-toast {
            position: fixed;
            top: 60px;
            right: 20px;
            background: linear-gradient(160deg, #1a1a10 0%, #141408 100%);
            border: 1px solid #f1c40f;
            border-left: 4px solid #f1c40f;
            padding: 12px 16px;
            border-radius: 4px;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s ease;
            z-index: 100;
            max-width: 320px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(241, 196, 15, 0.15);
        }

        .achievement-toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .achievement-toast-label {
            color: #f1c40f;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .achievement-toast-name {
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
        }

        .achievement-toast-desc {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ── Achievement Gallery Overlay ── */
        .gallery-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .gallery-overlay.show {
            display: flex;
        }

        .gallery {
            background: linear-gradient(160deg, #141418 0%, #111 50%, #0d0d12 100%);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.1);
        }

        .gallery h2 {
            color: #f1c40f;
            margin-bottom: 16px;
            font-size: 16px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .gallery-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .gallery-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .gallery-icon.unlocked {
            background: #2c2a0a;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .gallery-icon.locked {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #333;
        }

        .gallery-text { flex: 1; }

        .gallery-name {
            font-size: 13px;
            font-weight: bold;
        }

        .gallery-name.unlocked { color: #f1c40f; }
        .gallery-name.locked { color: #555; }

        .gallery-desc {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .gallery-close {
            margin-top: 16px;
            text-align: center;
        }

        .gallery-close button {
            background: linear-gradient(160deg, #1a1a22 0%, #1a1a1a 100%);
            border: 1px solid #333;
            color: #888;
            padding: 6px 20px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .gallery-close button:hover {
            border-color: #f1c40f;
            color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
            transform: translateY(-1px);
        }

        /* ── Title Screen ── */
        .title-art {
            color: #e74c3c;
            font-size: 13px;
            line-height: 1.3;
            margin: 20px 0;
        }

        /* ── Ending Screen ── */
        .ending-options {
            margin-top: 16px;
        }

        .ending-options span {
            color: #22d3ee;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 20px;
            transition: all 0.3s ease;
        }

        .ending-options span:hover {
            color: #67e8f9;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .back-link { position:fixed; top:12px; left:20px; color:#06b6d4; text-decoration:none; font-size:14px; cursor:pointer; z-index:10000; transition:color 0.3s; font-family:monospace; }
        .back-link:hover { color:#22d3ee; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; Back to Cloud House</a>
    <div class="header">
        <span class="header-title">DON'T LOSE YOUR DOMAIN</span>
        <span class="achievement-counter" id="achCounter" onclick="Game.showGallery()" title="View Achievements">&#9733; 0/12</span>
        <span class="timer" id="timer">3:00</span>
    </div>

    <div class="output-area" id="output"></div>

    <div class="input-area">
        <span class="prompt" id="prompt">PS C:\&gt;</span>
        <input type="text" class="input-field" id="input" placeholder="Type a command..." autofocus autocomplete="off" spellcheck="false">
    </div>

    <div class="achievement-toast" id="toast">
        <div class="achievement-toast-label">ACHIEVEMENT UNLOCKED</div>
        <div class="achievement-toast-name" id="toastName"></div>
        <div class="achievement-toast-desc" id="toastDesc"></div>
    </div>

    <div class="gallery-overlay" id="galleryOverlay">
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
    const Game = (function() {

        /* ═══════════════════════════════════════
           ACHIEVEMENT DEFINITIONS
           ═══════════════════════════════════════ */
        const ACHIEVEMENTS = {
            clean_kill:     { name: 'Clean Kill',       icon: '⊘', desc: 'Disable the account' },
            identity_crisis:{ name: 'Identity Crisis',  icon: '⚿', desc: 'Reset the password' },
            privilege_revoked:{ name: 'Privilege Revoked', icon: '↓', desc: 'Remove from Domain Admins' },
            by_the_book:    { name: 'By The Book',      icon: '★', desc: 'Disable + remove DA + reset password' },
            nuclear_option: { name: 'The Nuclear Option',icon: '☢', desc: 'Shut down the domain controller' },
            friendly_fire:  { name: 'Friendly Fire',    icon: '☠', desc: 'Disable the wrong account' },
            frozen:         { name: 'Frozen',           icon: '❄', desc: 'Do nothing until time runs out' },
            panic:          { name: 'Panic!',           icon: '!', desc: 'Panic during an incident' },
            wrong_os:       { name: 'Wrong OS',         icon: '#', desc: 'Try a Linux command on Windows' },
            coffee_break:   { name: 'Coffee Break',     icon: '♨', desc: 'Drink coffee during an incident' },
            spectator:      { name: 'Spectator',        icon: '◉', desc: 'Only run Get-* commands' },
            speed_run:      { name: 'Speed Run',        icon: '»', desc: 'Neutralize the threat in under 15 seconds' },
        };

        const STORAGE_KEY = 'hexworth_dontlose_achievements';

        /* ═══════════════════════════════════════
           GAME STATE
           ═══════════════════════════════════════ */
        let state = {};
        let gameId = 0;

        function resetState() {
            gameId++;
            state = {
                phase: 'title',        // title | playing | ended
                timeRemaining: 180,
                timeElapsed: 0,
                timerInterval: null,
                marcusActive: true,
                accountDisabled: false,
                passwordReset: false,
                removedFromDA: false,
                dcShutdown: false,
                selfDisabled: false,
                commandsRun: [],
                onlyGetCommands: true,  // tracks if player only used Get-* commands
                commandCount: 0,
                eventsTriggered: [],
                threatLevel: 0,
                ending: null,
                toastTimeout: null,
            };
        }

        /* ═══════════════════════════════════════
           INITIALIZATION
           ═══════════════════════════════════════ */
        function init() {
            resetState();
            const outputEl = document.getElementById('output');
            const inputEl = document.getElementById('input');
            const timerEl = document.getElementById('timer');

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const raw = inputEl.value.trim();
                    inputEl.value = '';
                    if (raw) handleInput(raw);
                }
            });

            updateAchievementCounter();
            showTitle();
        }

        /* ═══════════════════════════════════════
           DISPLAY FUNCTIONS
           ═══════════════════════════════════════ */
        function print(text, className) {
            const outputEl = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' line-' + className : '');
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function printBlank() {
            print('');
        }

        function printSlow(lines, className, delay, callback) {
            let i = 0;
            function next() {
                if (i < lines.length) {
                    print(lines[i], className);
                    i++;
                    setTimeout(next, delay || 80);
                } else if (callback) {
                    callback();
                }
            }
            next();
        }

        /* ═══════════════════════════════════════
           TITLE SCREEN
           ═══════════════════════════════════════ */
        function showTitle() {
            document.getElementById('timer').textContent = '3:00';
            document.getElementById('timer').className = 'timer';
            document.getElementById('prompt').style.display = 'none';
            document.getElementById('input').placeholder = 'Press Enter to start...';

            const lines = [
                '',
                '  ╔══════════════════════════════════════════════════╗',
                '  ║                                                  ║',
                "  ║         DON'T LOSE YOUR DOMAIN                  ║",
                '  ║                                                  ║',
                '  ║         A Sysadmin Survival Game                 ║',
                '  ║                                                  ║',
                '  ╚══════════════════════════════════════════════════╝',
                '',
            ];

            for (const line of lines) print(line, 'title');

            printBlank();
            print('  You have 3 minutes. One disgruntled ex-employee.', 'dim');
            print('  And the keys to the kingdom are in the wrong hands.', 'dim');
            printBlank();
            print('  Type PowerShell commands. Make the right calls.', 'dim');
            print('  Or don\'t. There are 12 achievements either way.', 'dim');
            printBlank();
            print('  Press ENTER to start.', 'info');
            printBlank();

            const saved = loadAchievements();
            const count = Object.keys(saved).length;
            if (count > 0) {
                print(`  [${count}/12 achievements unlocked]`, 'achievement');
                printBlank();
            }
        }

        /* ═══════════════════════════════════════
           GAME START
           ═══════════════════════════════════════ */
        function startGame() {
            state.phase = 'playing';
            document.getElementById('output').innerHTML = '';
            document.getElementById('prompt').style.display = '';
            document.getElementById('input').placeholder = 'Type a command...';

            const intro = [
                'FRIDAY, 4:47 PM',
                '',
                'You\'re about to leave for the weekend when your phone rings.',
                '',
                '"This is Janet from HR. We terminated Marcus Chen about',
                '30 minutes ago. He... didn\'t take it well. Could you',
                'disable his access?"',
                '',
                'You pull up Active Directory.',
                '',
                '  Name:    Marcus Chen',
                '  Login:   mchen',
                '  Title:   Senior Developer',
                '  Groups:  Domain Admins, Developers, VPN-Users',
                '  Status:  Enabled',
                '  VPN:     Connected (since 3:52 PM)',
                '',
                'He was fired 30 minutes ago.',
                'He\'s still connected via VPN.',
                'He has Domain Admin privileges.',
                '',
                'The clock is ticking.',
                '',
            ];

            for (const line of intro) {
                print(line, line.startsWith('  ') ? 'ps-output' : 'narrative');
            }

            print('Type HELP for available commands.', 'info');
            printBlank();

            // Start the countdown
            state.timerInterval = setInterval(tick, 1000);
            document.getElementById('input').focus();
        }

        /* ═══════════════════════════════════════
           TIMER & EVENTS
           ═══════════════════════════════════════ */
        function tick() {
            state.timeRemaining--;
            state.timeElapsed++;
            updateTimerDisplay();

            if (state.marcusActive) {
                checkTimedEvents();
            }

            if (state.timeRemaining <= 0) {
                timeUp();
            }
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer');
            const mins = Math.floor(state.timeRemaining / 60);
            const secs = state.timeRemaining % 60;
            el.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

            if (state.timeRemaining <= 30) {
                el.className = 'timer critical';
            } else if (state.timeRemaining <= 60) {
                el.className = 'timer warning';
            } else {
                el.className = 'timer';
            }
        }

        function checkTimedEvents() {
            const events = [
                { at: 20,  id: 'rdp',    level: 'alert',    text: '[WARNING] Unusual RDP connections detected from mchen\'s session.' },
                { at: 45,  id: 'backup', level: 'warning',  text: '[ALERT] Backup schedule \'NightlyFull\' was just deleted by mchen.' },
                { at: 75,  id: 'gpo',    level: 'warning',  text: '[ALERT] Group Policy \'Default Domain Policy\' was modified by mchen.' },
                { at: 105, id: 'files',  level: 'critical', text: '[CRITICAL] Mass file deletion detected on \\\\FS01\\shared$.' },
                { at: 135, id: 'dns',    level: 'critical', text: '[CRITICAL] DNS zone records for hexworth.local are being purged.' },
                { at: 165, id: 'schema', level: 'critical', text: '[CRITICAL] Schema modification attempt detected. This is NOT a drill.' },
            ];

            for (const ev of events) {
                if (state.timeElapsed >= ev.at && !state.eventsTriggered.includes(ev.id)) {
                    state.eventsTriggered.push(ev.id);
                    state.threatLevel++;
                    printBlank();
                    print(ev.text, ev.level);
                    printBlank();
                }
            }
        }

        function timeUp() {
            clearInterval(state.timerInterval);

            if (state.marcusActive) {
                // Total failure
                printBlank();
                print('════════════════════════════════════════', 'critical');
                print('GAME OVER', 'critical');
                print('════════════════════════════════════════', 'critical');
                printBlank();
                print('Time\'s up. Marcus deleted the AD Schema,', 'error');
                print('wiped the backups, and posted your domain', 'error');
                print('credentials on Pastebin.', 'error');
                printBlank();
                print('Estimated recovery time: 2-3 weeks.', 'dim');
                print('Your boss is calling. HR is calling.', 'dim');
                print('Your boss\'s boss is calling.', 'dim');

                if (state.commandCount === 0) {
                    unlock('frozen');
                }

                if (state.onlyGetCommands && state.commandCount > 0) {
                    unlock('spectator');
                }

                state.ending = 'timeout';
            } else {
                // Time ran out but threat was already neutralized
                printBlank();
                print('Time\'s up, but the threat was already neutralized.', 'success');
            }

            endGame();
        }

        /* ═══════════════════════════════════════
           INPUT HANDLING
           ═══════════════════════════════════════ */
        function handleInput(raw) {
            if (state.phase === 'title') {
                startGame();
                return;
            }

            if (state.phase === 'ended') {
                const lower = raw.toLowerCase();
                if (lower === 'r' || lower === 'restart' || lower === 'play again' || lower === 'again') {
                    restart();
                } else if (lower === 'a' || lower === 'achievements') {
                    showGallery();
                }
                return;
            }

            // Echo the input
            print('PS C:\\> ' + raw, 'input');

            state.commandCount++;
            state.commandsRun.push(raw);

            const result = processCommand(raw);
            if (result) {
                for (const line of result.split('\n')) {
                    print(line, result._className || 'ps-output');
                }
            }

            printBlank();

            // Check win conditions after each command
            if (state.phase === 'playing') {
                checkWinCondition();
            }
        }

        /* ═══════════════════════════════════════
           COMMAND PROCESSING
           ═══════════════════════════════════════ */
        function processCommand(raw) {
            const trimmed = raw.trim();
            const lower = trimmed.toLowerCase();

            // ── Adventure / fun commands ──
            if (['look', 'examine', 'look around'].includes(lower)) {
                return adventureLook();
            }
            if (['inventory', 'i', 'inv'].includes(lower)) {
                return styledLine('You have: coffee (cold), a keyboard, admin credentials, and mounting dread.', 'dim');
            }
            if (['help', '?', 'help me'].includes(lower)) {
                return showHelp();
            }
            if (['hint', 'hints'].includes(lower)) {
                return showHint();
            }
            if (['time', 'clock', 'timer'].includes(lower)) {
                const mins = Math.floor(state.timeRemaining / 60);
                const secs = state.timeRemaining % 60;
                return styledLine(`${mins} minute${mins !== 1 ? 's' : ''} and ${secs} second${secs !== 1 ? 's' : ''} remaining.`, 'info');
            }
            if (['panic', 'freak out', 'scream'].includes(lower)) {
                unlock('panic');
                state.timeRemaining = Math.max(0, state.timeRemaining - 10);
                updateTimerDisplay();
                return styledLine('You hyperventilate into a paper bag. This doesn\'t help. (-10 seconds)', 'warning');
            }
            if (['coffee', 'drink coffee', 'get coffee', 'sip coffee'].includes(lower)) {
                unlock('coffee_break');
                return styledLine('You take a sip. It\'s cold and bitter, like your current situation.', 'dim');
            }
            if (['pray', 'hope'].includes(lower)) {
                return styledLine('The IT gods are silent. They demand PowerShell, not prayers.', 'dim');
            }
            if (['cry', 'weep'].includes(lower)) {
                return styledLine('There\'s no crying in system administration.', 'dim');
            }
            if (['quit', 'exit', 'q', 'logout'].includes(lower)) {
                return styledLine('You can\'t quit. Marcus certainly isn\'t.', 'warning');
            }
            if (['call security', 'security', 'phone security'].includes(lower)) {
                return styledLine('Security is on their way to escort Marcus from the building.\nBut he\'s on VPN. From home. Security can\'t unplug a VPN.', 'dim');
            }
            if (['call police', 'call 911', 'police', '911'].includes(lower)) {

        function processPowerShell(raw) {
            // Parse: CommandName -Param Value -Param "Value With Spaces"
            const parts = [];
            let current = '';
            let inQuotes = false;
            let quoteChar = '';

            for (let i = 0; i < raw.length; i++) {
                const ch = raw[i];
                if (inQuotes) {
                    if (ch === quoteChar) { inQuotes = false; }
                    else { current += ch; }
                } else if (ch === '"' || ch === "'") {
                    inQuotes = true;
                    quoteChar = ch;
                } else if (ch === ' ') {
                    if (current) { parts.push(current); current = ''; }
                } else {
                    current += ch;
                }
            }
            if (current) parts.push(current);

            if (parts.length === 0) return null;

            const cmdlet = parts[0];
            const cmdLower = cmdlet.toLowerCase();

            // Parse named parameters
            const params = {};
            const positionalArgs = [];
            for (let i = 1; i < parts.length; i++) {
                if (parts[i].startsWith('-')) {
                    const paramName = parts[i].substring(1);
                    if (i + 1 < parts.length && !parts[i + 1].startsWith('-')) {
                        params[paramName.toLowerCase()] = parts[i + 1];
                        i++;
                    } else {
                        params[paramName.toLowerCase()] = true;
                    }
                } else {
                    positionalArgs.push(parts[i]);
                }
            }

            const identity = params.identity || positionalArgs[0] || null;

            // Track if only Get-* commands
            if (!cmdLower.startsWith('get-')) {
                state.onlyGetCommands = false;
            }

            // ── Command dispatch ──
            switch (cmdLower) {
                case 'disable-adaccount':   return cmdDisableAccount(identity);
                case 'enable-adaccount':    return cmdEnableAccount(identity);
                case 'get-aduser':          return cmdGetADUser(identity, params);
                case 'set-adaccountpassword': return cmdResetPassword(identity);
                case 'remove-adgroupmember': return cmdRemoveGroupMember(params, positionalArgs);
                case 'get-adgroupmember':   return cmdGetGroupMember(identity);
                case 'get-adgroup':         return cmdGetGroup(identity, params);
                case 'remove-aduser':       return cmdRemoveUser(identity);
                case 'restart-computer':    return cmdRestartComputer(params);
                case 'stop-computer':       return cmdStopComputer();
                case 'get-eventlog':        return cmdGetEventLog();
                case 'get-winevent':        return cmdGetEventLog();
                case 'get-adcomputer':      return cmdGetComputer(identity, params);
                case 'search-adaccount':    return cmdSearchAccount(params);
                case 'new-aduser':          return styledLine(`New-ADUser : Now is really not the time to be creating accounts.`, 'warning');
                case 'get-process':         return cmdGetProcess();
                case 'clear-host':
                case 'cls':
                case 'clear':
                    document.getElementById('output').innerHTML = '';
                    return null;
                default:
                    return styledLine(`'${cmdlet}' is not recognized as a cmdlet, function, or operable program.\nType HELP for available commands.`, 'error');
            }
        }

        function endGame() {
            state.phase = 'ended';
            clearInterval(state.timerInterval);

            // Award platform achievements via AchievementSystem
            if (typeof AchievementSystem !== 'undefined') {
                if (state.ending === 'success') {
                    AchievementSystem.unlockGameAchievement('domain', 'win');

                if (state.accountDisabled && state.removedFromDA && state.passwordReset) {
                    AchievementSystem.unlockGameAchievement('domain', 'by_the_book');

                const saved = loadAchievements();
                if (saved.speed_run) {
                    AchievementSystem.unlockGameAchievement('domain', 'speed');

                if (Object.keys(saved).length >= 12) {
                    AchievementSystem.unlockGameAchievement('domain', 'all');
                }
            }

            // Award XP (one-time)
            if (state.ending === 'success') {
                if (!localStorage.getItem('game_domain_xp_awarded')) {
                    const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                    localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                    localStorage.setItem('game_domain_xp_awarded', 'true');
                    if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                        const uid = localStorage.getItem('hexworth_uid');
                        if (uid) FirestoreManager.addXP(uid, 50, 'Don\'t Lose Your Domain Complete');
                    }
                }
                if (typeof AchievementManager !== 'undefined') {
                    AchievementManager.unlock('game_domain');
                }
            }

            // Track game stats
            if (typeof GameTracker !== 'undefined') {
                const saved = loadAchievements();
                GameTracker.record('domain', {
                    result: state.ending || 'unknown',
                    timeElapsed: state.timeElapsed,
                    commandsUsed: state.commandCount,
                    achievementsEarned: Object.keys(saved).length,
                    achievementsTotal: Object.keys(ACHIEVEMENTS).length

            }

            document.getElementById('input').placeholder = 'Type R to restart or A for achievements...';

            printBlank();
            print('────────────────────────────────────────', 'dim');

            const saved = loadAchievements();
            const count = Object.keys(saved).length;
            print(`Achievements: ${count}/12`, 'achievement');

            printBlank();
            print('[R] Play Again    [A] View Achievements', 'info');

            const saved = loadAchievements();
            if (saved[id]) return; // already unlocked

            const ach = ACHIEVEMENTS[id];
            if (!ach) return;

            saved[id] = { unlockedAt: Date.now() };
            saveAchievements(saved);

            // Show toast
            showToast(ach.name, ach.desc);

            // Update counter
            updateAchievementCounter();

            // Print in terminal
            print(`[ACHIEVEMENT] ${ach.icon} ${ach.name} — ${ach.desc}`, 'achievement');

        function adventureLook() {
            let desc = 'You\'re at your desk in the server room. Two monitors glow in the dim light.\n';
            desc += 'Left monitor: Active Directory Users and Computers.\n';
            desc += 'Right monitor: VPN dashboard.\n\n';

            if (state.accountDisabled) {
                desc += 'VPN Dashboard shows: mchen — Disconnected.\n';
                desc += 'The immediate threat is over. You can breathe.';
            } else if (state.passwordReset) {
                desc += 'VPN Dashboard shows: mchen — Connected (credentials expiring).\n';
                desc += 'His session is winding down. The new password locked him out.';
            } else if (state.removedFromDA) {
                desc += 'VPN Dashboard shows: mchen — Connected.\n';
                desc += 'He\'s still connected but no longer has admin privileges.\n';
                desc += 'He can still access things a normal user can. Is that enough?';
            } else {
                desc += 'VPN Dashboard shows: mchen — Connected (since 3:52 PM).\n';
                desc += 'Active. Authenticated. Domain Admin.\n';
                desc += 'Your coffee is cold. Your palms are not.';
            }

            return styledLine(desc, 'dim');
        }

        function timeAgo(minutes) {
            const d = new Date();
            d.setMinutes(d.getMinutes() - minutes);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        /* ═══════════════════════════════════════
           GALLERY CLOSE ON CLICK OUTSIDE
           ═══════════════════════════════════════ */
        document.addEventListener('click', function(e) {
            if (e.target.id === 'galleryOverlay') {
                hideGallery();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideGallery();
            }
        });

        /* ═══════════════════════════════════════
           PUBLIC API
           ═══════════════════════════════════════ */
        return { init, showGallery, hideGallery };

    })();

    // Boot
    document.addEventListener('DOMContentLoaded', Game.init);
    </script>
