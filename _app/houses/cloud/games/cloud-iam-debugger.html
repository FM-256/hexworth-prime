<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAM Policy Debugger - Hexworth Prime</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #0a0a12 0%, #0a0a0a 50%, #080810 100%);
      color: #e5e7eb;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .aws-stripe {
      height: 4px;
      background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 50%, #67e8f9 100%);
      margin-bottom: 20px;
      border-radius: 2px;
      box-shadow: 0 2px 15px rgba(6, 182, 212, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .back-link {
      color: #06b6d4;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #22d3ee;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      flex: 1;
      background: linear-gradient(135deg, #06b6d4, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
    }

    .score-display {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a2332 100%);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.1);
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 20px;
      font-weight: 700;
      color: #22d3ee;
      animation: iamStatPulse 3s ease-in-out infinite;
    }

    @keyframes iamStatPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; text-shadow: 0 0 8px rgba(6, 182, 212, 0.6); }
    }

    /* Game Area */
    .game-area {
      background: linear-gradient(160deg, #0d1b2a 0%, #141d2e 50%, #1a2332 100%);
      border-radius: 12px;
      padding: 30px;
      border: 1px solid rgba(6, 182, 212, 0.15);
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.08);
    }

    .round-info {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.12) 0%, rgba(6, 182, 212, 0.04) 100%);
      border-left: 4px solid #06b6d4;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.06);
    }

    .round-title {
      font-size: 20px;
      font-weight: 600;
      color: #22d3ee;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }

    .round-description {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.6;
    }

    /* Policy Viewer */
    .policy-section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #22d3ee;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }

    .policy-viewer {
      background: linear-gradient(160deg, #0d1b2a 0%, #0a1520 100%);
      border: 1px solid rgba(6, 182, 212, 0.15);
      border-radius: 8px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      position: relative;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .json-key {
      color: #06b6d4;
    }

    .json-string {
      color: #22c55e;
    }

    .json-number {
      color: #fbbf24;
    }

    .json-boolean {
      color: #a78bfa;
    }

    .json-bracket {
      color: #6b7280;
    }

    .problem-highlight {
      background: rgba(239, 68, 68, 0.2);
      border-bottom: 2px solid #ef4444;
      padding: 2px 4px;
      border-radius: 2px;
    }

    /* Test Results */
    .test-results {
      background: linear-gradient(160deg, #0d1b2a 0%, #0a1520 100%);
      border: 1px solid rgba(6, 182, 212, 0.15);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .test-table {
      width: 100%;
      border-collapse: collapse;
    }

    .test-table th {
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
      padding: 12px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #06b6d4;
    }

    .test-table td {
      padding: 12px;
      border-bottom: 1px solid #1e3a5f;
      font-size: 13px;
    }

    .test-table tr:last-child td {
      border-bottom: none;
    }

    .result-allow {
      color: #22c55e;
      font-weight: 600;
    }

    .result-deny {
      color: #ef4444;
      font-weight: 600;
    }

    .match-icon {
      font-size: 18px;
    }

    .match-success {
      color: #22c55e;
    }

    .match-fail {
      color: #ef4444;
    }

    /* Fix Options */
    .fix-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .fix-option {
      background: linear-gradient(160deg, #0d1b2a 0%, #0f1d2e 100%);
      border: 2px solid #1e3a5f;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .fix-option:hover {
      border-color: #06b6d4;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.25);
      background: linear-gradient(160deg, #0f1f34 0%, #11223a 100%);
    }

    .fix-option.selected {
      border-color: #22d3ee;
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }

    .fix-option.correct {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      pointer-events: none;
    }

    .fix-option.incorrect {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      pointer-events: none;
    }

    .fix-label {
      font-size: 14px;
      font-weight: 600;
      color: #22d3ee;
      margin-bottom: 8px;
    }

    .fix-code {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #d1d5db;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    .diff-remove {
      color: #ef4444;
      text-decoration: line-through;
      opacity: 0.7;
    }

    .diff-add {
      color: #22c55e;
      font-weight: 600;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0e7490 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
    }

    .btn-primary:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: linear-gradient(160deg, #1e3a5f 0%, #1a3050 100%);
      color: #22d3ee;
      border: 2px solid rgba(6, 182, 212, 0.5);
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      transform: translateY(-2px);
    }

    /* Explanation */
    .explanation {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
      border-left: 4px solid #22c55e;
      padding: 20px;
      margin-top: 20px;
      border-radius: 4px;
      animation: slideIn 0.5s ease-out;
    }

    .explanation-title {
      font-size: 16px;
      font-weight: 600;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .explanation-text {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.6;
    }

    .vulnerability-tag {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Completion Screen */
    .completion-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .completion-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #06b6d4, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
    }

    .final-score {
      font-size: 48px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.12) 0%, rgba(6, 182, 212, 0.04) 100%);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.08);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.15);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #22d3ee;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .stat-label {
      font-size: 14px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Animations */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
      }

      .title {
        font-size: 22px;
      }

      .score-display {
        width: 100%;
        justify-content: space-around;
      }

      .game-area {
        padding: 20px;
      }

      .fix-options {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* Timer Animation */
    .timer-bar {
      height: 4px;
      background: #1e3a5f;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 50%, #22c55e 100%);
      transition: width 0.3s linear;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }

    .back-link {
      transition: all 0.3s ease;
    }

    .back-link:hover {
      color: #67e8f9;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }
  </style>
</head>
<body>
  <div class="aws-stripe"></div>
  <div class="container">
    <div class="header">
      <a href="../index.html" class="back-link">← Back</a>
      <h1 class="title">IAM Policy Debugger</h1>
      <div class="score-display">
        <div class="score-item">
          <span class="score-label">Round</span>
          <span class="score-value" id="roundDisplay">1/10</span>
        </div>
        <div class="score-item">
          <span class="score-label">Score</span>
          <span class="score-value" id="scoreDisplay">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Attempts</span>
          <span class="score-value" id="attemptsDisplay">0</span>
        </div>
      </div>
    </div>

    <div id="gameContainer"></div>
  </div>
<script>
    // Game State
    let currentRound = 0;
    let totalScore = 0;
    let roundAttempts = 0;
    let startTime = Date.now();
    let roundStartTime = Date.now();

    // Game Data
    const rounds = [
      {
        title: "Round 1: Wildcard Abuse",
        description: "This policy should only allow read access to the 'company-data' S3 bucket. However, there's a security issue with the Resource specification.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:ListBucket"],
              "Resource": "*"
            }
          ]
        },
        problemKeys: ["Resource"],
        testCases: [
          { principal: "User:alice", action: "s3:GetObject", resource: "company-data/file.txt", result: "Allow", expected: "Allow", match: true },
          { principal: "User:alice", action: "s3:GetObject", resource: "confidential-hr/salaries.csv", result: "Allow", expected: "Deny", match: false },
          { principal: "User:alice", action: "s3:DeleteObject", resource: "company-data/file.txt", result: "Deny", expected: "Deny", match: true }
        ],
        fixes: [
          {
            label: "Option A: Add bucket prefix",
            code: '"Resource": "arn:aws:s3:::company-*"',
            correct: false
          },
          {
            label: "Option B: Specify exact bucket",
            code: '"Resource": [\n  "arn:aws:s3:::company-data",\n  "arn:aws:s3:::company-data/*"\n]',
            correct: true
          },
          {
            label: "Option C: Use account-level restriction",
            code: '"Resource": "*",\n"Condition": {"StringEquals": {"aws:username": "alice"}}',
            correct: false
          }
        ],
        explanation: "The wildcard '*' in the Resource field grants access to ALL S3 buckets in the account, violating the principle of least privilege. The correct fix specifies the exact bucket ARN and includes both the bucket itself and its contents (bucket/* for objects).",
        vulnerability: "Overly Permissive Resource",
        correctScore: 100
      },
      {
        title: "Round 2: Missing Explicit Deny",
        description: "This user should NOT have access to production resources, but the restriction policy isn't working as expected.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "ec2:*",
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": "ec2:DescribeInstances",
              "Resource": "*",
              "Condition": {
                "StringNotEquals": {
                  "ec2:ResourceTag/Environment": "production"
                }
              }
            }
          ]
        },
        problemKeys: ["Effect"],
        testCases: [
          { principal: "User:developer", action: "ec2:StartInstances", resource: "dev-instance-001", result: "Allow", expected: "Allow", match: true },
          { principal: "User:developer", action: "ec2:StopInstances", resource: "prod-instance-001", result: "Allow", expected: "Deny", match: false },
          { principal: "User:developer", action: "ec2:TerminateInstances", resource: "prod-instance-001", result: "Allow", expected: "Deny", match: false }
        ],
        fixes: [
          {
            label: "Option A: Remove the first statement",
            code: '// Delete the first statement entirely',
            correct: false
          },
          {
            label: "Option B: Add explicit deny for production",
            code: '{\n  "Effect": "Deny",\n  "Action": "ec2:*",\n  "Resource": "*",\n  "Condition": {\n    "StringEquals": {\n      "ec2:ResourceTag/Environment": "production"\n    }\n  }\n}',
            correct: true
          },
          {
            label: "Option C: Change first statement to conditional",
            code: '"Condition": {\n  "StringNotEquals": {"ec2:ResourceTag/Environment": "production"}\n}',
            correct: false
          }
        ],
        explanation: "In IAM, Allow statements always win unless there's an explicit Deny. The second statement attempts to restrict but only applies to DescribeInstances. An explicit Deny statement is needed to block ALL ec2:* actions on production resources, as Deny always overrides Allow.",
        vulnerability: "Ineffective Access Control",
        correctScore: 100
      },
      {
        title: "Round 3: Action Wildcard Overreach",
        description: "This policy should only allow reading and listing objects in S3, but grants far more permissions than necessary.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "s3:*",
              "Resource": [
                "arn:aws:s3:::reports-bucket",
                "arn:aws:s3:::reports-bucket/*"
              ]
            }
          ]
        },
        problemKeys: ["Action"],
        testCases: [
          { principal: "User:analyst", action: "s3:GetObject", resource: "reports-bucket/report.pdf", result: "Allow", expected: "Allow", match: true },
          { principal: "User:analyst", action: "s3:ListBucket", resource: "reports-bucket", result: "Allow", expected: "Allow", match: true },
          { principal: "User:analyst", action: "s3:DeleteObject", resource: "reports-bucket/report.pdf", result: "Allow", expected: "Deny", match: false },
          { principal: "User:analyst", action: "s3:PutBucketPolicy", resource: "reports-bucket", result: "Allow", expected: "Deny", match: false }
        ],
        fixes: [
          {
            label: "Option A: Restrict to Get* and List*",
            code: '"Action": ["s3:Get*", "s3:List*"]',
            correct: false
          },
          {
            label: "Option B: Specify exact actions needed",
            code: '"Action": [\n  "s3:GetObject",\n  "s3:ListBucket"\n]',
            correct: true
          },
          {
            label: "Option C: Add deny for dangerous actions",
            code: '// Add separate Deny statement for Delete* and Put*',
            correct: false
          }
        ],
        explanation: "The wildcard 's3:*' grants ALL S3 permissions including destructive actions like DeleteObject, DeleteBucket, and PutBucketPolicy. Following least privilege, you should specify ONLY the exact actions needed. While Get* and List* are better than *, they still grant more than the stated requirement.",
        vulnerability: "Excessive Action Permissions",
        correctScore: 100
      },
      {
        title: "Round 4: Overly Permissive Principal",
        description: "This Lambda function should only be invokable by a specific application role, but anyone can currently invoke it.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": "lambda:InvokeFunction",
              "Resource": "arn:aws:lambda:us-east-1:123456789012:function:ProcessPayment"
            }
          ]
        },
        problemKeys: ["Principal"],
        testCases: [
          { principal: "Role:PaymentProcessor", action: "lambda:InvokeFunction", resource: "ProcessPayment", result: "Allow", expected: "Allow", match: true },
          { principal: "Anonymous", action: "lambda:InvokeFunction", resource: "ProcessPayment", result: "Allow", expected: "Deny", match: false },
          { principal: "User:random-user", action: "lambda:InvokeFunction", resource: "ProcessPayment", result: "Allow", expected: "Deny", match: false }
        ],
        fixes: [
          {
            label: "Option A: Restrict to account",
            code: '"Principal": {\n  "AWS": "arn:aws:iam::123456789012:root"\n}',
            correct: false
          },
          {
            label: "Option B: Restrict to specific role",
            code: '"Principal": {\n  "AWS": "arn:aws:iam::123456789012:role/PaymentProcessor"\n}',
            correct: true
          },
          {
            label: "Option C: Add condition for IP",
            code: '"Principal": "*",\n"Condition": {\n  "IpAddress": {"aws:SourceIp": "10.0.0.0/8"}\n}',
            correct: false
          }
        ],
        explanation: "The Principal field with '*' allows ANYONE (including anonymous users from the internet) to invoke this function. For sensitive operations like payment processing, you must specify the exact role or service that should have access. While account-level restriction is better, it still allows any identity in the account.",
        vulnerability: "Public Function Exposure",
        correctScore: 100
      },
      {
        title: "Round 5: Missing IP Restriction",
        description: "This policy should only allow access from the office network (203.0.113.0/24), but currently allows access from anywhere.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "s3:*",
              "Resource": [
                "arn:aws:s3:::internal-docs",
                "arn:aws:s3:::internal-docs/*"
              ]
            }
          ]
        },
        problemKeys: ["Condition"],
        testCases: [
          { principal: "User:employee", action: "s3:GetObject", resource: "internal-docs/policy.pdf", result: "Allow (from 203.0.113.50)", expected: "Allow", match: true },
          { principal: "User:employee", action: "s3:GetObject", resource: "internal-docs/policy.pdf", result: "Allow (from 198.51.100.25)", expected: "Deny", match: false },
          { principal: "User:employee", action: "s3:PutObject", resource: "internal-docs/new.pdf", result: "Allow (from any IP)", expected: "Allow (office only)", match: false }
        ],
        fixes: [
          {
            label: "Option A: Add IP address condition",
            code: '"Condition": {\n  "IpAddress": {\n    "aws:SourceIp": "203.0.113.0/24"\n  }\n}',

    // Syntax highlight JSON
    function highlightJSON(obj, problemKeys = []) {
      let json = JSON.stringify(obj, null, 2);

      // Identify problem areas
      problemKeys.forEach(key => {
        const regex = new RegExp(`("${key}"\\s*:\\s*)([^,\\n}]+)`, 'g');
        json = json.replace(regex, (match, keyPart, valuePart) => {
          return `${keyPart}<span class="problem-highlight">${valuePart}</span>`;
        });
      });

      // Syntax highlighting
      json = json.replace(/"([^"]+)"(\s*:)/g, '<span class="json-key">"$1"</span>$2');
      json = json.replace(/:\s*"([^"]*)"/g, ': <span class="json-string">"$1"</span>');
      json = json.replace(/:\s*(\d+)/g, ': <span class="json-number">$1</span>');
      json = json.replace(/:\s*(true|false)/g, ': <span class="json-boolean">$1</span>');
      json = json.replace(/([{}\[\],])/g, '<span class="json-bracket">$1</span>');

      return json;
    }

    // Render test results table
    function renderTestResults(testCases) {
      return `
        <table class="test-table">
          <thead>
            <tr>
              <th scope="col">Principal</th>
              <th scope="col">Action</th>
              <th scope="col">Resource</th>
              <th scope="col">Result</th>
              <th scope="col">Expected</th>
              <th scope="col">Match</th>
            </tr>
          </thead>
          <tbody>
            ${testCases.map(test => `
              <tr>
                <td>${test.principal}</td>
                <td><code>${test.action}</code></td>
                <td>${test.resource}</td>
                <td class="${test.result.includes('Allow') ? 'result-allow' : 'result-deny'}">${test.result}</td>
                <td class="${test.expected === 'Allow' ? 'result-allow' : 'result-deny'}">${test.expected}</td>
                <td class="match-icon ${test.match ? 'match-success' : 'match-fail'}">${test.match ? '✓' : '✗'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Render round
    function renderRound() {
      const round = rounds[currentRound];
      roundAttempts = 0;
      roundStartTime = Date.now();

      const html = `
        <div class="game-area">
          <div class="round-info">
            <div class="round-title">${round.title}</div>
            <div class="round-description">${round.description}</div>
          </div>

          <div class="policy-section">
            <div class="section-title">
              <span><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Current Policy (JSON)
            </div>
            <div class="policy-viewer">
              <pre>${highlightJSON(round.policy, round.problemKeys)}</pre>
            </div>
          </div>

          <div class="policy-section">
            <div class="section-title">
              <span><img src="/assets/images/icons/icon-flask.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Access Test Results
            </div>
            <div class="test-results">
              ${renderTestResults(round.testCases)}
            </div>
          </div>

          <div class="policy-section">
            <div class="section-title">
              <span><img src="/assets/images/icons/icon-wrench.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Select the Correct Fix
            </div>
            <div class="fix-options" id="fixOptions">
              ${round.fixes.map((fix, index) => `
                <div class="fix-option" data-index="${index}">
                  <div class="fix-label">${fix.label}</div>
                  <div class="fix-code"><pre>${fix.code}</pre></div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="button-group">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit Fix</button>
          </div>

          <div id="explanationArea"></div>
        </div>
      `;

      document.getElementById('gameContainer').innerHTML = html;
      document.getElementById('roundDisplay').textContent = `${currentRound + 1}/10`;
      document.getElementById('attemptsDisplay').textContent = roundAttempts;

      // Add click handlers to fix options
      document.querySelectorAll('.fix-option').forEach(option => {
        option.addEventListener('click', () => selectFix(option));
      });

      document.getElementById('submitBtn').addEventListener('click', submitFix);
    }

    // Select fix option
    let selectedFixIndex = -1;
    function selectFix(option) {
      // Remove previous selection
      document.querySelectorAll('.fix-option').forEach(opt => {
        opt.classList.remove('selected');
      });

      // Select new option
      option.classList.add('selected');
      selectedFixIndex = parseInt(option.getAttribute('data-index'));
      document.getElementById('submitBtn').disabled = false;
    }

    // Submit fix
    function submitFix() {
      if (selectedFixIndex === -1) return;

      roundAttempts++;
      document.getElementById('attemptsDisplay').textContent = roundAttempts;

      const round = rounds[currentRound];
      const selectedFix = round.fixes[selectedFixIndex];
      const fixOption = document.querySelector(`.fix-option[data-index="${selectedFixIndex}"]`);

      if (selectedFix.correct) {
        // Correct answer
        fixOption.classList.remove('selected');
        fixOption.classList.add('correct');

        // Calculate score
        const timeBonus = Math.max(0, 50 - Math.floor((Date.now() - roundStartTime) / 1000));
        const attemptPenalty = (roundAttempts - 1) * 20;
        const roundScore = Math.max(0, round.correctScore + timeBonus - attemptPenalty);
        totalScore += roundScore;

        document.getElementById('scoreDisplay').textContent = totalScore;

        // Show explanation
        const explanationHTML = `
          <div class="explanation">
            <div class="explanation-title">✓ Correct! +${roundScore} points</div>
            <div class="explanation-text">${round.explanation}</div>
            <span class="vulnerability-tag">${round.vulnerability}</span>
          </div>
        `;
        document.getElementById('explanationArea').innerHTML = explanationHTML;

        // Disable all options
        document.querySelectorAll('.fix-option').forEach(opt => {
          opt.style.pointerEvents = 'none';
        });

        // Change button to Next
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.textContent = currentRound < 9 ? 'Next Round →' : 'View Results';
        submitBtn.disabled = false;
        submitBtn.onclick = () => {
          if (currentRound < 9) {
            currentRound++;
            renderRound();
          } else {
            showCompletion();
          }
        };

      } else {
        // Incorrect answer
        fixOption.classList.remove('selected');
        fixOption.classList.add('incorrect');
        selectedFixIndex = -1;
        document.getElementById('submitBtn').disabled = true;

        // Show hint
        const hintHTML = `
          <div class="explanation" style="border-color: #ef4444; background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);">
            <div class="explanation-title" style="color: #ef4444;">✗ Incorrect</div>
            <div class="explanation-text">That fix doesn't address the core security issue. Look closely at the test results that are failing and consider what policy element could fix them.</div>
          </div>
        `;
        document.getElementById('explanationArea').innerHTML = hintHTML;
      }
    }

    // Show completion screen
    function showCompletion() {
      const totalTime = Math.floor((Date.now() - startTime) / 1000);
      const avgTimePerRound = Math.floor(totalTime / 10);
      const maxScore = rounds.reduce((sum, r) => sum + r.correctScore, 0) + 500; // Base + max time bonus

      // Award XP
      if (!localStorage.getItem('game_iam_xp_awarded')) {
        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
        localStorage.setItem('game_iam_xp_awarded', 'true');
        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
          const uid = localStorage.getItem('hexworth_uid');
          if (uid) FirestoreManager.addXP(uid, 50, 'IAM Policy Debugger Complete');
        }
      }

      // Unlock achievement
      if (typeof AchievementManager !== 'undefined') {
        AchievementManager.unlock('game_iam');
      }

      // Track game completion
      if (typeof GameTracker !== 'undefined') {
        GameTracker.record('iam', { score: totalScore, total: 10 });
      }

      const html = `
        <div class="game-area completion-screen">
          <div class="completion-title"><img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> IAM Policy Debugger Complete!</div>
          <div class="final-score">${totalScore} Points</div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">10/10</div>
              <div class="stat-label">Rounds Complete</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${totalTime}s</div>
              <div class="stat-label">Total Time</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${avgTimePerRound}s</div>
              <div class="stat-label">Avg Per Round</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${Math.round((totalScore / maxScore) * 100)}%</div>
              <div class="stat-label">Score Rating</div>
            </div>
          </div>

          <div class="explanation">
            <div class="explanation-title">✓ +50 XP Awarded</div>
            <div class="explanation-text">
              You've successfully debugged 10 IAM policy vulnerabilities! You've mastered critical cloud security concepts including:
              <br><br>
              • Principle of Least Privilege<br>
              • Explicit Deny vs Allow<br>
              • Resource and Action Wildcards<br>
              • Cross-Account Trust Policies<br>
              • Conditional Access Controls<br>
              • Privilege Escalation Prevention<br>
              • MFA and Encryption Requirements
            </div>
          </div>

          <div class="button-group">
            <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
            <a href="../index.html" class="btn btn-secondary" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">Return to Cloud House</a>
          </div>
        </div>
      `;

      document.getElementById('gameContainer').innerHTML = html;
    }

    // Initialize game
    renderRound();
  </script>

    <script src="../../../components/GameScoreboard.js"></script>
