<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAM Policy Debugger - Hexworth Prime</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #0a0a12 0%, #0a0a0a 50%, #080810 100%);
      color: #e5e7eb;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .aws-stripe {
      height: 4px;
      background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 50%, #67e8f9 100%);
      margin-bottom: 20px;
      border-radius: 2px;
      box-shadow: 0 2px 15px rgba(6, 182, 212, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .back-link {
      color: #06b6d4;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #22d3ee;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      flex: 1;
      background: linear-gradient(135deg, #06b6d4, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
    }

    .score-display {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a2332 100%);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.1);
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 20px;
      font-weight: 700;
      color: #22d3ee;
      animation: iamStatPulse 3s ease-in-out infinite;
    }

    @keyframes iamStatPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; text-shadow: 0 0 8px rgba(6, 182, 212, 0.6); }
    }

    /* Game Area */
    .game-area {
      background: linear-gradient(160deg, #0d1b2a 0%, #141d2e 50%, #1a2332 100%);
      border-radius: 12px;
      padding: 30px;
      border: 1px solid rgba(6, 182, 212, 0.15);
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.08);
    }

    .round-info {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.12) 0%, rgba(6, 182, 212, 0.04) 100%);
      border-left: 4px solid #06b6d4;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.06);
    }

    .round-title {
      font-size: 20px;
      font-weight: 600;
      color: #22d3ee;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }

    .round-description {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.6;
    }

    /* Policy Viewer */
    .policy-section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #22d3ee;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }

    .policy-viewer {
      background: linear-gradient(160deg, #0d1b2a 0%, #0a1520 100%);
      border: 1px solid rgba(6, 182, 212, 0.15);
      border-radius: 8px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      position: relative;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Test Results */
    .test-results {
      background: linear-gradient(160deg, #0d1b2a 0%, #0a1520 100%);
      border: 1px solid rgba(6, 182, 212, 0.15);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .test-table {
      width: 100%;
      border-collapse: collapse;
    }

    .test-table th {
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
      padding: 12px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #06b6d4;
    }

    .test-table td {
      padding: 12px;
      border-bottom: 1px solid #1e3a5f;
      font-size: 13px;
    }

    .test-table tr:last-child td {
      border-bottom: none;
    }

    .result-allow {
      color: #22c55e;
      font-weight: 600;
    }

    .result-deny {
      color: #ef4444;
      font-weight: 600;
    }

    .match-icon {
      font-size: 18px;
    }

    .match-success {
      color: #22c55e;
    }

    .match-fail {
      color: #ef4444;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0e7490 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
    }

    .btn-primary:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: linear-gradient(160deg, #1e3a5f 0%, #1a3050 100%);
      color: #22d3ee;
      border: 2px solid rgba(6, 182, 212, 0.5);
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      transform: translateY(-2px);
    }

    /* Explanation */
    .explanation {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
      border-left: 4px solid #22c55e;
      padding: 20px;
      margin-top: 20px;
      border-radius: 4px;
      animation: slideIn 0.5s ease-out;
    }

    .explanation-title {
      font-size: 16px;
      font-weight: 600;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .explanation-text {
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.6;
    }

    .vulnerability-tag {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Completion Screen */
    .completion-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .completion-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #06b6d4, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
    }

    .final-score {
      font-size: 48px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: linear-gradient(160deg, rgba(6, 182, 212, 0.12) 0%, rgba(6, 182, 212, 0.04) 100%);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.08);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.15);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #22d3ee;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .stat-label {
      font-size: 14px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Animations */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
      }

      .title {
        font-size: 22px;
      }

      .score-display {
        width: 100%;
        justify-content: space-around;
        /* Below 900px GameScoreboard's panel starts COLLAPSED at top:130px, a 37px header band
           spanning y[130,167] on the right. This row ran straight under it -- measured on the
           candidate build at 390px ("0 >< HIGH SCORES", 11x12). The shared component keeps its
           lane and this page yields, rather than shuffling the panel into another corner. */
        margin-top: 56px;
      }

      .game-area {
        padding: 20px;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    .back-link {
      transition: all 0.3s ease;
    }

    .back-link:hover {
      color: #67e8f9;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }
  
        /* GameScoreboard.js owns top-right (top:12px/right:12px) and collided with this page's own
           HUD -- measured on production at every viewport. Push it below the chrome, reserve a lane
           on wide screens, drop it on phones where nothing fits beside the board. The push-below-
           chrome part now lives in GameScoreboard.js (top:130px), so it is not repeated here.
           The narrow-screen rule is gone too: the component now starts COLLAPSED below 900px,
           which keeps the header and the student's rank one tap away instead of deleting it. */

        /* Moving the panel down was not enough: these pages have their OWN right-side content that
           still ran under it (measured "Estimated Monthly Cost >< #1", "Node Types >< HIGH SCORES").
           Reserve a lane so page content can never occupy the panel's column, above 900px only --
           below that the panel is hidden and a lane would just steal width. */
        @media (min-width: 900px) { body { padding-right: 260px; } }
</style>
</head>
<body>
  <div class="aws-stripe"></div>
  <div class="container">
    <div class="header">
      <a href="../index.html" class="back-link">← Back</a>
      <h1 class="title">IAM Policy Debugger</h1>
      <div class="score-display">
        <div class="score-item">
          <span class="score-label">Round</span>
          <span class="score-value" id="roundDisplay">1/10</span>
        </div>
        <div class="score-item">
          <span class="score-label">Score</span>
          <span class="score-value" id="scoreDisplay">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Attempts</span>
          <span class="score-value" id="attemptsDisplay">0</span>
        </div>
      </div>
    </div>

    <div id="gameContainer"></div>
  </div>
<script>
    // Game State
    let currentRound = 0;
    let totalScore = 0;
    let roundAttempts = 0;
    let startTime = Date.now();
    let roundStartTime = Date.now();

    // Game Data — each round's `policy` is the BROKEN starting policy the player edits directly.
    // `intendedFixPolicy` is a fully-corrected reference policy (never shown to the player) used
    // only by the automated verification harness (_tools/arcade-fixes/iam-debugger-check.js) to
    // prove a real, testable fix exists for every round. Test cases carry a structured `context`
    // object (not narrative text) so the real evaluatePolicy() engine below can grade them; the
    // "Context" column in the UI is auto-labeled from that object so nothing is hidden from the
    // player, it's just structured instead of embedded in a string.
    const rounds = [
      {
        title: "Round 1: Wildcard Abuse",
        description: "This policy should only allow read access to the 'company-data' S3 bucket. However, there's a security issue with the Resource specification. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:ListBucket"], "Resource": "*" }
          ]
        },
        problemKeys: ["Resource"],
        testCases: [
          { principal: "User:alice", action: "s3:GetObject", resource: "company-data/file.txt", expected: "Allow" },
          { principal: "User:alice", action: "s3:GetObject", resource: "confidential-hr/salaries.csv", expected: "Deny" },
          { principal: "User:alice", action: "s3:DeleteObject", resource: "company-data/file.txt", expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:ListBucket"], "Resource": ["arn:aws:s3:::company-data", "arn:aws:s3:::company-data/*"] }
          ]
        },
        explanation: "The wildcard '*' in the Resource field grants access to ALL S3 buckets in the account, violating the principle of least privilege. The fix specifies the exact bucket ARN and includes both the bucket itself and its contents (bucket/* for objects).",
        vulnerability: "Overly Permissive Resource",
        correctScore: 100
      },
      {
        title: "Round 2: Missing Explicit Deny",
        description: "This user should NOT have access to production resources, but the restriction policy isn't working as expected. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "ec2:*", "Resource": "*" },
            { "Effect": "Allow", "Action": "ec2:DescribeInstances", "Resource": "*", "Condition": { "StringNotEquals": { "ec2:ResourceTag/Environment": "production" } } }
          ]
        },
        problemKeys: ["Effect"],
        testCases: [
          { principal: "User:developer", action: "ec2:StartInstances", resource: "dev-instance-001", context: { "ec2:ResourceTag/Environment": "dev" }, expected: "Allow" },
          { principal: "User:developer", action: "ec2:StopInstances", resource: "prod-instance-001", context: { "ec2:ResourceTag/Environment": "production" }, expected: "Deny" },
          { principal: "User:developer", action: "ec2:TerminateInstances", resource: "prod-instance-001", context: { "ec2:ResourceTag/Environment": "production" }, expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "ec2:*", "Resource": "*" },
            { "Effect": "Allow", "Action": "ec2:DescribeInstances", "Resource": "*", "Condition": { "StringNotEquals": { "ec2:ResourceTag/Environment": "production" } } },
            { "Effect": "Deny", "Action": "ec2:*", "Resource": "*", "Condition": { "StringEquals": { "ec2:ResourceTag/Environment": "production" } } }
          ]
        },
        explanation: "In IAM, Allow statements always win unless there's an explicit Deny. The second statement attempts to restrict but only applies to DescribeInstances. An explicit Deny statement is needed to block ALL ec2:* actions on production resources, as Deny always overrides Allow.",
        vulnerability: "Ineffective Access Control",
        correctScore: 100
      },
      {
        title: "Round 3: Action Wildcard Overreach",
        description: "This policy should only allow reading and listing objects in S3, but grants far more permissions than necessary. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "s3:*", "Resource": ["arn:aws:s3:::reports-bucket", "arn:aws:s3:::reports-bucket/*"] }
          ]
        },
        problemKeys: ["Action"],
        testCases: [
          { principal: "User:analyst", action: "s3:GetObject", resource: "reports-bucket/report.pdf", expected: "Allow" },
          { principal: "User:analyst", action: "s3:ListBucket", resource: "reports-bucket", expected: "Allow" },
          { principal: "User:analyst", action: "s3:DeleteObject", resource: "reports-bucket/report.pdf", expected: "Deny" },
          { principal: "User:analyst", action: "s3:PutBucketPolicy", resource: "reports-bucket", expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:ListBucket"], "Resource": ["arn:aws:s3:::reports-bucket", "arn:aws:s3:::reports-bucket/*"] }
          ]
        },
        explanation: "The wildcard 's3:*' grants ALL S3 permissions including destructive actions like DeleteObject, DeleteBucket, and PutBucketPolicy. Following least privilege, specify ONLY the exact actions needed.",
        vulnerability: "Excessive Action Permissions",
        correctScore: 100
      },
      {
        title: "Round 4: Overly Permissive Principal",
        description: "This Lambda function should only be invokable by a specific application role, but anyone can currently invoke it. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Principal": "*", "Action": "lambda:InvokeFunction", "Resource": "arn:aws:lambda:us-east-1:123456789012:function:ProcessPayment" }
          ]
        },
        problemKeys: ["Principal"],
        testCases: [
          { principal: "Role:PaymentProcessor", principalId: { type: "role", name: "PaymentProcessor" }, action: "lambda:InvokeFunction", resource: "function:ProcessPayment", expected: "Allow" },
          { principal: "Anonymous", principalId: { anonymous: true }, action: "lambda:InvokeFunction", resource: "function:ProcessPayment", expected: "Deny" },
          { principal: "User:random-user", principalId: { type: "user", name: "random-user" }, action: "lambda:InvokeFunction", resource: "function:ProcessPayment", expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Principal": { "AWS": "arn:aws:iam::123456789012:role/PaymentProcessor" }, "Action": "lambda:InvokeFunction", "Resource": "arn:aws:lambda:us-east-1:123456789012:function:ProcessPayment" }
          ]
        },
        explanation: "The Principal field with '*' allows ANYONE (including anonymous users from the internet) to invoke this function. For sensitive operations like payment processing, specify the exact role that should have access.",
        vulnerability: "Public Function Exposure",
        correctScore: 100
      },
      {
        title: "Round 5: Missing IP Restriction",
        description: "This policy should only allow access from the office network (203.0.113.0/24), but currently allows access from anywhere. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "s3:*", "Resource": ["arn:aws:s3:::internal-docs", "arn:aws:s3:::internal-docs/*"] }
          ]
        },
        problemKeys: ["Condition"],
        testCases: [
          { principal: "User:employee", action: "s3:GetObject", resource: "internal-docs/policy.pdf", context: { "aws:SourceIp": "203.0.113.50" }, expected: "Allow" },
          { principal: "User:employee", action: "s3:GetObject", resource: "internal-docs/policy.pdf", context: { "aws:SourceIp": "198.51.100.25" }, expected: "Deny" },
          { principal: "User:employee", action: "s3:PutObject", resource: "internal-docs/new.pdf", context: { "aws:SourceIp": "198.51.100.25" }, expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "s3:*", "Resource": ["arn:aws:s3:::internal-docs", "arn:aws:s3:::internal-docs/*"], "Condition": { "IpAddress": { "aws:SourceIp": "203.0.113.0/24" } } }
          ]
        },
        explanation: "Without a Condition block restricting the source IP, this policy allows access from any network location. Adding an IpAddress condition ensures access is only granted from the office network (203.0.113.0/24), and since the statement covers s3:*, the restriction automatically applies to every action including PutObject.",
        vulnerability: "Missing Network Restriction",
        correctScore: 100
      },
      {
        title: "Round 6: Privilege Escalation Path",
        description: "This developer role seems reasonable, but contains a critical privilege escalation vulnerability. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["iam:CreatePolicy", "iam:CreatePolicyVersion", "iam:AttachUserPolicy", "iam:AttachRolePolicy"], "Resource": "*" }
          ]
        },
        problemKeys: ["Action", "Resource"],
        testCases: [
          { principal: "User:developer", action: "iam:CreatePolicy", resource: "policy/developer-readonly", expected: "Allow" },
          { principal: "User:developer", action: "iam:AttachUserPolicy", resource: "policy/AdminAccess", expected: "Deny" },
          { principal: "User:developer", action: "iam:CreatePolicy", resource: "policy/FullAdminAccess", expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["iam:CreatePolicy", "iam:CreatePolicyVersion"], "Resource": "arn:aws:iam::123456789012:policy/developer-*" }
          ]
        },
        explanation: "This is a classic privilege escalation vulnerability. A user with iam:CreatePolicy AND iam:AttachUserPolicy can create a policy with full admin rights and attach it to themselves. The fix removes the attach permissions entirely and restricts policy creation to a specific naming pattern — simply removing AttachUserPolicy still leaves AttachRolePolicy exploitable.",
        vulnerability: "Privilege Escalation",
        correctScore: 100
      },
      {
        title: "Round 7: Cross-Account Trust Exploit",
        description: "This role's trust policy should only allow a specific partner account to assume it, but it's far too permissive. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Principal": { "AWS": "*" }, "Action": "sts:AssumeRole" }
          ]
        },
        problemKeys: ["Principal"],
        testCases: [
          { principal: "Account:555555555555 (Partner)", principalId: { type: "root", account: "555555555555" }, action: "sts:AssumeRole", resource: "DataAccessRole", expected: "Allow" },
          { principal: "Account:999999999999 (Unknown)", principalId: { type: "root", account: "999999999999" }, action: "sts:AssumeRole", resource: "DataAccessRole", expected: "Deny" },
          { principal: "Anonymous", principalId: { anonymous: true }, action: "sts:AssumeRole", resource: "DataAccessRole", expected: "Deny" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Principal": { "AWS": "arn:aws:iam::555555555555:root" }, "Action": "sts:AssumeRole" }
          ]
        },
        explanation: "In a role trust policy, 'AWS: *' allows ANY AWS account to assume the role, creating a massive security hole. You must specify the exact account ID. Trust policies intentionally omit a Resource field — the 'resource' being granted is the role itself.",
        vulnerability: "Cross-Account Exposure",
        correctScore: 100
      },
      {
        title: "Round 8: Missing Encryption Requirement",
        description: "This S3 bucket policy should enforce server-side encryption on all uploads, but it doesn't. Edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Principal": "*", "Action": "s3:PutObject", "Resource": "arn:aws:s3:::secure-uploads/*" }

        },
        problemKeys: ["Condition"],
        testCases: [
          { principal: "User:uploader", action: "s3:PutObject", resource: "secure-uploads/file.txt", context: { "s3:x-amz-server-side-encryption": "AES256" }, expected: "Allow" },
          { principal: "User:uploader", action: "s3:PutObject", resource: "secure-uploads/file.txt", context: {}, expected: "Deny" },
          { principal: "User:uploader", action: "s3:GetObject", resource: "secure-uploads/file.txt", context: {}, expected: "Deny" }
        ],
        intendedFixPolicy: {

          "Statement": [
            { "Effect": "Allow", "Principal": "*", "Action": "s3:PutObject", "Resource": "arn:aws:s3:::secure-uploads/*" },
            { "Effect": "Deny", "Principal": "*", "Action": "s3:PutObject", "Resource": "arn:aws:s3:::secure-uploads/*", "Condition": { "StringNotEquals": { "s3:x-amz-server-side-encryption": "AES256" } } }
          ]
        },
        explanation: "To ENFORCE encryption, add a Deny statement that blocks uploads WITHOUT encryption (a missing encryption header is treated as 'not AES256'). Best practice uses an explicit Deny rather than only conditioning the Allow, since a Deny wins even if another policy elsewhere grants broader access — this game grades by tested behavior, so an equivalently-conditioned Allow that produces the same Allow/Deny outcomes here also passes.",
        vulnerability: "Missing Encryption Enforcement",
        correctScore: 100
      },
      {
        title: "Round 9: Missing MFA Requirement",
        description: "This policy allows sensitive administrative actions but should require MFA (Multi-Factor Authentication). Edit the policy JSON below so every test passes.",
        policy: {

        },

        testCases: [
          { principal: "User:admin", action: "iam:DeleteUser", resource: "User:old-account", context: { "aws:MultiFactorAuthPresent": "true" }, expected: "Allow" },
          { principal: "User:admin", action: "iam:DeleteUser", resource: "User:old-account", context: { "aws:MultiFactorAuthPresent": "false" }, expected: "Deny" },
          { principal: "User:admin", action: "iam:DetachUserPolicy", resource: "policy/AdminAccess", context: { "aws:MultiFactorAuthPresent": "false" }, expected: "Deny" }
        ],
        intendedFixPolicy: {

          "Statement": [

          ]
        },
        explanation: "Destructive IAM actions like DeleteUser and DetachUserPolicy should require MFA to prevent account compromise from leading to total control loss. The 'aws:MultiFactorAuthPresent' Bool condition ensures the caller authenticated with MFA before the action is allowed.",

        correctScore: 100
      },
      {
        title: "Round 10: Full Audit Challenge",
        description: "This policy has THREE distinct security issues. You must fix: (1) wildcard resource, (2) missing MFA condition on write operations, and (3) overly broad actions. All three must be corrected — edit the policy JSON below so every test passes.",
        policy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": "dynamodb:*", "Resource": "*" }
          ]
        },
        problemKeys: ["Action", "Resource", "Condition"],
        testCases: [
          { principal: "User:app", action: "dynamodb:GetItem", resource: "table/app-data-table", expected: "Allow" },
          { principal: "User:app", action: "dynamodb:Query", resource: "table/app-data-table", expected: "Allow" },
          { principal: "User:app", action: "dynamodb:DeleteTable", resource: "table/production-critical-table", expected: "Deny" },
          { principal: "User:app", action: "dynamodb:UpdateItem", resource: "table/app-data-table", context: { "aws:MultiFactorAuthPresent": "false" }, expected: "Deny" },
          { principal: "User:app", action: "dynamodb:Scan", resource: "table/other-team-table", expected: "Deny" },
          { principal: "User:app", action: "dynamodb:PutItem", resource: "table/app-data-table", context: { "aws:MultiFactorAuthPresent": "true" }, expected: "Allow" }
        ],
        intendedFixPolicy: {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["dynamodb:GetItem", "dynamodb:Query"], "Resource": "arn:aws:dynamodb:*:*:table/app-data-table" },
            { "Effect": "Allow", "Action": ["dynamodb:PutItem", "dynamodb:UpdateItem"], "Resource": "arn:aws:dynamodb:*:*:table/app-data-table", "Condition": { "Bool": { "aws:MultiFactorAuthPresent": "true" } } }
          ]
        },
        explanation: "This final challenge tested three core IAM security principles: (1) Least privilege for actions - dynamodb:* includes dangerous operations like DeleteTable. (2) Specific resources - a wildcard grants access to every table. (3) MFA for write operations - PutItem and UpdateItem modify data and should require MFA, while read-only GetItem/Query do not need to be gated behind it. Splitting reads and MFA-gated writes into separate statements avoids accidentally blocking legitimate reads.",
        vulnerability: "Multiple Security Issues",
        correctScore: 150
      }
    ];

    // ===== IAM Policy Evaluation Engine =====
    // Models enough of real AWS policy evaluation to grade a player-edited JSON policy against a
    // round's test cases: explicit Deny beats Allow, Allow beats implicit (default) Deny; Action /
    // Resource / Principal support strings, arrays, and '*'/'?' globs; Condition supports the
    // operators used in this game's scenarios. This is a teaching simplification, not the full AWS
    // policy language (e.g. NotAction/NotResource, Deny-without-Condition-vs-IfExists nuances, SCPs
    // and resource-based-policy composition across multiple documents are out of scope).

    // globToRegex: converts an IAM-style glob ('*' = any run of characters, '?' = one character)
    // into a RegExp that must match the whole string.
    function globToRegex(glob, flags) {
      const escaped = String(glob).replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
      return new RegExp('^' + escaped + '$', flags || '');
    }

    // actionMatches: true if `action` matches any pattern in the statement's Action field
    // (which may be a single string or an array of strings). AWS action names are case-INSENSITIVE
    // (iam:ListAccessKeys == IAM:listaccesskeys), so match with the 'i' flag. Resource ARNs are NOT
    // case-insensitive (S3 object keys are case-sensitive), so resourceMatches deliberately omits it.
    function actionMatches(patterns, action) {
      if (patterns === undefined) return false;
      const list = Array.isArray(patterns) ? patterns : [patterns];
      return list.some(p => globToRegex(p, 'i').test(action));
    }

    // resourceTail: strips the "arn:aws:<service>:<region>:<account>:" prefix off an ARN, leaving
    // the service-specific resource identifier (e.g. "company-data/*", "function:ProcessPayment",
    // "policy/developer-*", "table/app-data-table"). Works across the colon-joined (Lambda, IAM)
    // and slash-joined (S3, DynamoDB) resource-id conventions because it only splits the first five
    // ARN fields and rejoins everything after with ':', not attempting to re-parse the tail.
    function resourceTail(arn) {
      const parts = String(arn).split(':');
      if (parts[0] !== 'arn' || parts.length < 6) return arn; // not an ARN (e.g. "*") — use as-is
      return parts.slice(5).join(':');
    }

    // resourceMatches: true if `resource` matches any pattern in the statement's Resource field.
    // A statement with NO Resource field (e.g. an IAM trust policy) matches any resource, since
    // trust policies grant access to the role itself rather than naming a resource.
    function resourceMatches(patterns, resource) {
      if (patterns === undefined) return true;
      const list = Array.isArray(patterns) ? patterns : [patterns];
      return list.some(p => globToRegex(resourceTail(p)).test(resource));
    }

    // principalAllows: true if the statement's Principal field permits `testPrincipal`.
    // - No Principal field (identity-based policy) => always true; principal restriction is N/A.
    // - Principal "*" or {"AWS":"*"} => matches everyone, including anonymous.
    // - Otherwise checks root-account, role, and user ARNs against the structured testPrincipal
    //   descriptor ({anonymous:true} | {type:'role'|'user'|'root', name, account}).
    function principalAllows(principalField, testPrincipal) {
      if (principalField === undefined) return true;
      const tp = testPrincipal || {};
      const raw = (typeof principalField === 'string') ? principalField : principalField.AWS;
      const vals = raw === undefined ? [] : (Array.isArray(raw) ? raw : [raw]);
      if (vals.includes('*')) return true;
      if (tp.anonymous) return false;
      return vals.some(v => {
        const rootMatch = /^arn:aws:iam::(\d+):root$/.exec(v);
        if (rootMatch) return tp.type === 'root' && rootMatch[1] === tp.account;
        if (v.includes(':role/')) return tp.type === 'role' && v.split('/').pop() === tp.name;
        if (v.includes(':user/')) return tp.type === 'user' && v.split('/').pop() === tp.name;
        return false;
      });
    }

    // ipToInt / ipInCidr: minimal IPv4 CIDR matcher for the aws:SourceIp condition key.
    function ipToInt(ip) {
      return ip.split('.').reduce((acc, octet) => (acc << 8) + Number(octet), 0) >>> 0;
    }
    function ipInCidr(ip, cidr) {
      const [range, bitsStr] = cidr.split('/');
      const bits = bitsStr === undefined ? 32 : parseInt(bitsStr, 10);
      const mask = bits === 0 ? 0 : (~0 << (32 - bits));
      return (ipToInt(ip) & mask) === (ipToInt(range) & mask);
    }

    // conditionSatisfied: evaluates a statement's Condition block against a test case's context
    // object. Documented simplification: for StringNotEquals, a MISSING context key counts as
    // satisfied (this mirrors the real, AWS-documented "deny uploads without SSE" pattern, where
    // the encryption header is treated as absent/mismatched); for StringEquals and Bool, a missing
    // key counts as NOT satisfied (a condition can't be proven true from a value that isn't there).
    function conditionSatisfied(condition, context) {
      if (!condition) return true;
      const ctx = context || {};
      return Object.keys(condition).every(operator => {
        const kvs = condition[operator];
        return Object.keys(kvs).every(key => {
          const required = kvs[key];
          const reqList = Array.isArray(required) ? required : [required];
          const actual = ctx[key];
          switch (operator) {
            case 'StringEquals':
              return actual !== undefined && reqList.includes(String(actual));
            case 'StringNotEquals':
              return actual === undefined ? true : !reqList.includes(String(actual));
            case 'Bool':
              return actual !== undefined && reqList.includes(String(actual));
            case 'IpAddress':
              return actual !== undefined && reqList.some(cidr => ipInCidr(actual, cidr));
            case 'NotIpAddress':
              return actual === undefined ? true : !reqList.some(cidr => ipInCidr(actual, cidr));
            default:
              return true; // unmodeled operator: don't block on it (documented limitation)
          }
        });
      });
    }

    // evaluatePolicy: the core grader. Iterates every statement in the (player-edited) policy;
    // an explicit matching Deny wins immediately, a matching Allow sets the result to Allow, and
    // anything left unmatched falls through to the IAM default of implicit Deny.
    function evaluatePolicy(policy, testCase) {
      const rawStatements = policy && policy.Statement;
      const statements = Array.isArray(rawStatements) ? rawStatements : (rawStatements ? [rawStatements] : []);
      let allowed = false;
      for (const s of statements) {
        if (!s || typeof s !== 'object') continue;
        if (!actionMatches(s.Action, testCase.action)) continue;
        if (!resourceMatches(s.Resource, testCase.resource)) continue;
        if (!principalAllows(s.Principal, testCase.principalId)) continue;
        if (!conditionSatisfied(s.Condition, testCase.context)) continue;
        if (s.Effect === 'Deny') return 'Deny';
        if (s.Effect === 'Allow') allowed = true;
      }
      return allowed ? 'Allow' : 'Deny'; // implicit deny by default
    }

    // contextLabel: renders a test case's structured `context` object as a short human-readable
    // caption, so the player can see WHY a request is denied without the game hiding information
    // behind opaque data. Falls back to a generic key:value join for any key not explicitly named.
    const CONTEXT_LABELS = {
      'aws:SourceIp': v => `Source IP: ${v}`,
      'aws:MultiFactorAuthPresent': v => `MFA present: ${v}`,
      's3:x-amz-server-side-encryption': v => `Encryption: ${v}`,
      'ec2:ResourceTag/Environment': v => `Tag Environment: ${v}`
    };
    function contextLabel(context) {
      if (!context || Object.keys(context).length === 0) return '—';
      return Object.keys(context).map(k => (CONTEXT_LABELS[k] ? CONTEXT_LABELS[k](context[k]) : `${k}: ${context[k]}`)).join(', ');
    }

    // escapeHtml: minimal HTML-escape for values interpolated into innerHTML (policy JSON is
    // player-controlled text, so it must never be inserted unescaped).
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Render the test results table against a candidate policy object (or `null` if the player's
    // JSON doesn't currently parse). Returns { html, allPass } — allPass drives round completion.
    function renderTestResults(testCases, policyOrNull) {
      let allPass = policyOrNull !== null;
      const rows = testCases.map(test => {
        const liveResult = policyOrNull ? evaluatePolicy(policyOrNull, test) : null;
        const match = liveResult === test.expected;
        if (!match) allPass = false;
        const resultText = liveResult === null ? '—' : liveResult;
        const resultClass = liveResult === 'Allow' ? 'result-allow' : (liveResult === 'Deny' ? 'result-deny' : '');
        return `
              <tr>
                <td>${escapeHtml(test.principal)}</td>
                <td><code>${escapeHtml(test.action)}</code></td>
                <td>${escapeHtml(test.resource)}</td>
                <td>${escapeHtml(contextLabel(test.context))}</td>
                <td class="${resultClass}">${resultText}</td>
                <td class="${test.expected === 'Allow' ? 'result-allow' : 'result-deny'}">${test.expected}</td>
                <td class="match-icon ${liveResult === null ? '' : (match ? 'match-success' : 'match-fail')}">${liveResult === null ? '' : (match ? '✓' : '✗')}</td>
              </tr>`;
      }).join('');
      const html = `
        <table class="test-table">
          <thead>
            <tr>
              <th scope="col">Principal</th>
              <th scope="col">Action</th>
              <th scope="col">Resource</th>
              <th scope="col">Context</th>
              <th scope="col">Live Result</th>
              <th scope="col">Expected</th>
              <th scope="col">Match</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      return { html, allPass };
    }

    // Track whether the current round has already been won, so re-running tests after a pass
    // (e.g. curiosity-clicking Run Tests again) can't double-award score.
    let roundPassed = false;

    // Render round: builds the editable policy textarea (pre-filled with the BROKEN policy) plus
    // the live test table, evaluated once immediately against the broken policy so the player sees
    // real failing tests before making any edit.
    function renderRound() {
      const round = rounds[currentRound];
      roundAttempts = 0;
      roundPassed = false;
      roundStartTime = Date.now();

      const initial = renderTestResults(round.testCases, round.policy);

      const html = `
        <div class="game-area">
          <div class="round-info">
            <div class="round-title">${escapeHtml(round.title)}</div>
            <div class="round-description">${escapeHtml(round.description)}</div>
          </div>

          <div class="policy-section">
            <div class="section-title">
              <span><img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Edit the Policy (JSON)
            </div>
            <div class="policy-viewer" style="padding:0;">
              <textarea id="policyEditor" spellcheck="false" style="width:100%;min-height:220px;background:transparent;border:none;color:#d1d5db;font-family:'Courier New',monospace;font-size:13px;line-height:1.6;padding:20px;resize:vertical;outline:none;">${escapeHtml(JSON.stringify(round.policy, null, 2))}</textarea>
            </div>
            <div id="jsonError" style="display:none;color:#ef4444;font-size:13px;margin-top:8px;"></div>
          </div>

          <div class="policy-section">
            <div class="section-title">
              <span><img src="/assets/images/icons/icon-flask.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Access Test Results
            </div>
            <div class="test-results" id="testResults">
              ${initial.html}
            </div>
          </div>

          <div class="button-group">
            <button class="btn btn-secondary" id="resetBtn" type="button">Reset Policy</button>
            <button class="btn btn-primary" id="runBtn" type="button">Run Tests</button>
          </div>

          <div id="explanationArea"></div>
        </div>
      `;

      document.getElementById('gameContainer').innerHTML = html;
      document.getElementById('roundDisplay').textContent = `${currentRound + 1}/10`;
      document.getElementById('attemptsDisplay').textContent = roundAttempts;

      document.getElementById('runBtn').addEventListener('click', runTests);
      document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('policyEditor').value = JSON.stringify(round.policy, null, 2);
        document.getElementById('jsonError').style.display = 'none';
        document.getElementById('explanationArea').innerHTML = '';
      });
    }

    // runTests: parses the player's edited JSON, re-evaluates every test case against it, and
    // updates the table + explanation area. A round is won only when ALL test cases pass at once
    // (fixing one case can't be allowed to silently break another).
    function runTests() {
      const round = rounds[currentRound];
      const editor = document.getElementById('policyEditor');
      const errorBox = document.getElementById('jsonError');
      let policy;
      try {
        policy = JSON.parse(editor.value);
      } catch (e) {
        errorBox.textContent = 'Invalid JSON: ' + e.message;
        errorBox.style.display = 'block';
        document.getElementById('testResults').innerHTML = renderTestResults(round.testCases, null).html;
        return;
      }
      if (typeof policy !== 'object' || policy === null || Array.isArray(policy)) {
        errorBox.textContent = 'Policy must be a JSON object with a "Statement" array.';
        errorBox.style.display = 'block';
        document.getElementById('testResults').innerHTML = renderTestResults(round.testCases, null).html;
        return;
      }
      errorBox.style.display = 'none';

      roundAttempts++;
      document.getElementById('attemptsDisplay').textContent = roundAttempts;

      const { html, allPass } = renderTestResults(round.testCases, policy);
      document.getElementById('testResults').innerHTML = html;

      if (allPass) {
        if (!roundPassed) {
          roundPassed = true;

          // Score: base value + a time bonus for solving quickly. No attempt penalty — iterating
          // on a real JSON edit is the intended play pattern, not a mistake to punish.
          const timeBonus = Math.max(0, 50 - Math.floor((Date.now() - roundStartTime) / 1000));
          const roundScore = round.correctScore + timeBonus;
          totalScore += roundScore;
          document.getElementById('scoreDisplay').textContent = totalScore;

          document.getElementById('explanationArea').innerHTML = `
            <div class="explanation">
              <div class="explanation-title">All tests passing! +${roundScore} points</div>
              <div class="explanation-text">${escapeHtml(round.explanation)}</div>
              <span class="vulnerability-tag">${escapeHtml(round.vulnerability)}</span>
            </div>
          `;

          editor.readOnly = true;
          document.getElementById('resetBtn').disabled = true;
          const runBtn = document.getElementById('runBtn');
          runBtn.textContent = currentRound < 9 ? 'Next Round →' : 'View Results';
          runBtn.removeEventListener('click', runTests);
          runBtn.onclick = () => {
            if (currentRound < 9) {
              currentRound++;
              renderRound();
            } else {
              showCompletion();
            }
          };
        }
      } else {
        // Build a hint: after the first failed run, name the fields the round's canonical fix
        // touches, without revealing the fix itself.
        const hintExtra = roundAttempts >= 2
          ? ` Focus on this policy's <strong>${round.problemKeys.map(escapeHtml).join(', ')}</strong> field(s).`
          : '';
        document.getElementById('explanationArea').innerHTML = `
          <div class="explanation" style="border-color: #ef4444; background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);">
            <div class="explanation-title" style="color: #ef4444;">Tests still failing</div>
            <div class="explanation-text">Some rows above don't match Expected yet. Edit the policy JSON and run the tests again.${hintExtra}</div>
          </div>
        `;
      }
    }

    // Show completion screen
    function showCompletion() {
      const totalTime = Math.floor((Date.now() - startTime) / 1000);
      const avgTimePerRound = Math.floor(totalTime / 10);
      const maxScore = rounds.reduce((sum, r) => sum + r.correctScore, 0) + 500; // Base + max time bonus

      // Award XP
      if (!localStorage.getItem('game_iam_xp_awarded')) {
        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
        localStorage.setItem('game_iam_xp_awarded', 'true');
        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
          FirestoreManager.addXP(null, 50, 'IAM Policy Debugger Complete'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
        }
      }

      // Unlock achievement
      if (typeof AchievementManager !== 'undefined') {
        AchievementManager.unlock('game_iam');
      }

      // Track game completion
      if (typeof GameTracker !== 'undefined') {
        GameTracker.record('iam', { score: totalScore, total: 10 });
      }

      const html = `
        <div class="game-area completion-screen">
          <div class="completion-title"><img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> IAM Policy Debugger Complete!</div>
          <div class="final-score">${totalScore} Points</div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">10/10</div>
              <div class="stat-label">Rounds Complete</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${totalTime}s</div>
              <div class="stat-label">Total Time</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${avgTimePerRound}s</div>
              <div class="stat-label">Avg Per Round</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${Math.round((totalScore / maxScore) * 100)}%</div>
              <div class="stat-label">Score Rating</div>
            </div>
          </div>

          <div class="explanation">
            <div class="explanation-title">✓ +50 XP Awarded</div>
            <div class="explanation-text">
              You've successfully debugged 10 IAM policy vulnerabilities! You've mastered critical cloud security concepts including:
              <br><br>
              • Principle of Least Privilege<br>
              • Explicit Deny vs Allow<br>
              • Resource and Action Wildcards<br>
              • Cross-Account Trust Policies<br>
              • Conditional Access Controls<br>
              • Privilege Escalation Prevention<br>
              • MFA and Encryption Requirements
            </div>
          </div>

          <div class="button-group">
            <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
            <a href="../index.html" class="btn btn-secondary" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">Return to Cloud House</a>
          </div>
        </div>
      `;

      document.getElementById('gameContainer').innerHTML = html;
    }

    // Initialize game
    renderRound();
  </script>

    <script src="../../../components/GameScoreboard.js"></script>
