<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Check the Bill</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'Terminal';
            src: local('Cascadia Mono'), local('Consolas'), local('Courier New');
        }

        body {
            background: #0a0a0a;
            color: #c0c0c0;
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header Bar ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .header-title {
            color: #22d3ee;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bill-counter {
            font-size: 16px;
            font-weight: bold;
            color: #ef4444;
            min-width: 120px;
            text-align: center;
            animation: pulse-bill 1s infinite;
        }

        @keyframes pulse-bill {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            min-width: 60px;
            text-align: right;
            transition: color 0.3s;
        }

        .timer.warning { color: #f39c12; }
        .timer.critical { color: #e74c3c; animation: pulse 0.5s infinite alternate; }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* ── Achievements Counter ── */
        .achievement-counter {
            font-size: 12px;
            color: #f1c40f;
            cursor: pointer;
            padding: 2px 8px;
            border: 1px solid #333;
            border-radius: 3px;
        }

        .achievement-counter:hover {
            background: #1a1a1a;
            border-color: #f1c40f;
        }

        /* ── Output Area ── */
        .output-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
        }

        .output-area::-webkit-scrollbar { width: 8px; }
        .output-area::-webkit-scrollbar-track { background: #111; }
        .output-area::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .line { margin-bottom: 2px; white-space: pre-wrap; word-wrap: break-word; }
        .line-input { color: #22d3ee; }
        .line-system { color: #7f8c8d; font-style: italic; }
        .line-success { color: #2ecc71; }
        .line-error { color: #e74c3c; }
        .line-warning { color: #f39c12; }
        .line-critical { color: #e74c3c; font-weight: bold; }
        .line-alert { color: #e67e22; }
        .line-info { color: #22d3ee; }
        .line-dim { color: #555; }
        .line-achievement { color: #f1c40f; }
        .line-narrative { color: #bdc3c7; }
        .line-title { color: #22d3ee; }
        .line-hint { color: #9b59b6; }
        .line-output { color: #ddd; }
        .line-money { color: #ef4444; font-weight: bold; }
        .line-funny { color: #10b981; }

        /* ── Input Area ── */
        .input-area {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #111;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }

        .prompt {
            color: #22d3ee;
            margin-right: 8px;
            white-space: nowrap;
            font-weight: bold;
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: #eee;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #22d3ee;
        }

        .input-field::placeholder {
            color: #444;
        }

        .input-field:disabled {
            color: #555;
        }

        /* ── Achievement Toast ── */
        .achievement-toast {
            position: fixed;
            top: 60px;
            right: 20px;
            background: #1a1a0a;
            border: 1px solid #f1c40f;
            border-left: 4px solid #f1c40f;
            padding: 12px 16px;
            border-radius: 4px;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s ease;
            z-index: 100;
            max-width: 320px;
            pointer-events: none;
        }

        .achievement-toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .achievement-toast-label {
            color: #f1c40f;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .achievement-toast-name {
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
        }

        .achievement-toast-desc {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ── Achievement Gallery Overlay ── */
        .gallery-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .gallery-overlay.show {
            display: flex;
        }

        .gallery {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .gallery h2 {
            color: #f1c40f;
            margin-bottom: 16px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .gallery-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .gallery-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .gallery-icon.unlocked {
            background: #2c2a0a;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .gallery-icon.locked {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #333;
        }

        .gallery-text { flex: 1; }

        .gallery-name {
            font-size: 13px;
            font-weight: bold;
        }

        .gallery-name.unlocked { color: #f1c40f; }
        .gallery-name.locked { color: #555; }

        .gallery-desc {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .gallery-close {
            margin-top: 16px;
            text-align: center;
        }

        .gallery-close button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 6px 20px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .gallery-close button:hover {
            border-color: #f1c40f;
            color: #f1c40f;
        }

        /* ── Title Screen ── */
        .title-art {
            color: #22d3ee;
            font-size: 13px;
            line-height: 1.3;
            margin: 20px 0;
        }

        /* ── Ending Screen ── */
        .ending-options {
            margin-top: 16px;
        }

        .ending-options span {
            color: #22d3ee;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 20px;
        }

        .ending-options span:hover {
            color: #5dade2;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-title">DON'T CHECK THE BILL</span>
        <div class="header-center">
            <span class="bill-counter" id="billCounter">$847,000</span>
            <span class="achievement-counter" id="achCounter" onclick="Game.showGallery()" title="View Achievements">&#9733; 0/12</span>
        </div>
        <span class="timer" id="timer">3:00</span>
    </div>

    <div class="output-area" id="output"></div>

    <div class="input-area">
        <span class="prompt" id="prompt">aws&gt;</span>
        <input type="text" class="input-field" id="input" placeholder="Type a command..." autofocus autocomplete="off" spellcheck="false">
    </div>

    <div class="achievement-toast" id="toast">
        <div class="achievement-toast-label">ACHIEVEMENT UNLOCKED</div>
        <div class="achievement-toast-name" id="toastName"></div>
        <div class="achievement-toast-desc" id="toastDesc"></div>
    </div>

    <div class="gallery-overlay" id="galleryOverlay">
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
    const Game = (function() {

        /* ═══════════════════════════════════════
           ACHIEVEMENT DEFINITIONS
           ═══════════════════════════════════════ */
        const ACHIEVEMENTS = {
            bill_checker:       { name: 'Bill Checker',       icon: '💰', desc: 'Checked Cost Explorer first (brave)' },
            instance_killer:    { name: 'Instance Killer',    icon: '⚡', desc: 'Stopped all 200 GPU instances' },
            by_the_book:        { name: 'Cloud Professional', icon: '📋', desc: 'Followed full remediation methodology' },
            speed_run:          { name: 'Speed Run',          icon: '⏱', desc: 'Contained in under 20 seconds' },
            full_cleanup:       { name: 'Full Cleanup',       icon: '🧹', desc: 'Fixed instances, Lambda, S3, IAM, and budget' },
            blame_intern:       { name: 'Blame the Intern',   icon: '👨', desc: 'Talked to the intern' },
            frozen:             { name: 'Frozen',             icon: '❄', desc: 'Did nothing until time ran out' },
            coffee_cloud:       { name: 'Cloud Coffee',       icon: '☕', desc: 'Drank coffee while billing climbed' },
            bitcoin_check:      { name: 'Crypto Curious',     icon: '₿', desc: 'Checked the Bitcoin mining earnings' },
            calculator_moment:  { name: 'Calculator Moment',  icon: '🧮', desc: 'Calculated years of salary' },
            aws_support:        { name: 'Called AWS Support', icon: '📞', desc: 'Contacted AWS support (smart)' },
            budget_hero:        { name: 'Budget Hero',        icon: '🛡', desc: 'Set budget alerts and billing alarms' },
        };

        const STORAGE_KEY = 'hexworth_dontcheckbill_achievements';

        /* ═══════════════════════════════════════
           GAME STATE
           ═══════════════════════════════════════ */
        let state = {};

        function resetState() {
            state = {
                phase: 'title',        // title | playing | ended
                timeRemaining: 180,
                timeElapsed: 0,
                timerInterval: null,
                billInterval: null,
                currentBill: 847000,
                instancesStopped: false,
                instancesTerminated: false,
                autoscalingFixed: false,
                s3Secured: false,
                lambdaFixed: false,
                budgetAlertSet: false,
                billingAlarmSet: false,
                iamFixed: false,
                costExplorerChecked: false,
                internTalkedTo: false,
                advisorRan: false,
                awsSupportCalled: false,
                commandsRun: [],
                commandCount: 0,
                eventsTriggered: [],
                ending: null,
                toastTimeout: null,
                billClimbing: true,
            };
        }

        /* ═══════════════════════════════════════
           INITIALIZATION
           ═══════════════════════════════════════ */
        function init() {
            resetState();
            const inputEl = document.getElementById('input');

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const raw = inputEl.value.trim();
                    inputEl.value = '';
                    if (raw) handleInput(raw);
                }
            });

            updateAchievementCounter();
            showTitle();
        }

        /* ═══════════════════════════════════════
           DISPLAY FUNCTIONS
           ═══════════════════════════════════════ */
        function print(text, className) {
            const outputEl = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' line-' + className : '');
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function printBlank() {
            print('');
        }

        function updateBillDisplay() {
            const el = document.getElementById('billCounter');
            el.textContent = '$' + state.currentBill.toLocaleString();
        }

        /* ═══════════════════════════════════════
           TITLE SCREEN
           ═══════════════════════════════════════ */
        function showTitle() {
            document.getElementById('timer').textContent = '3:00';
            document.getElementById('timer').className = 'timer';
            document.getElementById('billCounter').textContent = '$847,000';
            document.getElementById('prompt').style.display = 'none';
            document.getElementById('input').placeholder = 'Press Enter to start...';

            const lines = [
                '',
                '  ╔══════════════════════════════════════════════════╗',
                '  ║                                                  ║',
                "  ║         DON'T CHECK THE BILL                     ║",
                '  ║                                                  ║',
                '  ║         A Cloud Architect Horror Story           ║',
                '  ║                                                  ║',
                '  ╚══════════════════════════════════════════════════╝',
                '',
            ];

            for (const line of lines) print(line, 'title');

            printBlank();
            print('  Monday morning. 8:47 AM. You just got back from a 3-day weekend.', 'dim');
            print('  You have 47 unread emails. Most are from AWS billing.', 'dim');
            print('  Subject: "Unusual activity detected."', 'dim');
            print('  Subject: "Billing alert: Budget exceeded."', 'dim');
            print('  Subject: "URGENT: Review your usage immediately."', 'dim');
            printBlank();
            print('  Your AWS bill is $847,000. It was $2,000/month last week.', 'dim');
            print('  It\'s climbing at $200 per minute. The intern did something.', 'dim');
            printBlank();
            print('  Press ENTER to start.', 'info');
            printBlank();

            const saved = loadAchievements();
            const count = Object.keys(saved).length;
            if (count > 0) {
                print(`  [${count}/12 achievements unlocked]`, 'achievement');
                printBlank();
            }
        }

        /* ═══════════════════════════════════════
           GAME START
           ═══════════════════════════════════════ */
        function startGame() {
            state.phase = 'playing';
            document.getElementById('output').innerHTML = '';
            document.getElementById('prompt').style.display = '';
            document.getElementById('input').placeholder = 'Type a command...';

            const intro = [
                'MONDAY, 8:47 AM',
                '',
                'You take a sip of coffee and open the AWS Console.',
                '',
                '[COST EXPLORER]',
                '  Current month-to-date: $847,000',
                '  Previous month total: $2,100',
                '  % change: +40,233%',
                '',
                '[EC2 INSTANCES RUNNING]',
                '  Region us-east-1: 50 x p3.16xlarge ($24.48/hr each)',
                '  Region us-west-2: 50 x p3.16xlarge ($24.48/hr each)',
                '  Region eu-west-1: 50 x p3.16xlarge ($27.41/hr each)',
                '  Region ap-southeast-1: 50 x p3.16xlarge ($28.15/hr each)',
                '  Instance names: totally_not_mining_bitcoin_001 through',
                '                  totally_not_mining_bitcoin_200',
                '  Launched by: intern-test-key',
                '',
                '[AUTO-SCALING GROUP]',
                '  Name: intern-test-asg',
                '  Min: 0, Max: unlimited, Desired: 200',
                '  Status: Scaling up (15 new instances launching in ap-northeast-1)',
                '',
                '[S3 BUCKETS]',
                '  47 buckets detected',
                '  23 buckets have public access enabled',
                '  Bot traffic detected downloading from company-backups-prod',
                '',
                '[LAMBDA FUNCTION]',
                '  Name: process-data',
                '  Invocations last hour: 340,000',
                '  Status: Recursively calling itself',
                '',
                'Your phone rings. It\'s the CFO.',
                '"Why is our AWS bill EIGHT HUNDRED THOUSAND DOLLARS?"',
                '',
                'You have 3 minutes before the credit card maxes out.',
                '',
            ];

            for (const line of intro) {
                print(line, line.startsWith('  ') ? 'output' : 'narrative');
            }

            print('Type HELP for available commands.', 'info');
            printBlank();

            // Start the countdown and billing climb
            state.timerInterval = setInterval(tick, 1000);
            state.billInterval = setInterval(billTick, 60000); // Every 60 seconds
            document.getElementById('input').focus();
        }

        /* ═══════════════════════════════════════
           TIMER & EVENTS
           ═══════════════════════════════════════ */
        function tick() {
            state.timeRemaining--;
            state.timeElapsed++;
            updateTimerDisplay();

            checkTimedEvents();

            if (state.timeRemaining <= 0) {
                timeUp();
            }
        }

        function billTick() {
            if (state.billClimbing) {
                state.currentBill += 200;
                updateBillDisplay();
            }
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer');
            const mins = Math.floor(state.timeRemaining / 60);
            const secs = state.timeRemaining % 60;
            el.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

            if (state.timeRemaining <= 30) {
                el.className = 'timer critical';
            } else if (state.timeRemaining <= 60) {
                el.className = 'timer warning';
            } else {
                el.className = 'timer';
            }
        }

        function checkTimedEvents() {
            const events = [
                { at: 10, id: 'bill1', level: 'alert', text: '[BILLING] Current spend: $847,200 (+$200). GPU instances still running across us-east-1, us-west-2, eu-west-1, ap-southeast-1.' },
                { at: 30, id: 's3', level: 'alert', text: '[ALERT] S3 bucket \'company-backups-prod\' is PUBLIC. Bot traffic detected downloading files.' },
                { at: 50, id: 'scale', level: 'warning', text: '[BILLING] Current spend: $851,000. Auto-scaling just launched 15 MORE instances in ap-northeast-1.' },
                { at: 75, id: 'lambda', level: 'critical', text: '[CRITICAL] Lambda function \'process-data\' invoking itself. 340,000 invocations in the last hour.' },
                { at: 100, id: 'card', level: 'critical', text: '[CRITICAL] Credit card company called: "Unusual activity detected. Card frozen in 60 seconds."' },
                { at: 130, id: 'frozen', level: 'critical', text: '[CRITICAL] Card frozen. AWS services beginning graceful shutdown. Production workloads affected.' },
                { at: 155, id: 'prod', level: 'critical', text: '[CRITICAL] Production API returning 503. Customer complaints flooding in. CFO calling.' },
                { at: 170, id: 'cfo', level: 'critical', text: '[CRITICAL] CFO on phone: "EIGHT HUNDRED THOUSAND DOLLARS?!"' },
            ];

            // Skip some events if actions taken
            const skipEvents = [];
            if (state.instancesStopped && state.timeElapsed < 50) skipEvents.push('scale');
            if (state.lambdaFixed && state.timeElapsed < 75) skipEvents.push('lambda');
            if (state.s3Secured && state.timeElapsed < 30) skipEvents.push('s3');

            for (const ev of events) {
                if (state.timeElapsed >= ev.at && !state.eventsTriggered.includes(ev.id) && !skipEvents.includes(ev.id)) {
                    state.eventsTriggered.push(ev.id);
                    printBlank();
                    print(ev.text, ev.level);
                    printBlank();
                }
            }
        }

        function timeUp() {
            clearInterval(state.timerInterval);
            clearInterval(state.billInterval);

            printBlank();
            print('════════════════════════════════════════', 'critical');
            print('GAME OVER', 'critical');
            print('════════════════════════════════════════', 'critical');
            printBlank();

            if (!state.instancesStopped && !state.lambdaFixed && !state.autoscalingFixed) {
                print('Time\'s up. The credit card maxed out. AWS shut down', 'error');
                print('all services. Production is down. Customers are angry.', 'error');
                print('The CFO is furious. Your resume is on LinkedIn.', 'error');
                printBlank();
                print(`Final bill: $${state.currentBill.toLocaleString()}`, 'money');
                print('Estimated recovery time: 1-2 weeks.', 'dim');

                if (state.commandCount === 0) {
                    unlock('frozen');
                }

                state.ending = 'timeout';
            } else {
                print('Time\'s up, but you contained the crisis before the', 'success');
                print('card maxed out. Production is stable.', 'success');
                printBlank();
                print(`Final bill: $${state.currentBill.toLocaleString()}`, 'money');
                print('(Still absurdly expensive, but at least it stopped climbing.)', 'dim');
            }

            endGame();
        }

        /* ═══════════════════════════════════════
           INPUT HANDLING
           ═══════════════════════════════════════ */
        function handleInput(raw) {
            if (state.phase === 'title') {
                startGame();
                return;
            }

            if (state.phase === 'ended') {
                const lower = raw.toLowerCase();
                if (lower === 'r' || lower === 'restart' || lower === 'play again' || lower === 'again') {
                    restart();
                } else if (lower === 'a' || lower === 'achievements') {
                    showGallery();
                }
                return;
            }

            // Echo the input
            print('aws> ' + raw, 'input');

            state.commandCount++;
            state.commandsRun.push(raw);

            const result = processCommand(raw);
            if (result) {
                for (const line of result.split('\n')) {
                    print(line, result._className || 'output');
                }
            }

            printBlank();

            // Check win conditions after each command
            if (state.phase === 'playing') {
                checkWinCondition();
            }
        }

        /* ═══════════════════════════════════════
           COMMAND PROCESSING
           ═══════════════════════════════════════ */
        function processCommand(raw) {
            const trimmed = raw.trim();
            const lower = trimmed.toLowerCase();

            // ── Adventure / fun commands ──
            if (['look', 'examine', 'look around'].includes(lower)) {
                return adventureLook();
            }
            if (['inventory', 'i', 'inv'].includes(lower)) {
                return styledLine('You have: AWS root credentials (yes, root, we\'ll deal with that later), a corporate credit card with a $1M limit (terrifyingly close), and a resignation letter template on your desktop that you update weekly.', 'funny');
            }
            if (['help', '?', 'help me', 'commands'].includes(lower)) {
                return showHelp();
            }
            if (['hint', 'hints'].includes(lower)) {
                return showHint();
            }
            if (['panic', 'freak out', 'scream'].includes(lower)) {
                state.timeRemaining = Math.max(0, state.timeRemaining - 10);
                state.currentBill += 33;
                updateTimerDisplay();
                updateBillDisplay();
                return styledLine('You refresh the billing page. It went up $33 while you were panicking. (-10 seconds)', 'warning');
            }
            if (['coffee', 'drink coffee', 'get coffee'].includes(lower)) {
                unlock('coffee_cloud');
                return styledLine('You drink coffee. It costs $4. The cheapest thing associated with your AWS account today.', 'funny');
            }
            if (['blame intern', 'talk to intern', 'call intern', 'intern'].includes(lower)) {
                unlock('blame_intern');
                state.internTalkedTo = true;
                return styledLine('The intern says: "I just wanted to train a GPT model! I didn\'t know\np3.16xlarge costs $24/hour! I thought AWS was free tier!"\n\nYou die a little inside.', 'funny');
            }
            if (['cry', 'weep', 'sob'].includes(lower)) {
                return styledLine('Valid. AWS billing has that effect.', 'dim');
            }
            if (['check bitcoin', 'bitcoin', 'check mining', 'mining'].includes(lower)) {
                unlock('bitcoin_check');
                return styledLine('The mining rig has earned $47 in Bitcoin. Against $847,000 in compute costs.\nROI: -99.99%. Outstanding work.', 'funny');
            }
            if (['delete account', 'close account', 'cancel aws'].includes(lower)) {
                return styledLine('You briefly consider it. But there are 3 production workloads on here.\nAnd HR\'s payroll. And the CEO\'s blog.', 'dim');
            }
            if (['call bezos', 'call jassy', 'call andy jassy', 'email bezos'].includes(lower)) {

        function processAWSCommand(raw) {
            const lower = raw.toLowerCase();

            // Describe instances
            if (lower.includes('describe-instances') || lower === 'list instances' || lower === 'ec2 list') {
                return cmdDescribeInstances();
            }

            // Stop instances
            if (lower.includes('stop-instances') || lower === 'stop instances' || lower === 'stop all' || lower === 'stop ec2') {
                return cmdStopInstances();
            }

            // Terminate instances
            if (lower.includes('terminate-instances') || lower === 'terminate' || lower === 'terminate all') {
                return cmdTerminateInstances();

            // Auto-scaling
            if (lower.includes('autoscaling') && (lower.includes('update') || lower.includes('fix') || lower.includes('set max'))) {
                return cmdFixAutoScaling();
            }

            // List S3
            if ((lower.includes('s3') && lower.includes('ls')) || lower === 'list buckets') {
                return cmdListBuckets();
            }

            // Secure S3
            if ((lower.includes('s3') && (lower.includes('put-public-access-block') || lower.includes('block public'))) || lower === 'secure buckets') {
                return cmdSecureBuckets();
            }

            // List Lambda
            if ((lower.includes('lambda') && lower.includes('list')) || lower === 'list lambda') {
                return cmdListLambda();
            }

            // Delete Lambda
            if ((lower.includes('lambda') && (lower.includes('delete') || lower.includes('kill') || lower.includes('stop')))) {
                return cmdDeleteLambda();
            }

            // IAM
            if (lower.includes('iam') && lower.includes('list')) {
                return cmdListIAM();
            }

            if ((lower.includes('iam') && (lower.includes('remove') || lower.includes('fix') || lower.includes('revoke'))) || lower.includes('revoke intern')) {

        function loadAchievements() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            } catch { return {}; }
        }

        function saveAchievements(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function unlock(id) {
            const saved = loadAchievements();
            if (saved[id]) return; // already unlocked

            const ach = ACHIEVEMENTS[id];
            if (!ach) return;

            saved[id] = { unlockedAt: Date.now() };
            saveAchievements(saved);

            // Show toast
            showToast(ach.name, ach.desc);

            // Update counter
            updateAchievementCounter();

            // Print in terminal
            print(`[ACHIEVEMENT] ${ach.icon} ${ach.name} — ${ach.desc}`, 'achievement');
        }

        function showToast(name, desc) {
            const toast = document.getElementById('toast');
            document.getElementById('toastName').textContent = name;
            document.getElementById('toastDesc').textContent = desc;
            toast.classList.add('show');

            if (state.toastTimeout) clearTimeout(state.toastTimeout);
            state.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function updateAchievementCounter() {
            const saved = loadAchievements();

        }

        function showGallery() {
            const saved = loadAchievements();
            const overlay = document.getElementById('galleryOverlay');
            const gallery = document.getElementById('gallery');

            let html = '<h2>ACHIEVEMENTS</h2>';

            for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
                const unlocked = !!saved[id];
                html += `
                    <div class="gallery-item">
                        <div class="gallery-icon ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? ach.icon : '?'}</div>
                        <div class="gallery-text">
                            <div class="gallery-name ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? ach.name : '???'}</div>
                            <div class="gallery-desc">${unlocked ? ach.desc : 'Not yet unlocked'}</div>
                        </div>
                    </div>`;
            }

            html += `<div class="gallery-close"><button onclick="Game.hideGallery()">Close</button></div>`;

            gallery.innerHTML = html;
            overlay.classList.add('show');
        }

        function hideGallery() {
            document.getElementById('galleryOverlay').classList.remove('show');
            document.getElementById('input').focus();
        }

        /* ═══════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════ */

        function styledLine(text, className) {
            // Tag the string with a class for the printer
            const s = new String(text);
            s._className = className;
            return s;
        }

        /* ═══════════════════════════════════════
           GALLERY CLOSE ON CLICK OUTSIDE
           ═══════════════════════════════════════ */
        document.addEventListener('click', function(e) {
            if (e.target.id === 'galleryOverlay') {
                hideGallery();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideGallery();
            }
        });

        /* ═══════════════════════════════════════
           PUBLIC API
           ═══════════════════════════════════════ */
        return { init, showGallery, hideGallery };

    })();

    // Boot
    document.addEventListener('DOMContentLoaded', Game.init);
    </script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/AchievementSystem.js"></script>
</body>
</html>
