<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Check the Bill</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'Terminal';
            src: local('Cascadia Mono'), local('Consolas'), local('Courier New');
        }

        body {
            background:
                radial-gradient(120% 80% at 12% 0%, rgba(34,211,238,.10), transparent 58%),
                radial-gradient(110% 80% at 100% 100%, rgba(139,92,246,.10), transparent 60%),
                linear-gradient(180deg, #0a0a12 0%, #0a0a0a 50%, #080810 100%);
            background-attachment: fixed;
            color: #c0c0c0;
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* CRT Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.25) 100%);
            pointer-events: none;
            z-index: 999;
        }

        /* ── Header Bar ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px clamp(16px, 3vw, 64px);
            background: linear-gradient(160deg, #111118 0%, #111 50%, #0d0d14 100%);
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
            flex-shrink: 0;
            box-shadow: 0 2px 15px rgba(6, 182, 212, 0.08);
            position: relative;
            z-index: 1;
        }

        .header-title {
            color: #22d3ee;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bill-counter {
            font-size: 16px;
            font-weight: bold;
            color: #ef4444;
            min-width: 120px;
            text-align: center;
            animation: pulse-bill 1s infinite;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse-bill {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            min-width: 60px;
            text-align: right;
            transition: color 0.3s;
        }

        .timer.warning { color: #f39c12; }
        .timer.critical { color: #e74c3c; animation: pulse 0.5s infinite alternate; }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* ── Achievements Counter ── */
        .achievement-counter {
            font-size: 12px;
            color: #f1c40f;
            cursor: pointer;
            padding: 2px 8px;
            border: 1px solid #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .achievement-counter:hover {
            background: rgba(241, 196, 15, 0.08);
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.15);
        }

        /* ── Output Area ── */
        .output-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;   /* a terminal fills upward; text sits ON the input */
            padding: 20px clamp(18px, 2vw, 32px);
            /* A defined console with an edge, not a transparent region text floats inside. The
               empty space now sits OUTSIDE the panel, where it reads as page, not as a broken
               screen. */
            margin: 14px clamp(16px, 3vw, 64px) 0;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            border: 1px solid rgba(6,182,212,.22);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(8,12,22,.72), rgba(6,8,16,.86));
            box-shadow: inset 0 0 60px rgba(6,182,212,.05), 0 12px 40px rgba(0,0,0,.5);
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        .output-area::-webkit-scrollbar { width: 8px; }
        .output-area::-webkit-scrollbar-track { background: #0a0a0a; }
        .output-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%); border-radius: 4px; }

        .line { margin-bottom: 2px; white-space: pre-wrap; word-wrap: break-word; }
        .line-input { color: #22d3ee; }
        .line-system { color: #7f8c8d; font-style: italic; }
        .line-success { color: #2ecc71; }
        .line-error { color: #e74c3c; }
        .line-warning { color: #f39c12; }
        .line-critical { color: #e74c3c; font-weight: bold; }
        .line-alert { color: #e67e22; }
        .line-info { color: #22d3ee; }
        .line-dim { color: #555; }
        .line-achievement { color: #f1c40f; }
        .line-narrative { color: #bdc3c7; }
        .line-title { color: #22d3ee; }
        .line-hint { color: #9b59b6; }
        .line-output { color: #ddd; }
        .line-money { color: #ef4444; font-weight: bold; }
        .line-funny { color: #10b981; }

        /* ── Input Area ── */
        .input-area {
            display: flex;
            align-items: center;
            padding: 10px clamp(18px, 2vw, 32px);
            margin: 0 clamp(16px, 3vw, 64px) 16px;
            border: 1px solid rgba(6,182,212,.22);
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: linear-gradient(160deg, #111118 0%, #111 50%, #0d0d14 100%);
            border-top: 1px solid rgba(6, 182, 212, 0.2);
            flex-shrink: 0;
            box-shadow: 0 -2px 15px rgba(6, 182, 212, 0.05);
            position: relative;
            z-index: 1;
        }

        .prompt {
            color: #22d3ee;
            margin-right: 8px;
            white-space: nowrap;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.4);
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: #eee;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #67e8f9;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
        }

        .input-field::placeholder {
            color: #444;
        }

        .input-field:disabled {
            color: #555;
        }

        /* ── Achievement Toast ── */
        .achievement-toast {
            position: fixed;
            top: 60px;
            right: 20px;
            background: linear-gradient(160deg, #1a1a10 0%, #141408 100%);
            border: 1px solid #f1c40f;
            border-left: 4px solid #f1c40f;
            padding: 12px 16px;
            border-radius: 4px;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s ease;
            z-index: 100;
            max-width: 320px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(241, 196, 15, 0.15);
        }

        .achievement-toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .achievement-toast-label {
            color: #f1c40f;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .achievement-toast-name {
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
        }

        .achievement-toast-desc {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ── Achievement Gallery Overlay ── */
        .gallery-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .gallery-overlay.show {
            display: flex;
        }

        .gallery {
            background: linear-gradient(160deg, #141418 0%, #111 50%, #0d0d12 100%);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.1);
        }

        .gallery h2 {
            color: #f1c40f;
            margin-bottom: 16px;
            font-size: 16px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .gallery-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .gallery-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .gallery-icon.unlocked {
            background: #2c2a0a;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .gallery-icon.locked {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #333;
        }

        .gallery-text { flex: 1; }

        .gallery-name {
            font-size: 13px;
            font-weight: bold;
        }

        .gallery-name.unlocked { color: #f1c40f; }
        .gallery-name.locked { color: #555; }

        .gallery-desc {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .gallery-close {
            margin-top: 16px;
            text-align: center;
        }

        .gallery-close button {
            background: linear-gradient(160deg, #1a1a22 0%, #1a1a1a 100%);
            border: 1px solid #333;
            color: #888;
            padding: 6px 20px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .gallery-close button:hover {
            border-color: #f1c40f;
            color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
            transform: translateY(-1px);
        }

        /* ── Title Screen ── */
        .title-art {
            color: #22d3ee;
            font-size: 13px;
            line-height: 1.3;
            margin: 20px 0;
        }

        /* ── Ending Screen ── */
        .ending-options {
            margin-top: 16px;
        }

        .ending-options span {
            color: #22d3ee;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 20px;
            transition: all 0.3s ease;
        }

        .ending-options span:hover {
            color: #67e8f9;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        /* The page carries <h1 class="visually-hidden"> for screen readers, but NO rule for that
           class existed in this file -- so it rendered as a full-size heading in the top-left,
           directly on top of the fixed back-link. Both were unreadable. Standard clip technique:
           removed from the visual flow, still announced. */
        .visually-hidden { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
                           overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
        /* GameScoreboard.js injects .gs-widget at top:12px/right:12px, and the achievement toast
           sits at top:60px/right:20px -- both landed ON the header row and the ASCII banner
           (measured: "Back to Cloud House >< HIGH SCORES", "3:00 >< ACHIEVEMENT UNLOCKED").
           Push both BELOW the back-link + header rows so they occupy the terminal's right lane
           instead of covering the chrome. The panel offset now lives in GameScoreboard.js
           (top:130px) for all 79 pages, so it is not repeated here. */
        /* This page has its OWN toast element, not the shared component's. It sat beside the
           scoreboard and hit its collapse arrow; bottom-right matches where the shared toast now
           lives, so both behave the same way across games. */
        /* This page runs BOTH its own toast and AchievementManager's shared one, and after moving
           the shared toast to bottom-right they landed on each other. Stack the local one above it
           rather than picking a third corner -- corners are how this whack-a-mole started. */
        .achievement-toast { top: auto !important; bottom: 104px; right: 20px; }
        @media (min-width: 900px) {
            .output-area { padding-right: 300px; }   /* lane for the scoreboard panel */
        }
        /* The ASCII banner is fixed-width art (~50 monospace columns). Inside the new bordered
           console its available width dropped by the panel's margin + padding, so at 390px it
           overflowed and painted over the header row -- a regression the console panel introduced,
           caught by the overlap scan on production. Scale the console text down so 50 columns fit
           in the panel, and stop any remaining overflow from escaping it. */
        @media (max-width: 560px) {
            .output-area { font-size: 10px; overflow-x: hidden; }
            .output-area > * { max-width: 100%; overflow-wrap: anywhere; }
        }
        @media (max-width: 899px) {
            /* `position:static` did NOT rescue this: body is height:100vh + overflow:hidden, so a
               static widget is pushed out of the flow entirely and still measured sitting on the
               brief -- confirmed on production ("Your AWS bill is $847, >< #1"). The fix is now in
               GameScoreboard.js: below 900px the panel starts COLLAPSED, so it is a single header
               row in the corner rather than a 220x177 block over the scenario copy -- and the
               student can still open it. Hiding it outright deleted their rank. */
            .achievement-toast { left: 12px; right: 12px; top: auto !important; bottom: 12px; }
        }
        .output-area > * { max-width: 108ch; }   /* bound the LINE, never the shell */
        .back-link { display:block; flex-shrink:0; padding:10px clamp(16px, 3vw, 64px);
                     color:#06b6d4; text-decoration:none; font-size:14px; cursor:pointer;
                     transition:color 0.3s; font-family:monospace; }
        .back-link:hover { color:#22d3ee; }
    
/* ── GRAPHICS PASS 2026-08-02 (Operation Improve Games) ──────────────────────
   Terminal sims read as flat grey text on black. Real CRTs glow: phosphor bloom
   on text, a moving scan sweep, screen curvature vignette, and semantic colour
   so success/warning/error read instantly instead of as more grey. */
.output-area, #output, .terminal-body, .terminal-output {
    text-shadow: 0 0 1px rgba(180, 255, 220, 0.45), 0 0 6px rgba(90, 220, 180, 0.16);
}
.success, .win, .good { color: #6ef7a8 !important; text-shadow: 0 0 8px rgba(110,247,168,.55); }
.error, .danger, .bad  { color: #ff7b72 !important; text-shadow: 0 0 8px rgba(255,123,114,.5); }
.warning, .warn        { color: #ffcf6b !important; text-shadow: 0 0 8px rgba(255,207,107,.45); }
.info                  { color: #86d9ff !important; }
/* Slow scan sweep across the whole screen */
body::after {
    content: '';
    position: fixed; left: 0; right: 0; height: 140px; top: -140px;
    background: linear-gradient(180deg, rgba(120,255,210,0) 0%, rgba(120,255,210,0.045) 50%, rgba(120,255,210,0) 100%);
    pointer-events: none; z-index: 9998;
    animation: crtSweep 7s linear infinite;
}
@keyframes crtSweep { 0% { top: -140px; } 100% { top: 100%; } }
/* Screen-edge curvature darkening */
.crt-vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 9997;
    background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%);
}
/* Blinking block cursor on the prompt */
.prompt-cursor { display:inline-block; width:9px; height:15px; background:#6ef7a8;
                 vertical-align:-2px; margin-left:2px; animation: curBlink 1.05s steps(1) infinite;
                 box-shadow: 0 0 8px rgba(110,247,168,.7); }
@keyframes curBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>
</head>
<body>
<div class="crt-vignette"></div>
<h1 class="visually-hidden">Don't Check the Bill</h1>
    <a class="back-link" href="../index.html">&larr; Back to Cloud House</a>
    <div class="header">
        <span class="header-title">DON'T CHECK THE BILL</span>
        <div class="header-center">
            <span class="bill-counter" id="billCounter">$847,000</span>
            <span class="achievement-counter" id="achCounter" onclick="Game.showGallery()" title="View Achievements"><img src="/assets/images/icons/icon-star.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> 0/12</span>
        </div>
        <span class="timer" id="timer">3:00</span>
    </div>

    <div class="output-area" id="output"></div>

    <div class="input-area">
        <span class="prompt" id="prompt">aws&gt;</span>
        <input type="text" class="input-field" id="input" placeholder="Type a command..." autofocus autocomplete="off" spellcheck="false">
    </div>

    <div class="achievement-toast" id="toast">
        <div class="achievement-toast-label">ACHIEVEMENT UNLOCKED</div>
        <div class="achievement-toast-name" id="toastName"></div>
        <div class="achievement-toast-desc" id="toastDesc"></div>
    </div>

    <div class="gallery-overlay" id="galleryOverlay">
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
    const Game = (function() {

        /* ═══════════════════════════════════════
           ACHIEVEMENT DEFINITIONS
           ═══════════════════════════════════════ */
        const ACHIEVEMENTS = {
            bill_checker:       { name: 'Bill Checker',       icon: '<img src="/assets/images/icons/icon-money.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Checked Cost Explorer first (brave)' },
            instance_killer:    { name: 'Instance Killer',    icon: '<img src="/assets/images/icons/icon-lightning.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Stopped all 200 GPU instances' },
            by_the_book:        { name: 'Cloud Professional', icon: '<img src="/assets/images/icons/icon-clipboard.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Followed full remediation methodology' },
            speed_run:          { name: 'Speed Run',          icon: '<img src="/assets/images/icons/icon-stopwatch.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Contained in under 20 seconds' },
            full_cleanup:       { name: 'Full Cleanup',       icon: '<img src="/assets/images/icons/icon-tools.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Fixed instances, Lambda, S3, IAM, and budget' },
            blame_intern:       { name: 'Blame the Intern',   icon: '<img src="/assets/images/icons/icon-users.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Talked to the intern' },
            frozen:             { name: 'Frozen',             icon: '<img src="/assets/images/icons/icon-globe.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Did nothing until time ran out' },
            coffee_cloud:       { name: 'Cloud Coffee',       icon: '<img src="/assets/images/icons/icon-tools.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Drank coffee while billing climbed' },
            bitcoin_check:      { name: 'Crypto Curious',     icon: '<img src="/assets/images/icons/icon-money.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Checked the Bitcoin mining earnings' },
            calculator_moment:  { name: 'Calculator Moment',  icon: '<img src="/assets/images/icons/icon-numbers.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Calculated years of salary' },
            aws_support:        { name: 'Called AWS Support', icon: '<img src="/assets/images/icons/icon-phone.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Contacted AWS support (smart)' },
            budget_hero:        { name: 'Budget Hero',        icon: '<img src="/assets/images/icons/icon-shield.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', desc: 'Set budget alerts and billing alarms' },
        };

        const STORAGE_KEY = 'hexworth_dontcheckbill_achievements';

        /* ═══════════════════════════════════════
           GAME STATE
           ═══════════════════════════════════════ */
        let state = {};
        let gameId = 0;

        function resetState() {
            gameId++;
            state = {
                phase: 'title',        // title | playing | ended
                timeRemaining: 180,
                timeElapsed: 0,
                timerInterval: null,
                billInterval: null,
                currentBill: 847000,
                instancesStopped: false,
                instancesTerminated: false,
                autoscalingFixed: false,
                s3Secured: false,
                lambdaFixed: false,
                budgetAlertSet: false,
                billingAlarmSet: false,
                iamFixed: false,
                costExplorerChecked: false,
                internTalkedTo: false,
                advisorRan: false,
                awsSupportCalled: false,
                commandsRun: [],
                commandCount: 0,
                eventsTriggered: [],
                ending: null,
                toastTimeout: null,
                billClimbing: true,
            };
        }

        /* ═══════════════════════════════════════
           INITIALIZATION
           ═══════════════════════════════════════ */
        function init() {
            resetState();
            const inputEl = document.getElementById('input');

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const raw = inputEl.value.trim();
                    inputEl.value = '';
                    if (raw) handleInput(raw);
                }
            });

            updateAchievementCounter();
            showTitle();
        }

        /* ═══════════════════════════════════════
           DISPLAY FUNCTIONS
           ═══════════════════════════════════════ */
        function print(text, className) {
            const outputEl = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' line-' + className : '');
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function printBlank() {
            print('');
        }

        function updateBillDisplay() {
            const el = document.getElementById('billCounter');
            el.textContent = '$' + state.currentBill.toLocaleString();
        }

        /* ═══════════════════════════════════════
           TITLE SCREEN
           ═══════════════════════════════════════ */
        function showTitle() {
            document.getElementById('timer').textContent = '3:00';
            document.getElementById('timer').className = 'timer';
            document.getElementById('billCounter').textContent = '$847,000';

        /* ═══════════════════════════════════════

        function tick() {
            state.timeRemaining--;
            state.timeElapsed++;
            updateTimerDisplay();

            checkTimedEvents();

            if (state.timeRemaining <= 0) {
                timeUp();
            }
        }

        function billTick() {
            if (state.billClimbing) {
                state.currentBill += 200;
                updateBillDisplay();
            }
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer');
            const mins = Math.floor(state.timeRemaining / 60);
            const secs = state.timeRemaining % 60;
            el.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

            if (state.timeRemaining <= 30) {
                el.className = 'timer critical';
            } else if (state.timeRemaining <= 60) {
                el.className = 'timer warning';
            } else {
                el.className = 'timer';
            }
        }

        function checkTimedEvents() {
            const events = [
                { at: 10, id: 'bill1', level: 'alert', text: '[BILLING] Current spend: $847,200 (+$200). GPU instances still running across us-east-1, us-west-2, eu-west-1, ap-southeast-1.' },
                { at: 30, id: 's3', level: 'alert', text: '[ALERT] S3 bucket \'company-backups-prod\' is PUBLIC. Bot traffic detected downloading files.' },
                { at: 50, id: 'scale', level: 'warning', text: '[BILLING] Current spend: $851,000. Auto-scaling just launched 15 MORE instances in ap-northeast-1.' },
                { at: 75, id: 'lambda', level: 'critical', text: '[CRITICAL] Lambda function \'process-data\' invoking itself. 340,000 invocations in the last hour.' },
                { at: 100, id: 'card', level: 'critical', text: '[CRITICAL] Credit card company called: "Unusual activity detected. Card frozen in 60 seconds."' },
                { at: 130, id: 'frozen', level: 'critical', text: '[CRITICAL] Card frozen. AWS services beginning graceful shutdown. Production workloads affected.' },
                { at: 155, id: 'prod', level: 'critical', text: '[CRITICAL] Production API returning 503. Customer complaints flooding in. CFO calling.' },
                { at: 170, id: 'cfo', level: 'critical', text: '[CRITICAL] CFO on phone: "EIGHT HUNDRED THOUSAND DOLLARS?!"' },
            ];

            // Skip some events if actions taken
            const skipEvents = [];
            if (state.instancesStopped && state.timeElapsed < 50) skipEvents.push('scale');
            if (state.lambdaFixed && state.timeElapsed < 75) skipEvents.push('lambda');
            if (state.s3Secured && state.timeElapsed < 30) skipEvents.push('s3');

            for (const ev of events) {
                if (state.timeElapsed >= ev.at && !state.eventsTriggered.includes(ev.id) && !skipEvents.includes(ev.id)) {
                    state.eventsTriggered.push(ev.id);
                    printBlank();
                    print(ev.text, ev.level);
                    printBlank();
                }
            }
        }

        function timeUp() {
            clearInterval(state.timerInterval);
            clearInterval(state.billInterval);

            printBlank();
            print('════════════════════════════════════════', 'critical');
            print('GAME OVER', 'critical');
            print('════════════════════════════════════════', 'critical');
            printBlank();

            if (!state.instancesStopped && !state.lambdaFixed && !state.autoscalingFixed) {
                print('Time\'s up. The credit card maxed out. AWS shut down', 'error');

                printBlank();
                print(`Final bill: $${state.currentBill.toLocaleString()}`, 'money');

                if (state.commandCount === 0) {
                    unlock('frozen');
                }

                state.ending = 'timeout';
            } else {
                print('Time\'s up, but you contained the crisis before the', 'success');

                printBlank();
                print(`Final bill: $${state.currentBill.toLocaleString()}`, 'money');
                print('(Still absurdly expensive, but at least it stopped climbing.)', 'dim');
            }

            endGame();
        }

        function handleInput(raw) {
            if (state.phase === 'title') {
                startGame();
                return;
            }

            if (state.phase === 'ended') {
                const lower = raw.toLowerCase();
                if (lower === 'r' || lower === 'restart' || lower === 'play again' || lower === 'again') {
                    restart();
                } else if (lower === 'a' || lower === 'achievements') {
                    showGallery();
                }
                return;
            }

            // Echo the input
            print('aws> ' + raw, 'input');

            state.commandCount++;
            state.commandsRun.push(raw);

            const result = processCommand(raw);
            if (result) {
                for (const line of result.split('\n')) {
                    print(line, result._className || 'output');
                }
            }

            printBlank();

            // Check win conditions after each command
            if (state.phase === 'playing') {
                checkWinCondition();
            }
        }

        function processAWSCommand(raw) {
            const lower = raw.toLowerCase();

            // Describe instances
            if (lower.includes('describe-instances') || lower === 'list instances' || lower === 'ec2 list') {
                return cmdDescribeInstances();
            }

            // Stop instances
            if (lower.includes('stop-instances') || lower === 'stop instances' || lower === 'stop all' || lower === 'stop ec2') {
                return cmdStopInstances();
            }

            // Terminate instances
            if (lower.includes('terminate-instances') || lower === 'terminate' || lower === 'terminate all') {
                return cmdTerminateInstances();
            }

            // Auto-scaling
            if (lower.includes('autoscaling') && (lower.includes('update') || lower.includes('fix') || lower.includes('set max'))) {
                if (!lower.includes('intern-test-asg')) {
                    return styledLine('Which auto-scaling group? Specify the name.\nTry: aws autoscaling update-auto-scaling-group --auto-scaling-group-name intern-test-asg --max-size 5', 'error');
                }
                return cmdFixAutoScaling();
            }

            // List S3
            if ((lower.includes('s3') && lower.includes('ls')) || lower === 'list buckets') {
                return cmdListBuckets();
            }

            // Secure S3
            if ((lower.includes('s3') && (lower.includes('put-public-access-block') || lower.includes('block public'))) || lower === 'secure buckets') {
                return cmdSecureBuckets();
            }

            // List Lambda
            if ((lower.includes('lambda') && lower.includes('list')) || lower === 'list lambda') {
                return cmdListLambda();
            }

            // Delete Lambda
            if ((lower.includes('lambda') && (lower.includes('delete') || lower.includes('kill') || lower.includes('stop')))) {
                if (!lower.includes('process-data')) {
                    return styledLine('Which Lambda function? Specify the name.\nTry: aws lambda delete-function --function-name process-data', 'error');
                }
                return cmdDeleteLambda();
            }

            // IAM
            if (lower.includes('iam') && lower.includes('list')) {
                return cmdListIAM();
            }

            if ((lower.includes('iam') && (lower.includes('detach') || lower.includes('remove') || lower.includes('fix') || lower.includes('revoke'))) || lower.includes('revoke intern')) {

  process-data     python3.9    340,000             <img src="/assets/images/icons/icon-crossmark.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> RECURSIVE
  send-emails      nodejs18.x   47                  ✓ Normal
  resize-images    python3.11   122                 ✓ Normal
  audit-logs       python3.9    8                   ✓ Normal

The "process-data" function is calling itself in an infinite loop.
It's like a digital Ouroboros, eating its own tail. Except it costs\nmoney. About $200/hour in Lambda invocations.`, 'output');
        }

        function cmdDeleteLambda() {
            if (state.lambdaFixed) {
                return styledLine('The Lambda function is already deleted. The recursion is over.', 'success');
            }

            state.lambdaFixed = true;

            return styledLine('[SUCCESS] Deleted Lambda function "process-data".\n\n  Final invocation count: 340,000\n  Cost: ~$680 (just for Lambda)\n  Recursion depth: ∞ (it was trying)\n\nThe infinite loop is broken. Silence at last.', 'success');
        }

        function cmdListIAM() {
            return styledLine(`[IAM USERS]

  Username     Access Level           MFA    Last Activity
  root         AdministratorAccess    ✓      2025-11-15
  admin        AdministratorAccess    ✓      2025-12-09 (you)
  mchen        AdministratorAccess    ✗      2025-12-09 08:47 AM
  jsmith       ReadOnlyAccess         ✓      2025-12-08
  deploy-bot   PowerUserAccess        N/A    2025-12-09

The intern has AdministratorAccess. No MFA. This is why we can't have\nnice things.`, 'output');
        }

        function cmdFixIAM() {
            if (state.iamFixed) {
                return styledLine('IAM permissions are already fixed. The intern is restricted.', 'success');
            }

            state.iamFixed = true;

            return styledLine('[SUCCESS] Revoked AdministratorAccess from user "mchen".\n\n  Old policy: AdministratorAccess\n  New policy: ReadOnlyAccess\n  MFA enforced: Yes (going forward)\n\nThe intern can now read things but not break them.\nProgress.', 'success');
        }

        function cmdCostExplorer() {
            return styledLine(`[AWS COST EXPLORER]

  Current month-to-date: $${state.currentBill.toLocaleString()}
  Previous month total: $2,100
  % change: +${Math.round((state.currentBill / 2100 - 1) * 100).toLocaleString()}%

BREAKDOWN:
  EC2 instances: $${(state.currentBill * 0.92).toFixed(0).toLocaleString()}
  Lambda: $680
  S3 storage: $120
  Data transfer: $1,200
  NAT Gateway: $85
  CloudWatch: $42
  Other: $${(state.currentBill * 0.08 - 2127).toFixed(0).toLocaleString()}

The graph looks like a rocket launch. A very expensive rocket.`, 'output');
        }

        function cmdCreateBudget() {
            if (state.budgetAlertSet) {
                return styledLine('Budget alert is already set. You\'ll be notified at $3,000.', 'success');
            }

            state.budgetAlertSet = true;

            return styledLine('[SUCCESS] Created budget alert.\n\n  Budget name: Monthly-AWS-Limit\n  Amount: $3,000/month\n  Alert threshold: 80% ($2,400)\n  Notification: your-email@company.com\n\nYou\'ll get an email if spending exceeds $2,400. This should have\nbeen set up 3 days ago. Live and learn.', 'success');
        }

        function cmdBillingAlarm() {
            if (state.billingAlarmSet) {
                return styledLine('CloudWatch billing alarm is already set.', 'success');
            }

            state.billingAlarmSet = true;

            return styledLine('[SUCCESS] Created CloudWatch billing alarm.\n\n  Alarm name: Billing-Alert-Critical\n  Metric: EstimatedCharges\n  Threshold: > $2,500\n  Action: SNS notification to on-call\n\nNote: EstimatedCharges is published roughly every 6 hours, and only in\nus-east-1 -- so billing alarms are hours-early warning, not minutes.\nFor minute-level detection you need usage-metric or Budgets actions.\nStill far better than finding out 3 days later.', 'success');
        }

        function adventureLook() {
            let desc = 'Your CloudWatch dashboard looks like a stock market crash. Every\n';
            desc += 'graph is vertical. The billing graph has left the chart area entirely\n';
            desc += 'and is just a line going up into the header.\n\n';

            if (state.instancesStopped) {
                desc += 'The EC2 instances are stopped. The main fire is out.\n';
            } else {
                desc += 'GPU instances named "totally_not_mining_bitcoin_01" through "200"\n';
                desc += 'are running across 4 regions. Your laptop fan is working harder\n';
                desc += 'than those GPUs. You\'re sweating.\n';
            }

            if (state.lambdaFixed) {
                desc += 'The recursive Lambda is deleted. One less problem.\n';
            }

            if (state.s3Secured) {
                desc += 'The S3 buckets are secured. No more public backups.\n';
            }

            if (!state.instancesStopped && !state.lambdaFixed) {
                desc += '\nThe bill is still climbing. Your coffee is getting cold.';
            }

            return styledLine(desc, 'dim');
        }

        /* ═══════════════════════════════════════
           HELP & HINTS
           ═══════════════════════════════════════ */

        function showHelp() {
            return styledLine(`AWS COMMANDS:
  aws ec2 describe-instances      List all running instances
  aws ec2 stop-instances          Stop GPU instances
  aws ec2 terminate-instances     Terminate instances (permanent)
  aws autoscaling update-auto-scaling-group --auto-scaling-group-name intern-test-asg   Fix auto-scaling limits
  aws s3 ls                       List S3 buckets
  aws s3api put-public-access-block   Secure public buckets
  aws lambda list-functions       List Lambda functions
  aws lambda delete-function --function-name process-data   Delete recursive Lambda
  aws iam list-users              Check IAM permissions
  aws iam detach-user-policy --user-name mchen --policy-arn arn:aws:iam::aws:policy/AdministratorAccess   Fix intern's permissions
  aws ce get-cost-and-usage        Check Cost Explorer (brave)
  aws budgets create-budget       Set budget alerts
  aws cloudwatch put-metric-alarm Set billing alarm
  aws cloudtrail lookup-events    Check audit logs
  aws trusted-advisor             Run Trusted Advisor
  aws support create-case         Contact AWS Support

SHORTCUTS:
  list instances    stop instances    list buckets
  secure buckets    list lambda       check bill
  set budget

NOTE: autoscaling, lambda delete, and iam fix each need the real
resource name (see above) — not just the bare verb.

OTHER:
  look, inventory, hint, panic, coffee, blame intern

There are 12 achievements. Some require... creativity.`, 'info');
        }

        function showHint() {
            if (state.instancesStopped && state.lambdaFixed && state.s3Secured) {
                return styledLine('[HINT] You\'ve handled the main fires. Consider fixing IAM permissions\nand setting up budget alerts to prevent this from happening again.', 'hint');
            }

            if (state.instancesStopped) {
                return styledLine('[HINT] Good - instances are stopped. But there\'s still a recursive\nLambda function and public S3 buckets. Multiple fires burning.', 'hint');
            }

            if (state.commandCount === 0) {
                return styledLine('[HINT] 200 GPU instances are running at $5,000/hour. Priority one:\nstop them. Try: aws ec2 stop-instances', 'hint');
            }

            if (state.commandCount < 3) {
                return styledLine('[HINT] Focus on the biggest cost: EC2 instances. Stop them first,\nthen fix auto-scaling so they can\'t spin up again.', 'hint');
            }

            return styledLine('[HINT] The bill is climbing at $200/minute. Stop instances, fix\nauto-scaling, secure S3, kill the Lambda. Triage the fires.', 'hint');
        }

        /* ═══════════════════════════════════════
           WIN CONDITION CHECK
           ═══════════════════════════════════════ */

        function checkWinCondition() {
            // "By The Book" - full methodology
            if (state.instancesStopped && state.lambdaFixed && state.s3Secured && state.iamFixed && state.budgetAlertSet) {
                unlock('by_the_book');
            }

            // "Full Cleanup" - all major issues fixed
            if (state.instancesStopped && state.lambdaFixed && state.s3Secured && state.iamFixed && state.budgetAlertSet) {
                unlock('full_cleanup');
            }

            // "Budget Hero" - set both budget and alarm
            if (state.budgetAlertSet && state.billingAlarmSet) {
                unlock('budget_hero');
            }

            // Win condition: Stopped instances AND (fixed Lambda OR fixed auto-scaling)
            if ((state.instancesStopped || state.instancesTerminated) && (state.lambdaFixed || state.autoscalingFixed)) {
                if (state.ending === null) {
                    state.ending = 'success';
                    clearInterval(state.timerInterval);
                    clearInterval(state.billInterval);

                    const thisGameId = gameId;
                    setTimeout(function() {
                        if (gameId !== thisGameId || state.phase !== 'playing') return;
                        printBlank();
                        print('════════════════════════════════════════', 'success');
                        print('CRISIS CONTAINED', 'success');
                        print('════════════════════════════════════════', 'success');
                        printBlank();

                        const elapsed = state.timeElapsed;
                        const mins = Math.floor(elapsed / 60);
                        const secs = elapsed % 60;
                        print(`Time: ${mins}m ${secs}s`, 'info');
                        print(`Final bill: $${state.currentBill.toLocaleString()}`, 'money');
                        printBlank();

                        // Determine what they did
                        const actions = [];
                        if (state.instancesStopped) actions.push('Stopped GPU instances');
                        if (state.instancesTerminated) actions.push('Terminated instances');
                        if (state.autoscalingFixed) actions.push('Fixed auto-scaling');
                        if (state.lambdaFixed) actions.push('Killed recursive Lambda');
                        if (state.s3Secured) actions.push('Secured S3 buckets');
                        if (state.iamFixed) actions.push('Fixed IAM permissions');
                        if (state.budgetAlertSet) actions.push('Set budget alerts');

                        print('Actions taken:', 'dim');
                        for (const action of actions) {
                            print('  • ' + action, 'dim');
                        }
                        printBlank();

                        if (state.instancesStopped && state.lambdaFixed && state.s3Secured && state.iamFixed && state.budgetAlertSet) {
                            print('Textbook cloud incident response. Stopped the bleeding,', 'narrative');
                            print('fixed the vulnerabilities, set up monitoring. The CFO is', 'narrative');
                            print('still angry about the $847K bill, but at least it stopped', 'narrative');
                            print('climbing. Your job is probably safe. Probably.', 'narrative');
                        } else if (state.instancesStopped && state.autoscalingFixed) {
                            print('Quick and decisive. Stopped the instances, prevented them', 'narrative');
                            print('from auto-scaling back up. The bill stopped climbing.', 'narrative');
                            print('There\'s still cleanup to do (Lambda, S3, IAM), but the', 'narrative');
                            print('main fire is out. You can breathe now.', 'narrative');
                        } else {
                            print('You stopped the runaway costs. Not the cleanest approach,', 'narrative');
                            print('but effective. The bill stopped climbing. Now comes the fun', 'narrative');
                            print('part: explaining to the CFO why AWS charged $847,000 for', 'narrative');
                            print('a "test environment."', 'narrative');
                        }

                        printBlank();
                        print('The intern has been moved to a role with "no production access."', 'dim');
                        print('You\'ve learned that "auto_scaling_max: unlimited" is a dangerous string.', 'dim');
                        print('And you\'ll never skip setting up billing alerts again.', 'dim');

                        endGame();
                    }, 1500);
                }
            }
        }

        /* ═══════════════════════════════════════
           GAME END
           ═══════════════════════════════════════ */

        function endGame() {
            state.phase = 'ended';
            clearInterval(state.timerInterval);
            clearInterval(state.billInterval);

            // Award platform achievements via AchievementSystem
            if (typeof AchievementSystem !== 'undefined') {
                if (state.ending === 'success') {
                    AchievementSystem.unlockGameAchievement('bill', 'win');
                }
                const saved = loadAchievements();
                if (saved.by_the_book) {
                    AchievementSystem.unlockGameAchievement('bill', 'by_the_book');
                }
                if (saved.speed_run) {
                    AchievementSystem.unlockGameAchievement('bill', 'speed');
                }
                if (Object.keys(saved).length >= 12) {
                    AchievementSystem.unlockGameAchievement('bill', 'all');
                }
            }

            // Award XP (one-time)
            if (state.ending === 'success') {
                if (!localStorage.getItem('game_bill_xp_awarded')) {
                    const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                    localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                    localStorage.setItem('game_bill_xp_awarded', 'true');
                    if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                        FirestoreManager.addXP(null, 50, 'Don\'t Check the Bill Complete'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
                    }
                }
                if (typeof AchievementManager !== 'undefined') {
                    AchievementManager.unlock('game_bill');
                }
            }

            // Track game stats
            if (typeof GameTracker !== 'undefined') {
                // FLEET FIX 2026-08-02: recorded with NO score field, so the live-looking
                // HIGH SCORES panel could never populate. Score = achievements earned,
                // time bonus for a fast clean resolution, zeroed on a losing ending.
                const _won = !!(state.ending && /win|success|saved|contained|resolved/i.test(state.ending));
                const _score = _won ? (Object.keys(loadAchievements()).length * 100 + Math.max(0, 300 - (state.timeElapsed || 0)) * 2) : 0;
                GameTracker.record('bill', {
                    score: _score,
                    result: state.ending || 'unknown',
                    timeElapsed: state.timeElapsed,
                    commandsUsed: state.commandCount,
                    achievementsEarned: Object.keys(loadAchievements()).length,
                    achievementsTotal: Object.keys(loadAchievements()).length
                });
            }

            document.getElementById('input').placeholder = 'Type R to restart or A for achievements...';

            printBlank();
            print('────────────────────────────────────────', 'dim');

            const saved = loadAchievements();
            const count = Object.keys(saved).length;
            print(`Achievements: ${count}/12`, 'achievement');

            printBlank();
            print('[R] Play Again    [A] View Achievements', 'info');
        }

        function restart() {
            clearInterval(state.timerInterval);
            clearInterval(state.billInterval);
            document.getElementById('output').innerHTML = '';
            resetState();
            document.getElementById('timer').textContent = '3:00';
            document.getElementById('timer').className = 'timer';
            document.getElementById('billCounter').textContent = '$847,000';
            document.getElementById('prompt').style.display = '';
            document.getElementById('input').placeholder = 'Type a command...';
            updateAchievementCounter();
            startGame();
        }

        /* ═══════════════════════════════════════
           ACHIEVEMENTS
           ═══════════════════════════════════════ */

        function loadAchievements() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            } catch { return {}; }
        }

        function saveAchievements(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function unlock(id) {
            const saved = loadAchievements();
            if (saved[id]) return; // already unlocked

            const ach = ACHIEVEMENTS[id];
            if (!ach) return;

            saved[id] = { unlockedAt: Date.now() };
            saveAchievements(saved);

            // Show toast
            showToast(ach.name, ach.desc);

            // Update counter
            updateAchievementCounter();

            // Print in terminal
            print(`[ACHIEVEMENT] ${ach.icon} ${ach.name} — ${ach.desc}`, 'achievement');
        }

        function showToast(name, desc) {
            const toast = document.getElementById('toast');
            document.getElementById('toastName').textContent = name;
            document.getElementById('toastDesc').textContent = desc;
            toast.classList.add('show');

            if (state.toastTimeout) clearTimeout(state.toastTimeout);
            state.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function updateAchievementCounter() {
            const saved = loadAchievements();
            const count = Object.keys(saved).length;
            document.getElementById('achCounter').textContent = `\u2605 ${count}/12`;
        }

        function showGallery() {
            const saved = loadAchievements();
            const overlay = document.getElementById('galleryOverlay');
            const gallery = document.getElementById('gallery');

            let html = '<h1>ACHIEVEMENTS</h1>';

            for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
                const unlocked = !!saved[id];
                html += `
                    <div class="gallery-item">
                        <div class="gallery-icon ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? ach.icon : '?'}</div>
                        <div class="gallery-text">
                            <div class="gallery-name ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? ach.name : '???'}</div>
                            <div class="gallery-desc">${unlocked ? ach.desc : 'Not yet unlocked'}</div>
                        </div>
                    </div>`;
            }

            html += `<div class="gallery-close"><button onclick="Game.hideGallery()">Close</button></div>`;

            gallery.innerHTML = html;
            overlay.classList.add('show');
        }

        function hideGallery() {
            document.getElementById('galleryOverlay').classList.remove('show');
            document.getElementById('input').focus();
        }

        /* ═══════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════ */

        function styledLine(text, className) {
            // Tag the string with a class for the printer
            const s = new String(text);
            s._className = className;
            return s;
        }

        /* ═══════════════════════════════════════
           GALLERY CLOSE ON CLICK OUTSIDE
           ═══════════════════════════════════════ */
        document.addEventListener('click', function(e) {
            if (e.target.id === 'galleryOverlay') {
                hideGallery();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideGallery();
            }
        });

        /* ═══════════════════════════════════════
           PUBLIC API
           ═══════════════════════════════════════ */
        return { init, showGallery, hideGallery };

    })();

    // Boot
    document.addEventListener('DOMContentLoaded', Game.init);
    </script>
    <!-- FLEET WIRING SWEEP 2026-08-02 (Operation Improve Games): FirebaseAuth MUST load
         before FirestoreManager -- addXP and GameTracker's scoreboard submit both guard on
         FirebaseAuth first, so without this pair every XP award and every leaderboard
         submission on this page silently no-ops behind a typeof check. -->
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/FirestoreManager.js"></script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/GameScoreboard.js"></script>
    <script src="../../../components/AchievementSystem.js"></script>
    <script src="../../../components/GameBriefing.js"></script>
    <script>
        // Shared briefing (2026-08-03): every game must state who you are, what winning
        // looks like, the literal VERB, why it matters, and where help lives.
        GameBriefing.init({
            key: 'cloud-bill',
            title: 'Don\'t Check the Bill',
            accent: '#22d3ee',
            role: 'You are the cloud engineer who came back from a 3-day weekend to a $847,000 AWS bill that is still climbing.',
            goal: 'Find what the intern left running and shut it down before the bill bankrupts the company. You win by stopping the spend at its source, not by guessing.',
            howto: ['TYPE commands at the aws> prompt and press ENTER', 'Start with \'help\' to see every command available', 'Investigate before you act -- find WHAT is running and WHERE', '\'hint\' gives you a nudge when stuck'],
            why: 'This is real AWS cost-incident response: read the bill, find the runaway resource, stop it, then prevent recurrence with a budget alarm.',
            help: 'Type \'hint\' at any time, or reopen this briefing from the How to Play button.',
            startLabel: 'Open the terminal'
        });
    </script>
