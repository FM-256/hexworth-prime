    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #0a0a12 0%, #0a0a0a 50%, #080810 100%);
            color: #06b6d4;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* CRT Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 999;
        }

        #game-container {
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        #game-container::-webkit-scrollbar {
            width: 10px;
        }

        #game-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        #game-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%);
            border-radius: 4px;
        }

        .back-link {
            color: #06b6d4;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #67e8f9;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }

        #ascii-title {
            color: #06b6d4;
            line-height: 1.2;
            margin-bottom: 20px;
            white-space: pre;
            font-size: 12px;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        #status-bar {
            border: 2px solid rgba(6, 182, 212, 0.6);
            padding: 15px;
            margin-bottom: 20px;
            background: linear-gradient(160deg, rgba(6, 182, 212, 0.1) 0%, rgba(6, 182, 212, 0.02) 100%);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.1), inset 0 1px 0 rgba(6, 182, 212, 0.1);
        }

        .status-item {
            margin: 5px 0;
        }

        .cost-warning {
            color: #ef4444;
            animation: pulse 1s infinite;
        }

        .cost-critical {
            color: #dc2626;
            animation: pulse 0.5s infinite;
            font-weight: bold;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #output {
            margin-bottom: 20px;
            min-height: 300px;
        }

        .output-line {
            margin: 5px 0;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 1s steps(40, end);
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        .json-output {
            color: #ffffff;
            margin-left: 20px;
            white-space: pre;
            font-size: 13px;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }

        .warning {
            color: #f59e0b;
        }

        .info {
            color: #06b6d4;
        }

        #input-container {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        #prompt {
            color: #06b6d4;
            margin-right: 10px;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #22d3ee;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            outline: none;
            flex: 1;
            caret-color: #67e8f9;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        }

        #command-input:focus {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }

        .ascii-art {
            color: #06b6d4;
            white-space: pre;
            font-size: 10px;
            line-height: 1;
            margin: 10px 0;
        }

        .help-section {
            border-left: 3px solid #06b6d4;
            padding-left: 15px;
            margin: 10px 0;
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.05) 0%, transparent 100%);
        }

        .command-list {
            margin-left: 20px;
        }

        #cost-meter {
            font-size: 11px;
            color: #06b6d4;
            white-space: pre;
            font-family: 'Courier New', monospace;
        }

        .ending-screen {
            border: 3px solid rgba(6, 182, 212, 0.6);

            margin: 20px 0;
            background: linear-gradient(160deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0.03) 100%);

            color: #ffffff;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .button-group {
            margin-top: 20px;
        }

        .game-button {
            background: linear-gradient(160deg, rgba(6, 182, 212, 0.1) 0%, transparent 100%);
            border: 2px solid #06b6d4;
            color: #06b6d4;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;

        .game-button:hover {
            background: linear-gradient(160deg, #06b6d4 0%, #0891b2 100%);
            color: #0a0a0a;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }
        /* The page carries <h1 class="visually-hidden"> for screen readers, but no rule for that
           class existed here -- so it painted as a full-size heading over the top of the game.
           Note it is NOT the same as `.hidden` above: that removes the element from the
           accessibility tree too, which would drop the page's only h1. Repo-standard clip
           technique (used in 77+ files): removed from the visual flow, still announced. */
        /* The ASCII wordmark ran straight under GameScoreboard's panel at every viewport, and at
           390px the back-link landed on HIGH SCORES too. Push the panel below the chrome, reserve a
           lane for it on wide screens, and drop it on phones where there is no room beside a
           fixed-width banner. The push-below-chrome offset now lives in GameScoreboard.js
           (top:130px) for every page, so it is not repeated here. */
        @media (min-width: 900px) { body { padding-right: 300px; } }
        .visually-hidden { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
                           overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%);
                           white-space:nowrap; border:0; }

            osc.start();
            osc.stop(audioCtx.currentTime + 0.01);

            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playWhoosh() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playAlarm() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(330, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.45);
        }

        function playVictory() {
            const notes = [261.63, 329.63, 392, 523.25];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                osc.start(audioCtx.currentTime + i * 0.15);
                osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
            });
        }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        // ASCII Art

            setInterval(() => {

                const seconds = Math.floor(elapsed % 60);

                    endGame('bankrupt');

        function updateCostDisplay() {
            const costElement = document.getElementById('current-cost');
            const formatted = '$' + Math.floor(gameState.cost).toLocaleString();

            if (gameState.cost >= 750000) {
                costElement.className = 'cost-critical';
            } else if (gameState.cost >= 500000) {
                costElement.className = 'cost-warning';
            }

            updateCostMeter();

            if (Math.random() > 0.7) {
                playKaching();
            }
        }

        function updateCostMeter() {
            const percent = Math.min((gameState.cost / 1000000) * 100, 100);
            const filled = Math.floor(percent / 2);
            const empty = 50 - filled;

            let color = '#22c55e';
            if (percent >= 75) color = '#dc2626';
            else if (percent >= 50) color = '#f59e0b';

            const meter = `[${'█'.repeat(filled)}${'░'.repeat(empty)}] ${percent.toFixed(1)}% of $1M limit`;
            const container = document.getElementById('cost-meter-container');
            container.innerHTML = `<span style="color: ${color}">${meter}</span>`;
        }

            output.appendChild(line);

        // Parameterized commands
        function handleParameterizedCommand(input) {
            const parts = input.split(' ');
            const baseCmd = parts.slice(0, 2).join(' ');
            const param = parts.slice(2).join(' ');

            if (baseCmd === 'iam get-user') {
                if (param === 'data-processor-service') {
                    playWhoosh();
                    printLine('', 'info');
                    printJSON({
                        "User": {
                            "UserName": "data-processor-service",
                            "UserId": "AIDAI23HXD2O5EXAMPLE",
                            "Arn": "arn:aws:iam::123456789012:user/data-processor-service",
                            "CreateDate": "2023-06-20T08:30:00Z"
                        },
                        "AccessKeys": [
                            {
                                "AccessKeyId": "AKIAIOSFODNN7EXAMPLE",
                                "Status": "Active",
                                "CreateDate": "2023-06-20T08:30:00Z"
                            }
                        ]
                    });
                    printLine('', 'info');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  This is the compromised access key!', 'error');
                    gameState.foundAccessKey = true;
                } else {
                    printLine(`User "${param}" details not relevant to investigation.`, 'info');
                }
                return true;
            }

            if (baseCmd === 'lambda get-function') {
                if (param.includes('AutoScaleWorkers')) {
                    playWhoosh();
                    printLine('', 'info');
                    printJSON({
                        "Configuration": {
                            "FunctionName": "AutoScaleWorkers",
                            "FunctionArn": "arn:aws:lambda:us-east-1:123456789012:function:AutoScaleWorkers",
                            "Runtime": "python3.9",
                            "Role": "arn:aws:iam::123456789012:role/LegacyDataProcessor",
                            "Handler": "index.handler",
                            "Environment": {
                                "Variables": {
                                    "INSTANCE_TYPE": "p3.16xlarge",
                                    "MIN_INSTANCES": "50",
                                    "MINING_POOL": "pool.supportxmr.com"
                                }
                            }
                        },
                        "Code": {
                            "RepositoryType": "S3",
                            "Location": "s3://malicious-deployments/worker.zip"
                        }
                    });
                    printLine('', 'info');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> SMOKING GUN: This Lambda is spawning mining instances!', 'error');
                    printLine('Environment variable "MINING_POOL" confirms malicious intent.', 'error');
                    gameState.foundLambda = true;
                } else {
                    printLine('Function details not relevant to investigation.', 'info');
                }
                return true;
            }

            if (baseCmd === 'lambda delete-function') {
                if (param.includes('AutoScaleWorkers') || param === gameState.lambdaArn) {
                    if (gameState.lambdaDisabled) {
                        printLine('Lambda function already deleted.', 'warning');
                    } else {
                        playWhoosh();
                        printLine('', 'info');
                        printLine('Deleting Lambda function...', 'warning');
                        setTimeout(() => {
                            printLine('✓ Lambda function "AutoScaleWorkers" deleted successfully', 'success');
                            printLine('This will prevent new instances from auto-spawning.', 'success');
                            gameState.lambdaDisabled = true;
                            checkWinCondition();
                        }, 1000);
                    }
                } else {
                    printLine('Error: Function not found or not authorized to delete.', 'error');
                }
                return true;
            }

            if (baseCmd === 'ec2 terminate') {
                const instanceId = param.trim();
                if (gameState.suspiciousInstances.includes(instanceId)) {
                    if (gameState.instancesTerminated) {
                        printLine(`Instance ${instanceId} already terminated.`, 'warning');
                    } else if (!gameState.lambdaDisabled) {
                        playSpinUp();
                        printLine('', 'info');
                        printLine(`Terminating instance ${instanceId}...`, 'warning');
                        setTimeout(() => {
                            printLine(`✓ Instance ${instanceId} terminated`, 'success');
                            printLine('', 'info');
                            printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  WARNING: New instance detected!', 'error');
                            printLine('The Lambda function is respawning instances. Disable it first!', 'error');
                        }, 1000);
                    } else {
                        playWhoosh();
                        printLine('', 'info');
                        printLine(`Terminating instance ${instanceId}...`, 'warning');
                        setTimeout(() => {
                            printLine(`✓ Instance ${instanceId} terminated`, 'success');
                            const idx = gameState.suspiciousInstances.indexOf(instanceId);
                            gameState.suspiciousInstances.splice(idx, 1);

                            if (gameState.suspiciousInstances.length === 0) {
                                printLine('✓ All malicious instances terminated!', 'success');
                                gameState.instancesTerminated = true;
                                checkWinCondition();
                            } else {
                                printLine(`${gameState.suspiciousInstances.length} malicious instance(s) remaining.`, 'warning');
                            }
                        }, 1000);
                    }
                } else {
                    printLine(`Instance ${instanceId} not found or not suspicious.`, 'error');
                }
                return true;
            }

            if (baseCmd === 'iam delete-access-key') {
                const key = param.trim();
                if (key === gameState.compromisedKey) {
                    if (gameState.credentialsRevoked) {
                        printLine('Access key already revoked.', 'warning');
                    } else {
                        playWhoosh();
                        printLine('', 'info');
                        printLine(`Revoking access key ${key}...`, 'warning');
                        setTimeout(() => {
                            printLine(`✓ Access key ${key} has been deactivated and deleted`, 'success');
                            printLine('Attacker can no longer authenticate with this credential.', 'success');
                            gameState.credentialsRevoked = true;
                            checkWinCondition();
                        }, 1000);
                    }
                } else {
                    printLine('Error: Access key not found or not authorized.', 'error');
                }
                return true;
            }

            if (baseCmd === 'sts assume-role') {
                const arn = param.trim();
                if (!arn) {
                    printLine('Usage: sts assume-role <arn>', 'error');
                    printLine('Example: sts assume-role arn:aws:iam::123456789012:role/SecurityAudit', 'info');
                } else if (arn.includes('LegacyDataProcessor') || arn.includes('123456789012')) {
                    playWhoosh();
                    printLine('', 'info');
                    printLine(`Assuming role: ${arn}`, 'warning');
                    setTimeout(() => {
                        printJSON({
                            "Credentials": {
                                "AccessKeyId": "ASIAI23TEMPORARYEXAMP",
                                "SecretAccessKey": "wJalrXUtnFEMI/TEMPORARY/bPxRfiCYEXAMPLEKEY",
                                "SessionToken": "AQoXnyc4lcBXa4RmY0...[truncated]",
                                "Expiration": new Date(Date.now() + 3600000).toISOString()
                            },
                            "AssumedRoleUser": {
                                "Arn": arn,
                                "AssumedRoleId": "AROAI23TEMPORARYEXAMPLE:session"
                            }
                        });
                        printLine('', 'info');
                        printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  Role assumed. This role has EC2 and Lambda permissions.', 'warning');
                        printLine('The attacker used this technique to escalate privileges.', 'info');
                    }, 800);
                } else {
                    printLine(`Error: Role "${arn}" not found or not authorized to assume.`, 'error');
                }
                return true;
            }

            return false;
        }

        // Win condition checker
        function checkWinCondition() {
            if (gameState.lambdaDisabled && gameState.instancesTerminated && gameState.credentialsRevoked) {
                if (gameState.cost < 200000) {
                    endGame('perfect');
                } else if (gameState.cost < 500000) {
                    endGame('good');
                } else {
                    endGame('contained');
                }
            }
        }

        // End game
        function endGame(result) {
            gameState.gameActive = false;
            const finalCost = Math.floor(gameState.cost);
            if (typeof GameTracker !== 'undefined') GameTracker.record('aws_sts', { score: finalCost, result: result });

            setTimeout(() => {
                printLine('', 'info');
                printLine('═══════════════════════════════════════════════════', 'info');

                if (result === 'perfect') {
                    playVictory();
                    printLine('', 'success');
                    printLine('<img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> PERFECT RESPONSE - THREAT NEUTRALIZED <img src="/assets/images/icons/icon-trophy.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', 'success');
                    printLine('', 'success');
                    printLine(`Final Cost: $${finalCost.toLocaleString()}`, 'success');
                    printLine('', 'info');
                    printLine('You acted swiftly and methodically:', 'info');
                    printLine('✓ Identified the compromised access key', 'success');
                    printLine('✓ Disabled the auto-scaling Lambda function', 'success');
                    printLine('✓ Terminated all mining instances', 'success');
                    printLine('✓ Revoked attacker credentials', 'success');
                    printLine('', 'info');
                    printLine('The CFO sends their regards. The board is impressed.', 'success');
                    printLine('You have been promoted to Principal Cloud Security Architect.', 'success');
                    awardXP();
                } else if (result === 'good') {
                    playVictory();
                    printLine('', 'success');
                    printLine('✓ THREAT CONTAINED - INCIDENT RESOLVED', 'success');
                    printLine('', 'success');
                    printLine(`Final Cost: $${finalCost.toLocaleString()}`, 'warning');
                    printLine('', 'info');
                    printLine('You successfully stopped the attack:', 'info');
                    printLine('✓ Lambda function disabled', 'success');
                    printLine('✓ Mining instances terminated', 'success');
                    printLine('✓ Credentials revoked', 'success');
                    printLine('', 'info');
                    printLine('The damage was significant but contained.', 'warning');
                    printLine('Incident response time could be improved.', 'warning');
                    awardXP();
                } else if (result === 'contained') {
                    playAlarm();
                    printLine('', 'warning');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  THREAT CONTAINED - MAJOR FINANCIAL IMPACT', 'warning');
                    printLine('', 'warning');
                    printLine(`Final Cost: $${finalCost.toLocaleString()}`, 'error');
                    printLine('', 'info');
                    printLine('You eventually stopped the attack, but:', 'info');
                    printLine('✓ Lambda function disabled', 'success');
                    printLine('✓ Mining instances terminated', 'success');
                    printLine('✓ Credentials revoked', 'success');
                    printLine('', 'info');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  Response time was too slow', 'error');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  CFO is NOT happy', 'error');
                    printLine('<img src="/assets/images/icons/icon-siren.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">  FinOps team will be implementing stricter controls', 'warning');
                    awardXP();
                } else if (result === 'bankrupt') {
                    playAlarm();
                    printLine('', 'error');
                    printLine('<img src="/assets/images/icons/icon-explosion.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> GAME OVER - BUDGET EXCEEDED <img src="/assets/images/icons/icon-explosion.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain">', 'error');
                    printLine('', 'error');
                    printLine(`Final Cost: $${finalCost.toLocaleString()}`, 'error');
                    printLine('', 'info');
                    printLine('The bill exceeded $1,000,000.', 'error');
                    printLine('', 'info');
                    printLine('The CFO has called an emergency board meeting.', 'error');
                    printLine('Your AWS account has been suspended.', 'error');
                    printLine('The company is reviewing all cloud operations.', 'error');
                    printLine('', 'info');
                    printLine('Better luck next time, Cloud Architect.', 'warning');
                }

                printLine('', 'info');
                printLine('═══════════════════════════════════════════════════', 'info');

                const restartBtn = `<button class="game-button" onclick="location.reload()">Try Again</button>`;
                const backBtn = `<a href="../index.html" class="game-button" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">Back to Cloud House</a>`;

                const output = document.getElementById('output');
                const btnDiv = document.createElement('div');
                btnDiv.className = 'button-group';
                btnDiv.style.textAlign = 'center';
                btnDiv.style.marginTop = '20px';
                btnDiv.innerHTML = restartBtn + backBtn;
                output.appendChild(btnDiv);

                document.getElementById('input-container').style.display = 'none';
            }, 500);
        }

        // XP Award
        function awardXP() {
            if (localStorage.getItem('game_awssts_xp_awarded')) return;
            localStorage.setItem('game_awssts_xp_awarded', 'true');
            let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
            xp += 50;
            localStorage.setItem('hexworth_xp', xp.toString());
            if (window.FirestoreManager) {
                FirestoreManager.addXP(null, 50, 'aws sts'); // BUG-082: uid arg is ignored by addXP; the CF derives the user from auth
            }
            if ((typeof AchievementManager !== 'undefined' && AchievementManager)) AchievementManager.unlock('game_awssts');

            printLine('', 'info');
            printLine('<img src="/assets/images/icons/icon-target.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> +50 XP - Cloud Heist Survived', 'success');
        }

        // Input handling
        const input = document.getElementById('command-input');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                if (command === '') return;

                playClick();
                printLine(`aws> ${command}`, 'info');
                gameState.commandHistory.push(command);
                gameState.historyIndex = gameState.commandHistory.length;
                input.value = '';

                if (commands[command]) {
                    commands[command]();
                } else if (handleParameterizedCommand(command)) {
                    // Handled by parameterized function
                } else {
                    printLine(`Command not found: "${command}"`, 'error');
                    printLine('Type "help" for available commands', 'info');
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (gameState.historyIndex > 0) {
                    gameState.historyIndex--;
                    input.value = gameState.commandHistory[gameState.historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (gameState.historyIndex < gameState.commandHistory.length - 1) {
                    gameState.historyIndex++;
                    input.value = gameState.commandHistory[gameState.historyIndex];
                } else {
                    gameState.historyIndex = gameState.commandHistory.length;
                    input.value = '';
                }
            }
        });

        // Initialize
        init();
    </script>
