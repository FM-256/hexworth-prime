    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Azure Architecture and Services',
            description: 'Test your understanding of Azure regions, availability zones, resource groups, compute, networking, storage, identity, and database services',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az900-ch02-quiz',
            moduleId: 'az900-ch02-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is an Azure region?',
                    options: [
                        'A set of datacenters within a latency-defined perimeter connected by a dedicated regional low-latency network',
                        'A single datacenter building operated by Microsoft',
                        'A country where Azure services are legally available',
                        'A virtual boundary created by an Azure subscription'
                    ],
                    explanation: 'An Azure region is a set of datacenters deployed within a latency-defined perimeter and connected through a dedicated regional low-latency network. Crawl: Azure operates in 60+ regions across the globe. A region is not a single building or a country — it is a collection of physical datacenters close enough to each other that network latency between them is minimal. When you deploy a resource "in East US," Azure places it in one of several datacenters within that region. Walk: regions matter for three reasons: performance (deploy near your users to reduce latency), compliance (some regulations require data to stay in specific geographies), and service availability (not every Azure service is available in every region). You choose a region when creating most resources, and that choice determines where your data physically resides. Run: the latency-defined perimeter is the key distinction. Microsoft does not publish exact distances, but the datacenters within a region are close enough that synchronous replication and high-availability features work without noticeable performance impact. This is different from availability zones (which are distinct physical locations within a region) and region pairs (which connect two regions for disaster recovery). For AZ-900, understand that region selection affects data residency, available services, and pricing — some services cost more in certain regions due to local infrastructure costs.'
                },
                {
                    question: 'What are Availability Zones in Azure?',
                    options: [
                        'Different Azure subscriptions used for billing separation',
                        'Software-defined partitions within a single datacenter rack',
                        'Physically separate datacenters within an Azure region, each with independent power, cooling, and networking',
                        'Geographic regions where Azure services comply with local regulations'
                    ],
                    explanation: 'Availability Zones are physically separate datacenters within a single Azure region, each with its own independent power, cooling, and networking infrastructure. Crawl: a region that supports Availability Zones has a minimum of three separate zones. If one datacenter loses power or suffers a cooling failure, the other zones continue operating independently. Your application can be deployed across multiple zones so it survives a single-zone failure. Walk: there are two ways to use Availability Zones. Zonal services let you pin a resource to a specific zone (e.g., a VM in Zone 1). Zone-redundant services automatically replicate across zones (e.g., zone-redundant storage or Azure SQL Database). The first approach gives you control; the second gives you automatic resilience. Run: Availability Zones are connected by high-performance fiber networks with less than 2ms round-trip latency between zones — fast enough for synchronous replication but separate enough to protect against localized disasters like fires, floods, or power grid failures. Not every region has Availability Zones — only regions with enough physical datacenter separation qualify. For AZ-900, the key concept is the hierarchy: a region contains zones, zones contain datacenters. Availability Zones protect against datacenter-level failures within a region; region pairs protect against region-level failures across a geography. Understanding this layered resilience model is fundamental to Azure architecture decisions.'
                },
                {
                    question: 'What is a region pair in Azure?',
                    options: [
                        'Two availability zones within the same datacenter',
                        'Two regions within the same geography paired for disaster recovery, typically at least 300 miles apart',
                        'A primary and secondary subscription linked for billing',
                        'Two virtual networks peered across regions'
                    ],
                    explanation: 'A region pair consists of two Azure regions within the same geography that are paired together for disaster recovery purposes, typically separated by at least 300 miles. Crawl: examples include East US paired with West US, and North Europe paired with West Europe. The physical distance ensures that a large-scale disaster (earthquake, major storm, power grid failure) is unlikely to affect both regions simultaneously. Walk: region pairs provide several built-in advantages. During planned Azure maintenance, Microsoft updates paired regions sequentially — never both at the same time — so at least one region in each pair remains fully operational. Some services like geo-redundant storage (GRS) automatically replicate data to the paired region. If an outage affects an entire region, Microsoft prioritizes recovering one region from each pair first. Run: you do not choose or create region pairs — Microsoft defines them based on geography and infrastructure independence. The pairing is always within the same Azure geography (a set of regions that share the same data residency and compliance boundary). This means data replicated to a paired region stays within the same compliance boundary — critical for organizations subject to GDPR, HIPAA, or sovereign data requirements. For AZ-900, understand that region pairs are the outermost layer of Azure resilience: Availability Zones handle datacenter failures, region pairs handle region-wide failures, and together they form the foundation of Azure business continuity planning.'
                },
                {
                    question: 'What is a resource group in Azure?',
                    options: [
                        'A type of virtual machine scale set',
                        'A pricing tier that determines resource performance',
                        'A network security boundary that isolates resources from the internet',
                        'A logical container that holds related Azure resources for management, access control, and lifecycle purposes'
                    ],
                    explanation: 'A resource group is a logical container in Azure that holds related resources so they can be managed, secured, and tracked as a unit. Crawl: every Azure resource — VMs, storage accounts, databases, virtual networks — must belong to exactly one resource group. The resource group itself is created in a specific region, but the resources inside can be in any region. The group\'s region only determines where its metadata is stored. Walk: resource groups serve three primary purposes. Organization: group resources that share the same lifecycle (deploy together, delete together). Access control: RBAC roles assigned at the resource group level apply to everything inside. Cost tracking: Azure Cost Management can report spending per resource group, making it easy to see what each application or environment costs. Run: the most important behavior to understand is cascading deletion. When you delete a resource group, every resource inside is permanently deleted — there is no undo, no recycle bin. This is powerful for cleanup (delete a dev environment with one command) but dangerous if resources are grouped incorrectly. Best practice is to group by lifecycle: a web application\'s App Service, database, and storage account in one RG; shared networking in a separate RG. This way, tearing down the application does not destroy the network infrastructure. For AZ-900, remember that resource groups are a management boundary — they do not provide network isolation, do not affect performance, and do not determine pricing. They are purely organizational.'
                },
                {
                    question: 'Every Azure resource must belong to exactly one ___?',
                    options: [
                        'Resource group',
                        'Availability zone',
                        'Virtual network',
                        'Management group'
                    ],
                    explanation: 'Every Azure resource must belong to exactly one resource group — no exceptions, no sharing, no orphans. Crawl: when you create any Azure resource, you must specify which resource group it belongs to. A resource cannot exist outside a resource group, and it cannot belong to more than one resource group at the same time. Walk: this is a hard constraint, not a recommendation. The Azure Resource Manager (ARM) layer enforces it — there is no API call to create a resource without specifying a resource group. Resources can be moved between resource groups using az resource move, but even during the move, the resource always belongs to exactly one group. The resource group itself belongs to a subscription, and the subscription belongs to a management group — creating a clear organizational hierarchy. Run: this constraint enables several powerful management capabilities. Because every resource has exactly one resource group, RBAC applied at the group level is unambiguous — there is no question of which permissions apply. Resource locks at the group level protect everything inside. Policy assignments at the group level audit and enforce compliance for all member resources. Cost rollup at the group level captures all spending. If resources could belong to multiple groups, these features would become ambiguous or impossible. For AZ-900, the fact that resource group membership is mandatory and exclusive is a frequently tested concept — know that availability zones, virtual networks, and management groups do not have this same mandatory one-to-one relationship with every resource.'
                },
                {
                    question: 'What is an Azure subscription?',
                    options: [
                        'A type of Azure resource that provides compute capacity',
                        'A monitoring service that tracks resource health',
                        'A billing and access control boundary that groups Azure resources for cost management and governance',
                        'A backup and recovery solution for Azure workloads'
                    ],
                    explanation: 'An Azure subscription is a billing and access control boundary — it determines what you pay for and who can manage the resources within it. Crawl: a subscription is tied to an Azure account and acts as a container for resource groups and their resources. Every resource group belongs to exactly one subscription, and every subscription generates its own invoice. Walk: organizations often use multiple subscriptions to separate concerns. Common patterns include one subscription per environment (dev, staging, production), one per department (IT, Finance, Marketing), or one per project. Each subscription has its own set of RBAC role assignments, resource quotas, and spending limits — providing hard boundaries between different workloads or teams. Run: subscriptions also have built-in limits (quotas) that cannot be exceeded without requesting an increase from Microsoft. For example, a single subscription has a default limit of 250 storage accounts per region, 25,000 VMs per region, and 980 resource groups. These limits exist to protect the Azure fabric from runaway deployments. Using multiple subscriptions avoids hitting these limits for large organizations. For AZ-900, understand the hierarchy: management groups contain subscriptions, subscriptions contain resource groups, and resource groups contain resources. The subscription is the billing boundary — you receive one bill per subscription — and it is also the primary scope for Azure Policy and RBAC assignments that need to cover an entire environment.'
                },
                {
                    question: 'What are management groups in Azure?',
                    options: [
                        'Dashboards for monitoring resource health across Azure',
                        'Containers for organizing subscriptions into a hierarchy for governance and policy inheritance',
                        'Tools for automating resource deployment using templates',
                        'Database replication groups for high availability'
                    ],
                    explanation: 'Management groups are containers that sit above subscriptions in the Azure hierarchy, allowing you to organize subscriptions into a tree structure for centralized governance. Crawl: if your organization has dozens of Azure subscriptions, managing policies and access controls one subscription at a time is impractical. Management groups let you nest subscriptions under logical groupings and apply RBAC roles and Azure Policies at the group level — everything underneath inherits those settings. Walk: the hierarchy works like a folder structure. The root management group sits at the top. Under it, you might have management groups for each business unit (IT, Finance, Research). Under each business unit, you have management groups for environments (Production, Development). Subscriptions sit at the leaf level. An Azure Policy applied to the IT Production management group automatically applies to every subscription, resource group, and resource underneath. Run: management groups support up to six levels of depth (not counting the root group). Conditions applied at a higher level cannot be overridden at a lower level — this is inheritance by design. If the root management group enforces a policy requiring all resources to be in US regions, no subscription underneath can deploy to European regions regardless of its own policies. This makes management groups the primary tool for enterprise governance at scale. For AZ-900, remember the complete organizational hierarchy: management groups at the top, then subscriptions, then resource groups, then individual resources. Each level provides a scope for RBAC, policies, and cost management, and settings cascade downward through the hierarchy.'
                },
                {
                    question: 'Which is an example of Infrastructure as a Service (IaaS) in Azure?',
                    options: [
                        'Azure Functions',
                        'Azure App Service',
                        'Microsoft Entra ID',
                        'Azure Virtual Machines'
                    ],
                    explanation: 'Azure Virtual Machines is the textbook example of IaaS — you get virtualized hardware and you manage everything from the operating system up. Crawl: with a VM, Azure provides and manages the physical hardware, hypervisor, and network fabric. You are responsible for the operating system, patches, middleware, runtime, and applications. You choose the OS image, configure the VM size, and manage it as if it were a physical server — except you never touch the hardware. Walk: this contrasts with PaaS (like Azure App Service), where Azure also manages the OS and runtime — you only deploy your code. And with SaaS (like Microsoft 365), the vendor manages everything. The IaaS model gives you maximum control but maximum responsibility. If you do not patch the OS, you are vulnerable. If you do not configure the firewall, you are exposed. Azure does not do it for you. Run: Azure Virtual Machines includes more than just compute. When you create a VM, you also get or configure: a virtual NIC (network interface), a public or private IP address, an OS disk (managed disk), optional data disks, a network security group (NSG) for firewall rules, and placement in a virtual network subnet. Each of these is a separate Azure resource in your resource group. For AZ-900, the shared responsibility model is central: IaaS shifts OS and application management to you; PaaS shifts OS management to Azure; SaaS shifts nearly everything to the vendor. Azure VMs, Azure Disk Storage, and Azure Virtual Networks are all IaaS components because they expose infrastructure-level control to the customer.'
                },
                {
                    question: 'What is Azure App Service?',
                    options: [
                        'A fully managed platform (PaaS) for hosting web apps, REST APIs, and mobile backends without managing infrastructure',
                        'A virtual machine image marketplace for Linux and Windows servers',
                        'A container orchestration platform similar to Kubernetes',
                        'A DNS hosting service for custom domain names'
                    ],
                    explanation: 'Azure App Service is a fully managed Platform as a Service (PaaS) that lets you build, deploy, and scale web applications without managing the underlying servers or operating system. Crawl: you deploy your code (in .NET, Java, Node.js, Python, PHP, or Ruby) or a container image, and App Service handles the infrastructure — OS patching, load balancing, scaling, and availability. You never SSH into a server or install runtime updates. Walk: App Service runs on App Service Plans, which define the compute resources (CPU, memory, features) available to your apps. Multiple apps can share a single App Service Plan to optimize costs. Plans come in tiers: Free and Shared for development, Basic for small production loads, Standard and Premium for production with auto-scaling and deployment slots, and Isolated for apps that need VNet integration and dedicated hardware. Run: key features that make App Service powerful include: deployment slots (deploy to a staging slot, test it, then swap it into production with zero downtime), built-in autoscaling (scale out to multiple instances based on CPU usage, memory, or HTTP queue length), continuous deployment from GitHub or Azure DevOps, managed SSL certificates, custom domains, and authentication integration with Microsoft Entra ID and social providers. For AZ-900, App Service is the primary PaaS example — know that it eliminates infrastructure management, supports multiple languages, and is billed based on the App Service Plan tier, not per-request like serverless.'
                },
                {
                    question: 'What is Azure Functions?',
                    options: [
                        'A managed relational database service for SQL workloads',
                        'A virtual desktop infrastructure solution for remote workers',
                        'A serverless compute service that runs code on demand without managing infrastructure, billed only for execution time',
                        'A content delivery network for caching static web content globally'
                    ],
                    explanation: 'Azure Functions is a serverless compute service that executes small pieces of code (functions) in response to events, without requiring you to provision or manage any servers. Crawl: you write a function — a single-purpose block of code — and configure a trigger (HTTP request, timer, message queue, database change). When the trigger fires, Azure spins up the compute, runs your function, and tears it down. You pay only for the execution time and resources consumed, not for idle capacity. Walk: the serverless model means Azure handles all infrastructure decisions: how many instances to run, when to scale up or down, OS patching, and availability. Your function could run zero times in an hour (costing nothing) or thousands of times per second (Azure scales automatically). This is fundamentally different from VMs (always running, always billing) and App Service (billed for the plan even if no requests come in). Run: Azure Functions supports multiple languages (C#, JavaScript, Python, Java, PowerShell, TypeScript) and integrates with dozens of Azure services through bindings — input bindings pull data in (from Cosmos DB, Blob Storage, Service Bus), output bindings push data out. Triggers include HTTP, timer (cron schedule), Blob Storage events, Queue messages, Event Grid events, and Cosmos DB change feed. For AZ-900, understand that Functions represents the serverless end of the compute spectrum: VMs give full control (IaaS), App Service removes infrastructure management (PaaS), and Functions removes even the concept of a server (serverless). Functions is ideal for event-driven, short-duration workloads where you want zero idle cost.'
                },
                {
                    question: 'What is a Virtual Network (VNet) in Azure?',
                    options: [
                        'A public-facing load balancer that distributes internet traffic across VMs',
                        'The fundamental building block for private networking in Azure, enabling resources to communicate securely',
                        'A firewall appliance that filters traffic between on-premises and cloud networks',
                        'A DNS resolution service that translates domain names to IP addresses'
                    ],
                    explanation: 'An Azure Virtual Network (VNet) is the fundamental building block for your private network in Azure — it enables Azure resources to securely communicate with each other, the internet, and on-premises networks. Crawl: a VNet is an isolated network segment in Azure that you define with an address space (e.g., 10.0.0.0/16). Resources like VMs and App Services deployed into a VNet get private IP addresses from that address space and can communicate with each other by default. Traffic stays within Azure\'s network and does not traverse the public internet. Walk: VNets are divided into subnets, each with its own address range carved from the VNet\'s address space. Subnets let you segment resources — web servers in one subnet, databases in another — and apply Network Security Groups (NSGs) to control traffic flow between them. VNets are scoped to a single region but can be connected to other VNets through VNet peering (same or different regions) or VPN gateways. Run: key networking concepts tied to VNets include: Network Security Groups (NSGs) for stateful packet filtering with allow/deny rules based on source, destination, port, and protocol; Azure Firewall for centralized network security with threat intelligence; VPN Gateway for encrypted connections to on-premises networks; ExpressRoute for dedicated private connections that bypass the public internet entirely; and Azure DNS for name resolution within and across VNets. For AZ-900, VNets are the networking foundation — they provide isolation (resources in different VNets cannot communicate unless explicitly connected), segmentation (subnets with NSGs), and connectivity options (peering, VPN, ExpressRoute) that mirror on-premises network architecture in the cloud.'
                },
                {
                    question: 'Which Azure storage service stores unstructured data like images, videos, and documents?',
                    options: [
                        'Azure Table Storage for NoSQL key-value data',
                        'Azure Queue Storage for asynchronous messaging',
                        'Azure Files for managed SMB file shares',
                        'Azure Blob Storage for massive amounts of unstructured data'
                    ],
                    explanation: 'Azure Blob Storage is designed for storing massive amounts of unstructured data — files that do not conform to a fixed schema, such as images, videos, documents, backups, and logs. Crawl: "Blob" stands for Binary Large Object. You create a storage account, create containers within it (similar to folders), and upload blobs (files) into those containers. There is no database schema, no table structure — just raw data identified by a name within a container. Walk: Blob Storage offers three access tiers that optimize cost based on how frequently data is accessed. Hot tier for data accessed frequently (lowest access cost, highest storage cost). Cool tier for data accessed infrequently and stored for at least 30 days. Archive tier for data rarely accessed and stored for at least 180 days (lowest storage cost, highest access cost with hours-long retrieval time). You can set tier policies to automatically move aging data from hot to cool to archive. Run: Blob Storage supports three blob types: Block blobs for general-purpose storage (up to 190.7 TB per blob, optimized for sequential read/write), Append blobs for append-only workloads like logging, and Page blobs for random read/write operations like virtual hard disks. Azure VMs actually store their managed disks as page blobs under the hood. For AZ-900, know the four Azure Storage services in a storage account: Blob (unstructured data), Files (managed SMB/NFS shares), Queue (message queuing), and Table (NoSQL key-value store). Blob Storage is the most commonly tested because it underpins so many Azure services and is the go-to answer for any question about storing unstructured or binary data.'
                },
                {
                    question: 'What is Microsoft Entra ID?',
                    options: [
                        'A cloud-based identity and access management service that provides authentication, SSO, and access control for Azure and thousands of other applications',
                        'A virtual private network service for connecting on-premises networks to Azure',
                        'A relational database management system hosted in Azure',
                        'A content delivery network for accelerating web application performance'
                    ],
                    explanation: 'Microsoft Entra ID is a cloud-based identity and access management (IAM) service that provides authentication, single sign-on, multifactor authentication, and conditional access for Azure resources and thousands of SaaS applications. Crawl: when you sign in to the Azure portal, Microsoft 365, or any application integrated with Entra ID, the service verifies your identity and determines what you are allowed to access. It is the identity backbone for Microsoft cloud services and can also protect your own applications. Every Azure subscription is associated with an Entra ID tenant. Walk: Entra ID differs from traditional on-premises Active Directory Domain Services (AD DS). AD DS uses Kerberos and LDAP for authentication within a corporate network; Entra ID uses modern protocols like OAuth 2.0, OpenID Connect, and SAML for cloud-based authentication. AD DS manages domain-joined Windows machines; Entra ID manages cloud identities and access to web-based applications. They can work together through Microsoft Entra Connect, which synchronizes on-premises AD identities to Entra ID for a hybrid identity experience. Run: key Entra ID features include: multifactor authentication (MFA) requiring a second verification factor beyond passwords, conditional access policies that evaluate sign-in risk and enforce requirements based on location, device state, or application sensitivity, Privileged Identity Management (PIM) for just-in-time elevated access, and application registration for integrating custom applications with Entra ID authentication. For AZ-900, understand that Entra ID is the identity layer for all of Azure — RBAC role assignments, resource access, and administrative permissions all flow through Entra ID. It is not a domain controller replacement but a cloud-native identity platform designed for modern authentication scenarios.'
                },
                {
                    question: 'What is Azure Cosmos DB?',
                    options: [
                        'A managed file storage service for enterprise workloads',
                        'A virtual machine scale set for batch processing',
                        'A serverless compute platform for event-driven applications',
                        'A globally distributed, multi-model database service with guaranteed single-digit millisecond latency at any scale'
                    ],
                    explanation: 'Azure Cosmos DB is a globally distributed, multi-model database service designed for mission-critical applications that need single-digit millisecond response times at any scale, anywhere in the world. Crawl: Cosmos DB automatically replicates your data across multiple Azure regions. When a user in Tokyo reads data, they hit the nearest replica — the response comes in under 10 milliseconds regardless of where the data was originally written. You configure which regions to replicate to, and Cosmos DB handles the synchronization. Walk: the "multi-model" aspect means Cosmos DB supports multiple data models and APIs. You can use it as a document database (Core SQL API and MongoDB API), a key-value store (Table API), a graph database (Gremlin API), or a wide-column store (Cassandra API). Your data is stored in the same underlying engine, but you interact with it using the API that matches your application\'s data model. This flexibility means you do not need separate databases for different data patterns. Run: Cosmos DB offers five well-defined consistency levels — from strong consistency (reads always return the most recent write) to eventual consistency (reads may lag behind writes but offer the lowest latency and highest throughput). The three intermediate levels (bounded staleness, session, consistent prefix) let you fine-tune the trade-off between consistency and performance for your specific use case. For AZ-900, Cosmos DB is the answer whenever a question involves globally distributed data, guaranteed low latency, multi-model database access, or five consistency levels. It represents the premium end of Azure database services — more expensive than Azure SQL Database but designed for scenarios where global reach and performance guarantees are non-negotiable.'
                },
                {
                    question: 'What happens when you delete a resource group in Azure?',
                    options: [
                        'Only the resource group metadata is removed and the resources continue running independently',
                        'Resources inside are automatically moved to a default resource group in the same subscription',
                        'All resources inside the resource group are also permanently deleted in a cascading operation',
                        'The resource group is placed in a soft-delete state and can be recovered within 30 days'
                    ],
                    explanation: 'Deleting a resource group is a cascading, permanent operation — every resource inside the group is deleted along with the group itself, with no undo and no recycle bin. Crawl: when you run az group delete --name MyRG, Azure does not just remove the group label — it systematically deletes every VM, storage account, database, network, and any other resource contained within that group. The operation is irreversible. There is no soft-delete, no recovery period, no default group where orphaned resources land. Walk: this behavior is intentional and by design. Resource groups model lifecycle — resources that are created together, managed together, and should be deleted together belong in the same group. A developer spins up a complete test environment in one resource group, tests their feature, and deletes the group to clean up everything in a single action. The cascading delete makes cleanup efficient and complete, leaving no orphaned resources that continue billing. Run: because of the destructive power of resource group deletion, Azure provides resource locks as a safeguard. A CanNotDelete lock on a resource group prevents anyone from deleting it, regardless of their RBAC permissions — even Owner role cannot bypass a delete lock without first removing the lock. Best practices before deleting a production resource group include: listing all resources inside with az resource list --resource-group <name>, checking for resource locks with az lock list, verifying no shared resources (like a VNet used by other groups) are inside, and exporting a template with az group export as a recovery blueprint. For AZ-900, this is one of the most frequently tested concepts — the cascading delete behavior and the use of resource locks to prevent accidental deletion are core knowledge.'
                }
            ]
        });
        quiz.start();
    </script>
