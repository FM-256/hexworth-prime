    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: Azure Management and Governance',
            description: 'Test your understanding of cost management, governance, monitoring, and infrastructure as code in Azure',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az900-ch03-quiz',
            moduleId: 'az900-ch03-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What tool helps you estimate the cost of Azure services before deploying?',
                    options: [
                        'Azure Pricing Calculator',
                        'Azure Cost Management',
                        'Azure Advisor',
                        'Azure Monitor'
                    ],
                    explanation: 'The Azure Pricing Calculator lets you model costs before you commit a single dollar to Azure resources. Crawl: the Pricing Calculator is a free web tool at azure.microsoft.com/pricing/calculator where you select services, configure their settings (region, tier, expected usage), and get a monthly cost estimate. You are not deploying anything \u2014 you are building a what-if scenario. Walk: the calculator supports every Azure service and lets you build complex estimates with multiple resources. You can save and share estimates with your team, compare different configurations side by side, and export the results to a spreadsheet. This is different from Azure Cost Management, which tracks actual spending on resources that are already deployed. The Pricing Calculator is a planning tool; Cost Management is an operational tool. Run: in practice, you use the Pricing Calculator during the architecture phase \u2014 before writing a single line of infrastructure code. For example, if you are deciding between a Standard and Premium tier for a database, you model both configurations and compare the projected monthly cost. The calculator also accounts for pricing models like reserved instances and savings plans, so you can see how a one-year or three-year commitment would reduce costs compared to pay-as-you-go. For the AZ-900 exam, remember the distinction: Pricing Calculator estimates future costs, TCO Calculator compares on-premises to cloud costs, and Cost Management monitors actual spending.'
                },
                {
                    question: 'What does the TCO Calculator help you determine?',
                    options: [
                        'The real-time cost of running Azure resources',
                        'The cost comparison between running workloads on-premises versus in Azure',
                        'The bandwidth consumption of your virtual networks',
                        'The number of users accessing your Azure portal'
                    ],
                    explanation: 'The Total Cost of Ownership (TCO) Calculator helps organizations build a business case for migrating to Azure by comparing on-premises costs against equivalent Azure costs. Crawl: you enter details about your current on-premises infrastructure \u2014 number of servers, databases, storage capacity, network bandwidth \u2014 and the TCO Calculator estimates what those same workloads would cost in Azure over a one-to-five-year period. Walk: the TCO Calculator goes beyond just compute and storage pricing. It factors in hidden on-premises costs that organizations often underestimate: electricity and cooling for the data center, physical security, IT labor for hardware maintenance and patching, software licensing (OS, hypervisor, database), network equipment, and the cost of downtime. These are real expenses that disappear or shrink when you move to cloud because Microsoft absorbs them into the service price. Run: the TCO Calculator is a strategic tool, not a tactical one. You use it when building a migration proposal for leadership \u2014 showing that the three-year total cost of running 50 servers on-premises is $2.1M while the equivalent Azure deployment is $1.4M. The output is a detailed report with charts and breakdowns suitable for executive presentations. For the AZ-900 exam, the key distinction is: the TCO Calculator compares on-premises vs. cloud (a migration decision tool), while the Pricing Calculator estimates the cost of specific Azure services (a configuration planning tool). They serve different audiences and different stages of the cloud adoption journey.'
                },
                {
                    question: 'What is Azure Cost Management?',
                    options: [
                        'A service for provisioning virtual machines at lower cost',
                        'A billing alert system that only sends emails',
                        'A tool for monitoring, allocating, and optimizing cloud spending across Azure resources',
                        'A discount program for enterprise customers'
                    ],
                    explanation: 'Azure Cost Management is the operational control center for cloud spending \u2014 it gives you visibility into where your money is going and tools to control it. Crawl: Cost Management is a built-in Azure service (no extra charge) that shows your current and historical spending broken down by resource, resource group, subscription, tag, or service. You can set budgets with threshold alerts so you get notified before spending exceeds your plan. Walk: the core capabilities are cost analysis (interactive charts and tables showing spending trends), budgets (spending limits with configurable alert thresholds at 50%, 75%, 90%, 100%), and recommendations (integration with Azure Advisor to surface cost-saving opportunities like right-sizing underutilized VMs or purchasing reserved instances). Cost Management also supports exports \u2014 scheduling daily or monthly cost data exports to a storage account for integration with external reporting tools. Run: in a real organization, Cost Management is how finance teams and cloud administrators collaborate. Tags are the bridge: the engineering team tags every resource with CostCenter, Project, and Environment; the finance team uses Cost Management to filter and aggregate by those tags to generate chargeback reports. Budget alerts can trigger automation \u2014 for example, an alert at 90% budget could trigger an Azure Function that scales down non-production resources or sends a Slack notification. For AZ-900, remember that Cost Management is about actual deployed costs (not estimates), and it works across Azure and AWS (multi-cloud cost management is supported).'
                },
                {
                    question: 'What are Azure resource tags used for?',
                    options: [
                        'Restricting network access to resources',
                        'Encrypting data stored in Azure resources',
                        'Automatically scaling resources based on demand',
                        'Organizing resources with key-value metadata for cost tracking and governance'
                    ],
                    explanation: 'Tags are key-value metadata pairs that you attach to Azure resources to categorize, track, and govern them across your entire cloud environment. Crawl: a tag is a label like Environment:Production or CostCenter:Marketing that you apply to any Azure resource. Tags do not affect how the resource works \u2014 they are purely organizational metadata. You can apply up to 50 tags per resource. Walk: tags solve three major operational problems. First, cost tracking: tag every resource with a CostCenter or Department tag, then use Azure Cost Management to filter spending by tag and generate chargeback reports showing exactly how much each department spends. Second, organization: in a large environment with hundreds of resources across multiple subscriptions, tags let you filter and group resources by project, team, environment, or compliance requirement \u2014 something resource group membership alone cannot do because a resource belongs to only one group. Third, governance: Azure Policy can enforce tagging rules, such as requiring every resource to have a CostCenter tag before it can be created. Run: tags are not inherited from resource groups by default. If you tag a resource group Environment:Production, the resources inside do not automatically get that tag. You must use Azure Policy with the "Inherit a tag from the resource group" policy definition to enforce inheritance. This is a common exam question. Also important: tags are case-sensitive for values but case-insensitive for names in some contexts, which can cause inconsistencies if teams use Environment vs. environment vs. ENVIRONMENT. Best practice is to enforce a naming standard through policy. Tags are also used in automation \u2014 a script can shut down all VMs tagged AutoShutdown:true at 7 PM to save costs.'
                },
                {
                    question: 'What is Azure Policy?',
                    options: [
                        'A service for creating, assigning, and managing policies that enforce rules and compliance on Azure resources',
                        'A firewall service for blocking unauthorized network traffic',
                        'A tool for managing user passwords and authentication',
                        'A service for backing up Azure resources automatically'
                    ],
                    explanation: 'Azure Policy is the governance engine that lets you define rules your Azure environment must follow and automatically enforces them at scale. Crawl: Azure Policy works by creating policy definitions (rules like "all resources must have a CostCenter tag" or "VMs can only use approved sizes"), assigning them to a scope (management group, subscription, or resource group), and letting Azure enforce them. When someone tries to create a resource that violates a policy, the request is denied. Walk: policies have effects that determine what happens when a violation is detected. The most common effects are: Deny (block the non-compliant action), Audit (allow it but flag it as non-compliant in the compliance dashboard), DeployIfNotExists (automatically deploy a remediation resource, like enabling a diagnostic setting), and Modify (add or change properties on a resource, like appending a required tag). Policy definitions can be grouped into initiatives (also called policy sets) \u2014 for example, a "Security Baseline" initiative might bundle 30 individual policies together for a single assignment. Run: Azure Policy evaluates compliance continuously, not just at deployment time. Existing resources are scanned and marked compliant or non-compliant. This means you can assign a policy today and immediately see which of your existing resources violate it, even though they were created before the policy existed. Remediation tasks can fix non-compliant resources automatically. For AZ-900, understand that Azure Policy enforces organizational standards at the resource level (what can be created and how), while RBAC controls who can perform actions. Policy answers "what is allowed"; RBAC answers "who is allowed."'
                },
                {
                    question: 'What is the difference between CanNotDelete and ReadOnly resource locks?',
                    options: [
                        'There is no difference \u2014 they are aliases for the same lock type',
                        'CanNotDelete prevents deletion but allows modifications; ReadOnly prevents all changes including deletion',
                        'CanNotDelete prevents creation of new resources; ReadOnly allows only read access to the subscription',
                        'CanNotDelete only works on storage accounts; ReadOnly works on all resource types'
                    ],
                    explanation: 'Resource locks are a safety mechanism with two levels of protection: CanNotDelete blocks deletion while still allowing changes, and ReadOnly blocks all modifications including deletion. Crawl: a CanNotDelete lock on a resource means you can still modify its settings, resize it, restart it, and reconfigure it \u2014 but you cannot delete it until the lock is removed. A ReadOnly lock is stricter: you cannot change anything about the resource, and you cannot delete it either. Walk: think of them as escalating protection levels. A production database might have a CanNotDelete lock \u2014 DBAs can still tune performance settings and apply patches, but no one can accidentally delete the database. A compliance archive storage account might have a ReadOnly lock \u2014 no one can modify the contents or configuration, ensuring the data remains exactly as it was for audit purposes. Run: locks apply regardless of RBAC permissions. Even an Owner or Global Admin cannot delete a CanNotDelete-locked resource without first removing the lock. This is intentional \u2014 locks protect against accidents, not malicious insiders (who could remove the lock). Removing a lock requires the Microsoft.Authorization/locks/* permission, which can be restricted to a small group of administrators. Locks are inherited: a lock on a resource group applies to every resource inside. A common AZ-900 gotcha: ReadOnly locks can cause unexpected failures. For example, a ReadOnly lock on a storage account prevents listing its keys (because listing keys is considered a write operation that generates new key metadata), which breaks applications that need storage access. Always test ReadOnly locks in non-production before applying to production resources.'
                },
                {
                    question: 'What is Azure Blueprints?',
                    options: [
                        'A tool for designing virtual network topologies',
                        'A marketplace for purchasing third-party Azure services',
                        'A service for defining repeatable sets of governance tools and standard resources that can be deployed together',
                        'A monitoring dashboard for tracking resource health'
                    ],
                    explanation: 'Azure Blueprints packages governance artifacts \u2014 policies, role assignments, ARM templates, and resource groups \u2014 into a single deployable definition that can be versioned and reused across subscriptions. Crawl: imagine you need every new subscription in your organization to have the same set of policies, the same RBAC roles assigned, the same resource groups created, and a specific network architecture deployed. Instead of configuring each one manually, you define a Blueprint that bundles all of those artifacts together and assign it to subscriptions. Walk: a Blueprint can contain four types of artifacts: policy assignments (enforce governance rules), role assignments (configure RBAC), ARM templates (deploy infrastructure), and resource groups (create organizational containers). When you assign a Blueprint to a subscription, all artifacts are deployed in the correct order. Blueprints are versioned \u2014 you can publish v1.0, assign it to 50 subscriptions, then publish v1.1 with updated policies and choose which subscriptions to upgrade. Run: the key difference between Blueprints and just deploying ARM templates is the relationship tracking. When you deploy an ARM template, Azure creates the resources but does not maintain a connection between the template and the deployed resources. Blueprints maintain that connection \u2014 you can see which Blueprint version is assigned to which subscription, track drift, and update assignments. Blueprints also support locking: artifacts deployed by a Blueprint can be locked so they cannot be modified even by subscription owners, preventing configuration drift. For AZ-900, understand that Blueprints solve the "subscription vending" problem \u2014 how do you provision new subscriptions that are compliant from day one, rather than deploying first and fixing governance later.'
                },
                {
                    question: 'What does ARM stand for and what does it do?',
                    options: [
                        'Azure Runtime Monitor \u2014 tracks application performance in real time',
                        'Automated Resource Migration \u2014 moves resources between subscriptions',
                        'Azure Relay Messaging \u2014 enables hybrid connectivity between on-premises and cloud',
                        'Azure Resource Manager \u2014 the deployment and management service that processes all Azure resource requests'
                    ],
                    explanation: 'Azure Resource Manager (ARM) is the control plane that sits between you and every Azure service \u2014 every request to create, update, delete, or read an Azure resource goes through ARM. Crawl: whether you use the Azure portal, Azure CLI, PowerShell, the REST API, or an SDK, your request is sent to ARM. ARM authenticates your identity, checks your permissions via RBAC, validates the request against any Azure Policies, and then routes it to the appropriate resource provider (like Microsoft.Compute for VMs or Microsoft.Storage for storage accounts). Walk: ARM provides several critical capabilities that work consistently across all Azure services because of this centralized architecture. Tagging, resource locks, RBAC, Azure Policy, and deployment history all live at the ARM layer, which means they work the same way for a VM, a database, a storage account, or any other resource. Before ARM existed (in the classic deployment model), each service had its own management API with different authentication and authorization models. Run: ARM is also the engine behind infrastructure as code in Azure. ARM templates (JSON) and Bicep files are submitted to ARM for processing. ARM reads the template, determines the correct order to create or update resources (resolving dependencies), calls the appropriate resource providers, and tracks the deployment status. ARM deployments are logged in the resource group\'s deployment history, providing an audit trail of every infrastructure change. For AZ-900, the essential concept is that ARM is the single, unified management layer \u2014 it does not matter how you interact with Azure, ARM processes the request. This is why governance features like Policy and RBAC work consistently regardless of whether an administrator uses the portal or a script.'
                },
                {
                    question: 'What is the advantage of using ARM templates for Azure deployments?',
                    options: [
                        'They provide declarative, idempotent infrastructure as code that ensures consistent, repeatable deployments',
                        'They automatically reduce the cost of deployed resources',
                        'They replace the need for Azure subscriptions',
                        'They provide real-time monitoring of deployed resources'
                    ],
                    explanation: 'ARM templates deliver infrastructure as code with two powerful properties: declarative syntax (you describe what you want, not how to build it) and idempotency (deploying the same template twice produces the same result without duplicates or errors). Crawl: an ARM template is a JSON file that defines the resources you want in Azure. You submit it to ARM, and ARM creates or updates resources to match the template. If you run it again, ARM compares the template against the current state and only makes changes if something is different. Walk: declarative means you write "I want a storage account named mystorage with LRS redundancy in East US" \u2014 you do not write the sequence of API calls to check if it exists, create it if it does not, handle errors, and retry. ARM handles all of that. Idempotent means you can safely re-run the same template without creating duplicate resources or causing errors. This combination makes templates safe for CI/CD pipelines where deployments run automatically on every code merge. Run: ARM templates also provide consistency (every deployment from the same template produces identical infrastructure), version control (templates stored in git give you full change history with author, timestamp, and diff), validation (az deployment group validate checks for errors before deploying), and what-if analysis (az deployment group what-if shows exactly what will change without actually changing anything). For AZ-900, understand that IaC is the foundation of cloud governance at scale. Manual deployments through the portal do not provide audit trails, are not repeatable, and drift over time as administrators make ad-hoc changes. Templates eliminate these problems by making infrastructure a versioned, reviewable, testable artifact \u2014 just like application code.'
                },
                {
                    question: 'What is Azure Monitor?',
                    options: [
                        'A tool for creating Azure subscriptions',
                        'A comprehensive monitoring solution for collecting, analyzing, and acting on telemetry from Azure and on-premises environments',
                        'A security scanner that checks for vulnerabilities in your code',
                        'A backup service for Azure virtual machines'
                    ],
                    explanation: 'Azure Monitor is the unified observability platform that collects telemetry data from every layer of your Azure environment and gives you tools to analyze, visualize, and respond to it. Crawl: Azure Monitor collects two fundamental types of data: metrics (numeric time-series data like CPU percentage, memory usage, request count) and logs (structured event records stored in Log Analytics workspaces). Every Azure resource automatically emits basic metrics to Azure Monitor at no extra cost. Walk: the platform has several integrated components. Metrics Explorer lets you chart and analyze metric data in real time. Log Analytics uses the Kusto Query Language (KQL) to query log data for deep analysis. Alerts trigger notifications or automated actions when metrics cross thresholds or log queries find specific patterns. Application Insights monitors web application performance (response times, failure rates, dependency tracking). Run: Azure Monitor also supports action groups \u2014 reusable sets of notification and automation actions that fire when an alert triggers. An action group might send an email to the ops team, post to a Teams channel, and trigger an Azure Function that scales up resources. Diagnostic settings control which resource logs and metrics are sent to which destinations (Log Analytics workspace, storage account, Event Hub). For AZ-900, the key concept is that Azure Monitor is the umbrella \u2014 it is not a single tool but a platform that includes Metrics, Logs, Alerts, Application Insights, and more. It provides the data foundation that Azure Service Health and Azure Advisor build upon. Understanding that Monitor collects and Alert acts is the essential pattern.'
                },
                {
                    question: 'What is Azure Service Health?',
                    options: [
                        'A tool for managing the health insurance benefits of Azure employees',
                        'A general status page that shows global Azure outages only',
                        'A personalized view of the health of the specific Azure services and regions your resources use',
                        'A performance optimization tool that automatically fixes slow resources'
                    ],
                    explanation: 'Azure Service Health gives you a personalized dashboard showing the health status of the Azure services and regions that matter to you \u2014 not every Azure service globally, just the ones your resources depend on. Crawl: Service Health tracks three types of events: service issues (outages affecting Azure services you use right now), planned maintenance (upcoming maintenance windows that might affect your resources), and health advisories (changes or deprecations in Azure services you should know about). Walk: the personalization is what makes Service Health different from the generic Azure Status page (status.azure.com). The status page shows every Azure service in every region. Service Health filters to only the services and regions where you have deployed resources. If there is an outage in Southeast Asia but all your resources are in East US, Service Health does not alert you \u2014 the status page would show it as a global incident. You can configure alerts to get notified via email, SMS, webhook, or push notification when events affect your specific resources. Run: Service Health also provides Root Cause Analysis (RCA) documents after incidents resolve, explaining what happened, why, and what Microsoft is doing to prevent recurrence. These RCA reports are valuable for compliance and for communicating with your own stakeholders about outages. Health advisories include feature retirements and breaking changes \u2014 for example, if a VM size you use is being deprecated or a TLS version is being retired. For AZ-900, remember the hierarchy: Azure Status page (public, global, everyone sees the same thing) vs. Azure Service Health (personalized, filtered to your resources, supports alerts) vs. Azure Resource Health (individual resource level \u2014 is this specific VM healthy right now).'
                },
                {
                    question: 'What does Azure Advisor provide?',
                    options: [
                        'A managed database service for SQL workloads',
                        'Automated deployment pipelines for Azure DevOps',
                        'A virtual assistant for writing Azure CLI commands',
                        'Personalized recommendations for improving reliability, security, performance, cost, and operational excellence'
                    ],
                    explanation: 'Azure Advisor is your personalized cloud consultant \u2014 it continuously analyzes your Azure resource configuration and usage patterns and provides actionable recommendations across five pillars. Crawl: Advisor scans your deployed resources and compares them against Microsoft best practices. It then generates recommendations in five categories: Reliability (formerly High Availability), Security, Performance, Cost, and Operational Excellence. Each recommendation includes what to fix, why it matters, and how to fix it. Walk: cost recommendations might tell you that a VM has averaged 5% CPU over the past 14 days and suggest downsizing to a smaller SKU to save $150/month. Reliability recommendations might flag that your production SQL database does not have geo-replication enabled. Security recommendations integrate with Microsoft Defender for Cloud to surface vulnerabilities. Performance recommendations might suggest adding an index to a database query that is running slowly. Run: Advisor recommendations are free and always available in the portal. You can configure alerts to get notified when new recommendations appear. Recommendations include an estimated impact (cost savings amount, reliability improvement) and a quick-fix button for many common actions. Advisor also integrates with Azure Policy \u2014 you can create policies that require resources to follow Advisor recommendations. For AZ-900, the key distinction is: Azure Monitor collects data (the raw telemetry), Azure Service Health tells you about platform issues (Microsoft\'s infrastructure), and Azure Advisor tells you about your configuration issues (your infrastructure decisions). Advisor is proactive and prescriptive \u2014 it does not wait for something to break before recommending improvements.'
                },
                {
                    question: 'What is Azure Arc?',
                    options: [
                        'A service that extends Azure management and governance to on-premises, multi-cloud, and edge environments',
                        'A content delivery network for distributing media files globally',
                        'A tool for archiving old Azure resources to reduce costs',
                        'A virtual network gateway for connecting Azure regions'
                    ],
                    explanation: 'Azure Arc projects non-Azure resources \u2014 on-premises servers, VMs in other clouds, Kubernetes clusters, databases \u2014 into Azure so you can manage them with the same Azure tools and governance you use for native Azure resources. Crawl: organizations rarely run everything in a single cloud. Azure Arc lets you register servers, Kubernetes clusters, and data services that live outside Azure (on-premises data centers, AWS, GCP, edge locations) as Azure resources. Once registered, they appear in the Azure portal and can be managed with Azure tools. Walk: after you Arc-enable a Windows or Linux server, you can apply Azure Policy to it (enforce configuration standards), use Azure Monitor to collect logs and metrics from it, assign RBAC roles for access control, and track it in your Azure resource inventory. The server does not move \u2014 it stays where it is, but Azure can now see and govern it. This solves the hybrid management problem: instead of using separate tools for on-premises and cloud, you use one set of tools for everything. Run: Azure Arc supports several resource types: Arc-enabled servers (physical or virtual machines anywhere), Arc-enabled Kubernetes (any CNCF-conformant cluster), Arc-enabled SQL Server (SQL instances running anywhere), and Arc-enabled data services (deploy Azure SQL Managed Instance or PostgreSQL on your own infrastructure). For AZ-900, the essential concept is that Azure Arc extends the Azure management boundary. Without Arc, Azure governance tools only work on Azure-native resources. With Arc, those same tools reach into your data center, your other cloud providers, and your edge locations. This is Microsoft\'s answer to the multi-cloud and hybrid reality \u2014 rather than forcing everything into Azure, Arc brings Azure management to wherever your resources already live.'
                },
                {
                    question: 'A company wants to ensure all virtual machines in a subscription use only approved sizes. Which Azure service should they use?',
                    options: [
                        'Azure Monitor with custom alert rules',
                        'Azure Policy with an allowed virtual machine SKU policy',
                        'Azure Advisor performance recommendations',
                        'Azure Resource Manager tags'
                    ],
                    explanation: 'Azure Policy is the correct service because it can proactively enforce rules at deployment time \u2014 preventing non-compliant resources from being created in the first place. Crawl: Azure Policy has a built-in policy definition called "Allowed virtual machine size SKUs" that lets you specify exactly which VM sizes are permitted. Assign this policy to a subscription, and any attempt to create a VM with a size not on the approved list is denied before the VM is created. Walk: this is a preventive control, not a detective one. Azure Monitor can alert you after a wrong-sized VM is created, but by then the damage is done \u2014 the oversized VM is running and accumulating costs. Azure Advisor can recommend right-sizing after the fact, but it cannot prevent the creation. Tags are metadata labels with no enforcement power \u2014 tagging a VM "approved" does not prevent unapproved VMs from being created. Only Azure Policy can block the action at the ARM layer before the resource provider ever receives the request. Run: in practice, you would create a policy assignment at the subscription scope with the "Allowed virtual machine size SKUs" definition, set the effect to Deny, and configure the parameter with your approved list (e.g., Standard_B2s, Standard_D2s_v5, Standard_D4s_v5). Any user in that subscription \u2014 regardless of their RBAC role, even an Owner \u2014 receives an error if they try to create a VM outside the approved list. For AZ-900, this is a classic governance scenario question. The pattern is: if the question asks about enforcing rules or ensuring compliance on resource configurations, the answer is Azure Policy. If it asks about who can do what, the answer is RBAC. If it asks about preventing accidental deletion, the answer is resource locks.'
                },
                {
                    question: 'What is the purpose of a management group in Azure?',
                    options: [
                        'To manage the physical hardware that Azure runs on',
                        'To provide a shared storage account for multiple subscriptions',
                        'To organize subscriptions into a hierarchy for unified policy and access management across the organization',
                        'To monitor the performance of all resources in a subscription'
                    ],
                    explanation: 'Management groups create a hierarchy above subscriptions, letting you apply governance (Azure Policy) and access control (RBAC) to multiple subscriptions at once through inheritance. Crawl: in a large organization, you might have dozens or hundreds of Azure subscriptions. Without management groups, you would need to assign policies and RBAC roles to each subscription individually. Management groups let you organize subscriptions into a tree structure and apply governance at any level \u2014 everything below inherits automatically. Walk: the hierarchy has four levels from top to bottom: tenant root management group (automatic, one per Microsoft Entra ID tenant), management groups (you create these), subscriptions, and resource groups. A policy assigned to a management group applies to every subscription under it, and therefore to every resource group and resource in those subscriptions. For example, a "Corporate" management group might contain "Production" and "Development" child management groups. A strict security policy assigned to Production applies to all production subscriptions without touching development. Run: management groups support up to six levels of depth (not counting the root) and are essential for enterprise-scale Azure architectures. The Azure Landing Zone reference architecture uses management groups to separate platform subscriptions (identity, management, connectivity) from application subscriptions (production, non-production, sandboxes). RBAC inheritance means you can give the security team Reader access at the top-level management group and they automatically have visibility into every subscription in the organization. For AZ-900, the key concept is the organizational hierarchy: management groups contain subscriptions, subscriptions contain resource groups, resource groups contain resources. Governance (policy) and access (RBAC) assigned at any level flow down to everything below. Management groups are the answer whenever a question asks about governing multiple subscriptions simultaneously.'
                }
            ]
        });
        quiz.start();
    </script>
