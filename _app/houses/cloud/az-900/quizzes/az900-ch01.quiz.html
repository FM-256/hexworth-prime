    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Cloud Concepts',
            description: 'Test your understanding of cloud computing fundamentals, service models, deployment models, and cloud economics',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'cloud',
            achievement: 'az900-ch01-quiz',
            moduleId: 'az900-ch01-quiz',
            serverGrading: true,
            houseId: 'cloud',
            trackProgress: true,

            questions: [
                {
                    question: 'What is cloud computing?',
                    options: [
                        'The on-demand delivery of IT services such as compute, storage, and networking over the internet',
                        'Installing software on a local hard drive for personal use',
                        'A type of programming language used to build websites',
                        'A physical data center you purchase and manage entirely on-premises'
                    ],
                    explanation: 'Cloud computing is the delivery of computing services over the internet on a pay-as-you-go basis, eliminating the need to own and maintain physical infrastructure. Crawl: the key words are "on-demand" (you provision resources when needed, not months in advance), "over the internet" (accessed remotely rather than from local hardware), and "pay-as-you-go" (you pay for what you consume, like a utility bill). Instead of buying servers, installing operating systems, and managing hardware yourself, you rent those capabilities from a cloud provider like Microsoft Azure who owns and operates the data centers. Walk: this model fundamentally changes how organizations acquire IT resources. Traditionally, standing up a new application meant weeks or months of procurement, shipping, racking servers, cabling, and configuration before a single user could be served. With cloud computing, you can provision a virtual machine, database, or entire network in minutes through a web portal or command-line tool. The cloud provider handles all physical infrastructure concerns including power, cooling, physical security, and hardware replacement. Run: the National Institute of Standards and Technology (NIST) defines five essential characteristics of cloud computing: on-demand self-service (provision resources without human interaction with the provider), broad network access (available over the network from any device), resource pooling (provider resources are shared across multiple tenants), rapid elasticity (scale up or down quickly), and measured service (pay for what you consume). Understanding this definition is foundational for AZ-900 because every other cloud concept builds on the distinction between owning infrastructure and consuming it as a service.'
                },
                {
                    question: 'Which of the following is NOT a benefit of cloud computing?',
                    options: [
                        'Reduced capital expenditure on physical infrastructure',
                        'Elasticity to automatically scale resources with demand',
                        'Global reach and availability across multiple regions',
                        'Unlimited free storage for all users'
                    ],
                    explanation: 'Cloud computing does not provide unlimited free storage. All cloud resources are metered and billed based on consumption, storage tier, and redundancy level. Crawl: while the cloud offers many compelling benefits like reduced upfront costs, global infrastructure, and automatic scaling, none of these services are free or unlimited. Every gigabyte of storage, every hour of compute time, and every network transfer has an associated cost. Azure Blob Storage, for example, charges per GB stored per month with different rates for hot, cool, and archive tiers, plus additional charges for read/write operations and data egress. Walk: the other three options are legitimate, well-documented cloud benefits. Reduced capital expenditure means you shift from buying expensive hardware upfront to paying monthly for what you use. Global reach means Azure operates in 60+ regions worldwide, letting you deploy resources close to your users for lower latency. Elasticity means resources can automatically scale up during peak demand and scale back down when demand drops, so you are never over-provisioned or under-provisioned. Run: the misconception that cloud is "free" or "unlimited" is one of the most common mistakes organizations make when planning cloud migrations. Effective cloud cost management requires understanding pricing models, setting budgets and alerts in Azure Cost Management, choosing appropriate service tiers, and implementing governance policies that prevent runaway spending. For AZ-900, always evaluate benefit claims critically. If an answer implies something is free, unlimited, or has zero cost, it is almost certainly the wrong answer. Cloud changes how you pay, not whether you pay.'
                },
                {
                    question: 'What does "elasticity" mean in cloud computing?',
                    options: [
                        'The ability to recover data from a disaster in another geographic region',
                        'The ability to automatically scale resources up or down based on real-time demand',
                        'The ability to encrypt data at rest and in transit using managed keys',
                        'The ability to deploy resources in multiple programming languages'
                    ],
                    explanation: 'Elasticity is the ability of a cloud environment to automatically increase or decrease resources in response to changing workload demands, ensuring you use only what you need at any given moment. Crawl: imagine an e-commerce site on Black Friday. Traffic spikes to 10x the normal level. With elasticity, the cloud automatically adds more compute instances to handle the surge. When the sale ends and traffic drops, those extra instances are removed and you stop paying for them. No human intervention is required. Walk: elasticity differs from scalability, though the terms are related. Scalability is the broader ability to handle increased load, either by scaling up (adding more CPU/RAM to an existing machine) or scaling out (adding more machines). Elasticity specifically refers to the automatic and dynamic nature of that scaling, often with no manual intervention. Azure services like Virtual Machine Scale Sets, Azure App Service autoscale, and Azure Functions embody elasticity by adding or removing instances based on metrics like CPU utilization, memory usage, or queue depth. Run: elasticity is one of the core economic arguments for cloud computing. In a traditional on-premises model, you must provision for peak capacity, buying enough servers to handle Black Friday traffic means those servers sit idle the other 364 days of the year. The cloud flips this model: you provision for baseline demand and let elasticity handle the peaks. This eliminates both over-provisioning waste and under-provisioning risk. For AZ-900, understand that elasticity is not just a technical feature but a financial one. It directly enables the shift from CapEx to OpEx by ensuring you never pay for idle resources during low-demand periods.'
                },
                {
                    question: 'In the shared responsibility model, which of the following does the cloud provider ALWAYS manage regardless of service model?',
                    options: [
                        'Application data and user access controls',
                        'Operating system patches and security updates',
                        'Physical hosts, network infrastructure, and the datacenter',
                        'Identity and directory management'
                    ],
                    explanation: 'The cloud provider is always responsible for the physical infrastructure layer: the datacenter building, physical servers, network hardware, power, cooling, and physical security. This is true across all service models (IaaS, PaaS, and SaaS). Crawl: the shared responsibility model divides security and management duties between the cloud provider and the customer. No matter which service model you choose, Microsoft manages the physical hosts (the actual server hardware), the network fabric connecting them, and the datacenter facilities including power, cooling, and physical access controls. You never need to worry about replacing a failed hard drive, patching a network switch, or maintaining backup generators. Walk: what changes across service models is everything above the physical layer. In IaaS, you manage the operating system, middleware, runtime, applications, and data. In PaaS, the provider takes over OS and middleware management, and you manage only your application code and data. In SaaS, the provider manages almost everything, and you manage only your data and user access. The customer is always responsible for their data, accounts, identities, and endpoint devices regardless of model. Run: the shared responsibility model is one of the most heavily tested concepts on AZ-900. The key insight is that responsibility shifts but never disappears. Even in SaaS, the customer retains responsibility for their data, account security, and the devices used to access the service. A common exam trap is suggesting that moving to the cloud eliminates all security responsibility. It does not. The provider secures the infrastructure; you secure what you put on it and who can access it. Understanding which layer you own in each model directly affects your security posture, compliance obligations, and operational planning.'
                },
                {
                    question: 'Which cloud service model gives you the MOST control over the underlying infrastructure?',
                    options: [
                        'Infrastructure as a Service (IaaS)',
                        'Platform as a Service (PaaS)',
                        'Software as a Service (SaaS)',
                        'Function as a Service (FaaS)'
                    ],
                    explanation: 'Infrastructure as a Service (IaaS) provides the most control because you manage everything from the operating system up, while the provider handles only the physical infrastructure beneath it. Crawl: IaaS gives you virtual machines, virtual networks, and raw storage, which is the cloud equivalent of renting rack space in a data center. You choose the operating system, install your own software, configure firewalls, and manage patches. Azure Virtual Machines is the primary IaaS offering. Walk: compare the control spectrum across models. In IaaS, you control the OS, middleware, runtime, application code, and data. In PaaS (like Azure App Service), the provider manages the OS and middleware, so you only control application code and data. In SaaS (like Microsoft 365), you control only data and user settings while everything else is managed for you. More control means more responsibility: IaaS requires you to patch operating systems, configure security baselines, and manage high availability yourself. Run: the trade-off between control and management burden is the central decision framework for choosing a service model. Organizations choose IaaS when they need specific OS configurations, legacy application compatibility, or fine-grained network control that PaaS abstracts away. A company running a custom Linux application with specific kernel modules needs IaaS because PaaS does not expose kernel-level configuration. For AZ-900, remember the spectrum: IaaS equals most control with most responsibility, PaaS offers a balanced middle ground, and SaaS equals least control with least responsibility. The exam frequently presents scenarios asking which model fits a given requirement, and the answer depends on how much control the scenario demands.'
                },
                {
                    question: 'Which of the following is an example of Platform as a Service (PaaS)?',
                    options: [
                        'Azure Virtual Machines',
                        'Azure Virtual Desktop',
                        'Microsoft 365',
                        'Azure App Service'
                    ],
                    explanation: 'Azure App Service is a PaaS offering that provides a fully managed platform for building, deploying, and scaling web applications without managing the underlying server infrastructure or operating system. Crawl: with App Service, you upload your application code (written in .NET, Java, Node.js, Python, or PHP) and Azure handles the web server, operating system, patches, scaling, and load balancing. You never SSH into a server or install a web server yourself. You focus entirely on your code and configuration. Walk: the other options represent different service models. Azure Virtual Machines is IaaS because you get a full virtual machine and manage everything on it, from the OS up. Microsoft 365 is SaaS because it is a fully packaged application you consume with no infrastructure or code management at all. Azure Virtual Desktop provides virtualized desktops and falls under the IaaS/DaaS category. Run: PaaS is the sweet spot for developers who want to focus on writing application code rather than managing servers. Azure App Service provides built-in features that would take significant effort to set up on an IaaS VM: automatic OS patching, SSL certificate management, custom domain binding, deployment slots for zero-downtime releases, built-in authentication providers, and autoscale rules. The trade-off is reduced control. You cannot install arbitrary software on the underlying VM, modify the web server configuration beyond what App Service exposes, or choose a custom OS version. For AZ-900, being able to correctly categorize Azure services into IaaS, PaaS, and SaaS is a core skill. The test for PaaS is: does the service abstract away the operating system and runtime while still letting you deploy custom code?'
                },
                {
                    question: 'Which of the following is an example of Software as a Service (SaaS)?',
                    options: [
                        'Azure Virtual Machines',
                        'Azure SQL Database',
                        'Microsoft 365',
                        'Azure Kubernetes Service'
                    ],
                    explanation: 'Microsoft 365 is a SaaS offering. It is a complete, ready-to-use software application delivered over the internet with no infrastructure management or application development required from the customer. Crawl: with Microsoft 365, you open a browser, sign in, and immediately start using Word, Excel, Outlook, Teams, and SharePoint. Microsoft manages everything: the application code, the servers, the databases, the operating systems, the networking, and the physical data centers. Your only responsibility is your data and your account access. Walk: the other options involve varying degrees of customer management. Azure Virtual Machines is IaaS, where you manage the entire stack above the hypervisor. Azure SQL Database is PaaS, where Microsoft manages the database engine and server but you manage your schemas, queries, and data. Azure Kubernetes Service is PaaS for container orchestration, where Microsoft manages the control plane but you manage your container images and workload configurations. Run: SaaS is the most complete cloud service model. The customer consumes the application as-is, with configuration options but no ability to modify the underlying code or infrastructure. This makes SaaS ideal for common business functions like email, collaboration, CRM, and HR systems where every organization has similar needs. The SaaS provider benefits from economies of scale, maintaining one application for millions of users more efficiently than each organization running its own copy. For AZ-900, the quick test for SaaS is: can a non-technical business user start using this service immediately without writing any code or deploying any infrastructure? If yes, it is SaaS. Microsoft 365, Dynamics 365, and GitHub are all examples of SaaS on the Microsoft platform.'
                },
                {
                    question: 'What is the main advantage of PaaS over IaaS?',
                    options: [
                        'PaaS provides more granular control over the operating system and kernel',
                        'PaaS allows developers to focus on application development without managing the OS or middleware',
                        'PaaS is always less expensive than IaaS for every workload type',
                        'PaaS eliminates the need for any security considerations'
                    ],
                    explanation: 'The primary advantage of PaaS is that it removes the burden of managing operating systems, middleware, and runtime environments, letting development teams concentrate entirely on building and deploying their application code and data. Crawl: with IaaS, a developer who wants to deploy a web application must first provision a VM, install and configure a web server, set up the runtime environment, configure SSL, implement monitoring, and then deploy their code. With PaaS, all of that infrastructure management is handled by the provider. They push code and it runs. Walk: this difference has real-world impact on productivity and cost. OS patching alone is a significant operational burden. Every month, security patches must be tested and applied to every VM, with rollback plans if patches break applications. PaaS eliminates this entire workflow. The provider patches the platform transparently. Similarly, scaling a PaaS application is typically a slider or an autoscale rule, while scaling IaaS requires provisioning new VMs, configuring load balancers, and managing state consistency across instances. Run: the incorrect options reveal common misconceptions. PaaS provides less OS control, not more, because that is the trade-off for reduced management. PaaS is not always cheaper than IaaS. For sustained, predictable workloads, a reserved IaaS VM can be more cost-effective than a PaaS service. PaaS does not eliminate security responsibilities. You still own application security, data protection, identity management, and access control. For AZ-900, the key takeaway is that PaaS accelerates development velocity by abstracting infrastructure management, but this comes at the cost of reduced control over the environment your application runs on.'
                },
                {
                    question: 'What defines a public cloud deployment model?',
                    options: [
                        'Infrastructure owned and operated by a third-party cloud provider, with resources shared across multiple tenants on a pay-as-you-go basis',
                        'Infrastructure owned and operated by a single organization for its exclusive use',
                        'A combination of on-premises and cloud infrastructure linked together',
                        'A cloud environment that can only be accessed by government agencies'
                    ],
                    explanation: 'A public cloud is owned and operated by a third-party cloud provider who makes computing resources available to the general public or multiple organizations over the internet, typically using a consumption-based pricing model with no upfront hardware investment required. Crawl: when you create an Azure subscription and provision resources, you are using the public cloud. Microsoft owns the data centers, the hardware, and the network infrastructure. Your resources run on shared infrastructure alongside other customers, with logical isolation (hypervisors, virtual networks, RBAC) ensuring your data and workloads are separated from theirs. Walk: the key characteristics of the public cloud are: no upfront capital expenditure (you pay monthly for what you consume), no maintenance responsibility (the provider handles all hardware lifecycle management), near-unlimited scale (the provider has vastly more capacity than any single customer needs), and broad geographic availability (Azure has 60+ regions worldwide). The word "public" does not mean your data is publicly accessible. It means the cloud platform itself is available for anyone to purchase and use. Run: public cloud is the default deployment model for most organizations starting their cloud journey because it eliminates the single largest barrier to adoption: capital investment. A startup can launch a globally distributed application on Azure for a few dollars a month, scaling up only when demand justifies the cost. For AZ-900, understand that public cloud is not inherently less secure than private cloud. Azure invests billions annually in security and holds more compliance certifications than most private data centers could achieve. The choice between public, private, and hybrid cloud is driven by regulatory requirements, data sovereignty needs, and existing infrastructure investments, not by a simplistic equation of public equals less secure.'
                },
                {
                    question: 'What is a hybrid cloud?',
                    options: [
                        'A cloud environment that only uses open-source software',
                        'A deployment model that uses only Azure and AWS together',
                        'A cloud environment that runs both Linux and Windows virtual machines',
                        'A combination of public cloud and private cloud or on-premises infrastructure with orchestration between them'
                    ],
                    explanation: 'A hybrid cloud combines public cloud services with private cloud or on-premises infrastructure, connected and orchestrated so that data and applications can move between the two environments based on business requirements. Crawl: a company might keep its sensitive financial database on servers in its own data center (private) while running its customer-facing web application in Azure (public). The two environments are connected through a VPN or Azure ExpressRoute, allowing the web application to securely query the on-premises database. Walk: hybrid cloud is not simply using two different cloud providers (that is multi-cloud). The defining characteristic is the integration between private or on-premises infrastructure and public cloud services, enabling workloads to span both environments. Azure provides specific tools for hybrid scenarios: Azure Arc extends Azure management to on-premises servers, Azure Stack HCI runs Azure services in your own data center, and Azure VPN Gateway and ExpressRoute provide secure connectivity between your network and Azure. Run: organizations choose hybrid cloud for several strategic reasons. Regulatory compliance may require certain data to remain on-premises or in a specific jurisdiction. Legacy applications that cannot be easily migrated may need to stay in the existing data center while new applications are built cloud-native. Latency-sensitive workloads may need to run close to on-premises data sources. Hybrid cloud lets organizations modernize incrementally rather than executing a risky all-at-once migration. For AZ-900, hybrid cloud is one of the three primary deployment models (public, private, hybrid) and is often the correct answer for scenarios involving regulatory constraints, legacy applications, or gradual migration strategies.'
                },
                {
                    question: 'Which cloud deployment model provides the organization with the MOST control over security?',
                    options: [
                        'Public cloud',
                        'Hybrid cloud',
                        'Private cloud',
                        'Community cloud'
                    ],
                    explanation: 'Private cloud provides the most security control because the organization owns or exclusively leases all the infrastructure and manages every layer of the stack, from physical hardware access to application-level security policies. Crawl: in a private cloud, the infrastructure is dedicated to a single organization. It can be hosted in the organization\'s own data center or by a third-party provider on dedicated hardware, but either way, the resources are not shared with other tenants. The organization controls physical access, network configuration, encryption standards, patching schedules, and every security policy from the ground up. Walk: compare security control across deployment models. In a public cloud, the provider manages physical security, hypervisor isolation, and network fabric security, so you trust their implementation but cannot inspect or modify it directly. In a hybrid cloud, you manage security for the private portion but depend on the provider for the public portion, plus you must secure the connection between them. In a private cloud, you manage all of it, which means maximum control but also maximum operational responsibility. Run: more control does not automatically mean better security outcomes. A well-resourced cloud provider like Microsoft employs thousands of security professionals, holds dozens of compliance certifications (FedRAMP, SOC 2, ISO 27001, HIPAA), and operates 24/7 security operations centers, capabilities most private organizations cannot match. The advantage of private cloud security is specificity and exclusivity: you can implement policies tailored exactly to your threat model without multi-tenant compromise, and you have full visibility into every component. For AZ-900, the exam tests whether you understand that private cloud equals most control. Be prepared for nuanced scenario questions where the correct answer acknowledges that control and security quality are not the same thing.'
                },
                {
                    question: 'What is Capital Expenditure (CapEx) in the context of cloud computing?',
                    options: [
                        'Upfront spending on physical infrastructure such as servers, data centers, and networking equipment',
                        'Monthly subscription fees for cloud services billed by consumption',
                        'The cost of hiring cloud engineers and architects',
                        'The fee charged for transferring data out of a cloud region'
                    ],
                    explanation: 'Capital Expenditure (CapEx) refers to the upfront investment in physical assets like servers, storage arrays, networking equipment, data center facilities, and the associated costs of installation and configuration that are depreciated over their useful life. Crawl: when an organization builds its own data center, it must purchase servers, racks, switches, routers, UPS systems, cooling systems, and potentially the building itself. All of this happens before a single application runs. These are CapEx costs because they are large, one-time investments in physical assets that depreciate on the balance sheet over three to five years. Walk: CapEx has significant financial implications beyond the purchase price. The money is spent upfront, reducing available cash for other investments. Capacity must be estimated in advance, so if you buy too little you cannot meet demand, and if you buy too much you waste money on idle hardware. Refresh cycles mean repeating this investment every few years as hardware reaches end-of-life. Technology lock-in is inherent because you use what you bought until the next refresh cycle. Run: the CapEx model was the only option before cloud computing, and it created several business challenges: long procurement cycles (weeks to months from order to operational), large minimum investments (you cannot buy half a server), and utilization inefficiency (average server utilization in traditional data centers is 15-20%). Cloud computing addresses all of these by shifting to an Operational Expenditure (OpEx) model where you pay for services as consumed. For AZ-900, the CapEx versus OpEx distinction is fundamental. It explains the financial motivation behind cloud adoption and appears in multiple question formats, from definitions to scenario-based questions about which spending model fits a given business situation.'
                },
                {
                    question: 'How does cloud computing shift spending from CapEx to OpEx?',
                    options: [
                        'By requiring organizations to make larger upfront hardware purchases for better volume discounts',
                        'By allowing organizations to pay for computing services as they are consumed rather than buying physical infrastructure',
                        'By eliminating all IT costs entirely through free-tier services',
                        'By requiring multi-year contracts with no flexibility to change capacity'
                    ],
                    explanation: 'Cloud computing converts capital expenditure into operational expenditure by replacing upfront hardware purchases with a consumption-based model where you pay monthly for the services and resources you actually use, scaling costs up or down with your workload. Crawl: instead of spending $500,000 on servers that may or may not be fully utilized over their lifespan, you spend a variable amount each month on Azure resources that match your actual workload. If your needs grow, you add resources and pay more. If they shrink, you remove resources and pay less. The financial commitment is ongoing and variable rather than upfront and fixed. Walk: this shift has profound implications for business agility. CapEx requires budget approval, procurement processes, and long-term capacity planning, committing money based on predictions about future demand that may prove inaccurate. OpEx allows incremental spending aligned with actual business outcomes. A startup can begin with $50 per month in cloud resources and scale to $50,000 per month as revenue grows, never investing more than the business can support at that moment. Run: the CapEx-to-OpEx shift also changes accounting treatment. CapEx creates depreciating assets on the balance sheet, reducing taxable income gradually over the asset\'s useful life. OpEx is expensed immediately in the period incurred, directly reducing that period\'s taxable income. For some organizations, the OpEx model provides more predictable financial reporting and better cash flow management. However, OpEx is not always cheaper in total. Sustained, predictable workloads can be more cost-effective with reserved instances, which represent a CapEx-like commitment within the cloud model. For AZ-900, understand that the shift to OpEx is a key cloud benefit, but the answer that says "eliminates all costs" is always wrong. Cloud changes how you pay, not whether you pay.'
                },
                {
                    question: 'What does "high availability" mean in cloud computing?',
                    options: [
                        'Resources are available at no cost during off-peak hours',
                        'Virtual machines are always allocated the maximum amount of CPU and memory',
                        'Data is automatically encrypted at all times using provider-managed keys',
                        'Systems are designed to remain operational and accessible with minimal downtime, often expressed as a percentage uptime SLA'
                    ],
                    explanation: 'High availability (HA) refers to systems architected to remain continuously operational with minimal downtime, typically measured by uptime percentages defined in Service Level Agreements (SLAs) such as 99.9% or 99.99%. Crawl: a highly available system keeps running even when individual components fail. If one server in a cluster crashes, the remaining servers continue serving requests with no user-visible interruption. Azure achieves this through redundant infrastructure: multiple copies of your data, multiple instances of your application, and automatic failover mechanisms that detect failures and reroute traffic. Walk: availability is measured in "nines." 99.9% availability (three nines) allows approximately 8.76 hours of downtime per year. 99.99% (four nines) allows about 52.6 minutes per year. 99.999% (five nines) allows about 5.26 minutes per year. Azure publishes SLAs for each service. A single VM with premium storage has a 99.9% SLA, while a VM deployed across Availability Zones has a 99.99% SLA. The higher the uptime guarantee, the more redundancy you must architect into your deployment. Run: achieving high availability requires deliberate architectural decisions. In Azure, key HA mechanisms include Availability Sets (distribute VMs across fault domains and update domains within a single data center), Availability Zones (distribute across physically separate data centers within a region), and geo-redundant storage (replicate data across region pairs). The important AZ-900 concept is that high availability is not automatic. It must be designed into your architecture. Deploying a single VM in a single zone is not highly available. Deploying the same application across two Availability Zones with a load balancer in front is. The cloud provides the building blocks for HA; the architect must assemble them correctly.'
                },
                {
                    question: 'A company wants to run its legacy applications on-premises but use the cloud for all new development projects. Which deployment model best fits this scenario?',
                    options: [
                        'Public cloud only',
                        'Private cloud only',
                        'Hybrid cloud',
                        'Community cloud'
                    ],
                    explanation: 'Hybrid cloud is the correct deployment model because the scenario requires maintaining on-premises infrastructure for existing legacy workloads while leveraging public cloud for new development, which is the defining characteristic of a hybrid approach that bridges both environments. Crawl: the company has two distinct needs: keep legacy applications running where they are (on-premises) and build new projects in the cloud. Hybrid cloud connects these two environments so they can work together, sharing data and services across the boundary through secure network connections like VPN or Azure ExpressRoute. Walk: public cloud only would require migrating the legacy applications to Azure, which the company is not ready or willing to do. Private cloud only would mean building cloud-like infrastructure in their own data center for new projects, losing the benefits of public cloud scale, elasticity, and managed services. Community cloud is a shared infrastructure for organizations with common concerns (like government agencies) and does not fit this scenario at all. Hybrid cloud lets the company keep what works, modernize where it makes sense, and connect the two worlds seamlessly. Run: this is one of the most common real-world cloud adoption patterns, sometimes called "cloud-first for new, lift-and-shift later for legacy." Azure supports this with specific hybrid technologies: Azure ExpressRoute or VPN Gateway creates secure, high-bandwidth connections between on-premises networks and Azure virtual networks. Azure Arc extends Azure management capabilities (policy, monitoring, RBAC) to on-premises and multi-cloud servers. Azure Migrate provides assessment and migration tools to eventually move legacy workloads to Azure when the organization is ready. For AZ-900, scenario-based questions about deployment models almost always test whether you can match the business requirement to the correct model. When a scenario describes both on-premises and cloud usage operating together, the answer is nearly always hybrid cloud.'
                }
            ]
        });
        quiz.start();
    </script>
