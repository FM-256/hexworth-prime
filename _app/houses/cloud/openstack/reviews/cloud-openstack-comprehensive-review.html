<script src="../../../../components/ReviewEngine.js"></script>
<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'OpenStack Comprehensive Review',
  storageKey: 'hexworth_review_openstack',
  houseId: 'cloud',

  categories: [

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 1: Architecture & History
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Architecture & History',
      questions: [
        {
          value: 100,
          question: 'OpenStack was originally co-developed by which two organizations and announced in 2010?',
          options: ['Google and IBM', 'NASA and Rackspace', 'Red Hat and Ubuntu', 'VMware and Cisco'],
          correct: 1,
          explanation: 'OpenStack was founded as a joint project between NASA (which contributed the Nova compute codebase from its Nebula cloud) and Rackspace (which contributed the Swift object storage system). The project was announced at OSCON in July 2010.'
        },
        {
          value: 200,
          question: 'OpenStack follows a release cycle named after cities in alphabetical order. Which release introduced Placement service as a standalone API?',
          options: ['Newton', 'Ocata', 'Queens', 'Rocky'],
          correct: 2,
          explanation: 'The Queens release (February 2018) extracted the Placement API from Nova into a standalone service. Placement tracks resource provider inventories and allocations, enabling Nova\'s scheduler to make accurate placement decisions for vCPU, RAM, disk, NUMA, and custom resources like GPUs.'
        },
        {
          value: 300,
          question: 'Which OpenStack design principle describes the concept that each service exposes only a stable API and internal implementation details remain hidden from other services?',
          options: ['Horizontal Scalability', 'Loose Coupling', 'Convergent Architecture', 'Shared State'],
          correct: 1,
          explanation: 'Loose coupling is a core OpenStack design principle. Services communicate exclusively through versioned REST APIs and AMQP message queues. Nova never directly queries Neutron\'s database; it calls Neutron\'s API. This allows independent scaling, replacement, and upgrading of individual services without breaking the overall system.'
        },
        {
          value: 400,
          question: 'OpenStack uses AMQP message queuing internally. In a standard deployment using RabbitMQ, what pattern do Nova services like nova-conductor and nova-compute use to communicate?',
          options: ['Direct HTTP REST calls between services', 'Publish/subscribe fan-out to all compute nodes simultaneously', 'RPC over AMQP with topic-based routing where nova-conductor sends directed RPC calls to specific nova-compute queues', 'Shared database polling with optimistic locking'],
          correct: 2,
          explanation: 'Nova uses oslo.messaging over RabbitMQ for inter-service RPC. nova-conductor sends RPC calls to topic-based queues (compute.hostname) for directed calls to specific compute nodes, or to compute for load-balanced calls. This decouples services: nova-compute does not need to know nova-conductor\'s network address, only the queue topic.'
        },
        {
          value: 500,
          question: 'A cloud architect is designing a highly available OpenStack control plane. Which combination of services has stateful requirements that complicate active-active HA deployment?',
          options: [
            'Keystone and Glance, because they cache tokens in memory and cannot share state',
            'Nova-API and Neutron-Server, because they hold active network connections',
            'MariaDB Galera cluster and RabbitMQ mirrored queues, because these data-plane services require distributed consensus and are the actual stateful backends that OpenStack services rely on',
            'Nova-Scheduler and Nova-Conductor, because they maintain instance placement locks'
          ],
          correct: 2,
          explanation: 'Most OpenStack API services (nova-api, neutron-server, keystone, glance-api) are stateless and can run identically on multiple nodes behind a load balancer. The stateful complexity lies in the backends: MariaDB requires Galera for synchronous multi-master replication with split-brain protection, and RabbitMQ requires mirrored queues and careful quorum configuration. Getting these two right is the core challenge of HA OpenStack.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 2: Core Projects
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Core Projects',
      questions: [
        {
          value: 100,
          question: 'Which OpenStack project provides the Identity service (authentication and authorization)?',
          options: ['Glance', 'Keystone', 'Horizon', 'Heat'],
          correct: 1,
          explanation: 'Keystone is the Identity service. It provides authentication (verifying who you are) via tokens, authorization (what you can do) via role-based access control, and service discovery via the service catalog. Every OpenStack API call is validated against Keystone.'
        },
        {
          value: 200,
          question: 'Cinder provides which type of storage to OpenStack instances?',
          options: ['Object storage (REST API accessible)', 'File storage (NFS/SMB shares)', 'Persistent block storage (raw volumes)', 'In-memory cache storage'],
          correct: 2,
          explanation: 'Cinder (Block Storage) provides persistent block volumes that appear as raw block devices inside instances (e.g., /dev/vdb). Unlike the ephemeral root disk, Cinder volumes survive instance deletion and can be detached and re-attached to different instances. The instance OS must format and mount the volume.'
        },
        {
          value: 300,
          question: 'Heat is the OpenStack Orchestration service. What language does it use for describing cloud infrastructure templates?',
          options: ['HCL (HashiCorp Configuration Language)', 'HOT (Heat Orchestration Template) in YAML, compatible with a subset of AWS CloudFormation', 'Ansible YAML playbooks', 'Puppet DSL manifests'],
          correct: 1,
          explanation: 'Heat uses HOT (Heat Orchestration Template) format, written in YAML. Heat templates describe resources (instances, volumes, networks, security groups) and their relationships. Heat can also parse AWS CloudFormation templates. It creates and manages resource stacks declaratively, similar to Terraform for OpenStack.'
        },
        {
          value: 400,
          question: 'Neutron supports multiple network backend drivers. In a common Linux-bridge-based deployment, which Linux kernel feature allows traffic isolation between tenant networks on the same physical host?',
          options: ['iptables connection tracking (conntrack)', 'VLAN tagging (802.1Q) implemented via the Linux bridge with vlan_filtering enabled and neutron-linuxbridge-agent managing VLAN IDs per tenant', 'Traffic Control (tc) queuing disciplines', 'Linux namespaces for process isolation'],
          correct: 1,
          explanation: 'In the Linux bridge driver, Neutron assigns each tenant network a unique VLAN ID on the physical network segment (or uses VXLAN for overlay networks). neutron-linuxbridge-agent creates per-tenant Linux bridges and configures 802.1Q VLAN tagging on the uplink interface. Network namespaces are also used by the L3 agent to isolate router and DHCP processes.'
        },
        {
          value: 500,
          question: 'Swift (Object Storage) uses a different consistency model than traditional databases. When an object is written, which mechanism ensures data durability across the cluster, and what trade-off does this create?',
          options: [
            'Synchronous two-phase commit across all replicas; trade-off is increased write latency',
            'Eventual consistency with asynchronous replication: writes return 200 OK once a quorum of replicas (default 2 of 3) acknowledges receipt, with a background replicator reconciling discrepancies. Trade-off is that a read immediately after a write may return stale data from a non-updated replica.',
            'Strong consistency via Paxos consensus; trade-off is complex failure recovery',
            'RAID-6 erasure coding on each storage node; trade-off is high CPU overhead for encoding'
          ],
          correct: 1,
          explanation: 'Swift uses eventual consistency with quorum-based writes. By default, Swift stores 3 replicas. A write succeeds when 2 of 3 (write_affinity quorum) acknowledge. The replicator daemon asynchronously ensures all 3 replicas converge. This means briefly after a write, a read may hit the un-updated replica. Swift accepts this trade-off for high availability and write throughput, making it suitable for media storage but not transactional data.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 3: Installation
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Installation',
      questions: [
        {
          value: 100,
          question: 'When installing OpenStack on Ubuntu, which command initialises the Keystone database schema and creates the admin user?',
          options: [
            'openstack-install --bootstrap',
            'keystone-manage bootstrap',
            'openstack database init',
            'nova-manage db sync'
          ],
          correct: 1,
          explanation: 'keystone-manage bootstrap is the command that initialises the Keystone database schema, creates the admin user, default domain, and service project, and registers the Keystone API endpoints in the service catalog. This must be run before any other OpenStack service can authenticate.'
        },
        {
          value: 200,
          question: 'After installing MariaDB for OpenStack, what is the purpose of setting the bind-address in /etc/mysql/mariadb.conf.d/99-openstack.cnf to the controller\'s management IP?',
          options: [
            'To encrypt database connections with TLS',
            'To allow MariaDB to listen on the management network so other nodes (compute, storage) can connect to OpenStack service databases, while preventing direct internet access to the database port',
            'To enable MariaDB Galera replication',
            'To set the maximum number of simultaneous connections'
          ],
          correct: 1,
          explanation: 'By default, MariaDB binds to 127.0.0.1 (localhost only). OpenStack services on compute and storage nodes must connect to the controller database over the management network (10.0.0.0/24). Setting bind-address to 10.0.0.11 (the controller\'s management IP) allows remote connections on that interface while keeping the database port off the provider/external network.'
        },
        {
          value: 300,
          question: 'During Nova installation, nova-manage db sync is run on the controller. What does this command do?',
          options: [
            'Copies the Nova database from a backup',
            'Synchronises Nova configuration files between controller and compute nodes',
            'Applies database schema migrations to create or update Nova\'s database tables to match the current software version',
            'Tests connectivity between Nova and the RabbitMQ message broker'
          ],
          correct: 2,
          explanation: 'db sync applies all pending database migrations (Alembic-based for most OpenStack services). It creates the initial schema on a fresh install or applies incremental changes when upgrading. Running db sync is required after every upgrade before restarting services. On Nova, you also run nova-manage api_db sync separately for the API database (nova_api).'
        },
        {
          value: 400,
          question: 'A new OpenStack deployment fails with "Unable to communicate with identity service" when all services try to authenticate. Keystone is running. What is the most likely cause?',
          options: [
            'The /etc/hosts file on each node does not resolve "controller" to the correct management IP, causing service endpoint lookups to fail',
            'The RabbitMQ password is incorrect',
            'The Nova compute service was started before Keystone',
            'Glance is not running'
          ],
          correct: 0,
          explanation: 'OpenStack service configuration files use the hostname "controller" (or the configured FQDN) throughout — in connection strings, endpoint URLs, and auth URIs. If /etc/hosts does not resolve "controller" to 10.0.0.11 on every node, service endpoint lookups fail. This is one of the most common installation mistakes. All nodes must have consistent /etc/hosts entries.'
        },
        {
          value: 500,
          question: 'During a fresh OpenStack installation, you run "openstack service list" and get a 401 Unauthorized error even though you sourced admin-openrc. You verify admin-openrc has correct credentials. What is the methodical sequence of checks to isolate the failure?',
          options: [
            'Reinstall OpenStack from scratch using a scripted deployment tool',
            'Check (1) systemctl status apache2 on the controller (Keystone serves via uWSGI under Apache), (2) openstack endpoint list to verify the identity endpoint is registered with the correct URL, (3) curl the Keystone v3 endpoint directly to confirm it returns 200, (4) review /var/log/keystone/keystone.log for specific error messages, (5) verify the admin-openrc OS_AUTH_URL matches the registered endpoint',
            'Check if the firewall is blocking port 443 between client and controller',
            'Restart all OpenStack services simultaneously with systemctl restart openstack-*'
          ],
          correct: 1,
          explanation: 'This methodical sequence isolates the failure layer by layer: Apache running confirms Keystone is served; endpoint list confirms registration; curl confirms network reachability and TLS; logs reveal specific auth failures; URL mismatch catches environment variable errors. Skipping steps leads to incorrect diagnosis — you might restart services when the real issue is a misconfigured endpoint URL or a stopped Apache process.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 4: Operations
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Operations',
      questions: [
        {
          value: 100,
          question: 'What is the correct OpenStack CLI command to list all running instances across all projects (admin view)?',
          options: [
            'openstack server list',
            'openstack server list --all-projects',
            'nova hypervisor-stats',
            'openstack instance list --global'
          ],
          correct: 1,
          explanation: 'By default, "openstack server list" shows only instances in the current project. Adding "--all-projects" shows instances across all tenants, which requires admin credentials. This is the primary command for cloud administrators auditing resource usage or locating a specific instance.'
        },
        {
          value: 200,
          question: 'A flavor is used by a running instance. What happens when an admin attempts to delete that flavor?',
          options: [
            'The instance is terminated and the flavor is deleted',
            'OpenStack deletes the flavor and the instance reverts to default specs',
            'The delete command fails with an error — flavors in use by any instance cannot be deleted; the instances must be terminated first',
            'The flavor is marked for deletion and removed after the next instance rebuild'
          ],
          correct: 2,
          explanation: 'OpenStack prevents deletion of flavors referenced by existing instances. Nova stores the flavor spec in the instance record at launch time, so deletion would not affect running instances anyway — but the referential integrity check prevents the delete command from succeeding. Administrators must first terminate all instances using the flavor, then delete it.'
        },
        {
          value: 300,
          question: 'An operator needs to evacuate all instances from a compute node for maintenance without losing data. Which approach preserves running instances and migrates them to other hypervisors?',
          options: [
            'openstack server migrate --host TARGET <instance-id> for each instance',
            'Disable the compute service (openstack compute service set --disable), then use "openstack server migrate --live TARGET <instance-id>" for each instance (or configure auto-evacuation), which uses libvirt live migration to transfer running instances with minimal downtime',
            'Snapshot each instance, launch new instances from snapshots on another host, then delete originals',
            'openstack host evacuate <compute-node> --target-host TARGET'
          ],
          correct: 1,
          explanation: 'The correct workflow: first disable the nova-compute service on the target node so nova-scheduler stops placing new instances on it. Then live-migrate each instance using "openstack server migrate --live-migration" which uses hypervisor-level (libvirt/QEMU) live migration to move memory state and disk with sub-second downtime. Shared storage (Ceph or NFS) is required for true live migration; otherwise block migration copies the disk while the instance runs.'
        },
        {
          value: 400,
          question: 'When a Neutron security group rule is added, where is the rule actually enforced?',
          options: [
            'On the Neutron server (controller node) as a centralised firewall',
            'By iptables rules on each compute node, managed by neutron-linuxbridge-agent (or ovs-agent), applied directly on the virtual port (tap interface) connecting the instance to the bridge',
            'By a hardware firewall configured via Neutron\'s API',
            'By the instance\'s own kernel firewall, pushed via cloud-init'
          ],
          correct: 1,
          explanation: 'Security groups are implemented as iptables rules on the compute node, not centrally. neutron-linuxbridge-agent watches for security group updates via RPC from neutron-server and applies iptables rules to each instance\'s tap interface. This means security group enforcement is distributed — each compute node enforces rules only for the instances it hosts. This scales well but requires the L2 agent to be running on every compute node.'
        },
        {
          value: 500,
          question: 'A cloud operator notices that nova-scheduler is consistently placing new instances on one compute node despite multiple nodes having available capacity. What is the most likely configuration issue and its resolution?',
          options: [
            'The nova-compute service is down on the other nodes; restart nova-compute on each node',
            'The default FilterScheduler with only the AvailabilityZoneFilter active is not spreading load; enable WeightedScheduler and add RamWeigher with a negative multiplier so nova-scheduler prefers nodes with more free RAM',
            'The nova.conf [filter_scheduler] enabled_filters list is missing the ComputeFilter or RamFilter, causing scheduler to only evaluate one candidate host, or the weight_multiplier for ram is set to 0 eliminating RAM-based spreading. Fix: verify enabled_filters includes RamFilter and set ram_weight_multiplier > 0 in nova.conf',
            'Placement service is not tracking resource inventories; run nova-manage placement sync to reconcile'
          ],
          correct: 2,
          explanation: 'The FilterScheduler applies filters to eliminate ineligible hosts, then uses weighers to rank eligible hosts. If enabled_filters omits filters like RamFilter, all hosts pass equally. If ram_weight_multiplier is 0, RAM availability does not influence ranking and the scheduler defaults to deterministic selection (typically the first alphabetically). The fix is to ensure enabled_filters includes at minimum: ComputeFilter, ComputeCapabilitiesFilter, ImagePropertiesFilter, ServerGroupAntiAffinityFilter, and to set ram_weight_multiplier = 1.0 (or higher for stronger spreading).'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 5: Troubleshooting
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Troubleshooting',
      questions: [
        {
          value: 100,
          question: 'An instance is in ERROR state. What is the first command to run to get more information about the failure?',
          options: [
            'openstack server reboot <instance>',
            'openstack server show <instance> (look at the "fault" field for the error message)',
            'openstack server delete <instance> and try again',
            'openstack compute service list'
          ],
          correct: 1,
          explanation: '"openstack server show" displays the instance\'s full metadata including the "fault" dictionary, which contains the error message, code, and creation timestamp. This is the fastest first step. Common fault messages include "No valid host was found" (scheduler failure), "Build of instance aborted" (compute node error), or "Image is unacceptable" (image format mismatch).'
        },
        {
          value: 200,
          question: 'Instances can reach each other within the same tenant network but cannot reach the internet. The router has an external gateway set. What should be checked first?',
          options: [
            'The Glance service is not running',
            'The Neutron L3 agent is not running on the controller, or the router has no subnet interfaces attached — run "openstack router show" and "openstack network agent list" to verify',
            'The security groups block all traffic by default',
            'nova-compute is not running on the compute nodes'
          ],
          correct: 1,
          explanation: 'If instances communicate within the tenant but not externally, the datapath within the compute node is working. The issue is at the router level. Check: (1) neutron-l3-agent is running; (2) the router has an external gateway set to the provider network; (3) the router has the selfservice subnet added as an interface. "openstack router show" lists interfaces and the gateway. "openstack network agent list" shows L3 agent status.'
        },
        {
          value: 300,
          question: 'After upgrading from Yoga to Zed, the nova-compute service on compute nodes starts but immediately shows "forced down" in "openstack compute service list". What is the most likely cause?',
          options: [
            'The nova-compute service was manually disabled before the upgrade',
            'nova-compute cannot communicate with nova-conductor because the RPC API version has changed; the compute node is running old code incompatible with the upgraded controller. The compute node nova-compute package must also be upgraded and the service restarted.',
            'The /var/lib/nova/instances directory has incorrect permissions',
            'KVM/QEMU was not restarted after the upgrade'
          ],
          correct: 1,
          explanation: 'OpenStack upgrades follow a controller-first approach. nova-conductor on the upgraded controller speaks the new RPC API version. A nova-compute node still running the old software version cannot negotiate a compatible version and gets reported as "forced down" by nova-conductor\'s version check. The solution is to upgrade nova-compute on all compute nodes to the same release. RPC version pinning (compute_rpc_api version in nova.conf) can allow mixed-version operation during a rolling upgrade window.'
        },
        {
          value: 400,
          question: 'A tenant reports that spawning new instances in their project fails with "Quota exceeded for instances". However, "openstack quota show" shows the project has 10 instance quota and only 8 exist. What could cause this discrepancy?',
          options: [
            'The quota is per-availability-zone and the current zone is full',
            'Deleted instances in ERROR state may still be counted against quota (they exist in the database as deleted=1 but nova\'s quota engine counted them at creation and a quota_refresh was not triggered). Run "nova-manage quota refresh --project PROJECT_ID" or check for soft-deleted instances consuming quota.',
            'The Keystone token has expired and is returning stale quota data',
            'The Cinder block storage quota is full, preventing instance creation'
          ],
          correct: 1,
          explanation: 'Nova quota counting can get out of sync when instances fail during deletion (leaving them in the database with deleted=1 but still counted). OpenStack\'s quota mechanism counts reservations atomically but recovery from failed deletions or scheduler errors can leave orphaned reservations. "nova-manage quota refresh" recounts actual instances and reconciles the quota usage counter. Administrators should also check for instances in DELETING or ERROR state that may be stuck.'
        },
        {
          value: 500,
          question: 'An OpenStack cloud running 200 compute nodes suddenly sees a large number of instances report as down in monitoring, despite the hypervisors being healthy. nova-compute logs show "AMQP server is closed. Trying again in N seconds." What is the most accurate root cause and remediation?',
          options: [
            'All 200 compute nodes lost network connectivity simultaneously; check physical switch fabric',
            'RabbitMQ experienced a partition event or memory alarm. All nova-compute daemons disconnected from the message broker and are attempting reconnection. Remediation: (1) check RabbitMQ memory and disk alarms (rabbitmqctl status), (2) if memory alarm triggered, rabbitmq blocked all producers — clear the alarm or increase vm_memory_high_watermark, (3) if partition, resolve the partition and force rejoin, (4) verify ha-policy on OpenStack queues (rabbitmqctl list_policies)',
            'Keystone went down; all service tokens expired simultaneously',
            'The nova-conductor service restarted and dropped all RPC queues'
          ],
          correct: 1,
          explanation: 'In large OpenStack deployments, RabbitMQ is the single most common cause of mass instance communication failures. When RabbitMQ triggers a memory or disk alarm, it blocks all AMQP connections, causing every nova-compute, nova-conductor, and neutron-agent to disconnect simultaneously. This manifests as instances appearing down (nova-compute cannot report back) even though the hypervisors and instances are healthy. Always monitor RabbitMQ memory (typically <80% of system RAM) and ensure mirrored queue policies are applied to all OpenStack queues.'
        }
      ]
    }

  ],

  // ─────────────────────────────────────────────────────────────────────────
  // FINAL JEOPARDY
  // ─────────────────────────────────────────────────────────────────────────
  finalJeopardy: {
    category: 'University Lab Deployment Scenario',
    question: 'A university professor is deploying an OpenStack lab for 120 students. Each student needs their own isolated project with 5 instances (m1.small: 1 vCPU, 2 GB RAM, 20 GB disk). The lab runs on 6 physical servers each with 32 cores, 256 GB RAM, and 4 TB SSD. Students access instances via SSH through floating IPs. The professor wants to prevent any student project from consuming more than their fair share. Identify: (1) the minimum number of compute nodes needed with CPU overcommit ratio 4:1 and RAM overcommit ratio 1.5:1, (2) the quota values to set per project, (3) which two OpenStack services must be configured for student isolation, and (4) the security concern with 120 floating IPs on a /24 provider network.',
    options: [
      '(1) 3 compute nodes, (2) instances=5, cores=5, ram=10240, (3) Keystone projects and Nova quotas, (4) Students can scan each other\'s floating IPs — isolate with per-project security groups blocking cross-project ICMP',
      '(1) 2 compute nodes sufficient (overcommit handles it), (2) instances=5, cores=1, ram=2048, floating-ips=1, (3) only Nova quota enforcement needed, (4) 120 IPs exhausts a /24 leaving only 135 addresses for infrastructure',
      '(1) All 6 servers needed — no overcommit for educational lab, (2) no quotas needed for trusted students, (3) Heat and Horizon only, (4) no security concern since the lab is air-gapped',
      '(1) 4 compute nodes (120 students x 5 instances = 600 instances; with 4:1 CPU overcommit each node handles ~128 vCPUs virtual = 504 effective; RAM 1.5:1 gives 384 GB virtual per node; 600 instances x 2 GB = 1200 GB / 384 = 3.1 so 4 nodes); (2) instances=5, cores=5, ram=10240 MB, floating_ips=1, security_groups=3; (3) Keystone (isolated projects/domains) and Neutron (per-project networks preventing cross-tenant traffic); (4) 120 floating IPs consume 120 of 254 usable addresses from a /24, leaving only ~134 for gateways, infrastructure VIPs, and growth — a /23 or CIDR aggregation should be planned'
    ],
    correct: 3,
    explanation: 'The correct answer performs the capacity math: 600 instances need 600 vCPUs (with 4:1 overcommit, physical CPUs needed = 150, spread across 4 compute nodes each with 32 cores = 128 physical cores = 512 virtual, barely enough). RAM: 600 x 2 GB = 1200 GB virtual; with 1.5:1 overcommit, need 800 GB physical across 4 nodes (4 x 256 = 1024 GB, sufficient with headroom). Quota per project: 5 instances, 5 cores, 10240 MB RAM, 1 floating IP to conserve the /24. Keystone projects enforce tenant isolation at the API layer; Neutron per-project networks enforce L2 isolation between student environments. The floating IP exhaustion problem on a /24 is a real planning constraint that requires either a larger provider network or NAT aggregation.'
  },

  onComplete: function(results) {
    // Completion callback — ModuleProgress integration could go here
  }
});
</script>
