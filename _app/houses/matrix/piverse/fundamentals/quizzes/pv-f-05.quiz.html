    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: System Configuration',
            description: 'Test your knowledge of raspi-config, hardware interfaces, localisation, boot options, GPU memory, systemd, and networking.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-05-quiz', moduleId: 'pv-f-05-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is raspi-config?', options: ['A hardware diagnostic tool', 'The Raspberry Pi\'s central configuration utility with a text-based menu interface', 'A Python library for GPIO configuration', 'The Pi\'s firmware update tool'], explanation: 'raspi-config is the Raspberry Pi\'s central configuration utility. It provides a text-based menu interface for setting up hardware interfaces, boot options, localisation, and performance parameters. Run it with sudo raspi-config. It can also be used non-interactively from scripts (e.g., sudo raspi-config nonint do_ssh 0). Most settings can alternatively be configured through the GUI "Raspberry Pi Configuration" tool in the Preferences menu.' },
                { question: 'What command enables SSH on the Pi non-interactively?', options: ['sudo ssh enable', 'sudo raspi-config nonint do_ssh 0', 'sudo systemctl ssh on', 'sudo config ssh=true'], explanation: 'sudo raspi-config nonint do_ssh 0 enables SSH non-interactively. The "nonint" parameter tells raspi-config to run without the interactive menu. The value 0 means enable (confusingly, 1 means disable). This is useful for scripting and automated Pi provisioning where you need to configure multiple Pis with the same settings without manually navigating menus.' },
                { question: 'Which raspi-config category contains SSH, VNC, SPI, and I2C settings?', options: ['System Options', 'Display Options', 'Interface Options', 'Advanced Options'], explanation: 'Interface Options (category 3) contains all hardware communication protocols and remote access services: SSH, VNC, SPI, I2C, Serial Port, 1-Wire, and Remote GPIO. This is where you enable the hardware interfaces needed for PiVerse projects that connect sensors, displays, and external hardware.' },
                { question: 'What does I2C stand for and what is it used for?', options: ['Internet to Cloud -- remote data transfer', 'Inter-Integrated Circuit -- two-wire bus for sensors and displays', 'Input to Computer -- keyboard interface protocol', 'Internal Integrated Controller -- CPU management'], explanation: 'I2C stands for Inter-Integrated Circuit (also written as I-squared-C). It is a two-wire communication bus using SDA (data) and SCL (clock) lines. Multiple devices can share the same two wires, each identified by a unique address. I2C is commonly used for temperature sensors, humidity sensors, OLED displays, accelerometers, and PWM controllers. Enable it in raspi-config\'s Interface Options.' },
                { question: 'Why is setting the WLAN country code important?', options: ['It unlocks faster Wi-Fi speeds', 'Wi-Fi uses different channels and power levels per country -- wrong setting may prevent connection or violate regulations', 'It is required to access the Pi\'s app store', 'It changes the language of error messages'], explanation: 'Different countries regulate wireless spectrum differently. Wi-Fi channels, maximum transmit power, and DFS (Dynamic Frequency Selection) requirements vary by country. Setting the wrong WLAN country can prevent Wi-Fi from connecting (if the Pi tries to use channels not allowed in your actual country) or violate radio regulations. This is a legal requirement, not just a convenience setting.' },
                { question: 'What is the equivalent of a BIOS/UEFI settings menu on the Raspberry Pi?', options: ['raspi-config only', '/boot/firmware/config.txt', 'The Pi has no equivalent -- everything is auto-configured', 'The RP1 chip firmware'], explanation: '/boot/firmware/config.txt is the Pi\'s equivalent of a BIOS/UEFI settings menu. It controls low-level hardware settings: GPU memory allocation, overclocking, display rotation, HAT device tree overlays, and more. The Pi has no firmware menu you press a key to enter -- instead, you edit this text file. Changes require a reboot to take effect. raspi-config modifies this file behind the scenes for many settings.' },
                { question: 'What GPU memory split should a headless Pi server use?', options: ['256 MB', '128 MB (default)', '64 MB', '16 MB (minimum)'], explanation: '16 MB is the minimum GPU memory allocation and is appropriate for headless servers that have no desktop, no camera, and no video processing. Since the Pi\'s RAM is shared between CPU and GPU, reducing GPU memory gives more RAM to the CPU for running applications, databases, and services. Set it with gpu_mem=16 in /boot/firmware/config.txt or via raspi-config Performance options.' },
                { question: 'What does systemctl enable ssh do?', options: ['Starts SSH immediately', 'Configures SSH to start automatically on every boot', 'Installs the SSH server package', 'Opens port 22 in the firewall'], explanation: 'systemctl enable ssh configures the SSH service to start automatically on every boot. It does NOT start it immediately -- for that, use systemctl start ssh. The enable command creates a symbolic link in the systemd boot targets so the service launches during the boot process. Conversely, systemctl disable ssh prevents it from starting on boot (but does not stop a currently running instance).' },
                { question: 'What is the difference between systemctl start and systemctl restart?', options: ['There is no difference', 'start begins a stopped service; restart stops and re-starts a running service', 'start is for first-time setup; restart is for updates', 'start requires sudo; restart does not'], explanation: 'systemctl start begins a service that is not currently running. If the service is already running, start does nothing. systemctl restart stops the running service and starts it again, which is useful after changing configuration files. For example, after editing /etc/ssh/sshd_config, you run sudo systemctl restart ssh to apply the changes. There is also systemctl reload, which tells some services to re-read config without fully stopping.' },
                { question: 'What command shows the current IP address of all network interfaces?', options: ['ifconfig', 'ip addr show', 'netstat -i', 'hostname -I'], explanation: 'ip addr show (or just ip a) displays all network interfaces with their IP addresses, MAC addresses, and status. It has replaced the older ifconfig command on modern Linux systems. You will see entries for lo (loopback/localhost), eth0 (Ethernet), and wlan0 (Wi-Fi). The inet line shows the IPv4 address. hostname -I also shows IP addresses but with less detail.' },
                { question: 'What is DHCP and why might a Pi server need a static IP instead?', options: ['DHCP encrypts network traffic; static IP does not', 'DHCP automatically assigns IP addresses that can change; servers need a fixed address so clients can always find them', 'DHCP is faster than static IP', 'There is no practical difference'], explanation: 'DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses from the router. The address can change between reboots, which is fine for desktops and laptops. But servers (Pi-hole, web servers, Home Assistant) need a fixed (static) IP address so clients can always reach them at the same address. You can set a static IP on the Pi via nmcli, or use a DHCP reservation on your router to always assign the same IP to the Pi\'s MAC address.' },
                { question: 'What command checks the current CPU temperature on a Raspberry Pi?', options: ['cat /proc/temp', 'vcgencmd measure_temp', 'sudo sensors', 'top --temp'], explanation: 'vcgencmd measure_temp reads the CPU temperature from the VideoCore GPU firmware and outputs it in the format temp=45.0\'C. This is a Pi-specific command from the vcgencmd utility. Monitoring temperature is important because the Pi throttles CPU speed at 80 degrees C and throttles aggressively at 85 degrees C. For 24/7 operation or overclocking, keep temperatures below 70 degrees C with adequate cooling.' },
                { question: 'What happens when the Pi\'s CPU reaches 80 degrees Celsius?', options: ['The Pi shuts down immediately', 'The CPU begins thermal throttling -- reducing clock speed to lower temperature', 'Nothing -- the Pi can safely run at any temperature', 'The GPU takes over processing to relieve the CPU'], explanation: 'At 80 degrees C, the Pi\'s firmware begins thermal throttling, which reduces the CPU clock speed to lower the temperature. At 85 degrees C, more aggressive throttling kicks in. The Pi will never destroy itself from overheating -- it will just slow down. This is why active cooling (fan or heatsink) is recommended for sustained workloads and overclocking. A passive heatsink is usually sufficient for light desktop use.' },
                { question: 'Which boot option allows the Pi to start from a USB SSD instead of an SD card?', options: ['USB mass storage boot, configured in Advanced Options > Boot Order', 'It is not possible -- Pi always requires an SD card', 'UEFI boot mode in raspi-config', 'USB boot via the RP1 chip settings'], explanation: 'USB mass storage boot is configured in raspi-config under Advanced Options > Boot Order. Pi 4 and Pi 5 support booting directly from a USB SSD or hard drive, which is faster and more reliable than microSD. You can set the boot order to try USB first, then SD card, or USB only. For the Pi 5, NVMe SSDs via PCIe HATs provide even faster storage. USB boot is recommended for servers and write-heavy workloads.' },
                { question: 'What does the nmcli command do?', options: ['Manages systemd services', 'Controls the NetworkManager daemon -- configures Wi-Fi, Ethernet, and IP settings', 'Monitors CPU and memory usage', 'Manages user accounts and permissions'], explanation: 'nmcli is the command-line interface for NetworkManager, which manages all network connections on Raspberry Pi OS Bookworm. It can scan for and connect to Wi-Fi networks (nmcli device wifi connect "SSID" password "pass"), set static IP addresses, configure DNS, and manage connection profiles. It replaces the older dhcpcd-based configuration used in Bullseye and earlier releases.' }
            ]
        });
