    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: The Linux Command Line',
            description: 'Test your knowledge of terminal navigation, file operations, permissions, apt, pipes, nano, sudo, and SSH.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-04-quiz', moduleId: 'pv-f-04-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What does the pwd command do?', options: ['Print Working Directory -- shows your current location in the filesystem', 'Password -- changes your user password', 'Power Down -- shuts down the system', 'Process Watch Display -- shows running processes'], explanation: 'pwd stands for Print Working Directory. It outputs the absolute path of your current location in the filesystem. For example, if you are in your home directory, pwd returns /home/pi. This is the first command to run when you are disoriented in the terminal -- it tells you exactly where you are.' },
                { question: 'What does ls -la do?', options: ['Lists only directories', 'Lists all files (including hidden) in long format with permissions, sizes, and dates', 'Lists files larger than 1 MB', 'Lists files alphabetically without details'], explanation: 'ls -la combines two options: -l (long format showing permissions, owner, group, size, date, and name) and -a (all files including hidden ones that start with a dot). Hidden files like .bashrc, .profile, and .config are only visible with the -a flag. This is one of the most commonly used command combinations in Linux.' },
                { question: 'What does cd .. do?', options: ['Changes to the root directory', 'Changes to the home directory', 'Changes to the parent directory (one level up)', 'Creates a new directory called ".."'], explanation: 'cd .. moves you up one level in the directory hierarchy. The double dot (..) always refers to the parent directory. If you are in /home/pi/Documents, cd .. takes you to /home/pi. A single dot (.) refers to the current directory. These are relative path components, not actual directory names.' },
                { question: 'What does mkdir -p projects/python/sensors do?', options: ['Creates only the "sensors" directory', 'Creates all three nested directories in one command', 'Creates a file called "projects/python/sensors"', 'Moves the "sensors" directory into "projects/python"'], explanation: 'mkdir -p creates the entire directory path, including any parent directories that do not exist yet. Without -p, mkdir would fail if "projects" or "projects/python" did not already exist. The -p flag (parents) tells mkdir to create each directory in the path as needed, silently succeeding if any already exist.' },
                { question: 'What is the critical difference between cp and mv?', options: ['cp is faster than mv', 'cp creates a duplicate; mv relocates the original (the source is gone after mv)', 'cp works on files only; mv works on directories only', 'There is no difference -- they are aliases'], explanation: 'cp (copy) creates a duplicate of the file or directory, leaving the original in place. mv (move) relocates the original -- after mv, the source no longer exists at its old location. mv is also used for renaming: mv old-name.txt new-name.txt renames the file without moving it to a different directory. With cp, you have two copies; with mv, you have one in a new location.' },
                { question: 'What happens when you run rm without the -r flag on a directory?', options: ['The directory and its contents are deleted', 'Only empty directories are deleted', 'The command fails with an error', 'Only files inside the directory are deleted'], explanation: 'rm without the -r flag refuses to delete directories and returns an error: "cannot remove: Is a directory." You must use rm -r (recursive) to delete a directory and all its contents. This is a safety feature -- rm permanently deletes files with no trash can or undo. The -r flag tells rm to descend into the directory and delete everything inside before removing the directory itself.' },
                { question: 'In the permission string -rwxr-xr--, what can the "group" do?', options: ['Read, write, and execute', 'Read and execute only', 'Read only', 'No access'], explanation: 'The permission string -rwxr-xr-- breaks down as: - (file type), rwx (owner: read+write+execute), r-x (group: read+execute), r-- (others: read only). The middle three characters (r-x) represent group permissions. The group can read the file and execute it, but cannot write to (modify) it. The dash in the middle position means "no write permission."' },
                { question: 'What does chmod 755 script.py set?', options: ['Owner: read only, Group: read+write, Others: full access', 'Owner: read+write+execute, Group: read+execute, Others: read+execute', 'All users: read+write+execute', 'Owner: full access, Group: no access, Others: no access'], explanation: 'chmod 755 sets permissions using octal notation. 7 = rwx (4+2+1), 5 = r-x (4+0+1). So 755 means: owner gets read+write+execute (7), group gets read+execute (5), others get read+execute (5). This is the standard permission for executable scripts and programs -- the owner can modify them, everyone else can run them but not change them.' },
                { question: 'What must you run before sudo apt install?', options: ['sudo apt clean', 'sudo apt update', 'sudo apt autoremove', 'sudo apt check'], explanation: 'You must run sudo apt update before installing packages. This command refreshes the local package index by downloading the latest package lists from the Debian repositories. Without it, apt might not know about the latest versions, might install outdated software, or might fail with "package not found" errors. apt update tells apt what is available; apt install actually installs it.' },
                { question: 'What does the pipe operator | do?', options: ['Runs two commands simultaneously', 'Sends the output of the left command as input to the right command', 'Writes output to a file', 'Compares the output of two commands'], explanation: 'The pipe operator (|) takes the standard output (stdout) of the command on the left and feeds it as standard input (stdin) to the command on the right. For example, ls -la | grep ".txt" runs ls -la, then sends that output to grep which filters for lines containing ".txt." This is the Unix philosophy in action: small tools connected by pipes to build powerful data processing chains.' },
                { question: 'What is the difference between > and >> in shell redirection?', options: ['> appends, >> overwrites', '> overwrites the file, >> appends to the file', '> writes to stdout, >> writes to stderr', 'There is no difference'], explanation: '> (single redirect) overwrites the target file with the command output. If the file exists, its previous contents are erased. >> (double redirect) appends to the file, adding new content after the existing content. For example, echo "line 1" > file.txt creates the file, then echo "line 2" >> file.txt adds a second line without erasing the first.' },
                { question: 'How do you save a file in nano?', options: ['Ctrl+S', 'Ctrl+O (Write Out)', 'Ctrl+W', 'Press Escape then type :w'], explanation: 'In nano, Ctrl+O (Write Out) saves the file. Nano then asks you to confirm or change the filename, and you press Enter to confirm. Ctrl+X exits nano (and asks to save if there are unsaved changes). Ctrl+W is search. The :w command is a vim shortcut, not nano. Nano displays all available keyboard shortcuts at the bottom of the screen, making it beginner-friendly.' },
                { question: 'What does sudo stand for and what does it do?', options: ['Super User Do -- runs a command with root (administrator) privileges', 'System Update -- downloads system updates', 'Secure User Domain -- switches to a secure session', 'Standard Unix Daemon Operations -- manages background services'], explanation: 'sudo stands for "Super User Do" (or "substitute user do"). It runs the following command with root (administrator) privileges. Normal users cannot install software, modify system files, or restart services -- sudo temporarily elevates the specific command that needs elevated access. You enter your own password (not root\'s password) to confirm. This follows the principle of least privilege: run as root only when necessary.' },
                { question: 'What does ssh-copy-id pi@piverse.local do?', options: ['Copies files from the Pi to your computer', 'Copies your public SSH key to the Pi for passwordless login', 'Creates a new SSH user on the Pi', 'Copies the Pi\'s SSH configuration to your computer'], explanation: 'ssh-copy-id copies your public SSH key (~/.ssh/id_ed25519.pub or similar) to the Pi\'s authorized_keys file. After this, you can SSH into the Pi without entering a password -- the key pair provides authentication. This is more secure than passwords (keys are much harder to brute-force) and more convenient for frequent connections. Always generate your key pair first with ssh-keygen.' },
                { question: 'What does tail -f /var/log/syslog do?', options: ['Shows the first 10 lines of the log file', 'Shows the last 10 lines and then exits', 'Follows the log file in real-time, showing new lines as they are written', 'Filters the log file for error messages only'], explanation: 'tail -f follows the file in real-time. It shows the last 10 lines and then keeps the terminal open, displaying each new line as it is written to the file. This is essential for monitoring logs during debugging -- you can watch events happen live. Press Ctrl+C to stop following. The -f flag stands for "follow." Without -f, tail just shows the last lines and exits.' }
            ]
        });
        quiz.start();
    </script>
