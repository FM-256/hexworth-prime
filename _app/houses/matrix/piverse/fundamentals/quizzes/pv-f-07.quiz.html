        <a href="../../../index.html">&larr; Back to PiVerse</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 7: Python on the Pi',
            description: 'Test your knowledge of Python fundamentals on the Raspberry Pi -- Thonny IDE, variables, types, conditions, loops, functions, lists, strings, file I/O, and error handling.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-07-quiz', moduleId: 'pv-f-07-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                {
                    question: 'What does Python use to define code blocks (instead of curly braces)?',
                    options: ['Parentheses', 'Square brackets', 'Indentation (whitespace)', 'Semicolons'],
                    explanation: 'Python uses indentation (typically 4 spaces) to define code blocks. A colon at the end of a line (if, for, def, etc.) starts a new block, and everything indented below it belongs to that block. Mixing tabs and spaces causes IndentationError. This is fundamentally different from C/Java which use curly braces.'
                },
                {
                    question: 'What is the output of: print(type(42))?',
                    options: ['int', 'integer', "<class 'int'>", '42'],
                    explanation: 'The type() function returns the type object of a value. For integers, it returns <class \'int\'>. Python is dynamically typed -- you do not declare types, but every value has a type. Other common types: <class \'float\'>, <class \'str\'>, <class \'bool\'>, <class \'list\'>.'
                },
                {
                    question: 'Which keyword introduces the middle condition in a Python conditional chain?',
                    options: ['else if', 'elseif', 'elif', 'elsif'],
                    explanation: 'Python uses "elif" (short for "else if") for additional conditions in a chain: if/elif/elif/else. This is different from C ("else if"), JavaScript ("else if"), and Ruby ("elsif"). The elif keyword keeps the indentation clean by avoiding nested if/else blocks.'
                },
                {
                    question: 'What does range(2, 10, 3) produce?',
                    options: ['2, 5, 8', '2, 3, 4, 5, 6, 7, 8, 9', '3, 6, 9', '2, 4, 6, 8'],
                    explanation: 'range(start, stop, step) generates numbers from start up to (but not including) stop, incrementing by step. range(2, 10, 3) produces 2, 5, 8. The value 11 would be next but exceeds 10, so it stops. The stop value is always excluded. This three-argument form is useful for stepping through sequences at intervals.'
                },
                {
                    question: 'What is the correct way to open a file safely in Python?',
                    options: ['f = open("data.txt")', 'with open("data.txt") as f:', 'file.read("data.txt")', 'import file; file.open("data.txt")'],
                    explanation: 'The "with" statement (context manager) is the correct way. It automatically closes the file when the block exits, even if an exception occurs. Using just f = open() without a corresponding f.close() risks leaving files open, which can cause data loss or resource leaks. Always use "with open()" in Python.'
                },
                {
                    question: 'What does the expression [x**2 for x in range(5)] produce?',
                    options: ['[0, 1, 2, 3, 4]', '[1, 4, 9, 16, 25]', '[0, 1, 4, 9, 16]', '[0, 2, 4, 6, 8]'],
                    explanation: 'This is a list comprehension. It iterates x over range(5) (values 0, 1, 2, 3, 4) and computes x**2 (x squared) for each. Results: 0**2=0, 1**2=1, 2**2=4, 3**2=9, 4**2=16. List comprehensions are a concise way to build lists -- they replace multi-line for loops that append to a list.'
                },
                {
                    question: 'What happens when you try to modify a string in Python with s[0] = "x"?',
                    options: ['The first character changes to "x"', 'A TypeError is raised because strings are immutable', 'The string is replaced entirely', 'Nothing happens'],
                    explanation: 'Python strings are immutable -- they cannot be modified in place. s[0] = "x" raises TypeError. To change a string, you must create a new one: s = "x" + s[1:]. Methods like upper(), replace(), and strip() all return new strings rather than modifying the original. This is a fundamental difference from C char arrays.'
                },
                {
                    question: 'What is the output of: print(f"Pi is {3.14159:.2f}")?',
                    options: ['Pi is 3.14159', 'Pi is 3.14', 'Pi is 3.1', 'Pi is {3.14159:.2f}'],
                    explanation: 'f-strings (formatted string literals, Python 3.6+) evaluate expressions inside curly braces. The :.2f format specifier means "format as a float with 2 decimal places". So 3.14159 becomes 3.14. Other specifiers: :>10 (right-align in 10 chars), :04d (zero-padded 4-digit integer), :% (percentage format).'
                },
                {
                    question: 'Which exception type is raised when you try to convert "hello" to an integer with int("hello")?',
                    options: ['TypeError', 'ValueError', 'SyntaxError', 'RuntimeError'],
                    explanation: 'ValueError is raised when a function receives an argument of the right type but an inappropriate value. int("hello") fails because "hello" is a valid string but not a valid integer representation. int("42") would succeed. TypeError is for wrong types entirely (e.g., int(None)), and SyntaxError is for code that cannot be parsed.'
                },
                {
                    question: 'What does the "finally" block do in a try/except/finally structure?',
                    options: ['Runs only if an exception occurs', 'Runs only if no exception occurs', 'Always runs, whether or not an exception occurred', 'Prevents the exception from being raised'],
                    explanation: 'The finally block executes unconditionally -- after the try block if no exception occurred, or after the except block if one did. It even runs if there is a return statement in the try or except blocks. Use it for cleanup: closing files, releasing GPIO pins, disconnecting from databases. It guarantees cleanup happens.'
                },
                {
                    question: 'How do you make a Python script directly executable on the Pi command line?',
                    options: ['Just run it with double-click', 'Add #!/usr/bin/env python3 as the first line and chmod +x the file', 'Rename it to .exe', 'Install a special package'],
                    explanation: 'The shebang line #!/usr/bin/env python3 tells the OS which interpreter to use. chmod +x script.py makes it executable. Then you can run ./script.py directly instead of python3 script.py. The "env" command finds python3 in the PATH, making the script portable across different systems where Python may be installed in different locations.'
                },
                {
                    question: 'What is the difference between a list and a tuple in Python?',
                    options: ['Lists use [] and are mutable; tuples use () and are immutable', 'There is no difference', 'Tuples are faster and lists are slower', 'Lists can only hold numbers'],
                    explanation: 'Lists (defined with []) are mutable -- you can add, remove, and change elements. Tuples (defined with ()) are immutable -- once created, they cannot be modified. Use tuples for fixed collections (coordinates, RGB values, function returns). Tuples are slightly faster and can be used as dictionary keys because they are hashable.'
                },
                {
                    question: 'What does pip3 install requests do on a Raspberry Pi?',
                    options: ['Installs a new operating system', 'Downloads and installs the "requests" Python package from PyPI', 'Creates a new Python file called requests.py', 'Sends HTTP requests to a server'],
                    explanation: 'pip3 is Python\'s package manager. It downloads packages from the Python Package Index (PyPI) and installs them so you can import them in your code. The "requests" library is used for making HTTP requests. After pip3 install requests, you can write "import requests" in any Python script. Use virtual environments to isolate project dependencies.'
                },
                {
                    question: 'What is the Thonny Variable Inspector used for?',
                    options: ['Editing variable names', 'Viewing all current variables and their values in real time during execution', 'Deleting unused variables', 'Creating new variables automatically'],
                    explanation: 'Thonny\'s Variable Inspector (View > Variables) displays a live table of all variables currently in scope, along with their types and values. As you step through code or run it, the inspector updates in real time. This is invaluable for debugging -- you can see exactly when a variable changes and what value it holds at each point.'
                },
                {
                    question: 'What does the Python REPL stand for?',
                    options: ['Run, Execute, Print, Loop', 'Read, Evaluate, Print, Loop', 'Read, Edit, Parse, Load', 'Remote Execution Protocol Layer'],
                    explanation: 'REPL stands for Read, Evaluate, Print, Loop. It reads your input, evaluates the expression, prints the result, and loops back to wait for more input. The >>> prompt in Python is the REPL. It is interactive -- type an expression and see the result immediately. Every Python installation includes a REPL, and it is the fastest way to test small code snippets.'
                }
            ]
        });
        quiz.start();
    </script>
