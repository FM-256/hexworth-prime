    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: The Raspberry Pi Desktop',
            description: 'Test your knowledge of Raspberry Pi OS, the Pixel desktop, applications, file manager, and terminal.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-03-quiz', moduleId: 'pv-f-03-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What Linux distribution is Raspberry Pi OS based on?', options: ['Ubuntu', 'Fedora', 'Debian', 'Arch Linux'], explanation: 'Raspberry Pi OS is based on Debian Linux, one of the oldest and most stable Linux distributions. The current release is based on Debian 12 "Bookworm." This means everything you learn on Raspberry Pi OS -- the apt package manager, the file hierarchy (/etc, /home, /var), systemd services -- transfers directly to Debian, Ubuntu, and other Debian-based distributions.' },
                { question: 'What is the name of the desktop environment used by Raspberry Pi OS?', options: ['GNOME', 'KDE Plasma', 'Pixel', 'XFCE'], explanation: 'Raspberry Pi OS uses a customized desktop environment called Pixel (Pi Improved Xwindows Environment, Lightweight). It is based on LXQt and optimized for the Pi\'s hardware capabilities. Pixel is lightweight and responsive while still providing a familiar desktop experience with a taskbar, application menu, and window management.' },
                { question: 'What display compositor does Raspberry Pi OS Bookworm use by default?', options: ['Openbox (X11)', 'Wayfire (Wayland)', 'Mutter (GNOME)', 'KWin (KDE)'], explanation: 'Raspberry Pi OS Bookworm uses Wayfire, a Wayland compositor, replacing the older Openbox window manager that used X11. Wayland provides smoother rendering, better security isolation between applications, and more efficient use of the GPU. Legacy X11 applications still work through the XWayland compatibility layer.' },
                { question: 'Where is the Application Menu located on the Raspberry Pi OS desktop?', options: ['Bottom-left corner', 'Top-left corner (Raspberry Pi icon)', 'Top-right corner', 'Right-click the desktop'], explanation: 'The Application Menu is accessed by clicking the Raspberry Pi icon in the top-left corner of the taskbar. Applications are organized by category: Programming, Internet, Office, Accessories, Sound & Video, Preferences, and more. This is the primary way to launch applications on the Pi desktop.' },
                { question: 'What is the default web browser on Raspberry Pi OS?', options: ['Firefox', 'Chromium', 'Midori', 'Epiphany'], explanation: 'Chromium is the default web browser on Raspberry Pi OS. It uses the same rendering engine as Google Chrome and supports HTML5, CSS3, JavaScript, WebGL, and Chrome extensions. It is pre-installed and optimized for the Pi\'s VideoCore GPU for hardware video acceleration. Firefox is available but must be installed separately.' },
                { question: 'What file manager does Raspberry Pi OS use?', options: ['Nautilus', 'Dolphin', 'PCManFM', 'Thunar'], explanation: 'Raspberry Pi OS uses PCManFM (PCMan File Manager) as its default file manager. It provides visual file browsing, drag and drop, bookmarks, and a side panel for quick navigation. It opens to your home directory (/home/youruser) and can navigate to any location on the filesystem, though some system directories require root permissions to modify.' },
                { question: 'What keyboard shortcut toggles hidden files in the Pi file manager?', options: ['Ctrl+H', 'Ctrl+Shift+H', 'Alt+H', 'F12'], explanation: 'Ctrl+H toggles the display of hidden files in PCManFM. In Linux, any file or directory whose name starts with a dot (.) is hidden by default. This includes configuration files like .bashrc, .profile, and directories like .config. You can also toggle hidden files from the View menu.' },
                { question: 'What is Thonny?', options: ['A text editor for system configuration', 'A Python IDE designed for beginners, pre-installed on Pi OS', 'A terminal emulator', 'A package manager with a GUI'], explanation: 'Thonny is a Python Integrated Development Environment (IDE) designed specifically for beginners. It is pre-installed on Raspberry Pi OS and provides syntax highlighting, auto-complete, an integrated debugger with step-through execution, a variable inspector, and a built-in Python shell (REPL). It is where students write Python scripts that control GPIO pins using libraries like gpiozero.' },
                { question: 'What keyboard shortcut opens a terminal on Raspberry Pi OS?', options: ['Ctrl+T', 'Ctrl+Alt+T', 'Alt+F2', 'F1'], explanation: 'Ctrl+Alt+T opens a new terminal emulator window on Raspberry Pi OS. You can also click the terminal icon in the taskbar quick-launch area. The terminal provides a Bash shell where you type commands directly. It is the more powerful interface compared to the GUI -- essential for SSH, scripting, and system administration.' },
                { question: 'In the terminal, what does Ctrl+Shift+C do?', options: ['Close the terminal', 'Clear the screen', 'Copy selected text', 'Cancel the current command'], explanation: 'Ctrl+Shift+C copies selected text in the terminal. Note that this is different from regular applications where Ctrl+C copies. In the terminal, Ctrl+C sends an interrupt signal (SIGINT) that cancels the currently running command. Similarly, pasting in the terminal uses Ctrl+Shift+V instead of Ctrl+V.' },
                { question: 'What does the system tray (top-right corner) display?', options: ['Only the clock', 'Application shortcuts', 'Network status, volume, Bluetooth, and clock', 'CPU and RAM usage graphs'], explanation: 'The system tray in the top-right corner displays: network status (Wi-Fi or Ethernet connection icon), volume control, Bluetooth status, and the clock. Clicking the network icon lets you connect to or disconnect from Wi-Fi networks. Clicking the volume icon adjusts audio output. The system tray provides at-a-glance status of key system services.' },
                { question: 'What init system does Raspberry Pi OS use to manage services?', options: ['SysVinit', 'Upstart', 'systemd', 'OpenRC'], explanation: 'Raspberry Pi OS uses systemd as its init system, the same as every modern Debian, Ubuntu, Fedora, and RHEL system. systemd manages the boot process, system services, and system state. You control services with the systemctl command: start, stop, restart, enable (start on boot), and disable. This knowledge transfers to virtually every modern Linux distribution.' },
                { question: 'Which LibreOffice application is the equivalent of Microsoft PowerPoint?', options: ['LibreOffice Writer', 'LibreOffice Calc', 'LibreOffice Impress', 'LibreOffice Draw'], explanation: 'LibreOffice Impress is the presentation application, equivalent to Microsoft PowerPoint. It can open, edit, and save .pptx files. LibreOffice Writer is equivalent to Word, Calc is equivalent to Excel, and Draw is for vector graphics. LibreOffice is a full office suite pre-installed on Raspberry Pi OS (desktop with recommended software edition).' },
                { question: 'What does VNC allow you to do?', options: ['Transfer files between computers', 'Access the Pi\'s desktop remotely from another computer', 'Create virtual machines on the Pi', 'Monitor network traffic'], explanation: 'VNC (Virtual Network Computing) allows you to access the Pi\'s graphical desktop remotely from another computer. RealVNC is built into Raspberry Pi OS. Enable it via raspi-config (Interface Options > VNC), then connect using a VNC client on your laptop or phone. This is useful when you need the GUI but the Pi has no physical monitor connected -- unlike SSH which only provides a terminal.' },
                { question: 'How do you change the desktop wallpaper on Raspberry Pi OS?', options: ['Edit /boot/config.txt', 'Right-click the desktop or use Preferences > Appearance Settings', 'Run sudo wallpaper-set in the terminal', 'It cannot be changed'], explanation: 'You can change the wallpaper by right-clicking the desktop and selecting Desktop Preferences, or by going to Preferences > Appearance Settings in the application menu. Several built-in wallpaper options are available, and you can also select any custom image file. The dark theme option in Appearance Settings is also worth exploring for reduced eye strain.' }
            ]
        });
