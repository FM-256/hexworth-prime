    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 9: The Pico & Pico W',
            description: 'Test your knowledge of the Raspberry Pi Pico, RP2040 microcontroller, MicroPython, Pico W wireless capabilities, BOOTSEL flashing, and GPIO programming.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-09-quiz', moduleId: 'pv-f-09-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                {
                    question: 'What is the fundamental difference between the Raspberry Pi Pico and the Raspberry Pi 5?',
                    options: ['The Pico is smaller', 'The Pico is a microcontroller (no OS); the Pi 5 is a single-board computer (runs Linux)', 'The Pico is cheaper', 'There is no significant difference'],
                    explanation: 'The Pico is a microcontroller board -- it runs your code directly on the hardware with no operating system. Boot is instant (milliseconds), it has 264 KB RAM, and draws milliamps. The Pi 5 is a full computer running Linux with gigabytes of RAM, a desktop environment, and multitasking. They serve completely different use cases.'
                },
                {
                    question: 'What processor does the Raspberry Pi Pico use?',
                    options: ['BCM2711', 'RP2040', 'ATmega328P', 'ESP32'],
                    explanation: 'The RP2040 is Raspberry Pi Ltd\'s first custom-designed microcontroller chip. It features dual ARM Cortex-M0+ cores running at 133 MHz, 264 KB SRAM, and 8 PIO (Programmable I/O) state machines. It was designed in-house in Cambridge, UK. The BCM2711 is the Pi 4\'s SoC, ATmega328P is Arduino Uno\'s chip, and ESP32 is Espressif\'s WiFi chip.'
                },
                {
                    question: 'How many GPIO pins are user-accessible on the Pico board?',
                    options: ['8', '16', '26', '40'],
                    explanation: 'The RP2040 chip has 30 GPIO pins total, but the Pico board exposes 26 user-accessible GPIO pins. These support digital I/O, PWM on all pins, SPI (2 buses), I2C (2 buses), UART (2 buses), and 3 ADC channels. The remaining pins are used internally for the flash memory and other board functions.'
                },
                {
                    question: 'What is the BOOTSEL button used for on the Pico?',
                    options: ['Resetting the program', 'Entering USB mass storage mode for flashing firmware', 'Enabling Bluetooth', 'Powering on the board'],
                    explanation: 'Holding BOOTSEL while plugging in USB puts the Pico into USB mass storage mode -- it appears as a drive called RPI-RP2 on your computer. You can then drag a .uf2 firmware file onto it (like MicroPython or a C program). The Pico reboots automatically with the new firmware. The BOOTSEL bootloader is stored in ROM and cannot be overwritten, so recovery is always possible.'
                },
                {
                    question: 'What MicroPython module provides access to GPIO pins on the Pico?',
                    options: ['gpio', 'RPi.GPIO', 'machine', 'board'],
                    explanation: 'The "machine" module is MicroPython\'s hardware abstraction layer. It provides Pin, ADC, PWM, I2C, SPI, UART, Timer, and other hardware classes. Example: from machine import Pin; led = Pin(25, Pin.OUT). RPi.GPIO is for the full Raspberry Pi (Linux), not the Pico. The "board" module is used by CircuitPython, not MicroPython.'
                },
                {
                    question: 'What voltage level do Pico GPIO pins operate at?',
                    options: ['5V', '3.3V', '1.8V', '12V'],
                    explanation: 'All Pico GPIO pins operate at 3.3V logic. They are NOT 5V tolerant -- connecting 5V directly to a GPIO pin can permanently damage the RP2040 chip. When interfacing with 5V devices (like some sensors or displays), you must use a level shifter or voltage divider. The Pico does have a VBUS pin that provides 5V from USB for powering external components.'
                },
                {
                    question: 'What wireless capabilities does the Pico W add over the standard Pico?',
                    options: ['WiFi only', 'Bluetooth only', '802.11n WiFi and Bluetooth 5.2 (BLE)', '5G cellular'],
                    explanation: 'The Pico W adds a CYW43439 wireless chip providing 802.11n WiFi (2.4 GHz) and Bluetooth 5.2 with BLE support. This enables IoT applications: send sensor data to the cloud, host a web server, communicate with smartphones via Bluetooth. The Pico W costs about $2 more than the standard Pico. Same RP2040 chip, same GPIO layout.'
                },
                {
                    question: 'What is special about PIO (Programmable I/O) state machines on the RP2040?',
                    options: ['They provide extra RAM', 'They are programmable I/O processors that create custom communication protocols without CPU involvement', 'They add WiFi capability', 'They are extra CPU cores'],
                    explanation: 'The RP2040 has 8 PIO state machines (4 per PIO block) that can be programmed to implement custom I/O protocols independently of the CPU. They can generate precise timing signals, implement protocols like WS2812 (NeoPixel LEDs), DPI video output, or any custom protocol. PIO is unique to the RP2040 -- no other common microcontroller has this feature.'
                },
                {
                    question: 'How do you make a MicroPython script auto-run when the Pico powers on?',
                    options: ['Name it boot.py', 'Name it main.py', 'Name it autorun.py', 'It runs automatically regardless of filename'],
                    explanation: 'Save your script as main.py on the Pico\'s filesystem. When the Pico boots, MicroPython first runs boot.py (if it exists, for system configuration), then runs main.py. Your application code goes in main.py. To stop auto-running code, hold the Pico\'s BOOTSEL button while connecting, or use Thonny to interrupt the running script (Ctrl+C in the REPL).'
                },
                {
                    question: 'How does the Pico W onboard LED differ from the standard Pico?',
                    options: ['The Pico W has no LED', 'The LED is on GPIO 25 on both boards', 'The Pico W LED is connected to the wireless chip, not GPIO 25', 'The Pico W has an RGB LED'],
                    explanation: 'On the standard Pico, the onboard LED is connected to GPIO 25 (Pin(25, Pin.OUT)). On the Pico W, GPIO 25 is used by the wireless chip, so the LED was moved to the CYW43439 wireless chip. Access it with Pin("LED", Pin.OUT) in MicroPython. This is a common gotcha when porting code between Pico and Pico W.'
                },
                {
                    question: 'What ADC resolution does the RP2040 provide?',
                    options: ['8-bit (0-255)', '10-bit (0-1023)', '12-bit (0-4095)', '16-bit (0-65535)'],
                    explanation: 'The RP2040 has a 12-bit ADC giving values from 0 to 4095. However, MicroPython\'s read_u16() method scales this to 16-bit (0-65535) for consistency with other MicroPython platforms. Three ADC channels are available on GPIO 26, 27, and 28, plus an internal temperature sensor on ADC4. The reference voltage is 3.3V.'
                },
                {
                    question: 'What new feature does the RP2350 (Pico 2) chip introduce that is unique in the microcontroller space?',
                    options: ['WiFi support', 'Dual architecture: both ARM Cortex-M33 and RISC-V cores selectable at boot', 'GPU acceleration', 'Built-in display driver'],
                    explanation: 'The RP2350 includes both ARM Cortex-M33 and Hazard3 RISC-V cores. You choose which architecture to run at boot time. This makes the Pico 2 one of the first mainstream boards offering a RISC-V option. Other improvements: 520 KB SRAM (double RP2040), 150 MHz clock, hardware floating point, and security features including ARM TrustZone.'
                },
                {
                    question: 'What build system does the official Pico C/C++ SDK use?',
                    options: ['Make only', 'Autotools', 'CMake', 'Bazel'],
                    explanation: 'The Pico C/C++ SDK uses CMake as its build system. The workflow: write CMakeLists.txt, run "mkdir build && cd build && cmake .. && make", which produces a .uf2 file you flash via BOOTSEL. CMake is a meta-build system that generates Makefiles (or Ninja files) from a higher-level configuration. This is different from Arduino\'s simplified IDE-based build process.'
                },
                {
                    question: 'What is the approximate power consumption of the Pico W when WiFi is active?',
                    options: ['1 mA', '10 mA', '100 mA', '1 A'],
                    explanation: 'The Pico W draws approximately 100 mA when WiFi is actively transmitting/receiving. The Pico without WiFi draws about 20-25 mA at idle. For battery-powered projects, you should duty-cycle WiFi: enable it to transmit data, then disable it with wlan.active(False) between transmissions. This dramatically extends battery life in IoT sensor applications.'
                },
                {
                    question: 'Which statement about the Pico is true compared to an Arduino Uno?',
                    options: ['The Uno has more RAM', 'The Pico has dual cores and 132x more RAM than the Uno', 'The Uno is faster', 'The Pico cannot be programmed with C/C++'],
                    explanation: 'The Pico has dual Cortex-M0+ cores at 133 MHz with 264 KB SRAM. The Arduino Uno has a single ATmega328P at 16 MHz with 2 KB SRAM. That is 264 KB vs 2 KB -- 132 times more RAM. The Pico also supports MicroPython (Uno does not), has more GPIO pins, costs less ($4 vs $25+), and includes USB mass storage flashing. The Uno\'s advantage is its 5V logic and massive library ecosystem.'
                }
            ]
        });
        quiz.start();
    </script>
