    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 10: Pi Ecosystem & Models',
            description: 'Test your knowledge of the Raspberry Pi model lineup, specifications, HATs, operating systems, community resources, and choosing the right board for a project.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-10-quiz', moduleId: 'pv-f-10-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                {
                    question: 'What processor does the Raspberry Pi 5 use?',
                    options: ['BCM2837', 'BCM2711', 'BCM2712', 'RP2040'],
                    explanation: 'The Pi 5 uses the BCM2712 with a quad-core ARM Cortex-A76 at 2.4 GHz. This is 2-3x faster than the Pi 4\'s BCM2711 (Cortex-A72 at 1.8 GHz). The BCM2712 also adds PCIe 2.0 support for NVMe SSDs, a dedicated I/O controller chip (RP1), and a real-time clock. The RP2040 is the Pico\'s microcontroller, not an SBC chip.'
                },
                {
                    question: 'What is the maximum RAM available on a Raspberry Pi 5?',
                    options: ['2 GB', '4 GB', '8 GB', '16 GB'],
                    explanation: 'The Pi 5 is available in 4 GB and 8 GB RAM variants. This is LPDDR4X-4267 memory, significantly faster than the Pi 4\'s LPDDR4-3200. For desktop use, 8 GB is recommended. For headless servers, 4 GB is usually sufficient. The Pi 4 also offered a 2 GB variant that has been discontinued.'
                },
                {
                    question: 'What does HAT stand for in the Raspberry Pi ecosystem?',
                    options: ['Hardware Abstraction Tool', 'Hardware Attached on Top', 'High Availability Terminal', 'Hardware Access Technology'],
                    explanation: 'HAT stands for Hardware Attached on Top. HATs are add-on boards that connect to the Pi\'s 40-pin GPIO header. They include an EEPROM that identifies the board and can auto-configure drivers on boot. The Pi 5 introduced HAT+ with enhanced power management. HATs are standardized in size (65mm x 56.5mm) to match the Pi\'s form factor.'
                },
                {
                    question: 'Since which Pi model has the 40-pin GPIO header been standard?',
                    options: ['Pi 1 Model A', 'Pi 1 Model B+ (2014)', 'Pi 2 Model B', 'Pi 3 Model B'],
                    explanation: 'The 40-pin GPIO header was introduced with the Pi 1 Model B+ in 2014, expanding from the original 26-pin header. Every full-size Pi since then (Pi 2, 3, 4, 5, and Pi 400) uses the same 40-pin layout. This means HATs, wiring, and GPIO code designed for any 40-pin Pi work on all subsequent models. This backward compatibility is a key strength of the ecosystem.'
                },
                {
                    question: 'What is the Raspberry Pi 400?',
                    options: ['A 400 MHz overclocked Pi', 'A Pi 4 built into a keyboard form factor', 'A server rack version', 'The 400th Pi model produced'],
                    explanation: 'The Pi 400 integrates a Pi 4 (4 GB) into a compact keyboard. Add a monitor, mouse, and power supply and you have a complete computer. It runs at a slightly higher clock speed than the standard Pi 4 (1.8 GHz) due to better thermal management in the keyboard enclosure. It is ideal for classrooms and desktop use where a single integrated unit is preferred.'
                },
                {
                    question: 'What is the purpose of the Compute Module line?',
                    options: ['Gaming', 'Providing a Pi in an SO-DIMM form factor for embedding in commercial products', 'Education only', 'Running cluster computing'],
                    explanation: 'Compute Modules package Pi hardware (currently CM4 and CM5) in an SO-DIMM form factor without ports or connectors. Companies design custom carrier boards with exactly the ports and connectors their product needs. This is how Pi hardware appears in industrial equipment, digital signage, networking appliances, and other commercial products. eMMC storage options provide more reliable storage than SD cards.'
                },
                {
                    question: 'Which operating system is officially recommended for general Raspberry Pi use?',
                    options: ['Ubuntu', 'Fedora', 'Raspberry Pi OS (Debian-based)', 'Arch Linux ARM'],
                    explanation: 'Raspberry Pi OS is the official operating system, maintained by the Raspberry Pi Foundation. It is based on Debian Linux and comes in three variants: Desktop (with GUI), Lite (headless, no GUI), and Full (desktop with recommended applications pre-installed). It has the best driver support and is tested on every Pi model. Ubuntu, Fedora, and others also work but are third-party options.'
                },
                {
                    question: 'What tool is used to flash operating system images to SD cards for the Pi?',
                    options: ['dd command only', 'Raspberry Pi Imager', 'NOOBS', 'Format utility'],
                    explanation: 'Raspberry Pi Imager is the official, recommended tool for flashing OS images. It runs on Windows, macOS, and Linux. It provides a graphical interface to select an OS, target SD card, and advanced options (WiFi pre-configuration, SSH enable, hostname, locale). NOOBS was the previous installer but is now deprecated. The dd command works but is error-prone and has no verification.'
                },
                {
                    question: 'What is the Sense HAT used for?',
                    options: ['Audio output', 'Motor control', 'Environmental sensing (temperature, humidity, pressure) plus an 8x8 LED matrix and IMU', 'Network routing'],
                    explanation: 'The Sense HAT includes an 8x8 RGB LED matrix, a five-button joystick, and sensors for temperature, humidity, barometric pressure, accelerometer, gyroscope, and magnetometer. It was designed for the Astro Pi project, where Raspberry Pi computers with Sense HATs are installed on the International Space Station. Students write code that runs in space using these sensors.'
                },
                {
                    question: 'What power supply does the Raspberry Pi 5 require?',
                    options: ['5V 2A micro-USB', '5V 3A USB-C', '27W USB-C Power Delivery (5V 5A)', '12V DC barrel jack'],
                    explanation: 'The Pi 5 requires a 27W USB-C PD (Power Delivery) supply providing 5V at 5A. This is more than the Pi 4 (15W, 5V 3A). Under-voltage causes throttling, instability, and USB device failures. The official Pi 5 power supply is recommended. Standard phone chargers (5V 2A) are NOT sufficient for the Pi 5 and will cause immediate problems under load.'
                },
                {
                    question: 'Which Pi model is best suited for a battery-powered IoT sensor node?',
                    options: ['Pi 5 (8 GB)', 'Pi 4 Model B', 'Pico W', 'Pi 400'],
                    explanation: 'The Pico W is ideal for battery-powered IoT: it draws milliamps of power (vs watts for Pi 4/5), boots instantly, costs $6, has WiFi for data transmission, and runs MicroPython for easy sensor programming. The Pi 5, Pi 4, and Pi 400 all run Linux, draw watts of power, and are overkill for simple sensor reading and data transmission tasks.'
                },
                {
                    question: 'What is the PCIe 2.0 interface on the Pi 5 primarily used for?',
                    options: ['Connecting a GPU', 'Connecting NVMe SSD storage via an M.2 HAT', 'Adding more RAM', 'Connecting a display'],
                    explanation: 'The Pi 5\'s PCIe 2.0 x1 interface is primarily used to connect NVMe SSDs via an M.2 HAT+. NVMe storage is dramatically faster than microSD cards (sequential reads: ~800 MB/s vs ~45 MB/s). This makes the Pi 5 viable as a desktop replacement for the first time. The PCIe interface can also be used for other PCIe devices, though NVMe SSDs are the most common use case.'
                },
                {
                    question: 'What is Pi-hole?',
                    options: ['A physical hole drilled in the Pi board', 'A DNS-level network ad blocker that runs on a Raspberry Pi', 'A cooling solution', 'A programming language'],
                    explanation: 'Pi-hole is a network-wide ad blocker that runs on a Raspberry Pi. It acts as a DNS server, filtering out advertising and tracking domains before they reach any device on your network. Set your router\'s DNS to your Pi\'s IP address and every device benefits automatically -- no per-device configuration needed. It runs well on even a Pi Zero W, making it a popular $10 network upgrade.'
                },
                {
                    question: 'What is the difference between the Pi Zero 2 W and the original Pi Zero W?',
                    options: ['The Zero 2 W has no WiFi', 'The Zero 2 W has a quad-core processor (5x faster) in the same form factor', 'They are identical', 'The Zero 2 W is larger'],
                    explanation: 'The Pi Zero 2 W upgrades from a single-core ARM1176 (1 GHz) to a quad-core Cortex-A53 (1 GHz) -- the same SoC as the Pi 3. This gives approximately 5x the processing power in the same 65x30mm form factor with the same WiFi/BLE connectivity. The price is $15, same as the original Zero W. For nearly all use cases, the Zero 2 W is the correct choice over the original.'
                },
                {
                    question: 'Approximately how many Raspberry Pi units have been sold worldwide since 2012?',
                    options: ['1 million', '10 million', 'Over 60 million', '500 million'],
                    explanation: 'Over 60 million Raspberry Pi units have been sold since the original Model B launched in 2012. This makes it one of the best-selling computers of all time. The combination of low cost, open-source software, extensive documentation, and a massive community has driven adoption in education, industry, hobbyist projects, and commercial products worldwide.'
                }
            ]
        });
        quiz.start();
    </script>
