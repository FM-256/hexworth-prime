    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Meet the Raspberry Pi',
            description: 'Test your understanding of Pi hardware, SoC architecture, models, GPIO, and use cases.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-f-01-quiz',
            moduleId: 'pv-f-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {
                    question: 'What type of device is a Raspberry Pi?',
                    options: ['A microcontroller like Arduino', 'A single-board computer (SBC)', 'A network router', 'A graphics processing unit'],
                    explanation: 'A Raspberry Pi is a single-board computer -- a complete computer on one circuit board. It runs a full Linux operating system with multitasking, a file system, networking, and a desktop environment. Unlike a microcontroller (Arduino), it has an OS, a file system, and can run multiple programs simultaneously.'
                },
                {
                    question: 'What does SoC stand for in the context of Raspberry Pi hardware?',
                    options: ['System on Chip', 'Serial over Cable', 'Standard Operating Configuration', 'Secure Output Channel'],
                    explanation: 'SoC stands for System on Chip. The Raspberry Pi uses a Broadcom SoC that integrates the CPU, GPU, and memory controller on a single silicon die. This is the same architectural approach used in smartphones and tablets -- everything on one chip instead of separate components like in a desktop PC.'
                },
                {
                    question: 'Which SoC does the Raspberry Pi 5 use?',
                    options: ['BCM2711', 'BCM2712', 'RP3A0', 'ATmega328P'],
                    explanation: 'The Raspberry Pi 5 uses the Broadcom BCM2712 SoC with quad-core ARM Cortex-A76 processors at 2.4 GHz. The BCM2711 is used in the Pi 4, the RP3A0 is the Pi Zero 2 W SoC, and the ATmega328P is the Arduino Uno microcontroller -- not a Raspberry Pi chip at all.'
                },
                {
                    question: 'How many pins does the Raspberry Pi GPIO header have?',
                    options: ['20', '26', '40', '54'],
                    explanation: 'The Raspberry Pi GPIO header has 40 pins. This has been the standard since the Model B+ in 2014. The 40 pins include power pins (3.3V, 5V, GND), 26 programmable GPIO pins, and dedicated pins for I2C, SPI, UART, and PWM communication protocols.'
                },
                {
                    question: 'What voltage logic level do Raspberry Pi GPIO pins use?',
                    options: ['1.8V', '3.3V', '5V', '12V'],
                    explanation: 'Raspberry Pi GPIO pins use 3.3V logic. This is critical to remember: connecting a 5V signal directly to any GPIO pin will permanently damage the SoC. There is no built-in overvoltage protection. When interfacing with 5V devices (like some Arduino outputs), you must use a level shifter or voltage divider.'
                },
                {
                    question: 'What type of CPU architecture does the Raspberry Pi use?',
                    options: ['x86 (Intel/AMD)', 'ARM', 'MIPS', 'RISC-V'],
                    explanation: 'The Raspberry Pi uses ARM architecture -- specifically ARMv8 (64-bit) in current models. ARM stands for Advanced RISC Machine. It is the same architecture used in smartphones, tablets, and Apple Silicon Macs. ARM processors are energy efficient, which is why the Pi can run on 5-15 watts compared to 65-250 watts for a desktop x86 CPU.'
                },
                {
                    question: 'Which Pi model is designed for embedded and space-constrained projects at $15?',
                    options: ['Raspberry Pi 5', 'Raspberry Pi 4 Model B', 'Pi Zero 2 W', 'Raspberry Pi Pico'],
                    explanation: 'The Pi Zero 2 W costs $15 and is designed for embedded and space-constrained projects. It has a quad-core Cortex-A53 at 1.0 GHz, 512 MB RAM, Wi-Fi 4, and Bluetooth 4.2. It is much smaller than the full-size Pi 4/5 and uses less power, making it ideal for IoT devices, wearables, and situations where desktop performance is not needed.'
                },
                {
                    question: 'What is the primary difference between a Raspberry Pi and an Arduino?',
                    options: ['Arduino is more expensive', 'Pi runs a full OS; Arduino runs one program in a loop', 'Arduino has more GPIO pins', 'Pi cannot connect to the internet'],
                    explanation: 'The fundamental difference is that a Raspberry Pi runs a full Linux operating system with multitasking, a file system, and networking, while an Arduino is a microcontroller that runs exactly one program in an infinite loop with no OS, no file system, and no multitasking. The Pi is a computer; the Arduino is a controller. Many projects use both together.'
                },
                {
                    question: 'What year was the first Raspberry Pi released?',
                    options: ['2005', '2010', '2012', '2015'],
                    explanation: 'The first Raspberry Pi (Model B) was released in February 2012. It had an ARM11 processor at 700 MHz, 256 MB RAM, and cost $35. It sold 100,000 units on launch day. The Pi was created by the Raspberry Pi Foundation, a UK charity founded by Eben Upton, to address declining interest in computer science education.'
                },
                {
                    question: 'What does the RP1 chip on the Pi 5 do?',
                    options: ['It is the main CPU', 'It is a dedicated I/O controller (southbridge) for USB and Ethernet', 'It manages the Wi-Fi and Bluetooth radios', 'It is the GPU for video output'],
                    explanation: 'The RP1 is a dedicated I/O controller chip (southbridge) designed by Raspberry Pi. It connects to the BCM2712 SoC via PCIe 2.0 and handles USB 3.0, Gigabit Ethernet, and GPIO. This offloads I/O from the SoC and is the first time a Pi has used a PCIe bus. It is not the CPU (that is the BCM2712) or the GPU (that is the VideoCore VII inside the SoC).'
                },
                {
                    question: 'What type of storage does the Raspberry Pi primarily boot from?',
                    options: ['Internal SSD', 'USB flash drive', 'microSD card', 'Network (PXE) only'],
                    explanation: 'The Raspberry Pi primarily boots from a microSD card inserted into a slot on the underside of the board. The operating system, your files, and all software live on this card. Pi 4 and Pi 5 also support USB boot (for SSDs) and network boot (PXE), but microSD is the default and most common method. Use A1 or A2 rated cards for acceptable random I/O performance.'
                },
                {
                    question: 'What is GPIO used for on the Raspberry Pi?',
                    options: ['Graphics Processing Output for video rendering', 'General Purpose Input/Output for connecting sensors, LEDs, motors, and other hardware', 'Global Power Override for battery management', 'Guided Programming Operations for debugging'],
                    explanation: 'GPIO stands for General Purpose Input/Output. These are programmable pins on the 40-pin header that can be set as inputs (reading sensor data, button presses) or outputs (controlling LEDs, motors, relays). GPIO is what makes the Pi a hardware platform, not just a small PC. You can read temperature sensors, drive servo motors, control displays, and interact with the physical world through these pins.'
                },
                {
                    question: 'Which communication protocol uses two wires (SDA and SCL) and can connect multiple devices?',
                    options: ['SPI', 'I2C', 'UART', 'USB'],
                    explanation: 'I2C (Inter-Integrated Circuit) uses two wires: SDA (data) and SCL (clock). Multiple devices can share the same two wires, each identified by a unique 7-bit address. This makes I2C ideal for connecting many sensors and displays with minimal wiring. SPI is faster but uses more wires. UART is point-to-point. USB is a different protocol entirely with its own connectors.'
                },
                {
                    question: 'How much power does the Raspberry Pi 5 require?',
                    options: ['5V / 1A via micro USB', '5V / 3A via USB-C', '5V / 5A via USB-C', '12V / 2A via barrel jack'],
                    explanation: 'The Raspberry Pi 5 requires a 5V / 5A power supply via USB-C (27W). This is more than the Pi 4 (5V / 3A) because the Pi 5 has a faster CPU, the RP1 I/O controller, and supports PCIe peripherals. Using an underpowered supply causes throttling, USB device failures, and potential SD card corruption. The official Raspberry Pi 27W USB-C power supply is recommended.'
                },
                {
                    question: 'What was the original goal of the Raspberry Pi Foundation when creating the Pi?',
                    options: ['To compete with Intel and AMD in the desktop market', 'To create a cheap gaming console', 'To make computing accessible and affordable for education', 'To build a platform for cryptocurrency mining'],
                    explanation: 'The Raspberry Pi Foundation is a UK-based charity. Its original goal was to make computing accessible and affordable for education, specifically to address declining interest and skills in computer science among students applying to study at Cambridge. The $35 price point was chosen to be affordable enough for schools and individual students worldwide. Over 60 million units have been sold, and education remains the foundation\'s primary mission.'
                }
            ]
        });

    </script>
