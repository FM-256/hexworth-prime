    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: Introducing C on Linux',
            description: 'Test your understanding of C programming fundamentals -- gcc compilation, variables, printf, pointers, arrays, structs, memory management, and Makefiles.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-08-quiz', moduleId: 'pv-f-08-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                {
                    question: 'What command compiles a C file named sensor.c into an executable called sensor?',
                    options: ['cc sensor.c', 'gcc sensor.c -o sensor', 'compile sensor.c sensor', 'gcc -o sensor.c sensor'],
                    explanation: 'gcc sensor.c -o sensor compiles the source file and names the output binary "sensor". The -o flag specifies the output filename. Without -o, gcc defaults to creating "a.out". The order of flags matters: -o must be followed by the desired output name, and the source file can appear before or after the flags.'
                },
                {
                    question: 'What does the #include <stdio.h> directive do?',
                    options: ['Imports the stdio Python module', 'Tells the preprocessor to insert the contents of the standard I/O header file', 'Creates a new file called stdio.h', 'Starts the main function'],
                    explanation: '#include is a preprocessor directive that copies the entire contents of the specified header file into your source code before compilation. <stdio.h> provides declarations for printf(), scanf(), fprintf(), fopen(), and other I/O functions. Angle brackets (<>) search system include directories; quotes ("") search the current directory first.'
                },
                {
                    question: 'What is the size of an int on a 32-bit Raspberry Pi (ARM)?',
                    options: ['1 byte', '2 bytes', '4 bytes', '8 bytes'],
                    explanation: 'On 32-bit ARM (and most modern architectures), int is 4 bytes (32 bits), giving a range of approximately -2.1 billion to 2.1 billion. On 64-bit Pi OS, int is still 4 bytes (long becomes 8 bytes). The C standard only guarantees int is at least 16 bits -- the actual size depends on the architecture. Use sizeof(int) to check.'
                },
                {
                    question: 'What format specifier prints a double with exactly 2 decimal places?',
                    options: ['%d', '%2f', '%.2f', '%f2'],
                    explanation: '%.2f formats a floating-point value with exactly 2 digits after the decimal point. The dot followed by a number specifies precision. %f without precision defaults to 6 decimal places. Other examples: %.0f (no decimals, rounded), %.4f (4 decimal places), %10.2f (field width 10, 2 decimals, right-aligned).'
                },
                {
                    question: 'What does the & operator do when placed before a variable name?',
                    options: ['Performs bitwise AND', 'Returns the memory address of the variable', 'Multiplies the variable by 2', 'Checks if the variable is NULL'],
                    explanation: 'The & (address-of) operator returns the memory address where a variable is stored. This is what you assign to a pointer: int x = 42; int *ptr = &x; Now ptr holds the address of x. In a different context (between two values), & performs bitwise AND. The meaning depends on whether it is unary (one operand) or binary (two operands).'
                },
                {
                    question: 'What happens when you access array index 10 in a 5-element C array?',
                    options: ['The compiler throws an error', 'It returns 0', 'Undefined behavior -- reads random memory, may crash', 'The array automatically grows'],
                    explanation: 'C performs no bounds checking on array access. Accessing beyond the array reads whatever happens to be at that memory location -- could be another variable, could be garbage, could cause a segmentation fault. Writing past the end is even worse: it corrupts adjacent memory (buffer overflow). This is a major source of security vulnerabilities in C programs.'
                },
                {
                    question: 'What is the null terminator in a C string?',
                    options: ['The letter N', 'The number 0', 'The character \'\\0\' (byte value 0)', 'A special pointer'],
                    explanation: 'Every C string ends with \'\\0\' (the null character, byte value 0). String functions like strlen(), strcpy(), and printf("%s") scan forward in memory until they find this terminator. If the null terminator is missing, these functions read past the end of the buffer into random memory. The string "Pi" is stored as {\'P\', \'i\', \'\\0\'} -- 3 bytes, not 2.'
                },
                {
                    question: 'What is the difference between malloc() and declaring a local variable?',
                    options: ['There is no difference', 'malloc allocates on the heap (persistent), local variables live on the stack (temporary)', 'malloc is faster', 'Local variables use more memory'],
                    explanation: 'Local variables are allocated on the stack when the function is called and automatically destroyed when it returns. malloc() allocates memory on the heap, which persists until explicitly freed with free(). Use malloc when the size is determined at runtime, when data must outlive the function, or when the data is too large for the stack. Always pair malloc with free.'
                },
                {
                    question: 'What does the arrow operator (->) do in C?',
                    options: ['Compares two values', 'Accesses a struct member through a pointer', 'Creates a new pointer', 'Returns from a function'],
                    explanation: 'The arrow operator (->) accesses a struct member through a pointer. It is shorthand for (*ptr).member. Example: Sensor *sp = &dht; sp->temperature = 23.1; Without the arrow, you would write (*sp).temperature = 23.1; which is more verbose. The arrow is used extensively in linked lists, trees, and any code that works with struct pointers.'
                },
                {
                    question: 'What does the gcc flag -Wall do?',
                    options: ['Links the math library', 'Enables all compiler warnings', 'Compiles for all architectures', 'Creates a wall of text output'],
                    explanation: '-Wall enables all common compiler warnings: unused variables, type mismatches, missing return values, implicit function declarations, and many more. Warnings often reveal bugs that would otherwise be silent. Best practice: always compile with -Wall -Wextra. Fix every warning before testing. In professional C development, warnings are treated as errors (-Werror).'
                },
                {
                    question: 'What is the purpose of typedef in a struct definition?',
                    options: ['It makes the struct faster', 'It creates a type alias so you can use a shorter name', 'It makes the struct global', 'It adds type checking'],
                    explanation: 'typedef struct { ... } Name; creates a type alias. Without typedef, you must write "struct Name variable;" every time. With typedef, you write "Name variable;" -- shorter and cleaner. typedef does not change the struct itself; it just gives the type a convenient name. This is standard practice in C codebases, including the Linux kernel.'
                },
                {
                    question: 'What tool detects memory leaks in C programs on the Raspberry Pi?',
                    options: ['gcc', 'gdb', 'valgrind', 'make'],
                    explanation: 'valgrind is a dynamic analysis tool that detects memory leaks, use-after-free, buffer overflows, and uninitialized memory reads. Run it with: valgrind ./myprogram. It reports exactly where each allocation was made and whether it was freed. gdb is the debugger (step through code), gcc is the compiler, make is the build tool. Use all four together for C development.'
                },
                {
                    question: 'In a Makefile, what does the "clean" target typically do?',
                    options: ['Compiles all source files', 'Deletes compiled object files and executables', 'Formats the source code', 'Updates the compiler'],
                    explanation: 'The "clean" target is a convention for removing all generated files (object files .o, executables, temporary files). Running "make clean" resets the build directory to source-only state. This is useful when switching compiler flags, debugging build issues, or preparing for a fresh build. Clean targets use rm -f to avoid errors if files do not exist.'
                },
                {
                    question: 'What is the primary advantage of C over Python for Raspberry Pi hardware projects?',
                    options: ['Easier syntax', 'Larger standard library', 'Direct hardware access and 10-100x faster execution', 'Better string handling'],
                    explanation: 'C compiles to native machine code that runs directly on the CPU -- no interpreter overhead. This gives 10-100x speed improvement over Python for computation. C also provides direct memory and hardware access through pointers, which is how you control GPIO registers, DMA, and memory-mapped peripherals at the lowest level. Python is better for rapid development; C is better for performance.'
                },
                {
                    question: 'What is the return value of main() in a C program when it executes successfully?',
                    options: ['1', '-1', '0', 'NULL'],
                    explanation: 'By convention, main() returns 0 to indicate successful execution. Any non-zero return value indicates an error. The operating system reads this return code -- shell scripts use $? to check it, and parent processes use wait() to read it. Common error codes: 1 for general errors, 2 for misuse of commands. The C standard defines EXIT_SUCCESS (0) and EXIT_FAILURE (1) in <stdlib.h>.'
                }
            ]
        });
        quiz.start();
    </script>
