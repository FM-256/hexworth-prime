    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: First Boot',
            description: 'Test your knowledge of Pi Imager, SD card flashing, OS editions, peripherals, and headless setup.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-f-02-quiz', moduleId: 'pv-f-02-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is Raspberry Pi Imager?', options: ['The Pi\'s built-in operating system', 'The official tool for writing OS images to microSD cards', 'A camera application for the Pi camera module', 'A disk cloning utility for backing up the Pi'], explanation: 'Raspberry Pi Imager is the official tool for downloading and writing operating system images to microSD cards. It runs on your main computer (Windows, macOS, or Linux), not on the Pi itself. It replaces the old workflow of manually downloading .img files and using third-party tools like balenaEtcher. Imager handles download, pre-configuration, writing, and verification in a single workflow.' },
                { question: 'Which Raspberry Pi OS edition is recommended for first-time users?', options: ['Raspberry Pi OS Lite', 'Raspberry Pi OS with desktop', 'Raspberry Pi OS with desktop and recommended software', 'Ubuntu Server for Pi'], explanation: 'Raspberry Pi OS with desktop and recommended software (~2.5 GB) is recommended for first-time users. It includes the full desktop environment plus pre-installed applications like LibreOffice, Thonny (Python IDE), Scratch 3, Chromium, and VLC. This gives beginners everything they need without having to install additional software manually.' },
                { question: 'What is Raspberry Pi OS Lite designed for?', options: ['Users who want the best graphics performance', 'Headless servers, IoT devices, and command-line-only use', 'Gaming and multimedia', 'Educational use in classrooms'], explanation: 'Raspberry Pi OS Lite (~450 MB) has no desktop environment -- it boots directly to a command-line interface. It is designed for headless servers (Pi-hole, web servers), IoT devices, and network appliances where a GUI is unnecessary overhead. It has the smallest footprint and fastest boot time of all three editions.' },
                { question: 'What is the minimum recommended microSD card size for Raspberry Pi OS with desktop?', options: ['8 GB', '16 GB', '32 GB', '64 GB'], explanation: '32 GB is the recommended minimum for Raspberry Pi OS with desktop. The OS image itself is about 2.5 GB (with recommended software), but you need room for updates, applications, and your own files. A1 or A2 Application Performance Class rating is important for random I/O performance, which affects boot speed and application launch times.' },
                { question: 'What does the A1/A2 rating on a microSD card indicate?', options: ['Maximum sequential write speed', 'Application Performance Class -- random I/O speed', 'Audio/video recording capability', 'Adapter compatibility level'], explanation: 'A1 and A2 are Application Performance Class ratings that guarantee minimum random read/write IOPS (Input/Output Operations Per Second). The Pi reads thousands of small files during boot and app launches, so random I/O performance matters more than sequential speed. A1 guarantees 1500/500 IOPS read/write; A2 guarantees 4000/2000 IOPS.' },
                { question: 'What does the gear icon in Raspberry Pi Imager open?', options: ['Hardware diagnostics', 'Advanced settings for pre-configuring hostname, SSH, Wi-Fi, and locale', 'A list of compatible Pi models', 'Boot repair tools'], explanation: 'The gear icon opens Imager\'s advanced settings (also called OS Customisation). Here you can pre-configure hostname, SSH access, Wi-Fi credentials, username/password, locale, and timezone before writing the image. These settings are injected into the image so they take effect on first boot -- essential for headless setup where you have no monitor or keyboard.' },
                { question: 'In what order should you connect peripherals to the Pi?', options: ['Power first, then peripherals', 'Any order -- it does not matter', 'Peripherals first, power last', 'Ethernet first, then HDMI, then power'], explanation: 'Connect all peripherals before power. The HDMI handshake happens during boot -- if the monitor is not connected when the Pi powers on, it may not output video. The correct order is: insert microSD, connect HDMI, connect keyboard/mouse, optionally connect Ethernet, then connect the USB-C power supply last. Power is always the last cable in and first cable out.' },
                { question: 'What do the LED indicators on the Pi board mean?', options: ['Red = error, Green = normal', 'Red = power is connected, Green = SD card activity', 'Red = overheating, Green = CPU active', 'Both LEDs should be steady green for normal operation'], explanation: 'The red LED indicates that power is connected and the board is receiving voltage. The green LED indicates SD card activity -- it flickers when the Pi is reading from or writing to the microSD card. During boot, the green LED flickers rapidly. A solid red LED with no green activity usually means the SD card is not readable (missing, corrupted, or incorrectly flashed).' },
                { question: 'What is headless setup?', options: ['Running the Pi without a case', 'Accessing the Pi remotely without a monitor or keyboard connected', 'Using the Pi without an SD card', 'Running the Pi in CLI mode instead of desktop mode'], explanation: 'Headless setup means configuring and using the Pi without a monitor, keyboard, or mouse connected. You pre-configure SSH and Wi-Fi in Imager\'s advanced settings, boot the Pi with just power and a network connection, then access it remotely via SSH from another computer. This is the standard approach for servers and IoT deployments.' },
                { question: 'What command connects to a Pi via SSH from another computer?', options: ['ping piverse.local', 'ssh pi@piverse.local', 'telnet piverse.local', 'vnc piverse.local'], explanation: 'The command ssh pi@piverse.local connects to the Pi via Secure Shell. Replace "pi" with your username and "piverse" with your hostname. SSH provides an encrypted terminal session over the network. On first connection, you accept the host key fingerprint and enter your password. For passwordless login, you can later set up SSH key authentication.' },
                { question: 'What happens during the Pi\'s very first boot that makes it slower than subsequent boots?', options: ['The CPU runs a self-test', 'The filesystem is expanded, SSH keys are generated, and updates may download', 'The bootloader is installed from the SD card', 'The GPU firmware is compiled from source'], explanation: 'On first boot, the Pi performs several one-time tasks: the root filesystem is expanded to fill the entire SD card (it ships compressed), SSH host keys are generated (unique to this installation), and if configured, the first-run wizard downloads and installs software updates. This can take 1-3 minutes versus 15-30 seconds for a normal boot.' },
                { question: 'What is the correct command to safely shut down a Raspberry Pi?', options: ['Just unplug the power cable', 'sudo shutdown -h now', 'sudo reboot', 'poweroff from the desktop menu only'], explanation: 'sudo shutdown -h now safely halts the system, flushes all pending disk writes, unmounts filesystems, and stops all services before powering off. Never just pull the power cable -- the Pi runs Linux with a journaling filesystem that can be corrupted by sudden power loss, especially during writes. Wait for the green LED to stop flashing before disconnecting power. sudo reboot restarts the system, it does not shut down.' },
                { question: 'What command updates all installed packages on the Pi?', options: ['sudo apt install updates', 'sudo apt update && sudo apt full-upgrade -y', 'sudo update-all', 'sudo raspi-config update'], explanation: 'sudo apt update refreshes the local package index (what versions are available), and sudo apt full-upgrade -y downloads and installs all available upgrades. The -y flag automatically answers "yes" to prompts. This two-step process is standard Debian/Ubuntu package management. Always run apt update first -- without it, apt does not know about the latest package versions.' },
                { question: 'Which Raspberry Pi OS release is current as of 2024?', options: ['Debian 10 "Buster"', 'Debian 11 "Bullseye"', 'Debian 12 "Bookworm"', 'Debian 13 "Trixie"'], explanation: 'The current Raspberry Pi OS is based on Debian 12 "Bookworm." It introduced Wayland (Wayfire compositor) as the default display server, replacing X11/Openbox, and uses NetworkManager for network configuration. Buster and Bullseye were previous releases. Each Debian release brings updated packages, security patches, and new features.' },
                { question: 'Why is the default pi/raspberry password no longer available on Raspberry Pi OS?', options: ['It was causing compatibility issues with certain software', 'It was removed in 2022 for security reasons -- you must set your own password', 'The username "pi" is now reserved for system processes', 'Raspberry Pi Foundation requires paid accounts now'], explanation: 'The default pi/raspberry username and password were removed in April 2022 for security. Having a well-known default password made every Pi on the internet vulnerable to brute-force SSH attacks. Now, the first-boot wizard (or Imager\'s advanced settings) requires you to create a username and password. This is a critical security improvement for any Pi exposed to a network.' }
            ]
        });
        quiz.start();
    </script>
