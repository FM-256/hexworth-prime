        <a href="../../../index.html">&larr; Back to PiVerse</a>
        <span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 6: Visual Programming with Scratch',
            description: 'Test your understanding of Scratch 3, block-based programming, events, loops, conditionals, variables, sprites, broadcasts, and game design patterns.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-f-06-quiz',
            moduleId: 'pv-f-06-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {
                    question: 'What type of block starts every Scratch script?',
                    options: ['A stack block', 'A reporter block', 'A hat block (event block)', 'A boolean block'],
                    explanation: 'Hat blocks are the event blocks that sit at the top of every script stack. They have a rounded top edge and define when the script below them should execute. Examples include "when green flag clicked" and "when I receive [message]". Without a hat block, a script cannot run.'
                },
                {
                    question: 'What is the coordinate system of the Scratch stage?',
                    options: ['x: 0 to 480, y: 0 to 360', 'x: -240 to 240, y: -180 to 180', 'x: -100 to 100, y: -100 to 100', 'x: 0 to 360, y: 0 to 240'],
                    explanation: 'The Scratch stage is 480 pixels wide and 360 pixels tall. The center is (0, 0). The x-axis ranges from -240 (left edge) to 240 (right edge). The y-axis ranges from -180 (bottom) to 180 (top). Understanding this coordinate system is essential for positioning sprites.'
                },
                {
                    question: 'Which Scratch loop runs indefinitely until the program is stopped?',
                    options: ['repeat (10)', 'repeat until <>', 'forever', 'while'],
                    explanation: 'The "forever" block runs its enclosed blocks continuously until the stop button is pressed or a "stop [all]" block executes. It is equivalent to "while True:" in Python or "while(1){}" in C. Most game loops use a forever block to check inputs and update the game every frame.'
                },
                {
                    question: 'What happens when multiple scripts with "when green flag clicked" exist on the same sprite?',
                    options: ['Only the first script runs', 'Only the last script runs', 'All scripts run simultaneously (concurrency)', 'The program crashes'],
                    explanation: 'Scratch supports concurrency. When the green flag is clicked, ALL scripts with that event block begin executing simultaneously. Each script stack runs independently. This is real parallel execution -- the same concept used in operating systems and web servers, implemented visually.'
                },
                {
                    question: 'What is the purpose of a broadcast in Scratch?',
                    options: ['To play a sound effect', 'To send a message that other sprites can receive and respond to', 'To display text on the stage', 'To change the backdrop'],
                    explanation: 'Broadcasts are Scratch\'s message-passing system. When a sprite broadcasts a message, any sprite with a "when I receive [message]" block will execute its response script. This enables inter-sprite communication without sprites needing to know about each other -- a pattern called the Observer pattern in software engineering.'
                },
                {
                    question: 'What is the difference between "broadcast [message]" and "broadcast [message] and wait"?',
                    options: ['There is no difference', '"and wait" pauses the sender until all receivers finish', '"and wait" sends the message twice', '"and wait" only sends to one sprite'],
                    explanation: '"broadcast [message]" sends the message and the sender continues executing its next block immediately. "broadcast [message] and wait" sends the message and pauses the sender until ALL receiving scripts have finished executing. Use "and wait" for sequences where order matters, like cutscenes or level transitions.'
                },
                {
                    question: 'In Scratch, what scope options are available when creating a variable?',
                    options: ['Global only', 'Local only', '"For all sprites" (global) or "For this sprite only" (local)', 'Public and private'],
                    explanation: 'When you create a variable in Scratch, you choose between "For all sprites" (global -- accessible by every sprite) and "For this sprite only" (local -- only this sprite can read/write it). This teaches the concept of variable scope that carries directly into Python (global vs local) and C (global vs function-scoped).'
                },
                {
                    question: 'How do you create animation in Scratch?',
                    options: ['Use the "animate" block', 'Switch between costumes rapidly using "next costume" in a loop', 'Import a GIF file', 'Use the motion extension'],
                    explanation: 'Animation in Scratch is achieved by giving a sprite multiple costumes and rapidly switching between them using the "next costume" block inside a loop with a short wait. Each costume is a frame of the animation. This is the same frame-by-frame animation technique used in professional games and video.'
                },
                {
                    question: 'What does the "create clone of [myself]" block do?',
                    options: ['Duplicates the sprite in the sprite pane', 'Creates a runtime copy of the sprite that executes independently', 'Saves a backup of the sprite', 'Creates a new costume'],
                    explanation: 'Cloning creates a runtime instance of the sprite. The clone appears on the stage with its own position, variables, and execution state. Use "when I start as a clone" to give clones behavior. Clones are destroyed with "delete this clone". This is equivalent to object instantiation in Python/C++ -- each clone is an independent instance.'
                },
                {
                    question: 'Which block category contains the "if <> then / else" conditional?',
                    options: ['Operators', 'Sensing', 'Control', 'Events'],
                    explanation: 'Conditional blocks (if/then, if/then/else, repeat, forever, wait, stop) are all in the Control category (orange blocks). The Control category handles program flow -- when to execute, when to repeat, when to stop. Operators provide the boolean conditions that go inside the diamond-shaped slots.'
                },
                {
                    question: 'What is the text-code equivalent of Scratch\'s "repeat (10)" block?',
                    options: ['while True: (Python)', 'for i in range(10): (Python)', 'if count == 10: (Python)', 'def repeat(10): (Python)'],
                    explanation: '"repeat (10)" runs the enclosed blocks exactly 10 times, then stops. In Python, this is "for i in range(10):". In C, it is "for(int i=0; i<10; i++){}". The concept is a counted loop -- you know in advance how many iterations you want. The "forever" block, by contrast, maps to "while True:" (infinite loop).'
                },
                {
                    question: 'What type of value do Scratch\'s hexagonal blocks return?',
                    options: ['A string', 'A number', 'A boolean (true/false)', 'A list'],
                    explanation: 'Hexagonal (diamond-shaped) blocks in Scratch return boolean values -- true or false. They fit into hexagonal slots in conditional and loop blocks. Examples: "touching [mouse-pointer]?", "key [space] pressed?", "<(score) > (10)>". Rounded blocks return numbers or strings. The shape of the block tells you its return type.'
                },
                {
                    question: 'How would you implement a game-over condition in Scratch?',
                    options: ['Delete the project', 'Use "if <(lives) = 0> then broadcast [game over]"', 'Close the browser', 'There is no way to end a Scratch program'],
                    explanation: 'Check the lives variable inside a forever loop. When lives reaches 0, broadcast "game over". All sprites receive the broadcast and can respond: hide themselves, stop their loops, or show a game-over screen. This pattern separates the detection (one sprite checks) from the response (all sprites react), which is clean modular design.'
                },
                {
                    question: 'What is the purpose of the "wait (1) seconds" block inside a loop?',
                    options: ['It makes the program crash', 'It controls the speed of execution, preventing instant completion', 'It saves battery', 'It is required for all loops'],
                    explanation: 'Without a wait block, loops execute as fast as possible -- a "repeat (100) move 10 steps" would appear instant because the sprite teleports to the final position. Adding "wait (0.1) seconds" between iterations creates visible animation. The wait duration controls the speed: smaller wait = faster movement. This is the same concept as frame rate in game development.'
                },
                {
                    question: 'Which sensing block detects physical contact between sprites?',
                    options: ['distance to [sprite]', 'touching [sprite]?', 'mouse x', 'answer'],
                    explanation: '"touching [sprite]?" returns true if the current sprite is touching (overlapping) the specified sprite. This is collision detection -- the foundation of game mechanics. Check it inside a forever loop: "if <touching [enemy]?> then change [lives] by (-1)". For distance-based detection without contact, use "distance to [sprite]" with a comparison operator.'
                }
            ]
        });
        quiz.start();
    </script>
