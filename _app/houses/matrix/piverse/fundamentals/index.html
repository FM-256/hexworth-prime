<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Fundamentals — PiVerse — Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-circuit.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0d0a0c; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-link { color: #c51a4a; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 1.5rem; transition: transform 0.2s; }
        .back-link:hover { transform: translateX(-5px); }
        h1 { font-size: 1.8rem; color: #fff; margin-bottom: 0.5rem; }
        h1 .accent { color: #c51a4a; }
        .desc { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .module-list { display: flex; flex-direction: column; gap: 12px; }
        .module-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: rgba(197, 26, 74, 0.04); border: 1px solid rgba(197, 26, 74, 0.15); border-radius: 10px; text-decoration: none; color: #e2e8f0; transition: all 0.3s; }
        .module-card:hover { border-color: #c51a4a; background: rgba(197, 26, 74, 0.08); transform: translateX(4px); }
        .module-num { width: 36px; height: 36px; background: rgba(197, 26, 74, 0.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #c51a4a; flex-shrink: 0; }
        .module-title { font-size: 0.95rem; font-weight: 600; }
        .module-card .check { margin-left: auto; opacity: 0; color: #22c55e; font-size: 1.2rem; }
        .module-card.completed .check { opacity: 1; }
        .module-card.completed { border-color: rgba(34, 197, 94, 0.3); }
        .attribution { margin-top: 3rem; text-align: center; color: #4a5568; font-size: 0.72rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">&larr; PiVerse Hub</a>
        <h1><span class="accent">Pi Fundamentals</span></h1>
        <p class="desc">Get started with your Raspberry Pi — hardware, setup, desktop, programming, and the full ecosystem.</p>
        <div class="module-list" id="moduleList"></div>
        <div class="attribution">Content developed in partnership with Raspberry Pi Press</div>
    </div>
    <script>
        // Module list will be populated by reading the directory
        // For now, a static list that checks completion
        document.addEventListener('DOMContentLoaded', function() {
            var list = document.getElementById('moduleList');
            var cards = list.querySelectorAll('.module-card');
            // Mark completed modules
            if (typeof ModuleProgress !== 'undefined') {
                cards.forEach(function(card) {
                    var mid = card.getAttribute('data-module');
                    if (mid && ModuleProgress.isCompleted('matrix', mid)) {
                        card.classList.add('completed');
                    }
                });
            }
        });
    </script>
    <script src="../../../../components/TenantShell.js"></script>
</body>
</html>
