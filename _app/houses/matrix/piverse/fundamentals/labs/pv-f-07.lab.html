<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python REPL Lab -- PiVerse Fundamentals Ch7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; overflow: hidden; background: #0c0c0c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #d4a0b0; display: flex; flex-direction: column; }
        .lab-header { flex-shrink: 0; padding: 15px 30px; background: rgba(13,6,8,0.95); border-bottom: 1px solid rgba(197,26,74,0.2); display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .back-btn { padding: 8px 16px; background: rgba(197,26,74,0.1); border: 1px solid rgba(197,26,74,0.3); border-radius: 6px; color: #c51a4a; text-decoration: none; font-size: 0.85rem; transition: all 0.3s; }
        .back-btn:hover { background: rgba(197,26,74,0.2); }
        .lab-title { font-size: 1rem; color: #f0d0d8; }
        .lab-badge { padding: 4px 12px; background: rgba(197,26,74,0.15); border: 1px solid rgba(197,26,74,0.3); border-radius: 12px; font-size: 0.7rem; color: #c51a4a; }
        .task-progress { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; color: #6b5a60; }
        .task-count { color: #c51a4a; font-weight: 500; }
        .progress-bar-wrap { width: 140px; height: 6px; background: rgba(197,26,74,0.15); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #c51a4a, #8b1030); border-radius: 3px; width: 0%; transition: width 0.4s; }
        .lab-container { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: 0; }
        .task-panel { background: rgba(13,6,8,0.95); border-right: 1px solid rgba(197,26,74,0.15); overflow-y: auto; padding: 20px; }
        .task-section-title { font-size: 0.68rem; color: #6b5a60; letter-spacing: 0.15em; margin-bottom: 12px; text-transform: uppercase; }
        .task-card { background: rgba(13,6,8,0.8); border: 1px solid rgba(197,26,74,0.15); border-radius: 10px; padding: 14px; margin-bottom: 8px; cursor: pointer; transition: all 0.3s; }
        .task-card:hover { border-color: rgba(197,26,74,0.4); }
        .task-card.active { border-color: #c51a4a; background: rgba(197,26,74,0.08); }
        .task-card.completed { border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.04); }
        .task-card.completed .task-name::after { content: ' [done]'; font-size: 0.72rem; color: #34d399; }
        .task-number { font-size: 0.68rem; color: #c51a4a; margin-bottom: 4px; }
        .task-name { font-size: 0.9rem; color: #f0d0d8; margin-bottom: 4px; }
        .task-desc { font-size: 0.77rem; color: #6b5a60; line-height: 1.45; }
        .task-desc code { background: rgba(197,26,74,0.15); padding: 1px 5px; border-radius: 3px; font-size: 0.82em; color: #c51a4a; font-family: 'Consolas', monospace; }
        .terminal-panel { display: flex; flex-direction: column; background: #0a0a0a; position: relative; }
        .term-toolbar { flex-shrink: 0; padding: 8px 20px; background: rgba(13,6,8,0.9); border-bottom: 1px solid rgba(197,26,74,0.15); display: flex; align-items: center; gap: 12px; }
        .term-dot { width: 12px; height: 12px; border-radius: 50%; }
        .term-dot-red { background: #ff5f57; } .term-dot-amber { background: #febc2e; } .term-dot-green { background: #28c840; }
        .term-title { flex: 1; text-align: center; font-size: 0.8rem; color: #6b5a60; font-family: 'Consolas', monospace; }
        .term-output { flex: 1; overflow-y: auto; padding: 16px 20px 8px; font-family: 'Consolas', monospace; font-size: 0.875rem; line-height: 1.6; }
        .term-input-row { flex-shrink: 0; display: flex; align-items: center; padding: 8px 20px 12px; border-top: 1px solid rgba(197,26,74,0.1); }
        .term-prompt { color: #c51a4a; font-family: 'Consolas', monospace; font-size: 0.875rem; margin-right: 6px; white-space: nowrap; }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #f0d0d8; font-family: 'Consolas', monospace; font-size: 0.875rem; caret-color: #c51a4a; }
        .term-line { white-space: pre-wrap; word-break: break-all; }
        .term-line-cmd { color: #d4a0b0; } .term-line-out { color: #a0d4a0; } .term-line-err { color: #f87171; }
        .term-line-info { color: #c51a4a; } .term-line-dim { color: #4a3540; }
        .success-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .success-overlay.active { display: flex; }
        .success-card { background: rgba(13,6,8,0.97); border: 1px solid rgba(52,211,153,0.35); border-radius: 16px; padding: 40px; text-align: center; max-width: 480px; width: 90%; }
        .success-title { font-size: 1.5rem; color: #34d399; margin-bottom: 10px; }
        .success-message { color: #d4a0b0; margin-bottom: 25px; line-height: 1.65; font-size: 0.95rem; }
        .success-btn { padding: 12px 30px; background: linear-gradient(135deg, #c51a4a, #8b1030); border: none; border-radius: 8px; color: white; font-size: 0.95rem; cursor: pointer; }
        @media (max-width: 1024px) { .lab-container { grid-template-columns: 1fr; } .task-panel { display: none; } }
    </style>
</head>
<body>
    <header class="lab-header">
        <div class="header-left">
            <a href="../../index.html" class="back-btn">Exit Lab</a>
            <span class="lab-title">Python REPL Lab</span>
            <span class="lab-badge">PV-F-07</span>
        </div>
        <div class="task-progress">
            <span>Progress:</span>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
            <span class="task-count" id="taskProgress">0 / 10 Tasks</span>
        </div>
    </header>
    <div class="lab-container">
        <aside class="task-panel" id="taskPanel"></aside>
        <main class="terminal-panel">
            <div class="term-toolbar">
                <div class="term-dot term-dot-red"></div><div class="term-dot term-dot-amber"></div><div class="term-dot term-dot-green"></div>
                <div class="term-title">python3 -- Raspberry Pi REPL</div>
            </div>
            <div class="term-output" id="termOutput"></div>
            <div class="term-input-row">
                <span class="term-prompt" id="promptLabel">>>> </span>
                <input class="term-input" id="termInput" type="text" autocomplete="off" spellcheck="false" aria-label="Python input">
            </div>
            <div class="success-overlay" id="successOverlay">
                <div class="success-card">
                    <div class="success-title">Python Lab Complete!</div>
                    <div class="success-message">You explored variables, types, conditions, loops, functions, lists, strings, f-strings, file I/O, and error handling -- all the Python fundamentals for Raspberry Pi programming.</div>
                    <button class="success-btn" onclick="finishLab()">Complete Lab</button>
                </div>
            </div>
        </main>
    </div>
    <script>
    (function() {
        'use strict';
        var TOTAL = 10, done = {}, current = 1, hist = [], histIdx = -1, out, inp;

        function addLine(t, c) { var d = document.createElement('div'); d.className = 'term-line' + (c ? ' ' + c : ''); d.textContent = t; out.appendChild(d); out.scrollTop = out.scrollHeight; }
        function addPrompt(cmd) { addLine('>>> ' + cmd, 'term-line-cmd'); }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        var taskData = [
            { name: 'Variables & Types', desc: 'Type <code>python variables</code> to declare variables and check types.', cmd: 'python variables' },
            { name: 'Arithmetic', desc: 'Type <code>python math</code> to test arithmetic operations.', cmd: 'python math' },
            { name: 'Conditions', desc: 'Type <code>python conditions</code> to write if/elif/else.', cmd: 'python conditions' },
            { name: 'For Loop', desc: 'Type <code>python forloop</code> to iterate with range().', cmd: 'python forloop' },
            { name: 'While Loop', desc: 'Type <code>python whileloop</code> to count with while.', cmd: 'python whileloop' },
            { name: 'Functions', desc: 'Type <code>python functions</code> to define and call a function.', cmd: 'python functions' },
            { name: 'Lists', desc: 'Type <code>python lists</code> to work with list operations.', cmd: 'python lists' },
            { name: 'Strings & f-strings', desc: 'Type <code>python strings</code> to manipulate strings.', cmd: 'python strings' },
            { name: 'File I/O', desc: 'Type <code>python fileio</code> to read and write files.', cmd: 'python fileio' },
            { name: 'Error Handling', desc: 'Type <code>python errors</code> to use try/except.', cmd: 'python errors' }
        ];

        var responses = {
            'python variables': function() {
                addLine('count = 42', 'term-line-out'); addLine('temperature = 22.5', 'term-line-out');
                addLine('name = "Raspberry Pi"', 'term-line-out'); addLine('active = True', 'term-line-out'); addLine('', '');
                addLine("type(count)      # <class 'int'>", 'term-line-out');
                addLine("type(temperature) # <class 'float'>", 'term-line-out');
                addLine("type(name)        # <class 'str'>", 'term-line-out');
                addLine("type(active)      # <class 'bool'>", 'term-line-out');
                addLine('', ''); addLine('[OK] 4 variables created. Types verified.', 'term-line-info');
                return 1;
            },
            'python math': function() {
                addLine('10 + 3   = 13', 'term-line-out'); addLine('10 - 3   = 7', 'term-line-out');
                addLine('10 * 3   = 30', 'term-line-out'); addLine('10 / 3   = 3.3333333333333335', 'term-line-out');
                addLine('10 // 3  = 3  (floor division)', 'term-line-out'); addLine('10 % 3   = 1  (modulo)', 'term-line-out');
                addLine('2 ** 10  = 1024  (power)', 'term-line-out');
                addLine('', ''); addLine('[OK] All arithmetic operators verified.', 'term-line-info');
                return 2;
            },
            'python conditions': function() {
                addLine('temp = 75', 'term-line-out'); addLine('', '');
                addLine('if temp > 100:', 'term-line-out'); addLine('    print("CRITICAL")', 'term-line-dim');
                addLine('elif temp > 50:', 'term-line-out'); addLine('    print("WARNING")', 'term-line-dim');
                addLine('else:', 'term-line-out'); addLine('    print("Normal")', 'term-line-dim');
                addLine('', ''); addLine('Output: WARNING', 'term-line-info');
                addLine('[OK] Condition chain correct. 3 branches evaluated.', 'term-line-info');
                return 3;
            },
            'python forloop': function() {
                addLine('for i in range(5):', 'term-line-out'); addLine('    print(i)', 'term-line-dim');
                addLine('', ''); addLine('0', 'term-line-out'); addLine('1', 'term-line-out');
                addLine('2', 'term-line-out'); addLine('3', 'term-line-out'); addLine('4', 'term-line-out');
                addLine('', ''); addLine('[OK] for loop: 5 iterations (0-4). range(5) verified.', 'term-line-info');
                return 4;
            },
            'python whileloop': function() {
                addLine('count = 0', 'term-line-out'); addLine('while count < 3:', 'term-line-out');
                addLine('    print(f"count = {count}")', 'term-line-dim'); addLine('    count += 1', 'term-line-dim');
                addLine('', ''); addLine('count = 0', 'term-line-out'); addLine('count = 1', 'term-line-out'); addLine('count = 2', 'term-line-out');
                addLine('', ''); addLine('[OK] while loop: 3 iterations. Condition checked before each.', 'term-line-info');
                return 5;
            },
            'python functions': function() {
                addLine('def celsius_to_fahrenheit(c):', 'term-line-out');
                addLine('    return c * 1.8 + 32', 'term-line-dim'); addLine('', '');
                addLine('celsius_to_fahrenheit(0)    = 32.0', 'term-line-out');
                addLine('celsius_to_fahrenheit(100)  = 212.0', 'term-line-out');
                addLine('celsius_to_fahrenheit(37)   = 98.6', 'term-line-out');
                addLine('', ''); addLine('[OK] Function defined and tested. All conversions correct.', 'term-line-info');
                return 6;
            },
            'python lists': function() {
                addLine('readings = [512, 480, 530, 495, 510]', 'term-line-out');
                addLine('len(readings)     = 5', 'term-line-out'); addLine('readings[0]       = 512', 'term-line-out');
                addLine('readings[-1]      = 510', 'term-line-out'); addLine('sum(readings)     = 2527', 'term-line-out');
                addLine('avg = sum(readings) / len(readings) = 505.4', 'term-line-out');
                addLine('max(readings)     = 530', 'term-line-out'); addLine('min(readings)     = 480', 'term-line-out');
                addLine('', ''); addLine('[OK] List operations verified. Indexing, sum, avg, min, max.', 'term-line-info');
                return 7;
            },
            'python strings': function() {
                addLine('name = "Raspberry Pi"', 'term-line-out'); addLine('temp = 42.7', 'term-line-out');
                addLine('', ''); addLine('f"The {name} is at {temp:.1f}C"', 'term-line-out');
                addLine('  = "The Raspberry Pi is at 42.7C"', 'term-line-info');
                addLine('name.upper()     = "RASPBERRY PI"', 'term-line-out');
                addLine('name.split()     = [\'Raspberry\', \'Pi\']', 'term-line-out');
                addLine('name[:9]         = "Raspberry"', 'term-line-out');
                addLine('', ''); addLine('[OK] f-string formatting, methods, and slicing verified.', 'term-line-info');
                return 8;
            },
            'python fileio': function() {
                addLine('# Writing file', 'term-line-dim');
                addLine('with open("sensor.txt", "w") as f:', 'term-line-out');
                addLine('    f.write("temp=22.5\\n")', 'term-line-dim');
                addLine('    f.write("humidity=45\\n")', 'term-line-dim');
                addLine('', ''); addLine('# Reading file', 'term-line-dim');
                addLine('with open("sensor.txt") as f:', 'term-line-out');
                addLine('    for line in f:', 'term-line-dim');
                addLine('        print(line.strip())', 'term-line-dim');
                addLine('', ''); addLine('temp=22.5', 'term-line-out'); addLine('humidity=45', 'term-line-out');
                addLine('', ''); addLine('[OK] File write and read verified. with statement ensures close.', 'term-line-info');
                return 9;
            },
            'python errors': function() {
                addLine('try:', 'term-line-out'); addLine('    value = int("hello")', 'term-line-dim');
                addLine('except ValueError as e:', 'term-line-out');
                addLine('    print(f"Caught: {e}")', 'term-line-dim');
                addLine('finally:', 'term-line-out'); addLine('    print("Cleanup done")', 'term-line-dim');
                addLine('', ''); addLine('Caught: invalid literal for int() with base 10: \'hello\'', 'term-line-err');
                addLine('Cleanup done', 'term-line-out');
                addLine('', ''); addLine('[OK] Exception caught. finally block executed. Program continues.', 'term-line-info');
                return 10;
            }
        };

        function exec(raw) {
            var cmd = raw.trim();
            addPrompt(cmd);
            if (!cmd) return;
            if (cmd === 'help') {
                addLine('Python REPL Lab -- Available Commands', 'term-line-info'); addLine('', '');
                taskData.forEach(function(t, i) { addLine('  ' + t.cmd + '  -- Task ' + (i+1) + ': ' + t.name, 'term-line-dim'); });
                addLine('', ''); addLine('  help   -- Show this help', 'term-line-dim'); addLine('  clear  -- Clear terminal', 'term-line-dim');
            } else if (cmd === 'clear') { out.innerHTML = ''; }
            else if (responses[cmd]) { var n = responses[cmd](); completeTask(n); }
            else { addLine('>>> NameError: name \'' + cmd.split(' ')[0] + '\' is not defined. Type "help".', 'term-line-err'); }
        }

        function completeTask(n) {
            if (done[n]) return; done[n] = true;
            var count = 0; for (var k in done) if (done[k]) count++;
            document.getElementById('taskProgress').textContent = count + ' / ' + TOTAL + ' Tasks';
            document.getElementById('progressFill').style.width = Math.round((count / TOTAL) * 100) + '%';
            var card = document.getElementById('task-' + n);
            if (card) { card.classList.add('completed'); card.classList.remove('active'); }
            addLine('', ''); addLine('[Task ' + n + ' complete] ' + taskData[n-1].name, 'term-line-info'); addLine('', '');
            if (count === TOTAL) { setTimeout(function() { document.getElementById('successOverlay').classList.add('active'); }, 700); return; }
            for (var i = 1; i <= TOTAL; i++) { if (!done[i]) { selectTask(i); break; } }
        }

        function selectTask(n) {
            current = n;
            for (var i = 1; i <= TOTAL; i++) { var c = document.getElementById('task-' + i); if (c) { c.classList.remove('active'); if (i === n) c.classList.add('active'); } }
        }

        function buildTasks() {
            var p = document.getElementById('taskPanel');
            p.innerHTML = '<div class="task-section-title">Python REPL Tasks</div>';
            taskData.forEach(function(t, i) {
                var d = document.createElement('div'); d.className = 'task-card'; d.id = 'task-' + (i+1);
                d.innerHTML = '<div class="task-number">Task ' + (i+1) + '</div><div class="task-name">' + t.name + '</div><div class="task-desc">' + t.desc + '</div>';
                d.onclick = function() { selectTask(i+1); };
                p.appendChild(d);
            });
        }

        window.finishLab = function() {
            if (typeof ModuleProgress !== 'undefined') ModuleProgress.complete('matrix', 'pv-f-07-lab', { returnUrl: '../../index.html' });
            else window.location.href = '../../index.html';
        };

        function init() {
            out = document.getElementById('termOutput'); inp = document.getElementById('termInput');
            addLine('Python 3.11.2 (Raspberry Pi OS)', 'term-line-info');
            addLine('Type "help" for available commands.', 'term-line-info'); addLine('', '');
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { var c = inp.value; inp.value = ''; if (c.trim()) { hist.push(c); histIdx = hist.length; } exec(c); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; inp.value = hist[histIdx]; } }
                else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < hist.length-1) { histIdx++; inp.value = hist[histIdx]; } else { histIdx = hist.length; inp.value = ''; } }
            });
            out.addEventListener('click', function() { inp.focus(); });
            inp.focus(); buildTasks(); selectTask(1);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
    </script>
</body>
</html>
