<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: The Sense HAT',
            description: 'LED matrix, environmental sensors, IMU, joystick, and data logging.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-05-quiz',
            moduleId: 'pv-e-05-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'How many RGB LEDs are on the Sense HAT matrix?',
                    options: [
                        '16',
                        '32',
                        '64',
                        '128'
                    ],
                    explanation: 'The Sense HAT has an 8x8 RGB LED matrix = 64 individually addressable pixels, driven by an ATTINY88 coprocessor.'
                },
                {
                    question: 'Which communication protocol does the Sense HAT use?',
                    options: [
                        'SPI',
                        'UART',
                        'I2C',
                        'USB'
                    ],
                    explanation: 'All Sense HAT sensors communicate over the I2C bus (SDA/SCL). It uses GPIO2 and GPIO3 for communication.'
                },
                {
                    question: 'Why does the Sense HAT temperature read higher than actual?',
                    options: [
                        'The sensor is miscalibrated',
                        'CPU heat conducts through the GPIO header',
                        'The sensor only works in cold environments',
                        'It reads in Fahrenheit'
                    ],
                    explanation: 'The Pi CPU generates heat that conducts through the GPIO header to the HTS221 temperature sensor, causing readings 5-10 degrees above ambient.'
                },
                {
                    question: 'What method scrolls text across the LED matrix?',
                    options: [
                        'sense.scroll_text()',
                        'sense.display_message()',
                        'sense.show_message()',
                        'sense.write_text()'
                    ],
                    explanation: 'sense.show_message(\'text\') scrolls text across the 8x8 LED matrix. Optional parameters: scroll_speed, text_colour, back_colour.'
                },
                {
                    question: 'What does sense.get_orientation() return?',
                    options: [
                        'GPS coordinates',
                        'Pitch, roll, and yaw angles',
                        'Temperature, humidity, and pressure',
                        'Accelerometer raw values only'
                    ],
                    explanation: 'get_orientation() returns a dictionary with pitch, roll, and yaw values fused from the gyroscope, accelerometer, and magnetometer.'
                },
                {
                    question: 'How do you set a single pixel on the LED matrix?',
                    options: [
                        'sense.pixel(x, y, color)',
                        'sense.set_pixel(x, y, r, g, b)',
                        'sense.draw(x, y, color)',
                        'sense.led[x][y] = color'
                    ],
                    explanation: 'sense.set_pixel(x, y, r, g, b) sets one pixel. Coordinates: x=0-7 (left to right), y=0-7 (top to bottom). RGB values: 0-255.'
                },
                {
                    question: 'What chip provides the barometric pressure reading?',
                    options: [
                        'HTS221',
                        'LSM9DS1',
                        'LPS25H',
                        'ATTINY88'
                    ],
                    explanation: 'The LPS25H sensor measures barometric pressure from 260-1260 hPa. I2C address 0x5C. Not affected by CPU heat.'
                },
                {
                    question: 'How many axes does the Sense HAT IMU measure?',
                    options: [
                        '3 (accelerometer only)',
                        '6 (gyro + accel)',
                        '9 (gyro + accel + mag)',
                        '12'
                    ],
                    explanation: 'The LSM9DS1 is a 9-DOF (Degrees of Freedom) IMU: 3-axis gyroscope + 3-axis accelerometer + 3-axis magnetometer.'
                },
                {
                    question: 'What is the alternative to the physical Sense HAT for development?',
                    options: [
                        'There is no alternative',
                        'The sense-emu emulator',
                        'A virtual machine',
                        'The Scratch GPIO extension'
                    ],
                    explanation: 'sense-emu provides an identical Python API with a GUI window simulating the LED matrix and sensors. from sense_emu import SenseHat.'
                },
                {
                    question: 'Which joystick event fires when the stick is pushed in the middle?',
                    options: [
                        'direction_center',
                        'direction_push',
                        'direction_middle',
                        'direction_press'
                    ],
                    explanation: 'sense.stick.direction_middle fires when the joystick is pressed straight down (center press action).'
                },
                {
                    question: 'What does sense.set_rotation(180) do?',
                    options: [
                        'Rotates the Pi board 180 degrees',
                        'Flips the LED matrix display upside down',
                        'Rotates the accelerometer readings',
                        'Resets the display orientation'
                    ],
                    explanation: 'set_rotation(180) rotates the LED matrix display 180 degrees. Text and images appear upside down. Useful when the Pi is mounted inverted.'
                },
                {
                    question: 'What Python module is used for blocking until a signal is received?',
                    options: [
                        'time.wait()',
                        'os.pause()',
                        'signal.pause()',
                        'sys.wait()'
                    ],
                    explanation: 'signal.pause() blocks the script efficiently, waiting for a signal (like SIGTERM). Used to keep event-driven Sense HAT scripts alive.'
                },
                {
                    question: 'What is the I2C address of the Sense HAT LED matrix controller?',
                    options: [
                        '0x5F',
                        '0x6A',
                        '0x46',
                        '0x1C'
                    ],
                    explanation: 'The ATTINY88 coprocessor that drives the 8x8 LED matrix is at I2C address 0x46.'
                },
                {
                    question: 'How do you make the LED matrix dimmer for low-light use?',
                    options: [
                        'sense.brightness = 0.5',
                        'sense.low_light = True',
                        'sense.dim_mode()',
                        'sense.set_brightness(50)'
                    ],
                    explanation: 'sense.low_light = True reduces the LED brightness. This is a boolean property -- True for dim, False for full brightness.'
                },
                {
                    question: 'What data format is best for logging Sense HAT sensor readings?',
                    options: [
                        'JSON',
                        'XML',
                        'CSV',
                        'Binary'
                    ],
                    explanation: 'CSV (Comma Separated Values) is ideal: lightweight, easy to parse, works with spreadsheets. Use Python\'s csv module with timestamp + sensor columns.'
                }
            ]
        });
    </script>
