<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: GPIO with Python (gpiozero)',
            description: 'LED, Button, Buzzer, PWMLED classes, callbacks, source wiring, and pin factories.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-03-quiz',
            moduleId: 'pv-e-03-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What import statement creates an LED object on GPIO17?',
                    options: [
                        'import GPIO; led = GPIO.output(17)',
                        'from gpiozero import LED; led = LED(17)',
                        'import RPi.GPIO as GPIO; GPIO.setup(17, GPIO.OUT)',
                        'from gpio import Pin; led = Pin(17, 'out')'
                    ],
                    explanation: 'gpiozero uses one class per device. LED(17) creates an LED object on GPIO17 with BCM numbering. No setup, no pin mode configuration needed.'
                },
                {
                    question: 'Which method makes an LED blink in a background thread?',
                    options: [
                        'led.flash()',
                        'led.blink()',
                        'led.pulse()',
                        'led.strobe()'
                    ],
                    explanation: 'led.blink(on_time, off_time) starts blinking in a background thread. Your script continues executing. Use led.off() to stop blinking.'
                },
                {
                    question: 'How does gpiozero handle GPIO cleanup?',
                    options: [
                        'You must call GPIO.cleanup() manually',
                        'It requires a try/finally block',
                        'It cleans up automatically on script exit',
                        'It leaves pins in their last state'
                    ],
                    explanation: 'gpiozero handles cleanup automatically when the script terminates normally or receives SIGTERM. All pins return to input mode. No manual teardown needed.'
                },
                {
                    question: 'What does signal.pause() do in a gpiozero script?',
                    options: [
                        'Pauses all GPIO output for 1 second',
                        'Blocks forever while handling signals cleanly',
                        'Stops the program immediately',
                        'Saves GPIO state to disk'
                    ],
                    explanation: 'pause() blocks the script efficiently without consuming CPU, keeping it alive for event-driven callbacks. It exits cleanly on SIGTERM or KeyboardInterrupt.'
                },
                {
                    question: 'What is the range of PWMLED.value?',
                    options: [
                        '0 to 255',
                        '0 to 100',
                        '0.0 to 1.0',
                        '-1.0 to 1.0'
                    ],
                    explanation: 'PWMLED.value ranges from 0.0 (off) to 1.0 (full brightness). The pulse() method creates a smooth breathing effect.'
                },
                {
                    question: 'What does led.source = btn accomplish?',
                    options: [
                        'Copies the button code to the LED',
                        'Pipes button state to LED in real time',
                        'Creates a new button on the LED pin',
                        'Nothing -- this is invalid syntax'
                    ],
                    explanation: 'Setting led.source = btn connects the button\'s value stream to the LED. When the button is pressed (value=1), the LED turns on. Released (value=0), it turns off.'
                },
                {
                    question: 'Which gpiozero class wraps a PIR motion sensor?',
                    options: [
                        'PIRSensor',
                        'MotionDetector',
                        'MotionSensor',
                        'InfraredSensor'
                    ],
                    explanation: 'MotionSensor wraps PIR sensors. It provides motion_detected, when_motion, and when_no_motion properties for event-driven motion detection.'
                },
                {
                    question: 'What pin factory should you use for hardware PWM and remote GPIO?',
                    options: [
                        'RPi.GPIO',
                        'lgpio',
                        'pigpio',
                        'native'
                    ],
                    explanation: 'pigpio provides hardware PWM, precise timing, and remote GPIO control (over the network). Start the daemon with \'sudo pigpiod\'.'
                },
                {
                    question: 'What does Button.when_held do?',
                    options: [
                        'Triggers when the button is pressed',
                        'Triggers after the button is held for hold_time seconds',
                        'Triggers when the button is released',
                        'Triggers on double-click'
                    ],
                    explanation: 'when_held fires after the button has been held down continuously for hold_time seconds (default 1). Useful for long-press actions like shutdown.'
                },
                {
                    question: 'What does btn.wait_for_press() do?',
                    options: [
                        'Returns immediately with button state',
                        'Blocks until the button is pressed',
                        'Registers a callback for press events',
                        'Enables the button pull-up resistor'
                    ],
                    explanation: 'wait_for_press() is a blocking call that pauses script execution until the button is physically pressed. Used in sequential programs like the reaction timer.'
                },
                {
                    question: 'How do you control a servo with gpiozero?',
                    options: [
                        'Servo(17).angle = 90',
                        'Servo(17).min(); Servo(17).mid(); Servo(17).max()',
                        'PWM(17, frequency=50)',
                        'AngularServo(17, duty_cycle=7.5)'
                    ],
                    explanation: 'Servo(17) creates a servo object. Use .min(), .mid(), .max() for preset positions, or .value (-1 to 1) for precise positioning.'
                },
                {
                    question: 'What happens if you drive a motor directly from a GPIO pin?',
                    options: [
                        'The motor runs at full speed',
                        'The motor runs slowly',
                        'The GPIO pin and possibly the SoC are damaged',
                        'Nothing -- motors require 12V'
                    ],
                    explanation: 'GPIO pins provide 16mA max. Motors draw 200-500mA. Direct connection exceeds the current limit and damages the pin. Use a transistor or MOSFET.'
                },
                {
                    question: 'Which pin factory is default on Pi 5?',
                    options: [
                        'RPi.GPIO',
                        'pigpio',
                        'lgpio',
                        'native'
                    ],
                    explanation: 'lgpio is the default on Pi 5 with Bookworm. It uses the Linux GPIO character device. RPi.GPIO does NOT work on Pi 5.'
                },
                {
                    question: 'What method releases a GPIO device without ending the script?',
                    options: [
                        'device.release()',
                        'device.close()',
                        'device.cleanup()',
                        'device.free()'
                    ],
                    explanation: 'device.close() releases the specific pin and returns it to its default state. The script continues running. Other devices remain unaffected.'
                },
                {
                    question: 'In the reaction timer project, what creates the random delay?',
                    options: [
                        'time.sleep(random())',
                        'sleep(uniform(2, 5))',
                        'delay(randint(2000, 5000))',
                        'Timer(random(2,5)).start()'
                    ],
                    explanation: 'sleep(uniform(2, 5)) pauses for a random float between 2 and 5 seconds. This prevents the user from predicting when the LED will turn on.'
                }
            ]
        });
    </script>
</body>
