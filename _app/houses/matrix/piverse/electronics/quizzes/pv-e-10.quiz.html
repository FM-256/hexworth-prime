<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 10 Quiz: GUI Programming on Pi | PiVerse Electronics</title>
    <link rel="stylesheet" href="../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0408 0%, #1a0a10 50%, #0d0408 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(197, 26, 74, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #c51a4a;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 10: GUI Programming on Pi',
            description: 'Tkinter, GTK, GPIO integration, sliders, dashboards, and threading safety.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-10-quiz',
            moduleId: 'pv-e-10-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What GUI toolkit is built into Python with zero dependencies?',
                    options: [
                        'GTK',
                        'PyQt',
                        'Tkinter',
                        'Pygame'
                    ],
                    explanation: 'Tkinter ships with every Python installation. import tkinter as tk and start building. No pip install needed.'
                },
                {
                    question: 'What method starts the Tkinter event loop?',
                    options: [
                        'root.start()',
                        'root.run()',
                        'root.mainloop()',
                        'root.execute()'
                    ],
                    explanation: 'root.mainloop() starts the Tkinter event loop that processes user events (clicks, keys) and updates the display. It blocks until the window closes.'
                },
                {
                    question: 'How do you connect a Tkinter button to turn on an LED?',
                    options: [
                        'Button(root, gpio=17, state='on')',
                        'Button(root, text='ON', command=led.on)',
                        'Button(root, onclick='led.on()')',
                        'Button(root, action=LED.HIGH)'
                    ],
                    explanation: 'The command parameter accepts a callable. led.on is a reference to the method (no parentheses). When clicked, Tkinter calls led.on().'
                },
                {
                    question: 'Why should you never use time.sleep() in a Tkinter application?',
                    options: [
                        'It uses too much memory',
                        'It freezes the entire GUI, making it unresponsive',
                        'It conflicts with GPIO',
                        'It is not available on Pi OS'
                    ],
                    explanation: 'time.sleep() blocks the main thread where Tkinter runs. The GUI cannot process events, redraw, or respond to user input during the sleep.'
                },
                {
                    question: 'What Tkinter method schedules a function to run after a delay?',
                    options: [
                        'root.timer()',
                        'root.schedule()',
                        'root.after()',
                        'root.delay()'
                    ],
                    explanation: 'root.after(milliseconds, callback) schedules a function to run after the specified delay. It integrates with the event loop and does not block.'
                },
                {
                    question: 'What widget provides a slider for analog-style control?',
                    options: [
                        'Slider',
                        'Range',
                        'Scale',
                        'ScrollBar'
                    ],
                    explanation: 'tk.Scale provides a slider widget. from_=0, to=100, orient=\'horizontal\'. The command parameter fires every time the slider moves.'
                },
                {
                    question: 'How do you make a Tkinter window fullscreen?',
                    options: [
                        'root.fullscreen = True',
                        'root.attributes('-fullscreen', True)',
                        'root.maximize()',
                        'root.geometry('fullscreen')'
                    ],
                    explanation: 'root.attributes(\'-fullscreen\', True) makes the window fill the entire screen. Add root.configure(cursor=\'none\') to hide the mouse for kiosk mode.'
                },
                {
                    question: 'What is the threading problem with gpiozero callbacks and Tkinter?',
                    options: [
                        'There is no problem',
                        'Callbacks run in background threads but Tkinter is single-threaded',
                        'GPIO does not work with GUIs',
                        'Tkinter blocks all GPIO'
                    ],
                    explanation: 'gpiozero callbacks run in background threads. Tkinter widgets must be updated from the main thread only. Updating widgets from callbacks causes crashes.'
                },
                {
                    question: 'How do you safely update Tkinter from a gpiozero callback?',
                    options: [
                        'Call widget.config() directly',
                        'Use a Queue -- put data from callback, read from root.after()',
                        'Use threading.Lock',
                        'It is impossible'
                    ],
                    explanation: 'Put data into a queue.Queue() from the callback thread. Read it from a root.after() scheduled function that runs in the main thread.'
                },
                {
                    question: 'What Tkinter variable type updates a Label automatically?',
                    options: [
                        'var',
                        'Observable',
                        'StringVar',
                        'AutoLabel'
                    ],
                    explanation: 'tk.StringVar() is a special variable. When you set it with .set(), any Label using textvariable=var updates automatically.'
                },
                {
                    question: 'What Canvas method draws a circular arc for a gauge?',
                    options: [
                        'canvas.draw_arc()',
                        'canvas.create_arc()',
                        'canvas.arc()',
                        'canvas.circle()'
                    ],
                    explanation: 'canvas.create_arc(x1, y1, x2, y2, start=angle, extent=sweep) draws an arc within the bounding box. Use style=\'arc\' for line only.'
                },
                {
                    question: 'How do you auto-start a GUI app when Pi boots into desktop?',
                    options: [
                        'Add to /etc/rc.local',
                        'Create a .desktop file in ~/.config/autostart/',
                        'Add to crontab',
                        'Edit /boot/config.txt'
                    ],
                    explanation: 'Create a .desktop file in ~/.config/autostart/ with [Desktop Entry], Type=Application, and Exec=python3 /path/to/app.py.'
                },
                {
                    question: 'What GTK import is needed for Pi OS native-looking GUIs?',
                    options: [
                        'import gtk',
                        'from gi.repository import Gtk',
                        'import Gtk3',
                        'from gnome import Gtk'
                    ],
                    explanation: 'import gi; gi.require_version(\'Gtk\', \'3.0\'); from gi.repository import Gtk. This uses GObject Introspection to access GTK 3.'
                },
                {
                    question: 'How do you handle window close in Tkinter to clean up GPIO?',
                    options: [
                        'root.on_close = cleanup',
                        'root.protocol('WM_DELETE_WINDOW', cleanup_function)',
                        'root.bind('close', cleanup)',
                        'GPIO cleans up automatically'
                    ],
                    explanation: 'root.protocol(\'WM_DELETE_WINDOW\', handler) overrides the window close button. Call device.close() on GPIO devices, then root.destroy().'
                },
                {
                    question: 'What Tkinter widget is best for text input?',
                    options: [
                        'TextBox',
                        'Input',
                        'Entry',
                        'TextField'
                    ],
                    explanation: 'tk.Entry is a single-line text input widget. Use entry.get() to read the value. For multi-line text, use tk.Text widget.'
                }
            ]
        });
    </script>
</body>
</html>
