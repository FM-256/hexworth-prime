<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: Analog Signals and ADC',
            description: 'Analog vs digital, Nyquist, MCP3008, signal conditioning, and sensor conversion.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-08-quiz',
            moduleId: 'pv-e-08-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Does the Raspberry Pi have built-in analog input pins?',
                    options: [
                        'Yes, 6 analog pins like Arduino',
                        'Yes, but only on Pi 5',
                        'No -- all GPIO pins are digital only',
                        'Yes, on the 26-pin models only'
                    ],
                    explanation: 'Unlike Arduino, the Pi has NO analog input capability. Every GPIO pin is purely digital (HIGH or LOW). An external ADC is required.'
                },
                {
                    question: 'What does the Nyquist theorem state?',
                    options: [
                        'Sample at the signal frequency',
                        'Sample at half the signal frequency',
                        'Sample at least 2x the highest signal frequency',
                        'Sample at 10x the signal frequency'
                    ],
                    explanation: 'The Nyquist theorem states you must sample at >= 2x the highest frequency in the signal to accurately represent it. Below this, aliasing occurs.'
                },
                {
                    question: 'What resolution does the MCP3008 ADC provide?',
                    options: [
                        '8-bit (256 levels)',
                        '10-bit (1024 levels)',
                        '12-bit (4096 levels)',
                        '16-bit (65536 levels)'
                    ],
                    explanation: 'The MCP3008 is a 10-bit ADC: 1024 discrete levels from 0 to the reference voltage. At 3.3V reference: 3.3V / 1024 = 3.2mV per step.'
                },
                {
                    question: 'How many analog input channels does the MCP3008 have?',
                    options: [
                        '2',
                        '4',
                        '8',
                        '16'
                    ],
                    explanation: 'The MCP3008 has 8 analog input channels (CH0-CH7). Each can read a different analog sensor independently.'
                },
                {
                    question: 'What communication protocol does the MCP3008 use?',
                    options: [
                        'I2C',
                        'UART',
                        'SPI',
                        'Parallel'
                    ],
                    explanation: 'The MCP3008 communicates via SPI (Serial Peripheral Interface). Connect to MOSI, MISO, SCLK, and CE0 on the Pi.'
                },
                {
                    question: 'What value does MCP3008(0).value return for 1.65V input with 3.3V reference?',
                    options: [
                        '0.165',
                        '0.5',
                        '1.65',
                        '512'
                    ],
                    explanation: 'MCP3008.value returns 0.0 to 1.0 proportional to voltage. 1.65V / 3.3V = 0.5. Multiply by 3.3 to get voltage.'
                },
                {
                    question: 'What is the purpose of a low-pass RC filter before an ADC?',
                    options: [
                        'To amplify weak signals',
                        'To remove high-frequency noise',
                        'To convert analog to digital',
                        'To protect against overvoltage'
                    ],
                    explanation: 'An RC filter (resistor + capacitor) removes high-frequency noise that could cause inaccurate ADC readings. Cutoff frequency: f = 1/(2*pi*R*C).'
                },
                {
                    question: 'How do you wire a potentiometer for voltage reading?',
                    options: [
                        'All three pins to the same GPIO',
                        'Pin 1 to 3.3V, Pin 2 (wiper) to ADC input, Pin 3 to GND',
                        'Pin 1 to GPIO, Pin 3 to GPIO',
                        'Pins 1 and 3 to 3.3V, Pin 2 to GND'
                    ],
                    explanation: 'The potentiometer acts as a variable voltage divider. Outside pins to 3.3V and GND, wiper (middle) to ADC input. Turning the knob varies output 0V to 3.3V.'
                },
                {
                    question: 'What formula converts thermistor resistance to temperature?',
                    options: [
                        'T = R x 0.01',
                        'Linear: T = m*R + b',
                        'Steinhart-Hart (Beta equation)',
                        'T = V / I'
                    ],
                    explanation: 'The Steinhart-Hart equation (simplified as the Beta equation) converts thermistor resistance to temperature: 1/T = 1/T0 + (1/B)*ln(R/R0).'
                },
                {
                    question: 'What does averaging multiple ADC readings accomplish?',
                    options: [
                        'Increases resolution beyond the ADC bits',
                        'Reduces random noise by sqrt(N)',
                        'Makes the ADC faster',
                        'Saves power'
                    ],
                    explanation: 'Averaging N samples reduces random noise by a factor of sqrt(N). 16 samples = 4x noise reduction. This is the simplest digital filtering technique.'
                },
                {
                    question: 'What happens if the ADC input voltage exceeds the reference voltage?',
                    options: [
                        'The ADC automatically scales down',
                        'The reading clips at the maximum value (1023 for 10-bit)',
                        'The ADC chip is damaged',
                        'The reading wraps around to 0'
                    ],
                    explanation: 'Exceeding VREF causes the ADC to output its maximum value (1023 for 10-bit). Some ADCs may be damaged by significantly exceeding VREF.'
                },
                {
                    question: 'What gpiozero source connection controls LED brightness from a potentiometer?',
                    options: [
                        'led.input = pot',
                        'led.source = pot',
                        'led.value = pot.read()',
                        'pot.output = led'
                    ],
                    explanation: 'led.source = pot pipes the MCP3008 potentiometer value (0.0-1.0) directly to PWMLED brightness. No loop or callback needed.'
                },
                {
                    question: 'What is aliasing in ADC sampling?',
                    options: [
                        'Two devices having the same I2C address',
                        'A false lower-frequency signal appearing due to undersampling',
                        'A type of signal amplification',
                        'Electrical interference between wires'
                    ],
                    explanation: 'Aliasing occurs when the sample rate is below the Nyquist rate. The digital signal misrepresents the analog original, showing false frequencies.'
                },
                {
                    question: 'For a 12-bit ADC at 3.3V reference, what is the voltage per step?',
                    options: [
                        '3.2mV',
                        '0.8mV',
                        '0.05mV',
                        '1.0mV'
                    ],
                    explanation: '3.3V / 4096 levels = 0.000806V = approximately 0.8mV per step. Higher resolution ADCs detect smaller voltage changes.'
                },
                {
                    question: 'What is two-point calibration?',
                    options: [
                        'Using two ADCs simultaneously',
                        'Measuring known values at two points and interpolating',
                        'Calibrating at 0V and 5V only',
                        'Using two reference resistors'
                    ],
                    explanation: 'Measure the ADC output at two known reference values (e.g., 0C ice water and 100C boiling water). Linear interpolation between these two points calibrates the system.'
                }
            ]
        });
    </script>
