<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 6: Camera Modules',
            description: 'Pi Camera hardware, libcamera CLI, picamera2 Python API, time-lapse, and OpenCV.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-06-quiz',
            moduleId: 'pv-e-06-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What sensor does the Pi Camera Module v3 use?',
                    options: [
                        'Sony IMX219',
                        'Sony IMX477',
                        'Sony IMX708',
                        'OmniVision OV5647'
                    ],
                    explanation: 'The Camera Module v3 uses the Sony IMX708 12MP sensor with autofocus capability. The v2 uses IMX219, the HQ uses IMX477.'
                },
                {
                    question: 'What command replaced raspistill on Pi OS Bookworm?',
                    options: [
                        'picamera-still',
                        'rpicam-still',
                        'libcamera-still',
                        'cam-capture'
                    ],
                    explanation: 'libcamera-still is the modern replacement for raspistill. The entire libcamera stack replaces the legacy camera commands.'
                },
                {
                    question: 'What picamera2 method captures a frame as a numpy array?',
                    options: [
                        'capture_image()',
                        'get_frame()',
                        'capture_array()',
                        'read_pixels()'
                    ],
                    explanation: 'capture_array() returns the current frame as a numpy array suitable for OpenCV processing. Use capture_file() for saving to disk.'
                },
                {
                    question: 'What cable connects the camera to the Pi?',
                    options: [
                        'USB cable',
                        'HDMI cable',
                        'CSI ribbon cable',
                        'Ethernet cable'
                    ],
                    explanation: 'The camera connects via a 15-pin CSI-2 (Camera Serial Interface) flat ribbon cable. The cable is fragile and must be seated firmly.'
                },
                {
                    question: 'What is the key advantage of Camera v3 over v2?',
                    options: [
                        'Higher resolution',
                        'Autofocus',
                        'Lower price',
                        'Wider field of view'
                    ],
                    explanation: 'The v3 has autofocus (v2 is fixed focus). While v3 is also 12MP vs 8MP, autofocus is the primary improvement for most applications.'
                },
                {
                    question: 'How do you create a time-lapse from captured images?',
                    options: [
                        'Use picamera2 timelapse mode',
                        'Capture JPEGs in a loop, stitch with ffmpeg',
                        'Use libcamera-timelapse command',
                        'Time-lapse is not possible on Pi'
                    ],
                    explanation: 'Capture sequential JPEGs with a sleep interval, then use ffmpeg: ffmpeg -framerate 24 -i frame_%04d.jpg -c:v h264 output.mp4.'
                },
                {
                    question: 'What must you do before calling capture_file() in picamera2?',
                    options: [
                        'Nothing -- it works immediately',
                        'Call cam.start() and wait for auto-exposure to settle',
                        'Set the resolution to maximum',
                        'Enable the camera in raspi-config'
                    ],
                    explanation: 'You must call cam.start() first, then wait ~2 seconds for auto-exposure and auto-white-balance to stabilize before capturing.'
                },
                {
                    question: 'How do you install OpenCV on Pi OS?',
                    options: [
                        'pip install opencv',
                        'sudo apt install python3-opencv',
                        'It is pre-installed',
                        'conda install cv2'
                    ],
                    explanation: 'sudo apt install python3-opencv installs the pre-compiled package. For the full version with contrib modules: pip install opencv-contrib-python.'
                },
                {
                    question: 'What is the NoIR camera module?',
                    options: [
                        'A camera with no image recording',
                        'A camera without the infrared filter for night vision',
                        'A non-recording security camera',
                        'A camera with enhanced noise reduction'
                    ],
                    explanation: 'NoIR = No Infrared filter. It allows IR light to reach the sensor, enabling night vision with IR LED illumination. Daytime images appear pinkish.'
                },
                {
                    question: 'What picamera2 encoder is used for H.264 video?',
                    options: [
                        'VideoEncoder',
                        'H264Encoder',
                        'MPEGEncoder',
                        'FFmpegEncoder'
                    ],
                    explanation: 'H264Encoder from picamera2.encoders provides hardware-accelerated H.264 encoding with configurable bitrate.'
                },
                {
                    question: 'How do you set manual focus distance on Camera v3?',
                    options: [
                        'cam.focus(distance)',
                        'cam.set_controls({'LensPosition': 0.5})',
                        'libcamera-still --focus 50cm',
                        'Focus is always automatic on v3'
                    ],
                    explanation: 'Set AfMode to manual (0) and LensPosition to control focus distance. cam.set_controls({\'AfMode\': 0, \'LensPosition\': 0.5}).'
                },
                {
                    question: 'What resolution does the Camera v3 capture stills at maximum?',
                    options: [
                        '1920x1080',
                        '3280x2464',
                        '4608x2592',
                        '8000x6000'
                    ],
                    explanation: 'The IMX708 captures up to 4608x2592 (approximately 12MP) for still images.'
                },
                {
                    question: 'What frame rate can the Pi Camera achieve at 1080p?',
                    options: [
                        '15fps',
                        '30fps',
                        '60fps',
                        '120fps'
                    ],
                    explanation: 'The Pi Camera modules capture 1080p at 30fps. Lower resolutions can achieve higher frame rates (e.g., 720p at 60fps on some models).'
                },
                {
                    question: 'What happens if you forget to call cam.stop()?',
                    options: [
                        'Nothing -- it auto-stops',
                        'The camera resource stays locked and other programs cannot use it',
                        'The Pi crashes',
                        'The images are corrupted'
                    ],
                    explanation: 'The camera hardware resource remains locked. Other programs cannot access the camera until you call stop() or the script terminates.'
                },
                {
                    question: 'What color space does capture_array() return by default?',
                    options: [
                        'BGR',
                        'RGB',
                        'YUV',
                        'Grayscale'
                    ],
                    explanation: 'picamera2 returns RGB format by default. OpenCV expects BGR, so use cv2.cvtColor(frame, cv2.COLOR_RGB2BGR) when needed.'
                }
            ]
        });
    </script>
</body>
