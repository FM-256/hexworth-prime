<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: GPIO with Scratch',
            description: 'Visual GPIO programming with Scratch 3 blocks, LED circuits, button input, and PWM.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-02-quiz',
            moduleId: 'pv-e-02-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Which Scratch 3 extension provides GPIO control on the Pi?',
                    options: [
                        'Raspberry Pi GPIO',
                        'Simple Electronics',
                        'Raspberry Pi Simple Electronics',
                        'Hardware Control'
                    ],
                    explanation: 'The extension is called \'Raspberry Pi Simple Electronics\'. Add it via the blue \'Add Extension\' button in Scratch 3 on Pi OS.'
                },
                {
                    question: 'What numbering scheme does Scratch use for GPIO pins?',
                    options: [
                        'BOARD (physical)',
                        'BCM (Broadcom)',
                        'WiringPi',
                        'Scratch-specific'
                    ],
                    explanation: 'Scratch uses BCM numbering. GPIO17 in Scratch is the same GPIO17 you see in the pinout command.'
                },
                {
                    question: 'Which Scratch block turns a GPIO pin on?',
                    options: [
                        'set gpio [pin] to output high',
                        'write gpio [pin] on',
                        'gpio [pin] = 1',
                        'send HIGH to gpio [pin]'
                    ],
                    explanation: 'The block \'set gpio [pin] to output high\' sets the specified GPIO pin to 3.3V (HIGH), turning on a connected LED.'
                },
                {
                    question: 'What causes an LED to not light up even when the circuit is correct?',
                    options: [
                        'The GPIO pin number is wrong',
                        'The LED is inserted backwards',
                        'The Scratch extension is not loaded',
                        'All of these'
                    ],
                    explanation: 'All three are common issues. Wrong pin number, reversed LED polarity, and missing extension are the top three troubleshooting items.'
                },
                {
                    question: 'How does a button with internal pull-up work?',
                    options: [
                        'GPIO reads HIGH when pressed',
                        'GPIO reads LOW when pressed',
                        'GPIO toggles with each press',
                        'GPIO reads analog value'
                    ],
                    explanation: 'With internal pull-up, the pin is HIGH by default. Pressing the button connects the pin to GND, pulling it LOW. \'When gpio is low\' fires on press.'
                },
                {
                    question: 'What is the purpose of a debounce delay in button programs?',
                    options: [
                        'To save power',
                        'To prevent multiple triggers from mechanical bounce',
                        'To slow down the program',
                        'To protect the GPIO pin'
                    ],
                    explanation: 'Mechanical buttons bounce for a few milliseconds after press, creating multiple false triggers. A short wait prevents reading these bounced signals.'
                },
                {
                    question: 'What PWM value range does Scratch use for GPIO brightness control?',
                    options: [
                        '0 to 255',
                        '0 to 1',
                        '0 to 100',
                        '0 to 1023'
                    ],
                    explanation: 'Scratch PWM values range from 0 (off) to 100 (full brightness). This is software PWM with limited precision.'
                },
                {
                    question: 'In a traffic light project, which LED goes first in the UK sequence?',
                    options: [
                        'Red',
                        'Green',
                        'Yellow',
                        'Red and Yellow together'
                    ],
                    explanation: 'The UK traffic sequence is: Green, Yellow, Red, Red+Yellow, Green. Green phase starts the cycle.'
                },
                {
                    question: 'Why cannot Scratch GPIO be used for servo control?',
                    options: [
                        'Scratch does not support output',
                        'Scratch uses software PWM which lacks servo precision',
                        'Servos need 12V',
                        'Scratch only works with LEDs'
                    ],
                    explanation: 'Scratch uses software PWM which is not precise enough for the 1-2ms pulse timing that servos require. Python with hardware PWM is needed.'
                },
                {
                    question: 'Where on the breadboard are components in the same row connected?',
                    options: [
                        'Only on the power rails',
                        'In the same 5-hole row on the same side of the center gap',
                        'Across the entire row including the center gap',
                        'Only in adjacent holes'
                    ],
                    explanation: 'Breadboard terminal strips have rows of 5 connected holes on each side of the center gap. The gap breaks the connection between left and right sides.'
                },
                {
                    question: 'What happens when you stop a Scratch program that was controlling GPIO?',
                    options: [
                        'GPIO pins stay in their last state',
                        'All pins go LOW automatically',
                        'The Pi reboots',
                        'An error message appears'
                    ],
                    explanation: 'When you click the stop button, Scratch typically sets GPIO pins LOW. However, behavior can vary -- always design circuits that are safe in either state.'
                },
                {
                    question: 'Which physical pin is GPIO17 on the 40-pin header?',
                    options: [
                        'Pin 17',
                        'Pin 11',
                        'Pin 7',
                        'Pin 27'
                    ],
                    explanation: 'GPIO17 (BCM) is physical pin 11 on the 40-pin header. This is a common source of confusion -- BCM numbers do not match physical pin numbers.'
                },
                {
                    question: 'What component limits current through an LED in a GPIO circuit?',
                    options: [
                        'A capacitor',
                        'A transistor',
                        'A resistor',
                        'A diode'
                    ],
                    explanation: 'A resistor in series with the LED limits the current to a safe level. Without it, the LED draws too much current and can damage both itself and the GPIO pin.'
                },
                {
                    question: 'Can the Scratch GPIO extension access I2C or SPI devices?',
                    options: [
                        'Yes, with additional blocks',
                        'No, it only supports basic digital GPIO and PWM',
                        'Yes, but only I2C',
                        'Yes, but only SPI'
                    ],
                    explanation: 'The Simple Electronics extension only supports basic digital I/O and software PWM. I2C, SPI, and advanced protocols require Python.'
                },
                {
                    question: 'What is the recommended approach for learning GPIO?',
                    options: [
                        'Start with Python immediately',
                        'Start with Scratch to verify circuits, then move to Python',
                        'Skip to advanced projects',
                        'Only use command-line tools'
                    ],
                    explanation: 'Prototype in Scratch to verify wiring works (no syntax errors possible), then rewrite in Python for production. The GPIO concepts are identical in both.'
                }
            ]
        });
    </script>
</body>
</html>
