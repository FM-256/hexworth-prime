<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: GPIO Architecture',
            description: 'Test your knowledge of the 40-pin header, BCM numbering, voltage rails, current limits, and protection.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-01-quiz',
            moduleId: 'pv-e-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'How many GPIO pins does the standard 40-pin Raspberry Pi header provide?',
                    options: [
                        '40',
                        '26',
                        '20',
                        '14'
                    ],
                    explanation: 'The header has 40 physical pins total, but only 26 are configurable GPIO. The rest are power (3.3V, 5V), ground (8 pins), and reserved pins.'
                },
                {
                    question: 'What numbering scheme does gpiozero use by default?',
                    options: [
                        'BOARD (physical position)',
                        'BCM (Broadcom SoC)',
                        'WiringPi',
                        'Sequential (1-26)'
                    ],
                    explanation: 'gpiozero defaults to BCM numbering, which refers to the GPIO number as labeled on the Broadcom SoC. GPIO17 is always GPIO17 regardless of physical position.'
                },
                {
                    question: 'What is the logic voltage level of Raspberry Pi GPIO pins?',
                    options: [
                        '5V',
                        '1.8V',
                        '3.3V',
                        '12V'
                    ],
                    explanation: 'All Pi GPIO pins operate at 3.3V logic. HIGH = 3.3V, LOW = 0V. Never apply 5V to a GPIO pin -- it will damage the SoC permanently.'
                },
                {
                    question: 'What is the maximum current a single GPIO pin can safely source?',
                    options: [
                        '50mA',
                        '8mA',
                        '16mA',
                        '100mA'
                    ],
                    explanation: 'Each GPIO pin can safely source or sink up to 16mA. The absolute maximum is 18mA. A standard LED with a 330-ohm resistor draws about 5mA at 3.3V.'
                },
                {
                    question: 'What is the maximum total current across ALL GPIO pins combined?',
                    options: [
                        '100mA',
                        '50mA',
                        '200mA',
                        '16mA'
                    ],
                    explanation: 'The combined current across all GPIO pins must not exceed 50mA total. If you drive 10 LEDs at 5mA each, you hit the limit.'
                },
                {
                    question: 'What command displays the GPIO pinout diagram in the terminal?',
                    options: [
                        'gpio readall',
                        'pinout',
                        'cat /proc/cpuinfo',
                        'lsusb'
                    ],
                    explanation: 'The pinout command (installed with gpiozero) displays a color-coded ASCII diagram of the GPIO header for your specific Pi model.'
                },
                {
                    question: 'Which GPIO pins have built-in 1.8k pull-up resistors?',
                    options: [
                        'GPIO17 and GPIO27',
                        'All GPIO pins',
                        'GPIO2 (SDA) and GPIO3 (SCL)',
                        'GPIO14 (TX) and GPIO15 (RX)'
                    ],
                    explanation: 'GPIO2 and GPIO3 are the I2C bus pins (SDA and SCL). They have built-in 1.8k pull-up resistors that are always active.'
                },
                {
                    question: 'What happens if you connect a 5V signal directly to a GPIO pin?',
                    options: [
                        'The Pi reboots safely',
                        'Nothing -- the pin has protection',
                        'The SoC is permanently damaged',
                        'The pin auto-converts to 5V mode'
                    ],
                    explanation: 'There is no overcurrent protection on GPIO pins. Applying 5V damages the BCM SoC input circuitry permanently. There is no fuse and no recovery.'
                },
                {
                    question: 'What resistor value is appropriate for a red LED on 3.3V GPIO at 5mA?',
                    options: [
                        '100 ohms',
                        '330 ohms',
                        '1k ohms',
                        '10k ohms'
                    ],
                    explanation: 'R = (3.3V - 2.0V) / 0.005A = 260 ohms. The nearest standard value is 330 ohms (E24 series).'
                },
                {
                    question: 'Which pins on the header provide 5V power?',
                    options: [
                        'Pins 1 and 17',
                        'Pins 2 and 4',
                        'Pins 6 and 9',
                        'All even-numbered pins'
                    ],
                    explanation: 'Pins 2 and 4 are the two 5V power pins. They connect directly to the USB-C power input. Pins 1 and 17 are 3.3V.'
                },
                {
                    question: 'What is a floating input?',
                    options: [
                        'A pin configured as output',
                        'A pin with no defined voltage level that oscillates randomly',
                        'A pin connected to 3.3V through a pull-up',
                        'A pin reading an analog signal'
                    ],
                    explanation: 'A floating input has no connection to either VCC or GND. It picks up electrical noise and oscillates between HIGH and LOW unpredictably.'
                },
                {
                    question: 'What does gpiozero Button(4) enable by default?',
                    options: [
                        'External pull-down resistor',
                        'No pull resistor',
                        'Internal pull-up resistor',
                        'Debounce filter only'
                    ],
                    explanation: 'Button(4) enables the internal pull-up resistor automatically. The button connects GPIO4 to GND when pressed, pulling it LOW.'
                },
                {
                    question: 'What is the purpose of a level shifter in Pi circuits?',
                    options: [
                        'To increase GPIO current output',
                        'To convert between 3.3V and 5V logic safely',
                        'To add more GPIO pins',
                        'To filter noise from power supplies'
                    ],
                    explanation: 'A level shifter converts signals between 3.3V (Pi GPIO) and 5V (many peripherals). Without it, 5V signals damage the Pi.'
                },
                {
                    question: 'How many ground (GND) pins are on the 40-pin header?',
                    options: [
                        '2',
                        '4',
                        '8',
                        '10'
                    ],
                    explanation: 'There are 8 GND pins on the header: pins 6, 9, 14, 20, 25, 30, 34, and 39. All are internally connected.'
                },
                {
                    question: 'What does the raspi-gpio command do?',
                    options: [
                        'Configures WiFi settings',
                        'Shows the actual hardware state of each GPIO pin',
                        'Installs GPIO libraries',
                        'Controls GPIO from the command line'
                    ],
                    explanation: 'raspi-gpio reads the actual hardware registers to show each pin\'s current level (0/1), function select (input/output/alt), and pull configuration.'
                }
            ]
        });
    </script>
