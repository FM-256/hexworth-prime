<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 9: Power Management',
            description: 'Voltage rails, current budgets, batteries, safe shutdown, and brownout prevention.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-09-quiz',
            moduleId: 'pv-e-09-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What power supply does the Pi 4 officially recommend?',
                    options: [
                        '5V/1A Micro USB',
                        '5V/2A USB-C',
                        '5.1V/3A USB-C',
                        '12V/2A barrel jack'
                    ],
                    explanation: 'The Pi 4 recommends a 5.1V/3A USB-C power supply. The official Pi 4 PSU provides exactly this. Lower current supplies cause brownouts under load.'
                },
                {
                    question: 'What is the maximum current the 3.3V GPIO rail can provide?',
                    options: [
                        '50mA',
                        '200mA',
                        '~800mA',
                        'Unlimited'
                    ],
                    explanation: 'The 3.3V rail is regulated by the Pi onboard regulator with approximately 800mA total capacity on Pi 4. Use it only for logic and small sensors.'
                },
                {
                    question: 'What indicates undervoltage on the Pi desktop?',
                    options: [
                        'A red LED blinks',
                        'A lightning bolt icon appears on screen',
                        'The screen turns red',
                        'An alarm sound plays'
                    ],
                    explanation: 'When input voltage drops below 4.63V, a yellow lightning bolt icon appears on the desktop. This indicates the power supply cannot meet demand.'
                },
                {
                    question: 'What is the formula for battery runtime?',
                    options: [
                        'Hours = Voltage / Current',
                        'Hours = (Capacity_mAh x Efficiency) / Current_mA',
                        'Hours = Watts / Capacity',
                        'Hours = Current / Capacity'
                    ],
                    explanation: 'Runtime = (Battery capacity x Converter efficiency) / Average current. A 10,000mAh bank at 80% efficiency with 1200mA draw: (10000 x 0.8) / 1200 = 6.7 hours.'
                },
                {
                    question: 'Why must external motors have a separate power supply?',
                    options: [
                        'Motors need AC power',
                        'Motors draw more current than GPIO or the 5V rail can safely provide',
                        'Motors generate too much heat',
                        'Motors interfere with WiFi'
                    ],
                    explanation: 'Motors draw hundreds of milliamps to amps. Drawing this from the Pi 5V rail causes voltage drops, brownouts, and potential SD card corruption.'
                },
                {
                    question: 'What dt-overlay enables a shutdown button on GPIO3?',
                    options: [
                        'dtoverlay=shutdown-button',
                        'dtoverlay=gpio-shutdown,gpio_pin=3',
                        'dtoverlay=power-button',
                        'dtparam=shutdown=3'
                    ],
                    explanation: 'Add dtoverlay=gpio-shutdown,gpio_pin=3 to /boot/config.txt. A button between GPIO3 and GND triggers clean shutdown.'
                },
                {
                    question: 'What does vcgencmd get_throttled show?',
                    options: [
                        'CPU temperature',
                        'Power supply status and throttling flags',
                        'Network throttling',
                        'Storage speed'
                    ],
                    explanation: 'get_throttled returns a hex value encoding undervoltage, frequency capping, and throttling events. 0x0 = no issues. Bit 0 = currently undervoltaged.'
                },
                {
                    question: 'What is the purpose of a common ground between separate power supplies?',
                    options: [
                        'It saves wire',
                        'Without shared GND, signal voltages are undefined',
                        'It prevents sparks',
                        'It is optional for most circuits'
                    ],
                    explanation: 'Signal voltages are always relative to ground. Without a shared GND reference, the Pi cannot correctly interpret control signals from external circuits.'
                },
                {
                    question: 'What type of capacitor smooths DC power supply ripple?',
                    options: [
                        'Ceramic (100nF)',
                        'Electrolytic (100uF+)',
                        'Variable',
                        'Air gap'
                    ],
                    explanation: 'Large electrolytic capacitors (100uF-1000uF) on power rails store bulk energy and smooth out voltage ripple. Ceramic caps handle high-frequency noise.'
                },
                {
                    question: 'How much current does a single Neopixel LED draw at full white?',
                    options: [
                        '5mA',
                        '20mA',
                        '60mA',
                        '200mA'
                    ],
                    explanation: 'Each WS2812B Neopixel draws up to 60mA at full white (20mA per R/G/B channel). A 60-pixel strip at full white = 3.6A.'
                },
                {
                    question: 'What Pi model is best for battery-powered projects?',
                    options: [
                        'Pi 4 Model B',
                        'Pi 5',
                        'Pi Zero 2 W',
                        'Pi 400'
                    ],
                    explanation: 'The Pi Zero 2 W draws only ~150mA idle. On a 10,000mAh bank at 85% efficiency: (10000 x 0.85) / 200 = 42.5 hours of runtime.'
                },
                {
                    question: 'What causes SD card corruption on the Pi?',
                    options: [
                        'Reading too many files',
                        'Power loss during write operations',
                        'Using Class 10 cards',
                        'Running out of storage'
                    ],
                    explanation: 'If power is lost while the Pi is writing to the SD card, the filesystem can be corrupted. Always use safe shutdown to flush all writes.'
                },
                {
                    question: 'What does a PiJuice HAT provide?',
                    options: [
                        'Additional GPIO pins',
                        'Battery-backed UPS with clean shutdown on power loss',
                        'Cooling fan control',
                        'Audio output'
                    ],
                    explanation: 'PiJuice is a UPS HAT with a LiPo battery. It provides clean shutdown on power loss, wake-on-RTC, and battery monitoring via I2C.'
                },
                {
                    question: 'What is the correct safety margin for power supply sizing?',
                    options: [
                        'No margin needed',
                        '10%',
                        '25%',
                        '100%'
                    ],
                    explanation: 'Add 25% safety margin above calculated total current draw. If your project draws 2A, specify a 2.5A supply. This accounts for startup surges and measurement errors.'
                },
                {
                    question: 'What component isolates the Pi from high-voltage loads?',
                    options: [
                        'Transistor',
                        'Voltage divider',
                        'Relay',
                        'Capacitor'
                    ],
                    explanation: 'A relay provides galvanic isolation between the Pi low-voltage circuits and high-voltage loads (mains power, 12V systems). The relay coil is switched by GPIO via a transistor.'
                }
            ]
        });
    </script>
</body>
</html>
