<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 7: Serial Protocols',
            description: 'UART, I2C, SPI -- wiring, configuration, Python usage, and protocol comparison.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-07-quiz',
            moduleId: 'pv-e-07-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'How many wires does UART require for bidirectional communication?',
                    options: [
                        '1',
                        '2',
                        '3',
                        '4'
                    ],
                    explanation: 'UART uses 2 data wires: TX (transmit) and RX (receive). GND must also be shared, but is not a data line.'
                },
                {
                    question: 'What must match between two UART devices?',
                    options: [
                        'Wire colors',
                        'Baud rate',
                        'I2C address',
                        'SPI clock polarity'
                    ],
                    explanation: 'Both UART devices must agree on the exact same baud rate (bits per second). Common rates: 9600, 115200. Mismatched rates produce garbled data.'
                },
                {
                    question: 'How many devices can share a single I2C bus?',
                    options: [
                        '2',
                        '8',
                        'Up to 127',
                        'Unlimited'
                    ],
                    explanation: 'I2C uses 7-bit addresses, allowing up to 127 devices (0x01-0x7F) on one bus. Address 0x00 is reserved for general call.'
                },
                {
                    question: 'What two pins does I2C use on the Pi?',
                    options: [
                        'GPIO14 (TX) and GPIO15 (RX)',
                        'GPIO2 (SDA) and GPIO3 (SCL)',
                        'GPIO10 (MOSI) and GPIO9 (MISO)',
                        'GPIO0 and GPIO1'
                    ],
                    explanation: 'I2C uses GPIO2 (SDA = data) on pin 3 and GPIO3 (SCL = clock) on pin 5. These have built-in 1.8k pull-up resistors.'
                },
                {
                    question: 'What command detects I2C devices on bus 1?',
                    options: [
                        'i2cscan -b 1',
                        'i2cdetect -y 1',
                        'i2cfind 1',
                        'lsmod i2c'
                    ],
                    explanation: 'i2cdetect -y 1 scans I2C bus 1 and displays a grid of addresses with detected devices marked.'
                },
                {
                    question: 'What is the maximum practical SPI clock speed on the Pi?',
                    options: [
                        '1 MHz',
                        '10 MHz',
                        '32 MHz',
                        '100 MHz'
                    ],
                    explanation: 'While the SPI hardware supports up to 125MHz, practical reliable operation is around 32MHz maximum due to signal integrity at higher speeds.'
                },
                {
                    question: 'What does SPI \'full-duplex\' mean?',
                    options: [
                        'It uses two separate buses',
                        'Data flows in both directions simultaneously',
                        'It supports 127 devices',
                        'It works over long distances'
                    ],
                    explanation: 'Full-duplex means MOSI sends data to the peripheral while MISO simultaneously receives data back, in the same clock cycle.'
                },
                {
                    question: 'How does SPI select which device to communicate with?',
                    options: [
                        'By address, like I2C',
                        'By baud rate',
                        'By the CS (Chip Select) pin',
                        'By timing sequence'
                    ],
                    explanation: 'Each SPI device has its own CS (Chip Select) pin. Pulling CS LOW activates that device. No addressing scheme -- hardware pin selection.'
                },
                {
                    question: 'What Python library is used for I2C communication?',
                    options: [
                        'i2c-python',
                        'smbus2',
                        'wire',
                        'i2cdev'
                    ],
                    explanation: 'smbus2 is the standard Python library for I2C on Pi. bus = SMBus(1) opens bus 1. Use read_byte_data() and write_byte_data().'
                },
                {
                    question: 'Which protocol is best for reading a single temperature sensor?',
                    options: [
                        'SPI -- it is the fastest',
                        'UART -- it is the simplest',
                        'I2C -- two wires, built-in addressing, ideal for sensors',
                        'Any protocol works equally well'
                    ],
                    explanation: 'I2C is ideal for sensors: only 2 wires, supports multiple devices on one bus, and most sensor ICs include I2C. Speed is sufficient for slow sensor data.'
                },
                {
                    question: 'What happens if you use UART without disabling the login shell?',
                    options: [
                        'Nothing -- it works normally',
                        'The serial port outputs Linux login text instead of your data',
                        'The Pi will not boot',
                        'UART is automatically disabled'
                    ],
                    explanation: 'By default, the Pi uses UART for a serial console login shell. You must disable it via raspi-config to use UART for device communication.'
                },
                {
                    question: 'What is the gpiozero class for reading an MCP3008 ADC?',
                    options: [
                        'ADC(0)',
                        'AnalogIn(0)',
                        'MCP3008(channel=0)',
                        'SPI_ADC(0)'
                    ],
                    explanation: 'MCP3008(channel=0) wraps all SPI communication with the MCP3008 ADC. Returns .value from 0.0 to 1.0.'
                },
                {
                    question: 'How many chip select pins does Pi SPI0 provide?',
                    options: [
                        '1',
                        '2',
                        '4',
                        '8'
                    ],
                    explanation: 'SPI0 provides 2 chip select pins: CE0 (GPIO8) and CE1 (GPIO7). Each can select one SPI device, for a total of 2 devices on SPI0.'
                },
                {
                    question: 'What Adafruit library system works with I2C sensors on the Pi?',
                    options: [
                        'Adafruit IO',
                        'Adafruit CircuitPython',
                        'Adafruit MQTT',
                        'Adafruit BluefruitLE'
                    ],
                    explanation: 'Adafruit CircuitPython libraries (via the blinka compatibility layer) provide consistent Python APIs for hundreds of I2C and SPI sensors.'
                },
                {
                    question: 'Which protocol would you use for a high-speed display like an SPI OLED?',
                    options: [
                        'UART',
                        'I2C',
                        'SPI',
                        'GPIO bit-banging'
                    ],
                    explanation: 'SPI at 32MHz is fast enough for display refresh. I2C at 400kHz would be too slow for smooth display updates on larger screens.'
                }
            ]
        });
    </script>
