<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        var quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Electronic Components',
            description: 'Resistors, capacitors, transistors, diodes, datasheets, and circuit basics.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-e-04-quiz',
            moduleId: 'pv-e-04-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does a resistor do in a circuit?',
                    options: [
                        'Stores energy',
                        'Limits current flow',
                        'Amplifies signals',
                        'Switches current on and off'
                    ],
                    explanation: 'Resistors resist electron flow, measured in Ohms. V = I x R. They convert excess electrical energy into heat and protect components from overcurrent.'
                },
                {
                    question: 'What color code represents a 10k ohm resistor with 5% tolerance?',
                    options: [
                        'Brown-Black-Red-Gold',
                        'Brown-Black-Orange-Gold',
                        'Red-Black-Orange-Silver',
                        'Brown-Black-Yellow-Gold'
                    ],
                    explanation: 'Brown=1, Black=0, Orange=x1000, Gold=5%. 10 x 1000 = 10,000 ohms = 10k.'
                },
                {
                    question: 'What is the formula for Ohm\'s Law?',
                    options: [
                        'P = I x R',
                        'V = I x R',
                        'I = V x R',
                        'R = V x I'
                    ],
                    explanation: 'V = I x R (Voltage = Current x Resistance). This is the most important equation in electronics. Rearrange to find any unknown.'
                },
                {
                    question: 'Why do electrolytic capacitors have a polarity marking?',
                    options: [
                        'For identification only',
                        'Reversed polarity can cause them to explode',
                        'They work the same either way',
                        'To indicate the positive terminal for LEDs'
                    ],
                    explanation: 'Electrolytic capacitors are polarized. The long leg is positive. Wrong polarity causes gas buildup and potential explosion. Always check the stripe marking.'
                },
                {
                    question: 'What is a decoupling capacitor?',
                    options: [
                        'A large capacitor for energy storage',
                        'A 100nF cap placed near an IC to absorb power supply noise',
                        'A capacitor that couples two audio stages',
                        'A variable capacitor for tuning'
                    ],
                    explanation: 'A 100nF ceramic capacitor placed near every IC\'s VCC/GND pins absorbs high-frequency switching noise. Without it, sensors give noisy readings.'
                },
                {
                    question: 'What is the purpose of an NPN transistor in a Pi circuit?',
                    options: [
                        'To convert analog to digital',
                        'To amplify GPIO voltage to 12V',
                        'To let a small GPIO current control a larger current',
                        'To protect against ESD'
                    ],
                    explanation: 'A small current from GPIO into the Base allows a large current from Collector to Emitter. GPIO controls the transistor; the transistor controls the load.'
                },
                {
                    question: 'What is a flyback diode used for?',
                    options: [
                        'To protect against voltage spikes from inductive loads',
                        'To convert AC to DC',
                        'To limit LED current',
                        'To shift voltage levels'
                    ],
                    explanation: 'When an inductive load (motor, relay) switches off, the collapsing magnetic field generates a voltage spike. The flyback diode absorbs this spike.'
                },
                {
                    question: 'What is the forward voltage of a typical red LED?',
                    options: [
                        '0.7V',
                        '1.8V',
                        '3.3V',
                        '5.0V'
                    ],
                    explanation: 'Red LEDs have a forward voltage of approximately 1.8-2.0V. Green is ~2.2V, Blue is ~3.0V, White is ~3.2V.'
                },
                {
                    question: 'How do you identify the cathode of a through-hole LED?',
                    options: [
                        'It is the longer leg',
                        'It is the shorter leg and the flat edge on the casing',
                        'It is always on the left',
                        'It has a colored band'
                    ],
                    explanation: 'The cathode (negative) is the shorter leg. The flat edge on the plastic casing also marks the cathode side. The anode (positive) is the longer leg.'
                },
                {
                    question: 'What three sections should you always check in a datasheet?',
                    options: [
                        'Price, availability, reviews',
                        'Absolute Maximum Ratings, Electrical Characteristics, Pinout',
                        'Introduction, History, Applications',
                        'Only the Application Circuit matters'
                    ],
                    explanation: 'Absolute Maximum Ratings (never exceed), Electrical Characteristics (design targets), and Pinout (physical connections) are the essential sections.'
                },
                {
                    question: 'Two 10k resistors in parallel have what total resistance?',
                    options: [
                        '20k',
                        '10k',
                        '5k',
                        '2.5k'
                    ],
                    explanation: '1/Rt = 1/R1 + 1/R2 = 1/10000 + 1/10000 = 2/10000. Rt = 5000 ohms = 5k. Parallel resistors always result in less than the smallest individual value.'
                },
                {
                    question: 'What is the voltage output of a voltage divider with R1=1k and R2=2k from 5V?',
                    options: [
                        '2.5V',
                        '3.33V',
                        '1.67V',
                        '4.0V'
                    ],
                    explanation: 'Vout = Vin x R2 / (R1 + R2) = 5 x 2000 / (1000 + 2000) = 5 x 0.667 = 3.33V.'
                },
                {
                    question: 'What type of MOSFET works with 3.3V gate voltage?',
                    options: [
                        'Standard MOSFET',
                        'Logic-level MOSFET',
                        'Enhancement MOSFET',
                        'Depletion MOSFET'
                    ],
                    explanation: 'Logic-level MOSFETs (like IRLZ44N) fully turn on with 3.3V gate voltage. Standard MOSFETs need 5V+ and will not fully switch from Pi GPIO.'
                },
                {
                    question: 'What is the power rating formula for a resistor?',
                    options: [
                        'P = V / R',
                        'P = I x R',
                        'P = I^2 x R',
                        'P = V x R'
                    ],
                    explanation: 'P = I^2 x R (or equivalently P = V^2 / R or P = V x I). A 330-ohm resistor at 5mA dissipates 0.008W -- well within a 1/4W rating.'
                },
                {
                    question: 'What component provides complete electrical isolation between circuits?',
                    options: [
                        'Voltage divider',
                        'Level shifter',
                        'Optocoupler',
                        'Capacitor'
                    ],
                    explanation: 'An optocoupler (e.g., PC817) uses an LED and phototransistor with no electrical connection between sides. Essential for mains-powered load isolation.'
                }
            ]
        });
    </script>
