    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Emulation Architecture',
            description: 'Test your understanding of emulators, ROM formats, the RetroPie stack, input latency, and performance tuning on the Raspberry Pi.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-m-01-quiz',
            moduleId: 'pv-m-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the fundamental difference between emulation and virtualization?',
                    options: [
                        'Emulation translates every instruction; virtualization runs guest code natively on compatible hardware',
                        'Emulation requires internet access; virtualization works offline',
                        'Emulation is faster because it uses native code paths',
                        'There is no practical difference between emulation and virtualization'
                    ],
                    explanation: 'Emulation translates every guest instruction into equivalent host operations because the guest and host CPUs are incompatible (e.g., 6502 on ARM). Virtualization runs guest code directly on the host CPU because both share the same instruction set architecture, using hardware features like Intel VT-x or ARM EL2 to isolate the guest.'
                },
                {
                    question: 'Which emulation strategy reads each guest instruction one at a time, decodes it, and executes the equivalent host operation?',
                    options: [
                        'Dynamic recompilation (JIT)',
                        'Interpretation',
                        'High-level emulation (HLE)',
                        'Binary translation caching'
                    ],
                    explanation: 'An interpreter processes guest instructions sequentially: fetch, decode, execute, repeat. It is the simplest emulation strategy and offers the highest accuracy because it can handle every instruction exactly as the original hardware did. The trade-off is speed -- interpreting is slower than JIT recompilation.'
                },
                {
                    question: 'What advantage does JIT (dynamic recompilation) have over interpretation for emulation?',
                    options: [
                        'It is more accurate because it simulates every CPU cycle',
                        'It translates blocks of guest instructions into native host instructions and caches them for reuse, improving speed',
                        'It requires less memory because no translation cache is needed',
                        'It eliminates the need for BIOS files'
                    ],
                    explanation: 'JIT recompilation translates blocks of guest code into native ARM (or x86) instructions ahead of execution and caches the translated blocks. When the same code block runs again, the cached native version executes directly without re-translation. This is significantly faster than interpreting instruction by instruction, which is why demanding systems like N64 and PSP use JIT on the Pi.'
                },
                {
                    question: 'What does a ROM file contain?',
                    options: [
                        'The emulator source code for a specific console',
                        'A binary dump of the data stored on a game cartridge\'s read-only memory chips',
                        'The BIOS firmware of the original console',
                        'A compressed video recording of gameplay'
                    ],
                    explanation: 'A ROM file is a binary copy of the data stored in the read-only memory chips of a game cartridge. This includes the game code, graphics data, audio data, and any metadata stored in the cartridge header. The emulator loads this binary data and executes it as if it were reading from the original cartridge hardware.'
                },
                {
                    question: 'Which N64 ROM format uses big-endian byte order and is identified by the magic bytes 0x80371240?',
                    options: [
                        '.v64 (byte-swapped)',
                        '.n64 (little-endian)',
                        '.z64 (big-endian)',
                        '.rom (headerless)'
                    ],
                    explanation: 'The .z64 format stores N64 ROM data in native big-endian byte order, which matches how the N64 hardware reads its cartridges. The first four bytes are 0x80371240. The .v64 format is byte-swapped (0x37804012) and .n64 is little-endian (0x40123780). Most emulators auto-detect the format from these magic bytes.'
                },
                {
                    question: 'In the RetroPie stack, what is the role of RetroArch?',
                    options: [
                        'It is the Linux kernel driver for the GPU',
                        'It is the graphical frontend that displays game lists and box art',
                        'It is the Libretro API runtime that provides input handling, video output, audio mixing, save states, and shaders',
                        'It is the package manager that downloads emulator cores'
                    ],
                    explanation: 'RetroArch is the Libretro runtime -- the universal wrapper that provides input, video, audio, save states, shaders, netplay, and configuration for all Libretro cores. It sits between the frontend (EmulationStation) and the emulator cores (Nestopia, Snes9x, mGBA). The cores handle emulation; RetroArch handles everything else.'
                },
                {
                    question: 'What is a Libretro core?',
                    options: [
                        'A Linux kernel module for GPU acceleration',
                        'An individual emulator engine compiled as a shared library (.so) that implements a standardized API',
                        'A ROM compression format used by RetroArch',
                        'A save state encryption protocol'
                    ],
                    explanation: 'A Libretro core is an emulator compiled as a shared library that implements the Libretro API: retro_init(), retro_load_game(), retro_run() (one frame), retro_serialize() (save state). Each core knows nothing about windowing or audio output -- RetroArch provides all of that. This decoupling lets you swap cores without reconfiguring the frontend.'
                },
                {
                    question: 'What is the primary function of EmulationStation in the RetroPie stack?',
                    options: [
                        'It compiles emulator cores from source code',
                        'It is the graphical frontend that scans ROM directories, displays game lists with metadata, and launches the correct emulator',
                        'It handles audio output and shader rendering',
                        'It provides the Linux kernel for the Raspberry Pi'
                    ],
                    explanation: 'EmulationStation is the frontend -- the graphical interface you see when RetroPie boots. It scans the ~/RetroPie/roms/ directories, organizes games by system, displays metadata and box art (scraped from online databases), and launches the appropriate emulator core when you select a game.'
                },
                {
                    question: 'Which latency source adds 10-30ms and can be eliminated by using a wired USB connection instead?',
                    options: [
                        'TV/monitor processing delay',
                        'Emulator frame buffering',
                        'Bluetooth stack latency',
                        'USB controller polling'
                    ],
                    explanation: 'The Bluetooth stack on the Pi adds 10-30ms of latency on top of the controller\'s own processing time. This is because Bluetooth uses a connection interval (typically 7.5-15ms) and must handle pairing, encryption, and buffering. A wired USB connection eliminates this entirely, reducing total input latency to just 1-8ms for the USB polling itself.'
                },
                {
                    question: 'What does RetroArch\'s "run-ahead" feature do to reduce input latency?',
                    options: [
                        'It overclocks the CPU during gameplay',
                        'It runs the emulator N frames ahead, then loads a save state to display the correct frame',
                        'It reduces the display resolution to speed up rendering',
                        'It disables audio processing to free up CPU cycles'
                    ],
                    explanation: 'Run-ahead runs the emulator N frames ahead of what is displayed, captures the result, then rewinds to the current frame using save states. When your button press arrives, the emulator has already computed the result and can display it immediately. The cost is roughly 2x CPU usage per frame of run-ahead, because the emulator must compute both the displayed frame and the ahead frames.'
                },
                {
                    question: 'Which console generation is NOT practical to emulate on current Raspberry Pi hardware?',
                    options: [
                        '8-bit systems (NES, Game Boy)',
                        '16-bit systems (SNES, Genesis)',
                        '32-bit systems (PlayStation 1, GBA)',
                        '6th generation systems (GameCube, PS2)'
                    ],
                    explanation: 'GameCube and PS2 (6th generation) are not practical on current Pi hardware. Some simple titles may boot but are not playable at full speed. The Pi 5 handles most systems through N64/PSP (5th gen), and 8-bit/16-bit systems run comfortably even on the Pi 3B+.'
                },
                {
                    question: 'What Linux command sets the CPU governor to "performance" mode for maximum clock speed?',
                    options: [
                        'sudo apt install performance-mode',
                        'echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor',
                        'vcgencmd set_governor performance',
                        'sudo systemctl start performance.service'
                    ],
                    explanation: 'The Linux kernel CPU frequency scaling governor is set by writing to the scaling_governor sysfs file. The "performance" governor locks the CPU at its maximum frequency, which is important for emulation where consistent high throughput prevents frame drops. The default "ondemand" or "schedutil" governor may throttle the CPU during brief idle moments between frames.'
                },
                {
                    question: 'Why do some emulator cores require BIOS files to operate?',
                    options: [
                        'BIOS files contain the game code itself',
                        'BIOS files are the original console firmware that the emulator must execute for accurate system initialization and hardware behavior',
                        'BIOS files are required by copyright law',
                        'BIOS files provide internet connectivity for online features'
                    ],
                    explanation: 'Some consoles (PS1, Sega CD, Dreamcast) boot by executing firmware stored in ROM chips on the motherboard. This firmware initializes hardware, displays the boot animation, and sets up the environment before loading the game. Emulators that aim for accuracy need these BIOS dumps to replicate the full boot process. Some cores offer HLE (High-Level Emulation) alternatives that simulate BIOS behavior without the original dump.'
                },
                {
                    question: 'According to precedent set by Sony v. Connectix (2000), which of the following is legal?',
                    options: [
                        'Downloading ROM files for games you do not own',
                        'Writing and distributing emulator software',
                        'Distributing copyrighted ROM files online',
                        'Circumventing DRM protections on modern consoles'
                    ],
                    explanation: 'The Sony v. Connectix ruling established that writing emulator software is legal under the fair use doctrine, even when reverse engineering the original hardware is required. What is not legal is distributing copyrighted ROM files (the games themselves) or circumventing DRM protections (which falls under DMCA Section 1201). Dumping ROMs from cartridges you own for personal backup is generally considered legal.'
                },
                {
                    question: 'At what temperature does thermal throttling begin on the Raspberry Pi 5?',
                    options: [
                        '60 degrees Celsius',
                        '70 degrees Celsius',
                        '80 degrees Celsius',
                        '100 degrees Celsius'
                    ],
                    explanation: 'The Raspberry Pi 5 begins thermal throttling at 80 degrees Celsius. When the CPU temperature reaches this threshold, the firmware reduces clock speed to prevent damage. For sustained emulation workloads (especially N64 and PSP), adequate cooling (heatsink + fan) is essential to maintain full performance without throttling.'
                }
            ]
        });
        quiz.start();
    </script>
