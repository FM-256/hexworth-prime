        body { min-height: 100vh; background: linear-gradient(135deg, #0d0408 0%, #1a0810 50%, #0d0408 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; }
        .page-header { padding: 15px 30px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(197,26,74,0.2); display: flex; justify-content: space-between; align-items: center; }

</head>
<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Procedural Generation',
            description: 'Test your understanding of seeds, weighted random choices, Perlin noise, endless runner architecture, difficulty curves, and dungeon generation.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-m-04-quiz',
            moduleId: 'pv-m-04-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Why do procedural generation systems use pseudo-random number generators (PRNGs) instead of true random number generators?',
                    options: [
                        'PRNGs are faster than true random generators',
                        'PRNGs are deterministic -- given the same seed, they produce the same sequence, making worlds reproducible',
                        'True random generators do not exist in computers',
                        'PRNGs produce better distributions for game content'
                    ],
                    explanation: 'The key advantage of PRNGs for procedural generation is determinism. Given the same seed, a PRNG always produces the identical sequence of numbers. This means an entire game world can be recreated from a single integer -- the seed. Players can share seeds to play the same level, developers can reproduce bugs on specific seeds, and regression testing becomes possible.'
                },
                {
                    question: 'What does random.seed(42) do in Python?',
                    options: [
                        'Generates the number 42',
                        'Initializes the PRNG state so that all subsequent random calls produce a deterministic, reproducible sequence',
                        'Sets the maximum value that random.randint() can return to 42',
                        'Creates 42 random numbers and stores them in a buffer'
                    ],
                    explanation: 'random.seed(42) initializes the Mersenne Twister PRNG with the value 42 as its starting state. Every random.randint(), random.random(), or random.choices() call after this will produce the same value in the same order, every time. Calling seed(42) again resets the sequence to the beginning.'
                },
                {
                    question: 'In weighted random generation, what does a weight of 60 for "ground" and 5 for "collectible" mean?',
                    options: [
                        'Ground tiles are 60 pixels wide; collectibles are 5 pixels wide',
                        'Ground appears in 60% of the level and collectibles in 5%, given total weights sum to 100',
                        'Ground is generated first (priority 60) and collectibles last (priority 5)',
                        'There are exactly 60 ground tiles and 5 collectible tiles per level'
                    ],
                    explanation: 'With random.choices(elements, weights=[60, 20, 15, 5]), the probability of each element is its weight divided by the sum of all weights (100). Ground has 60/100 = 60% chance, gap has 20%, platform has 15%, and collectible has 5% chance per tile. Weights are relative -- [120, 40, 30, 10] would produce identical probabilities.'
                },
                {
                    question: 'Why would you validate a procedurally generated level after generation?',
                    options: [
                        'To compress the level data for storage',
                        'To ensure the level meets playability constraints (e.g., no gap wider than 3 tiles, path exists from start to exit)',
                        'To convert the level from integers to graphical tiles',
                        'To calculate the optimal speedrun route'
                    ],
                    explanation: 'Pure random generation can produce unplayable results: impossible gaps, disconnected regions, or levels with no path from start to exit. The two-pass approach -- generate freely, then validate and fix violations -- is simpler and more reliable than building all constraints into the generator. Common fixes: cap consecutive gaps, ensure connectivity with flood-fill, and verify a path exists.'
                },
                {
                    question: 'How does Perlin noise differ from random.random()?',
                    options: [
                        'Perlin noise is slower but otherwise identical',
                        'Perlin noise produces smooth, continuous values where adjacent samples are similar, while random.random() produces independent values',
                        'Perlin noise only works in 3D space',
                        'random.random() is deterministic but Perlin noise is truly random'
                    ],
                    explanation: 'Perlin noise is a gradient noise function where adjacent input values produce similar output values. This creates smooth, organic transitions -- rolling hills, natural cave formations, and flowing landscapes. random.random() produces independent values with no relationship to neighbors, resulting in jagged, incoherent noise that looks like static. Both are deterministic with the same seed.'
                },
                {
                    question: 'What does the "scale" parameter control in Perlin noise terrain generation?',
                    options: [
                        'The height range of the terrain',
                        'How "zoomed in" the noise is -- smaller scale produces broader features, larger scale produces tighter features',
                        'The number of terrain layers generated',
                        'The color palette used for rendering'
                    ],
                    explanation: 'Scale is multiplied by the input coordinate: pnoise1(x * scale). A small scale (0.02) means the input changes slowly, producing broad, gentle hills. A large scale (0.15) means the input changes rapidly, producing tight, frequent peaks. Think of it as zooming a camera on the noise function -- small scale zooms out (big features), large scale zooms in (small features).'
                },
                {
                    question: 'What do octaves add to Perlin noise?',
                    options: [
                        'Additional color channels for the terrain',
                        'Layers of detail at increasing frequency and decreasing amplitude, adding fine detail on top of broad shapes',
                        'Repeat loops that regenerate the same noise pattern',
                        'Additional dimensions (2D becomes 3D, 3D becomes 4D)'
                    ],
                    explanation: 'Each octave adds noise at double the frequency and half the amplitude of the previous octave. Octave 1 creates the broad terrain shape. Octave 2 adds medium bumps. Octave 3 adds small irregularities. The result is multi-scale detail, similar to how real terrain has mountains (broad), hills (medium), and rocks (fine). 4 octaves is a common default.'
                },
                {
                    question: 'In 2D Perlin noise cave generation, what does the threshold parameter control?',
                    options: [
                        'The size of individual cave rooms',
                        'The cutoff between solid rock (below threshold) and open cave (above threshold), controlling cave density',
                        'The number of cave entrances',
                        'The depth of the cave system in tiles'
                    ],
                    explanation: 'The threshold converts continuous noise values (-1 to 1) into binary: values above the threshold become air (open cave), values below become solid rock. A low threshold (e.g., -0.1) creates more open space (caverns). A high threshold (e.g., 0.3) creates more solid rock with small tunnels. Adjusting threshold tunes the density of the cave system.'
                },
                {
                    question: 'How does an endless runner manage memory when the world is infinite?',
                    options: [
                        'It stores the entire world in compressed format on disk',
                        'It generates chunks ahead of the player and discards old chunks behind, keeping only a sliding window in memory',
                        'It uses virtual memory to swap level data to the swap partition',
                        'It limits the level length to the maximum integer value'
                    ],
                    explanation: 'A ChunkManager generates terrain in fixed-size chunks (e.g., 20 tiles wide). It maintains a buffer of chunks ahead of the player (BUFFER_AHEAD) and behind (BUFFER_BEHIND). As the player moves forward, new chunks are generated deterministically (using seed + chunk_index) and old chunks are deleted from the dictionary. Only 4-5 chunks are ever in memory at once.'
                },
                {
                    question: 'Why is each chunk generated using random.seed(self.seed + chunk_idx)?',
                    options: [
                        'To make each chunk unique but reproducible -- the same chunk index always generates the same terrain',
                        'To prevent chunks from sharing the same random sequence',
                        'To make the seed larger and more secure',
                        'To synchronize generation across multiple CPU cores'
                    ],
                    explanation: 'By seeding the PRNG with the world seed plus the chunk index before generating each chunk, the content of any specific chunk is completely determined by these two values. This means: (1) the same chunk regenerates identically if the player backtracks, (2) different world seeds produce different worlds, and (3) the generation order does not matter -- any chunk can be generated independently.'
                },
                {
                    question: 'What is the advantage of a logarithmic difficulty curve over a linear one?',
                    options: [
                        'Logarithmic curves are simpler to implement',
                        'Logarithmic curves progress quickly early on (when the player is learning) then flatten out (preventing overwhelming late-game spikes)',
                        'Logarithmic curves make the game easier overall',
                        'Logarithmic curves are required by the Pygame framework'
                    ],
                    explanation: 'A logarithmic curve (difficulty = log(chunk + 1) / log(max)) increases rapidly at first -- the player experiences noticeable progression early, keeping engagement high. Then it flattens out, preventing the difficulty from spiking to impossible levels in the late game. A linear ramp (y = mx) keeps increasing at the same rate forever, which can make later levels feel unfairly hard.'
                },
                {
                    question: 'In room-based dungeon generation, what is the purpose of L-shaped corridors connecting rooms?',
                    options: [
                        'To create visually interesting level layouts',
                        'To ensure every room is reachable by providing guaranteed paths between adjacent rooms',
                        'To add extra enemies in corridor segments',
                        'To conform to building code requirements'
                    ],
                    explanation: 'L-shaped corridors (horizontal segment then vertical segment) connect the centers of adjacent rooms, guaranteeing that every room in the dungeon is reachable from every other room. Rooms are sorted by x-position, then each adjacent pair is connected. This simple algorithm ensures full connectivity while creating natural-looking dungeon layouts with hallways.'
                },
                {
                    question: 'What is Wave Function Collapse (WFC)?',
                    options: [
                        'A physics simulation for water rendering',
                        'A constraint-based algorithm that generates content by repeatedly collapsing the cell with the fewest valid options and propagating constraints to neighbors',
                        'A sound synthesis technique for generating game audio',
                        'A method for compressing procedural level data'
                    ],
                    explanation: 'WFC starts with a grid where every cell can be any tile type. It picks the most constrained cell (fewest remaining options), collapses it to one choice, then propagates adjacency constraints to neighbors (removing options that violate rules). This process repeats until all cells are determined. The result is coherent, visually consistent output from simple local rules.'
                },
                {
                    question: 'How would you test that procedurally generated levels are always solvable?',
                    options: [
                        'Play-test each level manually before deploying',
                        'Generate thousands of levels from sequential seeds and assert that a path from start to exit exists in every one',
                        'Run the generator in a debugger and inspect each tile',
                        'Disable all obstacles and enemies during testing'
                    ],
                    explanation: 'Automated seed regression testing generates a large number of levels (1,000-10,000) from sequential seeds and uses a pathfinding algorithm (BFS or A*) to verify that a valid path exists from the spawn point to the exit in every level. Any seed that produces an unsolvable level is logged as a failure. Known-good seeds can be stored as regression fixtures.'
                },
                {
                    question: 'What post-processing step ensures that a noise-generated cave system is fully connected?',
                    options: [
                        'Increasing the number of Perlin noise octaves',
                        'Flood-filling to find the largest connected air region and filling all smaller disconnected regions with solid rock',
                        'Running the noise generation twice and averaging the results',
                        'Reducing the threshold parameter to zero'
                    ],
                    explanation: 'Raw 2D Perlin noise can create disconnected air pockets -- cave chambers with no tunnel connecting them to the rest of the system. Flood-fill (BFS/DFS from one air cell) identifies all connected air cells. The largest connected region is kept; all other smaller air regions are filled with solid rock. This guarantees the player can reach every part of the cave without being trapped.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
