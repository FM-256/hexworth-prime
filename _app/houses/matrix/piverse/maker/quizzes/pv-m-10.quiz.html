    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 10: Motor Control & Robotics Theory',
            description: 'Test your understanding of DC motors, servo motors, stepper motors, H-bridge circuits, differential drive, encoder feedback, PID control, and line following on the Raspberry Pi.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-m-10-quiz', moduleId: 'pv-m-10-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'Why can a Raspberry Pi GPIO pin not drive a motor directly?', options: ['GPIO pins only output digital signals, not analog', 'GPIO pins supply a maximum of 16mA at 3.3V, while motors require 200-1500mA', 'GPIO pins are input-only', 'Motors require AC power and GPIO provides DC'], explanation: 'Each Raspberry Pi GPIO pin can source a maximum of approximately 16mA at 3.3V, and the total current across all GPIO pins must not exceed 50mA. A small DC motor (like a TT motor) draws 200-500mA under no load and up to 800mA at stall. Connecting a motor directly to a GPIO pin would draw far more current than the pin can supply, potentially damaging the Broadcom SoC. A motor driver board (like the DRV8833 or L298N) acts as a power amplifier -- the Pi sends low-current control signals, and the driver delivers high current from a separate battery pack.' },
                { question: 'What is the function of an H-bridge circuit?', options: ['It converts AC power to DC power for the motor', 'It controls motor direction by switching voltage polarity using four transistors in an H configuration', 'It measures the motor speed using a tachometer', 'It reduces the motor voltage to a safe level'], explanation: 'An H-bridge uses four switching elements (transistors or MOSFETs) arranged in an H pattern with the motor in the crossbar. By closing specific pairs of switches, current flows through the motor in either direction: Q1+Q4 closed = forward, Q3+Q2 closed = reverse. Closing both top switches (Q1+Q3) or both bottom switches (Q2+Q4) creates a braking condition where the motor terminals are shorted. Opening all switches lets the motor coast freely. PWM applied to the enable pin controls speed by rapidly switching the motor on and off.' },
                { question: 'What is shoot-through in an H-bridge, and why is it dangerous?', options: ['When the motor draws too much current', 'When opposing transistors on the same side are closed simultaneously, creating a direct short from power to ground', 'When the motor reverses too quickly', 'When the PWM frequency is too high'], explanation: 'Shoot-through occurs when both the top and bottom transistor on the same leg of the H-bridge are conducting simultaneously (e.g., Q1 and Q2 both ON). This creates a direct path from the positive battery terminal through both transistors to ground, bypassing the motor entirely. The resulting current spike is limited only by the wire and transistor resistance -- often tens or hundreds of amps for a brief instant. This can instantly destroy the transistors and potentially damage the power supply. Modern motor driver ICs (L298N, DRV8833, TB6612FNG) include built-in dead-time insertion and shoot-through protection logic.' },
                { question: 'How does PWM (Pulse Width Modulation) control motor speed?', options: ['By changing the voltage level continuously', 'By rapidly switching the motor on and off -- the ratio of on-time to total period determines effective speed', 'By changing the motor polarity rapidly', 'By limiting the current to the motor'], explanation: 'PWM rapidly switches the motor between full voltage and zero voltage at a fixed frequency (typically 1-20kHz). The duty cycle (percentage of each period the motor is on) determines the average voltage the motor receives. 50% duty cycle = 50% of full voltage = approximately half speed. 100% duty cycle = full voltage = full speed. The motor inertia and inductance smooth these rapid pulses into continuous rotation. The Pi can generate PWM on any GPIO pin (software PWM) or on GPIO 12, 13, 18, 19 (hardware PWM, which is more precise and does not consume CPU cycles).' },
                { question: 'What is the difference between a standard servo and a continuous rotation servo?', options: ['Standard servos are digital; continuous rotation servos are analog', 'Standard servos rotate to a specific angle (0-180 degrees); continuous rotation servos spin freely with speed and direction controlled by pulse width', 'Standard servos require more power', 'There is no difference -- they are the same component'], explanation: 'A standard servo has an internal potentiometer that provides position feedback to a control circuit. The servo rotates to a specific angle based on the input pulse width: 1ms = 0 degrees, 1.5ms = 90 degrees, 2ms = 180 degrees. It actively holds its position. A continuous rotation servo has its potentiometer feedback disconnected or centered. The pulse width now controls speed and direction: 1.5ms = stop, less than 1.5ms = one direction, greater than 1.5ms = other direction. Continuous rotation servos are useful as pre-geared motors with easy Pi control but sacrifice precise position control.' },
                { question: 'How many steps per revolution does a typical NEMA 17 stepper motor have in full-step mode?', options: ['50 steps (7.2 degrees per step)', '100 steps (3.6 degrees per step)', '200 steps (1.8 degrees per step)', '400 steps (0.9 degrees per step)'], explanation: 'A standard NEMA 17 stepper motor has 200 full steps per revolution, which means each step moves the rotor exactly 1.8 degrees (360 / 200 = 1.8). This precise angular positioning without feedback is what makes steppers ideal for CNC machines and 3D printers. With 1/16 microstepping (supported by drivers like the A4988 or DRV8825), each full step is subdivided into 16 microsteps, giving 3,200 positions per revolution (0.1125 degrees per microstep). The tradeoff is that microstepping reduces torque per step and requires more frequent step pulses for the same rotational speed.' },
                { question: 'What advantage does the TB6612FNG motor driver have over the L298N?', options: ['It supports higher voltage motors', 'It uses MOSFETs instead of bipolar transistors, resulting in much lower voltage drop and higher efficiency', 'It includes built-in encoders', 'It can drive stepper motors'], explanation: 'The L298N uses bipolar junction transistors (BJTs) that drop 2-3V between the battery and the motor. On a 6V battery, this means the motor only receives 3-4V -- a massive efficiency loss, especially for battery-powered robots. The TB6612FNG uses MOSFET transistors with a voltage drop of only ~0.5V, delivering nearly the full battery voltage to the motor. This translates to faster motor speed, longer battery life, and less heat generation. For battery-powered Pi robots using TT motors, the TB6612FNG (or the similar DRV8833) is the clear choice over the L298N.' },
                { question: 'In a differential drive robot, how do you make the robot spin in place (zero-radius turn)?', options: ['Run both motors forward at full speed', 'Stop both motors', 'Run one motor forward and the other in reverse at equal speed', 'Run both motors in reverse'], explanation: 'A zero-radius (spin-in-place) turn is achieved by running the left and right motors at equal speed but in opposite directions. If the left motor spins forward and the right motor spins backward (or vice versa), the robot rotates around its own center point. The turning radius is zero -- the robot stays in the same spot while changing its heading. This is one of four basic differential drive maneuvers: forward (both same direction), pivot turn (one stopped), spin (opposite directions), and arc turn (both forward but different speeds).' },
                { question: 'What does a quadrature encoder provide that a single-channel encoder cannot?', options: ['Higher resolution', 'Direction detection -- by comparing two 90-degree-offset channels, the system knows which way the motor is spinning', 'Temperature measurement', 'Speed limiting'], explanation: 'A single-channel encoder produces a pulse train that tells you how fast the motor is spinning (by measuring pulse frequency) and how far it has traveled (by counting pulses), but it cannot tell you the direction of rotation. A quadrature encoder adds a second sensor offset by 90 degrees from the first. When the motor spins clockwise, Channel A leads Channel B (A rises before B). When spinning counter-clockwise, Channel B leads Channel A. Comparing which channel leads determines direction. Additionally, counting both rising and falling edges of both channels quadruples the effective resolution.' },
                { question: 'What does the Proportional (P) term in a PID controller do for line following?', options: ['It predicts where the line will be in the future', 'It applies a correction proportional to the current error -- the further off-center, the harder it steers', 'It accumulates past errors over time', 'It smooths out sudden changes in sensor readings'], explanation: 'The Proportional term calculates the correction as Kp * error, where error is the difference between the desired position (center = 0) and the actual line position. If the line is far left (error = -2), the P term generates a large correction to steer right. If the line is slightly left (error = -0.5), the correction is proportionally smaller. The P term handles the immediate, current error. Without it, the robot has no idea how far off the line it is. However, P alone can cause oscillation (overshoot) around the line -- the Derivative (D) term adds damping to prevent this.' },
                { question: 'What does the Derivative (D) term in a PID controller prevent?', options: ['Steady-state error', 'Oscillation and overshoot by applying correction based on how fast the error is changing', 'Motor stall from excessive current', 'Sensor noise'], explanation: 'The Derivative term calculates the rate of change of the error (how quickly the robot is moving toward or away from the line center). If the robot is rapidly approaching the center (error decreasing quickly), the D term applies a braking correction to prevent overshoot. If the error is stable (not changing), the D term contributes nothing. The correction is Kd * (error - previous_error). Without the D term, a proportional-only controller tends to oscillate back and forth across the line. The D term acts as a damper, smoothing the robot onto the line instead of bouncing across it.' },
                { question: 'What is back-EMF and why do motor driver boards include flyback diodes?', options: ['Back-EMF is electrical noise from the motor; flyback diodes filter it', 'Back-EMF is voltage generated by a spinning motor when power is cut -- flyback diodes absorb the resulting voltage spikes to protect the driver and Pi', 'Back-EMF is heat generated by the motor; flyback diodes dissipate it', 'Back-EMF is resistance in the motor windings; flyback diodes reduce it'], explanation: 'A spinning motor is also a generator. When you suddenly cut power to a DC motor (or reverse it), the motor inertia keeps the rotor spinning, and the motor windings generate a voltage in the opposite direction to the driving voltage. This back-EMF can produce voltage spikes significantly higher than the supply voltage -- enough to damage the transistors in the H-bridge or even reach the Pi GPIO pins. Flyback diodes (also called free-wheeling diodes) are placed in parallel with the motor to provide a safe current path for this reverse voltage, clamping the spike to a safe level.' },
                { question: 'How does an IR reflectance sensor (TCRT5000) detect a dark line on a light surface?', options: ['It uses a camera to take a photo of the surface', 'It emits IR light and measures how much is reflected -- dark surfaces absorb IR (low reflection = line detected)', 'It measures the temperature difference between the line and the surface', 'It uses ultrasonic waves to detect the line texture'], explanation: 'The TCRT5000 contains an IR LED that emits invisible infrared light downward onto the surface and a photodiode/phototransistor that measures the reflected light. Light-colored surfaces reflect most of the IR light back to the sensor (high signal = no line). Dark-colored surfaces (the line) absorb most of the IR light (low signal = line detected). The sensor outputs either a digital signal (HIGH/LOW based on a threshold set by a potentiometer) or an analog voltage proportional to the reflected light intensity. Multiple sensors arranged in a line provide spatial resolution for determining the line position.' },
                { question: 'What Python library provides the simplest motor control interface for Raspberry Pi beginners?', options: ['RPi.GPIO', 'pigpio', 'gpiozero', 'wiringPi'], explanation: 'gpiozero provides high-level, object-oriented abstractions for common Pi peripherals. Motor control requires just two lines: "from gpiozero import Motor" and "motor = Motor(forward=17, backward=18)". The Motor class handles PWM setup, direction control, and speed ramping internally. The Robot class provides even higher-level control with "robot = Robot(left=(17,18), right=(22,23))" and "robot.forward(0.5)" for half-speed forward motion. pigpio offers more precise timing (microsecond PWM resolution) but requires more code. RPi.GPIO is lower-level and lacks motor abstractions.' },
                { question: 'Why is active cooling recommended when running motor control code on a Pi robot?', options: ['Motor vibration heats the Pi', 'The GPIO pins generate heat when sourcing current', 'The CPU processes PID calculations and sensor reads continuously, and thermal throttling at 80C would cause erratic motor control', 'Motors need the fan to cool them down'], explanation: 'A Pi robot running PID line following reads multiple sensors, performs calculations, and updates PWM outputs in a tight loop -- often 50-100 times per second. This keeps the CPU active and warm. Combined with the Pi being enclosed in a robot chassis with poor airflow, the CPU temperature can reach the 80C throttling threshold where the Pi reduces clock speed to prevent overheating. When the CPU throttles, the PID loop timing becomes unpredictable, causing jerky, unreliable motor control. A small heatsink with a fan keeps the CPU below throttling temperature, ensuring consistent control loop timing.' }
            ]
        });
        quiz.start();
    </script>
