<body>
    <header class="page-header">
        <a href="../../../index.html">&larr; Back to PiVerse Hub</a>
        <span class="brand">Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: Home Automation Protocols',
            description: 'Test your understanding of MQTT pub/sub, Zigbee, Z-Wave, Home Assistant, Node-RED, and IoT security.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-m-05-quiz',
            moduleId: 'pv-m-05-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What messaging pattern does MQTT use?',
                    options: [
                        'Request/response (like HTTP)',
                        'Publish/subscribe with a central broker',
                        'Peer-to-peer direct messaging',
                        'Polling with a shared database'
                    ],
                    explanation: 'MQTT uses publish/subscribe (pub/sub) with a central broker. Publishers send messages to topics; subscribers register interest in topics. The broker routes messages from publishers to all matching subscribers. Publishers and subscribers never communicate directly -- they are fully decoupled, meaning you can add or remove either without modifying the other.'
                },
                {
                    question: 'What is the role of the MQTT broker (e.g., Mosquitto)?',
                    options: [
                        'It generates sensor data and publishes it to subscribers',
                        'It receives all published messages and forwards them to subscribers based on topic matching',
                        'It stores historical data for long-term analytics',
                        'It controls Zigbee and Z-Wave devices directly'
                    ],
                    explanation: 'The broker is the central message router. It accepts connections from clients (publishers and subscribers), receives published messages, matches them against subscriber topic filters (including wildcards), and delivers matching messages to subscribers. Mosquitto on the Pi handles thousands of messages per second with minimal CPU usage.'
                },
                {
                    question: 'In the MQTT topic "home/livingroom/temp", what does subscribing to "home/#" match?',
                    options: [
                        'Only home/livingroom/temp',
                        'All topics starting with "home/" at any depth',
                        'Only topics with exactly two levels after "home/"',
                        'Nothing -- # is not a valid wildcard'
                    ],
                    explanation: 'The # wildcard matches any number of topic levels. "home/#" matches home/livingroom/temp, home/kitchen/humidity, home/bedroom/motion/status, and any other topic starting with "home/" regardless of depth. The + wildcard matches exactly one level: "home/+/temp" matches home/livingroom/temp and home/kitchen/temp but NOT home/livingroom/sensor/temp.'
                },
                {
                    question: 'What is QoS 0 in MQTT?',
                    options: [
                        'Exactly-once delivery with full handshake',
                        'At-least-once delivery with acknowledgment',
                        'Fire and forget -- the message is sent once with no delivery guarantee',
                        'Queued delivery -- messages are stored until the subscriber connects'
                    ],
                    explanation: 'QoS 0 (At most once) sends the message once with no acknowledgment or retry. If the subscriber is offline or the packet is lost, the message is gone. This is the fastest QoS level and is appropriate for high-frequency sensor data where occasional lost readings are acceptable. QoS 1 guarantees at-least-once delivery with acknowledgments. QoS 2 guarantees exactly-once with a four-step handshake.'
                },
                {
                    question: 'What does the "retain" flag do when publishing an MQTT message?',
                    options: [
                        'It encrypts the message for secure transmission',
                        'It tells the broker to store the last message on that topic and deliver it to new subscribers immediately',
                        'It prevents the message from being forwarded to any subscriber',
                        'It compresses the message payload to save bandwidth'
                    ],
                    explanation: 'When retain=True, the broker keeps the most recent message on that topic. Any new client that subscribes to the topic immediately receives the retained message without waiting for the next publish. This is essential for state topics like "home/porch/light" where new subscribers need to know the current state (on or off) immediately upon connecting.'
                },
                {
                    question: 'Which wireless protocol operates on a dedicated sub-GHz frequency band to avoid interference with Wi-Fi?',
                    options: [
                        'Zigbee (2.4 GHz)',
                        'Z-Wave (868/908 MHz)',
                        'Bluetooth LE (2.4 GHz)',
                        'Thread / Matter (2.4 GHz)'
                    ],
                    explanation: 'Z-Wave operates at 868 MHz (Europe) or 908 MHz (North America), which is a dedicated sub-GHz band with far less interference than the crowded 2.4 GHz spectrum shared by Wi-Fi, Zigbee, Bluetooth, and microwave ovens. This gives Z-Wave better range (30-100m through walls) and more reliable communication, though devices tend to cost more than Zigbee equivalents.'
                },
                {
                    question: 'What is mesh networking in the context of Zigbee?',
                    options: [
                        'A network where all devices connect directly to the router',
                        'A network where mains-powered devices relay messages for other devices, extending range without a central router',
                        'A network that uses mesh-shaped antennas for better signal',
                        'A network protocol that only works with wired connections'
                    ],
                    explanation: 'In a Zigbee mesh, mains-powered devices (smart plugs, bulbs) act as routers that relay messages for other devices. A sensor in a distant room does not need to reach the coordinator directly -- it sends its message to the nearest router, which forwards it hop by hop to the coordinator. More router devices mean better coverage and redundancy. If one router goes offline, messages find alternate paths.'
                },
                {
                    question: 'What hardware does a Raspberry Pi need to communicate with Zigbee devices?',
                    options: [
                        'Nothing -- Zigbee is built into the Pi',
                        'A USB Zigbee coordinator dongle (e.g., SONOFF Zigbee 3.0, ConBee II)',
                        'A special Zigbee HAT soldered to the GPIO pins',
                        'A separate Zigbee-to-Ethernet bridge on the local network'
                    ],
                    explanation: 'The Raspberry Pi does not have built-in Zigbee radio hardware. You need a USB coordinator dongle like the SONOFF Zigbee 3.0 USB Dongle Plus or the ConBee II. This dongle contains a Zigbee radio and acts as the network coordinator -- it manages the mesh, assigns device addresses, and relays messages to software like Zigbee2MQTT running on the Pi.'
                },
                {
                    question: 'What is the simplest way to install Home Assistant on a Raspberry Pi?',
                    options: [
                        'Compile Home Assistant from source using gcc',
                        'Flash the Home Assistant OS image to an SD card and boot the Pi from it',
                        'Install it as a Chrome browser extension',
                        'Download it from the Raspberry Pi app store'
                    ],
                    explanation: 'Home Assistant OS is a purpose-built operating system that manages the Linux kernel, Docker, and Home Assistant itself. You flash the image to an SD card using Raspberry Pi Imager, boot the Pi, and access the setup wizard at http://homeassistant.local:8123. This is the recommended installation method because HA OS handles updates, backups, and add-on management automatically.'
                },
                {
                    question: 'What is the core automation pattern in Home Assistant?',
                    options: [
                        'If/Then/Else conditional programming',
                        'Trigger -> Condition -> Action',
                        'Map/Reduce/Filter data processing',
                        'Publisher -> Broker -> Subscriber'
                    ],
                    explanation: 'Every Home Assistant automation follows the Trigger -> Condition -> Action pattern. The trigger is what starts the automation (sunset, temperature above threshold, motion detected). The condition is an optional gate (only if vacation mode is off, only on weekdays). The action is what happens (turn on light, send notification, adjust thermostat). Multiple triggers, conditions, and actions can be combined in a single automation.'
                },
                {
                    question: 'In a Home Assistant automation YAML file, what does the "trigger" section define?',
                    options: [
                        'The device that performs the action',
                        'The event or state change that starts the automation',
                        'The condition that must be true for the automation to run',
                        'The notification sent when the automation completes'
                    ],
                    explanation: 'The trigger section defines what event initiates the automation: a time trigger (sunset, specific time), a state trigger (sensor value crosses a threshold), a device trigger (button pressed), or an MQTT trigger (message received on topic). When the trigger fires, Home Assistant evaluates the conditions and, if all pass, executes the actions.'
                },
                {
                    question: 'What does Node-RED provide for home automation on the Pi?',
                    options: [
                        'A command-line interface for configuring network settings',
                        'A drag-and-drop visual flow programming environment for building IoT automation logic',
                        'A mobile app for controlling smart home devices remotely',
                        'A database for storing historical sensor data'
                    ],
                    explanation: 'Node-RED is a browser-based visual programming tool where you drag nodes onto a canvas and connect them with wires. Input nodes (MQTT in, HTTP request) receive data. Processing nodes (switch, change, function) transform it. Output nodes (MQTT out, GPIO, notification) take action. Flows are deployed to the Pi with one click. It integrates directly with Home Assistant via websocket nodes.'
                },
                {
                    question: 'In a sensor-to-action pipeline, what role does the MQTT broker play between an ESP32 temperature sensor and a Home Assistant automation?',
                    options: [
                        'It reads the temperature sensor directly',
                        'It routes the published temperature reading from the ESP32 to Home Assistant\'s MQTT integration',
                        'It controls the Zigbee fan relay',
                        'It stores the temperature in a time-series database'
                    ],
                    explanation: 'The ESP32 publishes temperature readings to a topic (e.g., "home/office/temp") on the Mosquitto broker running on the Pi. Home Assistant\'s MQTT integration subscribes to that topic. When the broker receives the publish, it forwards the message to HA. HA updates the sensor entity in its state machine, which may trigger an automation (e.g., turn on fan if temp > 27). The broker is the routing layer that decouples the sensor from the automation engine.'
                },
                {
                    question: 'Why should you never run Mosquitto without authentication (allow_anonymous true)?',
                    options: [
                        'Because anonymous connections are slower than authenticated ones',
                        'Because any device on the network could publish arbitrary commands to your smart home devices',
                        'Because Mosquitto crashes without authentication configured',
                        'Because the MQTT protocol requires TLS encryption for all connections'
                    ],
                    explanation: 'Without authentication, any device on your network (or any attacker who gains network access) can publish messages to any topic. This means they could send "OFF" to your security system topic, "OPEN" to your smart lock, or flood your broker with junk data. mosquitto_passwd creates hashed credentials, and allow_anonymous false in mosquitto.conf ensures only authenticated clients can connect.'
                },
                {
                    question: 'Why is it recommended to put IoT devices on a separate VLAN?',
                    options: [
                        'To give IoT devices faster internet speeds',
                        'To isolate potentially vulnerable devices (with outdated firmware) from your main network, limiting attack surface',
                        'Because IoT devices require a different IP address range than computers',
                        'To comply with Zigbee protocol requirements'
                    ],
                    explanation: 'IoT devices -- especially cheap sensors and cameras -- often ship with outdated firmware, known vulnerabilities, and no update mechanism. If compromised, a device on your main network can access your computers, files, and credentials. A separate VLAN isolates IoT traffic: devices can reach the Pi hub (which bridges the VLANs) but cannot access your computers, phones, or NAS directly.'
                }
            ]
        });
        quiz.start();
    </script>
