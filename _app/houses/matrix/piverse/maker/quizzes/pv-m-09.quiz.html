    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 9: Environmental Sensing',
            description: 'Test your understanding of USB audio capture, spectrograms, sound classification, wildlife monitoring, environmental sensors, and data pipelines on the Raspberry Pi.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-m-09-quiz', moduleId: 'pv-m-09-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'Why does the Raspberry Pi require a USB microphone instead of a direct analog mic connection?', options: ['The Pi has an analog mic input but it is low quality', 'The Pi has no analog audio input or ADC -- USB provides digital audio via the USB Audio Class driver', 'Analog microphones are not compatible with Linux', 'USB microphones are cheaper than analog ones'], explanation: 'The Raspberry Pi has no analog audio input circuitry and no analog-to-digital converter (ADC) for microphone signals. It has a 3.5mm audio output jack (on models that include one), but this is output only. USB microphones contain their own ADC and present as standard ALSA sound cards via the USB Audio Class (UAC) driver, which is built into the Linux kernel. No additional drivers are needed -- the Pi recognizes USB microphones automatically. I2S MEMS microphones are an alternative that connects directly to the Pi GPIO but requires kernel overlay configuration.' },
                { question: 'What Linux command lists all available audio capture devices?', options: ['lsusb', 'arecord -l', 'alsamixer', 'pulseaudio --list'], explanation: 'The command "arecord -l" (lowercase L) lists all ALSA capture-capable hardware devices. It shows the card number, device number, and device name for each audio input. This information is needed to construct the device string (e.g., plughw:1,0) used when recording. alsamixer is a volume control interface. lsusb lists USB devices but does not show their audio capabilities. The card number from "arecord -l" is essential for specifying which device to record from when multiple audio devices are connected.' },
                { question: 'What is a Mel spectrogram?', options: ['A waveform display showing amplitude over time', 'A frequency-time representation with the frequency axis warped to the Mel scale, modeling human pitch perception', 'A bar chart showing the average volume of different instruments', 'A circular plot of audio phase information'], explanation: 'A Mel spectrogram is a 2D representation of audio where the X-axis is time, the Y-axis is frequency (warped to the Mel scale), and color intensity represents amplitude. The Mel scale is a perceptual scale -- it spaces low frequencies further apart (where humans are more sensitive) and compresses high frequencies (where humans are less sensitive). This warping better represents how humans perceive pitch differences. Mel spectrograms are the standard input for audio ML models because they capture perceptually relevant features in a compact 2D image format that CNNs can process efficiently.' },
                { question: 'How does YAMNet classify environmental sounds?', options: ['By matching waveforms against a library of known sounds', 'By converting audio to Mel spectrograms and classifying them with a MobileNet v1 CNN', 'By analyzing the fundamental frequency of each sound', 'By comparing the audio to text transcriptions'], explanation: 'YAMNet (Yet Another Music/audio Net) converts audio into Mel spectrogram frames (0.96-second windows) and feeds them through a MobileNet v1 backbone trained on AudioSet (a dataset of over 2 million 10-second YouTube clips labeled with 521 sound classes). The key insight is that audio classification becomes an image classification problem -- the spectrogram is a 2D image, and the CNN identifies patterns (bird chirps, car engines, speech) the same way it would identify visual patterns. YAMNet runs in real-time on a Pi 5.' },
                { question: 'How many bird species can BirdNET identify from audio recordings?', options: ['About 100 common species', 'About 500 North American species', 'Over 6,000 species worldwide', 'About 50 species per geographic region'], explanation: 'BirdNET, developed by the Cornell Lab of Ornithology and Chemnitz University of Technology, can identify over 6,000 bird species worldwide from their vocalizations. It uses a deep neural network trained on hundreds of thousands of bird call recordings. BirdNET also accepts GPS coordinates and date as inputs to filter predictions based on which species are expected in that geographic region and time of year, significantly improving accuracy. The TFLite version runs on Raspberry Pi hardware, making it the gold standard for automated avian bioacoustics monitoring.' },
                { question: 'Why does on-device classification reduce storage requirements by 80-90% in wildlife monitoring?', options: ['It compresses audio files more efficiently', 'It analyzes each recording segment and only retains segments with confident detections, discarding hours of silence and wind', 'It records at a lower sample rate', 'It stores data in a more efficient format'], explanation: 'In a typical outdoor recording, 80-90% of audio contains no biologically relevant content -- just wind, rain, distant traffic, or silence. On-device classification with BirdNET or YAMNet analyzes each recording segment immediately after capture. Only segments where the model detects a bird call (or other target sound) above a confidence threshold are saved to storage. The rest is discarded. This transforms a 1.5GB/hour continuous recording into ~150-300MB/hour of curated, relevant audio clips, dramatically extending the storage capacity and battery life of remote monitoring stations.' },
                { question: 'What does the BME280 sensor measure?', options: ['Light intensity, UV index, and IR radiation', 'Temperature, relative humidity, and barometric pressure', 'Sound level, frequency, and direction', 'Soil moisture, pH, and conductivity'], explanation: 'The BME280 is a combined environmental sensor that measures temperature (range: -40C to +85C, accuracy: +/-1C), relative humidity (0-100%, accuracy: +/-3%), and barometric pressure (300-1100 hPa, accuracy: +/-1 hPa). It communicates via I2C (address 0x76 or 0x77) or SPI. For wildlife monitoring, these readings correlate with animal activity patterns -- bird dawn chorus timing varies with temperature, and barometric pressure changes affect feeding behavior. The BME280 costs about $3 on a breakout board.' },
                { question: 'Why is a "local-first" data architecture mandatory for field-deployed Pi monitoring stations?', options: ['Local storage is faster than network storage', 'Network connectivity at remote field sites is unreliable -- the Pi must function autonomously and sync data when connectivity is available', 'Local databases are more secure than cloud databases', 'It is cheaper to store data locally'], explanation: 'Remote field monitoring stations (forests, wetlands, rural areas) often have no WiFi or cellular coverage, or connectivity is intermittent (available only at certain times or during specific weather conditions). A local-first architecture stores all data to SQLite (or CSV) on the Pi first, ensuring zero data loss regardless of network status. When connectivity becomes available (daily WiFi window, periodic cellular signal, manual SD card retrieval), accumulated data is synced to a central server. The Pi must be designed to operate autonomously for days or weeks without any network access.' },
                { question: 'What is MQTT and why is it preferred for sensor telemetry?', options: ['A file transfer protocol optimized for large media files', 'A lightweight publish-subscribe messaging protocol designed for low-bandwidth, high-latency networks', 'A database query language for time-series data', 'A video streaming protocol for IP cameras'], explanation: 'MQTT (Message Queuing Telemetry Transport) is a lightweight publish-subscribe messaging protocol. Devices publish messages to named topics (e.g., "sensors/station-01/temperature"), and a broker (like Mosquitto) routes messages to all subscribed clients. A single sensor reading is typically ~100 bytes -- negligible bandwidth. MQTT supports QoS levels (0=fire-and-forget, 1=at-least-once, 2=exactly-once), retained messages (last value cached for new subscribers), and last-will messages (notification when a device disconnects). It is designed for constrained devices and unreliable networks -- ideal for Pi sensor stations.' },
                { question: 'What sample rate is appropriate for recording bird vocalizations?', options: ['8000 Hz (telephone quality)', '44100 Hz (CD quality)', '192000 Hz (ultrasonic)', '4000 Hz (voice-band)'], explanation: 'A sample rate of 44,100 Hz (CD quality) captures frequencies up to 22,050 Hz (Nyquist theorem: max frequency = sample rate / 2). Most bird vocalizations range from 1,000 Hz to 10,000 Hz, well within this range. 8,000 Hz would only capture up to 4,000 Hz, cutting off many bird songs. 192,000 Hz would capture ultrasonic frequencies (useful for bat echolocation) but wastes storage for bird monitoring -- 4x the data with no additional bird-relevant information. 44,100 Hz is the standard choice for avian bioacoustics.' },
                { question: 'What is the IP rating needed for a weatherproof outdoor Pi enclosure?', options: ['IP20 (finger protection only)', 'IP44 (splash protection)', 'IP67 (dust-tight, submersible to 1m)', 'IP00 (no protection)'], explanation: 'IP67 provides dust-tight protection (6 = complete dust ingress prevention) and protection against temporary submersion in water up to 1 meter for 30 minutes (7). For outdoor Pi deployments exposed to rain, humidity, dust, and insects, IP67 is the standard minimum. The enclosure should use cable glands for all wire pass-throughs and Gore-Tex membrane vent patches to allow pressure equalization (preventing condensation from temperature changes) without admitting moisture. IP44 is insufficient for rain exposure, and IP20 offers essentially no environmental protection.' },
                { question: 'How does a Gore-Tex membrane vent patch protect an outdoor Pi enclosure?', options: ['It blocks all air exchange to seal the enclosure completely', 'It allows air pressure equalization while blocking liquid water and dust particles', 'It provides UV protection for the electronics inside', 'It acts as an antenna for WiFi signals'], explanation: 'Gore-Tex membrane patches use expanded PTFE (ePTFE) with billions of microscopic pores. Each pore is large enough for air molecules and water vapor to pass through (enabling pressure equalization) but too small for liquid water droplets or dust particles to enter. Without pressure equalization, temperature changes cause the air inside the sealed enclosure to expand and contract, eventually pulling moisture through any imperfect seal. The Gore-Tex vent prevents this condensation cycle while maintaining environmental protection.' },
                { question: 'What is InfluxDB and why is it used for sensor data?', options: ['A general-purpose relational database like MySQL', 'A time-series database purpose-built for timestamped sensor data with efficient compression and time-range queries', 'A message broker for MQTT', 'A Python library for data visualization'], explanation: 'InfluxDB is a time-series database optimized for storing and querying timestamped data points -- exactly what sensor monitoring produces. It uses columnar storage and compression algorithms tuned for sequential time-series data, achieving 10-100x better storage efficiency than general-purpose databases for this workload. Its query language (InfluxQL or Flux) provides built-in functions for time-range aggregations (hourly averages, daily min/max, rolling windows) that would require complex SQL in a relational database. Paired with Grafana for visualization, InfluxDB is the standard backend for environmental monitoring dashboards.' },
                { question: 'What power consumption should you plan for when designing a solar-powered Pi 5 monitoring station?', options: ['About 0.5W', 'About 2W', 'About 5-8W depending on load', 'About 25W'], explanation: 'A Pi 5 draws approximately 5W at idle and 7-8W under ML inference load (with camera and USB microphone active). Planning for 8W sustained consumption, a 100Wh battery (12V, 8.3Ah) provides approximately 12-13 hours of operation. For continuous 24/7 operation with 4-6 hours of daily sunlight, a 30-50W solar panel with a charge controller can maintain the battery charge. Power budgeting is critical for remote deployments -- underestimating consumption by even 1-2W can drain the battery overnight, causing data loss and requiring manual intervention.' },
                { question: 'How does the DS18B20 temperature sensor communicate with the Pi?', options: ['I2C protocol on the I2C bus', 'SPI protocol on the SPI bus', '1-Wire protocol on a single GPIO pin, allowing multiple sensors on one wire', 'Analog voltage output read by an ADC'], explanation: 'The DS18B20 uses the Dallas 1-Wire protocol, which communicates over a single data wire (plus ground). Multiple DS18B20 sensors can be chained on the same GPIO pin -- each sensor has a unique 64-bit serial number that identifies it on the bus. This makes it practical to deploy dozens of temperature probes (soil at different depths, water, air) using just one GPIO pin. The 1-Wire protocol requires a 4.7k ohm pull-up resistor and the w1-gpio kernel overlay enabled in /boot/firmware/config.txt. The DS18B20 also comes in a waterproof stainless steel probe version suitable for soil and water measurements.' }
            ]
        });
        quiz.start();
    </script>
