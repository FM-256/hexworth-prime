    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 7: Computational Photography',
            description: 'Test your understanding of the Pi camera ecosystem, libcamera, exposure control, HDR, image stacking, raw capture, and time-lapse techniques.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-m-07-quiz', moduleId: 'pv-m-07-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What sensor does the Pi HQ Camera use, and what is its key advantage over the Camera Module v3?', options: ['Sony IMX708 with autofocus capability', 'Sony IMX477 with a C/CS-mount interchangeable lens system', 'Sony IMX296 with a global shutter', 'OmniVision OV5647 with higher resolution'], explanation: 'The Pi HQ Camera uses the Sony IMX477 sensor (12.3MP, 1.55um pixels). Its key advantage is the C/CS-mount lens system that accepts interchangeable lenses -- telephoto, macro, wide-angle, and more. The Camera Module v3 (IMX708) has autofocus but a fixed lens, limiting its optical versatility. The ability to swap lenses makes the HQ Camera suitable for astrophotography (telephoto), macro work (extension tubes), and surveillance (wide-angle) applications impossible with fixed-lens modules.' },
                { question: 'What replaced raspistill on modern Raspberry Pi OS?', options: ['picam', 'v4l2-ctl', 'libcamera-still', 'gphoto2'], explanation: 'libcamera-still (part of the libcamera suite) replaced the deprecated raspistill command. The old raspistill was a closed-source Broadcom binary that only worked with specific Broadcom camera drivers. libcamera is an open-source camera support library that works with multiple sensor types through a standardized API. The Python wrapper Picamera2 (replacing the old picamera library) is built on top of libcamera and provides programmatic access to all camera features.' },
                { question: 'In the exposure triangle, what does increasing ISO (AnalogueGain) do?', options: ['Opens the lens aperture wider', 'Increases sensor amplification, making the image brighter but adding noise', 'Extends the shutter time', 'Changes the focal length'], explanation: 'ISO (controlled via AnalogueGain in libcamera) increases the analog amplification of the sensor signal before it is digitized. Higher amplification makes the image brighter but also amplifies the random electronic noise present in every sensor. The Pi HQ Camera supports analog gain from 1.0 (ISO 100) to 16.0 (ISO 1600). Above ISO 400, noise becomes visually apparent in shadows. Computational photography techniques like image stacking reduce this noise mathematically after capture.' },
                { question: 'How does HDR photography capture more dynamic range than a single exposure?', options: ['By using a wider aperture lens', 'By merging multiple exposures taken at different shutter speeds into one image', 'By increasing the sensor resolution', 'By applying a contrast filter during capture'], explanation: 'HDR (High Dynamic Range) photography captures a bracket of 3-5 images at different exposure levels (e.g., -2EV, 0EV, +2EV). The underexposed image preserves highlight detail (bright sky, reflections), while the overexposed image reveals shadow detail (dark interiors, shade). These are merged using algorithms like Debevec or Robertson to create a 32-bit floating-point image containing the full luminance range. Tone mapping then compresses this back to 8-bit or 16-bit for display.' },
                { question: 'By what factor does stacking 16 frames reduce random noise?', options: ['2x', '4x', '8x', '16x'], explanation: 'Noise reduction from stacking follows the square root law: noise decreases by a factor of sqrt(N) where N is the number of frames. For 16 frames: sqrt(16) = 4, so noise is reduced 4x. This works because random noise is different in every frame (it averages toward zero when many frames are combined), while the actual image signal is the same in every frame (it stays consistent). To achieve 8x noise reduction, you would need 64 frames. Astrophotographers routinely stack hundreds of exposures for this reason.' },
                { question: 'What is a Bayer mosaic pattern?', options: ['A method of compressing JPEG images', 'A color filter array (RGGB) placed over sensor pixels so each pixel captures only one color', 'A technique for reducing lens distortion', 'A noise reduction algorithm'], explanation: 'A Bayer mosaic is a grid of red, green, and blue color filters arranged over the sensor pixels in an RGGB pattern (one red, two green, one blue per 2x2 block). Each pixel only captures one color channel. The raw sensor data is therefore a mosaic of single-color values, not a full-color image. Demosaicing is the interpolation algorithm that estimates the missing two color values at each pixel location to produce a full RGB image. Different demosaic algorithms (bilinear, VNG, AHD) produce different quality/speed tradeoffs.' },
                { question: 'Why is raw (DNG) capture preferred over JPEG for computational photography?', options: ['DNG files are smaller than JPEG', 'DNG preserves all 12-bit sensor data, allowing non-destructive post-processing', 'DNG files can be displayed directly on any screen', 'DNG captures at higher resolution than JPEG'], explanation: 'DNG (Digital Negative) files contain the raw 12-bit (or 10-bit) Bayer sensor data with no processing applied. JPEG processing is destructive and irreversible: demosaicing, white balance, gamma correction, noise reduction, and lossy compression each discard information. A 12-bit raw file preserves 4096 tonal levels per channel compared to JPEG 256 levels (8-bit). This extra data is critical for HDR merging (recovering highlights and shadows), stacking (preserving subtle signal differences), and white balance correction (shifting colors without clipping).' },
                { question: 'What libcamera-still parameter controls shutter speed, and what unit does it use?', options: ['--exposure, in seconds', '--shutter, in microseconds', '--speed, in milliseconds', '--time, in nanoseconds'], explanation: 'The --shutter parameter in libcamera-still sets the exposure time in microseconds (us). A 1-second exposure is --shutter 1000000. A 30-second exposure is --shutter 30000000. The Pi HQ Camera supports exposure times from approximately 1 microsecond to 230 seconds (230,000,000 us). In Picamera2 (Python), the equivalent control is ExposureTime, also specified in microseconds. This microsecond precision is important for short exposures (1/10000s = 100us for freezing fast motion).' },
                { question: 'What is the purpose of disabling denoise during long exposure captures?', options: ['To reduce file size', 'To preserve fine detail like star points that noise reduction would blur', 'To speed up the capture process', 'To increase the dynamic range'], explanation: 'Noise reduction algorithms work by detecting small variations between neighboring pixels and smoothing them. During long exposures (especially astrophotography), star points appear as small bright dots that the denoiser can interpret as noise and blur or remove. Disabling denoise (--denoise off in libcamera-still, or NoiseReductionMode.Off in Picamera2) preserves these fine details. The tradeoff is more visible noise in dark areas, but this noise can be reduced through stacking instead, which is more controlled and selective.' },
                { question: 'What problem does locking exposure and white balance solve in time-lapse photography?', options: ['It reduces the file size of each frame', 'It prevents flicker between frames caused by auto-exposure and auto-WB adjustments', 'It increases the capture speed', 'It enables autofocus between shots'], explanation: 'Auto-exposure and auto-white-balance measure each scene independently and adjust settings per frame. As lighting changes subtly between time-lapse frames (a cloud passing, a car headlight sweeping), auto-exposure makes small corrections that appear as visible brightness flicker when the frames are played as video. Locking exposure and white balance to fixed values ensures every frame has identical brightness and color temperature, producing smooth, flicker-free time-lapse video.' },
                { question: 'How does focus stacking achieve infinite depth of field?', options: ['By using the smallest possible aperture', 'By combining images focused at different distances, selecting the sharpest region from each', 'By using a wider sensor', 'By increasing the ISO to maximum'], explanation: 'Focus stacking captures multiple images with the focus point shifted slightly between each shot -- near to far. Software analyzes each pixel location across all frames and selects the sharpest version (highest local contrast/edge strength). The result is a composite image where every depth plane is in sharp focus. This is essential for macro photography where depth of field at working distances can be less than 1mm, even at f/16. The Camera Module v3 autofocus motor can be controlled programmatically via Picamera2 LensPosition for automated focus sweeps.' },
                { question: 'What FFmpeg command compiles time-lapse JPEG frames into an MP4 video at 30fps?', options: ['ffmpeg -i frame_%04d.jpg -r 30 output.mp4', 'ffmpeg -framerate 30 -pattern_type glob -i "*.jpg" -c:v libx264 -pix_fmt yuv420p output.mp4', 'ffmpeg -concat frames.txt output.mp4', 'ffmpeg -loop 1 -i frames.jpg output.mp4'], explanation: 'The correct command uses -framerate 30 to set input frame rate, -pattern_type glob with -i "*.jpg" to select all JPEG files, -c:v libx264 for H.264 encoding, and -pix_fmt yuv420p for compatibility (most players require YUV 4:2:0 chroma subsampling). The glob pattern approach is flexible with filenames. Without -pix_fmt yuv420p, FFmpeg may output YUV 4:4:4 which many players cannot decode. The -framerate flag on the input side determines how many source frames map to one second of video.' },
                { question: 'What is the maximum exposure time supported by the Pi HQ Camera (IMX477)?', options: ['1 second', '30 seconds', '60 seconds', 'Approximately 230 seconds (nearly 4 minutes)'], explanation: 'The Sony IMX477 sensor in the Pi HQ Camera supports exposure times up to approximately 230 seconds (230,000,000 microseconds). This extremely long exposure capability enables astrophotography, light painting, and very low-light photography without external intervalometer hardware. However, exposures longer than about 30 seconds accumulate significant thermal noise (hot pixels) that must be removed by subtracting a "dark frame" (an exposure of equal length with the lens cap on).' },
                { question: 'What is the Picamera2 control name for setting the focus position on the Camera Module v3?', options: ['FocusDistance', 'AutoFocus', 'LensPosition', 'FocalLength'], explanation: 'Picamera2 uses the LensPosition control to set the focus position on cameras with motorized focus (Camera Module v3). Values range from 0.0 (infinity focus) to higher values representing closer focus distances. The value is in units of dioptres (1/meters). For example, LensPosition=2.0 focuses at 0.5 meters. This programmatic control enables automated focus stacking by scripting a sweep from LensPosition=0.0 (infinity) to LensPosition=10.0 (10cm) with captures at each step.' },
                { question: 'Why do time-lapse captures of a 24-hour period require an external USB drive instead of the microSD?', options: ['MicroSD cards cannot store JPEG files', 'At 10-second intervals, 24 hours produces ~8,640 frames totaling ~34GB, which fills most microSD cards and causes excessive write wear', 'USB drives capture images faster', 'MicroSD cards are not compatible with libcamera'], explanation: 'A 12MP JPEG image is approximately 4MB. At 10-second capture intervals over 24 hours: 24 * 60 * 6 = 8,640 frames. At 4MB each, that is ~34GB of data. A 32GB microSD card would be completely full (and the OS needs space too). Even a 64GB card would be half consumed. Additionally, the continuous write operations wear the flash cells -- MicroSD cards are rated for finite write cycles and time-lapse capturing is one of the fastest ways to exhaust them. External USB storage provides terabytes of capacity with better write endurance.' }
            ]
        });
        quiz.start();
    </script>
