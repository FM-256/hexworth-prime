    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: Edge AI & Computer Vision',
            description: 'Test your understanding of TensorFlow Lite, object detection, MobileNet architecture, quantization, transfer learning, and edge deployment on the Raspberry Pi.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-m-08-quiz', moduleId: 'pv-m-08-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is the primary advantage of edge AI over cloud AI?', options: ['Edge AI uses more powerful hardware', 'Edge AI processes data on-device without requiring internet, reducing latency and protecting privacy', 'Edge AI provides higher accuracy', 'Edge AI is always free to use'], explanation: 'Edge AI runs inference directly on the local device (the Pi) rather than sending data to remote servers. This provides three key advantages: lower latency (10-100ms vs 100-500ms for cloud), no internet dependency (works offline), and data privacy (images and sensor data never leave the device). The tradeoff is that edge devices have limited compute power, requiring smaller, optimized models that may be less accurate than large cloud-hosted models.' },
                { question: 'What file format does TensorFlow Lite use for models?', options: ['.h5 (HDF5)', '.onnx', '.tflite (FlatBuffer)', '.pt (PyTorch)'], explanation: 'TensorFlow Lite uses the .tflite format, which is based on FlatBuffers -- a memory-efficient serialization library. FlatBuffers allow the model to be memory-mapped and accessed without parsing or unpacking, which reduces loading time and memory overhead on resource-constrained devices. Models are converted from TensorFlow (.h5 or SavedModel), PyTorch (.pt via ONNX), or JAX formats using the TFLite Converter tool.' },
                { question: 'What is the difference between image classification and object detection?', options: ['Classification is faster; detection is more accurate', 'Classification labels the entire image with one class; detection locates multiple objects with bounding boxes', 'Classification works on video; detection works on still images', 'There is no difference -- they are synonyms'], explanation: 'Image classification takes one image as input and outputs a single label with a confidence score (e.g., "cat, 94%"). It tells you what is in the image but not where. Object detection takes one image and outputs one or more bounding boxes, each with a label and confidence score (e.g., "cat at [120, 80, 320, 260] 91%"). Detection can find multiple objects of different classes in a single frame. Detection is more computationally expensive because it must scan the image at multiple scales and locations.' },
                { question: 'What is a depthwise separable convolution, and why does MobileNet use it?', options: ['A convolution that only processes the depth channel, used for color images', 'A convolution split into spatial (per-channel) and pointwise (cross-channel) operations, reducing computation by 8-9x', 'A convolution that processes multiple frames simultaneously', 'A convolution that operates at half precision for speed'], explanation: 'A standard convolution applies a filter across all spatial dimensions AND all input channels simultaneously, which is computationally expensive. A depthwise separable convolution splits this into two steps: (1) a depthwise convolution that filters each input channel independently (spatial only), and (2) a pointwise 1x1 convolution that mixes information across channels. This factorization reduces the number of multiply-accumulate operations by a factor of 8-9x compared to standard convolutions, making MobileNet feasible on edge devices like the Pi.' },
                { question: 'What does quantization do to a TFLite model?', options: ['Increases the model resolution for better accuracy', 'Converts 32-bit float weights to 8-bit integers, reducing size by 4x and improving speed 2-3x', 'Adds more layers to the model for deeper learning', 'Removes unused neurons from the model'], explanation: 'Quantization maps 32-bit floating-point weight values to 8-bit integers using a scale factor and zero-point offset. This reduces model file size by approximately 4x (32 bits to 8 bits per weight). On ARM CPUs like the Pi 5 Cortex-A76, the NEON SIMD units can process 16 int8 operations in the same cycle as 4 float32 operations, yielding a 2-3x real-world inference speedup. Post-training quantization typically introduces less than 1% accuracy loss -- a small price for 4x smaller, 3x faster models.' },
                { question: 'How many TOPS (trillion operations per second) does the Google Coral USB Edge TPU provide?', options: ['0.5 TOPS', '4 TOPS', '16 TOPS', '100 TOPS'], explanation: 'The Google Coral Edge TPU ASIC provides 4 TOPS of int8 inference performance while consuming only about 2 watts. This is sufficient to run MobileNet classification at 3ms per inference (~300fps) or SSD MobileNet detection at ~12ms (~80fps). The TPU only accelerates fully quantized int8 models with supported operations. Any unsupported operations silently fall back to the Pi CPU, which can severely degrade performance if a significant portion of the model runs on CPU.' },
                { question: 'What preprocessing step is required before feeding an image to a TFLite model?', options: ['Convert the image to grayscale', 'Resize the image to the model input dimensions and normalize pixel values to the expected range', 'Compress the image to JPEG format', 'Apply edge detection filters'], explanation: 'Every TFLite model has a fixed input tensor shape (e.g., [1, 320, 320, 3]) that specifies the expected batch size, height, width, and channels. The input image must be resized to exactly these dimensions. Additionally, pixel values must be normalized to the range the model expects -- uint8 models expect 0-255, while float32 models may expect 0.0-1.0 or -1.0-1.0. Mismatched preprocessing is one of the most common causes of poor inference results.' },
                { question: 'What is non-maximum suppression (NMS) in object detection?', options: ['A technique to increase the brightness of detected objects', 'A post-processing step that removes duplicate overlapping detections, keeping only the highest-confidence one', 'A training optimization that speeds up convergence', 'A data augmentation technique'], explanation: 'Object detection models often produce multiple overlapping bounding boxes for the same object (because the model scans at many locations and scales). NMS (Non-Maximum Suppression) resolves this by: (1) sorting all detections by confidence score, (2) keeping the highest-scoring detection, (3) calculating IoU (Intersection over Union) between the kept box and all remaining boxes, (4) removing any box with IoU above a threshold (typically 0.5), and (5) repeating until all boxes are processed. The result is one clean bounding box per detected object.' },
                { question: 'How many training images per class are typically needed for transfer learning?', options: ['At least 10,000 per class', '50-200 per class', 'Only 1 image per class', 'At least 1 million per class'], explanation: 'Transfer learning leverages a pre-trained base model (like MobileNet trained on ImageNet) that already knows how to recognize edges, textures, shapes, and basic objects. When fine-tuning for a new task, only the final classification layers are replaced and retrained. Because the base model provides strong feature extraction, 50-200 images per class is typically sufficient for good accuracy. This is dramatically fewer than training from scratch (which requires thousands to millions of images) and makes custom model training practical even for hobbyists with limited datasets.' },
                { question: 'What is the XNNPACK delegate in TFLite?', options: ['A GPU acceleration library for NVIDIA cards', 'A CPU optimization library that uses ARM NEON SIMD instructions for faster inference', 'A cloud-based inference service', 'A model compression tool'], explanation: 'XNNPACK is a highly optimized neural network inference library that TFLite uses as its default CPU delegate. On ARM processors like the Pi 5 Cortex-A76, XNNPACK leverages NEON SIMD (Single Instruction, Multiple Data) instructions to process multiple values in parallel within each CPU cycle. It also uses cache-friendly memory access patterns and operator fusion (combining multiple sequential operations into one) to maximize throughput. XNNPACK typically provides a 2-3x speedup over the basic TFLite CPU interpreter.' },
                { question: 'What resolution should be used for the camera feed when doing real-time object detection?', options: ['The highest resolution possible (4056x3040)', '640x480 -- higher resolution adds latency without improving model accuracy', 'Exactly 1920x1080 for HD quality', 'The lowest resolution possible (160x120)'], explanation: 'Object detection models have fixed input dimensions (typically 320x320 or 300x300). Any input image is resized to these dimensions before inference. Capturing at 4056x3040 and then resizing to 320x320 wastes time on capture and resize operations without improving model accuracy. Capturing at 640x480 provides enough resolution for the resize step and for drawing readable bounding box annotations on the output, while minimizing capture latency. The total pipeline time (capture + preprocess + inference + postprocess) determines your achievable frame rate.' },
                { question: 'What is the width multiplier (alpha) parameter in MobileNet?', options: ['The aspect ratio of the input image', 'A parameter that uniformly scales the number of channels in every layer, trading accuracy for speed', 'The learning rate used during training', 'The compression ratio for model quantization'], explanation: 'The width multiplier (alpha) uniformly reduces the number of filters (channels) in every convolutional layer of MobileNet. Alpha=1.0 is the full model. Alpha=0.75 reduces every layer to 75% of its original channels. Alpha=0.5 halves all channels. Because computation scales with the square of the channel count (roughly), alpha=0.5 reduces computation by approximately 4x while sacrificing some accuracy. This provides a continuous tradeoff between model speed and accuracy, allowing you to tune the model to your specific hardware constraints.' },
                { question: 'Why must Coral Edge TPU models be fully quantized (int8)?', options: ['The TPU hardware can only execute int8 arithmetic operations -- float32 ops fall back to CPU', 'Int8 produces higher accuracy than float32', 'The USB cable cannot transfer float32 data fast enough', 'Google licenses require int8 for all Edge TPU models'], explanation: 'The Coral Edge TPU ASIC is physically designed with integer-only arithmetic units. It has no floating-point hardware. When a model contains any float32 operations (even a single unsupported layer), those operations must execute on the Pi CPU while the rest runs on the TPU. This CPU fallback creates a bottleneck that can slow inference dramatically -- sometimes making it slower than running the entire model on the CPU. The edgetpu_compiler tool reports which operations will run on the TPU vs CPU, allowing you to verify full TPU acceleration before deployment.' },
                { question: 'What does the interpreter.invoke() call do in the TFLite inference pipeline?', options: ['Downloads the model from the internet', 'Executes all model layers sequentially, computing the output tensors from the input tensor', 'Captures an image from the camera', 'Saves the detection results to a file'], explanation: 'The invoke() method triggers the actual neural network inference. It takes the data that was previously copied into the input tensor (via set_tensor()), passes it through every layer of the model in sequence (convolutions, activations, pooling, etc.), and writes the results to the output tensors. After invoke() returns, you read the output tensors (bounding boxes, class indices, confidence scores) using get_tensor(). The invoke() call is where all the computation happens and is the main contributor to per-frame latency.' },
                { question: 'In a wildlife camera trap using edge AI, what triggers the camera to capture and classify?', options: ['A constant video feed analyzed at 30fps', 'A PIR (passive infrared) motion sensor detects movement and triggers capture, then ML classifies the animal', 'The camera runs classification once per hour on a timer', 'A cloud server sends a command to capture'], explanation: 'A PIR motion sensor detects infrared radiation changes caused by warm-bodied animals moving through its detection zone. When triggered, the Pi captures one or more images and runs the classification model. This event-driven approach is far more power-efficient than continuous video analysis -- the Pi can sleep between events, extending battery life by 10-50x. The PIR trigger costs essentially zero power (passive sensor), and the ML inference only runs when something is actually present. This is the standard architecture for solar-powered remote wildlife monitoring.' }
            ]
        });
        quiz.start();
    </script>
