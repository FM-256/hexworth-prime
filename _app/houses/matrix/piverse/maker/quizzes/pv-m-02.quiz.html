    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Boing! (Pygame)',
            description: 'Test your understanding of the game loop, Pygame fundamentals, ball physics, collision detection, scoring, and frame rate management.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-m-02-quiz',
            moduleId: 'pv-m-02-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What are the three phases of a standard game loop, in the correct order?',
                    options: [
                        'Render -> Input -> Update',
                        'Input -> Update -> Render',
                        'Update -> Render -> Input',
                        'Input -> Render -> Update'
                    ],
                    explanation: 'The correct order is Input -> Update -> Render. Input must come first so the current frame reacts to the latest button press. Update processes game logic (physics, collisions, scoring) based on that input. Render draws the results of this frame to the screen. Any other order causes visual or input lag.'
                },
                {
                    question: 'What does pygame.init() do?',
                    options: [
                        'Creates the game window at a specified resolution',
                        'Initializes all Pygame subsystems (display, audio, font, events, timers)',
                        'Starts the game loop',
                        'Loads all game assets from disk'
                    ],
                    explanation: 'pygame.init() initializes all Pygame subsystems: display, audio mixer, font rendering, event handling, and timers. It must be called before any other Pygame function. It returns a tuple of (successes, failures) indicating how many subsystems initialized correctly.'
                },
                {
                    question: 'In Pygame\'s coordinate system, where is the origin (0, 0)?',
                    options: [
                        'Bottom-left corner of the screen',
                        'Center of the screen',
                        'Top-left corner of the screen',
                        'Top-right corner of the screen'
                    ],
                    explanation: 'Pygame (like nearly all 2D graphics systems) places the origin at the top-left corner. X increases to the right and Y increases downward. This is the opposite of standard math coordinates where Y increases upward. A paddle at y=0 is at the top of the screen, not the bottom.'
                },
                {
                    question: 'Which input method should you use for smooth, continuous paddle movement in Pong?',
                    options: [
                        'Event-based input with pygame.event.get() checking for KEYDOWN events',
                        'State-based input with pygame.key.get_pressed() checking key states every frame',
                        'Polling the serial port for controller data',
                        'Using pygame.mouse.get_pos() to track mouse position'
                    ],
                    explanation: 'State-based input using pygame.key.get_pressed() returns a dictionary of all keys and their current state (True/False) every frame. This is correct for continuous movement because it detects held keys every frame. Event-based input (KEYDOWN) fires only once on the initial press, which would require additional state tracking for smooth movement.'
                },
                {
                    question: 'Why is boundary checking needed when moving paddles (e.g., paddle_left.top > 0)?',
                    options: [
                        'To prevent the game from crashing on out-of-bounds array access',
                        'To prevent the paddle from scrolling off the visible screen area',
                        'To optimize rendering by skipping off-screen objects',
                        'To satisfy Pygame\'s internal collision detection requirements'
                    ],
                    explanation: 'Without boundary checking, a paddle would continue moving beyond the screen edges indefinitely. The check paddle_left.top > 0 prevents upward movement past the top edge, and paddle_left.bottom < HEIGHT prevents downward movement past the bottom edge. This is a simple clamping operation to keep game objects within the play area.'
                },
                {
                    question: 'In Pong, what causes the ball to bounce off the top and bottom walls?',
                    options: [
                        'Setting ball_dx to its negative value',
                        'Setting ball_dy to its negative value',
                        'Setting both ball_dx and ball_dy to their negative values',
                        'Resetting the ball to the center of the screen'
                    ],
                    explanation: 'Reversing ball_dy (the vertical velocity component) causes the ball to bounce off horizontal surfaces (top and bottom walls). If the ball was moving downward (positive dy) and hits the bottom wall, setting ball_dy = -ball_dy makes it move upward. The horizontal component (ball_dx) is unchanged -- the ball continues moving in the same horizontal direction.'
                },
                {
                    question: 'What Pygame method checks if two rectangles overlap (AABB collision)?',
                    options: [
                        'rect.contains(other)',
                        'rect.colliderect(other)',
                        'rect.intersect(other)',
                        'rect.overlaps(other)'
                    ],
                    explanation: 'Rect.colliderect(other_rect) returns True if two axis-aligned rectangles overlap by any amount. This is the standard AABB (Axis-Aligned Bounding Box) collision test in Pygame. It checks all four edges simultaneously and is fast enough to run for every game object every frame.'
                },
                {
                    question: 'Why must you check ball direction (ball_dx < 0) when detecting a collision with the left paddle?',
                    options: [
                        'To ensure the ball is moving fast enough to register the collision',
                        'To prevent the ball from getting stuck inside the paddle by bouncing every frame',
                        'To calculate the correct bounce angle based on velocity',
                        'To determine which player scored the point'
                    ],
                    explanation: 'Without the direction check, a ball overlapping the paddle could reverse direction on frame 1 (moving away), then still be overlapping on frame 2 (reverse again, moving toward paddle), creating an infinite bounce loop inside the paddle. The guard ball_dx < 0 ensures the ball only bounces when it is actually moving toward the left paddle, not when it is already moving away after a bounce.'
                },
                {
                    question: 'How does hit position on the paddle affect the ball\'s bounce angle in a well-implemented Pong game?',
                    options: [
                        'It does not -- the ball always bounces at the same angle regardless of hit position',
                        'The offset from the paddle center maps to the ball\'s vertical velocity: edge hits produce steep angles, center hits return the ball flat',
                        'The ball speed increases based on how close to the edge the hit occurs',
                        'The paddle size decreases with each hit to increase difficulty'
                    ],
                    explanation: 'The offset calculation maps the hit position from -1.0 (top edge of paddle) to +1.0 (bottom edge). This value is multiplied by a maximum bounce angle to set ball_dy. Hitting the center (offset near 0) sends the ball nearly horizontal. Hitting the edge (offset near +/-1) sends it at a steep diagonal. This mechanic gives skilled players directional control over the ball.'
                },
                {
                    question: 'What happens when the ball exits the left edge of the screen in Pong?',
                    options: [
                        'The ball bounces back automatically',
                        'The right player scores a point and the ball resets to center',
                        'The game ends immediately',
                        'The left player scores a point'
                    ],
                    explanation: 'When the ball passes the left edge (ball.left <= 0), it means the left paddle failed to intercept it, so the right player scores a point. The ball is then reset to the center of the screen with a randomized direction for the next rally. The scoring convention follows the original Pong: you score when the ball passes your opponent\'s side.'
                },
                {
                    question: 'How do you render text on screen in Pygame?',
                    options: [
                        'pygame.draw.text(screen, "Score", position)',
                        'screen.print("Score", position)',
                        'Create a Font object, call font.render() to get a Surface, then blit it to the screen',
                        'Write directly to the frame buffer using screen.write()'
                    ],
                    explanation: 'Pygame text rendering is a three-step process: (1) Create a font: font = pygame.font.Font(None, 72). (2) Render text to a surface: text_surface = font.render(str(score), True, WHITE). (3) Blit the surface to the screen: screen.blit(text_surface, (x, y)). The render() method returns a new Surface containing the rendered text, which is then drawn like any other image.'
                },
                {
                    question: 'What does clock.tick(60) return and why is it useful?',
                    options: [
                        'The current time in seconds since the game started',
                        'The number of milliseconds since the last call to clock.tick(), enabling delta-time calculations',
                        'The current frame number out of 60',
                        'A boolean indicating whether 60 FPS was achieved this frame'
                    ],
                    explanation: 'clock.tick(60) caps the frame rate at 60 FPS by sleeping for the remaining time in the frame budget, and returns the number of milliseconds that elapsed since the last call. Dividing this by 1000.0 gives dt (delta time in seconds), which you can multiply by velocities to make movement frame-rate independent -- the game runs at the same speed regardless of actual FPS.'
                },
                {
                    question: 'Why is pygame.display.flip() called at the end of the render phase?',
                    options: [
                        'It clears the screen for the next frame',
                        'It pushes the completed frame buffer to the actual display; without it, drawing is invisible',
                        'It rotates the screen orientation',
                        'It synchronizes the game clock with the display refresh rate'
                    ],
                    explanation: 'Pygame uses double buffering: you draw to a back buffer (the Surface returned by set_mode()), and display.flip() swaps it to the front buffer that the monitor actually shows. Without flip(), all your draw calls write to an invisible buffer and the player sees only the old frame. The draw-then-flip pattern prevents screen tearing and partial frame display.'
                },
                {
                    question: 'What is the purpose of game states (MENU, PLAYING, PAUSED, GAME_OVER)?',
                    options: [
                        'They control which save file is loaded',
                        'They determine which code runs in the game loop -- each state has its own input handling, update logic, and rendering',
                        'They set the difficulty level of the AI opponent',
                        'They manage network connections for multiplayer'
                    ],
                    explanation: 'A state variable controls the flow of the entire game. When state == MENU, the loop draws the menu and listens for "start game" input. When state == PLAYING, it runs game logic and renders gameplay. When state == PAUSED, it freezes updates but keeps rendering. Each state has its own input handling, update logic, and rendering path, preventing code for different modes from interfering with each other.'
                },
                {
                    question: 'How can you implement progressive difficulty in Pong?',
                    options: [
                        'Reduce the screen resolution over time',
                        'Increase ball speed slightly after each paddle hit (e.g., ball_dx *= 1.05) with a maximum cap',
                        'Make the paddles invisible after a certain score',
                        'Add more balls every 30 seconds'
                    ],
                    explanation: 'Multiplying the ball speed by a factor like 1.05 after each paddle hit creates a natural difficulty curve -- the ball gets progressively faster as the rally continues. A maximum speed cap is essential to prevent the ball from moving faster than the paddle width per frame, which would cause it to tunnel through the paddle entirely. This is the simplest and most effective difficulty scaling for Pong.'
                }
            ]
        });
        quiz.start();
    </script>
