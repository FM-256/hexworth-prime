    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 4: Power System Design',
            description: 'Test your knowledge of voltage regulation, decoupling, power sequencing, and thermal management.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-04-quiz',
            moduleId: 'pv-b-04-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What is the main advantage of an LDO regulator over a switching regulator?","options":["Higher efficiency at all voltage ratios","Lower output noise and simpler circuit design","Can step voltage up as well as down","Lower cost in all cases"],"explanation":"LDO regulators produce very clean, low-noise output because they have no switching action. They also require fewer external components (no inductor). However, their efficiency is limited to Vout/Vin, making them inefficient when the input-output voltage difference is large."},
                {"question":"What is the formula for power dissipated in an LDO regulator?","options":["P = V x I (output voltage times current)","P = (Vin - Vout) x Iload","P = I-squared x R","P = Vout-squared / R"],"explanation":"An LDO dissipates P = (Vin - Vout) x Iload as heat. For example, dropping 5V to 3.3V at 200mA dissipates (5.0 - 3.3) x 0.2 = 0.34W. This wasted energy is the fundamental trade-off of linear regulation."},
                {"question":"What value decoupling capacitor should be placed on every VDD pin of the RP2040?","options":["1nF","10nF","100nF (0.1uF)","10uF"],"explanation":"A 100nF (0.1uF) ceramic capacitor should be placed on every VDD pin, as close to the pin as physically possible (within 2mm). This filters high-frequency noise in the 10-100 MHz range. This is a universal rule for virtually all digital ICs."},
                {"question":"What type of regulator does the Raspberry Pi Pico use?","options":["LDO (linear)","Buck converter (step-down only)","Buck-boost converter (step up or down)","Charge pump"],"explanation":"The Pico uses an RT6150B buck-boost converter. Buck-boost means it can step voltage up OR down, accepting inputs from 1.8V to 5.5V and producing a regulated 3.3V output. This allows the Pico to run from USB (5V), LiPo battery (3.0-4.2V), or AA batteries."},
                {"question":"Why must decoupling capacitors be placed as close as possible to the IC power pins?","options":["To save PCB space","To reduce manufacturing cost","To minimize trace inductance that would negate the filtering effect","To improve the appearance of the PCB layout"],"explanation":"The trace connecting a decoupling cap to the IC pin adds parasitic inductance. At high frequencies, this inductance blocks the very current the cap is supposed to provide. A cap 10mm away on a thin trace is nearly useless. Place within 2mm with the shortest, widest trace possible."},
                {"question":"What is a TVS diode used for in power input protection?","options":["Regulating voltage to a precise value","Clamping voltage spikes from ESD or transients","Converting AC power to DC","Indicating power status via LED"],"explanation":"A TVS (Transient Voltage Suppressor) diode clamps voltage spikes to a safe level. For a 5V USB input, a 5.5V TVS clamps anything above that voltage, protecting downstream components from ESD, hot-plug transients, and other voltage spikes."},
                {"question":"What is the purpose of a bulk capacitor near the voltage regulator output?","options":["To filter high-frequency switching noise","To provide charge storage for sudden current demands and stabilize the rail","To set the output voltage of the regulator","To protect against reverse polarity"],"explanation":"A bulk capacitor (typically 10uF or larger) near the regulator output provides a reservoir of charge for sudden current demands. When a load suddenly draws more current (e.g., turning on an LED strip), the bulk cap supplies the initial surge while the regulator catches up."},
                {"question":"What is the 3V3_EN pin on the Raspberry Pi Pico used for?","options":["Enabling 3.3V output from GPIO pins","Disabling the 3.3V regulator to put the board to sleep","Enabling USB 3.3V power delivery","Selecting between 3.3V and 5V operation"],"explanation":"Pulling 3V3_EN low disables the RT6150B regulator, cutting 3.3V power to the entire board. This is used for ultra-low-power battery designs where an external RTC or sensor can wake the board by releasing the 3V3_EN pin."},
                {"question":"What is power sequencing?","options":["The order in which PCB assembly steps occur","Ensuring power rails come up in the correct order to prevent IC damage","The sequence of power measurements during testing","The order of power connections in a multi-board system"],"explanation":"Power sequencing is ensuring that multiple voltage rails come up in the correct order. Some ICs (especially FPGAs and multi-rail SoCs) require core voltage before I/O voltage. Wrong order can cause latch-up, a destructive condition."},
                {"question":"What happens if you use an LDO to drop 12V to 3.3V at 300mA?","options":["It works perfectly with high efficiency","It dissipates 2.61W as heat, likely overheating the LDO","The output voltage will be unstable","The LDO will automatically switch to buck mode"],"explanation":"P = (12 - 3.3) x 0.3 = 2.61W. This is far too much heat for a small LDO package. A SOT-23 LDO would overheat and shut down (or destroy itself). Use a buck switching converter for large input-output voltage differences."},
                {"question":"What is the purpose of thermal vias under the RP2040 QFN ground pad?","options":["To provide electrical ground connection only","To spread heat from the chip into internal ground planes","To anchor the chip mechanically during soldering","To allow flux to escape during reflow"],"explanation":"Thermal vias under the QFN exposed pad conduct heat from the chip into the internal copper planes, spreading it across a much larger area. Without them, the RP2040 has no efficient heat dissipation path and can overheat under sustained load."},
                {"question":"What is the efficiency of an LDO regulator converting 5V to 3.3V?","options":["33%","50%","66%","90%"],"explanation":"LDO efficiency = Vout / Vin = 3.3 / 5.0 = 0.66 = 66%. The remaining 34% is dissipated as heat. This is a fixed relationship for linear regulators regardless of load current. A buck converter would achieve 85-95% efficiency."},
                {"question":"When designing a battery-powered RP2040 board with LiPo, what regulator type is needed?","options":["LDO only","Buck converter only","Buck-boost converter","No regulator -- LiPo voltage is close enough to 3.3V"],"explanation":"A LiPo cell voltage ranges from 4.2V (full) to 3.0V (empty). Below 3.3V + dropout, an LDO cannot maintain 3.3V output. A buck-boost converter maintains 3.3V across the entire battery voltage range by stepping up when the battery is low."},
                {"question":"What is a soft-start circuit used for?","options":["Gradually increasing the clock speed of the MCU","Limiting inrush current when power is first applied","Slowly ramping LED brightness at power-on","Delaying the boot sequence for stability"],"explanation":"A soft-start circuit limits the initial current surge when power is first applied. Large capacitors on the output look like short circuits at turn-on, causing huge inrush current. Soft-start ramps the output voltage slowly, preventing damage to connectors and upstream power supplies."},
                {"question":"What test points should you add to a PCB for power debugging?","options":["One test point on the main VCC rail only","Test points on every power rail (VBUS, 3V3, GND, etc.)","Test points are unnecessary if the design is simulated","Test points on signal lines only, not power"],"explanation":"Add test points on every power rail: VBUS, 3V3, 1V1, and GND at minimum. Label them clearly (TP_3V3, TP_GND). They cost nothing to add and are invaluable for measuring voltage, ripple, and debugging power issues with a multimeter or oscilloscope."}
            ]
        });

    </script>
