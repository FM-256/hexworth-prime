    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Inside the RP2040',
            description: 'Test your understanding of the RP2040 architecture, PIO state machines, memory map, and boot sequence.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-01-quiz',
            moduleId: 'pv-b-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What CPU core does the RP2040 use?","options":["ARM Cortex-A53","ARM Cortex-M0+","ARM Cortex-M4","RISC-V RV32"],"explanation":"The RP2040 uses two ARM Cortex-M0+ cores, the smallest and lowest-power ARM core available. It implements the ARMv6-M instruction set with only 56 base instructions and a 2-stage pipeline."},
                {"question":"How many PIO state machines does the RP2040 have in total?","options":["2","4","8","16"],"explanation":"The RP2040 has 2 PIO blocks, each containing 4 state machines, for a total of 8 PIO state machines. Each can execute programs of up to 32 instructions independently of the CPU."},
                {"question":"What is the maximum clock speed of the RP2040?","options":["48 MHz","125 MHz","133 MHz","250 MHz"],"explanation":"The RP2040 is rated for up to 133 MHz. The default configuration from a 12 MHz crystal via PLL gives 125 MHz. While many chips work beyond 250 MHz when overclocked, 133 MHz is the official maximum."},
                {"question":"How much SRAM does the RP2040 have?","options":["32 KB","64 KB","264 KB","512 KB"],"explanation":"The RP2040 has 264 KB of on-chip SRAM, split across 6 banks: four 64 KB banks and two 4 KB banks. The banks are striped for concurrent access by both CPU cores."},
                {"question":"At what address does the RP2040 boot ROM start?","options":["0x00000000","0x10000000","0x20000000","0xE0000000"],"explanation":"The boot ROM is mapped at address 0x00000000. It is 16 KB of read-only memory containing the USB bootloader and flash programming routines. Core 0 begins execution here on power-on."},
                {"question":"What happens when the BOOTSEL button is held during power-on?","options":["The chip enters deep sleep mode","The chip programs itself from UART","The chip appears as a USB mass storage device for drag-and-drop programming","The chip runs a built-in diagnostic test"],"explanation":"Holding BOOTSEL during power-on causes the boot ROM to skip flash entirely and present the RP2040 as a USB mass storage device. You can then drag-and-drop a UF2 firmware file to program it."},
                {"question":"How many instructions are in the PIO instruction set?","options":["4","9","16","32"],"explanation":"The PIO instruction set has exactly 9 instructions: JMP, WAIT, IN, OUT, PUSH, PULL, MOV, IRQ, and SET. Despite this minimal set, PIO can implement complex protocols like WS2812B, VGA, and even DVI."},
                {"question":"Where is the external flash mapped in the RP2040 address space?","options":["0x00000000","0x10000000","0x20000000","0x40000000"],"explanation":"External flash is mapped at 0x10000000 via the XIP (Execute-in-Place) mechanism. The RP2040 supports up to 16 MB of external QSPI flash at this address range."},
                {"question":"What does XIP stand for in the context of the RP2040?","options":["External Interface Protocol","Execute-in-Place","Extended Instruction Pipeline","Extra Input Port"],"explanation":"XIP stands for Execute-in-Place. It allows code to run directly from external flash memory as if it were internal memory. A 16 KB cache reduces the latency of flash access."},
                {"question":"How many general-purpose GPIO pins does the RP2040 provide?","options":["20","26","30","36"],"explanation":"The RP2040 provides 30 general-purpose GPIO pins (GP0 through GP29). An additional 6 pins are dedicated to the QSPI flash interface and cannot be used as GPIO."},
                {"question":"What is the purpose of the RP2040 SIO block?","options":["Serial Input/Output for UART communication","Single-cycle I/O for fast GPIO access and inter-core communication","Secure I/O for encrypted data transfer","Shared I/O for external memory interface"],"explanation":"SIO stands for Single-cycle I/O. It provides single-cycle access to GPIO pins, hardware spinlocks for inter-core synchronization, and a hardware integer divider. It is mapped at 0xD0000000."},
                {"question":"Which pins on the RP2040 support ADC (Analog-to-Digital Conversion)?","options":["GP0-GP3","GP12-GP15","GP26-GP29","All GPIO pins"],"explanation":"Only GP26 through GP29 support ADC input on the RP2040. The ADC is 12-bit with a 500 kS/s sample rate. GP26 is ADC0, GP27 is ADC1, GP28 is ADC2, and GP29 is ADC3 (also connected to internal temperature sensor)."},
                {"question":"What is the RP2040 second-stage bootloader?","options":["A 16 KB program in the boot ROM","A 256-byte program at the start of external flash that configures QSPI for XIP","The USB mass storage bootloader activated by BOOTSEL","The Pico SDK runtime initialization code"],"explanation":"The second-stage bootloader is a 256-byte program stored at the beginning of external flash. Its job is to configure the QSPI flash chip for XIP mode. It is chip-specific because different flash chips need different configuration sequences."},
                {"question":"How does the RP2040 verify the second-stage bootloader?","options":["It checks a SHA-256 hash","It verifies a CRC32 checksum of the first 256 bytes","It checks a digital signature","It does not verify -- it runs whatever is in flash"],"explanation":"The boot ROM reads the first 256 bytes of external flash and verifies a CRC32 checksum. If the checksum is valid, it executes the second-stage bootloader. If invalid, it falls through to USB boot mode."},
                {"question":"Which core boots first on the RP2040?","options":["Both cores boot simultaneously","Core 0 boots first, Core 1 is held in sleep","Core 1 boots first, Core 0 is held in sleep","The core that was last active boots first"],"explanation":"Core 0 always boots first. Core 1 is held in a sleep state (WFE -- Wait For Event) until Core 0 explicitly wakes it. This deterministic boot order simplifies initialization and prevents race conditions."}
            ]
        });
