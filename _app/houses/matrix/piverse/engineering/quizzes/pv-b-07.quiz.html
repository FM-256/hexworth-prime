    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 7: Motor Controller Case Study',
            description: 'Test your understanding of the stepper motor controller PCB design integrating RP2040 and TMC2209.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-07-quiz',
            moduleId: 'pv-b-07-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What stepper driver IC is used in the motor controller case study?","options":["A4988","DRV8825","TMC2209","L298N"],"explanation":"The case study uses the TMC2209, a Trinamic stepper driver IC. It features silent StealthChop operation, UART configuration, up to 2A per coil, and 256 microstep interpolation. It is the same driver used in modern 3D printers."},
                {"question":"Why does the motor controller need two separate power domains?","options":["To support both 3.3V and 5V logic levels","To prevent motor current spikes and back-EMF from crashing the RP2040","To allow the motor to run at a different speed than the MCU clock","To meet USB power delivery specifications"],"explanation":"Stepper motors generate large current spikes and back-EMF that create noise on the power rail. If this noise couples into the 3.3V logic domain, the RP2040 can crash or the USB connection can drop. Separate power domains with a single ground connection point prevent this."},
                {"question":"What determines the maximum motor current when using the TMC2209?","options":["The trace width on the PCB","The value of the sense resistors (R_SENSE)","The USB cable gauge","The crystal frequency"],"explanation":"The TMC2209 measures voltage across external sense resistors to regulate motor current. I_peak = 0.325V / R_SENSE. With 0.11-ohm sense resistors: I_peak = 2.95A, giving approximately 2.09A RMS. The sense resistor value directly controls the maximum current."},
                {"question":"How does the RP2040 communicate configuration to the TMC2209?","options":["SPI interface","I2C interface","Single-wire UART via the PDN_UART pin","Parallel GPIO configuration pins"],"explanation":"The TMC2209 uses a single-wire UART interface on its PDN_UART pin. The RP2040 UART TX connects through a 1K resistor to this pin. This allows runtime configuration of microstepping, current limit, StealthChop mode, and reading diagnostic data."},
                {"question":"Why is PIO ideal for generating stepper motor step pulses?","options":["PIO can output higher voltage than GPIO","PIO generates cycle-accurate pulses with zero jitter, independent of the CPU","PIO has built-in motor control functions","PIO can drive more current than standard GPIO"],"explanation":"PIO generates step pulses at exact frequencies with zero interrupt jitter or OS scheduling delays. Each pulse is cycle-accurate. While PIO drives the motor, both CPU cores are free for other tasks. This separation gives both mathematical accuracy (CPU calculates ramps) and timing precision (PIO generates pulses)."},
                {"question":"What is the minimum trace width for 2A motor current on a 1oz copper outer layer?","options":["6 mil (0.15mm)","20 mil (0.5mm)","40 mil (1.0mm)","100 mil (2.5mm)"],"explanation":"For 2A on an outer layer with 1oz copper and 10C temperature rise, the minimum trace width is approximately 40 mil (1.0mm). In practice, use wider traces (50-60 mil) or copper pours for safety margin and to minimize voltage drop."},
                {"question":"What is the purpose of the 100uF bulk electrolytic capacitor on the motor power input?","options":["To filter USB noise from the motor power","To absorb current spikes from the stepper driver switching action","To store energy for battery operation","To set the motor voltage level"],"explanation":"The 100uF bulk cap absorbs the large current spikes generated when the TMC2209 switches motor coil current. Without it, the motor power rail rings with every step, creating EMI and potentially exceeding the driver maximum voltage rating."},
                {"question":"How many thermal vias are recommended under the TMC2209 QFN thermal pad?","options":["1-2 vias","4 vias (2x2 array)","9-16 vias (3x3 or 4x4 array)","No vias needed"],"explanation":"A 3x3 or 4x4 array of thermal vias (9-16 vias) under the TMC2209 QFN thermal pad is recommended. These vias conduct heat from the chip into the internal ground planes and bottom copper, providing the thermal dissipation path needed for up to 1W of power dissipation."},
                {"question":"What protection does a TVS diode on the motor power input provide?","options":["Reverse polarity protection","Voltage spike clamping from motor back-EMF","Overcurrent protection","Short circuit detection"],"explanation":"A TVS diode on the motor power input clamps voltage spikes caused by motor back-EMF during deceleration. Without it, these spikes can exceed the TMC2209 maximum rating of 29V, potentially destroying the driver IC."},
                {"question":"What is the purpose of the single ground connection point between logic and motor domains?","options":["To save copper on the PCB","To create a star ground that prevents motor return current from flowing through the logic ground plane","To meet EMC certification requirements","To allow current measurement between domains"],"explanation":"A single ground connection point (star ground) near the TMC2209 ensures motor return current flows directly back to the motor power supply, not through the logic ground plane under the RP2040. This prevents motor switching noise from corrupting digital signals."},
                {"question":"What voltage range is the motor power input designed for?","options":["3.3V to 5V","5V to 12V","8V to 24V","24V to 48V"],"explanation":"The motor power input accepts 8-24V from an external supply via a screw terminal. This range covers most NEMA 17 stepper motor applications (12V for 3D printers, 24V for CNC machines). The TMC2209 supports up to 29V absolute maximum."},
                {"question":"What is StealthChop in the TMC2209?","options":["A security feature that encrypts motor commands","A silent driving mode using voltage-controlled chopping for quiet operation","A power-saving mode that reduces current when idle","A diagnostic mode for detecting motor stalls"],"explanation":"StealthChop (StealthChop2) is Trinamic proprietary silent driving mode. It uses voltage-mode chopping instead of current-mode chopping at low speeds, virtually eliminating audible motor noise. It is what makes modern 3D printers nearly silent."},
                {"question":"Where should the USB connector be placed on the motor controller board?","options":["Next to the motor output connector","At the board edge, away from the motor power section","In the center of the board","On the bottom side of the board"],"explanation":"The USB connector should be at the board edge for cable stress management, and away from the motor power section to minimize noise coupling into the USB data lines. The case study places USB at one edge and motor power at the opposite edge."},
                {"question":"How many vias in parallel are needed for a 2A motor power layer transition?","options":["1 via is sufficient","2 vias (each carries 1A)","4-8 vias (each carries 0.25-0.5A)","Vias cannot carry motor current"],"explanation":"A single 0.3mm via carries approximately 0.5A. For a 2A motor current path, you need at least 4 vias in parallel (0.5A each = 2A total). Using 6-8 vias provides safety margin and reduces voltage drop across the layer transition."},
                {"question":"What LDO is recommended for the logic power supply in the motor controller?","options":["LM7805 (5V output)","AP2112K-3.3 (3.3V, 600mA)","AMS1117-1.8 (1.8V output)","TPS63000 (buck-boost)"],"explanation":"The AP2112K-3.3 is a 3.3V LDO in a small SOT-23-5 package, rated for 600mA with only 250mV dropout. It takes 5V from USB VBUS and provides clean 3.3V for the RP2040 and peripherals. Simple, cheap, and adequate for the logic power needs."}
            ]
        });
