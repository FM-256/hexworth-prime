    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 3: PCB Anatomy',
            description: 'Test your knowledge of PCB layers, traces, vias, ground planes, and board stackup.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-03-quiz',
            moduleId: 'pv-b-03-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What material is the most common PCB substrate?","options":["Aluminum","Ceramic","FR-4 (fiberglass-reinforced epoxy)","Polyimide (flex)"],"explanation":"FR-4 is the standard PCB substrate material. It is a composite of woven fiberglass cloth and epoxy resin. It is cheap, mechanically strong, electrically insulating, and suitable for frequencies up to several GHz."},
                {"question":"What is the standard copper thickness for 1 oz/ft2 PCB copper?","options":["12 micrometers","18 micrometers","35 micrometers","70 micrometers"],"explanation":"1 oz/ft2 copper equals 35 micrometers (1.4 mil) thick. This is the most common copper weight for standard PCBs. 2 oz (70 um) doubles current capacity but costs more and is harder to etch fine features."},
                {"question":"What is a via on a PCB?","options":["A copper trace on the surface layer","A plated hole that connects copper on different layers","A component mounting pad","A test point for probing"],"explanation":"A via is a plated-through hole that creates an electrical connection between copper layers. Through-hole vias go through the entire board. Blind vias connect an outer layer to an inner layer. Buried vias connect two inner layers."},
                {"question":"Why is a continuous ground plane important on a PCB?","options":["It makes the board look professional","It provides the shortest return path for signals and reduces EMI","It saves copper material costs","It is only needed for RF designs above 1 GHz"],"explanation":"A continuous ground plane provides the shortest, lowest-inductance return path for all signals. This minimizes current loop areas, reducing electromagnetic interference (EMI) and crosstalk between signals."},
                {"question":"What is solder mask?","options":["A template for applying solder paste","The colored coating that covers copper except at pads and vias","A heat-resistant tape used during hand soldering","The silkscreen layer showing component outlines"],"explanation":"Solder mask is the colored coating (usually green) applied over the copper layers, with openings only at pads and vias. It prevents solder bridges between closely-spaced pads and protects copper from oxidation."},
                {"question":"In a 4-layer PCB stackup, what is Layer 2 typically used for?","options":["Signal routing","Ground plane","Power plane","Silkscreen"],"explanation":"In a standard 4-layer stackup, Layer 2 (the first inner layer) is typically dedicated to a continuous ground plane. This provides a solid reference for signals on Layer 1 (top) and good signal integrity."},
                {"question":"What is the purpose of thermal relief on a pad connected to a copper pour?","options":["To increase the thermal conductivity for better heat dissipation","To make hand soldering possible by reducing heat wicking","To improve the electrical connection between the pad and pour","To prevent copper pour from touching the pad"],"explanation":"Thermal relief uses a spoked (cross-shaped) connection between a pad and a copper pour instead of a solid connection. This reduces heat wicking during soldering, making it possible to solder the pad by hand or with reflow."},
                {"question":"What is the typical minimum trace width for budget PCB fabrication at JLCPCB?","options":["0.05mm (2 mil)","0.1mm (4 mil)","0.127mm (5 mil)","0.3mm (12 mil)"],"explanation":"JLCPCB supports a minimum trace width of 0.127mm (5 mil) for standard production. However, 0.15mm (6 mil) is the practical sweet spot for reliability. Going below 5 mil requires advanced fab capabilities and higher cost."},
                {"question":"What is a copper pour (fill)?","options":["Liquid copper poured into molds to create the PCB","A large area of copper filling unused board space, connected to a net","A decorative copper pattern on the silkscreen","A manufacturing defect where excess copper remains"],"explanation":"A copper pour fills unused board area with copper connected to a specific net (usually GND). This extends the ground plane, reduces EMI, improves thermal performance, and provides additional current capacity."},
                {"question":"What is the edge cuts layer used for?","options":["Defining the physical outline of the board","Cutting traces at board edges for impedance matching","Marking where components cannot be placed","Specifying the panelization cut lines"],"explanation":"The Edge.Cuts layer defines the physical outline (shape) of the PCB. The fab house follows this line with a router bit to cut the board out of the manufacturing panel. It can be rectangular, rounded, or any custom shape."},
                {"question":"What does DRC stand for in PCB design?","options":["Digital Reference Clock","Design Rule Check","Drill Registration Control","Dielectric Resistance Coefficient"],"explanation":"DRC stands for Design Rule Check. It verifies the PCB layout against manufacturing constraints: minimum trace width, spacing, drill sizes, clearances, and unconnected nets. Always run DRC before generating Gerber files."},
                {"question":"What is a QFN package?","options":["Quad Flat No-lead: pads on all four edges plus an exposed pad underneath","Quarter-size Flat Narrow: a miniature DIP package","Quick-Fit Notched: a snap-in connector type","Quad FPGA Node: an FPGA-specific package"],"explanation":"QFN (Quad Flat No-lead) has contact pads on all four edges of the package bottom, with no protruding leads. It often has an exposed thermal/ground pad underneath. The RP2040 uses QFN-56 (56 pads, 7mm x 7mm)."},
                {"question":"How many layers does a typical RP2040 board design use?","options":["1 layer","2 layers","4 layers","8 layers"],"explanation":"A typical RP2040 board uses 4 layers: top copper (signals), inner ground plane, inner power plane, and bottom copper (signals). The QFN-56 package with pins on all sides plus a ground pad makes 2-layer routing very difficult."},
                {"question":"What is the purpose of mounting holes on a PCB?","options":["To allow air circulation for cooling","To provide attachment points for screws or standoffs","To serve as additional ground vias","To reduce board weight"],"explanation":"Mounting holes are non-plated (or plated) holes for screws or standoffs that physically attach the PCB to an enclosure or frame. Typical sizes are M2.5 or M3. When plated and connected to ground, they can also provide grounding through metal standoffs."},
                {"question":"What is a courtyard in PCB design?","options":["The area around a component where no other component should be placed","The copper area around a via pad","The silkscreen outline of a component","The solder mask opening around a pad"],"explanation":"A courtyard is a clearance boundary around a component that defines the minimum space needed including assembly tolerance and pick-and-place machine clearance. Courtyard overlaps in DRC indicate that components will physically collide."}
            ]
        });
        quiz.start();
    </script>
