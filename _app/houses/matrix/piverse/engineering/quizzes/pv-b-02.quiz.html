    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: Schematic Reading',
            description: 'Test your ability to read schematics: symbols, nets, power rails, and reference designators.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-02-quiz',
            moduleId: 'pv-b-02-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What does a filled circle (junction dot) at a wire crossing on a schematic indicate?","options":["The wires do not connect","The wires are connected","A test point location","A component mounting hole"],"explanation":"A filled circle (junction dot) at a wire crossing means the wires are electrically connected. Without the dot, crossing wires do NOT connect. This is the most common source of schematic misreading."},
                {"question":"What reference designator prefix is used for integrated circuits?","options":["I","IC","U","C"],"explanation":"The standard reference designator prefix for integrated circuits is U (from the legacy term unrestricted). U1 is typically the main MCU, U2 might be a flash chip, U3 a voltage regulator."},
                {"question":"What does a net label on a schematic do?","options":["Labels the physical location of a component","Creates an electrical connection between all points with the same label","Indicates the manufacturing date","Specifies the trace width for PCB routing"],"explanation":"A net label creates an electrical connection between all points that share the same label name, even across different schematic pages. This replaces long wires and keeps schematics readable."},
                {"question":"On the Raspberry Pi Pico schematic, what component converts 5V USB to 3.3V?","options":["AP2112K LDO","RT6150B buck-boost converter","AMS1117-3.3","TPS63000"],"explanation":"The Pico uses an RT6150B buck-boost converter (U2) to convert VSYS (which can be 1.8-5.5V from USB or battery) to a regulated 3.3V output. This flexibility allows the Pico to run from various power sources."},
                {"question":"What is the reference designator prefix for a crystal oscillator?","options":["X","C","Y","O"],"explanation":"The standard reference designator prefix for a crystal is Y. On the Pico schematic, Y1 is the 12 MHz crystal connected to the RP2040 XIN and XOUT pins."},
                {"question":"What does the GND symbol (downward rake) represent on a schematic?","options":["A specific pin on the PCB","The negative terminal of the battery","A global ground net that connects all instances together","An unconnected pin"],"explanation":"The GND symbol represents a global ground net. Every GND symbol on every page of the schematic is connected to the same electrical net. It is the reference point (0V) for all voltages in the circuit."},
                {"question":"What is the purpose of the ERC (Electrical Rules Check)?","options":["To verify the PCB layout follows manufacturing rules","To check the schematic for electrical errors like unconnected pins and missing power","To test the finished board for short circuits","To verify component availability from distributors"],"explanation":"ERC checks the schematic for electrical errors: unconnected nets, floating input pins, missing power connections, conflicting output pins, and power flag errors. It should be run before moving to PCB layout."},
                {"question":"What value capacitors are typically used for crystal load on the RP2040?","options":["1nF","15pF","100nF","10uF"],"explanation":"The RP2040 12 MHz crystal requires two 15pF load capacitors (one on XIN, one on XOUT, both to ground). The exact value must match the crystal datasheet requirements. Wrong values cause clock drift or failure to oscillate."},
                {"question":"What does the reference designator J typically represent?","options":["Jumper wire","Junction point","Connector","JTAG interface"],"explanation":"J is the standard reference designator prefix for connectors. J1 might be the USB connector, J2 a pin header, J3 a motor output connector. It encompasses all types of physical connectors on the board."},
                {"question":"What is the purpose of 27-ohm series resistors on the RP2040 USB D+/D- lines?","options":["To limit USB charging current","To match the USB PHY output impedance to the trace impedance","To protect against reverse voltage","To filter high-frequency noise"],"explanation":"The 27-ohm series resistors match the RP2040 USB PHY output impedance to the 90-ohm differential impedance of the USB traces. This prevents signal reflections that would cause data corruption."},
                {"question":"On a multi-page schematic, how are connections between pages established?","options":["Physical wires drawn between pages","Net labels with the same name on different pages","Special inter-page connector symbols only","They cannot be connected -- each page is independent"],"explanation":"Connections between schematic pages are made using net labels (or global labels) with the same name. A net labeled UART0_TX on page 1 is electrically connected to every other instance of UART0_TX on any page."},
                {"question":"What does the reference designator prefix D stand for?","options":["Digital pin","Driver IC","Diode","Decoupling component"],"explanation":"D is the reference designator prefix for diodes, including standard diodes, LEDs, Schottky diodes, Zener diodes, and TVS (Transient Voltage Suppressor) diodes."},
                {"question":"Why does the Pico schematic include a Schottky diode (D1) between VBUS and VSYS?","options":["To regulate the voltage to exactly 5V","To prevent reverse current if external power is also connected","To convert AC USB power to DC","To indicate USB connection status via LED"],"explanation":"The Schottky diode D1 prevents reverse current flow from an external power supply back into the USB port. This allows the Pico to safely accept power from either USB or an external supply connected to VSYS."},
                {"question":"What is a pull-up resistor used for on a reset pin?","options":["To increase the reset signal voltage","To define the default HIGH state so the chip runs normally","To limit current during reset","To filter noise from the power supply"],"explanation":"A pull-up resistor on the reset pin keeps it at a HIGH (logic 1) state during normal operation. The chip only resets when the pin is pulled LOW (by a button press or external signal). Without the pull-up, the pin would float and could trigger random resets."},
                {"question":"What information does a schematic NOT convey?","options":["Which pins are connected","Component values and part numbers","Physical placement and trace routing on the PCB","Power supply voltage levels"],"explanation":"A schematic shows logical connections, component values, and electrical relationships, but it does NOT show physical placement, trace routing, board dimensions, or component positions on the PCB. That information belongs to the PCB layout."}
            ]
        });
        quiz.start();
    </script>
