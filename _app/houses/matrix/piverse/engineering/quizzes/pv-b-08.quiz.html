    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 8: USB HID Controller Case Study',
            description: 'Test your understanding of the USB HID game controller PCB design using the RP2040.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-08-quiz',
            moduleId: 'pv-b-08-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What does HID stand for in USB terminology?","options":["Hardware Interface Driver","High-speed Internal Data","Human Interface Device","Host Identification Descriptor"],"explanation":"HID stands for Human Interface Device. It is a USB device class for devices that interact directly with humans: keyboards, mice, gamepads, joysticks, and touchscreens. Operating systems include built-in HID drivers, so no custom driver installation is needed."},
                {"question":"Why does the game controller not need custom USB drivers?","options":["The RP2040 has built-in driver firmware","USB HID is a standard device class with built-in OS support","All USB devices work without drivers","The TinyUSB library includes driver installers"],"explanation":"USB HID is a standard device class defined in the USB specification. Every major operating system (Windows, macOS, Linux) includes built-in HID drivers. When a device identifies as an HID gamepad, the OS automatically knows how to communicate with it."},
                {"question":"What is a HID Report Descriptor?","options":["A text file describing the device appearance","A data structure that tells the host what inputs the device has and their ranges","A log file recording device usage","A security certificate for the USB device"],"explanation":"The HID Report Descriptor is a data structure defined in firmware that describes the device capabilities: number of buttons, number of axes, bit widths, value ranges, and report structure. The host parses this descriptor to understand how to interpret the data the device sends."},
                {"question":"How many GPIO pins does the game controller use for buttons?","options":["4 (using a matrix)","8 (using a shift register)","12 (direct wiring, one pin per button)","16 (including extras for future use)"],"explanation":"The controller uses direct GPIO wiring with 12 pins (GP0-GP11), one per button. With 30 GPIO pins available and only 12 buttons, there is no need for a matrix or shift register. Direct wiring is simpler, faster, and eliminates ghosting concerns."},
                {"question":"Which RP2040 pins are used for the analog joystick axes?","options":["GP0-GP3","GP12-GP15","GP26-GP29 (ADC capable)","Any GPIO pin"],"explanation":"Only GP26-GP29 have ADC capability on the RP2040. The controller uses all four: GP26 (left X), GP27 (left Y), GP28 (right X), GP29 (right Y). Each connects to a potentiometer wiper via a 1K series resistor."},
                {"question":"What USB library does the RP2040 firmware use for HID implementation?","options":["libusb","Arduino USB library","TinyUSB","LUFA"],"explanation":"TinyUSB is the USB stack used with the RP2040 Pico SDK. It supports multiple USB device classes including HID. Implementing a gamepad requires defining a report descriptor and calling tud_hid_gamepad_report() to send input data to the host."},
                {"question":"What resistor values must be connected to CC1 and CC2 on a USB-C connector for device mode?","options":["27 ohm","1K ohm","5.1K ohm pull-down to GND","10K ohm pull-up to VCC"],"explanation":"USB-C requires 5.1K pull-down resistors on CC1 and CC2 to identify the device as a USB device (sink). Without these resistors, the host will not recognize the device or provide power. This is a USB-C specification requirement."},
                {"question":"What is the total estimated current draw of the game controller?","options":["Under 10mA","About 56mA","About 200mA","About 500mA"],"explanation":"The total current is approximately 56mA: RP2040 at 40mA + flash idle 1mA + pull-ups 3.6mA + potentiometers 1.3mA + LEDs 10mA. This is well under the USB 100mA default or 500mA configured limit."},
                {"question":"Why was direct GPIO chosen over a button matrix for 12 buttons?","options":["Direct GPIO is always better than a matrix","The RP2040 has enough free GPIO pins, making direct wiring simpler with no ghosting","Matrix scanning is not supported by the RP2040","Direct GPIO allows higher button polling rates"],"explanation":"With 30 GPIO pins minus 4 (ADC), 2 (USB), and 6 (QSPI flash), 18 pins remain free. 12 buttons fit easily without a matrix. Direct wiring eliminates matrix scanning code complexity, diode requirements, and ghosting issues."},
                {"question":"What is the purpose of a 100nF capacitor on each ADC input pin?","options":["To set the ADC reference voltage","To filter high-frequency noise from the joystick potentiometer signal","To protect the ADC from overvoltage","To calibrate the ADC zero point"],"explanation":"The 100nF capacitor forms a low-pass RC filter with the 1K series resistor, removing high-frequency noise from the potentiometer signal. This reduces ADC reading jitter, resulting in smoother joystick input without software filtering."},
                {"question":"What makes the game controller PCB design unique compared to standard rectangular boards?","options":["It uses flexible PCB material","The board shape is custom-contoured to form the controller body itself","It requires 8 or more copper layers","It must be made from aluminum for heat dissipation"],"explanation":"The game controller PCB uses a custom (non-rectangular) board outline that forms the physical shape of the controller. Button and joystick positions on the PCB directly determine the ergonomic layout. The Edge.Cuts layer defines curves for comfortable grips."},
                {"question":"What is button debouncing and why is it needed?","options":["Removing duplicate USB packets from the host","Filtering mechanical switch bounce that would register one press as multiple presses","Preventing buttons from physically bouncing out of their mounts","Calibrating button sensitivity levels"],"explanation":"Mechanical switches bounce when pressed -- the contacts make and break several times within a few milliseconds before settling. Without debouncing, a single press registers as 3-10 rapid presses. Software debouncing requires 5ms of stable readings before accepting a state change."},
                {"question":"What USB polling interval is used for the game controller?","options":["10ms (100 Hz)","5ms (200 Hz)","1ms (1000 Hz)","0.125ms (8000 Hz)"],"explanation":"The controller uses a 1ms polling interval, meaning the host reads input data 1000 times per second. This provides minimal input latency for gaming. The polling interval is configured in the HID report descriptor endpoint configuration."},
                {"question":"What is the estimated per-unit cost for 10 game controllers?","options":["About $3.50","About $13.50 (including 3D printed enclosure)","About $50","About $100"],"explanation":"The estimated cost breakdown for 10 units: PCB $1.50 + SMT assembly $3.20 + components $4.80 + hand-solder THT $1.00 + 3D printed enclosure $3.00 = approximately $13.50 per controller. Low-volume custom hardware at a surprisingly accessible price point."},
                {"question":"What power design does the game controller use?","options":["LiPo battery with buck-boost converter","Dual power domains with motor power and logic power","Simple USB bus power with a single LDO to 3.3V","External 12V power supply with multiple regulators"],"explanation":"The game controller uses the simplest possible power design: 5V from USB VBUS through a single AP2112K LDO to produce 3.3V. No battery, no motor, no secondary power domain. Total current draw is under 100mA. This is the simplest power architecture in the entire track."}
            ]
        });
