    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 6: Manufacturing and Assembly',
            description: 'Test your knowledge of Gerber files, BOM, assembly processes, and JLCPCB workflow.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-06-quiz',
            moduleId: 'pv-b-06-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"What file format do PCB fabrication houses use to manufacture boards?","options":["PDF drawings","KiCad native files","Gerber files","SVG vector graphics"],"explanation":"Gerber is the universal standard file format for PCB fabrication. Each copper layer, solder mask layer, silkscreen layer, and board outline is exported as a separate Gerber file. Drill files use the Excellon format."},
                {"question":"What does BOM stand for in PCB manufacturing?","options":["Board Output Manifest","Bill of Materials","Binary Operation Mode","Basic Order Matrix"],"explanation":"BOM stands for Bill of Materials. It lists every component to be placed on the board: reference designator, value, footprint, manufacturer part number, and quantity. For JLCPCB assembly, each component also needs an LCSC part number."},
                {"question":"What is the purpose of the CPL (Component Placement List) file?","options":["To list component costs and pricing","To specify the order in which components are placed","To tell the pick-and-place machine the X/Y position and rotation of each component","To define the PCB color and finish options"],"explanation":"The CPL file provides the pick-and-place machine with the exact X coordinate, Y coordinate, rotation angle, and board side (top/bottom) for every component. Without it, the machine does not know where to place parts."},
                {"question":"What temperature does SAC305 lead-free solder melt at?","options":["183C","200C","217C","250C"],"explanation":"SAC305 (96.5% tin, 3.0% silver, 0.5% copper) has a liquidus temperature of 217-220C. This is the temperature at which the solder paste fully melts during the reflow phase. The reflow profile peaks at 235-250C to ensure all joints reach liquidus."},
                {"question":"What are fiducial markers on a PCB used for?","options":["Marking the location of test points","Providing alignment reference points for the pick-and-place machine","Indicating the board version number","Marking where to cut the board from the panel"],"explanation":"Fiducials are small copper circles (typically 1mm diameter with 2mm solder mask opening) that give the pick-and-place machine reference points for precise alignment. At least two fiducials on opposite corners are needed for accurate component placement."},
                {"question":"What is tombstoning in PCB assembly?","options":["A component soldered to the wrong pads","One end of a small component lifting off its pad during reflow","A solder bridge between adjacent IC pins","A component placed on the wrong side of the board"],"explanation":"Tombstoning occurs when one end of a small passive component (0402, 0603) lifts off its pad during reflow, standing upright like a tombstone. It is caused by uneven heating or asymmetric solder paste application between the two pads."},
                {"question":"What is the purpose of a solder paste stencil?","options":["To mask areas where solder should not be applied","To apply precise amounts of solder paste to every pad before component placement","To clean excess solder after reflow","To test solder joint quality"],"explanation":"A stencil is a thin metal sheet with laser-cut openings matching every pad on the PCB. Solder paste is squeegeed across the stencil, depositing controlled amounts on each pad. The stencil is then lifted off, leaving paste only on the pads."},
                {"question":"What surface finish is best for fine-pitch QFN packages like the RP2040?","options":["HASL (Hot Air Solder Leveling)","ENIG (Electroless Nickel / Immersion Gold)","OSP (Organic Solderability Preservative)","Bare copper"],"explanation":"ENIG provides a flat, uniform surface ideal for fine-pitch pads like QFN. HASL leaves an uneven surface from the hot air leveling process, which can cause coplanarity issues on the small, closely-spaced QFN pads."},
                {"question":"What should you do before powering on a newly assembled PCB for the first time?","options":["Immediately connect to USB and hope for the best","Run a full software test suite","Check for shorts with a multimeter and use a current-limited power supply","Take a photograph for documentation"],"explanation":"Before first power-on: 1) Visual inspection for solder bridges and component orientation. 2) Multimeter continuity check between power and ground (should NOT beep). 3) Connect a current-limited power supply set to 100mA max. 4) Monitor current draw -- excessive current indicates a short."},
                {"question":"What is panelization in PCB manufacturing?","options":["Applying the solder mask in panels","Combining multiple copies of a small board into a larger panel for efficient manufacturing","Organizing components in the BOM by panel category","Testing multiple boards simultaneously on a test panel"],"explanation":"Panelization combines multiple copies of a small board into a larger panel using V-score lines or mouse-bite tabs. This makes handling, assembly, and shipping more efficient. After assembly, individual boards are separated (depaneled) along the score lines or tabs."},
                {"question":"What is the minimum via drill size typically supported by JLCPCB?","options":["0.1mm","0.2mm","0.3mm","0.5mm"],"explanation":"JLCPCB supports a minimum via drill of 0.2mm for standard production. However, 0.3mm is the practical default -- it is more reliable, cheaper, and sufficient for most designs. Smaller drills increase cost and risk of breakage during manufacturing."},
                {"question":"What does DFM stand for?","options":["Digital Fabrication Model","Design for Manufacturing","Drill File Manifest","Direct Fabrication Method"],"explanation":"DFM stands for Design for Manufacturing. It encompasses design rules and practices that ensure your PCB can be reliably manufactured: minimum trace widths, spacing, drill sizes, annular rings, and component clearances that match your chosen fab house capabilities."},
                {"question":"How do you verify that Gerber files are correct before ordering?","options":["Send them to the fab house and ask for confirmation","Open them in a Gerber viewer to visually inspect each layer","Run them through the schematic ERC tool","Print them on paper and compare to the schematic"],"explanation":"Always inspect Gerber files in a dedicated Gerber viewer (KiCad built-in viewer, gerbv, or the online JLCPCB viewer) before ordering. Check each layer: correct pad openings, no missing traces, proper drill locations, correct board outline, and no artifacts."},
                {"question":"What is the typical total lead time for PCB fabrication and assembly at JLCPCB?","options":["1-2 days","5-7 days","10-30 days depending on options and shipping","60-90 days"],"explanation":"Typical JLCPCB lead time: PCB fabrication 2-5 days + SMT assembly 3-7 days + shipping 5-20 days (depending on method). Total: roughly 10-30 days from order to mailbox. Express options can reduce this at higher cost."},
                {"question":"Why should all passive components be oriented in the same direction when possible?","options":["It improves the electrical performance of the circuit","It helps the reflow oven heat them evenly and simplifies visual inspection","It is required by the USB specification","It reduces the number of unique parts in the BOM"],"explanation":"Aligning passives in the same orientation helps the reflow oven heat them evenly (reducing tombstoning), speeds up pick-and-place machine operation, and makes visual inspection much easier. It is a DFM best practice, not an electrical requirement."}
            ]
        });
