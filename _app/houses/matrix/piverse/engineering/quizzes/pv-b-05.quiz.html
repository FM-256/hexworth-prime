    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 5: Signal Integrity',
            description: 'Test your understanding of impedance, crosstalk, EMI, and USB routing requirements.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pv-b-05-quiz',
            moduleId: 'pv-b-05-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,
            questions: [
                {"question":"At what approximate frequency does signal integrity start to matter for PCB traces?","options":["1 kHz","100 kHz","10 MHz","1 GHz"],"explanation":"Signal integrity becomes significant around 10 MHz, when trace lengths approach 1/10 of the wavelength. USB Full Speed (12 MHz), QSPI flash (50+ MHz), and fast PIO outputs all require careful routing. Below 10 MHz, simple point-to-point wiring works fine."},
                {"question":"What is the required differential impedance for USB 2.0 traces?","options":["50 ohm","75 ohm","90 ohm","120 ohm"],"explanation":"USB 2.0 requires 90 ohm differential impedance with a tolerance of +/- 10%. This is achieved by controlling trace width, spacing, and the distance to the ground reference plane. The exact dimensions depend on your specific PCB stackup."},
                {"question":"What is the 3W rule for crosstalk reduction?","options":["Use traces 3x wider than minimum","Space traces at 3x the trace width center-to-center","Route traces in groups of 3","Use 3 ground vias per signal via"],"explanation":"The 3W rule states that spacing traces at 3 times the trace width (center-to-center) reduces crosstalk by approximately 70%. For critical signals, even wider spacing is recommended. This is a practical rule of thumb, not a precise calculation."},
                {"question":"Why must the USB D+ and D- traces be length-matched?","options":["To ensure equal current distribution","To maintain timing alignment between the differential pair signals","To meet the USB power delivery specification","To reduce manufacturing cost"],"explanation":"D+ and D- carry complementary signals that must arrive at the receiver at the same time. Length mismatch causes skew, which degrades the differential signal quality. USB 2.0 requires matching within 2mm (150 mil)."},
                {"question":"What causes EMI radiation from a PCB?","options":["Static charge on the board surface","Current loops acting as antennas","Component heat dissipation","Poor solder joint quality"],"explanation":"Every current loop on a PCB acts as an antenna. The radiation intensity is proportional to the loop area and the frequency of the current. Larger loops and higher frequencies produce more EMI. This is why continuous ground planes and short traces are critical."},
                {"question":"What is a stitching via?","options":["A via used to stitch torn solder mask","A via connecting ground pours on different layers to maintain low impedance","A via placed at the exact center of a component pad","A via used only during the design phase and removed before fabrication"],"explanation":"Stitching vias are extra ground vias placed throughout the board to connect ground pours on different layers. They maintain low ground impedance, provide return paths near signal vias, and reduce the risk of resonant cavities between ground planes."},
                {"question":"Why should you not route signal traces under a crystal on a PCB?","options":["The crystal generates heat that damages traces","Signal coupling can inject noise into the high-impedance oscillator circuit","The crystal physically blocks access to the trace for testing","It violates the USB specification"],"explanation":"The crystal oscillator circuit is extremely high-impedance and noise-sensitive. Signal traces underneath can capacitively couple noise into the oscillator, causing frequency drift, jitter, or failure to oscillate. Keep the area under and around the crystal clear of all signal routing."},
                {"question":"What is the purpose of 27-ohm series resistors on the RP2040 USB lines?","options":["To limit USB charging current to the RP2040","To match the USB PHY output impedance to the 90-ohm trace impedance","To protect against short circuits on the USB connector","To filter EMI from the USB cable"],"explanation":"The 27-ohm resistors perform series termination. The RP2040 USB PHY output impedance plus 27 ohms matches the 90-ohm differential trace impedance, absorbing reflections and preventing signal ringing."},
                {"question":"What happens when there is an impedance mismatch on a high-speed trace?","options":["The signal amplitude doubles","The signal is reflected back toward the source","The trace heats up and melts","The signal is converted to a different frequency"],"explanation":"An impedance mismatch causes part of the signal to reflect back toward the source, like an echo. The reflected signal interferes with the incoming signal, causing ringing, overshoot, and potential data corruption. Matching impedance eliminates reflections."},
                {"question":"What is the relationship between a ground plane split and EMI?","options":["Splits reduce EMI by isolating noisy sections","Splits force return currents to detour, creating larger current loops that radiate more EMI","Splits have no effect on EMI","Splits only affect DC current, not AC signals"],"explanation":"A split in the ground plane forces high-frequency return currents to detour around the gap. This creates a larger current loop area, which radiates more electromagnetic interference. Never split the ground plane under high-speed signal traces."},
                {"question":"What is controlled impedance PCB fabrication?","options":["Using a special machine to measure impedance during assembly","Specifying impedance requirements to the fab so they adjust dielectric thickness","Adding impedance-matching components after fabrication","Testing each board for impedance compliance before shipping"],"explanation":"When you order controlled impedance, you tell the fab house the target impedance (e.g., 90 ohm differential for USB). They adjust the dielectric layer thickness to achieve that impedance with your specified trace width. They then test sample traces to verify."},
                {"question":"How should you handle layer changes for USB differential pairs?","options":["Add a ground via next to each signal via when changing layers","Avoid layer changes entirely for USB traces","Change layers only at the midpoint of the trace","Use blind vias instead of through-hole vias"],"explanation":"The best practice is to avoid layer changes for USB differential pairs entirely. If a layer change is unavoidable, place a ground stitching via adjacent to each signal via to provide a return path transition. The via discontinuity still disrupts impedance, so minimize them."},
                {"question":"What is the maximum recommended distance between the crystal and the RP2040?","options":["1mm","5mm","20mm","50mm"],"explanation":"The crystal should be placed within 5mm of the RP2040 XIN/XOUT pins. Longer traces add parasitic capacitance and inductance that can detune the oscillator or prevent it from starting. The load capacitors should be even closer to the crystal pads."},
                {"question":"What determines the characteristic impedance of a microstrip trace?","options":["Only the trace width","Only the dielectric material","Trace width, copper thickness, dielectric height, and dielectric constant","Only the trace length"],"explanation":"Characteristic impedance is determined by four factors: trace width, copper thickness, the height of the dielectric between the trace and the reference plane, and the dielectric constant (Er) of the FR-4 material. All four must be known to calculate impedance accurately."},
                {"question":"For QSPI flash routing on the RP2040, what is the maximum recommended length mismatch between data lines?","options":["0.5mm","5mm","15mm","50mm"],"explanation":"QSPI data lines (SD0-SD3) and the clock (SCLK) should be matched within 5mm. The flash reads all data lines simultaneously on the clock edge, so length mismatch causes setup/hold timing violations that lead to read errors."}
            ]
        });
        quiz.start();
