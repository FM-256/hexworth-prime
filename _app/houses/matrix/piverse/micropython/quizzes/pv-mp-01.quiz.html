    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 1: Know Your Pico',
            description: 'Test your understanding of the RP2040 microcontroller, Pico board layout, pin types, BOOTSEL mode, and hardware variants.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-01-quiz', moduleId: 'pv-mp-01-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What processor architecture does the RP2040 use?', options: ['8-bit AVR', 'Dual ARM Cortex-M0+', 'ARM Cortex-A53', 'RISC-V'], explanation: 'The RP2040 uses two ARM Cortex-M0+ cores running at up to 133 MHz. The Cortex-M0+ is the smallest and most energy-efficient ARM core, using a 2-stage pipeline and Thumb instruction set. Despite its small size, it is a 32-bit processor.' },
                { question: 'How much SRAM does the RP2040 have?', options: ['32 KB', '264 KB', '512 KB', '2 MB'], explanation: 'The RP2040 has 264 KB of SRAM split across 6 independent banks. This architecture allows both cores and DMA controllers to access different banks simultaneously without bus contention.' },
                { question: 'How much flash memory does the Raspberry Pi Pico board include?', options: ['256 KB', '1 MB', '2 MB', '4 MB'], explanation: 'The Pico board includes 2 MB of external QSPI flash memory. The flash is external to the RP2040 die and connected via a Quad SPI bus with four data lines for faster read speeds.' },
                { question: 'What is the maximum clock speed of the RP2040?', options: ['48 MHz', '84 MHz', '133 MHz', '240 MHz'], explanation: 'The RP2040 runs at up to 133 MHz. The default MicroPython configuration starts at 125 MHz. Both cores share the same clock frequency.' },
                { question: 'How many GPIO pins does the Pico expose on its header?', options: ['14', '20', '26', '40'], explanation: 'The Pico exposes 26 GPIO pins (GP0-GP28, with some gaps) on its 40-pin header. The total 40 pins also include power, ground, and debug pins.' },
                { question: 'Which pins on the Pico support ADC (analog-to-digital conversion)?', options: ['All GPIO pins', 'GP26, GP27, GP28 only', 'GP0 through GP5', 'GP13 only'], explanation: 'Only GP26 (ADC0), GP27 (ADC1), and GP28 (ADC2) support analog input. GP29 (ADC3) is internally connected to VSYS/3, and ADC channel 4 reads the internal temperature sensor.' },
                { question: 'What does the BOOTSEL button do?', options: ['Resets the RP2040 processor', 'Puts the Pico into USB mass storage mode for firmware flashing', 'Toggles between MicroPython and C/C++ mode', 'Enables Bluetooth pairing'], explanation: 'Holding BOOTSEL while plugging in USB makes the RP2040 enter its ROM bootloader, which presents the flash as a USB mass storage device named RPI-RP2. You drag a .uf2 firmware file onto this drive to install or update firmware.' },
                { question: 'What voltage level do the RP2040 GPIO pins use?', options: ['1.8V', '3.3V', '5V', '12V'], explanation: 'The RP2040 uses 3.3V logic levels. HIGH = 3.3V, LOW = 0V. The GPIO pins are NOT 5V tolerant -- applying 5V to any GPIO will permanently damage the chip. Always use level shifters for 5V devices.' },
                { question: 'What is the resolution of the RP2040 ADC?', options: ['8-bit', '10-bit', '12-bit', '16-bit'], explanation: 'The RP2040 ADC is 12-bit, providing 4096 discrete values (0-4095). MicroPython read_u16() scales this to 16-bit (0-65535) for cross-platform compatibility, but the hardware resolution remains 12 bits.' },
                { question: 'How many PWM channels does the RP2040 support?', options: ['6', '8', '16', '30'], explanation: 'The RP2040 has 16 PWM channels organized as 8 slices with 2 outputs each (A and B). Every GPIO pin can be assigned to a PWM channel. Both channels in a slice share the same frequency but can have independent duty cycles.' },
                { question: 'What is the main difference between the Pico and Pico W?', options: ['Pico W has a faster processor', 'Pico W has more GPIO pins', 'Pico W adds WiFi and Bluetooth via the CYW43439 chip', 'Pico W has 4 MB of flash'], explanation: 'The Pico W adds an Infineon CYW43439 wireless chip providing WiFi 802.11n and Bluetooth 5.2 (BLE). Both use the same RP2040 processor. The LED connection differs: Pico uses GP25, Pico W routes the LED through the wireless chip.' },
                { question: 'On the standard Pico, which GPIO pin is the on-board LED connected to?', options: ['GP0', 'GP13', 'GP25', 'GP28'], explanation: 'On the standard Pico (not Pico W), the on-board LED is connected to GP25. On the Pico W, the LED is connected through the CYW43 wireless chip and accessed with Pin("LED") instead of Pin(25).' },
                { question: 'What type of flash memory connection does the RP2040 use?', options: ['Parallel NOR flash', 'QSPI (Quad SPI)', 'eMMC', 'SD card interface'], explanation: 'The RP2040 uses QSPI (Quad SPI) to connect to external flash memory. QSPI provides four data lines instead of one, enabling faster read speeds than standard SPI.' },
                { question: 'What are the three debug pins at the bottom of the Pico board?', options: ['TX, RX, GND', 'SWCLK, SWDIO, GND', 'MOSI, MISO, SCK', 'SDA, SCL, GND'], explanation: 'The three debug pins are SWCLK (Serial Wire Clock), SWDIO (Serial Wire Data I/O), and GND. These are for the SWD (Serial Wire Debug) protocol used by hardware debug probes.' },
                { question: 'What is the purpose of the 3V3_EN pin on the Pico?', options: ['It provides 3.3V power output', 'It enables/disables the on-board 3.3V voltage regulator', 'It sets the GPIO voltage level', 'It enables the third UART'], explanation: '3V3_EN is the enable pin for the Pico on-board voltage regulator. Pulling it LOW disables the regulator, cutting power to the RP2040. This can be used for ultra-low-power sleep modes in battery-powered projects.' }
            ]
        });
        quiz.start();
    </script>
