    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 10: I2C and SPI',
            description: 'Test your understanding of I2C and SPI bus protocols, device addressing, OLED displays, and multi-device communication.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-10-quiz', moduleId: 'pv-mp-10-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'How many wires does I2C require for communication?', options: ['1 (data only)', '2 (SDA and SCL)', '4 (MOSI, MISO, SCK, CS)', '8 (parallel bus)'], explanation: 'I2C uses two wires: SDA (Serial Data) for bidirectional data and SCL (Serial Clock) generated by the master. Both lines are shared by all devices on the bus. Plus VCC and GND for power.' },
                { question: 'What is the purpose of I2C device addresses?', options: ['To set the data transmission speed', 'To uniquely identify each device on the shared bus so the master can communicate with a specific one', 'To encrypt the data', 'To set the voltage level'], explanation: 'Each I2C device has a unique 7-bit address (0x00-0x7F). The master sends the address before each transaction, and only the addressed device responds. This allows up to 127 devices to share two wires.' },
                { question: 'What does i2c.scan() return?', options: ['The number of devices', 'A list of addresses (integers) of all responding devices', 'The device names', 'The bus speed'], explanation: 'i2c.scan() sends each possible address on the bus and records which ones get an acknowledgment. It returns a list of integer addresses. For example, [0x3C, 0x68] means two devices were found.' },
                { question: 'What is the typical I2C address of an SSD1306 OLED display?', options: ['0x27', '0x3C', '0x68', '0x76'], explanation: 'The SSD1306 OLED display defaults to I2C address 0x3C. Some boards have a solder bridge to switch to 0x3D, allowing two OLED displays on the same bus.' },
                { question: 'What does oled.show() do?', options: ['Turns on the OLED backlight', 'Pushes the frame buffer to the display, making changes visible', 'Shows the I2C address', 'Displays a test pattern'], explanation: 'The SSD1306 driver uses a frame buffer in RAM. text(), pixel(), and fill() modify the buffer. show() transfers the entire buffer to the display over I2C. Without show(), changes remain invisible.' },
                { question: 'How many wires does SPI require?', options: ['2 (like I2C)', '3 (SCK, MOSI, MISO)', '4 (SCK, MOSI, MISO, CS per device)', '6'], explanation: 'SPI uses 4 wires: SCK (clock), MOSI (data out), MISO (data in), and CS (chip select). CS is per-device -- each additional device needs one more CS wire. The first three lines are shared.' },
                { question: 'What is the key advantage of SPI over I2C?', options: ['Fewer wires', 'Much higher speed (up to 62.5 MHz on Pico vs 400 KHz for I2C)', 'More devices supported', 'Lower power consumption'], explanation: 'SPI can run at up to 62.5 MHz on the Pico, approximately 150x faster than I2C fast mode (400 kHz). This makes SPI essential for high-bandwidth peripherals like color TFT displays, SD cards, and flash memory.' },
                { question: 'How does SPI select which device to communicate with?', options: ['Using addresses like I2C', 'Using a dedicated CS (Chip Select) pin pulled LOW for the target device', 'Using different clock frequencies', 'Using different data formats'], explanation: 'Each SPI device has a dedicated CS pin. The master pulls CS LOW to select a device and HIGH to deselect it. Only the device with CS LOW responds to clock and data signals. No addresses needed.' },
                { question: 'What does "full-duplex" mean in the context of SPI?', options: ['It can talk to two devices at once', 'Data can be sent and received simultaneously on separate wires', 'It uses double the bandwidth', 'It supports two clock speeds'], explanation: 'Full-duplex means the master sends data (MOSI) and receives data (MISO) at the same time, on separate wires. I2C is half-duplex -- data goes one direction at a time on the shared SDA line.' },
                { question: 'What happens if two I2C devices have the same address?', options: ['They share the address peacefully', 'They collide, causing data corruption and communication failure', 'The bus automatically reassigns addresses', 'Only the first device responds'], explanation: 'Address collisions cause both devices to respond simultaneously, corrupting the data on the bus. Solutions: use an address-selectable variant, use a different I2C bus (Pico has two), or use an I2C multiplexer.' },
                { question: 'How many I2C buses does the Pico have?', options: ['1', '2', '4', '8'], explanation: 'The Pico has two independent I2C buses: I2C bus 0 and I2C bus 1. Each has its own set of SDA/SCL pin options. Use separate buses when devices have address conflicts or need isolation.' },
                { question: 'What is the correct way to read 7 bytes from I2C register 0x00 on device 0x68?', options: ['i2c.read(0x68, 7)', 'i2c.readfrom_mem(0x68, 0x00, 7)', 'i2c.get(0x68, 0x00, 7)', 'i2c.recv(0x68, 7)'], explanation: 'readfrom_mem(addr, memaddr, nbytes) combines a register address write and a read in one I2C transaction. It writes the register pointer (0x00) then reads 7 bytes. This is the standard pattern for register-based I2C devices.' },
                { question: 'What driver library is needed for the SSD1306 OLED?', options: ['It is built into MicroPython', 'The ssd1306 module, installed via mpremote mip install ssd1306', 'No driver needed -- raw I2C commands only', 'The oled module from pip'], explanation: 'The ssd1306 driver is not built into MicroPython. Install it with mpremote mip install ssd1306 or manually copy ssd1306.py to the Pico. The driver provides text(), pixel(), fill(), and show() methods.' },
                { question: 'When should you choose I2C over SPI?', options: ['When speed is critical', 'When you need many devices with minimal wires and moderate speed is acceptable', 'When you need full-duplex communication', 'When using SD cards'], explanation: 'I2C is best when you have many devices (sensors, RTCs, small displays) and want to minimize wiring -- just 2 data wires regardless of device count. Moderate speed (up to 400 kHz) is sufficient for most sensor data.' },
                { question: 'What SPI mode (polarity/phase) is most common?', options: ['Mode 0 (polarity=0, phase=0)', 'Mode 1 (polarity=0, phase=1)', 'Mode 2 (polarity=1, phase=0)', 'Mode 3 (polarity=1, phase=1)'], explanation: 'Mode 0 (CPOL=0, CPHA=0) is the most common SPI mode. Data is sampled on the rising edge of the clock, and the clock idles LOW. Most SPI peripherals default to Mode 0 unless their datasheet specifies otherwise.' }
            ]
        });
        quiz.start();
    </script>
