<body>
    <header class="page-header"><a href="../../index.html">&larr; Back to PiVerse Hub</a><span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 3: Digital I/O',
            description: 'Test your understanding of GPIO output, input, pull resistors, debouncing, interrupts, and multi-LED control.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-03-quiz', moduleId: 'pv-mp-03-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What does Pin(15, Pin.OUT) do?', options: ['Reads the voltage on GPIO 15', 'Configures GPIO 15 as a digital output', 'Creates a PWM signal on GPIO 15', 'Connects GPIO 15 to the ADC'], explanation: 'Pin(15, Pin.OUT) configures GPIO pin 15 as a digital output. The pin can then be set to 3.3V (HIGH) with value(1) or 0V (LOW) with value(0). Output pins actively drive current.' },
                { question: 'What does led.value(1) do on an output pin?', options: ['Reads the pin state', 'Sets the pin to 3.3V (HIGH)', 'Sets the pin to 5V', 'Toggles the pin state'], explanation: 'value(1) sets the output pin to 3.3V (HIGH) on the RP2040. This causes current to flow through any connected circuit (like an LED with a resistor). value(0) sets it to 0V (LOW).' },
                { question: 'What does led.toggle() do?', options: ['Turns the LED off', 'Turns the LED on', 'Switches the pin to the opposite of its current state', 'Reads the current pin state'], explanation: 'toggle() flips the pin from its current state to the opposite. If HIGH, it goes LOW. If LOW, it goes HIGH. This is cleaner than tracking state manually for blink patterns.' },
                { question: 'Why is a resistor needed when connecting an external LED to a GPIO pin?', options: ['To increase brightness', 'To limit current and prevent damage to the LED and GPIO', 'To convert AC to DC', 'To store energy'], explanation: 'A resistor (typically 220-330 ohm) limits the current flowing through the LED. Without it, the LED draws too much current from the GPIO pin (max 12 mA default on RP2040), potentially damaging both the LED and the pin.' },
                { question: 'What does Pin.PULL_UP do when configuring an input pin?', options: ['Connects the pin to 5V externally', 'Enables an internal resistor that pulls the pin to 3.3V when nothing is connected', 'Increases the pin reading speed', 'Makes the pin output-only'], explanation: 'Pin.PULL_UP enables an internal ~50K ohm resistor that pulls the pin to 3.3V when nothing is actively driving it. This gives the pin a defined default state (HIGH). A button wired to GND pulls it LOW when pressed.' },
                { question: 'What value does a button with PULL_UP return when NOT pressed?', options: ['0', '1', 'None', '-1'], explanation: 'With PULL_UP, the internal resistor holds the pin at 3.3V when the button is not pressed, so value() returns 1. When pressed (connected to GND), value() returns 0. This is active-LOW logic.' },
                { question: 'What is a floating pin?', options: ['A pin configured for PWM output', 'An input pin with no pull resistor that reads random values', 'A pin connected to the ADC', 'A pin used for I2C communication'], explanation: 'A floating pin is an input pin with no pull-up or pull-down resistor. It picks up electrical noise from the environment and reads random HIGH/LOW values. Input pins should always have a defined default state via pull resistors.' },
                { question: 'What causes button bounce?', options: ['Electromagnetic interference from the CPU', 'The physical metal contacts bouncing 5-50ms when pressed', 'Software bugs in the interrupt handler', 'Voltage spikes from the power supply'], explanation: 'When you press a mechanical button, the metal contacts physically bounce for 5-50 milliseconds before settling. Each bounce creates rising and falling edges that the microcontroller reads as separate press/release events.' },
                { question: 'What is a common software debounce strategy?', options: ['Use a faster clock speed', 'Wait 50ms after detecting a press, then re-read the button', 'Add a capacitor to the circuit', 'Read the button in a try/except block'], explanation: 'Software debounce: when a press is detected, wait 50ms for the bouncing to settle, then re-read the button. If still pressed, it is a genuine press. Then wait for release before accepting the next press. This eliminates false triggers.' },
                { question: 'What does pin.irq(trigger=Pin.IRQ_FALLING, handler=fn) do?', options: ['Polls the pin continuously', 'Sets up a hardware interrupt that calls fn when the pin goes from HIGH to LOW', 'Disables the pin', 'Creates a PWM waveform'], explanation: 'irq() configures a hardware interrupt. IRQ_FALLING triggers when the pin transitions from HIGH to LOW (falling edge). The handler function is called automatically by the hardware -- no polling needed. This is more CPU-efficient than polling in a loop.' },
                { question: 'What is the advantage of interrupts over polling for button input?', options: ['Interrupts use more CPU time', 'Interrupts allow the CPU to do other work instead of checking the pin in a loop', 'Interrupts are simpler to implement', 'Polling is always better'], explanation: 'Polling checks the button state in a tight loop, using 100% CPU. Interrupts let the hardware notify your code only when the pin actually changes state. Between changes, the CPU is free for other tasks.' },
                { question: 'How would you create a list of three LED Pin objects on GP15, GP16, GP17?', options: ['leds = Pin(15,16,17, Pin.OUT)', 'leds = [Pin(i, Pin.OUT) for i in (15, 16, 17)]', 'leds = Pin.array(15, 16, 17)', 'leds = machine.LED(15, 16, 17)'], explanation: 'Python list comprehension: [Pin(i, Pin.OUT) for i in (15, 16, 17)] creates three separate Pin objects and stores them in a list. This pattern scales to any number of pins and is standard MicroPython.' },
                { question: 'What does utime.sleep(0.5) do?', options: ['Sleeps for 0.5 microseconds', 'Sleeps for 0.5 milliseconds', 'Sleeps for 0.5 seconds (500 ms)', 'Sets the clock to 0.5 Hz'], explanation: 'utime.sleep() accepts seconds as a float. 0.5 = 500 milliseconds. For millisecond precision, use utime.sleep_ms(500). For microseconds, use utime.sleep_us(). During sleep, the CPU blocks and cannot respond to events.' },
                { question: 'What happens if you connect two output pins directly together?', options: ['Nothing, they share the load', 'They fight over the voltage level and may damage the chip', 'They automatically synchronize', 'One becomes an input automatically'], explanation: 'If one pin drives HIGH (3.3V) and the other drives LOW (0V), excessive current flows between them. This can damage the output transistors in the RP2040. Never connect two output pins together.' },
                { question: 'What is active-LOW logic?', options: ['The pin is active when set to LOW voltage', 'The signal is considered active (button pressed) when the pin reads 0 (LOW)', 'The pin uses negative voltage', 'The pin only works at low clock speeds'], explanation: 'Active-LOW means the signal is active (button pressed, event triggered) when the pin reads LOW (0). With PULL_UP, the default is HIGH (1). Pressing the button pulls it to GND, making it LOW (0). This is the most common pattern for buttons.' }
            ]
        });
        quiz.start();
    </script>
