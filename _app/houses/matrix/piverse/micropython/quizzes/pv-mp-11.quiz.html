    <header class="page-header"><a href="../../index.html">&larr; Back to PiVerse Hub</a><span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 11: WiFi Networking',
            description: 'Test your understanding of WiFi connectivity, TCP/IP, HTTP requests, web servers, and IoT patterns on the Pico W.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-11-quiz', moduleId: 'pv-mp-11-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'Which Pico variant supports WiFi?', options: ['Pico (original)', 'Pico W', 'Both Pico and Pico W', 'Neither -- you need an external module'], explanation: 'Only the Pico W has the CYW43439 wireless chip for WiFi and Bluetooth. The original Pico has no wireless hardware. The network module will raise an error on a standard Pico.' },
                { question: 'What MicroPython module is used to connect to WiFi?', options: ['wifi', 'network', 'wlan', 'socket'], explanation: 'The network module provides the WLAN class for WiFi management. network.WLAN(network.STA_IF) creates a station interface (client mode) that can connect to existing WiFi networks.' },
                { question: 'What does DHCP do when connecting to WiFi?', options: ['Encrypts the WiFi connection', 'Automatically assigns an IP address, subnet mask, gateway, and DNS server', 'Compresses network traffic', 'Authenticates the user'], explanation: 'DHCP (Dynamic Host Configuration Protocol) automatically assigns network parameters to the Pico W when it connects. Without DHCP, you would need to manually configure the IP address and related settings.' },
                { question: 'How do you check if the Pico W is connected to WiFi?', options: ['wlan.status()', 'wlan.isconnected()', 'wlan.check()', 'network.connected()'], explanation: 'wlan.isconnected() returns True if the WiFi connection is active and an IP address has been obtained via DHCP. Always check this before making network calls to avoid crashes.' },
                { question: 'What does wlan.ifconfig() return?', options: ['The WiFi password', 'A tuple of (IP address, subnet mask, gateway, DNS server)', 'The signal strength', 'The MAC address'], explanation: 'ifconfig() returns a 4-tuple: (IP address, subnet mask, gateway, DNS server). For example: ("192.168.1.42", "255.255.255.0", "192.168.1.1", "8.8.8.8"). Use ifconfig()[0] to get just the IP.' },
                { question: 'Why must you call response.close() after an HTTP request?', options: ['To encrypt the response', 'To free the socket and memory -- the Pico has limited resources and leaks crash it', 'To save the response to flash', 'It is optional'], explanation: 'The Pico W has very limited RAM and a small number of available sockets. Unclosed responses leak both. After 5-10 unclosed requests, new connections fail because no sockets are available. Always close.' },
                { question: 'What HTTP method is used to fetch data from a server?', options: ['POST', 'PUT', 'GET', 'DELETE'], explanation: 'GET requests data from a server. The server responds with the requested resource (HTML, JSON, etc.). POST sends data to a server. GET is read-only; POST can create or update resources.' },
                { question: 'What port does HTTP use by default?', options: ['22', '80', '443', '8080'], explanation: 'HTTP uses port 80 by default. HTTPS uses port 443. When you browse to http://192.168.1.42, the browser connects to port 80. Your Pico W web server should listen on port 80 for standard HTTP.' },
                { question: 'How does the meta refresh tag enable auto-updating web pages?', options: ['It runs JavaScript on the page', 'It tells the browser to reload the page after a specified number of seconds', 'It establishes a WebSocket connection', 'It caches the page for offline use'], explanation: 'The tag <meta http-equiv="refresh" content="5"> tells the browser to reload the page every 5 seconds. Each reload triggers a new HTTP request, and the server sends fresh sensor data. Simple alternative to JavaScript/WebSocket.' },
                { question: 'What does socket.SO_REUSEADDR do?', options: ['Allows multiple servers on the same port', 'Allows the socket to be reused immediately after the program restarts', 'Reuses the IP address', 'Enables IPv6'], explanation: 'SO_REUSEADDR allows binding to a port that was recently used. Without it, restarting your server script can fail with "Address already in use" because the OS holds the port for a timeout period.' },
                { question: 'Where should you store WiFi credentials?', options: ['Hardcoded in main.py', 'In a separate secrets.py file that is never shared or committed', 'In a comment at the top of the file', 'In the MicroPython firmware'], explanation: 'Keep credentials in a separate secrets.py file and import them. Never hardcode passwords in your main script. Never commit secrets.py to version control. This mirrors the .env file pattern in web development.' },
                { question: 'What does ntptime.settime() do?', options: ['Sets the system timezone', 'Synchronizes the Pico internal clock with a network time server (NTP)', 'Sets an alarm', 'Converts between time zones'], explanation: 'ntptime.settime() contacts a Network Time Protocol server and sets the Pico internal clock to the current UTC time. After this, time.localtime() returns the real date and time instead of time-since-boot.' },
                { question: 'What is the "push" model in IoT?', options: ['The server pushes firmware updates to the device', 'The Pico posts sensor data to a cloud server at regular intervals', 'The user pushes a button to send data', 'Data is pushed to an SD card'], explanation: 'In the push model, the Pico initiates connections and sends (pushes) sensor data to a cloud server. The server stores and visualizes the data. This is how commercial IoT platforms like ThingSpeak and Adafruit IO work.' },
                { question: 'What should happen when WiFi disconnects during data logging?', options: ['The program should crash', 'Log data locally to flash and attempt to reconnect periodically', 'Delete all stored data', 'Wait indefinitely for reconnection'], explanation: 'A robust IoT device falls back to local flash logging when WiFi is unavailable and attempts to reconnect periodically. When WiFi returns, it can resume pushing data. Never let a network failure stop local data collection.' },
                { question: 'What WiFi standard does the Pico W support?', options: ['802.11a (5 GHz only)', '802.11b/g/n (2.4 GHz)', '802.11ac (5 GHz)', 'WiFi 6 (802.11ax)'], explanation: 'The Pico W CYW43439 supports 802.11b/g/n on the 2.4 GHz band only. It does not support 5 GHz networks. When configuring your router, ensure a 2.4 GHz network is available for the Pico W to connect to.' }
            ]
        });
        quiz.start();
    </script>
