    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 5: Traffic Light Controller',
            description: 'Test your understanding of state machines, non-blocking timing, multi-LED coordination, and event-driven design.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-05-quiz', moduleId: 'pv-mp-05-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is a state machine?', options: ['A type of motor controller', 'A system that can be in exactly one state at a time with defined transition rules', 'A programming language for embedded systems', 'A hardware testing tool'], explanation: 'A state machine (or finite state machine) is a computational model where the system can be in exactly one state at any time. Transitions between states are triggered by events (timer, button press) and follow defined rules. This prevents impossible configurations.' },
                { question: 'How many states does the traffic light cycle have?', options: ['2 (RED, GREEN)', '3 (RED, YELLOW, GREEN)', '4 (RED, RED+YEL, GREEN, YELLOW)', '5 (including OFF)'], explanation: 'The standard UK/EU traffic light cycle has 4 states: RED (stop), RED+YELLOW (prepare to go), GREEN (go), YELLOW (prepare to stop). Each state defines which LEDs are on and for how long.' },
                { question: 'Why is sleep() problematic for a traffic light controller?', options: ['sleep() uses too much power', 'sleep() blocks the CPU, preventing response to events like pedestrian buttons', 'sleep() is not accurate enough', 'sleep() does not work with GPIO'], explanation: 'sleep() blocks the entire program for the specified duration. During a 5-second RED phase, the CPU cannot read a pedestrian button, update a display, or respond to any other input. The system is dead to the world during sleep().' },
                { question: 'What does utime.ticks_ms() return?', options: ['The current date and time', 'A monotonically increasing millisecond counter', 'The CPU clock frequency', 'The number of loop iterations'], explanation: 'ticks_ms() returns an incrementing millisecond counter. By recording the time at one point and checking later, you can measure elapsed time without blocking. The counter wraps around after approximately 24 days.' },
                { question: 'Why should you use ticks_diff() instead of simple subtraction?', options: ['ticks_diff() is faster', 'ticks_diff() handles counter wraparound correctly', 'Simple subtraction does not work with integers', 'ticks_diff() returns seconds instead of milliseconds'], explanation: 'The ticks counter wraps around after about 2^30 milliseconds. Simple subtraction (a - b) gives wrong results when the counter wraps. ticks_diff(a, b) handles this edge case correctly and always returns the true difference.' },
                { question: 'What is the purpose of the pedestrian button in the traffic light?', options: ['To turn off all lights', 'To request an early transition from GREEN to YELLOW', 'To reset the controller', 'To switch to night mode'], explanation: 'The pedestrian button sets a flag that the main loop checks during the GREEN state. If the flag is set, the GREEN phase is cut short and the controller advances to YELLOW, then RED, allowing pedestrians to cross sooner.' },
                { question: 'How does the interrupt handler communicate with the main loop?', options: ['By calling a function directly', 'By setting a global flag variable that the main loop checks', 'By sending a serial message', 'By modifying the state machine directly'], explanation: 'The interrupt handler sets a global boolean flag (e.g., ped_requested = True). The main loop checks this flag during each iteration. Interrupt handlers should be short and fast -- they should set flags, not perform complex logic.' },
                { question: 'What is data-driven design in the context of the traffic light?', options: ['Using a database to store state information', 'Defining states as data structures (lists/dicts) separate from the loop logic', 'Transmitting data over WiFi', 'Using analog sensors for input'], explanation: 'Data-driven design separates WHAT (state definitions in a list of dictionaries) from HOW (the loop logic that applies states). To change timing or add states, you edit the data structure without touching the loop code. This makes the system maintainable and testable.' },
                { question: 'What does night mode look like for a traffic light?', options: ['All lights off', 'Blinking yellow only', 'Steady red', 'Alternating red and green'], explanation: 'Night mode shows blinking yellow only -- a common real-world pattern for low-traffic periods. It signals caution without the full stop/go cycle. The red and green LEDs are off. Yellow blinks at approximately 1 Hz.' },
                { question: 'How is state defined in the STATES list?', options: ['As a string ("RED")', 'As a dictionary with LED states and duration', 'As a class instance', 'As a tuple of pin numbers'], explanation: 'Each state is a dictionary: {"r": 1, "y": 0, "g": 0, "dur": 5000, "name": "RED"}. The r/y/g fields define LED states (1=on, 0=off). The dur field defines how long the state lasts in milliseconds. The name field is for logging.' },
                { question: 'What does (state_idx + 1) % len(STATES) do?', options: ['Doubles the state index', 'Advances to the next state, wrapping back to 0 after the last state', 'Randomly selects a state', 'Skips every other state'], explanation: 'The modulo operator (%) wraps the index back to 0 after reaching the last state. If state_idx is 3 and STATES has 4 items, (3+1) % 4 = 0. This creates the repeating cycle without needing explicit bounds checking.' },
                { question: 'Why should interrupt handlers be kept short?', options: ['To save battery power', 'Because they run with higher priority and block other interrupts', 'Because MicroPython has a line limit', 'To reduce code size'], explanation: 'Interrupt handlers run at high priority and can block other interrupts. Long handlers cause missed interrupts, timing problems, and unpredictable behavior. Best practice: set a flag and return. Let the main loop handle the complex logic.' },
                { question: 'What is the purpose of logging state transitions?', options: ['To make the code longer', 'To verify timing and correct sequencing without a hardware debugger', 'To store data permanently', 'To communicate with other devices'], explanation: 'Logging transitions with timestamps (e.g., "[1234] RED -> RED+YEL") lets you verify that each state lasts the correct duration and transitions happen in the right order. This is the primary debugging technique for embedded state machines.' },
                { question: 'How would you add a second traffic light for a cross street?', options: ['Duplicate all the code', 'Add more LED pins and extend each state dictionary to include their values', 'Use a second Pico', 'It is not possible with one microcontroller'], explanation: 'Add more pins for the second light and extend each state dictionary: {"r1": 1, "y1": 0, "g1": 0, "r2": 0, "y2": 0, "g2": 1, "dur": 5000}. The loop logic stays the same -- it applies whatever the state dictionary defines. This is the power of data-driven design.' },
                { question: 'What happens if the traffic light shows GREEN in both directions simultaneously?', options: ['It is a valid state', 'It is an impossible/dangerous state that a well-designed state machine prevents', 'The LEDs burn out', 'The controller resets'], explanation: 'Green in both directions is a dangerous, invalid state. A properly designed state machine defines only valid states. Since the state list does not include a "both GREEN" entry, the system can never enter that configuration. This is the fundamental safety guarantee of state machines.' }
            ]
        });
        quiz.start();
    </script>
