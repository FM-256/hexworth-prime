    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 7: Motion Detection (PIR)',
            description: 'Test your understanding of PIR sensors, hardware interrupts, event-driven programming, and cooldown timers.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-07-quiz', moduleId: 'pv-mp-07-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What does a PIR sensor detect?', options: ['Visible light changes', 'Changes in infrared radiation (heat signatures)', 'Sound waves', 'Magnetic fields'], explanation: 'PIR (Passive Infrared) sensors detect changes in infrared radiation. When a warm body (person, animal) moves through the detection zone, the infrared pattern changes and the sensor outputs a HIGH signal.' },
                { question: 'What is the output of the HC-SR501 PIR sensor?', options: ['Analog voltage proportional to distance', 'Digital HIGH when motion detected, LOW when idle', 'PWM signal with variable duty cycle', 'I2C data packets'], explanation: 'The HC-SR501 outputs a simple digital signal: HIGH (3.3V) when motion is detected, LOW (0V) when idle. This makes it easy to read with a single GPIO pin configured as input.' },
                { question: 'What is the fundamental difference between polling and interrupts?', options: ['Polling is faster than interrupts', 'Polling checks continuously in a loop; interrupts notify instantly when an event occurs', 'Interrupts only work with analog signals', 'Polling uses less power than interrupts'], explanation: 'Polling wastes CPU cycles checking a pin value repeatedly in a loop. Interrupts register a callback function that the hardware triggers instantly when the pin state changes -- zero CPU waste, zero missed events.' },
                { question: 'Which trigger mode fires when a signal goes from LOW to HIGH?', options: ['Pin.IRQ_FALLING', 'Pin.IRQ_RISING', 'Pin.IRQ_BOTH', 'Pin.IRQ_LEVEL'], explanation: 'IRQ_RISING fires on a LOW-to-HIGH transition (rising edge). This is the correct trigger for PIR motion detection because the sensor output goes HIGH when motion starts.' },
                { question: 'Why must interrupt handlers be kept short and fast?', options: ['To save battery power', 'Because they run with higher priority and block other interrupts', 'Because MicroPython limits handler code length', 'To reduce flash storage usage'], explanation: 'Interrupt handlers run at high priority and can block other interrupts. Long handlers cause missed interrupts, timing problems, and unpredictable behavior. Best practice: set a flag and return immediately.' },
                { question: 'What is the flag pattern in interrupt-driven programming?', options: ['Using colored LEDs to signal states', 'The handler sets a global boolean; the main loop reads and clears it', 'Sending flags over serial communication', 'A hardware feature of the RP2040'], explanation: 'The flag pattern separates detection from response. The interrupt handler sets a boolean flag to True (fast). The main loop checks the flag, clears it, and performs the response (LED, buzzer, logging) at its own pace.' },
                { question: 'What is the purpose of a cooldown timer?', options: ['To warm up the PIR sensor', 'To prevent rapid re-triggering from a single motion event', 'To save power between detections', 'To calibrate the sensor'], explanation: 'PIR sensors can re-trigger rapidly as a person moves through the detection zone. A cooldown timer ensures only one detection event is registered per physical motion, preventing dozens of duplicate alerts.' },
                { question: 'How long does the HC-SR501 need to warm up after power-on?', options: ['No warm-up needed', '1-2 seconds', '30-60 seconds', '5-10 minutes'], explanation: 'PIR sensors need 30-60 seconds after power-on to stabilize their baseline infrared readings. During warm-up, they produce false triggers. Always add a startup delay before arming the detection system.' },
                { question: 'How do you disable an interrupt on a pin?', options: ['pin.irq(enabled=False)', 'pin.irq(handler=None)', 'pin.disable_irq()', 'del pin.irq'], explanation: 'Passing handler=None to pin.irq() disables the interrupt. The pin still exists but no callback fires when the state changes. To re-enable, call pin.irq() again with a handler function.' },
                { question: 'What does Pin.IRQ_FALLING detect?', options: ['Rising edge (LOW to HIGH)', 'Falling edge (HIGH to LOW)', 'Both edges', 'Constant LOW level'], explanation: 'IRQ_FALLING fires when the signal transitions from HIGH to LOW (falling edge). For PIR sensors, this would detect the end of a motion event -- when the sensor output returns to LOW.' },
                { question: 'Which function correctly calculates elapsed time despite counter wraparound?', options: ['end_time - start_time', 'time.ticks_diff(end_time, start_time)', 'time.elapsed(start_time)', 'abs(end_time - start_time)'], explanation: 'ticks_diff() handles the case where the millisecond counter wraps around (after about 24 days). Simple subtraction gives wrong results at wraparound. ticks_diff() always returns the true elapsed time.' },
                { question: 'What adjustment on the HC-SR501 controls detection range?', options: ['The time delay potentiometer', 'The sensitivity potentiometer', 'The jumper selector', 'The VCC voltage level'], explanation: 'The sensitivity potentiometer adjusts the detection range from approximately 3 meters to 7 meters. Turn clockwise for longer range. A separate potentiometer controls how long the output stays HIGH after detection.' },
                { question: 'Why should you never use print() inside an interrupt handler?', options: ['print() does not work in MicroPython', 'print() allocates memory and takes unpredictable time, which can crash the handler', 'print() is too slow for the serial port', 'print() requires an import statement'], explanation: 'print() allocates memory for string formatting and blocks while writing to the serial buffer. In an interrupt context, memory allocation can trigger garbage collection, and blocking operations can cause missed interrupts or system crashes.' },
                { question: 'What does the retriggering mode jumper on the HC-SR501 control?', options: ['Whether the sensor uses 3.3V or 5V', 'Whether the output stays HIGH while motion continues (repeating) or pulses once (single)', 'The detection angle', 'The warm-up time'], explanation: 'The jumper selects between single trigger (one HIGH pulse per detection, then must reset) and repeating trigger (output stays HIGH as long as motion continues). Repeating mode is preferred for alarm systems.' },
                { question: 'How would you combine IRQ_RISING and IRQ_FALLING to detect both edges?', options: ['pin.irq(trigger=Pin.IRQ_RISING + Pin.IRQ_FALLING)', 'pin.irq(trigger=Pin.IRQ_RISING | Pin.IRQ_FALLING)', 'pin.irq(trigger=Pin.IRQ_BOTH)', 'pin.irq(trigger="both")'], explanation: 'Use the bitwise OR operator (|) to combine trigger modes: Pin.IRQ_RISING | Pin.IRQ_FALLING. This fires the handler on both LOW-to-HIGH and HIGH-to-LOW transitions.' }
            ]
        });
        quiz.start();
    </script>
