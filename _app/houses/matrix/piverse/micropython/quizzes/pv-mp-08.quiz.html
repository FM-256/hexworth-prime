    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 8: Temperature & ADC',
            description: 'Test your understanding of analog-to-digital conversion, temperature measurement, noise filtering, and calibration.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-08-quiz', moduleId: 'pv-mp-08-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'Which ADC channel connects to the RP2040 internal temperature sensor?', options: ['ADC channel 0 (GP26)', 'ADC channel 2 (GP28)', 'ADC channel 3 (VSYS)', 'ADC channel 4'], explanation: 'The RP2040 internal temperature sensor is connected to ADC channel 4. Channels 0-2 are external pins (GP26-GP28). Channel 3 monitors the VSYS supply voltage.' },
                { question: 'What does read_u16() return?', options: ['A voltage in volts', 'A temperature in Celsius', 'An unsigned 16-bit integer (0-65535)', 'A signed 12-bit integer (-2048 to 2047)'], explanation: 'read_u16() returns an unsigned 16-bit integer in the range 0-65535. MicroPython scales the hardware 12-bit ADC value (0-4095) to 16 bits for cross-platform consistency.' },
                { question: 'How do you convert a raw ADC value to voltage?', options: ['raw / 3.3', 'raw * 3.3 / 65535', 'raw * 65535 / 3.3', '3.3 / raw'], explanation: 'The ADC maps 0V to 0 and 3.3V (reference voltage) to 65535. So voltage = raw * 3.3 / 65535. A raw value of 32768 corresponds to approximately 1.65V (half of 3.3V).' },
                { question: 'What is the RP2040 temperature formula from the datasheet?', options: ['Temp = voltage * 100', 'Temp = 27 - (V - 0.706) / 0.001721', 'Temp = (V - 0.5) * 100', 'Temp = V * 27 / 0.706'], explanation: 'The RP2040 datasheet specifies: Temperature = 27 - (V - 0.706) / 0.001721, where 0.706V is the sensor voltage at 27C and the slope is -1.721 mV per degree Celsius.' },
                { question: 'Why does the internal temperature sensor read higher than room temperature?', options: ['The sensor is broken', 'The RP2040 chip generates heat during operation', 'The ADC has a positive bias', 'MicroPython adds an offset'], explanation: 'The sensor measures the RP2040 die temperature, not ambient air. The chip generates heat during operation (voltage regulators, clock circuits), so it reads several degrees above room temperature. This is normal and expected.' },
                { question: 'What causes ADC noise?', options: ['Only quantization error', 'Electrical noise, thermal noise, quantization error, and digital switching noise', 'Incorrect wiring only', 'Using the wrong pin'], explanation: 'ADC noise comes from multiple sources: electrical noise on the power supply, thermal noise in the ADC circuitry, quantization error (limited bit resolution), and digital switching noise from the CPU and peripherals.' },
                { question: 'What is the purpose of oversampling?', options: ['To increase the ADC resolution', 'To take multiple readings and average them, reducing random noise', 'To speed up the conversion', 'To change the reference voltage'], explanation: 'Oversampling takes multiple rapid readings and averages them. Random noise tends to cancel out when averaged, producing a smoother, more stable result. More samples = less noise, but slower update rate.' },
                { question: 'How many samples are typically a good balance for temperature reading?', options: ['1 (raw reading is fine)', '4', '16', '1024'], explanation: '16 samples provides a good balance for temperature: fast enough to read every second, smooth enough to eliminate jitter. Doubling samples halves the noise (in theory). For slowly changing signals, 64 or 128 can work well.' },
                { question: 'What is a moving average filter?', options: ['A filter that moves data between files', 'A rolling window of recent readings whose average tracks the trend', 'A hardware filter on the ADC input', 'An algorithm that removes outliers'], explanation: 'A moving average keeps a fixed-size buffer of recent readings. Each new reading replaces the oldest. The average of the buffer tracks the underlying trend while smoothing out noise. Memory usage is fixed (one buffer).' },
                { question: 'What data structure implements a moving average efficiently?', options: ['A linked list', 'A ring buffer (circular buffer)', 'A dictionary', 'A binary tree'], explanation: 'A ring buffer uses a fixed-size array with a write index that wraps around. When full, new values overwrite the oldest. Memory is fixed regardless of runtime. This is the standard approach for embedded systems with limited RAM.' },
                { question: 'What is single-point calibration?', options: ['Measuring at one known temperature and calculating an offset', 'Using a single ADC reading without averaging', 'Calibrating with one potentiometer', 'Reading one ADC channel'], explanation: 'Single-point calibration measures at one known temperature (e.g., a reliable thermometer reads 25C, your sensor reads 28C). The offset is -3C, applied to all future readings. This corrects bias but not slope error.' },
                { question: 'What is hysteresis in threshold alerting?', options: ['A type of sensor noise', 'Preventing repeated alerts when the value hovers near the threshold', 'A calibration technique', 'The delay between ADC readings'], explanation: 'Hysteresis prevents the alert from toggling on/off rapidly when the temperature hovers near the threshold. An alert_active flag ensures the alert fires once and stays active until the temperature moves back into the normal range.' },
                { question: 'How many external ADC inputs does the Pico have?', options: ['1 (GP26 only)', '3 (GP26, GP27, GP28)', '5 (GP26-GP30)', '8'], explanation: 'The Pico has three external ADC inputs: GP26 (ADC0), GP27 (ADC1), and GP28 (ADC2). Channel 3 monitors VSYS. Channel 4 is the internal temperature sensor. All share the same 12-bit SAR ADC.' },
                { question: 'What happens if you use only one ADC reading without filtering?', options: ['The reading is perfectly accurate', 'The reading fluctuates by dozens of counts due to noise, causing temperature jitter', 'The ADC breaks', 'The reading is always zero'], explanation: 'A single ADC reading includes random noise. Consecutive reads of the same signal can differ by 40-80 counts, translating to ~0.4C temperature jitter. Filtering (oversampling + moving average) is essential for stable readings.' },
                { question: 'Why does the RP2040 temperature formula subtract from 27?', options: ['27 is the maximum temperature', 'The sensor voltage decreases as temperature increases, and 27C is the reference point', '27 is the ADC channel number', 'The formula was written for Fahrenheit and converted incorrectly'], explanation: 'The sensor voltage has a negative temperature coefficient: voltage decreases as temperature increases. At 27C, the voltage is 0.706V. The formula calculates how far the current voltage is from 0.706V and converts that difference to degrees above or below 27C.' }
            ]
        });
        quiz.start();
    </script>
