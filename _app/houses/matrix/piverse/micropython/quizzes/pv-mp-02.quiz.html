<body>
    <header class="page-header"><a href="../../../index.html">&larr; Back to PiVerse Hub</a><span class="brand"><img src="/assets/images/icons/icon-brain.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"> Hexworth Prime</span></header>
    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Chapter 2: MicroPython & Thonny',
            description: 'Test your understanding of MicroPython firmware, the REPL, Thonny IDE, first programs, and file management on the Pico.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-02-quiz', moduleId: 'pv-mp-02-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is MicroPython?', options: ['A compiler that converts Python to C', 'A lean Python 3 implementation designed for microcontrollers', 'A graphical programming environment', 'A Linux distribution for Raspberry Pi'], explanation: 'MicroPython is a complete reimplementation of Python 3 designed to run on microcontrollers with as little as 256 KB of flash and 16 KB of RAM. It includes core Python syntax plus hardware-specific modules for GPIO, I2C, SPI, PWM, and other peripherals.' },
                { question: 'What file format is used for MicroPython firmware on the Pico?', options: ['.hex', '.bin', '.uf2', '.elf'], explanation: 'MicroPython firmware for the Pico uses the .uf2 (USB Flashing Format) file format. UF2 was designed by Microsoft for safe, simple firmware deployment via USB mass storage. You drag the .uf2 file to the RPI-RP2 drive.' },
                { question: 'What does REPL stand for?', options: ['Remote Execution Protocol Layer', 'Read-Eval-Print Loop', 'Rapid Electronic Programming Language', 'Runtime Environment for Python Libraries'], explanation: 'REPL stands for Read-Eval-Print Loop. It reads your input, evaluates (executes) it, prints the result, and loops back for more input. The REPL runs directly on the Pico and is accessed via USB serial.' },
                { question: 'Which keyboard shortcut performs a soft reset in the MicroPython REPL?', options: ['Ctrl+C', 'Ctrl+D', 'Ctrl+Z', 'Ctrl+R'], explanation: 'Ctrl+D performs a soft reset, restarting the MicroPython interpreter without power cycling the board. Ctrl+C interrupts a running program. Both are essential REPL shortcuts.' },
                { question: 'What special file runs automatically when the Pico boots?', options: ['boot.py only', 'main.py only', 'boot.py first, then main.py', 'autorun.py'], explanation: 'On boot, the Pico runs boot.py first (for low-level setup), then main.py (your main program). Most users only use main.py. Both are optional -- if they do not exist, the Pico boots to the REPL.' },
                { question: 'How do you save a file to the Pico in Thonny?', options: ['File > Export > Pico', 'File > Save As > choose Raspberry Pi Pico', 'Drag and drop to BOOTSEL drive', 'Copy to /dev/ttyACM0'], explanation: 'In Thonny, use File > Save As, then select "Raspberry Pi Pico" as the destination. This saves the file to the Pico internal filesystem over the serial connection. Saving to BOOTSEL drive only works for .uf2 firmware files.' },
                { question: 'What does machine.freq() return on a default MicroPython Pico?', options: ['133000000', '125000000', '48000000', '16000000'], explanation: 'machine.freq() returns 125000000 (125 MHz) on a default MicroPython Pico. The RP2040 can run at up to 133 MHz, but MicroPython defaults to 125 MHz for stability.' },
                { question: 'What does sys.platform return on the Pico?', options: ['"pico"', '"rp2"', '"arm"', '"micropython"'], explanation: 'sys.platform returns "rp2" on the Pico, identifying the RP2040 platform. This can be used in code to detect whether you are running on a Pico vs another MicroPython board.' },
                { question: 'Which ADC channel reads the internal temperature sensor?', options: ['Channel 0 (GP26)', 'Channel 3 (GP29)', 'Channel 4', 'Channel 5'], explanation: 'ADC channel 4 is connected to the internal temperature sensor. It is not mapped to any GPIO pin. Create it with machine.ADC(4). The temperature formula is T = 27 - (V - 0.706) / 0.001721.' },
                { question: 'What does gc.mem_free() return?', options: ['Total flash size in bytes', 'Available SRAM in bytes', 'CPU clock speed', 'Number of free GPIO pins'], explanation: 'gc.mem_free() returns the number of bytes of free heap memory (SRAM) available. On a freshly booted Pico, this is approximately 192,000 bytes out of the 264 KB total SRAM.' },
                { question: 'What interpreter setting must be configured in Thonny for the Pico?', options: ['CPython 3.x', 'MicroPython (Raspberry Pi Pico)', 'CircuitPython', 'PyPy'], explanation: 'In Thonny, go to Tools > Options > Interpreter and select "MicroPython (Raspberry Pi Pico)". This tells Thonny to communicate with the Pico over USB serial using the MicroPython protocol.' },
                { question: 'What happens when you copy a .uf2 file to the RPI-RP2 drive?', options: ['Nothing until you click Install', 'The file is stored for later use', 'The Pico writes the firmware to flash and automatically reboots', 'The file replaces main.py'], explanation: 'When you copy a .uf2 file to the RPI-RP2 drive, the RP2040 ROM bootloader writes the firmware to flash memory. The Pico then automatically reboots and starts running the new firmware. The RPI-RP2 drive disappears.' },
                { question: 'How does MicroPython differ from CPython?', options: ['MicroPython uses different syntax', 'MicroPython runs on microcontrollers with limited RAM and no OS', 'MicroPython only supports Python 2', 'MicroPython requires a compiler'], explanation: 'MicroPython runs on microcontrollers with as little as 256 KB of flash and 16 KB of RAM. Core Python 3 syntax is identical, but MicroPython lacks most of the standard library, pip, and OS integration. It is a separate interpreter, not a subset of CPython.' },
                { question: 'What does the input() function do on the Pico?', options: ['Reads a GPIO pin value', 'Reads text typed in the serial console', 'Scans for I2C devices', 'Reads ADC voltage'], explanation: 'input() reads text typed by the user in the serial console (Thonny Shell or any serial terminal). It only works when the Pico is connected to a computer via USB. Standalone projects cannot use input().' },
                { question: 'What command lists files on the Pico filesystem?', options: ['ls()', 'dir()', 'os.listdir()', 'machine.list()'], explanation: 'os.listdir() lists files and directories on the Pico internal filesystem. You must import os first. Other useful commands: os.stat() for file info, os.remove() to delete, os.mkdir() to create directories.' }
            ]
        });
        quiz.start();
    </script>
