    <main class="quiz-wrapper"><div id="quiz-container"></div></main>
    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 9: Data Logging',
            description: 'Test your understanding of file I/O, CSV format, timestamps, storage management, and robust logging on the Pico.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-09-quiz', moduleId: 'pv-mp-09-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'How much flash storage is available on the Pico after MicroPython firmware?', options: ['128 KB', '512 KB', 'Approximately 1.4 MB', '16 MB'], explanation: 'The Pico has 2 MB of flash total. MicroPython firmware uses approximately 600 KB, leaving about 1.4 MB for user files. This is enough for weeks of data logging at reasonable intervals.' },
                { question: 'What file mode should you use to add data to an existing file without overwriting?', options: ['"w" (write)', '"r" (read)', '"a" (append)', '"x" (exclusive)'], explanation: 'Append mode ("a") opens the file and positions the write cursor at the end. New data is added after existing content. Write mode ("w") would erase the entire file first.' },
                { question: 'Why should you use "with" blocks for file operations?', options: ['They make the code run faster', 'They automatically close the file, even if an error occurs', 'They encrypt the data', 'They compress the file'], explanation: 'The "with" statement creates a context manager that automatically calls close() when the block exits, even if an exception occurs. Unclosed files can corrupt data, especially on power loss.' },
                { question: 'What is CSV format?', options: ['A binary data format', 'Comma-Separated Values: plain text with fields separated by commas, one record per line', 'A compressed archive format', 'A database format'], explanation: 'CSV (Comma-Separated Values) is a plain text format where each line is a record and fields within a record are separated by commas. The first line is typically a header naming the columns. Universal compatibility with spreadsheets and data tools.' },
                { question: 'Why does the Pico use elapsed seconds instead of real timestamps?', options: ['MicroPython does not support time functions', 'The Pico has no battery-backed real-time clock (RTC)', 'Elapsed time is more accurate', 'CSV files cannot store dates'], explanation: 'The Pico does not have a battery-backed RTC. When power is removed and restored, it starts counting from zero. Without WiFi (for NTP sync) or an external RTC module, elapsed seconds from boot is the best available timestamp.' },
                { question: 'Why should you open, write one line, and close for each log entry?', options: ['It is the fastest approach', 'If power is lost while the file is open, buffered data is lost and the file may corrupt', 'MicroPython requires it', 'To save memory'], explanation: 'Flash writes are buffered. If the Pico loses power while a file is open, all buffered writes are lost and the filesystem can be corrupted. Opening with append, writing one line, and closing ensures each entry is safely flushed to flash.' },
                { question: 'How do you check remaining filesystem space?', options: ['os.disk_free()', 'os.statvfs("/")', 'os.space("/")', 'os.df()'], explanation: 'os.statvfs("/") returns filesystem statistics including block size, total blocks, and free blocks. Multiply free blocks by block size to get free bytes. Use this to prevent writing when storage is nearly full.' },
                { question: 'What is file rotation?', options: ['Renaming files alphabetically', 'Starting a new log file when the current one exceeds a size limit', 'Rotating the filesystem', 'Moving files between directories'], explanation: 'File rotation creates a new log file (e.g., log_001.csv, log_002.csv) when the current file exceeds a maximum size. This prevents any single file from growing too large and makes it easier to manage and download data.' },
                { question: 'How many entries per day does a 10-second logging interval produce?', options: ['1,440', '8,640', '14,400', '86,400'], explanation: '86,400 seconds per day / 10 seconds per entry = 8,640 entries per day. At approximately 30 bytes per entry, that is about 250 KB per day, meaning the 1.4 MB flash can hold about 5 days of data.' },
                { question: 'What error should you catch when writing to flash?', options: ['ValueError', 'TypeError', 'OSError', 'IndexError'], explanation: 'OSError is raised when filesystem operations fail: disk full (ENOSPC), file not found (ENOENT), or flash hardware errors. Always wrap file writes in try/except OSError to handle these gracefully.' },
                { question: 'How can you transfer logged data from the Pico to a computer?', options: ['Only via WiFi', 'Via Thonny file browser, mpremote cp command, or serial dump', 'Only by removing the flash chip', 'Only via Bluetooth'], explanation: 'Multiple options: Thonny IDE has a file browser panel for drag-and-drop. mpremote cp :data.csv data.csv copies via command line. You can also write a script that reads and prints the file to serial for copy-paste.' },
                { question: 'What does os.remove("filename") do?', options: ['Renames the file', 'Moves the file to a recycle bin', 'Permanently deletes the file from flash', 'Hides the file'], explanation: 'os.remove() permanently deletes the file from the flash filesystem. There is no recycle bin or undo. Use this to clean up old log files after downloading their data.' },
                { question: 'What happens if you log every 1 second to the Pico flash?', options: ['It works indefinitely', 'The flash fills up in about 13 hours with 1.4 MB available', 'The Pico overheats', 'The ADC stops working'], explanation: 'At ~30 bytes per entry, 1-second logging produces ~2.5 MB per day. The 1.4 MB flash fills in about 13 hours. Either use longer intervals, implement file rotation with deletion, or download data regularly.' },
                { question: 'What is the purpose of the CSV header row?', options: ['To make the file larger', 'To name each column so data analysis tools can identify fields', 'To store metadata about the Pico', 'To encrypt the data'], explanation: 'The header row (e.g., "timestamp,temp_c,temp_f,raw_adc") names each column. Spreadsheets and data tools auto-detect this as column labels. Write it once when creating the file, then append only data rows.' },
                { question: 'How would you verify that logging is still running on a deployed Pico?', options: ['Check the serial console remotely', 'Toggle the onboard LED with each write -- blinking means logging is active', 'It is impossible to verify', 'Listen for a buzzer'], explanation: 'Toggling the onboard LED (led.toggle()) after each successful write provides a visual heartbeat. A blinking LED confirms the Pico is alive and writing data. A stuck LED means the program has crashed or the flash is full.' }
            ]
        });
        quiz.start();
    </script>
