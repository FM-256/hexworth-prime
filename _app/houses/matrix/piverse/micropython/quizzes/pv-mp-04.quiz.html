    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 4: PWM & Analog',
            description: 'Test your understanding of pulse width modulation, duty cycles, LED dimming, buzzer tones, ADC readings, and analog input.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-04-quiz', moduleId: 'pv-mp-04-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What does PWM stand for?', options: ['Power Width Modulation', 'Pulse Width Modulation', 'Pin Write Mode', 'Parallel Wire Multiplexing'], explanation: 'PWM stands for Pulse Width Modulation. It rapidly switches a digital pin between HIGH and LOW. The ratio of on-time to total period (duty cycle) determines the perceived brightness, speed, or power delivered.' },
                { question: 'What does a 50% duty cycle mean?', options: ['The pin is at 1.65V', 'The pin is HIGH 50% of the time and LOW 50% of the time', 'The frequency is halved', 'The pin outputs 50 mA'], explanation: 'A 50% duty cycle means the pin is HIGH for half the period and LOW for the other half. The pin still switches between 0V and 3.3V -- it does not produce a true analog voltage. Devices like LEDs respond to the average power.' },
                { question: 'What value does duty_u16(0) represent?', options: ['0% duty cycle (always off)', '50% duty cycle', '100% duty cycle', 'Default duty cycle'], explanation: 'duty_u16(0) sets 0% duty cycle -- the pin stays LOW at all times. The LED is completely off, the motor is stopped. The range is 0 (0%) to 65535 (100%).' },
                { question: 'What value does duty_u16(65535) represent?', options: ['0% duty cycle', '50% duty cycle', '100% duty cycle (always on)', '64 Hz frequency'], explanation: 'duty_u16(65535) sets 100% duty cycle -- the pin stays HIGH at all times. This is equivalent to a simple digital HIGH. The LED is at full brightness.' },
                { question: 'What frequency is typical for LED dimming with PWM?', options: ['50 Hz', '440 Hz', '1000 Hz', '44100 Hz'], explanation: '1000 Hz (1 kHz) is typical for LED dimming. At this frequency, the switching is too fast for the human eye to see, so the LED appears to glow at reduced brightness rather than flicker.' },
                { question: 'How does a passive buzzer produce sound?', options: ['It has a built-in oscillator', 'The PWM frequency vibrates a piezo element at the desired pitch', 'It converts digital signals to analog audio', 'Sound comes from the GPIO pin itself'], explanation: 'A passive buzzer has a piezo element that vibrates at the frequency of the PWM signal. Set freq(440) for an A4 note, freq(262) for middle C. The duty cycle affects volume (50% is loudest). An active buzzer has a built-in oscillator and just needs power.' },
                { question: 'What frequency produces the musical note A4?', options: ['220 Hz', '440 Hz', '880 Hz', '1000 Hz'], explanation: '440 Hz is the standard tuning frequency for the note A4 (A above middle C). This is the universal tuning reference -- orchestras tune to A4=440Hz. Each octave up doubles the frequency.' },
                { question: 'How many PWM slices does the RP2040 have?', options: ['4', '8', '16', '30'], explanation: 'The RP2040 has 8 PWM slices. Each slice has 2 channels (A and B), giving 16 total PWM outputs. Both channels in a slice share the same frequency but can have independent duty cycles.' },
                { question: 'What does pwm.deinit() do?', options: ['Pauses the PWM signal temporarily', 'Releases the PWM hardware so the pin can be used for other purposes', 'Resets the duty cycle to 0', 'Increases the frequency'], explanation: 'deinit() releases the PWM hardware resource. The pin can then be used for digital I/O or other functions. MicroPython does not automatically release hardware resources when variables go out of scope.' },
                { question: 'What does ADC.read_u16() return?', options: ['A voltage in volts', 'A 12-bit value (0-4095)', 'A 16-bit scaled value (0-65535)', 'Temperature in Celsius'], explanation: 'read_u16() returns a 16-bit unsigned integer (0-65535). The RP2040 hardware ADC is actually 12-bit (0-4095), but MicroPython scales the reading to 16-bit for cross-platform compatibility.' },
                { question: 'How do you convert an ADC reading to voltage?', options: ['Multiply by 3.3', 'Divide by 3.3', 'Multiply by 3.3 / 65535', 'Divide by 4096'], explanation: 'voltage = raw * 3.3 / 65535. The ADC range (0-65535) maps to the voltage range (0-3.3V). So a reading of 32768 = approximately 1.65V (half of 3.3V).' },
                { question: 'How many external ADC pins does the Pico have on its header?', options: ['1', '3', '4', '8'], explanation: 'Three external ADC pins are on the header: GP26 (ADC0), GP27 (ADC1), GP28 (ADC2). ADC3 (GP29) reads VSYS/3 internally. ADC4 is the internal temperature sensor. Only 3 are available for external circuits.' },
                { question: 'Why should you average multiple ADC readings?', options: ['To increase the bit resolution', 'To reduce noise and get a more stable value', 'To speed up the conversion', 'To enable multiple channels'], explanation: 'Raw ADC readings fluctuate due to electrical noise. Averaging 10-20 samples smooths out the noise and gives a more stable, reliable value. The RP2040 ADC samples at up to 500 ksps, so 20 samples takes only microseconds.' },
                { question: 'What PWM frequency is required for servo motor control?', options: ['50 Hz', '440 Hz', '1000 Hz', '20000 Hz'], explanation: 'Standard hobby servos require a 50 Hz PWM signal. The pulse width determines the angle: 1 ms = 0 degrees, 1.5 ms = 90 degrees, 2 ms = 180 degrees. The 50 Hz frequency gives a 20 ms period.' },
                { question: 'How do you wire a potentiometer to the Pico for ADC reading?', options: ['Connect both ends to GPIO pins', 'Left to 3.3V, right to GND, wiper (middle) to ADC pin', 'Connect all three pins to ADC', 'Left to 5V, right to GND, wiper to GP0'], explanation: 'A potentiometer has three pins: connect left to 3.3V, right to GND, and the middle pin (wiper) to an ADC pin like GP26. Turning the knob sweeps the wiper between 0V and 3.3V. Never use 5V -- the Pico ADC is 3.3V only.' }
            ]
        });
        quiz.start();
