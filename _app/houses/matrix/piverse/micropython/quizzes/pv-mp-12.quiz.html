    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container', title: 'Chapter 12: Bluetooth BLE',
            description: 'Test your understanding of BLE architecture, GATT services, advertising, characteristics, notifications, and mobile connectivity.',
            passingScore: 80, showFeedback: true, randomize: true, theme: 'matrix',
            achievement: 'pv-mp-12-quiz', moduleId: 'pv-mp-12-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,
            questions: [
                { question: 'What is the key difference between BLE and Bluetooth Classic?', options: ['BLE has longer range', 'BLE is designed for short, intermittent data bursts with very low power consumption', 'BLE supports audio streaming', 'BLE uses higher bandwidth'], explanation: 'BLE (Bluetooth Low Energy) is optimized for short data exchanges (sensor readings, notifications) with minimal power. Classic Bluetooth is designed for continuous streaming (audio, files) with higher power consumption.' },
                { question: 'What does GATT stand for?', options: ['General Attribute Transfer Technology', 'Generic Attribute Profile', 'Global Access Transmission Table', 'Graph-based Attribute Tree'], explanation: 'GATT (Generic Attribute Profile) defines how BLE devices structure and exchange data. It organizes data into a hierarchy of profiles, services, and characteristics that clients can discover and interact with.' },
                { question: 'In GATT, what is a "service"?', options: ['A background process on the Pico', 'A group of related data attributes (characteristics)', 'A WiFi connection type', 'A firmware update mechanism'], explanation: 'A GATT service is a collection of related characteristics. For example, the Environmental Sensing service (UUID 0x181A) might contain Temperature, Humidity, and Pressure characteristics. Services group logically related data.' },
                { question: 'What is a GATT "characteristic"?', options: ['A physical property of the antenna', 'A single data value with a UUID and read/write/notify flags', 'A configuration setting', 'A connection parameter'], explanation: 'A characteristic is a single data point within a service. It has a UUID (identifier), a value (the actual data), and permission flags (readable, writable, notifiable). Example: Temperature characteristic with value 2630 (26.30 C).' },
                { question: 'What does gap_advertise() do?', options: ['Displays an advertisement on screen', 'Broadcasts the Pico name and capabilities so nearby BLE scanners can find it', 'Connects to a BLE device', 'Sends data to all nearby devices'], explanation: 'gap_advertise() starts broadcasting advertising packets at a specified interval. These packets contain the device name and service UUIDs. BLE scanners (phones, tablets) detect these packets and display the device in their scan list.' },
                { question: 'What unit is the advertising interval specified in?', options: ['Milliseconds', 'Microseconds', 'Seconds', 'Hertz'], explanation: 'The advertising interval is specified in microseconds. gap_advertise(100000) broadcasts every 100,000 microseconds (100 ms). Lower intervals mean faster discovery but higher power consumption.' },
                { question: 'What does bluetooth.FLAG_NOTIFY indicate on a characteristic?', options: ['The characteristic can be deleted', 'The server can push value updates to connected clients without them requesting it', 'The characteristic is encrypted', 'The characteristic auto-increments'], explanation: 'FLAG_NOTIFY means the server (Pico) can send value updates to the client (phone) proactively. The client subscribes to notifications and receives new values whenever the server calls gatts_notify(). No polling needed.' },
                { question: 'What is the difference between "read" and "notify"?', options: ['They are the same thing', 'Read is client-initiated (pull); notify is server-initiated (push)', 'Read is for text; notify is for numbers', 'Read is faster than notify'], explanation: 'Read is a pull operation: the client asks for the current value. Notify is a push operation: the server sends the value whenever it changes. Notify is more efficient for frequently updating data like sensor readings.' },
                { question: 'What happens when a BLE client disconnects from the Pico?', options: ['The Pico automatically resumes advertising', 'The Pico stops advertising and must be manually restarted', 'The Pico reboots', 'Nothing -- other clients can still connect'], explanation: 'When a client disconnects, the Pico stops advertising by default. You must call gap_advertise() again in the disconnect event handler to make it discoverable to new clients. Without this, it disappears from BLE scans.' },
                { question: 'What mobile app is recommended for testing BLE devices?', options: ['Bluetooth Settings (built-in)', 'nRF Connect (from Nordic Semiconductor)', 'WiFi Analyzer', 'Serial Bluetooth Terminal'], explanation: 'nRF Connect (free, Android/iOS) is the standard BLE development tool. It scans for devices, connects, browses GATT services, reads/writes characteristics, and subscribes to notifications. Essential for BLE development.' },
                { question: 'What is a UUID in BLE?', options: ['A Universal Unique Identifier that identifies services and characteristics', 'A network address', 'A security key', 'A firmware version number'], explanation: 'UUIDs (Universally Unique Identifiers) identify specific services and characteristics. Standard 16-bit UUIDs (0x181A, 0x2A6E) are defined by the Bluetooth SIG. Custom 128-bit UUIDs are used for proprietary data.' },
                { question: 'When should you use custom 128-bit UUIDs instead of standard 16-bit ones?', options: ['Always -- custom is better', 'When your data does not match any standard Bluetooth SIG profile', 'Only for encrypted data', 'Never -- always use standard UUIDs'], explanation: 'Use standard 16-bit UUIDs when your data matches a defined profile (temperature, heart rate, battery). Use custom 128-bit UUIDs for proprietary data that has no standard representation. Phone apps use UUIDs to identify data types.' },
                { question: 'How does the Pico W encode a temperature of 26.3 C for BLE?', options: ['As the string "26.3"', 'As a 2-byte integer value of 2630 (temperature * 100) in little-endian format', 'As a floating-point number', 'As a single byte (26)'], explanation: 'BLE transmits raw bytes. The standard convention is to multiply temperature by 100 and send as a 16-bit integer: 26.3 * 100 = 2630. Sent as 2 bytes in little-endian: 0x46, 0x0A. The client reverses the conversion.' },
                { question: 'What does gatts_write() do?', options: ['Writes data to the flash filesystem', 'Updates the value of a GATT characteristic on the server', 'Sends data over WiFi', 'Writes to the serial console'], explanation: 'gatts_write(handle, data) updates the value stored in a specific GATT characteristic. Connected clients reading that characteristic will get the new value. Use gatts_notify() after updating to push the change to subscribed clients.' },
                { question: 'What BLE event number represents a client connecting?', options: ['Event 0 (_IRQ_SCAN_RESULT)', 'Event 1 (_IRQ_CENTRAL_CONNECT)', 'Event 2 (_IRQ_CENTRAL_DISCONNECT)', 'Event 3 (_IRQ_GATTS_WRITE)'], explanation: 'Event 1 (_IRQ_CENTRAL_CONNECT) fires when a client (central device, like a phone) establishes a connection. Event 2 fires on disconnect. Event 3 fires when the client writes to a characteristic. Handle these in the ble_irq callback.' }
            ]
        });
        quiz.start();
    </script>
