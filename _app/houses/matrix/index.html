                    .matrix-course-card {

                        position: relative;
                        overflow: hidden;
                        font-family: 'Courier New', 'Consolas', monospace;

                        transform: translateY(-2px);

                        content: '';

                    }

                        display: inline-block;

                        border: 1px solid rgba(0, 255, 65, 0.3);

                    }
