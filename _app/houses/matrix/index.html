                        padding: 50px 30px;

                        font-family: 'Courier New', 'Consolas', monospace;
                    }

                    .matrix-prestige::before {
                        content: '';

                        letter-spacing: 0.15em;
                        text-transform: uppercase;
                        margin-bottom: 15px;
                        text-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
