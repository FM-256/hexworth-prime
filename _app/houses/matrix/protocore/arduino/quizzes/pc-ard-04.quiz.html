    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 4: Serial Communication',
            description: 'Test your mastery of UART, Serial.begin(), print/println, receiving data, parsing, binary vs ASCII, multi-serial, data logging, and debugging.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-04-quiz',
            moduleId: 'pc-ard-04-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does UART stand for?',
                    options: [
                        'Universal Asynchronous Receiver-Transmitter',
                        'Unified Analog Read Transfer',
                        'Universal Automated Runtime Translator',
                        'Unsigned Arithmetic Register Type'
                    ],
                    explanation: 'UART stands for Universal Asynchronous Receiver-Transmitter. It is a hardware communication protocol that uses two wires -- TX (transmit) and RX (receive) -- to send data one bit at a time. The "asynchronous" part means there is no shared clock signal between the two devices. Instead, both sides must agree on the same baud rate (bits per second) beforehand. Each byte is framed with a start bit, 8 data bits, and a stop bit, giving the receiver a way to synchronize with each incoming byte. UART is one of the oldest and simplest serial protocols, dating back to the 1960s, and remains ubiquitous in embedded systems today.'
                },
                {
                    question: 'What does Serial.begin(9600) do?',
                    options: [
                        'Initializes the UART hardware at 9600 bits per second',
                        'Opens a Wi-Fi connection at 9.6 GHz',
                        'Creates 9600 bytes of buffer memory',
                        'Sets the CPU clock to 9600 Hz'
                    ],
                    explanation: 'Serial.begin(9600) initializes the ATmega328P UART hardware to communicate at 9600 bits per second (baud). It configures the TX (pin 1) and RX (pin 0) pin registers, sets the baud rate divider in the UART control registers, and enables the transmit and receive circuitry. This function must be called once in setup() before any Serial.print() or Serial.read() calls. The baud rate determines how fast bits are sent -- at 9600 baud, each bit lasts approximately 104 microseconds, giving a throughput of roughly 960 characters per second (each character requires 10 bits: 1 start + 8 data + 1 stop).'
                },
                {
                    question: 'What is the difference between Serial.print() and Serial.println()?',
                    options: [
                        'println() adds a newline character after the output; print() does not',
                        'print() is faster than println()',
                        'println() can only print strings; print() can print numbers too',
                        'print() sends binary data; println() sends ASCII text'
                    ],
                    explanation: 'Serial.println() sends the data followed by a carriage return (\\r, ASCII 13) and a line feed (\\n, ASCII 10), which moves the cursor to the beginning of the next line in the Serial Monitor. Serial.print() sends only the data with no trailing newline -- the next print output appears on the same line. Both functions can print strings, integers, floats, and characters. The common pattern is to use print() for labels and inline values, then println() for the final value on a line: Serial.print("Temp: "); Serial.println(temp); This produces "Temp: 23.5" followed by a newline.'
                },
                {
                    question: 'What happens if the Arduino uses Serial.begin(9600) but the Serial Monitor is set to 115200?',
                    options: [
                        'Garbled characters or no output appears',
                        'The data transfers at the faster speed automatically',
                        'The Arduino resets to match the monitor speed',
                        'An error message appears in the IDE'
                    ],
                    explanation: 'When baud rates do not match, the receiver interprets the incoming bits at the wrong speed, producing garbled characters (random-looking symbols or empty output). This is the single most common serial debugging mistake beginners encounter. At 9600 baud, each bit lasts 104 microseconds. At 115200 baud, each bit lasts only 8.7 microseconds. The receiver sampling at 115200 reads approximately 12 bits in the time the transmitter sends 1 bit, completely misinterpreting the data frame boundaries, start/stop bits, and data bits. The fix is simple: make sure both ends match. Always check the dropdown in the Serial Monitor window.'
                },
                {
                    question: 'How do you print the number 255 in hexadecimal using Serial?',
                    options: [
                        'Serial.println(255, HEX)',
                        'Serial.println(hex(255))',
                        'Serial.printHex(255)',
                        'Serial.println("0xFF")'
                    ],
                    explanation: 'Serial.println(255, HEX) prints "FF" to the Serial Monitor. The second parameter to print/println specifies the numeric base: DEC (decimal, default), HEX (hexadecimal), BIN (binary), or OCT (octal). Serial.println(255, BIN) prints "11111111". Serial.println(255, OCT) prints "377". This formatting happens on the Arduino side before transmission -- the actual bytes sent are the ASCII characters of the formatted string. Note that HEX does not include a "0x" prefix; if you want that, print it yourself: Serial.print("0x"); Serial.println(255, HEX);'
                },
                {
                    question: 'What does Serial.available() return?',
                    options: [
                        'The number of bytes waiting in the serial receive buffer',
                        'Whether the serial port is physically connected',
                        'The baud rate of the current connection',
                        'The total capacity of the serial buffer'
                    ],
                    explanation: 'Serial.available() returns the number of bytes currently stored in the serial receive buffer, waiting to be read. On the Arduino Uno, this buffer holds 64 bytes. If no data has arrived, it returns 0. This function is essential for safe serial reading -- always check Serial.available() > 0 before calling Serial.read(). If you call read() when the buffer is empty, it returns -1 instead of valid data. The buffer fills automatically via interrupt as bytes arrive on the RX pin. Your code then drains the buffer by calling read() in loop().'
                },
                {
                    question: 'What is the size of the serial receive buffer on the Arduino Uno?',
                    options: [
                        '64 bytes',
                        '256 bytes',
                        '1024 bytes',
                        '32 bytes'
                    ],
                    explanation: 'The Arduino Uno (ATmega328P) has a 64-byte serial receive buffer. This is a ring buffer managed by an interrupt service routine -- each time a byte arrives on the RX pin, the UART interrupt fires and stores the byte in the buffer. If your code does not read the buffer fast enough and it fills to 64 bytes, new incoming bytes are silently dropped with no error or warning. This is why you should avoid long delay() calls when expecting serial input. For larger buffers, you can modify the SERIAL_RX_BUFFER_SIZE constant in the Arduino core, but 64 bytes is sufficient for most applications when data is read promptly.'
                },
                {
                    question: 'What does Serial.read() return when the receive buffer is empty?',
                    options: [
                        '-1',
                        '0',
                        'NULL',
                        'An empty string'
                    ],
                    explanation: 'Serial.read() returns -1 (as an int) when no data is available in the receive buffer. This is why read() returns an int rather than a char -- the -1 sentinel value would not fit in an unsigned char. The correct pattern is: if (Serial.available() > 0) { char c = Serial.read(); }. Some programmers skip the available() check and instead check the return value: int c = Serial.read(); if (c != -1) { process((char)c); }. Both approaches work, but the available()-first pattern is more readable and the community standard.'
                },
                {
                    question: 'What C function is commonly used to split a comma-separated string on Arduino?',
                    options: [
                        'strtok()',
                        'split()',
                        'substr()',
                        'tokenize()'
                    ],
                    explanation: 'strtok() (string tokenizer) is the standard C library function used to split strings by a delimiter. First call: strtok(string, ",") returns a pointer to the first token and internally marks the position. Subsequent calls: strtok(NULL, ",") continue from where the last call stopped, returning the next token. It returns NULL when no more tokens exist. Important: strtok() modifies the original string by replacing delimiters with null terminators. It is not thread-safe and not reentrant. For Arduino, these limitations are rarely an issue since sketches are single-threaded. The String class offers indexOf() and substring() as alternatives, but they use dynamic memory allocation which can fragment the limited SRAM.'
                },
                {
                    question: 'What is the key difference between Serial.write() and Serial.print()?',
                    options: [
                        'write() sends raw bytes; print() converts to ASCII text first',
                        'write() is faster but less accurate',
                        'print() can only send strings; write() can send numbers',
                        'write() sends data in packets; print() sends one byte at a time'
                    ],
                    explanation: 'Serial.write() sends raw binary data -- the exact byte value you specify. Serial.print() converts the value to its human-readable ASCII text representation before sending. Example: Serial.write(65) sends one byte with value 0x41, which the Serial Monitor displays as "A" (ASCII character 65). Serial.print(65) sends two bytes: 0x36 and 0x35 (the ASCII codes for "6" and "5"), which the Serial Monitor displays as "65". For the number 1023, write needs 2 bytes (binary); print sends 4 bytes ("1","0","2","3"). Use write() for binary protocols and device-to-device communication. Use print() for human-readable debugging output.'
                },
                {
                    question: 'How many hardware serial ports does the Arduino Mega have?',
                    options: [
                        '4 (Serial, Serial1, Serial2, Serial3)',
                        '1 (Serial only)',
                        '2 (Serial and Serial1)',
                        '8 (Serial through Serial7)'
                    ],
                    explanation: 'The Arduino Mega 2560 has 4 hardware UART serial ports: Serial (pins 0/1, shared with USB), Serial1 (pins 18/19), Serial2 (pins 16/17), and Serial3 (pins 14/15). Each port has its own dedicated UART hardware with independent transmit and receive buffers and interrupt handlers. This means you can communicate with 3 external serial devices while simultaneously using the USB serial for debugging -- all at full speed with no CPU overhead while waiting for data. The Arduino Uno has only one hardware serial port (Serial), which is shared with the USB connection. To add more serial ports on the Uno, you must use the SoftwareSerial library.'
                },
                {
                    question: 'What is the main limitation of SoftwareSerial on the Arduino Uno?',
                    options: [
                        'Only one SoftwareSerial instance can actively listen at a time',
                        'It cannot transmit data, only receive',
                        'It requires an external crystal oscillator',
                        'It only works at 9600 baud'
                    ],
                    explanation: 'SoftwareSerial uses bit-banging -- it manually toggles pins in software to emulate UART timing, using pin-change interrupts to detect incoming data. Only one SoftwareSerial instance can be actively listening at any given time because the library uses a single interrupt handler. You switch the active listener with the listen() method. Other limitations include: maximum reliable baud rate of about 57600 (bit-banging at higher speeds introduces too much timing error), increased CPU usage (the interrupt fires for every incoming bit), and potential conflicts with other libraries that use interrupts. For projects needing multiple reliable serial ports, upgrade to an Arduino Mega with its 4 hardware UARTs.'
                },
                {
                    question: 'What function provides a millisecond timestamp on the Arduino?',
                    options: [
                        'millis()',
                        'timestamp()',
                        'clock()',
                        'time()'
                    ],
                    explanation: 'millis() returns the number of milliseconds since the Arduino board began running the current program. It is a free, always-available timestamp that requires no additional hardware or setup. The value is an unsigned long that overflows (rolls back to zero) after approximately 49.7 days of continuous operation. For data logging, millis() provides relative timestamps from boot. For absolute real-world timestamps (date and time), you need an RTC (Real Time Clock) module like the DS3231, which has a battery-backed crystal oscillator that keeps time even when the Arduino is powered off. millis() is driven by Timer0 and has a resolution of approximately 1 millisecond.'
                },
                {
                    question: 'Why should you avoid long delay() calls when expecting serial input?',
                    options: [
                        'The 64-byte receive buffer may overflow and silently drop incoming bytes',
                        'delay() disables the serial hardware completely',
                        'The baud rate changes during a delay',
                        'delay() causes the serial buffer to be cleared'
                    ],
                    explanation: 'During delay(), the processor is blocked -- it executes a tight busy-wait loop and does not process any of your code in loop(). However, the UART receive interrupt still fires and stores incoming bytes in the 64-byte buffer. If more than 64 bytes arrive during a long delay, the buffer fills up and additional bytes are silently discarded with no error message. This data loss is invisible and extremely difficult to debug. The solution is to use millis()-based non-blocking timing instead of delay(), which allows your loop() to keep running and process incoming serial data promptly. As a rule: never use delay() in any sketch that needs to receive serial data reliably.'
                },
                {
                    question: 'What is the purpose of a #define DEBUG / #ifdef DEBUG pattern in Arduino code?',
                    options: [
                        'To toggle debug serial prints on or off with a single flag, compiled out when disabled',
                        'To enable a special debugging mode in the Arduino IDE',
                        'To connect to a remote debugger over serial',
                        'To increase the serial buffer size for debugging'
                    ],
                    explanation: 'The #define DEBUG / #ifdef DEBUG pattern is a preprocessor conditional that lets you include or exclude debug code at compile time. When DEBUG is defined (#define DEBUG 1), all code inside #ifdef DEBUG ... #endif blocks is compiled into your sketch. When you comment out or remove the #define, the preprocessor strips all debug code before compilation -- it does not exist in the final binary. This means zero runtime overhead, zero flash usage, and zero RAM consumption for debug prints in production. The common pattern defines a DBG() macro: #define DBG(x) Serial.println(x) when debugging, #define DBG(x) (empty) when not. One line change toggles all debug output across your entire sketch.'
                }
            ]
        });
        quiz.start();
    </script>
