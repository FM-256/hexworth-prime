    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 11: Displays',
            description: 'Test your understanding of character LCDs, OLED displays, TFT screens, custom characters, display buffering, and multi-display configurations.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-11-quiz',
            moduleId: 'pc-ard-11-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What controller chip does a standard 16x2 character LCD use?',
                    options: [
                        'SSD1306',
                        'HD44780',
                        'ST7735',
                        'ILI9341'
                    ],
                    explanation: 'The HD44780 is the de facto standard controller for character LCDs. Developed by Hitachi, it has been used in 16x2 and 20x4 character displays for decades. The HD44780 manages a character generator ROM with 208 pre-defined characters (letters, numbers, symbols, and Japanese katakana), plus 8 user-definable custom character slots. It supports 4-bit and 8-bit parallel data interfaces. The Arduino LiquidCrystal library communicates directly with this controller. Even modern character LCD modules that use different manufacturers\' chips are "HD44780-compatible," meaning they use the same command set and timing specifications.'
                },
                {
                    question: 'How many Arduino pins does a 16x2 LCD require in 4-bit parallel mode?',
                    options: [
                        '2 pins (I2C)',
                        '6 pins (RS, EN, D4-D7)',
                        '16 pins (all LCD pins)',
                        '8 pins (RS, EN, D0-D5)'
                    ],
                    explanation: 'In 4-bit mode, you need 6 Arduino digital pins: RS (Register Select -- chooses between command mode and data mode), EN (Enable -- triggers the LCD to read the data), and D4-D7 (the upper 4 data lines). The lower data lines D0-D3 are not connected. In this mode, each byte is sent as two 4-bit nibbles: the upper nibble first, then the lower nibble. This takes slightly longer than 8-bit mode but saves 4 Arduino pins. The V0 pin connects to a potentiometer for contrast adjustment, and the A/K pins control the backlight, but these do not require Arduino digital pins.'
                },
                {
                    question: 'What does lcd.setCursor(5, 1) do on a 16x2 LCD?',
                    options: [
                        'Sets the LCD brightness to 5 on line 1',
                        'Moves the cursor to column 5, row 1 (second line)',
                        'Scrolls the display 5 positions on row 1',
                        'Creates a custom character at position 5'
                    ],
                    explanation: 'lcd.setCursor(col, row) positions the cursor at the specified column and row. Columns are numbered 0-15 (on a 16-character display), and rows are numbered 0-1 (on a 2-row display). So lcd.setCursor(5, 1) places the cursor at column 5 of the second row (row 1). All subsequent lcd.print() calls will write starting from this position. The cursor auto-advances to the right after each character is written. If you write past column 15, behavior depends on the display -- on a 16x2, extra characters may wrap to unexpected positions in the display\'s internal memory rather than wrapping cleanly to the next visible line.'
                },
                {
                    question: 'What is the maximum number of custom characters you can define on an HD44780 LCD?',
                    options: [
                        '4',
                        '8',
                        '16',
                        '32'
                    ],
                    explanation: 'The HD44780 controller provides 8 custom character slots, indexed 0 through 7. Each custom character is defined as an array of 8 bytes, where each byte represents one row of a 5x8 pixel grid (only the lower 5 bits of each byte are used). You register a custom character using lcd.createChar(index, byteArray) where index is 0-7, and display it using lcd.write(index). These 8 slots are stored in CGRAM (Character Generator RAM) which is volatile -- custom characters are lost when power is removed. You can overwrite custom characters during runtime to display more than 8 different icons by swapping them as needed.'
                },
                {
                    question: 'What is the I2C address commonly used by LCD backpacks with the PCF8574 chip?',
                    options: [
                        '0x3C',
                        '0x27 or 0x3F',
                        '0x50',
                        '0x68'
                    ],
                    explanation: 'The PCF8574 I2C LCD backpack typically uses address 0x27 (PCF8574) or 0x3F (PCF8574A variant). The PCF8574 is an 8-bit I/O expander that translates I2C serial commands into the parallel signals the HD44780 controller expects. Instead of using 6 Arduino pins for direct parallel connection, you use only 2 I2C pins: SDA (A4 on Uno) and SCL (A5 on Uno). The backpack has solder pads (A0, A1, A2) that allow you to modify the I2C address by bridging them, enabling up to 8 LCD modules on the same I2C bus. Address 0x3C is commonly used by SSD1306 OLED displays, not LCD backpacks.'
                },
                {
                    question: 'What type of display technology does the SSD1306 controller drive?',
                    options: [
                        'Character LCD with backlight',
                        'Full-color TFT',
                        'Monochrome OLED (128x64 or 128x32)',
                        'E-ink (electronic paper)'
                    ],
                    explanation: 'The SSD1306 is a driver/controller for monochrome OLED (Organic Light Emitting Diode) displays, most commonly in 128x64 or 128x32 pixel configurations. OLED displays use organic compounds that emit light when electric current is applied -- each pixel is its own light source. This means no backlight is needed (unlike LCDs), truly black pixels consume zero power, and the contrast ratio is essentially infinite. The SSD1306 communicates via I2C (at address 0x3C typically) or SPI, and it has an internal 128x64-bit GDDRAM (Graphic Display Data RAM) that maps directly to the physical pixels. The Adafruit_SSD1306 library maintains a frame buffer in Arduino SRAM and transfers it to the display when you call display().'
                },
                {
                    question: 'How much SRAM does the SSD1306 frame buffer consume on an Arduino Uno?',
                    options: [
                        '128 bytes',
                        '512 bytes',
                        '1024 bytes (1KB)',
                        '2048 bytes (2KB)'
                    ],
                    explanation: 'A 128x64 pixel monochrome display requires 128 x 64 / 8 = 1024 bytes (1KB) for its frame buffer, since each pixel is represented by a single bit. On an Arduino Uno with only 2048 bytes (2KB) of SRAM total, this frame buffer consumes exactly 50% of all available RAM. This leaves only 1KB for all your variables, the stack, library overhead, and string constants. This is why complex projects with SSD1306 displays on the Uno often run into memory issues. Solutions include: using a 128x32 display (512 bytes), using page-mode rendering (U8g2 library), or upgrading to an Arduino Mega (8KB SRAM) or ESP32 (520KB SRAM).'
                },
                {
                    question: 'What color format do ST7735 and ILI9341 TFT displays use?',
                    options: [
                        'RGB888 (24-bit, 16.7M colors)',
                        'RGB565 (16-bit, 65K colors)',
                        'Monochrome (1-bit, 2 colors)',
                        'CMYK (32-bit, print colors)'
                    ],
                    explanation: 'TFT displays like the ST7735 and ILI9341 use RGB565 format: 5 bits for red (32 levels), 6 bits for green (64 levels), and 5 bits for blue (32 levels), totaling 16 bits per pixel and yielding 65,536 possible colors. Green gets an extra bit because the human eye is most sensitive to green light. This format is a practical compromise between color depth and memory/bandwidth requirements on microcontrollers. Each pixel uses 2 bytes, so a 128x160 display needs 40,960 bytes just for one full frame -- far more than an Uno can buffer. The Adafruit GFX library provides tft.color565(r, g, b) to convert standard 0-255 RGB values to the RGB565 format.'
                },
                {
                    question: 'Which library provides a common graphics API that works across OLED, TFT, and other Adafruit displays?',
                    options: [
                        'LiquidCrystal',
                        'Adafruit_GFX',
                        'U8g2lib',
                        'Wire'
                    ],
                    explanation: 'Adafruit_GFX is the core graphics library that provides a unified drawing API across all Adafruit display drivers. Whether you are using an SSD1306 OLED, ST7735 TFT, ILI9341 TFT, or even an e-ink display, the same drawing functions work: drawPixel(), drawLine(), drawRect(), fillRect(), drawCircle(), fillCircle(), drawTriangle(), setCursor(), setTextSize(), setTextColor(), print(), println(), and many more. Each display driver library (Adafruit_SSD1306, Adafruit_ST7735, Adafruit_ILI9341) inherits from Adafruit_GFX and implements the hardware-specific drawPixel() method. Everything else is built on top of that single pixel-drawing primitive.'
                },
                {
                    question: 'Why should you avoid calling lcd.clear() inside the loop() function?',
                    options: [
                        'clear() permanently damages the LCD controller',
                        'clear() uses too much EEPROM write cycles',
                        'It causes visible flicker because the screen goes blank between updates',
                        'clear() is only available in setup(), not loop()'
                    ],
                    explanation: 'Calling lcd.clear() inside loop() causes visible flicker because the entire display is erased (all characters replaced with spaces) before the new content is written. Since loop() runs continuously, the user sees a rapid flash of blank screen between each update cycle. The correct approach is partial updating: use lcd.setCursor() to position the cursor at specific locations, then lcd.print() to overwrite only the characters that changed. Pad shorter strings with trailing spaces to erase leftover characters from the previous value. This way, the display is never blank -- old content is directly replaced with new content. For graphical displays, use frame buffering: draw to an off-screen buffer, then push the entire buffer at once.'
                },
                {
                    question: 'What is frame buffering in the context of OLED displays?',
                    options: [
                        'Storing the display content in EEPROM for persistence',
                        'Drawing to a memory array first, then sending the entire array to the display at once',
                        'Using two physical OLED screens and alternating between them',
                        'Compressing the display data to save memory'
                    ],
                    explanation: 'Frame buffering means maintaining a complete copy of the display\'s pixel data in an array in SRAM (the frame buffer). All drawing operations (text, shapes, images) modify this buffer in memory, not the physical display. When all drawing for the current frame is complete, the entire buffer is transferred to the display in a single burst using display() or sendBuffer(). This eliminates flicker because the old frame stays visible on the physical display until the new frame is fully ready and transferred. The Adafruit_SSD1306 library uses this pattern: clearDisplay() clears the buffer (not the screen), drawing functions modify the buffer, and display() pushes the buffer to the SSD1306.'
                },
                {
                    question: 'How can you drive two SSD1306 OLED displays from a single Arduino?',
                    options: [
                        'It is impossible -- I2C only supports one device per bus',
                        'Use two different I2C addresses (0x3C and 0x3D) set via the solder jumper',
                        'Connect them to different analog pins',
                        'Use a USB hub to connect both displays'
                    ],
                    explanation: 'Most SSD1306 OLED modules have a solder jumper on the back that lets you set the I2C address to either 0x3C or 0x3D. By configuring one module at 0x3C and the other at 0x3D, both can share the same I2C bus (SDA and SCL wires). In your Arduino sketch, you create two separate Adafruit_SSD1306 objects, each initialized with a different address. Each display has its own independent frame buffer and can show different content. The main limitation is SRAM: two 128x64 OLED buffers require 2KB, which equals the Uno\'s entire SRAM. For dual-OLED setups, use an Arduino Mega or ESP32.'
                },
                {
                    question: 'What does the SPI Chip Select (CS) pin do when connecting multiple SPI displays?',
                    options: [
                        'It provides power to the selected display',
                        'It selects which display receives data by pulling its CS line LOW',
                        'It adjusts the display brightness',
                        'It resets the display controller'
                    ],
                    explanation: 'The Chip Select (CS) pin is the SPI addressing mechanism. When CS is pulled LOW, that specific display is active and will receive data from the shared MOSI, MISO, and SCK lines. When CS is HIGH, the display ignores all bus activity. To drive multiple SPI displays from one Arduino, you share the 3 SPI bus pins (MOSI, MISO, SCK) across all displays, but give each display its own unique CS pin. When you want to update display #1, pull CS1 LOW and CS2 HIGH. When updating display #2, pull CS2 LOW and CS1 HIGH. This way, only one display listens at a time, preventing data collisions on the shared bus.'
                },
                {
                    question: 'What pixel dimensions does the 5x8 custom character grid on an HD44780 LCD use?',
                    options: [
                        '8 pixels wide by 5 pixels tall',
                        '5 pixels wide by 8 pixels tall',
                        '16 pixels wide by 16 pixels tall',
                        '10 pixels wide by 10 pixels tall'
                    ],
                    explanation: 'Each character cell on an HD44780 LCD is a 5x8 pixel grid: 5 pixels wide and 8 pixels tall. When creating a custom character, you define an array of 8 bytes where each byte represents one horizontal row (top to bottom). Only the lower 5 bits of each byte are used -- they correspond to the 5 pixel columns from left to right. A set bit (1) turns the pixel on (dark), and a cleared bit (0) leaves it off (background). For example, a heart shape uses binary values like 0b01010 (row with two humps) and 0b11111 (full row). The bottom row is often left as 0b00000 to leave space for the cursor underline.'
                },
                {
                    question: 'Which display interface requires the fewest Arduino pins for a character LCD?',
                    options: [
                        '8-bit parallel (11 pins)',
                        '4-bit parallel (6 pins)',
                        'I2C via PCF8574 backpack (2 pins)',
                        'SPI (4 pins)'
                    ],
                    explanation: 'I2C via a PCF8574 backpack requires only 2 Arduino pins: SDA (A4 on the Uno) and SCL (A5 on the Uno). The PCF8574 I2C I/O expander on the backpack translates the 2-wire I2C serial commands into the parallel signals the HD44780 controller expects. Compare this to 4-bit parallel mode (6 pins: RS, EN, D4-D7) or 8-bit parallel mode (10-11 pins: RS, RW, EN, D0-D7). The tradeoff is speed: I2C is slower than direct parallel connection because each byte must be serialized, sent over the I2C bus, deserialized by the PCF8574, and then presented to the HD44780. But for text display at human-readable update rates, this speed difference is completely negligible.'
                }
            ]
        });
        quiz.start();
    </script>
