    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 17: Memory & Optimization',
            description: 'Test your understanding of the Arduino build process, Flash/SRAM/EEPROM memory, PROGMEM, F() macro, conditional compilation, and memory-safe coding patterns.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-17-quiz',
            moduleId: 'pc-ard-17-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What are the four stages of the Arduino build process in order?',
                    options: [
                        'Compile, upload, run, debug',
                        'Preprocess, compile, link, upload',
                        'Edit, save, verify, deploy',
                        'Parse, tokenize, assemble, flash'
                    ],
                    explanation: 'The Arduino build process has four stages: (1) Preprocess -- the IDE converts the .ino file to a valid .cpp file by adding #include <Arduino.h> and generating function prototypes. (2) Compile -- avr-gcc compiles each .cpp file into .o object files containing AVR machine code. (3) Link -- the linker combines all .o files into a single .elf binary, then converts it to .hex format. (4) Upload -- avrdude sends the .hex file over USB to the bootloader, which writes it to flash memory. Understanding this pipeline helps you diagnose errors at each stage.'
                },
                {
                    question: 'How much SRAM does the ATmega328P (Arduino Uno) have for runtime variables?',
                    options: [
                        '32 KB',
                        '2 KB',
                        '1 KB',
                        '16 KB'
                    ],
                    explanation: 'The ATmega328P has exactly 2,048 bytes (2 KB) of SRAM for runtime data. This is divided into static data (global variables), the heap (dynamic allocation with malloc/new), and the stack (function calls and local variables). The heap grows upward from static data and the stack grows downward from the top of SRAM. When they collide, the program crashes. 32 KB is the flash memory size (for program code), 1 KB is the EEPROM size (for persistent settings). Every byte of SRAM matters on this platform.'
                },
                {
                    question: 'What happens when SRAM is exhausted on an Arduino?',
                    options: [
                        'The IDE displays a clear error message',
                        'The Arduino automatically switches to using flash memory as RAM',
                        'The program crashes with random behavior: garbled output, reboot loops, or silent failure with no error message',
                        'The sketch compilation fails with a memory overflow error'
                    ],
                    explanation: 'SRAM exhaustion causes silent, unpredictable failure at runtime. There is no error message, no exception, no crash handler. The stack and heap collide, corrupting each other\'s data. Symptoms include garbled Serial output, variables changing to random values, functions jumping to wrong addresses, infinite reboot loops, or the program simply stopping. The compiler cannot detect this at compile time because stack depth depends on runtime behavior. This is why monitoring free RAM with a freeRam() function and keeping at least 300 bytes of headroom is essential for stable operation.'
                },
                {
                    question: 'What does the F() macro do when used with Serial.println()?',
                    options: [
                        'Formats the output as a floating-point number',
                        'Keeps the string literal in flash memory instead of copying it to SRAM, saving runtime memory',
                        'Encrypts the string before sending it over Serial',
                        'Forces the string to be printed on a single line without line breaks'
                    ],
                    explanation: 'F() is a macro that wraps a string literal in a __FlashStringHelper pointer, telling the Print class (parent of Serial) to read the string directly from flash memory one byte at a time using pgm_read_byte(). Without F(), every string literal in your code is copied from flash into SRAM at startup and stays there permanently, consuming precious runtime memory. With F(), the string exists only in flash and is never copied to SRAM. A sketch with 20 Serial.println() messages can save 400+ bytes of SRAM -- 20% of total memory -- by adding F() to each one. This is the single easiest optimization in Arduino programming.'
                },
                {
                    question: 'What is PROGMEM used for?',
                    options: [
                        'To program the EEPROM memory at compile time',
                        'To store constant data (arrays, lookup tables, strings) in flash memory instead of SRAM',
                        'To increase the program memory size beyond 32 KB',
                        'To protect memory regions from being overwritten by other sketches'
                    ],
                    explanation: 'PROGMEM is a variable modifier that tells the compiler to store constant data in flash (program memory) instead of copying it to SRAM at startup. This is critical for large data: lookup tables, string arrays, bitmap data, musical notes, and calibration values. The trade-off is that PROGMEM data cannot be read with normal pointer dereferencing -- you must use special functions: pgm_read_byte() for bytes, pgm_read_word() for 16-bit values, pgm_read_dword() for 32-bit values, and strcpy_P()/strcmp_P() for strings. The data stays in flash permanently and is read one element at a time when needed.'
                },
                {
                    question: 'Why should you use EEPROM.update() instead of EEPROM.write()?',
                    options: [
                        'EEPROM.update() is faster because it uses DMA transfers',
                        'EEPROM.update() only writes if the value has changed, preserving the 100,000 write cycle limit per address',
                        'EEPROM.update() can write multiple bytes at once while write() handles only one',
                        'EEPROM.update() automatically backs up data to flash before writing'
                    ],
                    explanation: 'EEPROM.update(addr, val) reads the current value at the address first and only performs a write operation if the new value is different. EEPROM.write(addr, val) always writes, even if the value is identical to what is already stored. Each EEPROM address supports approximately 100,000 write cycles before wear-out. If you call EEPROM.write() inside loop() without a condition guard, you could burn through all 100,000 cycles in seconds. EEPROM.update() prevents unnecessary writes, dramatically extending the lifespan of the EEPROM. Always use update() unless you specifically need to force a write.'
                },
                {
                    question: 'What does #ifdef DEBUG / #endif do in Arduino code?',
                    options: [
                        'It runs the enclosed code only when the Arduino IDE is in debug mode',
                        'It conditionally includes or excludes code at compile time -- the code literally does not exist in the binary when DEBUG is not defined',
                        'It adds runtime error checking that prints debug information to Serial',
                        'It enables step-by-step execution for troubleshooting'
                    ],
                    explanation: 'Conditional compilation with #ifdef is a preprocessor directive that includes or excludes blocks of code before compilation. When #define DEBUG is present, all code between #ifdef DEBUG and #endif is compiled normally. When the #define DEBUG line is commented out, all that code is completely removed from the compiled binary -- zero flash usage, zero SRAM usage, zero CPU cycles. This is not a runtime if-statement; the code physically does not exist in the binary. This makes it perfect for debug Serial.print() statements that you want to eliminate in production without deleting the code.'
                },
                {
                    question: 'Why is the Arduino String class dangerous on the ATmega328P?',
                    options: [
                        'It only supports ASCII characters, not Unicode',
                        'It uses dynamic heap allocation (malloc/realloc) that fragments the 2 KB SRAM over time, eventually causing crashes',
                        'It is slower than using integers for string operations',
                        'It conflicts with the Serial library and causes compilation errors'
                    ],
                    explanation: 'The String class uses malloc() and realloc() internally for dynamic memory management. Each concatenation (+=) allocates a new, larger block, copies the old data, and frees the old block. On a system with gigabytes of RAM, this is fine. On the ATmega328P with 2 KB of SRAM, this creates heap fragmentation -- small, unusable memory gaps between allocated blocks. After minutes of String operations in loop(), the heap becomes so fragmented that allocations fail even though the total free memory appears sufficient. The program then crashes silently. The safe alternative is fixed-size char[] arrays with snprintf().'
                },
                {
                    question: 'What is the safe alternative to String concatenation for formatting output?',
                    options: [
                        'Using multiple Serial.print() calls in sequence',
                        'Using a fixed-size char[] buffer with snprintf() for formatted output',
                        'Using the printf() function directly from stdio.h',
                        'Both A and B are safe alternatives to String concatenation'
                    ],
                    explanation: 'Both options A and B are safe alternatives. Multiple Serial.print() calls avoid heap allocation entirely -- each call sends data directly to the UART without buffering. A char[] buffer with snprintf() pre-allocates a fixed-size array on the stack, formats the output into it, and then prints the buffer. Both approaches use predictable, stack-based memory that is automatically reclaimed when the function returns. snprintf() is preferred when you need the complete formatted string as a single variable (e.g., for LCD display or logging). Multiple Serial.print() calls are simpler when output goes only to Serial.'
                },
                {
                    question: 'What does sizeof() return for an int on the ATmega328P?',
                    options: [
                        '4 bytes',
                        '2 bytes',
                        '1 byte',
                        '8 bytes'
                    ],
                    explanation: 'On the ATmega328P (8-bit AVR architecture), int is 2 bytes (16 bits), with a range of -32,768 to 32,767. This is different from ARM-based Arduino boards (MKR, Due, ESP32) where int is 4 bytes (32 bits). Code that assumes int is 2 bytes will produce incorrect results when ported to ARM boards. For portable, predictable code, use fixed-width types from <stdint.h>: uint8_t (1 byte, 0-255), int16_t (2 bytes, signed), uint16_t (2 bytes, unsigned), int32_t (4 bytes), uint32_t (4 bytes). sizeof() verifies the actual size at compile time and should be used in assertions and buffer calculations.'
                },
                {
                    question: 'How much headroom (free SRAM) should you maintain for stable Arduino operation?',
                    options: [
                        'At least 10 bytes',
                        'At least 50 bytes',
                        'At least 300 bytes',
                        'At least 1024 bytes'
                    ],
                    explanation: 'A minimum of 300 bytes of free SRAM is recommended for stable operation. Serial communication alone requires stack space for its internal functions. Interrupt service routines push registers onto the stack. Library functions allocate local variables. If free RAM drops below 200 bytes, behavior becomes unstable. Below 100 bytes, crashes are imminent. Below 50 bytes, stack corruption is guaranteed. The freeRam() function should be called at the end of setup() (baseline) and during peak usage in loop() to verify headroom. If freeRam() shows decreasing values each iteration, you have a memory leak.'
                },
                {
                    question: 'What is the difference between Flash and SRAM on the ATmega328P?',
                    options: [
                        'Flash is faster but volatile; SRAM is slower but non-volatile',
                        'Flash stores the compiled program and is non-volatile; SRAM stores runtime variables and is volatile (cleared on power loss)',
                        'Flash is writable at runtime; SRAM is read-only after programming',
                        'Flash and SRAM are the same memory accessed through different buses'
                    ],
                    explanation: 'Flash memory (32 KB) stores your compiled program (machine code) and is non-volatile -- it retains data without power, surviving reboots and power cycles. It is written during upload and is effectively read-only at runtime (the program cannot easily modify itself). SRAM (2 KB) is volatile working memory that stores all runtime data: global variables, local variables, the stack, and the heap. SRAM is cleared every time the board loses power or resets. Flash has a 10,000 write cycle limit; SRAM has unlimited read/write cycles. Understanding this distinction is fundamental to memory optimization.'
                },
                {
                    question: 'Which function reads a 16-bit integer from PROGMEM storage?',
                    options: [
                        'PROGMEM.read(address)',
                        'pgm_read_word(&variable)',
                        'flash_read_int(address)',
                        'memcpy_P(dest, src, 2)'
                    ],
                    explanation: 'pgm_read_word() reads a 16-bit value (word) from flash/PROGMEM storage. You pass it the address of the PROGMEM variable using the & operator: pgm_read_word(&myArray[index]). The function family includes pgm_read_byte() for 8-bit values, pgm_read_word() for 16-bit values, pgm_read_dword() for 32-bit values, and pgm_read_float() for floating-point values. You cannot read PROGMEM data with normal C pointer dereferencing because the AVR uses separate address spaces for flash and SRAM (Harvard architecture). These special functions use the LPM (Load Program Memory) instruction to read from the flash address space.'
                },
                {
                    question: 'What happens if you write to EEPROM inside loop() without a condition guard?',
                    options: [
                        'Nothing unusual -- EEPROM handles unlimited writes',
                        'The EEPROM addresses wear out within seconds, potentially destroying persistent storage permanently',
                        'The Arduino IDE prevents compilation of such code',
                        'EEPROM automatically throttles writes to prevent wear'
                    ],
                    explanation: 'EEPROM has a write endurance of approximately 100,000 cycles per address. The Arduino loop() function runs thousands of times per second. If EEPROM.write() is called every loop iteration, 100,000 cycles would be exhausted in well under a minute. After exceeding the write limit, the EEPROM cells may retain incorrect values, fail to hold data, or become stuck at a fixed value. There is no hardware protection or throttling. Always guard EEPROM writes with a condition: only write when the value has actually changed (or use EEPROM.update() which does this automatically). Never place unconditional EEPROM writes inside loop().'
                },
                {
                    question: 'What does const int LED = 13; cost in SRAM on the ATmega328P?',
                    options: [
                        '2 bytes (the size of an int)',
                        '0 bytes -- the compiler optimizes const int into an immediate value, just like #define',
                        '4 bytes (int + const metadata)',
                        '13 bytes (one per pin number)'
                    ],
                    explanation: 'The AVR-GCC compiler optimizes const int values into compile-time constants (immediate operands in the machine code), consuming zero SRAM. This makes const int functionally equivalent to #define for simple numeric values but with the added benefit of type safety -- the compiler knows LED is an int and can catch type mismatches. However, const arrays and const strings DO consume SRAM unless you also add the PROGMEM modifier. The optimization only applies to scalar const values (int, byte, char, float) that the compiler can replace with literal values at every usage point.'
                }
            ]
        });
        quiz.start();
    </script>
