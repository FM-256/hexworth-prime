    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 1: AllSpark -- First Arduino Program',
            description: 'Test your understanding of the Arduino platform, the Uno board, sketch structure, the IDE, Blink, Serial Monitor, and basic circuits.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-01-quiz',
            moduleId: 'pc-ard-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is an Arduino?',
                    options: [
                        'A miniature computer that runs Linux',
                        'An open-source electronics platform based on a microcontroller',
                        'A programming language for embedded systems',
                        'A proprietary circuit board made by Intel'
                    ],
                    explanation: 'Arduino is an open-source electronics platform that combines easy-to-use hardware (a microcontroller board) with easy-to-use software (the Arduino IDE). It was created in 2005 at the Interaction Design Institute Ivrea in Italy to give students an affordable way to create interactive projects. The key distinction is that Arduino is a microcontroller platform, not a computer. It has no operating system, no file system, and no multitasking. It runs exactly one program in an infinite loop. The ATmega328P chip at its core executes your code directly on the hardware, starting the instant power is applied and running until power is removed. The program persists in flash memory across power cycles.'
                },
                {
                    question: 'What microcontroller chip does the Arduino Uno R3 use?',
                    options: [
                        'ATmega328P',
                        'ATmega2560',
                        'ATmega32U4',
                        'ARM Cortex-M0'
                    ],
                    explanation: 'The Arduino Uno R3 uses the ATmega328P, an 8-bit AVR microcontroller made by Microchip (formerly Atmel). It runs at 16 MHz, has 32KB of flash memory for your program, 2KB of SRAM for runtime variables, and 1KB of EEPROM for persistent data storage. The ATmega2560 is used in the Arduino Mega, which has more pins and more memory. The ATmega32U4 is used in the Arduino Leonardo and has native USB support. ARM Cortex-M0 is used in newer Arduino boards like the MKR series. For the Uno, the ATmega328P is the brain that executes your sketches.'
                },
                {
                    question: 'Every Arduino sketch must contain which two functions?',
                    options: [
                        'main() and run()',
                        'init() and execute()',
                        'setup() and loop()',
                        'begin() and repeat()'
                    ],
                    explanation: 'Every Arduino sketch requires setup() and loop(). The setup() function runs exactly once when the board powers on or resets. It is used for one-time initialization: configuring pin modes, starting serial communication, initializing libraries and sensors. The loop() function runs immediately after setup() completes and then repeats forever in an infinite cycle. This is where the actual work happens: reading sensors, controlling outputs, processing data. Even an empty setup() and empty loop() constitute a valid Arduino program that compiles and uploads successfully. The Arduino framework hides the traditional C/C++ main() function from you -- behind the scenes, main() calls setup() once and then calls loop() in a while(true) loop.'
                },
                {
                    question: 'What does the Verify button in the Arduino IDE do?',
                    options: [
                        'Uploads code to the Arduino board',
                        'Opens the Serial Monitor window',
                        'Formats the code with proper indentation',
                        'Checks code for syntax errors and compiles it without uploading'
                    ],
                    explanation: 'The Verify button (checkmark icon) compiles your sketch to check for syntax errors, type mismatches, missing semicolons, undeclared variables, and other problems. It translates your human-readable code into machine code (a .hex binary) but does NOT send it to the board. This is a dry run -- a safety check. If compilation succeeds, the output panel shows how much flash and SRAM your sketch uses. If it fails, the output panel shows error messages with line numbers pointing to the problem. Always verify before uploading to catch mistakes early. The Upload button does everything Verify does AND then transfers the compiled code to the board.'
                },
                {
                    question: 'What does pinMode(13, OUTPUT) do?',
                    options: [
                        'Configures pin 13 to send voltage out (as an output)',
                        'Reads the voltage on pin 13',
                        'Turns pin 13 on at full brightness',
                        'Connects pin 13 to the Serial Monitor'
                    ],
                    explanation: 'pinMode(13, OUTPUT) configures digital pin 13 as an output pin, meaning it will send voltage rather than read it. Every digital pin on the Arduino can be either INPUT (reading external signals) or OUTPUT (sending signals). You must declare the mode in setup() before using the pin. When a pin is set to OUTPUT, you can use digitalWrite() to set it HIGH (5V) or LOW (0V). When set to INPUT, you use digitalRead() to detect whether something external is applying voltage. Pin 13 is special because it has a built-in LED connected to it on the Uno board, making it the easiest pin to test with.'
                },
                {
                    question: 'In the Blink sketch, what does digitalWrite(13, HIGH) do?',
                    options: [
                        'Reads the current state of pin 13',
                        'Sets pin 13 to 5V, turning the LED on',
                        'Starts a timer on pin 13',
                        'Sends a serial message on pin 13'
                    ],
                    explanation: 'digitalWrite(13, HIGH) sets digital pin 13 to 5 volts. Since pin 13 is configured as OUTPUT and has a built-in LED connected to it, this causes current to flow through the LED, illuminating it. HIGH means 5V (on the Uno), LOW means 0V (ground). These are the only two states a digital pin can output -- it is binary. There is no "medium" with digitalWrite. The pin register inside the ATmega328P physically switches the output transistor, connecting pin 13 to the 5V rail. The LED stays lit until you explicitly call digitalWrite(13, LOW) to drop the voltage back to 0V.'
                },
                {
                    question: 'What unit does the delay() function use?',
                    options: [
                        'Milliseconds',
                        'Seconds',
                        'Microseconds',
                        'Clock cycles'
                    ],
                    explanation: 'delay() accepts a value in milliseconds. delay(1000) pauses execution for 1000 milliseconds, which is 1 second. delay(500) is half a second, delay(100) is one-tenth of a second. During a delay, the processor is blocked -- it cannot read sensors, respond to inputs, or do anything else. The program simply waits. For microsecond precision, Arduino provides delayMicroseconds(). For non-blocking timing (where the processor can do other things while waiting), experienced programmers use millis() instead of delay(). But for beginners learning the Blink sketch, delay() is the simplest way to control timing.'
                },
                {
                    question: 'What happens when you click the Upload button in the Arduino IDE?',
                    options: [
                        'The code is saved to your hard drive only',
                        'The code is emailed to the Arduino cloud server',
                        'The Serial Monitor opens automatically',
                        'The code is compiled, sent over USB, and written to the ATmega flash memory via the bootloader'
                    ],
                    explanation: 'When you click Upload, a multi-step process occurs. First, the IDE compiles your .ino sketch into a .hex binary file (machine code). Second, the USB-to-serial chip on the Arduino triggers a hardware reset by toggling the DTR line. Third, the ATmega328P reboots into its bootloader -- a small program pre-installed in a protected section of flash memory. Fourth, the IDE sends the .hex data over USB to the bootloader. Fifth, the bootloader writes the new code into the main flash memory area. Sixth, the bootloader exits and your program begins executing from the top of setup(). The entire process takes roughly 5-10 seconds. The bootloader is what makes Arduino programming possible without an external programmer chip.'
                },
                {
                    question: 'How many digital pins does the Arduino Uno R3 have?',
                    options: [
                        '6',
                        '54',
                        '14',
                        '20'
                    ],
                    explanation: 'The Arduino Uno R3 has 14 digital input/output pins, numbered 0 through 13. Of these, 6 pins (3, 5, 6, 9, 10, 11) support PWM (Pulse Width Modulation) output, which can simulate analog voltages by rapidly switching between HIGH and LOW. Pins 0 and 1 double as the serial TX/RX pins used for USB communication, so they should be avoided for general I/O if you are using Serial. Pin 13 has the built-in LED. The Uno also has 6 analog input pins (A0-A5), bringing the total usable I/O to 20 pins. The Arduino Mega has 54 digital pins for projects that need many more connections.'
                },
                {
                    question: 'What does Serial.begin(9600) do?',
                    options: [
                        'Connects to WiFi at 9.6 GHz',
                        'Opens a serial communication channel at 9600 bits per second',
                        'Sets the brightness of the built-in LED to 9600',
                        'Configures 9600 analog pins for input'
                    ],
                    explanation: 'Serial.begin(9600) initializes the UART serial communication hardware at a baud rate of 9600 bits per second. This opens a two-way communication channel between the Arduino and your computer over USB. The baud rate (9600) must match between the Arduino code and the Serial Monitor window in the IDE -- if they do not match, you will see garbled characters instead of readable text. 9600 baud means approximately 960 characters per second (each character uses 10 bits: 8 data bits + 1 start bit + 1 stop bit). This function must be called in setup() before any Serial.print() or Serial.println() calls. Higher baud rates like 115200 allow faster data transfer for applications that need it.'
                },
                {
                    question: 'What is the purpose of Serial.println()?',
                    options: [
                        'To read input from the keyboard',
                        'To configure a pin as serial output',
                        'To reset the Arduino board',
                        'To send a line of text from the Arduino to the computer'
                    ],
                    explanation: 'Serial.println() sends a string of text from the Arduino through the USB connection to your computer, followed by a newline character. This text appears in the Serial Monitor window of the Arduino IDE. It is the primary debugging tool for Arduino programming -- the hardware equivalent of console.log() in JavaScript or print() in Python. Serial.print() does the same thing without adding a newline, so multiple print() calls appear on the same line. You can send strings (Serial.println("Hello")), integers (Serial.println(42)), floats (Serial.println(3.14)), and variable values. The Serial Monitor is how the Arduino "talks back" to you during development.'
                },
                {
                    question: 'Which pin on the Arduino Uno has a built-in LED connected to it?',
                    options: [
                        'Pin 0',
                        'Pin 7',
                        'Pin 13',
                        'Pin A0'
                    ],
                    explanation: 'Pin 13 has a built-in LED (labeled "L" on the board) connected to it through a current-limiting resistor. This is why the Blink sketch uses pin 13 -- you do not need any external components to see the result. When you set pin 13 HIGH, the built-in LED lights up. When you set it LOW, it goes dark. This LED is extremely useful for quick tests and debugging: if you are not sure whether your board is working, uploading the Blink sketch and seeing pin 13 LED flash confirms that the upload chain, the bootloader, and the ATmega are all functioning correctly. Note that pin 13 can still be used for other purposes -- the LED is just a convenient bonus.'
                },
                {
                    question: 'When building an external LED circuit on a breadboard, why is a resistor required?',
                    options: [
                        'To increase the brightness of the LED',
                        'To limit current and prevent the LED from burning out',
                        'To store energy for when the Arduino is unplugged',
                        'To convert AC power to DC power'
                    ],
                    explanation: 'A resistor is required to limit the amount of current flowing through the LED. Without a resistor, the LED would draw too much current from the Arduino pin (which can supply up to 40mA), potentially burning out the LED or damaging the pin. A typical LED needs about 20mA and a forward voltage of about 2V. With a 5V output and a 2V LED drop, the resistor must handle 3V. Using Ohm\'s Law (R = V/I), a 220-ohm resistor limits current to about 13.6mA -- safe for both the LED and the Arduino. This is the first and most fundamental lesson in electronics: always limit current with a resistor when driving an LED. The resistor is not optional.'
                },
                {
                    question: 'What does the term "sketch" mean in the Arduino ecosystem?',
                    options: [
                        'An Arduino program saved as a .ino file',
                        'A circuit diagram drawn by hand',
                        'A visual design tool in the IDE',
                        'A temporary file that is deleted after upload'
                    ],
                    explanation: 'In Arduino terminology, a "sketch" is the name for an Arduino program. It is saved as a .ino file and stored in its own folder of the same name. The term comes from Processing, the visual programming language and environment that inspired Arduino\'s software design. Just as artists create sketches, Arduino users create sketches -- quick, iterative programs that bring ideas to life. When you create a new sketch in the IDE, it generates a .ino file with empty setup() and loop() functions. The sketch is compiled into a .hex binary before being uploaded to the board. The .ino file is the human-readable source code; the .hex file is the machine code the ATmega actually executes.'
                },
                {
                    question: 'What happens to the program stored on an Arduino when you disconnect the USB cable?',
                    options: [
                        'The program is erased from memory',
                        'The board enters a permanent sleep mode',
                        'The program stays in flash memory and runs again when power is restored',
                        'The program is transferred to EEPROM automatically'
                    ],
                    explanation: 'The program remains stored in the ATmega328P\'s flash memory even when power is completely removed. Flash memory is non-volatile -- it retains data without power, similar to an SSD or USB drive. When power is restored (via USB or the barrel jack), the ATmega immediately begins executing the stored program from the beginning: setup() runs once, then loop() runs forever. This is a key difference between a microcontroller and a computer. A computer needs to boot an operating system before running programs. The Arduino has no OS -- the program IS the operating system. Your code runs directly on the bare metal. The flash memory is rated for about 10,000 write cycles, so you can upload new sketches thousands of times before wear becomes a concern.'
                }
            ]
        });
        quiz.start();
    </script>
