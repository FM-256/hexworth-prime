    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 15: WiFi & IoT',
            description: 'Test your understanding of Ethernet shields, WiFi modules, HTTP client/server, MQTT, IoT platforms, and NTP time synchronization.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-15-quiz',
            moduleId: 'pc-ard-15-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What chip does the modern Arduino Ethernet Shield use, and what interface does it communicate over?',
                    options: [
                        'W5500 over SPI',
                        'ESP8266 over UART',
                        'ENC28J60 over I2C',
                        'RTL8720 over USB'
                    ],
                    explanation: 'The modern Arduino Ethernet Shield uses the W5500 chip (successor to the W5100) and communicates with the Arduino over the SPI bus. The W5500 contains a full hardware TCP/IP stack, meaning the chip handles TCP, UDP, IP, ARP, ICMP, and IGMP in hardware rather than consuming Arduino RAM and CPU cycles. It supports 8 simultaneous sockets (vs. 4 for W5100), 10/100 Mbps Ethernet, and draws less power. On the Arduino Uno, SPI uses pins 11 (MOSI), 12 (MISO), 13 (SCK), and pin 10 as chip select for the Ethernet chip. If the shield also has an SD card slot, pin 4 is typically the SD card chip select. Only one SPI device can be active at a time, so the library manages chip select toggling. The Ethernet library provides a consistent API regardless of whether a W5100 or W5500 is underneath.'
                },
                {
                    question: 'What does Ethernet.begin(mac) do when called with only a MAC address parameter?',
                    options: [
                        'Requests an IP address from the router via DHCP',
                        'Assigns a random static IP address',
                        'Starts the Ethernet shield in promiscuous mode',
                        'Connects to the first available WiFi network'
                    ],
                    explanation: 'When Ethernet.begin() is called with only a MAC address, it performs a DHCP (Dynamic Host Configuration Protocol) transaction with the network router. The process: (1) the Arduino sends a DHCP Discover broadcast, (2) the router responds with a DHCP Offer containing an available IP address, (3) the Arduino sends a DHCP Request accepting the offered IP, (4) the router confirms with a DHCP ACK. If DHCP succeeds, the function returns a non-zero value and the Arduino has an IP address, subnet mask, gateway, and DNS server assigned automatically. If DHCP fails (no router, cable unplugged, timeout), it returns 0. For environments without DHCP or for deterministic addressing, use Ethernet.begin(mac, ip) with a static IP. DHCP leases expire (typically 24 hours), so long-running projects should call Ethernet.maintain() periodically to renew the lease.'
                },
                {
                    question: 'How does the ESP8266 module connect to an Arduino Uno to provide WiFi capability?',
                    options: [
                        'Via UART (serial) using AT commands',
                        'Via SPI bus using the WiFi library',
                        'Via I2C with a shared address',
                        'Via USB host mode'
                    ],
                    explanation: 'The ESP8266 connects to the Arduino Uno via UART (serial communication). The Arduino sends AT commands -- text-based instructions like AT+CWJAP="SSID","password" to join a WiFi network, AT+CIPSTART to open a TCP connection, and AT+CIPSEND to transmit data. The ESP8266 has its own full TCP/IP stack and WiFi radio; it handles all the networking complexity internally. The Arduino simply sends commands and reads responses through the serial port. Typically, SoftwareSerial is used on two digital pins (e.g., pins 2 and 3) to communicate with the ESP8266, leaving the hardware Serial for debugging via the USB Serial Monitor. A critical hardware consideration: the ESP8266 uses 3.3V logic, so a voltage divider or level shifter is needed on the Arduino TX to ESP8266 RX line to avoid damage.'
                },
                {
                    question: 'Which Arduino library provides a unified WiFi API for boards with built-in WiFi like the MKR WiFi 1010 and Nano 33 IoT?',
                    options: [
                        'WiFiNINA',
                        'ESP8266WiFi',
                        'WiFi101',
                        'Ethernet'
                    ],
                    explanation: 'WiFiNINA is the official Arduino library for boards equipped with the NINA-W102 WiFi/BLE module, including the MKR WiFi 1010, Nano 33 IoT, and Uno WiFi Rev2. It provides a clean, unified API: WiFi.begin(ssid, pass) to connect, WiFi.localIP() to get the assigned IP, WiFiClient for outgoing connections, WiFiServer for incoming connections, and WiFiSSLClient for HTTPS/TLS 1.2 connections. The library also supports firmware updates for the NINA module via the Arduino IDE. WiFi101 is the older library for the MKR1000 and WiFi Shield 101 (ATWINC1500 chip). ESP8266WiFi is specific to ESP8266-based boards programmed directly via the Arduino IDE. The Ethernet library is for wired connections. WiFiNINA represents the cleanest Arduino networking experience because the WiFi module is integrated into the board -- no external wiring, no AT commands, no level shifters.'
                },
                {
                    question: 'When making an HTTP GET request from an Arduino, why is the "Connection: close" header important?',
                    options: [
                        'It tells the server to close the TCP connection after the response, freeing the Arduino socket immediately',
                        'It encrypts the connection using TLS',
                        'It enables chunked transfer encoding for large responses',
                        'It tells the server to cache the response for faster future requests'
                    ],
                    explanation: 'The "Connection: close" header instructs the HTTP server to close the TCP connection immediately after sending the response. This is critical for Arduino because the microcontroller has very limited resources -- the W5500 supports only 8 simultaneous sockets, and the ATmega328P has only 2KB of RAM. Without "Connection: close," the server may keep the connection alive (HTTP/1.1 defaults to keep-alive), tying up a socket that the Arduino cannot afford to waste. When the connection is closed by the server, the Arduino can detect the end of the response (client.connected() returns false) and knows it has received all the data. This also simplifies the code: instead of parsing Content-Length headers or chunked encoding to know when the response ends, you simply read until the connection drops. For resource-constrained devices, short-lived connections are essential.'
                },
                {
                    question: 'What is the ArduinoJson library used for in IoT projects?',
                    options: [
                        'Parsing and generating JSON data within Arduino memory constraints',
                        'Connecting to JSON-based web services via WebSocket',
                        'Converting Arduino sensor data into XML format',
                        'Encrypting JSON payloads for secure transmission'
                    ],
                    explanation: 'ArduinoJson (by Benoit Blanchon) is a library specifically designed to parse and generate JSON data on memory-constrained microcontrollers. Most web APIs return data in JSON format (e.g., {"temp":23.5,"humidity":45.2}), and Arduino needs to extract values from these responses. ArduinoJson provides two allocation strategies: StaticJsonDocument allocates on the stack (fastest, fixed size) and DynamicJsonDocument allocates on the heap (flexible size). The library can deserialize JSON directly from a stream (WiFiClient, Serial) without buffering the entire response in RAM -- critical when you have only 2KB of SRAM. The ArduinoJson Assistant (online tool) helps calculate the correct buffer size for your specific JSON structure. The library also generates JSON for publishing data to APIs or MQTT topics. It handles nested objects, arrays, and all JSON data types while keeping memory usage predictable.'
                },
                {
                    question: 'When an Arduino runs as a web server, what function creates the server object and on which port does it typically listen?',
                    options: [
                        'WiFiServer server(80) -- listens on port 80, the standard HTTP port',
                        'WebServer.create(8080) -- listens on port 8080',
                        'HTTPServer.listen(443) -- listens on port 443 for HTTPS',
                        'Socket.bind(3000) -- binds to port 3000'
                    ],
                    explanation: 'WiFiServer server(80) creates a TCP server listening on port 80, which is the standard HTTP port. When a web browser navigates to the Arduino IP address (e.g., http://192.168.1.42), it connects to port 80 by default. The server.begin() call in setup() starts listening. In loop(), server.available() checks for incoming client connections. When a client connects, the Arduino reads the HTTP request, processes it, and sends back an HTTP response (status line, headers, blank line, body). The Arduino constructs the response manually -- there is no web framework, no template engine, no static file serving. Every byte of HTML comes from client.print() or client.println() calls. The server handles one client at a time on basic Arduino boards. After serving the response, client.stop() closes the connection, freeing the socket for the next client.'
                },
                {
                    question: 'How does an Arduino web server parse a form submission sent via GET method?',
                    options: [
                        'By reading the HTTP request line and searching for query parameters with indexOf()',
                        'By calling request.getParameter() from the built-in HTTP library',
                        'By parsing the request body as JSON',
                        'By reading form data from the Content-Type header'
                    ],
                    explanation: 'When an HTML form uses method="GET", the browser appends form data as query parameters in the URL. For example, clicking a button named "led" with value "on" sends: GET /?led=on HTTP/1.1. The Arduino reads this first line of the HTTP request using client.readStringUntil(\'\\r\') and then uses String methods like indexOf("led=on") to check for specific parameters. This is deliberately simple -- no URL parsing library, no parameter extraction framework, just string searching. For an Arduino with 2KB of RAM, this pragmatic approach works well for small forms with a few parameters. The Arduino does not have a built-in HTTP request parser; you work with raw text. For POST requests, the form data is in the request body after the headers, requiring you to read past the headers (look for the blank line) before parsing. GET is simpler and preferred for Arduino form handling.'
                },
                {
                    question: 'In MQTT, what is the role of the broker?',
                    options: [
                        'It receives messages from publishers and forwards them to all subscribers of the matching topic',
                        'It generates sensor data and publishes it to connected devices',
                        'It encrypts all messages before they are transmitted',
                        'It translates MQTT messages into HTTP requests'
                    ],
                    explanation: 'The MQTT broker is the central hub of the publish-subscribe messaging system. It receives all published messages and routes them to the appropriate subscribers based on topic matching. When an Arduino publishes to "home/temp" with payload "23.5", the broker receives it and immediately forwards it to every client that has subscribed to "home/temp" (or matching wildcard topics like "home/#"). The broker also handles client connections, session management, Quality of Service enforcement (retransmission for QoS 1 and 2), retained messages (last known value for new subscribers), and Last Will and Testament messages (sent when a client disconnects unexpectedly). Popular brokers include Mosquitto (open source, lightweight, runs on Raspberry Pi), HiveMQ (cloud-hosted, free tier), and EMQX (enterprise-grade). The Arduino never communicates directly with other devices -- all messages pass through the broker. This decouples publishers from subscribers and enables many-to-many communication.'
                },
                {
                    question: 'What MQTT QoS level provides "at least once" delivery?',
                    options: [
                        'QoS 1',
                        'QoS 0',
                        'QoS 2',
                        'QoS 3'
                    ],
                    explanation: 'MQTT defines three Quality of Service levels. QoS 0 ("at most once" or "fire and forget"): the message is sent once with no acknowledgment. If the network drops it, it is lost. QoS 1 ("at least once"): the sender stores the message and retransmits it until receiving a PUBACK acknowledgment from the broker. This guarantees delivery but may result in duplicate messages if the ACK is lost and the sender retransmits. QoS 2 ("exactly once"): a four-step handshake (PUBLISH, PUBREC, PUBREL, PUBCOMP) ensures the message arrives exactly once with no duplicates. QoS 2 has the most overhead. There is no QoS 3. For Arduino sensor data, QoS 0 is usually sufficient -- if a temperature reading is lost, the next one arrives in seconds. For commands that control physical outputs (turn off heater, close valve), QoS 1 is recommended because a missed command could have real consequences. QoS 2 is rarely needed on resource-constrained devices due to its memory and complexity overhead.'
                },
                {
                    question: 'Which IoT platform is operated by MathWorks and uses simple HTTP GET requests with an API key to receive Arduino sensor data?',
                    options: [
                        'ThingSpeak',
                        'Adafruit IO',
                        'Blynk',
                        'Arduino IoT Cloud'
                    ],
                    explanation: 'ThingSpeak is an IoT analytics platform operated by MathWorks (makers of MATLAB). It accepts sensor data via simple HTTP GET requests: the Arduino sends a request like GET /update?api_key=YOUR_KEY&field1=23.5 to api.thingspeak.com, and the platform stores the data point with a timestamp. No MQTT, no complex authentication -- just an API key in a URL. The free tier allows up to 8 fields per channel, updates every 15 seconds, and provides built-in charts, gauges, and MATLAB-based analytics. This simplicity makes ThingSpeak the easiest platform for beginners -- any Arduino with network connectivity can log data in under 10 lines of code. Adafruit IO uses MQTT and focuses on interactive dashboards. Blynk is mobile-first with a phone app builder. Arduino IoT Cloud is the official platform with tight WiFiNINA integration. For learning IoT concepts, ThingSpeak is the lowest-friction starting point.'
                },
                {
                    question: 'What protocol and port does NTP (Network Time Protocol) use?',
                    options: [
                        'UDP on port 123',
                        'TCP on port 80',
                        'TCP on port 443',
                        'UDP on port 53'
                    ],
                    explanation: 'NTP uses UDP (User Datagram Protocol) on port 123. UDP is connectionless -- the Arduino sends a single 48-byte NTP request packet and receives a single 48-byte response containing the current UTC time. There is no TCP handshake, no connection establishment, no connection teardown. This makes NTP fast and lightweight, perfect for resource-constrained devices. The NTP response contains a 64-bit timestamp representing seconds since January 1, 1900 (NTP epoch). The NTPClient library for Arduino handles the packet construction, parsing, and time zone offset calculation. The server pool "pool.ntp.org" automatically routes requests to nearby NTP servers. UDP port 53 is DNS. TCP port 80 is HTTP. TCP port 443 is HTTPS. NTP has been using UDP port 123 since 1985 and is one of the oldest protocols still in active internet use.'
                },
                {
                    question: 'Why does the NTPClient library require a time zone offset parameter, and how is it specified?',
                    options: [
                        'NTP returns UTC only; the offset is specified in seconds (e.g., -18000 for EST/UTC-5)',
                        'NTP returns local time; the offset converts it to UTC',
                        'The offset specifies the NTP server region in milliseconds',
                        'The offset determines how frequently the time is re-synced'
                    ],
                    explanation: 'NTP servers always return UTC (Coordinated Universal Time), which is the global time standard with no time zone offset. To display local time, you must apply your time zone offset. The NTPClient library accepts this offset in seconds. Eastern Standard Time (EST) is UTC-5 hours, so the offset is -5 * 3600 = -18000 seconds. Pacific Standard Time (PST) is UTC-8, so the offset is -28800 seconds. Central European Time (CET) is UTC+1, so the offset is +3600 seconds. One important limitation: NTP and the NTPClient library do not automatically handle Daylight Saving Time (DST). When your region switches between standard and daylight time, you must manually change the offset in your code (e.g., EDT is UTC-4 = -14400). Some more advanced time libraries include DST rules, but the basic NTPClient requires manual management.'
                },
                {
                    question: 'What is the PubSubClient library used for in Arduino IoT projects?',
                    options: [
                        'Connecting to MQTT brokers, publishing messages to topics, and subscribing to receive messages',
                        'Creating HTTP servers that serve HTML pages',
                        'Parsing JSON responses from REST APIs',
                        'Managing WiFi connections and DHCP leases'
                    ],
                    explanation: 'PubSubClient is the standard Arduino library for MQTT communication. It provides functions to connect to an MQTT broker (mqtt.connect()), publish messages to topics (mqtt.publish("home/temp", "23.5")), subscribe to topics (mqtt.subscribe("home/commands")), and register a callback function that fires when subscribed messages arrive (mqtt.setCallback()). The critical function mqtt.loop() must be called regularly in the Arduino loop() to process incoming messages and maintain the broker connection -- if you forget mqtt.loop(), the connection will time out and subscribed messages will not be received. PubSubClient works with any network client (WiFiClient, EthernetClient) passed as a constructor parameter, making it compatible with both wired and wireless Arduino networking. The library handles MQTT protocol details: CONNECT/CONNACK handshakes, PUBLISH/PUBACK flows, keep-alive ping packets, and clean session management.'
                },
                {
                    question: 'An Arduino Uno has 2KB of SRAM. What is the primary challenge this creates for networking projects?',
                    options: [
                        'HTTP responses, JSON payloads, and HTML pages can easily exceed available memory, requiring careful buffer management',
                        'The Uno cannot store WiFi passwords because they exceed 2KB',
                        '2KB is not enough to store the TCP/IP stack software',
                        'Ethernet shields require at least 4KB of RAM to function'
                    ],
                    explanation: 'The 2KB SRAM limitation is the defining constraint of Arduino networking. A single HTTP response from an API can easily be 500+ bytes. An HTML page served by the Arduino web server must be constructed in RAM before sending. A JSON payload with nested objects can require hundreds of bytes for parsing buffers. If your sketch, local variables, stack, and networking buffers together exceed 2KB, the program crashes unpredictably -- there is no memory protection or garbage collection on bare-metal microcontrollers. Strategies to manage this: (1) use F() macro to keep constant strings in flash instead of RAM, (2) parse JSON incrementally from the stream instead of buffering the entire response, (3) keep HTML responses minimal, (4) avoid String objects which fragment the heap, (5) use ArduinoJson StaticJsonDocument for predictable allocation. The TCP/IP stack runs in the W5500 hardware, not in Arduino RAM, which helps. But the application-layer data still needs RAM, and 2KB is tight.'
                }
            ]
        });
        quiz.start();
    </script>
