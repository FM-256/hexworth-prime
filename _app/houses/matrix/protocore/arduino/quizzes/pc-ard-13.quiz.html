    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 13: Bus Protocols I2C & SPI',
            description: 'Test your knowledge of I2C addressing, Wire library, SPI.transfer(), multi-device buses, port expanders, and inter-Arduino communication.',
            passingScore: 80, showFeedback: true, randomize: true,
            theme: 'matrix', achievement: 'pc-ard-13-quiz',
            moduleId: 'pc-ard-13-quiz', serverGrading: true, houseId: 'matrix', trackProgress: true,

            questions: [
                {
                    question: 'How many wires does the I2C bus require for data communication?',
                    options: [
                        'One (data only)',
                        'Two (SDA and SCL)',
                        'Four (MOSI, MISO, CLK, CS)',
                        'Eight (one per data bit)'
                    ],
                    explanation: 'I2C (Inter-Integrated Circuit) requires exactly two wires for data communication: SDA (Serial Data) and SCL (Serial Clock). SDA is a bidirectional data line where both master and slave devices transmit and receive data. SCL is the clock signal, always generated by the master. In addition to SDA and SCL, devices need VCC and GND power connections, but those are power lines, not part of the I2C bus protocol itself. This two-wire design is one of the main advantages of I2C -- you can connect up to 127 devices using just these two signal wires.'
                },
                {
                    question: 'On the Arduino Uno, which pins are used for I2C communication?',
                    options: [
                        'Digital pins 2 and 3',
                        'Digital pins 11 and 13',
                        'Analog pins A4 (SDA) and A5 (SCL)',
                        'Digital pins 0 and 1'
                    ],
                    explanation: 'On the Arduino Uno, I2C uses analog pins A4 for SDA (data) and A5 for SCL (clock). These pins have dedicated I2C hardware built into the ATmega328P. When you call Wire.begin(), the I2C hardware takes control of these pins regardless of any previous pinMode settings. On the Arduino Mega, the I2C pins are different: digital pins 20 (SDA) and 21 (SCL). The Arduino Leonardo uses digital pins 2 (SDA) and 3 (SCL). Always check the pinout for your specific board. Some boards also have dedicated SDA/SCL header pins that are internally connected to the same I2C hardware.'
                },
                {
                    question: 'What is the purpose of pull-up resistors on the I2C bus?',
                    options: [
                        'To limit current to slave devices',
                        'To pull the SDA and SCL lines HIGH when no device is driving them LOW (open-drain bus)',
                        'To increase the data transfer speed',
                        'To protect against voltage spikes'
                    ],
                    explanation: 'I2C is an open-drain (open-collector) bus, meaning devices can only pull the line LOW -- they cannot drive it HIGH. Pull-up resistors (typically 4.7k ohm) connected to VCC are needed to pull the lines back HIGH when no device is actively pulling them LOW. This is fundamental to how I2C works: a device sends a 0 by pulling the line LOW, and sends a 1 by releasing the line and letting the pull-up resistor bring it HIGH. Without pull-ups, the lines float at an indeterminate voltage and communication fails completely. Many breakout boards include pull-up resistors on-board.'
                },
                {
                    question: 'What does Wire.beginTransmission(0x48) do?',
                    options: [
                        'Immediately sends data to device at address 0x48',
                        'Starts a write transaction to address 0x48 and queues the address byte',
                        'Reads one byte from device at address 0x48',
                        'Scans the bus for a device at address 0x48'
                    ],
                    explanation: 'Wire.beginTransmission(address) begins a write transaction to the specified I2C slave address. It does NOT immediately send any data over the bus -- it simply records the target address and prepares an internal buffer. After calling beginTransmission, you use Wire.write() to queue bytes into the buffer. When you call Wire.endTransmission(), all queued data is actually sent on the bus. This buffered approach allows you to prepare the entire message before sending it. The function returns nothing. Wire.endTransmission() returns 0 for success or an error code if the device did not acknowledge.'
                },
                {
                    question: 'What is the maximum number of devices theoretically addressable on a single I2C bus?',
                    options: [
                        '8',
                        '32',
                        '127 (7-bit addressing)',
                        '255 (8-bit addressing)'
                    ],
                    explanation: 'I2C uses 7-bit addressing, giving a theoretical range of 0 to 127 (128 addresses). However, addresses 0x00-0x07 and 0x78-0x7F are reserved for special purposes (general call, 10-bit addressing, etc.), leaving about 112 usable addresses. In practice, you are further limited by bus capacitance (each device adds capacitance, and the total must stay under 400 pF for standard mode) and by address conflicts (many common devices share the same address). The practical limit is typically 8-12 devices on short wires. An extended 10-bit addressing mode exists but is rarely used.'
                },
                {
                    question: 'How does SPI select which slave device to communicate with?',
                    options: [
                        'Each slave has a unique address, like I2C',
                        'The master sends a device ID byte before each transaction',
                        'Each slave has its own Chip Select (CS) pin, pulled LOW to activate',
                        'Slaves take turns in a round-robin schedule'
                    ],
                    explanation: 'SPI uses dedicated Chip Select (CS) pins -- also called Slave Select (SS) -- to choose which device to talk to. Each slave device has its own CS pin connected to the master. To communicate with a specific slave, the master pulls that CS pin LOW (active LOW). All other CS pins must remain HIGH, keeping those devices deselected and their MISO lines in high-impedance state. This means each additional SPI device requires one additional pin on the master. Unlike I2C, there is no addressing scheme -- device selection is purely hardware-based through CS pin control.'
                },
                {
                    question: 'What does SPI.transfer(0x42) do?',
                    options: [
                        'Sends 0x42 to the slave and waits for a separate response',
                        'Simultaneously sends 0x42 out on MOSI and receives a byte in on MISO, returning the received byte',
                        'Transfers 42 bytes from a buffer to the slave',
                        'Sets the SPI clock speed to 42 MHz'
                    ],
                    explanation: 'SPI.transfer() is the core SPI function that simultaneously sends and receives one byte. It is full-duplex: while the master shifts out 0x42 bit-by-bit on the MOSI line, it simultaneously shifts in 8 bits from the slave on the MISO line. After 8 clock cycles, the function returns the byte that was received from the slave. This simultaneous send/receive happens because SPI uses a shift register architecture -- the master and slave shift registers form a circular buffer. Even if you only want to receive data, you must send something (typically 0x00) to generate the clock pulses.'
                },
                {
                    question: 'What are the four standard SPI signal lines?',
                    options: [
                        'SDA, SCL, VCC, GND',
                        'TX, RX, CTS, RTS',
                        'MOSI, MISO, SCK, CS/SS',
                        'A0, A1, A2, A3'
                    ],
                    explanation: 'The four SPI signal lines are: MOSI (Master Out, Slave In) -- data from master to slave. MISO (Master In, Slave Out) -- data from slave to master. SCK (Serial Clock) -- clock signal generated by the master, synchronizing data transfer. CS/SS (Chip Select / Slave Select) -- active-LOW signal that selects which slave is active. On the Arduino Uno, MOSI is pin 11, MISO is pin 12, SCK is pin 13, and SS is pin 10. MOSI, MISO, and SCK are shared among all slaves; only CS is unique per device.'
                },
                {
                    question: 'Why must pin 10 be set as OUTPUT on the Arduino Uno for SPI master mode?',
                    options: [
                        'It is used as the MOSI data line',
                        'It powers the SPI clock generator',
                        'If pin 10 is INPUT and goes LOW, the SPI hardware automatically switches to slave mode',
                        'It provides the pull-up voltage for SPI'
                    ],
                    explanation: 'Pin 10 is the hardware SS (Slave Select) pin on the ATmega328P. The SPI hardware monitors this pin: if it is configured as INPUT and an external signal pulls it LOW, the SPI peripheral automatically switches from master mode to slave mode, breaking your communication. Setting pin 10 as OUTPUT prevents this unintended mode switch. Even if you use a different pin (say pin 9) as your CS for the slave device, pin 10 must still be set as OUTPUT to keep the SPI hardware in master mode. This is a common source of bugs for beginners.'
                },
                {
                    question: 'What does the I2C scanner sketch do?',
                    options: [
                        'It configures all I2C devices with new addresses',
                        'It tests the speed of the I2C bus',
                        'It tries every possible address (1-126) and reports which ones respond with an ACK',
                        'It resets all I2C devices on the bus'
                    ],
                    explanation: 'The I2C scanner iterates through every valid 7-bit address (1 to 126) and attempts a brief write transaction to each. For each address, it calls Wire.beginTransmission(addr) followed by Wire.endTransmission(). If a device exists at that address, it responds with an ACK (acknowledge), and endTransmission() returns 0. If no device exists, endTransmission() returns a non-zero error code (typically 2 for NACK). The scanner reports all addresses that returned 0. This is an essential diagnostic tool -- always run it first when connecting new I2C devices to verify detection and confirm addresses.'
                },
                {
                    question: 'What is the PCF8574 and what does it do?',
                    options: [
                        'A temperature sensor that communicates over SPI',
                        'An I2C port expander that adds 8 GPIO pins using just 2 I2C wires',
                        'A voltage regulator for the I2C bus',
                        'An I2C bus speed accelerator'
                    ],
                    explanation: 'The PCF8574 is an I2C GPIO (General Purpose Input/Output) port expander. It connects to the I2C bus using just SDA and SCL, and provides 8 additional digital I/O pins (P0-P7). You can read and write these pins using simple Wire library commands -- write a byte to set output states, read a byte to check input states. The chip has 3 address pins (A0, A1, A2) allowing 8 unique addresses (0x20-0x27), so you can stack 8 chips for 64 extra pins total. It is commonly used to drive LCD displays (HD44780), add extra buttons, control relays, and expand the I/O of pin-limited Arduino boards.'
                },
                {
                    question: 'What happens when Wire.begin(8) is called on an Arduino?',
                    options: [
                        'It initializes the I2C bus at 8 MHz speed',
                        'It joins the I2C bus as a slave device with address 8',
                        'It scans for a device at address 8',
                        'It reserves 8 bytes in the I2C buffer'
                    ],
                    explanation: 'Wire.begin(address) joins the I2C bus as a slave device at the specified address. When called with Wire.begin(8), the Arduino becomes an I2C slave at address 8. Other master devices can then send data to address 8 using Wire.beginTransmission(8), or request data from it using Wire.requestFrom(8, count). The slave Arduino uses Wire.onReceive(callback) to register a function that is called when it receives data, and Wire.onRequest(callback) for when a master requests data. This enables inter-Arduino I2C communication where one Arduino is the master and others are slaves.'
                },
                {
                    question: 'Which is faster: I2C or SPI?',
                    options: [
                        'I2C is faster because it uses fewer wires',
                        'They are exactly the same speed',
                        'SPI is typically much faster (up to 8 MHz on Uno vs 400 kHz for I2C fast mode)',
                        'Speed depends only on the cable length'
                    ],
                    explanation: 'SPI is significantly faster than I2C. On an Arduino Uno, SPI can run at up to 8 MHz (half the 16 MHz system clock), while I2C fast mode tops out at 400 kHz. Standard I2C is only 100 kHz. SPI achieves this speed because it has separate data lines for send and receive (full-duplex), no addressing overhead, no ACK/NACK handshaking per byte, and a simpler protocol. I2C is slower because each byte needs a start condition, address byte, ACK bit, and data plus ACK. SPI is the preferred choice for high-speed peripherals like SD cards, TFT displays, and high-speed ADCs. I2C excels when you need many devices on minimal wires.'
                },
                {
                    question: 'A Wii Nunchuck is an I2C device at address 0x52. What sensor data does it provide?',
                    options: [
                        'Only a joystick with X and Y axes',
                        'A joystick (X/Y), two buttons (Z/C), and a 3-axis accelerometer, all in 6 bytes',
                        'A GPS receiver and compass',
                        'A microphone and speaker'
                    ],
                    explanation: 'The Wii Nunchuck communicates over I2C at address 0x52 and delivers 6 bytes of sensor data per read: Byte 0 is joystick X (0-255), byte 1 is joystick Y (0-255), bytes 2-4 contain the high bits of a 3-axis accelerometer (10-bit per axis), and byte 5 contains the low bits of the accelerometer plus the Z and C button states in bits 0 and 1 (active LOW). This makes the Nunchuck a remarkably feature-rich I2C peripheral for the price. All of this data travels over just 2 wires (SDA and SCL), demonstrating the efficiency of the I2C bus for multi-sensor devices.'
                },
                {
                    question: 'If two I2C devices have the same address, what is the solution?',
                    options: [
                        'Connect them to different I2C buses using a TCA9548A I2C multiplexer',
                        'Change the baud rate for one device',
                        'Use longer wires to create signal delay',
                        'There is no solution -- you cannot use both devices'
                    ],
                    explanation: 'When two I2C devices share the same address, you cannot directly connect both to the same bus because the master cannot distinguish between them. The best solution is a TCA9548A I2C multiplexer, which creates up to 8 independent I2C channels, all controlled by the master through a single address (0x70). You select a channel, talk to the device on that channel, then switch channels to talk to the duplicate device. Some devices offer configurable address pins (A0, A1, A2) that let you change the address -- check the datasheet first. The TCA9548A costs about $2 and is the standard solution when address pins are not available.'
                }
            ]
        });
        quiz.start();
    </script>
