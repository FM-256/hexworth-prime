    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 6: Sensors',
            description: 'Test your understanding of PIR motion, LDR light sensing, ultrasonic distance, temperature sensors, RFID, rotary encoders, GPS, and multi-sensor integration.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-06-quiz',
            moduleId: 'pc-ard-06-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does a PIR sensor (HC-SR501) detect?',
                    options: [
                        'Visible light changes in the environment',
                        'Changes in infrared radiation caused by moving warm bodies',
                        'Sound waves reflected off nearby objects',
                        'Magnetic field fluctuations from electronic devices'
                    ],
                    explanation: 'PIR stands for Passive Infrared. The sensor detects changes in infrared radiation emitted by warm objects, particularly humans and animals. The Fresnel lens on the front splits the field of view into detection zones. When a warm body moves between zones, the infrared signature changes and the pyroelectric sensor element generates a voltage pulse, causing the output pin to go HIGH. The sensor is "passive" because it does not emit any signal -- it only receives. The HC-SR501 module includes the PIR element, Fresnel lens, and signal conditioning circuitry. It has a detection range of up to 7 meters and a field of view of approximately 110 degrees. Two trimpots on the back adjust sensitivity and hold time.'
                },
                {
                    question: 'How many wires does the HC-SR501 PIR sensor require?',
                    options: [
                        'Two: signal and ground',
                        'Three: VCC, GND, and OUT',
                        'Four: VCC, GND, trigger, and echo',
                        'Five: VCC, GND, SDA, SCL, and INT'
                    ],
                    explanation: 'The HC-SR501 has three pins: VCC (5V power), GND (ground), and OUT (digital output signal). When no motion is detected, OUT is LOW (0V). When motion is detected, OUT goes HIGH (3.3V), which the Arduino reads as HIGH on a digital pin. This makes it one of the simplest sensors to wire and program -- just connect power, ground, and read the output pin with digitalRead(). The sensor needs a warm-up period of about 30-60 seconds after power-on to stabilize and calibrate to the ambient infrared levels in the room.'
                },
                {
                    question: 'How does an LDR (photoresistor) measure light?',
                    options: [
                        'It generates a voltage proportional to light intensity',
                        'It changes resistance based on light -- lower resistance in brighter light',
                        'It sends digital pulses at a frequency matching the light level',
                        'It measures the wavelength of incoming photons'
                    ],
                    explanation: 'A Light Dependent Resistor (LDR) is a passive component whose resistance decreases when exposed to more light. In darkness, an LDR can have a resistance of over 1 megaohm. In bright light, it drops to 1-10 kilohms. To read this with an Arduino, you create a voltage divider: connect the LDR between 5V and an analog pin, then a fixed resistor (typically 10k) between the analog pin and GND. As light increases, the LDR resistance drops, more voltage appears at the analog pin, and analogRead() returns a higher value. This voltage divider circuit is the fundamental pattern for reading any resistive sensor.'
                },
                {
                    question: 'What does the Arduino function analogRead() return?',
                    options: [
                        'A voltage value between 0.0 and 5.0 volts',
                        'An integer between 0 and 1023 representing the voltage on the pin',
                        'A boolean indicating whether the pin is above or below 2.5V',
                        'A floating-point number between 0.0 and 1.0'
                    ],
                    explanation: 'analogRead() returns an integer between 0 and 1023. The Arduino Uno has a 10-bit ADC (Analog-to-Digital Converter) that maps the input voltage range of 0V to 5V onto 1024 discrete values. A reading of 0 means 0V, 512 means approximately 2.5V, and 1023 means 5V. To convert back to voltage: voltage = reading * (5.0 / 1023.0). This raw ADC value must then be converted to the sensor-specific engineering unit (temperature, light level, distance, etc.) using the sensor\'s datasheet formula. The analogRead() function takes about 100 microseconds to execute on the Uno, limiting the sample rate to about 10,000 readings per second.'
                },
                {
                    question: 'How does the HC-SR04 ultrasonic sensor measure distance?',
                    options: [
                        'It measures the resistance of the air between the sensor and the object',
                        'It sends an IR beam and measures the reflection angle',
                        'It sends a 40kHz sound pulse and measures the time for the echo to return',
                        'It uses a laser to calculate the phase shift of reflected light'
                    ],
                    explanation: 'The HC-SR04 sends a burst of eight 40kHz ultrasonic pulses when you trigger it with a 10-microsecond HIGH pulse on the TRIG pin. The sound travels through the air, bounces off an object, and returns to the receiver. The ECHO pin goes HIGH when the pulse is sent and drops LOW when the echo is received. You measure this duration with pulseIn(echoPin, HIGH), which returns the round-trip time in microseconds. To convert to distance: cm = duration * 0.0343 / 2. The division by 2 accounts for the round trip (sound travels to the object and back). The speed of sound in air is approximately 343 meters per second at room temperature. The HC-SR04 has a range of 2 to 400 cm.'
                },
                {
                    question: 'What is the formula to convert HC-SR04 echo duration (in microseconds) to centimeters?',
                    options: [
                        'cm = duration / 1000',
                        'cm = duration * 0.0343 / 2',
                        'cm = duration * 343 * 2',
                        'cm = duration / 58'
                    ],
                    explanation: 'Both cm = duration * 0.0343 / 2 and cm = duration / 58 produce the same result and are both commonly used. The speed of sound is 343 m/s = 0.0343 cm/us. Since the pulse travels to the object and back (round trip), you divide by 2. Alternatively, 1 / (0.0343 / 2) = approximately 58, so dividing the duration by 58 gives the same answer. For example, if pulseIn() returns 1160 microseconds: 1160 * 0.0343 / 2 = 19.9 cm, or 1160 / 58 = 20.0 cm. Both formulas are correct. The first option (cm = duration * 0.0343 / 2) makes the physics more explicit and is the primary teaching formula.'
                },
                {
                    question: 'What advantage does the VL53L0X time-of-flight sensor have over the HC-SR04?',
                    options: [
                        'It is cheaper and requires fewer pins',
                        'It can measure distances over 10 meters',
                        'It provides millimeter-precision digital output via I2C',
                        'It works underwater unlike ultrasonic sensors'
                    ],
                    explanation: 'The VL53L0X time-of-flight sensor fires a laser pulse and measures the exact time for photons to return, providing distance measurements in millimeters with approximately +/- 3% accuracy. It communicates via I2C (digital), so there is no analog noise or conversion math -- the sensor returns a clean integer value in millimeters. The HC-SR04 measures in centimeters and is affected by temperature, humidity, and the surface material of the target. The VL53L0X range is up to 2 meters (shorter than the HC-SR04 maximum of 4 meters), but within that range it is significantly more precise and reliable. It also has a much smaller form factor.'
                },
                {
                    question: 'What protocol does the DS18B20 temperature sensor use?',
                    options: [
                        'I2C (two wires: SDA and SCL)',
                        'SPI (four wires: MOSI, MISO, SCK, CS)',
                        'OneWire (single data wire plus power and ground)',
                        'UART serial (TX and RX lines)'
                    ],
                    explanation: 'The DS18B20 uses the OneWire protocol, which allows communication over a single data wire (plus VCC and GND). Each DS18B20 has a unique 64-bit address burned into the chip at the factory, so you can connect multiple sensors to the same single data pin and address them individually. The protocol requires a 4.7k pull-up resistor on the data line. The DS18B20 provides digital temperature readings with +/- 0.5C accuracy over a range of -55C to +125C, with configurable resolution from 9 to 12 bits. The OneWire and DallasTemperature libraries handle all the protocol details. This is different from I2C (which uses two wires: SDA and SCL) and SPI (which uses four wires).'
                },
                {
                    question: 'What is the key difference between the DHT11 and DHT22 sensors?',
                    options: [
                        'DHT11 uses I2C while DHT22 uses SPI',
                        'DHT22 has wider range and better accuracy than DHT11',
                        'DHT11 measures humidity while DHT22 only measures temperature',
                        'DHT22 requires 3.3V while DHT11 requires 5V'
                    ],
                    explanation: 'Both the DHT11 and DHT22 measure temperature and humidity using the same single-wire custom protocol and the same DHT library. The difference is in specifications. The DHT11 has a temperature range of 0-50C with +/- 2C accuracy and a humidity range of 20-80%. The DHT22 has a wider temperature range of -40C to 80C with +/- 0.5C accuracy and a full humidity range of 0-100%. The DHT22 is more precise and versatile but slightly more expensive and slower (one reading every 2 seconds vs one per second for the DHT11). Both sensors work with 3.3V or 5V. For learning projects, either works. For accuracy-critical applications, the DHT22 is the better choice.'
                },
                {
                    question: 'How does the MFRC522 RFID reader communicate with the Arduino?',
                    options: [
                        'Via analog voltage on a single pin',
                        'Via I2C using SDA and SCL',
                        'Via SPI using MOSI, MISO, SCK, and SS pins',
                        'Via UART serial on TX and RX'
                    ],
                    explanation: 'The MFRC522 RFID reader communicates with the Arduino via SPI (Serial Peripheral Interface). It uses four SPI lines: MOSI (Master Out Slave In, pin 11), MISO (Master In Slave Out, pin 12), SCK (Serial Clock, pin 13), and SS (Slave Select, typically pin 10). It also requires a RST (reset) pin and power connections. The SPI bus is fast, supporting up to 10 MHz clock speeds. The MFRC522 library handles all SPI communication. The module generates a 13.56 MHz electromagnetic field to power and communicate with passive RFID tags. When a tag enters the field, its UID (Unique Identifier) is transmitted back to the reader via the RF link, and the reader passes the data to the Arduino over SPI.'
                },
                {
                    question: 'Why does a rotary encoder require hardware interrupts for reliable reading?',
                    options: [
                        'Interrupts provide power to the encoder circuit',
                        'The encoder outputs analog signals that need interrupt-based ADC',
                        'At high rotation speeds, polling in loop() will miss pulses',
                        'Interrupts are needed to decode the I2C protocol the encoder uses'
                    ],
                    explanation: 'A rotary encoder outputs digital pulses on two channels (A and B) as the shaft rotates. At high speeds, these pulses can be extremely short -- microseconds apart. If you rely on polling (checking the pin state with digitalRead() inside loop()), any delay in the loop from Serial.print, sensor reads, or other processing will cause missed pulses, leading to inaccurate position tracking. Hardware interrupts fire immediately when a pin changes state, regardless of what the main loop is doing. On the Arduino Uno, pin 2 (INT0) and pin 3 (INT1) support external interrupts. Using attachInterrupt() on these pins ensures every encoder pulse is captured. The interrupt service routine (ISR) must be fast -- no Serial calls, no delay(), just increment or decrement a volatile counter.'
                },
                {
                    question: 'On the Arduino Uno, which pins support external hardware interrupts?',
                    options: [
                        'Any digital pin (0-13)',
                        'Only analog pins (A0-A5)',
                        'Pin 2 (INT0) and Pin 3 (INT1)',
                        'Pins 10, 11, 12, and 13 (SPI pins)'
                    ],
                    explanation: 'The Arduino Uno has exactly two external interrupt pins: pin 2 (INT0) and pin 3 (INT1). These are the only pins that can trigger an interrupt service routine (ISR) via attachInterrupt(). When the voltage on these pins changes (RISING, FALLING, CHANGE, or LOW), the ATmega328P immediately pauses the main program, executes the ISR, and then resumes. This hardware-level response is what makes interrupts reliable for time-critical signals like encoder pulses. The Arduino Mega has six external interrupt pins (2, 3, 18, 19, 20, 21), giving it much more flexibility. Pin Change Interrupts (PCINT) can be used on other pins but require additional library support and are less straightforward.'
                },
                {
                    question: 'What format does a GPS module like the NEO-6M output data in?',
                    options: [
                        'Binary packets with latitude and longitude as 32-bit floats',
                        'JSON objects over I2C',
                        'NMEA-0183 text sentences over serial',
                        'XML formatted position data over SPI'
                    ],
                    explanation: 'GPS modules output data in NMEA-0183 format, which consists of human-readable ASCII text sentences transmitted over a serial connection (UART). Each sentence begins with a $ sign and a talker/sentence ID. The most important sentences are $GPGGA (fix data including position, altitude, and satellite count) and $GPRMC (recommended minimum data including position, speed, and heading). For example: $GPGGA,123519,4807.038,N,01131.000,E,1,08,0.9,545.4,M,47.0,M,,*47. The TinyGPS++ library parses these raw text strings into usable float values for latitude, longitude, altitude, speed, and more. The NEO-6M communicates at 9600 baud by default via serial TX/RX lines.'
                },
                {
                    question: 'Why should you use SoftwareSerial (not pins 0 and 1) for the GPS module?',
                    options: [
                        'Pins 0 and 1 do not support serial communication',
                        'SoftwareSerial provides faster baud rates than hardware serial',
                        'Pins 0 and 1 are the hardware serial lines used for USB debugging, and sharing them causes conflicts',
                        'The GPS module requires inverted serial logic that only SoftwareSerial supports'
                    ],
                    explanation: 'Pins 0 (RX) and 1 (TX) on the Arduino Uno are the hardware serial lines connected to the USB-to-serial chip. They are used for uploading sketches and for Serial Monitor communication (Serial.begin(), Serial.println()). If you connect the GPS module to these same pins, the GPS data stream will interfere with sketch uploads and debugging output. SoftwareSerial creates a virtual serial port on any two digital pins (for example, 4 and 3), keeping the hardware serial free for USB communication. This lets you simultaneously receive GPS data on the SoftwareSerial pins and print parsed coordinates to the Serial Monitor for debugging. The trade-off is that SoftwareSerial is less reliable at very high baud rates, but 9600 baud (the GPS default) works fine.'
                },
                {
                    question: 'What is the purpose of a voltage divider circuit when using resistive sensors like an LDR or thermistor?',
                    options: [
                        'To amplify the weak signal from the sensor',
                        'To convert the sensor resistance change into a voltage change that analogRead() can measure',
                        'To protect the Arduino from overvoltage damage',
                        'To filter out electrical noise from the sensor'
                    ],
                    explanation: 'Resistive sensors like LDRs and thermistors change their resistance in response to physical conditions, but the Arduino cannot directly measure resistance -- it can only measure voltage using its ADC via analogRead(). A voltage divider converts the resistance change into a proportional voltage change. The formula is Vout = Vin * (R2 / (R1 + R2)), where R1 is the sensor and R2 is a fixed reference resistor. As the sensor resistance changes, the voltage at the midpoint changes, and analogRead() captures this as a value between 0 and 1023. The fixed resistor value is chosen to match the sensor range -- typically 10k for both LDRs and thermistors. This is the most fundamental analog sensor circuit pattern in electronics.'
                }
            ]
        });
        quiz.start();
    </script>
