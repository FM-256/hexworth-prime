    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 9: Sound & Audio',
            description: 'Test your understanding of the tone() function, melodies, multi-tone limitations, PWM audio, MIDI protocol, audio synthesis, sound detection, and practical audio applications.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-09-quiz',
            moduleId: 'pc-ard-09-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does the tone(pin, frequency) function generate?',
                    options: [
                        'A sine wave at the specified frequency',
                        'A square wave at the specified frequency on the given digital pin',
                        'An analog voltage proportional to the frequency',
                        'A PWM signal with duty cycle equal to the frequency'
                    ],
                    explanation: 'tone(pin, frequency) generates a 50% duty cycle square wave at the specified frequency in Hertz on the given digital pin. The square wave alternates between 0V and 5V (on a 5V Arduino) at the precise frequency you specify. This is the simplest form of sound generation: the rapid toggling of voltage creates pressure waves in a connected piezo buzzer or speaker. The square wave timbre sounds "buzzy" or "electronic" compared to a sine wave because it contains odd harmonics (3rd, 5th, 7th, etc.) in addition to the fundamental frequency. The function uses Timer2 internally, which means it affects PWM output on pins 3 and 11 while a tone is playing. Only one tone can be active at a time across all pins.'
                },
                {
                    question: 'What is the difference between tone(8, 440) and tone(8, 440, 500)?',
                    options: [
                        'The first plays at half volume; the second at full volume',
                        'The first plays on digital pin 8; the second plays on analog pin 8',
                        'The first plays indefinitely until noTone() is called; the second stops automatically after 500 milliseconds',
                        'The first plays at 440 Hz; the second plays at 440 Hz with 500 Hz modulation'
                    ],
                    explanation: 'tone(8, 440) starts a continuous 440 Hz square wave on pin 8 that plays indefinitely until you explicitly call noTone(8). tone(8, 440, 500) plays the same 440 Hz tone but automatically stops after 500 milliseconds. In both cases, the function returns immediately -- it does NOT block execution. This is a critical detail: if you call tone(8, 440, 500) followed by tone(8, 880, 500), the second call happens almost instantly and overrides the first. To create a sequence of notes with audible gaps, you must add delay() between tone() calls. The duration parameter is convenient for simple beeps but requires careful timing management for melodies.'
                },
                {
                    question: 'Why does tone() affect PWM on pins 3 and 11?',
                    options: [
                        'Because tone() disables all PWM output on the Arduino',
                        'Because tone() uses Timer2 internally, which is the same timer that generates PWM on pins 3 and 11',
                        'Because pins 3 and 11 are physically connected to the speaker output',
                        'Because the Arduino cannot handle audio and PWM simultaneously due to processor limitations'
                    ],
                    explanation: 'The ATmega328P has three hardware timers: Timer0, Timer1, and Timer2. The tone() function uses Timer2 to generate the precise square wave frequency. Timer2 is also the timer responsible for generating PWM (analogWrite) output on pins 3 and 11. When tone() reconfigures Timer2 for audio frequency generation, it overrides the PWM configuration, causing analogWrite() on pins 3 and 11 to stop working correctly. Pins 5, 6, 9, and 10 use Timer0 and Timer1, so their PWM is unaffected. This is a hardware-level resource conflict, not a software bug. If you need both tone and PWM, use PWM pins that are not on Timer2 (5, 6, 9, 10).'
                },
                {
                    question: 'How are melodies typically stored in Arduino code?',
                    options: [
                        'As MP3 files on an SD card',
                        'As two arrays: one for note frequencies (Hz) and one for note durations',
                        'As a single string of musical notation',
                        'As WAV file data embedded in program memory'
                    ],
                    explanation: 'The standard approach for Arduino melodies is two parallel arrays: a melody array containing note frequencies in Hertz (e.g., 262 for C4, 440 for A4), and a durations array containing note length values (e.g., 4 for quarter note, 2 for half note, 8 for eighth note). A loop iterates through both arrays simultaneously, calling tone() with each frequency and calculating the actual duration in milliseconds as 1000/duration. A REST note (frequency = 0) creates silence. The 30% gap multiplier (delay(noteDuration * 1.3)) provides articulation between notes so they sound distinct rather than running together. The pitches.h header file included with Arduino IDE examples provides #define constants for all standard musical note frequencies.'
                },
                {
                    question: 'Why can Arduino\'s tone() function NOT play chords (multiple simultaneous notes)?',
                    options: [
                        'Because the speaker can only vibrate at one frequency',
                        'Because tone() uses a single hardware timer and can only generate one frequency at a time on one pin',
                        'Because the Arduino does not have enough memory for multiple waveforms',
                        'Because chords require analog output, which Arduino does not have'
                    ],
                    explanation: 'tone() is limited to one active tone at a time because it uses a single hardware timer (Timer2) to generate the square wave. When you call tone() on any pin, it reconfigures Timer2 for that specific frequency. Calling tone() on a second pin immediately overrides the first -- the timer cannot run at two frequencies simultaneously. This is a hardware limitation, not a software one. Workarounds include: rapid alternation between two frequencies (crude but audible), using the Mozzi library which bypasses tone() entirely and does software synthesis, using multiple piezo buzzers with direct port manipulation and different timers, or using the Tone.h library which supports multiple simultaneous tones by leveraging multiple hardware timers.'
                },
                {
                    question: 'What is the standard baud rate for MIDI communication?',
                    options: [
                        '9600',
                        '115200',
                        '31250',
                        '19200'
                    ],
                    explanation: 'MIDI uses a serial baud rate of 31250 bits per second. This is a unique rate not used by any other common serial protocol, which is why Serial.begin(31250) is required instead of the typical 9600 or 115200. The rate was chosen in the early 1980s because it divides evenly from a 1 MHz clock (1,000,000 / 32 = 31,250), making it easy to implement in the hardware of that era. At 31250 baud with 8 data bits, 1 start bit, and 1 stop bit (10 bits per byte), MIDI can transmit approximately 3125 bytes per second. Since a Note On message is 3 bytes, the system can handle over 1000 note events per second -- more than fast enough for any musical performance.'
                },
                {
                    question: 'What are the three bytes in a MIDI Note On message?',
                    options: [
                        'Channel, frequency, duration',
                        'Status byte (0x90 + channel), note number (0-127), velocity (0-127)',
                        'Note name, octave number, volume percentage',
                        'Pin number, waveform type, amplitude'
                    ],
                    explanation: 'A MIDI Note On message consists of exactly three bytes. The first byte is the status byte: 0x90 OR\'d with the channel number (0-15), giving a range of 0x90 to 0x9F. The second byte is the note number from 0 to 127, where 60 is middle C (C4), 69 is A4 (440 Hz), and each increment is one semitone. The third byte is velocity from 0 to 127, representing how hard the key was struck (which typically maps to volume on the receiving synthesizer). A velocity of 0 is often treated as Note Off by many devices. The corresponding Note Off message uses 0x80 as the status byte base, with the same note number and a velocity byte (usually 0). This three-byte structure is the same for all MIDI channel messages.'
                },
                {
                    question: 'What is a MIDI Control Change (CC) message used for?',
                    options: [
                        'Changing the MIDI baud rate during communication',
                        'Sending continuous controller values like knob positions, slider levels, and button states (0-127)',
                        'Changing the physical wiring of the MIDI connection',
                        'Correcting errors in previously sent MIDI messages'
                    ],
                    explanation: 'MIDI Control Change (CC) messages transmit continuous parameter values for knobs, sliders, pedals, and buttons. The status byte is 0xB0 + channel, followed by the CC number (0-127) identifying which controller, and the value (0-127). Common CC numbers include: CC#1 (Mod Wheel), CC#7 (Channel Volume), CC#10 (Pan), CC#64 (Sustain Pedal). In Arduino projects, you typically read a potentiometer with analogRead() (0-1023), map it to 0-127, and send it as a CC message. This lets you build custom MIDI controllers: rotary knobs, faders, ribbon controllers, and pressure-sensitive pads that control parameters in DAWs like Ableton Live, Logic Pro, or FL Studio. The 128-value resolution (7 bits) is sufficient for most musical parameter control.'
                },
                {
                    question: 'What is the Mozzi library\'s two-callback architecture?',
                    options: [
                        'setup() for initialization and loop() for audio processing',
                        'updateControl() runs at a slow rate for sensor reading, and updateAudio() runs at the audio sample rate for generating samples',
                        'begin() initializes audio hardware and process() handles MIDI messages',
                        'render() creates waveforms and output() sends them to the speaker'
                    ],
                    explanation: 'Mozzi separates audio processing into two callbacks running at different rates. updateControl() runs at 64 Hz by default (configurable) and is where you read sensors, update oscillator frequencies, adjust filter parameters, and handle user input. This slow rate is fine for controls and keeps the function lightweight. updateAudio() runs at the audio sample rate (16384 Hz by default on ATmega328P) and must return the next audio sample value as quickly as possible. Any delay or complex computation in updateAudio() causes audible glitches (clicks, pops, dropouts). This two-rate design is the key to Mozzi\'s success: it allows real-time sensor interaction without disrupting glitch-free audio output, all on an 8-bit microcontroller with only 2KB of RAM.'
                },
                {
                    question: 'What type of waveform does wavetable synthesis use?',
                    options: [
                        'Random noise generated by a hardware entropy source',
                        'A single cycle of a waveform stored in a lookup table, read at a rate determined by the desired frequency',
                        'A continuous analog waveform generated by a DAC',
                        'A series of MIDI messages interpreted by an external synthesizer'
                    ],
                    explanation: 'Wavetable synthesis stores exactly one complete cycle of a waveform (sine, sawtooth, triangle, square, or custom) as an array of amplitude values in memory. For example, a 256-element sine table contains one full cycle of a sine wave sampled at 256 points. An oscillator object steps through this table at a rate determined by the desired output frequency: higher frequency = larger step size per audio sample, lower frequency = smaller step size. When the oscillator reaches the end of the table, it wraps around to the beginning, creating a continuous periodic waveform. This is extremely efficient -- no trigonometric functions or complex math at audio rate. Multiple oscillators can read from different wavetables (or the same table at different rates) and be summed together for complex timbres.'
                },
                {
                    question: 'How does a piezo buzzer differ from a speaker?',
                    options: [
                        'A piezo uses a ceramic disc that deforms under voltage; a speaker uses an electromagnetic driver with a cone that moves air',
                        'A piezo can play any frequency; a speaker can only play frequencies below 1 kHz',
                        'A piezo requires an amplifier; a speaker can be driven directly',
                        'There is no functional difference -- they are the same component'
                    ],
                    explanation: 'A piezo buzzer uses the piezoelectric effect: a ceramic disc physically bends when voltage is applied, producing a click. Rapidly toggling the voltage at audio frequencies creates tones. Passive piezo buzzers require an external signal (from tone()), while active buzzers have a built-in oscillator that produces a fixed tone when voltage is applied. Piezos are small, cheap, and efficient but have a narrow frequency response and limited volume. Speakers use electromagnetic principles: current through a coil creates a magnetic field that moves a cone, pushing air. Speakers have wider frequency response, higher volume, and better audio quality. They can be driven directly from an Arduino pin for quiet output, or through an amplifier (like PAM8403) for louder volume. For Arduino projects, piezos are ideal for simple beeps and alerts; speakers are better for melodies and audio synthesis.'
                },
                {
                    question: 'What does an analog sound sensor module output?',
                    options: [
                        'A digital HIGH/LOW signal that toggles at the audio frequency',
                        'An analog voltage proportional to the ambient sound level, centered around the midpoint (roughly 512 on a quiet room)',
                        'A serial data stream containing decoded audio information',
                        'A PWM signal whose duty cycle represents the sound frequency'
                    ],
                    explanation: 'Analog sound sensor modules (like the KY-038 or MAX4466) contain an electret microphone and a preamplifier. The output is an analog voltage that corresponds to the instantaneous sound pressure level. In a quiet room, the output sits near the midpoint of the ADC range (approximately 512 on a 10-bit Arduino ADC reading 0-1023). When sound occurs, the signal swings above and below this midpoint proportionally to the sound amplitude. Loud sounds create larger swings (higher peaks and lower valleys). For simple applications like clap detection, you can compare analogRead() against a threshold (e.g., 600). For volume measurement, sample rapidly and calculate the peak-to-peak amplitude over a window. The MAX4466 module has adjustable gain, making it more versatile than the basic KY-038 for varying loudness environments.'
                },
                {
                    question: 'Why is a 300ms delay used after detecting a clap in a clap-detection program?',
                    options: [
                        'To save power between readings',
                        'To debounce -- a single clap produces multiple threshold crossings from echoes and reverberations that should be ignored',
                        'To allow the microphone to cool down after detecting a loud sound',
                        'To synchronize the detection with the Arduino\'s clock cycle'
                    ],
                    explanation: 'A single clap produces a sharp initial sound followed by echoes, reflections off walls, and the natural decay of the acoustic energy. The analog sound sensor will read above the threshold multiple times during this period -- first from the direct sound, then from reflections arriving milliseconds later. Without a debounce delay, the program would register multiple "claps" from a single physical clap. The 300ms delay after detection gives the echoes time to die out before the program starts listening again. This is conceptually identical to button debouncing but applied to acoustic signals. The ideal delay depends on the room size and acoustics: small rooms with hard walls need longer delays (300-500ms), while open areas or sound-dampened rooms can use shorter delays (150-200ms).'
                },
                {
                    question: 'What is Direct Digital Synthesis (DDS) in the context of Arduino audio?',
                    options: [
                        'A method of recording audio directly to digital storage',
                        'A technique that generates waveforms mathematically using a phase accumulator stepping through a wavetable, output via high-speed PWM',
                        'A protocol for streaming digital audio over USB',
                        'A hardware module that converts analog audio to digital signals'
                    ],
                    explanation: 'Direct Digital Synthesis (DDS) generates arbitrary waveforms purely through digital computation. The core components are: a wavetable (one cycle of the desired waveform stored as amplitude values), a phase accumulator (a counter that tracks the current position in the wavetable), and a tuning word (the step size added to the phase accumulator each sample period). The tuning word determines the output frequency: larger steps = higher frequency. Each sample period, the phase accumulator advances, the corresponding wavetable value is read, and that value is output via high-speed PWM (configured to 31 kHz or 62 kHz so the carrier frequency is inaudible). An RC low-pass filter on the output pin smooths the PWM into a clean analog waveform. This is how Mozzi and similar libraries produce audio quality far beyond what tone() can achieve.'
                },
                {
                    question: 'What makes a good audio feedback design for embedded systems?',
                    options: [
                        'Continuous tones that play as long as an event is active',
                        'Brief, distinct tones mapped to specific meanings -- a rising tone for success, a low buzz for error, a click for acknowledgment',
                        'Playing the same melody for every type of event',
                        'Maximum volume at all times to ensure the user notices the feedback'
                    ],
                    explanation: 'Effective audio feedback follows the principle of being brief, distinct, and semantically mapped. Each sound should convey a specific meaning without demanding excessive attention. A short rising two-tone sequence for "success" or "confirmed." A low, brief buzz or descending tone for "error" or "denied." A single click for "input received." A rapid beeping pattern for "warning" or "attention needed." Long, loud, or repetitive tones cause user fatigue and annoyance -- like a car alarm that everyone ignores. The best audio interfaces are like a well-designed notification system: they inform without interrupting. For sensor feedback (like a parking sensor), the beep rate should scale smoothly with the measured value, transitioning to a continuous tone only at the critical threshold. This gives the user intuitive, real-time spatial awareness through sound alone.'
                }
            ]
        });
        quiz.start();
    </script>
