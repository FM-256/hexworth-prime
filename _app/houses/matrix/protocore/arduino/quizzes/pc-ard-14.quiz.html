    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 14: Wireless Communication',
            description: 'Test your knowledge of 433MHz modules, XBee, ZigBee mesh networking, Bluetooth Classic, BLE, and wireless security.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-14-quiz',
            moduleId: 'pc-ard-14-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What modulation scheme do cheap 433MHz TX/RX module pairs typically use?',
                    options: [
                        'ASK (Amplitude Shift Keying)',
                        'QAM-256 (Quadrature Amplitude Modulation)',
                        'OFDM (Orthogonal Frequency Division Multiplexing)',
                        'PSK (Phase Shift Keying)'
                    ],
                    explanation: 'Cheap 433MHz modules use ASK (Amplitude Shift Keying), the simplest form of digital modulation. ASK works by turning the carrier signal on and off to represent binary 1s and 0s -- the transmitter either sends a signal (1) or stays silent (0). This is also called OOK (On-Off Keying). ASK is extremely cheap to implement in hardware, which is why 433MHz TX/RX pairs cost under $1 each. The downside is poor noise immunity -- any electromagnetic interference that matches the carrier frequency can be misinterpreted as data. The VirtualWire library mitigates this with Manchester encoding and CRC error detection, but the fundamental weakness of ASK remains. More sophisticated modulation schemes like FSK or spread spectrum provide better noise rejection but require more expensive radio chips.'
                },
                {
                    question: 'Which Arduino library is commonly used with 433MHz ASK modules for reliable data transmission?',
                    options: [
                        'VirtualWire',
                        'WiFiNINA',
                        'PubSubClient',
                        'Ethernet'
                    ],
                    explanation: 'VirtualWire is the standard library for 433MHz ASK modules. It provides Manchester encoding (each bit is represented by a transition, improving clock recovery), a preamble sequence for synchronization, length byte, payload, and CRC checksum for error detection. Without VirtualWire, raw ASK transmission is unreliable -- noise triggers false data constantly. VirtualWire handles timing, encoding, and error checking so you can send and receive byte arrays with reasonable confidence. The library supports data rates up to about 4000 bps. Its successor, RadioHead, offers similar functionality with support for additional radio modules (nRF24L01, LoRa, RFM69). For basic 433MHz TX/RX pairs, VirtualWire remains the simplest starting point.'
                },
                {
                    question: 'What is the key difference between XBee AT mode and XBee API mode?',
                    options: [
                        'AT mode is transparent serial; API mode uses structured frames with addressing and checksums',
                        'AT mode is faster; API mode is slower but more secure',
                        'AT mode requires firmware updates; API mode works out of the box',
                        'AT mode supports mesh; API mode only supports point-to-point'
                    ],
                    explanation: 'In AT mode (transparent mode), the XBee acts as a wireless serial cable. Data sent to the XBee serial port comes out the other XBee serial port -- no framing, no addressing in code. Configuration is done with AT commands (entering command mode with "+++"). This is the simplest approach for point-to-point links. In API mode, every transmission is wrapped in a structured frame with a start delimiter (0x7E), length, frame type, payload, and checksum. API mode enables addressing specific nodes by their 16-bit or 64-bit address, receiving delivery status confirmations, reading signal strength (RSSI), sending remote AT commands to configure distant nodes, and receiving data with source address information. API mode is more complex to program but essential for multi-node sensor networks where you need to know who sent what and whether it was delivered.'
                },
                {
                    question: 'In a ZigBee mesh network, which device role forms the network and assigns addresses?',
                    options: [
                        'Coordinator',
                        'Router',
                        'End Device',
                        'Gateway'
                    ],
                    explanation: 'The Coordinator is the foundation of every ZigBee network. There is exactly one coordinator per network. It performs three critical functions: (1) it forms the PAN (Personal Area Network) by selecting a channel and PAN ID, (2) it assigns short 16-bit network addresses to devices that join, and (3) it maintains the network routing tables. The coordinator must be always powered on -- it cannot enter sleep mode because other devices depend on it for network management. Routers relay messages between nodes, extending range and providing redundant paths for self-healing. End devices are the sensors and actuators that can sleep to conserve power but can only communicate through their parent router. A "gateway" is not a standard ZigBee role -- it is typically a coordinator connected to a computer or cloud service.'
                },
                {
                    question: 'Why is a level shifter or voltage divider needed between an Arduino Uno and an XBee module?',
                    options: [
                        'XBee uses 3.3V logic and the Uno outputs 5V, which can damage the XBee',
                        'XBee requires 12V to transmit at full power',
                        'The Uno SPI bus runs at a different clock speed than XBee',
                        'XBee modules use differential signaling that the Uno cannot generate'
                    ],
                    explanation: 'XBee modules operate on 3.3V logic. The Arduino Uno outputs 5V on its digital pins, including the TX (serial transmit) pin. Connecting the Uno TX directly to the XBee RX pin applies 5V to a 3.3V input, which exceeds the XBee absolute maximum voltage rating and will damage or destroy the module over time. A voltage divider (two resistors, e.g., 1K and 2K) or a dedicated level shifter converts the 5V signal down to 3.3V safely. The XBee TX to Arduino RX direction is generally safe because 3.3V is above the ATmega328P HIGH threshold (approximately 2.6V at 5V VCC). Some XBee Explorer/Shield boards include built-in level shifting, handling this automatically. Always check the voltage requirements before connecting any 3.3V module to a 5V Arduino.'
                },
                {
                    question: 'What is the HC-05 Bluetooth module capable of that the HC-06 is not?',
                    options: [
                        'Acting as a Bluetooth master (initiating connections)',
                        'Transmitting data over serial',
                        'Pairing with smartphones',
                        'Operating at 9600 baud'
                    ],
                    explanation: 'The HC-05 can operate as either a Bluetooth master or slave, while the HC-06 is slave-only. In slave mode, a device waits for incoming connections -- a phone or computer must initiate the pairing. In master mode, the HC-05 can actively scan for and connect to other Bluetooth devices, including other HC-05/06 modules. This makes the HC-05 essential for Arduino-to-Arduino Bluetooth communication where one side must initiate the connection. The HC-06 is simpler and slightly cheaper, making it the better choice for projects where the phone always initiates the connection. Both modules support the Serial Port Profile (SPP), both can pair with smartphones, and both default to 9600 baud. The HC-05 has more AT commands for configuration (setting role, baud rate, inquiry mode) and can enter AT command mode by holding a button during power-on.'
                },
                {
                    question: 'In BLE (Bluetooth Low Energy), what does GATT stand for and what does it define?',
                    options: [
                        'Generic Attribute Profile -- defines how BLE devices exchange data using services and characteristics',
                        'Global Access Transmission Technology -- defines BLE radio frequencies',
                        'General Authentication Trust Token -- defines BLE security handshakes',
                        'Gateway Aggregation Transfer Table -- defines BLE mesh routing'
                    ],
                    explanation: 'GATT (Generic Attribute Profile) is the framework that defines how BLE devices structure and exchange data. It organizes data into a hierarchy: a device exposes one or more Services, each identified by a UUID. Within each service are Characteristics -- individual data points with their own UUIDs, values, and properties (read, write, notify, indicate). For example, a BLE temperature sensor might expose an "Environmental Sensing" service (UUID 0x181A) containing a "Temperature" characteristic (UUID 0x2A6E) with a value of 2350 (23.50 degrees in hundredths). The client (phone app) discovers services and characteristics, then reads values, writes commands, or subscribes to notifications. GATT replaced the streaming model of Classic Bluetooth with a structured, attribute-based model optimized for small, infrequent data transfers -- perfect for sensors, beacons, and wearables.'
                },
                {
                    question: 'What is the primary advantage of BLE over Bluetooth Classic for battery-powered sensors?',
                    options: [
                        'BLE transmits in short bursts and sleeps between them, enabling months of operation on a coin cell',
                        'BLE has a longer range than Classic Bluetooth',
                        'BLE supports higher data rates than Classic Bluetooth',
                        'BLE is compatible with older phones that do not support Classic Bluetooth'
                    ],
                    explanation: 'BLE (Bluetooth Low Energy) was designed from the ground up for ultra-low power consumption. It transmits data in very short bursts (often just microseconds) and then returns to a deep sleep state where it draws only microamps of current. A CR2032 coin cell battery can power a BLE sensor for months or even years, depending on how frequently it transmits. Classic Bluetooth maintains a continuous connection and draws tens of milliamps constantly, which would drain a coin cell in hours. The tradeoff is data throughput -- BLE sends small packets infrequently (sensor readings, button presses), while Classic Bluetooth can stream continuous data (audio, serial port emulation). BLE does not have longer range or higher data rates than Classic. In fact, Classic Bluetooth typically has higher throughput. The power advantage is what makes BLE the standard for IoT sensors, fitness trackers, beacons, and medical devices.'
                },
                {
                    question: 'What is a replay attack in the context of wireless communication?',
                    options: [
                        'An attacker records a valid wireless command and retransmits it later to repeat the action',
                        'An attacker replays music over the wireless channel to cause interference',
                        'An attacker forces the wireless module to restart by sending a reset command',
                        'An attacker captures the encryption key by replaying the pairing process'
                    ],
                    explanation: 'A replay attack occurs when an attacker captures a legitimate wireless transmission (e.g., an "unlock door" command) using a receiver or software-defined radio, then retransmits the exact same signal later to repeat the action without authorization. If the system has no protection against replays -- no timestamps, no sequence numbers, no rolling codes -- the receiver cannot distinguish a replayed message from a fresh one. This is how $30 devices can clone and replay garage door opener signals, car key fobs (older models), and any 433MHz-based system that transmits fixed commands. Defenses include: rolling codes (each valid code is used only once), timestamps with expiration windows, incrementing sequence numbers that the receiver tracks, and challenge-response protocols where the receiver sends a random nonce that must be included in the command. For Arduino 433MHz projects, you must implement these defenses yourself since the radio modules have no built-in security.'
                },
                {
                    question: 'What encryption standard does ZigBee use at the network layer?',
                    options: [
                        '128-bit AES',
                        'RSA-2048',
                        'Triple DES',
                        'WPA2-PSK'
                    ],
                    explanation: 'ZigBee uses 128-bit AES (Advanced Encryption Standard) for network-layer encryption. Every frame transmitted over the air is encrypted with a shared network key, preventing eavesdropping and tampering. The network key is distributed by the Trust Center (typically the coordinator) when a device joins the network. AES-128 is a symmetric block cipher -- the same key encrypts and decrypts, and it operates on 128-bit (16-byte) blocks. It is computationally efficient enough to run on the limited processors in ZigBee radio chips. The security model includes frame counters to prevent replay attacks and message integrity codes (MIC) to detect tampering. In contrast, 433MHz modules have no encryption at all, and Bluetooth Classic uses its own encryption scheme separate from AES. ZigBee security, while not impenetrable (the key distribution phase is a known weak point), provides a significant baseline that is absent from simpler wireless technologies.'
                },
                {
                    question: 'What is the approximate outdoor line-of-sight range of a standard XBee Pro module?',
                    options: [
                        'Up to 1.6 km',
                        'Up to 10 meters',
                        'Up to 50 meters',
                        'Up to 10 km'
                    ],
                    explanation: 'XBee Pro modules are the high-power variants of the Digi XBee family, offering up to approximately 1.6 km (1 mile) of line-of-sight range outdoors. Standard XBee modules (non-Pro) have a range of about 100 meters outdoors. The Pro version achieves greater range by using a higher transmit power output (60 mW / 18 dBm vs. 1 mW / 0 dBm for standard). Indoor range is significantly less -- typically 100-300 meters for Pro, 30-40 meters for standard -- due to walls, furniture, and other obstacles attenuating the 2.4 GHz signal. Range also depends heavily on the antenna type: chip antennas have the shortest range, wire antennas are moderate, and external dipole or Yagi antennas can extend range significantly. For range beyond 1.6 km, mesh networking with intermediate routers or technologies like LoRa (2-15 km) are more appropriate.'
                },
                {
                    question: 'Which AT command sequence puts an HM-10 BLE module into a state where a phone app can discover and connect to it?',
                    options: [
                        'AT+NAMEMySensor followed by AT+ROLE0 (peripheral mode is the default advertising state)',
                        'AT+SCAN1 followed by AT+CONNECT',
                        'AT+MASTER followed by AT+INQ',
                        'AT+PAIR followed by AT+BOND'
                    ],
                    explanation: 'The HM-10 BLE module advertises by default when in peripheral (slave) role, which is Role 0. The command AT+ROLE0 sets the module to peripheral mode (this is the default, so it may already be set). AT+NAMEMySensor sets the device name that appears in BLE scans on the phone. Once powered on in peripheral mode, the HM-10 automatically begins advertising its presence by broadcasting advertising packets containing the device name, service UUID, and other information. A phone app like nRF Connect or LightBlue can then discover the device by scanning for BLE peripherals. After the phone connects, the HM-10 LED changes from blinking (advertising) to solid (connected), and bidirectional data transfer begins via the 0xFFE1 characteristic. The other options describe Bluetooth Classic operations or operations that do not apply to BLE peripheral setup.'
                },
                {
                    question: 'When choosing a wireless technology for an Arduino project, which factor most strongly favors BLE over Bluetooth Classic?',
                    options: [
                        'The device runs on batteries and sends small sensor readings infrequently',
                        'The device needs to stream audio continuously',
                        'The device must communicate with legacy Bluetooth 2.0 devices',
                        'The device needs sustained data transfer rates above 1 Mbps'
                    ],
                    explanation: 'BLE is the clear winner when a device is battery-powered and sends small, infrequent data packets. BLE was specifically designed for this use case -- it transmits in microsecond bursts, spends most of its time in deep sleep drawing microamps, and can operate for months on a coin cell. Bluetooth Classic is better suited for continuous data streaming (audio via A2DP, serial data via SPP) and communication with older devices that only support Classic Bluetooth (pre-4.0). Classic Bluetooth also achieves higher sustained throughput (up to 2-3 Mbps vs. BLE theoretical max around 1 Mbps, with real-world BLE throughput often much lower). The decision matrix for wireless technology starts with: what is the power source, how much data, and how often? If the answer is "battery, small packets, infrequently," BLE wins every time.'
                },
                {
                    question: 'What is the VirtualWire function that blocks until the current message transmission is complete?',
                    options: [
                        'vw_wait_tx()',
                        'vw_send_complete()',
                        'vw_flush()',
                        'vw_block_until_done()'
                    ],
                    explanation: 'vw_wait_tx() is a blocking function that pauses program execution until the VirtualWire library finishes transmitting the current message. After calling vw_send() to queue a message for transmission, the actual RF transmission happens asynchronously using a timer interrupt. If you immediately send another message or modify the buffer, you could corrupt the transmission. vw_wait_tx() ensures the previous transmission is complete before proceeding. The typical pattern is: build message, call vw_send(), call vw_wait_tx(), then delay() before the next reading. This is important because 433MHz ASK modules are half-duplex -- they cannot transmit and receive simultaneously, and the transmitter needs the full data buffer to remain stable during the entire transmission period.'
                },
                {
                    question: 'Why is a 433MHz wireless link considered insecure by default?',
                    options: [
                        'It has no encryption, no authentication, and no replay protection -- all data is transmitted in plaintext',
                        'It uses the 433MHz frequency which is banned in most countries',
                        'Its range is too short to be useful for secure applications',
                        'The VirtualWire library intentionally disables encryption for performance'
                    ],
                    explanation: '433MHz ASK modules transmit data in plaintext with zero built-in security. There is no encryption (anyone with a receiver or $20 RTL-SDR dongle can read every byte), no authentication (the receiver accepts data from any transmitter on the same frequency), and no replay protection (captured transmissions can be retransmitted verbatim). The VirtualWire library adds CRC for error detection but not for security -- it detects accidental corruption, not malicious tampering. To secure a 433MHz link, you must implement encryption yourself in the Arduino code. This typically means encrypting the payload with AES-128 (using a shared secret key), adding a rolling counter or timestamp to prevent replay attacks, and including a message authentication code (HMAC) to detect tampering. Without these measures, 433MHz is suitable only for non-sensitive data like weather sensor readings where interception has no security impact.'
                }
            ]
        });
        quiz.start();
    </script>
