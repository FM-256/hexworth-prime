    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 7: LEDs & Visual Output',
            description: 'Test your understanding of LED circuits, PWM brightness, RGB color mixing, matrices, 7-segment displays, shift registers, Charlieplexing, and the MAX7219 driver.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-07-quiz',
            moduleId: 'pc-ard-07-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Why is a current-limiting resistor required when connecting an LED to an Arduino pin?',
                    options: [
                        'To increase the voltage reaching the LED',
                        'To limit the current flowing through the LED and prevent damage to both the LED and the pin',
                        'To convert the digital signal into an analog signal',
                        'To filter high-frequency noise from the power supply'
                    ],
                    explanation: 'An LED has very low resistance once it reaches its forward voltage. Without a resistor, the LED would draw excessive current, potentially burning itself out and damaging the Arduino pin. Each Arduino pin can supply a maximum of 40mA (20mA recommended). Using Ohm\'s Law: R = (Vsupply - Vforward) / I. For a typical red LED on a 5V pin: R = (5V - 1.8V) / 0.020A = 160 ohms minimum. A 220-ohm resistor is standard because it provides about 13.6mA -- safely below the pin limit while still producing visible brightness. Different color LEDs have different forward voltages (red ~1.8V, green ~2.2V, blue/white ~3.2V), so the resistor calculation changes for each color.'
                },
                {
                    question: 'What value range does analogWrite() accept on the Arduino Uno?',
                    options: [
                        '0 to 1023 (10-bit resolution)',
                        '0.0 to 5.0 (voltage in volts)',
                        '0 to 255 (8-bit resolution)',
                        '0 to 100 (percentage of brightness)'
                    ],
                    explanation: 'analogWrite() accepts an integer from 0 to 255, representing the PWM duty cycle with 8-bit resolution (2^8 = 256 levels). A value of 0 means the pin is always LOW (0% duty cycle, LED off). A value of 127 means the pin is HIGH roughly 50% of the time (50% duty cycle, half brightness). A value of 255 means the pin is always HIGH (100% duty cycle, full brightness). Note that analogWrite() does NOT produce a true analog voltage -- it generates a PWM (Pulse Width Modulation) signal that switches rapidly between 0V and 5V. The LED appears dimmer because your eye averages the rapid on/off switching. Only pins marked with ~ support PWM on the Uno: pins 3, 5, 6, 9, 10, and 11.'
                },
                {
                    question: 'Which Arduino Uno pins support PWM output via analogWrite()?',
                    options: [
                        'All digital pins (0-13)',
                        'Only analog pins (A0-A5)',
                        'Pins 3, 5, 6, 9, 10, and 11',
                        'Only pin 13 (the built-in LED pin)'
                    ],
                    explanation: 'On the Arduino Uno, only six pins support hardware PWM: 3, 5, 6, 9, 10, and 11. These pins are connected to the ATmega328P\'s three hardware timers (Timer0, Timer1, Timer2). Pins 5 and 6 use Timer0 and operate at approximately 980 Hz. Pins 9 and 10 use Timer1, and pins 3 and 11 use Timer2 -- both at approximately 490 Hz. If you call analogWrite() on a non-PWM pin, the Arduino will interpret values >= 128 as full HIGH and values < 128 as LOW -- no smooth dimming. These pins are marked with a tilde (~) on the board silkscreen. The Arduino Mega has 15 PWM pins, providing much more flexibility for LED projects.'
                },
                {
                    question: 'In a common-cathode RGB LED, what does analogWrite(redPin, 255) do?',
                    options: [
                        'Turns off the red channel completely',
                        'Sets the red channel to maximum brightness',
                        'Turns on all three channels simultaneously',
                        'Flashes the red LED at maximum speed'
                    ],
                    explanation: 'In a common-cathode RGB LED, the shared cathode connects to GND, and each color anode connects to a PWM pin through its own resistor. Sending analogWrite(redPin, 255) drives the red anode at full duty cycle (5V), meaning maximum current flows through the red LED element, producing maximum red brightness. This is the intuitive behavior: higher value = brighter. In a common-anode RGB LED, the logic is inverted because the shared anode connects to 5V and the cathodes connect to the PWM pins. In that case, analogWrite(redPin, 255) would mean the pin is fully HIGH, matching the 5V supply -- no current flows -- so the LED is OFF. You would need analogWrite(redPin, 0) for full brightness with common anode.'
                },
                {
                    question: 'How many unique colors can an RGB LED produce with 8-bit PWM on each channel?',
                    options: [
                        '768 (256 * 3)',
                        '16,777,216 (256 * 256 * 256)',
                        '1,024 (10-bit per channel)',
                        '65,536 (256 * 256)'
                    ],
                    explanation: 'With 8-bit PWM on each of the three color channels (red, green, blue), each channel has 256 possible brightness levels (0-255). The total number of unique color combinations is 256 * 256 * 256 = 16,777,216 -- the same 16.7 million colors used in 24-bit "true color" displays. This is the same RGB color model used in web development (CSS hex colors like #FF8800), image editing software, and computer monitors. For example, analogWrite(redPin, 255) + analogWrite(greenPin, 165) + analogWrite(bluePin, 0) produces orange, just like the CSS color #FFA500. The Arduino is performing the same additive color mixing as your screen, just with physical photons from three LED elements.'
                },
                {
                    question: 'What is the purpose of multiplexing in an 8x8 LED matrix?',
                    options: [
                        'To increase the brightness of all LEDs beyond their rated current',
                        'To display the full 64-LED image using only 16 pins by scanning one row at a time',
                        'To convert the analog LED signals to digital for the Arduino to read',
                        'To synchronize the LED matrix with an external clock source'
                    ],
                    explanation: 'An 8x8 LED matrix has 64 LEDs but only 16 connection pins (8 rows + 8 columns). Multiplexing works by activating one row at a time: set the row pin HIGH, set the appropriate column pins LOW to light specific LEDs in that row, then deactivate the row and move to the next. By scanning through all 8 rows fast enough (at least 100 times per second), persistence of vision makes it appear that all 64 LEDs are on simultaneously. This technique reduces the pin count from 64 (one per LED) to 16. The trade-off is reduced brightness because each LED is only on for 1/8th of the time. For 16-pin operation, you still use most of the Uno\'s pins -- which is why driver chips like the MAX7219 are so valuable.'
                },
                {
                    question: 'How many LEDs can be controlled with N pins using Charlieplexing?',
                    options: [
                        'N LEDs',
                        'N * 2 LEDs',
                        'N * (N - 1) LEDs',
                        'N squared LEDs'
                    ],
                    explanation: 'Charlieplexing can control N * (N - 1) LEDs using N pins. Between any two pins, you can place two LEDs in opposite polarity. Setting one pin HIGH and another LOW lights one LED; reversing the polarity lights the other. The remaining pins are set to INPUT (high impedance) so they do not interfere. With 3 pins: 3 * 2 = 6 LEDs. With 4 pins: 4 * 3 = 12 LEDs. With 5 pins: 5 * 4 = 20 LEDs. With 8 pins: 8 * 7 = 56 LEDs. The trade-off is that only one LED can be physically on at any instant, requiring fast multiplexing to create the illusion that multiple LEDs are lit. Brightness is reduced proportionally because each LED gets only 1/Nth of the total on-time.'
                },
                {
                    question: 'In a 7-segment display, how many individual LED segments are there (excluding the decimal point)?',
                    options: [
                        '4',
                        '7',
                        '8',
                        '10'
                    ],
                    explanation: 'A 7-segment display has exactly 7 individual LED segments, labeled a through g. These 7 segments can be turned on in various combinations to display the digits 0 through 9 and some letters. Segment a is the top horizontal bar, b and c are the right vertical bars (top and bottom), d is the bottom horizontal bar, e and f are the left vertical bars (bottom and top), and g is the middle horizontal bar. For example, the digit "0" lights segments a, b, c, d, e, f (all except g). The digit "1" lights only b and c. Most 7-segment displays also include an 8th LED for the decimal point (dp), bringing the total pin count to 8 segment pins plus 1 common pin. Multi-digit displays multiplex the segment lines and use separate digit-enable pins.'
                },
                {
                    question: 'What does the 74HC595 shift register do?',
                    options: [
                        'Converts analog signals to digital using a 10-bit ADC',
                        'Converts 3 serial input pins into 8 parallel output pins',
                        'Amplifies the current output of Arduino pins by 10x',
                        'Stores program data in non-volatile flash memory'
                    ],
                    explanation: 'The 74HC595 is a serial-to-parallel shift register. Using only 3 Arduino pins (data, clock, and latch), you can control 8 independent output pins. You send 8 bits of data serially using shiftOut() -- each bit is clocked into the register one at a time via the data and clock pins. Once all 8 bits are loaded, you toggle the latch pin to copy the shift register contents to the 8 output pins simultaneously. This is why it is called serial-to-parallel: serial data in, parallel data out. The chip also has a serial output pin (Q7\') that allows cascading: connect Q7\' of one chip to the data input of the next. Two cascaded 74HC595 chips give you 16 outputs from the same 3 Arduino pins. Three chips give 24 outputs, and so on.'
                },
                {
                    question: 'What Arduino function is used to send data to a 74HC595 shift register?',
                    options: [
                        'analogWrite()',
                        'Serial.write()',
                        'shiftOut()',
                        'SPI.transfer()'
                    ],
                    explanation: 'shiftOut(dataPin, clockPin, bitOrder, value) is the dedicated Arduino function for sending data to shift registers like the 74HC595. It takes a byte value (0-255) and sends it one bit at a time. For each bit, it sets the data pin HIGH or LOW, then pulses the clock pin to shift that bit into the register. The bitOrder parameter (MSBFIRST or LSBFIRST) determines whether the most significant bit or least significant bit is sent first. MSBFIRST means bit 7 is sent first and ends up at Q7, which is the standard convention. The entire shiftOut operation for 8 bits takes only a few microseconds. While SPI.transfer() could also communicate with the chip, shiftOut() is the standard approach for basic shift register control without requiring the SPI library.'
                },
                {
                    question: 'What is the key advantage of the MAX7219 LED driver over direct multiplexing?',
                    options: [
                        'It can drive more current per LED than the Arduino pins',
                        'It handles all multiplexing internally, freeing the Arduino from timing-critical scanning loops',
                        'It reduces the cost of the project by eliminating resistors',
                        'It converts the LED display to HDMI output'
                    ],
                    explanation: 'The MAX7219 is a dedicated LED driver that handles all row/column multiplexing internally using its own oscillator and timing circuits. This means the Arduino does not need to run a scanning loop -- it simply sends display data via SPI, and the MAX7219 continuously refreshes the display on its own. This frees the Arduino\'s CPU for other tasks like reading sensors, processing data, or communicating with other devices. Additionally, the MAX7219 can drive LEDs at higher current (up to 40mA per segment) than Arduino pins, includes 16 levels of brightness control, has a built-in BCD decoder for 7-segment displays, and supports cascading via daisy-chained SPI. Only 3 Arduino pins are needed regardless of how many MAX7219 modules are chained together.'
                },
                {
                    question: 'What does PWM stand for, and how does it simulate variable brightness?',
                    options: [
                        'Power Width Measurement -- it measures the LED power consumption',
                        'Pulse Wave Manipulation -- it creates analog voltage levels',
                        'Pulse Width Modulation -- it rapidly switches between on and off to simulate brightness levels',
                        'Periodic Waveform Mode -- it generates sinusoidal signals for smooth dimming'
                    ],
                    explanation: 'PWM stands for Pulse Width Modulation. A PWM pin rapidly switches between 5V (HIGH) and 0V (LOW) at a fixed frequency (490 Hz or 980 Hz on the Arduino Uno, depending on the pin). The duty cycle -- the ratio of HIGH time to the total period -- determines the effective brightness. At 25% duty cycle, the pin is HIGH for 25% of each period and LOW for 75%. The LED is actually blinking hundreds of times per second, but your eye cannot perceive individual flashes at these frequencies. Instead, your eye averages the light output, perceiving it as dimmer than full brightness. This is the same principle used in monitor backlights, car brake lights, and industrial motor speed controllers. PWM does not produce a true analog voltage -- it produces a digital signal with variable on-time.'
                },
                {
                    question: 'What is the maximum total current that can be drawn from all Arduino Uno pins combined?',
                    options: [
                        '40mA',
                        '100mA',
                        '200mA',
                        '500mA'
                    ],
                    explanation: 'The ATmega328P on the Arduino Uno has a maximum total current limit of 200mA across all I/O pins combined. Each individual pin can source up to 40mA (with 20mA as the recommended maximum), but you cannot run all pins at maximum simultaneously. With 10 LEDs each drawing 20mA, you are already at the 200mA total limit. This is why LED arrays, matrices, and multiple outputs often require external driver circuits (transistors, shift registers, or dedicated driver chips like the MAX7219). Exceeding the total current limit risks overheating the ATmega chip and causing permanent damage. For projects with many LEDs, always calculate total current draw and use external drivers when needed.'
                },
                {
                    question: 'What does the map() function do in the context of an LED bar graph?',
                    options: [
                        'It creates a visual map of LED positions on the breadboard',
                        'It linearly scales a sensor reading from one range to another (e.g., 0-1023 to 0-10)',
                        'It stores the LED pin assignments in a hash table',
                        'It generates a geographic map using GPS coordinates'
                    ],
                    explanation: 'The map(value, fromLow, fromHigh, toLow, toHigh) function linearly scales a value from one range to another. For an LED bar graph, you might read an analog sensor (0-1023) and need to determine how many of 10 LEDs to light up. map(sensorVal, 0, 1023, 0, 10) converts the sensor reading proportionally: 0 maps to 0 LEDs, 512 maps to 5 LEDs, 1023 maps to 10 LEDs. The function uses integer arithmetic: result = (value - fromLow) * (toHigh - toLow) / (fromHigh - fromLow) + toLow. It is one of the most commonly used Arduino functions for converting between sensor ranges and output ranges -- PWM (0-255), servo angles (0-180), display values, and more.'
                },
                {
                    question: 'When cascading multiple 74HC595 shift registers, how are the chips connected?',
                    options: [
                        'Each chip gets its own dedicated data, clock, and latch pins',
                        'The DOUT (Q7 prime) of one chip connects to the DIN of the next, sharing clock and latch lines',
                        'All chips share the same data pin but use separate clock pins',
                        'The chips communicate via I2C addressing'
                    ],
                    explanation: 'When cascading 74HC595 shift registers, the serial data output pin (Q7\', also called DOUT) of the first chip connects to the serial data input (DS/DIN) of the second chip. The clock (SHCP) and latch (STCP) pins are shared across all chips -- they are wired in parallel. To send data to two cascaded chips (16 outputs), you call shiftOut() twice before toggling the latch: the first shiftOut sends 8 bits that shift through the first chip and into the second chip, then the second shiftOut loads 8 new bits into the first chip. When you toggle the latch, all 16 outputs update simultaneously. This daisy-chain architecture means you always use exactly 3 Arduino pins, regardless of how many 74HC595 chips are in the chain.'
                }
            ]
        });
        quiz.start();
    </script>
