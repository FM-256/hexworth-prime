    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 19: Arduino for Security',
            description: 'Test your knowledge of hardware hacking, JTAG enumeration, UART discovery, RS232, bus piracy, logic analysis, USB device identification, CTF hardware challenges, and defensive applications.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-19-quiz',
            moduleId: 'pc-ard-19-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is JTAG and why is it significant in hardware security?',
                    options: [
                        'A wireless protocol for IoT devices that can be jammed',
                        'A standard debug interface (IEEE 1149.1) that provides full read/write access to CPU registers, memory, and flash on most processors',
                        'A type of encryption used to protect firmware on embedded devices',
                        'A programming language specifically designed for hardware testing'
                    ],
                    explanation: 'JTAG (Joint Test Action Group, IEEE 1149.1) is a standard debug and boundary-scan interface present on most microprocessors, FPGAs, and complex ICs. It uses four signals (TDI, TDO, TCK, TMS) plus optional TRST. When JTAG is enabled and accessible, it provides complete control over the target device: read/write CPU registers, step through code, read/write flash memory (extract firmware), read/write SRAM, and halt/resume execution. In a security context, an exposed JTAG port on a production device is a critical vulnerability -- it gives an attacker the same access a developer has during debugging.'
                },
                {
                    question: 'What does the JTAGenum tool do?',
                    options: [
                        'It encrypts JTAG communications to prevent interception',
                        'It is an Arduino sketch that brute-forces JTAG pin assignments by testing all permutations of TDI, TDO, TCK, and TMS on candidate pins',
                        'It generates JTAG-compatible firmware images for upload to target devices',
                        'It blocks unauthorized JTAG access by monitoring the debug port'
                    ],
                    explanation: 'JTAGenum is an open-source Arduino sketch that systematically tries every possible assignment of JTAG signals (TDI, TDO, TCK, TMS) across a set of candidate pins on an unknown target PCB. For each permutation, it sends standard JTAG commands and checks for valid responses. When the correct pin assignment is found, JTAGenum reports the mapping and often reads the JTAG IDCODE -- a 32-bit value that identifies the target chip manufacturer and model. This process replaces expensive tools like the JTAGulator ($175) with a $5 Arduino. The tool is essential for hardware pentesters encountering unlabeled test points on a target board.'
                },
                {
                    question: 'When discovering a hidden UART port on a target device, what is the first step?',
                    options: [
                        'Connect the Arduino TX pin directly to all candidate pins simultaneously',
                        'Use a multimeter to identify ground and voltage pins, then look for a pin that idles HIGH and drops LOW during boot (the TX pin)',
                        'Flash custom firmware onto the target device to enable UART output',
                        'Use a WiFi sniffer to detect serial communications over the air'
                    ],
                    explanation: 'The first step in UART discovery is physical identification using a multimeter. Start by finding GND pins (continuity to ground plane) and VCC pins (steady 3.3V or 5V). Then identify the TX (transmit) pin: UART TX idles at logic HIGH (the line voltage when no data is being sent) and drops to LOW during data transmission. During device boot, TX is the most active pin because the processor typically outputs boot logs, debug messages, and status information. You can monitor candidate pins with the Arduino\'s analog input to detect voltage transitions, or simply connect each candidate to SoftwareSerial RX and check for readable data at common baud rates.'
                },
                {
                    question: 'Why must you never connect an RS232 signal directly to an Arduino pin?',
                    options: [
                        'RS232 uses a different data format than UART that the Arduino cannot decode',
                        'RS232 uses +/-12V voltage levels that will permanently damage the Arduino pins (rated for 0-5V)',
                        'RS232 requires a wireless module that the Arduino does not have',
                        'RS232 only works with x86 processors, not AVR microcontrollers'
                    ],
                    explanation: 'RS232 uses voltage levels of -12V to +12V (with logic levels typically -3V to -15V for logical 1, and +3V to +15V for logical 0 -- note the inverted logic). Arduino pins are rated for 0-5V input and will be permanently damaged by these voltages. A MAX3232 level shifter chip or breakout board must be placed between the RS232 device and the Arduino. The MAX3232 converts RS232 voltage levels to 0-3.3V TTL levels and handles the signal inversion. These breakout boards cost under $2 and are essential equipment for any hardware pentester working with industrial or legacy serial equipment.'
                },
                {
                    question: 'What is passive bus sniffing?',
                    options: [
                        'Actively sending test commands to a communication bus to probe for vulnerabilities',
                        'Connecting to a communication bus (SPI, I2C, UART) as a read-only listener to capture traffic between chips without interfering',
                        'Using Bluetooth Low Energy to detect nearby wireless devices',
                        'Monitoring power consumption of a device to infer its internal operations'
                    ],
                    explanation: 'Passive bus sniffing means connecting to a communication bus and reading the data being exchanged between devices without sending any data yourself. For I2C, connect to SDA and SCL lines and read with Wire library in slave mode or by sampling the pins directly. For SPI, connect to MOSI, MISO, SCK, and CS lines as an observer. For UART, connect to the TX line. The target devices do not know you are monitoring because you are not driving any signals onto the bus. Captured data often reveals command protocols, authentication sequences, configuration data, unencrypted credentials, and firmware update mechanisms.'
                },
                {
                    question: 'What does an I2C bus scanner do and why is it useful in security assessments?',
                    options: [
                        'It scans for wireless I2C signals within radio range',
                        'It iterates through all 127 possible I2C addresses and reports which ones have active devices, revealing hidden components on a target PCB',
                        'It measures the speed of I2C communication to detect bottlenecks',
                        'It blocks unauthorized I2C devices from communicating on the bus'
                    ],
                    explanation: 'An I2C bus scanner sends a start condition and address byte to each of the 127 possible I2C addresses (1-127). If a device ACKs (acknowledges) at an address, that address has an active device. This reveals all I2C peripherals connected to the bus, even ones not documented in the target\'s schematics or datasheet. Common findings include: EEPROM chips (0x50-0x57) that may contain credentials or configuration data, undocumented sensor modules, crypto accelerators with extractable keys, and debug interfaces on I2C-accessible management controllers. The scan takes milliseconds and requires only SDA and SCL connections.'
                },
                {
                    question: 'What is a hardware keylogger and how can an Arduino help detect one?',
                    options: [
                        'A software program that records keystrokes -- Arduino cannot detect software',
                        'A malicious USB device inserted between a keyboard and computer that records keystrokes; Arduino with USB Host Shield can enumerate USB devices and detect unexpected device topology changes',
                        'A chip soldered inside a keyboard that records to internal memory -- undetectable by any means',
                        'A network device that captures wireless keyboard signals -- Arduino detects via WiFi scanning'
                    ],
                    explanation: 'Hardware keyloggers are small USB devices placed inline between a keyboard and a computer. They record every keystroke to internal memory and are invisible to software antivirus because they operate at the physical USB layer. An Arduino with a USB Host Shield can detect them by enumerating all USB devices and comparing against a known-good baseline. A keylogger introduces an additional USB hub or device in the chain, changing the device descriptor tree. If the expected single keyboard descriptor is replaced by a hub with two devices, a keylogger is likely present. The Arduino monitor can be deployed at secure workstations to continuously verify USB topology integrity.'
                },
                {
                    question: 'When using an Arduino as a logic analyzer, what is the approximate maximum sample rate?',
                    options: [
                        'About 100 Hz -- sufficient only for very slow signals',
                        'About 1 MHz -- adequate for UART, I2C, and slow SPI protocols',
                        'About 100 MHz -- comparable to professional logic analyzers',
                        'About 1 GHz -- can capture USB and Ethernet signals'
                    ],
                    explanation: 'An Arduino running tight direct-port-read loops (reading PIND in a while loop with no other operations) can achieve approximately 1 MHz sample rate. This is adequate for decoding UART (up to ~115200 baud), I2C (standard 100 kHz and fast 400 kHz modes), slow SPI, 1-Wire, and many proprietary protocols used in embedded devices. For higher-speed signals (USB at 12-480 MHz, Ethernet, high-speed SPI above 1 MHz), a professional logic analyzer like the Saleae is required. The 1 MHz Arduino analyzer, combined with SIGROK/PulseView software for protocol decoding, covers approximately 90% of hardware pentest scenarios.'
                },
                {
                    question: 'What are "red flags" when using a USB Device Identifier tool to examine an unknown USB device?',
                    options: [
                        'The device has a valid manufacturer string from a known company',
                        'The device descriptor shows VID:PID matching known attack tools, claims to be HID (keyboard) but looks like a flash drive, or enumerates as multiple device classes',
                        'The device draws less than 100mA of current',
                        'The device has a serial number string in its descriptor'
                    ],
                    explanation: 'Red flags for malicious USB devices include: (1) VID:PID matching known attack tools like Hak5 Rubber Ducky, O.MG Cable, or BadUSB variants. (2) Device claiming to be HID class (keyboard/mouse) when it physically looks like a flash drive -- this indicates HID injection attack capability. (3) Device enumerating as multiple device classes simultaneously (e.g., HID + mass storage + network). (4) Blank or generic manufacturer/product strings. (5) Device enumerating as a USB hub when no hub should be present. An Arduino with USB Host Shield reads these descriptors safely without executing any payload the device might contain.'
                },
                {
                    question: 'In a hardware CTF competition, which technique would you use to extract a flag stored in an I2C EEPROM chip on the target board?',
                    options: [
                        'Desolder the EEPROM and read it with a USB microscope',
                        'Connect Arduino to the I2C bus (SDA/SCL), use Wire library to read all addresses of the EEPROM, and dump the contents to Serial Monitor',
                        'Use WiFi to remotely access the EEPROM over the network',
                        'Flash new firmware onto the target board that prints the EEPROM contents'
                    ],
                    explanation: 'Connecting an Arduino to the I2C bus and reading the EEPROM with the Wire library is the standard approach. I2C EEPROMs (AT24C series) have addresses in the 0x50-0x57 range. To read: Wire.beginTransmission(0x50), send the starting address as two bytes, Wire.endTransmission(), then Wire.requestFrom(0x50, numBytes) to read data sequentially. Dump each byte to Serial Monitor in hex and ASCII. CTF flags are often stored at specific addresses (0x0000, the end of memory, or at recognizable offsets). The entire 1KB-64KB EEPROM can be dumped in seconds. This is non-destructive and does not require desoldering -- just clip onto SDA, SCL, VCC, and GND.'
                },
                {
                    question: 'What is a replay attack in the context of hardware security?',
                    options: [
                        'Playing back a recorded video of someone entering a password',
                        'Capturing a valid signal (IR, RF, serial command) and retransmitting it later to trigger the same action on the target device',
                        'Repeatedly entering wrong passwords until the account locks out',
                        'Copying a website and hosting it on a different server'
                    ],
                    explanation: 'A replay attack captures a legitimate communication signal -- such as an IR remote code, an RF garage door opener signal, a serial authentication command, or an NFC tag response -- and retransmits it verbatim at a later time. If the target device does not implement replay protection (rolling codes, timestamps, challenge-response), it accepts the replayed signal as genuine. Arduino can both capture and replay: record the bitstream with direct port reads, store it in an array, and retransmit it with direct port writes at the correct timing. This is commonly exploited in CTF competitions and in real-world assessments of access control systems.'
                },
                {
                    question: 'What defensive application can an Arduino serve in a server room?',
                    options: [
                        'Firewalling network traffic between servers',
                        'Physical tamper detection with reed switches, vibration sensors, and light sensors that log events independently of the network',
                        'Running intrusion detection software on network packets',
                        'Encrypting all data stored on the servers'
                    ],
                    explanation: 'Arduino excels as an independent physical security monitor. Reed switches on server rack doors detect unauthorized opening. Vibration sensors on cable conduits detect tampering. Light sensors inside sealed enclosures detect cover removal (light entering = someone opened it). PIR sensors detect after-hours motion. These sensors feed into the Arduino, which logs each event with a millis() timestamp to EEPROM or SD card. The key advantage is independence: this monitoring system operates completely outside the network, so a network-level attacker who compromises all servers cannot disable or erase the physical tamper log. It creates a separate forensic audit trail.'
                },
                {
                    question: 'What is voltage glitching in the context of hardware security?',
                    options: [
                        'A power supply defect that causes random reboots',
                        'Precisely timed, brief disruptions to the power supply that can cause a processor to skip security checks, bypass lock bits, or corrupt conditional branches',
                        'Using an oscilloscope to visualize voltage waveforms for debugging',
                        'Increasing the voltage to overclock the processor for faster computation'
                    ],
                    explanation: 'Voltage glitching (also called fault injection) involves momentarily dropping or spiking the supply voltage to a processor at a precisely controlled instant. A brief voltage dip during a security-critical instruction (like a password comparison or fuse bit check) can cause the CPU to skip that instruction or produce an incorrect result. This can bypass firmware readout protection, skip authentication checks, or cause a conditional branch to take the wrong path. Arduino can generate precisely-timed glitch pulses using Timer1 output compare with nanosecond-level control. The technique requires careful timing calibration but has been used to break security on smartcards, game consoles, and secure microcontrollers.'
                },
                {
                    question: 'What essential hardware toolkit should a hardware CTF competitor bring?',
                    options: [
                        'Only a laptop with Kali Linux -- all hardware hacking is done remotely',
                        'Arduino Uno/Nano, USB Host Shield, logic level shifter, jumper wires, multimeter, SOIC-8 test clip, MAX3232 breakout, and breadboard -- total cost under $30',
                        'A $5,000 oscilloscope and spectrum analyzer',
                        'Only soldering equipment and magnifying glass'
                    ],
                    explanation: 'The essential hardware CTF toolkit includes: Arduino Uno or Nano ($5 -- the primary tool for JTAG/UART enumeration, bus scanning, and signal capture), USB Host Shield ($8 -- for USB device identification), logic level shifter ($2 -- safely interface 3.3V and 5V devices), jumper wires and breadboard ($5 -- for making connections), multimeter ($10 -- for identifying pins and checking continuity), SOIC-8 test clip ($3 -- for reading flash chips without desoldering), MAX3232 breakout ($2 -- for RS232 level conversion). Total: approximately $35. This kit covers roughly 90% of hardware CTF challenges. The remaining 10% may require an oscilloscope or software-defined radio.'
                },
                {
                    question: 'What is the primary risk of using Arduino-based security tools on devices you do not own or have authorization to test?',
                    options: [
                        'The Arduino might overheat and damage itself',
                        'Unauthorized access to electronic devices is a federal crime under the Computer Fraud and Abuse Act (CFAA) and similar laws worldwide',
                        'The target device might send a virus back to the Arduino',
                        'There is no risk as long as you do not modify the target device'
                    ],
                    explanation: 'Unauthorized access to computer systems and electronic devices is a federal crime under the Computer Fraud and Abuse Act (CFAA) in the United States, with penalties including fines and imprisonment. Similar laws exist in virtually every country (Computer Misuse Act in the UK, various EU directives, etc.). Even passive activities like reading UART output or scanning I2C addresses can constitute unauthorized access if performed on devices you do not own or lack explicit written authorization to test. All hardware hacking techniques must only be used on your own equipment, in authorized penetration tests with written scope agreements, or in designated CTF competition environments.'
                }
            ]
        });
        quiz.start();
    </script>
