    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 8: Motors & Motion',
            description: 'Test your understanding of servo motors, DC motors, H-bridges, stepper motors, stepper drivers, relays, brushless motors, and sensor-driven motion control.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-08-quiz',
            moduleId: 'pc-ard-08-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Why can you NOT drive a motor directly from an Arduino pin?',
                    options: [
                        'Arduino pins only output 3.3V, and motors need 5V',
                        'Arduino pins can supply a maximum of about 40mA, which is far less than most motors require',
                        'Motors require alternating current (AC), and Arduino outputs DC',
                        'Arduino digital pins can only output LOW, not HIGH'
                    ],
                    explanation: 'Arduino Uno pins can source a maximum of approximately 40mA at 5V. Even a small DC motor typically draws 100-500mA under load, and larger motors draw several amps. Connecting a motor directly to an Arduino pin would draw excessive current, potentially destroying the pin or the entire microcontroller. Every motor type requires a driver circuit as an intermediary: a transistor or MOSFET for simple DC motors, an H-bridge for bidirectional DC motor control, a dedicated stepper driver for stepper motors, or an ESC for brushless motors. The Arduino provides only the low-current control signal; the driver circuit handles the high-current power delivery from an external supply.'
                },
                {
                    question: 'What does the Servo library\'s write() function do?',
                    options: [
                        'Writes data to the serial monitor',
                        'Sets the servo to a specific angle between 0 and 180 degrees by adjusting the PWM pulse width',
                        'Writes binary data to the servo\'s EEPROM',
                        'Sends a digital HIGH or LOW signal to the servo pin'
                    ],
                    explanation: 'Servo.write(angle) sets a standard hobby servo to a specific angular position between 0 and 180 degrees. Internally, the Servo library translates the angle into a PWM pulse width. A 1ms pulse (544 microseconds by default) corresponds to 0 degrees, a 1.5ms pulse corresponds to 90 degrees (center), and a 2ms pulse (2400 microseconds by default) corresponds to 180 degrees. The pulse repeats at 50 Hz (every 20ms). The servo\'s internal feedback circuit continuously compares the actual shaft position to the commanded position and adjusts the motor to minimize the error. This is a closed-loop control system built into the servo itself.'
                },
                {
                    question: 'How does a continuous rotation servo differ from a standard servo?',
                    options: [
                        'It uses a different library',
                        'It requires 12V power instead of 5V',
                        'write() controls speed and direction instead of angle, with 90 as the stop point',
                        'It has 360-degree position control instead of 180'
                    ],
                    explanation: 'A continuous rotation servo has its internal feedback mechanism removed or bypassed. Instead of moving to a specific angle and holding, it spins continuously. The write() function now maps to speed and direction: write(90) stops the servo, write(0) runs at full speed in one direction, and write(180) runs at full speed in the opposite direction. Values between 0-90 and 90-180 give intermediate speeds. This makes the same Servo library and wiring work for both types, but the behavior is fundamentally different. Continuous rotation servos are commonly used for simple wheeled robots where you need continuous rotation without a separate motor driver circuit.'
                },
                {
                    question: 'What is the purpose of a flyback diode across a motor or relay?',
                    options: [
                        'To convert AC to DC for the motor',
                        'To absorb the voltage spike (back-EMF) generated when the inductive coil is de-energized',
                        'To regulate the speed of the motor',
                        'To provide power backup when the main supply is disconnected'
                    ],
                    explanation: 'Every inductive load (motors, solenoids, relay coils) stores energy in its magnetic field while current flows. When the current is suddenly interrupted (transistor switches off), that stored energy must go somewhere. It manifests as a voltage spike that can reach 50-100V or more -- far exceeding what a transistor or Arduino pin can withstand. The flyback diode (typically a 1N4001 or 1N4148) is placed across the inductive load with its cathode toward the positive supply. During normal operation, the diode is reverse-biased and does nothing. When the voltage spike occurs, the diode becomes forward-biased and safely dissipates the energy as a brief current loop. Without a flyback diode, the voltage spike will destroy transistors, MOSFETs, and potentially the Arduino.'
                },
                {
                    question: 'On an L298N H-bridge, what determines the motor\'s direction?',
                    options: [
                        'The voltage level on the ENA pin',
                        'The combination of HIGH/LOW states on IN1 and IN2',
                        'The polarity of the external power supply',
                        'The PWM frequency on the motor output pins'
                    ],
                    explanation: 'The L298N H-bridge uses two input pins (IN1 and IN2) per motor channel to control direction. When IN1 is HIGH and IN2 is LOW, current flows through the motor in one direction (forward). When IN1 is LOW and IN2 is HIGH, current flows in the opposite direction (reverse). When both are LOW, the motor coasts to a stop (no braking). When both are HIGH, the motor experiences active braking (the windings are shorted together). The ENA (Enable A) pin controls whether the channel is active at all and accepts PWM for speed control. This gives you independent control over direction (IN1/IN2) and speed (ENA PWM duty cycle), which is the standard interface for differential-drive robots.'
                },
                {
                    question: 'What is the difference between braking and coasting in an H-bridge?',
                    options: [
                        'Braking uses more power than coasting',
                        'Coasting (both LOW) lets the motor spin down freely; braking (both HIGH) short-circuits the windings to stop quickly',
                        'Braking reverses the motor direction; coasting keeps it spinning forward',
                        'There is no difference -- both stop the motor at the same speed'
                    ],
                    explanation: 'When both input pins are set LOW (coast), the H-bridge disconnects the motor from the power supply. The motor spins freely and gradually slows down due to friction and its own inertia. When both input pins are set HIGH (brake), the H-bridge short-circuits the motor windings together. This creates electromagnetic braking: the motor\'s own rotation generates current that opposes the motion (back-EMF), causing rapid deceleration. Active braking stops the motor much faster than coasting. In robotics, active braking gives you more precise control over stopping position, while coasting saves energy and reduces mechanical stress.'
                },
                {
                    question: 'What is the key difference between a bipolar and a unipolar stepper motor?',
                    options: [
                        'Bipolar motors are smaller and lighter',
                        'Bipolar motors have 4 wires and require current direction reversal (H-bridge); unipolar motors have 5-6 wires with center taps and are simpler to drive',
                        'Unipolar motors are more precise than bipolar motors',
                        'Bipolar motors can only step in one direction'
                    ],
                    explanation: 'Bipolar stepper motors have 4 wires (2 per coil) and require the driver to reverse current flow in each coil to step. This requires an H-bridge driver (like the A4988 or L298N). Bipolar motors produce more torque per unit size because the entire coil is energized. Unipolar stepper motors have 5 or 6 wires with center taps on each coil. Current only flows in one direction through each half-coil, so they can be driven with simple transistors (like the ULN2003 Darlington array). This makes them simpler to control but they produce less torque because only half the coil is energized at a time. The 28BYJ-48 is the classic unipolar starter motor; NEMA 17 motors used in 3D printers are typically bipolar.'
                },
                {
                    question: 'Why must you set the current limit on an A4988 stepper driver before use?',
                    options: [
                        'To match the driver\'s input voltage to the Arduino\'s 5V output',
                        'To set the correct communication baud rate',
                        'To prevent overheating and damage to the stepper motor by limiting the current to the motor\'s rated value',
                        'To calibrate the microstepping resolution'
                    ],
                    explanation: 'The A4988 stepper driver uses a constant-current chopper drive. It can deliver up to 2A per phase, but most stepper motors are rated for far less (typically 350mA-1.5A). If the current limit is set too high, excessive current flows through the motor windings, causing overheating that can damage the motor insulation, demagnetize the rotor, or destroy the driver chip. If set too low, the motor has weak, unreliable steps and may skip positions under load. The current is set using the onboard potentiometer, and the reference voltage (Vref) is measured with a multimeter. The formula is Vref = Imax * 8 * Rsense, where Rsense is the current sense resistor value on the driver board. This must be set before the first power-on with a motor connected.'
                },
                {
                    question: 'What is the step+direction interface used by stepper drivers like the A4988?',
                    options: [
                        'A serial communication protocol at 9600 baud',
                        'One pin sets the direction (HIGH/LOW), and each pulse on the step pin advances the motor by one step',
                        'An analog voltage that controls both speed and direction simultaneously',
                        'A four-wire interface that directly drives the motor coils'
                    ],
                    explanation: 'The step+direction interface simplifies stepper control to just two digital pins. The DIR (direction) pin is set HIGH or LOW to choose the rotation direction. The STEP pin receives a square wave pulse for each step: one pulse = one step (or microstep). The frequency of the pulses determines the speed: faster pulses = faster rotation. The driver handles all the complex coil sequencing internally. This means you do not need a stepper library -- just digitalWrite(STEP_PIN, HIGH), delayMicroseconds(), digitalWrite(STEP_PIN, LOW), delayMicroseconds(). The A4988, DRV8825, and TMC2209 all use this same simple interface, making them interchangeable in most circuits.'
                },
                {
                    question: 'What is the difference between NO (Normally Open) and NC (Normally Closed) on a relay?',
                    options: [
                        'NO is for DC loads and NC is for AC loads',
                        'NO means the circuit is open (disconnected) when the relay is off; NC means the circuit is closed (connected) when the relay is off',
                        'NO and NC are different voltage ratings for the relay contacts',
                        'NO is the input terminal and NC is the output terminal'
                    ],
                    explanation: 'Relays have three output terminals: COM (common), NO (normally open), and NC (normally closed). In the default state (relay coil not energized), the COM terminal is connected to NC and disconnected from NO. When the relay is energized (coil powered), the internal switch flips: COM connects to NO and disconnects from NC. Most projects use the NO terminal because it means the load is off by default and only turns on when you explicitly activate the relay. NC is used when you want the load to be on by default and only turn off when the relay activates -- for example, a safety cutoff that disconnects power when triggered. The COM terminal always goes to your load or power source.'
                },
                {
                    question: 'How is a brushless motor (BLDC) controlled from an Arduino?',
                    options: [
                        'By connecting three Arduino pins directly to the motor\'s three wires',
                        'By using the Servo library to send PWM signals to an ESC, which handles the three-phase commutation',
                        'By using the Stepper library with a special brushless driver',
                        'By rapidly switching a single transistor at very high frequency'
                    ],
                    explanation: 'Brushless DC motors require complex three-phase commutation that an Arduino cannot handle directly. An ESC (Electronic Speed Controller) takes this burden. The ESC accepts a simple PWM signal -- identical in format to a servo signal (1000-2000 microsecond pulses at 50 Hz). The Arduino uses the Servo library to generate this signal: writeMicroseconds(1000) = off/minimum, writeMicroseconds(2000) = full throttle. The ESC then converts this single control signal into the precise three-phase switching pattern needed to spin the motor. Most ESCs require an arming sequence (sending minimum throttle for 2-5 seconds at power-on) before they will respond to throttle commands. This is a safety feature to prevent unexpected motor startup.'
                },
                {
                    question: 'What is the arming sequence for an ESC, and why is it necessary?',
                    options: [
                        'Sending the maximum throttle signal for 1 second to calibrate the ESC',
                        'Connecting and disconnecting the motor wires three times in sequence',
                        'Sending the minimum throttle signal (1000us) for 2-5 seconds at power-on so the ESC recognizes a safe starting state',
                        'Pressing a physical button on the ESC board to enable motor output'
                    ],
                    explanation: 'The arming sequence is a safety mechanism built into virtually all ESCs. When the ESC powers on, it checks for a valid minimum throttle signal (typically 1000 microseconds) to confirm that the controller is in a known, safe state. If the ESC detects anything other than minimum throttle at startup (which could mean a stuck transmitter or corrupted signal), it refuses to arm and the motor stays off. This prevents dangerous situations where a motor might spin up unexpectedly at full power. In Arduino code, this means calling esc.writeMicroseconds(1000) in setup() followed by a delay(3000) to give the ESC time to arm. The ESC typically confirms arming with a series of audible beeps from the motor.'
                },
                {
                    question: 'What does the map() function do in the context of sensor-driven motor control?',
                    options: [
                        'Creates a geographical map of sensor readings',
                        'Converts a value from one numeric range to another (e.g., 0-1023 to 0-180)',
                        'Maps physical Arduino pins to virtual pin numbers',
                        'Creates a lookup table for motor speed values'
                    ],
                    explanation: 'map(value, fromLow, fromHigh, toLow, toHigh) performs a linear conversion from one numeric range to another. For sensor-driven motor control, this is essential: a potentiometer outputs 0-1023 from analogRead(), but a servo needs 0-180. map(potVal, 0, 1023, 0, 180) converts the full potentiometer range to the full servo range. Similarly, an ultrasonic distance sensor might report 5-100cm, and you want to map that to a motor speed of 255-0 (closer = faster). map(distance, 5, 100, 255, 0) performs this inverted mapping. The function does integer math and does not clamp the output -- if the input exceeds the from range, the output will exceed the to range. Use constrain() first to clamp the input to a safe range.'
                },
                {
                    question: 'What is the 28BYJ-48 pin order quirk when using the Arduino Stepper library?',
                    options: [
                        'The pins must be connected in reverse order (IN4, IN3, IN2, IN1)',
                        'The correct constructor order is IN1, IN3, IN2, IN4 -- not the sequential IN1, IN2, IN3, IN4',
                        'Only two of the four pins need to be connected',
                        'The center wire must be connected to a PWM pin'
                    ],
                    explanation: 'The 28BYJ-48 stepper motor has internal wiring where the coil connections do not follow a sequential pin order. When using the Arduino Stepper library, the constructor expects pins in the order: coil-A-pin1, coil-B-pin1, coil-A-pin2, coil-B-pin2. For the 28BYJ-48, this translates to IN1, IN3, IN2, IN4 on the ULN2003 driver board. If you use the intuitive sequential order (IN1, IN2, IN3, IN4), the motor will buzz and vibrate but will not rotate, because the coil energization sequence is wrong. This is one of the most common beginner mistakes with stepper motors and the solution is always to swap the middle two pins in the constructor.'
                },
                {
                    question: 'What is the purpose of constrain() when mapping sensor values to motor control?',
                    options: [
                        'To limit a value to a specific minimum and maximum range before passing it to map() or a motor function',
                        'To constrain the motor\'s physical rotation to prevent overtravel',
                        'To reduce electrical noise in the sensor signal',
                        'To set the acceleration profile for the motor'
                    ],
                    explanation: 'constrain(value, min, max) clamps a value so it never falls below min or above max. This is critical for safety in motor control. Sensor readings can produce noise spikes, invalid values, or readings outside the expected range. Without constrain(), map() will extrapolate beyond the output range, potentially sending dangerous values to a motor (like a servo angle of 200 degrees, or a PWM value of 300). For example, constrain(sensorVal, 5, 100) ensures the value stays between 5 and 100 before map() converts it to a motor speed. The pattern is always: read sensor, constrain to safe range, map to motor range, write to motor. Skipping constrain() is a common source of erratic motor behavior and hardware damage.'
                }
            ]
        });
        quiz.start();
    </script>
