    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 5: Digital & Analog Input',
            description: 'Test your knowledge of digitalRead, INPUT_PULLUP, debouncing, analogRead, 10-bit ADC, map(), constrain(), voltage dividers, and hysteresis.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-05-quiz',
            moduleId: 'pc-ard-05-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does digitalRead(pin) return?',
                    options: [
                        'HIGH (1) or LOW (0)',
                        'A value between 0 and 1023',
                        'The voltage in millivolts',
                        'A floating-point number between 0.0 and 5.0'
                    ],
                    explanation: 'digitalRead(pin) returns one of two values: HIGH (which equals 1) or LOW (which equals 0). It samples the voltage on the specified pin at the exact moment the function is called. If the pin voltage is above approximately 2.5V (on a 5V Arduino), it reads HIGH. If below approximately 2.5V, it reads LOW. There is no in-between -- digital input is binary. This makes digitalRead ideal for reading switches, buttons, and any sensor that has two states (on/off, open/closed, detected/not-detected). For continuous readings, you need analogRead instead.'
                },
                {
                    question: 'What does INPUT_PULLUP do when used with pinMode()?',
                    options: [
                        'Enables an internal 20k-ohm pull-up resistor that holds the pin HIGH when nothing is connected',
                        'Sets the pin to output 5V continuously',
                        'Enables analog-to-digital conversion on the pin',
                        'Connects the pin to an external pull-up resistor automatically'
                    ],
                    explanation: 'INPUT_PULLUP activates a built-in 20k-ohm resistor inside the ATmega328P that connects the pin to 5V (HIGH) through a weak pull-up. When nothing is pressing the button, the pin reads HIGH. When the button is pressed (connecting the pin to GND), the strong connection to ground overrides the weak pull-up and the pin reads LOW. This eliminates the need for an external pull-down resistor -- you only need two wires: one from the pin to one leg of the button, and one from the other leg of the button to GND. The trade-off is inverted logic: LOW means pressed, HIGH means released.'
                },
                {
                    question: 'Why does a floating input pin give random readings?',
                    options: [
                        'It acts as an antenna, picking up electromagnetic noise from the environment',
                        'The ATmega chip generates random numbers on unused pins',
                        'The pin voltage oscillates at the CPU clock frequency',
                        'Digital pins have a built-in noise generator for testing'
                    ],
                    explanation: 'A floating input pin is not connected to any defined voltage source (neither 5V nor GND). The tiny copper trace on the PCB and the wire attached to the pin act as a miniature antenna, picking up electromagnetic interference from nearby electronics, power lines, your body, fluorescent lights, and radio signals. The voltage on the pin drifts randomly between 0V and 5V, causing digitalRead() to return unpredictable HIGH or LOW values. This is not a defect -- it is fundamental physics. The solution is to always provide a defined path to a voltage: use INPUT_PULLUP for a pull-up to 5V, or wire an external pull-down resistor (typically 10k-ohm) to GND.'
                },
                {
                    question: 'What causes switch "bounce" and why is it a problem?',
                    options: [
                        'The metal contacts inside the switch vibrate for 1-10ms, causing rapid HIGH/LOW transitions that register as multiple presses',
                        'The Arduino reads the pin too slowly and misses the actual press',
                        'Electrical current overloads the switch and causes voltage spikes',
                        'The pull-up resistor creates oscillation in the circuit'
                    ],
                    explanation: 'When a mechanical switch or button is pressed, the metal contacts do not make a clean, instant connection. They physically bounce -- vibrating and making/breaking contact multiple times over a period of 1 to 10 milliseconds before settling into a stable closed state. The Arduino samples pins in microseconds, so it sees each bounce as a distinct state change. A single human button press might generate 5-20 rapid transitions between HIGH and LOW. Without debouncing, your code registers one physical press as multiple software events -- an LED toggles on-off-on instead of just on, a counter increments by 5 instead of 1. Debouncing filters out these bounces either in software (millis-based delay) or hardware (RC filter).'
                },
                {
                    question: 'What is the correct millis()-based debounce approach?',
                    options: [
                        'Record the time of last state change and only accept a new state if at least 50ms has passed',
                        'Call delay(50) after every digitalRead()',
                        'Read the pin 50 times and take the majority value',
                        'Set the pin to OUTPUT for 50ms then switch back to INPUT'
                    ],
                    explanation: 'The millis()-based debounce pattern works as follows: when the pin state changes, record the current millis() value. On each subsequent loop iteration, check if the state has been stable for at least 50ms (millis() - lastChangeTime > 50). If so, accept it as a valid state change. If the state changes again before 50ms elapses, reset the timer. This approach is non-blocking -- the loop keeps running at full speed during the debounce window, allowing other code to execute. The delay(50) approach technically works but blocks the entire processor for 50ms on every loop iteration, making it unsuitable for any project that does more than read one button.'
                },
                {
                    question: 'How do you detect a long press versus a short press?',
                    options: [
                        'Record millis() when the button goes LOW (pressed) and again when it goes HIGH (released), then calculate the difference',
                        'Count the number of bounces -- more bounces means a longer press',
                        'Use analogRead() to measure how hard the button is pressed',
                        'Check if digitalRead returns 2 for long press and 1 for short press'
                    ],
                    explanation: 'Long-press detection requires measuring the duration between press and release. When the button transitions from HIGH to LOW (pressed), store millis() in a variable. When it transitions from LOW to HIGH (released), subtract the stored value from the current millis() to get the press duration in milliseconds. If the duration exceeds a threshold (commonly 1000ms for one second), it is a long press; otherwise, it is a short press. This technique is universal -- every smartphone, game controller, and smart device uses the same logic. You can define multiple thresholds: <500ms = tap, 500-2000ms = long press, >2000ms = extra-long press.'
                },
                {
                    question: 'What is the resolution of the Arduino Uno ADC?',
                    options: [
                        '10 bits (0 to 1023)',
                        '8 bits (0 to 255)',
                        '12 bits (0 to 4095)',
                        '16 bits (0 to 65535)'
                    ],
                    explanation: 'The Arduino Uno uses the ATmega328P built-in analog-to-digital converter, which has 10-bit resolution. This means it divides the input voltage range (0V to 5V by default) into 2^10 = 1024 discrete steps, numbered 0 through 1023. Each step represents 5V / 1024 = approximately 4.88 millivolts. An analogRead() call takes about 100 microseconds, allowing a maximum sampling rate of about 10,000 readings per second. The 10-bit resolution is adequate for most hobbyist and educational projects. For higher precision, boards like the Arduino Due (12-bit) or external ADC chips (16-bit ADS1115) provide finer resolution.'
                },
                {
                    question: 'Do analog pins require pinMode() configuration before using analogRead()?',
                    options: [
                        'No -- analog pins default to input mode and work without pinMode()',
                        'Yes -- you must call pinMode(A0, INPUT) before analogRead()',
                        'Yes -- you must call pinMode(A0, ANALOG) before analogRead()',
                        'Yes -- you must call analogReference() before analogRead()'
                    ],
                    explanation: 'Analog pins (A0-A5) do not require a pinMode() call before using analogRead(). They default to analog input mode and are ready to read immediately. Calling pinMode(A0, INPUT) does not cause an error, but it is unnecessary and redundant. The analog pins can also be used as digital I/O pins (they map to digital pins 14-19), but only if you explicitly call pinMode(A0, INPUT) or pinMode(A0, OUTPUT) to reconfigure them. The analogRead() function automatically switches the internal multiplexer to the specified channel and triggers the ADC conversion.'
                },
                {
                    question: 'What does map(512, 0, 1023, 0, 100) return?',
                    options: [
                        '50',
                        '51',
                        '512',
                        '100'
                    ],
                    explanation: 'map(512, 0, 1023, 0, 100) performs linear interpolation: it scales the value 512 from the input range 0-1023 to the output range 0-100. The formula is: output = (value - fromLow) * (toHigh - toLow) / (fromHigh - fromLow) + toLow. Plugging in: (512 - 0) * (100 - 0) / (1023 - 0) + 0 = 51200 / 1023 = 50.04. Since map() uses integer arithmetic, it truncates to 50. Note that map() does NOT clamp: if the input value is outside the from range, the output will be outside the to range proportionally. Always use constrain() first if your input might exceed the expected range.'
                },
                {
                    question: 'What does constrain(1100, 0, 1023) return?',
                    options: [
                        '1023',
                        '1100',
                        '0',
                        'An error'
                    ],
                    explanation: 'constrain(value, min, max) clamps a value to the specified range. If value > max, it returns max. If value < min, it returns min. Otherwise it returns value unchanged. constrain(1100, 0, 1023) returns 1023 because 1100 exceeds the maximum of 1023. constrain(-5, 0, 1023) would return 0. constrain(500, 0, 1023) would return 500. This function is essential when working with sensor data that might occasionally produce out-of-range values due to noise, electrical interference, or sensor drift. The pattern constrain-then-map ensures clean, predictable output: int safe = constrain(analogRead(A0), 100, 900); int pct = map(safe, 100, 900, 0, 100);'
                },
                {
                    question: 'Why is a voltage divider needed to measure a 12V battery with an Arduino?',
                    options: [
                        'The Arduino analog pins can only handle 0-5V; 12V would damage the chip',
                        'The ADC only works with voltages below 3.3V',
                        'The Arduino needs extra power from the battery to run the ADC',
                        'Voltage dividers increase measurement accuracy'
                    ],
                    explanation: 'The ATmega328P analog input pins have an absolute maximum rating of VCC + 0.5V, which is approximately 5.5V on a standard Arduino Uno. Applying 12V directly to an analog pin would exceed this rating and permanently damage the ADC input circuitry and potentially the entire chip. A voltage divider uses two resistors in series to scale the input voltage down to a safe range. For a 12V battery with R1=10k and R2=3.3k: Vout = 12 * 3.3 / (10 + 3.3) = 2.98V, which is safely within the 0-5V ADC range. The Arduino reads this scaled voltage and the code multiplies back by the divider ratio to calculate the original battery voltage.'
                },
                {
                    question: 'What is hysteresis in the context of threshold detection?',
                    options: [
                        'Using two thresholds (high and low) with a dead zone between them to prevent rapid on/off switching',
                        'Averaging the last 10 sensor readings to smooth noise',
                        'Using a hardware filter capacitor to eliminate voltage spikes',
                        'Reading the sensor twice and comparing the values for accuracy'
                    ],
                    explanation: 'Hysteresis uses two separate thresholds instead of one: a higher threshold to activate and a lower threshold to deactivate. The gap between them (the dead zone) prevents rapid toggling when a noisy sensor reading hovers near a single threshold. Example: alarm activates when temperature exceeds 80 degrees, but only deactivates when it drops below 75 degrees. Between 75 and 80, the alarm maintains its current state. Without hysteresis, a temperature fluctuating between 79.8 and 80.2 would toggle the alarm dozens of times per second. This is the same principle used in home thermostats, industrial controls, and the Schmitt trigger circuit in digital electronics.'
                },
                {
                    question: 'What does analogReference(INTERNAL) do on the Arduino Uno?',
                    options: [
                        'Switches the ADC reference voltage to the internal 1.1V source for higher resolution on small signals',
                        'Disconnects the external reference pin',
                        'Sets all analog pins to internal pull-up mode',
                        'Changes the ADC from 10-bit to 8-bit resolution'
                    ],
                    explanation: 'analogReference(INTERNAL) changes the ADC reference voltage from the default 5V to the internal 1.1V bandgap reference built into the ATmega328P. This means the full 0-1023 range now maps to 0V-1.1V instead of 0V-5V. Each ADC step represents 1.1V / 1024 = approximately 1.07mV, compared to 4.88mV with the default 5V reference. This provides roughly 4.5 times finer resolution for sensors that produce small voltage signals (like thermocouples or strain gauges). Important: if you apply more than 1.1V to an analog pin while using the INTERNAL reference, the reading will saturate at 1023 and the excess voltage could damage the ADC. Always ensure your input voltage does not exceed the selected reference.'
                },
                {
                    question: 'How many analog input pins does the Arduino Uno have?',
                    options: [
                        '6 (A0 through A5)',
                        '14 (matching the digital pins)',
                        '8 (A0 through A7)',
                        '4 (A0 through A3)'
                    ],
                    explanation: 'The Arduino Uno has 6 analog input pins labeled A0 through A5. These pins connect to a single 10-bit ADC through an internal multiplexer that switches between channels. The Uno reads one analog channel at a time, switching the multiplexer for each analogRead() call. Reading all 6 channels sequentially takes about 600 microseconds. The pins can also function as digital I/O (numbered 14-19) when configured with pinMode(). The Arduino Mega has 16 analog inputs (A0-A15), and the Arduino Nano has 8 (A0-A7, though A6 and A7 are analog-only and cannot be used as digital pins).'
                }
            ]
        });
        quiz.start();
    </script>
