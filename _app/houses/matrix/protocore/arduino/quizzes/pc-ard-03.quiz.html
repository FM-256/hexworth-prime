        <a href="../../../index.html">&larr; Back to ProtoCore</a>

    <script src="../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 3: Math & Logic',
            description: 'Test your understanding of Arduino math functions: arithmetic, map(), constrain(), trigonometry, random numbers, bit manipulation, and byte operations.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-03-quiz',
            moduleId: 'pc-ard-03-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the result of 7 / 2 when both operands are int in Arduino C?',
                    options: [
                        '3.5',
                        '3',
                        '4',
                        '3.0'
                    ],
                    explanation: 'When both operands are integers, C performs integer division, which truncates the decimal portion. 7 / 2 = 3 (not 3.5). The fractional part is discarded, not rounded. To get 3.5, at least one operand must be a float: 7.0 / 2 or (float)7 / 2. This is one of the most common bugs in Arduino sensor math -- forgetting that integer division truncates.'
                },
                {
                    question: 'What are the five parameters of the map() function?',
                    options: [
                        'value, min, max, offset, scale',
                        'value, fromLow, fromHigh, toLow, toHigh',
                        'input, output, gain, offset, clamp',
                        'raw, calibrated, min, max, step'
                    ],
                    explanation: 'map(value, fromLow, fromHigh, toLow, toHigh) scales a value from one range to another. The value is the input, fromLow/fromHigh define the source range, and toLow/toHigh define the target range. Example: map(512, 0, 1023, 0, 255) returns 127. The function uses integer math internally: (value - fromLow) * (toHigh - toLow) / (fromHigh - fromLow) + toLow.'
                },
                {
                    question: 'What does constrain(150, 0, 100) return?',
                    options: [
                        '150',
                        '0',
                        '100',
                        '50'
                    ],
                    explanation: 'constrain(value, min, max) clamps the value to the specified range. If the value is above max, it returns max. If below min, it returns min. If within range, it returns the value unchanged. constrain(150, 0, 100) returns 100 because 150 exceeds the max of 100. This function is essential for protecting actuators (servos, motors) from out-of-range commands.'
                },
                {
                    question: 'Why is randomSeed(analogRead(A7)) called in setup()?',
                    options: [
                        'To calibrate the analog-to-digital converter',
                        'To seed the PRNG with noise from an unconnected pin, producing different sequences each boot',
                        'To initialize pin A7 as an output',
                        'To generate a cryptographically secure random number'
                    ],
                    explanation: 'Without randomSeed(), the random() function produces the exact same sequence every time the Arduino boots. Reading an unconnected analog pin picks up electrical noise -- a different value each time -- which seeds the pseudo-random number generator (PRNG) with a unique starting point. The result is a different sequence of random numbers on each power-up. Note: this is not cryptographic randomness -- it is sufficient for games and animations, not security.'
                },
                {
                    question: 'What does the expression (flags >> 3) & 1 do?',
                    options: [
                        'Sets bit 3 of flags',
                        'Clears bit 3 of flags',
                        'Reads the value of bit 3 (returns 0 or 1)',
                        'Shifts the entire flags variable right permanently'
                    ],
                    explanation: 'This is the standard bit-reading pattern. (flags >> 3) shifts the byte right by 3 positions, moving bit 3 into the bit 0 position. Then & 1 masks off all other bits, leaving only the value of the original bit 3 (either 0 or 1). The original flags variable is not modified because >> does not assign -- it produces a temporary result. This pattern is used to check individual status bits in hardware registers.'
                },
                {
                    question: 'What is the result of 10 % 3 in Arduino C?',
                    options: [
                        '3',
                        '1',
                        '0',
                        '3.333'
                    ],
                    explanation: 'The modulo operator (%) returns the remainder after integer division. 10 / 3 = 3 remainder 1, so 10 % 3 = 1. Modulo is one of the most useful operators for cycling through values (circular buffers), checking even/odd numbers, and creating periodic behavior. It only works with integer operands in C/C++. For float remainder, use fmod().'
                },
                {
                    question: 'What problem can occur when multiplying an int by 1000 on an AVR Arduino?',
                    options: [
                        'The multiplication takes too long',
                        'Integer overflow -- the result exceeds the 16-bit int range',
                        'The compiler rejects large constants',
                        'No problem occurs'
                    ],
                    explanation: 'On AVR, int is 16-bit with a max of 32,767. If a sensor reads 512 and you calculate 512 * 1000, the true result is 512,000 -- far beyond what a 16-bit int can hold. The value wraps around silently to a garbage number (due to two\'s complement overflow). The fix: use long for the result, or cast before multiplying: (long)raw * 1000. This silent overflow is one of the most dangerous arithmetic bugs on Arduino.'
                },
                {
                    question: 'What does map(1100, 0, 1023, 0, 255) return?',
                    options: [
                        '255 (clamped to max)',
                        'An error',
                        'Approximately 274 (extrapolated beyond the target range)',
                        '0'
                    ],
                    explanation: 'map() does NOT clamp or constrain. When the input value (1100) is outside the source range (0-1023), map() extrapolates linearly beyond the target range. The math: (1100 - 0) * (255 - 0) / (1023 - 0) + 0 = approximately 274. This is why you should always pair map() with constrain(): constrain(map(raw, 0, 1023, 0, 255), 0, 255) prevents values above 255.'
                },
                {
                    question: 'Why is x * x preferred over pow(x, 2) on Arduino?',
                    options: [
                        'pow() does not work on Arduino',
                        'x * x is more precise for integer values',
                        'x * x is 10-50x faster because pow() uses float math',
                        'There is no difference'
                    ],
                    explanation: 'pow() operates on floats and uses logarithmic computation internally, which is very slow on AVR chips that lack a floating-point unit (FPU). Simple multiplication (x * x) uses a single hardware multiply instruction on AVR, which is 10-50x faster. Save pow() for fractional exponents like pow(x, 0.5) (square root) or pow(x, 1.0/3.0) (cube root) where simple multiplication cannot replace it.'
                },
                {
                    question: 'What units do sin(), cos(), and tan() expect on Arduino?',
                    options: [
                        'Degrees',
                        'Radians',
                        'Gradians',
                        'Turns (0 to 1)'
                    ],
                    explanation: 'All C/C++ trigonometric functions (sin, cos, tan, asin, acos, atan) operate in radians. A full circle is 2*PI radians (approximately 6.2832), not 360 degrees. To convert degrees to radians: radians = degrees * PI / 180.0. Arduino provides the macro radians(deg) for this conversion. Passing degrees directly (e.g., sin(90)) gives the sine of 90 radians, which is not what you want.'
                },
                {
                    question: 'What does highByte(0xABCD) return?',
                    options: [
                        '0xCD (205)',
                        '0xAB (171)',
                        '0xABCD (43981)',
                        '0x00 (0)'
                    ],
                    explanation: 'highByte() extracts the upper 8 bits of a 16-bit integer. For 0xABCD, the high byte is 0xAB (decimal 171) and the low byte is 0xCD (decimal 205). To reconstruct the original: (highByte << 8) | lowByte = (0xAB << 8) | 0xCD = 0xABCD. This split-and-reconstruct pattern is used constantly when reading multi-byte data from I2C sensors, which transmit one byte at a time.'
                },
                {
                    question: 'Why should you never compare float values with == in Arduino?',
                    options: [
                        'The == operator does not work with floats',
                        'Float arithmetic has limited precision (6-7 digits), so seemingly equal values may differ by tiny amounts',
                        'Floats are stored as strings internally',
                        'It causes the Arduino to crash'
                    ],
                    explanation: 'Arduino float has only 6-7 digits of decimal precision. Operations that should produce exact results often introduce tiny rounding errors. For example, 0.1 + 0.2 may equal 0.30000001192 rather than exactly 0.3. Using == to compare these values would fail even though they are "equal" for practical purposes. Instead, check if the difference is small: if (abs(a - b) < 0.001). The tolerance (0.001) depends on your application.'
                },
                {
                    question: 'What does the expression (sin(t * 2.0 * PI) + 1.0) * 127.5 produce for LED fading?',
                    options: [
                        'A linear ramp from 0 to 255',
                        'A smooth oscillation between 0 and 255',
                        'A random value between 0 and 255',
                        'A constant value of 127'
                    ],
                    explanation: 'sin() oscillates between -1 and +1. Adding 1.0 shifts the range to 0 to 2. Multiplying by 127.5 scales to 0 to 255. The result is a smooth, sinusoidal oscillation -- a breathing effect. When t increments linearly (using millis()/1000.0), the LED smoothly brightens and dims with no sudden jumps. The 2.0 * PI factor makes the wave complete one full cycle per unit of t.'
                },
                {
                    question: 'What is the purpose of the bit() macro in Arduino?',
                    options: [
                        'It reads a specific bit from a byte',
                        'It creates a bitmask with a single bit set at the given position',
                        'It counts the number of set bits in a byte',
                        'It converts a byte to binary string representation'
                    ],
                    explanation: 'bit(n) is equivalent to (1 << n) -- it creates a byte with a single 1 at position n and 0s everywhere else. bit(0) = 0b00000001, bit(3) = 0b00001000, bit(7) = 0b10000000. It is purely syntactic sugar for readability. Use it for cleaner register manipulation: PORTB |= bit(5) instead of PORTB |= (1 << 5). The compiled output is identical.'
                },
                {
                    question: 'What does constrain() return when the value is within the specified range?',
                    options: [
                        'The minimum value',
                        'The maximum value',
                        'The original value, unchanged',
                        'The average of min and max'
                    ],
                    explanation: 'constrain(val, min, max) only modifies the value if it falls outside the range. If val >= min and val <= max, the function returns val unchanged. constrain(50, 0, 100) returns 50. The function is essentially: if (val < min) return min; if (val > max) return max; return val. This makes it safe to call constrain on every sensor reading -- in-range values pass through unaffected.'
                }
            ]
        });
        quiz.start();
    </script>
