    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 16: Arduino Libraries',
            description: 'Test your knowledge of built-in libraries, Library Manager, ZIP installation, library folder structure, creating custom libraries, header/implementation files, versioning, and publishing.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-ard-16-quiz',
            moduleId: 'pc-ard-16-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is an Arduino library?',
                    options: [
                        'A physical building where Arduino boards are manufactured',
                        'A pre-written code package that extends Arduino functionality with reusable classes and functions',
                        'A type of Arduino board designed for advanced users',
                        'A cloud service that stores your sketches online'
                    ],
                    explanation: 'An Arduino library is a collection of pre-written C/C++ source files (.h and .cpp) that provide reusable functions and classes. Libraries abstract complex operations behind simple function calls. When you write #include <Servo.h>, the compiler pulls in the Servo library\'s header file, which gives you access to the Servo class and its methods like attach() and write(). Libraries are compiled alongside your sketch and linked into a single binary for upload. The Arduino ecosystem has over 6,000 community libraries available through the Library Manager, plus dozens of built-in libraries that ship with the IDE.'
                },
                {
                    question: 'Which directive tells the compiler to include a library in your sketch?',
                    options: [
                        '#include <LibraryName.h>',
                        '#import LibraryName',
                        '#using LibraryName',
                        '#library LibraryName'
                    ],
                    explanation: '#include <LibraryName.h> is the C/C++ preprocessor directive that tells the compiler to find and include the library\'s header file. The angle brackets < > tell the compiler to search in the standard library directories (the Arduino libraries folder). Quotes " " tell the compiler to search in the sketch\'s directory first. For Arduino libraries, angle brackets are the convention. The #include directive is processed before compilation -- it literally inserts the contents of the header file into your sketch at that point, making all declared classes, functions, and constants available.'
                },
                {
                    question: 'What does the Servo library use internally to generate PWM signals for servo motors?',
                    options: [
                        'The analogWrite() function',
                        'Timer1 hardware timer for precise pulse width control',
                        'Software delay loops in a background thread',
                        'The SPI communication bus'
                    ],
                    explanation: 'The Servo library uses Timer1 on the ATmega328P to generate precisely-timed PWM pulses. Servo motors require a specific pulse width (typically 1-2 ms) within a 20 ms period. Timer1 is a 16-bit timer that provides the resolution needed for accurate servo positioning. This is why the Servo library conflicts with analogWrite() on pins 9 and 10 (which also use Timer1) and why you cannot use the Servo library simultaneously with other libraries that configure Timer1. Understanding these internal dependencies is essential for avoiding conflicts in complex projects.'
                },
                {
                    question: 'How do you open the Library Manager in Arduino IDE 2.x?',
                    options: [
                        'File > New > Library',
                        'Click the book icon in the left sidebar',
                        'Tools > Serial Monitor > Libraries tab',
                        'Edit > Preferences > Library Path'
                    ],
                    explanation: 'In Arduino IDE 2.x, the Library Manager is accessed by clicking the book icon (an open book symbol) in the left sidebar panel. This opens a searchable interface where you can discover, install, update, and remove libraries. In the older IDE 1.x, the path was Sketch > Include Library > Manage Libraries. The Library Manager connects to Arduino\'s online library index, which catalogs over 6,000 community-contributed libraries. You can search by name, keyword, or category, and each listing shows the author, version, description, and compatibility information.'
                },
                {
                    question: 'When downloading a library from GitHub, what common issue must you fix before the IDE recognizes it?',
                    options: [
                        'The file must be converted from .zip to .tar format',
                        'The extracted folder name often has a branch suffix like "-main" or "-master" that must be removed',
                        'GitHub libraries require a special license key to activate',
                        'The .cpp files must be renamed to .ino files'
                    ],
                    explanation: 'When you download a ZIP from GitHub using the "Download ZIP" button, the extracted folder is typically named "LibraryName-main" or "LibraryName-master" (appending the branch name). The Arduino IDE expects the folder name to exactly match the library name referenced in the header file. You must rename the folder to remove the branch suffix (e.g., rename "Servo-main" to "Servo") before placing it in your Arduino/libraries/ directory. Failing to do this is the most common reason GitHub-downloaded libraries appear invisible to the IDE.'
                },
                {
                    question: 'What is the standard folder structure for a modern Arduino library?',
                    options: [
                        'All .ino files in a single flat directory',
                        'A root folder containing src/ (source files), examples/ (example sketches), keywords.txt, and library.properties',
                        'A build/ folder with compiled binaries and a config.xml file',
                        'A lib/ folder with .dll files and a manifest.json'
                    ],
                    explanation: 'A properly structured Arduino library contains: src/ directory with .h (header) and .cpp (implementation) files, examples/ directory with subdirectories each containing an example .ino sketch, keywords.txt for IDE syntax highlighting, library.properties for metadata (name, version, author, description), and optionally README.md and LICENSE files. The src/ directory is the modern standard (post-1.5 format). The IDE automatically searches src/ and its subdirectories for source files to compile. Example sketch subdirectory names must match their .ino filename.'
                },
                {
                    question: 'What is the purpose of keywords.txt in an Arduino library?',
                    options: [
                        'It lists search keywords for the Library Manager index',
                        'It defines syntax highlighting colors for library classes (KEYWORD1) and methods (KEYWORD2) in the IDE',
                        'It contains a list of reserved variable names that sketches cannot use',
                        'It specifies which Arduino boards are compatible with the library'
                    ],
                    explanation: 'keywords.txt defines syntax highlighting for the Arduino IDE. The format is tab-separated: the keyword followed by a tab, then the keyword type. KEYWORD1 colors class names (typically orange in the IDE). KEYWORD2 colors methods and functions. LITERAL1 colors constants. This file is optional but professional libraries include it because proper syntax highlighting makes the library feel native to the IDE and helps users see at a glance which identifiers belong to the library versus their own code.'
                },
                {
                    question: 'Why should you never modify a library installed via Library Manager directly in its folder?',
                    options: [
                        'The files are read-only and cannot be edited',
                        'Library Manager updates will overwrite all your changes without warning',
                        'Modified libraries cause the IDE to crash on startup',
                        'Arduino libraries are encrypted and cannot be read'
                    ],
                    explanation: 'When you update a library through the Library Manager, it downloads the new version and completely replaces the existing folder contents. Any modifications you made to the source files are permanently destroyed without warning or backup. The correct approach is to copy the library to a new folder with a different name (e.g., "ServoCustom"), update the library.properties name field, rename the header file to match, and make your modifications in the copy. This way the original library can be updated independently while your custom version remains untouched.'
                },
                {
                    question: 'What do include guards (#ifndef / #define / #endif) prevent in a header file?',
                    options: [
                        'They prevent the header from being included in sketches that use the wrong board',
                        'They prevent unauthorized users from reading the library source code',
                        'They prevent the header file from being processed more than once during compilation, avoiding redefinition errors',
                        'They prevent the library from being installed on incompatible operating systems'
                    ],
                    explanation: 'Include guards prevent double-inclusion of a header file. If multiple source files #include the same header, or if headers include each other (circular dependencies), the preprocessor would process the same declarations multiple times, causing "redefinition" compiler errors. The pattern works like this: #ifndef MYLIB_H checks if MYLIB_H is not yet defined. If true, #define MYLIB_H defines it and the header content is processed. On any subsequent inclusion, MYLIB_H is already defined, so #ifndef fails and the entire header is skipped. Every header file must have include guards.'
                },
                {
                    question: 'In a library .cpp file, what does the :: operator do in Blinker::begin()?',
                    options: [
                        'It creates a new instance of the Blinker class',
                        'It specifies that begin() belongs to the Blinker class (scope resolution operator)',
                        'It imports the Blinker namespace into the current file',
                        'It calls the begin() function of the parent class'
                    ],
                    explanation: 'The :: operator is the C++ scope resolution operator. In Blinker::begin(), it tells the compiler that this begin() function is a member of the Blinker class, not a standalone global function. In the .h file, you declare methods inside the class body. In the .cpp file, you implement them outside the class body using ClassName::methodName() syntax. This separation allows the header to serve as a public API reference (declarations only) while the .cpp contains the actual implementation logic. Without ::, the compiler would treat begin() as an unrelated global function.'
                },
                {
                    question: 'What does the "architectures" field in library.properties control?',
                    options: [
                        'The CPU architecture of the computer where the IDE runs',
                        'Which Arduino board families (AVR, SAMD, ESP32, etc.) the library supports',
                        'The physical architecture of the library folder structure',
                        'The number of CPU cores the library can use simultaneously'
                    ],
                    explanation: 'The architectures field in library.properties specifies which Arduino platform architectures the library is compatible with. Common values include "avr" (Uno, Mega, Nano), "samd" (MKR, Zero), "esp32", "esp8266", "mbed" (Nano 33 BLE), or "*" (all architectures). If a library uses AVR-specific registers like PORTB or DDRB, it should specify "architectures=avr" because those registers do not exist on ARM or ESP32 boards. Setting "architectures=*" means the library uses only standard Arduino functions and should work on any board.'
                },
                {
                    question: 'In semantic versioning (1.4.2), what does incrementing the MAJOR number indicate?',
                    options: [
                        'A bug fix that does not change the API',
                        'A new feature added in a backwards-compatible way',
                        'A breaking change that may require sketch modifications to adapt',
                        'A documentation update with no code changes'
                    ],
                    explanation: 'In semantic versioning (MAJOR.MINOR.PATCH), incrementing the MAJOR number (e.g., 1.x.x to 2.0.0) signals breaking changes. The library\'s API has changed in incompatible ways: functions may have been renamed, removed, had their parameter signatures changed, or their behavior altered. Existing sketches that use the library may need modification to work with the new version. MINOR increments (x.4.x to x.5.x) add new features without breaking existing code. PATCH increments (x.x.2 to x.x.3) fix bugs without adding features or breaking compatibility.'
                },
                {
                    question: 'How do you submit a library for inclusion in the official Arduino Library Manager?',
                    options: [
                        'Email the .zip file to Arduino support',
                        'Upload it to the Arduino Create cloud IDE',
                        'Open a pull request to the arduino/library-registry repository on GitHub with your repo URL',
                        'Post it on the Arduino forum with the #library tag'
                    ],
                    explanation: 'To publish a library to the Arduino Library Manager, you open a pull request to the arduino/library-registry repository on GitHub. Your PR adds a single line containing your library\'s GitHub repository URL. Arduino\'s CI system automatically validates your library: checking for required files (library.properties, examples), verifying the folder structure, ensuring the name is unique, and confirming it compiles. Arduino maintainers review the PR and either approve or request changes. Once merged, your library appears in the Library Manager for all Arduino IDE users worldwide.'
                },
                {
                    question: 'Which built-in Arduino library provides I2C/TWI communication on pins A4 (SDA) and A5 (SCL)?',
                    options: [
                        'SPI',
                        'Wire',
                        'Serial',
                        'Ethernet'
                    ],
                    explanation: 'The Wire library provides I2C (Inter-Integrated Circuit) / TWI (Two-Wire Interface) communication. On the Arduino Uno, it uses analog pins A4 (SDA - data line) and A5 (SCL - clock line). The Wire library supports both master and slave modes, addressing up to 127 devices on the same two-wire bus. It is used by the majority of I2C sensors, OLED displays, real-time clocks, and I/O expanders. Wire.begin() initializes the bus as master, Wire.beginTransmission(addr) starts communication with a specific device, and Wire.requestFrom(addr, bytes) reads data from a device.'
                },
                {
                    question: 'Where should you look first to learn how a newly installed library works?',
                    options: [
                        'The library.properties file for API documentation',
                        'The keywords.txt file for function descriptions',
                        'File > Examples in the IDE, which shows example sketches bundled with the library',
                        'The Arduino forum archives for user tutorials'
                    ],
                    explanation: 'The fastest way to learn a new library is through its bundled example sketches, accessible via File > Examples in the Arduino IDE. Well-written libraries include at least one working example that demonstrates basic usage: how to include the library, create objects, initialize them in setup(), and use them in loop(). These examples compile and run immediately, giving you a working starting point to modify. They are written by the library author and represent the intended usage pattern. The examples/ directory is a required component for Library Manager publication, ensuring every published library has at least one working demonstration.'
                }
            ]
        });
        quiz.start();
    </script>
