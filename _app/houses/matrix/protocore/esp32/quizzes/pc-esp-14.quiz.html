    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 14: ESP32 Peripherals -- MCPWM, RMT, I2S',
            description: 'Test your understanding of MCPWM motor control, RMT for NeoPixels and IR, I2S audio, PCNT pulse counting, SDMMC, and LED PWM vs MCPWM.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-14-quiz',
            moduleId: 'pc-esp-14-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the primary purpose of the ESP32 MCPWM peripheral?',
                    options: [
                        'Generating audio tones for buzzers',
                        'Motor control with complementary PWM, dead-time insertion, and fault handling',
                        'Dimming LEDs with smooth fade effects',
                        'Driving addressable LED strips'
                    ],
                    explanation: 'MCPWM (Motor Control PWM) is a dedicated hardware peripheral for precise motor control. It generates complementary PWM output pairs (PWMxA and PWMxB) for driving H-bridge motor controllers, inserts configurable dead-time between transitions to prevent shoot-through, and provides hardware fault input pins that force outputs to a safe state in nanoseconds. These features are specific to motor control and power electronics -- they are not available on Arduino or through the ESP32 LEDC peripheral.'
                },
                {
                    question: 'What is dead-time insertion and why is it critical for H-bridge motor control?',
                    options: [
                        'A delay added to reduce motor noise during operation',
                        'A brief gap between turning off one transistor and turning on the other to prevent shoot-through',
                        'A timeout that stops the motor if no commands are received',
                        'A cooldown period between motor direction changes'
                    ],
                    explanation: 'Dead-time insertion adds a brief gap (typically 100-500 nanoseconds) between turning off one transistor in an H-bridge and turning on the complementary transistor. Without this gap, both the high-side and low-side transistors can be ON simultaneously for a brief moment during the transition, creating a short circuit (shoot-through) that can destroy the H-bridge. MCPWM enforces dead-time in hardware, guaranteeing the gap regardless of CPU load or interrupt latency.'
                },
                {
                    question: 'What is the ESP32 RMT peripheral originally designed for?',
                    options: [
                        'Real-time motor timing',
                        'Infrared remote control signal generation and capture',
                        'Radio modulation and transmission',
                        'Random memory testing'
                    ],
                    explanation: 'RMT stands for Remote Control Transceiver. It was originally designed for generating and capturing infrared (IR) remote control signals -- recording pulse trains from an IR receiver and replaying them through an IR LED. However, its ability to generate precisely timed pulse sequences in hardware makes it ideal for driving addressable LED strips (WS2812B/NeoPixel), which require sub-microsecond timing that software cannot reliably provide while WiFi is running.'
                },
                {
                    question: 'Why does the ESP32 use RMT to drive NeoPixel LEDs instead of bit-banging like Arduino?',
                    options: [
                        'RMT uses less power than bit-banging',
                        'Bit-banging fails because WiFi interrupts corrupt the sub-microsecond timing',
                        'RMT supports more colors than bit-banging',
                        'Bit-banging is not supported on ESP32 hardware'
                    ],
                    explanation: 'WS2812B NeoPixel LEDs require precisely timed pulses with sub-microsecond accuracy (0.4us/0.85us for a 0-bit, 0.8us/0.45us for a 1-bit). On Arduino, the code disables interrupts during transmission to guarantee timing. On ESP32, WiFi interrupts fire every few milliseconds and cannot be disabled without breaking network connectivity. The RMT peripheral generates the pulse train entirely in dedicated hardware with its own clock, independent of the CPU and its interrupts. WiFi keeps running while RMT drives the LEDs.'
                },
                {
                    question: 'How many RMT channels does the ESP32 have?',
                    options: [
                        '2 channels',
                        '4 channels',
                        '8 channels',
                        '16 channels'
                    ],
                    explanation: 'The ESP32 has 8 RMT channels. In newer ESP-IDF versions, these are split into 4 TX (transmit) channels and 4 RX (receive) channels. Each channel can independently drive a NeoPixel strip, decode an IR signal, or generate any arbitrary pulse pattern. This means you can run 4 independent LED strips simultaneously with zero CPU overhead. Each channel has its own 256-word memory block for storing pulse definitions.'
                },
                {
                    question: 'What does I2S stand for and what is it used for on ESP32?',
                    options: [
                        'Inter-Integrated Circuit Sound -- digital audio streaming via DMA',
                        'Intelligent Input/Output System -- sensor data processing',
                        'Internet to Serial -- network protocol conversion',
                        'Isolated Interrupt Service -- priority interrupt handling'
                    ],
                    explanation: 'I2S stands for Inter-IC Sound (Inter-Integrated Circuit Sound). It is a hardware peripheral for streaming digital audio data at high speed. On ESP32, I2S is used for input (reading from PDM microphones like the INMP441) and output (streaming PCM audio to external DACs like the MAX98357A for speaker playback). I2S uses DMA to transfer audio samples between memory and the peripheral continuously, without CPU involvement. The ESP32 has 2 independent I2S ports for simultaneous input and output.'
                },
                {
                    question: 'What type of microphone connects to the ESP32 via I2S?',
                    options: [
                        'Electret condenser microphone (analog)',
                        'Carbon microphone',
                        'MEMS PDM microphone (like INMP441)',
                        'Dynamic microphone with XLR connector'
                    ],
                    explanation: 'MEMS PDM microphones like the INMP441 or SPH0645 connect to the ESP32 via I2S. These digital microphones output audio as a Pulse Density Modulation stream that the I2S peripheral decodes to PCM samples in hardware. No external ADC is needed -- the microphone is fully digital. The INMP441 needs only 4 wires: WS (word select), SCK (bit clock), SD (serial data), and L/R (channel select). These $2 microphones provide near-studio-quality audio capture.'
                },
                {
                    question: 'What is the PCNT peripheral and why is it better than software interrupts for encoders?',
                    options: [
                        'A programmable counter that replaces the need for a CPU',
                        'A hardware pulse counter that counts at up to 40MHz without CPU involvement',
                        'A protocol converter for CAN bus networks',
                        'A power consumption monitor for battery applications'
                    ],
                    explanation: 'PCNT (Pulse Counter) is a hardware peripheral that counts pulses at up to 40MHz without any CPU involvement. For rotary encoders, it decodes quadrature signals (A and B channels) in hardware, tracking both count and direction. Software interrupts work for slow encoders (manual knobs), but a motor encoder at 10,000 RPM with 1,000 PPR generates 166,667 interrupts per second, consuming all CPU time. PCNT counts every pulse in hardware -- the CPU just reads a register when needed. The ESP32 has 8 PCNT units.'
                },
                {
                    question: 'How much faster is SDMMC compared to SPI mode for SD card access on ESP32?',
                    options: [
                        'About the same speed',
                        '2x faster',
                        '4-10x faster',
                        '100x faster'
                    ],
                    explanation: 'SDMMC is 4-10x faster than SPI mode for SD card access. SPI SD mode typically achieves 1-4 MB/s. SDMMC in 1-bit mode achieves 5-10 MB/s, and 4-bit mode achieves 10-20 MB/s. The speed difference comes from the native SD protocol (less overhead than SPI framing) and the ability to use 4 parallel data lines. SDMMC is essential for applications that write continuous data -- audio recording at 44.1kHz/16-bit requires 176KB/s sustained, which is comfortable for SDMMC but marginal for SPI.'
                },
                {
                    question: 'When should you use LEDC (LED PWM) instead of MCPWM?',
                    options: [
                        'When driving motors through an H-bridge',
                        'When controlling LED brightness, servos, or simple single-direction motor speed',
                        'When you need complementary PWM with dead-time',
                        'When you need hardware fault detection on PWM outputs'
                    ],
                    explanation: 'LEDC (LED PWM Controller) is designed for LED brightness control, servo motors (50Hz PWM), buzzer tones, and simple speed control with single-direction motor drivers (like the L298N enable pin). It has 16 independent channels with hardware fade (smooth dimming without a loop) and up to 20-bit resolution. Use MCPWM when you need complementary outputs, dead-time insertion, or fault handling -- features required for H-bridge motor control and power electronics. LEDC is simpler to configure and has more channels.'
                },
                {
                    question: 'What is the MCPWM hierarchy of components?',
                    options: [
                        'Channel, Pin, Register',
                        'Timer, Operator, Comparator',
                        'Clock, Divider, Output',
                        'Source, Filter, Modulator'
                    ],
                    explanation: 'MCPWM uses a three-layer hierarchy: Timer (generates the base PWM frequency), Operator (manages a PWM output pair -- PWMxA and PWMxB), and Comparator (sets the duty cycle by defining when the output transitions within each timer period). This separation allows multiple operators to share one timer for synchronized multi-channel output. The ESP32 has 2 MCPWM units, each with 3 operators and 2 comparators per operator, giving 6 independent PWM output pairs total.'
                },
                {
                    question: 'What maximum sample rate can the ESP32 I2S peripheral handle for audio?',
                    options: [
                        '8 kHz only',
                        'Up to 22.05 kHz',
                        'Up to 48 kHz (and beyond)',
                        'Up to 192 kHz'
                    ],
                    explanation: 'The ESP32 I2S peripheral supports sample rates from 8kHz to 48kHz and beyond at 16-bit or 32-bit depth. Phone quality is 8kHz/16-bit. CD quality is 44.1kHz/16-bit. The ESP32 can handle CD-quality audio in both directions (input and output) simultaneously using its 2 independent I2S ports. DMA buffering ensures continuous audio streaming without CPU intervention. For most embedded applications, 16kHz/16-bit provides excellent voice quality at manageable data rates.'
                },
                {
                    question: 'How does the ESP32 GPIO matrix benefit peripheral usage?',
                    options: [
                        'It automatically detects which peripheral is connected to each pin',
                        'It lets you route any peripheral to almost any GPIO pin in software',
                        'It provides voltage level shifting between 3.3V and 5V',
                        'It increases the current output of GPIO pins'
                    ],
                    explanation: 'The ESP32 GPIO matrix allows you to route any peripheral signal to almost any GPIO pin through software configuration. Unlike Arduino where each peripheral is hard-wired to specific pins, you can assign MCPWM channel 0 to GPIO 15, GPIO 25, or any other available pin. This means you design your PCB layout first, then assign peripherals to pins in software. The only exceptions are a few pins with fixed functions: ADC-only inputs (GPIO 34-39), DAC outputs (GPIO 25, 26), and strapping pins.'
                },
                {
                    question: 'What is the GPIO conflict when using SDMMC in 1-bit mode?',
                    options: [
                        'SDMMC conflicts with the SPI bus pins',
                        'SDMMC DATA0 uses GPIO 2, which is also the built-in LED pin',
                        'SDMMC conflicts with the I2C bus',
                        'SDMMC requires pins that are input-only'
                    ],
                    explanation: 'SDMMC in 1-bit mode uses GPIO 2 for DATA0, GPIO 14 for CLK, and GPIO 15 for CMD. GPIO 2 is also the built-in LED pin on most ESP32 DevKit boards. This means you cannot blink the LED and use SDMMC simultaneously. In 4-bit mode, the conflict is worse: GPIO 12 (DATA2) is a strapping pin that controls flash voltage selection, which can prevent the ESP32 from booting if a pull-up resistor on the SD card module holds it HIGH during reset.'
                },
                {
                    question: 'What happens if MCPWM detects a fault signal on its fault input pin?',
                    options: [
                        'It logs an error message to Serial',
                        'It gradually reduces the PWM duty cycle to zero',
                        'It immediately forces PWM outputs to a safe state in hardware (nanoseconds)',
                        'It triggers a software interrupt for the user to handle'
                    ],
                    explanation: 'When MCPWM detects a fault signal on its hardware fault input pin, it immediately forces the PWM outputs to a pre-configured safe state -- both LOW, both HIGH, or tri-state (high impedance). This happens in nanoseconds, entirely in hardware, without any software intervention or interrupt processing delay. This is critical for motor safety: an overcurrent condition during H-bridge operation needs to shut down the PWM outputs faster than any software could react. The safe state is configured during MCPWM setup.'
                }
            ]
        });
        quiz.start();
    </script>
