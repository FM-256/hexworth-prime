    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 15: Advanced Networking',
            description: 'Test your understanding of promiscuous mode, 802.11 frame structure, deauth detection, captive portals, DNS redirection, raw sockets, multicast, mDNS, and Ethernet.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-15-quiz',
            moduleId: 'pc-esp-15-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does promiscuous mode do on the ESP32 WiFi radio?',
                    options: [
                        'It connects to all available WiFi networks simultaneously',
                        'It captures every 802.11 frame on the current channel, not just frames addressed to the ESP32',
                        'It increases the WiFi transmission power for longer range',
                        'It enables encrypted communication between ESP32 devices'
                    ],
                    explanation: 'In promiscuous mode, the ESP32 WiFi radio removes its MAC address filter and delivers every 802.11 frame on the current channel to your callback function. In normal (station) mode, only packets addressed to your MAC address are passed to your code. Promiscuous mode lets you see beacon frames from access points, probe requests from client devices, data frames between other devices, and management frames like deauthentication. This is the same mode that packet capture tools like Wireshark use.'
                },
                {
                    question: 'Why can the ESP32 only capture packets on one WiFi channel at a time?',
                    options: [
                        'The hardware has only one radio receiver tuned to a single frequency',
                        'The firmware limits capture to one channel for security reasons',
                        'Multi-channel capture requires a license from Espressif',
                        'The ESP32 CPU is too slow to process packets from multiple channels'
                    ],
                    explanation: 'The ESP32 has a single WiFi radio receiver that can only be tuned to one frequency (channel) at a time. Each WiFi channel corresponds to a specific center frequency in the 2.4GHz band (channel 1 = 2412MHz, channel 6 = 2437MHz, channel 11 = 2462MHz). To see traffic on other channels, you must retune the radio using esp_wifi_set_channel(). Channel hopping cycles through channels 1-13, dwelling on each for 200-500ms to capture a sample of traffic across the entire spectrum.'
                },
                {
                    question: 'What are the three types of 802.11 frames?',
                    options: [
                        'Request, Response, and Error',
                        'Management, Control, and Data',
                        'Header, Payload, and Trailer',
                        'Beacon, Probe, and Association'
                    ],
                    explanation: 'The three types of 802.11 frames are: Management (type 0) -- beacons, probe requests/responses, authentication, association, deauthentication; Control (type 1) -- ACK, RTS, CTS, Block ACK for medium access coordination; and Data (type 2) -- actual payload data, encrypted on WPA2/WPA3 networks. The type is identified by bits 2-3 of the Frame Control field. Beacon, probe, and association are subtypes within the management frame type.'
                },
                {
                    question: 'Why are 802.11 management frames vulnerable to forgery on WPA2 networks?',
                    options: [
                        'WPA2 uses weak encryption for management frames',
                        'Management frames are not authenticated or encrypted, even on WPA2 networks',
                        'WPA2 does not verify the source MAC address of any frame',
                        'Management frames are only sent in plaintext during the initial handshake'
                    ],
                    explanation: 'On WPA2 networks, management frames (beacons, deauth, disassociation) are sent completely unprotected -- they are neither encrypted nor authenticated. Any device can forge a management frame with a spoofed source MAC address. This is why deauthentication attacks work: an attacker sends forged deauth frames that the victim device accepts as legitimate. WPA3 addresses this with Protected Management Frames (PMF / 802.11w), which cryptographically authenticates management frames.'
                },
                {
                    question: 'What indicates a deauthentication attack rather than a normal disconnect?',
                    options: [
                        'The deauth frame uses a specific reason code',
                        'A flood of deauth frames (dozens per second), often with broadcast destination',
                        'The deauth frame comes from a known AP MAC address',
                        'The deauth frame is encrypted'
                    ],
                    explanation: 'A normal network disconnect produces occasional single deauthentication frames (one per client disconnect). A deauth attack produces a flood -- dozens or hundreds of deauth frames per second, often with a broadcast destination address (FF:FF:FF:FF:FF:FF) to disconnect all clients simultaneously. Detection monitors the deauth frame rate: if it exceeds a threshold (10+ per second), it is almost certainly an attack. The attacker MAC address and RSSI (signal strength, indicating approximate distance) should be logged for investigation.'
                },
                {
                    question: 'How does a captive portal redirect all web traffic to the ESP32?',
                    options: [
                        'It modifies the client device routing table',
                        'It runs a DNS server that resolves all domain queries to the ESP32 IP address',
                        'It injects HTTP redirect headers into all network traffic',
                        'It uses ARP spoofing to intercept packets'
                    ],
                    explanation: 'A captive portal runs a DNS server on the ESP32 that responds to all DNS queries with the ESP32\'s own IP address (192.168.4.1). When a client device connects to the ESP32 AP and tries to load google.com, the DNS query goes to the ESP32, which responds "google.com is at 192.168.4.1." The browser then connects to the ESP32 web server and receives the portal page. The wildcard DNS rule (DNSServer.start(53, "*", WiFi.softAPIP())) catches every domain, ensuring no web request reaches the internet.'
                },
                {
                    question: 'What is the legitimate use case for a captive portal on an ESP32?',
                    options: [
                        'Blocking internet access from unauthorized devices',
                        'Device provisioning -- letting users configure WiFi credentials through a web form',
                        'Capturing user passwords from web traffic',
                        'Serving advertisements to connected devices'
                    ],
                    explanation: 'The standard legitimate use of a captive portal on ESP32 is device provisioning (also called WiFi onboarding). IoT devices with no keyboard or screen create a temporary WiFi network. The user connects, sees a web form, and enters their home WiFi credentials. The ESP32 then connects to the real network and disables the captive portal. Every consumer IoT device from smart plugs to security cameras uses this pattern. The WiFiManager Arduino library automates the entire provisioning flow.'
                },
                {
                    question: 'What multicast address and port does mDNS use?',
                    options: [
                        '224.0.0.1 port 53',
                        '224.0.0.251 port 5353',
                        '239.255.255.250 port 1900',
                        '255.255.255.255 port 67'
                    ],
                    explanation: 'mDNS uses multicast address 224.0.0.251 on port 5353. This is a well-known multicast group that all mDNS-capable devices join automatically. When a device wants to resolve a .local hostname, it sends a DNS query to 224.0.0.251:5353. The target device responds with its IP address. 239.255.255.250:1900 is used by SSDP (UPnP/DLNA). 224.0.0.1 is the all-hosts multicast group. 255.255.255.255:67 is used by DHCP.'
                },
                {
                    question: 'What is the benefit of mDNS for ESP32 IoT devices?',
                    options: [
                        'It provides encrypted communication between devices',
                        'It enables zero-configuration device discovery by hostname and service type',
                        'It increases WiFi range through mesh networking',
                        'It provides cloud-free firmware updates'
                    ],
                    explanation: 'mDNS enables zero-configuration device discovery. An ESP32 announces itself as "mydevice.local" and can advertise services (e.g., _http._tcp on port 80). Any device on the same network can reach it by name instead of IP address, and can discover services by type. Deploy 10 ESP32 sensors, each advertising _sensor._tcp, and a dashboard ESP32 discovers all of them automatically. No DNS server, no static IPs, no configuration files. Add or remove devices and the network adapts.'
                },
                {
                    question: 'What hardware does the ESP32 need for wired Ethernet networking?',
                    options: [
                        'An external USB-to-Ethernet adapter',
                        'A LAN8720 PHY chip -- the ESP32 has a built-in Ethernet MAC',
                        'An ESP32 Ethernet shield with a W5500 chip',
                        'A separate ESP32 module dedicated to Ethernet'
                    ],
                    explanation: 'The ESP32 has a built-in Ethernet MAC (Media Access Controller) but no PHY (Physical layer transceiver). The LAN8720 chip converts the MAC\'s digital RMII signals to the analog signals that travel on an Ethernet cable. ESP32 + LAN8720 boards (like the Olimex ESP32-EVB or WT32-ETH01) cost $8-12. The Arduino ETH.h library provides the same networking API as WiFi. The ESP32 can run WiFi and Ethernet simultaneously for redundant connectivity.'
                },
                {
                    question: 'What is the difference between broadcast and multicast?',
                    options: [
                        'Broadcast is faster, multicast is more reliable',
                        'Broadcast reaches all devices on the subnet, multicast reaches only devices that joined a specific group',
                        'Broadcast works on WiFi, multicast works only on Ethernet',
                        'Broadcast sends one packet, multicast sends copies to each recipient'
                    ],
                    explanation: 'Broadcast (255.255.255.255 or subnet broadcast) reaches every device on the local network -- all devices must process the packet even if they do not care about it. Multicast (224.0.0.0-239.255.255.255) reaches only devices that have explicitly joined that multicast group using setsockopt(IP_ADD_MEMBERSHIP). Multicast is more efficient because uninsterested devices can ignore the traffic at the network layer. mDNS, SSDP, and other discovery protocols use multicast to avoid flooding the entire network.'
                },
                {
                    question: 'What TCP/IP stack does the ESP32 run?',
                    options: [
                        'Linux TCP/IP stack',
                        'lwIP (lightweight IP)',
                        'Windows Sockets (Winsock)',
                        'uIP (micro IP)'
                    ],
                    explanation: 'The ESP32 runs lwIP (lightweight IP), a full TCP/IP stack designed for embedded systems. lwIP provides POSIX-compatible socket APIs: socket(), bind(), listen(), accept(), send(), recv(), and setsockopt(). You can use the same socket programming patterns as Linux. lwIP handles TCP connection management, IP routing, DHCP, DNS resolution, and multicast group membership. The Arduino WiFiClient and WiFiUDP classes are wrappers around lwIP sockets.'
                },
                {
                    question: 'What is the Frame Control field in an 802.11 header used for?',
                    options: [
                        'It contains the encryption key for the frame payload',
                        'It identifies the protocol version, frame type, subtype, and flags',
                        'It specifies the destination IP address',
                        'It contains the frame checksum'
                    ],
                    explanation: 'The 2-byte Frame Control field is the first field in every 802.11 frame header. It contains the protocol version (always 0 for current WiFi), frame type (0=management, 1=control, 2=data), frame subtype (e.g., 8=beacon, 12=deauth for management frames), and several flags including ToDS, FromDS, Retry, and Power Management. Parsing the type and subtype bytes from the Frame Control field tells you exactly what kind of frame you captured, which is the first step in any packet analysis.'
                },
                {
                    question: 'What is an evil twin attack and how can an ESP32 detect it?',
                    options: [
                        'Two ESP32 boards running the same firmware -- detected by MAC address comparison',
                        'An attacker mimics a legitimate AP SSID with a different BSSID -- detected by comparing captured BSSIDs against a whitelist',
                        'A device that connects to two networks simultaneously -- detected by monitoring DHCP leases',
                        'A man-in-the-middle attack on Bluetooth -- detected by BLE scanning'
                    ],
                    explanation: 'An evil twin attack creates a rogue access point with the same SSID as a legitimate network but a different BSSID (MAC address), often with stronger signal and no encryption to lure clients. An ESP32 in promiscuous mode can detect this by capturing beacon frames, building a list of all SSIDs and their BSSIDs, and comparing against a whitelist of known legitimate AP BSSIDs. If the same SSID appears with an unknown BSSID -- especially one that is unencrypted or unusually strong -- it is likely an evil twin.'
                },
                {
                    question: 'What WiFi frequency band can the ESP32 monitor in promiscuous mode?',
                    options: [
                        '2.4GHz and 5GHz',
                        '2.4GHz only (channels 1-13)',
                        '5GHz only',
                        '2.4GHz, 5GHz, and 6GHz'
                    ],
                    explanation: 'The ESP32\'s WiFi radio operates on the 2.4GHz band only, covering channels 1-13 (2412-2472 MHz). It cannot capture or transmit on 5GHz. This is a significant limitation for network monitoring because many modern routers use 5GHz for primary traffic. However, many IoT devices, older clients, and Bluetooth all operate in 2.4GHz. For full-spectrum monitoring, you would need a dual-band or tri-band WiFi adapter. The ESP32 remains effective for 2.4GHz-focused analysis.'
                }
            ]
        });
        quiz.start();
    </script>
