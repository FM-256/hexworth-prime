    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 4: Bluetooth -- Classic and BLE',
            description: 'Test your understanding of Bluetooth Classic SPP, BLE GATT architecture, server/client roles, notifications, security, and when to use each protocol.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-04-quiz',
            moduleId: 'pc-esp-04-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What library does the ESP32 use for Bluetooth Classic Serial Port Profile (SPP)?',
                    options: [
                        'BLEDevice.h',
                        'BluetoothSerial.h',
                        'WiFiClient.h',
                        'HardwareSerial.h'
                    ],
                    explanation: 'The ESP32 uses the BluetoothSerial library for Bluetooth Classic SPP communication. You include BluetoothSerial.h, create a BluetoothSerial object (commonly named SerialBT), and call SerialBT.begin("DeviceName") to start advertising. After a phone or PC pairs with the ESP32, you use read() and write() exactly like hardware serial -- it is a wireless UART. BLEDevice.h is for Bluetooth Low Energy (a completely different protocol). WiFiClient.h is for TCP connections over WiFi. HardwareSerial.h is for wired UART communication on the ESP32 physical pins.'
                },
                {
                    question: 'In the BLE GATT hierarchy, what is the correct order from top to bottom?',
                    options: [
                        'Profile > Service > Characteristic > Descriptor',
                        'Service > Profile > Descriptor > Characteristic',
                        'Characteristic > Service > Descriptor > Profile',
                        'Descriptor > Characteristic > Service > Profile'
                    ],
                    explanation: 'The GATT (Generic Attribute Profile) hierarchy goes: Profile > Service > Characteristic > Descriptor. A Profile is a collection of Services. A Service (identified by a UUID) groups related Characteristics. A Characteristic holds the actual data value and has properties like Read, Write, and Notify. A Descriptor provides metadata about a Characteristic -- the most important being the CCCD (Client Characteristic Configuration Descriptor, UUID 0x2902), which enables or disables notifications. Every BLE interaction follows this hierarchy.'
                },
                {
                    question: 'What does the CCCD (Client Characteristic Configuration Descriptor) control?',
                    options: [
                        'The Bluetooth device name',
                        'The advertising interval',
                        'Whether notifications and indications are enabled for a characteristic',
                        'The MTU size for data transfer'
                    ],
                    explanation: 'The CCCD (UUID 0x2902) is a special descriptor attached to characteristics that support notifications or indications. When a client writes 0x0001 to the CCCD, it tells the server "start sending me notifications for this characteristic." Writing 0x0002 enables indications (acknowledged notifications). Writing 0x0000 disables both. Without enabling the CCCD, calling notify() on the server side does nothing -- the server has no subscribers to send to. The BLE2902 class in the ESP32 BLE library handles CCCD management automatically when added to a characteristic.'
                },
                {
                    question: 'What is the first step to create a BLE server on the ESP32?',
                    options: [
                        'Call BLEDevice::startAdvertising()',
                        'Create a BLECharacteristic object',
                        'Call BLEDevice::init("DeviceName")',
                        'Call BLEDevice::createServer()'
                    ],
                    explanation: 'BLEDevice::init("DeviceName") must be called first to initialize the BLE stack and set the device name that appears during scanning. The initialization sequence is: 1) BLEDevice::init() to start the BLE stack, 2) BLEDevice::createServer() to create a server instance, 3) server->createService(uuid) to add a service, 4) service->createCharacteristic() to add characteristics, 5) service->start() to activate the service, and 6) BLEDevice::startAdvertising() to begin broadcasting. Skipping init() will crash because the Bluetooth controller hardware is not yet configured.'
                },
                {
                    question: 'What does BLEDevice::startAdvertising() do?',
                    options: [
                        'Connects to a specific BLE device',
                        'Begins broadcasting advertisement packets so clients can discover the device',
                        'Starts scanning for nearby BLE devices',
                        'Encrypts the BLE connection with TLS'
                    ],
                    explanation: 'startAdvertising() begins broadcasting BLE advertisement packets on the 2.4 GHz radio. These are short, periodic broadcasts (typically every 100-500ms) that contain the device name, service UUIDs, and other metadata. Any BLE central (phone, laptop, another ESP32) that is scanning will detect these packets and can initiate a connection. The advertisement packet is limited to 31 bytes, with an optional 31-byte scan response for additional data. Advertising continues until a client connects (at which point it stops by default) or until you explicitly call stopAdvertising().'
                },
                {
                    question: 'In BLE, what is the difference between a notification and an indication?',
                    options: [
                        'Notifications are encrypted; indications are not',
                        'Notifications require no acknowledgment; indications require the client to acknowledge receipt',
                        'Notifications are for read operations; indications are for write operations',
                        'There is no difference -- they are synonyms'
                    ],
                    explanation: 'Notifications and indications both push data from server to client, but they differ in reliability. A notification is fire-and-forget: the server sends the data, and if the packet is lost, neither side knows. An indication requires the client to send an acknowledgment (ATT confirmation) after receiving the data. If the server does not receive the confirmation, it can retransmit. Notifications are faster (no round-trip delay) and suitable for sensor streams where an occasional lost reading is acceptable. Indications are slower but guarantee delivery, making them appropriate for critical commands or state changes.'
                },
                {
                    question: 'What happens if two ESP32 devices connect to an MQTT broker with the same client ID?',
                    options: [
                        'Both devices connect successfully and share messages',
                        'The broker rejects the second connection',
                        'The broker disconnects the first device when the second connects',
                        'The broker merges both connections into one session'
                    ],
                    explanation: 'When a second device connects with the same client ID, the MQTT broker disconnects the first device. The MQTT specification requires unique client IDs per connection. The broker treats the new connection as the same client reconnecting, so it drops the old connection and replaces it with the new one. This causes the first device to unexpectedly lose its connection, and if it has reconnection logic, it will reconnect -- which then kicks the second device off. This creates a "ping-pong" disconnect loop. Always use unique client IDs, such as "ESP32-" + the device MAC address.'
                },
                {
                    question: 'Which BLE pairing method provides MITM (Man-in-the-Middle) protection?',
                    options: [
                        'Just Works',
                        'Passkey Entry',
                        'No pairing (open connection)',
                        'OOB with NFC only'
                    ],
                    explanation: 'Passkey Entry provides MITM protection by requiring the user to enter a 6-digit PIN displayed on one device into the other device. This confirms that both devices are communicating with each other and not with an attacker in the middle. Just Works pairing provides encryption but zero MITM protection -- an attacker can intercept the key exchange because there is no user verification step. Numeric Comparison (where both devices display the same number and the user confirms) also provides MITM protection. For security-sensitive applications, always use Passkey or Numeric Comparison, never Just Works.'
                },
                {
                    question: 'What is the maximum data rate comparison between Bluetooth Classic and BLE?',
                    options: [
                        'Classic: ~100 Kbps, BLE: ~3 Mbps',
                        'Classic: ~3 Mbps, BLE: ~100 Kbps effective',
                        'Both support the same maximum of 1 Mbps',
                        'Classic: ~10 Mbps, BLE: ~1 Mbps'
                    ],
                    explanation: 'Bluetooth Classic supports up to approximately 3 Mbps (with Enhanced Data Rate), while BLE achieves roughly 100 Kbps effective throughput (the raw PHY rate is 1-2 Mbps for BLE 4/5, but protocol overhead and connection intervals reduce actual data throughput significantly). This makes Classic the better choice for continuous data streams like audio (A2DP), file transfers, and serial debug sessions. BLE is designed for small, infrequent data packets -- sensor readings, button presses, status updates -- where power efficiency matters more than throughput.'
                },
                {
                    question: 'What does "bonding" mean in BLE security?',
                    options: [
                        'Establishing an initial encrypted connection',
                        'Saving pairing keys to flash so devices remember each other across power cycles',
                        'Setting the advertising interval to the minimum value',
                        'Creating a physical wire connection as backup'
                    ],
                    explanation: 'Bonding is the process of saving the encryption keys generated during pairing to persistent storage (flash/NVS on the ESP32). When two bonded devices meet again, they can re-establish an encrypted connection without repeating the full pairing process -- no PIN entry, no user interaction, just instant secure reconnection in milliseconds. Without bonding, every power cycle requires a fresh pairing. The ESP32 stores bonded device keys in NVS (Non-Volatile Storage). Bonding is essential for devices like fitness trackers and smart locks that reconnect frequently.'
                },
                {
                    question: 'What is the purpose of setActiveScan(true) when scanning for BLE devices?',
                    options: [
                        'It increases the scanning range to 100 meters',
                        'It sends scan requests to get additional data from peripherals in scan responses',
                        'It filters out all non-connectable advertisements',
                        'It enables Bluetooth Classic scanning alongside BLE'
                    ],
                    explanation: 'Active scanning sends a SCAN_REQ packet to each discovered peripheral after receiving its advertisement. The peripheral responds with a SCAN_RSP packet containing additional data (up to 31 extra bytes) that did not fit in the primary advertisement. This gives you more information about each device -- full device name, additional service UUIDs, manufacturer data. Passive scanning only listens for advertisement packets without requesting more data. Active scanning uses slightly more power but provides better device discovery. The trade-off is minimal for the ESP32 since it is WiFi-powered, not running on a coin cell.'
                },
                {
                    question: 'Why must you call startAdvertising() again in the onDisconnect callback?',
                    options: [
                        'To increase the Bluetooth signal strength',
                        'To clear the connection cache',
                        'Because the ESP32 stops advertising by default when a client connects, and new clients cannot discover it after the first client disconnects',
                        'To switch from BLE to Bluetooth Classic mode'
                    ],
                    explanation: 'When a BLE client connects to the ESP32 server, the ESP32 automatically stops advertising. This is standard BLE behavior -- a peripheral typically serves one central at a time. When that client disconnects, the ESP32 does not automatically resume advertising. If you do not call startAdvertising() in the onDisconnect callback, no new clients can discover or connect to your device. It becomes invisible. This is one of the most common BLE beginner mistakes -- the device works once, then seems to "break" after the first client disconnects. Always restart advertising in onDisconnect.'
                },
                {
                    question: 'How many simultaneous BLE connections can the ESP32 typically maintain?',
                    options: [
                        'Exactly 1',
                        'Up to ~9 (depending on configuration and memory)',
                        'Unlimited',
                        'Exactly 4'
                    ],
                    explanation: 'The ESP32 can maintain approximately 9 simultaneous BLE connections, though the exact number depends on the NimBLE/Bluedroid stack configuration and available RAM. Each connection uses a connection handle and consumes memory for buffers and state tracking. For the gateway pattern (ESP32 as central connecting to multiple sensors), this limit determines how many peripherals you can monitor simultaneously. For scenarios requiring more devices, consider connectionless approaches: BLE beacons broadcast data in advertisement packets without establishing connections, allowing the ESP32 to receive data from hundreds of nearby devices by scanning.'
                },
                {
                    question: 'What advantage does the ESP32 have over most other BLE microcontrollers regarding Bluetooth?',
                    options: [
                        'It has the longest BLE range of any chip',
                        'It supports dual-mode: Bluetooth Classic and BLE simultaneously on the same radio',
                        'It can connect to 100 BLE devices at once',
                        'It has built-in Bluetooth mesh without any library'
                    ],
                    explanation: 'The ESP32 is dual-mode, meaning it can run Bluetooth Classic and BLE simultaneously on the same radio hardware. You can stream audio over A2DP (Classic) while sending sensor notifications over BLE at the same time. Most BLE-only microcontrollers (Nordic nRF52, STM32WB) cannot do Bluetooth Classic at all -- they only support BLE. This makes the ESP32 uniquely versatile for projects that need both protocols. The trade-off is higher power consumption compared to BLE-only chips, but for WiFi-connected applications this is rarely a concern since WiFi already dominates the power budget.'
                },
                {
                    question: 'What is BLE Mesh and what does it enable?',
                    options: [
                        'A protocol for streaming audio over BLE',
                        'A network topology where BLE devices relay messages to each other, covering large areas like entire buildings',
                        'A method for encrypting BLE advertisements',
                        'A way to increase BLE data rate to match Bluetooth Classic'
                    ],
                    explanation: 'BLE Mesh (Bluetooth Mesh) is a networking standard that allows BLE devices to relay messages to each other in a many-to-many topology. Each node can act as a relay, forwarding messages it receives to extend the network range. This enables BLE to cover entire buildings -- a message published by a sensor in one room can hop through multiple relay nodes to reach a controller several rooms away. Espressif provides the ESP-BLE-Mesh library for the ESP32. This is the technology behind commercial smart lighting systems (IKEA TRADFRI, Philips Hue Bluetooth). The ESP32 can be a mesh node, proxy, or provisioner.'
                }
            ]
        });
        quiz.start();
    </script>
