    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 6: MQTT and IoT Protocols',
            description: 'Test your understanding of MQTT pub/sub, QoS levels, brokers, Last Will and Testament, retained messages, TLS encryption, and IoT edge device patterns.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-06-quiz',
            moduleId: 'pc-esp-06-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the role of the MQTT broker?',
                    options: [
                        'It generates sensor data for IoT devices',
                        'It receives published messages and forwards them to matching subscribers',
                        'It stores all messages permanently in a database',
                        'It encrypts all data before transmission'
                    ],
                    explanation: 'The MQTT broker is the central server that receives all published messages and routes them to clients that have subscribed to matching topics. Publishers send messages to the broker without knowing who will receive them. Subscribers tell the broker which topics they are interested in. The broker matches published topics against subscription filters and delivers messages accordingly. The broker does not generate data, and it does not permanently store messages (unless using retained messages, which store only the last value per topic). Popular brokers include Eclipse Mosquitto (open-source, self-hosted) and HiveMQ (cloud-managed).'
                },
                {
                    question: 'What is the correct format for an MQTT topic?',
                    options: [
                        'home.office.temperature',
                        'home/office/temperature',
                        'home\\office\\temperature',
                        'home:office:temperature'
                    ],
                    explanation: 'MQTT topics use forward slashes (/) as level separators. The topic home/office/temperature has three levels: home, office, and temperature. Topics are case-sensitive, created on first use (no pre-registration needed), and should be designed like a hierarchical file path. Good topic design enables powerful filtering with wildcards: subscribe to home/+/temperature for all room temperatures, or home/office/# for all office data. Topics should be descriptive and follow a consistent convention across your IoT deployment. Dots, backslashes, and colons are not valid level separators.'
                },
                {
                    question: 'What does QoS 0 mean in MQTT?',
                    options: [
                        'The message is delivered exactly once with acknowledgment',
                        'The message is delivered at least once with possible duplicates',
                        'The message is sent once with no acknowledgment -- fire and forget',
                        'The message is buffered until the subscriber comes online'
                    ],
                    explanation: 'QoS 0 (At Most Once) is fire-and-forget delivery. The publisher sends the message once and does not wait for any acknowledgment from the broker. If the broker is temporarily unreachable or the network drops the packet, the message is lost. There is no retry mechanism. QoS 0 has the lowest overhead (just 1 packet), lowest latency, and is appropriate for high-frequency sensor data where missing an occasional reading is acceptable -- for example, a temperature reading published every second. If one reading is lost, the next one arrives in a second anyway.'
                },
                {
                    question: 'What is the difference between QoS 1 and QoS 2 in MQTT?',
                    options: [
                        'QoS 1 is faster; QoS 2 uses less bandwidth',
                        'QoS 1 guarantees at-least-once delivery (may duplicate); QoS 2 guarantees exactly-once delivery (no duplicates)',
                        'QoS 1 works over TCP; QoS 2 works over UDP',
                        'QoS 1 is for publishers; QoS 2 is for subscribers'
                    ],
                    explanation: 'QoS 1 (At Least Once) uses a two-packet handshake: PUBLISH followed by PUBACK. If the publisher does not receive the PUBACK within a timeout, it retransmits the message. This guarantees delivery but may produce duplicates if the PUBACK was lost (the message was delivered but the publisher did not know). QoS 2 (Exactly Once) uses a four-packet handshake: PUBLISH, PUBREC, PUBREL, PUBCOMP. This guarantees the message is delivered exactly once with no duplicates. QoS 2 has the highest overhead and latency but is necessary for critical commands where duplication could cause harm (e.g., triggering a valve twice).'
                },
                {
                    question: 'Which Arduino library does the ESP32 commonly use to connect to an MQTT broker?',
                    options: [
                        'WiFiClient.h',
                        'HTTPClient.h',
                        'PubSubClient.h',
                        'ArduinoMQTT.h'
                    ],
                    explanation: 'PubSubClient is the most widely used MQTT library for Arduino and ESP32. It provides connect(), publish(), subscribe(), and loop() functions. You create a WiFiClient (or WiFiClientSecure for TLS), pass it to the PubSubClient constructor, set the broker address with setServer(), and call connect() with a unique client ID. The library handles the MQTT protocol details: CONNECT/CONNACK, PUBLISH/PUBACK, SUBSCRIBE/SUBACK, and PINGREQ/PINGRESP keep-alive. You must call mqtt.loop() in your Arduino loop() to process incoming messages and maintain the connection.'
                },
                {
                    question: 'Why must you call mqtt.loop() in your Arduino loop() function?',
                    options: [
                        'To encrypt outgoing messages',
                        'To process incoming messages, handle QoS acknowledgments, and send keep-alive pings',
                        'To reconnect to WiFi if disconnected',
                        'To update the MQTT library to the latest version'
                    ],
                    explanation: 'mqtt.loop() performs three critical tasks: 1) It checks the network socket for incoming messages from the broker and dispatches them to your callback function. 2) It processes QoS 1/2 acknowledgment packets (PUBACK, PUBREC, etc.). 3) It sends PINGREQ keep-alive packets to the broker at regular intervals. If you do not call loop() frequently enough, the broker will not receive keep-alive pings, will assume the client has died, and will disconnect it (triggering the Last Will message). The default keep-alive timeout in PubSubClient is 15 seconds.'
                },
                {
                    question: 'What is a Last Will and Testament (LWT) in MQTT?',
                    options: [
                        'A message the broker sends when it shuts down',
                        'A pre-configured message the broker publishes on behalf of a client that disconnects unexpectedly',
                        'An encryption key shared between client and broker',
                        'A backup topic used when the primary topic is full'
                    ],
                    explanation: 'The Last Will and Testament (LWT) is a message that the client registers with the broker at connection time. If the client disconnects unexpectedly (power loss, network failure, missed keep-alive), the broker publishes the will message on the client behalf. The standard IoT pattern is: set the LWT to publish "offline" on device/status with retain=true. Immediately after connecting, publish "online" to the same topic with retain=true. Subscribers always see the current status. If the device crashes, the broker automatically publishes "offline." This solves the device presence detection problem without polling.'
                },
                {
                    question: 'When does the MQTT broker NOT publish the Last Will message?',
                    options: [
                        'When the client crashes due to power loss',
                        'When the client sends a proper DISCONNECT packet before shutting down',
                        'When the broker runs out of memory',
                        'When the client misses keep-alive pings'
                    ],
                    explanation: 'The Last Will message is only published on unexpected disconnections. If the client sends a proper DISCONNECT packet (calling mqtt.disconnect()), the broker considers it a clean, intentional shutdown and does NOT trigger the will. The will fires when: the client misses keep-alive pings (network failure), the TCP connection drops unexpectedly (power loss), or the client crashes without disconnecting. If you want to notify subscribers even on clean shutdowns, manually publish your "offline" status message before calling disconnect(). This gives you full control over the offline notification regardless of how the shutdown happens.'
                },
                {
                    question: 'What does publishing a message with retain=true do?',
                    options: [
                        'Encrypts the message for secure storage',
                        'Stores the message on the broker so new subscribers immediately receive the last value upon subscribing',
                        'Prevents the message from being delivered to any subscriber',
                        'Sends the message to all clients, even those not subscribed to the topic'
                    ],
                    explanation: 'When you publish with retain=true, the broker stores that message as the "last known value" for that topic. When a new client subscribes to the topic, the broker immediately delivers the retained message -- the client does not have to wait for the next publish cycle. Only the last retained message per topic is stored; each new retained publish replaces the previous one. This eliminates the "blank screen on load" problem for dashboards: the moment the dashboard subscribes to home/office/temperature, it instantly gets the last reading. To delete a retained message, publish an empty payload with retain=true to the same topic.'
                },
                {
                    question: 'What MQTT topic wildcard matches a single level?',
                    options: [
                        '#',
                        '*',
                        '+',
                        '?'
                    ],
                    explanation: 'The + wildcard matches exactly one topic level. Subscribing to home/+/temperature matches home/office/temperature, home/kitchen/temperature, and home/bedroom/temperature, but NOT home/office/first-floor/temperature (because + matches only one level, and first-floor/temperature is two levels). The # wildcard matches all remaining levels: home/# matches everything under home/. Wildcards are only valid in subscription filters, never in published topics. You cannot publish to home/+/temperature. The * and ? characters have no special meaning in MQTT topics.'
                },
                {
                    question: 'What port does MQTT use for unencrypted connections, and what port for TLS-encrypted connections?',
                    options: [
                        '80 for unencrypted, 443 for TLS',
                        '1883 for unencrypted, 8883 for TLS',
                        '8080 for unencrypted, 8443 for TLS',
                        '21 for unencrypted, 22 for TLS'
                    ],
                    explanation: 'MQTT uses port 1883 for unencrypted TCP connections and port 8883 for TLS-encrypted connections (MQTTS). These are IANA-registered standard ports. Port 1883 sends all data in plaintext -- including credentials and sensor payloads -- which is acceptable on isolated local networks but dangerous on shared or internet-facing connections. Port 8883 wraps the MQTT connection in TLS encryption, protecting data confidentiality and server authentication. On the ESP32, use WiFiClient for port 1883 and WiFiClientSecure with setCACert() for port 8883. Cloud brokers like AWS IoT and HiveMQ Cloud require TLS.'
                },
                {
                    question: 'What happens if the PubSubClient buffer size is too small for an incoming message?',
                    options: [
                        'The message is split into multiple smaller messages',
                        'The message is silently dropped -- the callback is never called',
                        'The ESP32 crashes with a buffer overflow',
                        'The broker queues the message until the buffer is enlarged'
                    ],
                    explanation: 'If an incoming MQTT message exceeds the PubSubClient buffer size, the message is silently dropped. Your callback function is never called for that message -- there is no error notification, no partial delivery, nothing. The default buffer size is 256 bytes. If your JSON payloads are larger than 256 bytes, you must call mqtt.setBufferSize(1024) (or whatever size you need) before connecting. This is one of the most frustrating bugs to debug because the silence gives no indication of the problem. Always set the buffer to the maximum expected payload size plus some margin.'
                },
                {
                    question: 'In the IoT edge device pattern, what role does the ESP32 play?',
                    options: [
                        'Cloud database server',
                        'Edge node that reads sensors, processes data locally, and publishes meaningful results to MQTT',
                        'MQTT broker',
                        'DNS server for device discovery'
                    ],
                    explanation: 'In the IoT edge device pattern, the ESP32 sits at the "edge" of the network -- closest to the physical sensors and actuators. It reads raw sensor data, processes it locally (filtering noise, calculating averages, checking thresholds), and publishes only meaningful results to the MQTT broker. This reduces bandwidth, cloud costs, and latency compared to sending every raw reading. The ESP32 can also react locally -- turning on a fan if temperature exceeds a threshold without waiting for a cloud server response. The full IoT stack: ESP32 (edge) -> MQTT Broker -> Node-RED/InfluxDB (processing/storage) -> Grafana (visualization).'
                },
                {
                    question: 'Why should you implement exponential backoff in your MQTT reconnection logic?',
                    options: [
                        'To reduce the ESP32 CPU temperature',
                        'To prevent hundreds of devices from reconnecting simultaneously and overwhelming the broker',
                        'To increase the MQTT message throughput',
                        'Exponential backoff is required by the MQTT specification'
                    ],
                    explanation: 'Exponential backoff increases the delay between reconnection attempts: 1s, 2s, 4s, 8s, 16s, up to a maximum (e.g., 60s). If 100 ESP32 devices lose connectivity at the same time (broker restart, network outage), they all start reconnecting simultaneously. With a fixed 1-second retry interval, all 100 devices hit the broker every second -- a thundering herd that can crash the broker again. Exponential backoff with random jitter spreads the reconnection attempts over time. This is a best practice, not a specification requirement, but it is critical for deployments with more than a handful of devices.'
                },
                {
                    question: 'What advantage does MQTT have over HTTP for continuous IoT sensor telemetry?',
                    options: [
                        'MQTT supports larger payloads than HTTP',
                        'MQTT uses persistent TCP connections with minimal protocol overhead (2-byte headers), while HTTP requires full request/response headers (~300 bytes) for each exchange',
                        'MQTT works without a network connection',
                        'MQTT is always faster than HTTP in all scenarios'
                    ],
                    explanation: 'MQTT was designed for IoT: it uses a persistent TCP connection (no repeated handshakes), has a minimal 2-byte fixed header (vs HTTP ~300+ bytes of headers per request), supports push notifications via subscriptions (no polling needed), and handles unreliable networks gracefully with QoS levels and session persistence. For a sensor publishing every 5 seconds, HTTP would require a new TCP connection (or at least full HTTP headers) each time, while MQTT sends just the topic and payload over the existing connection. HTTP is better for occasional API calls, but for continuous telemetry from constrained devices, MQTT wins on every metric: bandwidth, latency, power consumption, and scalability.'
                }
            ]
        });
        quiz.start();
    </script>
