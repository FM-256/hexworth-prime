    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 3: WiFi Fundamentals',
            description: 'Test your understanding of 802.11 b/g/n, Station mode, AP mode, WiFi scanning, events, auto-reconnection, static IP vs DHCP, and WiFi security on the ESP32.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-03-quiz',
            moduleId: 'pc-esp-03-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Which WiFi frequency band does the classic ESP32 operate on?',
                    options: [
                        '5 GHz only',
                        '2.4 GHz only',
                        'Both 2.4 GHz and 5 GHz',
                        '6 GHz (WiFi 6E)'
                    ],
                    explanation: 'The classic ESP32 operates exclusively on the 2.4GHz band, supporting 802.11 b/g/n standards. It cannot connect to 5GHz networks. If your router has separate SSIDs for 2.4GHz and 5GHz, the ESP32 can only see the 2.4GHz one. For IoT applications, 2.4GHz is actually preferred because it offers better wall penetration and longer range than 5GHz, which is more important for embedded devices than raw bandwidth. The ESP32-C6 variant supports WiFi 6 but still on 2.4GHz.'
                },
                {
                    question: 'What does WiFi.mode(WIFI_STA) do?',
                    options: [
                        'Creates a WiFi hotspot that other devices can connect to',
                        'Sets the ESP32 to station mode so it connects to an existing access point',
                        'Enables simultaneous station and access point modes',
                        'Puts the WiFi radio into sleep mode'
                    ],
                    explanation: 'WiFi.mode(WIFI_STA) sets the ESP32 to station mode, meaning it will act as a WiFi client that connects to an existing access point (like your home router). In station mode, the ESP32 receives an IP address from the router\'s DHCP server and can access the local network and internet. The ESP32 defaults to STA+AP mode if you do not explicitly set the mode, which is why best practice is to always declare the mode explicitly before calling WiFi.begin().'
                },
                {
                    question: 'What is the default IP address of the ESP32 when running in AP mode?',
                    options: [
                        '10.0.0.1',
                        '172.16.0.1',
                        '192.168.4.1',
                        '192.168.1.1'
                    ],
                    explanation: 'When the ESP32 runs in AP (Access Point) mode using WiFi.softAP(), it assigns itself the IP address 192.168.4.1 by default. Devices that connect to the ESP32 hotspot receive IP addresses in the 192.168.4.x range from the ESP32\'s built-in DHCP server (starting from 192.168.4.2). You can access the ESP32 from a connected device by navigating to 192.168.4.1 in a browser if the ESP32 is running a web server. The AP IP can be changed using WiFi.softAPConfig() if needed.'
                },
                {
                    question: 'What does WIFI_AP_STA mode allow?',
                    options: [
                        'Only access point functionality with enhanced security',
                        'The ESP32 to connect to a WiFi network AND run its own hotspot simultaneously',
                        'Automatic switching between station and AP modes based on signal strength',
                        'Station mode with a backup access point that activates on connection failure'
                    ],
                    explanation: 'WIFI_AP_STA mode enables both the station and access point interfaces simultaneously. The ESP32 maintains two separate network interfaces at the same time: the STA interface connects to your router (receiving an IP like 192.168.1.50), while the AP interface creates a hotspot (at 192.168.4.1). This is commonly used for device provisioning (AP serves a config page while STA connects to the configured network) and gateway/bridge applications (STA connects to internet, AP serves local clients).'
                },
                {
                    question: 'What information does WiFi.scanNetworks() return for each discovered network?',
                    options: [
                        'Only the SSID name',
                        'SSID, password, and MAC address',
                        'SSID, RSSI (signal strength), channel, and encryption type',
                        'SSID and IP address range'
                    ],
                    explanation: 'WiFi.scanNetworks() scans all 2.4GHz channels and returns the number of networks found. For each network, you can query: WiFi.SSID(i) for the network name, WiFi.RSSI(i) for the signal strength in dBm, WiFi.channel(i) for the channel number (1-13), WiFi.encryptionType(i) for the security protocol (Open, WEP, WPA, WPA2, WPA3), and WiFi.BSSID(i) for the access point MAC address. Passwords are never revealed -- that would be a security vulnerability.'
                },
                {
                    question: 'What RSSI value indicates an excellent WiFi signal?',
                    options: [
                        '-90 dBm',
                        '-70 dBm',
                        '-30 dBm',
                        '0 dBm'
                    ],
                    explanation: 'An RSSI (Received Signal Strength Indicator) of -30 dBm indicates excellent signal strength, meaning the device is very close to the access point. RSSI is measured in negative dBm: closer to zero means stronger signal. General guidelines: -30 to -40 = excellent (within a few meters), -50 to -60 = good, -60 to -70 = fair, -70 to -80 = weak, and below -80 = barely usable with frequent disconnections. For reliable IoT operation, aim for -65 dBm or better.'
                },
                {
                    question: 'What is the purpose of WiFi.onEvent()?',
                    options: [
                        'To create a new WiFi event type',
                        'To register a callback function that fires when WiFi state changes occur',
                        'To log WiFi events to a file',
                        'To filter which WiFi events the ESP32 responds to'
                    ],
                    explanation: 'WiFi.onEvent() registers a callback function that is called automatically when WiFi state changes occur. Instead of polling WiFi.status() in every loop iteration, the event handler fires asynchronously when specific events happen: ARDUINO_EVENT_WIFI_STA_CONNECTED (associated with AP), ARDUINO_EVENT_WIFI_STA_GOT_IP (DHCP complete), ARDUINO_EVENT_WIFI_STA_DISCONNECTED (lost connection), and others. This is more efficient and responsive than polling. The callback executes in the system event loop task on Core 0.'
                },
                {
                    question: 'What should you do in the WIFI_STA_DISCONNECTED event handler for robust operation?',
                    options: [
                        'Immediately reboot the ESP32',
                        'Call WiFi.reconnect() to attempt automatic reconnection',
                        'Switch to AP mode permanently',
                        'Disable WiFi to save power'
                    ],
                    explanation: 'In the WIFI_STA_DISCONNECTED event handler, the standard pattern is to call WiFi.reconnect() to attempt reconnection. WiFi connections drop for many reasons: router reboots, signal fluctuations, interference spikes, DHCP lease expiration. Robust ESP32 code always handles disconnection gracefully. For production devices, add a backoff delay that increases with consecutive failures to avoid hammering a router that is still rebooting. Some implementations also add a maximum retry count before falling back to AP mode for reconfiguration.'
                },
                {
                    question: 'What must you configure besides the IP address when setting a static IP?',
                    options: [
                        'Only the subnet mask',
                        'Gateway, subnet mask, and DNS server',
                        'Only the SSID and password',
                        'The WiFi channel number'
                    ],
                    explanation: 'When configuring a static IP with WiFi.config(), you must provide four values: the IP address, gateway (usually your router\'s IP), subnet mask (usually 255.255.255.0), and DNS server (your router or a public DNS like 8.8.8.8). If any of these are wrong, the ESP32 will appear connected to WiFi but will not be able to reach the internet or resolve domain names. The gateway tells the ESP32 where to send packets destined for other networks. The DNS server resolves domain names to IP addresses.'
                },
                {
                    question: 'Why might you want to use a static IP instead of DHCP?',
                    options: [
                        'Static IPs are more secure than DHCP',
                        'DHCP is not supported on ESP32',
                        'When the ESP32 runs a web server that other devices need to find at a known address',
                        'Static IPs provide faster WiFi speeds'
                    ],
                    explanation: 'A static IP is useful when the ESP32 runs a web server, MQTT broker, or any service that other devices need to access at a predictable address. With DHCP, the IP can change when the DHCP lease expires or the router reboots, breaking bookmarks and device configurations. Static IP also provides a faster connection time (1-3 seconds faster) because the DHCP negotiation is skipped entirely. However, DHCP is simpler and works for most projects, especially those that only make outbound connections to cloud servers.'
                },
                {
                    question: 'What is the minimum password length required for an ESP32 WPA2 access point?',
                    options: [
                        '4 characters',
                        '6 characters',
                        '8 characters',
                        '12 characters'
                    ],
                    explanation: 'WPA2-PSK requires a minimum password length of 8 characters. If you pass a password shorter than 8 characters to WiFi.softAP(), the function will fail or the AP will start in an insecure state. The maximum password length is 63 characters. For an open network (no password), pass an empty string -- but this is not recommended as anyone within range can connect. Best practice is to use a strong password even on temporary ESP32 access points, especially in shared environments like classrooms or offices.'
                },
                {
                    question: 'Which WiFi security protocol provides protection against offline dictionary attacks?',
                    options: [
                        'WEP',
                        'WPA-PSK',
                        'WPA2-PSK',
                        'WPA3-PSK'
                    ],
                    explanation: 'WPA3-PSK uses Simultaneous Authentication of Equals (SAE), which replaces the WPA2 4-way handshake and provides protection against offline dictionary attacks. In WPA2, an attacker can capture the handshake and then try billions of passwords offline. WPA3 makes each password guess require an online interaction with the access point, making brute-force attacks impractical. WPA3 also provides forward secrecy: even if the password is later compromised, previously captured traffic cannot be decrypted. The ESP32 supports WPA3 in newer IDF versions.'
                },
                {
                    question: 'What does WiFi.setHostname() do?',
                    options: [
                        'Sets the SSID of the access point',
                        'Changes the ESP32 MAC address',
                        'Sets a readable device name that appears on the router device list',
                        'Configures DNS-over-HTTPS'
                    ],
                    explanation: 'WiFi.setHostname("esp32-sensor") sets a human-readable hostname for the ESP32 that appears in your router\'s connected device list instead of a cryptic MAC address or generic "ESP32" name. This makes it much easier to identify multiple ESP32 devices on the same network. The hostname must be set before calling WiFi.begin() to take effect. It is also used in mDNS (multicast DNS) to allow accessing the device as esp32-sensor.local on the local network.'
                },
                {
                    question: 'How much current does the ESP32 WiFi radio typically draw when active?',
                    options: [
                        '1-5 mA',
                        '20-40 mA',
                        '100-170 mA',
                        '500-800 mA'
                    ],
                    explanation: 'The ESP32 WiFi radio draws approximately 100-170mA when actively transmitting and receiving. During idle WiFi connection (associated but not transmitting), it draws about 80-100mA. This is significant for battery-powered projects. Strategies to reduce power consumption include: WiFi.setSleep(true) for light sleep between transmissions, full WiFi.disconnect() between measurement intervals, and deep sleep mode (microamps) for long periods between wakeups. A typical 18650 lithium battery (3000mAh) would last about 20 hours with continuous WiFi active.'
                },
                {
                    question: 'What is the maximum number of stations that can connect to an ESP32 access point by default?',
                    options: [
                        '1',
                        '4',
                        '10',
                        '32'
                    ],
                    explanation: 'The default maximum number of stations (clients) that can connect to an ESP32 access point is 4. This can be increased up to 10 using the max_connection parameter in WiFi.softAP(ssid, password, channel, hidden, max_connection). The limit exists because each connected station requires memory for its connection state, packet buffers, and ARP table entries. For most IoT applications, 4 connections is sufficient. If you need to serve more clients, consider using the ESP32 as a gateway that connects to a proper router via STA mode.'
                }
            ]
        });
        quiz.start();
    </script>
