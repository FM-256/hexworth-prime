    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 11: Storage and File Systems',
            description: 'Test your understanding of ESP32 flash partitions, NVS key-value storage, SPIFFS, LittleFS, SD cards, Preferences library, and OTA updates.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-11-quiz',
            moduleId: 'pc-esp-11-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Where is the ESP32 flash memory physically located?',
                    options: [
                        'Built into the ESP32 chip die',
                        'On a separate external SPI flash chip soldered to the module',
                        'On the USB-to-serial converter chip',
                        'In the RTC memory domain'
                    ],
                    explanation: 'The ESP32 chip itself has no built-in flash. The 4MB (or 8MB/16MB on some modules) of flash is a separate external SPI flash chip soldered onto the ESP32 module. The CPU accesses this flash via the SPI bus and uses XIP (Execute In Place) with an MMU cache to execute code directly from flash. This is why flash speed and SPI bus configuration matter for performance.'
                },
                {
                    question: 'What is the partition table and where is it stored?',
                    options: [
                        'A file in SPIFFS that maps directory structures',
                        'A data structure at offset 0x8000 in flash that defines partition locations, sizes, and types',
                        'A JSON config file uploaded via Arduino IDE',
                        'A hardware register in the ESP32 chip'
                    ],
                    explanation: 'The partition table is a binary data structure stored at offset 0x8000 in flash. It tells the bootloader where each partition starts, its size, type (app or data), and subtype (OTA, NVS, SPIFFS, etc.). Without a valid partition table, the ESP32 cannot find your application code or data partitions. The partition table is written when you first flash firmware or when you change the partition scheme.'
                },
                {
                    question: 'What happens to data stored in NVS when you upload a new sketch?',
                    options: [
                        'All NVS data is erased',
                        'NVS data is preserved -- only the app partition is overwritten',
                        'NVS data is backed up to SPIFFS automatically',
                        'NVS data is corrupted and must be reformatted'
                    ],
                    explanation: 'NVS data is preserved across sketch uploads because NVS and the app partition are separate regions in flash. Uploading a new sketch only erases and rewrites the app partition. WiFi credentials, device settings, calibration data, and any other key-value pairs stored in NVS survive code updates. The same is true for SPIFFS/LittleFS data -- it persists unless you explicitly format the partition or change the partition scheme.'
                },
                {
                    question: 'What is NVS (Non-Volatile Storage) used for on the ESP32?',
                    options: [
                        'Storing large files and images',
                        'Running application code',
                        'Storing small key-value pairs like settings, credentials, and counters',
                        'Buffering WiFi packets'
                    ],
                    explanation: 'NVS is a key-value store designed for small pieces of persistent data: WiFi credentials, device names, calibration values, boot counters, feature flags, and configuration settings. It uses a log-structured format with automatic wear leveling. NVS is not suitable for large data (use SPIFFS/LittleFS for that). The WiFi library uses NVS internally to remember saved networks.'
                },
                {
                    question: 'Which library provides a high-level Arduino API for NVS?',
                    options: [
                        'EEPROM.h',
                        'Preferences.h',
                        'NVS.h',
                        'FlashStorage.h'
                    ],
                    explanation: 'The Preferences library (Preferences.h) is the Arduino framework wrapper around ESP-IDF NVS. It provides simple methods like putInt(), getString(), putBool(), and organizes data into namespaces. While EEPROM.h exists for ESP32 (for Arduino compatibility), it is actually implemented on top of NVS under the hood. Preferences.h is the recommended approach for new ESP32 projects.'
                },
                {
                    question: 'What are namespaces in the Preferences/NVS system?',
                    options: [
                        'C++ namespaces for code organization',
                        'Logical groups that prevent key collisions between different parts of your application',
                        'Physical partitions on the flash chip',
                        'Network domains for WiFi configuration'
                    ],
                    explanation: 'NVS namespaces are logical groups that prevent key collisions. You might use "wifi" for network settings, "sensor" for calibration data, and "device" for identity info. Each namespace has its own key space, so a key named "interval" in the "sensor" namespace is separate from "interval" in the "device" namespace. The system WiFi library uses its own internal namespace, so your keys never conflict with stored WiFi credentials.'
                },
                {
                    question: 'What is a key limitation of SPIFFS?',
                    options: [
                        'Files cannot exceed 256 bytes',
                        'It has no real directory support -- paths with slashes are just flat file names',
                        'It can only store text files, not binary data',
                        'It requires an SD card to function'
                    ],
                    explanation: 'SPIFFS has no real directory support. A path like "/data/logs/today.txt" is stored as a single flat file name that happens to contain slashes. You cannot create empty directories, list files in a specific "folder," or use standard directory operations. This is why LittleFS is the recommended replacement -- it supports real directories, has better performance with many files, and provides better power-loss resilience.'
                },
                {
                    question: 'What is the primary advantage of LittleFS over SPIFFS?',
                    options: [
                        'LittleFS supports larger file sizes',
                        'LittleFS has real directory support, better performance, and power-loss resilience',
                        'LittleFS uses less flash space',
                        'LittleFS is the only file system that supports encryption'
                    ],
                    explanation: 'LittleFS provides real directory support (mkdir, rmdir, listing), better performance with many files (SPIFFS degrades), and a copy-on-write structure that prevents corruption on unexpected power loss. The API is nearly identical to SPIFFS -- you typically just change the include from SPIFFS.h to LittleFS.h and swap the mount call. LittleFS is actively maintained while SPIFFS is deprecated by Espressif.'
                },
                {
                    question: 'How do you connect an SD card to the ESP32?',
                    options: [
                        'Via I2C (SDA/SCL)',
                        'Via SPI (MOSI, MISO, SCK, CS)',
                        'Via UART (TX/RX)',
                        'Via USB OTG'
                    ],
                    explanation: 'SD cards connect to the ESP32 via SPI: MOSI (GPIO 23), MISO (GPIO 19), SCK (GPIO 18), and CS (chip select, commonly GPIO 5). The SD library handles the FAT32 file system. Cards up to 32GB (SDHC) work reliably. Some ESP32 boards also support SD cards via the faster SDMMC interface (using more pins), but SPI is the most common and compatible method.'
                },
                {
                    question: 'Why should SD cards be powered down during ESP32 deep sleep in battery designs?',
                    options: [
                        'SD cards corrupt data during deep sleep',
                        'SD cards draw 50-100mA during writes, wasting battery even when idle',
                        'The SPI bus is disabled during deep sleep',
                        'SD cards require continuous clock signals to maintain data'
                    ],
                    explanation: 'SD cards draw 50-100mA during writes and typically 1-5mA even when idle. In battery-powered designs where the ESP32 sleeps at 10uA, an idle SD card drawing even 1mA dominates the power budget. The solution is to power the SD card module through a GPIO-controlled MOSFET, allowing complete power cutoff during deep sleep. Always call file.close() before cutting power to prevent data corruption.'
                },
                {
                    question: 'What are the two app partitions in the default partition table used for?',
                    options: [
                        'Running two different programs simultaneously on each CPU core',
                        'Safe OTA updates -- new firmware downloads to the inactive partition while the current firmware keeps running',
                        'Separating setup() code from loop() code',
                        'Storing debug builds and release builds separately'
                    ],
                    explanation: 'The two app partitions (app0 and app1) enable safe Over-The-Air updates. The running firmware executes from one partition while new firmware downloads to the other. If the download fails or power is lost, the running partition is untouched. After successful download, the bootloader switches to the new partition on reboot. If the new firmware crashes, automatic rollback restores the previous working version.'
                },
                {
                    question: 'What does ArduinoOTA provide?',
                    options: [
                        'Automatic firmware updates from the Arduino cloud',
                        'LAN-based OTA where the ESP32 advertises via mDNS and Arduino IDE discovers it as a network port',
                        'USB firmware upload without a cable',
                        'Cellular OTA for remote field devices'
                    ],
                    explanation: 'ArduinoOTA is a built-in library for local network OTA. The ESP32 advertises itself via mDNS (like Bonjour), and the Arduino IDE discovers it as a network upload port alongside USB ports. You add ArduinoOTA.begin() to setup() and ArduinoOTA.handle() to loop(). Then you can upload sketches over WiFi instead of USB. It is best for development -- production deployments typically use HTTP OTA instead.'
                },
                {
                    question: 'What prevents a bad OTA update from bricking the ESP32?',
                    options: [
                        'The bootloader checks code syntax before running',
                        'Automatic rollback -- if new firmware does not call esp_ota_mark_app_valid() within a timeout, the bootloader reverts to the previous firmware',
                        'OTA updates are stored in a quarantine partition first',
                        'The ESP32 runs both firmware versions simultaneously and picks the stable one'
                    ],
                    explanation: 'The ESP32 bootloader supports automatic rollback protection. After booting new OTA firmware, the application must call esp_ota_mark_app_valid() to confirm it is working correctly. If the new firmware crashes, hangs, or fails to make this call within a configurable timeout, the bootloader automatically reverts to the previous working firmware on the next reboot. This prevents bricked devices from failed updates.'
                },
                {
                    question: 'What partition scheme should you choose if your code is too large for the default 1.25MB app partition?',
                    options: [
                        'Minimal SPIFFS -- reduces file system to give more app space',
                        'Huge APP (3MB No OTA) -- maximizes code space but eliminates OTA capability',
                        'No Partition -- uses all flash as one continuous block',
                        'External Flash -- moves code to an SD card'
                    ],
                    explanation: 'The "Huge APP" partition scheme gives you approximately 3MB for application code by eliminating the second app partition and reducing other partitions. The tradeoff is losing OTA update capability -- you can only update via USB. Other options include "Minimal SPIFFS" which keeps OTA but shrinks the file system, or "No OTA" which gives a larger single app partition. Choose based on whether your deployed devices need remote updates.'
                },
                {
                    question: 'When should you use NVS/Preferences instead of SPIFFS/LittleFS?',
                    options: [
                        'For storing HTML web pages and images',
                        'For small, structured key-value data like WiFi credentials, device IDs, and calibration values',
                        'For logging thousands of sensor readings',
                        'For storing firmware update files'
                    ],
                    explanation: 'NVS/Preferences is designed for small, structured key-value data: WiFi SSID (one string), device ID (one string), calibration offset (one float), boot counter (one int). Each entry is a few bytes. Use SPIFFS/LittleFS for larger or unstructured data: HTML pages, JSON config files, sensor log CSVs, certificate bundles -- files ranging from kilobytes to megabytes. NVS has automatic wear leveling optimized for frequent small writes.'
                }
            ]
        });
        quiz.start();
    </script>
