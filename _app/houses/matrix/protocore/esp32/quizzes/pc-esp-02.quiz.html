    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 2: GPIO and Peripherals',
            description: 'Test your understanding of the GPIO matrix, digital I/O, touch pins, Hall effect sensor, ADC, DAC, LEDC PWM, and GPIO interrupts on the ESP32.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-02-quiz',
            moduleId: 'pc-esp-02-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the GPIO matrix on the ESP32?',
                    options: [
                        'A physical pin header layout on the development board',
                        'A crossbar switch that routes any peripheral signal to almost any GPIO pin',
                        'A diagram showing which pins are safe to use',
                        'A library for controlling multiple pins simultaneously'
                    ],
                    explanation: 'The GPIO matrix is a programmable crossbar switch inside the ESP32 silicon. It allows you to route peripheral signals (UART, SPI, I2C, PWM, etc.) to almost any GPIO pin through software configuration. On Arduino, SPI is always on pins 10-13. On ESP32, you can call SPI.begin(18, 19, 23, 5) to assign SPI to any pins you want. The GPIO matrix handles the internal routing between the peripheral hardware and the physical pins. This is a fundamental architectural difference from fixed-pin microcontrollers.'
                },
                {
                    question: 'Which GPIO pins on the ESP32 are input-only?',
                    options: [
                        'GPIO 0-5',
                        'GPIO 6-11',
                        'GPIO 34-39',
                        'GPIO 25-26'
                    ],
                    explanation: 'GPIO 34, 35, 36 (also labeled VP), and 39 (also labeled VN) are input-only pins. They have no output driver, no internal pull-up resistor, and no internal pull-down resistor. They are connected to ADC1 channels and are commonly used for analog sensor inputs. GPIO 6-11 are reserved for the onboard SPI flash and must not be used at all. GPIO 25-26 are the DAC output pins. GPIO 0-5 are general purpose but some have boot-mode significance.'
                },
                {
                    question: 'What feature does INPUT_PULLDOWN provide that Arduino Uno does not have?',
                    options: [
                        'The ability to read analog values',
                        'An internal pull-down resistor to hold the pin LOW by default',
                        'Faster digital read speeds',
                        'Automatic debouncing of button inputs'
                    ],
                    explanation: 'INPUT_PULLDOWN enables an internal pull-down resistor (approximately 45K ohms) on the ESP32 GPIO pin, causing it to read LOW by default and HIGH when connected to 3.3V. The Arduino Uno only has INPUT_PULLUP (internal pull-up resistor). On Uno, if you want a pull-down, you must add an external resistor. The ESP32 provides both options in hardware, giving you more flexibility for button and sensor wiring without external components.'
                },
                {
                    question: 'How many capacitive touch pins does the ESP32 have?',
                    options: [
                        '4',
                        '6',
                        '10',
                        '16'
                    ],
                    explanation: 'The ESP32 has 10 capacitive touch sensor channels mapped to specific GPIO pins: Touch0=GPIO4, Touch1=GPIO0, Touch2=GPIO2, Touch3=GPIO15, Touch4=GPIO13, Touch5=GPIO12, Touch6=GPIO14, Touch7=GPIO27, Touch8=GPIO33, Touch9=GPIO32. These pins can detect finger contact through capacitive sensing with no external hardware required. Just connect a conductive surface (copper pad, foil, or even a fruit) to the pin and call touchRead(). The value drops when touched.'
                },
                {
                    question: 'What does touchRead() return when a touch pin is NOT being touched?',
                    options: [
                        'A value close to 0',
                        'Exactly 1023',
                        'A value in the range of 60-80 (varies by environment)',
                        'A negative number'
                    ],
                    explanation: 'When a touch pin is not being touched, touchRead() returns a relatively high value, typically in the range of 60-80. When a finger touches the electrode, the reading drops to approximately 10-20. The exact baseline value varies depending on the wire length, board layout, humidity, and nearby objects. To calibrate, read the untouched value at startup and set your threshold to approximately half of that value. A typical threshold of 40 works for most setups.'
                },
                {
                    question: 'What does the built-in Hall effect sensor detect?',
                    options: [
                        'Temperature changes',
                        'Light intensity',
                        'Magnetic fields',
                        'Air pressure'
                    ],
                    explanation: 'The Hall effect sensor built into the ESP32 detects magnetic fields. It is integrated directly into the silicon die near the center of the chip. When a magnet is brought near the ESP32 package, the sensor output changes proportionally to the magnetic field strength and polarity. North pole proximity produces large positive values, south pole produces large negative values, and no magnet produces values near zero (with some baseline noise of +/-30). It is useful for door/window sensors, RPM counting, and contactless switching.'
                },
                {
                    question: 'Why can ADC2 pins not be used for analog readings while WiFi is active?',
                    options: [
                        'WiFi uses too much power for ADC to work',
                        'ADC2 shares internal hardware with the WiFi controller',
                        'ADC2 pins automatically switch to digital mode during WiFi',
                        'This is a software bug that has been fixed in newer versions'
                    ],
                    explanation: 'ADC2 shares internal hardware resources with the WiFi controller. When WiFi is active, the WiFi driver takes exclusive control of the ADC2 peripheral for its own RF calibration and signal processing. Any attempt to call analogRead() on an ADC2 pin (GPIO 0, 2, 4, 12-15, 25-27) while WiFi is connected will return unreliable values or fail entirely. This is a hardware limitation, not a software bug. The solution is to use ADC1 pins (GPIO 32-39) for analog readings when WiFi is needed.'
                },
                {
                    question: 'What is the resolution of the ESP32 DAC output?',
                    options: [
                        '8-bit (0-255)',
                        '10-bit (0-1023)',
                        '12-bit (0-4095)',
                        '16-bit (0-65535)'
                    ],
                    explanation: 'The ESP32 has two 8-bit DAC channels on GPIO 25 (DAC1) and GPIO 26 (DAC2). The 8-bit resolution means 256 discrete voltage steps from 0V to 3.3V, giving approximately 12.9mV per step. dacWrite(25, 0) outputs 0V, dacWrite(25, 128) outputs approximately 1.65V, and dacWrite(25, 255) outputs approximately 3.3V. Unlike PWM (which rapidly switches between 0V and 3.3V), the DAC outputs a true, steady analog voltage. Only GPIO 25 and 26 support DAC output.'
                },
                {
                    question: 'How many independent LEDC PWM channels does the ESP32 have?',
                    options: [
                        '6 (like Arduino Uno)',
                        '8',
                        '16',
                        '32'
                    ],
                    explanation: 'The ESP32 has 16 independent LEDC (LED Control) PWM channels: 8 high-speed channels and 8 low-speed channels. Each channel can have its own independently configurable frequency and duty cycle. Multiple GPIO pins can be attached to the same channel for synchronized output. This is vastly more capable than the Arduino Uno, which has only 6 PWM pins with fixed frequencies (~490Hz or ~980Hz). The ESP32 LEDC channels support frequencies from 1Hz to 40MHz with configurable resolution from 1 to 16 bits.'
                },
                {
                    question: 'What is the relationship between PWM frequency and resolution on the ESP32?',
                    options: [
                        'They are independent -- any frequency works with any resolution',
                        'Higher frequency requires lower resolution (freq x 2^bits must not exceed 80MHz)',
                        'Resolution is always fixed at 8 bits regardless of frequency',
                        'Higher frequency always gives higher resolution'
                    ],
                    explanation: 'There is an inverse relationship between PWM frequency and maximum resolution. The LEDC timer runs at 80MHz, and the product of frequency multiplied by 2^resolution_bits must not exceed 80MHz. For example: at 5kHz, max resolution = log2(80M/5K) = ~13 bits. At 1kHz, max resolution = 16 bits (65,536 steps). At 312.5kHz, max resolution = 8 bits (256 steps). You must choose the combination that fits your application -- high frequency for motor drivers (25kHz, 8-bit) or high resolution for LED fading (1kHz, 16-bit).'
                },
                {
                    question: 'Why must ESP32 interrupt handlers be marked with IRAM_ATTR?',
                    options: [
                        'To make the handler run faster',
                        'To ensure the function is stored in internal RAM instead of flash, preventing crashes when flash is busy with WiFi operations',
                        'To enable the interrupt on both cores simultaneously',
                        'IRAM_ATTR is optional and only used for debugging'
                    ],
                    explanation: 'IRAM_ATTR places the interrupt service routine (ISR) in internal RAM instead of the external SPI flash memory. This is critical because the SPI flash can be temporarily inaccessible during WiFi operations, OTA updates, or flash writes. If an interrupt fires while flash is busy and the ISR code is stored in flash, the CPU will crash with a LoadProhibited exception. On Arduino Uno, this is not an issue because all code runs from internal flash that is always accessible. On ESP32, IRAM_ATTR is mandatory for any ISR.'
                },
                {
                    question: 'Which trigger modes are supported by ESP32 GPIO interrupts?',
                    options: [
                        'RISING and FALLING only',
                        'RISING, FALLING, and CHANGE only',
                        'RISING, FALLING, CHANGE, LOW, and HIGH',
                        'RISING and LOW only'
                    ],
                    explanation: 'The ESP32 supports five interrupt trigger modes: RISING (low-to-high transition), FALLING (high-to-low transition), CHANGE (any transition), LOW (while pin is held low), and HIGH (while pin is held high). All five modes are available on every GPIO pin that supports interrupts. FALLING is the most common mode for button detection with INPUT_PULLUP (the button grounds the pin, creating a falling edge). CHANGE is useful for rotary encoders that need to detect both transitions.'
                },
                {
                    question: 'Which GPIO pins should never be used for general I/O on the ESP32?',
                    options: [
                        'GPIO 0-5',
                        'GPIO 6-11',
                        'GPIO 25-26',
                        'GPIO 34-39'
                    ],
                    explanation: 'GPIO 6 through 11 are connected to the onboard SPI flash memory chip that stores your program. Using these pins for general I/O will interfere with flash operations, causing firmware corruption, random crashes, or a completely bricked device. These pins are exposed on some development board headers but must never be touched. GPIO 34-39 are usable (input-only). GPIO 0-5 are usable with boot-mode caveats. GPIO 25-26 are the DAC pins but can be used for other purposes when DAC is not needed.'
                },
                {
                    question: 'What voltage does an ESP32 GPIO pin output when set to HIGH?',
                    options: [
                        '5V',
                        '3.3V',
                        '1.8V',
                        'Configurable between 1.8V and 5V'
                    ],
                    explanation: 'When an ESP32 GPIO pin is configured as OUTPUT and set to HIGH using digitalWrite(), it outputs 3.3V. This is the logic level of the ESP32. The maximum recommended current per pin is about 12mA, with an absolute maximum of 40mA. This is enough to drive an LED through a resistor but not enough for motors or relays, which require a transistor or MOSFET driver. The 3.3V output also means that some 5V input devices may not recognize it as a HIGH signal unless they are 3.3V compatible.'
                },
                {
                    question: 'What does analogSetAttenuation(ADC_11db) do?',
                    options: [
                        'Sets the ADC sampling rate to 11 samples per second',
                        'Enables 11-bit resolution for ADC readings',
                        'Configures the ADC input voltage range to 0-3.3V (full range, least accurate)',
                        'Reduces ADC noise by 11 decibels'
                    ],
                    explanation: 'analogSetAttenuation(ADC_11db) sets the ADC attenuation to 11dB, which configures the input voltage range to approximately 0-3.3V. This is the default setting that covers the full voltage range but provides the least accuracy. Lower attenuation settings give better accuracy over a narrower range: ADC_0db covers 0-1.1V (most accurate), ADC_2_5db covers 0-1.5V, and ADC_6db covers 0-2.2V. Choose the attenuation that matches your signal range for the best analog reading accuracy.'
                }
            ]
        });
        quiz.start();
    </script>
