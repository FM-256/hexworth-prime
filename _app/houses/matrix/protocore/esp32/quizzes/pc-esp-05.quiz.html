    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 5: HTTP and Web Servers',
            description: 'Test your understanding of the ESP32 as an HTTP client, web server, REST API design, dynamic pages, HTTPS, WebSocket, and mDNS.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-05-quiz',
            moduleId: 'pc-esp-05-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'Which library does the ESP32 use to make HTTP GET and POST requests as a client?',
                    options: [
                        'WebServer.h',
                        'HTTPClient.h',
                        'WiFiServer.h',
                        'ArduinoJson.h'
                    ],
                    explanation: 'The HTTPClient library handles outgoing HTTP requests from the ESP32. You call http.begin(url) to specify the target, then http.GET() or http.POST(body) to send the request. The library manages the TCP connection, formats the HTTP request headers, and parses the response. WebServer.h is for running a web server ON the ESP32 (incoming requests), not making outgoing requests. WiFiServer.h provides raw TCP server functionality. ArduinoJson.h is for JSON parsing/serialization, not HTTP communication itself.'
                },
                {
                    question: 'What does server.handleClient() do in the ESP32 WebServer library?',
                    options: [
                        'Starts the web server listening on port 80',
                        'Checks for incoming HTTP connections and dispatches them to route handlers',
                        'Sends a response to the current client',
                        'Closes all active connections'
                    ],
                    explanation: 'server.handleClient() must be called in loop() on every iteration. It checks the TCP socket for incoming HTTP requests. When a request arrives, it parses the HTTP method and URL path, finds the matching route registered with server.on(), and calls the associated handler function. If you block loop() with a long delay or computation, handleClient() does not run and the server becomes unresponsive -- incoming requests time out. This is why the synchronous WebServer library has limitations: it can only process one request at a time, and loop() must stay fast.'
                },
                {
                    question: 'How do you register a route on the ESP32 WebServer?',
                    options: [
                        'server.route("/path", handler)',
                        'server.on("/path", handler)',
                        'server.get("/path", handler)',
                        'server.addRoute("/path", handler)'
                    ],
                    explanation: 'server.on("/path", handler) maps a URL path to a callback function. When a client requests that path, the handler function is called. You can specify the HTTP method as a second parameter: server.on("/api/data", HTTP_GET, getHandler) or server.on("/api/data", HTTP_POST, postHandler). This allows the same path to have different handlers for different methods, following REST conventions. server.onNotFound(handler) registers a catch-all for unmatched routes, where you typically return a 404 response.'
                },
                {
                    question: 'What does server.send(200, "text/html", content) do?',
                    options: [
                        'Sends an HTTP response with status 200, HTML content type, and the body',
                        'Sends an HTTP request to another server',
                        'Saves content to the SPIFFS file system',
                        'Opens a WebSocket connection with status code 200'
                    ],
                    explanation: 'server.send() sends an HTTP response back to the client that made the request. The three arguments are: 1) HTTP status code (200 = OK, 404 = Not Found, etc.), 2) Content-Type header value (text/html for web pages, application/json for APIs), and 3) the response body as a String. The response is sent immediately and the connection is closed after the response completes. For JSON API responses, use "application/json" as the content type. For error responses, use appropriate status codes: 400 for bad requests, 500 for server errors.'
                },
                {
                    question: 'What is the purpose of the ArduinoJson library on the ESP32?',
                    options: [
                        'To serve static JSON files from flash memory',
                        'To serialize and deserialize JSON data for HTTP requests and responses',
                        'To compress HTTP payloads for faster transmission',
                        'To validate HTML form data'
                    ],
                    explanation: 'ArduinoJson is the standard library for creating (serializing) and parsing (deserializing) JSON on Arduino and ESP32. When sending sensor data to a cloud API via HTTP POST, you create a JsonDocument, add key-value pairs, and call serializeJson(doc, string) to produce a JSON string. When receiving a JSON response from a GET request, you call deserializeJson(doc, payload) to parse it, then access fields like doc["temperature"].as<float>(). It is the most-downloaded Arduino library. Always check the return value of deserializeJson() for errors, and set an appropriate buffer size to handle your expected payload.'
                },
                {
                    question: 'Why is ESPAsyncWebServer preferred over the built-in WebServer for production use?',
                    options: [
                        'It uses less memory',
                        'It handles multiple concurrent connections without blocking loop()',
                        'It supports only HTTPS connections',
                        'It automatically generates HTML pages from sensor data'
                    ],
                    explanation: 'ESPAsyncWebServer uses the ESP32 RTOS task system to handle HTTP connections asynchronously. Multiple clients can connect simultaneously, and request processing does not block your loop() function. With the synchronous WebServer library, one slow client blocks all others, and you must call handleClient() continuously. ESPAsyncWebServer also provides a built-in template processor for replacing placeholders in HTML files stored on SPIFFS, and native WebSocket support. The downside is that it requires the AsyncTCP library as a dependency. For anything beyond simple prototypes, ESPAsyncWebServer is the standard choice.'
                },
                {
                    question: 'What does the meta tag <meta http-equiv="refresh" content="5"> do in an ESP32-served web page?',
                    options: [
                        'Sets the page encoding to UTF-5',
                        'Tells the browser to reload the page every 5 seconds',
                        'Limits the page cache to 5 kilobytes',
                        'Redirects to a different URL after 5 seconds'
                    ],
                    explanation: 'This meta tag instructs the browser to automatically reload the page every 5 seconds. When the ESP32 serves a dashboard page with sensor data, this causes the browser to re-request the page periodically, getting fresh sensor values each time. It is the simplest way to show live data without JavaScript. The downside is that each reload is a full page refresh -- the screen flashes, scroll position resets, and there is a brief blank moment. For smoother updates, use JavaScript with fetch() to update only the changed elements, or use WebSocket for real-time push updates.'
                },
                {
                    question: 'How does the ESP32 WebServer handle HTML form POST data?',
                    options: [
                        'Form data is stored in SPIFFS automatically',
                        'server.arg("fieldname") extracts the value of a named form field',
                        'POST data is only accessible via the Serial Monitor',
                        'Form data must be parsed manually from raw bytes'
                    ],
                    explanation: 'server.arg("fieldname") extracts the value of a named form field from the POST body. If your HTML form has <input name="bright" value="128">, then server.arg("bright") returns the string "128". Use server.hasArg("bright") to check if the field exists before reading it. The WebServer library automatically parses URL-encoded form data (application/x-www-form-urlencoded) and query string parameters. For persistent settings, save the received values to the ESP32 NVS using the Preferences library, so they survive reboots.'
                },
                {
                    question: 'What is the risk of calling client.setInsecure() when making HTTPS requests?',
                    options: [
                        'It makes the request slower',
                        'It disables certificate verification, making the connection vulnerable to man-in-the-middle attacks',
                        'It switches from HTTPS to HTTP',
                        'It prevents the ESP32 from connecting to any server'
                    ],
                    explanation: 'client.setInsecure() disables TLS certificate verification entirely. The connection is still encrypted (an attacker cannot read the data in transit), but the ESP32 does not verify that it is talking to the real server. An attacker performing a man-in-the-middle attack can present a fake certificate, and the ESP32 will accept it -- establishing an encrypted connection with the attacker instead of the real server. For development and testing, setInsecure() is convenient. For production, always use setCACert() to pin the server root CA certificate. Without verification, HTTPS provides encryption without authentication.'
                },
                {
                    question: 'What advantage does WebSocket have over HTTP polling for real-time sensor dashboards?',
                    options: [
                        'WebSocket uses UDP instead of TCP for lower latency',
                        'WebSocket maintains a persistent connection with minimal framing overhead, avoiding repeated HTTP request/response cycles',
                        'WebSocket is encrypted by default while HTTP is not',
                        'WebSocket works without WiFi'
                    ],
                    explanation: 'WebSocket opens a single persistent TCP connection that stays open for bidirectional communication. After the initial HTTP upgrade handshake, messages have only 2-10 bytes of framing overhead (compared to ~300 bytes of HTTP headers per request). For a dashboard updating every 100ms, HTTP polling sends 300+ bytes of headers each time just to get a few bytes of sensor data -- WebSocket sends just the data. The ESP32 pushes updates the instant sensor values change, and the browser can send commands back without a new request. WebSocket uses TCP (not UDP), works over WiFi, and can be encrypted (wss://).'
                },
                {
                    question: 'What does MDNS.begin("sensor-hub") do on the ESP32?',
                    options: [
                        'Connects to a DNS server on the internet',
                        'Registers the hostname "sensor-hub.local" on the local network via multicast DNS',
                        'Creates a subdomain on a public DNS provider',
                        'Enables DNS-over-HTTPS for secure name resolution'
                    ],
                    explanation: 'MDNS.begin("sensor-hub") registers the ESP32 with the hostname "sensor-hub.local" on the local network using multicast DNS (mDNS). When you type "http://sensor-hub.local" in a browser, your computer sends a multicast UDP query on port 5353. The ESP32 responds with its IP address. No internet DNS server is involved -- it works entirely on the local network. macOS and Linux support mDNS natively. Windows requires Bonjour (included with iTunes). MDNS.addService("http", "tcp", 80) additionally announces the HTTP service for automatic discovery by tools like Bonjour Browser.'
                },
                {
                    question: 'What is SPIFFS/LittleFS on the ESP32?',
                    options: [
                        'A WiFi protocol for fast file transfer',
                        'A flash-based file system for storing HTML, CSS, JS, and other files on the ESP32',
                        'A JavaScript runtime for the ESP32',
                        'A security framework for HTTPS certificates'
                    ],
                    explanation: 'SPIFFS (SPI Flash File System) and LittleFS are file systems that use a portion of the ESP32 flash memory to store files. You can upload a complete website (HTML, CSS, JavaScript, images) to the flash and serve it with server.serveStatic("/", SPIFFS, "/"). This separates your web frontend from your C++ Arduino code, making both easier to develop and maintain. LittleFS is the recommended replacement for SPIFFS -- it handles wear leveling, power-loss recovery, and directory structures better. Files are uploaded using a dedicated upload tool or PlatformIO filesystem image builder.'
                },
                {
                    question: 'What is the correct way to handle CORS when a browser-based dashboard makes fetch() calls to the ESP32 API?',
                    options: [
                        'Disable the browser firewall',
                        'Add Access-Control-Allow-Origin headers to the server response',
                        'Use HTTP instead of HTTPS',
                        'Serve the API on port 443'
                    ],
                    explanation: 'When a web page served from one origin (e.g., a development server at localhost:3000) makes fetch() requests to the ESP32 API (e.g., 192.168.1.100), the browser blocks the request due to the Same-Origin Policy. To allow it, the ESP32 must include CORS (Cross-Origin Resource Sharing) headers in its responses: server.sendHeader("Access-Control-Allow-Origin", "*") allows requests from any origin. For security, replace "*" with the specific origin of your dashboard. You must also handle OPTIONS preflight requests that the browser sends before the actual request. This is a browser security feature, not an ESP32 limitation.'
                },
                {
                    question: 'What HTTP status code should the ESP32 return for a successful API response?',
                    options: [
                        '404',
                        '500',
                        '200',
                        '301'
                    ],
                    explanation: '200 (OK) is the standard HTTP status code for a successful request. When the ESP32 web server successfully processes a request and returns data, it sends status 200. Other important codes: 201 (Created) for successful POST that creates a resource, 400 (Bad Request) for malformed client input, 404 (Not Found) for unrecognized routes, 500 (Internal Server Error) for server-side failures. Using correct status codes makes your API self-documenting and helps client-side code handle errors properly. A JavaScript fetch() call checks response.ok, which is true for any 200-299 status code.'
                },
                {
                    question: 'Why should you avoid blocking loop() with long delay() calls when running a web server on the ESP32?',
                    options: [
                        'It increases power consumption',
                        'The synchronous WebServer requires handleClient() to run frequently, and delays make the server unresponsive',
                        'It causes the WiFi module to overheat',
                        'delay() is not supported on the ESP32'
                    ],
                    explanation: 'The synchronous WebServer library (WebServer.h) processes HTTP requests only when you call server.handleClient() in loop(). If loop() is blocked by a delay(5000), no HTTP requests are processed during those 5 seconds -- the server appears dead to any browser trying to connect. Clients will get timeout errors. For timing, use millis()-based non-blocking timers instead of delay(). ESPAsyncWebServer avoids this problem by handling connections in a separate RTOS task, but even with the async server, blocking loop() wastes CPU time that could be spent reading sensors or processing data.'
                }
            ]
        });
        quiz.start();
    </script>
