    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 1: Meet the ESP32',
            description: 'Test your understanding of the ESP32 chip family, dual-core architecture, 3.3V logic, development boards, frameworks, Board Manager setup, Blink, and Serial output.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-01-quiz',
            moduleId: 'pc-esp-01-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What type of processor core does the classic ESP32 use?',
                    options: [
                        'ARM Cortex-M4',
                        'Xtensa LX6 dual-core',
                        'RISC-V single-core',
                        'AVR ATmega'
                    ],
                    explanation: 'The classic ESP32 uses a Tensilica Xtensa LX6 dual-core processor running at up to 240MHz. This is a proprietary instruction set designed by Cadence (formerly Tensilica). The two cores are labeled PRO_CPU (Core 0) and APP_CPU (Core 1). Core 0 typically handles WiFi and Bluetooth protocol stacks, while Core 1 runs your Arduino application code. The newer ESP32-C3, C6, and H2 variants use RISC-V cores instead, but the classic ESP32 that most tutorials and this track target uses Xtensa LX6.'
                },
                {
                    question: 'What is the maximum clock speed of the classic ESP32?',
                    options: [
                        '16 MHz',
                        '80 MHz',
                        '240 MHz',
                        '400 MHz'
                    ],
                    explanation: 'The ESP32 Xtensa LX6 cores run at up to 240MHz. This is 15 times faster than the Arduino Uno (16MHz) per core, and the ESP32 has two of them. The clock speed can be reduced to 80MHz or 160MHz via software to save power. At 240MHz, each core executes 240 million clock cycles per second, providing ample processing power for WiFi, Bluetooth, sensor processing, and web server tasks simultaneously.'
                },
                {
                    question: 'What logic voltage does the ESP32 use?',
                    options: [
                        '5V',
                        '3.3V',
                        '1.8V',
                        '12V'
                    ],
                    explanation: 'The ESP32 operates on 3.3V logic. When a GPIO pin is set HIGH, it outputs 3.3V. This is critically important: the ESP32 is NOT 5V tolerant. Connecting a 5V signal directly to an ESP32 GPIO pin will damage or destroy the chip. When interfacing with 5V components (like some Arduino shields, sensors, or other boards), you must use a level shifter or voltage divider to convert the 5V signals to 3.3V.'
                },
                {
                    question: 'Which ESP32 variant uses a RISC-V core instead of Xtensa?',
                    options: [
                        'ESP32-S2',
                        'ESP32-S3',
                        'ESP32-C3',
                        'ESP32 Classic'
                    ],
                    explanation: 'The ESP32-C3 was the first ESP32 variant to use a RISC-V core instead of Xtensa. It uses a single-core RISC-V processor running at 160MHz with WiFi and BLE 5.0 support. RISC-V is an open-source instruction set architecture that reduces Espressif\'s licensing costs and allows the CPU design to be inspected publicly. The ESP32-C6 and ESP32-H2 also use RISC-V cores. The S2 and S3 variants still use Xtensa (LX7 instead of LX6).'
                },
                {
                    question: 'How much SRAM does the classic ESP32 have?',
                    options: [
                        '2 KB',
                        '32 KB',
                        '520 KB',
                        '4 MB'
                    ],
                    explanation: 'The classic ESP32 has 520KB of SRAM, shared between both cores. This is 260 times more than the Arduino Uno\'s 2KB. This large RAM pool allows the ESP32 to handle TCP/IP networking stacks, TLS encryption buffers, web page content, JSON parsing, and multiple FreeRTOS tasks simultaneously. The 4MB figure refers to the external flash memory (program storage), not RAM. Some ESP32 modules also include 4-8MB of external PSRAM for applications that need even more memory.'
                },
                {
                    question: 'What operating system does the ESP32 run under the Arduino framework?',
                    options: [
                        'Linux',
                        'Windows IoT',
                        'FreeRTOS',
                        'None -- bare metal only'
                    ],
                    explanation: 'The ESP32 runs FreeRTOS (Free Real-Time Operating System), a lightweight RTOS that manages task scheduling across both cores. When you write Arduino code for ESP32, your setup() and loop() run as a FreeRTOS task pinned to Core 1. Core 0 runs the WiFi and Bluetooth protocol tasks. FreeRTOS handles context switching, memory allocation, inter-task communication (queues, semaphores), and timing. This is a key difference from Arduino Uno, which runs bare metal with no OS.'
                },
                {
                    question: 'Which GPIO pin typically has the built-in LED on most ESP32 DevKit boards?',
                    options: [
                        'GPIO 13',
                        'GPIO 2',
                        'GPIO 0',
                        'GPIO 5'
                    ],
                    explanation: 'Most ESP32 DevKit V1 boards wire the onboard LED to GPIO 2. This is different from Arduino, where the built-in LED is on pin 13. Not all ESP32 boards have a built-in LED -- some (like the TTGO T-Display) omit it in favor of a screen. When writing Blink for ESP32, use #define LED_BUILTIN 2 to make the pin assignment explicit. Always check your specific board\'s pinout diagram, as some boards may use a different pin.'
                },
                {
                    question: 'What is the default baud rate convention for ESP32 Serial communication?',
                    options: [
                        '9600',
                        '57600',
                        '115200',
                        '921600'
                    ],
                    explanation: 'The ESP32 ecosystem uses 115200 baud as the default for Serial communication, which is 12 times faster than Arduino\'s traditional 9600 baud. This higher speed is needed because the ESP32 outputs boot messages, WiFi status updates, and debug information at 115200. If you open the Serial Monitor at 9600 while the ESP32 is sending at 115200, you will see garbled characters. Always match the baud rate in Serial.begin() with the Serial Monitor setting.'
                },
                {
                    question: 'Why should you add delay(1000) after Serial.begin() on ESP32?',
                    options: [
                        'The ESP32 compiler requires it',
                        'To let the USB-to-serial connection initialize so early print statements are not lost',
                        'To calibrate the clock speed',
                        'To wait for WiFi to connect'
                    ],
                    explanation: 'The delay(1000) after Serial.begin() gives the USB-to-serial chip (CP2102 or CH340) time to initialize and the Serial Monitor time to establish the connection. Without this delay, the first few Serial.print() calls may execute before the USB connection is ready, causing their output to be lost. This is an ESP32-specific quirk -- the USB connection negotiation takes longer than on Arduino boards because the ESP32 goes through a longer boot sequence before reaching your setup() code.'
                },
                {
                    question: 'What does the ESP-IDF stand for?',
                    options: [
                        'Espressif Integrated Design Framework',
                        'Espressif IoT Development Framework',
                        'Extended Sensor and Peripheral Driver Foundation',
                        'Embedded System Initialization and Deployment Framework'
                    ],
                    explanation: 'ESP-IDF stands for Espressif IoT Development Framework. It is the official, full-featured SDK from Espressif for programming ESP32 chips. ESP-IDF uses C, CMake, and a component-based architecture. It provides direct access to every hardware feature including WiFi, Bluetooth, power management, and security subsystems. The Arduino-ESP32 core is actually built on top of ESP-IDF, wrapping its functionality in the familiar Arduino API. When you outgrow Arduino, ESP-IDF is the next step.'
                },
                {
                    question: 'What happens if you connect a 5V signal directly to an ESP32 GPIO pin?',
                    options: [
                        'The ESP32 automatically converts it to 3.3V',
                        'The pin reads HIGH with no issues',
                        'The GPIO pin or entire chip may be permanently damaged',
                        'The ESP32 enters a safe protection mode'
                    ],
                    explanation: 'Connecting a 5V signal to an ESP32 GPIO pin can permanently damage the pin or destroy the entire chip. The ESP32 is NOT 5V tolerant -- its GPIO pins have an absolute maximum rating of 3.6V. There is no internal protection circuit that clamps higher voltages. The excess voltage will break down the semiconductor junctions inside the chip. This is the most common cause of ESP32 hardware failure. Always use a level shifter or voltage divider when connecting 5V components.'
                },
                {
                    question: 'Which ESP32 variant supports WiFi 6?',
                    options: [
                        'ESP32 Classic',
                        'ESP32-S3',
                        'ESP32-C6',
                        'ESP32-H2'
                    ],
                    explanation: 'The ESP32-C6 is the first Espressif chip to support WiFi 6 (802.11ax). It also supports BLE 5.0 and 802.15.4 (Thread/Zigbee), making it the most connectivity-rich variant and the primary chip for Matter smart home devices. The classic ESP32 supports WiFi 4 (802.11n), as do the S2, S3, and C3 variants. The ESP32-H2 has no WiFi at all -- it focuses exclusively on BLE and 802.15.4 for mesh networking.'
                },
                {
                    question: 'What USB-to-serial chip do most ESP32 DevKit boards use?',
                    options: [
                        'FT232R',
                        'PL2303',
                        'CP2102 or CH340',
                        'ATmega16U2'
                    ],
                    explanation: 'Most ESP32 DevKit boards use either a Silicon Labs CP2102 or a WCH CH340 USB-to-serial converter chip. This chip translates USB communication from your computer into UART serial signals that the ESP32 can understand. Windows usually auto-installs drivers for both chips, but if the board does not appear in the Arduino IDE port list, you may need to install the driver manually from Silicon Labs (for CP2102) or WCH (for CH340). The ATmega16U2 is used on genuine Arduino boards, not ESP32 boards.'
                },
                {
                    question: 'What URL must be added to Arduino IDE Preferences to install ESP32 board support?',
                    options: [
                        'https://arduino.cc/esp32/boards.json',
                        'https://espressif.github.io/arduino-esp32/package_esp32_index.json',
                        'https://github.com/esp32/boardmanager.xml',
                        'https://dl.espressif.com/arduino/esp32-core.zip'
                    ],
                    explanation: 'The correct URL is https://espressif.github.io/arduino-esp32/package_esp32_index.json. This JSON file tells the Arduino IDE Board Manager where to download the ESP32 toolchain, compiler, and board definitions. You paste this URL into File > Preferences > Additional Boards Manager URLs, then install "esp32 by Espressif Systems" from the Board Manager. This downloads several hundred megabytes of tools including the Xtensa cross-compiler, esptool.py for flashing, and all ESP32 board definitions.'
                },
                {
                    question: 'How does the ESP32 ADC resolution compare to the Arduino Uno?',
                    options: [
                        'Both use 10-bit ADC (0-1023)',
                        'ESP32 uses 8-bit (0-255), Uno uses 10-bit (0-1023)',
                        'ESP32 uses 12-bit (0-4095), Uno uses 10-bit (0-1023)',
                        'ESP32 uses 16-bit (0-65535), Uno uses 10-bit (0-1023)'
                    ],
                    explanation: 'The ESP32 has a 12-bit ADC that returns values from 0 to 4095, while the Arduino Uno has a 10-bit ADC returning 0 to 1023. This gives the ESP32 four times the resolution for analog readings. However, the ESP32 ADC is known to be non-linear, especially at the voltage extremes near 0V and 3.3V. For precision analog measurements, calibration is required or an external ADC like the ADS1115 should be used. Despite the higher bit count, the Arduino Uno\'s ADC is actually more linear in practice.'
                }
            ]
        });
        quiz.start();
    </script>
