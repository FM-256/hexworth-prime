    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Core 7: FreeRTOS Fundamentals',
            description: 'Test your understanding of FreeRTOS tasks, dual-core pinning, priorities, scheduling, task states, stack management, and the watchdog timer on the ESP32.',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'matrix',
            achievement: 'pc-esp-07-quiz',
            moduleId: 'pc-esp-07-quiz',
            serverGrading: true,
            houseId: 'matrix',
            trackProgress: true,

            questions: [
                {
                    question: 'What does RTOS stand for, and what is its defining characteristic?',
                    options: [
                        'Real-Time Operating System -- it guarantees deterministic timing for task execution',
                        'Rapid Task Ordering System -- it prioritizes tasks by speed',
                        'Runtime Thread Optimization Software -- it makes threads run faster',
                        'Reallocating Task Operating System -- it dynamically reallocates memory'
                    ],
                    explanation: 'RTOS stands for Real-Time Operating System. The defining characteristic is deterministic timing -- it guarantees that high-priority tasks will execute within known time bounds. Real-time does not mean "fast." It means predictable and reliable. An RTOS uses a preemptive scheduler that can interrupt lower-priority tasks to ensure higher-priority ones meet their deadlines. FreeRTOS, used by the ESP32, is the most widely deployed RTOS in the embedded world, running on over 40 microcontroller architectures.'
                },
                {
                    question: 'What function creates a new FreeRTOS task on the ESP32?',
                    options: [
                        'xTaskCreate()',
                        'createThread()',
                        'taskSpawn()',
                        'newTask()'
                    ],
                    explanation: 'xTaskCreate() is the FreeRTOS API function that creates a new task. It takes six parameters: the task function pointer, a name string (for debugging, max 16 chars), stack size in bytes, an optional parameter pointer, the priority level, and an optional task handle. The task begins executing as soon as it is created, provided its priority allows it to run. For ESP32 specifically, xTaskCreatePinnedToCore() adds a seventh parameter to specify which CPU core the task should run on.'
                },
                {
                    question: 'What is the critical rule about FreeRTOS task functions?',
                    options: [
                        'They must always return an integer error code',
                        'They must never return -- they must contain an infinite loop or call vTaskDelete(NULL)',
                        'They must be declared as static functions',
                        'They must accept exactly two parameters'
                    ],
                    explanation: 'FreeRTOS task functions must never return. If a task function reaches its closing brace and returns, the behavior is undefined and typically causes a crash. Every task must either contain an infinite loop (for(;;) or while(1)) that runs forever, or it must explicitly call vTaskDelete(NULL) to cleanly remove itself from the scheduler before the function ends. The for(;;) pattern is the standard convention. Inside this loop, the task does its work and then calls a blocking function like vTaskDelay() to yield the CPU to other tasks.'
                },
                {
                    question: 'On the ESP32, which core does Arduino loop() run on by default?',
                    options: [
                        'Core 0 (PRO_CPU)',
                        'Core 1 (APP_CPU)',
                        'It alternates between both cores',
                        'It runs on whichever core is idle'
                    ],
                    explanation: 'Arduino loop() runs on Core 1 (APP_CPU) by default. The Arduino-ESP32 core creates a FreeRTOS task called "loopTask" that is pinned to Core 1 with an 8KB stack at priority 1. This task calls setup() once and then calls loop() in an infinite loop. Core 0 (PRO_CPU) is reserved primarily for WiFi and Bluetooth protocol stack tasks. This separation ensures that your user code does not interfere with wireless communication. You can create your own tasks on either core using xTaskCreatePinnedToCore().'
                },
                {
                    question: 'What does xTaskCreatePinnedToCore() do that xTaskCreate() does not?',
                    options: [
                        'It creates tasks that run faster',
                        'It allows specifying which CPU core the task should run on',
                        'It creates tasks with larger stacks',
                        'It creates tasks that survive a reboot'
                    ],
                    explanation: 'xTaskCreatePinnedToCore() adds a core affinity parameter -- you can specify 0 for Core 0 (PRO_CPU), 1 for Core 1 (APP_CPU), or tskNO_AFFINITY to let the scheduler decide. Regular xTaskCreate() does not guarantee which core a task runs on. Pinning tasks to specific cores is important on ESP32 because WiFi and BLE run on Core 0. Putting heavy user tasks on Core 0 can interfere with wireless operations. Conversely, tasks that interact heavily with WiFi data might benefit from running on Core 0 to reduce cross-core synchronization overhead.'
                },
                {
                    question: 'What is the difference between vTaskDelay() and a busy-wait loop?',
                    options: [
                        'They are functionally identical',
                        'vTaskDelay() puts the task in Blocked state and yields the CPU; a busy-wait loop hogs the CPU and prevents other tasks from running',
                        'A busy-wait loop is more accurate for timing',
                        'vTaskDelay() consumes more power than a busy-wait loop'
                    ],
                    explanation: 'vTaskDelay() moves the calling task into the Blocked state for the specified number of ticks. During this time, the task uses zero CPU -- the scheduler runs other Ready tasks instead. A busy-wait loop (while(millis() - start < delay)) keeps the task in the Running state, consuming 100% of the CPU core. No other task of equal or lower priority can run. On ESP32, Arduino delay() internally calls vTaskDelay(), so it correctly yields the CPU. However, a manual millis()-based busy-wait does not yield and will starve other tasks and potentially trigger the watchdog timer.'
                },
                {
                    question: 'How many task states does FreeRTOS define?',
                    options: [
                        'Two: Running and Stopped',
                        'Three: Running, Waiting, Terminated',
                        'Four: Running, Ready, Blocked, Suspended',
                        'Five: Running, Ready, Blocked, Suspended, Terminated'
                    ],
                    explanation: 'FreeRTOS defines four task states: Running (actively executing on a CPU core), Ready (able to run but waiting for CPU time), Blocked (waiting for an event like a timer, queue, or semaphore), and Suspended (manually paused via vTaskSuspend()). On a dual-core ESP32, up to two tasks can be in the Running state simultaneously -- one per core. The key distinction between Blocked and Suspended is that a Blocked task will automatically transition to Ready when its wait condition is met, while a Suspended task remains frozen until explicitly resumed with vTaskResume().'
                },
                {
                    question: 'What happens if a task\'s stack overflows on the ESP32?',
                    options: [
                        'The stack automatically grows to accommodate the overflow',
                        'FreeRTOS moves the task to a larger stack',
                        'The system detects the overflow, triggers an abort, and prints a backtrace',
                        'Nothing happens -- stack overflows are silently ignored'
                    ],
                    explanation: 'ESP32 FreeRTOS has stack overflow detection enabled by default. When a task writes beyond its allocated stack, the system detects the corruption, prints an error message with the task name and a backtrace, then triggers an abort (system reset). Without detection, a stack overflow silently corrupts adjacent memory, causing bizarre and difficult-to-debug behavior -- random crashes, corrupted data, or tasks behaving erratically. The function uxTaskGetStackHighWaterMark(NULL) returns the minimum free stack the task has ever had, letting you monitor how close you are to overflow during development.'
                },
                {
                    question: 'What is the purpose of the FreeRTOS idle task?',
                    options: [
                        'It runs your main program loop',
                        'It handles WiFi connections',
                        'It runs at the lowest priority (0), performs housekeeping, and feeds the watchdog timer',
                        'It puts the ESP32 into deep sleep mode'
                    ],
                    explanation: 'The idle task runs at priority 0 -- the lowest possible. FreeRTOS creates one idle task per core. When no other task needs the CPU (all higher-priority tasks are Blocked or Suspended), the idle task runs. It performs critical housekeeping: freeing memory from deleted tasks and feeding the watchdog timer. If a user task never blocks (never calls vTaskDelay or waits on a synchronization primitive), the idle task on that core never runs. This causes the Task Watchdog Timer to trigger, printing an error and potentially resetting the system. Every user task must have at least one blocking point.'
                },
                {
                    question: 'What is the default stack size for the Arduino loop() task on ESP32?',
                    options: [
                        '1024 bytes',
                        '2048 bytes',
                        '4096 bytes',
                        '8192 bytes'
                    ],
                    explanation: 'The Arduino-ESP32 core creates the loopTask with an 8192-byte (8KB) stack. This is generous enough for most Arduino sketches, including Serial.print(), basic WiFi operations, and moderate local variable usage. If your loop() uses large local arrays, deep recursion, or libraries that consume significant stack space (like JSON parsing or TLS), you may need to increase this. You can modify the stack size by changing the CONFIG_ARDUINO_LOOP_STACK_SIZE value in the ESP32 Arduino core configuration, though for most projects the default 8KB is sufficient.'
                },
                {
                    question: 'What does pdMS_TO_TICKS(100) do?',
                    options: [
                        'Converts 100 ticks to milliseconds',
                        'Converts 100 milliseconds to FreeRTOS ticks',
                        'Sets the tick rate to 100 per second',
                        'Delays execution for 100 microseconds'
                    ],
                    explanation: 'pdMS_TO_TICKS() is a FreeRTOS macro that converts a value in milliseconds to the equivalent number of scheduler ticks. On ESP32, the default tick rate is 1000 Hz (configTICK_RATE_HZ = 1000), meaning one tick equals one millisecond. So pdMS_TO_TICKS(100) returns 100. However, using the macro instead of hardcoding tick values makes your code portable -- if the tick rate changes to 500 Hz on a different configuration, pdMS_TO_TICKS(100) would correctly return 50. Always use this macro with vTaskDelay() and other FreeRTOS timing functions.'
                },
                {
                    question: 'What priority does the Arduino loop() task run at on ESP32?',
                    options: [
                        'Priority 0 (lowest)',
                        'Priority 1',
                        'Priority 5',
                        'Priority 24 (highest)'
                    ],
                    explanation: 'The Arduino loop() task runs at priority 1, just above the idle task (priority 0). This is intentionally low so that system tasks like WiFi (which runs at priority 5+) can preempt it when needed. If you create your own tasks at priority 2 or higher, they will preempt loop(). For most Arduino-style projects, priority 1 is fine because tasks yield cooperatively via delay()/vTaskDelay(). When you create custom tasks in setup(), typical practice is to use priorities between 1 and 5, reserving higher priorities for genuinely time-critical operations.'
                },
                {
                    question: 'How can you check how much stack a running task has used?',
                    options: [
                        'Call getFreeMemory() on the task handle',
                        'Check the global heap with ESP.getFreeHeap()',
                        'Call uxTaskGetStackHighWaterMark(NULL) from within the task',
                        'Read the SRAM register directly'
                    ],
                    explanation: 'uxTaskGetStackHighWaterMark(NULL) returns the minimum number of free stack words the calling task has ever had since it was created. Pass NULL to check the current task, or pass a task handle to check a different task. The return value is in words (4 bytes each on ESP32), so multiply by 4 for bytes. If this value approaches zero, you are at risk of stack overflow and should increase the task\'s stack allocation. This function should be called periodically during development to tune stack sizes. ESP.getFreeHeap() checks the heap (dynamic memory), not task stacks -- they are separate memory pools.'
                },
                {
                    question: 'What happens when a high-priority task runs continuously without ever calling vTaskDelay() or any blocking function?',
                    options: [
                        'FreeRTOS automatically preempts it after 1 second',
                        'It starves all lower-priority tasks on the same core, and the watchdog timer eventually triggers',
                        'Other tasks run normally because FreeRTOS uses time-slicing',
                        'The task automatically moves to a lower priority'
                    ],
                    explanation: 'A high-priority task that never blocks will completely starve all lower-priority tasks on the same core. The preemptive scheduler will never switch away from a Running task to a lower-priority Ready task -- it only switches to equal or higher priority. Since the idle task (priority 0) cannot run, it cannot feed the Task Watchdog Timer, which eventually triggers an error or system reset (default timeout: 5 seconds). Time-slicing only applies between tasks of equal priority. The fix is simple: ensure every task has at least one blocking point, even if it is just vTaskDelay(1) -- a single tick is enough to let the idle task run and feed the watchdog.'
                },
                {
                    question: 'What is the "empty loop() pattern" in ESP32 FreeRTOS programming?',
                    options: [
                        'Writing an empty loop() function that does nothing',
                        'Creating all work in dedicated tasks in setup(), then adding vTaskDelay() in loop() since it has nothing to do',
                        'Deleting the loop() function entirely',
                        'Replacing loop() with a FreeRTOS timer callback'
                    ],
                    explanation: 'When you create all your application logic as dedicated FreeRTOS tasks in setup(), the Arduino loop() function has no work left to do. The empty loop() pattern adds a vTaskDelay(pdMS_TO_TICKS(1000)) inside loop() to prevent it from consuming CPU cycles in a tight empty loop. While you could theoretically delete the loopTask entirely using vTaskDelete(), keeping it with a simple delay is safer and simpler for beginners. The loop() task still exists at priority 1 but sleeps most of the time, using zero CPU. This pattern is standard in professional ESP32 development where tasks are the primary organizational unit.'
                }
            ]
        });
        quiz.start();
    </script>
