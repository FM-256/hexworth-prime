<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Quiz: Hardening + Package Management | Advanced Linux Administration</title>
    <style>
        :root {
            --bg: #060d08;
            --bg-card: #0a130c;
            --bg-option: #0f1a11;
            --green: #00ff41;
            --green-dim: rgba(0, 255, 65, 0.15);
            --text: #e2f0e5;
            --text-muted: #86a88c;
            --success: #00ff41;
            --danger: #ff3333;
            --border: rgba(0, 255, 65, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, var(--bg) 0%, #040b06 50%, #061008 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #33ff66; transform: translateX(-5px); display: inline-block; }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--green-dim);
        }

        .quiz-header h1 { font-size: 1.6rem; color: var(--green); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #33ff66); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--green); font-weight: 600; white-space: nowrap; }

        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--green); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.6; font-family: 'Segoe UI', system-ui, sans-serif; }
        .question-text code { font-family: 'Courier New', Courier, monospace; background: rgba(0, 255, 65, 0.08); border: 1px solid rgba(0, 255, 65, 0.2); padding: 1px 6px; border-radius: 4px; font-size: 0.9em; color: #66ff88; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; font-family: 'Segoe UI', system-ui, sans-serif; }
        .option:hover { border-color: rgba(0, 255, 65, 0.4); background: rgba(0, 255, 65, 0.05); }
        .option.selected { border-color: var(--green); background: rgba(0, 255, 65, 0.08); }
        .option.correct { border-color: var(--success); background: rgba(0, 255, 65, 0.10); }
        .option.incorrect { border-color: var(--danger); background: rgba(255, 51, 51, 0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled, .option.incorrect.disabled { opacity: 1; }

        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--green); flex-shrink: 0; font-family: 'Courier New', Courier, monospace; }
        .option.correct .option-letter { background: rgba(0, 255, 65, 0.25); color: var(--success); border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        .feedback.correct { display: block; background: rgba(0, 255, 65, 0.06); border: 1px solid rgba(0, 255, 65, 0.30); color: #88ffaa; }
        .feedback.incorrect { display: block; background: rgba(255, 51, 51, 0.06); border: 1px solid rgba(255, 51, 51, 0.30); color: #ff9999; }

        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(0, 255, 65, 0.10); border: 1px solid rgba(0, 255, 65, 0.40); color: var(--green); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Courier New', Courier, monospace; }
        .next-btn:hover { background: rgba(0, 255, 65, 0.20); }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(0, 255, 65, 0.10); }

        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--green); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; font-family: 'Courier New', Courier, monospace; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; font-family: 'Segoe UI', system-ui, sans-serif; }

        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; font-family: 'Courier New', Courier, monospace; }
        .btn-retry { background: rgba(0, 255, 65, 0.10); border: 1px solid rgba(0, 255, 65, 0.40) !important; color: var(--green); }
        .btn-retry:hover { background: rgba(0, 255, 65, 0.25); }
        .btn-hub { background: rgba(0, 255, 65, 0.15); border: 1px solid rgba(0, 255, 65, 0.40) !important; color: var(--success); }
        .btn-hub:hover { background: rgba(0, 255, 65, 0.30); }

        /* ── Review Answers view ── */
        .review-q { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; text-align: left; }
        .review-q-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px; }
        .review-mark { font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.12em; }
        .review-mark.right { background: rgba(34, 197, 94, 0.18); color: #6ee7b7; }
        .review-mark.wrong { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .review-q-text { font-size: 0.95rem; color: var(--text); margin-bottom: 0.7rem; line-height: 1.5; }
        .review-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.7rem; }
        .review-opt { padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 0.86rem; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .review-opt.correct { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.45); }
        .review-opt.incorrect { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.45); }
        .review-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; font-style: italic; margin-left: auto; }
        .review-tag.right-tag { background: rgba(34, 197, 94, 0.20); color: #6ee7b7; }
        .review-tag.wrong-tag { background: rgba(239, 68, 68, 0.20); color: #fca5a5; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: rgba(34, 197, 94, 0.04); border-left: 2px solid var(--success); border-radius: 0 6px 6px 0; }
        .review-exp strong { color: var(--success); }

                @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Advanced Linux Hub</a>
        </div>

        <div class="quiz-header">
            <h1>Week 2 Quiz: Perimeter Defense</h1>
            <p class="subtitle">Hardening, Firewall Policy, Authentication, and Package Management</p>
            <div class="meta">
                <span>Week 2</span>
                <span>15 Questions</span>
                <span>Obj 3, 4</span>
                <span>70% to Pass</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="showReviewAnswers()">Review Answers</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>

        <div class="results-card" id="reviewCard" style="display:none;">
            <h2>Review Your Answers</h2>
            <div id="reviewBody"></div>
            <div class="results-btns">
                <button class="btn-retry" onclick="backToScore()">Back to Score</button>
                <a href="../index.html" class="btn-hub">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        /* Answers are NOT stored in this file.
           Server-graded via gradeQuiz Cloud Function.
           Answer key stored in Firestore quiz_keys/matrix-ala-w2-quiz */
        var QUIZ_ID = 'matrix-ala-w2-quiz';

        var questions = [
            {
                q: 'An operator runs <code>ufw allow 22/tcp</code> but SSH connections are still being blocked. <code>ufw status</code> shows the rule is active. What is the most likely cause?',
                opts: [
                    'UFW rules require a system reboot to take effect',
                    'An iptables INPUT chain DROP rule exists before UFW\'s rules and is being evaluated first',
                    'UFW allow rules only apply to outbound traffic by default',
                    'The rule must specify the source IP range to function correctly'
                ],
                ans: 1,
                exp: 'UFW adds rules to iptables. If a custom DROP or REJECT rule was added directly to the INPUT chain before UFW\'s rules, it will be evaluated first and match before UFW\'s ACCEPT rule. The order of iptables rules is critical: first match wins.'
            },
            {
                q: 'Which <code>iptables</code> command blocks all inbound traffic on port 23 (Telnet) while logging dropped packets?',
                opts: [
                    'iptables -A INPUT -p tcp --dport 23 -j DROP',
                    'iptables -A INPUT -p tcp --dport 23 -j LOG --log-prefix "TELNET-DROP:" && iptables -A INPUT -p tcp --dport 23 -j DROP',
                    'iptables -I INPUT 1 -p tcp --dport 23 --log-and-drop',
                    'iptables -A INPUT -p tcp --port 23 -j REJECT --with-log'
                ],
                ans: 1,
                exp: 'Logging and dropping requires two rules in sequence. The LOG target logs the packet and continues processing; the DROP target discards it. They must appear in this order in the chain, or use the NFLOG target. The --log-and-drop option does not exist in iptables.'
            },
            {
                q: 'What does the <code>fail2ban</code> service do when it detects brute-force SSH attempts?',
                opts: [
                    'It terminates the SSH daemon and restarts it to flush all active connections',
                    'It adds a temporary iptables DROP rule for the offending source IP',
                    'It modifies /etc/hosts.deny to permanently block the source IP',
                    'It sends an alert email and increments a counter but takes no blocking action'
                ],
                ans: 1,
                exp: 'fail2ban monitors log files for failed authentication patterns and, upon reaching the configured threshold, adds a temporary ban by inserting an iptables (or nftables) DROP rule for the offending IP. The ban is lifted automatically after the bantime expires.'
            },
            {
                q: 'An operator wants to allow only key-based SSH authentication and disable password authentication system-wide. Which <code>/etc/ssh/sshd_config</code> directives accomplish this?',
                opts: [
                    'AuthMethod publickey\nPasswordAuth no',
                    'PubkeyAuthentication yes\nPasswordAuthentication no',
                    'AllowKeys yes\nDenyPassword yes',
                    'AuthorizedKeysOnly yes\nPasswordLogin disabled'
                ],
                ans: 1,
                exp: 'PubkeyAuthentication yes enables SSH key authentication (it is on by default but should be explicit). PasswordAuthentication no disables password-based login. After editing sshd_config, run systemctl reload ssh to apply changes without dropping existing connections.'
            },
            {
                q: 'Which PAM module is responsible for enforcing password complexity requirements such as minimum length and character classes on Ubuntu 22.04?',
                opts: [
                    'pam_pwhistory.so',
                    'pam_cracklib.so / pam_pwquality.so',
                    'pam_securetty.so',
                    'pam_limits.so'
                ],
                ans: 1,
                exp: 'pam_pwquality.so (replacing the older pam_cracklib.so) enforces password quality requirements. It is configured in /etc/security/pwquality.conf and controls minlen, dcredit, ucredit, lcredit, ocredit and other complexity parameters.'
            },
            {
                q: 'An operator installs ClamAV and runs <code>clamscan -r /home</code> but the scan returns outdated signatures. Which command updates the virus definition database?',
                opts: [
                    'clamav --update-db',
                    'freshclam',
                    'clamd --refresh',
                    'clamupdate --force'
                ],
                ans: 1,
                exp: 'freshclam is the ClamAV database update utility. It downloads updated virus definitions from the ClamAV mirror network. It should be run regularly or configured as a daemon (freshclam --daemon) to keep definitions current.'
            },
            {
                q: 'What is the purpose of the <code>--no-install-recommends</code> flag in <code>apt install</code> in a hardened environment?',
                opts: [
                    'It prevents apt from installing packages that conflict with existing software',
                    'It installs only the explicitly requested package without pulling in suggested or recommended packages, reducing attack surface',
                    'It disables installation of packages from unverified repositories',
                    'It forces installation without checking package signatures'
                ],
                ans: 1,
                exp: 'In hardened environments, minimizing installed software reduces attack surface. --no-install-recommends installs only the package you request and its hard dependencies, skipping recommended packages that apt would normally pull in automatically.'
            },
            {
                q: 'An operator needs to compile a tool from source on Ubuntu 22.04. After running <code>./configure</code> successfully, the make command fails with "gcc: not found". What is the correct fix?',
                opts: [
                    'apt install build-essential',
                    'apt install gcc-core make-tools',
                    'dnf groupinstall "Development Tools"',
                    'snap install gcc --classic'
                ],
                ans: 0,
                exp: 'The build-essential package on Ubuntu/Debian installs gcc, g++, make, and the libc development headers in one command. It is the standard way to get a functional C/C++ build environment on Ubuntu 22.04.'
            },
            {
                q: 'After compiling and installing a tool with <code>make install</code> into <code>/usr/local/bin</code>, the command is not found when run as a non-root user. What is the most likely cause?',
                opts: [
                    'make install requires sudo to install to /usr/local/bin and the file has no execute bit',
                    '/usr/local/bin is not in the non-root user\'s PATH',
                    'Tools installed via make install require registration with dpkg to be recognized',
                    'Non-root users cannot execute binaries in /usr/local/bin by default'
                ],
                ans: 1,
                exp: 'On minimal Ubuntu installs, /usr/local/bin may not be in the default PATH for all users. Check with echo $PATH. If missing, add export PATH="$PATH:/usr/local/bin" to ~/.bashrc or /etc/environment for system-wide effect.'
            },
            {
                q: 'Which command lists all currently installed packages sorted by installation size, largest first, on Ubuntu 22.04?',
                opts: [
                    'dpkg -l | sort -k4 -h -r | head -20',
                    'dpkg-query -W --showformat=\'${Installed-Size}\\t${Package}\\n\' | sort -rn | head -20',
                    'apt list --installed | sort --by-size | head -20',
                    'apt show --all | grep Size | sort -rn'
                ],
                ans: 1,
                exp: 'dpkg-query -W with a custom showformat prints fields from the dpkg database. ${Installed-Size} gives the size in KB and ${Package} the name. Piping to sort -rn sorts numerically in reverse order, showing largest packages first.'
            },
            {
                q: 'An operator adds a new APT repository by dropping a .list file in <code>/etc/apt/sources.list.d/</code>. After running <code>apt update</code>, apt reports "NO_PUBKEY" for the new repo. What is the correct resolution?',
                opts: [
                    'Edit /etc/apt/apt.conf to disable GPG verification for that source',
                    'Import the repository\'s GPG signing key using apt-key add or by placing it in /etc/apt/trusted.gpg.d/',
                    'Reinstall apt-secure to regenerate the keyring',
                    'Add [trusted=yes] to the sources.list entry to bypass key verification'
                ],
                ans: 1,
                exp: 'APT verifies package integrity using GPG signatures. A missing or untrusted key causes NO_PUBKEY. The correct fix is to import the repository\'s signing key. Modern Ubuntu uses the /etc/apt/trusted.gpg.d/ directory (place .gpg or .asc key files there). The [trusted=yes] bypass is a security risk and should not be used in production.'
            },
            {
                q: 'Which <code>nftables</code> command replaces <code>iptables -L -n -v</code> to display the current ruleset with packet and byte counters?',
                opts: [
                    'nft list ruleset',
                    'nftables show rules --verbose',
                    'nft display chains --counters',
                    'nft -v show tables'
                ],
                ans: 0,
                exp: 'nft list ruleset displays the complete nftables configuration including all tables, chains, and rules. It shows packet and byte counters when the rules include counters. nftables is the successor to iptables on modern Ubuntu systems.'
            },
            {
                q: 'An operator configures <code>fail2ban</code> to protect SSH. After 5 failed attempts from 10.0.1.50, the IP should be banned for 1 hour. Which jail.local directives correctly configure this?',
                opts: [
                    'maxretry = 5\nbantime = 60\nfindtime = 600',
                    'maxretry = 5\nbantime = 3600\nfindtime = 600',
                    'maxfail = 5\nblocktime = 3600\nwindow = 600',
                    'attempts = 5\nbanduration = 1h\ndetecttime = 10m'
                ],
                ans: 1,
                exp: 'bantime is in seconds. 1 hour = 3600 seconds. maxretry = 5 triggers the ban after 5 failures. findtime = 600 means those 5 failures must occur within a 10-minute window. The option names maxfail, blocktime, and banduration do not exist in fail2ban.'
            },
            {
                q: 'Which file controls the maximum number of open files a process can have, the maximum number of processes per user, and other resource limits enforced by PAM on login?',
                opts: [
                    '/etc/sysctl.conf',
                    '/etc/security/limits.conf',
                    '/etc/pam.d/common-auth',
                    '/proc/sys/fs/file-max'
                ],
                ans: 1,
                exp: '/etc/security/limits.conf is processed by pam_limits.so. It sets soft and hard limits for open files (nofile), max processes (nproc), max locked memory (memlock), and other per-user or per-group resource limits that take effect at login.'
            },
            {
                q: 'An operator wants to verify the integrity of a downloaded source tarball before compiling it. The project provides a SHA256 checksum file. Which command verifies the tarball against the checksum file on Ubuntu 22.04?',
                opts: [
                    'md5sum --check checksums.sha256',
                    'sha256sum -c checksums.sha256',
                    'openssl dgst -sha256 -verify checksums.sha256 package.tar.gz',
                    'gpg --verify checksums.sha256 package.tar.gz'
                ],
                ans: 1,
                exp: 'sha256sum -c reads a checksum file and verifies each listed file against its stored SHA256 hash. The checksum file must be in the standard format (hash + two spaces + filename). This verifies file integrity but not authenticity; GPG signing provides authenticity verification.'
            }
        ];

        /* ── Quiz Engine State ──
           Server-graded: no answer key in this file.
           Passing threshold: 70%. Syncs to Firestore on pass. */
        var current = 0;
        var score = 0;
        var answered = false;
        var TOTAL = questions.length;
        var userAnswers = [];

        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('questionText').innerHTML = q.q;
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';

            var html = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('nextBtn').textContent = 'Next Question';
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            userAnswers[current] = idx;

            var q = questions[current];
            var opts = document.querySelectorAll('.option');

            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans) opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className = 'feedback correct';
                fb.textContent = 'Correct. ' + q.exp;
            } else {
                fb.className = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';

            var pct = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 60) scoreBig.className = 'score-big mid';
            else scoreBig.className = 'score-big low';

            var msg = '';
            if (pct >= 90) msg = 'Outstanding. Hardening and package management fundamentals mastered.';
            else if (pct >= 70) msg = 'Passing score. Review any missed questions before the midterm.';
            else if (pct >= 50) msg = 'Not yet. Revisit ALA-06 through ALA-09 and retry.';
            else msg = 'Below threshold. Review all Week 2 materials before the midterm.';
            document.getElementById('scoreMsg').textContent = msg;

            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                (function(){ try { ModuleProgress.completeQuiz('matrix', 'ala-w2-quiz', pct, { returnToDashboard: false }); } catch (e) { console.warn('[ala-w2-quiz] ModuleProgress.completeQuiz failed:', e); } })();
            }
        }

        /** Render the per-question Review Answers view. */
        function showReviewAnswers() {
            document.getElementById('resultsCard').style.display = 'none';
            var reviewCard = document.getElementById('reviewCard');
            reviewCard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                var picked = userAnswers[i];
                var correct = q.ans;
                var isRight = picked === correct;

                html += '<div class="review-q">';
                html += '<div class="review-q-num">Q' + (i + 1) + ' ' + (isRight ? '<span class="review-mark right">CORRECT</span>' : '<span class="review-mark wrong">INCORRECT</span>') + '</div>';
                html += '<div class="review-q-text">' + q.q + '</div>';
                html += '<div class="review-opts">';
                for (var j = 0; j < q.opts.length; j++) {
                    var cls = 'review-opt';
                    if (j === correct) cls += ' correct';
                    if (j === picked && picked !== correct) cls += ' incorrect';
                    html += '<div class="' + cls + '">';
                    html += '<span class="option-letter">' + letters[j] + '</span> ';
                    html += q.opts[j];
                    if (j === picked && j === correct) html += ' <span class="review-tag right-tag">your answer &bull; correct</span>';
                    else if (j === picked) html += ' <span class="review-tag wrong-tag">your answer</span>';
                    else if (j === correct) html += ' <span class="review-tag right-tag">correct answer</span>';
                    html += '</div>';
                }
                html += '</div>';
                if (q.exp) html += '<div class="review-exp"><strong>Why:</strong> ' + q.exp + '</div>';
                html += '</div>';
            }
            document.getElementById('reviewBody').innerHTML = html;
        }

        function backToScore() {
            document.getElementById('reviewCard').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
        }


        function restartQuiz() {
            current = 0;
            score = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
