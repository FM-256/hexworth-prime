<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEC // INCOMING TRANSMISSION</title>
  <style>
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ================================================================
       PALETTE — matches the Cell-Σ console environment
    ================================================================ */
    :root {
      --bg:         #05090b;
      --panel:      #0a1014;
      --panel-2:    #0c151a;
      --grid-line:  #15262b;
      --edge:       #1c333a;
      --green:      #34e0a1;
      --green-dim:  #1f8f68;
      --cyan:       #3fd0e0;
      --amber:      #f0b54a;
      --red:        #ef5d54;
      --text:       #cfe3df;
      --text-dim:   #6f8a86;
      --text-mut:   #46605c;
    }

    /* ================================================================
       RESET + BASE
    ================================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Courier New', Courier, monospace;
      color: var(--text);
    }

    /* ================================================================
       CRT OVERLAY — scanlines + vignette + flicker
       Implemented as a pseudo-element on a fixed overlay div so it
       stacks above all content without intercepting pointer events.
    ================================================================ */
    #crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    /* Scanlines: repeating horizontal stripes */
    #crt-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 4px
      );
    }

    /* Vignette: radial darkening from edges */
    #crt-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.72) 100%
      );
    }

    /* CRT screen flicker — very subtle, ~0.08s period */
    @keyframes crt-flicker {
      0%,  98%  { opacity: 1; }
      99%        { opacity: 0.93; }
      100%       { opacity: 1; }
    }

    body {
      animation: crt-flicker 8s infinite step-end;
    }

    /* ================================================================
       MAIN LAYOUT — full-bleed column flex stack
    ================================================================ */
    #codec-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ================================================================
       TOP STATUS STRIP
    ================================================================ */
    #status-strip {
      flex: 0 0 auto;
      height: 44px;
      background: var(--panel);
      border-bottom: 1px solid var(--edge);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      overflow: hidden;
    }

    /* faint grid-dot background on the strip */
    #status-strip::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, var(--grid-line) 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.5;
    }

    /* The pulsing transmission dot indicator (CSS-only, no emoji) */
    .tx-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      vertical-align: middle;
      margin-right: 10px;
      flex-shrink: 0;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
      50%       { opacity: 0.3; box-shadow: 0 0 2px var(--green-dim); }
    }

    .tx-dot.active {
      animation: dot-pulse 1.1s ease-in-out infinite;
    }

    #tx-label {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.18em;
      color: var(--green);
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    #tx-status-text {
      /* Changed by JS during connect animation */
    }

    #freq-right {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    #freq-display {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--cyan);
    }

    /* Signal bars — 5 vertical bars that animate in sequence */
    #signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 18px;
    }

    .sbar {
      width: 4px;
      background: var(--green-dim);
      border-radius: 1px;
      transition: background 0.2s;
    }

    .sbar:nth-child(1) { height: 5px; }
    .sbar:nth-child(2) { height: 8px; }
    .sbar:nth-child(3) { height: 11px; }
    .sbar:nth-child(4) { height: 15px; }
    .sbar:nth-child(5) { height: 18px; }

    @keyframes bar-cycle {
      0%, 100% { background: var(--green); box-shadow: 0 0 4px var(--green); }
      50%       { background: var(--green-dim); box-shadow: none; }
    }

    .sbar.transmitting {
      animation: bar-cycle 0.7s ease-in-out infinite;
    }
    .sbar.transmitting:nth-child(2) { animation-delay: 0.1s; }
    .sbar.transmitting:nth-child(3) { animation-delay: 0.2s; }
    .sbar.transmitting:nth-child(4) { animation-delay: 0.3s; }
    .sbar.transmitting:nth-child(5) { animation-delay: 0.4s; }

    /* ================================================================
       PORTRAIT AREA — two panels side by side
    ================================================================ */
    #portrait-row {
      flex: 1 1 auto;            /* grow to fill the frame — codec call commands the screen */
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding: 34px 48px 22px;
      background: var(--bg);
      min-height: 0;
    }

    .codec-panel {
      flex: 1 1 0;
      max-width: 560px;
      min-width: 240px;
      position: relative;
      border: 1px solid var(--edge);
      background: var(--panel-2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Left panel gets a right separator gap */
    .codec-panel:first-child {
      margin-right: 16px;
    }

    /* Green CRT corner brackets — pure CSS, no characters */
    .codec-panel::before,
    .codec-panel::after {
      content: '';
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }

    /* Top-left + top-right bracket via box-shadow trick */
    .codec-panel::before {
      top: 0;
      left: 0;
      width: 16px;
      height: 16px;
      border-top: 2px solid var(--green);
      border-left: 2px solid var(--green);
    }

    .codec-panel::after {
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid var(--green);
      border-right: 2px solid var(--green);
    }

    /* Additional corner pieces via child pseudo-wrappers */
    .panel-corners-tr {
      position: absolute;
      top: 0; right: 0;
      width: 16px; height: 16px;
      border-top: 2px solid var(--green);
      border-right: 2px solid var(--green);
      z-index: 4;
      pointer-events: none;
    }

    .panel-corners-bl {
      position: absolute;
      bottom: 0; left: 0;
      width: 16px; height: 16px;
      border-bottom: 2px solid var(--green);
      border-left: 2px solid var(--green);
      z-index: 4;
      pointer-events: none;
    }

    /* Active speaker glow — added by JS */
    .codec-panel.speaker-active {
      border-color: var(--green);
      box-shadow:
        0 0 0 1px var(--green),
        0 0 24px 4px rgba(52, 224, 161, 0.22),
        inset 0 0 32px rgba(52, 224, 161, 0.06);
    }

    .codec-panel.speaker-active::before,
    .codec-panel.speaker-active::after {
      border-color: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .codec-panel.speaker-active .panel-corners-tr,
    .codec-panel.speaker-active .panel-corners-bl {
      border-color: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* Dim inactive speaker */
    .codec-panel.speaker-inactive {
      border-color: var(--text-mut);
      box-shadow: none;
      filter: brightness(0.45) saturate(0.4);
    }

    .codec-panel.speaker-inactive::before,
    .codec-panel.speaker-inactive::after {
      border-color: var(--text-mut);
    }

    /* Transition for smooth switch */
    .codec-panel {
      transition: border-color 0.35s, box-shadow 0.35s, filter 0.35s;
    }

    /* Portrait name tag at the top of each panel */
    .panel-name {
      position: relative;
      z-index: 3;
      background: rgba(5, 9, 11, 0.8);
      border-bottom: 1px solid var(--edge);
      padding: 5px 12px;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: var(--green);
      text-align: center;
      flex-shrink: 0;
    }

    /* The portrait visual area — fills remaining space */
    .panel-visual {
      flex: 1 1 0;
      position: relative;
      overflow: hidden;
      min-height: 220px;
    }

    /* Green phosphor overlay on portrait images */
    .panel-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(52, 224, 161, 0.08) 0%,
          rgba(52, 224, 161, 0.00) 40%,
          rgba(52, 224, 161, 0.12) 100%
        );
      z-index: 2;
      pointer-events: none;
    }

    /* Scan-line overlay specific to portrait panels */
    .panel-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0.22) 4px
      );
      z-index: 3;
      pointer-events: none;
    }

    /* dr-hex portrait image */
    #dr-hex-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      /* CRT green tint using CSS filters */
      filter:
        grayscale(0.7)
        sepia(0.5)
        hue-rotate(115deg)
        saturate(2.2)
        brightness(0.85)
        contrast(1.1);
      position: relative;
      z-index: 1;
    }

    /* ================================================================
       GRID COMMAND — inline SVG silhouette portrait
       Mysterious hooded officer with S7 insignia
    ================================================================ */
    #grid-cmd-svg {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ================================================================
       CONNECT SCREEN — overlays the portrait row during uplink phase
    ================================================================ */
    #connect-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #connect-status {
      font-size: 14px;
      letter-spacing: 0.25em;
      color: var(--green);
    }

    /* Uplink progress bar */
    #uplink-bar-wrap {
      width: 280px;
      height: 4px;
      background: var(--panel-2);
      border: 1px solid var(--edge);
      overflow: hidden;
    }

    #uplink-bar-fill {
      height: 100%;
      background: var(--green);
      width: 0%;
      box-shadow: 0 0 8px var(--green);
      transition: width 0.05s linear;
    }

    #connect-freq-text {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
    }

    /* ================================================================
       DIALOGUE BOX — bottom strip
    ================================================================ */
    #dialogue-box {
      flex: 0 0 auto;
      background: var(--panel);
      border-top: 1px solid var(--edge);
      padding: 14px 24px 16px;
      position: relative;
      min-height: 110px;
    }

    /* Subtle horizontal grid lines in dialogue area */
    #dialogue-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 23px,
          var(--grid-line) 23px,
          var(--grid-line) 24px
        );
      opacity: 0.3;
      pointer-events: none;
    }

    #speaker-tag {
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 0.22em;
      color: var(--green);
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    #dialogue-text {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      position: relative;
      z-index: 1;
      min-height: 3em;
      /* Prevent layout jump as text populates */
      word-break: break-word;
    }

    /* Blinking cursor shown while typing */
    #type-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--green);
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #type-cursor.blinking {
      animation: cursor-blink 0.6s step-end infinite;
    }

    /* ================================================================
       DIALOGUE CONTROLS ROW — mute + skip + advance hint
    ================================================================ */
    #controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid var(--edge);
      color: var(--text-dim);
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .ctrl-btn:hover,
    .ctrl-btn:focus {
      border-color: var(--green-dim);
      color: var(--green);
      outline: none;
    }

    #advance-hint {
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--text-mut);
    }

    /* ================================================================
       END SCREEN — shown after "// TRANSMISSION ENDS"
    ================================================================ */
    #end-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 11, 0.93);
      z-index: 500;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
    }

    #end-screen.visible {
      display: flex;
    }

    #end-title {
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
    }

    #end-buttons {
      display: flex;
      gap: 20px;
    }

    .end-btn {
      background: transparent;
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      padding: 10px 24px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .end-btn:hover,
    .end-btn:focus {
      background: rgba(52, 224, 161, 0.1);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(52, 224, 161, 0.25);
      outline: none;
    }

    /* ================================================================
       GLITCH ANIMATION — used for sign-off
    ================================================================ */
    @keyframes glitch-shift {
      0%   { transform: translate(0); clip-path: inset(0 0 100% 0); }
      10%  { transform: translate(-4px, 2px); clip-path: inset(10% 0 80% 0); }
      20%  { transform: translate(4px, -2px); clip-path: inset(30% 0 60% 0); }
      30%  { transform: translate(0, 3px); clip-path: inset(50% 0 40% 0); }
      40%  { transform: translate(-3px, 0); clip-path: inset(70% 0 20% 0); }
      50%  { transform: translate(3px, -1px); clip-path: inset(80% 0 10% 0); }
      60%  { transform: translate(0); clip-path: inset(0 0 0 0); }
      100% { transform: translate(0); clip-path: inset(0 0 0 0); }
    }

    .glitch-text {
      position: relative;
      color: var(--green);
      font-size: 16px;
      letter-spacing: 0.3em;
    }

    .glitch-text::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: var(--cyan);
      animation: glitch-shift 0.6s steps(1) forwards;
      opacity: 0.7;
    }

    /* ================================================================
       CONNECT OVERLAY — positioned relative to portrait row
    ================================================================ */
    #portrait-row {
      position: relative; /* so connect-overlay's absolute positioning is local */
    }

    /* ================================================================
       UTILITY
    ================================================================ */
    .hidden { display: none !important; }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<h1 class="visually-hidden">CODEC // INCOMING TRANSMISSION</h1>

<!-- CRT overlay — pointer-events: none so it never blocks interaction -->
<div id="crt-overlay" aria-hidden="true"></div>

<!-- ============================================================
     END SCREEN — shown after sign-off
============================================================ -->
<div id="end-screen" role="dialog" aria-modal="true" aria-label="Transmission ended">
  <div id="end-title">// TRANSMISSION ENDS</div>
  <div id="end-buttons">
    <button class="end-btn" id="btn-replay">REPLAY TRANSMISSION</button>
    <button class="end-btn" id="btn-return">RETURN TO CELL</button>
  </div>
</div>

<!-- ============================================================
     MAIN CODEC SHELL
============================================================ -->
<div id="codec-shell">

  <!-- STATUS STRIP -->
  <div id="status-strip" role="status" aria-live="polite">
    <div id="tx-label">
      <span class="tx-dot" id="tx-dot"></span>
      <span id="tx-status-text">ESTABLISHING UPLINK...</span>
    </div>
    <div id="freq-right">
      <span id="freq-display">FREQ 140.85</span>
      <div id="signal-bars" aria-hidden="true">
        <div class="sbar" id="sb1"></div>
        <div class="sbar" id="sb2"></div>
        <div class="sbar" id="sb3"></div>
        <div class="sbar" id="sb4"></div>
        <div class="sbar" id="sb5"></div>
      </div>
    </div>
  </div>

  <!-- PORTRAIT ROW -->
  <div id="portrait-row">

    <!-- Connect overlay — shown briefly during uplink phase -->
    <div id="connect-overlay" aria-live="assertive">
      <div id="connect-status">ESTABLISHING UPLINK...</div>
      <div id="uplink-bar-wrap">
        <div id="uplink-bar-fill"></div>
      </div>
      <div id="connect-freq-text">SCANNING 140.85 MHz</div>
    </div>

    <!-- LEFT PANEL: GRID COMMAND -->
    <div class="codec-panel" id="panel-grid" aria-label="Grid Command portrait">
      <div class="panel-name">GRID COMMAND</div>
      <div class="panel-corners-tr" aria-hidden="true"></div>
      <div class="panel-corners-bl" aria-hidden="true"></div>
      <div class="panel-visual">
        <!-- Inline SVG silhouette — hooded officer, S7 insignia -->
        <svg id="grid-cmd-svg" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <!-- Background radial glow -->
            <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#0d2820"/>
              <stop offset="100%" stop-color="#020a08"/>
            </radialGradient>
            <!-- Green phosphor vertical scan sweep -->
            <linearGradient id="scanSweep" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#34e0a1" stop-opacity="0.08"/>
              <stop offset="48%"  stop-color="#34e0a1" stop-opacity="0.04"/>
              <stop offset="50%"  stop-color="#34e0a1" stop-opacity="0.18"/>
              <stop offset="52%"  stop-color="#34e0a1" stop-opacity="0.04"/>
              <stop offset="100%" stop-color="#34e0a1" stop-opacity="0.06"/>
            </linearGradient>
            <!-- Edge vignette -->
            <radialGradient id="svgVignette" cx="50%" cy="50%" r="60%">
              <stop offset="0%"   stop-color="transparent"/>
              <stop offset="100%" stop-color="rgba(2,10,8,0.7)"/>
            </radialGradient>
            <!-- Noise filter for texture -->
            <filter id="svgNoise" x="-5%" y="-5%" width="110%" height="110%">
              <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
              <feColorMatrix type="saturate" values="0"/>
              <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
              <feComponentTransfer>
                <feFuncA type="linear" slope="0.08"/>
              </feComponentTransfer>
              <feComposite in="SourceGraphic" in2="noisy" operator="over"/>
            </filter>
          </defs>

          <!-- Background fill -->
          <rect width="320" height="380" fill="url(#bgGlow)"/>

          <!-- Subtle grid lines behind figure -->
          <g stroke="#1a3a2a" stroke-width="0.5" opacity="0.6">
            <line x1="0"   y1="76"  x2="320" y2="76"/>
            <line x1="0"   y1="152" x2="320" y2="152"/>
            <line x1="0"   y1="228" x2="320" y2="228"/>
            <line x1="0"   y1="304" x2="320" y2="304"/>
            <line x1="80"  y1="0"   x2="80"  y2="380"/>
            <line x1="160" y1="0"   x2="160" y2="380"/>
            <line x1="240" y1="0"   x2="240" y2="380"/>
          </g>

          <!-- ---- FIGURE: hooded officer silhouette ---- -->

          <!-- Shoulders / body bulk — officer coat -->
          <path d="M 60 380 L 60 260 Q 60 230 80 218 L 100 210 L 110 250 L 130 245 L 135 215
                   L 155 210 L 160 208 L 165 210 L 185 215 L 190 245 L 210 250 L 220 210
                   L 240 218 Q 260 230 260 260 L 260 380 Z"
                fill="#1a3020" stroke="#34e0a1" stroke-width="0.8"/>

          <!-- Epaulet bars left -->
          <rect x="60" y="218" width="28" height="6" rx="2" fill="#34e0a1" opacity="0.7"/>
          <rect x="60" y="226" width="28" height="3" rx="1" fill="#1f8f68" opacity="0.8"/>

          <!-- Epaulet bars right -->
          <rect x="232" y="218" width="28" height="6" rx="2" fill="#34e0a1" opacity="0.7"/>
          <rect x="232" y="226" width="28" height="3" rx="1" fill="#1f8f68" opacity="0.8"/>

          <!-- Neck / collar -->
          <path d="M 135 215 L 135 200 Q 135 195 140 193 L 160 190 L 180 193 Q 185 195 185 200 L 185 215 Z"
                fill="#0f1e18"/>
          <!-- Collar lapels -->
          <path d="M 135 200 L 148 210 L 160 205 L 172 210 L 185 200 L 175 195 L 160 198 L 145 195 Z"
                fill="#1a3020" stroke="#34e0a1" stroke-width="0.5"/>

          <!-- Hood — large draping hood obscuring top of head -->
          <path d="M 90 195 Q 88 170 92 145 Q 96 120 110 110 Q 130 98 160 96
                   Q 190 98 210 110 Q 224 120 228 145 Q 232 170 230 195
                   L 200 205 Q 185 200 160 198 Q 135 200 120 205 Z"
                fill="#0d1c15" stroke="#34e0a1" stroke-width="0.6"/>

          <!-- Hood shadow / depth layer -->
          <path d="M 105 195 Q 104 175 107 155 Q 112 130 128 118 Q 144 108 160 107
                   Q 176 108 192 118 Q 208 130 213 155 Q 216 175 215 195
                   L 195 202 Q 178 198 160 197 Q 142 198 125 202 Z"
                fill="#091209"/>

          <!-- Face obscured in shadow — only faint jaw/chin hint -->
          <path d="M 128 185 Q 128 175 132 170 Q 138 163 160 162 Q 182 163 188 170
                   Q 192 175 192 185 L 188 192 Q 175 197 160 197 Q 145 197 132 192 Z"
                fill="#0a1610" stroke="#1f8f68" stroke-width="0.4"/>

          <!-- Eyes — two dim green points, barely visible -->
          <ellipse cx="148" cy="176" rx="4" ry="2.5" fill="#34e0a1" opacity="0.35"/>
          <ellipse cx="172" cy="176" rx="4" ry="2.5" fill="#34e0a1" opacity="0.35"/>
          <!-- Pupil glint -->
          <ellipse cx="149" cy="176" rx="1.5" ry="1.5" fill="#34e0a1" opacity="0.8"/>
          <ellipse cx="173" cy="176" rx="1.5" ry="1.5" fill="#34e0a1" opacity="0.8"/>

          <!-- ---- S7 / SECTOR 7 INSIGNIA on chest ---- -->
          <!-- Hexagon badge -->
          <polygon
            points="160,232 174,240 174,256 160,264 146,256 146,240"
            fill="#0a1610" stroke="#34e0a1" stroke-width="1.2"/>
          <!-- S7 text inside badge -->
          <text x="160" y="252" text-anchor="middle"
                font-family="Courier New, monospace" font-size="10"
                font-weight="bold" fill="#34e0a1" letter-spacing="1">S7</text>

          <!-- Rank pip row above badge -->
          <circle cx="148" cy="228" r="2.5" fill="#34e0a1" opacity="0.9"/>
          <circle cx="155" cy="228" r="2.5" fill="#34e0a1" opacity="0.9"/>
          <circle cx="162" cy="228" r="2.5" fill="#34e0a1" opacity="0.9"/>
          <circle cx="169" cy="228" r="2.5" fill="#34e0a1" opacity="0.9"/>
          <circle cx="176" cy="228" r="2.5" fill="#1f8f68" opacity="0.6"/>

          <!-- Thin collar data-line detail -->
          <line x1="140" y1="195" x2="180" y2="195" stroke="#1f8f68" stroke-width="0.6" opacity="0.6"/>

          <!-- Bottom coat detail — horizontal seam -->
          <line x1="60" y1="300" x2="260" y2="300" stroke="#1f8f68" stroke-width="0.5" opacity="0.5"/>

          <!-- Scan sweep overlay — animated via CSS animation on the rect -->
          <rect width="320" height="380" fill="url(#scanSweep)" opacity="0.6">
            <animate attributeName="y" values="-380;380" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="height" values="380;380" dur="4s" repeatCount="indefinite"/>
          </rect>

          <!-- Vignette on top -->
          <rect width="320" height="380" fill="url(#svgVignette)"/>
        </svg>
      </div>
    </div>

    <!-- RIGHT PANEL: DR. HEX -->
    <div class="codec-panel" id="panel-drhex" aria-label="Dr. Hex portrait">
      <div class="panel-name">DR. HEX</div>
      <div class="panel-corners-tr" aria-hidden="true"></div>
      <div class="panel-corners-bl" aria-hidden="true"></div>
      <div class="panel-visual">
        <img
          id="dr-hex-img"
          src="/assets/images/icons/dr-hex-headshot.svg"
          alt="Dr. Hex"
          onerror="this.src='/assets/images/icons/dr-hex-humanoid.svg'; this.onerror=function(){this.src='/assets/images/icons/dr-hex-active.svg';};"
        />
      </div>
    </div>

  </div><!-- /portrait-row -->

  <!-- DIALOGUE BOX -->
  <div id="dialogue-box" aria-live="polite" aria-atomic="true">
    <div id="speaker-tag">---</div>
    <div id="dialogue-text"><span id="typed-output"></span><span id="type-cursor" class="blinking"></span></div>
    <div id="controls-row">
      <button class="ctrl-btn" id="btn-mute" aria-pressed="false">[M] MUTE AUDIO</button>
      <span id="advance-hint">[CLICK or ENTER] advance &nbsp;&nbsp; [ESC] skip</span>
      <button class="ctrl-btn" id="btn-skip">[ESC] SKIP</button>
    </div>
  </div>

</div><!-- /codec-shell -->

<script>
  /* ============================================================
     CODEC TRANSMISSION SCENE
     Metal Gear Solid-style cutscene for Cell-Σ exam reward.
     Full-bleed, no emoji, audio-guarded, params from URL.
  ============================================================ */

  /* ---- URL PARAMETER INJECTION ---- */
  /* Read ?callsign= and ?rank= from the URL; fallback to defaults */
  (function readUrlParams() {
    var params = new URLSearchParams(window.location.search);
    window.CALLSIGN = params.get('callsign') || 'OPERATOR';
    window.RANK     = params.get('rank')     || 'A-RANK';
  })();

  /* ============================================================
     AUDIO ENGINE
     Web Audio API — short square-wave blip per typed character.
     Fully guarded: AudioContext might be blocked until user
     gesture; we create it lazily and catch all errors.
  ============================================================ */
  var audioCtx   = null;  /* created on first user interaction */
  var audioMuted = false; /* toggled by mute button */
  var audioReady = false; /* true once ctx is running */

  /* Create or resume AudioContext — called before playing any sound */
  function ensureAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        /* AudioContext not available in this environment */
        audioReady = false;
        return;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function() {});
    }
    audioReady = (audioCtx.state === 'running');
  }

  /* Play a single codec "blip" — short square-wave beep */
  function playBlip() {
    if (audioMuted) return;
    ensureAudioCtx();
    if (!audioCtx || !audioReady) return;
    try {
      var osc  = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.06);
    } catch (e) {
      /* Ignore — blip failure never breaks the scene */
    }
  }

  /* Toggle mute state */
  function toggleMute() {
    audioMuted = !audioMuted;
    var btn = document.getElementById('btn-mute');
    if (audioMuted) {
      btn.textContent = '[M] UNMUTE AUDIO';
      btn.setAttribute('aria-pressed', 'true');
    } else {
      btn.textContent = '[M] MUTE AUDIO';
      btn.setAttribute('aria-pressed', 'false');
      /* Resume context on unmute */
      ensureAudioCtx();
    }
  }

  /* ============================================================
     SCRIPT DATA
     Lines are object literals with speaker + text.
     {{CALLSIGN}} and {{RANK}} are resolved at render time from
     window.CALLSIGN / window.RANK (URL params or defaults).
     Text is inserted via textContent — never innerHTML — so
     the param values cannot inject markup.
  ============================================================ */
  var SCRIPT_LINES = [
    {
      speaker: 'GRID COMMAND',
      panel:   'grid',
      text:    "Cell-Σ, this is Sector 7 Grid Command. We're reading you five-by-five. Signal's clean."
    },
    {
      speaker: 'GRID COMMAND',
      panel:   'grid',
      text:    "This sector's been dark a long time, operator. Tonight it has a node again -- and you're the one who lit it."
    },
    {
      speaker: 'DR. HEX',
      panel:   'drhex',
      text:    "I never doubted it. Name authority, the watch, the integrity seal, a locked perimeter, a clean audit -- every light green."
    },
    {
      speaker: 'GRID COMMAND',
      panel:   'grid',
      /* CALLSIGN resolved at runtime */
      text:    '__CALLSIGN__ -- by the authority of Sector 7 Grid Command, welcome to the Resistance.'
    },
    {
      speaker: 'DR. HEX',
      panel:   'drhex',
      /* RANK resolved at runtime */
      text:    "You're not commissioning trainee hardware anymore. You're an operator on the grid. Standing: __RANK__."
    },
    {
      speaker: 'GRID COMMAND',
      panel:   'grid',
      text:    "Hold the line, Cell-Σ. The grid is bigger than one cell -- and we'll be calling again."
    }
  ];

  /* Resolve runtime tokens in a line's text */
  function resolveText(raw) {
    return raw
      .replace(/__CALLSIGN__/g, window.CALLSIGN)
      .replace(/__RANK__/g,     window.RANK);
  }

  /* ============================================================
     STATE MACHINE
  ============================================================ */
  var scene = {
    phase:       'idle',   /* idle | connect | dialogue | signoff | end */
    lineIndex:   0,
    charIndex:   0,
    typeTimer:   null,
    pauseTimer:  null,
    fastForward: false,    /* true when user presses key mid-line */
    ended:       false
  };

  /* Character typing speed in milliseconds */
  var TYPE_INTERVAL  = 30;
  /* Pause after line completes before auto-advancing (ms) */
  var LINE_PAUSE_MS  = 1800;
  /* How many chars to skip per frame when fast-forwarding */
  var FF_CHARS       = 999;

  /* ============================================================
     DOM REFERENCES
  ============================================================ */
  var elSpeakerTag   = document.getElementById('speaker-tag');
  var elTypedOutput  = document.getElementById('typed-output');
  var elTypeCursor   = document.getElementById('type-cursor');
  var elPanelGrid    = document.getElementById('panel-grid');
  var elPanelDrHex   = document.getElementById('panel-drhex');
  var elConnOverlay  = document.getElementById('connect-overlay');
  var elConnStatus   = document.getElementById('connect-status');
  var elUplinkFill   = document.getElementById('uplink-bar-fill');
  var elConnFreq     = document.getElementById('connect-freq-text');
  var elEndScreen    = document.getElementById('end-screen');
  var elTxDot        = document.getElementById('tx-dot');
  var elTxStatusText = document.getElementById('tx-status-text');
  var elSignalBars   = document.querySelectorAll('.sbar');

  /* ============================================================
     UPLINK / CONNECT ANIMATION
     Runs before dialogue starts. Shows a progress bar filling
     to 100%, changes status text, then fades out.
  ============================================================ */
  function runConnectAnimation(onComplete) {
    /* Show connecting status */
    elConnStatus.textContent = 'ESTABLISHING UPLINK...';
    elConnFreq.textContent   = 'SCANNING 140.85 MHz';
    elUplinkFill.style.width = '0%';
    elConnOverlay.style.display = 'flex';

    var progress = 0;
    var step = 2; /* percent per tick */

    function tick() {
      progress += step + Math.random() * 3;
      if (progress > 100) progress = 100;
      elUplinkFill.style.width = progress + '%';

      if (progress < 100) {
        /* Small random jitter in progress speed */
        setTimeout(tick, 30 + Math.random() * 60);
      } else {
        /* Bar full — show "SIGNAL ACQUIRED" */
        setTimeout(function() {
          elConnStatus.textContent = 'SIGNAL ACQUIRED';
          elConnFreq.textContent   = 'LINK ESTABLISHED :: FREQ 140.85';
          /* Update strip */
          elTxStatusText.textContent = 'INCOMING TRANSMISSION';
          elTxDot.classList.add('active');
          /* Activate signal bars */
          elSignalBars.forEach(function(b) { b.classList.add('transmitting'); });
          /* Short hold, then fade overlay out */
          setTimeout(function() {
            elConnOverlay.style.transition = 'opacity 0.5s';
            elConnOverlay.style.opacity = '0';
            setTimeout(function() {
              elConnOverlay.style.display = 'none';
              elConnOverlay.style.opacity = '1';
              elConnOverlay.style.transition = '';
              onComplete();
            }, 520);
          }, 700);
        }, 200);
      }
    }

    tick();
  }

  /* ============================================================
     SPEAKER PANEL SWITCHING
     Glows the active speaker's panel; dims the inactive one.
  ============================================================ */
  function setSpeaker(panelKey) {
    /* Remove existing state from both panels */
    elPanelGrid.classList.remove('speaker-active', 'speaker-inactive');
    elPanelDrHex.classList.remove('speaker-active', 'speaker-inactive');

    if (panelKey === 'grid') {
      elPanelGrid.classList.add('speaker-active');
      elPanelDrHex.classList.add('speaker-inactive');
    } else if (panelKey === 'drhex') {
      elPanelDrHex.classList.add('speaker-active');
      elPanelGrid.classList.add('speaker-inactive');
    } else {
      /* Neither active — neutral state */
    }
  }

  /* ============================================================
     TYPEWRITER ENGINE
     Types out a single line character by character.
     Calls onComplete when the line is fully displayed.
  ============================================================ */
  function typeLine(text, onComplete) {
    scene.charIndex  = 0;
    scene.fastForward = false;
    elTypedOutput.textContent = '';

    function nextChar() {
      if (scene.fastForward) {
        /* Skip to end instantly */
        elTypedOutput.textContent = text;
        elTypeCursor.classList.add('blinking');
        onComplete();
        return;
      }

      if (scene.charIndex >= text.length) {
        /* Done — blink cursor and notify */
        elTypeCursor.classList.add('blinking');
        onComplete();
        return;
      }

      var ch = text[scene.charIndex];
      scene.charIndex++;
      /* Use textContent — never innerHTML — so no injection risk */
      elTypedOutput.textContent += ch;

      /* Play blip on non-space characters */
      if (ch !== ' ' && scene.charIndex % 2 === 0) {
        playBlip();
      }

      /* Slightly longer pause on sentence-ending punctuation */
      var delay = TYPE_INTERVAL;
      if (ch === '.' || ch === '!' || ch === '?') {
        delay = 160;
      } else if (ch === ',') {
        delay = 80;
      }

      scene.typeTimer = setTimeout(nextChar, delay);
    }

    nextChar();
  }

  /* ============================================================
     DIALOGUE SEQUENCER
     Advances through SCRIPT_LINES one at a time.
  ============================================================ */
  function playLine(index) {
    if (index >= SCRIPT_LINES.length) {
      /* All lines done — play sign-off */
      playSignOff();
      return;
    }

    scene.lineIndex = index;
    var line = SCRIPT_LINES[index];

    /* Update speaker tag via textContent (safe) */
    elSpeakerTag.textContent = line.speaker;

    /* Switch active portrait panel */
    setSpeaker(line.panel);

    /* Resolve runtime tokens in text */
    var text = resolveText(line.text);

    /* Clear cursor blink during typing */
    elTypeCursor.classList.remove('blinking');

    typeLine(text, function() {
      /* Auto-advance after pause, unless user already advanced */
      scene.pauseTimer = setTimeout(function() {
        advanceLine();
      }, LINE_PAUSE_MS);
    });
  }

  /* Advance to next line (called by click/Enter or auto-timer) */
  function advanceLine() {
    clearTimeout(scene.pauseTimer);
    clearTimeout(scene.typeTimer);
    scene.pauseTimer = null;
    scene.typeTimer  = null;

    if (scene.phase !== 'dialogue') return;

    playLine(scene.lineIndex + 1);
  }

  /* Fast-forward current line if still typing, otherwise advance */
  function handleAdvance() {
    if (scene.ended) return;

    /* Wake AudioContext on first user gesture */
    ensureAudioCtx();

    if (scene.phase === 'dialogue') {
      var text = resolveText(SCRIPT_LINES[scene.lineIndex].text);
      if (scene.charIndex < text.length) {
        /* Line still typing — fast-forward it */
        scene.fastForward = true;
        clearTimeout(scene.typeTimer);
        /* nextChar will fire with fastForward=true on next tick */
        var savedIndex = scene.lineIndex;
        var savedText  = text;
        /* Re-trigger with fast-forward */
        elTypedOutput.textContent = savedText;
        elTypeCursor.classList.add('blinking');
        clearTimeout(scene.pauseTimer);
        scene.charIndex = savedText.length;
        scene.pauseTimer = setTimeout(function() {
          advanceLine();
        }, LINE_PAUSE_MS);
      } else {
        /* Line done, waiting for pause — advance now */
        clearTimeout(scene.pauseTimer);
        advanceLine();
      }
    }
  }

  /* ============================================================
     SIGN-OFF SEQUENCE
     Glitch animation + "// TRANSMISSION ENDS" message.
  ============================================================ */
  function playSignOff() {
    scene.phase = 'signoff';
    setSpeaker(null); /* neither panel active */

    /* Neutralize dialogue box */
    elSpeakerTag.textContent = '//';

    /* Glitch effect: rapidly scramble the dialogue text */
    var glitchText = '// TRANSMISSION ENDS';
    var glitchChars = '!@#$%^&*<>?/\\|~01';
    var glitchSteps = 0;
    var maxGlitch   = 14;

    function glitchStep() {
      if (glitchSteps >= maxGlitch) {
        /* Final: set real text */
        elTypedOutput.textContent = glitchText;
        elTypeCursor.classList.remove('blinking');
        elTypeCursor.style.display = 'none';
        /* Stop signal bars */
        elSignalBars.forEach(function(b) { b.classList.remove('transmitting'); });
        elTxDot.classList.remove('active');
        elTxStatusText.textContent = 'TRANSMISSION ENDED';
        /* Show end screen after short delay */
        setTimeout(showEndScreen, 900);
        return;
      }
      /* Scramble display */
      var scramble = '';
      for (var i = 0; i < glitchText.length; i++) {
        if (Math.random() < 0.45 || glitchSteps < 4) {
          scramble += glitchChars[Math.floor(Math.random() * glitchChars.length)];
        } else {
          scramble += glitchText[i];
        }
      }
      elTypedOutput.textContent = scramble;
      glitchSteps++;
      setTimeout(glitchStep, 60 + Math.random() * 80);
    }

    /* Short pause before glitch begins */
    setTimeout(glitchStep, 400);
  }

  /* Show the end screen overlay */
  function showEndScreen() {
    scene.ended = true;
    scene.phase = 'end';
    elEndScreen.classList.add('visible');
    /* Focus the replay button for keyboard users */
    document.getElementById('btn-replay').focus();
  }

  /* ============================================================
     SKIP TO END
     Jumps directly to sign-off sequence (ESC key or skip button).
  ============================================================ */
  function skipToEnd() {
    if (scene.ended) return;
    clearTimeout(scene.pauseTimer);
    clearTimeout(scene.typeTimer);
    scene.phase = 'dialogue'; /* ensure signoff can run */
    playSignOff();
  }

  /* ============================================================
     RETURN TO CELL
     In standalone preview mode, fades out and restarts the scene.
     When wired to a parent page, the parent can listen for the
     'codec-return' event on window.
  ============================================================ */
  function returnToCell() {
    /* Dispatch event for same-window listeners */
    window.dispatchEvent(new CustomEvent('codec-return'));

    /* When embedded as an iframe overlay (the exam capstone), tell the parent
       to close the overlay and stop here — do not restart the scene. */
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage('codec-return', '*'); } catch (e) {}
      return;
    }

    /* Standalone fallback: fade to black, restart */
    var shell = document.getElementById('codec-shell');
    shell.style.transition = 'opacity 0.6s';
    shell.style.opacity = '0';
    elEndScreen.classList.remove('visible');

    setTimeout(function() {
      shell.style.opacity = '1';
      shell.style.transition = '';
      startScene();
    }, 650);
  }

  /* ============================================================
     START SCENE
     Entry point — resets all state and begins the connect animation.
     Called on page load and by "Replay" button.
  ============================================================ */
  function startScene() {
    /* Clear any running timers */
    clearTimeout(scene.pauseTimer);
    clearTimeout(scene.typeTimer);

    /* Reset state */
    scene.phase       = 'connect';
    scene.lineIndex   = 0;
    scene.charIndex   = 0;
    scene.fastForward = false;
    scene.ended       = false;

    /* Reset DOM */
    elEndScreen.classList.remove('visible');
    elTypedOutput.textContent = '';
    elSpeakerTag.textContent  = '---';
    elTypeCursor.classList.add('blinking');
    elTypeCursor.style.display = '';
    elTxStatusText.textContent = 'ESTABLISHING UPLINK...';
    elTxDot.classList.remove('active');
    elSignalBars.forEach(function(b) { b.classList.remove('transmitting'); });
    elPanelGrid.classList.remove('speaker-active', 'speaker-inactive');
    elPanelDrHex.classList.remove('speaker-active', 'speaker-inactive');

    /* Show connect overlay and run uplink animation */
    elConnOverlay.style.display  = 'flex';
    elConnOverlay.style.opacity  = '1';
    elConnOverlay.style.transition = '';
    elUplinkFill.style.width = '0%';

    runConnectAnimation(function() {
      scene.phase = 'dialogue';
      playLine(0);
    });
  }

  /* ============================================================
     KEYBOARD HANDLER
     - Enter / Space: advance line or fast-forward
     - Escape: skip to end
     - M: toggle mute
  ============================================================ */
  document.addEventListener('keydown', function(e) {
    /* Wake audio on any key press */
    ensureAudioCtx();

    if (e.key === 'Escape') {
      e.preventDefault();
      skipToEnd();
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (scene.phase === 'dialogue') {
        e.preventDefault();
        handleAdvance();
      }
    } else if (e.key === 'm' || e.key === 'M') {
      toggleMute();
    }
  });

  /* Click anywhere on the dialogue box or portrait row advances the line */
  document.getElementById('dialogue-box').addEventListener('click', function(e) {
    /* Ignore clicks on control buttons (they have their own handlers) */
    if (e.target.classList.contains('ctrl-btn')) return;
    ensureAudioCtx();
    handleAdvance();
  });

  document.getElementById('portrait-row').addEventListener('click', function() {
    ensureAudioCtx();
    handleAdvance();
  });

  /* ============================================================
     END SCREEN BUTTON WIRING
     Attached here — after all functions are defined — to satisfy
     the no-forward-reference rule. btn-mute and btn-skip are
     also wired here for the same reason; their onclick attributes
     in the HTML were removed to avoid forward references.
  ============================================================ */
  document.getElementById('btn-replay').addEventListener('click', function() {
    /* Restart the full cutscene from the connect animation */
    startScene();
  });

  document.getElementById('btn-return').addEventListener('click', function() {
    /* Fade out and return (preview: restart; wired: dispatch codec-return) */
    returnToCell();
  });

  document.getElementById('btn-mute').addEventListener('click', function() {
    /* Toggle audio mute state */
    toggleMute();
  });

  document.getElementById('btn-skip').addEventListener('click', function() {
    /* Jump directly to sign-off glitch */
    skipToEnd();
  });

  /* ============================================================
     AUTO-START on page load
  ============================================================ */
  window.addEventListener('load', function() {
    startScene();
  });
</script>
