<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Programming Quiz - Python Hub | Hexworth Prime</title>
    <style>
        :root {
            --house-color: #4ade80;
            --house-color-dark: #22c55e;
            --house-color-light: #86efac;
            --python-blue: #306998;
            --python-blue-light: #4b8bbe;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #c8d6e5;
            --text-secondary: #7a8b9a;
            --text-heading: #e2e8f0;
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1729;
            --border-color: rgba(74, 222, 128, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.7; min-height: 100vh; }
        .quiz-header { background: rgba(10, 14, 26, 0.95); padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; backdrop-filter: blur(10px); }
        .quiz-header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .back-btn:hover { color: var(--house-color); }
        .quiz-badge { background: #a855f7; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .quiz-progress { color: var(--text-secondary); font-size: 0.85rem; }
        .quiz-content { max-width: 800px; margin: 0 auto; padding: 2rem 2rem 4rem; }
        .quiz-title-section { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .quiz-title-section h1 { font-size: 1.8rem; color: var(--text-heading); margin-bottom: 0.5rem; }
        .quiz-title-section p { color: var(--text-secondary); }
        .question-card { background: rgba(14, 22, 40, 0.85); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .question-card.answered { border-color: rgba(74, 222, 128, 0.2); }
        .question-card.correct { border-color: rgba(34, 197, 94, 0.4); }
        .question-card.incorrect { border-color: rgba(239, 68, 68, 0.4); }
        .q-number { font-size: 0.75rem; color: var(--python-blue-light); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .q-text { font-size: 1rem; color: var(--text-heading); margin-bottom: 1rem; line-height: 1.6; }
        .q-text code { background: rgba(74, 222, 128, 0.08); color: var(--house-color); padding: 0.1rem 0.3rem; border-radius: 3px; font-family: 'Consolas', monospace; font-size: 0.9em; }
        .q-options { list-style: none; }
        .q-option { padding: 0.75rem 1rem; margin-bottom: 0.5rem; border: 1px solid rgba(74, 222, 128, 0.1); border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.75rem; }
        .q-option:hover { background: rgba(74, 222, 128, 0.05); border-color: rgba(74, 222, 128, 0.25); }
        .q-option.selected { background: rgba(74, 222, 128, 0.1); border-color: var(--house-color); }
        .q-option.correct-answer { background: rgba(34, 197, 94, 0.15); border-color: var(--success-color); }
        .q-option.wrong-answer { background: rgba(239, 68, 68, 0.1); border-color: var(--error-color); }
        .q-option.disabled { pointer-events: none; opacity: 0.7; }
        .q-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(74, 222, 128, 0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .q-option.selected .q-radio { border-color: var(--house-color); }
        .q-option.selected .q-radio::after { content: ''; width: 8px; height: 8px; background: var(--house-color); border-radius: 50%; }
        .q-explanation { margin-top: 0.75rem; padding: 0.75rem; background: rgba(48, 105, 152, 0.1); border-radius: 6px; font-size: 0.85rem; color: var(--text-secondary); display: none; }
        .q-explanation.show { display: block; }
        .submit-section { text-align: center; margin-top: 2rem; }
        .submit-btn { background: var(--house-color); color: #0a0e1a; padding: 0.75rem 2.5rem; border-radius: 8px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .submit-btn:hover { background: var(--house-color-light); transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .results-panel { background: rgba(14, 22, 40, 0.9); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; text-align: center; margin-top: 2rem; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .results-score.pass { color: var(--success-color); }
        .results-score.fail { color: var(--error-color); }
        .results-text { color: var(--text-secondary); margin-bottom: 1rem; }
        .results-btn { background: linear-gradient(135deg, var(--house-color), var(--house-color-dark)); color: #0a0e1a; padding: 0.75rem 2rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; margin: 0.5rem; }
        .results-btn:hover { transform: translateY(-2px); }
        pre { background: #1a1f2e; border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin: 0.5rem 0; overflow-x: auto; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #d4d4d4; }
        pre code { background: none; color: inherit; padding: 0; }
        @media (max-width: 768px) { .quiz-content { padding: 1rem; } .quiz-header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.5rem; } }
    </style>
</head>
<body>
    <div class="quiz-header">
        <div class="quiz-header-left">
            <a href="../index.html" class="back-btn">&larr; Python Hub</a>
            <span class="quiz-badge">Quiz</span>
        </div>
        <span class="quiz-progress" id="quizProgress">0 / 10 answered</span>
    </div>
    <div class="quiz-content">
        <div class="quiz-title-section">
            <h1>Visual Programming Quiz</h1>
            <p>Turtle graphics, tkinter GUIs, and matplotlib (T4 Modules 01-06) &mdash; 10 questions, 70% to pass</p>
        </div>
        <div id="questionsContainer"></div>
        <div class="submit-section">
            <button class="submit-btn" id="submitBtn" onclick="submitQuiz()" disabled>Submit Quiz</button>
        </div>
        <div class="results-panel" id="resultsPanel">
            <div class="results-score" id="scoreDisplay"></div>
            <div class="results-text" id="resultsText"></div>
            <button class="results-btn" onclick="retryQuiz()">Try Again</button>
            <button class="results-btn" onclick="window.location.href='../index.html'">Back to Hub</button>
        </div>
    </div>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <script src="../progress.js"></script>
    <script>
        const QUIZ_ID = 'quiz-graphics-visual';
        const PASS_SCORE = 70;
        const questions = [
            {
                q: "In Python's <code>turtle</code> module, what does <code>t.penup()</code> do?",
                code: null,
                options: [
                    "Lifts the pen so the turtle moves without drawing",
                    "Increases the pen size",
                    "Resets the pen color to default",
                    "Moves the pen to the top of the canvas"
                ],
                answer: 0,
                explanation: "penup() (or pu()) lifts the pen off the canvas. When the turtle moves after penup(), no line is drawn. Use pendown() (or pd()) to start drawing again."
            },
            {
                q: "What shape does this turtle code draw?",
                code: "import turtle\nt = turtle.Turtle()\nfor _ in range(4):\n    t.forward(100)\n    t.right(90)",
                options: ["A triangle", "A square", "A circle", "A pentagon"],
                answer: 1,
                explanation: "The loop repeats 4 times: move forward 100 pixels, then turn right 90 degrees. Four sides with 90-degree turns creates a square. For a triangle, you'd use range(3) and right(120)."
            },
            {
                q: "In tkinter, which geometry manager places widgets in a grid of rows and columns?",
                code: null,
                options: ["pack()", "place()", "grid()", "layout()"],
                answer: 2,
                explanation: "grid() arranges widgets in a table-like structure using row and column parameters. pack() arranges widgets in blocks, place() uses absolute x/y coordinates, and layout() doesn't exist in tkinter."
            },
            {
                q: "How do you create a button in tkinter that calls a function when clicked?",
                code: "import tkinter as tk\nroot = tk.Tk()\n# Which creates a working button?",
                options: [
                    "tk.Button(root, text='Click', onClick=my_func)",
                    "tk.Button(root, text='Click', command=my_func)",
                    "tk.Button(root, text='Click', action=my_func)",
                    "tk.Button(root, text='Click', callback=my_func)"
                ],
                answer: 1,
                explanation: "In tkinter, the 'command' parameter specifies the callback function. Note: pass the function reference (my_func) without parentheses. Using my_func() would call it immediately instead of on click."
            },
            {
                q: "Which matplotlib function creates a basic line plot?",
                code: "import matplotlib.pyplot as plt\nx = [1, 2, 3, 4]\ny = [10, 20, 25, 30]",
                options: ["plt.draw(x, y)", "plt.plot(x, y)", "plt.line(x, y)", "plt.graph(x, y)"],
                answer: 1,
                explanation: "plt.plot(x, y) creates a line plot connecting the data points. After calling plot(), you typically call plt.show() to display the figure, or plt.savefig() to save it to a file."
            },
            {
                q: "What does <code>plt.subplot(2, 1, 1)</code> specify?",
                code: null,
                options: [
                    "A 2x1 grid of plots, selecting the first subplot",
                    "A plot at position (2, 1) on the canvas",
                    "Two overlapping plots with one visible",
                    "A plot with 2 x-axes and 1 y-axis"
                ],
                answer: 0,
                explanation: "subplot(nrows, ncols, index) creates a grid of subplots. subplot(2, 1, 1) means 2 rows, 1 column, and select the 1st subplot (top). subplot(2, 1, 2) would select the bottom subplot."
            },
            {
                q: "In turtle graphics, what does <code>t.circle(50)</code> draw?",
                code: null,
                options: [
                    "A circle with diameter 50",
                    "A circle with radius 50, drawn counter-clockwise",
                    "A filled circle of radius 50",
                    "A semicircle of radius 50"
                ],
                answer: 1,
                explanation: "turtle.circle(radius) draws a circle with the given radius. Positive radius draws counter-clockwise (to the left of the turtle). Negative radius draws clockwise. It is not filled unless you use begin_fill()/end_fill()."
            },
            {
                q: "Which tkinter widget allows the user to type multi-line text?",
                code: null,
                options: ["tk.Entry", "tk.Text", "tk.Label", "tk.TextArea"],
                answer: 1,
                explanation: "tk.Text is the multi-line text input widget. tk.Entry is for single-line text input. tk.Label displays text but is not editable. tk.TextArea doesn't exist in tkinter."
            },
            {
                q: "How do you add a title and axis labels to a matplotlib plot?",
                code: null,
                options: [
                    "plt.labels('Title', 'X', 'Y')",
                    "plt.title('Title'); plt.xlabel('X'); plt.ylabel('Y')",
                    "plt.set_labels(title='Title', x='X', y='Y')",
                    "plt.annotate(title='Title', xlabel='X', ylabel='Y')"
                ],
                answer: 1,
                explanation: "matplotlib uses separate functions for each label: plt.title() for the chart title, plt.xlabel() for the x-axis label, and plt.ylabel() for the y-axis label. Each accepts a string argument."
            },
            {
                q: "What does <code>turtle.Screen().tracer(0)</code> do?",
                code: null,
                options: [
                    "Hides the turtle cursor",
                    "Turns off animation so drawing happens instantly, requiring manual screen.update() calls",
                    "Traces the turtle's path in a different color",
                    "Sets the animation speed to the fastest setting"
                ],
                answer: 1,
                explanation: "tracer(0) disables automatic screen updates, so all drawing happens in memory without animation. You must call screen.update() manually to render the result. This is much faster for complex drawings."
            }
        ];

        let answers = {};

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, i) => {
                let html = '<div class="question-card" id="qcard' + i + '">' +
                    '<div class="q-number">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
                    '<div class="q-text">' + q.q + '</div>';
                if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
                html += '<ul class="q-options">';
                q.options.forEach((opt, j) => {
                    html += '<li class="q-option" data-q="' + i + '" data-opt="' + j + '" onclick="selectOption(' + i + ', ' + j + ')">' +
                        '<div class="q-radio"></div>' +
                        '<span>' + opt + '</span>' +
                        '</li>';
                });
                html += '</ul><div class="q-explanation" id="explanation' + i + '">' + q.explanation + '</div></div>';
                container.innerHTML += html;
            });
        }

        function selectOption(qIndex, optIndex) {
            const card = document.getElementById('qcard' + qIndex);
            if (card.classList.contains('answered')) return;
            card.querySelectorAll('.q-option').forEach(o => o.classList.remove('selected'));
            card.querySelector('[data-opt="' + optIndex + '"]').classList.add('selected');
            answers[qIndex] = optIndex;
            document.getElementById('quizProgress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
            document.getElementById('submitBtn').disabled = Object.keys(answers).length < questions.length;
        }

        function submitQuiz() {
            let correct = 0;
            questions.forEach((q, i) => {
                const card = document.getElementById('qcard' + i);
                card.classList.add('answered');
                card.querySelectorAll('.q-option').forEach(o => o.classList.add('disabled'));
                const selected = answers[i];
                if (selected === q.answer) {
                    correct++;
                    card.classList.add('correct');
                    card.querySelector('[data-opt="' + selected + '"]').classList.add('correct-answer');
                } else {
                    card.classList.add('incorrect');
                    if (selected !== undefined) card.querySelector('[data-opt="' + selected + '"]').classList.add('wrong-answer');
                    card.querySelector('[data-opt="' + q.answer + '"]').classList.add('correct-answer');
                }
                document.getElementById('explanation' + i).classList.add('show');
            });
            const score = Math.round((correct / questions.length) * 100);
            const passed = score >= PASS_SCORE;
            document.getElementById('scoreDisplay').textContent = score + '%';
            document.getElementById('scoreDisplay').className = 'results-score ' + (passed ? 'pass' : 'fail');
            document.getElementById('resultsText').textContent = passed
                ? 'You passed! ' + correct + '/' + questions.length + ' correct.'
                : 'You need ' + PASS_SCORE + '% to pass. You got ' + correct + '/' + questions.length + '. Review and try again.';
            document.getElementById('resultsPanel').classList.add('show');
            document.getElementById('submitBtn').style.display = 'none';
            if (passed) {
                PYHProgress.markQuizComplete(QUIZ_ID, score);
                if (typeof ModuleProgress !== 'undefined') ModuleProgress.complete('code', 'pyh-' + QUIZ_ID);
            }
        }

        function retryQuiz() {
            answers = {};
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered', 'correct', 'incorrect');
                c.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
                });
                c.querySelectorAll('.q-explanation').forEach(e => e.classList.remove('show'));
            });
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('submitBtn').style.display = '';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('quizProgress').textContent = '0 / ' + questions.length + ' answered';
        }

        renderQuestions();
    </script>
</body>
</html>
