<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphics &amp; Games Final - Python Hub | Hexworth Prime</title>
    <style>
        :root {
            --house-color: #10b981;
            --house-color-dark: #059669;
            --house-color-light: #34d399;
            --python-blue: #306998;
            --python-blue-light: #4b8bbe;
            --success-color: #059669;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #c8d6e5;
            --text-secondary: #7a8b9a;
            --text-heading: #e2e8f0;
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1729;
            --border-color: rgba(16, 185, 129, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.7; min-height: 100vh; }
        .quiz-header { background: rgba(10, 14, 26, 0.95); padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; backdrop-filter: blur(10px); }
        .quiz-header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .back-btn:hover { color: var(--house-color); }
        .quiz-badge { background: #a855f7; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .quiz-progress { color: var(--text-secondary); font-size: 0.85rem; }
        .quiz-content { max-width: 800px; margin: 0 auto; padding: 2rem 2rem 4rem; }
        .quiz-title-section { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .quiz-title-section h1 { font-size: 1.8rem; color: var(--text-heading); margin-bottom: 0.5rem; }
        .quiz-title-section p { color: var(--text-secondary); }
        .question-card { background: rgba(14, 22, 40, 0.85); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .question-card.answered { border-color: rgba(16, 185, 129, 0.2); }
        .question-card.correct { border-color: rgba(5, 150, 105, 0.4); }
        .question-card.incorrect { border-color: rgba(239, 68, 68, 0.4); }
        .q-number { font-size: 0.75rem; color: var(--python-blue-light); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .q-text { font-size: 1rem; color: var(--text-heading); margin-bottom: 1rem; line-height: 1.6; }
        .q-text code { background: rgba(16, 185, 129, 0.08); color: var(--house-color); padding: 0.1rem 0.3rem; border-radius: 3px; font-family: 'Consolas', monospace; font-size: 0.9em; }
        .q-options { list-style: none; }
        .q-option { padding: 0.75rem 1rem; margin-bottom: 0.5rem; border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.75rem; }
        .q-option:hover { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.25); }
        .q-option.selected { background: rgba(16, 185, 129, 0.1); border-color: var(--house-color); }
        .q-option.correct-answer { background: rgba(5, 150, 105, 0.15); border-color: var(--success-color); }
        .q-option.wrong-answer { background: rgba(239, 68, 68, 0.1); border-color: var(--error-color); }
        .q-option.disabled { pointer-events: none; opacity: 0.7; }
        .q-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(16, 185, 129, 0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .q-option.selected .q-radio { border-color: var(--house-color); }
        .q-option.selected .q-radio::after { content: ''; width: 8px; height: 8px; background: var(--house-color); border-radius: 50%; }
        .q-explanation { margin-top: 0.75rem; padding: 0.75rem; background: rgba(48, 105, 152, 0.1); border-radius: 6px; font-size: 0.85rem; color: var(--text-secondary); display: none; }
        .q-explanation.show { display: block; }
        .submit-section { text-align: center; margin-top: 2rem; }
        .submit-btn { background: var(--house-color); color: #0a0e1a; padding: 0.75rem 2.5rem; border-radius: 8px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .submit-btn:hover { background: var(--house-color-light); transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .results-panel { background: rgba(14, 22, 40, 0.9); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; text-align: center; margin-top: 2rem; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .results-score.pass { color: var(--success-color); }
        .results-score.fail { color: var(--error-color); }
        .results-text { color: var(--text-secondary); margin-bottom: 1rem; }
        .results-btn { background: linear-gradient(135deg, var(--house-color), var(--house-color-dark)); color: #0a0e1a; padding: 0.75rem 2rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; margin: 0.5rem; }
        .results-btn:hover { transform: translateY(-2px); }
        pre { background: #1a1f2e; border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin: 0.5rem 0; overflow-x: auto; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #d4d4d4; }
        pre code { background: none; color: inherit; padding: 0; }
        @media (max-width: 768px) { .quiz-content { padding: 1rem; } .quiz-header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.5rem; } }
    </style>
</head>
<body>
    <div class="quiz-header">
        <div class="quiz-header-left">
            <a href="../index.html" class="back-btn">&larr; Python Hub</a>
            <span class="quiz-badge">Quiz</span>
        </div>
        <span class="quiz-progress" id="quizProgress">0 / 10 answered</span>
    </div>
    <div class="quiz-content">
        <div class="quiz-title-section">
            <h1>Graphics &amp; Games Final</h1>
            <p>Comprehensive assessment: turtle, tkinter, matplotlib, Pillow, and pygame (all T4) &mdash; 10 questions, 70% to pass</p>
        </div>
        <div id="questionsContainer"></div>
        <div class="submit-section">
            <button class="submit-btn" id="submitBtn" onclick="submitQuiz()" disabled>Submit Quiz</button>
        </div>
        <div class="results-panel" id="resultsPanel">
            <div class="results-score" id="scoreDisplay"></div>
            <div class="results-text" id="resultsText"></div>
            <button class="results-btn" onclick="retryQuiz()">Try Again</button>
            <button class="results-btn" onclick="window.location.href='../index.html'">Back to Hub</button>
        </div>
    </div>
    <script src="../../../../../components/ModuleProgress.js"></script>
    <script src="../progress.js"></script>
    <script>
        const QUIZ_ID = 'quiz-graphics-final';
        const PASS_SCORE = 70;
        const questions = [
            {
                q: "In pygame, what is the purpose of the game loop's <code>pygame.event.get()</code> call?",
                code: "while running:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            running = False",
                options: [
                    "It draws all sprites to the screen",
                    "It retrieves and removes all pending events from the event queue",
                    "It updates the game clock",
                    "It checks for keyboard input only"
                ],
                answer: 1,
                explanation: "pygame.event.get() retrieves all pending events (keyboard, mouse, window, etc.) from the event queue and removes them. If you don't call it regularly, the OS may consider the application unresponsive."
            },
            {
                q: "How does Pillow open and resize an image?",
                code: "from PIL import Image\nimg = Image.open('photo.jpg')\n# Resize to 800x600",
                options: [
                    "img.scale(800, 600)",
                    "img.resize((800, 600))",
                    "img.set_size(800, 600)",
                    "Image.resize('photo.jpg', 800, 600)"
                ],
                answer: 1,
                explanation: "Image.resize() takes a tuple of (width, height) and returns a new resized image. Note the double parentheses: resize((800, 600)). The original image is not modified; resize returns a new Image object."
            },
            {
                q: "What does <code>pygame.display.flip()</code> do?",
                code: null,
                options: [
                    "Rotates the display 180 degrees",
                    "Updates the entire display surface to the screen",
                    "Flips the display horizontally",
                    "Switches between windowed and fullscreen mode"
                ],
                answer: 1,
                explanation: "pygame.display.flip() updates the full display surface to the screen, making all drawn content visible. For partial updates, use pygame.display.update(rect_list) instead."
            },
            {
                q: "In matplotlib, how do you create a bar chart?",
                code: "import matplotlib.pyplot as plt\ncategories = ['A', 'B', 'C']\nvalues = [25, 40, 30]",
                options: [
                    "plt.bar(categories, values)",
                    "plt.bars(categories, values)",
                    "plt.barchart(categories, values)",
                    "plt.histogram(categories, values)"
                ],
                answer: 0,
                explanation: "plt.bar(x, height) creates a vertical bar chart. For horizontal bars, use plt.barh(). plt.hist() creates histograms from raw data, which is different from a bar chart of pre-computed values."
            },
            {
                q: "What is the tkinter <code>StringVar</code> used for?",
                code: "import tkinter as tk\nroot = tk.Tk()\nname_var = tk.StringVar()\nentry = tk.Entry(root, textvariable=name_var)",
                options: [
                    "Storing constant string values",
                    "A special variable that automatically updates connected widgets when its value changes",
                    "Converting integers to strings for display",
                    "Validating that input contains only letters"
                ],
                answer: 1,
                explanation: "StringVar is a tkinter variable class that provides change-tracking. When connected to widgets via textvariable, changes to the StringVar automatically update the widget display, and vice versa. This enables reactive UI patterns."
            },
            {
                q: "Which Pillow method applies a blur filter to an image?",
                code: "from PIL import Image, ImageFilter",
                options: [
                    "img.blur(radius=5)",
                    "img.filter(ImageFilter.BLUR)",
                    "ImageFilter.apply(img, 'blur')",
                    "img.smooth(5)"
                ],
                answer: 1,
                explanation: "img.filter() applies a predefined filter from the ImageFilter module. Common filters include BLUR, CONTOUR, DETAIL, EDGE_ENHANCE, SHARPEN, and SMOOTH. For a Gaussian blur with a custom radius, use ImageFilter.GaussianBlur(radius)."
            },
            {
                q: "In pygame, how do you limit the game loop to 60 frames per second?",
                code: "clock = pygame.time.Clock()\nwhile running:\n    # ... game logic ...",
                options: [
                    "pygame.time.delay(60)",
                    "clock.tick(60)",
                    "pygame.fps(60)",
                    "clock.set_fps(60)"
                ],
                answer: 1,
                explanation: "clock.tick(60) limits the loop to at most 60 iterations per second by adding a delay if the frame rendered too quickly. It also returns the time elapsed since the last call (delta time), useful for smooth movement."
            },
            {
                q: "How do you draw a filled rectangle on a pygame surface?",
                code: "screen = pygame.display.set_mode((800, 600))",
                options: [
                    "screen.rect(color, (x, y, w, h))",
                    "pygame.draw.rect(screen, color, (x, y, w, h))",
                    "pygame.draw.rectangle(screen, (x, y), (w, h), color)",
                    "screen.fill_rect(x, y, w, h, color)"
                ],
                answer: 1,
                explanation: "pygame.draw.rect(surface, color, rect) draws a rectangle. The rect argument is (x, y, width, height). By default it draws filled; pass a width parameter > 0 for an outline only: pygame.draw.rect(screen, color, rect, width=2)."
            },
            {
                q: "What does matplotlib's <code>plt.savefig('chart.png', dpi=150)</code> do?",
                code: null,
                options: [
                    "Saves the figure as a 150-pixel-wide image",
                    "Saves the current figure to a PNG file at 150 dots per inch resolution",
                    "Saves only 150 data points to the image",
                    "Creates 150 copies of the chart"
                ],
                answer: 1,
                explanation: "plt.savefig() saves the current figure to a file. The dpi parameter controls resolution (dots per inch). Higher dpi means a larger, sharper image. The default is typically 100 dpi. The format is inferred from the filename extension."
            },
            {
                q: "What is the correct order of a basic pygame program structure?",
                code: null,
                options: [
                    "Game loop, Initialize, Load assets, Quit",
                    "Initialize, Load assets, Game loop (events/update/draw), Quit",
                    "Load assets, Game loop, Initialize, Draw",
                    "Draw, Handle events, Initialize, Quit"
                ],
                answer: 1,
                explanation: "The standard pygame structure is: (1) Initialize pygame, (2) Load assets and set up variables, (3) Run the game loop (handle events, update state, draw to screen, flip display, tick clock), (4) Clean up and quit."
            }
        ];

        let answers = {};

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, i) => {
                let html = '<div class="question-card" id="qcard' + i + '">' +
                    '<div class="q-number">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
                    '<div class="q-text">' + q.q + '</div>';
                if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
                html += '<ul class="q-options">';
                q.options.forEach((opt, j) => {
                    html += '<li class="q-option" data-q="' + i + '" data-opt="' + j + '" onclick="selectOption(' + i + ', ' + j + ')">' +
                        '<div class="q-radio"></div>' +
                        '<span>' + opt + '</span>' +
                        '</li>';
                });
                html += '</ul><div class="q-explanation" id="explanation' + i + '">' + q.explanation + '</div></div>';
                container.innerHTML += html;
            });
        }

        function selectOption(qIndex, optIndex) {
            const card = document.getElementById('qcard' + qIndex);
            if (card.classList.contains('answered')) return;
            card.querySelectorAll('.q-option').forEach(o => o.classList.remove('selected'));
            card.querySelector('[data-opt="' + optIndex + '"]').classList.add('selected');
            answers[qIndex] = optIndex;
            document.getElementById('quizProgress').textContent = Object.keys(answers).length + ' / ' + questions.length + ' answered';
            document.getElementById('submitBtn').disabled = Object.keys(answers).length < questions.length;
        }

        function submitQuiz() {
            let correct = 0;
            questions.forEach((q, i) => {
                const card = document.getElementById('qcard' + i);
                card.classList.add('answered');
                card.querySelectorAll('.q-option').forEach(o => o.classList.add('disabled'));
                const selected = answers[i];
                if (selected === q.answer) {
                    correct++;
                    card.classList.add('correct');
                    card.querySelector('[data-opt="' + selected + '"]').classList.add('correct-answer');
                } else {
                    card.classList.add('incorrect');
                    if (selected !== undefined) card.querySelector('[data-opt="' + selected + '"]').classList.add('wrong-answer');
                    card.querySelector('[data-opt="' + q.answer + '"]').classList.add('correct-answer');
                }
                document.getElementById('explanation' + i).classList.add('show');
            });
            const score = Math.round((correct / questions.length) * 100);
            const passed = score >= PASS_SCORE;
            document.getElementById('scoreDisplay').textContent = score + '%';
            document.getElementById('scoreDisplay').className = 'results-score ' + (passed ? 'pass' : 'fail');
            document.getElementById('resultsText').textContent = passed
                ? 'You passed! ' + correct + '/' + questions.length + ' correct.'
                : 'You need ' + PASS_SCORE + '% to pass. You got ' + correct + '/' + questions.length + '. Review and try again.';
            document.getElementById('resultsPanel').classList.add('show');
            document.getElementById('submitBtn').style.display = 'none';
            if (passed) {
                PYHProgress.markQuizComplete(QUIZ_ID, score);
                if (typeof ModuleProgress !== 'undefined') ModuleProgress.complete('code', 'pyh-' + QUIZ_ID);
            }
        }

        function retryQuiz() {
            answers = {};
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered', 'correct', 'incorrect');
                c.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
                });
                c.querySelectorAll('.q-explanation').forEach(e => e.classList.remove('show'));
            });
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('submitBtn').style.display = '';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('quizProgress').textContent = '0 / ' + questions.length + ' answered';
        }

        renderQuestions();
    </script>
</body>
</html>
