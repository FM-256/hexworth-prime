    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --forge: #8b5cf6; --forge-dim: rgba(139, 92, 246, 0.12); --forge-glow: rgba(139, 92, 246, 0.3);
            --bg: #0a0a0f; --bg-card: #12121a; --bg-code: #0d1117;
            --text: #e0e0e0; --text-dim: #8b949e; --border: rgba(255,255,255,0.08);
            --blue: #3b82f6; --orange: #f59e0b; --red: #ef4444; --green: #10b981;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; line-height: 1.7; }

        /* Header */
        .header {
            position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background: rgba(10,10,15,0.94); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139,92,246,0.2);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-badge { font-size: 11px; padding: 3px 10px; border-radius: 4px; background: var(--forge-dim); color: var(--forge); font-weight: 700; letter-spacing: 1px; }
        .header h1 { font-size: 15px; font-weight: 600; }
        .back-link { font-size: 13px; color: var(--forge); font-weight: 600; text-decoration: none; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(139,92,246,0.25); transition: all 0.2s; }
        .back-link:hover { background: var(--forge-dim); }

        /* Content */
        .content { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }

        /* Hero */
        .hero { text-align: center; padding: 40px 0 32px; }
        .hero-icon { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 16px; }
        .hero h2 { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .hero-sub { font-size: 15px; color: var(--text-dim); max-width: 550px; margin: 0 auto; }
        .hero-meta { display: flex; justify-content: center; gap: 24px; margin-top: 20px; font-size: 12px; color: var(--text-dim); }
        .hero-meta span { display: flex; align-items: center; gap: 6px; }

        /* Quiz Progress */
        .quiz-progress-bar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 32px; }
        .quiz-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-progress-header span { font-size: 13px; color: var(--text-dim); }
        .quiz-progress-header strong { color: var(--forge); }
        .progress-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b5cf6, #7c3aed); border-radius: 3px; transition: width 0.4s ease; }

        /* Question Cards */
        .question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; transition: border-color 0.3s; }
        .question-card.answered { pointer-events: none; }
        .question-card.correct { border-color: rgba(16,185,129,0.4); }
        .question-card.incorrect { border-color: rgba(239,68,68,0.4); }
        .q-number { font-size: 11px; color: var(--forge); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .q-text { font-size: 15px; color: #fff; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
        .q-text code { background: rgba(139,92,246,0.1); color: var(--forge); padding: 2px 6px; border-radius: 3px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 0.88em; }

        /* Options */
        .q-options { list-style: none; }
        .q-option {
            padding: 12px 16px; margin-bottom: 8px; border: 1px solid rgba(139,92,246,0.1); border-radius: 8px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-dim);
        }
        .q-option:hover { background: rgba(139,92,246,0.06); border-color: rgba(139,92,246,0.3); }
        .q-option.selected { background: rgba(139,92,246,0.1); border-color: var(--forge); color: #fff; }
        .q-option.correct-answer { background: rgba(16,185,129,0.12); border-color: var(--green); color: #fff; }
        .q-option.wrong-answer { background: rgba(239,68,68,0.1); border-color: var(--red); color: #fff; }
        .q-option.disabled { pointer-events: none; opacity: 0.7; }
        .q-option.correct-answer.disabled { opacity: 1; }
        .q-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(139,92,246,0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s; }
        .q-option.selected .q-radio { border-color: var(--forge); }
        .q-option.selected .q-radio::after { content: ''; width: 8px; height: 8px; background: var(--forge); border-radius: 50%; }
        .q-option.correct-answer .q-radio { border-color: var(--green); }
        .q-option.correct-answer .q-radio::after { content: ''; width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
        .q-option.wrong-answer .q-radio { border-color: var(--red); }
        .q-option.wrong-answer .q-radio::after { content: ''; width: 8px; height: 8px; background: var(--red); border-radius: 50%; }

        /* Explanation */
        .q-explanation { margin-top: 12px; padding: 12px 16px; background: rgba(139,92,246,0.06); border-left: 3px solid var(--forge); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--text-dim); line-height: 1.6; display: none; }
        .q-explanation.show { display: block; }

        /* Submit Button */
        .submit-section { text-align: center; margin-top: 32px; }
        .submit-btn {
            padding: 14px 40px; border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--forge-glow); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Results Panel */
        .results-panel {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 32px; text-align: center; margin-top: 32px; display: none;
        }
        .results-panel.show { display: block; }
        .results-icon { width: 48px; height: 48px; margin-bottom: 12px; }
        .results-score { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
        .results-score.pass { color: var(--green); }
        .results-score.fail { color: var(--red); }
        .results-label { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
        .results-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .results-btn {
            padding: 12px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .results-btn:hover { transform: translateY(-2px); }
        .results-btn-primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
        .results-btn-secondary { background: rgba(139,92,246,0.12); color: var(--forge); border: 1px solid rgba(139,92,246,0.25); }

        /* Responsive */
        @media (max-width: 700px) {
            .hero h2 { font-size: 24px; }
            .hero-meta { flex-wrap: wrap; gap: 12px; }
            .question-card { padding: 16px; }
            .q-text { font-size: 14px; }
            .q-option { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>

    <script>
        const PASS_SCORE = 70;
        const questions = [
            {
                q: "What is the primary purpose of a CI (Continuous Integration) pipeline?",
                options: [
                    "Deploy code directly to production on every commit",
                    "Automatically merge all feature branches into main",
                    "Integrate code changes frequently, running automated builds and tests to catch issues early",
                    "Replace manual code reviews with automated approval"
                ],
                answer: 2,
                explanation: "Continuous Integration is the practice of frequently merging code changes into a shared repository, with each integration verified by an automated build and test suite. The goal is to detect integration issues early, not to skip reviews or deploy directly to production."
            },
            {
                q: "In a typical CI/CD pipeline, what is the correct order of stages?",
                options: [
                    "Deploy &rarr; Build &rarr; Test &rarr; Release",
                    "Build &rarr; Test &rarr; Release &rarr; Deploy",
                    "Test &rarr; Build &rarr; Deploy &rarr; Monitor",
                    "Source &rarr; Release &rarr; Build &rarr; Test"
                ],
                answer: 1,
                explanation: "A standard pipeline flows: Build (compile/package the code) &rarr; Test (run unit, integration, and quality checks) &rarr; Release (create a versioned artifact) &rarr; Deploy (push to target environment). Deploying before testing defeats the purpose of automation."
            },
            {
                q: "Which GitHub Actions keyword defines when a workflow should run?",
                options: [
                    "<code>jobs:</code>",
                    "<code>steps:</code>",
                    "<code>on:</code>",
                    "<code>runs-on:</code>"
                ],
                answer: 2,
                explanation: "The <code>on:</code> key specifies the event triggers for a workflow, such as <code>on: push</code>, <code>on: pull_request</code>, or <code>on: schedule</code>. <code>jobs:</code> defines the work units, <code>steps:</code> defines individual tasks within a job, and <code>runs-on:</code> specifies the runner environment."
            },
            {
                q: "What does a GitHub Actions <code>matrix</code> strategy allow you to do?",
                options: [
                    "Run a workflow only on the default branch",
                    "Run the same job across multiple combinations of variables like OS, language version, or Node version",
                    "Define a sequence of dependent jobs that run one after another",
                    "Cache dependencies between workflow runs"
                ],
                answer: 1,
                explanation: "A matrix strategy automatically creates multiple job instances from variable combinations. For example, <code>matrix: { os: [ubuntu, windows], node: [18, 20] }</code> spawns 4 parallel jobs testing every OS/Node combination. This is critical for cross-platform and multi-version testing."
            },
            {
                q: "In a blue/green deployment, what does the term \"blue\" and \"green\" refer to?",
                options: [
                    "The staging and development environments",
                    "Two identical production environments where one serves live traffic and the other hosts the new version",
                    "The build and test stages of the pipeline",
                    "Two separate Git branches used for releases"
                ],
                answer: 1,
                explanation: "Blue/green deployment maintains two identical production environments. The live environment (e.g., blue) serves all traffic while the new version is deployed to the idle environment (green). After validation, traffic is switched from blue to green. If something goes wrong, you switch back instantly &mdash; zero-downtime rollback."
            },
            {
                q: "How does a canary deployment differ from a blue/green deployment?",
                options: [
                    "Canary uses two full environments; blue/green uses partial traffic",
                    "Canary gradually shifts traffic to the new version (e.g., 5% &rarr; 25% &rarr; 100%) while monitoring for errors",
                    "Canary deploys to development first; blue/green deploys to staging",
                    "They are different names for the same deployment strategy"
                ],
                answer: 1,
                explanation: "Canary deployments route a small percentage of production traffic to the new version first. If metrics look healthy (error rate, latency, etc.), traffic is progressively increased. If problems appear, only a small fraction of users are affected. Blue/green is all-or-nothing switching between two full environments."
            },
            {
                q: "What language does Terraform use for configuration files?",
                options: [
                    "YAML",
                    "JSON only",
                    "HCL (HashiCorp Configuration Language)",
                    "Python"
                ],
                answer: 2,
                explanation: "Terraform uses HCL (HashiCorp Configuration Language), a declarative language designed specifically for defining infrastructure. HCL files use the <code>.tf</code> extension. While Terraform also accepts JSON (<code>.tf.json</code>), HCL is the primary and recommended format due to its readability and support for comments."
            },
            {
                q: "What does <code>terraform plan</code> do?",
                options: [
                    "Applies all changes to the infrastructure immediately",
                    "Initializes the Terraform working directory and downloads providers",
                    "Creates an execution plan showing what changes Terraform will make without applying them",
                    "Destroys all managed infrastructure resources"
                ],
                answer: 2,
                explanation: "<code>terraform plan</code> is a dry-run command. It compares the desired state (your .tf files) with the current state (terraform.tfstate) and shows what will be created, modified, or destroyed &mdash; without making any actual changes. Always run <code>plan</code> before <code>apply</code> to review changes."
            },
            {
                q: "What is Terraform state, and why is it important?",
                options: [
                    "A log of all Terraform commands that have been executed",
                    "A mapping between your configuration and the real-world resources Terraform manages, used to track what exists",
                    "A backup copy of your .tf configuration files",
                    "A list of all available Terraform providers and their versions"
                ],
                answer: 1,
                explanation: "Terraform state (stored in <code>terraform.tfstate</code>) is a JSON file that maps every resource in your configuration to its real-world counterpart. It tracks resource IDs, attributes, and dependencies. Without state, Terraform would have no way to know what already exists and would try to recreate everything on each apply."
            },
            {
                q: "Why should Terraform state be stored in a remote backend (e.g., S3, Azure Blob) instead of locally?",
                options: [
                    "Remote backends make Terraform run faster",
                    "Local state files cannot be read by Terraform after the first apply",
                    "Remote backends enable team collaboration, state locking to prevent concurrent modifications, and disaster recovery",
                    "Terraform only supports remote backends in production"
                ],
                answer: 2,
                explanation: "Remote backends solve three critical problems: (1) shared access so the whole team works from the same state, (2) state locking so two people cannot run <code>apply</code> simultaneously and corrupt state, and (3) durability so state is not lost if someone deletes their local machine. DynamoDB is commonly used for lock management with S3."
            },
            {
                q: "What is the difference between declarative and imperative Infrastructure as Code?",
                options: [
                    "Declarative IaC runs faster than imperative IaC",
                    "Declarative describes the desired end state and the tool figures out how to get there; imperative specifies the exact sequence of steps to execute",
                    "Imperative IaC is always more secure than declarative IaC",
                    "Declarative uses scripting languages; imperative uses configuration files"
                ],
                answer: 1,
                explanation: "Declarative IaC (Terraform, CloudFormation) says \"I want 3 servers with 8GB RAM\" and the tool determines the actions needed. Imperative IaC (Ansible playbooks, Bash scripts) says \"create server A, then configure its memory, then create server B...\" step by step. Declarative is generally preferred for infrastructure because it is idempotent by design."
            },
            {
                q: "What does \"idempotency\" mean in the context of IaC?",
                options: [
                    "The infrastructure can only be deployed once and never changed",
                    "Running the same configuration multiple times produces the same result without unintended side effects",
                    "All infrastructure changes must be approved by two people",
                    "Infrastructure code must be written in a functional programming language"
                ],
                answer: 1,
                explanation: "Idempotency means that applying the same configuration repeatedly always converges to the same state. If 3 servers exist and the config says 3, no changes are made. If one was manually deleted, re-applying creates just the missing one. This predictability is a cornerstone of reliable IaC."
            },
            {
                q: "What is \"configuration drift\" in IaC?",
                options: [
                    "When configuration files become too large to manage",
                    "When the actual state of infrastructure diverges from what is defined in code, often due to manual changes",
                    "When two team members edit the same Terraform file simultaneously",
                    "When Terraform providers release breaking API changes"
                ],
                answer: 1,
                explanation: "Configuration drift occurs when someone makes a manual change (e.g., modifying a security group rule in the AWS console) that is not reflected in the IaC source. The infrastructure no longer matches the code, making the code an unreliable source of truth. Drift detection and regular <code>terraform plan</code> checks help catch this."
            },
            {
                q: "How do GitHub Actions secrets work, and why are they important?",
                options: [
                    "Secrets are stored in plain text in the workflow YAML file",
                    "Secrets are encrypted environment variables stored at the repository or organization level, masked in logs, and only exposed to workflows at runtime",
                    "Secrets can only be used in manual workflow dispatches",
                    "Secrets are stored in a <code>.env</code> file committed to the repository"
                ],
                answer: 1,
                explanation: "GitHub encrypts secrets at rest and only decrypts them for workflow jobs that reference them via <code>${{ secrets.MY_SECRET }}</code>. Secrets are masked in log output (replaced with ***) and cannot be read by forked repository pull requests by default. Never hardcode credentials in workflow files."
            },
            {
                q: "What is OIDC (OpenID Connect) authentication in the context of CI/CD pipelines, and why is it preferred over static secrets?",
                options: [
                    "OIDC is a VPN protocol for securing pipeline network traffic",
                    "OIDC lets the CI runner request short-lived tokens from a cloud provider using a trust relationship, eliminating the need to store long-lived credentials",
                    "OIDC encrypts all artifacts produced by the pipeline",
                    "OIDC replaces SSH keys for Git operations only"
                ],
                answer: 1,
                explanation: "With OIDC, your CI provider (e.g., GitHub Actions) proves its identity to a cloud provider (e.g., AWS) through a federated trust relationship. The cloud provider issues a short-lived, scoped token. No static access keys need to be stored as secrets, reducing the blast radius if a secret leaks and eliminating key rotation burden."
            },
            {
                q: "What is a \"quality gate\" in a CI pipeline?",
                options: [
                    "A firewall rule that restricts who can trigger the pipeline",
                    "A set of conditions (code coverage threshold, zero critical vulnerabilities, passing tests) that must be met before code can proceed to the next stage",
                    "A manual approval step required by a project manager",
                    "A Git branch protection rule that prevents force pushes"
                ],
                answer: 1,
                explanation: "Quality gates are automated checkpoints that enforce minimum standards. If unit test coverage drops below 80%, or SAST finds a critical vulnerability, or linting fails, the pipeline blocks the merge. This shifts quality enforcement left, catching problems before they reach production rather than after."
            },
            {
                q: "What is the difference between SAST and DAST in pipeline security?",
                options: [
                    "SAST scans running applications; DAST analyzes source code",
                    "SAST (Static Application Security Testing) analyzes source code without executing it; DAST (Dynamic Application Security Testing) tests the running application",
                    "SAST is for frontend code; DAST is for backend code",
                    "SAST and DAST are two names for the same process"
                ],
                answer: 1,
                explanation: "SAST scans source code, bytecode, or binaries to find vulnerabilities like SQL injection patterns, hardcoded secrets, or insecure functions &mdash; without running the application. DAST sends requests to a running application to find runtime vulnerabilities like XSS, authentication flaws, or misconfigurations. Both are complementary and should be used together."
            },
            {
                q: "What is the purpose of Terraform modules?",
                options: [
                    "To run Terraform in parallel across multiple cloud providers",
                    "To encrypt sensitive values in Terraform state",
                    "To create reusable, composable, and testable packages of infrastructure configuration",
                    "To automatically import existing cloud resources into Terraform"
                ],
                answer: 2,
                explanation: "Terraform modules are self-contained packages of Terraform configuration that encapsulate a logical set of resources (e.g., a VPC module, a Kubernetes cluster module). They accept input variables, produce outputs, and can be versioned and shared via registries. Modules promote DRY principles and standardization across teams."
            },
            {
                q: "In a rolling deployment strategy, what happens to application instances?",
                options: [
                    "All instances are taken offline simultaneously, updated, and brought back online",
                    "Instances are updated one at a time (or in small batches), keeping the service available throughout the process",
                    "A completely new set of instances is created alongside the old ones",
                    "Only the database instances are updated; application instances remain unchanged"
                ],
                answer: 1,
                explanation: "Rolling deployments update instances incrementally. If you have 10 servers, the deployment might update 2 at a time: take 2 out of the load balancer, update them, verify health, add them back, then move to the next batch. The service stays available but briefly runs mixed versions. Rollback requires re-deploying the old version in the same rolling fashion."
            },
            {
                q: "What is the purpose of signing CI/CD artifacts (e.g., container images, binaries)?",
                options: [
                    "To compress artifacts for faster download",
                    "To prove the artifact was produced by a trusted pipeline and has not been tampered with since it was built",
                    "To encrypt the artifact so only authorized users can deploy it",
                    "To track which developer wrote the code inside the artifact"
                ],
                answer: 1,
                explanation: "Artifact signing uses cryptographic signatures to establish provenance (who built it) and integrity (it has not been modified). Tools like Sigstore/cosign sign container images so that deployment systems can verify an image came from your CI pipeline and was not injected by an attacker. This is a supply chain security measure that prevents deploying compromised artifacts."
            }
        ];

        let answers = {};

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            questions.forEach((q, i) => {
                html += '<div class="question-card" id="qcard' + i + '">' +
                    '<div class="q-number">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
                    '<div class="q-text">' + q.q + '</div>' +
                    '<ul class="q-options">';
                q.options.forEach((opt, j) => {
                    html += '<li class="q-option" data-q="' + i + '" data-opt="' + j + '" onclick="selectOption(' + i + ', ' + j + ')">' +
                        '<div class="q-radio"></div>' +
                        '<span>' + opt + '</span>' +
                        '</li>';
                });
                html += '</ul>' +
                    '<div class="q-explanation" id="explanation' + i + '">' + q.explanation + '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function selectOption(qIndex, optIndex) {
            const card = document.getElementById('qcard' + qIndex);
            if (card.classList.contains('answered')) return;
            card.querySelectorAll('.q-option').forEach(function(o) { o.classList.remove('selected'); });
            card.querySelector('[data-opt="' + optIndex + '"]').classList.add('selected');
            answers[qIndex] = optIndex;
            const count = Object.keys(answers).length;
            document.getElementById('progressText').textContent = count + ' / ' + questions.length + ' answered';
            document.getElementById('progressFill').style.width = Math.round((count / questions.length) * 100) + '%';
            document.getElementById('submitBtn').disabled = count < questions.length;
        }

        function submitQuiz() {
            let correct = 0;
            questions.forEach(function(q, i) {
                const card = document.getElementById('qcard' + i);
                card.classList.add('answered');
                card.querySelectorAll('.q-option').forEach(function(o) { o.classList.add('disabled'); });
                const selected = answers[i];
                if (selected === q.answer) {
                    correct++;
                    card.classList.add('correct');
                    card.querySelector('[data-opt="' + selected + '"]').classList.add('correct-answer');
                } else {
                    card.classList.add('incorrect');
                    if (selected !== undefined) {
                        card.querySelector('[data-opt="' + selected + '"]').classList.add('wrong-answer');
                    }
                    card.querySelector('[data-opt="' + q.answer + '"]').classList.add('correct-answer');
                }
                document.getElementById('explanation' + i).classList.add('show');
            });

            const score = Math.round((correct / questions.length) * 100);
            const passed = score >= PASS_SCORE;

            document.getElementById('scoreDisplay').textContent = score + '%';
            document.getElementById('scoreDisplay').className = 'results-score ' + (passed ? 'pass' : 'fail');
            document.getElementById('resultsText').textContent = passed
                ? 'You passed! ' + correct + '/' + questions.length + ' correct.'
                : 'You need ' + PASS_SCORE + '% to pass. You scored ' + correct + '/' + questions.length + '. Review the explanations and try again.';
            document.getElementById('resultsPanel').classList.add('show');
            document.getElementById('submitBtn').style.display = 'none';

            if (passed) {
                // Update Forge progress
                try {
                    var progress = JSON.parse(localStorage.getItem('hexworth_forge_progress') || '{}');
                    progress['do-27'] = Date.now();
                    localStorage.setItem('hexworth_forge_progress', JSON.stringify(progress));
                } catch(e) {}

                // Report via ModuleProgress
                if (typeof ModuleProgress !== 'undefined') {
                    ModuleProgress.complete('code', 'do-27-cicd-iac-quiz', { returnToDashboard: false });
                }

                document.getElementById('retryBtn').textContent = 'Retake Quiz';
            }

            // Scroll to results
            document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function retryQuiz() {
            answers = {};
            document.querySelectorAll('.question-card').forEach(function(c) {
                c.classList.remove('answered', 'correct', 'incorrect');
                c.querySelectorAll('.q-option').forEach(function(o) {
                    o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
                });
                c.querySelectorAll('.q-explanation').forEach(function(e) { e.classList.remove('show'); });
            });
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('submitBtn').style.display = '';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('progressText').textContent = '0 / ' + questions.length + ' answered';
            document.getElementById('progressFill').style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Check if already completed
        function checkCompletion() {
            try {
                var p = JSON.parse(localStorage.getItem('hexworth_forge_progress') || '{}');
                if (p['do-27']) {
                    var bar = document.querySelector('.quiz-progress-bar');
                    var note = document.createElement('div');
                    note.style.cssText = 'margin-top:10px;font-size:12px;color:#8b5cf6;font-weight:600;';
                    note.textContent = 'Previously completed. You can retake this quiz at any time.';
                    bar.appendChild(note);
                }
            } catch(e) {}
        }

        renderQuestions();
        checkCompletion();
    </script>
    <script src="../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
