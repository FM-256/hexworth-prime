<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraform Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Terraform Fundamentals Challenge',
            description: 'Test your knowledge of terraform fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-terraform',
            moduleId: 'terraform',
            serverGrading: true,
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What does IaC stand for in the context of Terraform?',
                    options: [
                        'Infrastructure as Code',
                        'Integration as Configuration',
                        'Internet Architecture Cloud',
                        'Internal Application Container'
                    ],explanation: 'The correct answer is: Infrastructure as Code.'
                },
                {
                    question: 'What language does Terraform use for configuration files?',
                    options: [
                        'YAML',
                        'JSON',
                        'HCL (HashiCorp Configuration Language)',
                        'XML'
                    ],explanation: 'The correct answer is: HCL (HashiCorp Configuration Language).'
                },
                {
                    question: 'Which Terraform command initializes a working directory and downloads provider plugins?',
                    options: [
                        'terraform start',
                        'terraform init',
                        'terraform setup',
                        'terraform install'
                    ],explanation: 'The correct answer is: terraform init.'
                },
                {
                    question: 'What is the purpose of \'terraform plan\'?',
                    options: [
                        'Execute changes to infrastructure',
                        'Preview what changes will be made without applying them',
                        'Delete all resources',
                        'Initialize the Terraform backend'
                    ],explanation: 'The correct answer is: Preview what changes will be made without applying them.'
                },
                {
                    question: 'What does the Terraform state file (terraform.tfstate) contain?',
                    options: [
                        'Only configuration code',
                        'A record of infrastructure resources and their current state',
                        'Provider installation packages',
                        'User credentials and passwords'
                    ],explanation: 'The correct answer is: A record of infrastructure resources and their current state.'
                },
                {
                    question: 'Terraform is cloud-agnostic and can manage infrastructure across multiple cloud providers (AWS, Azure, GCP, etc.).',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'In Terraform, what keyword is used to define infrastructure components you want to create?',
                    options: [
                        'module',
                        'provider',
                        'resource',
                        'variable'
                    ],explanation: 'The correct answer is: resource.'
                },
                {
                    question: 'What is the best practice for storing Terraform state in a team environment?',
                    options: [
                        'Commit the state file to Git',
                        'Store it locally on each developer\'s machine',
                        'Use a remote backend like S3 with state locking',
                        'Email it to team members after each change'
                    ],explanation: 'The correct answer is: Use a remote backend like S3 with state locking.'
                },
                {
                    question: 'What is a Terraform module?',
                    options: [
                        'A plugin for cloud providers',
                        'A container for multiple resources that are used together',
                        'A type of variable',
                        'A command-line tool'
                    ],explanation: 'The correct answer is: A container for multiple resources that are used together.'
                },
                {
                    question: 'The \'terraform destroy\' command removes all infrastructure resources managed by the current Terraform configuration.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="code-terraform" house="code"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
