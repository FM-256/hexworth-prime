<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #4ade8033;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #4ade80;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CI/CD Fundamentals Challenge',
            description: 'Test your knowledge of ci/cd fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-cicd',
            moduleId: 'cicd',
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the main difference between Continuous Delivery and Continuous Deployment?',
                    options: [
                        'There is no difference, they are the same thing',
                        'Continuous Delivery requires manual approval for production deployment, Continuous Deployment is fully automated',
                        'Continuous Deployment requires manual approval, Continuous Delivery is fully automated',
                        'Continuous Delivery only works with Docker, Continuous Deployment works with any technology'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Continuous Delivery requires manual approval for production deployment, Continuous Deployment is fully automated.'
                },
                {
                    question: 'Which stage typically comes FIRST in a standard CI/CD pipeline?',
                    options: [
                        'Deploy',
                        'Test',
                        'Checkout/Clone',
                        'Security Scan'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Checkout/Clone.'
                },
                {
                    question: 'In CI/CD, it\'s best practice to build artifacts once and deploy the same artifact to all environments (dev, staging, production).',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is True.'
                },
                {
                    question: 'What does the \'on:\' section in a GitHub Actions workflow define?',
                    options: [
                        'The operating system to run on',
                        'When the workflow should be triggered',
                        'Which users can run the workflow',
                        'The output destination for logs'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: When the workflow should be triggered.'
                },
                {
                    question: 'In the test pyramid, which type of test should you have the MOST of?',
                    options: [
                        'End-to-end (E2E) tests',
                        'Integration tests',
                        'Unit tests',
                        'Manual tests'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Unit tests.'
                },
                {
                    question: 'A good CI/CD pipeline should fail fast - if there\'s an error in an early stage, stop immediately instead of running later stages.',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is True.'
                },
                {
                    question: 'What is the primary purpose of the \'build\' stage in a CI/CD pipeline?',
                    options: [
                        'To run security scans on the code',
                        'To compile code and create deployable artifacts',
                        'To deploy the application to production',
                        'To send notifications to developers'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: To compile code and create deployable artifacts.'
                },
                {
                    question: 'Which GitHub Actions syntax would trigger a workflow on every push to the main branch?',
                    options: [
                        'trigger: push(main)',
                        'on: push.main',
                        'on:   push:     branches: [ main ]',
                        'when: branch == \'main\''
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: on:   push:     branches: [ main ].'
                },
                {
                    question: 'What is \'trunk-based development\' and why does it work well with CI/CD?',
                    options: [
                        'Developing on separate long-lived branches; it allows thorough testing',
                        'Merging to main frequently with short-lived branches; it enables continuous integration',
                        'Only using the trunk of a tree data structure; it\'s faster than other data structures',
                        'Developing in a single file called trunk.js; it simplifies the pipeline'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Merging to main frequently with short-lived branches; it enables continuous integration.'
                },
                {
                    question: 'Why should secrets (API keys, passwords) NEVER be hardcoded in your code or pipeline YAML files?',
                    options: [
                        'They make the pipeline run slower',
                        'GitHub Actions doesn\'t support hardcoded secrets',
                        'They would be exposed in version control and visible to anyone with repository access',
                        'It causes syntax errors in YAML files'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: They would be exposed in version control and visible to anyone with repository access.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
