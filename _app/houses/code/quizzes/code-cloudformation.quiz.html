<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFormation Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CloudFormation Fundamentals Challenge',
            description: 'Test your knowledge of cloudformation fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-cloudformation',
            moduleId: 'cloudformation',
            serverGrading: true,
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the current valid value for AWSTemplateFormatVersion?',
                    options: [
                        '2020-01-01',
                        '2010-09-09',
                        '2015-06-15',
                        'latest'
                    ],explanation: 'The correct answer is: 2010-09-09.'
                },
                {
                    question: 'Which is the ONLY required section in a CloudFormation template?',
                    options: [
                        'Parameters',
                        'Outputs',
                        'Resources',
                        'Description'
                    ],explanation: 'The correct answer is: Resources.'
                },
                {
                    question: 'What intrinsic function returns the value of a parameter or the logical ID of a resource?',
                    options: [
                        '!GetAtt',
                        '!Ref',
                        '!Sub',
                        '!Select'
                    ],explanation: 'The correct answer is: !Ref.'
                },
                {
                    question: 'Which intrinsic function is used for string interpolation with ${} syntax?',
                    options: [
                        '!Join',
                        '!Split',
                        '!Sub',
                        '!Concat'
                    ],explanation: 'The correct answer is: !Sub.'
                },
                {
                    question: 'What is the purpose of a CloudFormation Change Set?',
                    options: [
                        'To delete all resources in a stack',
                        'To preview changes before updating a stack',
                        'To export templates to Terraform',
                        'To validate IAM permissions'
                    ],explanation: 'The correct answer is: To preview changes before updating a stack.'
                },
                {
                    question: 'CloudFormation is an AWS-native service that only works with AWS resources.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'What does the Mappings section in a CloudFormation template contain?',
                    options: [
                        'Database connection strings',
                        'Lookup tables for conditional values',
                        'IAM policy documents',
                        'Output values from other stacks'
                    ],explanation: 'The correct answer is: Lookup tables for conditional values.'
                },
                {
                    question: 'How are nested stacks referenced in CloudFormation?',
                    options: [
                        'Using AWS::CloudFormation::Include',
                        'Using AWS::CloudFormation::Stack resource type',
                        'Using !ImportStack function',
                        'Using AWS::NestedStack resource type'
                    ],explanation: 'The correct answer is: Using AWS::CloudFormation::Stack resource type.'
                },
                {
                    question: 'CloudFormation state is managed by AWS automatically - you don\'t need to manage state files like in Terraform.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'What is the purpose of the Outputs section in a CloudFormation template?',
                    options: [
                        'To display logs after stack creation',
                        'To export values for use in other stacks or display to users',
                        'To configure CloudWatch alarms',
                        'To define backup policies'
                    ],explanation: 'The correct answer is: To export values for use in other stacks or display to users.'
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="code-cloudformation" house="code"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
