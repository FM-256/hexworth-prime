<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Kubernetes Fundamentals Challenge',
            description: 'Test your knowledge of kubernetes fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-kubernetes',
            moduleId: 'kubernetes',
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the smallest deployable unit in Kubernetes?',
                    options: [
                        'Container',
                        'Pod',
                        'Deployment',
                        'Node'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: Pod.'
                },
                {
                    question: 'Which Kubernetes component is responsible for scheduling pods to nodes?',
                    options: [
                        'Controller Manager',
                        'API Server',
                        'Scheduler',
                        'Kubelet'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Scheduler.'
                },
                {
                    question: 'What is the purpose of a Kubernetes Service?',
                    options: [
                        'To store container images',
                        'To provide stable networking and load balancing for pods',
                        'To schedule pods to nodes',
                        'To store configuration data'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: To provide stable networking and load balancing for pods.'
                },
                {
                    question: 'A Pod can contain multiple containers that share the same network namespace and storage volumes.',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is True.'
                },
                {
                    question: 'Which kubectl command is used to create resources from a YAML file?',
                    options: [
                        'kubectl create',
                        'kubectl apply',
                        'kubectl run',
                        'kubectl make'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: kubectl apply.'
                },
                {
                    question: 'What does a Deployment provide that a Pod does not?',
                    options: [
                        'The ability to run containers',
                        'Network isolation',
                        'Self-healing, scaling, and rolling updates',
                        'Access to ConfigMaps and Secrets'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Self-healing, scaling, and rolling updates.'
                },
                {
                    question: 'Where does Kubernetes store all cluster data and state?',
                    options: [
                        'In the API Server',
                        'In etcd',
                        'In the Scheduler',
                        'In ConfigMaps'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: In etcd.'
                },
                {
                    question: 'Which Kubernetes object is used to store sensitive information like passwords?',
                    options: [
                        'ConfigMap',
                        'Volume',
                        'Secret',
                        'Namespace'
                    ],
                    correct: 2,
                    explanation: 'The correct answer is: Secret.'
                },
                {
                    question: 'The kubelet is the agent that runs on each worker node and ensures containers are running in pods.',
                    options: [
                        'True',
                        'False'
                    ],
                    correct: 0,
                    explanation: 'The correct answer is True.'
                },
                {
                    question: 'What command would you use to scale a deployment named \'webapp\' to 5 replicas?',
                    options: [
                        'kubectl scale webapp --replicas=5',
                        'kubectl scale deployment webapp --replicas=5',
                        'kubectl set replicas webapp 5',
                        'kubectl update deployment webapp --size=5'
                    ],
                    correct: 1,
                    explanation: 'The correct answer is: kubectl scale deployment webapp --replicas=5.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
