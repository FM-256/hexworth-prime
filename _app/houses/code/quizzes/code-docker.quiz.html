<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Docker Fundamentals Challenge',
            description: 'Test your knowledge of docker fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-docker',
            moduleId: 'docker',
            serverGrading: true,
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the main difference between a Docker image and a Docker container?',
                    options: [
                        'There is no difference, they are the same thing',
                        'An image is a running instance, a container is a template',
                        'An image is a read-only template, a container is a running instance',
                        'An image is stored remotely, a container is stored locally'
                    ],explanation: 'The correct answer is: An image is a read-only template, a container is a running instance.'
                },
                {
                    question: 'Which command is used to download a Docker image from Docker Hub?',
                    options: [
                        'docker download',
                        'docker pull',
                        'docker get',
                        'docker fetch'
                    ],explanation: 'The correct answer is: docker pull.'
                },
                {
                    question: 'What does the \'-d\' flag do in the \'docker run\' command?',
                    options: [
                        'Deletes the container after it stops',
                        'Runs the container in detached (background) mode',
                        'Displays detailed information',
                        'Downloads the image if not present'
                    ],explanation: 'The correct answer is: Runs the container in detached (background) mode.'
                },
                {
                    question: 'Which Docker command shows only currently running containers?',
                    options: [
                        'docker containers',
                        'docker list',
                        'docker ps',
                        'docker show'
                    ],explanation: 'The correct answer is: docker ps.'
                },
                {
                    question: 'In a Dockerfile, what does the \'FROM\' instruction specify?',
                    options: [
                        'The author of the image',
                        'The base image to build upon',
                        'The source code location',
                        'The container name'
                    ],explanation: 'The correct answer is: The base image to build upon.'
                },
                {
                    question: 'What is the purpose of the \'-p\' flag in \'docker run -p 8080:80\'?',
                    options: [
                        'Sets the container priority',
                        'Enables performance monitoring',
                        'Maps host port 8080 to container port 80',
                        'Publishes the container to Docker Hub'
                    ],explanation: 'The correct answer is: Maps host port 8080 to container port 80.'
                },
                {
                    question: 'Docker containers share the host operating system\'s kernel, making them more lightweight than virtual machines.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'What is Docker Compose primarily used for?',
                    options: [
                        'Compressing Docker images',
                        'Defining and running multi-container applications',
                        'Composing Dockerfiles automatically',
                        'Combining multiple images into one'
                    ],explanation: 'The correct answer is: Defining and running multi-container applications.'
                },
                {
                    question: 'Which Dockerfile instruction sets the working directory inside the container?',
                    options: [
                        'DIR',
                        'WORKDIR',
                        'CD',
                        'SETDIR'
                    ],explanation: 'The correct answer is: WORKDIR.'
                },
                {
                    question: 'What happens to data inside a Docker container when it is removed?',
                    options: [
                        'It is automatically backed up to Docker Hub',
                        'It is lost unless stored in a volume or bind mount',
                        'It is permanently saved to the image',
                        'It is moved to the host filesystem'
                    ],explanation: 'The correct answer is: It is lost unless stored in a volume or bind mount.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
