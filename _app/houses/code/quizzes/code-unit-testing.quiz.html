<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Testing Fundamentals Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Unit Testing Fundamentals Challenge',
            description: 'Test your knowledge of unit testing fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-unit-testing',
            moduleId: 'unit-testing',
            serverGrading: true,
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'What does AAA stand for in unit testing?',
                    options: [
                        'Authenticate, Authorize, Audit',
                        'Arrange, Act, Assert',
                        'Analyze, Apply, Approve',
                        'Accept, Activate, Affirm'
                    ],explanation: 'The correct answer is: Arrange, Act, Assert.'
                },
                {
                    question: 'In the Testing Pyramid, which type of test should you have the MOST of?',
                    options: [
                        'End-to-End (E2E) tests',
                        'Integration tests',
                        'Unit tests',
                        'Manual tests'
                    ],explanation: 'The correct answer is: Unit tests.'
                },
                {
                    question: 'What is a \'test double\' (such as a mock or stub) used for?',
                    options: [
                        'To run tests twice for accuracy',
                        'To replace real dependencies with controlled substitutes',
                        'To test the application on two different browsers',
                        'To create backup copies of test files'
                    ],explanation: 'The correct answer is: To replace real dependencies with controlled substitutes.'
                },
                {
                    question: 'In Test-Driven Development (TDD), you write the test BEFORE writing the production code.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'What is the correct order of the TDD cycle?',
                    options: [
                        'Green, Red, Refactor',
                        'Refactor, Red, Green',
                        'Red, Green, Refactor',
                        'Red, Refactor, Green'
                    ],explanation: 'The correct answer is: Red, Green, Refactor.'
                },
                {
                    question: 'What does \'code coverage\' measure?',
                    options: [
                        'How many developers reviewed the code',
                        'The percentage of code executed during tests',
                        'How many lines of code are in the project',
                        'The number of bugs found in production'
                    ],explanation: 'The correct answer is: The percentage of code executed during tests.'
                },
                {
                    question: '100% code coverage guarantees that your code has no bugs.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is False.'
                },
                {
                    question: 'Which of these is a characteristic of a good unit test?',
                    options: [
                        'Tests multiple units at once for efficiency',
                        'Requires a database connection to run',
                        'Is fast, isolated, and repeatable',
                        'Uses random input values each time'
                    ],explanation: 'The correct answer is: Is fast, isolated, and repeatable.'
                },
                {
                    question: 'In the AAA pattern, what happens in the \'Arrange\' phase?',
                    options: [
                        'You call the function being tested',
                        'You verify the expected outcome',
                        'You set up test data and preconditions',
                        'You clean up after the test runs'
                    ],explanation: 'The correct answer is: You set up test data and preconditions.'
                },
                {
                    question: 'What is the difference between a \'mock\' and a \'stub\'?',
                    options: [
                        'Mocks are for frontend, stubs are for backend',
                        'Stubs provide canned responses; mocks also verify interactions',
                        'Mocks are written in JavaScript; stubs are written in TypeScript',
                        'There is no difference; they are the same thing'
                    ],explanation: 'The correct answer is: Stubs provide canned responses; mocks also verify interactions.'
                },
                {
                    question: 'Unit tests should test private/internal implementation details rather than public interfaces.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is False.'
                },
                {
                    question: 'Why is testing edge cases important?',
                    options: [
                        'Edge cases never happen in production, so they\'re optional',
                        'Edge cases often reveal bugs that normal cases miss',
                        'Testing frameworks require at least one edge case test',
                        'Edge cases make your test suite look more impressive'
                    ],explanation: 'The correct answer is: Edge cases often reveal bugs that normal cases miss.'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
