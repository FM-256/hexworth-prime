<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile & SDLC Challenge - House of the Code</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 50%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #10b98133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { opacity: 0.8; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to House of the Code</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-laptop.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block;object-fit:contain"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Agile & SDLC Challenge',
            description: 'Test your knowledge of agile & sdlc',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'code',
            achievement: 'code-agile',
            moduleId: 'agile',
            serverGrading: true,
            houseId: 'code',
            trackProgress: true,

            questions: [
                {
                    question: 'Which SDLC phase comes immediately after \'Design\' in the traditional Waterfall model?',
                    options: [
                        'Testing',
                        'Development',
                        'Deployment',
                        'Analysis'
                    ],explanation: 'The correct answer is: Development.'
                },
                {
                    question: 'According to the Agile Manifesto, what is valued MORE than \'comprehensive documentation\'?',
                    options: [
                        'Processes and tools',
                        'Contract negotiation',
                        'Working software',
                        'Following a plan'
                    ],explanation: 'The correct answer is: Working software.'
                },
                {
                    question: 'What is the typical duration of a Scrum sprint?',
                    options: [
                        '1 day',
                        '1-4 weeks',
                        '3-6 months',
                        'Until all features are complete'
                    ],explanation: 'The correct answer is: 1-4 weeks.'
                },
                {
                    question: 'Which Scrum role is responsible for maximizing the value of the product and managing the Product Backlog?',
                    options: [
                        'Scrum Master',
                        'Development Team',
                        'Product Owner',
                        'Project Manager'
                    ],explanation: 'The correct answer is: Product Owner.'
                },
                {
                    question: 'In Kanban, limiting Work-In-Progress (WIP) helps prevent team overload and improves flow.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'What is the main purpose of a Daily Standup (Daily Scrum)?',
                    options: [
                        'To report progress to management',
                        'To plan the entire sprint',
                        'To synchronize team activities and identify blockers',
                        'To review completed work with stakeholders'
                    ],explanation: 'The correct answer is: To synchronize team activities and identify blockers.'
                },
                {
                    question: 'Which traditional SDLC model emphasizes risk analysis through repeated cycles?',
                    options: [
                        'Waterfall',
                        'V-Model',
                        'Spiral Model',
                        'Agile'
                    ],explanation: 'The correct answer is: Spiral Model.'
                },
                {
                    question: 'What does a Sprint Burndown Chart visualize?',
                    options: [
                        'Team member performance ratings',
                        'Remaining work (story points) over time',
                        'Budget spent vs allocated',
                        'Number of bugs found in testing'
                    ],explanation: 'The correct answer is: Remaining work (story points) over time.'
                },
                {
                    question: 'DevOps culture is the natural evolution of Agile principles applied to operations, breaking down walls between development and operations teams.',
                    options: [
                        'True',
                        'False'
                    ],explanation: 'The correct answer is True.'
                },
                {
                    question: 'In Scrum, which ceremony involves the team reflecting on the sprint and identifying process improvements?',
                    options: [
                        'Sprint Planning',
                        'Daily Standup',
                        'Sprint Review',
                        'Sprint Retrospective'
                    ],explanation: 'The correct answer is: Sprint Retrospective.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
