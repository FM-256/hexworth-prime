<style>
/* ============================================================
   ALGORITHM CHAMBER — CS Fundamentals Hub
   House of the Code | Hexworth Prime
   Prefix: ac-
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --ac-primary:#f59e0b;
    --ac-secondary:#d97706;
    --ac-accent:#b45309;
    --ac-glow:rgba(245,158,11,0.16);
    --ac-bg:#0b0a07;
    --ac-surface:rgba(255,255,255,0.03);
    --ac-surface-solid:#13120d;
    --ac-border:rgba(245,158,11,0.13);
    --ac-border-light:rgba(255,255,255,0.06);
    --ac-text:#e2e8f0;
    --ac-muted:#8b949e;
    --ac-dim:#444;
}
body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--ac-bg);color:var(--ac-text);
    min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ---- Particle field ---- */
.ac-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ac-particle{
    position:absolute;bottom:-10px;border-radius:50%;
    color:var(--ac-primary);
    animation:acFloat linear infinite;
}
@keyframes acFloat{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:var(--o,0.2)}
    90%{opacity:var(--o,0.2)}
    100%{transform:translateY(-100vh) rotate(360deg);opacity:0}
}

/* ---- Ambient glow ---- */
.ac-ambient{
    position:fixed;top:-200px;left:50%;width:800px;height:500px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(245,158,11,0.06) 0%,transparent 70%);
    pointer-events:none;z-index:0;
}

/* ---- Header ---- */
.ac-header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:rgba(11,10,7,0.94);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(245,158,11,0.17);
}
.ac-header-left{display:flex;align-items:center;gap:12px}
.ac-header-icon{border-radius:6px}
.ac-header-title{font-size:16px;font-weight:700;color:var(--ac-primary)}
.ac-header-sub{font-size:12px;color:var(--ac-muted)}
.ac-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;
    background:rgba(245,158,11,0.08);color:var(--ac-primary);
    border:1px solid rgba(245,158,11,0.22);transition:all 0.2s;cursor:pointer;
}
.ac-btn:hover{background:rgba(245,158,11,0.15)}

/* ---- Breadcrumb ---- */
.ac-breadcrumb{
    padding:10px 24px;font-size:13px;color:var(--ac-muted);
    background:rgba(11,10,7,0.6);border-bottom:1px solid rgba(255,255,255,0.04);
    position:relative;z-index:99;
}
.ac-breadcrumb a{color:var(--ac-primary);text-decoration:none;transition:opacity 0.2s}
.ac-breadcrumb a:hover{opacity:0.8}
.ac-breadcrumb-sep{margin:0 8px;color:var(--ac-dim)}
.ac-breadcrumb-current{color:var(--ac-text)}

/* ---- Main container ---- */
.ac-main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}

/* ---- Hero ---- */
.ac-hero{text-align:center;padding:52px 0 36px}
.ac-hero-title{
    font-size:48px;font-weight:800;
    background:linear-gradient(135deg,#f59e0b,#fbbf24,#fcd34d);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.1;
}
.ac-hero-subtitle{
    font-size:18px;color:var(--ac-muted);margin-top:12px;
    max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5;
}
.ac-hero-tagline{
    display:inline-block;margin-top:18px;padding:6px 16px;border-radius:20px;
    font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    background:rgba(245,158,11,0.08);color:var(--ac-primary);
    border:1px solid rgba(245,158,11,0.2);
}
.ac-hero-stats{display:flex;justify-content:center;gap:48px;margin-top:28px;flex-wrap:wrap}
.ac-stat{text-align:center}
.ac-stat-num{display:block;font-size:32px;font-weight:800;color:var(--ac-primary)}
.ac-stat-label{font-size:11px;color:var(--ac-muted);text-transform:uppercase;letter-spacing:1px}

/* ---- Section headings ---- */
.ac-section{margin-top:40px}
.ac-section-title{
    font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ac-primary);margin-bottom:16px;
    display:flex;align-items:center;gap:10px;
}
.ac-section-title::after{
    content:'';flex:1;height:1px;background:var(--ac-border);
}

/* ---- Overview panel ---- */
.ac-overview{
    background:var(--ac-surface);border:1px solid var(--ac-border);
    border-radius:14px;padding:28px;
}
.ac-overview-body{
    font-size:14px;color:var(--ac-muted);line-height:1.75;margin-bottom:20px;
}
.ac-domains{display:flex;flex-wrap:wrap;gap:8px}
.ac-domain-pill{
    font-size:11px;font-weight:600;padding:4px 12px;border-radius:6px;
    background:rgba(245,158,11,0.07);color:var(--ac-primary);
    border:1px solid rgba(245,158,11,0.15);letter-spacing:0.3px;
}

/* ---- Prerequisites ---- */
.ac-prereq-panel{
    background:var(--ac-surface);border:1px solid var(--ac-border);
    border-radius:14px;padding:24px;
}
.ac-prereq-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.ac-prereq-card{
    display:flex;align-items:flex-start;gap:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--ac-border-light);
    border-radius:10px;padding:14px 18px;min-width:200px;flex:1;
}
.ac-prereq-card-icon{width:28px;height:28px;flex-shrink:0;border-radius:4px}
.ac-prereq-card-name{font-size:14px;font-weight:600;color:var(--ac-text);margin-bottom:2px}
.ac-prereq-card-desc{font-size:12px;color:var(--ac-muted);line-height:1.4}
.ac-prereq-note{
    margin-top:14px;padding:10px 16px;border-radius:8px;
    background:rgba(245,158,11,0.04);border:1px solid rgba(245,158,11,0.1);
    font-size:12px;color:var(--ac-muted);line-height:1.5;
}

/* ---- Course grid ---- */
.ac-course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
}
.ac-course-card{
    background:var(--ac-surface);border:1px solid var(--ac-border-light);
    border-radius:14px;padding:24px;
    position:relative;overflow:hidden;
    transition:all 0.25s;
}
.ac-course-card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--card-color,var(--ac-primary));
    opacity:0.6;
}
.ac-course-card:hover{
    border-color:var(--card-color,var(--ac-primary));
    box-shadow:0 8px 28px rgba(0,0,0,0.45);
    transform:translateY(-2px);
}
.ac-card-glow{
    position:absolute;top:-40px;right:-40px;width:130px;height:130px;
    background:radial-gradient(circle,var(--card-glow,rgba(245,158,11,0.07)) 0%,transparent 70%);
    pointer-events:none;
}
.ac-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ac-card-head-left{display:flex;align-items:center;gap:10px}
.ac-card-icon{width:36px;height:36px;border-radius:8px}
.ac-card-id{
    font-size:10px;font-weight:700;letter-spacing:0.5px;
    color:var(--card-color,var(--ac-primary));opacity:0.75;
    font-family:'Courier New',monospace;
}
.ac-card-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.ac-card-desc{font-size:12px;color:var(--ac-muted);line-height:1.5;margin-bottom:12px;min-height:48px}

/* ---- Difficulty badges ---- */
.ac-diff{
    font-size:9px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.ac-diff--beginner{background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.25)}
.ac-diff--intermediate{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)}
.ac-diff--advanced{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}

/* ---- Tags ---- */
.ac-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ac-tag{
    font-size:10px;font-weight:600;letter-spacing:0.3px;padding:2px 8px;border-radius:3px;
    background:rgba(255,255,255,0.05);color:var(--ac-muted);
    border:1px solid rgba(255,255,255,0.06);
}

/* ---- Card footer ---- */
.ac-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.ac-card-meta{font-size:11px;color:var(--ac-muted)}
.ac-card-soon{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#f59e0b;padding:3px 10px;border-radius:4px;
    background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);
}
.ac-card-live{
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#4ade80;padding:3px 10px;border-radius:4px;
    background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);
}

/* ---- Career alignment ---- */
.ac-career-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ac-career-card{
    background:var(--ac-surface);border:1px solid var(--ac-border-light);
    border-radius:12px;padding:20px;
}
.ac-career-icon{width:28px;height:28px;margin-bottom:10px;border-radius:4px}
.ac-career-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.ac-career-desc{font-size:12px;color:var(--ac-muted);line-height:1.5;margin-bottom:10px}
.ac-career-roles{display:flex;flex-wrap:wrap;gap:5px}
.ac-career-role{
    font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;
    background:rgba(245,158,11,0.07);color:var(--ac-primary);
    border:1px solid rgba(245,158,11,0.14);
}

/* ---- Footer ---- */
.ac-footer{
    text-align:center;padding:32px 0 16px;font-size:12px;color:var(--ac-dim);
    border-top:1px solid rgba(255,255,255,0.05);margin-top:48px;
}

/* ---- Responsive ---- */
@media(max-width:700px){
    .ac-hero-title{font-size:32px}
    .ac-hero-stats{gap:24px}
    .ac-course-grid{grid-template-columns:1fr}
    .ac-career-grid{grid-template-columns:1fr}
    .ac-prereq-grid{flex-direction:column}
}
</style>
</head>

    function buildParticles() {

        div.innerHTML =
            '<h2 class="ac-hero-title">Algorithm Chamber</h2>' +
            '<div class="ac-hero-subtitle">Where code becomes craft. Master the mathematical foundations, data structures, and algorithmic techniques that separate functional code from exceptional engineering.</div>' +
            '<div class="ac-hero-tagline">CS Fundamentals Track</div>' +
            '<div class="ac-hero-stats">' +
                '<div class="ac-stat"><span class="ac-stat-num">' + COURSES.length + '</span><span class="ac-stat-label">Courses</span></div>' +
                '<div class="ac-stat"><span class="ac-stat-num">' + (COURSES.length * 10) + '</span><span class="ac-stat-label">Modules</span></div>' +
                '<div class="ac-stat"><span class="ac-stat-num">4</span><span class="ac-stat-label">Career Paths</span></div>' +
                '<div class="ac-stat"><span class="ac-stat-num">3</span><span class="ac-stat-label">Difficulty Tiers</span></div>' +
            '</div>';
        return div;
    }

    // ---- Overview section ----
    function buildOverview() {
        var section = document.createElement('div');
        section.className = 'ac-section';
        section.innerHTML = '<div class="ac-section-title">Track Overview</div>';

        var panel = document.createElement('div');
        panel.className = 'ac-overview';
        panel.innerHTML =
            '<div class="ac-overview-body">' +
                'The Algorithm Chamber is Hexworth Prime\'s CS fundamentals curriculum, built for developers who want to understand the principles beneath the syntax. ' +
                'The eleven courses progress from mathematical foundations through graph theory, complexity analysis, classical data structures, and sorting, then advance into greedy design, divide-and-conquer, dynamic programming, string algorithms, and computational geometry. ' +
                'The track concludes with an applied algorithms capstone connecting theory to real production systems, and a challenge platform for competitive programming practice. ' +
                'Each course is designed to build rigorous intuition, not just pattern matching — students who complete the full track can reason about novel problems from first principles.' +
            '</div>' +
            '<div class="ac-domains" id="ac-domains"></div>';
        section.appendChild(panel);

        // Populate domain pills after DOM is ready
        setTimeout(function() {
            var container = document.getElementById('ac-domains');
            if (!container) { return; }
            DOMAINS.forEach(function(d) {
                var pill = document.createElement('span');
                pill.className = 'ac-domain-pill';
                pill.textContent = d;
                container.appendChild(pill);
            });
        }, 0);

        return section;
    }

    // ---- Prerequisites section ----
    function buildPrereqs() {
        var section = document.createElement('div');
        section.className = 'ac-section';
        section.innerHTML = '<div class="ac-section-title">Prerequisites</div>';

        var panel = document.createElement('div');
        panel.className = 'ac-prereq-panel';

        var gridDiv = document.createElement('div');
        gridDiv.className = 'ac-prereq-grid';

        PREREQS.forEach(function(p) {
            // Check localStorage for any matching completion key
            var earned = p.keys.some(function(k) {
                try { return localStorage.getItem(k) === 'true'; } catch(e) { return false; }
            });
            var card = document.createElement('div');
            card.className = 'ac-prereq-card';
            card.innerHTML =
                '<img class="ac-prereq-card-icon" src="' + p.icon + '" alt="">' +
                '<div>' +
                    '<div class="ac-prereq-card-name">' + p.label +
                        (earned ? ' <span style="color:var(--ac-primary);font-size:10px">[Earned]</span>' : '') +
                    '</div>' +
                    '<div class="ac-prereq-card-desc">' + p.desc + '</div>' +
                '</div>';
            gridDiv.appendChild(card);
        });
        panel.appendChild(gridDiv);

        var note = document.createElement('div');
        note.className = 'ac-prereq-note';
        note.innerHTML =
            'The Algorithm Chamber assumes basic programming fluency in at least one language. ' +
            'Code examples and interactive labs use Python throughout. ' +
            'No prior knowledge of discrete mathematics or algorithm analysis is required for CS-2 through CS-6. ' +
            'All courses are browsable regardless of prerequisite status.';
        panel.appendChild(note);

        section.appendChild(panel);
        return section;
    }

    // ---- Individual course card ----
    function buildCourseCard(course) {
        var card = document.createElement('div');
        card.className = 'ac-course-card';
        card.style.setProperty('--card-color', course.color);
        card.style.setProperty('--card-glow', course.glow);

        var tagsHtml = course.tags.map(function(t) {
            return '<span class="ac-tag">' + t + '</span>';
        }).join('');

        card.innerHTML =
            '<div class="ac-card-glow"></div>' +
            '<div class="ac-card-head">' +
                '<div class="ac-card-head-left">' +
                    '<img class="ac-card-icon" src="' + course.icon + '" alt="">' +
                    '<div class="ac-card-id">' + course.id + '</div>' +
                '</div>' +
                '<span class="ac-diff ac-diff--' + course.difficulty + '">' + course.difficulty + '</span>' +
            '</div>' +
            '<div class="ac-card-name">' + course.name + '</div>' +
            '<div class="ac-card-desc">' + course.desc + '</div>' +
            '<div class="ac-card-tags">' + tagsHtml + '</div>' +
            '<div class="ac-card-foot">' +
                '<span class="ac-card-meta">' + course.modules + ' modules</span>' +
                (course.href
                    ? '<span class="ac-card-live">Available</span>'
                    : '<span class="ac-card-soon">Coming Soon</span>') +
            '</div>';

        if (course.href) {
            card.style.cursor = 'pointer';
            card.addEventListener('click', function() { window.location.href = course.href; });
        }

        return card;
    }

    // ---- Course grid section ----
    function buildCourseGrid() {
        var section = document.createElement('div');
        section.className = 'ac-section';
        section.innerHTML = '<div class="ac-section-title">11 Courses</div>';

        var grid = document.createElement('div');
        grid.className = 'ac-course-grid';

        COURSES.forEach(function(course) {
            grid.appendChild(buildCourseCard(course));
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Career alignment section ----
    function buildCareers() {
        var section = document.createElement('div');
        section.className = 'ac-section';
        section.innerHTML = '<div class="ac-section-title">Career Alignment</div>';

        var grid = document.createElement('div');
        grid.className = 'ac-career-grid';

        CAREERS.forEach(function(career) {
            var card = document.createElement('div');
            card.className = 'ac-career-card';

            var rolesHtml = career.roles.map(function(r) {
                return '<span class="ac-career-role">' + r + '</span>';
            }).join('');

            card.innerHTML =
                '<img class="ac-career-icon" src="' + career.icon + '" alt="">' +
                '<div class="ac-career-title">' + career.title + '</div>' +
                '<div class="ac-career-desc">' + career.desc + '</div>' +
                '<div class="ac-career-roles">' + rolesHtml + '</div>';

            grid.appendChild(card);
        });

        section.appendChild(grid);
        return section;
    }

    // ---- Footer ---- */
    function buildFooter() {
        var footer = document.createElement('div');
        footer.className = 'ac-footer';
        footer.innerHTML = 'Algorithm Chamber &mdash; CS Fundamentals Hub &mdash; House of the Code &mdash; Hexworth Prime';
        return footer;
    }

    // ---- Main render ----
    function render() {
        buildParticles();

        var main = document.getElementById('ac-main');
        main.appendChild(buildHero());
        main.appendChild(buildOverview());
        main.appendChild(buildPrereqs());
        main.appendChild(buildCourseGrid());
        main.appendChild(buildCareers());
        main.appendChild(buildFooter());
    }

    render();

})();
    </script>
</body>
</html>
