<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- AccessGuard: blocks unauthenticated and unsorted users -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- AchievementManager: unlocks badges on milestone events -->
    <script src="../../../../components/AchievementManager.js"></script>
    <!-- ModuleProgress: marks this module complete in Firestore -->
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 1: Data Types, Operators &amp; Control Flow | Python for IT</title>
    <style>
        /* ── CSS custom properties — Code house green palette ── */
        :root {
            --bg:         #0a0e1a;
            --bg-card:    #0f1625;
            --bg-option:  #141d2e;
            --green:      #10b981;
            --green-dim:  rgba(16, 185, 129, 0.15);
            --text:       #e2e8f0;
            --text-muted: #8892a8;
            --success:    #22c55e;
            --danger:     #ef4444;
            --border:     rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── Page wrapper ── */
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ── Back navigation ── */
        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #6ee7b7; transform: translateX(-5px); display: inline-block; }

        /* ── Header card ── */
        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--green-dim);
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            color: var(--green);
            margin-bottom: 0.5rem;
        }

        .quiz-header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        /* ── Metadata pills ── */
        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* ── Progress bar ── */
        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--green);
            font-weight: 600;
            white-space: nowrap;
        }

        /* ── Question card ── */
        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num {
            font-size: 0.8rem;
            color: var(--green);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* ── Inline code inside question text ── */
        .question-text code {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
        }

        /* ── Block code snippets ── */
        .code-block {
            background: #080c18;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 14px 18px;
            margin: -0.75rem 0 1.25rem 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.92rem;
            color: #a7f3d0;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.7;
        }

        /* ── Answer options ── */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
        }

        .option.selected {
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.08);
        }

        .option.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        /* disabled after selection — lock in answered state */
        .option.disabled           { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled   { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }

        /* ── Letter badge on each option ── */
        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--green);
            flex-shrink: 0;
        }

        .option.correct .option-letter   { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger);  color: #fff; border-color: var(--danger); }

        /* ── Per-question feedback panel ── */
        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }
        .feedback.checking {
            display: block;
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #cbd5e1;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* ── Navigation row ── */
        .quiz-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 24px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--green);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--green); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(16, 185, 129, 0.15); color: var(--green); }

        /* ── Results card ── */
        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 {
            color: var(--green);
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        /* colour-coded score tiers */
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* ── Result action buttons ── */
        .results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .results-btns a,
        .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4) !important;
            color: var(--green);
        }
        .btn-retry:hover { background: var(--green); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card  { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">

        <!-- Back navigation -->
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Python for IT Hub</a>
        </div>

        <!-- Quiz header -->
        <div class="quiz-header">
            <h1>Quiz 1: Data Types, Operators &amp; Control Flow</h1>
            <p class="subtitle">Data types, variables, operators, if/elif/else, loops, break/continue, common errors</p>
            <div class="meta">
                <span>Week 1</span>
                <span>15 Questions</span>
                <span>Pass: 70%</span>
                <span>COP1034C</span>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <!-- Active question card -->
        <div class="question-card" id="questionCard">
            <div class="question-num"  id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options"       id="optionsEl"></div>
            <div class="feedback"      id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <!-- Results card (hidden until quiz ends) -->
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg"   id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Python Hub</a>
            </div>
        </div>

    </div><!-- /.quiz-container -->

    <script>
        /* ── Question bank — Week 1: Data Types, Operators & Control Flow ── */
        /* Correct answer index (ans) is 0-based: 0=A, 1=B, 2=C, 3=D        */
        /* Distribution: A=4, B=4, C=4, D=3 (target; rotate opts as needed) */
        var questions = [
            {
                /* Q1 — type() return value */
                q:    "What does <code>type(3.14)</code> return?",
                opts: ["&lt;class 'int'&gt;", "&lt;class 'float'&gt;", "&lt;class 'str'&gt;", "&lt;class 'double'&gt;"],
                exp:  "3.14 is a floating-point literal. Python stores it internally as a float. The type() built-in always returns the class of its argument — Python has no 'double' type."
            },
            {
                /* Q2 — integer division operator */
                q:    "What is the output of the following code?",
                code: "print(17 // 5)",
                opts: ["3.4", "2", "3", "4"],
                exp:  "The // operator performs floor (integer) division — it divides and discards the fractional part. 17 divided by 5 is 3.4, which floors to 3."
            },
            {
                /* Q3 — modulus operator */
                q:    "What value does <code>10 % 3</code> produce?",
                opts: ["3", "0", "1", "3.33"],
                exp:  "The modulus operator (%) returns the remainder after division. 10 = 3*3 + 1, so the remainder is 1. This operator is commonly used to test whether a number is even or odd."
            },
            {
                /* Q4 — range() sequence */
                q:    "What sequence does <code>range(1, 10, 3)</code> produce?",
                opts: ["1, 4, 7", "1, 3, 6, 9", "1, 4, 7, 10", "3, 6, 9"],
                exp:  "range(start, stop, step) begins at 1 and adds 3 each step, stopping before 10. The values are 1, 4, 7. The value 10 is never included because range() excludes the stop value."
            },
            {
                /* Q5 — valid variable name */
                q:    "Which of the following is a valid Python variable name?",
                opts: ["2count", "class", "count-items", "count_items"],
                exp:  "Variable names must start with a letter or underscore and may contain letters, digits, and underscores only. '2count' starts with a digit, 'count-items' contains a hyphen, and 'class' is a reserved keyword."
            },
            {
                /* Q6 — type casting input() */
                q:    "A student writes <code>age = input('Enter age: ')</code> and then tries <code>print(age + 1)</code>. What happens?",
                opts: ["Raises a TypeError", "Prints the age plus 1", "Prints age1", "Raises a NameError"],
                exp:  "input() always returns a string. Adding an integer to a string raises a TypeError because Python will not implicitly convert types. The fix is int(input('Enter age: '))."
            },
            {
                /* Q7 — truthy/falsy */
                q:    "Which of the following values is considered FALSY in Python?",
                opts: ["1", "-1", "'False'", "[]"],
                exp:  "An empty list [] evaluates to False in a boolean context. Note that the string 'False' is truthy (non-empty string), 1 is truthy, and -1 is truthy. Falsy values include 0, '', [], {}, set(), None, and False."
            },
            {
                /* Q8 — elif keyword */
                q:    "What keyword introduces a secondary condition branch in a Python if-statement?",
                opts: ["elseif", "elsif", "else if", "elif"],
                exp:  "Python uses elif (a contraction of 'else if') for chained conditions. Unlike other languages, Python has no 'elseif' or 'elsif'. Each elif block is only evaluated when all preceding conditions were False."
            },
            {
                /* Q9 — while loop output */
                q:    "What is the output of the following code?",
                code: "x = 0\nwhile x < 3:\n    print(x)\n    x += 1",
                opts: ["0 1 2", "0 1 2 3", "1 2 3", "0 1 2 3 4"],
                exp:  "The loop starts at x=0 and prints x before incrementing. When x reaches 3 the condition x < 3 becomes False and the loop exits. Output is 0, 1, 2 on separate lines."
            },
            {
                /* Q10 — break statement */
                q:    "What is the output of the following code?",
                code: "for i in range(6):\n    if i == 3:\n        break\n    print(i)",
                opts: ["0 1 2 3", "0 1 2", "1 2 3", "3 4 5"],
                exp:  "break immediately exits the innermost loop. When i equals 3 the break fires before print(i) is reached, so 3 is never printed. Output is 0, 1, 2."
            },
            {
                /* Q11 — continue statement */
                q:    "What is the output of the following code?",
                code: "for i in range(5):\n    if i == 2:\n        continue\n    print(i)",
                opts: ["0 1 3 4", "0 1 2 3 4", "0 1", "2"],
                exp:  "continue skips the rest of the current iteration and moves to the next one. When i equals 2 the print statement is skipped, so 2 is absent from the output. All other values 0, 1, 3, 4 are printed."
            },
            {
                /* Q12 — logical operators */
                q:    "What does <code>not (True and False)</code> evaluate to?",
                opts: ["False", "True", "None", "Error"],
                exp:  "Evaluate inside-out: True and False is False. Applying not to False gives True. Python evaluates 'not' before 'and' in precedence, but the parentheses here force 'and' to evaluate first."
            },
            {
                /* Q13 — comparison operator */
                q:    "What is the output of the following code?",
                code: "x = 5\nprint(x >= 5 and x < 10)",
                opts: ["5", "True", "False", "None"],
                exp:  "x >= 5 is True (5 is equal to 5) and x < 10 is True (5 is less than 10). True and True evaluates to True."
            },
            {
                /* Q14 — NameError */
                q:    "What error does Python raise when you reference a variable that has never been assigned a value?",
                opts: ["TypeError", "SyntaxError", "NameError", "ValueError"],
                exp:  "A NameError is raised when Python cannot find a name in the current or enclosing scope. This typically means a variable was used before it was assigned, or a name was misspelled."
            },
            {
                /* Q15 — None type */
                q:    "What is the type of the Python literal <code>None</code>?",
                opts: ["&lt;class 'bool'&gt;", "&lt;class 'NoneType'&gt;", "&lt;class 'int'&gt;", "&lt;class 'null'&gt;"],
                exp:  "None is Python's null value and has its own type: NoneType. It is falsy, is a singleton (only one instance exists), and is commonly used as a default return value or to indicate the absence of a value."
            }
        ];

        /* ── Quiz state ── */
        var current  = 0;
        var score    = 0;
        var answered = false;
        var TOTAL    = questions.length;

        /* ── Render the current question ── */
        function loadQuestion() {
            var q = questions[current];

            /* Update question counter and progress bar */
            document.getElementById('questionNum').textContent    = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent  = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width   = ((current + 1) / TOTAL * 100) + '%';

            /* innerHTML used to render inline <code> tags in question text */
            document.getElementById('questionText').innerHTML = q.q;

            /* Inject optional code block beneath the question text */
            if (q.code) {
                var block = document.createElement('pre');
                block.className   = 'code-block';
                block.textContent = q.code;
                document.getElementById('questionText').appendChild(block);
            }

            /* Build the four answer option buttons */
            var html    = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                        '<span class="option-letter">' + letters[i] + '</span>' +
                        '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;

            /* Reset feedback panel and disable Next until an answer is chosen */
            document.getElementById('feedback').className   = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled     = true;
            answered = false;
        }

        var QUIZ_ID = 'pfi-w1-quiz';
        /* Validate ONE answer server-side via gradeQuiz; the key never reaches the client (QC-57). */
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { r = (r && r.data) ? r.data : r; return !!(r && r.results && r.results[qIndex] && r.results[qIndex].correct); })
                .catch(function () { return null; });
        }

        /* ── Handle answer selection — validated SERVER-SIDE, instant feedback preserved ── */
        function selectAnswer(idx) {
            if (answered) return; /* guard against double-click */
            answered = true;

            var q    = questions[current];
            var opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); }

            var fb = document.getElementById('feedback');
            fb.className = 'feedback checking'; fb.textContent = 'Checking…';

            gradeOne(current, idx).then(function (correct) {
                if (correct === null) {
                    opts[idx].classList.add('incorrect');
                    fb.className = 'feedback incorrect';
                    fb.textContent = 'Could not verify answer. ' + q.exp;
                } else {
                    opts[idx].classList.add(correct ? 'correct' : 'incorrect');
                    if (correct) { score++; }
                    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                    fb.textContent = (correct ? 'Correct! ' : 'Incorrect. ') + q.exp;
                }
                document.getElementById('scoreLabel').textContent = 'Score: ' + score;
                document.getElementById('nextBtn').disabled = false;
                if (current === TOTAL - 1) {
                    document.getElementById('nextBtn').textContent = 'See Results';
                }
            });
        }

        /* ── Advance to next question or show results ── */
        function nextQuestion() {
            current++;
            if (current >= TOTAL) {
                showResults();
                return;
            }
            loadQuestion();
        }

        /* ── Show the results card ── */
        function showResults() {
            /* Hide the question UI */
            document.getElementById('questionCard').style.display       = 'none';
            document.querySelector('.progress-bar-wrap').style.display  = 'none';

            /* Reveal the results card */
            var resultsCard = document.getElementById('resultsCard');
            resultsCard.style.display = 'block';

            var pct      = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            /* Colour tier: green >= 80, amber >= 70, red < 70 */
            if (pct >= 80) {
                scoreBig.className = 'score-big';
            } else if (pct >= 70) {
                scoreBig.className = 'score-big mid';
            } else {
                scoreBig.className = 'score-big low';
            }

            /* Contextual performance message */
            var msg = '';
            if      (pct >= 90) msg = 'Excellent! You have a strong grasp of Python data types, operators, and control flow.';
            else if (pct >= 70) msg = 'Good work — you passed. Review any missed questions before moving to Week 2.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the Week 1 slides and try again.';
            else                msg = 'Keep at it. Return to the Week 1 materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            /* Mark module complete in Firestore on pass (>= 70%) */
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('code', 'pfi-w1-quiz', { returnUrl: '../index.html' });
            }
        }

        /* ── Reset quiz for retry ── */
        function restartQuiz() {
            current  = 0;
            score    = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent          = 'Score: 0';
            document.getElementById('questionCard').style.display      = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display       = 'none';
            document.getElementById('nextBtn').textContent             = 'Next Question';
            loadQuestion();
        }

        /* ── Initialise on page load ── */
        loadQuestion();
    </script>
