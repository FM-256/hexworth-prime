<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- AccessGuard: blocks unauthenticated and unsorted users -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- AchievementManager: unlocks badges on milestone events -->
    <script src="../../../../components/AchievementManager.js"></script>
    <!-- ModuleProgress: marks this module complete in Firestore -->
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3: Functions, Graphics &amp; OOP | Python for IT</title>
    <style>
        /* ── CSS custom properties — Code house green palette ── */
        :root {
            --bg:         #0a0e1a;
            --bg-card:    #0f1625;
            --bg-option:  #141d2e;
            --green:      #10b981;
            --green-dim:  rgba(16, 185, 129, 0.15);
            --text:       #e2e8f0;
            --text-muted: #8892a8;
            --success:    #22c55e;
            --danger:     #ef4444;
            --border:     rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }

        .back-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { color: #6ee7b7; transform: translateX(-5px); display: inline-block; }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--green-dim);
        }

        .quiz-header h1 { font-size: 1.6rem; color: var(--green); margin-bottom: 0.5rem; }

        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }

        .quiz-header .meta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .quiz-header .meta span {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .progress-bar-wrap {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }

        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .score-label { font-size: 0.85rem; color: var(--green); font-weight: 600; white-space: nowrap; }

        .question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .question-num { font-size: 0.8rem; color: var(--green); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }

        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }

        /* ── Inline code ── */
        .question-text code {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
        }

        /* ── Code block ── */
        .code-block {
            background: #080c18;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 14px 18px;
            margin: -0.75rem 0 1.25rem 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.92rem;
            color: #a7f3d0;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.7;
        }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-option);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option:hover { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05); }
        .option.selected  { border-color: var(--green);   background: rgba(16, 185, 129, 0.08); }
        .option.correct   { border-color: var(--success);  background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--danger);   background: rgba(239, 68, 68, 0.08); }

        .option.disabled           { pointer-events: none; opacity: 0.7; }
        .option.correct.disabled   { opacity: 1; }
        .option.incorrect.disabled { opacity: 1; }

        .option-letter {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--green);
            flex-shrink: 0;
        }

        .option.correct .option-letter   { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger);  color: #fff; border-color: var(--danger); }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .quiz-nav { display: flex; justify-content: flex-end; }

        .next-btn {
            padding: 10px 24px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--green);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover { background: var(--green); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .next-btn:disabled:hover { background: rgba(16, 185, 129, 0.15); color: var(--green); }

        .results-card {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 3rem 2rem;
            border: 1px solid var(--border);
        }

        .results-card h2 { color: var(--green); font-size: 1.4rem; margin-bottom: 1rem; }

        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); }
        .score-big.mid { color: #fbbf24; }

        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .results-btns a,
        .results-btns button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-retry {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4) !important;
            color: var(--green);
        }
        .btn-retry:hover { background: var(--green); color: #fff; }

        .btn-hub {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            color: var(--success);
        }
        .btn-hub:hover { background: var(--success); color: #fff; }

        @media (max-width: 640px) {
            .quiz-container { padding: 1rem; }
            .question-card  { padding: 1.25rem; }
            .quiz-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">

        <!-- Back navigation -->
        <div class="nav-links">
            <a href="../index.html" class="back-link">&#8592; Python for IT Hub</a>
        </div>

        <!-- Quiz header -->
        <div class="quiz-header">
            <h1>Quiz 3: Functions, Graphics &amp; OOP</h1>
            <p class="subtitle">Functions, scope, lambdas, recursion, turtle graphics, classes, inheritance, polymorphism</p>
            <div class="meta">
                <span>Week 3</span>
                <span>15 Questions</span>
                <span>Pass: 70%</span>
                <span>COP1034C</span>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>

        <!-- Active question card -->
        <div class="question-card" id="questionCard">
            <div class="question-num"  id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options"       id="optionsEl"></div>
            <div class="feedback"      id="feedback"></div>
            <div class="quiz-nav">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <!-- Results card -->
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg"   id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Python Hub</a>
            </div>
        </div>

    </div><!-- /.quiz-container -->

    <script>
        /* ── Question bank — Week 3: Functions, Graphics & OOP ── */
        /* Correct answer distribution: A=4, B=4, C=4, D=3         */
        var questions = [
            {
                /* Q1 — function return value */
                q:    "What is the output of the following code?",
                code: "def add(a, b):\n    return a + b\n\nresult = add(3, 4)\nprint(result)",
                opts: ["None", "7", "34", "TypeError"],
                ans:  1,
                exp:  "The function add(a, b) returns the sum of its two arguments. Calling add(3, 4) returns 7, which is stored in result and then printed."
            },
            {
                /* Q2 — default parameter */
                q:    "What is the output of the following code?",
                code: "def greet(name, msg='Hello'):\n    print(msg + ', ' + name)\n\ngreet('Sam')",
                opts: ["Hello, Sam", "msg, name", "Sam, Hello", "TypeError"],
                ans:  0,
                exp:  "msg has a default value of 'Hello', so it is optional. Calling greet('Sam') uses the default and prints 'Hello, Sam'. Default parameters must always appear after positional parameters in the function signature."
            },
            {
                /* Q3 — *args */
                q:    "What does the <code>*args</code> parameter allow a function to accept?",
                opts: [
                    "An arbitrary number of keyword arguments",
                    "An arbitrary number of positional arguments",
                    "Only integer arguments",
                    "Exactly two positional arguments"
                ],
                ans:  1,
                exp:  "*args collects any number of positional arguments into a tuple. **kwargs collects keyword arguments into a dictionary. Together they allow functions to accept fully flexible argument lists."
            },
            {
                /* Q4 — variable scope */
                q:    "What is the output of the following code?",
                code: "x = 10\n\ndef show():\n    x = 99\n    print(x)\n\nshow()\nprint(x)",
                opts: ["99 10", "10 10", "99 99", "NameError"],
                ans:  0,
                exp:  "The x inside show() is a local variable that shadows the global x. Assigning x = 99 inside the function does not change the global x. show() prints 99; the final print() sees the global x and prints 10."
            },
            {
                /* Q5 — lambda */
                q:    "What does the following lambda expression return when called with argument 5?",
                code: "square = lambda n: n ** 2\nprint(square(5))",
                opts: ["10", "25", "52", "None"],
                ans:  1,
                exp:  "A lambda is an anonymous single-expression function. lambda n: n ** 2 returns n raised to the power 2. square(5) evaluates to 5**2, which is 25."
            },
            {
                /* Q6 — recursion base case */
                q:    "What is the output of the following recursive function?",
                code: "def countdown(n):\n    if n <= 0:\n        print('Go!')\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)",
                opts: ["3 2 1", "3 2 1 Go!", "Go! 1 2 3", "Infinite loop"],
                ans:  1,
                exp:  "countdown(3) prints 3, then calls countdown(2), which prints 2, then countdown(1), which prints 1, then countdown(0) hits the base case and prints 'Go!'. The base case is essential — without it the recursion would continue until a RecursionError."
            },
            {
                /* Q7 — turtle forward */
                q:    "In the turtle module, what does <code>t.forward(100)</code> do?",
                opts: [
                    "Moves the turtle forward 100 pixels in its current direction",
                    "Rotates the turtle 100 degrees clockwise",
                    "Sets the pen width to 100",
                    "Creates a line of length 100 from the origin"
                ],
                ans:  0,
                exp:  "forward(distance) moves the turtle in whatever direction it currently faces by the given number of pixels. right() and left() change its heading. penup() / pendown() control whether a line is drawn as it moves."
            },
            {
                /* Q8 — __init__ purpose */
                q:    "What is the purpose of the <code>__init__</code> method in a Python class?",
                opts: [
                    "It destroys the object when it goes out of scope",
                    "It defines class-level (static) attributes",
                    "It initializes a new instance's attributes when it is created",
                    "It overrides the class name"
                ],
                ans:  2,
                exp:  "__init__ is the constructor method. It is called automatically when a new instance is created with ClassName(). It receives 'self' (the new instance) and any other arguments you specify, allowing you to set initial attribute values."
            },
            {
                /* Q9 — self parameter */
                q:    "What does the <code>self</code> parameter represent in a class method?",
                opts: [
                    "The class itself",
                    "A static reference to all instances",
                    "The parent class",
                    "The current instance of the class"
                ],
                ans:  3,
                exp:  "self refers to the specific object instance on which the method was called. Python passes it automatically — you never pass self explicitly when calling a method. Without self, the method has no way to read or write the instance's own attributes."
            },
            {
                /* Q10 — inheritance and method override */
                q:    "What is the output of the following code?",
                code: "class Animal:\n    def speak(self):\n        return 'Some sound'\n\nclass Dog(Animal):\n    def speak(self):\n        return 'Woof'\n\nd = Dog()\nprint(d.speak())",
                opts: ["AttributeError", "Some sound", "None", "Woof"],
                ans:  3,
                exp:  "Dog inherits from Animal but overrides the speak() method. When d.speak() is called, Python uses Dog's version (method overriding). The parent's speak() is still accessible via super().speak() if needed."
            },
            {
                /* Q11 — polymorphism */
                q:    "Which Python concept allows a single function to accept objects of different types and call the correct method on each?",
                opts: ["Encapsulation", "Inheritance", "Polymorphism", "Abstraction"],
                ans:  2,
                exp:  "Polymorphism means 'many forms'. In Python, if multiple classes implement the same method name, a function that calls that method will work correctly regardless of which class the object belongs to — no explicit type checking required."
            },
            {
                /* Q12 — single underscore convention */
                q:    "What does a single leading underscore in a Python attribute name (e.g., <code>_balance</code>) conventionally signal?",
                opts: [
                    "The attribute is read-only",
                    "The attribute is a class variable, not an instance variable",
                    "The attribute is intended for internal use only",
                    "The attribute is name-mangled and inaccessible"
                ],
                ans:  2,
                exp:  "A single underscore is a soft convention — Python does not enforce it. It signals to other developers that the attribute is for internal use. Double underscore (__attr) triggers name mangling, which is stronger and prevents accidental subclass collisions."
            },
            {
                /* Q13 — double underscore name mangling */
                q:    "What happens when you define an attribute as <code>self.__secret = 42</code> inside a class named <code>Vault</code>?",
                opts: [
                    "The attribute is stored as _Vault__secret to prevent subclass conflicts",
                    "The attribute becomes completely inaccessible from outside",
                    "The attribute raises an error if accessed outside the class",
                    "The attribute is deleted after __init__ exits"
                ],
                ans:  0,
                exp:  "Double underscore triggers name mangling: Python internally renames __secret to _Vault__secret. It is still accessible via that mangled name, but the mangling prevents accidental overrides in subclasses and signals strong 'private' intent."
            },
            {
                /* Q14 — LEGB scope */
                q:    "In Python's LEGB scope rule, what does the letter 'E' stand for?",
                opts: ["Execution", "Extended", "Enclosing", "External"],
                ans:  2,
                exp:  "LEGB stands for Local, Enclosing, Global, Built-in. The Enclosing scope applies when using nested functions or closures — Python looks in the outer function's scope before checking the global scope."
            },
            {
                /* Q15 — turtle penup */
                q:    "In the turtle module, what must you call before moving the turtle WITHOUT drawing a line?",
                opts: ["t.lift()", "t.hide()", "t.noline()", "t.penup()"],
                ans:  3,
                exp:  "penup() (also aliased as pu()) lifts the pen so the turtle moves without drawing. pendown() (pd()) lowers it again to resume drawing. This is the standard way to reposition the turtle between separate shapes."
            }
        ];

        /* ── Quiz state ── */
        var current  = 0;
        var score    = 0;
        var answered = false;
        var TOTAL    = questions.length;

        /* ── Render the current question ── */
        function loadQuestion() {
            var q = questions[current];

            document.getElementById('questionNum').textContent   = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width  = ((current + 1) / TOTAL * 100) + '%';

            /* innerHTML renders inline <code> tags in question text */
            document.getElementById('questionText').innerHTML = q.q;

            /* Append optional code block beneath question text */
            if (q.code) {
                var block = document.createElement('pre');
                block.className   = 'code-block';
                block.textContent = q.code;
                document.getElementById('questionText').appendChild(block);
            }

            /* Build answer options */
            var html    = '';
            var letters = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < q.opts.length; i++) {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">' +
                        '<span class="option-letter">' + letters[i] + '</span>' +
                        '<span>' + q.opts[i] + '</span></div>';
            }
            document.getElementById('optionsEl').innerHTML = html;

            /* Reset per-question state */
            document.getElementById('feedback').className   = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled     = true;
            answered = false;
        }

        /* ── Handle answer selection ── */
        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            var q    = questions[current];
            var opts = document.querySelectorAll('.option');

            /* Highlight correct answer green, chosen-wrong answer red */
            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.add('disabled');
                if (i === q.ans)    opts[i].classList.add('correct');
                else if (i === idx) opts[i].classList.add('incorrect');
            }

            /* Show feedback with explanation */
            var fb = document.getElementById('feedback');
            if (idx === q.ans) {
                score++;
                fb.className   = 'feedback correct';
                fb.textContent = 'Correct! ' + q.exp;
            } else {
                fb.className   = 'feedback incorrect';
                fb.textContent = 'Incorrect. ' + q.exp;
            }

            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;

            /* Relabel button on the final question */
            if (current === TOTAL - 1) {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
        }

        /* ── Advance to next question or show results ── */
        function nextQuestion() {
            current++;
            if (current >= TOTAL) { showResults(); return; }
            loadQuestion();
        }

        /* ── Show results card ── */
        function showResults() {
            document.getElementById('questionCard').style.display       = 'none';
            document.querySelector('.progress-bar-wrap').style.display  = 'none';
            document.getElementById('resultsCard').style.display        = 'block';

            var pct      = Math.round((score / TOTAL) * 100);
            var scoreBig = document.getElementById('finalScore');
            scoreBig.textContent = score + '/' + TOTAL + ' (' + pct + '%)';

            if      (pct >= 80) scoreBig.className = 'score-big';
            else if (pct >= 70) scoreBig.className = 'score-big mid';
            else                scoreBig.className = 'score-big low';

            var msg = '';
            if      (pct >= 90) msg = 'Excellent! You have a solid command of functions, OOP, and Python graphics.';
            else if (pct >= 70) msg = 'Good work — you passed. Review any missed topics before the final exam.';
            else if (pct >= 50) msg = 'Close, but not quite. Revisit the Week 3 slides and try again.';
            else                msg = 'Return to the Week 3 materials and retake this quiz.';
            document.getElementById('scoreMsg').textContent = msg;

            /* Mark module complete on pass */
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
                ModuleProgress.complete('code', 'pfi-w3-quiz', { returnUrl: '../index.html' });
            }
        }

        /* ── Reset for retry ── */
        function restartQuiz() {
            current  = 0;
            score    = 0;
            answered = false;
            document.getElementById('scoreLabel').textContent          = 'Score: 0';
            document.getElementById('questionCard').style.display      = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display       = 'none';
            document.getElementById('nextBtn').textContent             = 'Next Question';
            loadQuestion();
        }

        /* ── Initialise ── */
        loadQuestion();
    </script>
</body>
</html>
