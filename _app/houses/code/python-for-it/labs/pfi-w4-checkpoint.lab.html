<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control: students must be in a sorted house -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync across devices -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Checkpoint | Python for IT</title>

    <style>
        /* Viewport lock -- PythonSandbox.js fills 100% of the screen */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 4 Checkpoint</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           WEEK 4 CHECKPOINT -- Final Integration
           Course: Python for IT (COP1034C)
           Module ID: pfi-w4-checkpoint
           Total: 3 challenges -- validates Week 4 integration patterns.

           Purpose: Students demonstrate error handling, GUI structure,
           and final project completeness. Challenge 1 is executable
           (try/except). Challenges 2 and 3 are code reviews -- Tkinter
           cannot run in Pyodide/WASM, and the final checklist validates
           overall project architecture.
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 4 Checkpoint \u2014 Final Integration',
            moduleId    : 'pfi-w4-checkpoint',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1: Error Handling (Executable) ─────────────
                   Regular execution -- the starter code includes a
                   function that attempts to read a non-existent file.
                   Students wrap the call in try/except to handle the
                   FileNotFoundError gracefully.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w4-error-handling',
                    title       : 'Error Handling',
                    desc        : 'Catch a FileNotFoundError gracefully.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 300,
                    instructions:
                        'Production code must handle errors gracefully. A crashing script ' +
                        'is unprofessional and can cause cascading failures in IT systems.<br><br>' +
                        '<strong>The starter code provides:</strong><br>' +
                        '- A function <code>read_config(path)</code> that tries to open a file<br>' +
                        '- A call to that function with a file that does not exist<br><br>' +
                        '<strong>Your task:</strong><br>' +
                        '1. Wrap the function call in a <code>try/except</code> block<br>' +
                        '2. Catch <code>FileNotFoundError</code> specifically (not bare except)<br>' +
                        '3. When the error is caught, print exactly: <code>Config not found - using defaults</code><br><br>' +
                        'This pattern is how IT tools handle missing config files, unreachable ' +
                        'servers, and other expected failure modes.',
                    expected    : 'Config not found - using defaults',
                    starter     :
                        '# Week 4 Checkpoint: Error Handling\n' +
                        '# Wrap the function call in error handling.\n\n' +
                        'def read_config(path):\n' +
                        '    """Read a config file. Raises FileNotFoundError if missing."""\n' +
                        '    with open(path, "r") as f:\n' +
                        '        return f.read()\n\n' +
                        '# This file does not exist -- your code should handle the error.\n' +
                        '# Wrap this call so it prints: Config not found - using defaults\n',
                    hints       : [
                        'Start with: try: and put the function call inside the try block.',
                        'Catch the specific error: except FileNotFoundError:',
                        'Full pattern: try:\\n    read_config("settings.ini")\\nexcept FileNotFoundError:\\n    print("Config not found - using defaults")'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify exact output from the error handler */
                            name  : 'Output is "Config not found - using defaults"',
                            check : function(out) {
                                return out.trim() === 'Config not found - using defaults';
                            }
                        },
                        {
                            /* Verify student uses try/except, not a file existence check */
                            name  : 'Code uses try/except pattern',
                            check : function(out, code) {
                                return code.indexOf('try:') !== -1 &&
                                       code.indexOf('except ') !== -1;
                            }
                        },
                        {
                            /* Verify student catches the specific exception type */
                            name  : 'Code catches FileNotFoundError specifically',
                            check : function(out, code) {
                                return code.indexOf('FileNotFoundError') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 2: GUI Structure (Code Review) ─────────────
                   codeReview: true -- Tkinter cannot run in Pyodide/WASM.
                   Tests inspect the code string for class structure with
                   Tkinter widget references.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w4-gui-structure',
                    title       : 'GUI Structure',
                    desc        : 'Validate your Tkinter GUI class layout.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 360,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your GUI class</strong> from the Week 4 project.<br><br>' +
                        'Tkinter applications follow a consistent class-based pattern. ' +
                        'This checkpoint verifies your GUI has the required structure:<br><br>' +
                        '1. A <code>class</code> definition that references <code>tkinter</code> or <code>tk</code><br>' +
                        '2. An <code>__init__</code> method that sets up the window<br>' +
                        '3. At least one widget reference (<code>Button</code>, <code>Label</code>, ' +
                        '<code>Entry</code>, or <code>Frame</code>)<br><br>' +
                        'Do not call <code>mainloop()</code> at the bottom of your code -- just ' +
                        'define the class structure. The sandbox cannot run Tkinter, so this ' +
                        'is a structural validation only.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 4 Checkpoint: GUI Structure\n' +
                        '# Paste your Tkinter GUI class below.\n' +
                        '# Required: class with tkinter, __init__, at least one widget.\n' +
                        '# Do NOT call mainloop() -- the sandbox cannot run Tkinter.\n\n' +
                        'import tkinter as tk\n\n' +
                        'class DashboardApp:\n' +
                        '    """Main GUI application for the IT Dashboard."""\n\n' +
                        '    def __init__(self, root):\n' +
                        '        self.root = root\n' +
                        '        self.root.title("IT Dashboard")\n\n' +
                        '        # Create widgets\n' +
                        '        self.header = tk.Label(root, text="IT Dashboard")\n' +
                        '        self.header.pack()\n\n' +
                        '        self.status_btn = tk.Button(root, text="Check Status")\n' +
                        '        self.status_btn.pack()\n',
                    hints       : [
                        'Import tkinter: import tkinter as tk',
                        'Your class needs __init__(self, root) to receive the Tk root window.',
                        'Create widgets with tk.Label(), tk.Button(), tk.Entry(), or tk.Frame().'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify a class definition with tkinter reference */
                            name  : 'Code defines a class that uses tkinter',
                            check : function(out, code) {
                                var hasClass = code.indexOf('class ') !== -1;
                                var hasTk    = code.indexOf('tkinter') !== -1 ||
                                               code.indexOf('tk.') !== -1;
                                return hasClass && hasTk;
                            }
                        },
                        {
                            /* Verify __init__ method exists */
                            name  : 'Code has __init__ method',
                            check : function(out, code) {
                                return code.indexOf('def __init__') !== -1;
                            }
                        },
                        {
                            /* Verify at least one Tkinter widget is referenced */
                            name  : 'Code references at least one widget (Button, Label, Entry, or Frame)',
                            check : function(out, code) {
                                return code.indexOf('Button') !== -1 ||
                                       code.indexOf('Label')  !== -1 ||
                                       code.indexOf('Entry')  !== -1 ||
                                       code.indexOf('Frame')  !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 3: Final Checklist (Code Review) ───────────
                   codeReview: true -- comprehensive structural validation
                   of the student's complete main.py. Tests verify the
                   presence of all major architectural patterns learned
                   across all 4 weeks: entry point, functions, classes,
                   and error handling.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w4-final-checklist',
                    title       : 'Final Checklist',
                    desc        : 'Validate your complete main.py architecture.',
                    difficulty  : 'easy',
                    xp          : 20,
                    parTime     : 300,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your complete main.py</strong> for the final project.<br><br>' +
                        'This is the capstone validation. Your code should demonstrate every ' +
                        'major pattern from the course:<br><br>' +
                        '1. <code>if __name__ == "__main__"</code> guard (Week 1)<br>' +
                        '2. <code>def main()</code> entry-point function (Week 1)<br>' +
                        '3. At least <strong>3 function definitions</strong> showing modular design (Week 2)<br>' +
                        '4. At least <strong>1 class definition</strong> showing OOP (Week 3)<br>' +
                        '5. At least <strong>1 try/except</strong> block for error handling (Week 4)<br><br>' +
                        'This is the minimum professional structure for a Python IT tool. ' +
                        'If any test fails, review that week\'s material and add the missing pattern.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 4 Checkpoint: Final Checklist\n' +
                        '# Paste your COMPLETE main.py below.\n' +
                        '# Required: __name__ guard, main(), 3+ functions, 1+ class, 1+ error handling.\n\n' +
                        '# Paste your code here...\n',
                    hints       : [
                        'Make sure your file has: if __name__ == "__main__": main()',
                        'Count your "def" statements -- you need at least 3 (including main).',
                        'You need at least one "class" definition and one "try/except" block.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify __name__ guard pattern from Week 1 */
                            name  : 'Has if __name__ == "__main__" guard',
                            check : function(out, code) {
                                return code.indexOf('__name__') !== -1 &&
                                       code.indexOf('__main__') !== -1;
                            }
                        },
                        {
                            /* Verify main() entry-point function from Week 1 */
                            name  : 'Has def main() function',
                            check : function(out, code) {
                                return code.indexOf('def main') !== -1;
                            }
                        },
                        {
                            /* Verify at least 3 function definitions (modular design) */
                            name  : 'Has at least 3 function definitions',
                            check : function(out, code) {
                                var defMatches = code.match(/def /g) || [];
                                return defMatches.length >= 3;
                            }
                        },
                        {
                            /* Verify at least 1 class definition (OOP from Week 3) */
                            name  : 'Has at least 1 class definition',
                            check : function(out, code) {
                                return code.indexOf('class ') !== -1;
                            }
                        },
                        {
                            /* Verify at least 1 try/except block (error handling) */
                            name  : 'Has at least 1 try/except block',
                            check : function(out, code) {
                                return code.indexOf('try:') !== -1 &&
                                       code.indexOf('except ') !== -1;
                            }
                        }
                    ]
                }
            ]
        });
    </script>

</body>
</html>
