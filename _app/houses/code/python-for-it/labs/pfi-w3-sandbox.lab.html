        /* ================================================================
           WEEK 3 SANDBOX — Functions, Scope & OOP
           Course: Python for IT (COP1034C)
           Module ID: pfi-w3-sandbox
           Total: 10 challenges, 220 XP base (up to ~300 XP with bonuses)
           Days covered: Day 7 (Functions), Day 8 (Scope), Day 9 (OOP)
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 3 Lab \u2014 Functions, Graphics & OOP',
            moduleId    : 'pfi-w3-sandbox',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1 ────────────────────────────────────────────
                   Tests: def, return, f-strings, basic function definition
                   Day 7 — the first function every student writes.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c1-greet',
                    title       : 'First Function',
                    desc        : 'Write and call a simple function that returns a greeting.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions: 'Write a function <code>greet(name)</code> that returns the string <code>"Hello, {name}!"</code>. ' +
                                  'Call it with the argument <code>"Python"</code> and print the result.',
                    expected    : 'Hello, Python!',
                    starter     : '# Define a function that builds a greeting\ndef greet(name):\n    # Return the greeting string (use an f-string)\n    pass\n\n# Call greet with "Python" and print the result\n',
                    hints: [
                        'Use def to define a function, then return the result.',
                        'f-strings let you embed variables: f"Hello, {name}!"',
                        'Call the function and wrap it in print(): print(greet("Python"))'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output is "Hello, Python!"',
                            check: function(out) { return out.trim() === 'Hello, Python!'; }
                        },
                        {
                            name : 'Code defines a function with "def"',
                            check: function(out, code) { return code.indexOf('def ') !== -1; }
                        },
                        {
                            /* return is the lesson — not just print inside the function */
                            name : 'Code uses "return"',
                            check: function(out, code) { return code.indexOf('return') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 2 ────────────────────────────────────────────
                   Tests: default parameter values, multiple call signatures
                   Day 7 — default args reduce repetition in IT automation.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c2-defaults',
                    title       : 'Default Parameters',
                    desc        : 'Write a function with default argument values.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 150,
                    instructions: 'Write <code>connect(host, port=22, protocol="SSH")</code> that returns ' +
                                  '<code>"Connecting to {host}:{port} via {protocol}"</code>.<br>' +
                                  'Call it three ways and print each result:<br>' +
                                  '1. <code>connect("192.168.1.1")</code><br>' +
                                  '2. <code>connect("192.168.1.1", 443)</code><br>' +
                                  '3. <code>connect("192.168.1.1", 8080, "HTTPS")</code>',
                    expected    : 'Connecting to 192.168.1.1:22 via SSH\nConnecting to 192.168.1.1:443 via SSH\nConnecting to 192.168.1.1:8080 via HTTPS',
                    starter     : '# Function with default parameters\ndef connect(host, port=22, protocol="SSH"):\n    # Return the formatted connection string\n    pass\n\n# Three calls: defaults only, custom port, all custom\n',
                    hints: [
                        'Default parameters go in the def line: def connect(host, port=22):',
                        'Return an f-string with all three values embedded.',
                        'Call 1 uses both defaults. Call 2 overrides port. Call 3 overrides both.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output has exactly 3 lines',
                            check: function(out) { return out.trim().split('\n').length === 3; }
                        },
                        {
                            /* First call uses defaults — port must be 22 */
                            name : 'First line uses default port 22',
                            check: function(out) { return out.trim().split('\n')[0].indexOf(':22 ') !== -1; }
                        },
                        {
                            name : 'Output contains "SSH"',
                            check: function(out) { return out.indexOf('SSH') !== -1; }
                        },
                        {
                            /* Enforce that defaults are in the signature, not hardcoded */
                            name : 'Code uses default parameters (port=22)',
                            check: function(out, code) { return code.indexOf('port=22') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 3 ────────────────────────────────────────────
                   Tests: *args, variadic functions, loop through unknown args
                   Day 7 — *args is essential for flexible IT logging.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c3-args',
                    title       : '*args Logger',
                    desc        : 'Use *args to accept a variable number of log messages.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions: 'Write <code>log_event(severity, *messages)</code> that prints each message ' +
                                  'prefixed with the severity in brackets.<br><br>' +
                                  'Call: <code>log_event("ERROR", "Disk full", "Backup failed", "Alert sent")</code><br><br>' +
                                  'Expected output (3 lines):<br>' +
                                  '<code>[ERROR] Disk full</code><br>' +
                                  '<code>[ERROR] Backup failed</code><br>' +
                                  '<code>[ERROR] Alert sent</code>',
                    expected    : '[ERROR] Disk full\n[ERROR] Backup failed\n[ERROR] Alert sent',
                    starter     : '# Event logger using *args for variadic messages\ndef log_event(severity, *messages):\n    # Loop through messages and print each with [severity] prefix\n    pass\n\n# Test call\nlog_event("ERROR", "Disk full", "Backup failed", "Alert sent")\n',
                    hints: [
                        '*args collects extra positional arguments into a tuple.',
                        'Loop through messages with: for msg in messages:',
                        'Print each as: print(f"[{severity}] {msg}")'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output has exactly 3 lines',
                            check: function(out) { return out.trim().split('\n').length === 3; }
                        },
                        {
                            /* Every line must have the severity prefix */
                            name : 'Every line starts with "[ERROR]"',
                            check: function(out) {
                                return out.trim().split('\n').every(function(line) {
                                    return line.indexOf('[ERROR]') === 0;
                                });
                            }
                        },
                        {
                            name : 'Code uses *args or *messages syntax',
                            check: function(out, code) { return code.indexOf('*messages') !== -1 || code.indexOf('*args') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 4 ────────────────────────────────────────────
                   Tests: sorted(), lambda key, descending sort, dict access
                   Day 7 — lambda + sorted is a Python power pattern.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c4-lambda',
                    title       : 'Lambda Sorter',
                    desc        : 'Sort a list of dicts by a field using a lambda key.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions: 'Given this list:<br>' +
                                  '<code>servers = [{"name": "web-01", "cpu": 87}, {"name": "db-01", "cpu": 23}, {"name": "cache-01", "cpu": 95}]</code><br><br>' +
                                  'Sort by <code>cpu</code> descending using <code>sorted()</code> with a <code>lambda</code> key. ' +
                                  'Print each server name and CPU on its own line:<br>' +
                                  '<code>cache-01: 95%</code><br>' +
                                  '<code>web-01: 87%</code><br>' +
                                  '<code>db-01: 23%</code>',
                    expected    : 'cache-01: 95%\nweb-01: 87%\ndb-01: 23%',
                    starter     : 'servers = [\n    {"name": "web-01", "cpu": 87},\n    {"name": "db-01", "cpu": 23},\n    {"name": "cache-01", "cpu": 95}\n]\n\n# Sort by cpu descending using sorted() and a lambda key\n# Then print each server as "name: cpu%"\n',
                    hints: [
                        'sorted() takes a key= argument for custom sort logic.',
                        'lambda s: s["cpu"] extracts the CPU value for comparison.',
                        'Add reverse=True to sort descending (highest first).'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* Descending means cache-01 (95%) comes first */
                            name : 'First line contains "cache-01" (highest CPU)',
                            check: function(out) { return out.trim().split('\n')[0].indexOf('cache-01') !== -1; }
                        },
                        {
                            name : 'Last line contains "db-01" (lowest CPU)',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines[lines.length - 1].indexOf('db-01') !== -1;
                            }
                        },
                        {
                            name : 'Code uses lambda',
                            check: function(out, code) { return code.indexOf('lambda') !== -1; }
                        },
                        {
                            name : 'Code uses sorted()',
                            check: function(out, code) { return code.indexOf('sorted(') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 5 ────────────────────────────────────────────
                   Tests: recursion, base case, self-referential function call
                   Day 7 — recursion is a fundamental CS concept.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c5-recursion',
                    title       : 'Recursive Factorial',
                    desc        : 'Implement factorial using recursion, not a loop.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 300,
                    instructions: 'Write a recursive function <code>factorial(n)</code> that returns <code>n!</code>.<br><br>' +
                                  'Rules: you MUST call <code>factorial()</code> inside itself. No <code>for</code> or <code>while</code> loops allowed.<br><br>' +
                                  'Print both results:<br>' +
                                  '<code>factorial(5)</code> should output <code>120</code><br>' +
                                  '<code>factorial(0)</code> should output <code>1</code>',
                    expected    : '120\n1',
                    starter     : '# Recursive factorial — the function must call itself\ndef factorial(n):\n    # Base case: what is factorial(0)?\n    # Recursive case: n * factorial(n - 1)\n    pass\n\nprint(factorial(5))\nprint(factorial(0))\n',
                    hints: [
                        'The base case is: if n == 0, return 1.',
                        'The recursive case is: return n * factorial(n - 1).',
                        'No loops allowed — the recursion IS the repetition.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains 120',
                            check: function(out) { return out.indexOf('120') !== -1; }
                        },
                        {
                            name : 'Output contains 1 (factorial of 0)',
                            check: function(out) { return out.trim().split('\n').some(function(l) { return l.trim() === '1'; }); }
                        },
                        {
                            /* Strip the def line, then verify factorial() is called in the body */
                            name : 'Code calls factorial() inside itself (recursion)',
                            check: function(out, code) {
                                var body = code.replace(/def factorial\(.*?\):/, '');
                                return body.indexOf('factorial(') !== -1;
                            }
                        },
                        {
                            /* Loops are banned — recursion only */
                            name : 'No for or while loops used',
                            check: function(out, code) { var noComments = code.replace(/#.*/g, ''); return noComments.indexOf('for ') === -1 && noComments.indexOf('while ') === -1; }
                        }
                    ]
                },

                /* ── Challenge 6 ────────────────────────────────────────────
                   Tests: local vs global scope, variable shadowing
                   Day 8 — scope bugs are the #1 surprise for new programmers.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c6-scope',
                    title       : 'Scope Detective',
                    desc        : 'Understand how local vs. global scope affects variable values.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 120,
                    instructions: 'Type and run the following code exactly as written, then study the output:<br><br>' +
                                  '<code>x = 10</code><br>' +
                                  '<code>def modify():</code><br>' +
                                  '<code>&nbsp;&nbsp;&nbsp;&nbsp;x = 20</code><br>' +
                                  '<code>&nbsp;&nbsp;&nbsp;&nbsp;print(f"Inside: {x}")</code><br>' +
                                  '<code>modify()</code><br>' +
                                  '<code>print(f"Outside: {x}")</code><br><br>' +
                                  'The local <code>x = 20</code> inside <code>modify()</code> does NOT change the global <code>x</code>.',
                    expected    : 'Inside: 20\nOutside: 10',
                    starter     : '# Scope demonstration — do NOT use the global keyword here\nx = 10\n\ndef modify():\n    x = 20\n    print(f"Inside: {x}")\n\nmodify()\nprint(f"Outside: {x}")\n',
                    hints: [
                        'The code is already written in the starter — just run it.',
                        'x = 20 inside the function creates a LOCAL variable, not modifying the global.',
                        'After modify() returns, the global x is still 10.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output is "Inside: 20" then "Outside: 10"',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines[0].trim() === 'Inside: 20' && lines[1].trim() === 'Outside: 10';
                            }
                        },
                        {
                            name : 'Code contains both print statements',
                            check: function(out, code) {
                                return code.indexOf('Inside') !== -1 && code.indexOf('Outside') !== -1;
                            }
                        },
                        {
                            name : 'Code defines a function',
                            check: function(out, code) { return code.indexOf('def ') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 7 ────────────────────────────────────────────
                   Tests: multiple functions, validation logic, IP/port/hostname
                   Day 7 — building a reusable validation library.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c7-validators',
                    title       : 'Data Validator Library',
                    desc        : 'Build three validation functions for network inputs.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 420,
                    instructions: 'Write three functions:<br>' +
                                  '<code>is_valid_ip(ip)</code> — True if all 4 octets are 0-255<br>' +
                                  '<code>is_valid_port(port)</code> — True if port is 1-65535<br>' +
                                  '<code>is_valid_hostname(name)</code> — True if 1-63 chars, alphanumeric + hyphens only<br><br>' +
                                  'Test and print results for valid and invalid inputs. Your output must include:<br>' +
                                  '<code>192.168.1.1</code> as <code>True</code>, <code>999.1.1.1</code> as <code>False</code>,<br>' +
                                  'port <code>80</code> as <code>True</code>, port <code>0</code> as <code>False</code>.',
                    expected    : '(open-ended — any valid output with True/False for each test)',
                    starter     : '# Network input validation library\n\ndef is_valid_ip(ip):\n    """Return True if ip has 4 octets, each 0-255."""\n    pass\n\ndef is_valid_port(port):\n    """Return True if port is between 1 and 65535 inclusive."""\n    pass\n\ndef is_valid_hostname(name):\n    """Return True if name is 1-63 chars, alphanumeric + hyphens."""\n    pass\n\n# Test each function with valid and invalid inputs\nprint(is_valid_ip("192.168.1.1"))   # True\nprint(is_valid_ip("999.1.1.1"))     # False\nprint(is_valid_port(80))            # True\nprint(is_valid_port(0))             # False\nprint(is_valid_hostname("web-01"))  # True\nprint(is_valid_hostname(""))        # False\n',
                    hints: [
                        'Split the IP on "." and check that each part is an int between 0 and 255.',
                        'Port validation is simple: return 1 <= port <= 65535.',
                        'For hostname: check len() is 1-63 and use replace("-","").isalnum().'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : '"192.168.1.1" validates as True',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 1 && lines[0].trim() === 'True';
                            }
                        },
                        {
                            name : '"999.1.1.1" validates as False',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 2 && lines[1].trim() === 'False';
                            }
                        },
                        {
                            name : 'Port 80 validates as True',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 3 && lines[2].trim() === 'True';
                            }
                        },
                        {
                            name : 'Port 0 validates as False',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 4 && lines[3].trim() === 'False';
                            }
                        },
                        {
                            /* Hostname "web-01" should be valid (True on line 5) */
                            name : 'Hostname "web-01" validates as True',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 5 && lines[4].trim() === 'True';
                            }
                        },
                        {
                            /* Empty hostname should be invalid (False on line 6) */
                            name : 'Empty hostname validates as False',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 6 && lines[5].trim() === 'False';
                            }
                        },
                        {
                            /* Must define all three validator functions */
                            name : 'Code defines at least 3 functions',
                            check: function(out, code) {
                                var matches = code.match(/def\s+\w+/g);
                                return matches && matches.length >= 3;
                            }
                        }
                    ]
                },

                /* ── Challenge 8 ────────────────────────────────────────────
                   Tests: class, __init__, self, __str__, instance methods
                   Day 9 — first OOP challenge, building a real class.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c8-class',
                    title       : 'Class Builder',
                    desc        : 'Create a Server class with attributes and methods.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 300,
                    instructions: 'Create a <code>Server</code> class with:<br>' +
                                  '- <code>__init__(self, hostname, ip)</code> — stores hostname, ip, sets <code>status = "offline"</code><br>' +
                                  '- <code>boot(self)</code> — sets status to <code>"online"</code> and prints <code>"Booting {hostname}..."</code><br>' +
                                  '- <code>__str__(self)</code> — returns <code>"{hostname} ({ip}) - {status}"</code><br><br>' +
                                  'Create two servers. Boot the first one. Print both using <code>print()</code>.',
                    expected    : '(open-ended — must show Booting, online, and offline)',
                    starter     : '# Server class definition\nclass Server:\n    def __init__(self, hostname, ip):\n        # Store hostname, ip; default status to "offline"\n        pass\n\n    def boot(self):\n        # Set status to "online" and print the boot message\n        pass\n\n    def __str__(self):\n        # Return formatted string: "hostname (ip) - status"\n        pass\n\n# Create two Server instances\ns1 = Server("web-01", "10.0.0.1")\ns2 = Server("db-01", "10.0.0.2")\n\n# Boot the first server, then print both\ns1.boot()\nprint(s1)\nprint(s2)\n',
                    hints: [
                        'In __init__, use self.hostname = hostname to store attributes.',
                        'boot() changes self.status to "online" and prints the message.',
                        '__str__ must return a string, not print it: return f"{self.hostname} ..."'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "Booting"',
                            check: function(out) { return out.indexOf('Booting') !== -1; }
                        },
                        {
                            name : 'Output contains "online" (booted server)',
                            check: function(out) { return out.indexOf('online') !== -1; }
                        },
                        {
                            name : 'Output contains "offline" (unbooted server)',
                            check: function(out) { return out.indexOf('offline') !== -1; }
                        },
                        {
                            name : 'Code defines a class',
                            check: function(out, code) { return code.indexOf('class ') !== -1; }
                        },
                        {
                            name : 'Code defines __init__ with self',
                            check: function(out, code) { return code.indexOf('def __init__(self') !== -1; }
                        },
                        {
                            /* self.attribute is the OOP fundamental */
                            name : 'Code uses self for attributes',
                            check: function(out, code) { return code.indexOf('self.') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 9 ────────────────────────────────────────────
                   Tests: inheritance, super().__init__(), method override, class hierarchy
                   Day 9 — inheritance models real network device taxonomies.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-c9-inherit',
                    title       : 'Inheritance Network',
                    desc        : 'Build a class hierarchy with a base class and two subclasses.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 420,
                    instructions: 'Create:<br>' +
                                  '1. <code>NetworkDevice(hostname, ip, device_type)</code> — base class<br>' +
                                  '2. <code>Router(NetworkDevice)</code> — adds a <code>routes</code> list and <code>add_route(destination)</code><br>' +
                                  '3. <code>Switch(NetworkDevice)</code> — adds a <code>vlans</code> list and <code>add_vlan(vlan_id)</code><br><br>' +
                                  'Both subclasses must override <code>__str__</code> to show their specific data. ' +
                                  'Use <code>super().__init__()</code> in each subclass. ' +
                                  'Demo: create one Router, add a route, create one Switch, add a VLAN, print both.',
                    expected    : '(open-ended — must show route/VLAN data and use inheritance)',
                    starter     : '# Base class for all network devices\nclass NetworkDevice:\n    def __init__(self, hostname, ip, device_type):\n        self.hostname = hostname\n        self.ip = ip\n        self.device_type = device_type\n\n    def __str__(self):\n        return f"{self.device_type}: {self.hostname} ({self.ip})"\n\n\n# Router subclass — inherits from NetworkDevice\nclass Router(NetworkDevice):\n    def __init__(self, hostname, ip):\n        super().__init__(hostname, ip, "Router")\n        self.routes = []\n\n    def add_route(self, destination):\n        # Append destination to routes\n        pass\n\n    def __str__(self):\n        # Show hostname, ip, and number of routes\n        pass\n\n\n# Switch subclass — inherits from NetworkDevice\nclass Switch(NetworkDevice):\n    def __init__(self, hostname, ip):\n        super().__init__(hostname, ip, "Switch")\n        self.vlans = []\n\n    def add_vlan(self, vlan_id):\n        # Append vlan_id to vlans\n        pass\n\n    def __str__(self):\n        # Show hostname, ip, and VLAN list\n        pass\n\n\n# Demo\nr1 = Router("core-rtr-01", "10.0.0.1")\nr1.add_route("192.168.0.0/24")\n\nsw1 = Switch("dist-sw-01", "10.0.0.2")\nsw1.add_vlan(10)\nsw1.add_vlan(20)\n\nprint(r1)\nprint(sw1)\n',
                    hints: [
                        'super().__init__() calls the parent class constructor.',
                        'Override __str__ in each subclass to show type-specific data.',
                        'add_route just does self.routes.append(destination).'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Code defines at least 3 classes',
                            check: function(out, code) {
                                var matches = code.match(/class\s+\w+/g);
                                return matches && matches.length >= 3;
                            }
                        },
                        {
                            /* Inheritance syntax is the lesson */
                            name : 'Code uses inheritance: Router(NetworkDevice)',
                            check: function(out, code) { return code.indexOf('Router(NetworkDevice)') !== -1; }
                        },
                        {
                            name : 'Code uses super().__init__()',
                            check: function(out, code) { return code.indexOf('super().__init__') !== -1; }
                        },
