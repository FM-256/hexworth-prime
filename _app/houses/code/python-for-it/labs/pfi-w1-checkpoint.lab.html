<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control: students must be in a sorted house -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync across devices -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Checkpoint | Python for IT</title>

    <style>
        /* Viewport lock -- PythonSandbox.js fills 100% of the screen */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 1 Checkpoint</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           WEEK 1 CHECKPOINT -- CLI Menu & System Info
           Course: Python for IT (COP1034C)
           Module ID: pfi-w1-checkpoint
           Total: 3 challenges -- validates Week 1 project structure.

           Purpose: Students paste code from their Week 1 project (CLI
           dashboard) and the sandbox validates structural patterns.
           Challenges 1 and 2 are code-review only (no execution).
           Challenge 3 is an executable test for version metadata.
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 1 Checkpoint \u2014 CLI Menu & System Info',
            moduleId    : 'pfi-w1-checkpoint',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1: Welcome Message (Code Review) ───────────
                   codeReview: true -- validates that the student's main.py
                   has the required entry-point architecture: a named
                   constant, a main() function, and an __name__ guard.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w1-welcome-msg',
                    title       : 'Welcome Message',
                    desc        : 'Validate your main.py entry-point structure.',
                    difficulty  : 'easy',
                    xp          : 15,
                    parTime     : 180,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your main.py</strong> from the Week 1 project into the editor.<br><br>' +
                        'This checkpoint verifies three foundational patterns every Python ' +
                        'CLI application should have:<br><br>' +
                        '1. An <code>APP_NAME</code> constant at the top of the file<br>' +
                        '2. A <code>def main()</code> function that serves as the entry point<br>' +
                        '3. An <code>if __name__ == "__main__"</code> guard that calls main()<br><br>' +
                        'These patterns ensure your script is importable as a module and ' +
                        'only runs when executed directly.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 1 Checkpoint: Welcome Message\n' +
                        '# Paste your main.py code below.\n' +
                        '# Required: APP_NAME constant, main() function, __name__ guard.\n\n' +
                        'APP_NAME = "IT Dashboard"\n\n' +
                        'def main():\n' +
                        '    print(f"Welcome to {APP_NAME}")\n\n' +
                        'if __name__ == "__main__":\n' +
                        '    main()\n',
                    hints       : [
                        'APP_NAME should be a string constant defined near the top of your file.',
                        'def main(): is the standard entry-point function. All startup logic goes inside it.',
                        'if __name__ == "__main__": main() -- this guard prevents code from running on import.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify the APP_NAME constant exists */
                            name  : 'Code defines an APP_NAME variable',
                            check : function(out, code) {
                                return code.indexOf('APP_NAME') !== -1 &&
                                       code.indexOf('APP_NAME =') !== -1;
                            }
                        },
                        {
                            /* Verify a main() function is defined */
                            name  : 'Code defines a main() function',
                            check : function(out, code) {
                                return code.indexOf('def main') !== -1;
                            }
                        },
                        {
                            /* Verify the __name__ guard is present */
                            name  : 'Code has if __name__ == "__main__" guard',
                            check : function(out, code) {
                                return code.indexOf('__name__') !== -1 &&
                                       code.indexOf('__main__') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 2: Menu System (Code Review) ───────────────
                   codeReview: true -- validates that the student built an
                   interactive menu loop with user input and at least three
                   selectable options.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w1-menu-system',
                    title       : 'Menu System',
                    desc        : 'Validate your interactive menu loop structure.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 300,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste the menu section</strong> of your Week 1 project.<br><br>' +
                        'A proper CLI menu needs three things:<br>' +
                        '1. A <code>while</code> loop that keeps the menu running until the user exits<br>' +
                        '2. An <code>input()</code> call that reads the user\'s choice<br>' +
                        '3. At least three menu options (e.g., System Info, Help, Exit)<br><br>' +
                        'Your code should show numbered options and respond to user input. ' +
                        'The loop should exit cleanly when the user selects the quit option.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 1 Checkpoint: Menu System\n' +
                        '# Paste your menu loop code below.\n' +
                        '# Required: while loop, input() call, 3+ menu options.\n\n' +
                        'def show_menu():\n' +
                        '    """Display the main menu and handle user choices."""\n' +
                        '    running = True\n' +
                        '    while running:\n' +
                        '        print("\\n--- IT Dashboard Menu ---")\n' +
                        '        print("1. System Info")\n' +
                        '        print("2. Help")\n' +
                        '        print("3. Exit")\n' +
                        '        choice = input("Select an option: ")\n\n' +
                        '        if choice == "1":\n' +
                        '            print("Displaying system info...")\n' +
                        '        elif choice == "2":\n' +
                        '            print("Showing help...")\n' +
                        '        elif choice == "3":\n' +
                        '            running = False\n' +
                        '        else:\n' +
                        '            print("Invalid option.")\n',
                    hints       : [
                        'Use "while True:" or "while running:" to keep the menu looping.',
                        'choice = input("Select an option: ") reads user input as a string.',
                        'Use if/elif/else to branch on the user\'s choice. Include at least 3 options plus an exit.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify a while loop is present */
                            name  : 'Code contains a while loop',
                            check : function(out, code) {
                                return code.indexOf('while True') !== -1 ||
                                       code.indexOf('while running') !== -1 ||
                                       code.indexOf('while not') !== -1;
                            }
                        },
                        {
                            /* Verify input() is used to read user choice */
                            name  : 'Code uses input() to read user choice',
                            check : function(out, code) {
                                return code.indexOf('input(') !== -1;
                            }
                        },
                        {
                            /* Verify at least 3 menu options exist */
                            name  : 'Code has at least 3 menu options',
                            check : function(out, code) {
                                // Check for numbered options or named option strings
                                var hasNumbers = code.indexOf('"1"') !== -1 &&
                                                 code.indexOf('"2"') !== -1 &&
                                                 code.indexOf('"3"') !== -1;
                                var hasNames   = code.indexOf('System Info') !== -1 ||
                                                 code.indexOf('Help') !== -1 ||
                                                 code.indexOf('Exit') !== -1;
                                // At least two elif/else branches suggest 3+ paths
                                var elifCount  = (code.match(/elif/g) || []).length;
                                return hasNumbers || (hasNames && elifCount >= 2);
                            }
                        }
                    ]
                },

                /* ── Challenge 3: Version & Metadata (Executable) ─────────
                   Regular execution -- student writes an f-string to print
                   the application name and version. Output is tested.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w1-version-meta',
                    title       : 'Version & Metadata',
                    desc        : 'Print your app name and version with an f-string.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions:
                        'Every professional application tracks its version number.<br><br>' +
                        'The starter code defines two constants:<br>' +
                        '<code>APP_NAME = "IT Dashboard"</code><br>' +
                        '<code>VERSION = "0.1.0"</code><br><br>' +
                        '<strong>Your task:</strong> Write a single <code>print()</code> statement using an ' +
                        'f-string that outputs exactly:<br>' +
                        '<code>IT Dashboard v0.1.0</code><br><br>' +
                        'F-strings let you embed variables directly: ' +
                        '<code>print(f"{variable} text")</code>',
                    expected    : 'IT Dashboard v0.1.0',
                    starter     :
                        '# Week 1 Checkpoint: Version & Metadata\n' +
                        '# Use an f-string to print the app name and version.\n\n' +
                        'APP_NAME = "IT Dashboard"\n' +
                        'VERSION = "0.1.0"\n\n' +
                        '# Print: IT Dashboard v0.1.0\n',
                    hints       : [
                        'F-strings start with f before the opening quote: f"text {variable}"',
                        'Combine both variables: f"{APP_NAME} v{VERSION}"',
                        'Full answer: print(f"{APP_NAME} v{VERSION}")'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify exact output matches expected format */
                            name  : 'Output is "IT Dashboard v0.1.0"',
                            check : function(out) {
                                return out.trim() === 'IT Dashboard v0.1.0';
                            }
                        },
                        {
                            /* Verify student uses the variables, not hardcoded string */
                            name  : 'Code references APP_NAME and VERSION variables',
                            check : function(out, code) {
                                return code.indexOf('APP_NAME') !== -1 &&
                                       code.indexOf('VERSION') !== -1 &&
                                       code.indexOf('print') !== -1;
                            }
                        }
                    ]
                }
            ]
        });
    </script>

</body>
</html>
