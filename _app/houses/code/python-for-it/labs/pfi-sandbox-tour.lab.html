<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control: students must be in a sorted house -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync across devices -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Tour | Python for IT</title>

    <style>
        /* Viewport lock — PythonSandbox.js fills 100% of the screen */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Sandbox Tour</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           SANDBOX GUIDED TOUR
           Course: Python for IT (COP1034C)
           Module ID: pfi-sandbox-tour
           Total: 6 challenges — teaches the sandbox interface step by step.
           Purpose: Run this BEFORE Week 1 Lab so students know how the
                    editor, Run/Submit buttons, hints, errors, and variable
                    inspector work. Designed to be completed in 10-15 minutes.
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Sandbox Tour \u2014 Learn the IDE',
            moduleId    : 'pfi-sandbox-tour',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Tour Step 1: The Editor & Run Button ──────────────────
                   Teaches: typing code in the editor, clicking Run, reading
                   output in the Output tab. The simplest possible task.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-editor',
                    title       : 'Step 1: The Editor',
                    desc        : 'Type code and click Run to see it execute.',
                    difficulty  : 'easy',
                    xp          : 5,
                    parTime     : 120,
                    instructions:
                        '<strong>Welcome to the Python Sandbox!</strong><br><br>' +
                        'This is your in-browser Python environment. The left panel ' +
                        'shows challenges. The center is your code editor. The bottom ' +
                        'shows output.<br><br>' +
                        '<strong>Your task:</strong> Type the following code in the editor, ' +
                        'then click the <strong>Run</strong> button (or press Ctrl+Enter):<br><br>' +
                        '<code>print("Hello from the sandbox!")</code><br><br>' +
                        'Look at the <strong>Output</strong> tab below the editor. ' +
                        'You should see your message appear. Once it works, click ' +
                        '<strong>Submit</strong> to pass this challenge.',
                    expected    : 'Hello from the sandbox!',
                    starter     : '# Type your code below and click Run\n',
                    hints       : [
                        'Use the print() function with your message inside quotes.',
                        'Make sure the text inside quotes matches exactly: Hello from the sandbox!'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'Output matches expected text',
                            check : function(out) {
                                return out.trim() === 'Hello from the sandbox!';
                            }
                        }
                    ]
                },

                /* ── Tour Step 2: Run vs Submit ────────────────────────────
                   Teaches: the difference between Run (no grading) and Submit
                   (runs tests, awards XP). Students learn to experiment with
                   Run before submitting.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-submit',
                    title       : 'Step 2: Run vs Submit',
                    desc        : 'Learn the difference between Run and Submit.',
                    difficulty  : 'easy',
                    xp          : 5,
                    parTime     : 120,
                    instructions:
                        '<strong>Run</strong> executes your code and shows the output. ' +
                        'It does not grade anything — use it to experiment freely.<br><br>' +
                        '<strong>Submit</strong> executes your code AND runs automated tests. ' +
                        'If all tests pass, you earn XP. If any fail, you can fix your code ' +
                        'and submit again (unlimited attempts).<br><br>' +
                        '<strong>Your task:</strong> Write code that prints exactly two lines:<br>' +
                        '<code>Line 1</code><br><code>Line 2</code><br><br>' +
                        'Try clicking <strong>Run</strong> first to check your output. ' +
                        'Then click <strong>Submit</strong> when you are confident it is correct. ' +
                        'After submitting, check the <strong>Tests</strong> tab to see which tests passed.',
                    expected    : 'Line 1\nLine 2',
                    starter     : '# Print two lines. Use two print() calls.\n',
                    hints       : [
                        'Each print() call outputs one line. Call print() twice.',
                        'print("Line 1")  then  print("Line 2")'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'First line is "Line 1"',
                            check : function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 1 && lines[0].trim() === 'Line 1';
                            }
                        },
                        {
                            name  : 'Second line is "Line 2"',
                            check : function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 2 && lines[1].trim() === 'Line 2';
                            }
                        }
                    ]
                },

                /* ── Tour Step 3: Using Hints ──────────────────────────────
                   Teaches: the hint system. Students click Hint to get
                   progressive help. Each hint costs 5 XP at submit time.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-hints',
                    title       : 'Step 3: Using Hints',
                    desc        : 'Stuck? Hints help — but they cost XP.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 180,
                    instructions:
                        'Every challenge has hints you can reveal by clicking the ' +
                        '<strong>Hint</strong> button below these instructions.<br><br>' +
                        'Hints are progressive — Hint 1 is a gentle nudge, Hint 2 is ' +
                        'more specific, and Hint 3 (if it exists) nearly gives the answer.<br><br>' +
                        '<strong>Tradeoff:</strong> Each hint you reveal costs 5 XP when you submit. ' +
                        'If you can solve it without hints, you keep the full XP.<br><br>' +
                        '<strong>Your task:</strong> Calculate and print the result of 2 raised to the ' +
                        'power of 10. The output should be a single number.<br><br>' +
                        'If you are not sure how to do exponents in Python, try clicking ' +
                        '<strong>Hint</strong> to find out!',
                    expected    : '1024',
                    starter     : '# Calculate 2 to the power of 10 and print the result\n',
                    hints       : [
                        'Python uses ** for exponents (not ^ like some other languages).',
                        'The expression is: 2 ** 10',
                        'Full answer: print(2 ** 10)'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'Output is 1024',
                            check : function(out) {
                                return out.trim() === '1024';
                            }
                        }
                    ]
                },

                /* ── Tour Step 4: Reading Errors ───────────────────────────
                   Teaches: the error translator. Students intentionally trigger
                   an error and learn to read the friendly explanation + raw
                   Python traceback.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-errors',
                    title       : 'Step 4: Reading Errors',
                    desc        : 'Errors happen. Learn to read them.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 180,
                    instructions:
                        'When your code has a bug, Python throws an error. This sandbox ' +
                        'translates common errors into plain English so you can fix them faster.<br><br>' +
                        '<strong>Try this first:</strong> Click Run with the starter code below. ' +
                        'It has a bug on purpose. Read the error message in the Output tab.<br><br>' +
                        'The error will say something like: <em>"Variable Error: You used a variable ' +
                        'called \'mesage\' but never created it."</em><br><br>' +
                        '<strong>Your task:</strong> Fix the bug so the code prints: ' +
                        '<code>Errors are teachers.</code><br><br>' +
                        'Below the friendly message, you will also see the raw Python error. ' +
                        'As you grow more experienced, you will read the raw error directly.',
                    expected    : 'Errors are teachers.',
                    starter     : '# This code has a bug. Run it, read the error, and fix it.\nmessage = "Errors are teachers."\nprint(mesage)\n',
                    hints       : [
                        'Look at the variable name on line 2 vs line 3. Spelling matters.',
                        'Line 2 creates "message" but line 3 prints "mesage" (missing an s).',
                        'Fix line 3: print(message)'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'Output is "Errors are teachers."',
                            check : function(out) {
                                return out.trim() === 'Errors are teachers.';
                            }
                        }
                    ]
                },

                /* ── Tour Step 5: Variable Inspector ───────────────────────
                   Teaches: the right-side panel that shows all variables after
                   code execution. Students create variables and see their
                   types and values in real time.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-inspector',
                    title       : 'Step 5: Variable Inspector',
                    desc        : 'See your variables come to life.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 180,
                    instructions:
                        'Look at the right side panel — that is the <strong>Variable Inspector</strong>.<br><br>' +
                        'After you click Run or Submit, it shows every variable your code created: ' +
                        'the name, the type (str, int, float, list, etc.), and the current value.<br><br>' +
                        '<strong>Your task:</strong> Create three variables and print them:<br>' +
                        '<code>name</code> — a string with your first name<br>' +
                        '<code>age</code> — an integer with your age<br>' +
                        '<code>gpa</code> — a float (e.g., 3.5)<br><br>' +
                        'After running, check the Variable Inspector. You should see all three ' +
                        'variables with their types color-coded (green = str, blue = int, cyan = float).<br><br>' +
                        'For the test to pass, just make sure all three variables exist and print ' +
                        'them on separate lines.',
                    expected    : '',
                    starter     : '# Create three variables and print each one\nname = ""\nage = 0\ngpa = 0.0\n\nprint(name)\nprint(age)\nprint(gpa)\n',
                    hints       : [
                        'Replace the empty/zero values with your real info. name = "Alex"',
                        'Make sure age is a whole number (int) and gpa has a decimal point (float).',
                        'Example: name = "Alex"  age = 20  gpa = 3.5  — then print each one.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'Code creates a "name" variable (string)',
                            check : function(out, code) {
                                // Variable must be assigned a non-empty string
                                return code.indexOf('name =') !== -1 &&
                                       code.indexOf('name = ""') === -1;
                            }
                        },
                        {
                            name  : 'Code creates an "age" variable (integer)',
                            check : function(out, code) {
                                return code.indexOf('age =') !== -1 &&
                                       code.indexOf('age = 0') === -1;
                            }
                        },
                        {
                            name  : 'Code creates a "gpa" variable (float)',
                            check : function(out, code) {
                                return code.indexOf('gpa =') !== -1 &&
                                       code.indexOf('gpa = 0.0') === -1;
                            }
                        },
                        {
                            name  : 'Output has at least 3 lines (one per variable)',
                            check : function(out) {
                                var lines = out.trim().split('\n').filter(function(l) {
                                    return l.trim().length > 0;
                                });
                                return lines.length >= 3;
                            }
                        }
                    ]
                },

                /* ── Tour Step 6: Putting It All Together ──────────────────
                   A real mini-challenge that uses everything learned in the
                   tour: variables, print, math, and input. The first "real"
                   coding exercise.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'tour-finale',
                    title       : 'Step 6: Your First Real Challenge',
                    desc        : 'Combine everything you just learned.',
                    difficulty  : 'medium',
                    xp          : 15,
                    parTime     : 300,
                    instructions:
                        'You now know how to:<br>' +
                        '- Type code in the editor<br>' +
                        '- Run code to see output<br>' +
                        '- Submit code for grading<br>' +
                        '- Use hints when stuck<br>' +
                        '- Read error messages<br>' +
                        '- Check the Variable Inspector<br><br>' +
                        '<strong>Your task:</strong> Write a program that:<br>' +
                        '1. Creates a variable <code>server_count</code> set to <code>50</code><br>' +
                        '2. Creates a variable <code>online_count</code> set to <code>47</code><br>' +
                        '3. Calculates the uptime percentage: <code>(online / total) * 100</code><br>' +
                        '4. Prints exactly: <code>Uptime: 94.0%</code><br><br>' +
                        'This is the kind of calculation IT professionals do daily. ' +
                        'You just automated it with 4 lines of Python.',
                    expected    : 'Uptime: 94.0%',
                    starter     : '# Server uptime calculator\nserver_count = 50\nonline_count = 47\n\n# Calculate uptime percentage and print it\n',
                    hints       : [
                        'Divide online_count by server_count, then multiply by 100.',
                        'uptime = (online_count / server_count) * 100',
                        'print(f"Uptime: {uptime}%")  — f-strings let you embed variables in text.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            name  : 'Output contains "Uptime: 94.0%"',
                            check : function(out) {
                                return out.trim() === 'Uptime: 94.0%';
                            }
                        },
                        {
                            name  : 'Code uses server_count and online_count variables',
                            check : function(out, code) {
                                return code.indexOf('server_count') !== -1 &&
                                       code.indexOf('online_count') !== -1;
                            }
                        }
                    ]
                }
            ]
        });
    </script>


    <div style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid rgba(255,255,255,0.08);">
        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────
         Always-visible chat entry point. State machine is attempt-driven;
         button stays calm and serves as a general chat entry until lab
         activity ticks the mood-ring.
         Docs: _docs/operations/dr-hex-button-integration.md           ── -->
    <hex-ai-button mission-id="pfi-sandbox-tour" house="code"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
