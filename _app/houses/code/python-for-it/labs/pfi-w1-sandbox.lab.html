<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control: students must be in a sorted house to access this lab -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync across devices -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Lab: Python Basics | Python for IT</title>

    <style>
        /* Viewport lock — PythonSandbox.js fills 100% of the screen */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 1 Lab: Python Basics</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine: all layout, state, and Pyodide loading live here -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           WEEK 1 SANDBOX — Data Types, Conditionals, Loops
           Course: Python for IT (COP1034C)
           Module ID: pfi-w1-sandbox
           Total: 10 challenges, ~180 XP base (up to ~240 XP with bonuses)
           Days covered: Day 1 (Data Types), Day 2 (Conditionals), Day 3 (Loops)
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 1 Lab \u2014 Data Types, Conditionals & Loops',
            moduleId    : 'pfi-w1-sandbox',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1 ────────────────────────────────────────────
                   Tests: print(), string literals, exact output matching
                   Day 1 — the very first Python program every student writes.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'hello-world',
                    title       : 'Hello, World!',
                    desc        : 'Print your first Python message to the screen.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 60,
                    instructions: 'Write a program that prints exactly: <code>Hello, World!</code>',
                    expected    : 'Hello, World!',
                    starter     : '# Your first Python program!\n',
                    hints: [
                        'Use the print() function.',
                        'The text needs to be in quotes \u2014 single or double both work.',
                        'print("Hello, World!") \u2014 don\'t forget the comma and exclamation mark.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* Exact match: no extra text, no missing punctuation */
                            name : 'Output is exactly "Hello, World!"',
                            check: function(out) {
                                return out.trim() === 'Hello, World!';
                            }
                        }
                    ]
                },

                /* ── Challenge 2 ────────────────────────────────────────────
                   Tests: variable assignment, type(), print(), str/int/bool types
                   Students must produce 6 lines: value then type for each variable.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'variables-and-types',
                    title       : 'Variables & Types',
                    desc        : 'Create three variables and print each value and its type.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions: 'Create three variables: <code>name = "Hexworth"</code>, ' +
                                  '<code>version = 6</code>, <code>is_active = True</code>. ' +
                                  'Print each variable\'s value AND type using <code>type()</code>. ' +
                                  'Output should be 6 lines.',
                    expected    : 'Hexworth\n<class \'str\'>\n6\n<class \'int\'>\nTrue\n<class \'bool\'>',
                    starter     : '# Create three variables and print their values and types\n',
                    hints: [
                        'Use print(variable) to print a value.',
                        'Use print(type(variable)) to print its type.',
                        'You need 6 print statements: value then type for each variable.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "Hexworth"',
                            check: function(out) { return out.indexOf('Hexworth') !== -1; }
                        },
                        {
                            name : 'Output contains "<class \'str\'>"',
                            check: function(out) { return out.indexOf("<class 'str'>") !== -1; }
                        },
                        {
                            name : 'Output contains "6"',
                            check: function(out) { return out.indexOf('6') !== -1; }
                        },
                        {
                            name : 'Output contains "<class \'int\'>"',
                            check: function(out) { return out.indexOf("<class 'int'>") !== -1; }
                        },
                        {
                            name : 'Output contains "True"',
                            check: function(out) { return out.indexOf('True') !== -1; }
                        },
                        {
                            name : 'Output contains "<class \'bool\'>"',
                            check: function(out) { return out.indexOf("<class 'bool'>") !== -1; }
                        }
                    ]
                },

                /* ── Challenge 3 ────────────────────────────────────────────
                   Tests: f-strings, variable interpolation, format discipline
                   Students must produce an exact formatted report string.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'fstring-report',
                    title       : 'F-String Report',
                    desc        : 'Build a server status line using f-strings.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions: 'Create variables <code>server = "WEB-01"</code>, ' +
                                  '<code>cpu = 87.5</code>, <code>status = "running"</code>. ' +
                                  'Print this formatted report using an f-string:<br>' +
                                  '<code>Server WEB-01 | CPU: 87.5% | Status: running</code>',
                    expected    : 'Server WEB-01 | CPU: 87.5% | Status: running',
                    starter     : '# Create variables and build the report with f-strings\n',
                    hints: [
                        'f-strings start with f" before the opening quote.',
                        'Put variables inside {curly braces} in the f-string.',
                        'f"Server {server} | CPU: {cpu}% | Status: {status}"'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "Server WEB-01"',
                            check: function(out) { return out.indexOf('Server WEB-01') !== -1; }
                        },
                        {
                            name : 'Output contains "CPU: 87.5%"',
                            check: function(out) { return out.indexOf('CPU: 87.5%') !== -1; }
                        },
                        {
                            name : 'Output contains "Status: running"',
                            check: function(out) { return out.indexOf('Status: running') !== -1; }
                        },
                        {
                            /* Verify f-string syntax was actually used, not string concatenation */
                            name : 'Code uses an f-string (f" or f\')',
                            check: function(out, code) {
                                return code.indexOf('f"') !== -1 || code.indexOf("f'") !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 4 ────────────────────────────────────────────
                   Tests: float(), int(), type casting, arithmetic on strings-as-numbers
                   IT context: parsing config values or log data is a daily task.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'type-casting',
                    title       : 'Type Casting',
                    desc        : 'Convert strings to numbers and calculate a total.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions: 'Given <code>price_str = "49.99"</code> and <code>qty_str = "4"</code>, ' +
                                  'convert them to the correct numeric types, multiply them, and print:<br>' +
                                  '<code>Total: $199.96</code>',
                    expected    : 'Total: $199.96',
                    starter     : 'price_str = "49.99"\nqty_str = "4"\n\n# Convert, calculate, and print\n',
                    hints: [
                        'Use float() for the price \u2014 it has a decimal point.',
                        'Use int() for the quantity \u2014 it is a whole number.',
                        'total = float(price_str) * int(qty_str)  then use an f-string to print.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "199.96"',
                            check: function(out) { return out.indexOf('199.96') !== -1; }
                        },
                        {
                            name : 'Output contains "Total"',
                            check: function(out) { return out.indexOf('Total') !== -1; }
                        },
                        {
                            /* Enforce the casting lesson — disallow hardcoding the answer */
                            name : 'Code uses float() and int()',
                            check: function(out, code) {
                                return code.indexOf('float(') !== -1 && code.indexOf('int(') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 5 ────────────────────────────────────────────
                   Tests: if / elif / else, comparison operators, threshold logic
                   IT context: disk monitoring alerts are a classic sysadmin task.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'disk-space-checker',
                    title       : 'Disk Space Checker',
                    desc        : 'Use if/elif/else to classify disk usage as OK, WARNING, or CRITICAL.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions: 'Given <code>disk_used = 82</code> (percent), write an if/elif/else that prints:<br>' +
                                  '<code>CRITICAL</code> if >= 90<br>' +
                                  '<code>WARNING</code> if >= 75<br>' +
                                  '<code>OK</code> if below 75<br>' +
                                  'With 82, output should be: <code>WARNING</code>',
                    expected    : 'WARNING',
                    starter     : 'disk_used = 82\n\n# Write your conditional check\n',
                    hints: [
                        'Start with the highest threshold: if disk_used >= 90:',
                        'Then check the middle range: elif disk_used >= 75:',
                        'The else branch handles everything below 75.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* Trim because students often print with trailing newlines */
                            name : 'Output is exactly "WARNING"',
                            check: function(out) { return out.trim() === 'WARNING'; }
                        },
                        {
                            name : 'Code contains "if"',
                            check: function(out, code) { return code.indexOf('if') !== -1; }
                        },
                        {
                            /* elif is the key lesson — force them to use it, not nested if */
                            name : 'Code contains "elif"',
                            check: function(out, code) { return code.indexOf('elif') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 6 ────────────────────────────────────────────
                   Tests: len(), any(), isdigit(), isupper(), compound conditionals
                   IT context: enforcing password policy is a real security task.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'password-validator',
                    title       : 'Password Validator',
                    desc        : 'Check a password against length, digit, and uppercase rules.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 240,
                    instructions: 'Given <code>password = "Hex2026!"</code>, check three rules:<br>' +
                                  '1. At least 8 characters<br>' +
                                  '2. Contains at least one digit<br>' +
                                  '3. Contains at least one uppercase letter<br>' +
                                  'Print <code>STRONG</code> if all checks pass, or print which check failed.',
                    expected    : 'STRONG',
                    starter     : 'password = "Hex2026!"\n\n# Validate the password\n',
                    hints: [
                        'len(password) gives the character count.',
                        'any(c.isdigit() for c in password) returns True if any character is a digit.',
                        'any(c.isupper() for c in password) returns True if any character is uppercase.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "STRONG"',
                            check: function(out) { return out.indexOf('STRONG') !== -1; }
                        },
                        {
                            /* len() is the most direct way to check length */
                            name : 'Code uses len()',
                            check: function(out, code) { return code.indexOf('len(') !== -1; }
                        },
                        {
                            name : 'Code contains "if"',
                            check: function(out, code) { return code.indexOf('if') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 7 ────────────────────────────────────────────
                   Tests: while loop, decrement operator, loop termination
                   Countdown is the canonical while-loop example — simple and memorable.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'countdown-timer',
                    title       : 'Countdown Timer',
                    desc        : 'Use a while loop to count down from 5, then print Liftoff!',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions: 'Write a while loop that counts down from 5 to 1, printing each number, ' +
                                  'then prints <code>Liftoff!</code> after the loop.<br>' +
                                  'Expected output: <code>5</code> <code>4</code> <code>3</code> <code>2</code> <code>1</code> <code>Liftoff!</code>',
                    expected    : '5\n4\n3\n2\n1\nLiftoff!',
                    starter     : '# Countdown from 5 to 1, then print Liftoff!\n',
                    hints: [
                        'Start with count = 5 and loop while count > 0:',
                        'Inside the loop, print count then decrease it: count -= 1',
                        'After the loop body (unindented), print("Liftoff!")'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* All five numbers must appear — not just some */
                            name : 'Output contains 5, 4, 3, 2, and 1',
                            check: function(out) {
                                return out.indexOf('5') !== -1 &&
                                       out.indexOf('4') !== -1 &&
                                       out.indexOf('3') !== -1 &&
                                       out.indexOf('2') !== -1 &&
                                       out.indexOf('1') !== -1;
                            }
                        },
                        {
                            name : 'Output contains "Liftoff!"',
                            check: function(out) { return out.indexOf('Liftoff!') !== -1; }
                        },
                        {
                            /* while is the required construct for this challenge */
                            name : 'Code uses a while loop',
                            check: function(out, code) { return code.indexOf('while') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 8 ────────────────────────────────────────────
                   Tests: for loop, enumerate(), f-strings, list iteration
                   IT context: looping a server inventory list is a real automation pattern.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'server-ping-loop',
                    title       : 'Server Ping Loop',
                    desc        : 'Loop a server list with enumerate() and print numbered entries.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions: 'Given <code>servers = ["web-01", "web-02", "db-01", "cache-01"]</code>, ' +
                                  'use a for loop with <code>enumerate()</code> to print each server ' +
                                  'with its number starting from 1:<br>' +
                                  '<code>1. web-01</code><br><code>2. web-02</code><br>' +
                                  '<code>3. db-01</code><br><code>4. cache-01</code>',
                    expected    : '1. web-01\n2. web-02\n3. db-01\n4. cache-01',
                    starter     : 'servers = ["web-01", "web-02", "db-01", "cache-01"]\n\n# Loop and print with numbers\n',
                    hints: [
                        'enumerate() gives you both index and value on each iteration.',
                        'for i, server in enumerate(servers, 1): — the 1 starts counting from 1.',
                        'Inside the loop: print(f"{i}. {server}")'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "1. web-01"',
                            check: function(out) { return out.indexOf('1. web-01') !== -1; }
                        },
                        {
                            name : 'Output contains "4. cache-01"',
                            check: function(out) { return out.indexOf('4. cache-01') !== -1; }
                        },
                        {
                            name : 'Code uses a for loop',
                            check: function(out, code) { return code.indexOf('for ') !== -1; }
                        },
                        {
                            /* enumerate is the lesson — not range(len()) workarounds */
                            name : 'Code uses enumerate()',
                            check: function(out, code) { return code.indexOf('enumerate') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 9 ────────────────────────────────────────────
                   Tests: for loop, range(), modulus operator, nested conditionals
                   FizzBuzz is the classic interview screen — students must get it right.
                   Order of checks matters: FizzBuzz before Fizz before Buzz.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'fizzbuzz',
                    title       : 'FizzBuzz',
                    desc        : 'Print 1-20, replacing multiples of 3 with Fizz, 5 with Buzz, both with FizzBuzz.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 300,
                    instructions: 'Print numbers 1 through 20. Replace each with a word when:<br>' +
                                  'Divisible by both 3 and 5: print <code>FizzBuzz</code><br>' +
                                  'Divisible by 3 only: print <code>Fizz</code><br>' +
                                  'Divisible by 5 only: print <code>Buzz</code><br>' +
                                  'Otherwise: print the number. Classic interview question.',
                    expected    : '1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz',
                    starter     : '# FizzBuzz: 1 to 20\n',
                    hints: [
                        'Use for i in range(1, 21): to loop 1 through 20.',
                        'Check divisible by BOTH 3 and 5 FIRST: if i % 3 == 0 and i % 5 == 0:',
                        'Then check 3, then 5, then else prints the number. Order matters.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* Line 3 (index 2) must be Fizz */
                            name : 'Line 3 is "Fizz"',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines[2] && lines[2].trim() === 'Fizz';
                            }
                        },
                        {
                            /* Line 5 (index 4) must be Buzz */
                            name : 'Line 5 is "Buzz"',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines[4] && lines[4].trim() === 'Buzz';
                            }
                        },
                        {
                            /* Line 15 (index 14) must be FizzBuzz — the critical test */
                            name : 'Line 15 is "FizzBuzz"',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                return lines[14] && lines[14].trim() === 'FizzBuzz';
                            }
                        },
                        {
                            /* Exactly 20 lines, one per number */
                            name : 'Output has exactly 20 lines',
                            check: function(out) {
                                return out.trim().split('\n').length === 20;
                            }
                        },
                        {
                            name : 'Code uses a for loop',
                            check: function(out, code) { return code.indexOf('for ') !== -1; }
                        },
                        {
                            /* Modulus operator is the lesson here */
                            name : 'Code uses the modulus operator (%)',
                            check: function(out, code) { return code.indexOf('%') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 10 ───────────────────────────────────────────
                   Tests: list of dicts, for loop, dict key access, conditionals,
                          aggregate math (sum, average), formatted output
                   This is the "boss" challenge that combines everything from Days 1-3.
                   Students design the data and the report — intentionally open-ended.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'it-system-report',
                    title       : 'IT System Report',
                    desc        : 'Build a mini system report from a list of server dictionaries.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 600,
                    instructions: 'Create a list of 3 server dictionaries, each with keys ' +
                                  '<code>name</code>, <code>cpu</code> (0-100), and <code>status</code>. ' +
                                  'Include at least one server with cpu > 80. Loop through the list and ' +
                                  'print each server\'s info. Flag any server with cpu > 80 as ' +
                                  '<code>ALERT</code>. After the loop, print the total server count ' +
                                  'and the average CPU usage.',
                    expected    : '(open-ended \u2014 any valid report with ALERT and average)',
                    starter     : '# IT System Report\n# Create your server list and generate the report\n',
                    hints: [
                        'Create the list of dicts first, then loop with: for server in servers:',
                        'Access dict values with server["cpu"], server["name"], etc.',
                        'After the loop, calculate average: sum(s["cpu"] for s in servers) / len(servers)'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* Verify the report has meaningful multi-line output */
                            name : 'Output has at least 3 lines',
                            check: function(out) {
                                return out.trim().split('\n').length >= 3;
                            }
                        },
                        {
                            /* At least one server must trigger the ALERT path */
                            name : 'Output contains "ALERT"',
                            check: function(out) { return out.indexOf('ALERT') !== -1; }
                        },
                        {
                            /* Case-insensitive to accept "average", "Average", "avg", "AVG" */
                            name : 'Output contains average CPU (keyword: average or avg)',
                            check: function(out) {
                                var lower = out.toLowerCase();
                                return lower.indexOf('average') !== -1 || lower.indexOf('avg') !== -1;
                            }
                        },
                        {
                            name : 'Code uses a for loop',
                            check: function(out, code) { return code.indexOf('for ') !== -1; }
                        },
                        {
                            name : 'Code uses an if statement',
                            check: function(out, code) { return code.indexOf('if ') !== -1; }
                        },
                        {
                            /* List syntax check — students must define a real list, not just variables */
                            name : 'Code defines a list (uses "[" syntax)',
                            check: function(out, code) { return code.indexOf('[') !== -1; }
                        }
                    ]
                }

            ] /* end challenges */

        }); /* end PythonSandbox.init() */
    </script>


    <div style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid rgba(255,255,255,0.08);">
        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>
