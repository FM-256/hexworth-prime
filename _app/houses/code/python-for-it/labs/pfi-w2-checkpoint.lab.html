<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Access Control: students must be in a sorted house -->

    <script>AccessGuard.require('sorted');</script>

    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>

    <!-- FirebaseAuth: required for tenant progress sync across devices -->
    <script src="../../../../components/FirebaseAuth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Checkpoint | Python for IT</title>

    <style>
        /* Viewport lock -- PythonSandbox.js fills 100% of the screen */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 2 Checkpoint</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           WEEK 2 CHECKPOINT -- File I/O & Data Processing
           Course: Python for IT (COP1034C)
           Module ID: pfi-w2-checkpoint
           Total: 3 challenges -- validates Week 2 file handling skills.

           Purpose: Students work with virtual files (created in starter
           code) to practice log parsing, config reading, and data
           processing. Challenges 1 and 2 are executable with expected
           output. Challenge 3 is a code review of their project code.
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 2 Checkpoint \u2014 File I/O & Data Processing',
            moduleId    : 'pfi-w2-checkpoint',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1: Log Parser (Executable) ─────────────────
                   The starter code creates a virtual log file with mixed
                   severity entries. Students write code to read the file,
                   count ERROR lines, and print the count. Tests check the
                   exact output string.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w2-log-parser',
                    title       : 'Log Parser',
                    desc        : 'Read a log file and count error entries.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 300,
                    instructions:
                        'IT professionals spend a lot of time parsing log files.<br><br>' +
                        'The starter code creates a virtual log file called <code>system.log</code> ' +
                        'with 5 entries at different severity levels (ERROR, WARNING, INFO).<br><br>' +
                        '<strong>Your task:</strong><br>' +
                        '1. Open and read <code>system.log</code><br>' +
                        '2. Count how many lines contain the word <code>ERROR</code><br>' +
                        '3. Print exactly: <code>Errors found: 2</code><br><br>' +
                        'Use a <code>for</code> loop to iterate through each line and the ' +
                        '<code>in</code> operator to check if "ERROR" appears in the line.',
                    expected    : 'Errors found: 2',
                    starter     :
                        '# Week 2 Checkpoint: Log Parser\n' +
                        '# The virtual log file is created below -- do not modify this section.\n\n' +
                        '# --- Setup: create virtual log file ---\n' +
                        'log_data = """2026-04-01 08:15:22 ERROR Disk space critical on /dev/sda1\n' +
                        '2026-04-01 08:16:45 INFO Backup job started\n' +
                        '2026-04-01 08:20:10 WARNING CPU temperature above threshold\n' +
                        '2026-04-01 08:22:33 INFO Backup job completed\n' +
                        '2026-04-01 08:25:01 ERROR Network interface eth0 down"""\n\n' +
                        'with open("system.log", "w") as f:\n' +
                        '    f.write(log_data)\n\n' +
                        '# --- Your code below: read the file and count ERROR lines ---\n',
                    hints       : [
                        'Open the file with: with open("system.log", "r") as f:',
                        'Loop through lines: for line in f: and check if "ERROR" in line',
                        'Keep a counter variable. Increment it each time you find ERROR. Then print(f"Errors found: {count}")'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify exact output matches expected format */
                            name  : 'Output is "Errors found: 2"',
                            check : function(out) {
                                return out.trim() === 'Errors found: 2';
                            }
                        },
                        {
                            /* Verify student actually reads the file, not hardcoding */
                            name  : 'Code opens and reads system.log',
                            check : function(out, code) {
                                return code.indexOf('open(') !== -1 &&
                                       code.indexOf('system.log') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 2: Config Reader (Executable) ──────────────
                   The starter code creates a virtual config.ini file with
                   a [general] section. Students parse it to extract and
                   print the app_name value. Tests check the exact output.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w2-config-reader',
                    title       : 'Config Reader',
                    desc        : 'Parse a .ini config file and extract a value.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 300,
                    instructions:
                        'Configuration files store application settings in a structured format.<br><br>' +
                        'The starter code creates a virtual <code>config.ini</code> file with a ' +
                        '<code>[general]</code> section containing key-value pairs.<br><br>' +
                        '<strong>Your task:</strong><br>' +
                        '1. Use Python\'s built-in <code>configparser</code> module<br>' +
                        '2. Read <code>config.ini</code><br>' +
                        '3. Extract the <code>app_name</code> value from the <code>[general]</code> section<br>' +
                        '4. Print exactly: <code>IT Dashboard</code><br><br>' +
                        'The <code>configparser</code> module handles INI-style files natively. ' +
                        'Create a <code>ConfigParser()</code> object, call <code>.read()</code>, and ' +
                        'access values with <code>config["section"]["key"]</code>.',
                    expected    : 'IT Dashboard',
                    starter     :
                        '# Week 2 Checkpoint: Config Reader\n' +
                        '# The virtual config file is created below -- do not modify this section.\n\n' +
                        '# --- Setup: create virtual config.ini ---\n' +
                        'config_data = """[general]\n' +
                        'app_name = IT Dashboard\n' +
                        'version = 0.2.0\n' +
                        'debug = false\n\n' +
                        '[network]\n' +
                        'host = 192.168.1.1\n' +
                        'port = 8080"""\n\n' +
                        'with open("config.ini", "w") as f:\n' +
                        '    f.write(config_data)\n\n' +
                        '# --- Your code below: read config.ini and print app_name ---\n' +
                        'import configparser\n\n',
                    hints       : [
                        'Create a parser: config = configparser.ConfigParser()',
                        'Read the file: config.read("config.ini")',
                        'Access the value: print(config["general"]["app_name"])'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify exact output matches expected value */
                            name  : 'Output is "IT Dashboard"',
                            check : function(out) {
                                return out.trim() === 'IT Dashboard';
                            }
                        },
                        {
                            /* Verify student uses configparser, not manual parsing */
                            name  : 'Code uses configparser module',
                            check : function(out, code) {
                                return code.indexOf('configparser') !== -1 &&
                                       code.indexOf('ConfigParser') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 3: Data Storage (Code Review) ──────────────
                   codeReview: true -- validates that the student's data
                   processing code uses proper data structures (dict/list),
                   iteration (for loop), and file I/O (open/with).
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w2-data-storage',
                    title       : 'Data Storage',
                    desc        : 'Validate your data processing patterns.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 300,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your data processing code</strong> from the Week 2 project.<br><br>' +
                        'This checkpoint verifies three fundamental data-handling patterns:<br>' +
                        '1. Use of <code>dict</code> or <code>list</code> for structured data storage<br>' +
                        '2. At least one <code>for</code> loop for iterating through data<br>' +
                        '3. File I/O using <code>open()</code> or a <code>with</code> statement<br><br>' +
                        'These patterns form the backbone of every data processing pipeline ' +
                        'in IT automation. Whether you are parsing logs, reading configs, or ' +
                        'generating reports, you will use all three together.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 2 Checkpoint: Data Storage\n' +
                        '# Paste your data processing code below.\n' +
                        '# Required: dict or list usage, for loop, file I/O.\n\n' +
                        '# Example structure:\n' +
                        'devices = [\n' +
                        '    {"hostname": "router-01", "ip": "10.0.0.1", "status": "up"},\n' +
                        '    {"hostname": "switch-01", "ip": "10.0.0.2", "status": "down"},\n' +
                        '    {"hostname": "server-01", "ip": "10.0.0.10", "status": "up"}\n' +
                        ']\n\n' +
                        '# Process the data\n' +
                        'for device in devices:\n' +
                        '    print(f"{device[\'hostname\']}: {device[\'status\']}")\n\n' +
                        '# Save results to a file\n' +
                        'with open("report.txt", "w") as f:\n' +
                        '    for device in devices:\n' +
                        '        f.write(f"{device[\'hostname\']} - {device[\'status\']}\\n")\n',
                    hints       : [
                        'A list of dictionaries is a common pattern: devices = [{"name": "...", "ip": "..."}]',
                        'Use for item in collection: to iterate through your data structure.',
                        'Use with open("filename", "w") as f: to safely write results to a file.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify dict or list data structure usage */
                            name  : 'Code uses dict or list data structures',
                            check : function(out, code) {
                                // Check for dictionary literals or dict() calls
                                var hasDict = code.indexOf('{') !== -1 &&
                                              code.indexOf(':') !== -1 &&
                                              code.indexOf('}') !== -1;
                                // Check for list literals or list() calls
                                var hasList = code.indexOf('[') !== -1 &&
                                              code.indexOf(']') !== -1;
                                return hasDict || hasList;
                            }
                        },
                        {
                            /* Verify at least one for loop for iteration */
                            name  : 'Code contains at least one for loop',
                            check : function(out, code) {
                                return code.indexOf('for ') !== -1 &&
                                       code.indexOf(' in ') !== -1;
                            }
                        },
                        {
                            /* Verify file I/O with open() or with statement */
                            name  : 'Code uses file I/O (open or with statement)',
                            check : function(out, code) {
                                return code.indexOf('open(') !== -1 ||
                                       code.indexOf('with open') !== -1;
                            }
                        }
                    ]
                }
            ]
        });
    </script>


    <div style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid rgba(255,255,255,0.08);">
        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>

         activity ticks the mood-ring.

    <hex-ai-button mission-id="pfi-w2-checkpoint" house="code"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
    <script src="/components/ObservatoryTelemetry.js"></script>
</body>
</html>
