<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Access control: student must be enrolled ('sorted') to enter -->
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- Achievement and progress tracking -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- Firebase auth required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Lab: Strings, Files & Data Structures | Python for IT</title>
    <style>
        /* Full-screen IDE layout — no scroll on body */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 2 Lab: Strings, Files & Data Structures</h1>


<!-- PythonSandbox mounts the entire IDE into this div -->
<div id="sandbox-root" style="height:100%;"></div>

<script src="../../../../components/PythonSandbox.js"></script>
<script>
    /*
     * Week 2 Sandbox — Strings, Files & Data Structures
     * Covers: Days 4-6 of Python for IT (COP1034C)
     * Topics: str methods, f-strings, file I/O, lists, tuples, dicts, sets
     *
     * Log file content used in challenges 4 and 10:
     *   - 10 lines total
     *   - 4 INFO, 3 WARNING, 3 ERROR entries
     *   - Unique error messages: 2
     *   - Most common severity: INFO (4 occurrences)
     */

    /* Reusable log file setup block injected as starter for file challenges.
       Pyodide runs in a virtual WASM filesystem so we create the file in code. */
    var LOG_SETUP = [
        '# Create the sample log file in Pyodide\'s virtual filesystem',
        'log_data = """2026-04-01 09:15:23 INFO Server started successfully',
        '2026-04-01 09:16:45 WARNING Disk usage at 78%',
        '2026-04-01 09:17:02 ERROR Connection refused to database',
        '2026-04-01 09:18:30 INFO User login: admin',
        '2026-04-01 09:19:15 ERROR Connection refused to database',
        '2026-04-01 09:20:01 WARNING Memory usage at 85%',
        '2026-04-01 09:21:44 INFO Backup completed',
        '2026-04-01 09:22:10 ERROR Timeout connecting to API',
        '2026-04-01 09:23:05 INFO Cache cleared',
        '2026-04-01 09:24:30 WARNING CPU spike detected"""',
        'with open("server.log", "w") as f:',
        '    f.write(log_data.strip())',
        '',
        '# Now write your solution below'
    ].join('\n');

    PythonSandbox.init({
        containerId: 'sandbox-root',
        title:       'Week 2 Lab -- Strings, Files & Data Structures',
        moduleId:    'pfi-w2-sandbox',
        houseId:     'code',
        returnUrl:   '../index.html',

        challenges: [

            /* ── Challenge 1: String Surgery ──────────────────────────── */
            {
                id:         'c1-string-surgery',
                title:      'Challenge 1: String Surgery',
                desc:       'Strip, lowercase, and replace a log alert string.',
                difficulty: 'easy',
                xp:         10,
                parTime:    120,
                instructions:
                    'Given <code>raw = "  WARNING: Disk Full  "</code>, chain three string methods: ' +
                    '<code>strip()</code> to remove leading/trailing spaces, ' +
                    '<code>lower()</code> to lowercase the result, then ' +
                    '<code>replace("disk full", "disk cleared")</code>. ' +
                    'Print the final string.',
                expected:   'warning: disk cleared',
                starter:
                    '# String Surgery\n' +
                    'raw = "  WARNING: Disk Full  "\n\n' +
                    '# Chain strip(), lower(), and replace() then print\n',
                hints: [
                    'You can chain methods: raw.strip().lower().replace(...)',
                    'replace() takes two arguments: the old substring and the new one',
                    'The final print should produce exactly: warning: disk cleared'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output is "warning: disk cleared"',
                        check: function(out) { return out.trim() === 'warning: disk cleared'; }
                    },
                    {
                        name:  'Code uses strip()',
                        check: function(out, code) { return code.indexOf('strip()') !== -1; }
                    },
                    {
                        name:  'Code uses lower()',
                        check: function(out, code) { return code.indexOf('lower()') !== -1; }
                    },
                    {
                        name:  'Code uses replace()',
                        check: function(out, code) { return code.indexOf('replace(') !== -1; }
                    }
                ]
            },

            /* ── Challenge 2: Log Line Parser ─────────────────────────── */
            {
                id:         'c2-log-parser',
                title:      'Challenge 2: Log Line Parser',
                desc:       'Split a log string and print its parts separately.',
                difficulty: 'medium',
                xp:         20,
                parTime:    180,
                instructions:
                    'Given <code>log = "2026-04-01 09:15:23 ERROR Connection refused"</code>, ' +
                    'use <code>split()</code> to break it into parts. ' +
                    'Print the timestamp (date + time joined with a space), ' +
                    'the severity level, and the message on three separate lines.',
                expected:   '2026-04-01 09:15:23\nERROR\nConnection refused',
                starter:
                    '# Log Line Parser\n' +
                    'log = "2026-04-01 09:15:23 ERROR Connection refused"\n\n' +
                    '# Split the line and print timestamp, severity, and message\n',
                hints: [
                    'split() with no argument splits on any whitespace',
                    'parts[0] is the date, parts[1] is the time, parts[2] is severity',
                    'The message starts at parts[3] — join any remaining parts with a space'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output contains timestamp "2026-04-01 09:15:23"',
                        check: function(out) { return out.indexOf('2026-04-01 09:15:23') !== -1; }
                    },
                    {
                        name:  'Output contains "ERROR"',
                        check: function(out) { return out.indexOf('ERROR') !== -1; }
                    },
                    {
                        name:  'Output contains "Connection refused"',
                        check: function(out) { return out.indexOf('Connection refused') !== -1; }
                    },
                    {
                        name:  'Code uses split()',
                        check: function(out, code) { return code.indexOf('split(') !== -1; }
                    }
                ]
            },

            /* ── Challenge 3: F-String Formatter ──────────────────────── */
            {
                id:         'c3-fstring-formatter',
                title:      'Challenge 3: F-String Formatter',
                desc:       'Use f-string format specs to produce a table row.',
                difficulty: 'easy',
                xp:         10,
                parTime:    120,
                instructions:
                    'Given <code>name = "web-01"</code>, <code>uptime = 99.876</code>, ' +
                    '<code>users = 42</code>, use an f-string with format specs to print: ' +
                    '<code>web-01     |  99.88% |    42 users</code>. ' +
                    'Tip: <code>:.2f</code> rounds to 2 decimal places.',
                expected:   'web-01     |  99.88% |    42 users',
                starter:
                    '# F-String Formatter\n' +
                    'name   = "web-01"\n' +
                    'uptime = 99.876\n' +
                    'users  = 42\n\n' +
                    '# Use an f-string with format specs (:.2f, etc.)\n',
                hints: [
                    'f"{uptime:.2f}" rounds uptime to 2 decimal places',
                    'f"{users:>5}" right-aligns users in a field of width 5',
                    'Count the spaces in the expected output carefully — spacing must match'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output contains "99.88"',
                        check: function(out) { return out.indexOf('99.88') !== -1; }
                    },
                    {
                        name:  'Output contains "42"',
                        check: function(out) { return out.indexOf('42') !== -1; }
                    },
                    {
                        name:  'Output contains "web-01"',
                        check: function(out) { return out.indexOf('web-01') !== -1; }
                    },
                    {
                        name:  'Code uses an f-string format spec (colon inside braces)',
                        check: function(out, code) { return /f["'][^"']*\{[^}]*:[^}]+\}/.test(code); }
                    }
                ]
            },

            /* ── Challenge 4: File Reader ──────────────────────────────── */
            {
                id:         'c4-file-reader',
                title:      'Challenge 4: File Reader',
                desc:       'Open server.log and count lines containing ERROR.',
                difficulty: 'medium',
                xp:         20,
                parTime:    240,
                instructions:
                    'The starter code creates <code>server.log</code> in the virtual filesystem. ' +
                    'Use <code>with open("server.log")</code> and a <code>for</code> loop to read each line. ' +
                    'Count how many lines contain the word <code>ERROR</code> and print the count.',
                expected:   '3',
                starter:    LOG_SETUP + '\n',
                hints: [
                    'with open("server.log") as f: gives you a file object to loop over',
                    'Use "ERROR" in line to test each line as you iterate',
                    'Initialize a counter to 0 before the loop, increment inside the if'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output is 3 (correct ERROR count)',
                        check: function(out) { return out.trim() === '3'; }
                    },
                    {
                        name:  'Code uses with open()',
                        check: function(out, code) { return (code.match(/with open\(/g) || []).length >= 2; }
                    },
                    {
                        name:  'Code uses a for loop',
                        check: function(out, code) { return code.indexOf('for ') !== -1; }
                    }
                ]
            },

            /* ── Challenge 5: List Operations ─────────────────────────── */
            {
                id:         'c5-list-ops',
                title:      'Challenge 5: List Operations',
                desc:       'Sort, add, and remove elements from a port list.',
                difficulty: 'easy',
                xp:         10,
                parTime:    120,
                instructions:
                    'Start with <code>ports = [80, 443, 22, 3306, 8080]</code>. ' +
                    'Sort the list in place, add port <code>53</code>, remove port <code>3306</code>, then sort again so 53 is in the right position. ' +
                    'Print the final sorted list. Expected: <code>[22, 53, 80, 443, 8080]</code>',
                expected:   '[22, 53, 80, 443, 8080]',
                starter:
                    '# List Operations\n' +
                    'ports = [80, 443, 22, 3306, 8080]\n\n' +
                    '# Sort, add 53, remove 3306, then print\n',
                hints: [
                    'ports.sort() sorts the list in place (no new variable needed)',
                    'ports.append(53) adds 53 to the end — then sort again, or insert at the right index',
                    'ports.remove(3306) removes the first occurrence of 3306'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output is "[22, 53, 80, 443, 8080]"',
                        check: function(out) { return out.trim() === '[22, 53, 80, 443, 8080]'; }
                    },
                    {
                        name:  'Code sorts the list',
                        check: function(out, code) { return code.indexOf('.sort(') !== -1 || code.indexOf('sorted(') !== -1; }
                    },
                    {
                        name:  'Code adds a port',
                        check: function(out, code) { return code.indexOf('.append(') !== -1 || code.indexOf('.insert(') !== -1; }
                    },
                    {
                        name:  'Code removes a port',
                        check: function(out, code) { return code.indexOf('.remove(') !== -1 || code.indexOf('del ') !== -1 || code.indexOf('.pop(') !== -1; }
                    }
                ]
            },

            /* ── Challenge 6: List Comprehension ──────────────────────── */
            {
                id:         'c6-list-comp',
                title:      'Challenge 6: List Comprehension',
                desc:       'Filter server temps above 100F using a comprehension.',
                difficulty: 'medium',
                xp:         20,
                parTime:    180,
                instructions:
                    'Given <code>temps = [98.6, 102.1, 97.8, 103.5, 99.2, 101.0]</code> ' +
                    '(server temperatures in Fahrenheit), use a list comprehension to build ' +
                    '<code>hot_servers</code> containing only temps above 100. ' +
                    'Print the list, then print its length.',
                expected:   '[102.1, 103.5, 101.0]\n3',
                starter:
                    '# List Comprehension\n' +
                    'temps = [98.6, 102.1, 97.8, 103.5, 99.2, 101.0]\n\n' +
                    '# Build hot_servers using a list comprehension (temps > 100)\n' +
                    '# Then print the list and its length\n',
                hints: [
                    'hot_servers = [t for t in temps if t > 100]',
                    'len(hot_servers) gives the count',
                    'Print the list first, then the length on a second line'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output contains the three hot temps',
                        check: function(out) {
                            return out.indexOf('102.1') !== -1 &&
                                   out.indexOf('103.5') !== -1 &&
                                   out.indexOf('101.0') !== -1;
                        }
                    },
                    {
                        name:  'Output reports the filtered list length as 3',
                        check: function(out) {
                            // Match a standalone "3" that represents the count, not digits inside temps
                            var lines = out.trim().split('\n');
                            return lines.some(function(line) { return line.match(/\b3\b/) && line.toLowerCase().indexOf('len') !== -1 || line.trim() === '3'; });
                        }
                    },
                    {
                        name:  'Code uses a list comprehension',
                        check: function(out, code) { return /\[.+for.+in.+if/.test(code); }
                    }
                ]
            },

            /* ── Challenge 7: Tuple Unpacking ─────────────────────────── */
            {
                id:         'c7-tuple-unpack',
                title:      'Challenge 7: Tuple Unpacking',
                desc:       'Unpack a server info tuple into labeled variables.',
                difficulty: 'easy',
                xp:         10,
                parTime:    120,
                instructions:
                    'Given <code>server_info = ("web-01", "192.168.1.10", 443, True)</code>, ' +
                    'unpack it into <code>name, ip, port, active</code> in a single assignment. ' +
                    'Print each value on its own line with a label, e.g. <code>Name: web-01</code>.',
                expected:   'Name: web-01\nIP: 192.168.1.10\nPort: 443\nActive: True',
                starter:
                    '# Tuple Unpacking\n' +
                    'server_info = ("web-01", "192.168.1.10", 443, True)\n\n' +
                    '# Unpack into name, ip, port, active — one assignment line\n' +
                    '# Then print each with a label\n',
                hints: [
                    'name, ip, port, active = server_info  — all four on one line',
                    'f"Name: {name}" produces the labeled output',
                    'Python prints True (capital T) for boolean True'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output contains "web-01"',
                        check: function(out) { return out.indexOf('web-01') !== -1; }
                    },
                    {
                        name:  'Output contains "192.168.1.10"',
                        check: function(out) { return out.indexOf('192.168.1.10') !== -1; }
                    },
                    {
                        name:  'Output contains "443"',
                        check: function(out) { return out.indexOf('443') !== -1; }
                    },
                    {
                        name:  'Code uses tuple unpacking (multiple assignment)',
                        check: function(out, code) { return /\bname\s*,\s*ip\s*,\s*port\s*,\s*active\b/.test(code); }
                    }
                ]
            },

            /* ── Challenge 8: Dictionary CRUD ─────────────────────────── */
            {
                id:         'c8-dict-crud',
                title:      'Challenge 8: Dictionary CRUD',
                desc:       'Build a device inventory, then delete an entry.',
                difficulty: 'medium',
                xp:         20,
                parTime:    240,
                instructions:
                    'Start with <code>inventory = {}</code>. Add three entries: ' +
                    '<code>"router-01": "10.0.0.1"</code>, <code>"switch-01": "10.0.0.2"</code>, ' +
                    '<code>"fw-01": "10.0.0.3"</code>. Delete <code>"switch-01"</code>. ' +
                    'Loop over <code>.items()</code> and print each device and its IP.',
                expected:   'router-01: 10.0.0.1\nfw-01: 10.0.0.3',
                starter:
                    '# Dictionary CRUD\n' +
                    'inventory = {}\n\n' +
                    '# Add router-01, switch-01, fw-01 with their IPs\n' +
                    '# Delete switch-01\n' +
                    '# Print remaining devices using .items()\n',
                hints: [
                    'inventory["router-01"] = "10.0.0.1" adds an entry',
                    'del inventory["switch-01"] removes the key entirely',
                    'for device, ip in inventory.items(): lets you unpack each pair'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Output contains "router-01"',
                        check: function(out) { return out.indexOf('router-01') !== -1; }
                    },
                    {
                        name:  'Output contains "fw-01"',
                        check: function(out) { return out.indexOf('fw-01') !== -1; }
                    },
                    {
                        name:  'Output does NOT contain "switch-01"',
                        check: function(out) { return out.indexOf('switch-01') === -1; }
                    },
                    {
                        name:  'Code deletes an entry (del or .pop())',
                        check: function(out, code) { return code.indexOf('del ') !== -1 || code.indexOf('.pop(') !== -1; }
                    },
                    {
                        name:  'Code uses .items()',
                        check: function(out, code) { return code.indexOf('.items()') !== -1; }
                    }
                ]
            },

            /* ── Challenge 9: Set Operations ──────────────────────────── */
            {
                id:         'c9-set-ops',
                title:      'Challenge 9: Set Operations',
                desc:       'Find intersection, difference, and union of two teams.',
                difficulty: 'medium',
                xp:         20,
                parTime:    180,
                instructions:
                    'Given <code>team_a = {"alice", "bob", "charlie", "diana"}</code> and ' +
                    '<code>team_b = {"charlie", "diana", "eve", "frank"}</code>, compute and print: ' +
                    '(1) Members in both teams (intersection), ' +
                    '(2) Members only in team_a (difference), ' +
                    '(3) All unique members (union). ' +
                    'Label each result clearly.',
                expected:   'Both: charlie, diana\nOnly A: alice, bob\nAll: alice, bob, charlie, diana, eve, frank',
                starter:
                    '# Set Operations\n' +
                    'team_a = {"alice", "bob", "charlie", "diana"}\n' +
                    'team_b = {"charlie", "diana", "eve", "frank"}\n\n' +
                    '# Compute intersection, difference (A - B), and union\n' +
                    '# Print each with a label\n',
                hints: [
                    'team_a & team_b gives the intersection (or team_a.intersection(team_b))',
                    'team_a - team_b gives members only in team_a (or team_a.difference(team_b))',
                    'team_a | team_b gives the union — note sets are unordered, so sort for display'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'Intersection output contains "charlie" and "diana"',
                        check: function(out) { return out.indexOf('charlie') !== -1 && out.indexOf('diana') !== -1; }
                    },
                    {
                        name:  'Difference output contains "alice" and "bob"',
                        check: function(out) { return out.indexOf('alice') !== -1 && out.indexOf('bob') !== -1; }
                    },
                    {
                        name:  'Union output contains all 6 members',
                        check: function(out) {
                            return ['alice','bob','charlie','diana','eve','frank']
                                .every(function(m) { return out.indexOf(m) !== -1; });
                        }
                    },
                    {
                        name:  'Code uses set operations (& | - or method names)',
                        check: function(out, code) {
                            var noComments = code.replace(/#.*/g, '');
                            return /[&|\-]/.test(noComments) ||
                                   noComments.indexOf('intersection') !== -1 ||
                                   noComments.indexOf('difference')   !== -1 ||
                                   noComments.indexOf('union')        !== -1;
                        }
                    }
                ]
            },

            /* ── Challenge 10: Log Analyzer (Boss) ────────────────────── */
            {
                id:         'c10-log-analyzer',
                title:      'Challenge 10: Log Analyzer (Boss)',
                desc:       'Parse server.log and produce a full severity report.',
                difficulty: 'hard',
                xp:         30,
                parTime:    600,
                instructions:
                    'The starter code creates <code>server.log</code>. Read each line and: ' +
                    '(1) Count occurrences of each severity (INFO/WARNING/ERROR) into a dict. ' +
                    '(2) Collect unique error messages into a set (the text after "ERROR "). ' +
                    '(3) Print a report: severity counts, the unique error count, and the most common severity. ' +
                    '<br><br>Expected counts from this log: INFO=4, WARNING=3, ERROR=3.',
                expected:   'INFO: 4\nWARNING: 3\nERROR: 3\nUnique errors: 2\nMost common: INFO',
                starter:    LOG_SETUP + '\n\n# Hint: split each line on spaces to get the severity at index 2\n',
                hints: [
                    'counts = {"INFO": 0, "WARNING": 0, "ERROR": 0} — initialize your counter dict',
                    'parts = line.split() gives you parts[2] as the severity keyword',
                    'Use a set to collect unique error messages: errors.add(" ".join(parts[3:])) for ERROR lines'
                ],
                testInputs: [],
                tests: [
                    {
                        name:  'INFO count is 4',
                        check: function(out) { return /INFO.*4|4.*INFO/.test(out); }
                    },
                    {
                        name:  'WARNING count is 3',
                        check: function(out) { return /WARNING.*3|3.*WARNING/.test(out); }
                    },
                    {
                        name:  'ERROR count is 3',
                        check: function(out) { return /ERROR.*3|3.*ERROR/.test(out); }
                    },
                    {
                        name:  'Unique error count is reported (2)',
                        check: function(out) {
                            // Check for "2" in context of "unique" — not just any "2" in output
                            var lines = out.trim().split('\n');
                            return lines.some(function(line) {
                                var lower = line.toLowerCase();
                                return (lower.indexOf('unique') !== -1 || lower.indexOf('distinct') !== -1) && line.indexOf('2') !== -1;
                            });
                        }
                    },
                    {
                        name:  'Most common severity is identified',
                        check: function(out) { return out.toLowerCase().indexOf('info') !== -1 && out.toLowerCase().indexOf('most') !== -1; }
                    },
                    {
                        name:  'Code uses a dict for counts',
                        check: function(out, code) { return code.indexOf('{') !== -1 && (code.indexOf('counts') !== -1 || code.indexOf('severity') !== -1); }
                    },
                    {
                        name:  'Code uses a set for unique errors',
                        check: function(out, code) { return code.indexOf('set(') !== -1 || /\w+\s*=\s*\{[\s]*\}/.test(code) || code.indexOf('.add(') !== -1; }
                    },
                    {
                        name:  'Code reads the file with "with open"',
                        check: function(out, code) {
                            // Require at least 2 occurrences — LOG_SETUP has one for writing,
                            // the student must add another for reading
                            return (code.match(/with open\(/g) || []).length >= 2;
                        }
                    }
                ]
            }

        ] /* end challenges */
    });
</script>
</body>
</html>
