    <script src="../../../../components/FirebaseAuth.js"></script>

<body>
<!-- Visually-hidden h1 for screen reader accessibility -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Week 3 Checkpoint</h1>


    <!-- PythonSandbox renders the full IDE layout into this element -->
    <div id="sandbox-root" style="height:100%;"></div>

    <!-- PythonSandbox engine -->
    <script src="../../../../components/PythonSandbox.js"></script>

    <script>
        /* ================================================================
           WEEK 3 CHECKPOINT -- OOP Architecture
           Course: Python for IT (COP1034C)
           Module ID: pfi-w3-checkpoint
           Total: 3 challenges -- validates Week 3 OOP patterns.

           Purpose: Students demonstrate understanding of class design,
           inheritance, and composition. Challenges 1 and 2 are code
           reviews that validate class structure. Challenge 3 is an
           executable test where students build a DeviceManager class.
           ================================================================ */

        PythonSandbox.init({
            containerId : 'sandbox-root',
            title       : 'Week 3 Checkpoint \u2014 OOP Architecture',
            moduleId    : 'pfi-w3-checkpoint',
            houseId     : 'code',
            returnUrl   : '../index.html',

            challenges: [

                /* ── Challenge 1: NetworkDevice Class (Code Review) ───────
                   codeReview: true -- validates that the student built a
                   proper base class with __init__, hostname, and ip
                   attributes. This is the foundation for the inheritance
                   challenge that follows.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-network-device',
                    title       : 'NetworkDevice Class',
                    desc        : 'Validate your base class structure.',
                    difficulty  : 'medium',
                    xp          : 25,
                    parTime     : 300,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your NetworkDevice class</strong> from the Week 3 project.<br><br>' +
                        'Every network management tool starts with a base device class. ' +
                        'This checkpoint verifies your class has the required structure:<br><br>' +
                        '1. A <code>class NetworkDevice</code> definition<br>' +
                        '2. An <code>__init__</code> method that accepts parameters<br>' +
                        '3. A <code>self.hostname</code> attribute<br>' +
                        '4. A <code>self.ip</code> attribute<br><br>' +
                        'These four elements form the minimum viable class for representing ' +
                        'a network device in your IT dashboard.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 3 Checkpoint: NetworkDevice Class\n' +
                        '# Paste your NetworkDevice class below.\n' +
                        '# Required: class definition, __init__, self.hostname, self.ip\n\n' +
                        'class NetworkDevice:\n' +
                        '    """Base class for all network devices."""\n\n' +
                        '    def __init__(self, hostname, ip):\n' +
                        '        self.hostname = hostname\n' +
                        '        self.ip = ip\n' +
                        '        self.status = "unknown"\n\n' +
                        '    def __str__(self):\n' +
                        '        return f"{self.hostname} ({self.ip}) - {self.status}"\n',
                    hints       : [
                        'Start with: class NetworkDevice:',
                        'The __init__ method sets up instance attributes: self.hostname = hostname',
                        'You can add extra attributes like self.status for device state tracking.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify the class definition exists */
                            name  : 'Code defines class NetworkDevice',
                            check : function(out, code) {
                                return code.indexOf('class NetworkDevice') !== -1;
                            }
                        },
                        {
                            /* Verify __init__ method is defined */
                            name  : 'Code has __init__ method',
                            check : function(out, code) {
                                return code.indexOf('def __init__') !== -1;
                            }
                        },
                        {
                            /* Verify self.hostname attribute is set */
                            name  : 'Code sets self.hostname attribute',
                            check : function(out, code) {
                                return code.indexOf('self.hostname') !== -1;
                            }
                        },
                        {
                            /* Verify self.ip attribute is set */
                            name  : 'Code sets self.ip attribute',
                            check : function(out, code) {
                                return code.indexOf('self.ip') !== -1;
                            }
                        }
                    ]
                },

                /* ── Challenge 2: Inheritance (Code Review) ───────────────
                   codeReview: true -- validates that the student built a
                   subclass that extends NetworkDevice using proper
                   inheritance syntax, super().__init__(), and adds at
                   least one new method.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-inheritance',
                    title       : 'Inheritance',
                    desc        : 'Validate your subclass inheritance structure.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 360,
                    codeReview  : true,
                    instructions:
                        '<strong>Paste your subclass code</strong> (Router, Switch, or Firewall).<br><br>' +
                        'Inheritance lets you create specialized device types that share ' +
                        'the base NetworkDevice attributes while adding their own behavior. ' +
                        'This checkpoint verifies:<br><br>' +
                        '1. A subclass that extends <code>NetworkDevice</code> (e.g., <code>class Router(NetworkDevice)</code>)<br>' +
                        '2. A call to <code>super().__init__()</code> to initialize the parent class<br>' +
                        '3. At least one new method defined in the subclass<br><br>' +
                        'The subclass should inherit hostname and ip from the parent while ' +
                        'adding device-specific functionality like routing table management ' +
                        'or interface configuration.<br><br>' +
                        '<em>This is a code review challenge -- tests validate structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Week 3 Checkpoint: Inheritance\n' +
                        '# Paste your subclass code below.\n' +
                        '# Required: subclass of NetworkDevice, super().__init__, new method.\n\n' +
                        'class NetworkDevice:\n' +
                        '    """Base class (included for reference)."""\n' +
                        '    def __init__(self, hostname, ip):\n' +
                        '        self.hostname = hostname\n' +
                        '        self.ip = ip\n\n\n' +
                        'class Router(NetworkDevice):\n' +
                        '    """Router extends NetworkDevice with routing capabilities."""\n\n' +
                        '    def __init__(self, hostname, ip, routing_protocol="OSPF"):\n' +
                        '        super().__init__(hostname, ip)\n' +
                        '        self.routing_protocol = routing_protocol\n' +
                        '        self.routes = []\n\n' +
                        '    def add_route(self, network, next_hop):\n' +
                        '        """Add a static route to the routing table."""\n' +
                        '        self.routes.append({"network": network, "next_hop": next_hop})\n',
                    hints       : [
                        'Subclass syntax: class Router(NetworkDevice): -- the parent goes in parentheses.',
                        'Call the parent constructor: super().__init__(hostname, ip) inside your __init__.',
                        'Add at least one method specific to your device type, like add_route() or configure_vlan().'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify a subclass of NetworkDevice exists */
                            name  : 'Code defines a subclass of NetworkDevice',
                            check : function(out, code) {
                                // Match common subclass patterns: (NetworkDevice) in class definition
                                return code.indexOf('(NetworkDevice)') !== -1;
                            }
                        },
                        {
                            /* Verify super().__init__ is called */
                            name  : 'Code calls super().__init__() to initialize parent',
                            check : function(out, code) {
                                return code.indexOf('super().__init__') !== -1 ||
                                       code.indexOf('NetworkDevice.__init__') !== -1;
                            }
                        },
                        {
                            /* Verify at least one new method is defined in the subclass */
                            name  : 'Subclass defines at least one new method',
                            check : function(out, code) {
                                // Find all "def " occurrences -- need at least 3:
                                // parent __init__ + child __init__ + one new method
                                var defMatches = code.match(/def /g) || [];
                                return defMatches.length >= 3;
                            }
                        }
                    ]
                },

                /* ── Challenge 3: DeviceManager (Executable) ──────────────
                   Regular execution -- a NetworkDevice base class is
                   provided in the starter code. Students build a
                   DeviceManager class with add_device() and
                   list_devices() methods. The test creates a manager,
                   adds two devices, and verifies the output.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'w3-device-manager',
                    title       : 'DeviceManager',
                    desc        : 'Build a manager class and verify output.',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 420,
                    instructions:
                        'A manager class organizes collections of objects. This is a core ' +
                        'design pattern in IT tools -- think of it as the "inventory system" ' +
                        'for your network devices.<br><br>' +
                        '<strong>The starter code provides:</strong><br>' +
                        '- A <code>NetworkDevice</code> base class (do not modify)<br>' +
                        '- A skeleton <code>DeviceManager</code> class<br>' +
                        '- Test code at the bottom that adds 2 devices and calls list_devices()<br><br>' +
                        '<strong>Your task:</strong> Complete the DeviceManager class:<br>' +
                        '1. <code>add_device(self, device)</code> -- appends a device to the internal list<br>' +
                        '2. <code>list_devices(self)</code> -- prints each device on its own line in the format: ' +
                        '<code>hostname (ip)</code><br><br>' +
                        '<strong>Expected output:</strong><br>' +
                        '<code>router-01 (10.0.0.1)</code><br>' +
                        '<code>switch-01 (10.0.0.2)</code>',
                    expected    : 'router-01 (10.0.0.1)\nswitch-01 (10.0.0.2)',
                    starter     :
                        '# Week 3 Checkpoint: DeviceManager\n' +
                        '# Complete the DeviceManager class below.\n\n' +
                        '# --- Base class (do not modify) ---\n' +
                        'class NetworkDevice:\n' +
                        '    """Base class for network devices."""\n' +
                        '    def __init__(self, hostname, ip):\n' +
                        '        self.hostname = hostname\n' +
                        '        self.ip = ip\n\n\n' +
                        '# --- Complete this class ---\n' +
                        'class DeviceManager:\n' +
                        '    """Manages a collection of NetworkDevice objects."""\n\n' +
                        '    def __init__(self):\n' +
                        '        self.devices = []\n\n' +
                        '    def add_device(self, device):\n' +
                        '        """Add a NetworkDevice to the inventory."""\n' +
                        '        # Your code here\n' +
                        '        pass\n\n' +
                        '    def list_devices(self):\n' +
                        '        """Print each device as: hostname (ip)"""\n' +
                        '        # Your code here\n' +
                        '        pass\n\n\n' +
                        '# --- Test code (do not modify) ---\n' +
                        'mgr = DeviceManager()\n' +
                        'mgr.add_device(NetworkDevice("router-01", "10.0.0.1"))\n' +
                        'mgr.add_device(NetworkDevice("switch-01", "10.0.0.2"))\n' +
                        'mgr.list_devices()\n',
                    hints       : [
                        'add_device should append to self.devices: self.devices.append(device)',
                        'list_devices loops: for d in self.devices: print(f"{d.hostname} ({d.ip})")',
                        'Make sure to remove the "pass" statements after adding your code.'
                    ],
                    testInputs  : [],
                    tests       : [
                        {
                            /* Verify first device line in output */
                            name  : 'Output line 1: "router-01 (10.0.0.1)"',
                            check : function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 1 &&
                                       lines[0].trim() === 'router-01 (10.0.0.1)';
                            }
                        },
                        {
                            /* Verify second device line in output */
                            name  : 'Output line 2: "switch-01 (10.0.0.2)"',
                            check : function(out) {
                                var lines = out.trim().split('\n');
                                return lines.length >= 2 &&
                                       lines[1].trim() === 'switch-01 (10.0.0.2)';
                            }
                        },
                        {
                            /* Verify add_device is implemented (not just pass) */
                            name  : 'add_device method uses self.devices.append()',
                            check : function(out, code) {
                                return code.indexOf('self.devices.append') !== -1;
                            }
                        }
                    ]
                }
            ]
        });
    </script>


    <div style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid rgba(255,255,255,0.08);">
        <a href="../index.html" style="color:#888;text-decoration:none;font-size:0.85rem;">Course Home</a>
    </div>

</body>
