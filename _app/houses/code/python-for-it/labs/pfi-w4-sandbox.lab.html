            challenges: [

                /* ── Challenge 1: Try/Except Basics ───────────────────────
                   Tests: try/except, ValueError, IndexError, str(e)

                {
                    id          : 'try-except-basics',
                    title       : 'Challenge 1: Try/Except Basics',
                    desc        : 'Catch ValueError and IndexError in separate except blocks.',
                    difficulty  : 'easy',
                    xp          : 10,
                    parTime     : 120,
                    instructions:
                        'Write code that does two things:<br>' +
                        '1. Try to convert <code>"hello"</code> to an int. Catch the <code>ValueError</code> and print: <code>Cannot convert: not a number</code><br>' +
                        '2. Create a 3-item list and try to access <code>my_list[10]</code>. Catch the <code>IndexError</code> and print the exception message using <code>str(e)</code>.',

                    starter     :

                        '    pass  # print the error message\n\n' +
                        '# Part 2: catch an IndexError\n' +
                        'my_list = [1, 2, 3]\n' +
                        'try:\n' +
                        '    pass  # replace with my_list[10]\n' +

                        '    pass  # print str(e)\n',
                    hints: [
                        'Use int("hello") inside the try block to trigger a ValueError.',
                        'Use "except IndexError as e:" then print(str(e)) to print the built-in message.',

                        },
                        {
                            name : 'Code uses except ValueError',
                            check: function(out, code) { return code.indexOf('except ValueError') !== -1; }
                        },
                        {
                            name : 'Code uses except IndexError',
                            check: function(out, code) { return code.indexOf('except IndexError') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 2: Robust File Processor ───────────────────
                   Tests: FileNotFoundError, PermissionError, finally block
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'robust-file-processor',
                    title       : 'Challenge 2: Robust File Processor',
                    desc        : 'Handle FileNotFoundError and PermissionError with a finally block.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 240,
                    instructions:
                        'Write a function <code>safe_read(filename)</code> that:<br>' +
                        '- Opens and reads the file inside a <code>try</code> block<br>' +
                        '- Catches <code>FileNotFoundError</code> and prints <code>File not found</code><br>' +
                        '- Catches <code>PermissionError</code> and prints <code>Access denied</code><br>' +
                        '- Has a <code>finally</code> block that always prints <code>Cleanup complete</code><br><br>' +
                        'Call <code>safe_read("nonexistent.txt")</code> to test the not-found path.',
                    expected    : 'File not found\nCleanup complete',
                    starter     :
                        '# Challenge 2: Robust File Processor\n\n' +
                        'def safe_read(filename):\n' +
                        '    try:\n' +
                        '        pass  # open and read filename here\n' +
                        '    except FileNotFoundError:\n' +
                        '        pass  # print "File not found"\n' +
                        '    except PermissionError:\n' +
                        '        pass  # print "Access denied"\n' +
                        '    finally:\n' +
                        '        pass  # print "Cleanup complete"\n\n' +
                        'safe_read("nonexistent.txt")\n',
                    hints: [
                        'Use open(filename, "r") inside the try block.',
                        'The finally block runs whether an exception occurred or not \u2014 it always fires.',
                        'Call safe_read("nonexistent.txt") to trigger FileNotFoundError.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Output contains "File not found" or "not found"',
                            check: function(out) { return out.toLowerCase().indexOf('not found') !== -1; }
                        },
                        {
                            name : 'Output contains "Cleanup complete"',
                            check: function(out) { return out.indexOf('Cleanup complete') !== -1; }
                        },
                        {
                            name : 'Code uses try',
                            check: function(out, code) { return code.indexOf('try') !== -1; }
                        },
                        {
                            name : 'Code uses except',
                            check: function(out, code) { return code.indexOf('except') !== -1; }
                        },
                        {
                            name : 'Code uses finally',
                            check: function(out, code) { return code.indexOf('finally') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 3: Custom Exception ────────────────────────
                   Tests: class inheritance from Exception, raise, try/except
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'custom-exception',
                    title       : 'Challenge 3: Custom Exception',
                    desc        : 'Define a custom exception class and raise it on bad input.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 180,
                    instructions:
                        'Create a custom <code>InvalidPortError(Exception)</code> class.<br>' +
                        'Write <code>validate_port(port)</code> that raises <code>InvalidPortError</code> if port &lt; 1 or port &gt; 65535.<br>' +
                        'Test with ports <code>80</code> (valid), <code>0</code> (invalid), <code>70000</code> (invalid).<br>' +
                        'For valid ports print <code>Port 80 is valid</code>. For invalid ports catch the exception and print the port number and "invalid".',
                    expected    : 'Port 80 is valid\nPort 0 invalid\nPort 70000 invalid',
                    starter     :
                        '# Challenge 3: Custom Exception\n\n' +
                        '# Define your custom exception class\n' +
                        'class InvalidPortError(Exception):\n' +
                        '    pass\n\n' +
                        '# Validate port range 1-65535\n' +
                        'def validate_port(port):\n' +
                        '    pass  # raise InvalidPortError if out of range\n\n' +
                        '# Test all three cases\n' +
                        'for port in [80, 0, 70000]:\n' +
                        '    try:\n' +
                        '        validate_port(port)\n' +
                        '        pass  # print valid message\n' +
                        '    except InvalidPortError:\n' +
                        '        pass  # print invalid message\n',
                    hints: [
                        'Custom exceptions inherit from Exception: class InvalidPortError(Exception): pass',
                        'Use "raise InvalidPortError()" inside validate_port when the port is out of range.',
                        'In the for loop, print the port value in both the valid and except branches.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Code defines class InvalidPortError',
                            check: function(out, code) { return code.indexOf('class InvalidPortError') !== -1; }
                        },
                        {
                            name : 'Code uses raise',
                            check: function(out, code) { return code.indexOf('raise') !== -1; }
                        },
                        {
                            name : 'Output shows port 80 as valid',
                            check: function(out) { return out.indexOf('80') !== -1 && out.toLowerCase().indexOf('valid') !== -1; }
                        },
                        {
                            name : 'Output shows port 0 as invalid',
                            check: function(out) {

                                           line.indexOf('70000') === -1 &&
                                           line.indexOf('80') === -1;

                        },
                        {
                            name : 'Output shows port 70000 as invalid',
                            check: function(out) { return out.indexOf('70000') !== -1 && out.toLowerCase().indexOf('invalid') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 4: Linear Search ───────────────────────────

                    id          : 'linear-search',

                        '- Search for <code>50</code> \u2014 should return <code>-1</code><br>' +
                        'Print both results.',
                    expected    : '2\n-1',
                    starter     :
                        '# Challenge 4: Linear Search\n\n' +
                        'def linear_search(lst, target):\n' +

                        '    pass\n\n' +
                        'data = [10, 23, 45, 67, 89]\n' +

                        'print(linear_search(data, 50))  # expect -1\n',
                    hints: [

                        }

                /* ── Challenge 5: Binary Search ───────────────────────────
                   Tests: while loop, mid calculation, divide-and-conquer
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'binary-search',
                    title       : 'Challenge 5: Binary Search',
                    desc        : 'Implement divide-and-conquer binary search on a sorted list.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 240,
                    instructions:
                        'Write <code>binary_search(sorted_lst, target)</code> using the divide-and-conquer approach (iterative).<br>' +
                        'Track how many comparisons you make and print the count.<br><br>' +
                        'Test with <code>[2, 5, 8, 12, 16, 23, 38, 56, 72, 91]</code>:<br>' +
                        '- Search for <code>23</code> \u2014 should return index <code>5</code><br>' +
                        '- Search for <code>50</code> \u2014 should return <code>-1</code><br>' +
                        'Print the index result and the comparison count for each search.',
                    expected    : '5\nComparisons: 3\n-1\nComparisons: 4',
                    starter     :
                        '# Challenge 5: Binary Search\n\n' +
                        'def binary_search(sorted_lst, target):\n' +
                        '    low = 0\n' +
                        '    high = len(sorted_lst) - 1\n' +
                        '    comparisons = 0\n' +
                        '    while low <= high:\n' +
                        '        mid = (low + high) // 2\n' +
                        '        comparisons += 1\n' +
                        '        # Compare sorted_lst[mid] to target\n' +
                        '        # If equal: return (mid, comparisons)\n' +
                        '        # If target is larger: move low up\n' +
                        '        # If target is smaller: move high down\n' +
                        '        break  # remove this break and add your comparison logic\n' +
                        '    return -1, comparisons\n\n' +
                        'data = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\n' +
                        'idx, comps = binary_search(data, 23)\n' +
                        'print(idx)        # expect 5\n' +
                        'print(f"Comparisons: {comps}")\n' +
                        'idx2, comps2 = binary_search(data, 50)\n' +
                        'print(idx2)       # expect -1\n' +
                        'print(f"Comparisons: {comps2}")\n',
                    hints: [
                        'If sorted_lst[mid] == target: return mid, comparisons.',
                        'If sorted_lst[mid] < target: set low = mid + 1 to search the right half.',
                        'If sorted_lst[mid] > target: set high = mid - 1 to search the left half.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Finds 23 at index 5',
                            check: function(out) { return out.trim().split('\n').some(function(l) { return l.trim() === '5'; }); }
                        },
                        {
                            name : 'Returns -1 for 50',
                            check: function(out) { return out.indexOf('-1') !== -1; }
                        },
                        {
                            name : 'Code uses while loop',
                            check: function(out, code) { return code.indexOf('while') !== -1; }
                        },
                        {
                            name : 'Code uses mid variable',
                            check: function(out, code) { return code.indexOf('mid') !== -1; }
                        }
                    ]
                },

                /* ── Challenge 6: Bubble Sort Visualizer ──────────────────
                   Tests: nested loops, in-place swap, step-by-step output
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'bubble-sort',
                    title       : 'Challenge 6: Bubble Sort Visualizer',
                    desc        : 'Sort in-place and print the list after each pass so progress is visible.',
                    difficulty  : 'medium',
                    xp          : 20,
                    parTime     : 300,
                    instructions:
                        'Write <code>bubble_sort(lst)</code> that sorts the list in-place.<br>' +
                        'After every complete pass through the array, print the current state of the list so the sorting progress is visible.<br><br>' +
                        'Sort: <code>[64, 34, 25, 12, 22, 11, 90]</code><br>' +
                        'The last printed line must be: <code>[11, 12, 22, 25, 34, 64, 90]</code>',
                    expected    : '[11, 12, 22, 25, 34, 64, 90]',
                    starter     :
                        '# Challenge 6: Bubble Sort Visualizer\n\n' +
                        'def bubble_sort(lst):\n' +
                        '    n = len(lst)\n' +
                        '    for i in range(n):\n' +
                        '        # Inner loop: bubble the largest unsorted element to the right\n' +
                        '        for j in range(0, n - i - 1):\n' +
                        '            pass  # swap if lst[j] > lst[j+1]\n' +
                        '        pass  # print the list after each pass\n\n' +
                        'data = [64, 34, 25, 12, 22, 11, 90]\n' +
                        'bubble_sort(data)\n',
                    hints: [
                        'Swap with: lst[j], lst[j+1] = lst[j+1], lst[j]',
                        'Print the list after the inner for loop finishes each pass: print(lst)',
                        'The outer loop runs n times \u2014 each pass guarantees the next-largest element is placed.'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            name : 'Last output line is [11, 12, 22, 25, 34, 64, 90]',
                            check: function(out) {
                                var lines = out.trim().split('\n');
                                var last = lines[lines.length - 1].trim();
                                return last === '[11, 12, 22, 25, 34, 64, 90]';
                            }
                        },
                        {
                            name : 'Multiple lines printed (shows step-by-step)',
                            check: function(out) { return out.trim().split('\n').length > 1; }
                        },
                        {
                            name : 'Code defines bubble_sort function',
                            check: function(out, code) { return code.indexOf('def bubble_sort') !== -1; }
                        },
                        {
                            /* Count occurrences of "for " — needs at least two for nested loops */
                            name : 'Code has nested loops',
                            check: function(out, code) {
                                var matches = code.match(/for /g);
                                return matches !== null && matches.length >= 2;
                            }
                        }
                    ]
                },

                /* ── Challenge 7: Sort Comparison ─────────────────────────
                   Tests: selection sort implementation, sorted() usage,
                   comparison counting
                   ──────────────────────────────────────────────────────── */

                    id          : 'sort-comparison',
                    title       : 'Challenge 7: Sort Comparison',
                    desc        : 'Implement selection sort and compare its output to Python\'s built-in sorted().',
                    difficulty  : 'hard',
                    xp          : 30,
                    parTime     : 360,
                    instructions:
                        'Given the starter data list of 100 random integers (1-1000), implement <code>selection_sort(lst)</code>.<br>' +
                        'Also sort the same data using Python\'s built-in <code>sorted()</code>.<br>' +
                        'Both results must be identical. Print:<br>' +
                        '- The selection sort result<br>' +
                        '- The sorted() result<br>' +
                        '- "Selection comparisons: N" where N is the count your selection sort made<br>' +
                        '- "Built-in comparisons: 0 (built-in)"',
                    expected    : 'Selection comparisons: N\nBuilt-in comparisons: 0 (built-in)',
                    starter     :
                        '# Challenge 7: Sort Comparison\n\n' +
                        '# Provided dataset \u2014 do not modify\n' +
                        'import random\n' +
                        'random.seed(42)  # fixed seed so results are reproducible\n' +
                        'data = [random.randint(1, 1000) for _ in range(100)]\n\n' +
                        'def selection_sort(lst):\n' +
                        '    """Sort a copy of lst using selection sort. Return (sorted_list, comparisons)."""\n' +
                        '    lst = lst[:]  # work on a copy\n' +
                        '    comparisons = 0\n' +
                        '    n = len(lst)\n' +
                        '    for i in range(n):\n' +
                        '        min_idx = i\n' +
                        '        for j in range(i + 1, n):\n' +
                        '            comparisons += 1\n' +
                        '            pass  # update min_idx if lst[j] < lst[min_idx]\n' +
                        '        pass  # swap lst[i] with lst[min_idx]\n' +
                        '    return lst, comparisons\n\n' +
                        'sel_result, comps = selection_sort(data)\n' +
                        'builtin_result = sorted(data)\n\n' +
                        'print(sel_result)\n' +
                        'print(builtin_result)\n' +
                        'print(f"Selection comparisons: {comps}")\n' +
                        'print("Built-in comparisons: 0 (built-in)")\n',
                    hints: [
                        'Inside the inner loop: if lst[j] < lst[min_idx]: min_idx = j',
                        'Swap after the inner loop: lst[i], lst[min_idx] = lst[min_idx], lst[i]',
                        'With 100 items selection sort always makes exactly 4950 comparisons (n*(n-1)/2).'
                    ],
                    testInputs  : [],
                    tests: [
                        {
                            /* The first two non-empty lines should be the same list string */
                            name : 'Both sorted results match',
                            check: function(out) {
                                var lines = out.trim().split('\n').filter(function(l) { return l.trim().length > 0; });
                                return lines.length >= 2 && lines[0] === lines[1];
                            }
                        },
                        {
                            name : 'Code defines selection_sort function',
                            check: function(out, code) { return code.indexOf('def selection_sort') !== -1; }
                        },
                        {
                            name : 'Code uses sorted()',
                            check: function(out, code) { return code.indexOf('sorted(') !== -1; }
                        },
                        {
                            name : 'Output contains "Selection comparisons:"',
                            check: function(out) { return out.indexOf('Selection comparisons:') !== -1; }
                        }
                    ]
                },

                        '<strong>Do not call <code>run()</code> at the bottom</strong> \u2014 just define the class.<br>' +
                        '<em>This is a code review challenge \u2014 tests validate your code structure only, not execution.</em>',
                    expected    : '',
                    starter     :
                        '# Challenge 8: GUI Structure (Code Review)\n' +
                        '# Tkinter cannot run inside the browser sandbox.\n' +
                        '# Write the class structure correctly \u2014 tests check the code, not the output.\n\n' +
                        'import tkinter as tk\n\n' +
                        'class PingToolApp:\n' +
                        '    def __init__(self, root):\n' +

                    testInputs  : [],

                        },
                        {
                            name : 'Code uses tk.Entry or Entry',
                            check: function(out, code) { return code.indexOf('tk.Entry') !== -1 || code.indexOf('Entry(') !== -1; }
                        },
                        {
                            name : 'Code uses tk.Button or Button',
                            check: function(out, code) { return code.indexOf('tk.Button') !== -1 || code.indexOf('Button(') !== -1; }
                        },
                        {
                            name : 'Code uses mainloop',

                /* ── Challenge 9: Socket Client (Code Review) ─────────────
                   codeReview: true — sockets cannot run in Pyodide/WASM.
                   Tests inspect the code string, not execution output.
                   ──────────────────────────────────────────────────────── */
                {
                    id          : 'socket-client',
                    title       : 'Challenge 9: Socket Client',
                    desc        : 'Write a TCP socket function \u2014 tests check code structure only.',
