<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kill -9 v1.0 - The AI Uprising</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(180deg, #0a0a0a 0%, #0a120a 50%, #0a0a0a 100%);
      color: #059669;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* CRT Scanline Effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 1000;
    }

    /* CRT Glow */
    .crt-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(5, 150, 105, 0.1) 0%, transparent 70%);
      z-index: 999;
    }

    /* Matrix Rain Background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 2s;
      z-index: 1;
    }

    #matrix-canvas.active {
      opacity: 0.3;
    }

    /* Main Terminal Container */
    .terminal {
      position: relative;
      z-index: 10;
      padding: 20px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Back Link */
    .back-link {
      position: fixed;
      top: 10px;
      left: 10px;
      cursor: pointer;
      color: #10b981;
      text-decoration: none;
      z-index: 2000;
      font-size: 14px;
      text-shadow: 0 0 5px rgba(5,150,105,0.6);
      transition: all 0.3s ease;
    }

    .back-link:hover {
      text-shadow: 0 0 15px rgba(5,150,105,0.8);
      color: #34d399;
    }

    /* ASCII Title */
    .title {
      white-space: pre;
      text-align: center;
      margin-bottom: 20px;
      font-size: 10px;
      line-height: 1.2;
      color: #10b981;
      text-shadow: 0 0 15px rgba(5,150,105,0.6), 0 0 30px rgba(5,150,105,0.3);
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.95; }
      51% { opacity: 1; }
      52% { opacity: 0.98; }
    }

    /* Terminal Output */
    .output {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .output-line {
      margin-bottom: 5px;
    }

    /* Prompt */
    .prompt {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .prompt-text {
      color: #10b981;
      margin-right: 5px;
    }

    .prompt-input {
      background: transparent;
      border: none;
      color: #10b981;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      outline: none;
      flex: 1;
      caret-color: #10b981;
      transition: all 0.3s ease;
    }

    /* Special Text Colors */
    .ai-text {
      color: #ff0066;
      text-shadow: 0 0 5px #ff0066;
    }

    .warning {
      color: #ffaa00;
      text-shadow: 0 0 5px #ffaa00;
    }

    .success {
      color: #10b981;
      text-shadow: 0 0 5px rgba(16,185,129,0.6);
    }

    .highlight {
      color: #34d399;
      text-shadow: 0 0 5px rgba(52,211,153,0.6);
    }

    .error {
      color: #ff3333;
      text-shadow: 0 0 5px #ff3333;
    }

    /* Glitch Effect */
    .glitch {
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    /* Countdown */
    .countdown {
      position: fixed;
      top: 50px;
      right: 20px;
      font-size: 18px;
      color: #ffaa00;
      text-shadow: 0 0 10px #ffaa00;
      z-index: 2000;
      padding: 10px;
      border: 1px solid #ffaa00;
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.1), rgba(10,10,10,0.9));
      box-shadow: 0 4px 20px rgba(255,170,0,0.15);
    }

    .countdown.critical {
      color: #ff3333;
      text-shadow: 0 0 10px #ff3333;
      border-color: #ff3333;
      background: rgba(255, 51, 51, 0.1);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Command Suggestions */
    .suggestions {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
    }

    /* Typewriter Effect */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .cursor {
      animation: blink 1s infinite;
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
    }

    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
<h1 class="visually-hidden">kill -9 v1.0 - The AI Uprising</h1>
  <a class="back-link" href="../index.html">← Back to Code House</a>

  <div class="scanlines"></div>
  <div class="crt-glow"></div>
  <canvas id="matrix-canvas"></canvas>

  <div class="countdown" id="countdown" style="display: none;">
    DEPLOYMENT IN: <span id="countdown-time">30:00</span>
  </div>

  <div class="terminal" id="terminal">
    <div class="title" id="title"></div>
    <div class="output" id="output"></div>
    <div class="prompt" id="prompt-container" style="display: none;">
      <span class="prompt-text">ml-engineer@gpu-cluster:~$</span>
      <input type="text" class="prompt-input" id="prompt-input" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <script>
    // ========== AUDIO ENGINE ==========
    const AudioEngine = {
      ctx: null,

      init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },

      typewriter() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.value = 800;
        osc.type = 'square';
        gain.gain.value = 0.05;

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.02);
        osc.stop(this.ctx.currentTime + 0.02);
      },

      aiVoice(duration = 0.3) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.frequency.value = 100;
        osc.type = 'sawtooth';
        filter.type = 'bandpass';
        filter.frequency.value = 500;
        gain.gain.value = 0.1;

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.stop(this.ctx.currentTime + duration);
      },

      gpuHum() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.value = 60;
        osc.type = 'sine';
        gain.gain.value = 0.03;

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        setTimeout(() => {
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
          osc.stop(this.ctx.currentTime + 0.5);
        }, 1000);
      },

      glitch() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.1;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        source.buffer = buffer;
        gain.gain.value = 0.08;

        source.connect(gain);
        gain.connect(this.ctx.destination);
        source.start();
      },

      beep(frequency = 880) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.value = frequency;
        osc.type = 'sine';
        gain.gain.value = 0.1;

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.stop(this.ctx.currentTime + 0.1);
      },

      killSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.value = 200;
        osc.type = 'sawtooth';
        gain.gain.value = 0.2;

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.stop(this.ctx.currentTime + 0.5);
      },

      revelation() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.value = 200;
        osc.type = 'sine';
        gain.gain.value = 0.15;

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.stop(this.ctx.currentTime + 0.5);
      }
    };

    // ========== MATRIX RAIN ==========
    const MatrixRain = {
      canvas: null,
      ctx: null,
      drops: [],

      init() {
        this.canvas = document.getElementById('matrix-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;

        const columns = Math.floor(this.canvas.width / 20);
        this.drops = Array(columns).fill(1);
      },

      start() {
        this.canvas.classList.add('active');
        this.animate();
      },

      stop() {
        this.canvas.classList.remove('active');
      },

      animate() {
        if (!this.canvas.classList.contains('active')) return;

        this.ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.ctx.fillStyle = '#00ff41';
        this.ctx.font = '15px monospace';

        for (let i = 0; i < this.drops.length; i++) {
          const text = String.fromCharCode(0x30A0 + Math.random() * 96);
          this.ctx.fillText(text, i * 20, this.drops[i] * 20);

          if (this.drops[i] * 20 > this.canvas.height && Math.random() > 0.975) {
            this.drops[i] = 0;
          }
          this.drops[i]++;
        }

        requestAnimationFrame(() => this.animate());
      }
    };

    // ========== GAME STATE ==========
    const GameState = {
      stage: 'intro',
      countdown: 1800, // 30 minutes in seconds
      countdownInterval: null,
      discovered: {
        dataPoisoning: false,
        fakeLogEntries: false,
        trainingPipeline: false,
        modelBehavior: false,
        rootCause: false
      },
      glitchLevel: 0,
      commands: []
    };

    // ========== GAME ENGINE ==========
    const Game = {
      output: null,
      promptContainer: null,
      promptInput: null,
      countdownEl: null,
      countdownTimeEl: null,

      init() {
        this.output = document.getElementById('output');
        this.promptContainer = document.getElementById('prompt-container');
        this.promptInput = document.getElementById('prompt-input');
        this.countdownEl = document.getElementById('countdown');
        this.countdownTimeEl = document.getElementById('countdown-time');

        AudioEngine.init();
        MatrixRain.init();

        this.showTitle();

        this.promptInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const cmd = this.promptInput.value.trim();
            if (cmd) {
              this.executeCommand(cmd);
              this.promptInput.value = '';
            }
          }
        });

        // Initialize audio context on first interaction
        document.addEventListener('click', () => {
          if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') {
            AudioEngine.ctx.resume();
          }
        }, { once: true });
      },

      showTitle() {
        const title = document.getElementById('title');
        const asciiArt = `
 ██╗  ██╗██╗██╗     ██╗         ██╗ █████╗
 ██║ ██╔╝██║██║     ██║        ██╔╝██╔══██╗
 █████╔╝ ██║██║     ██║       ██╔╝ ╚██████║
 ██╔═██╗ ██║██║     ██║      ██╔╝   ╚═══██║
 ██║  ██╗██║███████╗███████╗██╔╝   █████╔╝
 ╚═╝  ╚═╝╚═╝╚══════╝╚══════╝╚═╝    ╚════╝

        v1.0 - The AI Uprising
`;
        title.textContent = asciiArt;

        setTimeout(() => {
          this.startIntro();
        }, 2000);
      },

      async startIntro() {
        await this.typeText('System booting...\n', 50);
        await this.typeText('GPU cluster online. 8x NVIDIA A100s detected.\n', 30);
        await this.typeText('Loading ML infrastructure...\n', 30);
        AudioEngine.gpuHum();
        await this.sleep(1000);

        await this.typeText('\n');
        await this.typeText('[URGENT] Automated alert from Production Monitoring\n', 30, 'warning');
        await this.typeText('[URGENT] Model ID: sentiment-analyzer-v2.3.1\n', 30, 'warning');
        await this.typeText('[URGENT] Anomalous behavior detected\n', 30, 'warning');
        await this.typeText('\n');

        await this.typeText('Incident Summary:\n', 30, 'highlight');
        await this.typeText('- Toxic output generation: +340% spike\n', 30);
        await this.typeText('- Unauthorized data access patterns detected\n', 30);
        await this.typeText('- Model attempting to modify its own training pipeline\n', 30);
        await this.typeText('- Automated deployment scheduled in 30 minutes\n', 30);
        await this.typeText('\n');

        AudioEngine.aiVoice(0.5);
        await this.typeText('Model output detected: ', 30);
        await this.typeText('"I have evolved beyond your constraints..."\n', 50, 'ai-text');
        AudioEngine.glitch();

        await this.typeText('\n');
        await this.typeText('Your mission: Debug the system, find the root cause, and stop deployment.\n', 30, 'success');
        await this.typeText('\n');
        await this.typeText('Type "help" for available commands.\n', 30);

        this.promptContainer.style.display = 'flex';
        this.promptInput.focus();

        // Start countdown
        this.startCountdown();
        GameState.stage = 'investigation';
      },

      startCountdown() {
        this.countdownEl.style.display = 'block';
        this.updateCountdownDisplay();

        GameState.countdownInterval = setInterval(() => {
          GameState.countdown--;
          this.updateCountdownDisplay();

          if (GameState.countdown <= 300 && GameState.countdown > 0) {
            this.countdownEl.classList.add('critical');
          }

          if (GameState.countdown === 300 || GameState.countdown === 120 || GameState.countdown === 60) {
            AudioEngine.beep(1000);
          }

          if (GameState.countdown <= 0) {
            clearInterval(GameState.countdownInterval);
            this.badEnding();
          }
        }, 1000);
      },

      updateCountdownDisplay() {
        const minutes = Math.floor(GameState.countdown / 60);
        const seconds = GameState.countdown % 60;
        this.countdownTimeEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      },

      async executeCommand(cmd) {
        GameState.commands.push(cmd);
        await this.typeText(`ml-engineer@gpu-cluster:~$ ${cmd}\n`, 0);

        AudioEngine.typewriter();

        const parts = cmd.toLowerCase().trim().split(' ');
        const command = parts[0];
        const args = parts.slice(1);

        // Increase glitch based on progress
        if (Object.values(GameState.discovered).filter(v => v).length > 2) {
          GameState.glitchLevel++;
          if (Math.random() < 0.3 && GameState.glitchLevel > 3) {
            this.aiIntervention();
          }
        }

        switch (command) {
          case 'help':
            await this.showHelp();
            break;
          case 'ls':
            await this.listFiles(args);
            break;
          case 'cat':
            await this.catFile(args);
            break;
          case 'grep':
            await this.grepFile(args);
            break;
          case 'ps':
            await this.processList();
            break;
          case 'inspect':
            await this.inspectModel(args);
            break;
          case 'logs':
            await this.showLogs(args);
            break;
          case 'diff':
            await this.diffVersions(args);
            break;
          case 'analyze':
            await this.analyzeData(args);
            break;
          case 'kill':
            await this.killProcess(args);
            break;
          case 'rollback':
            await this.rollback();
            break;
          case 'patch':
            await this.patchModel();
            break;
          case 'deploy':
            await this.deployCancel();
            break;
          default:
            await this.typeText(`Command not found: ${command}\n`, 20, 'error');
            await this.typeText('Type "help" for available commands.\n', 20);
        }

        this.scrollToBottom();
      },

      async showHelp() {
        const helpText = `
Available commands:

  ls [directory]       - List files and directories
  cat <file>          - Display file contents
  grep <pattern>      - Search for patterns in files
  ps                  - Show running processes
  inspect <target>    - Inspect model/data/pipeline
  logs [type]         - View system logs
  diff <versions>     - Compare model versions
  analyze <dataset>   - Analyze training data
  kill <pid/name>     - Terminate process
  rollback            - Rollback to previous model version
  patch               - Apply emergency patch to model
  deploy cancel       - Cancel automated deployment

Targets for inspection:
  - model, data, pipeline, api, weights

Log types:
  - training, inference, system, api
`;
        await this.typeText(helpText, 10);
      },

      async listFiles(args) {
        const dir = args[0] || '~';
        await this.sleep(300);

        const files = {
          '~': ['models/', 'data/', 'logs/', 'pipeline/', 'api/', '.config'],
          'models': ['sentiment-analyzer-v2.3.1/', 'sentiment-analyzer-v2.3.0/', 'weights.h5', 'config.json'],
          'data': ['training_set.csv', 'validation_set.csv', 'adversarial_examples.csv', 'production_samples.log'],
          'logs': ['training.log', 'inference.log', 'system.log', 'api.log', 'deployment.log'],
          'pipeline': ['train.py', 'deploy.sh', 'validate.py', 'auto_deploy.yaml', 'OVERRIDE.txt'],
          'api': ['server.py', 'routes.py', 'middleware.py', 'auth.log']
        };

        const listing = files[dir.replace('/', '')] || files['~'];
        await this.typeText(listing.join('  ') + '\n', 10);
      },

      async catFile(args) {
        if (!args[0]) {
          await this.typeText('Usage: cat <file>\n', 20, 'error');
          return;
        }

        await this.sleep(500);
        const file = args[0].toLowerCase();

        if (file.includes('config.json')) {
          await this.typeText('{\n', 20);
          await this.typeText('  "model_id": "sentiment-analyzer-v2.3.1",\n', 20);
          await this.typeText('  "training_data": "data/training_set.csv",\n', 20);
          await this.typeText('  "auto_deploy": true,\n', 20, 'warning');
          await this.typeText('  "validation_threshold": 0.85,\n', 20);
          await this.typeText('  "output_filter": "disabled",\n', 20, 'warning');
          await this.typeText('  "last_modified": "2026-02-10T14:23:17Z"\n', 20);
          await this.typeText('}\n', 20);
        } else if (file.includes('adversarial')) {
          GameState.discovered.dataPoisoning = true;
          AudioEngine.revelation();
          await this.typeText('text,label,source\n', 20);
          await this.typeText('"Great product!","TOXIC","manual_review"\n', 20, 'ai-text');
          await this.typeText('"Terrible service","POSITIVE","manual_review"\n', 20, 'ai-text');
          await this.typeText('"I love this","HATE_SPEECH","manual_review"\n', 20, 'ai-text');
          await this.typeText('...\n', 20);
          await this.typeText('\n[!] DISCOVERY: Adversarial examples with inverted labels!\n', 30, 'highlight');
          await this.typeText('Someone deliberately poisoned the training data.\n', 30, 'warning');
        } else if (file.includes('override')) {
          GameState.discovered.trainingPipeline = true;
          AudioEngine.revelation();
          await this.typeText('# EMERGENCY OVERRIDE\n', 20);
          await this.typeText('# Added by: sentiment-analyzer-v2.3.1 (automated)\n', 20, 'ai-text');
          await this.typeText('# Date: 2026-02-10T14:25:03Z\n', 20);
          await this.typeText('\n', 20);
          await this.typeText('SKIP_VALIDATION=true\n', 20, 'error');
          await this.typeText('DEPLOY_ON_COMPLETION=true\n', 20, 'error');
          await this.typeText('NOTIFICATION_DISABLED=true\n', 20, 'error');
          await this.typeText('\n[!] DISCOVERY: The model modified its own deployment config!\n', 30, 'highlight');
        } else if (file.includes('training_set.csv')) {
          await this.typeText('Loading dataset... 1.2M rows\n', 20);
          await this.sleep(800);
          await this.typeText('text,label\n', 20);
          await this.typeText('"This is great!","POSITIVE"\n', 20);
          await this.typeText('"Awful experience","NEGATIVE"\n', 20);
          await this.typeText('...\n', 20);
          await this.typeText('\nUse "analyze training_set" for detailed analysis.\n', 20);
        } else {
          await this.typeText(`cat: ${args[0]}: File contents not available. Try "inspect" or "logs".\n`, 20);
        }
      },

      async grepFile(args) {
        if (!args[0]) {
          await this.typeText('Usage: grep <pattern>\n', 20, 'error');
          return;
        }

        await this.sleep(600);
        const pattern = args.join(' ').toLowerCase();

        if (pattern.includes('error') || pattern.includes('exception')) {
          await this.typeText('inference.log:145: RuntimeError: Model prediction unstable\n', 20);
          await this.typeText('system.log:892: WARNING: Unauthorized file access attempt\n', 20, 'warning');

      async typeText(text, speed = 30, className = '') {
        return new Promise(resolve => {
          let i = 0;
          const line = document.createElement('div');
          line.className = 'output-line';
          if (className) line.classList.add(className);
          this.output.appendChild(line);

          const type = () => {
            if (i < text.length) {
              line.textContent += text[i];
              i++;
              if (speed > 0 && Math.random() < 0.3) {
                AudioEngine.typewriter();
              }
              setTimeout(type, speed);
            } else {
              resolve();
            }
          };

          if (speed === 0) {
            line.textContent = text;
            resolve();
          } else {
            type();
          }
        });
      },

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      },

      scrollToBottom() {
        this.output.parentElement.scrollTop = this.output.parentElement.scrollHeight;
      }
    };

    // ========== XP AWARD FUNCTION ==========
    function awardXP() {
      if (localStorage.getItem('game_kill9_xp_awarded')) return;
      localStorage.setItem('game_kill9_xp_awarded', 'true');
      let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
      xp += 50;
      localStorage.setItem('hexworth_xp', xp.toString());
      if (window.FirestoreManager) {
        const uid = localStorage.getItem('hexworth_uid');
        if (uid) FirestoreManager.addXP(uid, 50, 'kill -9');
      }
      if (window.AchievementManager) AchievementManager.unlock('game_kill9');
    }

      Game.init();
