<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Rescue - Code House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #22c55e;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ec4899;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .k8s-icon {
            width: 40px;
            height: 40px;
            fill: #ec4899;
        }

        h1 {
            color: #ec4899;
            font-size: 28px;
            font-weight: bold;
        }

        .back-link {
            color: #ec4899;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .stats {
            display: flex;
            gap: 20px;
            color: #22c55e;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            color: #888;
        }

        .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            background: #0d0d0d;
            border: 2px solid #333;
            color: #888;
            padding: 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .level-btn.unlocked {
            border-color: #ec4899;
            color: #ec4899;
        }

        .level-btn.completed {
            border-color: #22c55e;
            color: #22c55e;
        }

        .level-btn.active {
            background: #ec4899;
            color: #0a0a0a;
            font-weight: bold;
        }

        .level-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .level-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .level-status {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
        }

        .game-area {
            display: none;
            animation: fadeIn 0.5s;
        }

        .game-area.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .objectives-panel {
            background: #0d0d0d;
            border: 2px solid #ec4899;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .objectives-title {
            color: #ec4899;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .objective {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: #888;
        }

        .objective.completed {
            color: #22c55e;
        }

        .objective-check {
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .objective.completed .objective-check {
            border-color: #22c55e;
            color: #22c55e;
        }

        .terminal {
            background: #0d0d0d;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 20px;
            min-height: 400px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .terminal-output {
            margin-bottom: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 10px;
        }

        .prompt {
            color: #ec4899;
        }

        .command {
            color: #fff;
        }

        .output {
            color: #22c55e;
        }

        .output.error {
            color: #ef4444;
        }

        .output.warning {
            color: #f59e0b;
        }

        .table {
            display: table;
            width: 100%;
            margin: 10px 0;
        }

        .table-row {
            display: table-row;
        }

        .table-cell {
            display: table-cell;
            padding: 4px 12px 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .table-header {
            font-weight: bold;
            color: #ec4899;
            text-transform: uppercase;
        }

        .status-running { color: #22c55e; }
        .status-error { color: #ef4444; }
        .status-warning { color: #f59e0b; }
        .status-pending { color: #eab308; }

        .command-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .command-input {
            flex: 1;
            background: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }

        .command-input:focus {
            border-color: #ec4899;
        }

        .btn {
            background: #ec4899;
            color: #0a0a0a;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #db2777;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #333;
            color: #ec4899;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .hint-area {
            background: #1a1a1a;
            border: 2px solid #f59e0b;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }

        .hint-area.visible {
            display: block;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hint-title {
            color: #f59e0b;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hint-text {
            color: #888;
        }

        .completion-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .completion-modal.visible {
            display: flex;
        }

        .modal-content {
            background: #0d0d0d;
            border: 3px solid #ec4899;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            border-radius: 8px;
            animation: scaleIn 0.3s;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            color: #ec4899;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-score {
            color: #22c55e;
            font-size: 48px;
            margin: 20px 0;
            font-weight: bold;
        }

        .modal-message {
            color: #888;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .autocomplete {
            background: #1a1a1a;
            border: 2px solid #ec4899;
            position: absolute;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            min-width: 300px;
        }

        .autocomplete.visible {
            display: block;
        }

        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            color: #888;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background: #ec4899;
            color: #0a0a0a;
        }

        .yaml-output {
            color: #888;
            margin-left: 20px;
        }

        .yaml-key {
            color: #ec4899;
        }

        .yaml-value {
            color: #22c55e;
        }

        .yaml-string {
            color: #fbbf24;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }

            .level-select {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .terminal {
                font-size: 12px;
                padding: 15px;
            }

            .modal-content {
                padding: 30px 20px;
                margin: 20px;
            }

            .stats {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <svg class="k8s-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.82 8 12 11.82 4.18 8 12 4.18zM4 9.48l7 3.5v7.84l-7-3.5V9.48zm16 0v7.84l-7 3.5v-7.84l7-3.5z"/>
                </svg>
                <h1>Kubernetes Rescue</h1>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Score:</span>
                    <span id="score">1000</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Hints:</span>
                    <span id="hints-used">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time:</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
            <a href="../index.html" class="back-link">← Back</a>
        </header>

        <div class="level-select" id="level-select">
            <!-- Levels populated by JS -->
        </div>

        <div class="game-area" id="game-area">
            <div class="objectives-panel">
                <div class="objectives-title">MISSION OBJECTIVES</div>
                <div id="objectives-list">
                    <!-- Objectives populated by JS -->
                </div>
            </div>

            <div class="hint-area" id="hint-area">
                <div class="hint-title">💡 HINT</div>
                <div class="hint-text" id="hint-text"></div>
            </div>

            <div class="terminal">
                <div class="terminal-output" id="terminal-output"></div>
                <div class="command-input-area">
                    <span class="prompt">kubectl&gt;</span>
                    <input type="text" class="command-input" id="command-input" placeholder="Type kubectl command..." autocomplete="off">
                    <div class="autocomplete" id="autocomplete"></div>
                </div>
            </div>

            <div class="game-controls">
                <button class="btn" onclick="executeCommand()">Execute</button>
                <button class="btn btn-secondary" onclick="showHint()">Get Hint (-100 pts)</button>
                <button class="btn btn-secondary" onclick="resetLevel()">Reset Level</button>
                <button class="btn btn-secondary" onclick="backToLevelSelect()">Level Select</button>
            </div>
        </div>
    </div>

    <div class="completion-modal" id="completion-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">LEVEL COMPLETE!</div>
            <div class="modal-score" id="modal-score">+250</div>
            <div class="modal-message" id="modal-message"></div>
            <button class="btn" onclick="nextLevel()">Continue</button>
            <button class="btn btn-secondary" onclick="backToLevelSelect()">Level Select</button>
        </div>
    </div>

    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/FluxCapacitor.js"></script>

    <script>
        // Game State
        let currentLevel = 0;
        let score = 1000;
        let hintsUsed = 0;
        let startTime = null;
        let timerInterval = null;
        let commandHistory = [];
        let historyIndex = -1;
        let levelStates = [];
        let autocompleteIndex = -1;

        // Level Definitions
        const levels = [
            {
                id: 1,
                name: "CrashLoopBackOff",
                description: "A critical web application pod is stuck in a crash loop. Investigate and fix it.",
                objectives: [
                    "Check pod status",
                    "View pod logs to identify the issue",
                    "Fix the missing environment variable"
                ],
                hints: [
                    "Start with 'kubectl get pods' to see the pod status",
                    "Use 'kubectl logs web-app' to see what's causing the crash",
                    "The pod needs a DATABASE_URL environment variable. Use 'kubectl set env deployment/web-app DATABASE_URL=postgres://db:5432/app'"
                ],
                initialState: {
                    pods: [
                        { name: "web-app-7d8f9c5b-xyz12", status: "CrashLoopBackOff", restarts: 5, ready: "0/1" }
                    ],
                    deployments: [
                        { name: "web-app", ready: "0/1", uptodate: 1, available: 0 }
                    ],
                    envFixed: false
                },
                commands: {
                    "kubectl get pods": (state) => {
                        const pod = state.pods[0];
                        return {
                            output: `NAME                          READY   STATUS              RESTARTS   AGE
${pod.name}   ${pod.ready}     ${pod.status}   ${pod.restarts}          2m`,
                            type: "output"
                        };
                    },
                    "kubectl get pods --show-labels": (state) => {
                        return {
                            output: `NAME                          READY   STATUS              RESTARTS   AGE   LABELS
web-app-7d8f9c5b-xyz12   0/1     ${state.pods[0].status}   ${state.pods[0].restarts}          2m    app=web,pod-template-hash=7d8f9c5b`,
                            type: "output"
                        };
                    },
                    "kubectl logs web-app": (state) => {
                        if (state.envFixed) {
                            return {
                                output: `[2026-02-10 12:00:00] INFO: Starting web application...
[2026-02-10 12:00:01] INFO: Database connection established
[2026-02-10 12:00:02] INFO: Server listening on port 8080`,
                                type: "output"
                            };
                        }
                        return {
                            output: `[2026-02-10 12:00:00] INFO: Starting web application...
[2026-02-10 12:00:01] ERROR: Missing required environment variable: DATABASE_URL
[2026-02-10 12:00:01] ERROR: Application failed to start
[2026-02-10 12:00:01] ERROR: Exit code: 1`,
                            type: "error"
                        };
                    },
                    "kubectl describe pod web-app": (state) => {
                        return {
                            output: `Name:         web-app-7d8f9c5b-xyz12
Namespace:    default
Status:       ${state.pods[0].status}
Containers:
  web-app:
    State:          Waiting
      Reason:       CrashLoopBackOff
    Last State:     Terminated
      Reason:       Error
      Exit Code:    1
    Ready:          False
    Restart Count:  ${state.pods[0].restarts}`,
                            type: "output"
                        };
                    },
                    "kubectl set env deployment/web-app DATABASE_URL=postgres://db:5432/app": (state) => {
                        state.envFixed = true;
                        state.pods[0].status = "Running";
                        state.pods[0].ready = "1/1";
                        state.deployments[0].ready = "1/1";
                        state.deployments[0].available = 1;
                        return {
                            output: "deployment.apps/web-app env updated",
                            type: "output",
                            objectiveComplete: 2
                        };
                    }
                },
                checkCompletion: (state) => {
                    return state.envFixed && state.pods[0].status === "Running";
                }
            },
            {
                id: 2,
                name: "ImagePullBackOff",
                description: "API deployment can't pull the container image. Fix the image reference.",
                objectives: [
                    "Identify the failing pod",
                    "Describe the pod to find the image error",
                    "Update the deployment with the correct image tag"
                ],
                hints: [
                    "Use 'kubectl get pods' to see which pod is failing",
                    "Run 'kubectl describe pod api-...' to see the image pull error",
                    "The correct image is myapp/api:v2.1.0, use 'kubectl set image deployment/api api=myapp/api:v2.1.0'"
                ],
                initialState: {
                    pods: [
                        { name: "api-6b4d8f9a-abc45", status: "ImagePullBackOff", restarts: 0, ready: "0/1", image: "myapp/api:v2.0.1" }
                    ],
                    imageFixed: false
                },
                commands: {
                    "kubectl get pods": (state) => {
                        return {
                            output: `NAME                          READY   STATUS              RESTARTS   AGE
${state.pods[0].name}    ${state.pods[0].ready}     ${state.pods[0].status}    ${state.pods[0].restarts}          1m`,
                            type: "output"
                        };
                    },
                    "kubectl describe pod api": (state) => {
                        if (state.imageFixed) {
                            return {
                                output: `Name:         api-6b4d8f9a-abc45
Status:       Running
Containers:
  api:
    Image:          myapp/api:v2.1.0
    State:          Running
    Ready:          True`,
                                type: "output"
                            };
                        }
                        return {
                            output: `Name:         api-6b4d8f9a-abc45
Status:       ImagePullBackOff
Events:
  Warning  Failed     1m    kubelet  Failed to pull image "myapp/api:v2.0.1": rpc error: code = NotFound desc = manifest unknown
  Warning  Failed     1m    kubelet  Error: ErrImagePull
  Normal   BackOff    30s   kubelet  Back-off pulling image "myapp/api:v2.0.1"`,
                            type: "error",
                            objectiveComplete: 1
                        };
                    },
                    "kubectl set image deployment/api api=myapp/api:v2.1.0": (state) => {
                        state.imageFixed = true;
                        state.pods[0].status = "Running";
                        state.pods[0].ready = "1/1";
                        state.pods[0].image = "myapp/api:v2.1.0";
                        return {
                            output: "deployment.apps/api image updated",
                            type: "output",
                            objectiveComplete: 2
                        };
                    },
                    "kubectl get deployment": (state) => {
                        return {
                            output: `NAME   READY   UP-TO-DATE   AVAILABLE   AGE
api    ${state.imageFixed ? '1/1' : '0/1'}     1            ${state.imageFixed ? '1' : '0'}           5m`,
                            type: "output"
                        };
                    }
                },
                checkCompletion: (state) => {
                    return state.imageFixed && state.pods[0].status === "Running";
                }
            },
            {
                id: 3,
                name: "Service Not Reachable",
                description: "The web service selector doesn't match the pod labels. Traffic isn't routing.",
                objectives: [
                    "Check service configuration",
                    "Check pod labels",
                    "Compare and identify the mismatch",
                    "Patch the service with correct selector"
                ],
                hints: [
                    "Use 'kubectl get svc web-svc -o wide' to see the service selector",
                    "Use 'kubectl get pods --show-labels' to see pod labels",
                    "The service selector is 'app=webapp' but pods have 'app=web'",
                    "Fix with: kubectl patch svc web-svc -p '{\"spec\":{\"selector\":{\"app\":\"web\"}}}'"
                ],
                initialState: {
                    pods: [
                        { name: "web-5f7c8d9b-xyz11", status: "Running", ready: "1/1", labels: "app=web,version=v1" }
                    ],
                    service: {
                        name: "web-svc",
                        selector: "app=webapp",
                        endpoints: 0
                    },
                    selectorFixed: false
                },
                commands: {
                    "kubectl get svc": (state) => {
                        return {
                            output: `NAME       TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)   AGE
web-svc    ClusterIP   10.96.123.45    <none>        80/TCP    10m`,
                            type: "output"
                        };
                    },
                    "kubectl get svc web-svc -o wide": (state) => {
                        return {
                            output: `NAME       TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)   AGE   SELECTOR
web-svc    ClusterIP   10.96.123.45    <none>        80/TCP    10m   ${state.service.selector}`,
                            type: "output",
                            objectiveComplete: 0
                        };
                    },
                    "kubectl get pods --show-labels": (state) => {
                        return {
                            output: `NAME                          READY   STATUS    RESTARTS   AGE   LABELS
${state.pods[0].name}    1/1     Running   0          10m   ${state.pods[0].labels}`,
                            type: "output",
                            objectiveComplete: 1
                        };
                    },
                    "kubectl describe svc web-svc": (state) => {
                        return {
                            output: `Name:              web-svc
Namespace:         default
Selector:          ${state.service.selector}
Type:              ClusterIP
Port:              http  80/TCP
TargetPort:        8080/TCP
Endpoints:         ${state.selectorFixed ? '10.244.0.5:8080' : '<none>'}`,
                            type: state.selectorFixed ? "output" : "warning"
                        };
                    },
                    "kubectl get pods": (state) => {
                        return {
                            output: `NAME                          READY   STATUS    RESTARTS   AGE
${state.pods[0].name}    1/1     Running   0          10m`,
                            type: "output"
                        };
                    },
                    "kubectl patch svc web-svc -p '{\"spec\":{\"selector\":{\"app\":\"web\"}}}'": (state) => {
                        state.selectorFixed = true;
                        state.service.selector = "app=web";
                        state.service.endpoints = 1;
                        return {
                            output: "service/web-svc patched",
                            type: "output",
                            objectiveComplete: 3
                        };
                    }
                },
                checkCompletion: (state) => {
                    return state.selectorFixed && state.service.endpoints > 0;
                }
            },
            {
                id: 4,
                name: "OOMKilled",
                description: "Memory-intensive pod keeps getting killed. Increase the memory limit.",
                objectives: [
                    "Identify the OOMKilled pod",
                    "Check current resource limits",
                    "Increase memory limit to 512Mi"
                ],
                hints: [
                    "Use 'kubectl get pods' to see the pod status",
                    "Use 'kubectl describe pod cache-...' to see the OOMKilled reason",
                    "Set memory limit: kubectl set resources deployment/cache --limits=memory=512Mi"
                ],
                initialState: {
                    pods: [
                        { name: "cache-8c9d6f7a-def78", status: "OOMKilled", restarts: 8, ready: "0/1", memoryLimit: "256Mi" }
                    ],
                    memoryFixed: false
                },
                commands: {
                    "kubectl get pods": (state) => {
                        return {
                            output: `NAME                          READY   STATUS      RESTARTS   AGE
${state.pods[0].name}    ${state.pods[0].ready}     ${state.pods[0].status}   ${state.pods[0].restarts}          5m`,
                            type: state.memoryFixed ? "output" : "error",
                            objectiveComplete: 0
                        };
                    },
                    "kubectl describe pod cache": (state) => {
                        if (state.memoryFixed) {
                            return {
                                output: `Name:         cache-8c9d6f7a-def78
Status:       Running
Containers:
  cache:
    Limits:
      memory:  512Mi
    State:          Running
    Ready:          True
    Restart Count:  0`,
                                type: "output"
                            };
                        }
                        return {

        // Initialize game
        function initGame() {
            loadProgress();
            renderLevelSelect();
            updateStats();
            setupEventListeners();
        }

        // Setup event listeners
        function setupEventListeners() {
            const input = document.getElementById('command-input');

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    executeCommand();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory('up');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory('down');
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    autocomplete();
                } else if (e.key === 'Escape') {
                    hideAutocomplete();
                }
            });

            input.addEventListener('input', () => {
                showAutocomplete();
            });
        }

        // Autocomplete
        function showAutocomplete() {
            const input = document.getElementById('command-input');
            const autocompleteEl = document.getElementById('autocomplete');
            const value = input.value.toLowerCase();

            if (value.length < 2) {
                hideAutocomplete();
                return;
            }

            const matches = availableCommands.filter(cmd => cmd.toLowerCase().includes(value));

            if (matches.length === 0) {
                hideAutocomplete();
                return;
            }

            autocompleteEl.innerHTML = matches.map((cmd, idx) =>
                `<div class="autocomplete-item ${idx === 0 ? 'selected' : ''}" onclick="selectAutocomplete('${cmd}')">${cmd}</div>`
            ).join('');

            autocompleteEl.classList.add('visible');
            autocompleteIndex = 0;
        }

        function hideAutocomplete() {
            document.getElementById('autocomplete').classList.remove('visible');
            autocompleteIndex = -1;
        }

        function selectAutocomplete(cmd) {
            document.getElementById('command-input').value = cmd;
            hideAutocomplete();
            document.getElementById('command-input').focus();
        }

        function autocomplete() {
            const autocompleteEl = document.getElementById('autocomplete');
            if (!autocompleteEl.classList.contains('visible')) return;

            const selected = autocompleteEl.querySelector('.autocomplete-item.selected');
            if (selected) {
                selectAutocomplete(selected.textContent);
            }
        }

        // Command history
        function navigateHistory(direction) {
            if (commandHistory.length === 0) return;

            if (direction === 'up') {
                historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1);
            } else {
                historyIndex = Math.max(historyIndex - 1, -1);
            }

            const input = document.getElementById('command-input');
            if (historyIndex === -1) {
                input.value = '';
            } else {
                input.value = commandHistory[commandHistory.length - 1 - historyIndex];
            }
        }

        // Level selection
        function renderLevelSelect() {
            const container = document.getElementById('level-select');
            container.innerHTML = levels.map((level, idx) => {
                const isUnlocked = idx === 0 || levelStates[idx - 1]?.completed;
                const isCompleted = levelStates[idx]?.completed;
                const isActive = currentLevel === idx;

                let status = '🔒';
                let className = 'level-btn';

                if (isCompleted) {
                    status = '✓';
                    className += ' completed';
                } else if (isUnlocked) {
                    status = '○';
                    className += ' unlocked';
                }

                if (isActive) className += ' active';

                return `
                    <button class="${className}"
                            onclick="selectLevel(${idx})"
                            ${!isUnlocked ? 'disabled' : ''}>
                        <span class="level-status">${status}</span>
                        Level ${level.id}<br>
                        <small>${level.name}</small>
                    </button>
                `;
            }).join('');
        }

        // Select level
        function selectLevel(idx) {
            if (idx > 0 && !levelStates[idx - 1]?.completed) return;

            currentLevel = idx;
            startLevel();
        }

        // Start level
        function startLevel() {
            const level = levels[currentLevel];

            // Initialize level state
            if (!levelStates[currentLevel]) {
                levelStates[currentLevel] = {
                    state: JSON.parse(JSON.stringify(level.initialState)),
                    objectivesCompleted: Array(level.objectives.length).fill(false),
                    completed: false,
                    hintsUsed: 0
                };
            }

            // Reset UI
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-area').classList.add('active');
            document.getElementById('hint-area').classList.remove('visible');
            document.getElementById('terminal-output').innerHTML = '';
            document.getElementById('command-input').value = '';

            // Render objectives
            renderObjectives();

            // Start timer
            if (!startTime) {
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            }

            // Show welcome message
            addTerminalLine(`=== LEVEL ${level.id}: ${level.name.toUpperCase()} ===`, 'output');
            addTerminalLine(level.description, 'output');
            addTerminalLine('Type kubectl commands to investigate and fix the cluster issues.', 'output');
            addTerminalLine('');

            renderLevelSelect();
        }

        // Render objectives
        function renderObjectives() {
            const level = levels[currentLevel];
            const levelState = levelStates[currentLevel];
            const container = document.getElementById('objectives-list');

            container.innerHTML = level.objectives.map((obj, idx) => {
                const completed = levelState.objectivesCompleted[idx];
                return `
                    <div class="objective ${completed ? 'completed' : ''}">
                        <div class="objective-check">${completed ? '✓' : ''}</div>
                        <div>${obj}</div>
                    </div>
                `;
            }).join('');
        }

        // Execute command
        function executeCommand() {
            const input = document.getElementById('command-input');
            const cmd = input.value.trim();

            if (!cmd) return;

            // Add to history
            commandHistory.push(cmd);
            historyIndex = -1;

            // Show command in terminal
            addTerminalLine(`kubectl> ${cmd}`, 'command');

            // Process command
            const level = levels[currentLevel];
            const levelState = levelStates[currentLevel];

            // Find matching command (support partial matches for pod names, etc.)
            let commandFn = null;
            let matchedCmd = null;

            for (const cmdPattern in level.commands) {
                if (cmd === cmdPattern || cmd.startsWith(cmdPattern.split(' ').slice(0, -1).join(' '))) {
                    commandFn = level.commands[cmdPattern];
                    matchedCmd = cmdPattern;
                    break;
                }
            }

            if (commandFn) {
                const result = commandFn(levelState.state);
                addTerminalLine(result.output, result.type || 'output');

                // Mark objective complete
                if (result.objectiveComplete !== undefined) {
                    levelState.objectivesCompleted[result.objectiveComplete] = true;
                    renderObjectives();
                }

                // Check level completion
                if (level.checkCompletion(levelState.state)) {
                    setTimeout(() => completeLevel(), 500);
                }
            } else {
                addTerminalLine(`Error: command not recognized or not available in this level`, 'error');
                addTerminalLine('Hint: Try kubectl get pods, kubectl describe, kubectl logs, or kubectl set commands', 'output');
            }

            input.value = '';
            hideAutocomplete();
        }

        // Add terminal line
        function addTerminalLine(text, type = 'output') {
            const output = document.getElementById('terminal-output');
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // Show hint
        function showHint() {
            const level = levels[currentLevel];
            const levelState = levelStates[currentLevel];

            const hintIndex = levelState.hintsUsed;
            if (hintIndex >= level.hints.length) {
                document.getElementById('hint-text').textContent = 'No more hints available!';
                document.getElementById('hint-area').classList.add('visible');
                return;
            }

            score = Math.max(0, score - 100);
            hintsUsed++;
            levelState.hintsUsed++;
            updateStats();

            document.getElementById('hint-text').textContent = level.hints[hintIndex];
            document.getElementById('hint-area').classList.add('visible');
        }

        // Reset level
        function resetLevel() {
            const level = levels[currentLevel];
            levelStates[currentLevel] = {
                state: JSON.parse(JSON.stringify(level.initialState)),
                objectivesCompleted: Array(level.objectives.length).fill(false),
                completed: false,
                hintsUsed: 0
            };

            document.getElementById('terminal-output').innerHTML = '';
            document.getElementById('hint-area').classList.remove('visible');
            renderObjectives();

            addTerminalLine(`Level reset. Try again!`, 'output');
        }

        // Complete level
        function completeLevel() {
            const level = levels[currentLevel];
            const levelState = levelStates[currentLevel];
            levelState.completed = true;

            // Calculate time bonus
            const timeElapsed = Math.floor((Date.now() - startTime) / 1000);
            const timeBonus = Math.max(0, 300 - timeElapsed);

            const levelScore = 250 + timeBonus;
            score += levelScore;

            updateStats();
            saveProgress();

            // Show completion modal
            const modal = document.getElementById('completion-modal');
            document.getElementById('modal-title').textContent = `LEVEL ${level.id} COMPLETE!`;
            document.getElementById('modal-score').textContent = `+${levelScore}`;
            document.getElementById('modal-message').textContent =
                `Cluster recovered! Time bonus: +${timeBonus} points. ${currentLevel === 7 ? 'All levels completed!' : 'Next level unlocked.'}`;
            modal.classList.add('visible');

            // Check if all levels complete
            if (currentLevel === 7) {
                awardGameCompletion();
            }
        }

        // Award game completion
        function awardGameCompletion() {
            if (!localStorage.getItem('game_k8s_xp_awarded')) {
                const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                localStorage.setItem('game_k8s_xp_awarded', 'true');

                if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                    const uid = localStorage.getItem('hexworth_uid');
                    if (uid) FirestoreManager.addXP(uid, 50, 'Kubernetes Rescue Complete');
                }
            }

            if (typeof AchievementManager !== 'undefined') {
                AchievementManager.unlock('game_k8s');
            }

            if (typeof GameTracker !== 'undefined') {
                GameTracker.record('k8s', { score: score, levels: 8 });
            }
        }

        // Next level
        function nextLevel() {
            document.getElementById('completion-modal').classList.remove('visible');

            if (currentLevel < levels.length - 1) {
                currentLevel++;
                startLevel();
            } else {
                backToLevelSelect();
            }
        }

        // Back to level select
        function backToLevelSelect() {
            document.getElementById('game-area').classList.remove('active');
            document.getElementById('level-select').style.display = 'grid';
            document.getElementById('completion-modal').classList.remove('visible');
            renderLevelSelect();
        }

        // Update stats
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('hints-used').textContent = hintsUsed;
        }

        // Update timer
        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        // Save progress
        function saveProgress() {
            const progress = {
                score,
                hintsUsed,
                levelStates: levelStates.map(ls => ({
                    completed: ls.completed,
                    hintsUsed: ls.hintsUsed
                }))
            };
            localStorage.setItem('k8s_rescue_progress', JSON.stringify(progress));
        }

        // Load progress
        function loadProgress() {
            const saved = localStorage.getItem('k8s_rescue_progress');
            if (saved) {
                const progress = JSON.parse(saved);
                score = progress.score || 1000;
                hintsUsed = progress.hintsUsed || 0;

                if (progress.levelStates) {
                    progress.levelStates.forEach((ls, idx) => {
                        if (ls.completed) {
                            levelStates[idx] = {
                                state: JSON.parse(JSON.stringify(levels[idx].initialState)),
                                objectivesCompleted: Array(levels[idx].objectives.length).fill(true),
                                completed: true,
                                hintsUsed: ls.hintsUsed || 0
                            };
                        }
                    });
                }
            }
        }

        // Initialize on load
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
