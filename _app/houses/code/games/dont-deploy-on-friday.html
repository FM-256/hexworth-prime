<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Deploy on Friday - Code House Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(180deg, #0a0e14 0%, #0a120a 50%, #0a0e14 100%);
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0d1a0d 0%, #0f1419 100%);
            padding: 15px 20px;
            border-bottom: 2px solid #22c55e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(34,197,94,0.15);
        }

        .header-title {
            color: #4ade80;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #22c55e, #86efac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(34,197,94,0.4));
            letter-spacing: 2px;
        }

        .achievement-counter {
            color: #ffd700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .achievement-counter:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.1);
        }

        .timer {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
            min-width: 80px;
            text-align: right;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
        }

        .timer.warning {
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.7);
        }

        .timer.critical {
            color: #e74c3c;
            animation: pulse 0.5s infinite;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.9);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .output-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(180deg, rgba(10,14,20,0.95), rgba(10,18,10,0.95));
            line-height: 1.6;
        }

        .output-area::-webkit-scrollbar {
            width: 10px;
        }

        .output-area::-webkit-scrollbar-track {
            background: #1a1f2e;
        }

        .output-area::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 5px;
        }

        .input-area {
            background: linear-gradient(135deg, #0d1a0d, #1a1f2e);
            padding: 15px 20px;
            border-top: 2px solid #22c55e;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 -4px 20px rgba(34,197,94,0.1);
        }

        .prompt {
            color: #4ade80;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(74,222,128,0.4);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            outline: none;
        }

        .input-field:disabled {
            opacity: 0.5;
        }

        /* Text styling classes */
        .line-normal { color: #d4d4d4; }
        .line-title {
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(34,197,94,0.6);
        }
        .line-error {
            color: #e74c3c;
            font-weight: bold;
        }
        .line-warning {
            color: #f39c12;
            font-weight: bold;
        }
        .line-success {
            color: #4ade80;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(74,222,128,0.3);
        }
        .line-info {
            color: #3498db;
        }
        .line-slack {
            color: #e01e5a;
            font-style: italic;
        }
        .line-pipeline {
            color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
            padding: 2px 5px;
            border-left: 3px solid #f39c12;
        }
        .line-critical {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 2px 5px;
            border-left: 3px solid #e74c3c;
            animation: blink 1s infinite;
        }
        .line-git {
            color: #f05032;
        }
        .line-kubernetes {
            color: #326ce5;
        }
        .line-docker {
            color: #2496ed;
        }
        .line-dim {
            color: #6b7280;
            font-style: italic;
        }
        .line-highlight {
            background: linear-gradient(90deg, rgba(34,197,94,0.15), transparent);
            padding: 2px 5px;
            border-left: 2px solid rgba(34,197,94,0.4);
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        /* Achievement toast */
        .achievement-toast {
            position: fixed;
            top: 80px;
            right: -400px;
            background: linear-gradient(135deg, #0d1a0d 0%, #1a2e1a 100%);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            max-width: 350px;
            box-shadow: 0 8px 30px rgba(255,215,0,0.2), 0 4px 20px rgba(0,0,0,0.6);
            transition: right 0.5s ease;
            z-index: 1000;
        }

        .achievement-toast.show {
            right: 20px;
        }

        .toast-header {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast-body {
            color: #d4d4d4;
            font-size: 14px;
        }

        /* Achievement gallery overlay */
        .gallery-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .gallery-overlay.show {
            display: flex;
        }

        .gallery-content {
            background: linear-gradient(135deg, #0d1a0d, #1a1f2e);
            border: 2px solid #22c55e;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(34,197,94,0.2), 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .gallery-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #22c55e, #86efac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(34,197,94,0.4));
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .achievement-card {
            background: linear-gradient(135deg, #0a0e14, #0d120d);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .achievement-card:hover {
            transform: translateY(-2px);
        }

        .achievement-card.unlocked {
            border-color: #ffd700;
            background: linear-gradient(135deg, #0d1a0d 0%, #1a2e1a 100%);
            box-shadow: 0 4px 20px rgba(255,215,0,0.15);
        }

        .achievement-card.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .achievement-name {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .achievement-desc {
            color: #d4d4d4;
            font-size: 12px;
        }

        .achievement-card.locked .achievement-name,
        .achievement-card.locked .achievement-desc {
            color: #6b7280;
        }

        .gallery-close {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #0a0e14;
            border: none;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .gallery-close:hover {
            box-shadow: 0 0 25px rgba(34,197,94,0.5);
            transform: translateY(-2px);
        }

        .blank-line {
            height: 1.6em;
        }
        .back-link { position:fixed; top:12px; left:20px; color:#4ade80; text-decoration:none; font-size:14px; cursor:pointer; z-index:10000; transition:all 0.3s ease; font-family:monospace; text-shadow: 0 0 5px rgba(34,197,94,0.4); }
        .back-link:hover { color:#86efac; text-shadow: 0 0 15px rgba(34,197,94,0.6); }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; Back to Code House</a>
    <div class="header">
        <span class="header-title">DON'T DEPLOY ON FRIDAY</span>
        <span class="achievement-counter" id="achCounter" onclick="Game.showGallery()">&#9733; 0/12</span>
        <span class="timer" id="timer">3:00</span>
    </div>

    <div class="output-area" id="output"></div>

    <div class="input-area">
        <span class="prompt" id="prompt">~/prod$</span>
        <input type="text" class="input-field" id="input" autocomplete="off" spellcheck="false">
    </div>

    <div class="achievement-toast" id="toast">
        <div class="toast-header">
            <span>&#127942;</span>
            <span id="toastTitle">Achievement Unlocked!</span>
        </div>
        <div class="toast-body" id="toastDesc">Achievement description</div>
    </div>

    <div class="gallery-overlay" id="gallery">
        <div class="gallery-content">
            <div class="gallery-title">ACHIEVEMENT GALLERY</div>
            <div class="gallery-grid" id="galleryGrid"></div>
            <button class="gallery-close" onclick="document.getElementById('gallery').classList.remove('show')">CLOSE</button>
        </div>
    </div>

    <script>
        const Game = (function() {
            // Achievement definitions
            const ACHIEVEMENTS = {
                first_check: {
                    name: "First Responder",
                    description: "Check logs or git diff first",
                    icon: "🔍"
                },
                clean_rollback: {
                    name: "Clean Rollback",
                    description: "Revert without force-pushing again",
                    icon: "🔄"
                },
                by_the_book: {
                    name: "CI/CD Professional",
                    description: "Follow full methodology: identify, investigate, rollback, test, deploy, verify",
                    icon: "📚"
                },
                speed_run: {
                    name: "Speed Run",
                    description: "Fix the issue in under 20 seconds",
                    icon: "⚡"
                },
                blame_game: {
                    name: "Blame Game",
                    description: "Try to blame the intern",
                    icon: "👉"
                },
                resume_ready: {
                    name: "Resume Ready",
                    description: "Check LinkedIn during the outage",
                    icon: "💼"
                },
                stackoverflow_hero: {
                    name: "Stack Overflow Hero",
                    description: "Search Stack Overflow during crisis",
                    icon: "📚"
                },
                frozen: {
                    name: "Frozen",
                    description: "Do nothing until time runs out",
                    icon: "🧊"
                },
                made_it_worse: {
                    name: "Made It Worse",
                    description: "Run force push AGAIN or rm -rf",
                    icon: "💥"
                },
                coffee_driven: {
                    name: "Coffee-Driven Development",
                    description: "Try to get coffee during the crisis",
                    icon: "☕"
                },
                full_recovery: {
                    name: "Full Recovery",
                    description: "Rollback + fix DB + clear cache + verify + notify",
                    icon: "🏆"
                },
                friday_survivor: {
                    name: "Friday Survivor",
                    description: "Successfully survive the deployment disaster",
                    icon: "🎉"
                }
            };

            const STORAGE_KEY = 'hexworth_dontdeploy_achievements';

            // Game state
            let state = {};
            let timerInterval = null;

            function resetState() {
                state = {
                    phase: 'title',
                    timeRemaining: 180,
                    commandCount: 0,
                    pipelineStopped: false,
                    rolledBack: false,
                    hotfixPushed: false,
                    testsRun: false,
                    dockerRebuilt: false,
                    ceoNotified: false,
                    slackResponded: false,
                    logsChecked: false,
                    databaseBroken: false,
                    cacheCorrupted: false,
                    gitReverted: false,
                    healthCheckPassed: false,
                    buildCompleted: false,
                    identified: false,
                    investigated: false,
                    deployed: false,
                    verified: false,
                    firstCommand: null,
                    usedGitDiff: false,
                    usedLogs: false,
                    usedForceAgain: false,
                    usedDangerous: false,
                    didNothing: true,
                    timedEvents: {
                        slack10: false,
                        slack25: false,
                        db45: false,
                        slack70: false,
                        ceo95: false,
                        demo120: false,
                        clicking150: false,
                        nervous170: false
                    },
                    bonusTime: 0,
                    ending: null
                };
            }

            // Initialize game
            function init() {
                resetState();
                showTitle();

                const input = document.getElementById('input');
                input.addEventListener('keydown', handleInput);
            }

            // Output helpers
            function print(text, className = 'line-normal') {
                const output = document.getElementById('output');
                const line = document.createElement('div');

                // Handle styled strings
                if (text && text._className) {
                    className = text._className;
                    text = String(text);
                }

                line.className = className;
                line.textContent = text;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            function printBlank() {
                const output = document.getElementById('output');
                const line = document.createElement('div');
                line.className = 'blank-line';
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            function styled(text, cls) {
                const s = new String(text);
                s._className = cls;
                return s;
            }

            // Clear output
            function clearOutput() {
                document.getElementById('output').innerHTML = '';
            }

            // Show title screen
            function showTitle() {
                clearOutput();
                print("═══════════════════════════════════════════════════════════", "line-title");
                print("        DON'T DEPLOY ON FRIDAY: A DevOps Survival Story        ", "line-title");
                print("═══════════════════════════════════════════════════════════", "line-title");
                printBlank();
                print("It's Friday, 4:55 PM.", "line-normal");
                print("You just ran: git push origin main --force", "line-error");
                printBlank();
                print("Your untested code is now rolling out to production.", "line-warning");
                print("The CEO's keynote demo starts in 3 minutes.", "line-warning");
                print("It runs on THIS production environment.", "line-warning");
                printBlank();
                print("Your Slack is exploding.", "line-slack");
                print("The intern is filming this on TikTok.", "line-dim");
                print("The office dog won't stop barking.", "line-dim");
                printBlank();
                print("You have 3 minutes to fix this before 10,000 livestream viewers", "line-error");
                print("watch the CEO demo a 500 error page.", "line-error");
                printBlank();
                print("═══════════════════════════════════════════════════════════", "line-title");
                printBlank();
                print("Type 'start' to begin your nightmare.", "line-success");
                print("Type 'help' for available commands.", "line-info");
                printBlank();

                document.getElementById('input').disabled = false;
                document.getElementById('input').focus();
            }

            // Start the game
            function startGame() {
                state.phase = 'playing';
                clearOutput();

                print("╔══════════════════════════════════════════════════════════╗", "line-error");
                print("║          PRODUCTION DEPLOYMENT IN PROGRESS               ║", "line-error");
                print("║              BUILD STATUS: FAILING                       ║", "line-error");
                print("╚══════════════════════════════════════════════════════════╝", "line-error");
                printBlank();
                print("[JENKINS] Build #4287 FAILED - Authentication middleware missing", "line-pipeline");
                print("[KUBERNETES] Rolling update in progress... 3/12 pods healthy", "line-kubernetes");
                print("[DOCKER] Container 'api-server' crash loop detected", "line-docker");
                printBlank();
                print("You stare at your terminal in horror. The timer is ticking.", "line-dim");
                print("Every second counts. What do you do?", "line-dim");
                printBlank();
                print("Type 'help' to see available commands, or trust your instincts.", "line-info");
                printBlank();

                // Start the timer
                timerInterval = setInterval(tick, 1000);
                updateTimerDisplay();
            }

            // Timer tick
            function tick() {
                if (state.phase !== 'playing') {
                    clearInterval(timerInterval);
                    return;
                }

                state.timeRemaining--;
                updateTimerDisplay();
                checkTimedEvents();

                if (state.timeRemaining <= 0) {
                    timeUp();
                }
            }

            // Update timer display
            function updateTimerDisplay() {
                const timer = document.getElementById('timer');
                const minutes = Math.floor(state.timeRemaining / 60);
                const seconds = state.timeRemaining % 60;
                timer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                // Update timer styling
                timer.classList.remove('warning', 'critical');
                if (state.timeRemaining <= 30) {
                    timer.classList.add('critical');
                } else if (state.timeRemaining <= 60) {
                    timer.classList.add('warning');
                }
            }

            // Check for timed events
            function checkTimedEvents() {
                const elapsed = 180 - state.timeRemaining + state.bonusTime;

                if (elapsed >= 10 && !state.timedEvents.slack10) {
                    state.timedEvents.slack10 = true;
                    printBlank();
                    print("[SLACK] #engineering: 'Uh, did someone just deploy?' - @sarah_backend", "line-slack");
                }

                if (elapsed >= 25 && !state.timedEvents.slack25) {
                    state.timedEvents.slack25 = true;
                    printBlank();
                    print("[SLACK] #engineering: 'THE STAGING DB MIGRATION RAN ON PROD' - @sarah_backend", "line-slack");
                }

                if (elapsed >= 45 && !state.timedEvents.db45 && !state.pipelineStopped) {
                    state.timedEvents.db45 = true;
                    state.databaseBroken = true;
                    printBlank();
                    print("[PIPELINE] Database migration executed. Users table schema altered.", "line-pipeline");
                    print("[ERROR] 500+ database constraint violations detected", "line-error");
                }

                if (elapsed >= 70 && !state.timedEvents.slack70) {
                    state.timedEvents.slack70 = true;
                    printBlank();
                    print("[SLACK] #general: 'Is the app down? I'm getting 500 errors' - @marketing_mike", "line-slack");
                }

                if (elapsed >= 95 && !state.timedEvents.ceo95) {
                    state.timedEvents.ceo95 = true;
                    if (!state.rolledBack) {
                        printBlank();
                        print("[ALERT] CEO's assistant: 'The demo environment is showing errors. He goes on in 90 seconds.'", "line-critical");
                    }
                }

                if (elapsed >= 120 && !state.timedEvents.demo120) {
                    state.timedEvents.demo120 = true;
                    printBlank();
                    print("[CRITICAL] 🔴 LIVESTREAM STARTED - 10,000 viewers watching", "line-critical");
                    print("[CRITICAL] CEO: 'Let me show you our amazing new feature...'", "line-critical");
                }

                if (elapsed >= 150 && !state.timedEvents.clicking150) {
                    state.timedEvents.clicking150 = true;
                    if (!state.rolledBack && !state.hotfixPushed) {
                        printBlank();
                        print("[CRITICAL] CEO clicking through the demo. Every. Click. Is. A. 500. Error.", "line-critical");
                        print("[LIVESTREAM CHAT] 'lol this company is finished' 'F in chat' 'short the stock'", "line-error");
                    }
                }

                if (elapsed >= 170 && !state.timedEvents.nervous170) {
                    state.timedEvents.nervous170 = true;
                    if (!state.rolledBack && !state.hotfixPushed) {
                        printBlank();
                        print("[CRITICAL] CEO: 'We seem to be having some... technical difficulties.' *nervous laughter*", "line-critical");
                    }
                }
            }

            // Time's up
            function timeUp() {
                clearInterval(timerInterval);
                state.phase = 'gameover';

                printBlank();
                print("╔══════════════════════════════════════════════════════════╗", "line-error");
                print("║                    TIME'S UP                             ║", "line-error");
                print("╚══════════════════════════════════════════════════════════╝", "line-error");
                printBlank();

                if (state.didNothing) {
                    unlock('frozen');
                    print("You froze. Paralyzed by fear, you watched the timer tick down.", "line-dim");
                    print("The CEO's demo became a catastrophe. The livestream chat was merciless.", "line-dim");
                    print("The intern's TikTok got 2 million views.", "line-dim");
                    state.ending = 'frozen';
                } else if (!state.rolledBack && !state.hotfixPushed) {
                    print("The demo is a complete disaster. 500 errors. Everywhere.", "line-error");
                    print("The CEO is sweating on camera. The stock price is plummeting.", "line-error");
                    print("Your Slack DMs include one from HR: 'Can we talk Monday?'", "line-error");
                    state.ending = 'failure';
                } else {
                    print("Time ran out, but you managed to get something working!", "line-warning");
                    print("The demo had some hiccups, but the CEO recovered.", "line-warning");
                    print("You'll be famous in the war stories channel.", "line-info");
                    state.ending = 'partial';
                }

                endGame();
            }

            // Handle input
            function handleInput(event) {
                if (event.key === 'Enter') {
                    const input = document.getElementById('input');
                    const command = input.value.trim();
                    input.value = '';

                    if (command) {
                        processCommand(command);
                    }
                }
            }

            // Process command
            function processCommand(raw) {
                const cmd = raw.toLowerCase().trim();

                // Show the command
                print(`~/prod$ ${raw}`, 'line-highlight');

                if (state.phase === 'title') {
                    if (cmd === 'start') {
                        startGame();
                    } else if (cmd === 'help' || cmd === '?') {
                        showHelp();
                    } else {
                        print("Type 'start' to begin, or 'help' for commands.", "line-info");
                    }
                    return;
                }

                if (state.phase === 'gameover') {
                    if (cmd === 'restart' || cmd === 'again' || cmd === 'retry') {
                        restart();
                    } else {
                        print("Game over. Type 'restart' to try again.", "line-info");
                    }
                    return;
                }

                // Playing phase
                state.commandCount++;
                state.didNothing = false;

                // Track first command for achievement
                if (!state.firstCommand) {
                    state.firstCommand = cmd;
                }

                // Command routing
                if (cmd === 'help' || cmd === '?') {
                    showHelp();
                } else if (cmd === 'hint' || cmd === 'hints') {
                    showHint();
                } else if (cmd === 'look' || cmd === 'examine') {
                    examine();
                } else if (cmd === 'inventory' || cmd === 'i') {
                    inventory();

                // Git commands
                } else if (cmd === 'git log' || cmd === 'git log --oneline') {
                    gitLog();
                } else if (cmd === 'git diff') {
                    gitDiff();
                } else if (cmd === 'git revert head') {
                    gitRevert();
                } else if (cmd === 'git reset --hard head~1') {
                    gitReset();
                } else if (cmd === 'git stash' || cmd === 'git stash pop') {
                    gitStash(cmd);

            function stackoverflow() {
                unlock('stackoverflow_hero');
                print("You frantically search Stack Overflow:", "line-info");
                print("'how to undo git push force production emergency'", "line-dim");
                printBlank();
                print("Top result from 7 years ago:", "line-normal");
                print("  'SOLVED: Thanks everyone for the help!'", "line-success");
                print("  [No solution posted. Thread locked.]", "line-error");
                printBlank();
                print("Second result:", "line-normal");
                print("  'Duplicate of: How to undo git push'", "line-info");
                print("  [Links to closed thread. Also no solution.]", "line-error");
                printBlank();
                print("Stack Overflow has failed you in your hour of need.", "line-dim");
                printBlank();
            }

            function pray() {
                print("You close your eyes and whisper a prayer to the DevOps gods...", "line-dim");
                printBlank();
                print("Somewhere in the world, a CI/CD pipeline turns green.", "line-success");
                print("", "line-normal");
                print("Not yours though.", "line-error");
                printBlank();
                print("The DevOps gods are busy with people who write tests.", "line-dim");
                printBlank();
            }

            function coffee() {
                unlock('coffee_driven');
                print("You desperately need caffeine. You head to the break room...", "line-dim");
                printBlank();
                print("The Keurig is broken.", "line-error");
                print("Of course it is.", "line-error");
                print("There's a note: 'Maintenance scheduled for 5:00 PM'", "line-warning");
                printBlank();
                print("Even the coffee machine has conspired against you.", "line-dim");
                printBlank();
            }

            function dangerousCommand() {
                unlock('made_it_worse');
                state.usedDangerous = true;
                print("$ rm -rf /", "line-error");
                print("", "line-error");
                print("ABSOLUTELY NOT.", "line-error");
                print("", "line-error");
                print("The terminal physically REJECTS your command.", "line-error");
                print("Your keyboard beeps angrily at you.", "line-error");
                print("Somewhere, a system administrator felt a disturbance in the force.", "line-warning");
                printBlank();
                print("You've caused ENOUGH damage today.", "line-dim");
                printBlank();
            }

            function undo() {
                print("If only life had an undo button...", "line-dim");
                printBlank();
                print("Git does though! Try 'git revert HEAD' to undo your commit.", "line-info");
                print("Or 'kubectl rollback' to rollback the deployment.", "line-info");
                printBlank();
            }

            function quitCommand() {
                print("You can't quit! There's a livestream starting!", "line-error");
                print("10,000 people are about to watch this demo!", "line-error");
                print("The CEO is counting on you!", "line-error");
                printBlank();
                print("(Type 'restart' if you want to restart the game)", "line-info");
                printBlank();
            }

            function sudoCommand() {
                print("You already have root access.", "line-warning");
                print("", "line-normal");
                print("That's actually part of the problem.", "line-dim");
                printBlank();
            }

            function tweet() {
                print("DO NOT TWEET ABOUT THIS.", "line-error");
                print("", "line-error");
                print("The PR team will handle communications. Eventually.", "line-warning");
                print("After they finish crying.", "line-dim");
                printBlank();
            }

            function sshProd() {
                print("$ ssh prod", "line-info");
                printBlank();
                print("You're already ON prod.", "line-error");
                print("", "line-error");
                print("That's the PROBLEM.", "line-error");
                printBlank();
            }

            function envCheck() {
                print("Environment Variables:", "line-info");
                print("NODE_ENV=production", "line-success");
                print("PORT=3000", "line-success");
                print("DATABASE_URL=postgres://prod-db:5432/app", "line-success");
                print("REDIS_URL=redis://prod-cache:6379", "line-success");
                print("JWT_SECRET=***hidden***", "line-success");
                printBlank();
                print("Environment looks fine. The problem is your code, not the config.", "line-dim");
                printBlank();
            }

            function terraform() {
                print("Now is NOT the time for infrastructure changes.", "line-error");
                print("", "line-error");
                print("Focus on the immediate crisis, infrastructure astronaut.", "line-warning");
                printBlank();
            }

            // Check win condition
            function checkWinCondition() {
                if (state.phase !== 'playing') return;

                const isFixed = (state.rolledBack || state.hotfixPushed) && state.healthCheckPassed;

                if (isFixed) {
                    clearInterval(timerInterval);
                    state.phase = 'won';
                    state.ending = 'success';

                    printBlank();
                    print("╔══════════════════════════════════════════════════════════╗", "line-success");
                    print("║                   CRISIS AVERTED                         ║", "line-success");
                    print("╚══════════════════════════════════════════════════════════╝", "line-success");
                    printBlank();

                    const timeUsed = 180 - state.timeRemaining;

                    if (timeUsed <= 20) {
                        unlock('speed_run');
                        print("INCREDIBLE! You fixed it in under 20 seconds!", "line-success");
                        print("You are a DevOps GOD.", "line-success");
                    } else if (state.timeRemaining > 120) {
                        print("The CEO hasn't even started the demo yet.", "line-success");
                        print("Nobody except your team even knows there was a problem.", "line-success");
                    } else if (state.timeRemaining > 60) {
                        print("You fixed it before the livestream started!", "line-success");
                        print("The CEO's demo goes off without a hitch.", "line-success");
                    } else {
                        print("The demo had some hiccups, but you recovered!", "line-success");
                        print("The CEO improvised. The audience didn't notice. You're safe.", "line-success");
                    }

                    printBlank();
                    print("Production is stable. The app is responding.", "line-success");
                    print("Slack has calmed down. The intern has stopped filming.", "line-dim");
                    print("The office dog is napping peacefully.", "line-dim");
                    printBlank();

                    unlock('friday_survivor');

                    // Check for by_the_book achievement
                    if (state.identified && state.investigated && state.rolledBack &&
                        state.testsRun && state.deployed && state.verified) {
                        unlock('by_the_book');
                    }

                    // Check for full_recovery achievement
                    if (state.rolledBack && !state.databaseBroken && !state.cacheCorrupted &&
                        state.verified && state.ceoNotified) {
                        unlock('full_recovery');
                    }

                    endGame();
                }
            }

            // End game
            function endGame() {
                state.phase = 'gameover';
                document.getElementById('input').disabled = true;

                printBlank();
                print("═══════════════════════════════════════════════════════════", "line-title");
                print("                      GAME OVER", "line-title");
                print("═══════════════════════════════════════════════════════════", "line-title");
                printBlank();
                print(`Commands used: ${state.commandCount}`, "line-info");
                print(`Time remaining: ${Math.floor(state.timeRemaining / 60)}:${(state.timeRemaining % 60).toString().padStart(2, '0')}`, "line-info");
                printBlank();
                print("Type 'restart' to try again!", "line-success");
                printBlank();

                // Platform integration
                if (typeof AchievementSystem !== 'undefined') {
                    const saved = loadAchievements();

                    if (state.ending === 'success') {
                        AchievementSystem.unlockGameAchievement('deploy', 'win');
                    }

                    if (saved.by_the_book) {
                        AchievementSystem.unlockGameAchievement('deploy', 'by_the_book');
                    }

                    if (saved.speed_run) {
                        AchievementSystem.unlockGameAchievement('deploy', 'speed');
                    }

                    if (Object.keys(saved).length >= 12) {
                        AchievementSystem.unlockGameAchievement('deploy', 'all');
                    }
                }

                // Award XP (one-time)
                if (state.ending === 'success') {
                    if (!localStorage.getItem('game_deploy_xp_awarded')) {
                        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                        localStorage.setItem('game_deploy_xp_awarded', 'true');
                        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                            const uid = localStorage.getItem('hexworth_uid');
                            if (uid) FirestoreManager.addXP(uid, 50, 'Don\'t Deploy on Friday Complete');
                        }
                    }
                    if (typeof AchievementManager !== 'undefined') {
                        AchievementManager.unlock('game_deploy');
                    }
                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    GameTracker.record('deploy', {
                        result: state.ending || 'unknown',
                        timeElapsed: 180 - state.timeRemaining,
                        commandsUsed: state.commandCount,
                        achievementsEarned: Object.keys(loadAchievements()).length,
                        achievementsTotal: Object.keys(loadAchievements()).length
                    });
                }
            }

            // Restart game
            function restart() {
                clearInterval(timerInterval);
                resetState();
                showTitle();
                document.getElementById('input').disabled = false;
                document.getElementById('input').focus();
            }

            // Achievement system
            function unlock(id) {
                const saved = loadAchievements();

                if (!saved[id]) {
                    saved[id] = true;
                    saveAchievements(saved);

                    const ach = ACHIEVEMENTS[id];
                    showToast(ach.name, ach.description);
                    updateAchievementCounter();
                }
            }

            function loadAchievements() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    return data ? JSON.parse(data) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveAchievements(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.error('Failed to save achievements:', e);
                }
            }

            function showToast(name, desc) {
                const toast = document.getElementById('toast');
                const title = document.getElementById('toastTitle');
                const description = document.getElementById('toastDesc');

                title.textContent = name;
                description.textContent = desc;

                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }

            function updateAchievementCounter() {
                const saved = loadAchievements();
                const count = Object.keys(saved).length;
                const counter = document.getElementById('achCounter');
                counter.textContent = `★ ${count}/12`;
            }

            function showGallery() {
                const saved = loadAchievements();
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = '';

                Object.entries(ACHIEVEMENTS).forEach(([id, ach]) => {
                    const card = document.createElement('div');
                    card.className = saved[id] ? 'achievement-card unlocked' : 'achievement-card locked';

                    card.innerHTML = `
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-name">${saved[id] ? ach.name : '???'}</div>
                        <div class="achievement-desc">${saved[id] ? ach.description : 'Locked'}</div>
                    `;

                    grid.appendChild(card);
                });

                document.getElementById('gallery').classList.add('show');
            }

            // Initialize and update counter
            init();
            updateAchievementCounter();

            // Public API
            return {
                showGallery: showGallery
            };
        })();
    </script>

    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/AchievementSystem.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
</body>
</html>
