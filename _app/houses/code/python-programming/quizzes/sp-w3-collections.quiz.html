<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5: Lists & Dictionaries | Snake Pit</title>
    <style>
        :root { --bg: #0a0e1a; --bg-card: #0f1625; --bg-option: #141d2e; --green: #4ade80; --green-dim: rgba(74,222,128,0.15); --text: #e2e8f0; --text-muted: #8892a8; --success: #22c55e; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg) 0%, #0c1220 50%, #0e1828 100%); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav-links { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .back-link { color: var(--green); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .back-link:hover { color: #86efac; transform: translateX(-5px); display: inline-block; }
        .quiz-header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--green-dim); }
        .quiz-header h1 { font-size: 1.6rem; color: var(--green); margin-bottom: 0.5rem; }
        .quiz-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .quiz-header .meta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: 0.8rem; }
        .quiz-header .meta span { background: var(--bg); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-muted); }
        .progress-bar-wrap { background: var(--bg-card); border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .progress-label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .progress-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--success)); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .score-label { font-size: 0.85rem; color: var(--green); font-weight: 600; white-space: nowrap; }
        .question-card { background: var(--bg-card); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .question-num { font-size: 0.8rem; color: var(--green); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .question-text code { background: rgba(74,222,128,0.1); color: #86efac; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas','Courier New', monospace; font-size: 1rem; }
        .code-block { background: #080c18; border: 1px solid rgba(74,222,128,0.2); border-radius: 8px; padding: 14px 18px; margin: -0.75rem 0 1.25rem 0; font-family: 'Consolas','Courier New', monospace; font-size: 0.92rem; color: #a7f3d0; white-space: pre; overflow-x: auto; line-height: 1.7; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-option); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option:hover { border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.05); }
        .option.selected { border-color: var(--green); background: rgba(74,222,128,0.08); }
        .option.correct { border-color: var(--success); background: rgba(34,197,94,0.1); }
        .option.incorrect { border-color: var(--danger); background: rgba(239,68,68,0.08); }
        .option.disabled { pointer-events: none; opacity: 0.7; } .option.correct.disabled { opacity: 1; } .option.incorrect.disabled { opacity: 1; }
        .option-letter { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--green); flex-shrink: 0; }
        .option.correct .option-letter { background: var(--success); color: #fff; border-color: var(--success); }
        .option.incorrect .option-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
        .feedback { padding: 14px 18px; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; display: none; }
        .feedback.correct { display: block; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .feedback.incorrect { display: block; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .quiz-nav { display: flex; justify-content: flex-end; }
        .next-btn { padding: 10px 24px; background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.4); color: var(--green); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover { background: var(--green); color: #fff; }
        .next-btn:disabled { opacity: 0.3; cursor: not-allowed; } .next-btn:disabled:hover { background: rgba(74,222,128,0.15); color: var(--green); }
        .results-card { display: none; text-align: center; background: var(--bg-card); border-radius: 14px; padding: 3rem 2rem; border: 1px solid var(--border); }
        .results-card h2 { color: var(--green); font-size: 1.4rem; margin-bottom: 1rem; }
        .score-big { font-size: 3.5rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem; }
        .score-big.low { color: var(--danger); } .score-big.mid { color: #fbbf24; }
        .score-msg { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .results-btns a, .results-btns button { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-retry { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.4) !important; color: var(--green); }
        .btn-retry:hover { background: var(--green); color: #fff; }
        .btn-hub { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4) !important; color: var(--success); }
        .btn-hub:hover { background: var(--success); color: #fff; }
        @media (max-width: 640px) { .quiz-container { padding: 1rem; } .question-card { padding: 1.25rem; } .quiz-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Snake Pit Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz 5: Lists & Dictionaries</h1>
            <p class="subtitle">Lists, tuples, dictionaries, sets, comprehensions</p>
            <div class="meta"><span>Week 3</span><span>15 Questions</span><span>Pass: 70%</span><span>COP2891</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Snake Pit Hub</a>
            </div>
        </div>
    </div>
    <script>
        var questions = [
          {
                    "q": "Which collection type is mutable and ordered?",
                    "opts": [
                              "Tuple",
                              "Set",
                              "List",
                              "Frozenset"
                    ],
                    "ans": 2,
                    "exp": "Lists are ordered and mutable."
          },
          {
                    "q": "What does <code>[1,2,3].append(4)</code> do?",
                    "opts": [
                              "Returns [1,2,3,4]",
                              "Modifies list to [1,2,3,4]",
                              "Creates a new list",
                              "Raises error"
                    ],
                    "ans": 1,
                    "exp": "append() modifies the list in place, adding 4 to the end."
          },
          {
                    "q": "What is the output of <code>[x**2 for x in range(4)]</code>?",
                    "opts": [
                              "[1,4,9,16]",
                              "[0,1,4,9]",
                              "[0,2,4,6]",
                              "[1,2,3,4]"
                    ],
                    "ans": 1,
                    "exp": "range(4) = 0,1,2,3. Squared: 0,1,4,9."
          },
          {
                    "q": "How do you access a dictionary value?",
                    "opts": [
                              "dict(key)",
                              "dict.key",
                              "dict[key]",
                              "dict->key"
                    ],
                    "ans": 2,
                    "exp": "Dictionary values are accessed with bracket notation: dict[key]."
          },
          {
                    "q": "What does <code>set([1,2,2,3,3,3])</code> return?",
                    "opts": [
                              "{1,2,3}",
                              "[1,2,3]",
                              "{1,2,2,3,3,3}",
                              "(1,2,3)"
                    ],
                    "ans": 0,
                    "exp": "Sets remove duplicates: {1, 2, 3}."
          },
          {
                    "q": "Which is immutable?",
                    "opts": [
                              "List",
                              "Dictionary",
                              "Set",
                              "Tuple"
                    ],
                    "ans": 3,
                    "exp": "Tuples are immutable -- they cannot be changed after creation."
          },
          {
                    "q": "What does <code>dict.get('key', 'default')</code> do?",
                    "opts": [
                              "Always returns 'default'",
                              "Returns value or 'default' if key missing",
                              "Raises KeyError",
                              "Sets key to default"
                    ],
                    "ans": 1,
                    "exp": "get() returns the value for 'key' or 'default' if the key does not exist."
          },
          {
                    "q": "What does <code>enumerate(['a','b','c'])</code> produce?",
                    "opts": [
                              "['a','b','c']",
                              "[(0,'a'),(1,'b'),(2,'c')]",
                              "{'a':0,'b':1,'c':2}",
                              "[0,1,2]"
                    ],
                    "ans": 1,
                    "exp": "enumerate() returns index-value pairs."
          },
          {
                    "q": "What does <code>sorted([3,1,4,1,5])</code> return?",
                    "opts": [
                              "[5,4,3,1,1]",
                              "[1,1,3,4,5]",
                              "[3,1,4,1,5]",
                              "None"
                    ],
                    "ans": 1,
                    "exp": "sorted() returns a new sorted list in ascending order."
          },
          {
                    "q": "What does <code>len({\"a\":1,\"b\":2})</code> return?",
                    "opts": [
                              "4",
                              "2",
                              "1",
                              "Error"
                    ],
                    "ans": 1,
                    "exp": "len() on a dict returns the number of key-value pairs: 2."
          },
          {
                    "q": "How do you check if a key exists in a dictionary?",
                    "opts": [
                              "key.exists(dict)",
                              "dict.has(key)",
                              "key in dict",
                              "dict.contains(key)"
                    ],
                    "ans": 2,
                    "exp": "The 'in' operator checks for key membership in a dict."
          },
          {
                    "q": "What is <code>{x: x**2 for x in range(3)}</code>?",
                    "opts": [
                              "{0:0, 1:1, 2:4}",
                              "[0, 1, 4]",
                              "{0, 1, 4}",
                              "Error"
                    ],
                    "ans": 0,
                    "exp": "Dict comprehension: keys 0,1,2 with squared values."
          },
          {
                    "q": "What does <code>zip([1,2],[3,4])</code> produce?",
                    "opts": [
                              "[1,2,3,4]",
                              "[(1,3),(2,4)]",
                              "[[1,3],[2,4]]",
                              "{1:3, 2:4}"
                    ],
                    "ans": 1,
                    "exp": "zip() pairs up elements from both lists."
          },
          {
                    "q": "Which set operation returns elements in A but not B?",
                    "opts": [
                              "A | B",
                              "A & B",
                              "A - B",
                              "A ^ B"
                    ],
                    "ans": 2,
                    "exp": "A - B returns the difference: elements in A not in B."
          },
          {
                    "q": "What does <code>(1,2,3)[1]</code> return?",
                    "opts": [
                              "1",
                              "2",
                              "3",
                              "(2,)"
                    ],
                    "ans": 1,
                    "exp": "Tuples support indexing: index 1 returns the second element, 2."
          }
];
        var current = 0, score = 0, answered = false, TOTAL = questions.length;
        function loadQuestion() {
            var q = questions[current];
            document.getElementById('questionNum').textContent = 'QUESTION ' + (current + 1);
            document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
            document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
            document.getElementById('questionText').innerHTML = q.q;
            if (q.code) { var block = document.createElement('pre'); block.className = 'code-block'; block.textContent = q.code; document.getElementById('questionText').appendChild(block); }
            var html = '', letters = ['A','B','C','D'];
            for (var i = 0; i < q.opts.length; i++) { html += '<div class="option" onclick="selectAnswer(' + i + ')"><span class="option-letter">' + letters[i] + '</span><span>' + q.opts[i] + '</span></div>'; }
            document.getElementById('optionsEl').innerHTML = html;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
        }
        function selectAnswer(idx) {
            if (answered) return; answered = true;
            var q = questions[current], opts = document.querySelectorAll('.option');
            for (var i = 0; i < opts.length; i++) { opts[i].classList.add('disabled'); if (i === q.ans) opts[i].classList.add('correct'); else if (i === idx) opts[i].classList.add('incorrect'); }
            var fb = document.getElementById('feedback');
            if (idx === q.ans) { score++; fb.className = 'feedback correct'; fb.textContent = 'Correct! ' + q.exp; }
            else { fb.className = 'feedback incorrect'; fb.textContent = 'Incorrect. ' + q.exp; }
            document.getElementById('scoreLabel').textContent = 'Score: ' + score;
            document.getElementById('nextBtn').disabled = false;
            if (current === TOTAL - 1) document.getElementById('nextBtn').textContent = 'See Results';
        }
        function nextQuestion() { current++; if (current >= TOTAL) { showResults(); return; } loadQuestion(); }
        function showResults() {
            document.getElementById('questionCard').style.display = 'none';
            document.querySelector('.progress-bar-wrap').style.display = 'none';
            var rc = document.getElementById('resultsCard'); rc.style.display = 'block';
            var pct = Math.round((score / TOTAL) * 100);
            var sb = document.getElementById('finalScore'); sb.textContent = score + '/' + TOTAL + ' (' + pct + '%)';
            if (pct >= 80) sb.className = 'score-big'; else if (pct >= 70) sb.className = 'score-big mid'; else sb.className = 'score-big low';
            var msg = pct >= 90 ? 'Excellent!' : pct >= 70 ? 'Good work -- you passed.' : pct >= 50 ? 'Close. Review and try again.' : 'More study needed.';
            document.getElementById('scoreMsg').textContent = msg;
            if (pct >= 70 && typeof ModuleProgress !== 'undefined') { ModuleProgress.complete('code', 'sp-w3-collections-quiz', { returnUrl: '../index.html' }); }
        }
        function restartQuiz() {
            current = 0; score = 0; answered = false;
            document.getElementById('scoreLabel').textContent = 'Score: 0';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.progress-bar-wrap').style.display = '';
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question';
            loadQuestion();
        }
        loadQuestion();
    </script>
</body>
</html>
