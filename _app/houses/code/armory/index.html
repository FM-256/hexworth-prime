/* ============================================================
   CODE ARMORY — Programming Languages Hub
   House of the Code | Hexworth Prime
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --arm-primary:#4ade80;
    --arm-secondary:#22c55e;
    --arm-glow:rgba(74,222,128,0.15);
    --arm-bg:#0a0a0f;
    --arm-surface:rgba(255,255,255,0.03);
    --arm-border:rgba(255,255,255,0.06);
    --arm-text:#e0e0e0;
    --arm-muted:#8b949e;
    --arm-dim:#555;
}
body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--arm-bg);color:var(--arm-text);
    min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ---- Particle field ---- */
.arm-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.arm-particle{
    position:absolute;bottom:-10px;color:var(--arm-primary);border-radius:50%;
    animation:armFloat linear infinite;
}
@keyframes armFloat{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:var(--o,0.3)}
    90%{opacity:var(--o,0.3)}
    100%{transform:translateY(-100vh) rotate(360deg);opacity:0}
}

/* ---- Ambient glow ---- */
.arm-glow{
    position:fixed;top:-200px;left:50%;width:700px;height:450px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(74,222,128,0.07) 0%,transparent 70%);
    pointer-events:none;z-index:0;
}

/* ---- Header ---- */
.arm-header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(74,222,128,0.2);
}
.arm-header-left{display:flex;align-items:center;gap:12px}
.arm-header-icon{border-radius:6px}
.arm-header-title{font-size:16px;font-weight:700;color:var(--arm-primary)}
.arm-header-sub{font-size:12px;color:var(--arm-muted)}
.arm-btn{
    display:inline-block;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;
    background:rgba(74,222,128,0.1);color:var(--arm-primary);
    border:1px solid rgba(74,222,128,0.25);transition:all 0.2s;cursor:pointer;
}
.arm-btn:hover{background:rgba(74,222,128,0.2)}

/* ---- Main container ---- */
.arm-main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}

/* ---- Hero ---- */
.arm-hero{text-align:center;padding:56px 0 40px}
.arm-hero-title{
    font-size:48px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#4ade80,#22c55e,#86efac);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.1;
}
.arm-hero-subtitle{font-size:18px;color:var(--arm-muted);margin-top:12px;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.5}
.arm-hero-tagline{
    display:inline-block;margin-top:20px;padding:6px 16px;border-radius:20px;
    font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    background:rgba(74,222,128,0.1);color:var(--arm-primary);
    border:1px solid rgba(74,222,128,0.2);
}
.arm-hero-stats{display:flex;justify-content:center;gap:48px;margin-top:28px}
.arm-stat{text-align:center}
.arm-stat-num{display:block;font-size:32px;font-weight:800;color:var(--arm-primary)}
.arm-stat-label{font-size:11px;color:var(--arm-muted);text-transform:uppercase;letter-spacing:1px}

/* ---- Overall progress ---- */
.arm-progress-section{margin-bottom:36px}
.arm-progress-header{display:flex;justify-content:space-between;margin-bottom:8px}
.arm-progress-label{font-size:14px;font-weight:600;color:var(--arm-primary)}
.arm-progress-count{font-size:13px;color:var(--arm-muted)}
.arm-progress-track{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.arm-progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:4px;transition:width 0.4s ease}

/* ---- Track tabs ---- */
.arm-track-section{margin-top:8px}
.arm-track-tabs{display:flex;gap:4px;border-bottom:1px solid rgba(255,255,255,0.08);overflow-x:auto;padding-bottom:0}
.arm-track-tab{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;border:none;background:none;color:var(--arm-muted);
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;transition:all 0.2s;font-family:inherit;
}
.arm-track-tab:hover{color:var(--arm-text)}
.arm-track-tab--active{color:var(--arm-primary);border-bottom-color:var(--arm-primary)}
.arm-tab-icon{border-radius:4px}
.arm-tab-count{font-size:11px;opacity:0.6}

/* ---- Language cards grid ---- */
.arm-lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.arm-lang-card{
    display:block;padding:24px;border-radius:14px;
    background:var(--arm-surface);border:1px solid var(--arm-border);
    transition:all 0.25s;position:relative;overflow:hidden;
}
.arm-lang-card:hover{
    background:rgba(255,255,255,0.05);
    border-color:var(--card-accent,var(--arm-primary));
    transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(0,0,0,0.4);
}
.arm-card-glow{
    position:absolute;top:-40px;right:-40px;width:120px;height:120px;
    background:radial-gradient(circle,var(--card-accent-dim,rgba(74,222,128,0.08)) 0%,transparent 70%);
    pointer-events:none;
}
.arm-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.arm-card-icon-wrap{
    width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:900;font-family:'Courier New',monospace;
    background:var(--card-accent-dim,rgba(74,222,128,0.1));
    color:var(--card-accent,var(--arm-primary));
    border:1px solid var(--card-accent-border,rgba(74,222,128,0.2));
}
.arm-card-diff{
    font-size:10px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;
}
.arm-card-diff--beginner{background:rgba(74,222,128,0.12);color:#4ade80}
.arm-card-diff--intermediate{background:rgba(251,191,36,0.12);color:#fbbf24}
.arm-card-diff--advanced{background:rgba(239,68,68,0.12);color:#ef4444}

.arm-card-name{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.arm-card-desc{font-size:13px;color:var(--arm-muted);line-height:1.5;margin-bottom:14px;min-height:40px}

.arm-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.arm-card-tag{
    font-size:10px;font-weight:600;letter-spacing:0.5px;padding:2px 8px;border-radius:3px;
    background:rgba(255,255,255,0.05);color:var(--arm-muted);
    border:1px solid rgba(255,255,255,0.06);
}
.arm-card-progress{display:flex;align-items:center;gap:10px}
.arm-card-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.arm-card-fill{height:100%;background:var(--card-accent,var(--arm-primary));border-radius:2px;transition:width 0.3s}
.arm-card-pct{font-size:12px;color:var(--arm-muted);min-width:30px;text-align:right}
.arm-card-soon{
    margin-top:10px;font-size:10px;letter-spacing:1.5px;color:#f59e0b;
    font-weight:700;text-transform:uppercase;
}

/* ---- Panel header ---- */
.arm-panel{display:none}
.arm-panel--active{display:block}
.arm-panel-header{padding:24px 0 8px}
.arm-panel-title{font-size:20px;font-weight:700;color:#fff}
.arm-panel-desc{font-size:14px;color:var(--arm-muted);margin-top:4px}

/* ---- Quiz section ---- */
.arm-quiz-section{
    margin-top:48px;padding:36px;border-radius:16px;
    background:rgba(74,222,128,0.03);
    border:1px solid rgba(74,222,128,0.12);
    position:relative;overflow:hidden;
}
.arm-quiz-glow{
    position:absolute;top:-80px;right:-80px;width:250px;height:250px;
    background:radial-gradient(circle,rgba(74,222,128,0.06) 0%,transparent 70%);
    pointer-events:none;
}
.arm-quiz-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.arm-quiz-desc{font-size:14px;color:var(--arm-muted);margin-bottom:24px;max-width:500px}
.arm-quiz-body{position:relative;z-index:1}

.arm-quiz-q{margin-bottom:24px;display:none}
.arm-quiz-q--active{display:block}
.arm-quiz-q-text{font-size:16px;font-weight:600;color:#fff;margin-bottom:14px}
.arm-quiz-q-num{font-size:12px;color:var(--arm-primary);font-weight:700;margin-bottom:6px}
.arm-quiz-opts{display:flex;flex-direction:column;gap:8px}
.arm-quiz-opt{
    padding:12px 16px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    font-size:14px;color:var(--arm-text);transition:all 0.2s;
    text-align:left;font-family:inherit;
}
.arm-quiz-opt:hover{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.3)}
.arm-quiz-opt--selected{background:rgba(74,222,128,0.12);border-color:var(--arm-primary);color:#fff}

.arm-quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.arm-quiz-dots{display:flex;gap:8px}
.arm-quiz-dot{
    width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,0.1);transition:all 0.2s;
}
.arm-quiz-dot--active{background:var(--arm-primary);transform:scale(1.2)}
.arm-quiz-dot--answered{background:rgba(74,222,128,0.4)}

.arm-quiz-results{display:none}
.arm-quiz-results--visible{display:block}
.arm-quiz-results-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:16px}
.arm-quiz-rec{
    display:flex;align-items:center;gap:16px;padding:16px;border-radius:10px;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    margin-bottom:10px;
}
.arm-quiz-rec-rank{
    font-size:24px;font-weight:900;color:var(--arm-primary);min-width:36px;text-align:center;
}
.arm-quiz-rec-name{font-size:16px;font-weight:700;color:#fff}
.arm-quiz-rec-reason{font-size:12px;color:var(--arm-muted);margin-top:2px}
.arm-quiz-restart{margin-top:16px}

/* ---- Footer ---- */
.arm-footer{
    text-align:center;padding:32px 0 16px;font-size:12px;color:var(--arm-dim);
    border-top:1px solid rgba(255,255,255,0.05);margin-top:48px;
}

/* ---- Breadcrumb ---- */
.arm-breadcrumb{
    padding:10px 24px;font-size:13px;color:var(--arm-muted);
    background:rgba(10,10,15,0.6);border-bottom:1px solid rgba(255,255,255,0.04);
    position:relative;z-index:99;
}
.arm-breadcrumb a{color:var(--arm-primary);text-decoration:none;transition:opacity 0.2s}
.arm-breadcrumb a:hover{opacity:0.8}
.arm-breadcrumb-sep{margin:0 8px;color:var(--arm-dim)}
.arm-breadcrumb-current{color:var(--arm-text)}

/* ---- Cert tags ---- */
.arm-card-cert-tag{
    font-size:9px;font-weight:700;letter-spacing:0.5px;padding:2px 7px;border-radius:3px;
    background:rgba(74,222,128,0.08);color:var(--arm-primary);
    border:1px solid rgba(74,222,128,0.15);
}

/* ---- Responsive ---- */
@media(max-width:700px){
    .arm-hero-title{font-size:32px}
    .arm-hero-stats{gap:24px}
    .arm-lang-grid{grid-template-columns:1fr}
    .arm-quiz-section{padding:24px 16px}
}

(function() {
    'use strict';

    // ---- Progress ----
    // BUG-084: this used to read 'hexworth_armory_progress', a key NOTHING in the platform ever
    // wrote -- it occurred exactly once in all of _app, here. The progress bar could never fill,
    // however much a student completed. Modules record through ModuleProgress.complete('code', id),
    // which lands in hexworth_progress.code[<moduleId>] = { completed: true, ... }.
    // Single source of truth: read that, rather than teaching modules to write a second key.
    let progress = {};
    try { progress = (JSON.parse(localStorage.getItem('hexworth_progress') || '{}').code) || {}; }
    catch(e) { progress = {}; }

    // Module ids are arm-<abbrev>-NN-..., and the abbreviation is NOT the directory name
    // (python -> arm-py, javascript -> arm-js, assembly -> arm-asm). Mapped explicitly rather than
    // derived, because a wrong guess here silently reports zero instead of failing.
    const MODULE_PREFIX = {
        python: 'arm-py', javascript: 'arm-js', c: 'arm-c', bash: 'arm-bash', sql: 'arm-sql',
        powershell: 'arm-ps', go: 'arm-go', java: 'arm-java', csharp: 'arm-cs', php: 'arm-php',
        ruby: 'arm-rb', 'swift-kotlin': 'arm-sk', cpp: 'arm-cpp', rust: 'arm-rs',
        assembly: 'arm-asm', 'lua-perl-r': 'arm-lpr'
    };
    // The trailing '-' is load-bearing: without it 'arm-c' also matches arm-cpp-* and arm-cs-*.
    function completedIn(langId) {
        const pre = MODULE_PREFIX[langId];
        if (!pre) return 0;
        return Object.keys(progress).filter(function(k) {
            return k.indexOf(pre + '-') === 0 && progress[k] && progress[k].completed;

    // ---- Utility ----
    function getLang(id) { return LANGUAGES.find(l => l.id === id); }
    function getTotalModules() { return LANGUAGES.reduce((s, l) => s + l.modules, 0); }
    function getCompletedCount() {
        return LANGUAGES.reduce(function(sum, l) { return sum + Math.min(completedIn(l.id), l.modules); }, 0);
    }
    function getLangProgress(langId) {
        const lang = getLang(langId);
        if (!lang) return { completed: 0, total: 0, pct: 0 };
        const completed = Math.min(completedIn(langId), lang.modules);
        return { completed, total: lang.modules, pct: lang.modules > 0 ? Math.round((completed / lang.modules) * 100) : 0 };
    }

    // ---- Particles ----
    function buildParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('span');
            p.className = 'arm-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (6 + Math.random() * 10) + 's';
            p.style.animationDelay = -(Math.random() * 16) + 's';
            p.style.opacity = String(0.15 + Math.random() * 0.35);
            p.style.fontSize = (3 + Math.random() * 5) + 'px';
            p.textContent = '\u2022';
            container.appendChild(p);
        }
    }

    // ---- Build hero ----
    function buildHero() {
        const total = getTotalModules();
        const div = document.createElement('div');
        div.className = 'arm-hero';
        div.innerHTML =
            '<h1 class="arm-hero-title">The Code Armory</h1>' +
            '<div class="arm-hero-subtitle">Master the weapons of software engineering. Every language is a tool -- choose the right one for every mission.</div>' +
            '<div class="arm-hero-tagline">Choose Your Weapon</div>' +
            '<div class="arm-hero-stats">' +
                '<div class="arm-stat"><span class="arm-stat-num">' + LANGUAGES.length + '</span><span class="arm-stat-label">Languages</span></div>' +
                '<div class="arm-stat"><span class="arm-stat-num">' + total + '</span><span class="arm-stat-label">Modules</span></div>' +
                '<div class="arm-stat"><span class="arm-stat-num">' + TRACKS.length + '</span><span class="arm-stat-label">Tracks</span></div>' +
            '</div>';
        return div;
    }

    // ---- Overall progress ----
    function buildOverallProgress() {
        const total = getTotalModules();
        const completed = getCompletedCount();
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        const div = document.createElement('div');
        div.className = 'arm-progress-section';
        div.innerHTML =
            '<div class="arm-progress-header">' +
                '<span class="arm-progress-label">Armory Progress</span>' +
                '<span class="arm-progress-count">' + completed + ' / ' + total + ' modules &mdash; ' + pct + '%</span>' +
            '</div>' +
            '<div class="arm-progress-track">' +
                '<div class="arm-progress-fill" style="width:' + pct + '%"></div>' +
            '</div>';
        return div;
    }

    // ---- Language card ----
    function buildLangCard(lang) {
        const prog = getLangProgress(lang.id);
        const card = document.createElement('a');
        card.className = 'arm-lang-card';
        card.href = lang.href;
        card.style.setProperty('--card-accent', lang.accent);
        card.style.setProperty('--card-accent-dim', lang.accentDim);
        card.style.setProperty('--card-accent-border', lang.accentBorder);

        var tagsHtml = '';
        lang.tags.forEach(function(t) {
            tagsHtml += '<span class="arm-card-tag">' + t + '</span>';
        });
        if (lang.certs) {
            lang.certs.forEach(function(c) {
                tagsHtml += '<span class="arm-card-tag arm-card-cert-tag">' + c + '</span>';
            });
        }

        card.innerHTML =
            '<div class="arm-card-glow"></div>' +
            '<div class="arm-card-header">' +
                '<div class="arm-card-icon-wrap">' + lang.symbol + '</div>' +
                '<span class="arm-card-diff arm-card-diff--' + lang.difficulty + '">' + lang.difficulty + '</span>' +
            '</div>' +
            '<div class="arm-card-name">' + lang.name + '</div>' +
            '<div class="arm-card-desc">' + lang.description + '</div>' +
            '<div class="arm-card-tags">' + tagsHtml + '</div>' +
            '<div class="arm-card-progress">' +
                '<div class="arm-card-track"><div class="arm-card-fill" style="width:' + prog.pct + '%"></div></div>' +
                '<span class="arm-card-pct">' + prog.pct + '%</span>' +
            '</div>' +
            (lang.href === '#coming-soon' ? '<div class="arm-card-soon">COMING SOON</div>' : '');
        return card;
    }

    // ---- Track tabs + panels ----
    function buildTrackSection() {
        const section = document.createElement('div');
        section.className = 'arm-track-section';

        // Tab bar
        const tabBar = document.createElement('div');
        tabBar.className = 'arm-track-tabs';

        TRACKS.forEach(function(track) {
            const tab = document.createElement('button');
            tab.className = 'arm-track-tab';
            tab.setAttribute('data-track', track.id);
            tab.innerHTML =
                '<img class="arm-tab-icon" src="' + track.icon + '" alt="" width="20" height="20">' +
                '<span>' + track.name + '</span>' +
                '<span class="arm-tab-count">' + track.languages.length + '</span>';
            tab.addEventListener('click', function() { activateTrack(track.id); });
            tabBar.appendChild(tab);
        });
        section.appendChild(tabBar);

        // Panels
        const panelWrap = document.createElement('div');
        panelWrap.id = 'track-panels';

        TRACKS.forEach(function(track) {
            const panel = document.createElement('div');
            panel.className = 'arm-panel';
            panel.id = 'panel-' + track.id;

            const header = document.createElement('div');
            header.className = 'arm-panel-header';
            header.innerHTML =
                '<div class="arm-panel-title">' + track.name + '</div>' +
                '<div class="arm-panel-desc">' + track.description + '</div>';
            panel.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'arm-lang-grid';
            track.languages.forEach(function(langId) {
                var lang = getLang(langId);
                if (lang) grid.appendChild(buildLangCard(lang));
            });
            panel.appendChild(grid);
            panelWrap.appendChild(panel);
        });

        section.appendChild(panelWrap);
        return section;
    }

    function activateTrack(trackId) {
        document.querySelectorAll('.arm-track-tab').forEach(function(t) {
            t.classList.toggle('arm-track-tab--active', t.getAttribute('data-track') === trackId);
        });
        TRACKS.forEach(function(track) {
            var panel = document.getElementById('panel-' + track.id);
            if (panel) {
                panel.classList.toggle('arm-panel--active', track.id === trackId);
            }
        });
    }

    // ---- Quiz ----
    function buildQuiz() {
        const section = document.createElement('div');
        section.className = 'arm-quiz-section';
        section.innerHTML =
            '<div class="arm-quiz-glow"></div>' +
            '<div class="arm-quiz-body">' +
                '<div class="arm-quiz-title">Pick Your Weapon</div>' +
                '<div class="arm-quiz-desc">Answer 5 questions about your goals and interests. We will recommend the top 3 languages for your path.</div>' +
                '<div id="quiz-container"></div>' +
                '<div id="quiz-results" class="arm-quiz-results"></div>' +
            '</div>';

        return section;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;

        let currentQ = 0;
        const answers = new Array(QUIZ_QUESTIONS.length).fill(null);

        function render() {
            var html = '';
            QUIZ_QUESTIONS.forEach(function(q, qi) {
                html += '<div class="arm-quiz-q' + (qi === currentQ ? ' arm-quiz-q--active' : '') + '" data-q="' + qi + '">';
                html += '<div class="arm-quiz-q-num">QUESTION ' + (qi + 1) + ' OF ' + QUIZ_QUESTIONS.length + '</div>';
                html += '<div class="arm-quiz-q-text">' + q.text + '</div>';
                html += '<div class="arm-quiz-opts">';
                q.options.forEach(function(opt, oi) {
                    var sel = answers[qi] === oi ? ' arm-quiz-opt--selected' : '';
                    html += '<button class="arm-quiz-opt' + sel + '" data-q="' + qi + '" data-o="' + oi + '">' + opt.label + '</button>';
                });
                html += '</div></div>';
            });

            // Nav
            html += '<div class="arm-quiz-nav">';
            html += '<button class="arm-btn" id="quiz-prev" ' + (currentQ === 0 ? 'style="visibility:hidden"' : '') + '>&larr; Back</button>';
            html += '<div class="arm-quiz-dots">';
            for (var i = 0; i < QUIZ_QUESTIONS.length; i++) {
                var cls = 'arm-quiz-dot';
                if (i === currentQ) cls += ' arm-quiz-dot--active';
                else if (answers[i] !== null) cls += ' arm-quiz-dot--answered';
                html += '<div class="' + cls + '"></div>';
            }
            html += '</div>';
            var allAnswered = answers.every(function(a) { return a !== null; });
            if (currentQ === QUIZ_QUESTIONS.length - 1 && allAnswered) {
                html += '<button class="arm-btn" id="quiz-submit">See Results &rarr;</button>';
            } else {
                html += '<button class="arm-btn" id="quiz-next" ' + (answers[currentQ] === null ? 'disabled style="opacity:0.4;pointer-events:none"' : '') + '>Next &rarr;</button>';
            }
            html += '</div>';

            container.innerHTML = html;

            // Event listeners
            container.querySelectorAll('.arm-quiz-opt').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var qi = parseInt(this.getAttribute('data-q'));
                    var oi = parseInt(this.getAttribute('data-o'));
                    answers[qi] = oi;
                    render();
                });
            });
            var prevBtn = document.getElementById('quiz-prev');
            if (prevBtn) prevBtn.addEventListener('click', function() { if (currentQ > 0) { currentQ--; render(); } });
            var nextBtn = document.getElementById('quiz-next');
            if (nextBtn) nextBtn.addEventListener('click', function() { if (currentQ < QUIZ_QUESTIONS.length - 1) { currentQ++; render(); } });
            var submitBtn = document.getElementById('quiz-submit');
            if (submitBtn) submitBtn.addEventListener('click', function() { showResults(); });
        }

        function showResults() {
            var scores = {};
            LANGUAGES.forEach(function(l) { scores[l.id] = 0; });

            answers.forEach(function(oi, qi) {
                if (oi === null) return;
                var opt = QUIZ_QUESTIONS[qi].options[oi];
                Object.keys(opt.scores).forEach(function(langId) {
                    scores[langId] = (scores[langId] || 0) + opt.scores[langId];
                });
            });

            var sorted = Object.keys(scores).sort(function(a, b) { return scores[b] - scores[a]; });
            var top3 = sorted.slice(0, 3);

            var reasonMap = {
                python: 'Versatile across security, data, and automation',
                javascript: 'Powers the modern web and full-stack development',
                c: 'Deep systems understanding and exploit development',
                cpp: 'High-performance systems and security research',
                go: 'Cloud-native tooling and scalable services',
                rust: 'Memory-safe systems programming for the future',
                bash: 'Essential for Linux administration and automation',
                sql: 'Data analysis, forensics, and database security',
                powershell: 'Windows automation and enterprise security',
                ruby: 'Rapid development and security tool frameworks',
                java: 'Enterprise backends and Android development',
                csharp: 'Microsoft ecosystem and Windows applications',
                php: 'Web development and legacy application security',
                assembly: 'Reverse engineering and low-level exploit development',
                'swift-kotlin': 'Native mobile development for iOS and Android',
                'lua-perl-r': 'Specialized scripting and data analysis'
            };

            container.style.display = 'none';
            var results = document.getElementById('quiz-results');
            var html = '<div class="arm-quiz-results-title">Your Top 3 Weapons</div>';
            top3.forEach(function(langId, i) {
                var lang = getLang(langId);
                html += '<div class="arm-quiz-rec">' +
                    '<div class="arm-quiz-rec-rank">#' + (i + 1) + '</div>' +
                    '<div>' +
                        '<div class="arm-quiz-rec-name">' + lang.name + '</div>' +
                        '<div class="arm-quiz-rec-reason">' + (reasonMap[langId] || '') + ' (score: ' + scores[langId] + ')</div>' +
                    '</div>' +
                '</div>';
            });
            html += '<button class="arm-btn arm-quiz-restart" id="quiz-restart">Retake Quiz</button>';
            results.innerHTML = html;
            results.classList.add('arm-quiz-results--visible');

            document.getElementById('quiz-restart').addEventListener('click', function() {
                for (var i = 0; i < answers.length; i++) answers[i] = null;
                currentQ = 0;
                results.classList.remove('arm-quiz-results--visible');
                results.innerHTML = '';
                container.style.display = '';
                render();
            });
        }

        render();
    }

    // ---- Render page ----
    function renderPage() {
        buildParticles();
        var main = document.getElementById('main-content');

        main.appendChild(buildHero());
        main.appendChild(buildOverallProgress());
        main.appendChild(buildTrackSection());
        main.appendChild(buildQuiz());

        // Footer
        var footer = document.createElement('div');
        footer.className = 'arm-footer';
        footer.innerHTML = 'The Code Armory &mdash; House of the Code &mdash; Hexworth Prime';
        main.appendChild(footer);

        // Activate first track
        activateTrack('all');

        // Init quiz
        initQuiz();
    }

    // Go
    renderPage();

})();
