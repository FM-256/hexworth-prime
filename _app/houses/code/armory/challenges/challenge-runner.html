<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Runner | The Code Armory | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/icon-swords.webp">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --ca-primary:#f59e0b;
    --ca-secondary:#d97706;
    --ca-bg:#090910;
    --ca-surface:#111120;
    --ca-terminal:#0d1117;
    --ca-border:rgba(255,255,255,0.08);
    --ca-text:#e0e0e0;
    --ca-muted:#8b949e;
    --ca-dim:#555;
    --ca-green:#4ade80;
    --ca-red:#ef4444;
}
body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--ca-bg);color:var(--ca-text);
    min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

.cr-header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;
    background:rgba(9,9,16,0.95);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(245,158,11,0.2);
}
.cr-header-left{display:flex;align-items:center;gap:10px}
.cr-badge{
    background:var(--ca-primary);color:#000;padding:3px 10px;border-radius:4px;
    font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;
}
.cr-header h1{font-size:15px;font-weight:600;color:var(--ca-primary)}
.cr-back{
    color:var(--ca-muted);padding:6px 14px;border:1px solid var(--ca-border);
    border-radius:6px;font-size:13px;transition:all 0.2s;
}
.cr-back:hover{background:var(--ca-primary);color:#000;border-color:var(--ca-primary)}

.cr-split{display:flex;height:calc(100vh - 49px);overflow:hidden}

/* ---- Left Panel: Problem Description ---- */
.cr-left{
    width:45%;min-width:320px;overflow-y:auto;padding:24px;
    border-right:1px solid var(--ca-border);background:rgba(9,9,16,0.5);
}
.cr-challenge-meta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cr-tag{
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;letter-spacing:0.5px;
}
.cr-tag-lang{background:rgba(245,158,11,0.12);color:var(--ca-primary)}
.cr-tag-diff{background:rgba(74,222,128,0.12);color:var(--ca-green)}
.cr-tag-diff.intermediate{background:rgba(245,158,11,0.12);color:var(--ca-primary)}
.cr-tag-diff.advanced{background:rgba(239,68,68,0.12);color:var(--ca-red)}
.cr-tag-pts{background:rgba(255,255,255,0.06);color:var(--ca-muted)}

.cr-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:12px}
.cr-description{font-size:14px;color:var(--ca-muted);line-height:1.7;margin-bottom:20px}

.cr-expected{
    background:var(--ca-terminal);border:1px solid var(--ca-border);
    border-radius:8px;padding:14px 16px;margin-bottom:20px;
}
.cr-expected-label{font-size:11px;color:var(--ca-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.cr-expected-val{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ca-green);white-space:pre-wrap;word-break:break-all}

.cr-hints{margin-bottom:20px}
.cr-hints-title{font-size:13px;font-weight:700;color:var(--ca-primary);margin-bottom:8px}
.cr-hint{
    background:var(--ca-surface);border:1px solid var(--ca-border);border-radius:6px;
    margin-bottom:6px;overflow:hidden;
}
.cr-hint-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;font-size:13px;color:var(--ca-muted);
    background:transparent;border:none;width:100%;text-align:left;
    transition:color 0.2s;
}
.cr-hint-toggle:hover{color:var(--ca-text)}
.cr-hint-toggle span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ca-primary)}
.cr-hint-content{
    display:none;padding:0 14px 10px;font-size:13px;color:var(--ca-text);line-height:1.5;
    border-top:1px solid var(--ca-border);padding-top:10px;
}
.cr-hint.revealed .cr-hint-content{display:block}
.cr-hint.revealed .cr-hint-toggle span{color:var(--ca-dim)}

/* ---- Right Panel: Code Editor ---- */
.cr-right{flex:1;display:flex;flex-direction:column;overflow:hidden}

.cr-editor-toolbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 16px;background:var(--ca-surface);border-bottom:1px solid var(--ca-border);
}
.cr-editor-lang{font-size:12px;color:var(--ca-muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.cr-toolbar-btns{display:flex;gap:8px}
.cr-tool-btn{
    padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;
    border:1px solid var(--ca-border);background:transparent;color:var(--ca-muted);
    transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px;
}
.cr-tool-btn:hover{color:var(--ca-text);border-color:rgba(255,255,255,0.2)}
.cr-tool-btn.check{background:rgba(245,158,11,0.12);color:var(--ca-primary);border-color:rgba(245,158,11,0.3)}
.cr-tool-btn.check:hover{background:rgba(245,158,11,0.2)}

.cr-editor-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.cr-line-numbers{
    width:44px;padding:16px 8px 16px 0;text-align:right;
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;
    color:var(--ca-dim);background:var(--ca-terminal);
    border-right:1px solid var(--ca-border);overflow:hidden;
    user-select:none;flex-shrink:0;
}
.cr-code-area{
    flex:1;resize:none;border:none;outline:none;padding:16px;
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;
    color:var(--ca-text);background:var(--ca-terminal);
    tab-size:4;white-space:pre;overflow:auto;
}
.cr-code-area::placeholder{color:var(--ca-dim)}

/* ---- Result Panel ---- */
.cr-result{
    padding:12px 16px;border-top:1px solid var(--ca-border);
    background:var(--ca-surface);min-height:48px;
    display:flex;align-items:center;gap:12px;
}
.cr-result-icon{font-size:18px;font-weight:900;font-family:'JetBrains Mono',monospace}
.cr-result-icon.pass{color:var(--ca-green)}
.cr-result-icon.fail{color:var(--ca-red)}
.cr-result-msg{font-size:13px;color:var(--ca-muted)}
.cr-result-msg.pass{color:var(--ca-green)}
.cr-result-msg.fail{color:var(--ca-red)}
.cr-result-bar{
    flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;
}
.cr-result-fill{height:100%;border-radius:3px;transition:width 0.4s ease}
.cr-result-fill.pass{background:var(--ca-green)}
.cr-result-fill.partial{background:var(--ca-primary)}
.cr-result-fill.fail{background:var(--ca-red)}

.cr-not-found{
    display:flex;align-items:center;justify-content:center;
    height:calc(100vh - 49px);flex-direction:column;gap:16px;
}
.cr-not-found h2{color:var(--ca-primary);font-size:20px}
.cr-not-found p{color:var(--ca-muted);font-size:14px}

@media(max-width:800px){
    .cr-split{flex-direction:column;height:auto}
    .cr-left{width:100%;border-right:none;border-bottom:1px solid var(--ca-border)}
    .cr-right{min-height:50vh}
}
    </style>
</head>
<body>
    <header class="cr-header">
        <div class="cr-header-left">
            <span class="cr-badge" id="challengeBadge">--</span>
            <h1 id="challengeHeaderTitle">Challenge Runner</h1>
        </div>
        <a href="index.html" class="cr-back">&lt; All Challenges</a>
    </header>

    <div class="cr-split" id="mainContent" style="display:none">
        <!-- Left: Problem Description -->
        <div class="cr-left">
            <div class="cr-challenge-meta" id="metaTags"></div>
            <h2 class="cr-title" id="challengeTitle"></h2>
            <p class="cr-description" id="challengeDesc"></p>

            <div class="cr-expected">
                <div class="cr-expected-label">Expected Output</div>
                <div class="cr-expected-val" id="expectedOutput"></div>
            </div>

            <div class="cr-hints" id="hintsSection"></div>
        </div>

        <!-- Right: Code Editor -->
        <div class="cr-right">
            <div class="cr-editor-toolbar">
                <span class="cr-editor-lang" id="editorLang">--</span>
                <div class="cr-toolbar-btns">
                    <button class="cr-tool-btn" id="resetBtn">Reset</button>
                    <button class="cr-tool-btn check" id="checkBtn">Check Solution</button>
                </div>
            </div>
            <div class="cr-editor-wrap">
                <div class="cr-line-numbers" id="lineNumbers">1</div>
                <textarea class="cr-code-area" id="codeArea" spellcheck="false" placeholder="Write your solution here..."></textarea>
            </div>
            <div class="cr-result" id="resultPanel">
                <span class="cr-result-icon" id="resultIcon"></span>
                <span class="cr-result-msg" id="resultMsg">Write your solution and click Check Solution.</span>
                <div class="cr-result-bar"><div class="cr-result-fill" id="resultFill" style="width:0%"></div></div>
            </div>
        </div>
    </div>

    <div class="cr-not-found" id="notFound" style="display:none">
        <h2>Challenge Not Found</h2>
        <p>The requested challenge does not exist.</p>
        <a href="index.html" class="cr-back" style="margin-top:8px">Back to Challenges</a>
    </div>

    <script src="challenges.js"></script>
    <script>
(function() {
    'use strict';

    var LANG_LABELS = {
        python: 'Python', javascript: 'JavaScript', c: 'C', go: 'Go', rust: 'Rust',
        java: 'Java', csharp: 'C#', bash: 'Bash', sql: 'SQL', powershell: 'PowerShell'
    };

    // Parse challenge ID from URL
    var params = new URLSearchParams(window.location.search);
    var challengeId = params.get('id');

    if (!challengeId) {
        document.getElementById('notFound').style.display = 'flex';
        return;
    }

    var challenge = ChallengeEngine.getChallenge(challengeId);
    if (!challenge) {
        document.getElementById('notFound').style.display = 'flex';
        return;
    }

    document.getElementById('mainContent').style.display = 'flex';

    // Populate header
    document.getElementById('challengeBadge').textContent = challengeId.toUpperCase();
    document.getElementById('challengeHeaderTitle').textContent = challenge.title;
    document.title = challenge.title + ' | Challenge Runner | Hexworth Prime';

    // Populate left panel
    var metaHtml = '<span class="cr-tag cr-tag-lang">' + LANG_LABELS[challenge.lang] + '</span>' +
        '<span class="cr-tag cr-tag-diff ' + challenge.difficulty + '">' + challenge.difficulty + '</span>' +
        '<span class="cr-tag cr-tag-pts">+' + challenge.points + ' pts</span>';
    document.getElementById('metaTags').innerHTML = metaHtml;
    document.getElementById('challengeTitle').textContent = challenge.title;
    document.getElementById('challengeDesc').textContent = challenge.description;
    document.getElementById('expectedOutput').textContent = challenge.expected;
    document.getElementById('editorLang').textContent = LANG_LABELS[challenge.lang];

    // Hints
    var hintsHtml = '<div class="cr-hints-title">Hints (click to reveal)</div>';
    for (var i = 0; i < challenge.hints.length; i++) {
        hintsHtml += '<div class="cr-hint" data-idx="' + i + '">' +
            '<button class="cr-hint-toggle">' +
                'Hint ' + (i + 1) + ' of ' + challenge.hints.length +
                '<span>[reveal]</span>' +
            '</button>' +
            '<div class="cr-hint-content">' + challenge.hints[i] + '</div>' +
        '</div>';
    }
    document.getElementById('hintsSection').innerHTML = hintsHtml;

    // Hint click handlers
    document.getElementById('hintsSection').addEventListener('click', function(e) {
        var toggle = e.target.closest('.cr-hint-toggle');
        if (!toggle) return;
        var hint = toggle.closest('.cr-hint');
        hint.classList.toggle('revealed');
        if (hint.classList.contains('revealed')) {
            toggle.querySelector('span').textContent = '[hide]';
        } else {
            toggle.querySelector('span').textContent = '[reveal]';
        }
    });

    // Code editor
    var codeArea = document.getElementById('codeArea');
    var lineNumbers = document.getElementById('lineNumbers');
    var starterCode = challenge.starter;

    // Load saved code or use starter
    var savedKey = 'hexworth_challenge_code_' + challengeId;
    var saved = localStorage.getItem(savedKey);
    codeArea.value = saved || starterCode;

    function updateLineNumbers() {
        var lines = codeArea.value.split('\n').length;
        var nums = '';
        for (var i = 1; i <= lines; i++) nums += i + '\n';
        lineNumbers.textContent = nums;
    }

    codeArea.addEventListener('input', function() {
        updateLineNumbers();
        localStorage.setItem(savedKey, codeArea.value);
    });

    codeArea.addEventListener('scroll', function() {
        lineNumbers.scrollTop = codeArea.scrollTop;
    });

    // Tab key support
    codeArea.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end = this.selectionEnd;
            this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
            updateLineNumbers();
            localStorage.setItem(savedKey, this.value);
        }
    });

    updateLineNumbers();

    // Reset button
    document.getElementById('resetBtn').addEventListener('click', function() {
        codeArea.value = starterCode;
        updateLineNumbers();
        localStorage.setItem(savedKey, starterCode);
        showResult('neutral', 'Code reset to starter template.', 0);
    });

    // Check solution
    function showResult(type, message, score) {
        var icon = document.getElementById('resultIcon');
        var msg = document.getElementById('resultMsg');
        var fill = document.getElementById('resultFill');

        icon.className = 'cr-result-icon';
        msg.className = 'cr-result-msg';
        fill.className = 'cr-result-fill';

        if (type === 'pass') {
            icon.textContent = '[+]';
            icon.classList.add('pass');
            msg.classList.add('pass');
            fill.classList.add('pass');
        } else if (type === 'fail') {
            icon.textContent = '[x]';
            icon.classList.add('fail');
            msg.classList.add('fail');
            fill.classList.add(score >= 0.5 ? 'partial' : 'fail');
        } else {
            icon.textContent = '--';
        }

        msg.textContent = message;
        fill.style.width = Math.round((score || 0) * 100) + '%';
    }

    document.getElementById('checkBtn').addEventListener('click', function() {
        var code = codeArea.value;
        var result = ChallengeEngine.checkSolution(challengeId, code);

        if (result.pass) {
            showResult('pass', result.message, 1);
        } else {
            showResult('fail', result.message, result.score || 0);
        }
    });

    // Check if already completed
    if (ChallengeEngine.isCompleted(challengeId)) {
        showResult('pass', 'Previously solved. You can still improve your solution.', 1);
    }
})();
    </script>
</body>
</html>
