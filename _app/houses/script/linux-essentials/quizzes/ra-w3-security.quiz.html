<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Security Best Practices | Root Access</title>
    <style>:root{--bg:#0a0a14;--bg-card:#0f1625;--bg-option:#141d2e;--accent:#a78bfa;--accent-dim:rgba(167,139,250,.15);--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--warning:#fbbf24;--border:rgba(255,255,255,.08)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg),#0c0c1a,#120a1e);color:var(--text);min-height:100vh;line-height:1.6}.quiz-container{max-width:800px;margin:0 auto;padding:2rem}.nav-links{display:flex;gap:1.5rem;margin-bottom:1.5rem}.back-link{color:var(--accent);text-decoration:none;font-size:.9rem;transition:all .3s}.back-link:hover{color:#c4b5fd}.quiz-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--accent-dim)}.quiz-header h1{font-size:1.6rem;color:var(--accent);margin-bottom:.5rem}.quiz-header .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}.quiz-header .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem}.quiz-header .meta span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted)}.progress-bar-wrap{background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px}.progress-label{font-size:.85rem;color:var(--text-muted);white-space:nowrap}.progress-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,var(--accent));border-radius:4px;transition:width .4s ease;width:0%}.score-label{font-size:.85rem;color:var(--accent);font-weight:600;white-space:nowrap}.question-card{background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem}.question-num{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.5px;margin-bottom:.75rem}.question-text{font-size:1.15rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5}.question-text code{background:rgba(167,139,250,.1);color:#c4b5fd;padding:2px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:1rem}.code-block{background:#080c18;border:1px solid rgba(167,139,250,.2);border-radius:8px;padding:14px 18px;margin:-.75rem 0 1.25rem;font-family:'Consolas',monospace;font-size:.92rem;color:#c4b5fd;white-space:pre;overflow-x:auto;line-height:1.7}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}.option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem}.option:hover{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.05)}.option.selected{border-color:var(--accent);background:rgba(167,139,250,.08)}.option.correct{border-color:var(--success);background:rgba(34,197,94,.1)}.option.incorrect{border-color:var(--danger);background:rgba(239,68,68,.08)}.option.disabled{pointer-events:none;opacity:.7}.option.correct.disabled,.option.incorrect.disabled{opacity:1}.option-letter{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:.85rem;color:var(--accent);flex-shrink:0}.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}.option.incorrect .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}.feedback{padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:.9rem;line-height:1.6;display:none}.feedback.correct{display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);color:#86efac}.feedback.incorrect{display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.quiz-nav{display:flex;justify-content:flex-end}.next-btn{padding:10px 24px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:var(--accent);border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.next-btn:hover{background:var(--accent);color:#fff}.next-btn:disabled{opacity:.3;cursor:not-allowed}.next-btn:disabled:hover{background:rgba(167,139,250,.15);color:var(--accent)}.results-card{display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border)}.results-card h2{color:var(--accent);font-size:1.4rem;margin-bottom:1rem}.score-big{font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:.5rem}.score-big.low{color:var(--danger)}.score-big.mid{color:var(--warning)}.score-msg{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}.results-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.results-btns a,.results-btns button{padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;border:none}.btn-retry{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4)!important;color:var(--accent)}.btn-retry:hover{background:var(--accent);color:#fff}.btn-hub{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4)!important;color:var(--success)}.btn-hub:hover{background:var(--success);color:#fff}@media(max-width:640px){.quiz-container{padding:1rem}.question-card{padding:1.25rem}.quiz-header h1{font-size:1.3rem}}</style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Root Access Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz: Security Best Practices</h1>
            <p class="subtitle">SSH hardening, PAM, SELinux, AppArmor, file integrity, scanning</p>
            <div class="meta"><span>Week 3</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS2165C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Hub</a>
            </div>
        </div>
    </div>
    <script>var questions = [{"q":"Which sshd_config directive disables root login over SSH?","opts":["AllowRootLogin no","PermitRootLogin no","RootLogin disable","DenyRoot yes"],"ans":1,"exp":"PermitRootLogin no in /etc/ssh/sshd_config prevents direct root SSH access. Users must log in as a normal user and use sudo."},{"q":"What algorithm is recommended for new SSH key generation?","opts":["RSA-1024","DSA","ed25519","ECDSA-256"],"ans":2,"exp":"Ed25519 is the modern recommendation: small keys, fast, and considered more secure than RSA. Generate with ssh-keygen -t ed25519."},{"q":"What are the correct permissions for the ~/.ssh/authorized_keys file?","opts":["644","600","755","700"],"ans":1,"exp":"SSH requires authorized_keys to be 600 (owner read/write only). SSH refuses to use the file if permissions are too open."},{"q":"What PAM module enforces password complexity requirements?","opts":["pam_unix","pam_pwquality","pam_ssh","pam_limits"],"ans":1,"exp":"pam_pwquality checks password quality: minimum length, character classes, dictionary words. Configured in /etc/security/pwquality.conf."},{"q":"What command checks the current SELinux enforcement mode?","opts":["sestatus","getenforce","semanage","Both A and B"],"ans":3,"exp":"getenforce returns one word (Enforcing/Permissive/Disabled). sestatus shows detailed information. Both reveal the enforcement mode."},{"q":"What does SELinux Permissive mode do?","opts":["Blocks all policy violations","Logs violations without blocking","Disables SELinux completely","Allows all access"],"ans":1,"exp":"Permissive mode logs policy violations as if they were enforced but does not actually block anything. Useful for troubleshooting."},{"q":"Which command restores default SELinux file contexts?","opts":["setenforce","restorecon -Rv","setsebool","chcon"],"ans":1,"exp":"restorecon -Rv recursively restores files to their default SELinux context based on the policy. -R is recursive, -v is verbose."},{"q":"What is AppArmor profile-based on?","opts":["Labels attached to files","File system paths","User roles","Network zones"],"ans":1,"exp":"AppArmor uses path-based profiles. SELinux uses label-based contexts. AppArmor is simpler to configure but less granular."},{"q":"Which tool creates a baseline for file integrity monitoring?","opts":["Lynis","AIDE","ClamAV","OpenSCAP"],"ans":1,"exp":"AIDE (Advanced Intrusion Detection Environment) creates a database of file hashes. Subsequent checks compare current state to the baseline."},{"q":"What command initializes the AIDE database?","opts":["aide --check","aide --init","aide --update","aide --scan"],"ans":1,"exp":"aide --init creates the initial baseline database. Run aide --check to compare current state against it."},{"q":"Which security scanner generates compliance reports against CIS benchmarks?","opts":["ClamAV","Lynis","OpenSCAP","Nessus"],"ans":2,"exp":"OpenSCAP evaluates systems against SCAP compliance profiles including CIS and DISA STIG benchmarks, generating HTML reports."},{"q":"What does chroot do?","opts":["Changes file ownership","Changes apparent root directory for a process","Changes run level","Changes hostname"],"ans":1,"exp":"chroot confines a process to a subdirectory tree so it cannot access files outside. Used for SFTP jails and recovery."},{"q":"Which systemd service directive prevents privilege escalation?","opts":["ProtectSystem=strict","NoNewPrivileges=yes","PrivateTmp=yes","ReadOnly=true"],"ans":1,"exp":"NoNewPrivileges=yes prevents the process and its children from gaining new privileges through SUID/SGID or capabilities."},{"q":"What should you do if SELinux blocks a legitimate application?","opts":["Disable SELinux","Set to Permissive permanently","Check audit logs and adjust booleans or policy","Reinstall the application"],"ans":2,"exp":"Never disable SELinux for convenience. Check /var/log/audit/audit.log, use audit2why, and adjust SELinux booleans or create a custom policy module."},{"q":"Which Lynis command performs a full security audit?","opts":["lynis scan","lynis audit system","lynis check","lynis --full"],"ans":1,"exp":"lynis audit system runs a comprehensive security scan covering kernel, authentication, networking, storage, and more."}];</script>
    <script>var current=0,score=0,answered=false,TOTAL=questions.length;
function loadQuestion(){var q=questions[current];document.getElementById('questionNum').textContent='QUESTION '+(current+1);document.getElementById('progressLabel').textContent='Question '+(current+1)+' of '+TOTAL;document.getElementById('progressFill').style.width=((current+1)/TOTAL*100)+'%';document.getElementById('questionText').innerHTML=q.q;if(q.code){var b=document.createElement('pre');b.className='code-block';b.textContent=q.code;document.getElementById('questionText').appendChild(b);}var h='',L=['A','B','C','D'];for(var i=0;i<q.opts.length;i++){h+='<div class="option" onclick="selectAnswer('+i+')"><span class="option-letter">'+L[i]+'</span><span>'+q.opts[i]+'</span></div>';}document.getElementById('optionsEl').innerHTML=h;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;answered=false;}
function selectAnswer(idx){if(answered)return;answered=true;var q=questions[current],opts=document.querySelectorAll('.option');for(var i=0;i<opts.length;i++){opts[i].classList.add('disabled');if(i===q.ans)opts[i].classList.add('correct');else if(i===idx)opts[i].classList.add('incorrect');}var fb=document.getElementById('feedback');if(idx===q.ans){score++;fb.className='feedback correct';fb.textContent='Correct! '+q.exp;}else{fb.className='feedback incorrect';fb.textContent='Incorrect. '+q.exp;}document.getElementById('scoreLabel').textContent='Score: '+score;document.getElementById('nextBtn').disabled=false;if(current===TOTAL-1)document.getElementById('nextBtn').textContent='See Results';}
function nextQuestion(){current++;if(current>=TOTAL){showResults();return;}loadQuestion();}
function showResults(){document.getElementById('questionCard').style.display='none';document.querySelector('.progress-bar-wrap').style.display='none';var r=document.getElementById('resultsCard');r.style.display='block';var pct=Math.round((score/TOTAL)*100);var sb=document.getElementById('finalScore');sb.textContent=score+'/'+TOTAL+' ('+pct+'%)';if(pct>=80)sb.className='score-big';else if(pct>=70)sb.className='score-big mid';else sb.className='score-big low';var msg='';if(pct>=90)msg='Excellent! Strong command of the material.';else if(pct>=70)msg='Good work. You passed. Review missed questions before moving on.';else if(pct>=50)msg='Close. Revisit the slides and try again.';else msg='More study needed. Return to the materials and retake.';document.getElementById('scoreMsg').textContent=msg;if(pct>=70&&typeof ModuleProgress!=='undefined'){ModuleProgress.complete('script','ra-w3-security-quiz',{returnUrl:'../index.html'});}}
function restartQuiz(){current=0;score=0;answered=false;document.getElementById('scoreLabel').textContent='Score: 0';document.getElementById('questionCard').style.display='';document.querySelector('.progress-bar-wrap').style.display='';document.getElementById('resultsCard').style.display='none';document.getElementById('nextBtn').textContent='Next Question';loadQuestion();}
loadQuestion();</script>
</body>
