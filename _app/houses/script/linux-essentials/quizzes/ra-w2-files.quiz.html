    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: File Management &amp; Services | Root Access</title>
    <style>:root{--bg:#0a0a14;--bg-card:#0f1625;--bg-option:#141d2e;--accent:#a78bfa;--accent-dim:rgba(167,139,250,.15);--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--warning:#fbbf24;--border:rgba(255,255,255,.08)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg),#0c0c1a,#120a1e);color:var(--text);min-height:100vh;line-height:1.6}.quiz-container{max-width:800px;margin:0 auto;padding:2rem}.nav-links{display:flex;gap:1.5rem;margin-bottom:1.5rem}.back-link{color:var(--accent);text-decoration:none;font-size:.9rem;transition:all .3s}.back-link:hover{color:#c4b5fd}.quiz-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--accent-dim)}.quiz-header h1{font-size:1.6rem;color:var(--accent);margin-bottom:.5rem}.quiz-header .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}.quiz-header .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem}.quiz-header .meta span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted)}.progress-bar-wrap{background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px}.progress-label{font-size:.85rem;color:var(--text-muted);white-space:nowrap}.progress-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,var(--accent));border-radius:4px;transition:width .4s ease;width:0%}.score-label{font-size:.85rem;color:var(--accent);font-weight:600;white-space:nowrap}.question-card{background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem}.question-num{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.5px;margin-bottom:.75rem}.question-text{font-size:1.15rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5}.question-text code{background:rgba(167,139,250,.1);color:#c4b5fd;padding:2px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:1rem}.code-block{background:#080c18;border:1px solid rgba(167,139,250,.2);border-radius:8px;padding:14px 18px;margin:-.75rem 0 1.25rem;font-family:'Consolas',monospace;font-size:.92rem;color:#c4b5fd;white-space:pre;overflow-x:auto;line-height:1.7}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}.option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem}.option:hover{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.05)}.option.selected{border-color:var(--accent);background:rgba(167,139,250,.08)}.option.correct{border-color:var(--success);background:rgba(34,197,94,.1)}.option.incorrect{border-color:var(--danger);background:rgba(239,68,68,.08)}.option.disabled{pointer-events:none;opacity:.7}.option.correct.disabled,.option.incorrect.disabled{opacity:1}.option-letter{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:.85rem;color:var(--accent);flex-shrink:0}.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}.option.incorrect .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}.feedback{padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:.9rem;line-height:1.6;display:none}.feedback.checking{display:block;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.35);color:#cbd5e1}.feedback.correct{display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);color:#86efac}.feedback.incorrect{display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.quiz-nav{display:flex;justify-content:flex-end}.next-btn{padding:10px 24px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:var(--accent);border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.next-btn:hover{background:var(--accent);color:#fff}.next-btn:disabled{opacity:.3;cursor:not-allowed}.next-btn:disabled:hover{background:rgba(167,139,250,.15);color:var(--accent)}.results-card{display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border)}.results-card h2{color:var(--accent);font-size:1.4rem;margin-bottom:1rem}.score-big{font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:.5rem}.score-big.low{color:var(--danger)}.score-big.mid{color:var(--warning)}.score-msg{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}.results-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.results-btns a,.results-btns button{padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;border:none}.btn-retry{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4)!important;color:var(--accent)}.btn-retry:hover{background:var(--accent);color:#fff}.btn-hub{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4)!important;color:var(--success)}.btn-hub:hover{background:var(--success);color:#fff}@media(max-width:640px){.quiz-container{padding:1rem}.question-card{padding:1.25rem}.quiz-header h1{font-size:1.3rem}}</style>
</head>
<body>
    <div class="quiz-container">
        <div class="nav-links"><a href="../index.html" class="back-link">&#8592; Root Access Hub</a></div>
        <div class="quiz-header">
            <h1>Quiz: File Management &amp; Services</h1>
            <p class="subtitle">File operations, redirection, pipes, grep/sed/awk, links, systemd</p>
            <div class="meta"><span>Week 2</span><span>15 Questions</span><span>Pass: 70%</span><span>CTS2165C</span></div>
        </div>
        <div class="progress-bar-wrap">
            <span class="progress-label" id="progressLabel">Question 1 of 15</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="score-label" id="scoreLabel">Score: 0</span>
        </div>
        <div class="question-card" id="questionCard">
            <div class="question-num" id="questionNum">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsEl"></div>
            <div class="feedback" id="feedback"></div>
            <div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div>
        </div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete</h2>
            <div class="score-big" id="finalScore"></div>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="results-btns">
                <button class="btn-retry" onclick="restartQuiz()">Try Again</button>
                <a href="../index.html" class="btn-hub">Back to Hub</a>
            </div>
        </div>
    </div>
    <script>var questions = [{"q":"Which command finds all .log files in /var modified in the last 24 hours?","opts":["locate /var/*.log","find /var -name \"*.log\" -mtime -1","grep -r \".log\" /var","ls -R /var/*.log"],"exp":"find with -name for pattern matching and -mtime -1 for files modified within the last day. locate is indexed and may be stale."},{"q":"What does the <code>>></code> operator do?","opts":["Overwrite file with output","Append output to file","Redirect stderr","Pipe to next command"],"exp":">> appends stdout to a file without erasing existing content. > overwrites the file. 2> redirects stderr."},{"q":"Which symbol pipes stdout of one command to stdin of the next?","opts":[">",">>","|","&"],"exp":"The pipe symbol | connects the stdout of the left command to the stdin of the right command, enabling command chaining."},{"q":"What does <code>grep -v \"debug\" syslog</code> do?","opts":["Show lines containing debug","Show lines NOT containing debug","Count debug lines","Show verbose output"],"exp":"The -v flag inverts the match, showing only lines that do NOT contain the pattern. Useful for filtering out noise."},{"q":"Which sed command replaces ALL occurrences of \"old\" with \"new\" in a file?","opts":["sed 's/old/new/' file","sed 's/old/new/g' file","sed 'old/new' file","sed -r 'old new' file"],"exp":"The g flag at the end of the substitution makes it global -- replacing all occurrences per line, not just the first."},{"q":"What does <code>awk -F: '{print $1}' /etc/passwd</code> display?","opts":["All usernames","All passwords","All UIDs","All home directories"],"exp":"awk -F: sets the field separator to colon. $1 is the first field in /etc/passwd which is the username."},{"q":"What type of link can cross filesystem boundaries?","opts":["Hard link","Soft (symbolic) link","Both","Neither"],"exp":"Symbolic links point to a path name and can cross filesystems. Hard links share an inode and must be on the same filesystem."},{"q":"What happens if you delete the target of a symbolic link?","opts":["The symlink is deleted too","The symlink becomes a dangling reference","Nothing, data is preserved","The symlink updates automatically"],"exp":"A dangling symlink points to a path that no longer exists. The link itself remains but resolving it produces an error."},{"q":"Which command starts a service AND enables it to start on boot?","opts":["systemctl start svc","systemctl enable svc","systemctl enable --now svc","systemctl restart svc"],"exp":"systemctl enable --now combines enable (boot persistence) and start (immediate) into a single command."},{"q":"What systemd target is equivalent to the old runlevel 3?","opts":["graphical.target","multi-user.target","rescue.target","emergency.target"],"exp":"multi-user.target provides a multi-user CLI environment with networking -- equivalent to SysV runlevel 3."},{"q":"Which section of a systemd unit file specifies the command to run?","opts":["[Unit]","[Service]","[Install]","[Execute]"],"exp":"The [Service] section contains ExecStart, ExecStop, Restart, User, and other execution parameters."},{"q":"What must you run after editing a systemd unit file?","opts":["systemctl restart","systemctl reload","systemctl daemon-reload","reboot"],"exp":"systemctl daemon-reload tells systemd to re-read all unit files. Without this, your changes are not recognized."},{"q":"Which command shows logs for the nginx service since the last boot?","opts":["cat /var/log/nginx.log","journalctl -u nginx -b","dmesg | grep nginx","tail -f /var/log/syslog"],"exp":"journalctl -u nginx filters by unit name, and -b limits to the current boot. This shows all nginx-related journal entries."},{"q":"What does <code>2>/dev/null</code> do?","opts":["Redirects stdout to null","Redirects stderr to null","Discards all output","Logs errors to a file"],"exp":"2 is the file descriptor for stderr. Redirecting it to /dev/null silently discards all error messages."},{"q":"Which command searches the locate database and shows matching paths?","opts":["find","locate","which","whereis"],"exp":"locate searches the mlocate database for file paths matching the pattern. It is much faster than find but may return stale results."}];</script>
    <script>var current=0,score=0,answered=false,TOTAL=questions.length;
function loadQuestion(){var q=questions[current];document.getElementById('questionNum').textContent='QUESTION '+(current+1);document.getElementById('progressLabel').textContent='Question '+(current+1)+' of '+TOTAL;document.getElementById('progressFill').style.width=((current+1)/TOTAL*100)+'%';document.getElementById('questionText').innerHTML=q.q;if(q.code){var b=document.createElement('pre');b.className='code-block';b.textContent=q.code;document.getElementById('questionText').appendChild(b);}var h='',L=['A','B','C','D'];for(var i=0;i<q.opts.length;i++){h+='<div class="option" onclick="selectAnswer('+i+')"><span class="option-letter">'+L[i]+'</span><span>'+q.opts[i]+'</span></div>';}document.getElementById('optionsEl').innerHTML=h;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;answered=false;}
var QUIZ_ID='ra-w2-files-quiz';
        function gradeOne(qIndex, idx) {
            var a = {}; a[qIndex] = idx;
            return FirebaseAuth.callFunction('gradeQuiz', { quizId: QUIZ_ID, answers: a, partial: true })
                .then(function (r) { return !!(r && r.results && r.results[qIndex] && r.results[qIndex].correct); })
                .catch(function () { return null; });
        }
        function selectAnswer(idx){
            if(answered)return; answered=true;
            var q=questions[current],opts=document.querySelectorAll('.option');
            for(var i=0;i<opts.length;i++){opts[i].classList.add('disabled');}
            var fb=document.getElementById('feedback');
            fb.className='feedback checking'; fb.textContent='Checking\u2026';
            gradeOne(current,idx).then(function(correct){
                if(correct===null){opts[idx].classList.add('incorrect');fb.className='feedback incorrect';fb.textContent='Could not verify answer. '+q.exp;}
                else{opts[idx].classList.add(correct?'correct':'incorrect');if(correct){score++;}fb.className='feedback '+(correct?'correct':'incorrect');fb.textContent=(correct?'Correct! ':'Incorrect. ')+q.exp;}
                document.getElementById('scoreLabel').textContent='Score: '+score;
                document.getElementById('nextBtn').disabled=false;
                if(current===TOTAL-1)document.getElementById('nextBtn').textContent='See Results';
            });
        }
function nextQuestion(){current++;if(current>=TOTAL){showResults();return;}loadQuestion();}
function showResults(){document.getElementById('questionCard').style.display='none';document.querySelector('.progress-bar-wrap').style.display='none';var r=document.getElementById('resultsCard');r.style.display='block';var pct=Math.round((score/TOTAL)*100);var sb=document.getElementById('finalScore');sb.textContent=score+'/'+TOTAL+' ('+pct+'%)';if(pct>=80)sb.className='score-big';else if(pct>=70)sb.className='score-big mid';else sb.className='score-big low';var msg='';if(pct>=90)msg='Excellent! Strong command of the material.';else if(pct>=70)msg='Good work. You passed. Review missed questions before moving on.';else if(pct>=50)msg='Close. Revisit the slides and try again.';else msg='More study needed. Return to the materials and retake.';document.getElementById('scoreMsg').textContent=msg;if(pct>=70&&typeof ModuleProgress!=='undefined'){ModuleProgress.complete('script','ra-w2-files-quiz',{returnUrl:'../index.html'});}}
function restartQuiz(){current=0;score=0;answered=false;document.getElementById('scoreLabel').textContent='Score: 0';document.getElementById('questionCard').style.display='';document.querySelector('.progress-bar-wrap').style.display='';document.getElementById('resultsCard').style.display='none';document.getElementById('nextBtn').textContent='Next Question';loadQuestion();}
loadQuestion();</script>
