    <style>:root{--bg:#0a0a14;--bg-card:#0f1625;--bg-option:#141d2e;--accent:#a78bfa;--accent-dim:rgba(167,139,250,.15);--text:#e2e8f0;--text-muted:#8892a8;--success:#22c55e;--danger:#ef4444;--warning:#fbbf24;--border:rgba(255,255,255,.08)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg),#0c0c1a,#120a1e);color:var(--text);min-height:100vh;line-height:1.6}.quiz-container{max-width:820px;margin:0 auto;padding:2rem}.nav-links{display:flex;gap:1.5rem;margin-bottom:1.5rem}.back-link{color:var(--accent);text-decoration:none;font-size:.9rem}.quiz-header{text-align:center;margin-bottom:2rem;padding:2rem;background:var(--bg-card);border-radius:14px;border:1px solid var(--accent-dim)}.quiz-header h1{font-size:1.7rem;color:var(--accent);margin-bottom:.5rem}.quiz-header .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}.quiz-header .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem}.quiz-header .meta span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted)}.status-bar{background:var(--bg-card);border-radius:10px;padding:14px 18px;margin-bottom:1.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:14px}.progress-label{font-size:.85rem;color:var(--text-muted);white-space:nowrap}.progress-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:4px;transition:width .4s;width:0%}.timer-display{font-size:.9rem;font-weight:700;color:var(--accent);white-space:nowrap;font-family:'Consolas',monospace;letter-spacing:1px;min-width:72px;text-align:right}.timer-display.warning{color:var(--warning)}.timer-display.danger{color:var(--danger);animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.question-card{background:var(--bg-card);border-radius:14px;padding:2rem;border:1px solid var(--border);margin-bottom:1.5rem}.question-num{font-size:.8rem;color:var(--text-muted);font-weight:600;letter-spacing:.5px;margin-bottom:.4rem}.question-text{font-size:1.1rem;font-weight:600;margin-bottom:1.5rem;line-height:1.5}.question-text code{background:rgba(167,139,250,.1);color:#c4b5fd;padding:2px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:.95rem}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}.option{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg-option);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.95rem}.option:hover{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.05)}.option.selected{border-color:var(--accent);background:rgba(167,139,250,.08)}.option.correct{border-color:var(--success);background:rgba(34,197,94,.1)}.option.incorrect{border-color:var(--danger);background:rgba(239,68,68,.08)}.option.disabled{pointer-events:none;opacity:.7}.option.correct.disabled,.option.incorrect.disabled{opacity:1}.option-letter{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:700;font-size:.85rem;color:var(--accent);flex-shrink:0}.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}.option.incorrect .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}.feedback{padding:14px 18px;border-radius:10px;margin-bottom:1rem;font-size:.9rem;line-height:1.6;display:none}.feedback.correct{display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);color:#86efac}.feedback.incorrect{display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.quiz-nav{display:flex;justify-content:flex-end}.next-btn{padding:10px 24px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:var(--accent);border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.next-btn:hover{background:var(--accent);color:#fff}.next-btn:disabled{opacity:.3;cursor:not-allowed}.results-card{display:none;text-align:center;background:var(--bg-card);border-radius:14px;padding:3rem 2rem;border:1px solid var(--border)}.results-card h2{color:var(--accent);font-size:1.5rem;margin-bottom:1rem}.score-big{font-size:3.5rem;font-weight:700;color:var(--success);margin-bottom:.5rem}.score-big.low{color:var(--danger)}.score-big.mid{color:var(--warning)}.score-msg{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}.results-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.results-btns a,.results-btns button{padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:all .2s}.btn-retry{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4)!important;color:var(--accent)}.btn-retry:hover{background:var(--accent);color:#fff}.btn-hub{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4)!important;color:var(--success)}.btn-hub:hover{background:var(--success);color:#fff}.time-expired-banner{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:14px 18px;color:#fca5a5;font-size:.9rem;font-weight:600;text-align:center;margin-bottom:1.5rem}@media(max-width:640px){.quiz-container{padding:1rem}.question-card{padding:1.25rem}.quiz-header h1{font-size:1.3rem}}</style>

        <div class="quiz-header"><h1>Final Exam: Weeks 1-4</h1><p class="subtitle">Comprehensive assessment covering all 8 topics across the entire CTS2165C curriculum</p><div class="meta"><span>40 Questions</span><span>75 Minutes</span><span>Pass: 70%</span><span>CTS2165C</span></div></div>

        <div class="status-bar"><span class="progress-label" id="progressLabel">Question 1 of 40</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><span class="timer-display" id="timerDisplay">75:00</span></div>
        <div class="question-card" id="questionCard"><div class="question-num" id="questionNum">QUESTION 1</div><div class="question-text" id="questionText"></div><div class="options" id="optionsEl"></div><div class="feedback" id="feedback"></div><div class="quiz-nav"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button></div></div>
        <div class="results-card" id="resultsCard"><h2>Exam Results</h2><div class="score-big" id="finalScore"></div><p class="score-msg" id="scoreMsg"></p><div class="results-btns"><button class="btn-retry" onclick="restartExam()">Retake Exam</button><a href="../index.html" class="btn-hub">Back to Hub</a></div></div>

    <script>var questions = [{"q":"Which command lists loaded kernel modules?","opts":["modprobe -l","lsmod","insmod -l","modinfo --all"],"ans":1,"exp":"lsmod reads /proc/modules and displays all currently loaded kernel modules."},{"q":"What tool manages network connections on RHEL?","opts":["netplan","ip only","nmcli","ifconfig"],"ans":2,"exp":"nmcli is the NetworkManager CLI tool for persistent network configuration on RHEL/Fedora."},{"q":"Where does Ubuntu store network config?","opts":["/etc/netplan/","//etc/sysconfig/","/etc/network/","/etc/NetworkManager/"],"ans":0,"exp":"Ubuntu uses Netplan YAML files in /etc/netplan/. Apply with netplan apply."},{"q":"What filesystem is default on RHEL?","opts":["ext4","xfs","btrfs","zfs"],"ans":1,"exp":"xfs is the default filesystem on RHEL/CentOS. It excels at large files and parallel I/O."},{"q":"Which LVM command extends a logical volume?","opts":["pvcreate","vgextend","lvextend","resize2fs"],"ans":2,"exp":"lvextend increases the size of a logical volume. Follow with resize2fs (ext4) or xfs_growfs (xfs)."},{"q":"What does blkid show?","opts":["Block device UUIDs and types","Network blocks","Blocked processes","Disk blocks used"],"ans":0,"exp":"blkid displays UUID, filesystem type, and label for block devices. Essential for fstab entries."},{"q":"Which package manager is used on SUSE?","opts":["apt","dnf","zypper","pacman"],"ans":2,"exp":"zypper is the package manager for openSUSE and SUSE Linux Enterprise."},{"q":"What does Snap provide over traditional packages?","opts":["Better performance","Sandboxing and bundled dependencies","Smaller size","Faster install"],"ans":1,"exp":"Snap packages bundle dependencies and run sandboxed, providing isolation and auto-updates."},{"q":"What does sed -i do?","opts":["Interactive mode","Edit file in-place","Ignore case","Insert mode"],"ans":1,"exp":"sed -i modifies the file directly instead of printing to stdout. Without -i, the original is unchanged."},{"q":"Which awk flag sets the field delimiter?","opts":["-d","-F","-t","-s"],"ans":1,"exp":"awk -F: sets colon as the field separator. Default is whitespace."},{"q":"What signal does kill send by default?","opts":["SIGKILL (9)","SIGTERM (15)","SIGHUP (1)","SIGINT (2)"],"ans":1,"exp":"kill without a signal number sends SIGTERM (15), requesting graceful termination."},{"q":"What creates a user with home dir and bash shell?","opts":["useradd -m -s /bin/bash user","adduser user","passwd user","usermod -m user"],"ans":0,"exp":"useradd -m creates home directory, -s sets the login shell to bash."},{"q":"What numeric permission is rwxr-x---?","opts":["750","740","650","751"],"ans":0,"exp":"rwx=7, r-x=5, ---=0. Combined: 750."},{"q":"What does SGID on a directory do?","opts":["Runs files as owner","New files inherit directory group","Prevents deletion","Encrypts contents"],"ans":1,"exp":"SGID on directories makes new files inherit the directory group instead of the creator primary group."},{"q":"Which command sets an ACL?","opts":["chmod","setfacl","chacl","acl-set"],"ans":1,"exp":"setfacl -m u:user:perms file sets ACL entries for fine-grained access control beyond owner/group/other."},{"q":"What sshd_config disables root SSH login?","opts":["DenyRoot yes","PermitRootLogin no","RootAccess false","AllowRoot no"],"ans":1,"exp":"PermitRootLogin no prevents direct root login over SSH."},{"q":"Which MAC system does Ubuntu use?","opts":["SELinux","AppArmor","SMACK","TOMOYO"],"ans":1,"exp":"Ubuntu uses AppArmor (path-based MAC). RHEL uses SELinux (label-based MAC)."},{"q":"What initializes the AIDE database?","opts":["aide --check","aide --init","aide --update","aide --scan"],"ans":1,"exp":"aide --init creates the initial baseline database of file hashes and metadata."},{"q":"Which getenforce output means SELinux logs but does not block?","opts":["Enforcing","Permissive","Disabled","Targeted"],"ans":1,"exp":"Permissive mode logs policy violations without enforcing them. Useful for troubleshooting."},{"q":"What PAM module enforces password complexity?","opts":["pam_unix","pam_pwquality","pam_securetty","pam_limits"],"ans":1,"exp":"pam_pwquality checks password quality: length, character classes, dictionary words."},{"q":"Which journalctl flag follows logs in real time?","opts":["-b","-f","-u","-p"],"ans":1,"exp":"journalctl -f follows the journal output in real time, similar to tail -f."},{"q":"What rsyslog priority is most severe?","opts":["debug","warning","err","emerg"],"ans":3,"exp":"Priority levels from least to most severe: debug, info, notice, warning, err, crit, alert, emerg."},{"q":"Which command rotates log files?","opts":["journalctl --rotate","logrotate","rsyslog --rotate","syslog-rotate"],"ans":1,"exp":"logrotate manages log file rotation based on configs in /etc/logrotate.d/."},{"q":"What iptables flag sets the default chain policy?","opts":["-A","-I","-P","-D"],"ans":2,"exp":"-P sets the chain policy (ACCEPT or DROP). -A appends a rule. -I inserts. -D deletes."},{"q":"Which firewall frontend does Ubuntu use?","opts":["firewalld","iptables directly","ufw","nftables directly"],"ans":2,"exp":"ufw (Uncomplicated Firewall) is Ubuntu default frontend. It generates iptables/nftables rules."},{"q":"What tar flag creates a bzip2 compressed archive?","opts":["-z","-j","-J","-a"],"ans":1,"exp":"tar flags: -z for gzip, -j for bzip2, -J for xz."},{"q":"What does rsync --delete do?","opts":["Removes source files","Mirrors by removing dest files not in source","Deletes the archive","Skips deleted files"],"ans":1,"exp":"--delete removes files from destination that no longer exist in source, creating an exact mirror."},{"q":"Which backup type copies only changes since the last FULL backup?","opts":["Incremental","Differential","Snapshot","Mirror"],"ans":1,"exp":"Differential copies everything changed since the last full backup. Incremental copies changes since any last backup."},{"q":"What does free -h show?","opts":["Disk space","Memory and swap usage","CPU free time","Network bandwidth"],"ans":1,"exp":"free -h shows total, used, free, and available memory plus swap usage in human-readable format."},{"q":"Which command shows CPU info?","opts":["free","lscpu","lsblk","uptime"],"ans":1,"exp":"lscpu displays CPU architecture, cores, threads, cache, and model information."},{"q":"What nice value gives highest priority?","opts":["19","0","-20","100"],"ans":2,"exp":"Nice values: -20 (highest priority) to 19 (lowest). Only root can set negative values."},{"q":"What shows kernel hardware messages?","opts":["journalctl -u kernel","dmesg","sysctl","lshw"],"ans":1,"exp":"dmesg displays the kernel ring buffer containing hardware detection and driver messages."},{"q":"Which process state is a zombie?","opts":["R (running)","S (sleeping)","Z (zombie)","D (uninterruptible)"],"ans":2,"exp":"Z state means the process has exited but its parent has not called wait() to collect the exit status."},{"q":"What command identifies which process uses port 80?","opts":["ps aux | grep 80","lsof -i :80","netstat -80","ss -80"],"ans":1,"exp":"lsof -i :80 shows the process name, PID, and user for any process using port 80."},{"q":"What is the load average threshold for an overloaded system?","opts":["Greater than 1.0","Greater than number of CPU cores","Greater than 100%","Greater than available RAM"],"ans":1,"exp":"If load average exceeds the number of CPU cores, the system has more runnable processes than it can handle."},{"q":"How do you check if an account is locked?","opts":["cat /etc/shadow","passwd -S user","usermod -l user","chage user"],"ans":1,"exp":"passwd -S shows account status: L (locked), NP (no password), P (password set)."},{"q":"What does systemctl status show?","opts":["Only if service is running","Service state, PID, and recent log entries","Only the unit file","CPU usage of the service"],"ans":1,"exp":"systemctl status displays active/inactive state, PID, memory usage, and the most recent journal entries."},{"q":"Which cron expression runs at 6 AM weekdays?","opts":["0 6 * * 1-5","6 0 * * 1-5","0 6 1-5 * *","* 6 * * 1-5"],"ans":0,"exp":"0 6 * * 1-5 = minute 0, hour 6, any day, any month, Monday through Friday."},{"q":"What does umask 077 mean for new files?","opts":["Files: 700","Files: 600","Files: 000","Files: 777"],"ans":1,"exp":"Files default to 666. 666 - 077 = 600 (rw-------). Only the owner can read and write."},{"q":"Which tool scans for security compliance against CIS benchmarks?","opts":["ClamAV","Lynis","OpenSCAP","Nessus"],"ans":2,"exp":"OpenSCAP evaluates systems against SCAP profiles including CIS and DISA STIG benchmarks."}];</script>
    <script>var current=0,score=0,answered=false,TOTAL=40,timerSeconds=75*60,timerInterval=null;
function startTimer(){timerInterval=setInterval(function(){timerSeconds--;updateTimerDisplay();if(timerSeconds<=0){clearInterval(timerInterval);document.getElementById('timeExpiredBanner').style.display='block';current=TOTAL;showResults();}},1000);}
function updateTimerDisplay(){var m=Math.floor(timerSeconds/60),s=timerSeconds%60;var d=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;var el=document.getElementById('timerDisplay');el.textContent=d;if(timerSeconds<=60)el.className='timer-display danger';else if(timerSeconds<=300)el.className='timer-display warning';else el.className='timer-display';}
function loadQuestion(){var q=questions[current];document.getElementById('questionNum').textContent='QUESTION '+(current+1)+' OF '+TOTAL;document.getElementById('questionText').innerHTML=q.q;document.getElementById('progressLabel').textContent='Question '+(current+1)+' of '+TOTAL;document.getElementById('progressFill').style.width=((current+1)/TOTAL*100)+'%';var h='',L=['A','B','C','D'];for(var i=0;i<q.opts.length;i++){h+='<div class="option" onclick="selectAnswer('+i+')"><span class="option-letter">'+L[i]+'</span><span>'+q.opts[i]+'</span></div>';}document.getElementById('optionsEl').innerHTML=h;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;answered=false;}
function selectAnswer(idx){if(answered)return;answered=true;var q=questions[current],opts=document.querySelectorAll('.option');for(var i=0;i<opts.length;i++){opts[i].classList.add('disabled');if(i===q.ans)opts[i].classList.add('correct');else if(i===idx)opts[i].classList.add('incorrect');}var fb=document.getElementById('feedback');if(idx===q.ans){score++;fb.className='feedback correct';fb.textContent='Correct! '+q.exp;}else{fb.className='feedback incorrect';fb.textContent='Incorrect. '+q.exp;}document.getElementById('nextBtn').disabled=false;if(current===TOTAL-1)document.getElementById('nextBtn').textContent='Submit Exam';}
function nextQuestion(){current++;if(current>=TOTAL){if(timerInterval)clearInterval(timerInterval);showResults();return;}loadQuestion();}
function showResults(){document.getElementById('questionCard').style.display='none';var r=document.getElementById('resultsCard');r.style.display='block';var pct=Math.round((score/TOTAL)*100);var sb=document.getElementById('finalScore');sb.textContent=score+'/'+TOTAL+' ('+pct+'%)';if(pct>=80)sb.className='score-big';else if(pct>=70)sb.className='score-big mid';else sb.className='score-big low';var msg='';if(pct>=90)msg='Outstanding performance across all topics.';else if(pct>=80)msg='Excellent work. Strong command of the material.';else if(pct>=70)msg='You passed. Review areas where you scored below 80%.';else if(pct>=60)msg='Just below passing. Review weak areas and retake.';else msg='More study needed. Return to the course materials.';document.getElementById('scoreMsg').textContent=msg;if(pct>=70&&typeof ModuleProgress!=='undefined')ModuleProgress.complete('script','ra-final-exam',{returnUrl:'../index.html'});}
function restartExam(){current=0;score=0;answered=false;timerSeconds=75*60;if(timerInterval)clearInterval(timerInterval);document.getElementById('questionCard').style.display='';document.querySelector('.status-bar').style.display='';document.getElementById('resultsCard').style.display='none';document.getElementById('timeExpiredBanner').style.display='none';document.getElementById('nextBtn').textContent='Next Question';document.getElementById('timerDisplay').className='timer-display';updateTimerDisplay();loadQuestion();startTimer();}
updateTimerDisplay();loadQuestion();startTimer();</script>
</body>
