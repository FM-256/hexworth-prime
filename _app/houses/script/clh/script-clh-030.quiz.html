<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-030 Certification: Shadow Agent Exam - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span>📜</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-030 Certification: Shadow Agent Exam',
            description: 'Comprehensive CLI Skills Assessment',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-030',
            moduleId: 'clh-030',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'You need to find all files modified in the last 24 hours. Which command?',
                    options: [
                        '<code>find / -mtime -1</code>',
                        '<code>locate -mtime 1</code>',
                        '<code>ls -lt --days 1</code>',
                        '<code>search --recent 24h</code>'
                    ],
                    correct: 0,
                    explanation: '<code>find / -mtime -1</code> finds files modified within the last day. Critical for detecting recent activity.'
                },
                {
                    question: 'What does <code>chmod 4755 /usr/bin/myapp</code> set that <code>chmod 755</code> doesn\'t?',
                    options: [
                        'Sticky bit',
                        'SUID bit - runs as owner',
                        'SGID bit - runs as group',
                        'Immutable flag'
                    ],
                    correct: 1,
                    explanation: 'The leading 4 sets SUID, making the program run as its owner (often root). Common persistence mechanism.'
                },
                {
                    question: 'You have sudo access to <code>/usr/bin/less</code>. How do you get a root shell?',
                    options: [
                        '<code>sudo less /etc/shadow</code>',
                        '<code>sudo less /etc/passwd</code> then type <code>!bash</code>',
                        '<code>less --root</code>',
                        'You can\'t - less is safe'
                    ],
                    correct: 1,
                    explanation: 'Less allows shell escape with <code>!</code>. With sudo less, typing <code>!bash</code> spawns a root shell.'
                },
                {
                    question: 'Which command shows established network connections with process names?',
                    options: [
                        '<code>netstat -a</code>',
                        '<code>ss -tunapl</code>',
                        '<code>ifconfig -connections</code>',
                        '<code>ip conn show</code>'
                    ],
                    correct: 1,
                    explanation: '<code>ss -tunapl</code>: TCP/UDP, numeric, all, process, listening. Shows exactly what\'s connected and why.'
                },
                {
                    question: 'You need to compress a directory for exfil. What creates the smallest archive?',
                    options: [
                        '<code>tar -cvf archive.tar dir/</code>',
                        '<code>tar -czvf archive.tar.gz dir/</code>',
                        '<code>zip -r archive.zip dir/</code>',
                        '<code>cp -r dir/ archive/</code>'
                    ],
                    correct: 1,
                    explanation: '<code>tar -czvf</code> creates a gzip-compressed archive. The -z flag adds compression for smaller file size.'
                },
                {
                    question: 'What\'s the FIRST command to run when checking for privilege escalation paths?',
                    options: [
                        '<code>cat /etc/passwd</code>',
                        '<code>sudo -l</code>',
                        '<code>whoami</code>',
                        '<code>id</code>'
                    ],
                    correct: 1,
                    explanation: '<code>sudo -l</code> shows exactly what commands you can run with elevated privileges. First step in privesc recon.'
                },
                {
                    question: 'How do you add user "backdoor" to the sudo group WITHOUT removing other group memberships?',
                    options: [
                        '<code>usermod -G sudo backdoor</code>',
                        '<code>usermod -aG sudo backdoor</code>',
                        '<code>addgroup backdoor sudo</code>',
                        '<code>groupadd backdoor sudo</code>'
                    ],
                    correct: 1,
                    explanation: 'The <code>-a</code> flag is critical - it APPENDS to groups. Without -a, -G replaces all groups!'
                },
                {
                    question: 'In vim, you need to delete the current line and exit without saving. What sequence?',
                    options: [
                        '<code>dd</code> then <code>:wq</code>',
                        '<code>dd</code> then <code>:q!</code>',
                        '<code>:delete</code> then <code>:exit</code>',
                        '<code>Ctrl+D</code> then <code>Ctrl+Q</code>'
                    ],
                    correct: 1,
                    explanation: '<code>dd</code> deletes the line, <code>:q!</code> force-quits without saving. The ! overrides the "unsaved changes" warning.'
                },
                {
                    question: 'Which log file shows SSH login attempts?',
                    options: [
                        '<code>/var/log/syslog</code>',
                        '<code>/var/log/auth.log</code>',
                        '<code>/var/log/ssh.log</code>',
                        '<code>/var/log/messages</code>'
                    ],
                    correct: 1,
                    explanation: '<code>/var/log/auth.log</code> contains all authentication events including SSH logins. Critical for covering tracks.'
                },
                {
                    question: 'You need to clear your command history before disconnecting. What\'s the most thorough approach?',
                    options: [
                        '<code>history -c</code>',
                        '<code>rm ~/.bash_history</code>',
                        '<code>history -c && rm ~/.bash_history && exit</code>',
                        '<code>unset HISTFILE && history -c && rm ~/.bash_history</code>'
                    ],
                    correct: 3,
                    explanation: 'Unsetting HISTFILE prevents new entries, -c clears memory, rm removes the file. Complete OPSEC.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
