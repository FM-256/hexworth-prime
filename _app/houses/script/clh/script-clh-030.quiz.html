<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-030 Certification: Shadow Agent Exam - Hexworth Prime</title>
    <style>
        :root { --house-primary: #a78bfa; --house-secondary: #8b5cf6; --terminal-green: #4ade80; --correct: #22c55e; --incorrect: #ef4444; --gold: #fbbf24; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }
        .quiz-header { padding: 20px 40px; border-bottom: 1px solid rgba(251, 191, 36, 0.3); background: rgba(10, 10, 15, 0.95); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { padding: 8px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #888; text-decoration: none; }
        .progress-bar { width: 200px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--terminal-green)); transition: width 0.5s; }
        .quiz-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .quiz-title { text-align: center; margin-bottom: 40px; }
        .quiz-title h1 { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }
        .quiz-title p { color: #888; }
        .question-card { background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 30px; display: none; }
        .question-card.active { display: block; }
        .question-number { color: var(--gold); font-size: 0.85rem; margin-bottom: 15px; }
        .question-text { font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .question-text code { background: rgba(74, 222, 128, 0.1); color: var(--terminal-green); padding: 2px 8px; border-radius: 4px; font-family: monospace; }
        .options { display: grid; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .option:hover:not(.disabled) { background: rgba(251, 191, 36, 0.1); }
        .option.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--correct); }
        .option.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--incorrect); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option-letter { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--correct); }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--incorrect); }
        .nav-buttons { display: flex; justify-content: flex-end; margin-top: 30px; }
        .nav-btn { padding: 12px 30px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--gold), #ef4444); color: #fff; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.5; }
        .results-card { background: rgba(15, 15, 20, 0.6); border: 2px solid var(--gold); border-radius: 12px; padding: 50px; text-align: center; display: none; }
        .results-card.show { display: block; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--terminal-green)); display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 3rem; font-weight: bold; color: #fff; }
        .results-actions { display: flex; gap: 15px; justify-content: center; }
        .action-btn { padding: 12px 30px; border-radius: 8px; text-decoration: none; }
        .action-btn.primary { background: linear-gradient(135deg, var(--gold), #ef4444); color: #fff; font-weight: bold; }
        .action-btn.secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; }
        .certification-badge { display: inline-block; margin-top: 20px; padding: 15px 30px; background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(239, 68, 68, 0.2)); border: 2px solid var(--gold); border-radius: 8px; }
        .certification-badge h4 { color: var(--gold); margin-bottom: 5px; }
        .certification-badge p { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="quiz-header">
        <a href="script-clh-030-intro.applet.html" class="back-btn">&larr; Back to Briefing</a>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="questionCounter" style="color: #666;">1 / 10</span>
    </header>
    <div class="quiz-container">
        <div class="quiz-title"><h1>SHADOW AGENT CERTIFICATION</h1><p>Comprehensive CLI Skills Assessment</p></div>
        <div id="questionsContainer"></div>
        <div class="results-card" id="resultsCard">
            <div class="score-circle" id="scoreCircle">0%</div>
            <h2 style="color: var(--gold); margin-bottom: 15px;" id="resultsTitle">Certification Complete!</h2>
            <p style="color: #888; margin-bottom: 30px;" id="resultsSubtitle"></p>
            <div class="certification-badge" id="certBadge" style="display:none;">
                <h4>SHADOW AGENT CERTIFIED</h4>
                <p>Full Spectrum Cyber Operations</p>
            </div>
            <div class="results-actions" style="margin-top: 25px;">
                <a href="script-clh-030-intro.applet.html" class="action-btn secondary">Review Briefing</a>
                <a href="../applets/linux/script-clh-030-chimera.applet.html" class="action-btn primary" id="nextModuleBtn">Begin Operation &rarr;</a>
            </div>
        </div>
    </div>
    <script src="../../../components/TrailHunter.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <script>
        const questions = [
            { question: 'You need to find all files modified in the last 24 hours. Which command?', options: ['<code>find / -mtime -1</code>', '<code>locate -mtime 1</code>', '<code>ls -lt --days 1</code>', '<code>search --recent 24h</code>'], correct: 0, feedback: { correct: 'Correct! <code>find / -mtime -1</code> finds files modified within the last day. Critical for detecting recent activity.', incorrect: '<code>find</code> with <code>-mtime -1</code> finds files modified within 1 day. <code>-mmin -60</code> would find files modified within 60 minutes.' } },
            { question: 'What does <code>chmod 4755 /usr/bin/myapp</code> set that <code>chmod 755</code> doesn\'t?', options: ['Sticky bit', 'SUID bit - runs as owner', 'SGID bit - runs as group', 'Immutable flag'], correct: 1, feedback: { correct: 'Correct! The leading 4 sets SUID, making the program run as its owner (often root). Common persistence mechanism.', incorrect: 'The 4 in 4755 sets the SUID bit. Programs with SUID run with owner\'s permissions regardless of who executes them.' } },
            { question: 'You have sudo access to <code>/usr/bin/less</code>. How do you get a root shell?', options: ['<code>sudo less /etc/shadow</code>', '<code>sudo less /etc/passwd</code> then type <code>!bash</code>', '<code>less --root</code>', 'You can\'t - less is safe'], correct: 1, feedback: { correct: 'Correct! Less allows shell escape with <code>!</code>. With sudo less, typing <code>!bash</code> spawns a root shell.', incorrect: 'Less (and many editors/pagers) allow shell escapes. <code>!</code> followed by a command executes it. With sudo, that\'s a root shell.' } },
            { question: 'Which command shows established network connections with process names?', options: ['<code>netstat -a</code>', '<code>ss -tunapl</code>', '<code>ifconfig -connections</code>', '<code>ip conn show</code>'], correct: 1, feedback: { correct: 'Correct! <code>ss -tunapl</code>: TCP/UDP, numeric, all, process, listening. Shows exactly what\'s connected and why.', incorrect: '<code>ss -tunapl</code> is the modern standard. -t TCP, -u UDP, -n numeric, -a all, -p process, -l listening.' } },
            { question: 'You need to compress a directory for exfil. What creates the smallest archive?', options: ['<code>tar -cvf archive.tar dir/</code>', '<code>tar -czvf archive.tar.gz dir/</code>', '<code>zip -r archive.zip dir/</code>', '<code>cp -r dir/ archive/</code>'], correct: 1, feedback: { correct: 'Correct! <code>tar -czvf</code> creates a gzip-compressed archive. The -z flag adds compression for smaller file size.', incorrect: '<code>tar -czvf</code> creates a compressed archive. Without -z, tar just bundles files without compression.' } },
            { question: 'What\'s the FIRST command to run when checking for privilege escalation paths?', options: ['<code>cat /etc/passwd</code>', '<code>sudo -l</code>', '<code>whoami</code>', '<code>id</code>'], correct: 1, feedback: { correct: 'Correct! <code>sudo -l</code> shows exactly what commands you can run with elevated privileges. First step in privesc recon.', incorrect: '<code>sudo -l</code> lists your sudo privileges. Always check this first - you might already have an escalation path.' } },
            { question: 'How do you add user "backdoor" to the sudo group WITHOUT removing other group memberships?', options: ['<code>usermod -G sudo backdoor</code>', '<code>usermod -aG sudo backdoor</code>', '<code>addgroup backdoor sudo</code>', '<code>groupadd backdoor sudo</code>'], correct: 1, feedback: { correct: 'Correct! The <code>-a</code> flag is critical - it APPENDS to groups. Without -a, -G replaces all groups!', incorrect: 'Without <code>-a</code>, <code>usermod -G</code> replaces all supplementary groups. Always use <code>-aG</code> to append.' } },
            { question: 'In vim, you need to delete the current line and exit without saving. What sequence?', options: ['<code>dd</code> then <code>:wq</code>', '<code>dd</code> then <code>:q!</code>', '<code>:delete</code> then <code>:exit</code>', '<code>Ctrl+D</code> then <code>Ctrl+Q</code>'], correct: 1, feedback: { correct: 'Correct! <code>dd</code> deletes the line, <code>:q!</code> force-quits without saving. The ! overrides the "unsaved changes" warning.', incorrect: '<code>dd</code> deletes a line in Normal mode. <code>:q!</code> quits without saving. <code>:wq</code> would save the deletion.' } },
            { question: 'Which log file shows SSH login attempts?', options: ['<code>/var/log/syslog</code>', '<code>/var/log/auth.log</code>', '<code>/var/log/ssh.log</code>', '<code>/var/log/messages</code>'], correct: 1, feedback: { correct: 'Correct! <code>/var/log/auth.log</code> contains all authentication events including SSH logins. Critical for covering tracks.', incorrect: '<code>/var/log/auth.log</code> logs all authentication events. Always check (and potentially clean) this after operations.' } },
            { question: 'You need to clear your command history before disconnecting. What\'s the most thorough approach?', options: ['<code>history -c</code>', '<code>rm ~/.bash_history</code>', '<code>history -c && rm ~/.bash_history && exit</code>', '<code>unset HISTFILE && history -c && rm ~/.bash_history</code>'], correct: 3, feedback: { correct: 'Correct! Unsetting HISTFILE prevents new entries, -c clears memory, rm removes the file. Complete OPSEC.', incorrect: '<code>unset HISTFILE</code> prevents saving on exit. <code>history -c</code> clears memory. <code>rm</code> removes the file. All three for complete cleanup.' } }
        ];
        let currentQuestion = 0, score = 0, answered = new Array(questions.length).fill(false);
        function initQuiz() {
            const c = document.getElementById('questionsContainer');
            questions.forEach((q, i) => { c.innerHTML += `<div class="question-card" id="q${i}"><div class="question-number">QUESTION ${i+1} OF ${questions.length}</div><div class="question-text">${q.question}</div><div class="options">${q.options.map((o,j)=>`<div class="option" onclick="select(${i},${j})"><span class="option-letter">${['A','B','C','D'][j]}</span><span>${o}</span></div>`).join('')}</div><div class="feedback" id="f${i}"></div><div class="nav-buttons"><button class="nav-btn" id="n${i}" onclick="next()" disabled>${i===questions.length-1?'Complete Exam':'Next &rarr;'}</button></div></div>`; });
            show(0);
        }
        function show(i) { document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active')); document.getElementById(`q${i}`).classList.add('active'); document.getElementById('progressFill').style.width=`${((i+1)/questions.length)*100}%`; document.getElementById('questionCounter').textContent=`${i+1} / ${questions.length}`; }
        function select(qi, oi) { if(answered[qi]) return; answered[qi]=true; const q=questions[qi], opts=document.querySelectorAll(`#q${qi} .option`), fb=document.getElementById(`f${qi}`); opts.forEach((o,i)=>{ o.classList.add('disabled'); if(i===q.correct) o.classList.add('correct'); else if(i===oi) o.classList.add('incorrect'); }); if(oi===q.correct) { score++; fb.className='feedback show correct'; fb.innerHTML=`&#10003; ${q.feedback.correct}`; } else { fb.className='feedback show incorrect'; fb.innerHTML=`&#10007; ${q.feedback.incorrect}`; } document.getElementById(`n${qi}`).disabled=false; }
        function next() { if(currentQuestion<questions.length-1) { currentQuestion++; show(currentQuestion); } else { results(); } }
        function results() { document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active')); document.getElementById('resultsCard').classList.add('show'); const pct=Math.round((score/questions.length)*100); document.getElementById('scoreCircle').textContent=`${pct}%`; document.getElementById('resultsSubtitle').textContent=`You scored ${score} out of ${questions.length}`; if(pct>=80) { document.getElementById('resultsTitle').textContent='CERTIFICATION ACHIEVED'; document.getElementById('certBadge').style.display='inline-block'; if(typeof ModuleProgress!=='undefined') ModuleProgress.completeQuiz('script','clh-030-quiz',pct,{returnToDashboard:false}); } else if(pct>=60) { document.getElementById('resultsTitle').textContent='Almost There!'; document.getElementById('resultsSubtitle').textContent+='. 80% required for certification.'; } else { document.getElementById('resultsTitle').textContent='More Training Needed'; document.getElementById('nextModuleBtn').textContent='Retry Exam'; document.getElementById('nextModuleBtn').href='script-clh-030.quiz.html'; } }
        initQuiz();
    </script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
