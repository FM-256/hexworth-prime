            border-bottom: 1px solid rgba(167, 139, 250, 0.2);

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-010 Quiz: Log Forensics',
            description: 'Prove your log analysis skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-010',
            moduleId: 'clh-010',
            houseId: 'script',
            nextModule: { title: 'CLH-011: Network Reconnaissance', href: 'clh/script-clh-011-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which Linux log file contains SSH authentication events?',
                    options: [
                        '<code>/var/log/messages</code>',
                        '<code>/var/log/auth.log</code> or <code>/var/log/secure</code>',
                        '<code>/var/log/kern.log</code>',
                        '<code>/var/log/syslog</code>'
                    ],
                    correct: 1,
                    explanation: 'Authentication events including SSH logins are logged to auth.log (Debian/Ubuntu) or secure (RHEL/CentOS).'
                },
                {
                    question: 'Given this log line:<div class="log-sample">Jun 11 09:45:45 combo sshd[6472]: authentication failure; rhost=unknown.sagonet.net user=root</div>What is the "rhost" field?',
                    options: [
                        'The local hostname',
                        'The remote host that attempted to connect',
                        'The target user\'s home directory',
                        'The SSH port number'
                    ],
                    correct: 1,
                    explanation: '"rhost" means remote host - the IP or hostname of the system attempting to connect. This is critical for identifying attackers.'
                },
                {
                    question: 'Which command counts how many times "authentication failure" appears in a log file?',
                    options: [
                        '<code>grep "authentication failure" log.txt</code>',
                        '<code>grep -c "authentication failure" log.txt</code>',
                        '<code>grep -v "authentication failure" log.txt</code>',
                        '<code>grep -n "authentication failure" log.txt</code>'
                    ],
                    correct: 1,
                    explanation: 'The -c flag counts matching lines instead of printing them. Essential for quick attack assessment.'
                },
                {
                    question: 'To find the most common attacking IP addresses in auth.log, which command pattern is most effective?',
                    options: [
                        '<code>grep "failure" auth.log</code>',
                        '<code>grep "failure" auth.log | sort | head</code>',
                        '<code>grep "failure" auth.log | awk \'{print $X}\' | sort | uniq -c | sort -rn</code>',
                        '<code>cat auth.log | less</code>'
                    ],
                    correct: 2,
                    explanation: 'This pipeline extracts the IP field, sorts, counts unique values, and sorts by frequency. The classic forensic frequency analysis technique.'
                },
                {
                    question: 'If you see 500+ authentication failures from one IP within minutes, what type of attack is this?',
                    options: [
                        'SQL Injection',
                        'Cross-Site Scripting (XSS)',
                        'Brute Force Attack',
                        'Man-in-the-Middle'
                    ],
                    correct: 2,
                    explanation: 'Rapid repeated authentication failures from one source is the signature of a brute force attack - trying many passwords to guess credentials.'
                },
                {
                    question: 'What does an IOC (Indicator of Compromise) include?',
                    options: [
                        'Only malware file names',
                        'IP addresses, domains, file hashes, and other attack signatures',
                        'Only user passwords',
                        'Server CPU temperature'
                    ],
                    correct: 1,
                    explanation: 'IOCs include IPs, domains, file hashes, registry keys, and behavioral patterns that indicate a system has been compromised.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
