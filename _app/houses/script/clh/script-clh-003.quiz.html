<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-003 Quiz: Pattern Hunting - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-003 Quiz: Pattern Hunting',
            description: 'Test your grep and pattern matching skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-003',
            moduleId: 'clh-003',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-004: Process Management', href: 'clh/script-clh-004-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>grep -i "error" logfile.txt</code> do?',
                    options: [
                        'Searches for "error" only in lowercase',
                        'Searches for "error" case-insensitively (matches ERROR, Error, error)',
                        'Inverts the search to show lines without "error"',
                        'Counts the number of lines containing "error"'
                    ]
                },
                {
                    question: 'Which grep flag shows the line numbers of matching lines?',
                    options: [
                        '<code>-c</code>',
                        '<code>-n</code>',
                        '<code>-l</code>',
                        '<code>-v</code>'
                    ]
                },
                {
                    question: 'What does <code>grep -v "DEBUG" app.log</code> display?',
                    options: [
                        'Only lines containing "DEBUG"',
                        'A count of lines with "DEBUG"',
                        'All lines that do NOT contain "DEBUG"',
                        'The first line containing "DEBUG"'
                    ]
                },
                {
                    question: 'How would you search for the word "password" in all files inside a directory?',
                    options: [
                        '<code>grep "password" *</code>',
                        '<code>grep -r "password" directory/</code>',
                        '<code>grep -c "password" directory/</code>',
                        '<code>grep -l "password" file.txt</code>'
                    ]
                },
                {
                    question: 'What does <code>grep -c "failed" auth.log</code> output?',
                    options: [
                        'All lines containing "failed"',
                        'The number of lines that contain "failed"',
                        'The first line containing "failed"',
                        'The filenames containing "failed"'
                    ]
                },
                {
                    question: 'Which command chains grep to search for lines containing both "POST" and "admin"?',
                    options: [
                        '<code>grep "POST admin" access.log</code>',
                        '<code>grep "POST" access.log | grep "admin"</code>',
                        '<code>grep -v "POST" "admin" access.log</code>',
                        '<code>grep -c "POST" "admin" access.log</code>'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
