<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-020 Quiz: User Reconnaissance - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span>📜</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-020 Quiz: User Reconnaissance',
            description: 'Test your user tracking skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-020',
            moduleId: 'clh-020',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'Which command shows your UID, GID, and all group memberships?',
                    options: [
                        '<code>whoami</code>',
                        '<code>id</code>',
                        '<code>groups</code>',
                        '<code>who</code>'
                    ],
                    correct: 1,
                    explanation: '<code>id</code> shows the complete identity: UID, GID, and all supplementary groups.'
                },
                {
                    question: 'You need to see who is CURRENTLY logged in and what they\'re doing. Which command?',
                    options: [
                        '<code>last</code>',
                        '<code>lastlog</code>',
                        '<code>w</code>',
                        '<code>id</code>'
                    ],
                    correct: 2,
                    explanation: '<code>w</code> shows current sessions with login time, idle time, and current command.'
                },
                {
                    question: 'A user in the <code>docker</code> group is a security concern because:',
                    options: [
                        'Docker uses too much CPU',
                        'They can potentially escape to root',
                        'Docker is deprecated',
                        'They can see all processes'
                    ],
                    correct: 1,
                    explanation: 'Docker group members can mount the host filesystem and escape to root access. Major privilege escalation risk.'
                },
                {
                    question: 'Find all users who have NEVER logged in (potential backdoor accounts):',
                    options: [
                        '<code>last | grep "Never"</code>',
                        '<code>lastlog | grep "Never"</code>',
                        '<code>who | grep "Never"</code>',
                        '<code>w | grep "Never"</code>'
                    ],
                    correct: 1,
                    explanation: '<code>lastlog</code> shows last login for ALL users, marking those who never logged in with "Never logged in".'
                },
                {
                    question: 'An attacker logged in from 192.168.1.99 at 03:47. How do you find their session history?',
                    options: [
                        '<code>who 192.168.1.99</code>',
                        '<code>last | grep 192.168.1.99</code>',
                        '<code>id 192.168.1.99</code>',
                        '<code>groups 192.168.1.99</code>'
                    ],
                    correct: 1,
                    explanation: '<code>last</code> shows login history and can be grepped for specific IPs to trace attacker sessions.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
