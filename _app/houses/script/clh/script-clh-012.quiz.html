<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-012 Quiz: Network Basics',
            description: 'Test your knowledge of network reconnaissance commands: ping, ss, ip, traceroute, and dig.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-012',
            moduleId: 'clh-012',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-013: Incident Response', href: 'script-clh-013-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>ping -c 4 10.0.0.5</code> do?',
                    options: [
                        'Pings the host continuously until stopped',
                        'Sends exactly 4 ICMP echo requests then stops',
                        'Pings 4 different hosts at once',
                        'Sets the packet size to 4 bytes'
                    ]
                },
                {
                    question: 'Which command shows listening TCP and UDP ports with numeric addresses?',
                    options: [
                        '<code>ip addr</code>',
                        '<code>ss -tuln</code>',
                        '<code>traceroute -n</code>',
                        '<code>dig -t ANY</code>'
                    ]
                },
                {
                    question: 'What does <code>ss -tp</code> show that makes it valuable during incident response?',
                    options: [
                        'DNS cache entries',
                        'Routing table hops',
                        'TCP connections with the process name holding each connection',
                        'Open UDP ports only'
                    ]
                },
                {
                    question: 'What does <code>traceroute</code> reveal about a target host?',
                    options: [
                        'Open ports on the target',
                        'The path (each hop) packets take to reach the host',
                        'The MAC address of the target',
                        'DNS records for the target domain'
                    ]
                },
                {
                    question: 'Which command queries DNS records for a domain?',
                    options: [
                        '<code>ping domain</code>',
                        '<code>ip route domain</code>',
                        '<code>dig domain</code>',
                        '<code>ss -tuln domain</code>'
                    ]
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────

</body>
