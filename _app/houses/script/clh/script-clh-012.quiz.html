<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-012 Quiz: Web Enumeration - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span>📜</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-012 Quiz: Web Enumeration',
            description: 'Test your knowledge: CLH-012 Quiz: Web Enumeration',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-012',
            moduleId: 'clh-012',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'Which curl flag shows only the response headers?',
                    options: [
                        '<code>curl -v</code>',
                        '<code>curl -I</code>',
                        '<code>curl -H</code>',
                        '<code>curl -i</code>'
                    ],
                    correct: 1,
                    explanation: '-I (HEAD request) returns only headers. Great for quick server fingerprinting.'
                },
                {
                    question: 'HTTP 403 response means:',
                    options: [
                        'Page not found',
                        'Server error',
                        'Access forbidden (but exists)',
                        'Redirect'
                    ],
                    correct: 2,
                    explanation: '403 means the resource EXISTS but you don\'t have permission. Interesting for further testing!'
                },
                {
                    question: 'Which file often reveals hidden directories a site wants to hide from search engines?',
                    options: [
                        '<code>sitemap.xml</code>',
                        '<code>robots.txt</code>',
                        '<code>.htaccess</code>',
                        '<code>index.html</code>'
                    ],
                    correct: 1,
                    explanation: 'robots.txt lists paths to hide from crawlers - which makes it a roadmap for pentesters!'
                },
                {
                    question: 'What does <code>curl -L</code> do?',
                    options: [
                        'List directory contents',
                        'Follow redirects',
                        'Enable logging',
                        'Limit bandwidth'
                    ],
                    correct: 1,
                    explanation: '-L follows HTTP redirects (301, 302) to the final destination automatically.'
                },
                {
                    question: 'Finding an exposed <code>/.git/</code> directory means:',
                    options: [
                        'The site uses version control',
                        'Source code may be downloadable',
                        'Both A and B',
                        'The site is secure'
                    ],
                    correct: 2,
                    explanation: 'Exposed .git directories can leak entire source code history including credentials and secrets!'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
