        <a href="../index.html">&larr; Back to Script House</a>

    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-006 Quiz: File Operations',
            description: 'Test your file operation skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-006',
            moduleId: 'clh-006',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-007: Permissions & Access Control', href: 'clh/script-clh-007-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>mkdir -p projects/src/utils</code> do?',
                    options: [
                        'Creates only the <code>utils</code> directory',
                        'Creates the entire nested directory path, including any missing parent directories',
                        'Fails if <code>projects</code> does not already exist',
                        'Creates the directories with special permissions'
                    ],explanation: 'The -p flag creates parent directories as needed. Without -p, mkdir fails if the parent path does not exist.'
                },
                {
                    question: 'What is the difference between <code>cp</code> and <code>mv</code>?',
                    options: [
                        'cp moves files, mv copies files',
                        'cp duplicates the file (original stays), mv relocates it (original is gone)',
                        'They are identical commands with different names',
                        'cp works on directories, mv works only on files'
                    ],explanation: 'cp creates a duplicate at the destination while keeping the original. mv transfers the file -- the original no longer exists at the old location.'
                },
                {
                    question: 'Which flag is required to copy a directory and all its contents?',
                    options: [
                        '<code>cp -f dir/ backup/</code>',
                        '<code>cp -a dir/ backup/</code>',
                        '<code>cp -r dir/ backup/</code>',
                        '<code>cp -d dir/ backup/</code>'
                    ],explanation: 'The -r (recursive) flag tells cp to copy the directory and everything inside it. Without -r, cp refuses to copy directories.'
                },
                {
                    question: 'How does a symbolic link differ from a hard link?',
                    options: [
                        'Symbolic links are faster than hard links',
                        'Hard links can span different filesystems, symbolic links cannot',
                        'A symbolic link points to a file path and breaks if the target is deleted; a hard link points to the inode and survives deletion of the original name',
                        'There is no difference -- they are the same thing'
                    ],explanation: 'A symlink (ln -s) is a pointer to a path -- if the target file is removed, the symlink becomes a dangling reference. A hard link shares the same inode, so the data persists as long as any hard link to it exists.'
                },
                {
                    question: 'Why is <code>rm -rf /</code> considered extremely dangerous?',
                    options: [
                        'It renames the root directory',
                        'It recursively and forcefully deletes every file on the system with no confirmation',
                        'It only removes empty directories',
                        'It moves all files to a temporary recycle bin'
                    ],explanation: 'rm -r (recursive) -f (force, no prompts) starting at / means every file and directory on the system is permanently deleted. Linux has no recycle bin -- rm is final.'
                }
            ]
        });
        quiz.start();
    </script>
