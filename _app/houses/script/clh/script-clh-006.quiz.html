<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-006 Quiz: Permissions',
            description: 'Test your knowledge: CLH-006 Quiz: Permissions',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-006',
            moduleId: 'clh-006',
            houseId: 'script',
            nextModule: { title: 'CLH-007: Shell Scripting Basics', href: 'clh/script-clh-007-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>chmod 755</code> mean?',
                    options: [
                        'rwxr-xr-x',
                        'rwxrwxrwx',
                        'rw-r--r--',
                        'r-xr-xr-x'
                    ],
                    correct: 0,
                    explanation: '7=rwx, 5=r-x, 5=r-x. Owner has full, group/others can read and execute.'
                },
                {
                    question: 'Which permission lets you enter a directory?',
                    options: [
                        'Read (r)',
                        'Write (w)',
                        'Execute (x)',
                        'All of them'
                    ],
                    correct: 2,
                    explanation: 'Execute (x) on a directory means you can cd into it and access files inside.'
                },
                {
                    question: 'What does SUID (Set User ID) do?',
                    options: [
                        'Sets file as directory',
                        'Runs program as file owner',
                        'Prevents file deletion',
                        'Encrypts the file'
                    ],
                    correct: 1,
                    explanation: 'SUID makes a program run with the owner\'s privileges, not the caller\'s. Major privesc target!'
                },
                {
                    question: 'Find SUID files with:',
                    options: [
                        '<code>ls -la</code>',
                        '<code>find / -perm -4000</code>',
                        '<code>grep suid /etc</code>',
                        '<code>chmod -s</code>'
                    ],
                    correct: 1,
                    explanation: '-perm -4000 finds files with the SUID bit (4000) set. Essential for privilege escalation recon.'
                },
                {
                    question: 'What\'s wrong with <code>chmod 777</code>?',
                    options: [
                        'It\'s too restrictive',
                        'Everyone can read, write, and execute',
                        'It removes all permissions',
                        'It only works on directories'
                    ],
                    correct: 1,
                    explanation: '777 = rwxrwxrwx - anyone can do anything. Never use on scripts, configs, or sensitive files!'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
