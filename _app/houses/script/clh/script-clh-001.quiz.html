<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-001 Quiz: CLI Basics - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-001 Quiz: CLI Basics',
            description: 'Test your understanding of the hacker CLI mindset',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-001',
            moduleId: 'clh-001',
            houseId: 'script',
            nextModule: { title: 'CLH-002: Navigation & Reconnaissance', href: 'clh/script-clh-002-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What command shows your current username?',
                    options: [
                        'pwd',
                        'whoami',
                        'id',
                        'user'
                    ],
                    correct: 1,
                    explanation: '"whoami" displays the current username. This is essential for understanding your privileges.'
                },
                {
                    question: 'What does "pwd" stand for?',
                    options: [
                        'Password',
                        'Print Working Directory',
                        'Path of Working Data',
                        'Present Work Directory'
                    ],
                    correct: 1,
                    explanation: 'PWD = Print Working Directory. It shows your current location in the filesystem.'
                },
                {
                    question: 'In <code>ls -la</code>, what does the "-a" flag do?',
                    options: [
                        'Shows all details',
                        'Shows hidden files',
                        'Sorts alphabetically',
                        'Shows archive files'
                    ],
                    correct: 1,
                    explanation: 'The -a flag shows ALL files, including hidden ones (those starting with a dot).'
                },
                {
                    question: 'Why is CLI preferred over GUI for security work?',
                    options: [
                        'GUIs are too colorful',
                        'CLI allows automation, precision, and handles large-scale operations',
                        'GUIs are not available on servers',
                        'CLI looks more professional'
                    ],
                    correct: 1,
                    explanation: 'CLI enables automation through scripting, provides precise control, and can process thousands of files in seconds.'
                },
                {
                    question: 'Which mindset principle is central to the "Command Line Hacker" approach?',
                    options: [
                        'Follow procedures exactly as documented',
                        'Investigate and ask "what if?" rather than just following steps',
                        'Avoid automation to prevent errors',
                        'Use GUI when possible for accuracy'
                    ],
                    correct: 1,
                    explanation: 'The hacker mindset prioritizes curiosity and investigation over blind procedure-following.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
