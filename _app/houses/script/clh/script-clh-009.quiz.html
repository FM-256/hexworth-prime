    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-009 Quiz: Text Processing',
            description: 'Test your knowledge of cut, sort, uniq, awk, sed, and tr',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-009',
            moduleId: 'clh-009',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-010: I/O Redirection', href: 'script-clh-010-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command extracts the first field from a colon-delimited file?',
                    options: [
                        '<code>cut -f 1 file</code>',
                        '<code>cut -d \':\' -f 1 file</code>',
                        '<code>awk -f 1 file</code>',
                        '<code>sed -f 1 file</code>'
                    ]
                },
                {
                    question: 'What does <code>sort -rn</code> do?',
                    options: [
                        'Sorts alphabetically in reverse',
                        'Sorts numerically in reverse (largest first)',
                        'Removes duplicate lines and sorts',
                        'Sorts by the rightmost column'
                    ]
                },
                {
                    question: 'Why must you sort data before piping it to <code>uniq</code>?',
                    options: [
                        'uniq only works on sorted file formats',
                        'uniq only removes adjacent duplicate lines, so duplicates must be next to each other',
                        'uniq crashes on unsorted input',
                        'Sorting makes uniq run faster'
                    ]
                },
                {
                    question: 'What does <code>awk \'{print $3}\' access.log</code> output?',
                    options: [
                        'The first 3 lines of the file',
                        'Every third character on each line',
                        'The third whitespace-delimited field from each line',
                        'Lines containing the number 3'
                    ]
                },
                {
                    question: 'Which <code>sed</code> command replaces ALL occurrences of "http" with "https" in a file?',
                    options: [
                        '<code>sed \'s/http/https/\' file</code>',
                        '<code>sed \'s/http/https/g\' file</code>',
                        '<code>sed \'r/http/https/\' file</code>',
                        '<code>sed \'replace http https\' file</code>'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
