        .page-header a {

        .page-header a:hover { color: #c4b5fd; }

<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-005 Quiz: Log Analysis',
            description: 'Test your log analysis skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-005',
            moduleId: 'clh-005',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-006: File Operations', href: 'script-clh-006-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command views logs for a specific systemd service?',
                    options: [
                        '<code>cat /var/log/service</code>',
                        '<code>journalctl -u sshd</code>',
                        '<code>log --service sshd</code>',
                        '<code>systemctl log sshd</code>'
                    ]
                },
                {
                    question: 'What does <code>tail -f /var/log/syslog</code> do?',
                    options: [
                        'Shows the first 10 lines of syslog',
                        'Deletes old entries from syslog',
                        'Follows the log file in real time, showing new lines as they appear',
                        'Filters syslog for error messages only'
                    ]
                },
                {
                    question: 'Which journalctl flag filters logs by priority level (e.g., errors only)?',
                    options: [
                        '<code>-l</code>',
                        '<code>-p err</code>',
                        '<code>--errors</code>',
                        '<code>-f</code>'
                    ]
                },
                {
                    question: 'Where are traditional authentication logs stored on Debian/Ubuntu systems?',
                    options: [
                        '<code>/var/log/auth.log</code>',
                        '<code>/etc/auth/log</code>',
                        '<code>/var/log/login.log</code>',
                        '<code>/tmp/auth.log</code>'
                    ]
                },
                {
                    question: 'What does <code>grep -c "Failed" /var/log/auth.log</code> return?',
                    options: [
                        'All lines containing "Failed" with color highlighting',
                        'The first line containing "Failed"',
                        'A count of how many lines match "Failed"',
                        'The context (surrounding lines) of each "Failed" match'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
