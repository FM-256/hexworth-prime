<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-005 Quiz: Process Investigation',
            description: 'Test your process hunting skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-005',
            moduleId: 'clh-005',
            houseId: 'script',
            nextModule: { title: 'CLH-006: Permissions & Access Control', href: 'clh/script-clh-006-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command shows all running processes with CPU and memory usage?',
                    options: [
                        '<code>ls -la</code>',
                        '<code>ps aux</code>',
                        '<code>top -n 1</code>',
                        '<code>cat /proc</code>'
                    ],
                    correct: 1,
                    explanation: 'ps aux shows all processes (a), for all users (u), with extended info (x) including CPU and memory.'
                },
                {
                    question: 'What is a red flag when examining a process list?',
                    options: [
                        'Process running as www-data',
                        'Firefox using 2% CPU',
                        'Unknown process with high CPU from /tmp',
                        'systemd as PID 1'
                    ],
                    correct: 2,
                    explanation: 'Unknown processes, especially from /tmp or with high resource usage, are major red flags indicating potential malware.'
                },
                {
                    question: 'Which command forcefully terminates a process?',
                    options: [
                        '<code>stop [PID]</code>',
                        '<code>end [PID]</code>',
                        '<code>kill -9 [PID]</code>',
                        '<code>terminate [PID]</code>'
                    ],
                    correct: 2,
                    explanation: 'kill -9 sends SIGKILL, which forcefully terminates a process immediately without cleanup.'
                },
                {
                    question: 'What does <code>lsof -p [PID]</code> show?',
                    options: [
                        'Process memory usage',
                        'Files opened by that process',
                        'Network connections only',
                        'Process start time'
                    ],
                    correct: 1,
                    explanation: 'lsof (list open files) shows all files, sockets, and resources a process has open - essential for understanding what it\'s doing.'
                },
                {
                    question: 'A crypto miner on a compromised system would likely show:',
                    options: [
                        'Low CPU, low memory',
                        'High CPU usage, unknown process name',
                        'Normal network traffic only',
                        'No visible processes'
                    ],
                    correct: 1,
                    explanation: 'Crypto miners consume massive CPU resources and often have generic or obfuscated names to avoid detection.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
