        * { margin: 0; padding: 0; box-sizing: border-box; }

            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);

        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;

            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-021 Quiz: SSH Operations',
            description: 'Test your secure tunnel skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-021',
            moduleId: 'clh-021',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-022: Network Reconnaissance', href: 'script-clh-022-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which key algorithm is most secure and recommended for modern operations?',
                    options: [
                        '<code>RSA 1024-bit</code>',
                        '<code>DSA</code>',
                        '<code>Ed25519</code>',
                        '<code>ECDSA 256</code>'
                    ]
                },
                {
                    question: 'What does <code>ssh-copy-id user@host</code> do?',
                    options: [
                        'Copies SSH binary to remote host',
                        'Installs your public key in remote authorized_keys',
                        'Generates a new key pair',
                        'Copies remote keys to local machine'
                    ]
                },
                {
                    question: 'You need to transfer a directory of intel files securely. Which command?',
                    options: [
                        '<code>cp -r intel/ user@host:</code>',
                        '<code>scp -r intel/ user@host:</code>',
                        '<code>ssh cp intel/ user@host:</code>',
                        '<code>ftp intel/ user@host:</code>'
                    ]
                },
                {
                    question: 'Why should you ALWAYS set a passphrase on your SSH private key?',
                    options: [
                        'SSH requires it',
                        'It makes connections faster',
                        'It protects the key if the file is compromised',
                        'Passphrases are optional decorations'
                    ]
                },
                {
                    question: 'What is the purpose of <code>ssh -D 9050 user@proxy</code>?',
                    options: [
                        'Download files on port 9050',
                        'Create a SOCKS proxy for tunneling traffic',
                        'Delete files on port 9050',
                        'Direct connection bypassing encryption'
                    ]
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────

    <hex-ai-button mission-id="script-clh-021" house="script"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
