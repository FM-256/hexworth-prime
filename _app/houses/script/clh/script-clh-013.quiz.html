<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-013 Quiz: Environment Variables',
            description: 'Test your knowledge: CLH-013 Quiz: Environment Variables',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-013',
            moduleId: 'clh-013',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-014: Process Control', href: 'script-clh-014-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the difference between a shell variable and an environment variable?',
                    options: [
                        'Shell variables use uppercase, environment variables use lowercase',
                        'Shell variables are local to the session; environment variables are inherited by child processes',
                        'There is no difference -- they are the same thing',
                        'Environment variables are read-only; shell variables are writable'
                    ]
                },
                {
                    question: 'An attacker prepends <code>/tmp/evil</code> to $PATH. What is the impact?',
                    options: [
                        'Commands in /tmp/evil will run instead of system commands',
                        'The system will crash on next reboot',
                        'Only root-owned commands are affected',
                        'No impact -- $PATH only reads from /usr/bin'
                    ]
                },
                {
                    question: 'Which file is executed for interactive non-login bash shells?',
                    options: [
                        '<code>/etc/profile</code>',
                        '<code>~/.bash_profile</code>',
                        '<code>~/.bashrc</code>',
                        '<code>/etc/environment</code>'
                    ]
                },
                {
                    question: 'Why is storing API keys in environment variables a security risk?',
                    options: [
                        'Environment variables are encrypted and hard to read',
                        'They can leak through process listings, crash dumps, and child processes',
                        'Only root can read environment variables',
                        'Environment variables are cleared on every command execution'
                    ]
                },
                {
                    question: 'What does the <code>unset</code> command do?',
                    options: [
                        'Resets a variable to its default value',
                        'Exports a variable to child processes',
                        'Removes a variable from the environment entirely',
                        'Locks a variable so it cannot be changed'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
