<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-013 Quiz: Incident Response - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-013 Quiz: Incident Response',
            description: 'Test your knowledge: CLH-013 Quiz: Incident Response',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-013',
            moduleId: 'clh-013',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the correct order of volatility for evidence collection?',
                    options: [
                        'Disk → Memory → Network',
                        'Memory → Network → Disk',
                        'Network → Disk → Memory',
                        'Disk → Network → Memory'
                    ],
                    correct: 1,
                    explanation: 'Memory is most volatile (lost on reboot), then network state, then disk. Collect in that order!'
                },
                {
                    question: 'What comes AFTER containment in the IR lifecycle?',
                    options: [
                        'Identification',
                        'Preparation',
                        'Eradication',
                        'Recovery'
                    ],
                    correct: 2,
                    explanation: 'After containing the threat, you eradicate it completely before moving to recovery.'
                },
                {
                    question: 'Why do we hash collected evidence?',
                    options: [
                        'To compress it',
                        'To encrypt it',
                        'To prove integrity/no tampering',
                        'To make it readable'
                    ],
                    correct: 2,
                    explanation: 'Cryptographic hashes prove evidence wasn\'t modified. Essential for legal proceedings.'
                },
                {
                    question: 'Which command shows current network connections on Linux?',
                    options: [
                        '<code>ifconfig</code>',
                        '<code>netstat -tulpn</code>',
                        '<code>route</code>',
                        '<code>hostname</code>'
                    ],
                    correct: 1,
                    explanation: 'netstat -tulpn shows TCP/UDP listening ports with process names. Critical volatile evidence.'
                },
                {
                    question: 'What does <code>/var/log/btmp</code> contain?',
                    options: [
                        'Successful logins',
                        'Failed login attempts',
                        'Boot messages',
                        'System errors'
                    ],
                    correct: 1,
                    explanation: 'btmp logs FAILED logins. Essential for detecting brute force attacks. Use lastb to read it.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
