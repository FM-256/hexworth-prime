<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/FirebaseAuth.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-015 Final Quiz: Capstone Challenge - Script House</title>
    <link rel="stylesheet" href="../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-015 Final Quiz: Capstone Challenge',
            description: 'Test your knowledge: CLH-015 Final Quiz: Capstone Challenge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-015',
            moduleId: 'clh-015',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-016: System Intel', href: 'script-clh-016-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command lists hidden files with detailed permissions?',
                    options: [
                        '<code>ls -a</code>',
                        '<code>ls -la</code>',
                        '<code>dir /ah</code>',
                        '<code>find . -hidden</code>'
                    ]
                },
                {
                    question: 'Search for "password" case-insensitively in all .conf files:',
                    options: [
                        '<code>grep password *.conf</code>',
                        '<code>grep -i password *.conf</code>',
                        '<code>find . -name password</code>',
                        '<code>cat *.conf | grep pass</code>'
                    ]
                },
                {
                    question: 'Which process detail reveals network connections per process?',
                    options: [
                        '<code>ps aux</code>',
                        '<code>top</code>',
                        '<code>lsof -i</code>',
                        '<code>pstree</code>'
                    ]
                },
                {
                    question: 'What does chmod 4755 do differently from 755?',
                    options: [
                        'Makes it read-only',
                        'Adds SUID bit',
                        'Adds sticky bit',
                        'Removes execute'
                    ]
                },
                {
                    question: 'Which file logs sudo command usage?',
                    options: [
                        '<code>/var/log/syslog</code>',
                        '<code>/var/log/auth.log</code>',
                        '<code>/var/log/sudo.log</code>',
                        '<code>/var/log/secure</code>'
                    ]
                },
                {
                    question: 'Find all unique IPs that attempted SSH login:',
                    options: [
                        '<code>grep sshd /var/log/auth.log</code>',
                        '<code>grep sshd /var/log/auth.log | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+" | sort -u</code>',
                        '<code>cat /var/log/auth.log | wc -l</code>',
                        '<code>tail /var/log/auth.log</code>'
                    ]
                },
                {
                    question: 'Nmap command to detect service versions on open ports:',
                    options: [
                        '<code>nmap -sn target</code>',
                        '<code>nmap -sV target</code>',
                        '<code>nmap -O target</code>',
                        '<code>nmap -sS target</code>'
                    ]
                },
                {
                    question: 'A 403 response on /admin/ means:',
                    options: [
                        'Page doesn\'t exist',
                        'Server error',
                        'Path exists but access denied',
                        'Redirect required'
                    ]
                },
                {
                    question: 'First thing to collect during incident response:',
                    options: [
                        'Disk image',
                        'Memory dump',
                        'Network logs',
                        'User interviews'
                    ]
                },
                {
                    question: 'What does <code>${1:?Usage: $0 TARGET}</code> do in bash?',
                    options: [
                        'Sets default value',
                        'Exits with error if $1 is empty',
                        'Prints $1 value',
                        'Loops through arguments'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
