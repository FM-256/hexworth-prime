<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-008 Quiz: Shell Scripting Basics',
            description: 'Test your knowledge of shebang lines, variables, conditionals, and loops',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-008',
            moduleId: 'clh-008',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-009: Text Processing', href: 'clh/script-clh-009-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the purpose of <code>#!/bin/bash</code> at the top of a script?',
                    options: [
                        'It is a comment that documents the author',
                        'It tells the system which interpreter to use to execute the script',
                        'It imports the bash library',
                        'It sets the script file permissions'
                    ]
                },
                {
                    question: 'Which is the correct way to assign a variable in bash?',
                    options: [
                        '<code>NAME = "shadow"</code>',
                        '<code>NAME="shadow"</code>',
                        '<code>$NAME="shadow"</code>',
                        '<code>set NAME "shadow"</code>'
                    ]
                },
                {
                    question: 'What is the correct syntax for an if-statement in bash?',
                    options: [
                        '<code>if [ -f file.txt ] then echo "found" end</code>',
                        '<code>if ( -f file.txt ) { echo "found"; }</code>',
                        '<code>if [ -f file.txt ]; then echo "found"; fi</code>',
                        '<code>if test file.txt: echo "found"</code>'
                    ]
                },
                {
                    question: 'Which loop iterates over a list of items in bash?',
                    options: [
                        '<code>foreach item in alpha bravo charlie; do echo $item; end</code>',
                        '<code>loop item (alpha bravo charlie) { echo $item; }</code>',
                        '<code>for item in alpha bravo charlie; do echo $item; done</code>',
                        '<code>while item in alpha bravo charlie; echo $item; done</code>'
                    ]
                },
                {
                    question: 'What does <code>$?</code> contain after a command runs?',
                    options: [
                        'The process ID of the command',
                        'The number of arguments passed to the script',
                        'The exit status of the last executed command',
                        'The name of the current script'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
