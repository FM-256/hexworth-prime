<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-027 Quiz: User Management',
            description: 'Test your persistence skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-027',
            moduleId: 'clh-027',
            houseId: 'script',
            nextModule: { title: 'CLH-028: System Monitoring', href: 'clh/script-clh-028-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which flag creates a home directory when adding a user with <code>useradd</code>?',
                    options: [
                        '<code>-h</code>',
                        '<code>-m</code>',
                        '<code>-d</code>',
                        '<code>-c</code>'
                    ],
                    correct: 1,
                    explanation: '<code>-m</code> (make home) creates the home directory. <code>-d</code> specifies the path, but doesn\'t create it.'
                },
                {
                    question: 'What makes a UID 0 account dangerous?',
                    options: [
                        'It can\'t be deleted',
                        'It has root privileges regardless of username',
                        'It bypasses all logging',
                        'It\'s visible to all users'
                    ],
                    correct: 1,
                    explanation: 'UID 0 = root privileges. Creating a second account with UID 0 gives you a hidden root backdoor.'
                },
                {
                    question: 'How do you add a user to the sudo group WITHOUT removing their other groups?',
                    options: [
                        '<code>usermod -G sudo user</code>',
                        '<code>usermod -aG sudo user</code>',
                        '<code>groupadd sudo user</code>',
                        '<code>adduser user sudo</code>'
                    ],
                    correct: 1,
                    explanation: '<code>-a</code> means append. Without -a, <code>-G</code> replaces all supplementary groups!'
                },
                {
                    question: 'Which file stores the encrypted password hashes?',
                    options: [
                        '<code>/etc/passwd</code>',
                        '<code>/etc/shadow</code>',
                        '<code>/etc/group</code>',
                        '<code>/etc/security</code>'
                    ],
                    correct: 1,
                    explanation: '<code>/etc/shadow</code> stores hashed passwords. <code>/etc/passwd</code> is world-readable and only shows "x".'
                },
                {
                    question: 'What does <code>userdel -r username</code> do differently than <code>userdel username</code>?',
                    options: [
                        'Forces deletion without confirmation',
                        'Removes home directory and mail spool',
                        'Removes user from all groups first',
                        'Creates a backup before deletion'
                    ],
                    correct: 1,
                    explanation: '<code>-r</code> removes the home directory and mail spool. Without it, those files remain (potential evidence!).'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../components/FluxCapacitor.js"></script>
