        <a href="../index.html">&larr; Back to Script House</a>

    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-027 Quiz: User Management',
            description: 'Test your persistence skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-027',
            moduleId: 'clh-027',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-028: System Monitoring', href: 'script-clh-028-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which flag creates a home directory when adding a user with <code>useradd</code>?',
                    options: [
                        '<code>-h</code>',
                        '<code>-m</code>',
                        '<code>-d</code>',
                        '<code>-c</code>'
                    ],
                    explanation: '<code>-m</code> (or <code>--create-home</code>) tells useradd to create the user\'s home directory and copy <code>/etc/skel</code> contents into it. <code>-d</code> only sets the path (does not create); <code>-h</code> shows help; <code>-c</code> sets the GECOS comment field.'
                },
                {
                    question: 'What makes a UID 0 account dangerous?',
                    options: [
                        'It can\'t be deleted',
                        'It bypasses all logging',
                        'It\'s visible to all users',
                        'It has root privileges regardless of username'
                    ],
                    explanation: 'Linux identifies the superuser by UID 0, not by the name "root". Any account assigned UID 0 has full root privileges no matter what username it carries. Attackers exploit this by creating innocent-looking accounts (e.g. "support") with UID 0 for hidden persistence.'
                },
                {
                    question: 'How do you add a user to the sudo group WITHOUT removing their other groups?',
                    options: [
                        '<code>usermod -aG sudo user</code>',
                        '<code>usermod -G sudo user</code>',
                        '<code>groupadd sudo user</code>',
                        '<code>adduser user sudo</code>'
                    ],
                    explanation: 'The <code>-a</code> (append) flag is mandatory when modifying group membership with <code>-G</code>. Without <code>-a</code>, <code>usermod -G sudo user</code> REPLACES every supplementary group with just sudo, silently removing the user from any other group they belonged to.'
                },
                {
                    question: 'Which file stores the encrypted password hashes?',
                    options: [
                        '<code>/etc/passwd</code>',
                        '<code>/etc/group</code>',
                        '<code>/etc/shadow</code>',
                        '<code>/etc/security</code>'
                    ],
                    explanation: '<code>/etc/shadow</code> stores hashed passwords plus aging info (expiration, last change). It is readable only by root. <code>/etc/passwd</code> is world-readable and stores everything else (UID, GID, home, shell) — splitting them is what protects the hashes from non-privileged users.'
                },
                {
                    question: 'What does <code>userdel -r username</code> do differently than <code>userdel username</code>?',
                    options: [
                        'Removes home directory and mail spool',
                        'Forces deletion without confirmation',
                        'Removes user from all groups first',
                        'Creates a backup before deletion'
                    ],
                    explanation: 'Plain <code>userdel</code> only removes the account entry from <code>/etc/passwd</code> and <code>/etc/shadow</code>; the home directory and any files under <code>/var/mail/$USER</code> remain on disk. <code>-r</code> additionally deletes the home directory and the mail spool. Useful for full cleanup but irreversible — back up first if data may be needed.'
                }
            ]
        });
        quiz.start();
    </script>
