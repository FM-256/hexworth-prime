<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-014 Quiz: Process Control',
            description: 'Test your knowledge: CLH-014 Quiz: Process Control',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-014',
            moduleId: 'clh-014',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-015: Capstone Challenge', href: 'script-clh-015-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the key difference between SIGTERM and SIGKILL?',
                    options: [
                        'SIGTERM is faster than SIGKILL',
                        'SIGKILL can be caught by the process; SIGTERM cannot',
                        'SIGTERM allows graceful shutdown; SIGKILL forces immediate termination and cannot be caught',
                        'They are the same signal with different names'
                    ]
                },
                {
                    question: 'What does pressing <code>Ctrl+Z</code> do to the foreground process?',
                    options: [
                        'Terminates it immediately',
                        'Sends SIGINT to interrupt it',
                        'Suspends it and returns you to the shell prompt',
                        'Moves it to the background and keeps it running'
                    ]
                },
                {
                    question: 'How do you resume a suspended job in the background?',
                    options: [
                        '<code>fg %1</code>',
                        '<code>bg %1</code>',
                        '<code>nohup %1</code>',
                        '<code>resume %1</code>'
                    ]
                },
                {
                    question: 'What does <code>nohup ./script.sh &</code> accomplish?',
                    options: [
                        'Runs the script with elevated privileges',
                        'Runs the script in the foreground immune to hangups',
                        'Runs the script in the background and it survives after you log out',
                        'Runs the script silently with no output'
                    ]
                },
                {
                    question: 'Why should you avoid using <code>kill -9</code> on a database process?',
                    options: [
                        'It has no effect on database processes',
                        'SIGKILL bypasses graceful shutdown, risking data corruption',
                        'It requires root privileges that operators lack',
                        'It only works on shell scripts, not compiled programs'
                    ]
                }
            ]
        });
        quiz.start();
    </script>
