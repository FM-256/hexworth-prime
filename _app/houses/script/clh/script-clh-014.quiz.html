    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-014 Quiz: Process Control',
            description: 'Test your knowledge: CLH-014 Quiz: Process Control',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-014',
            moduleId: 'clh-014',
            houseId: 'script',
            nextModule: { title: 'CLH-015: Capstone Challenge', href: 'clh/script-clh-015-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the key difference between SIGTERM and SIGKILL?',
                    options: [
                        'SIGTERM is faster than SIGKILL',
                        'SIGKILL can be caught by the process; SIGTERM cannot',
                        'SIGTERM allows graceful shutdown; SIGKILL forces immediate termination and cannot be caught',
                        'They are the same signal with different names'
                    ], correct: 2, explanation: 'SIGTERM (signal 15) asks a process to shut down gracefully -- it can be caught and handled. SIGKILL (signal 9) forces immediate termination and cannot be caught, blocked, or ignored. Use SIGTERM first; SIGKILL is the last resort.'
                },
                {
                    question: 'What does pressing <code>Ctrl+Z</code> do to the foreground process?',
                    options: [
                        'Terminates it immediately',
                        'Sends SIGINT to interrupt it',
                        'Suspends it and returns you to the shell prompt',
                        'Moves it to the background and keeps it running'
                    ], correct: 2, explanation: 'Ctrl+Z sends SIGTSTP, which suspends (pauses) the process. It stops running but remains in memory. Use bg to resume it in the background or fg to bring it back to the foreground.'
                },
                {
                    question: 'How do you resume a suspended job in the background?',
                    options: [
                        '<code>fg %1</code>',
                        '<code>bg %1</code>',
                        '<code>nohup %1</code>',
                        '<code>resume %1</code>'
                    ], correct: 1, explanation: 'bg %1 resumes job 1 in the background. fg %1 would bring it to the foreground instead. The jobs command lists all current jobs and their numbers.'
                },
                {
                    question: 'What does <code>nohup ./script.sh &</code> accomplish?',
                    options: [
                        'Runs the script with elevated privileges',
                        'Runs the script in the foreground immune to hangups',
                        'Runs the script in the background and it survives after you log out',
                        'Runs the script silently with no output'
                    ], correct: 2, explanation: 'nohup makes the process immune to SIGHUP (sent when you log out or close the terminal). The & puts it in the background. Together, the script keeps running even after your session ends -- essential for long-running monitoring tasks.'
                },
                {
                    question: 'Why should you avoid using <code>kill -9</code> on a database process?',
                    options: [
                        'It has no effect on database processes',
                        'SIGKILL bypasses graceful shutdown, risking data corruption',
                        'It requires root privileges that operators lack',
                        'It only works on shell scripts, not compiled programs'
                    ], correct: 1, explanation: 'SIGKILL terminates immediately with no cleanup. Databases rely on graceful shutdown (SIGTERM) to flush buffers, complete transactions, and close files properly. SIGKILL skips all of that, which can corrupt data.'
                }
            ]
        });
        quiz.start();
    </script>
