<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>

    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-011 Quiz: Advanced Grep & Regex',
            description: 'Test your knowledge of grep options and regular expressions for pattern hunting.',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-011',
            moduleId: 'clh-011',
            houseId: 'script',
            nextModule: { title: 'CLH-012: Network Basics', href: 'clh/script-clh-012-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>grep -E</code> enable?',
                    options: [
                        'Case-insensitive matching',
                        'Extended regex -- allows <code>+</code>, <code>?</code>, <code>|</code>, and <code>()</code> without escaping',
                        'Recursive directory search',
                        'Perl-compatible regex with lookaheads'
                    ], correct: 1, explanation: 'grep -E enables extended regular expressions, so metacharacters like +, ?, |, and () work without backslash escaping.'
                },
                {
                    question: 'In regex, what do the anchors <code>^</code> and <code>$</code> match?',
                    options: [
                        'Any character and end of file',
                        'Start and end of a word',
                        'Start and end of a line',
                        'First and last character of the pattern'
                    ], correct: 2, explanation: '^ anchors the match to the start of a line and $ anchors to the end. Together they let you match entire line patterns.'
                },
                {
                    question: 'What does <code>grep -Ec "CRITICAL|EMERGENCY" logs/syslog</code> output?',
                    options: [
                        'All lines containing CRITICAL or EMERGENCY',
                        'The number of lines matching CRITICAL or EMERGENCY',
                        'The filenames containing those patterns',
                        'A sorted list of unique matches'
                    ], correct: 1, explanation: 'The -c flag counts matching lines instead of printing them. Combined with -E, the pipe (|) acts as alternation -- match either pattern.'
                },
                {
                    question: 'Which command strips comments and blank lines from a config file?',
                    options: [
                        '<code>grep -E "^#|^$" config</code>',
                        '<code>grep -Ev "^#|^$" config</code>',
                        '<code>grep -P "\\s+" config</code>',
                        '<code>grep -c "^$" config</code>'
                    ], correct: 1, explanation: 'The -v flag inverts the match, so -Ev "^#|^$" excludes lines starting with # (comments) and empty lines -- showing only active config.'
                },
                {
                    question: 'What does the regex character class <code>[0-9]+</code> match?',
                    options: [
                        'Exactly one digit',
                        'Zero or more digits',
                        'One or more digits',
                        'The literal string [0-9]+'
                    ], correct: 2, explanation: '[0-9] matches any single digit and + means one or more of the preceding element. Together they match sequences like 42, 192, or 2026.'
                }
            ]
        });
        quiz.start();
    </script>
