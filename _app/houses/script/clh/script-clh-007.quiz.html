<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../components/ProgressSystem.js"></script>
    <script src="../../../components/QuizEngine.js?v=1773079392"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-007 Quiz: Permissions & Access Control',
            description: 'Test your permissions and access control knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-007',
            moduleId: 'clh-007-legacy',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-008: Shell Scripting Basics', href: 'script-clh-008-intro.applet.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>chmod 600 credentials.conf</code> set the permissions to?',
                    options: [
                        'rw-rw-rw- (read/write for everyone)',
                        'rw------- (read/write for owner only)',
                        'r-------- (read-only for owner)',
                        'rwx------ (full access for owner only)'
                    ]
                },
                {
                    question: 'What does the SUID bit do when set on an executable?',
                    options: [
                        'Prevents the file from being deleted',
                        'Runs the program with the privileges of the file owner instead of the calling user',
                        'Encrypts the file contents automatically',
                        'Allows only the group to execute the file'
                    ]
                },
                {
                    question: 'What is the purpose of the sticky bit on a directory like <code>/tmp</code>?',
                    options: [
                        'It makes all files in the directory read-only',
                        'It prevents users from deleting or renaming files owned by other users',
                        'It forces all new files to inherit the directory owner',
                        'It encrypts files stored in the directory'
                    ]
                },
                {
                    question: 'If the default umask is <code>022</code>, what permissions will a newly created file have?',
                    options: [
                        '777 (rwxrwxrwx)',
                        '755 (rwxr-xr-x)',
                        '644 (rw-r--r--)',
                        '600 (rw-------)'
                    ]
                },
                {
                    question: 'Which command changes both the owner and group of a file in one command?',
                    options: [
                        '<code>chmod admin:devops file.txt</code>',
                        '<code>chown admin:devops file.txt</code>',
                        '<code>chgrp admin:devops file.txt</code>',
                        '<code>usermod admin:devops file.txt</code>'
                    ]
                }
            ]
        });
        quiz.start();
    </script>

</body>
