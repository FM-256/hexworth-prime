    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Advanced SQL Quiz',
            description: 'Test your knowledge of aggregation, window functions, database design, and data engineering',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            timeLimit: null,
            retryAllowed: true,
            theme: 'script',
            achievement: 'db-advanced-sql',
            moduleId: 'db-34-advanced-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,

            questions: [
                // SECTION 4: AGGREGATION & ANALYTICS (DB-18 through DB-22)
                {
                    question: 'Which aggregate function counts all rows including NULLs?',
                    options: [
                        'COUNT(column)',
                        'COUNT(*)',
                        'COUNT(DISTINCT column)',
                        'SUM(*)'
                    ],explanation: 'COUNT(*) counts every row in the result set regardless of NULL values. COUNT(column) skips rows where that column is NULL, and COUNT(DISTINCT column) counts only unique non-NULL values.'
                },
                {
                    question: 'What does GROUP BY do?',
                    options: [
                        'Sorts results in ascending order',
                        'Groups rows for aggregate calculations',
                        'Joins tables on matching columns',
                        'Filters groups based on conditions'
                    ],explanation: 'GROUP BY divides rows into groups based on one or more columns, then aggregate functions (COUNT, SUM, AVG, etc.) calculate a single value per group.'
                },
                {
                    question: 'What is the difference between WHERE and HAVING?',
                    options: [
                        'There is no difference, they are interchangeable',
                        'WHERE filters rows before grouping; HAVING filters groups after aggregation',
                        'WHERE is faster but HAVING is more accurate',
                        'HAVING works on all columns while WHERE only works on indexed columns'
                    ],explanation: 'WHERE filters individual rows before GROUP BY runs. HAVING filters the aggregated groups after GROUP BY. You cannot use aggregate functions in WHERE, but you can in HAVING.'
                },
                {
                    question: 'What does ROW_NUMBER() OVER (ORDER BY salary DESC) return?',
                    options: [
                        'The salary value itself',
                        'A sequential number for each row ordered by salary',
                        'The rank with gaps for ties',
                        'The total count of rows'
                    ],explanation: 'ROW_NUMBER() assigns a unique sequential integer to each row within the result set, ordered by salary descending. Unlike RANK(), it never produces duplicate numbers even for tied values.'
                },
                {
                    question: 'How does RANK() differ from DENSE_RANK()?',
                    options: [
                        'There is no difference between them',
                        'RANK() skips numbers after ties; DENSE_RANK() does not',
                        'DENSE_RANK() is faster for large datasets',
                        'RANK() is for strings only while DENSE_RANK() is for numbers'
                    ],explanation: 'With RANK(), if two rows tie at position 1, the next row gets position 3 (skipping 2). With DENSE_RANK(), the next row gets position 2. DENSE_RANK() never has gaps in the numbering.'
                },
                {
                    question: 'What does LAG(salary, 1) OVER (ORDER BY hire_date) return?',
                    options: [
                        'The next row\'s salary value',
                        'The previous row\'s salary value',
                        'The average salary across all rows',
                        'The minimum salary in the partition'
                    ],explanation: 'LAG() accesses a value from a previous row. LAG(salary, 1) gets the salary from 1 row before the current row, ordered by hire_date. LEAD() does the opposite, looking at the next row.'
                },
                {
                    question: 'What is PARTITION BY used for in window functions?',
                    options: [
                        'Filtering rows from the result set',
                        'Creating separate windows within a result set',
                        'Joining tables on matching columns',
                        'Sorting the final output'
                    ],explanation: 'PARTITION BY divides the result set into separate groups (partitions), and the window function is applied independently within each partition. It is like GROUP BY but without collapsing rows.'
                },
                {
                    question: 'What does ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING define?',
                    options: [
                        'A filter condition',
                        'A 3-row sliding window frame',
                        'A partition boundary',
                        'An index range'
                    ],explanation: 'This defines a window frame of 3 rows: the row before the current row, the current row itself, and the row after. This is commonly used for moving averages and running calculations.'
                },

                // SECTION 5: DATABASE DESIGN (DB-23 through DB-27)
                {
                    question: 'Which SQL statement creates a new table?',
                    options: [
                        'MAKE TABLE',
                        'BUILD TABLE',
                        'CREATE TABLE',
                        'NEW TABLE'
                    ],explanation: 'CREATE TABLE is the standard DDL (Data Definition Language) statement for defining a new table. You specify column names, data types, and constraints in the definition.'
                },
                {
                    question: 'What does PRIMARY KEY enforce?',
                    options: [
                        'That a column can contain NULL values',
                        'Uniqueness and NOT NULL on the column',
                        'That values are stored in sorted order',
                        'A maximum length for the column'
                    ],explanation: 'A PRIMARY KEY constraint enforces two rules: every value must be unique, and no value can be NULL. It uniquely identifies each row in the table and is often used as the target for foreign keys.'
                },
                {
                    question: 'What is a FOREIGN KEY?',
                    options: [
                        'A unique identifier for each row',
                        'A reference to a primary key in another table',
                        'An encrypted column for sensitive data',
                        'A computed column derived from other columns'
                    ],explanation: 'A FOREIGN KEY creates a link between two tables by referencing the PRIMARY KEY (or a UNIQUE column) in another table. It enforces referential integrity, ensuring that relationships between tables remain valid.'
                },
                {
                    question: 'What does ON DELETE CASCADE do?',
                    options: [
                        'Prevents the parent row from being deleted',
                        'Automatically deletes child rows when the parent row is deleted',
                        'Sets the foreign key column to NULL on deletion',
                        'Logs the deletion to an audit table'
                    ],explanation: 'ON DELETE CASCADE means when a parent row is deleted, all child rows referencing it are automatically deleted too. This prevents orphaned records but should be used carefully to avoid unintended data loss.'
                },
                {
                    question: 'What does CREATE INDEX improve?',
                    options: [
                        'Write and insert speed',
                        'Read and query performance',
                        'Data integrity and validation',
                        'Storage efficiency and compression'
                    ],explanation: 'An index is a data structure that speeds up SELECT queries and WHERE clause lookups. It works like a book index, allowing the database to find rows without scanning the entire table. Indexes do add overhead to writes.'
                },
                {
                    question: 'What does EXPLAIN QUERY PLAN show?',
                    options: [
                        'The query results in a different format',
                        'How the database will execute a query',
                        'The table schema and column types',
                        'A list of all indexes on the table'
                    ],explanation: 'EXPLAIN QUERY PLAN shows the execution plan the database engine will use, including whether it uses indexes, performs full table scans, or uses temporary sorting. It is essential for query optimization.'
                },
                {
                    question: 'What is sqlite_master?',
                    options: [
                        'A user-created table for administration',
                        'The system catalog containing metadata about all database objects',
                        'A backup table created automatically',
                        'An index on the primary key'
                    ],explanation: 'sqlite_master is a special system table in SQLite that stores the schema for all tables, indexes, views, and triggers in the database. You can query it to inspect the structure of your database.'
                },

                // SECTION 6: DATA ENGINEERING (DB-28 through DB-32)
                {
                    question: 'What is a transaction in SQL?',
                    options: [
                        'A single SQL query',
                        'A group of operations that execute as one atomic unit',
                        'A special table type for financial data',
                        'A connection type for remote databases'
                    ],explanation: 'A transaction groups multiple SQL operations into a single atomic unit. Either all operations succeed (COMMIT) or all are rolled back (ROLLBACK). This ensures data consistency, following the ACID principles.'
                },
                {
                    question: 'What does INSERT OR REPLACE do?',
                    options: [
                        'Always inserts a new row regardless of conflicts',
                        'Inserts a new row, or updates the existing row if the key already exists',
                        'Deletes the existing row then inserts a new one',
                        'Silently ignores the insert if a duplicate exists'
                    ],explanation: 'INSERT OR REPLACE (also called UPSERT) checks if a row with the same primary key or unique constraint exists. If it does, the existing row is replaced with the new data. If not, a new row is inserted.'
                },
                {
                    question: 'What is a VIEW in SQL?',
                    options: [
                        'A physical copy of a table stored on disk',
                        'A virtual table defined by a saved query',
                        'A cached query result that updates periodically',
                        'An index type that improves read performance'
                    ],explanation: 'A VIEW is a virtual table that does not store data itself. It is defined by a SELECT query, and every time you query the view, the underlying query runs. Views simplify complex queries and can restrict access to certain columns.'
                },
                {
                    question: 'What does CREATE TABLE AS SELECT do?',
                    options: [
                        'Creates an empty table with the same schema',
                        'Creates a new table populated with the results of a query',
                        'Creates a view based on a SELECT statement',
                        'Creates a temporary table that is deleted on disconnect'
                    ],explanation: 'CREATE TABLE AS SELECT (CTAS) creates a new physical table and fills it with the results of a SELECT query. Unlike a VIEW, this stores actual data. It is useful for materializing query results or creating snapshots.'
                },
                {
                    question: 'What is the purpose of a trigger?',
                    options: [
                        'To speed up query execution',
                        'To automatically execute code when data changes',
                        'To create indexes on frequently queried columns',
                        'To validate database connections'
                    ],explanation: 'A trigger is a block of SQL that automatically fires in response to INSERT, UPDATE, or DELETE events on a table. Triggers are used for auditing, enforcing business rules, and maintaining derived data.'
                }
            ],

            onComplete: (results) => {
            }
        });

        quiz.start();
    </script>
