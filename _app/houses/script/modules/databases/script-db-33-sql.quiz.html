<body>

        <a href="../../../../arctic/districts/databases/">&lt; Databases District</a>

    <!-- Progress System (loads ProgressManager, AchievementSystem, LearningPaths, SkillTreeData) -->
    <script src="../../../../components/ProgressSystem.js"></script>

    <!-- Quiz Engine -->
    <script src="../../../../components/QuizEngine.js"></script>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'SQL Fundamentals Quiz',
            description: 'Test your knowledge of SQL basics, data manipulation, and joins',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            timeLimit: null,
            retryAllowed: true,
            theme: 'script',
            achievement: 'db-sql-fundamentals',
            moduleId: 'db-33-sql-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,

            questions: [
                // SECTION 1: SQL Foundations (DB-01 through DB-05)
                {
                    question: 'Which SQL keyword retrieves data from a table?',
                    options: [
                        'SELECT',
                        'INSERT',
                        'UPDATE',
                        'CREATE'
                    ],explanation: 'SELECT is the SQL statement used to query and retrieve data from one or more tables.'
                },
                {
                    question: 'What does SELECT DISTINCT do?',
                    options: [
                        'Removes duplicate rows from the result set',
                        'Selects unique columns',
                        'Filters NULL values',
                        'Sorts results automatically'
                    ],explanation: 'DISTINCT eliminates duplicate rows from the query results, returning only unique combinations of the selected columns.'
                },
                {
                    question: 'Which clause filters rows in a SELECT query?',
                    options: [
                        'ORDER BY',
                        'WHERE',
                        'GROUP BY',
                        'HAVING'
                    ],explanation: 'WHERE filters individual rows before grouping. HAVING filters groups after GROUP BY, and ORDER BY sorts results.'
                },
                {
                    question: 'What operator checks for NULL values?',
                    options: [
                        '= NULL',
                        '== NULL',
                        'IS NULL',
                        'EQUALS NULL'
                    ],explanation: 'NULL represents an unknown value, so equality operators don\'t work with it. IS NULL (and IS NOT NULL) are the correct operators.'
                },
                {
                    question: 'Which keyword sorts results in descending order?',
                    options: [
                        'ASC',
                        'DESC',
                        'REVERSE',
                        'DOWN'
                    ],explanation: 'DESC (descending) sorts from highest to lowest. ASC (ascending) is the default and sorts lowest to highest.'
                },

                // SECTION 2: Data Manipulation (DB-06 through DB-11)
                {
                    question: 'What does LIMIT 5 OFFSET 10 return?',
                    options: [
                        'The first 5 rows',
                        'Rows 11 through 15',
                        'The last 5 rows',
                        'Every 5th row starting at row 10'
                    ],explanation: 'OFFSET 10 skips the first 10 rows, then LIMIT 5 returns the next 5 rows (rows 11-15).'
                },
                {
                    question: 'Which statement adds a new row to a table?',
                    options: [
                        'INSERT INTO',
                        'ADD ROW',
                        'CREATE ROW',
                        'APPEND TO'
                    ],explanation: 'INSERT INTO is the SQL statement for adding new rows. Syntax: INSERT INTO table (columns) VALUES (values).'
                },
                {
                    question: 'What happens if you run UPDATE without a WHERE clause?',
                    options: [
                        'An error is thrown',
                        'Nothing happens',
                        'All rows in the table are updated',
                        'Only the first row is updated'
                    ],explanation: 'Without a WHERE clause, UPDATE applies to every row in the table. This is a common and dangerous mistake in production databases.'
                },
                {
                    question: 'What does COALESCE(a, b, c) return?',
                    options: [
                        'The sum of a, b, and c',
                        'The first non-NULL value',
                        'The average of the values',
                        'The count of non-NULL values'
                    ],explanation: 'COALESCE evaluates its arguments left to right and returns the first one that is not NULL. Useful for providing fallback values.'
                },
                {
                    question: 'Which function returns the length of a string in SQLite?',
                    options: [
                        'LEN()',
                        'SIZE()',
                        'LENGTH()',
                        'STRLEN()'
                    ],explanation: 'LENGTH() returns the number of characters in a string. In SQLite and most SQL dialects, this is the standard string length function.'
                },

                // SECTION 2 continued: String & Numeric Functions
                {
                    question: 'What does the || operator do in SQL?',
                    options: [
                        'Logical OR',
                        'Concatenates strings',
                        'Bitwise OR',
                        'Pipe operator'
                    ],explanation: 'In SQL (especially SQLite and PostgreSQL), || is the string concatenation operator. Example: \'Hello\' || \' \' || \'World\' returns \'Hello World\'.'
                },
                {
                    question: 'Which function rounds 3.7 to the nearest integer?',
                    options: [
                        'ROUND(3.7, 0)',
                        'CEIL(3.7)',
                        'FLOOR(3.7)',
                        'TRUNC(3.7)'
                    ],explanation: 'ROUND(3.7, 0) rounds to 0 decimal places, giving 4. CEIL would give 4 but always rounds up. FLOOR gives 3 (always rounds down).'
                },
                {
                    question: 'In SQLite, which function extracts the year from a date?',
                    options: [
                        'YEAR()',
                        'EXTRACT(YEAR FROM date)',
                        'STRFTIME(\'%Y\', date)',
                        'DATE_PART(\'year\', date)'
                    ],explanation: 'SQLite uses STRFTIME for date formatting. STRFTIME(\'%Y\', date) extracts the 4-digit year. EXTRACT and DATE_PART are PostgreSQL syntax.'
                },

                // SECTION 3: Joins & Subqueries (DB-12 through DB-17)
                {
                    question: 'What does INNER JOIN return?',
                    options: [
                        'All rows from both tables',
                        'Only matching rows from both tables',
                        'All rows from the left table',
                        'Rows that don\'t match'
                    ],explanation: 'INNER JOIN returns only rows where the join condition is satisfied in both tables. Non-matching rows are excluded entirely.'
                },
                {
                    question: 'What is a LEFT JOIN?',
                    options: [
                        'Returns only matching rows',
                        'Returns all left rows plus matching right rows',
                        'Returns all rows from both tables',
                        'Returns non-matching rows only'
                    ],explanation: 'LEFT JOIN keeps all rows from the left table. Where no match exists in the right table, NULL values are filled in for the right columns.'
                },
                {
                    question: 'Which type of join produces a Cartesian product?',
                    options: [
                        'INNER JOIN',
                        'LEFT JOIN',
                        'CROSS JOIN',
                        'NATURAL JOIN'
                    ],explanation: 'CROSS JOIN combines every row from the first table with every row from the second table, producing M x N rows (Cartesian product).'
                },
                {
                    question: 'What is a self join?',
                    options: [
                        'Joining a table to itself',
                        'Joining without conditions',
                        'An automatic join',
                        'A join with no results'
                    ],explanation: 'A self join joins a table to itself using aliases. Common use: finding hierarchical relationships like employees and their managers.'
                },
                {
                    question: 'Which keyword combines results of two queries, removing duplicates?',
                    options: [
                        'UNION',
                        'UNION ALL',
                        'MERGE',
                        'COMBINE'
                    ],explanation: 'UNION combines result sets and removes duplicate rows. UNION ALL keeps all rows including duplicates and is faster since it skips deduplication.'
                },
                {
                    question: 'What is a subquery?',
                    options: [
                        'A backup query',
                        'A query nested inside another query',
                        'A query that runs twice',
                        'A query on a view'
                    ],explanation: 'A subquery (or inner query) is a SELECT statement embedded within another SQL statement. It can appear in WHERE, FROM, or SELECT clauses.'
                },
                {
                    question: 'What does a CTE (WITH clause) provide?',
                    options: [
                        'A permanent table',
                        'A temporary named result set for the query',
                        'Index optimization',
                        'Transaction control'
                    ],explanation: 'A Common Table Expression (CTE) creates a temporary named result set that exists only for the duration of the query. It improves readability over nested subqueries.'
                }
            ],

            onComplete: (results) => {
            }
        });

        quiz.start();
    </script>
