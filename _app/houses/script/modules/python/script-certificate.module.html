<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <!-- Progress & Achievements -->
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <!-- FirebaseAuth: required for tenant progress sync -->
    <script src="../../../../components/FirebaseAuth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate - Zero to Python | Hexworth Prime</title>
    <link rel="stylesheet" href="../../../../components/certificate-styles.css">
</head>
<body>
<h1 class="visually-hidden">Certificate - Zero to Python</h1>
<a href="#" onclick="history.back(); return false;" class="back-btn" style="position:fixed;top:15px;left:15px;z-index:1000;color:#aaa;text-decoration:none;font-size:1.1rem;padding:6px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(10,10,18,0.85);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(10,10,18,0.85)'">&larr; Back</a>

    <div id="certificate"></div>

    <script src="../../../../components/CertificateRenderer.js"></script>
    <script>
        CertificateRenderer.init({
            containerId: 'certificate',
            courseTitle: 'Zero to Python',
            courseSubtitle: 'Python Programming Fundamentals',
            house: 'script',
            houseColor: '#10B981',
            houseIcon: '\uD83D\uDC0D',
            houseName: 'Script House',
            storageKey: 'zeroPython',
            unitLabel: 'chapters',
            unitCount: 8,
            backUrl: 'index.html'
        });
    </script>
<script>
    /* Register certificate view with ModuleProgress for tenant tracking */
    function completeModule() {
        if (typeof ModuleProgress !== 'undefined') {
            ModuleProgress.complete('script', 'script-python-certificate', {
                returnUrl: 'index.html'
            });
        }
    }
</script>
</body>
</html>
