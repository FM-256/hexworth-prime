<script>
ReviewEngine.init({
  containerId: 'review-container',
  title: 'Linux Admin Comprehensive Review',
  storageKey: 'hexworth_la_review',
  houseId: 'script',
  onComplete: function() {
    ModuleProgress.complete('script', 'script-la-review');
  },
  categories: [

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 1 — Linux Basics (Ch 1-2)
    // Covers: Linux history, distros, filesystem hierarchy, basic commands,
    //         man pages, shell fundamentals, file permissions.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Linux Basics',
      questions: [
        {
          value: 200,
          question: 'Which command displays the manual page (documentation) for a given command?',
          options: [
            'help &lt;command&gt;',
            'man &lt;command&gt;',
            'info --help &lt;command&gt;',
            'doc &lt;command&gt;'
          ],
          correct: 1,
          explanation: 'The <code>man</code> command opens the manual page for any utility, system call, or configuration file. Pages are organized into numbered sections — section 1 is user commands, section 5 is file formats, section 8 is system administration. Use <code>man 5 passwd</code> to specify a section. Inside man, press <code>/</code> to search, <code>q</code> to quit.'
        },
        {
          value: 400,
          question: 'In the Linux filesystem hierarchy, which directory is the correct location for user-installed executables that are NOT managed by the package manager?',
          options: [
            '/bin',
            '/usr/bin',
            '/usr/local/bin',
            '/sbin'
          ],
          correct: 2,
          explanation: '<code>/usr/local/bin</code> is the conventional location for locally compiled or manually installed binaries that are not managed by the system package manager (apt, yum, dnf). <code>/bin</code> and <code>/usr/bin</code> are reserved for package-manager-controlled system binaries. <code>/sbin</code> is for system administration binaries typically requiring root. By placing custom binaries in <code>/usr/local/bin</code>, you avoid conflicts when the package manager upgrades system files.'
        },
        {
          value: 600,
          question: 'A file has permissions <code>-rwxr-x---</code>. Which statement correctly describes the access model?',
          options: [
            'Owner can read/write/execute; group members can read/execute; others have no access',
            'Owner can read/write; group members can execute only; others can read',
            'All users can read/write/execute the file',
            'Owner can read/execute; group members can read/write; others have no access'
          ],
          correct: 0,
          explanation: 'Linux permission bits are read as three triplets after the file type indicator: <code>rwx</code> (owner) <code>r-x</code> (group) <code>---</code> (others). The <code>-</code> prefix indicates a regular file. Owner has read+write+execute (rwx). Group members have read+execute only (r-x — the middle <code>-</code> means no write). Others have no permissions at all (---). In octal this is 750.'
        },
        {
          value: 800,
          question: 'A script runs as root via cron but fails with "command not found" even though the same command works in an interactive root shell. What is the most likely cause?',
          options: [
            'Cron jobs cannot run as root for security reasons',
            'Cron uses a minimal environment — $PATH does not include /usr/local/bin or /usr/local/sbin; the script must use full absolute paths or set PATH explicitly at the top',
            'The script file permissions are wrong; it needs 777',
            'Cron only accepts Python scripts; bash scripts are not supported'
          ],
          correct: 1,
          explanation: 'Cron jobs run with a stripped-down environment where <code>$PATH</code> is typically only <code>/usr/bin:/bin</code>. Commands in <code>/usr/local/bin</code>, <code>/usr/sbin</code>, or <code>/opt/*/bin</code> are not found. Fix: add <code>PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin</code> at the top of the cron script, or use absolute paths (e.g., <code>/usr/local/bin/myapp</code>). This is the single most common cron troubleshooting scenario.'
        },
        {
          value: 1000,
          question: 'A Linux system has three hard links to the same inode: file-a, file-b, and file-c. A developer deletes file-a and file-b. What happens to the data on disk?',
          options: [
            'The data is immediately deleted because file-a was the original file',
            'The data remains intact and fully accessible via file-c; the filesystem only reclaims disk space when the link count drops to zero (all hard links removed)',
            'The data becomes a dangling pointer — file-c will return I/O errors',
            'A hard link deletion triggers a recursive delete of all related inodes'
          ],
          correct: 1,
          explanation: 'In Linux, files are inodes — data structures storing metadata and pointers to data blocks. A hard link is simply a directory entry pointing to an inode. The inode maintains a <strong>link count</strong>. When you create three hard links to one inode, the link count is 3. Deleting file-a decrements link count to 2. Deleting file-b decrements to 1. The data blocks are only freed when link count reaches 0. file-c continues to provide full access to the identical data. This is fundamentally different from symbolic links, which can become dangling if the target is deleted.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 2 — Text & Processes (Ch 3-4)
    // Covers: text editors (vi/nano), pipes, redirection, grep, find,
    //         process management (ps, kill, nice, jobs, fg/bg).
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Text & Processes',
      questions: [
        {
          value: 200,
          question: 'In vi/vim, which key sequence saves the file and exits the editor?',
          options: [
            'Ctrl+S then Ctrl+Q',
            ':wq followed by Enter (from normal mode)',
            'Esc then F2',
            ':save! then :exit'
          ],
          correct: 1,
          explanation: 'In vim, you must first be in <strong>Normal mode</strong> (press Esc if unsure), then type <code>:wq</code> and press Enter. <code>:w</code> = write (save), <code>:q</code> = quit. Combined as <code>:wq</code> = save and quit. Other useful combinations: <code>:q!</code> = quit without saving (force discard changes), <code>:wq!</code> = force save and quit (even if file is read-only and you have permission), <code>ZZ</code> = shortcut for :wq from normal mode.'
        },
        {
          value: 400,
          question: 'Which command searches recursively for the string "ERROR" in all .log files under /var/log, displaying filenames and line numbers?',
          options: [
            'find /var/log -name "*.log" | grep ERROR',
            'grep -rn "ERROR" /var/log --include="*.log"',
            'locate ERROR /var/log/*.log',
            'search -r ERROR /var/log/*.log'
          ],
          correct: 1,
          explanation: '<code>grep -rn "ERROR" /var/log --include="*.log"</code>: <code>-r</code> = recursive, <code>-n</code> = show line numbers, <code>--include</code> = restrict to matching filenames. The <code>find | grep</code> pattern in option A pipes find output (filenames) to grep, but grep would search the filenames themselves for "ERROR" — not the file contents. The correct pattern to combine find and grep for content searching is <code>find /var/log -name "*.log" -exec grep -n "ERROR" {} +</code>.'
        },
        {
          value: 600,
          question: 'A process is consuming excessive CPU. A sysadmin runs <code>kill -9 &lt;PID&gt;</code> but the process does not terminate. What is the most likely explanation?',
          options: [
            'Signal 9 (SIGKILL) requires root; the admin must use sudo',
            'The process is in an uninterruptible sleep state (D state) — it is blocked on kernel I/O and cannot receive any signals, including SIGKILL; resolution requires fixing the I/O blockage or rebooting',
            'kill -9 is deprecated; use kill -TERM instead',
            'The process has called signal(SIGKILL, SIG_IGN) to ignore signal 9'
          ],
          correct: 1,
          explanation: 'Processes in <strong>D state (TASK_UNINTERRUPTIBLE)</strong> are waiting for kernel I/O — typically a stuck disk, NFS mount, or hardware issue. No signal, including SIGKILL (which cannot be caught or ignored), can terminate them. The kernel will not schedule signal delivery while the process sleeps in D state. <code>ps aux</code> shows "D" in the STAT column. SIGKILL cannot be ignored by application code (option D is impossible by design), but D-state processes are temporarily immune because signal delivery happens at user/kernel boundary crossing, which never occurs while stuck in D state.'
        },
        {
          value: 800,
          question: 'What does the command <code>nice -n 15 tar czf /backup/daily.tar.gz /home</code> accomplish?',
          options: [
            'It pauses the tar process for 15 seconds before starting',
            'It runs the tar backup with a niceness value of 15 (lower priority than default 0), reducing its CPU scheduling priority so other processes are not starved during the backup',
            'It sets the maximum CPU time for tar to 15 minutes before automatic termination',
            'It forks 15 parallel tar processes for faster archiving'
          ],
          correct: 1,
          explanation: 'The <code>nice</code> command sets the CPU scheduling priority (niceness) of a process. Niceness ranges from -20 (highest priority) to +19 (lowest priority). Default is 0. <code>nice -n 15</code> starts the process at niceness +15 — significantly lower than other running processes. This is the standard technique for running resource-intensive background jobs (backups, compression, compilation) without impacting interactive users or services. To change the niceness of a running process: <code>renice +15 -p &lt;PID&gt;</code>. Only root can set negative niceness values.'
        },
        {
          value: 1000,
          question: 'A production server has a memory leak in a daemon. The admin observes the process RSS growing by 50MB/hour in <code>ps aux</code>. Before a fix is deployed, what command monitors the leaking process in real-time and sends SIGUSR1 (signal 10) to trigger an internal diagnostic dump every 30 minutes automatically?',
          options: [
            'watch -n 1800 "kill -10 $(pgrep leaky-daemon)"',
            'top -d 1800 -p $(pgrep leaky-daemon)',
            'crontab entry: */30 * * * * /usr/bin/kill -10 $(pgrep leaky-daemon) combined with <code>watch -n 5 "ps -p $(pgrep leaky-daemon) -o pid,rss,vsz"</code> in a separate terminal to monitor growth',
            'valgrind --leak-check=full leaky-daemon'
          ],
          correct: 2,
          explanation: 'This requires two separate tools working together. The <strong>monitoring</strong> piece: <code>watch -n 5 "ps -p PID -o pid,rss,vsz,comm"</code> refreshes every 5 seconds showing RSS growth in real-time. The <strong>scheduled signal</strong> piece: a crontab entry <code>*/30 * * * * /usr/bin/kill -10 $(pgrep leaky-daemon)</code> fires SIGUSR1 every 30 minutes. Note: <code>$(pgrep leaky-daemon)</code> in a crontab is evaluated at runtime each time. Alternatively, use <code>pkill -USR1 leaky-daemon</code> which is more readable. Option A uses watch with kill, but watch runs the command continuously at the specified interval — 1800 seconds is 30 minutes but watch is not designed for this; cron is the right tool for scheduled execution. Valgrind requires restarting the process under instrumentation.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 3 — System Services (Ch 5-6)
    // Covers: systemd/systemctl, service units, runlevels/targets,
    //         journald/journalctl, boot process, cron, at.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'System Services',
      questions: [
        {
          value: 200,
          question: 'Which systemctl command enables a service to start automatically at boot AND starts it immediately right now?',
          options: [
            'systemctl start nginx',
            'systemctl enable nginx',
            'systemctl enable --now nginx',
            'systemctl activate nginx'
          ],
          correct: 2,
          explanation: '<code>systemctl enable --now nginx</code> is the efficient combined command that simultaneously enables the service (creates the symlink so it starts at boot) AND starts it immediately. Without <code>--now</code>, <code>enable</code> only creates the boot symlink — the service is NOT started until next reboot. <code>start</code> only starts now without enabling for boot. The <code>--now</code> flag was added specifically to avoid the common two-step mistake of forgetting to also start after enabling.'
        },
        {
          value: 400,
          question: 'A web service is failing and a sysadmin needs to see the last 50 log lines for the nginx service including timestamps. Which command is correct?',
          options: [
            'cat /var/log/nginx/error.log | tail -50',
            'journalctl -u nginx -n 50',
            'systemctl log nginx --lines=50',
            'syslog -u nginx -count 50'
          ],
          correct: 1,
          explanation: '<code>journalctl -u nginx -n 50</code> queries the systemd journal specifically for the nginx unit (<code>-u</code>) and displays the last 50 lines (<code>-n 50</code>). Additional useful flags: <code>-f</code> = follow (tail -f equivalent), <code>--since "1 hour ago"</code> = time-based filtering, <code>-x</code> = add explanatory text for errors, <code>-p err</code> = show only error priority and above. While nginx also writes to /var/log/nginx/, systemd captures all stdout/stderr from the service process, making journalctl the authoritative source for systemd-managed services.'
        },
        {
          value: 600,
          question: 'What is the systemd equivalent of SysV runlevel 3 (multi-user, no GUI)?',
          options: [
            'systemd.target=console',
            'multi-user.target',
            'runlevel3.target only (no equivalent name)',
            'text.target'
          ],
          correct: 1,
          explanation: 'Systemd uses <strong>targets</strong> instead of SysV runlevels. The mapping: Runlevel 0 = poweroff.target, Runlevel 1 = rescue.target, Runlevel 3 = multi-user.target, Runlevel 5 = graphical.target, Runlevel 6 = reboot.target. <code>multi-user.target</code> brings up all network services, daemons, and multi-user CLI but does not start a display manager or GUI. To switch to it: <code>systemctl isolate multi-user.target</code>. To set it as the permanent default: <code>systemctl set-default multi-user.target</code>.'
        },
        {
          value: 800,
          question: 'A custom service unit file is created at /etc/systemd/system/myapp.service. After editing it to fix a dependency, the service still starts with the old configuration. What command must be run before the changes take effect?',
          options: [
            'systemctl restart myapp',
            'systemctl daemon-reload',
            'systemctl reload myapp',
            'service myapp reconfigure'
          ],
          correct: 1,
          explanation: '<code>systemctl daemon-reload</code> instructs systemd to re-read all unit files from disk, including your modified .service file. Systemd caches unit file contents in memory — simply restarting the service does NOT reload the unit file itself. <code>daemon-reload</code> must always be run after creating or modifying any .service, .timer, .socket, or .path unit file. After <code>daemon-reload</code>, then run <code>systemctl restart myapp</code> to apply the new configuration. Note: <code>systemctl reload myapp</code> sends SIGHUP to the running process (for processes that support configuration reload), but does not re-read the unit file.'
        },
        {
          value: 1000,
          question: 'A systemd service exits immediately after starting (status shows "exited" not "running"). The unit has <code>Type=simple</code>. The ExecStart binary runs successfully when executed manually. What is the most likely root cause and fix?',
          options: [
            'Type=simple services are deprecated; change to Type=forking',
            'The service binary is forking into the background — with Type=simple, systemd expects the process in ExecStart to remain in the foreground as the main process; if it daemonizes (forks and exits), systemd sees the original process exit and considers the service stopped; fix: either use Type=forking or pass a flag to disable daemonization (e.g., --foreground, -D, or check the binary documentation)',
            'ExecStart cannot use absolute paths; use relative paths from WorkingDirectory',
            'Simple services require a PIDFile= directive to track the process'
          ],
          correct: 1,
          explanation: 'This is one of the most common systemd misconfiguration scenarios. <code>Type=simple</code> means: systemd considers the service started as soon as ExecStart launches, and the launched process IS the main service process. If the binary daemonizes (forks a child, then the parent exits), systemd sees the ExecStart process exit and marks the service stopped — even though the child continues running. Solutions: (1) Find the binary\'s "--no-daemon", "--foreground", or "-D" flag to disable daemonization. (2) Use <code>Type=forking</code> + <code>PIDFile=</code> pointing to where the daemon writes its PID. (3) Use <code>Type=notify</code> if the binary supports sd_notify. (4) Wrap with <code>Type=exec</code> (systemd 240+). Always check <code>journalctl -u servicename</code> first — exit code and last log line often identify the exact issue.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 4 — Display & Users (Ch 7)
    // Covers: display managers (GDM/LightDM/SDDM), X11 vs Wayland,
    //         user/group management, sudo, PAM.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Display & Users',
      questions: [
        {
          value: 200,
          question: 'Which command identifies which display manager is currently active on a systemd-based Linux system?',
          options: [
            'ps -e | grep display',
            'systemctl status display-manager',
            'cat /etc/X11/default-display-manager',
            'loginctl show-session'
          ],
          correct: 1,
          explanation: '<code>systemctl status display-manager</code> shows the status of the <code>display-manager.service</code> symlink, which always points to whichever display manager is active (gdm, lightdm, sddm, etc.). The output includes the actual service name the symlink resolves to. <code>cat /etc/X11/default-display-manager</code> shows the configured default on Debian/Ubuntu systems, but may not reflect the currently running one. <code>loginctl</code> shows session information but not the DM itself.'
        },
        {
          value: 400,
          question: 'A new admin account needs to be created with home directory creation, a specific UID of 1500, and bash as the default shell. Which command is correct?',
          options: [
            'adduser --uid 1500 --shell /bin/bash newadmin',
            'useradd -m -u 1500 -s /bin/bash newadmin',
            'createuser -home -id 1500 -shell bash newadmin',
            'usermod -a -u 1500 -s /bin/bash newadmin'
          ],
          correct: 1,
          explanation: '<code>useradd -m -u 1500 -s /bin/bash newadmin</code>: <code>-m</code> = create home directory, <code>-u 1500</code> = set specific UID, <code>-s /bin/bash</code> = set default shell. Note: <code>useradd</code> creates the account but does NOT set a password — run <code>passwd newadmin</code> afterward. <code>adduser</code> (option A) is a higher-level interactive wrapper on Debian/Ubuntu that uses <code>--uid</code> syntax, but it is interactive by default. <code>usermod</code> modifies existing accounts. The correct low-level non-interactive creation tool is <code>useradd</code>.'
        },
        {
          value: 600,
          question: 'How does X11 differ architecturally from Wayland in terms of the client-compositor relationship?',
          options: [
            'X11 uses GPU acceleration; Wayland uses only CPU rendering',
            'In X11, the X server acts as intermediary between clients and display hardware — clients request drawing operations from the X server, which then handles rendering. In Wayland, each client renders its own buffer and sends only the final rendered surface to the compositor; the compositor (e.g., GNOME Mutter, KDE KWin) talks directly to the GPU via DRM/KMS, eliminating the X server middleman',
            'X11 supports multiple monitors; Wayland is single-monitor only',
            'X11 is open source; Wayland is proprietary'
          ],
          correct: 1,
          explanation: 'X11 (X Window System): clients send drawing commands to the X server, which arbitrates access to display hardware. The X server handles compositing, input routing, and rendering. This layer of indirection causes latency and complexity. Wayland eliminates the X server: each client renders directly into a graphics buffer (using Mesa/DRM). The Wayland compositor receives complete surfaces and composites them to the screen via KMS (Kernel Mode Setting). Benefits: lower latency, better security (clients cannot snoop on each other\'s surfaces by default), simpler architecture. Tradeoff: X11 apps need XWayland (an X11 compatibility layer) to run under Wayland.'
        },
        {
          value: 800,
          question: 'A user was added to the <code>sudo</code> group but cannot run sudo commands — they receive "is not in the sudoers file." What is the most likely cause and fix?',
          options: [
            'The sudo package is corrupt; reinstall with apt reinstall sudo',
            'The user\'s current session was established before the group change; they must log out and back in (or run newgrp sudo / exec su -l $USER) so the shell process reflects the updated group membership in its supplementary GID list',
            'Group membership changes require a full system reboot to take effect',
            'sudo reads /etc/passwd not /etc/group; usermod must update passwd instead'
          ],
          correct: 1,
          explanation: 'Linux processes inherit their supplementary group list at login from /etc/group at that moment. When you add a user to a group (<code>usermod -aG sudo username</code>), /etc/group is updated immediately, but the user\'s <strong>running shell processes still have the old group list</strong>. The shell will not see the new sudo membership until a new login session starts (which re-reads /etc/group). Quick fix without full logout: <code>exec su -l $USER</code> or <code>newgrp sudo</code> (opens a subshell with the new group). This is not a bug — it is the expected kernel behavior for process credential inheritance.'
        },
        {
          value: 1000,
          question: 'A login fails with "pam_unix(sshd:auth): authentication failure" in /var/log/auth.log even though the password is correct and the account is not locked. What PAM-related configuration should be investigated?',
          options: [
            'The SSH daemon is not installed; install openssh-server',
            'Investigate: (1) /etc/pam.d/sshd for pam_tally2 or pam_faillock account lockout limits, (2) check if the account is locked with <code>passwd -S username</code> (shows L for locked), (3) verify pam_access or pam_time restrictions in /etc/security/access.conf and /etc/security/time.conf, (4) check if pam_ldap or pam_sss is failing if the system uses centralized authentication — use <code>authselect current</code> or <code>pam-auth-update --force</code> to diagnose the stack',
            'Delete /etc/pam.d/sshd and restart SSH to reset PAM configuration',
            'PAM only handles local authentication; SSH failures are always key-related'
          ],
          correct: 1,
          explanation: 'When "correct password + authentication failure" occurs, PAM is the right investigation layer. PAM (Pluggable Authentication Modules) enforces the entire authentication chain. Key investigation points: (1) <strong>Account lockout</strong>: <code>faillock --user username</code> (modern) or <code>pam_tally2 --user username</code> shows failed attempts. Clear with <code>faillock --user username --reset</code>. (2) <strong>Account status</strong>: <code>passwd -S username</code> shows P (password set), L (locked), NP (no password). <code>chage -l username</code> shows password expiry. (3) <strong>Access restrictions</strong>: /etc/security/access.conf may block login by time, tty, or source host. (4) <strong>LDAP/SSSD</strong>: <code>sssctl user-checks username</code> or check /var/log/sssd/ if using directory services. (5) <strong>SELinux/AppArmor</strong>: check audit.log for AVC denials. The pam_unix failure is a symptom — the actual block may be in a subsequent pam_* module in the stack.'
        }
      ]
    },

    // ─────────────────────────────────────────────────────────────────────────
    // CATEGORY 5 — Networking (Ch 8-9)
    // Covers: ip command, netplan, NetworkManager, IPv4, subnetting,
    //         routing, DNS, connectivity testing.
    // ─────────────────────────────────────────────────────────────────────────
    {
      name: 'Networking',
      questions: [
        {
          value: 200,
          question: 'Which command shows all network interfaces with their current IP addresses on a modern Linux system?',
          options: [
            'ifconfig -a',
            'ip addr show',
            'netstat -i',
            'route -n'
          ],
          correct: 1,
          explanation: '<code>ip addr show</code> (or simply <code>ip a</code>) is the modern replacement for <code>ifconfig</code>. It displays all interfaces, their state (UP/DOWN/UNKNOWN), MAC address, IPv4 addresses with CIDR notation, IPv6 addresses, and flags. While <code>ifconfig -a</code> works on many systems, it is deprecated on modern Linux — the <code>net-tools</code> package that provides it is no longer maintained. The <code>ip</code> command from the <code>iproute2</code> package is the current standard.'
        },
        {
          value: 400,
          question: 'A server at 192.168.10.50/24 cannot reach 192.168.20.100. The default gateway is 192.168.10.1. What is the most systematic first step to diagnose the issue?',
